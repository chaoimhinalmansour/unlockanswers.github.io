<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | UNLOCK</title>
  <link rel="stylesheet" href="assets/theme.css?v=20261119-tcd-1">
  <link rel="stylesheet" href="assets/portal.css?v=20261120-portrait-shading">
  <script defer src="practice/students.js?v=20261120-portraits"></script>
  <script defer src="assets/session.js?v=20261120-session"></script>
  <script defer src="assets/portal.js?v=20261120-portrait-shading"></script>
</head>
<body>
  <header class="portal-header" hidden>
    <div class="portal-bar">
      <a class="portal-brand" href="index.html">UNLOCK <span>学习平台</span></a>
      <div id="portal-account" class="portal-account" hidden>
        <strong id="account-name"></strong>
        <button type="button" class="text-button" id="portal-sign-out">退出登录</button>
      </div>
    </div>
  </header>
  <main class="portal-main">
    <section id="login" aria-labelledby="login-title" hidden>
      <form id="login-form">
        <div class="login-entry">
          <h1 id="login-title">UNLOCK<span class="visually-hidden"> 登录</span></h1>
          <div class="login-strip">
            <label for="login-password" class="visually-hidden">密码</label>
            <input id="login-password" name="password" type="password" required autocomplete="current-password"
              placeholder="请输入密码" autocapitalize="none" spellcheck="false" aria-describedby="login-message">
            <button class="login-submit" type="submit">登录</button>
          </div>
          <p id="login-message" class="login-message" role="status"></p>
        </div>
        <fieldset class="portrait-stage">
          <legend class="visually-hidden">选择学生人物</legend>
          <canvas id="portrait-shading" class="portrait-shading" width="1536" height="504" aria-hidden="true"></canvas>
          <div id="student-portraits" class="portrait-options"></div>
        </fieldset>
      </form>
    </section>
    <section id="workspace" class="workspace-home" aria-labelledby="workspace-title" hidden>
      <h1 id="workspace-title"></h1>
      <p id="workspace-notice" class="workspace-notice" role="status" hidden></p>
      <nav id="workspace-cards" class="workspace-cards" aria-label="工作区功能"></nav>
    </section>
    <noscript><p>请启用 JavaScript 后登录学习平台。</p></noscript>
  </main>
</body>
</html>
