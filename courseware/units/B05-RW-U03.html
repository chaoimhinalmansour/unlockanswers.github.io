"pages":[[{"term":"fraud","pos":"(n)","definition":"the crime of getting money by deceiving people","example":"The bank warned customers about online fraud.","wordAudio":"fraud","cardWord":false},{"term":"surveillance","pos":"(n)","definition":"the act of watching a person or a place that may be involved in criminal activity","example":"The police placed the warehouse under surveillance.","wordAudio":"surveillance","cardWord":false},{"term":"think up","pos":"(phr v)","definition":"to produce a new idea or plan","example":"We need to think up a name for the school show.","wordAudio":"think up","cardWord":false},{"term":"watchdog","pos":"(n)","definition":"an organization responsible for making certain that companies obey laws and standards","example":"The consumer watchdog investigated several complaints.","wordAudio":"watchdog","cardWord":false},{"term":"rogue","pos":"(adj)","definition":"a person who behaves in an unexpected way, often causing damage","example":"A rogue employee tried to sell private customer records.","wordAudio":"rogue","cardWord":false},{"term":"violate","pos":"(v)","definition":"to act in a way that does not show respect for an important principle","example":"Publishing those details would violate the group's promise of privacy.","wordAudio":"violate","cardWord":false}]]}},{"id":"B05-RW-U03-classroom:video","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5a92b0e67c7f124b36e5bb3e7bea511f3b9efc2b56ad372ab508ba4e14e2c5d9.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/0f0eb159ff8bc374082458a6-L5RW-U03.mp4","captions":[{"start":0,"end":3.82,"text":"Your face, like your fingerprints or your DNA,"},{"start":4.24,"end":5.44,"text":"is unique to you."},{"start":6.62,"end":9,"text":"For developers of biometric technology,"},{"start":9.62,"end":14.24,"text":"the face is an easy -to -capture piece of data that can\nbe used to identify someone."},{"start":15.18,"end":16.02,"text":"As such,"},{"start":16.44,"end":20.4,"text":"facial recognition is one of the fastest -growing areas\nof biometrics."},{"start":21.4,"end":28.22,"text":"Both public and private organizations use facial\nrecognition to improve security and protect privacy."},{"start":29.22,"end":30.3,"text":"For example,"},{"start":30.74,"end":39,"text":"smartphones which use facial recognition instead of a\npassword can protect you from criminals who might steal\nyour password in a public place."},{"start":39.64,"end":41.74,"text":"When conducting financial transactions,"},{"start":42.44,"end":48.88,"text":"facial recognition is an additional layer of security\nthat is designed to prevent identity theft and fraud."},{"start":49.82,"end":50.84,"text":"In law enforcement,"},{"start":51.28,"end":54.64,"text":"it can identify suspects who have been caught on\ncamera."},{"start":55.2,"end":56.92,"text":"Linked to live surveillance,"},{"start":57.44,"end":60.58,"text":"it can identify people who may be threats to public\nsafety,"},{"start":61.26,"end":62.32,"text":"find missing persons,"},{"start":62.96,"end":64.72,"text":"or catch wanted criminals."},{"start":65.6,"end":66.86,"text":"In security systems,"},{"start":67.28,"end":72.06,"text":"it ensures that access to homes and other sensitive\nareas is restricted."},{"start":72.82,"end":80.26,"text":"And airports around the world have introduced facial\nrecognition systems to check that travelers are who\nthey say they are."},{"start":80.96000000000001,"end":85.22,"text":"New uses for facial recognition are being thought up\nall the time."},{"start":86.02,"end":90.22,"text":"Some have little to do with providing security or\nprotecting privacy."},{"start":91.24,"end":91.88,"text":"In gaming,"},{"start":92.2,"end":95.84,"text":"it's used to check ages and to grant games permissions."},{"start":97.42,"end":101.46000000000001,"text":"Some universities use facial recognition to take\nstudent registration."},{"start":102.82,"end":106.34,"text":"Healthcare providers are using it to link patients to\ntheir records."},{"start":107.25999999999999,"end":112.68,"text":"And companies are using it in stores to better target\nproducts at shoppers."},{"start":114.18,"end":121.78,"text":"But the widespread use of facial recognition has raised\nconcerns with human rights watchdogs and members of the\npublic."},{"start":122.76,"end":124.54,"text":"Some feel that this technology,"},{"start":125.18,"end":126.74,"text":"designed to provide our security,"},{"start":127.24,"end":129.36,"text":"is actually a threat to our privacy."},{"start":130.32,"end":137.56,"text":"Facial recognition technology often requires a large\ndatabase of images and other information to work."},{"start":138.3,"end":141.6,"text":"Opponents fear that these are open to dangerous abuses."},{"start":143.1,"end":150.3,"text":"A rogue employee at a government agency could misuse\nthe technology to track the movements of an innocent\nperson,"},{"start":150.92000000000002,"end":154.72,"text":"violating their right to privacy and presenting a\nsafety risk."},{"start":155.98,"end":159.64,"text":"Governments themselves would gain the power to track\nanyone,"},{"start":160.14,"end":160.54,"text":"anywhere,"},{"start":161.2,"end":163.66,"text":"and this could repress freedom within a nation."},{"start":165.07999999999998,"end":167.9,"text":"And large databases are targets for hackers."},{"start":169.44,"end":170.22,"text":"Once stolen,"},{"start":170.6,"end":175.54,"text":"the information can be shared with other criminals and\nused to steal identities,"},{"start":176.04,"end":177.84,"text":"disrupt services, and more."},{"start":179.2,"end":180.82,"text":"Another issue is consent."},{"start":181.38,"end":182.94,"text":"On our own smartphone,"},{"start":183.34,"end":185.84,"text":"we are in control of the use of the technology,"},{"start":186.24,"end":189.22,"text":"and we can decide whether or not we want to use it."},{"start":189.62,"end":195.12,"text":"But when photos and data are widely gathered without\nthe public's knowledge,"},{"start":195.64,"end":199.66,"text":"we lose control over how our information is being\nstored,"},{"start":200.06,"end":201.34,"text":"used, or shared."},{"start":202.74,"end":208.64,"text":"While some governments and businesses around the world\nare enthusiastically adopting the technology,"},{"start":209.28,"end":211.32,"text":"others are proceeding with caution."},{"start":212.52,"end":222.82,"text":"Many commentators believe that what is required now is\nregulation to effectively protect our privacy against\nthe threat facial recognition technology poses."}],"launchInline":true}},{"id":"B05-RW-U03-classroom:material:RW-M03","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[68],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","sourcePage":68},{"body":"2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","sourcePage":68},{"body":"3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","sourcePage":68},{"body":"4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for","sourcePage":68},{"body":"veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","sourcePage":68},{"body":"6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","sourcePage":68}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U03-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"CYBERCRIME IS ON THE RISE","pages":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png","width":772,"height":1040}],"source":68,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","sourcePage":68},{"body":"2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","sourcePage":68},{"body":"3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","sourcePage":68},{"body":"4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for","sourcePage":68},{"body":"veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","sourcePage":68},{"body":"6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","sourcePage":68}],"text":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for\nveterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/579b590333da5fb4bf32dd1f88581a7cadaeeeaf43380a3505a20525daa5b0b3.mp3"},"original":{"id":"B05-RW-U03-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U03","book":5,"track":"RW","unit":3,"title":"READING 1","kind":"material","pages":[68],"sourceImages":[{"page":68,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png","viewEvidenceReported":true}],"text":"# CYBERCRIME IS ON THE RISE\n\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8415"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/579b590333da5fb4bf32dd1f88581a7cadaeeeaf43380a3505a20525daa5b0b3.mp3","continueOnPage":true}},{"id":"B05-RW-U03-classroom:resource:b8425","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/edcf7f603b5f2d9870070147454f7c640228e40f106f236030edb7e8f18e99a9.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["accountable (adj) responsible\nassemble (v) gather in one place\ncombat (v) fight\neliminate (v) remove something","exhibit (v) show\nmalicious (adj) intended to harm or upset people\nprosecute (v) take to court to argue the guilt of\nregulate (v) control"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U03-classroom:material:RW-M04","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[72],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.","sourcePage":72},{"body":"2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.","sourcePage":72},{"body":"3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.","sourcePage":72},{"body":"4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.","sourcePage":72},{"body":"5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.","sourcePage":72},{"body":"6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","sourcePage":72}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U03-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":72,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png","width":772,"height":1040}],"source":72,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.","sourcePage":72},{"body":"2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.","sourcePage":72},{"body":"3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.","sourcePage":72},{"body":"4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.","sourcePage":72},{"body":"5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.","sourcePage":72},{"body":"6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","sourcePage":72}],"text":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.\n2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.\n3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.\n4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.\n5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.\n6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/06960a157888d35707b374a681dea5aba83ec791c20de2c5b05ce36c6e9da67d.mp3"},"original":{"id":"B05-RW-U03-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U03","book":5,"track":"RW","unit":3,"title":"READING 2","kind":"material","pages":[72],"sourceImages":[{"page":72,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png","viewEvidenceReported":true}],"text":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money ith strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U03-classroom:material:RW-M03":[{"body":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices","sourcePage":68,"blocks":[{"kind":"text","text":"# CYBERCRIME IS ON THE RISE"},{"kind":"text","text":"1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices"}]},{"body":"were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Vi r international laws are required to combat cybercrime.","type":"review/closed","options":[]},{"kind":"item","label":"2a","id":"b8459.review2a","prompt":"It ____ cybercrime is most common among people aged 20–39.","type":"review/closed","options":[]},{"kind":"item","label":"2b","id":"b8459.review2b","prompt":"Cybercrime ____ most common among people aged 20–39.","type":"review/closed","options":[]},{"kind":"item","label":"3","id":"b8459.review3","prompt":"It ____ websites collect our personal data for advertising purposes.","type":"review/closed","options":[]}]],"itemPatches":{"b8459.review1":{"options":[]},"b8459.review2a":{"options":[]},"b8459.review2b":{"options":[]},"b8459.review3":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B05-RW-U03":{"aspect":1.7777778,"cues":[[0,3.82,"Your face, like your fingerprints or your DNA,","你的脸，像你的指纹或你的DNA，"],[4.24,5.44,"is unique to you.","这是你独有的。"],[6.62,9,"For developers of biometric technology,","对于生物鉴别技术的开发者，"],[9.62,14.24,"the face is an easy -to -capture piece of data that can be used to identify someone.","面部是一块易于捕捉的数据，可以用来识别某人。"],[15.18,16.02,"As such,","因此，"],[16.44,20.4,"facial recognition is one of the fastest -growing areas of biometrics.","面部识别是生物特征学发展最快的领域之一。"],[21.4,28.22,"Both public and private organizations use facial recognition to improve security and protect privacy.","公共和私人组织都利用面部识别来改善安全，保护隐私。"],[29.22,30.3,"For example,","举例来说，"],[30.74,39,"smartphones which use facial recognition instead of a password can protect you from criminals who might steal your password in a public place.","使用面部识别而不是密码的智能手机可以保护你免受罪犯的伤害，他们可能在公共场所窃取你的密码。"],[39.64,41.74,"When conducting financial transactions,","在进行金融交易时，"],[42.44,48.88,"facial recognition is an additional layer of security that is designed to prevent identity theft and fraud.","面部识别是另外一层安全，旨在防止身份盗窃和欺诈。"],[49.82,50.84,"In law enforcement,","在执法方面，"],[51.28,54.64,"it can identify suspects who have been caught on camera.","它可以识别被摄像头抓到的嫌疑人"],[55.2,56.92,"Linked to live surveillance,","链接到现场监控，"],[57.44,60.58,"it can identify people who may be threats to public safety,","它可以识别那些可能对公共安全构成威胁的人，"],[61.26,62.32,"find missing persons,","找到失踪人员，"],[62.96,64.72,"or catch wanted criminals.","或抓捕通缉犯"],[65.6,66.86,"In security systems,","在安全系统中，"],[67.28,72.06,"it ensures that access to homes and other sensitive areas is restricted.","它确保限制进入住宅和其他敏感地区。"],[72.82,80.26,"And airports around the world have introduced facial recognition systems to check that travelers are who they say they are.","世界各地的机场都引入了面部识别系统来检查旅行者是谁"],[80.96000000000001,85.22,"New uses for facial recognition are being thought up all the time.","面部识别的新用途一直被考虑。"],[86.02,90.22,"Some have little to do with providing security or protecting privacy.","一些人与提供安全或保护隐私没有多大关系。"],[91.24,91.88,"In gaming,","在游戏中，"],[92.2,95.84,"it's used to check ages and to grant games permissions.","它用来检查年龄和给予游戏权限。"],[97.42,101.46000000000001,"Some universities use facial recognition to take student registration.","一些大学使用面部识别来进行学生注册。"],[102.82,106.34,"Healthcare providers are using it to link patients to their records.","保健提供者正在利用它来将病人与他们的记录联系起来。"],[107.25999999999999,112.68,"And companies are using it in stores to better target products at shoppers.","公司在商店里用它来更好地瞄准购物者的产品。"],[114.18,121.78,"But the widespread use of facial recognition has raised concerns with human rights watchdogs and members of the public.","但面部识别的广泛使用引起了人权监督者和公众的关注。"],[122.76,124.54,"Some feel that this technology,","有些人觉得这种技术，"],[125.18,126.74,"designed to provide our security,","是为了保护我们的安全"],[127.24,129.36,"is actually a threat to our privacy.","实际上是对我们隐私的威胁"],[130.32,137.56,"Facial recognition technology often requires a large database of images and other information to work.","面部识别技术往往需要一个大型的图像和其他信息数据库才能发挥作用。"],[138.3,141.6,"Opponents fear that these are open to dangerous abuses.","反对者担心，他们可能会受到危险的虐待。"],[143.1,150.3,"A rogue employee at a government agency could misuse the technology to track the movements of an innocent person,","一个政府机构的无赖雇员可能滥用技术来跟踪无辜者的行动，"],[150.92000000000002,154.72,"violating their right to privacy and presenting a safety risk.","侵犯他们的隐私权，并构成安全风险。"],[155.98,159.64,"Governments themselves would gain the power to track anyone,","政府本身将获得追踪任何人的权力，"],[160.14,160.54,"anywhere,","随处可见，"],[161.2,163.66,"and this could repress freedom within a nation.","这可以压制一个国家内部的自由。"],[165.07999999999998,167.9,"And large databases are targets for hackers.","而大型数据库是黑客的目标。"],[169.44,170.22,"Once stolen,","被偷过之后"],[170.6,175.54,"the information can be shared with other criminals and used to steal identities,","信息可以与其他罪犯分享，并用来窃取身份，"],[176.04,177.84,"disrupt services, and more.","干扰服务，还有更多。"],[179.2,180.82,"Another issue is consent.","另一个问题是同意。"],[181.38,182.94,"On our own smartphone,","在我们自己的智能手机上，"],[183.34,185.84,"we are in control of the use of the technology,","我们控制了技术的使用，"],[186.24,189.22,"and we can decide whether or not we want to use it.","我们可以决定我们是否想要使用它。"],[189.62,195.12,"But when photos and data are widely gathered without the public's knowledge,","但当照片和数据在公众不知情的情况下被广泛收集时，"],[195.64,199.66,"we lose control over how our information is being stored,","我们无法控制我们的信息是如何被存储的，"],[200.06,201.34,"used, or shared.","使用，或共享。"],[202.74,208.64,"While some governments and businesses around the world are enthusiastically adopting the technology,","虽然世界上一些政府和企业热衷于采用这种技术，"],[209.28,211.32,"others are proceeding with caution.","其他人正在谨慎行事。"],[212.52,222.82,"Many commentators believe that what is required now is regulation to effectively protect our privacy against the threat facial recognition technology poses.","许多评论家认为，现在需要的是监管，以有效保护我们的隐私免受面部识别技术带来的威胁。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B05-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bca4b38a5788ec6ada449ac84df843375dac881fc02b042173e99ae3b588622.pdf","size":27488549}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33},"B01-LS/36":{"pdf":34},"B01- async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;

function outside(el,bounds){

 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
