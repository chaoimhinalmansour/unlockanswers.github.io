options":[],"type":"discuss/open"},{"kind":"item","id":"b8397.i02","label":"2","prompt":"How might facial recognition technology be misused?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Facial recognition technology is used on\ncollege campuses to identify students. It\nis also used to monitor people in public\nplaces, to search for wanted criminals\nand to identify people in airports to\nconfirm they are who they say they are.\n2 If hackers stole information from a\nfacial recognition database, they would\nbe able to steal private and financial\ninformation. It could also be used to\nfollow an innocent person from place to\nplace with the intention of harming them.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8400","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Put a tick in the box next to the topics that are discussed.","pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5a92b0e67c7f124b36e5bb3e7bea511f3b9efc2b56ad372ab508ba4e14e2c5d9.png"],"provided":"","items":[{"id":"b8400.i01","label":"1","prompt":"Watch the video. Put a tick in the box next to the topics that are discussed.","options":["how facial recognition technology works","uses related to security and privacy","accuracy of facial recognition technology","the future of facial recognition technology"],"type":"choice/closed"},{"id":"b8400.i02","label":"2","prompt":"uses related to security and privacy","options":["Discussed","Not discussed"],"type":"choice/closed"},{"id":"b8400.i03","label":"3","prompt":"accuracy of facial recognition technology","options":["Discussed","Not discussed"],"type":"choice/closed"},{"id":"b8400.i04","label":"4","prompt":"the future of facial recognition technology","options":["Discussed","Not discussed"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8400.i01","label":"1","prompt":"Watch the video. Put a tick in the box next to the topics that are discussed.","options":["how facial recognition technology works","uses related to security and privacy","accuracy of facial recognition technology","the future of facial recognition technology"],"type":"choice/closed"},{"kind":"item","id":"b8400.i02","label":"2","prompt":"uses related to security and privacy","options":["Discussed","Not discussed"],"type":"choice/closed"},{"kind":"item","id":"b8400.i03","label":"3","prompt":"accuracy of facial recognition technology","options":["Discussed","Not discussed"],"type":"choice/closed"}],[{"kind":"item","id":"b8400.i04","label":"4","prompt":"the future of facial recognition technology","options":["Discussed","Not discussed"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/0f0eb159ff8bc374082458a6-L5RW-U03.mp4","captions":[{"start":0,"end":3.82,"text":"Your face, like your fingerprints or your DNA,"},{"start":4.24,"end":5.44,"text":"is unique to you."},{"start":6.62,"end":9,"text":"For developers of biometric technology,"},{"start":9.62,"end":14.24,"text":"the face is an easy -to -capture piece of data that can\nbe used to identify someone."},{"start":15.18,"end":16.02,"text":"As such,"},{"start":16.44,"end":20.4,"text":"facial recognition is one of the fastest -growing areas\nof biometrics."},{"start":21.4,"end":28.22,"text":"Both public and private organizations use facial\nrecognition to improve security and protect privacy."},{"start":29.22,"end":30.3,"text":"For example,"},{"start":30.74,"end":39,"text":"smartphones which use facial recognition instead of a\npassword can protect you from criminals who might steal\nyour password in a public place."},{"start":39.64,"end":41.74,"text":"When conducting financial transactions,"},{"start":42.44,"end":48.88,"text":"facial recognition is an additional layer of security\nthat is designed to prevent identity theft and fraud."},{"start":49.82,"end":50.84,"text":"In law enforcement,"},{"start":51.28,"end":54.64,"text":"it can identify suspects who have been caught on\ncamera."},{"start":55.2,"end":56.92,"text":"Linked to live surveillance,"},{"start":57.44,"end":60.58,"text":"it can identify people who may be threats to public\nsafety,"},{"start":61.26,"end":62.32,"text":"find missing persons,"},{"start":62.96,"end":64.72,"text":"or catch wanted criminals."},{"start":65.6,"end":66.86,"text":"In security systems,"},{"start":67.28,"end":72.06,"text":"it ensures that access to homes and other sensitive\nareas is restricted."},{"start":72.82,"end":80.26,"text":"And airports around the world have introduced facial\nrecognition systems to check that travelers are who\nthey say they are."},{"start":80.96000000000001,"end":85.22,"text":"New uses for facial recognition are being thought up\nall the time."},{"start":86.02,"end":90.22,"text":"Some have little to do with providing security or\nprotecting privacy."},{"start":91.24,"end":91.88,"text":"In gaming,"},{"start":92.2,"end":95.84,"text":"it's used to check ages and to grant games permissions."},{"start":97.42,"end":101.46000000000001,"text":"Some universities use facial recognition to take\nstudent registration."},{"start":102.82,"end":106.34,"text":"Healthcare providers are using it to link patients to\ntheir records."},{"start":107.25999999999999,"end":112.68,"text":"And companies are using it in stores to better target\nproducts at shoppers."},{"start":114.18,"end":121.78,"text":"But the widespread use of facial recognition has raised\nconcerns with human rights watchdogs and members of the\npublic."},{"start":122.76,"end":124.54,"text":"Some feel that this technology,"},{"start":125.18,"end":126.74,"text":"designed to provide our security,"},{"start":127.24,"end":129.36,"text":"is actually a threat to our privacy."},{"start":130.32,"end":137.56,"text":"Facial recognition technology often requires a large\ndatabase of images and other information to work."},{"start":138.3,"end":141.6,"text":"Opponents fear that these are open to dangerous abuses."},{"start":143.1,"end":150.3,"text":"A rogue employee at a government agency could misuse\nthe technology to track the movements of an innocent\nperson,"},{"start":150.92000000000002,"end":154.72,"text":"violating their right to privacy and presenting a\nsafety risk."},{"start":155.98,"end":159.64,"text":"Governments themselves would gain the power to track\nanyone,"},{"start":160.14,"end":160.54,"text":"anywhere,"},{"start":161.2,"end":163.66,"text":"and this could repress freedom within a nation."},{"start":165.07999999999998,"end":167.9,"text":"And large databases are targets for hackers."},{"start":169.44,"end":170.22,"text":"Once stolen,"},{"start":170.6,"end":175.54,"text":"the information can be shared with other criminals and\nused to steal identities,"},{"start":176.04,"end":177.84,"text":"disrupt services, and more."},{"start":179.2,"end":180.82,"text":"Another issue is consent."},{"start":181.38,"end":182.94,"text":"On our own smartphone,"},{"start":183.34,"end":185.84,"text":"we are in control of the use of the technology,"},{"start":186.24,"end":189.22,"text":"and we can decide whether or not we want to use it."},{"start":189.62,"end":195.12,"text":"But when photos and data are widely gathered without\nthe public's knowledge,"},{"start":195.64,"end":199.66,"text":"we lose control over how our information is being\nstored,"},{"start":200.06,"end":201.34,"text":"used, or shared."},{"start":202.74,"end":208.64,"text":"While some governments and businesses around the world\nare enthusiastically adopting the technology,"},{"start":209.28,"end":211.32,"text":"others are proceeding with caution."},{"start":212.52,"end":222.82,"text":"Many commentators believe that what is required now is\nregulation to effectively protect our privacy against\nthe threat facial recognition technology poses."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"uses related to security and privacy\nthe future of facial recognition technology","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":34,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8402","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Take notes on five uses for facial recognition technology.","pages":[65],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6bc798a es a person incorrectly?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I am in favour of the widespread use of\nfacial recognition technology. It makes\nit much more difficult for cybercriminals\nto steal personal information, and it\nassists law enforcement in keeping our\ncommunities safe.\nI am opposed to the widespread use of\nfacial recognition technology. For every\nadvance in technology, criminals figure\nout how to use it for their own gain. This\nis a powerful tool that criminals could\nturn against us.\n2 If law enforcement uses it to find wanted\ncriminals, an innocent person could end\nup being arrested and sent to prison.\nIf it is used in healthcare, a wrong\nidentification could lead to a mix-up\nin health records and put a patient’s\nhealth at risk.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8407","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the sentences and choose the best synonym for the words in bold.","pages":[66],"sourceImages":["https://raw.githubusercontent.com/ch com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8abf60c19f67324c6e85432d83d42965b3da24172514994c553bd844db41aca3.png"],"provided":"cybercrime (n) criminal activities that are done using computers or the internet","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"cybercrime (n) criminal activities that are done using computers or the internet"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Different types of cybercrime include\nstealing someone’s credit card or bank\naccount information, harassing someone\nonline, and sending emails that convince\ninternet users to go to fake websites.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8410","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Work with a partner. Preview the article on page 68 by reading the first sentence in each paragraph. Answer the questions below.","pages":[67],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e2fb2c8dff5111a540662bfc1952f8972396e7bb502571d3173253b104e49bb.png"],"provided":"","items":[{"id":"b8410.i01","label":"1","prompt":"What are the three types of cybercrime described in the article?","options":[],"type":"qa/open"},{"id":"b8410.i02","label":"2","prompt":"What circumstances lead to an increase in fraudulent online activity?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8410.i01","label":"1","prompt":"What are the three types of cybercrime described in the article?","options":[],"type":"qa/open"},{"kind":"item","id":"b8410.i02","label":"2","prompt":"What circumstances lead to an increase in fraudulent online activity?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B05-RW-U03-publisher-page:p068","title":"原题或核对备注所引第68页","pages":[68],"text":"","screens":[],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  e-commerce fraud, identity theft, charity\norganization fraud\n2  Doing more things online can lead to an increase in\nfraudulent online activity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8412","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article and circle the sentence that expresses the main idea.","pages":[67],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e2fb2c8dff5111a540662bfc1952f8972396e7bb502571d3173253b104e49bb.png"],"provided":"","items":[{"id":"b8412.i01","label":"1","prompt":"Which sentence expresses the main idea of the article?","options":["When it comes to e-commerce fraud, food-related internet scams are especially on the rise.","People are hesitant to spend money online because of internet fraud.","Internet fraud is a growing problem that can happen to anyone with an online presence."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8412.i01","label":"1","prompt":"Which sentence expresses the main idea of the article?","options":["When it comes to e-commerce fraud, food-related internet scams are especially on the rise.","People are hesitant to spend money online because of internet fraud.","Internet fraud is a growing problem that can happen to anyone with an online presence."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for\nveterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","screens":["# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for","veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions."],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257ef "Stress and anxiety are common side effects of identity theft.","options":["main idea","details"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"main idea","header":false,"colspan":1,"rowspan":1},{"text":"details","header":false,"colspan":1,"rowspan":1}],[{"text":"1 Thieves take advantage of natural disasters to commit fraud.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"2 Thieves may use a victim's personal information to access their bank account.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"3 Phishing emails may lead people to fake websites asking for money.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"4 A seller promises to deliver a product and then disappears.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"5 Identity theft leads to serious consequences for victims.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"6 Over £30 billion was lost to e-commerce fraud in 2022.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"table","rows":[[{"text":"7 Governments may warn the public about possible scams.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"8 E-commerce fraud is a common type of internet fraud.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}],[{"text":"9 Stress and anxiety are common side effects of identity theft.","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1},{"text":"□","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[{"id":"B05-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for\nveterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","screens":["# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make p nd":"item","id":"b8417.i04","label":"3","prompt":"Skim read the article. Find words and phrases that support your ideas about the writer's perspective and highlight or circle them.","options":[],"type":"choice/open"}]],"courseMaterials":[{"id":"B05-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for\nveterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% in le: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for","veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions."],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/579b590333da5fb4bf32dd1f88581a7cadaeeeaf43380a3505a20525daa5b0b3.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Internet users are advised to be on the\nlookout for ransomware, which is software\nthat is made especially for the purpose of\ntaking over computer data that belongs to\na person or company. The criminals send\nthe damaging software, or malware, to a\nuser via an email that appears legitimate.\nUsers click on the links provided in the\nemail and the cybercriminals are then\nable to take over, preventing a person\nor business from accessing their own\ncomputer files. The criminal will demand\nsome sort of payment before releasing the\nlock they have placed on the user’s data. To\navoid this malicious activity, internet users\nshould always confirm that any email they\nopen or link they click on is legitimate.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"course "text","text":"behaviour confidence consequences"},{"kind":"text","text":"pain a reputation responsibility"},{"kind":"item","id":"b8442.i01","label":"1","prompt":"If someone commits an illegal act, they should expect to ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b8442.i02","label":"2","prompt":"After she lost her money to an e-commerce scam, she ____ in making online purchases.","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8442.i03","label":"3","prompt":"While cybercriminals should be punished, consumers should also ____ ____ for keeping their sensitive data safe.","options":[],"type":"gap/open"},{"kind":"item","id":"b8442.i04","label":"4","prompt":"The man on the phone ____ such odd ____ that I didn't want to give him any personal information.","options":[],"type":"gap/open"},{"kind":"item","id":"b8442.i05","label":"5","prompt":"When people are taken advantage of online, they often ____ ____ that goes beyond financial loss.","options":[],"type":"gap/open"},{"kind":"item","id":"b8442.i06","label":"6","prompt":"You should only donate to organizations that have ____ for helping people in need.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  face (the) consequences / suffer (the) consequences /\ntake responsibility\n2 lost confidence\n3 take responsibility\n4 exhibited ... behaviour\n5 suffer pain\n6 built a reputation","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8443","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Discuss the questions. Choose collocations from the box to describe online fraud.","pages":[74],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/74f0b66a29b5d6400f13d5d78dfcfb757897dc561490bef2e857fa28a198685c.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>abhorrent, disturbing, deceptive, fraudulent, hostile, malicious, offensive\u003c/td>\u003ctd>behaviour, activity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>devastating\u003c/td>\u003ctd>consequences\u003c/td>\u003c/tr>\u003ctr>\u003ctd>legitimate\u003c/td>\u003ctd>business, reason, website\u003c/td>\u003c/tr>\u003c/table>\n1 What should consumers look for before they make a purchase or donate money online?\n2 Describe e-commerce fraud in your own words.\n3 How might a consumer be persuaded to give money to a fake business?","items":[{"id":"b8443.i01","label":"1","prompt":"What should consumers look for before they make a purchase or donate money online?","options":[],"type":"discuss/open"},{"id":"b8443.i02","label":"2","prompt":"Describe e-commerce fraud in your own words.","options":[],"type":"discuss/open"},{"id":"b8443.i03","label":"3","prompt":"How might a consumer be persuaded to give money to a fake business?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"abhorrent, disturbing, deceptive, fraudulent, hostile, malicious, offensive","header":false,"colspan":1,"rowspan":1},{"text":"behaviour, activity","header":false,"colspan":1,"rowspan":1}],[{"text":"devastating","header":false,"colspan":1,"rowspan":1},{"text":"consequences","header":false,"colspan":1,"rowspan":1}],[{"text":"legitimate","header":false,"colspan":1,"rowspan":1},{"text":"business, reason, website","header":false,"colspan":1,"rowspan":1}]]},{"kind":"text","text":"1 What should consumers look for before they make a purchase or donate money online?"},{"kind":"text","text":"2 Describe e-commerce fraud in your own words."}],[{"kind":"text","text":"3 How might a consumer be persuaded to give money to a fake business?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Before making a purchase or donating\nmoney online, consumers should make\nsure they are dealing with a legitimate\nbusiness. They should read reviews of\nthe business and look for any evidence\nof deceptive activity.\n2 E-commerce fraud is a malicious activity\nthat takes place when online consumers\ndo not receive merchandise they have\npaid for. This offensive behaviour can\nhave devastating consequences. Victims\ncan lose a lot of money. They may also\nlose trust in online shopping, even if\nthey are using legitimate websites.\n3 A consumer might receive an email that\nconvinces them to purchase something\nor donate money to a business that\nturns out to be fake. When criminals\ncommit crimes like this, they often\ntarget vulnerable members of society.\nThis abhorrent behaviour often means\npeople such as the elderly suffer\ndevastating consequences.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8446","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"PROBLEM-SOLUTION COLLOCATIONS"},"instruction":"Complete each sentence with either one verb (in the correct form) or one noun from the Explanation box. In some items, more than one answer is possible.","pages":[75],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5ccf2a3c43d70e68be0a27dc587a0ca2d8bf5e6dc291eb9fbfab5e36cb1bd05f.png"],"provided":"","items":[{"id":"b8446.i01","label":"1","prompt":"As long as people interact online, cyber fraud ____ a threat to us all.","options":[],"type":"gap/open"},{"id":"b8446.i02","label":"2","prompt":"If you use your credit card on an unsecured website, you might ____ trouble with online fraud.","options":[],"type":"gap/open"},{"id":"b8446.i03","label":"3","prompt":"While it's difficult to eliminate ____ of computer viruses, it's possible to take steps to protect your devices from them.","options":[],"type":"gap/open"},{"id":"b8446.i04","label":"4","prompt":"It's time to ____ an issue no one wants to talk about: children are often victims of identity theft.","options":[],"type":"gap/open"},{"id":"b8446.i05","label":"5","prompt":"They attended a technology conference that was all about ____ the danger of the elderly being cheated in online scams.","options":[],"type":"gap/open"},{"id":"b8446.i06","label":"6","prompt":"Can you ____ a problem for me? I clicked on a link that led to a website with malware.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8446.i01","label":"1","prompt":"As long as people interact online, cyber fraud ____ a threat to us all.","options":[],"type":"gap/open","answer":{"label":"1","mode":"gap","answer":"poses/presents/represents"}},{"kind":"item","id":"b84 8445"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"If someone can’t finish their homework on\ntime, it’s likely that they have to face the\nproblem of time management. A lot of\ncollege students have trouble managing\ntheir time and, unfortunately, many do not\naddress the issue at all. One way to face\nthe problem is by writing down everything\nyou do in a day and how much time you\nspend doing it. You might find that you\nare spending too much time watching\ntelevision or simply not doing anything\nproductive. Continue doing this for at\nleast one week. Just being aware of how\nyou spend your time might be enough to\nresolve the issue.\nThe fact that social media collects personal\ndata poses a threat to all account holders.\nWhen a social media site obtains your\ninformation, they may sell it to other\nbusinesses. This results in a loss of control\nover who has access to your personal\ndetails. Because your information is being\nshared, you might run into trouble like\nreceiving fraudulent emails from criminals\nwishing to steal from you. One way to\nrespond to this issue is to make sure you\nare using privacy apps on your mobile\nphone and other personal devices.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8424","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":21,"module":"READING 2","ex":"1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read an essay about possible solutions to cybercrime. Work with a partner. Discuss the questions.","pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/edcf7f603b5f2d9870070147454f7c640228e40f106f236030edb7e8f18e99a9.png"],"provided":"","items":[{"id":"b8424.i01","label":"1","prompt":"Why, do you think, has cybercrime increased in recent years?","options":[],"type":"discuss/open"},{"id":"b8424.i02","label":"2","prompt":"What can individuals do to protect themselves against cybercrime?","options":[],"type":"discuss/open"},{"id":"b8424.i03","label":"3","prompt":"Given that the internet is global, who is responsible for preventing cybercrime?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8424.i01","label":"1","prompt":"Why, do you think, has cybercrime increased in recent years?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8424.i02","label":"2","prompt":"What can individuals do to protect themselves against cybercrime?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8424.i03","label":"3","prompt":"Given that the internet is global, who is responsible for preventing cybercrime?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 One reason cybercrime has increased\nin recent years is because criminals\nrealize there are many opportunities for\ntaking advantage of people online. It\nis also easier to be anonymous online,\nso criminals have less of a chance of\nbeing caught.\n2 Something people can do to protect\ntheir online privacy is to set aside one or\ntwo days each month and check to make\nsure all of their passwords and browsers\nare up to date. They could also use this\ntime to make sure there hasn’t been\nany suspicious activity on any of their\nfinancial accounts.\n3 Because everyone is online, everyone is\nresponsible in some part for preventing\ncybercrime. Individuals should make\nsure their personal information remains\nsafe, businesses should make sure they\nhave a secure way for consumers to pay,\nand governments should make strict\nlaws against all cybercrimes and then\npunish those who break the laws.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8426","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":22,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Work with a partner. Cover the definitions and discuss which words you know and don't know. Then, use the correct form of the words in bold to complete the sentences (1–8).","pages":[70,71],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/edcf7f603b5f2d9870070147454f  increasingly important that we ____ cybercrime that is aimed at vulnerable people such as children and the elderly.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"6 There is no single law that ____ online privacy, so it's difficult to understand exactly what personal information businesses should have access to."},{"kind":"text","text":"7 He finally called the police after receiving several ____ emails that demanded he send money to an anonymous bank account."},{"kind":"text","text":"8 It is increasingly important that we ____ cybercrime that is aimed at vulnerable people such as children and the elderly."}],[{"kind":"item","id":"b8426.i01","label":"1","prompt":"If young people spend too much time on the internet, they often begin to ____ signs of anxiety.","options":[{"optionLabel":"accountable","optionEn":"accountable"},{"optionLabel":"assemble","optionEn":"assemble"},{"optionLabel":"combat","optionEn":"combat"},{"optionLabel":"eliminate","optionEn":"eliminate"},{"optionLabel":"exhibit","optionEn":"exhibit"},{"optionLabel":"malicious","optionEn":"malicious"},{"optionLabel":"prosecute","optionEn":"prosecute"},{"optionLabel":"regulate","optionEn":"regulate"}],"type":"discuss/open"},{"kind":"item","id":"b8426.i02","label":"2","prompt":"After he was ____ and found guilty, he was sentenced to 25 years in prison.","options":[{"optionLabel":"accountable","optionEn":"accountable"},{"optionLabel":"assemble","optionEn":"assemble"},{"optionLabel":"combat","optionEn":"combat"},{"optionLabel":"eliminate","optionEn":"eliminate"},{"optionLabel":"exhibit","optionEn":"exhibit"},{"optionLabel":"malicious","optionEn":"malicious"},{"optionLabel":"prosecute","optionEn":"prosecute"},{"optionLabel":"regulate","optionEn":"regulate"}],"type":"discuss/open"}],[{"kind":"item","id":"b8426.i03","label":"3","prompt":"They announced their plan to ____ a team of international online safety experts.","options":[{"optionLabel":"accountable","optionEn":"accountable"},{"optionLabel":"assemble","optionEn":"assemble"},{"optionLabel":"combat","optionEn":"combat"},{"optionLabel":"eliminate","optionEn":"eliminate"},{"optionLabel":"exhibit","optionEn":"exhibit"},{"optionLabel":"malicious","optionEn":"malicious"},{"optionLabel":"prosecute","optionEn":"prosecute"},{"optionLabel":"regulate","optionEn":"regulate"}],"type":"discuss/open"},{"kind":"item","id":"b8426.i04","label":"4","prompt":"Cyber harassment may never be ____ altogether, but there are steps parents can take to protect their children against it.","options":[{"optionLabel":"accountable","optionEn":"accountable"},{"optionLabel":"assemble","optionEn":"assemble"},{"optionLabel":"combat","optionEn":"combat"},{"optionLabel":"eliminate","optionEn":"eliminate"},{"optionLabel":"exhibit","optionEn":"exhibit"},{"optionLabel":"malicious","optionEn":"malicious"},{"optionLabel":"prosecute","optionEn":"prosecute"},{"optionLabel":"regulate","optionEn":"regulate"}],"type":"discuss/open"}],[{"kind":"item","id":"b8426.i05","label":"5","prompt":"Online businesses with poor cybersecurity should be held ____ if thieves break into their database and steal consumer data.","options":[{"optionLabel":"accountable","optionEn":"accountable"},{"optionLabel":"assemble","optionEn":"assemble"},{"optionLabel":"combat","optionEn":"combat"},{"optionLabel":"eliminate","optionEn":"eliminate"},{"optionLabel":"exhibit","optionEn":"exhibit"},{"optionLabel":"malicious","optionEn":"malicious"},{"optionLabel":"prosecute","optionEn":"prosecute"},{"optionLabel":"regulate","optionEn":"regulate"}],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 exhibit 2 prosecuted 3 assemble 4 eliminated\n5 accountable 6 regulates 7 malicious 8 combat","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8431","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":23,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the article on page 72. Circle the correct answers.","pages":[71],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/529dc5cdd0cdd649b19e8ef35ae0c2d2ba78013be8d76474f12cc08d9c1724e8.png"],"provided":"","items":[{"id":"b8431.i01","label":"1","prompt":"Dealing with cybercrime","options":["has gotten easier as technology advances.","is not taken seriously enough by law enforcement.","has recently become a high priority for law enforcement."],"type":"choice/closed"},{"id":"b8431.i02","label":"2","prompt":"Consumers must take a lot of responsibility for","options":["reporting cybercrime to the police.","learning the identity of online thieves.","keeping their own sensitive data safe."],"type":"choice/closed"},{"id":"b8431.i03","label":"3","prompt":"To combat cybercrime,","options":["each nation should create strict laws for prosecuting criminals.","international law enforcement agencies should work together.","Internet users should limit the time they spend online."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8431.i01","label":"1","prompt":"Dealing with cybercrime","options":["has gotten easier as technology advances.","is not taken seriously enough by law enforcement.","has recently become a high priority for law enforcement."],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":1}},{"kind":"item","id":"b8431.i02","label":"2","prompt":"Consumers must take a lot of responsibility for","options":["reporting cybercrime to the police.","learning the identity of online thieves.","keeping their own sensitive data safe."],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":2}}],[{"kind":"item","id":"b8431.i03","label":"3","prompt":"To combat cybercrime,","options":["each nation should create strict laws for prosecuting criminals.","international law enforcement agencies should work together.","Internet users should limit the time they spend online."],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":1}}]],"courseMaterials":[{"id":"B05-RW-U03-classroom:material:RW-M04","title":"READING 2","text":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.\n2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.\n3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.\n4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.\n5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.\n6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","screens":["1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identica title":"READING 1","pages":[68],"text":"# CYBERCRIME IS ON THE RISE\n\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","screens":["# CYBERCRIME IS ON THE RISE","1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal en online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions."],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png"}],"kind":"material","sourceBlockIds":["b8415"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/06960a157888d35707b374a681dea5aba83ec791c20de2c5b05ce36c6e9da67d.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Keep the software and browsers up to date\non your personal devices.\nInspect unfamiliar websites carefully to\nmake sure they are legitimate.\nUse different usernames and passwords for\ndifferent accounts.\nExamine the reputation of charitable\norganizations before you donate.\nUse strong passwords and change them\nregularly.\nLimit the amount of personal information\nyou reveal online.\nParents should talk to their children about\nonline safety.\nMake sure you have a secure wi-fi network\nat home.\nDon’t use unsecured public wi-fi networks.\nDon’t click on unfamiliar or odd-looking\nlinks.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c36
