:"text","text":"identity theft (n) using someone's personal information in order to pretend to be them and to get money or goods in their name"},{"kind":"text","text":"phishing (n) pretending to be a trustworthy contact, such as a bank, and attempting to trick the victim into revealing information, such as bank details, over the internet"}]],"courseMaterials":[{"id":"B05-RW-U03-material:RW-M03","title":"READING 1","pages":[68],"text":"# CYBERCRIME IS ON THE RISE\n\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","screens":["# CYBERCRIME IS ON THE RISE","1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's","licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom,","reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.","5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions."],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png"}],"kind":"material","sourceBlockIds":["b8415"]},{"id":"B05-RW-U03-material:RW-M04","title":"READING 2","pages":[72],"text":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.\n\n2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.\n\n3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.\n\n4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.\n\n5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.\n\n6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","screens":["1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of","her pension after criminals created a fake website that looked identical to a well-known investment firm's website.","2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.","3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several","countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.","4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had","used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.","5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be","sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.","6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.","7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions."],"sources":[{"page":72,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png"}],"kind":"material","sourceBlockIds":["b8433"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Identity theft occurs when someone\nunlawfully obtains and uses another\nperson’s personal information, such as\ncredit card details, or other identifying data,\nto commit fraud or other crimes.\nIt is possible to control but not stop the\nstealing personal information. Improved\ncybersecurity, encryption, and personal\nvigilance can reduce risks, but breaches\nand data theft are still possible.\nIt is possible to control but not stop the\nuse of stolen information to commit fraud.\nMonitoring and alert systems can catch\nfraud early, but preventing all cases is\ndifficult.\nIt is possible to control but not stop the\nselling stolen identities. Law enforcement\nand monitoring web activities can deter\nsome criminals, but stopping all illegal sales\nis challenging.\nPhishing is a cyberattack where criminals\npose as legitimate organizations through\nemails or messages to steal sensitive\ninformation like passwords or credit card\ndetails.\nWhile anti-phishing tools and filters can\nreduce exposure, attackers still find ways\nto mimic trusted sources. Fraudulent\nmessages can be controlled with laws and\nfilters, but not fully stopped.\nEducating users can reduce the risk of\nsharing sensitive information, but human\nerror remains an issue. Strengthening\ncybersecurity and using advanced\nauthentication methods can significantly\nreduce system vulnerabilities and help stop\nthese attacks.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8453","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":28,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in pairs. Choose two of the behaviours you thought of in Exercise 1. Discuss the questions and make notes. Use the tables on page 77 to organize your notes.","pages":[76],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8f29aa746098eaaf0c74cbfccfb97f6272c68a2865aec8a842aea688a1ab396.png"],"provided":"1 What is the origin of the behaviour? Why do people behave this way? What technology allows people to behave this way?\n2 What are the consequences for victims of allowing this behaviour to continue? What are the consequences for internet users in general?","items":[],"layout":"list","references":[{"id":"B05-RW-U03-question:b8451","kind":"student-work","title":"CRITICAL THINKING Ex 1","pages":[76]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 What is the origin of the behaviour? Why do people behave this way? What technology allows people to behave this way?"},{"kind":"text","text":"2 What are the consequences for victims of allowing this behaviour to continue? What are the consequences for internet users in general?"}]],"courseMaterials":[{"id":"B05-RW-U03-publisher-page:p077","title":"原题或核对备注所引第77页","pages":[77],"text":"","screens":[],"sources":[{"page":77,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58ef488b5f52ffe1bbe133efc988f5a34319b4afaf7034f52e9ef0d1e5dbdc15.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Problem 1: Identity theft\norigins of and\nreasons for\nbehaviour\nconsequences:\nvictims\nconsequences:\ninternet users\n•  Identity theft\nhas existed for\na long time,\nbut it became\nmore prominent\nwith the rise of\ndigital records\nand electronic\ntransactions.\nThe internet\nand online\nbanking made\nit easier to steal\nand misuse\npersonal data.\n•  People do this\nfor financial\ngain, to open\nfraudulent\naccounts, or\nto avoid legal\nconsequences\nby assuming\nsomeone\nelse’s identity.\nCan face\nfinancial losses,\ndamage to\ntheir credit\nscore, legal\ncomplications,\nand emotional\nstress.\nRecovering\nfrom identity\ntheft is time-\nconsuming,\noften requiring\nthe victim\nto clear\ntheir name\nand dispute\nfraudulent\ncharges.\nIt undermines\ntrust in online\ntransactions,\nincreases\ncybersecurity\ncosts for\nbusinesses and\nindividuals,\nand leads to\nmore rigorous\nverification\nprocesses. It can\nresult in higher\nprices for goods\nand services as\nbusinesses pass\non the costs of\nfraud prevention\nto consumers.\nProblem 2: Phishing\norigins of and\nreasons for\nbehaviour\nconsequences:\nvictims\nconsequences:\ninternet users\n•  Phishing started in\nthe earliest days\nof the internet\nwhen attackers\nused fake emails\nand websites\nto steal user’s\ncredentials. The\nterm “phishing”\ncomes from\n“fishing,” as\nattackers trick or\n‘bait’ victims into\nrevealing sensitive\ninformation.\n•  People engage\nin phishing to\nexploit others for\nfinancial gain,\npersonal data, or\naccess to valuable\nresources. Email,\nmessaging\nsystems,\ncombined with the\nanonymity of the\ninternet, enable\nphishing attacks.\nCan include\nfinancial loss,\nidentity theft,\ndamaged\ncredit, and\ncompromised\npersonal\naccounts.\nThey may also\nface long-term\ndifficulties in\nrecovering\ntheir identity\nand assets.\nIt erodes\ntrust in online\ncommunication,\nleads to\nincreased\ncybersecurity\nmeasures\nand costs. It\nalso forces\ncompanies to\ninvest more\nin security,\nimpacting the\noverall user\nexperience and\nonline safety.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B 2. Stolen credit cards were the most common source of identity theft. Unfortunately, police do not usually recover the stolen cards.","items":[{"id":"b8468.i01","label":"rewrite","prompt":"Rewrite the paragraph using the passive where appropriate. Omit the by phrase if it is not necessary.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Identity theft is a growing problem. It occurs when somebody uses your personal information to open bank accounts, borrow money or make purchases. Almost 40 million people reported identity theft last year. People between the ages of 30 and 39 are especially likely to become victims. Criminals targeted almost 300,000 people in that age group in 2022. Stolen credit cards were the most common source of identity theft. Unfortunately, police do not usually recover the stolen cards."},{"kind":"item","id":"b8468.i01","label":"rewrite","prompt":"Rewrite the paragraph using the passive where appropriate. Omit the by phrase if it is not necessary.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05 ","text":"Analyze the extracts together to be sure you have identified the fact, statistic and example correctly."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8470","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":39,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING ABOUT PROBLEMS"},"instruction":"Work in small groups. Choose a topic from the box to write a paragraph about. Include at least one fact, one statistic, one example and one opinion about the topic.","pages":[81],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cbd0a582c01a827e4cf3bc524bccb2c09c4d179bae2635cd768b33673c52565.png"],"provided":"charitable giving fraud malware\ne-commerce fraud phishing emails","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"charitable giving fraud malware"},{"kind":"text","text":"e-commerce fraud phishing emails"}]],"courseMaterials":[{"id":"B05-RW-U03-resource:b8466","title":"WRITING ABOUT PROBLEMS","pages":[80],"text":"When presenting problems, writers use a range of strategies to demonstrate to their readers that these problems are important. Facts, statistics and examples (especially ones that will resonate with readers) can highlight the seriousness of each problem. Here are some examples of these strategies.\n\u003ctable>\u003ctr>\u003ctd>facts\u003c/td>\u003ctd>statistics\u003c/td>\u003ctd>examples\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cybersecurity is a career field that is growing quickly.\u003c/td>\u003ctd>More than 60% of parents reported checking the websites their teenagers visit.\u003c/td>\u003ctd>Clara Bennett had been saving money for her wedding when she lost £20,000 to fraud.\u003c/td>\u003c/tr>\u003c/table>","screens":["When presenting problems, writers use a range of strategies to demonstrate to their readers that these problems are important. Facts, statistics and examples (especially ones that will resonate with readers) can highlight the seriousness of each problem. Here are some examples of these strategies.","\u003ctable>\u003ctr>\u003ctd>facts\u003c/td>\u003ctd>statistics\u003c/td>\u003ctd>examples\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cybersecurity is a career field that is growing quickly.\u003c/td>\u003ctd>More than 60% of parents reported checking the websites their teenagers visit.\u003c/td>\u003ctd>Clara Bennett had been saving money for her wedding when she lost £20,000 to fraud.\u003c/td>\u003c/tr>\u003c/table>"],"sources":[{"page":80,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cb24ebf06b3fb418e664f9d1964f703cdb3bf82b99566aac8f453448a505ab41.png"}],"kind":"resource","sourceBlockIds":["b8466"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Charitable giving fraud can occur when\npeople use crowdfunding websites to\ncollect money for dishonest purposes. In\none case, Americans Katelyn McClure and\nMark D’Amico established a crowdfunding\ncampaign for a man named Johnny Bobbit,\na homeless veteran. Donations eventually\ntotalled more than £320,000 but instead\nof giving the money to Bobbit, McClure\nand D’Amico used the money to purchase\nan expensive car, clothes and a trip to Las\nVegas. They were eventually prosecuted\nand sent to prison for their crimes. While\nthere are always risks associated with this\ntype of charitable giving, the crowdfunding\nwebsite GoFundMe reports that less than\none-tenth of 1% of all their campaigns are\nfraudulent. That small number is somewhat\ncomforting, because internet crimes like\nthese are abhorrent, especially since they\ntarget the most vulnerable people in our\nsociety.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8473","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING ABOUT SOLUTIONS"},"instruction":"Work with a partner. Take turns reading the statements out loud and deciding which strategy the writer uses: R, G or S.","pages":[81],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cbd0a582c01a827e4cf3bc524bccb2c09c4d179bae2635cd768b33673c52565.png"],"provided":"","items":[{"id":"b8473.i01","label":"1","prompt":"Accessing the internet on a public wi-fi network may help thieves steal your personal information.","options":["R","G","S"],"type":"choice/closed"},{"id":"b8473.i02","label":"2","prompt":"Online businesses should increase their level of security so consumers feel safer.","options":["R","G","S"],"type":"choice/closed"},{"id":"b8473.i03","label":"3","prompt":"Cybersecurity experts recommend using short sentences, rather than single words, as passwords.","options":["R","G","S"],"type":"choice/closed"},{"id":"b8473.i04","label":"4","prompt":"One solution is to increase the punishment for cybercriminals.","options":["R","G","S"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8473.i01","label":"1","prompt":"Accessing the internet on a public wi-fi network may help thieves steal your personal information.","options":["R","G","S"],"type":"choice/closed"},{"kind":"item","id":"b8473.i02","label":"2","prompt":"Online businesses should increase their level of security so consumers feel safer.","options":["R","G","S"],"type":"choice/closed"},{"kind":"item","id":"b8473.i03","label":"3","prompt":"Cybersecurity experts recommend using short sentences, rather than single words, as passwords.","options":["R","G","S"],"type":"choice/closed"}],[{"kind":"item","id":"b8473.i04","label":"4","prompt":"One solution is to increase the punishment for cybercriminals.","options":["R","G","S"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8474","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":41,"module":"ACADEMIC WRITING SKILLS","ex":"5","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING ABOUT SOLUTIONS"},"instruction":"Complete the tasks below.","pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhina : ____ / direct suggestions: ____","options":[],"type":"gap/open"},{"id":"b8474.i05","label":"Row 4","prompt":"experts or research: ____ / generally held views: ____ / direct suggestions: ____","options":[],"type":"gap/open"},{"id":"b8474.i06","label":"Row 5","prompt":"experts or research: ____ / generally held views: ____ / direct suggestions: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Research some tips online from experts or research about what people should do when they are victims of cybercrime. Write 4–5 pieces of advice. Make sure you use each strategy (R, G and S) at least once."},{"kind":"text","text":"2 Ask 5–6 classmates for tips on what to do when facing cybercrime. Ask for at least one example of each strategy listed in the Explanation box on page 81. Write your classmates' advice in the table below. When your classmates ask you for tips, cite your experts or research, give generally held views and make direct suggestions. You may use each strategy (R, G and S) more than once."}],[{"kind":"table","rows":[[{"text":"experts or research","header":false,"colspan":1,"rowspan":1},{"text":"generally held views","header":false,"colspan":1,"rowspan":1},{"text":"direct suggestions","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 R: Cybersecurity experts recommend\nthat victims check all of their financial\naccounts for suspicious activity.\nR: Police advise victims to keep careful\nrecords of everything related to the\ncyberfraud activity.\nG: Cybercriminals will continue to be\nbold, so we have to continue to be\nwatchful of our privacy.\nS: Banking officials will assist victims\nin freezing their bank accounts if that\nbecomes necessary.\n2 R: Therapists recommend that victims\nshare their experience with other victims\nas a way to deal with stress and anxiety.\nG: The more personal data we provide\nto websites, the more relaxed and\ncareless we become.\nS: Victims should contact their bank\nimmediately and alert them that\nsomeone has stolen their identity.\nS: Victims should do internet research to\nmake sure no one has created fraudulent\nsocial media accounts in their name.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:native-B5-RW-U3-p82-ex1","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"or a076d.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"problem consequences three solutions\nphishing\nemails can\npersuade\ninternet users\nto click on links\nthat contain\nmalware or\nthat lead to\nfake websites\ninternet\nusers face\ndevastating\nconsequences\nlike ransomware\nattacks,\nidentity theft\nor charitable\ngiving fraud\n1  governments\ncan create strict\nglobal laws\nthat discourage\ncybercriminals\nfrom sending\nphishing emails\n2  internet users\ncan do research\nbefore they\nclick on an\nunfamiliar link\n3  internet users\ncan make sure\ntheir online\ndata is as safe\nas possible,\nin case they\nbecome victims\nof a phishing\nattack","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8478","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":44,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Use the table above to write your introductory paragraph.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/310f37b0e0ff974613e34d28d832fb3c176af3b8477706dabe31e96b228dd909.png"],"provided":"- Describe the problem.\n- Explain its consequences.\n- End with a thesis statement that suggests there are possible solutions, but do not list what those solutions are. You will present those in the body of your essay.","items":[{"id":"b8478.i01","label":"1","prompt":"Write your introductory paragraph here: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Describe the problem."},{"kind":"text","text":"- Explain its consequences."},{"kind":"text","text":"- End with a thesis statement that suggests there are possible solutions, but do not list what those solutions are. You will present those in the body of your essay."},{"kind":"item","id":"b8478.i01","label":"1","prompt":"Write your introductory paragraph here: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Phishing emails are a serious problem for\ninternet users worldwide. These fraudulent\nemails can persuade people to click on links\nthat contain malware or that bring them to\nfake websites. This can lead to devastating\nconsequences, such as ransomware attacks,\nidentity theft or charitable-giving fraud.\nFortunately, there are potential solutions\nto the problem, solutions that will be the\nmost effective if there is cooperation from\nvarious sources.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8479","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":45,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Complete the tasks below using the information in the table in Exercise 2.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/310f37b0e0ff974613e34d28d832fb3c176af3b8477706dabe31e96b228dd909.png"],"provided":"1 State each possible solution and explain how it works.\n2 Explain what steps need to be taken to carry out this solution.\nSolution 1: ____\nSolution 2: ____\nSolution 3: ____","items":[{"id":"b8479.i01","label":"Solution 1","prompt":"Solution 1: ____","options":[],"type":"gap/open"},{"id":"b8479.i02","label":"Solution 2","prompt":"Solution 2: ____","options":[],"type":"gap/open"},{"id":"b8479.i03","label":"Solution 3","prompt":"Solution 3: ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U03-question:b8477","kind":"student-work","title":"WRITING TASK Ex 2","pages":[83]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 State each possible solution and explain how it works."},{"kind":"text","text":"2 Explain what steps need to be taken to carry out this solution."},{"kind":"text","text":"Solution 1: ____"},{"kind":"text","text":"Solution 2: ____"},{"kind":"text","text":"Solution 3: ____"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Solution 1: Governments can create strict\nglobal laws that discourage cybercriminals\nfrom sending phishing emails. In order\nfor this to happen, there will have to\nbe ongoing worldwide events, such\nas global conferences, during which\ngovernments create laws and discuss how\nto enforce them.\nSolution 2: Internet users can do research\nbefore they click on an unfamiliar link.\nAnyone who receives a suspicious text or\nemail should think before they open it.\nThey should do an internet search on the\nname of the person or business that sent\nthe email. They can also put the URL in a\nsearch engine and see if a warning or other\nnegative information comes up.\nSolution 3: Internet users everywhere\nshould always make sure their personal\ninformation is as safe as possible, in\ncase they become victims of a phishing\nattack. This means people should update\ntheir passwords regularly, limit the\npersonal information they share online\nand monitor their financial accounts for\nsuspicious activity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8480","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":46,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Think about your concluding paragraph. Write two or three sentences.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/310f37b0e0ff974613e34d28d832fb3c176af3b8477706dabe31e96b228dd909.png"],"provided":"• Refer back to your main idea.\n- Make a direct suggestion about how to solve the problem. Refer to the solutions you presented in the body of your essay.\n- Leave your readers with something to think about.","items":[{"id":"b8480.i01","label":"1","prompt":"Write your concluding paragraph (two or three sentences): ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"• Refer back to your main idea."},{"kind":"text","text":"- Make a direct suggestion about how to solve the problem. Refer to the solutions you presented in the body of your essay."},{"kind":"text","text":"- Leave your readers with something to think about."},{"kind":"item","id":"b8480.i01","label":"1","prompt":"Write your concluding paragraph (two or three sentences): ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The global threat of phishing attacks is a\nproblem that must be addressed. The best\nway to do that is to make strict laws against\nthis hostile behaviour a priority. We live a\nlarge portion of our lives online: it would be\na relief if we didn’t have to worry about our\nprivacy so often.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8481","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":47,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Refer to the Task checklist on page 84 as you prepare your essay.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/310f37b0e0ff974613e34d28d832fb3c176af3b8477706dabe31e96b228dd909.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Have you explained the danger and its consequences in your introductory paragraph?"},{"kind":"text","text":"Does your thesis statement suggest that solutions are possible but not list them?"},{"kind":"text","text":"Have you provided at least three possible solutions in separate body paragraphs?"},{"kind":"text","text":"Do you refer to research or generally held views?"},{"kind":"text","text":"Does each paragraph have a topic sentence and are all points in the paragraph related to that topic?"},{"kind":"text","text":"Does your conclusion refer back to the main idea of your essay?"}],[{"kind":"text","text":"Does each paragraph include a topic sentence?"}]],"courseMaterials":[{"id":"B05-RW-U03-publisher-page:p084","title":"原题或核对备注所引第84页","pages":[84],"text":"","screens":[],"sources":[{"page":84,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab2dff7094f910ae62aa8d6fec54c8fc800569ba7b88af691552eb188c5e1728.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B05-RW-U03-material:Task checklist p84","title":"第84页 Task checklist","pages":[84],"text":"","screens":[],"sources":[{"page":84,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab2dff7094f910ae62aa8d6fec54c8fc800569ba7b88af691552eb188c5e1728.png"}],"kind":"task_checklist","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8483","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":48,"module":"WRITING TASK","ex":"7","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your notes and the information in Exercise 4 to help you structure your ideas. Write 400–450 words.","pages":[84],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab2dff7094f910ae62aa8d6fec54c8fc800569ba7b88af691552eb188c5e1728.png"],"provided":"","items":[{"id":"b8483.i01","label":"Essay","prompt":"Write your 400–450 word essay here.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U03-question:b8479","kind":"student-work","title":"WRITING TASK Ex 4","pages":[83]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8483.i01","label":"Essay","prompt":"Write your 400–450 word essay here.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Phishing emails are a serious problem for\ninternet users worldwide. These fraudulent\nemails can persuade people to click on links\nthat contain malware or that bring them to\nfake websites. This can lead to devastating\nconsequences, such as ransomware attacks,\nidentity theft or charitable-giving fraud.\nFortunately, there are potential solutions\nto the problem, solutions that will be the\nmost effective if there is cooperation from\nvarious sources.\nGovernments can create strict global\nlaws that discourage cybercriminals\nfrom sending phishing emails. In order\nfor this to happen, there will have to\nbe ongoing worldwide events, such\nas global conferences, during which\ngovernments create laws and discuss how\nto enforce them.\nInternet users can do research before they\nclick on an unfamiliar link. Anyone who\nreceives a suspicious text or email should\nthink before they open it. They should\ndo an internet search on the name of the\nperson or business that sent the email.\nThey can also put the URL in a search\nengine and see if a warning or other\nnegative information comes up.\nIn addition, internet users everywhere\nshould always make sure their personal\ninformation is as safe as possible, in\ncase they become victims of a phishing\nattack. This means people should update\ntheir passwords regularly, limit the\npersonal information they share online\nand monitor their financial accounts for\nsuspicious activity.\nThe global threat of phishing attacks is a\nproblem that must be addressed. The best\nway to do that is to make strict laws against\nthis hostile behaviour a priority. We live a\nlarge portion of our lives online: it would be\na relief if we didn’t have to worry about our\nprivacy so often.\nUNIT 4\nUNLOCK YOUR\nKNOWLEDGE\npage 87\n1 I’ve eaten at many street food vans and\nI remember one experience especially\nwell. The food van served seafood and\nI ordered a sandwich called a lobster\nroll. It was the most delicious seafood\nI had ever eaten, so I have always\nremembered the experience.\nI’ve never eaten at a street food van.\nThe city where I grew up and still live\nis quite small, so we don’t have street\nfood vans or any other type of mobile\nbusiness. However, I would love to try\none some day. It sounds very trendy\nand fun.\n2 My favourite business is my local beauty\nsalon. I have been going there to get\nmy hair cut for more than five years. The\nreasons I keep returning is because I\nlove the people and I love how my hair\nlooks when I leave.\n3 If I were going to start my own business,\nI would start a bookshop. I have\nalways loved reading and I also like\nrecommending books to my friends and\nfamily. In addition, I think bookshops are\ncalming places. Whenever I shop at one,\nI tend to stay for a long time and then\nfeel relaxed afterwards. I would love to\nprovide that type of serene place for the\npeople in my community.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U03-question:b8485","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"order":49,"module":"WRITING TASK","ex":"8","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Use the Task checklist to review your essay for content and structure.","pages":[84],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab2dff7094f910ae62aa8d6fec54c8fc800569ba7b88af691552eb188c5e1728.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you explained the danger and its consequences in your intr
