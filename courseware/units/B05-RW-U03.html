"pages":[[{"term":"fraud","pos":"(n)","definition":"the crime of getting money by deceiving people","example":"The bank warned customers about online fraud.","wordAudio":"fraud","cardWord":false},{"term":"surveillance","pos":"(n)","definition":"the act of watching a person or a place that may be involved in criminal activity","example":"The police placed the warehouse under surveillance.","wordAudio":"surveillance","cardWord":false},{"term":"think up","pos":"(phr v)","definition":"to produce a new idea or plan","example":"We need to think up a name for the school show.","wordAudio":"think up","cardWord":false},{"term":"watchdog","pos":"(n)","definition":"an organization responsible for making certain that companies obey laws and standards","example":"The consumer watchdog investigated several complaints.","wordAudio":"watchdog","cardWord":false},{"term":"rogue","pos":"(adj)","definition":"a person who behaves in an unexpected way, often causing damage","example":"A rogue employee tried to sell private customer records.","wordAudio":"rogue","cardWord":false},{"term":"violate","pos":"(v)","definition":"to act in a way that does not show respect for an important principle","example":"Publishing those details would violate the group's promise of privacy.","wordAudio":"violate","cardWord":false}]]}},{"id":"B05-RW-U03-classroom:video","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5a92b0e67c7f124b36e5bb3e7bea511f3b9efc2b56ad372ab508ba4e14e2c5d9.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/0f0eb159ff8bc374082458a6-L5RW-U03.mp4","captions":[{"start":0,"end":3.82,"text":"Your face, like your fingerprints or your DNA,"},{"start":4.24,"end":5.44,"text":"is unique to you."},{"start":6.62,"end":9,"text":"For developers of biometric technology,"},{"start":9.62,"end":14.24,"text":"the face is an easy -to -capture piece of data that can\nbe used to identify someone."},{"start":15.18,"end":16.02,"text":"As such,"},{"start":16.44,"end":20.4,"text":"facial recognition is one of the fastest -growing areas\nof biometrics."},{"start":21.4,"end":28.22,"text":"Both public and private organizations use facial\nrecognition to improve security and protect privacy."},{"start":29.22,"end":30.3,"text":"For example,"},{"start":30.74,"end":39,"text":"smartphones which use facial recognition instead of a\npassword can protect you from criminals who might steal\nyour password in a public place."},{"start":39.64,"end":41.74,"text":"When conducting financial transactions,"},{"start":42.44,"end":48.88,"text":"facial recognition is an additional layer of security\nthat is designed to prevent identity theft and fraud."},{"start":49.82,"end":50.84,"text":"In law enforcement,"},{"start":51.28,"end":54.64,"text":"it can identify suspects who have been caught on\ncamera."},{"start":55.2,"end":56.92,"text":"Linked to live surveillance,"},{"start":57.44,"end":60.58,"text":"it can identify people who may be threats to public\nsafety,"},{"start":61.26,"end":62.32,"text":"find missing persons,"},{"start":62.96,"end":64.72,"text":"or catch wanted criminals."},{"start":65.6,"end":66.86,"text":"In security systems,"},{"start":67.28,"end":72.06,"text":"it ensures that access to homes and other sensitive\nareas is restricted."},{"start":72.82,"end":80.26,"text":"And airports around the world have introduced facial\nrecognition systems to check that travelers are who\nthey say they are."},{"start":80.96000000000001,"end":85.22,"text":"New uses for facial recognition are being thought up\nall the time."},{"start":86.02,"end":90.22,"text":"Some have little to do with providing security or\nprotecting privacy."},{"start":91.24,"end":91.88,"text":"In gaming,"},{"start":92.2,"end":95.84,"text":"it's used to check ages and to grant games permissions."},{"start":97.42,"end":101.46000000000001,"text":"Some universities use facial recognition to take\nstudent registration."},{"start":102.82,"end":106.34,"text":"Healthcare providers are using it to link patients to\ntheir records."},{"start":107.25999999999999,"end":112.68,"text":"And companies are using it in stores to better target\nproducts at shoppers."},{"start":114.18,"end":121.78,"text":"But the widespread use of facial recognition has raised\nconcerns with human rights watchdogs and members of the\npublic."},{"start":122.76,"end":124.54,"text":"Some feel that this technology,"},{"start":125.18,"end":126.74,"text":"designed to provide our security,"},{"start":127.24,"end":129.36,"text":"is actually a threat to our privacy."},{"start":130.32,"end":137.56,"text":"Facial recognition technology often requires a large\ndatabase of images and other information to work."},{"start":138.3,"end":141.6,"text":"Opponents fear that these are open to dangerous abuses."},{"start":143.1,"end":150.3,"text":"A rogue employee at a government agency could misuse\nthe technology to track the movements of an innocent\nperson,"},{"start":150.92000000000002,"end":154.72,"text":"violating their right to privacy and presenting a\nsafety risk."},{"start":155.98,"end":159.64,"text":"Governments themselves would gain the power to track\nanyone,"},{"start":160.14,"end":160.54,"text":"anywhere,"},{"start":161.2,"end":163.66,"text":"and this could repress freedom within a nation."},{"start":165.07999999999998,"end":167.9,"text":"And large databases are targets for hackers."},{"start":169.44,"end":170.22,"text":"Once stolen,"},{"start":170.6,"end":175.54,"text":"the information can be shared with other criminals and\nused to steal identities,"},{"start":176.04,"end":177.84,"text":"disrupt services, and more."},{"start":179.2,"end":180.82,"text":"Another issue is consent."},{"start":181.38,"end":182.94,"text":"On our own smartphone,"},{"start":183.34,"end":185.84,"text":"we are in control of the use of the technology,"},{"start":186.24,"end":189.22,"text":"and we can decide whether or not we want to use it."},{"start":189.62,"end":195.12,"text":"But when photos and data are widely gathered without\nthe public's knowledge,"},{"start":195.64,"end":199.66,"text":"we lose control over how our information is being\nstored,"},{"start":200.06,"end":201.34,"text":"used, or shared."},{"start":202.74,"end":208.64,"text":"While some governments and businesses around the world\nare enthusiastically adopting the technology,"},{"start":209.28,"end":211.32,"text":"others are proceeding with caution."},{"start":212.52,"end":222.82,"text":"Many commentators believe that what is required now is\nregulation to effectively protect our privacy against\nthe threat facial recognition technology poses."}],"launchInline":true}},{"id":"B05-RW-U03-classroom:material:RW-M03","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[68],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","sourcePage":68},{"body":"2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","sourcePage":68},{"body":"3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","sourcePage":68},{"body":"4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for","sourcePage":68},{"body":"veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","sourcePage":68},{"body":"6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","sourcePage":68}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U03-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"CYBERCRIME IS ON THE RISE","pages":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png","width":772,"height":1040}],"source":68,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.","sourcePage":68},{"body":"2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.","sourcePage":68},{"body":"3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.","sourcePage":68},{"body":"4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for","sourcePage":68},{"body":"veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.","sourcePage":68},{"body":"6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","sourcePage":68}],"text":"# CYBERCRIME IS ON THE RISE\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for\nveterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/579b590333da5fb4bf32dd1f88581a7cadaeeeaf43380a3505a20525daa5b0b3.mp3"},"original":{"id":"B05-RW-U03-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U03","book":5,"track":"RW","unit":3,"title":"READING 1","kind":"material","pages":[68],"sourceImages":[{"page":68,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41b5ec5cd9fd2f4257efcd8970e8c98234a034eb1c06bfb09a313fe3adbdb07.png","viewEvidenceReported":true}],"text":"# CYBERCRIME IS ON THE RISE\n\n1 Charlie Goh spent nearly £100 online on salmon and beef before discovering he had been scammed. The Singaporean actor was not alone. Over the course of one month in 2022, at least 168 people in Singapore lost nearly £12,000 in e-commerce scams related to food. The crime was simple: advertisements offering luxury food items at inexpensive prices were posted to online platforms. As soon as potential customers placed their orders and paid via an online payment system, the fraudulent seller vanished. Victims like Goh never received their purchases - and never saw their money again.\n\n2 E-commerce fraud, which is defined as a hostile activity that takes advantage of online shops and consumers, is among the most common types of online crime. It is also said to be extremely profitable. One study showed that worldwide, the amount of money lost to online payment fraud in 2022 amounted to almost £33 billion, a number that is only expected to rise in the coming years. E-commerce scams are merely one example of the dangers associated with the internet.\n\n3 Anyone with an online presence can run into trouble like identity theft, which occurs when personal information is stolen and used to make purchases, apply for loans and even withdraw money from a victim's bank account. Financial identity theft is an especially disturbing crime. It often results in loss of money, not to mention the stress and time it costs to resolve the issue. Will Bottom knows this all too well. Bottom logged into his bank account one day and discovered almost £10,000 missing. After a data breach at a government organization, his personal information fell into the hands of a criminal, who used it to make a fake driver's licence in Bottom's name. The scammer was then able to steal money, unfreeze bank accounts that Bottom had frozen and even purchase an expensive car. Fortunately, the thief was caught and punished, but not before costing Bottom time, money and emotional trauma.\n\n4 Another troubling online scam is charity organization fraud. This often takes place following highly publicized natural disasters. After a terrible flood, earthquake or wildfire, it is natural for people to want to help. But because they want to help, they are taken advantage of by dishonest people. Criminals will send phishing emails, which are emails that appear to be from legitimate businesses, to potential donors. Victims are then led to fake websites, where they unknowingly donate money to criminals. Deceptive behaviour like this is common. In 2022, the Charity Commission, which monitors charitable organizations in the United Kingdom, reported that one in eight charities had experienced some sort of cybercrime in the past 12 months. In the United States, the Federal Trade Commission regularly posts warnings about scams during hurricane season, especially in the wake of particularly destructive storms. Charity fraud can occur on a smaller scale, too. Using online ads and other methods, American Travis Peterson convinced people to donate valuable items to his fake charity for veterans. He was caught and sent to prison, but not before cheating victims out of more than £400,000.\n\n5 The more we conduct business online, the more vulnerable we make ourselves to dangers associated with the internet. Consumer behaviour has shifted dramatically in recent years, fuelled largely by the ease of online shopping, the prevalence of smartphones and the rise in social media, which provides advertisers with limitless opportunity to reach customers. In the United States alone, 76% of all consumers shop online. It is claimed that, when online traffic experiences a 15-20% increase on popular shopping sites like Amazon, a 2-5% increase in fraudulent activity is expected to follow.\n\n6 Online scams can have devastating consequences for victims. They suffer pain well beyond financial loss. In the United Kingdom, one in five fraud victims lost more than £1,000. A loss like this can lead to stress, anxiety and depression. Because victims often blame themselves, they may experience shame and humiliation. Cybercrime is a growing problem. It is time to get tough on the laws and make sure these abhorrent criminals face the consequences of their offensive actions.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8415"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/579b590333da5fb4bf32dd1f88581a7cadaeeeaf43380a3505a20525daa5b0b3.mp3","continueOnPage":true}},{"id":"B05-RW-U03-classroom:resource:b8425","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/edcf7f603b5f2d9870070147454f7c640228e40f106f236030edb7e8f18e99a9.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["accountable (adj) responsible\nassemble (v) gather in one place\ncombat (v) fight\neliminate (v) remove something","exhibit (v) show\nmalicious (adj) intended to harm or upset people\nprosecute (v) take to court to argue the guilt of\nregulate (v) control"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U03-classroom:material:RW-M04","book":5,"unit":3,"track":"RW","topic":"PRIVACY","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[72],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.","sourcePage":72},{"body":"2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.","sourcePage":72},{"body":"3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.","sourcePage":72},{"body":"4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.","sourcePage":72},{"body":"5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.","sourcePage":72},{"body":"6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","sourcePage":72}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U03-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":72,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png","width":772,"height":1040}],"source":72,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.","sourcePage":72},{"body":"2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.","sourcePage":72},{"body":"3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.","sourcePage":72},{"body":"4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.","sourcePage":72},{"body":"5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.","sourcePage":72},{"body":"6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","sourcePage":72}],"text":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money lost to fraud happened to those aged 60 and older. One of those victims was Mary Barker, a retired woman from the United Kingdom, who lost £70,000 of her pension after criminals created a fake website that looked identical to a well-known investment firm's website.\n2 Although it may lead to financial devastation, cybercrime is often treated as a low-priority issue. However, the problem is not going away any time soon. Internet use has soared in recent years, leading to an increase in fraudulent activity such as phishing attacks, which can lead online users to fake websites or malware. And online use only continues to grow. Cybercrime Magazine reported that 90% of the global population over age 6 will be online by 2030. That will amount to an astonishing seven billion internet users.\n3 The best way to eliminate cybercrime is to find and prosecute criminals. Because crime rings often operate across international borders, they are difficult – though not impossible – to stop. They do, however, require international effort and cooperation. In one case, 59 people were arrested after a month-long operation that involved 19 countries across Europe. The suspects stole credit-card information and used it to purchase expensive goods from countless online shops. The arrests took place only after law-enforcement agencies assembled a team that consisted of numerous online merchants, banks and logistics companies that spanned several countries. In another case, 75 arrests were made after the cooperation of several countries including Malaysia, UAE, Nigeria, Argentina, Germany and Australia. The suspects belonged to a cybercrime ring known as Black Axe, a group which, along with similar crime rings, are said to be responsible for most of the financial cybercrimes committed globally.\n4 Criminals will do what it takes to obtain our usernames, passwords and other personal data and, let's face it: if we conduct transactions online, we are vulnerable to fraud. To eliminate the seemingly endless dangers associated with the internet, we must take every measure possible to protect ourselves. The best way to do so is to take extreme care with personal information. Thieves break into mobile phones, tablets and computers when users access wi-fi through unsecured networks. That means you should think twice before logging into a bank or credit-card account from your local café. One study reported that 87% of consumers said they had used an unsecured wi-fi network at least once over the course of a year and, while that may not sound like much, even that one time makes it more likely that criminals will hack your personal data.\n5 Because stealing identities is the one of the primary activities in e-commerce fraud, protecting oneself against the latter will help prevent the former. Additional cautions all internet users should take include using strong passwords and changing them regularly, turning on multi-factor authentication on accounts, if available, and making sure operating systems and internet browsers are up to date. Thieves are often skilled at creating deceptive websites that look authentic, so before making a purchase or donation online, examine the URL or app name for misspelled words, a logo that appears slightly off or anything else that looks odd. Be sure to read online reviews of the business, keeping an eye out for any suggestion of a scam.\n6 People who wish to donate to charitable causes should not let the possibility of cybercrime stand in their way. However, it's a good idea to check out the organization with an official government body. For example, in the United Kingdom, potential donors can input a charity's name and registration number to the Action Fraud website to make sure the charity has built a reputation for honest fundraising.\n7 According to one estimate, the financial damages brought about by cybercrime will reach more than £18 trillion by 2027. That is why it's important for the international community to come together to regulate online spaces, passing laws that are effective in finding criminals and holding them accountable for their abhorrent actions.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/06960a157888d35707b374a681dea5aba83ec791c20de2c5b05ce36c6e9da67d.mp3"},"original":{"id":"B05-RW-U03-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U03","book":5,"track":"RW","unit":3,"title":"READING 2","kind":"material","pages":[72],"sourceImages":[{"page":72,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ad13283ea7ffedc74c15a19c52f973e7346a7f8d334c1e94921a5efdea888db.png","viewEvidenceReported":true}],"text":"1 Cybercrime is any malicious activity that is done with computers or the internet. These crimes have a negative impact on society, businesses and the economy. They also cause great harm to individuals. Victims of fraud suffer emotional consequences, often exhibiting behaviour related to anxiety and stress. Some people even become afraid to go online or leave their homes. Worse, scammers frequently target society's most vulnerable members. In 2022, it was reported that the most amount of money  const items=table?[]:sourceItems;

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);

 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");

  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;

  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';

function vocabularyPlacement(c,page){

  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");

   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+

 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));

 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){

 return display(i);
}
function returnToTask(){

}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){

function inspectMaterials(doc,c){

  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
