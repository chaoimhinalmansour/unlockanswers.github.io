[],"type":"gap/closed"},{"kind":"item","id":"b4647.i02","label":"(2)","prompt":"They also possess ____ flexibility and know that there is rarely a single (3) ____ .","options":[],"type":"gap/closed"},{"kind":"item","id":"b4647.i05","label":"(5)","prompt":"A research scientist often works in this industry because they want to make a difference to the ____ of others.","options":[],"type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/1c6ec8ebe079c0ef91431f25-L3LS-U06.mp4","captions":[{"start":0.78,"end":4.4,"text":"Being a research scientist can be an exciting career."},{"start":5.34,"end":6.9,"text":"But what skills are needed?"},{"start":8.42,"end":11.84,"text":"Research scientists have a strong interest in their\nchosen area,"},{"start":12.36,"end":14.5,"text":"normally one of the STEM subjects."},{"start":15.7,"end":16.9,"text":"Science, technology,"},{"start":17.22,"end":18.54,"text":"engineering, or math."},{"start":19.78,"end":22.28,"text":"Asking why and how things happen,"},{"start":23.08,"end":25.38,"text":"testing ideas and evaluating solutions,"},{"start":26.08,"end":27.04,"text":"or critical thinking,"},{"start":27.62,"end":29.3,"text":"is fundamental to science."},{"start":30.64,"end":32.72,"text":"Mental flexibility is essential too,"},{"start":33.14,"end":38.28,"text":"the ability to move from one task to another and think\nof more than one solution to a problem."},{"start":40.56,"end":43.66,"text":"The inventor of the most popular vacuum cleaner in the\nUK,"},{"start":44.02,"end":44.7,"text":"James Dyson,"},{"start":45.14,"end":47.78,"text":"made over five ,000 unsuccessful attempts,"},{"start":48.16,"end":51.12,"text":"the first of which were made with just cardboard and\nsticky tape."},{"start":52.02,"end":59.88,"text":"But he succeeded in producing a vacuum cleaner that\nworked differently from all the others on the market at\nthe time."},{"start":60.84,"end":64.2,"text":"Flexibility helps in adapting to different environments\ntoo."},{"start":64.72,"end":66.74,"text":"Research scientists may work in a laboratory,"},{"start":68,"end":68.84,"text":"a lecture hall,"},{"start":70.16,"end":70.68,"text":"underwater,"},{"start":72.32,"end":72.78,"text":"outdoors,"},{"start":73.74,"end":75.1,"text":"or even in space."},{"start":76.52,"end":82.06,"text":"Successful scientists take the initiative and want to\nmake a real difference to people's lives."},{"start":83.78,"end":87.9,"text":"The laser -faco probe is a device which is used to\nremove cataracts."},{"start":89.22,"end":90.58,"text":"It was invented by Dr."},{"start":90.7,"end":91.46000000000001,"text":"Patricia Bath,"},{"start":91.9,"end":97.34,"text":"who noticed that her African -American patients in New\nYork were more likely to lose their sight."},{"start":98.42,"end":101.16,"text":"Her invention is now used in many countries."},{"start":102.14,"end":106.46000000000001,"text":"Research scientists also need to be good at teamwork\nand collaboration."},{"start":108.1,"end":112.25999999999999,"text":"The company BioNTech was started by scientists Ouzlem\nTureci,"},{"start":112.6,"end":116.5,"text":"Uğur Şahin, and Christoph Huber to research treatment\nfor cancer."},{"start":117.97999999999999,"end":128.44,"text":"This involved research into the immune system, and\nduring the pandemic they were able to partner with the\ndrug company Pfizer to produce a successful vaccine\nagainst COVID -19."},{"start":129.84,"end":136.02,"text":"So if you have a special interest and are keen to\ndevelop the skills, among others, of critical thinking,"},{"start":136.48,"end":136.98,"text":"flexibility,"},{"start":137.44,"end":139.34,"text":"taking initiative, and collaboration,"},{"start":139.9,"end":142.52,"text":"research science may be the career for you."},{"start":143.44,"end":145.54,"text":"Who knows what [],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"It's hard to imagine life before smartphone apps! But let's try anyway. Imagine for a moment that you're taking a road trip in the days before smartphones were invented."},{"kind":"item","id":"b4690.i01","label":"1","prompt":"How can you find information about the place that you want to sit?","options":[],"type":"qa/open"},{"kind":"item","id":"b4690.i02","label":"2","prompt":"Which forms of entertainment could you use in the car while you drive?","options":[],"type":"qa/open"},{"kind":"item","id":"b4690.i03","label":"3","prompt":"How will you find your way to your destination? What will you do if you get lost?","options":[],"type":"qa/open"},{"kind":"item","id":"b4690.i04","label":"4","prompt":"Where are the address and phone numbers of the hotels where you want to stay?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":56,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4691","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"order":33,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"6.5 Listen to the lecture. Are your answers to the questions in Exercise 5 similar to the speaker's? Check your notes and add ideas.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d666652221a8229f63b2ae1fa118514c78a437f4545febf89434657c0c91cb1f.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B03-LS-U06-question:b4690","kind":"student-work","title":"LISTENING 2 Ex 5","pages":[137]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.5","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_4ef34c52618f71d8.mp3"}],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":56,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4692","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"order":34,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in groups of three students, A, B and C. Your teacher is going to give a text to each student in the group. Read your text and underline the key information in it. Then make notes about it.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d666652221a8229f63b2ae1fa118514c78a437f4545febf89434657c0c91cb1f.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B03-LS-U06-teacher-text:p056:A","title":"Ex7 Student A 原文","pages":[56],"text":"I'd like to start by talking a little bit about the first apps. These were included with each smartphone. These types of apps were placed on the phones to help users access the internet, check emails, send texts and so on. The first apps were designed to increase efficiency at work and allow people to access important information. However, it was the second generation of apps that really changed things. These were downloadable apps. Users simply downloaded apps from the internet and installed them on their phones. Since its introduction, the app market has grown far beyond anyone's expectations.","screens":["I'd like to start by talking a little bit about the first apps. These were included with each smartphone. These types of apps were placed on the phones to help users access the internet, check emails, send texts and so on. The first apps were designed to increase efficiency at work and allow people to access important information. However, it was the second generation of apps that really changed things. These were downloadable apps. Users simply downloaded apps from the internet and installed them on their phones. Since its introduction, the app market has grown far beyond anyone's expectations."],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/398673776fc51b31c29df5fe05535ca1e93cada9ed8ea228c523988febd37fea.png"}],"kind":"teacher_distributed_publisher_text","sourceBlockIds":[]},{"id":"B03-LS-U06-teacher-text:p056:B","title":"Ex7 Student B 原文","pages":[56],"text":"The first app store was opened in 2008. By 2011, it was reporting over 10 billion downloads and people were using apps more than internet browsers on their phones. And by 2017, an estimated 180 billion apps had been downloaded. These numbers have been growing ever since and they give us a good idea about how popular apps are and how quickly they've developed. People from all over the world use apps for entertainment, travel and communication. So, I'm going to briefly talk about how these apps have changed our lives.","screens":["The first app store was opened in 2008. By 2011, it was reporting over 10 billion downloads and people were using apps more than internet browsers on their phones. And by 2017, an estimated 180 billion apps had been downloaded. These numbers have been growing ever since and they give us a good idea about how popular apps are and how quickly they've developed. People from all over the world use apps for entertainment, travel and communication. So, I'm going to briefly talk about how these apps have changed our lives."],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/398673776fc51b31c29df5fe05535ca1e93cada9ed8ea228c523988febd37fea.png"}],"kind":"teacher_distributed_publisher_text","sourceBlockIds":[]},{"id":"B03-LS-U06-teacher-text:p056:C","title":"Ex7 Student C 原文","pages":[56],"text":"So, now I'd like to mention another important effect of the invention of apps. It has created a whole new IT sector. It is one of the fastest-growing industries and there is a great need for skilled software engineers. But apps have also had some negative effects. For one thing, people have become more helpless because they're so dependent on their phones for information. For example, if they're in a place with no phone signal, they're not very good at asking for and following directions. And apps have made people less patient because they expect to have information immediately. In fact, a recent study found that 87 percent of smartphone users leave a web page if it doesn't load in two seconds.","screens":["So, now I'd like to mention another important effect of the invention of apps. It has created a whole new IT sector. It is one of the fastest-growing industries and there is a great need for skilled software engineers. But apps have also had some negative effects. For one thing, people have become more helpless because they're so dependent on their phones for information. For example, if they're in a place with no phone signal, they're not very good at asking for and following directions. And apps have made people less patient because they expect to have information immediately. In fact, a recent study found that 87 percent of smartphone","users leave a web page if it doesn't load in two seconds."],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/398673776fc51b31c29df5fe05535ca1e93cada9ed8ea228c523988febd37fea.png"}],"kind":"teacher_distributed_publisher_text","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":56,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4693","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"order":35,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in your group from Exercise 7. Use your notes to tell each other about the key information in your text.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d666652221a8229f63b2ae1fa118514c78a437f4545febf89434657c0c91cb1f.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B03-LS-U06-question:b4692","kind":"student-work","title":"LISTENING 2 Ex 7","pages":[137]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":56,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4694","book":3,"unit":6,"track":"LS","topic":"DISCOVE 3/content/93887b9d048f54486c2d816c3a79d20663325b82fbd95c805d3e54f6b57771dc.png"],"provided":"Student A: give an introduction to a presentation about the paperclip.\n\nStudent B: give an introduction to a presentation about the ballpoint pen.\n\nI would like to present an invention which has changed the way we ____. It's a simple invention and we have all used it.\n\nIt's the ____.\n\nA ____ is ____.\n(explain the invention here)\n\nYou can ____.\n(explain how it is used in general)\n\nFirst, I am going to talk about ____. Then, I will explain how it has improved our lives.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Student A: give an introduction to a presentation about the paperclip."},{"kind":"text","text":"Student B: give an introduction to a presentation about the ballpoint pen."},{"kind":"text","text":"I would like to present an invention which has changed the way we ____. It's a simple invention and we have all used it."},{"kind":"text","text":"It's the ____."},{"kind":"text","text":"A ____ is ____."},{"kind":"text","text":"(explain the invention here)"}],[{"kind":"text","text":"You can ____."},{"kind":"text","text":"(explain how it is used in general)"},{"kind":"text","text":"First, I am going to talk about ____. Then, I will explain how it has improved our lives."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9bd592b7ca24f6285fd439fa52530cfef819f35bab4766cf614bff86575b0c6b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4718","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"order":48,"module":"PREPARATION FOR SPEAKING","ex":"3","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"ORGANIZING IDEAS"},"instruction":"Read the next part of the presentation. Number the questions (a–g) in the order they are answered in the presentation. Then compare your answers with a partner.","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28e1ed932629a588c97053578027596772b22796fa513b5685c46e07f9280e6f.png"],"provided":"To start with, Post-it® notes were invented in 1974 by Art Fry. Fry needed a bookmark which would stay inside the book and didn't fall out.\n\nHe used a special type of glue invented by his colleague Spencer Silver. The glue was not very strong and made it easy to remove the notes.\n\nIn 1977, the first Post-it® notes were sold in shops. Since then, they have become a global phenomenon. People all over the word recognize the small, yellow sticky notes. We use them at work, at school and at home.\n\nBecause the glue does not leave any stains, people can stick Post-it® notes to anything. They allow us to remember important information and take notes.\n\nThe best thing is that you can stick a Post-it® note anywhere to help you remember something.","items":[{"id":"b4718.i01","label":"a","prompt":"Why do people use them? ____","options":[],"type":"gap/closed"},{"id":"b4718.i02","label":"b","prompt":"Who invented them? ____","options":[],"type":"gap/closed"},{"id":"b4718.i03","label":"c","prompt":"Where can people use them? ____","options":[],"type":"gap/closed"},{"id":"b4718.i04","label":"d","prompt":"Why were they invented? ____","options":[],"type":"gap/closed"},{"id":"b4718.i05","label":"e","prompt":"When were they invented? _1_","options":[],"type":"gap/closed"},{"id":"b4718.i06","label":"f","prompt":"What is the best thing about the invention? ____","options":[],"type":"gap/closed"},{"id":"b4718.i07","label":"g","prompt":"When were they first sold? ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"To start with, Post-it® notes were invented in 1974 by Art Fry. Fry needed a bookmark which would stay inside the book and didn't fall out."},{"kind":"text","text":"He used a special type of glue invented by his colleague Spencer Silver. The glue was not very strong and made it easy to remove the notes."},{"kind":"text","text":"In 1977, the first Post-it® notes were sold in shops. Since then, they have become a global phenomenon. People all over the word recognize the small, yellow sticky notes. We use them at work, at school and at home."},{"kind":"text","text":"Because the glue does not leave any stains, people can stick Post-it® notes to anything. They allow us to remember important information and take notes."}],[{"kind":"text","text":"The best thing is that you can stick a Post-it® note anywhere to help you remember something."},{"kind":"item","id":"b4718.i01","label":"a","prompt":"Why do people use them? ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b4718.i02","label":"b","prompt":"Who invented them? ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b4718.i03","label":"c","prompt":"Where can people use them? ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b4718.i04","label":"d","prompt":"Why were they invented? ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b4718.i05","label":"e","prompt":"When were they invented? _1_","options":[],"type":"gap/closed"},{"kind":"item","id":"b4718.i06","label":"f","prompt":"What is the best thing about the invention? ____","options":[],"type":"gap/closed"}],[{"kind":"item","id":"b4718.i07","label":"g","prompt":"When were they first sold? ____","options":[],"type":"gap/closed"}]],"courseMaterials":[]," ages":[124],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/244a2092fefbce56aa31b0c69e6666f1196d6e3c5a8bb95bee087050a2b5aef9.png"],"sourceHashes":["244a2092fefbce56aa31b0c69e6666f1196d6e3c5a8bb95bee087050a2b5aef9"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Speaking task","text":"Give a presentation about an invention or a discovery which has changed our lives."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about research scientists."},{"label":"Listening skills","text":"Understand references to earlier ideas; understand lecture organization."},{"label":"Critical thinking","text":"Summarize information using Wh- questions."},{"label":"Grammar","text":"Use passive verb forms."},{"label":"Speaking skills","text":"Preview a topic; organize ideas; explain how something is used."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":124,"alt":""}}]}},{"id":"B03-LS-U06-classroom:resource:b4643","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b21d540f566092ac7c3233aa9e4997e8a39022f90f531353c2c4fae73d2d1525.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"fundamental","pos":"(adj)","definition":"more important than anything else","example":"Trust is fundamental to a strong friendship.","wordAudio":"fundamental","cardWord":false},{"term":"treatment","pos":"(n)","definition":"the use of medicine to make a sick or injured person healthy","example":"The doctor explained the treatment for the infection.","wordAudio":"treatment","cardWord":false},{"term":"immune system","pos":"(n)","definition":"the system in the body that protects it against infection","example":"The immune system helps the body fight infection.","wordAudio":"immune system","cardWord":false},{"term":"vaccine","pos":"(n)","definition":"a special substance that you take into your body to prevent a disease","example":"A vaccine can help protect people from a disease.","wordAudio":"vaccine","cardWord":false},{"term":"cataract","pos":"(n)","definition":"a disease which affects somebody's eye so that they can not see clearly","example":"A cataract made the letters on the page look blurry.","wordAudio":"cataract","cardWord":false},{"term":"pandemic","pos":"(n)","definition":"a dangerous disease that infects many people at the same time","example":"During the pandemic, many people worked from home.","wordAudio":"pandemic","cardWord":false}]]}},{"id":"B03-LS-U06-classroom:video","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/65e7fda8da0d73fa4bbd182877105fcfd1ea996d383bc6e88c0e603372f86dd5.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/1c6ec8ebe079c0ef91431f25-L3LS-U06.mp4","captions":[{"start":0.78,"end":4.4,"text":"Being a research scientist can be an exciting career."},{"start":5.34,"end":6.9,"text":"But what skills are needed?"},{"start":8.42,"end":11.84,"text":"Research scientists have a strong interest in their\nchosen area,"},{"start":12.36,"end":14.5,"text":"normally one of the STEM subjects."},{"start":15.7,"end":16.9,"text":"Science, technology,"},{"start":17.22,"end":18.54,"text":"engineering, or math."},{"start":19.78,"end":22.28,"text":"Asking why and how things happen,"},{"start":23.08,"end":25.38,"text":"testing ideas and evaluating solutions,"},{"start":26.08,"end":27.04,"text":"or critical thinking,"},{"start":27.62,"end":29.3,"text":"is fundamental to science."},{"start":30.64,"end":32.72,"text":"Mental flexibility is essential too,"},{"start":33.14,"end":38.28,"text":"the ability to move from one task to another and think\nof more than one solution to a problem."},{"start":40.56,"end":43.66,"text":"The inventor of the most popular vacuum cleaner in the\nUK,"},{"start":44.02,"end":44.7,"text":"James Dyson,"},{"start":45.14,"end":47.78,"text":"made over five ,000 unsuccessful attempts,"},{"start":48.16,"end":51.12,"text":"the first of which were made with just cardboard and\nsticky tape."},{"start":52.02,"end":59.88,"text":"But he succeeded in producing a vacuum cleaner that\nworked differently from all the others on the market at\nthe time."},{"start":60.84,"end":64.2,"text":"Flexibility helps in adapting to different environments\ntoo."},{"start":64.72,"end":66.74,"text":"Research scientists may work in a laboratory,"},{"start":68,"end":68.84,"text":"a lecture hall,"},{"start":70.16,"end":70.68,"text":"underwater,"},{"start":72.32,"end":72.78,"text":"outdoors,"},{"start":73.74,"end":75.1,"text":"or even in space."},{"start":76.52,"end":82.06,"text":"Successful scientists take the initiative and want to\nmake a real difference to people's lives."},{"start":83.78,"end":87.9,"text":"The laser -faco probe is a device which is used to\nremove cataracts."},{"start":89.22,"end":90.58,"text":"It was invented by Dr."},{"start":90.7,"end":91.46000000000001,"text":"Patricia Bath,"},{"start":91.9,"end":97.34,"text":"who noticed that her African -American patients in New\nYork were more likely to lose their sight."},{"start":98.42,"end":101.16,"text":"Her invention is now used in many countries."},{"start":102.14,"end":106.46000000000001,"text":"Research scientists also need to be good at teamwork\nand collaboration."},{"start":108.1,"end":112.25999999999999,"text":"The company BioNTech was started by scientists Ouzlem\nTureci,"},{"start":112.6,"end":116.5,"text":"Uğur Şahin, and Christoph Huber to research treatment\nfor cancer."},{"start":117.97999999999999,"end":128.44,"text":"This involved research into the immune system, and\nduring the pandemic they were able to partner with the\ndrug company Pfizer to produce a successful vaccine\nagainst COVID -19."},{"start":129.84,"end":136.02,"text":"So if you have a special interest and are keen to\ndevelop the skills, among others, of critical thinking,"},{"start":136.48,"end":136.98,"text":"flexibility,"},{"start":137.44,"end":139.34,"text":"taking initiative, and collaboration,"},{"start":139.9,"end":142.52,"text":"research science may be the career for you."},{"start":143.44,"end":145.54,"text":"Who knows what you may invent?"}],"launchInline":true}},{"id":"B03-LS-U06-classroom:review-1","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9412541091da26aa36288518d0d7c746c5447c1ded4de342b341df74c2eb1613.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-LS-U06-B-002","form":"allow","page":145},{"id":"B03-LS-U06-B-003","form":"app","page":145},{"id":"B03-LS-U06-B-004","form":"contribution","page":145},{"id":"B03-LS-U06-B-005","form":"create","page":145},{"id":"B03-LS-U06-B-006","for const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+
 (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 const pilotBinding=unit6Pilot.bind(c); if(pilotBinding)return pilotBinding;
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;
 const size=c.feedback?.pageSize??(plan?.showAll?Math.max(1,items.length):plan?.kind==="definitions"?3:c.layout==="grid"?6:equalOptions?3:sourceItems.some(x=>x.options?.length>2)?2:4);
 const chunks=items.length?Array.from({length:Math.ceil(items.length/size)},(_,i)=>items.slice(i*size,(i+1)*size)):[[]];
 return {table,equalOptions,bank:equalOptions?sourceItems[0].options:[],chunks,provided,decks};
}
function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){
 return '<div class="split">'+groups.map(group=>'<section class="panel v-block">'+group.map(block=>
  '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';
}
function materialSplit(decks,task,feedback){
 const tabs=decks.map((deck,i)=>'<button type="button" data-deck="'+i+'" aria-pressed="'+(i===0)+'">'+esc(deck.label)+'</button>').join("");
 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+
  '<section class="panel v-block material-task" data-fixed-task aria-label="课堂任务">'+task+'</section></div>';

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages||c.flow)return unit6Pilot.children(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function resultFor(c){return (c.comparison?comparisonResults:c.flow?lessonResults:results)[c.id];}
function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){
 const host=document.getElementById("preview-size"),scale=Math.min(host.parentElement.clientWidth/1280,maxProjectionScale);
 host.style.width=1280*scale+"px";host.style.height=720*scale+"px";frame.style.transform="scale("+scale+")";

function inClassroomOrder(){
 return Boolean(V.lessonFlow&&sequenceView.value==="school");
}
function inOpenings(){
 return sequenceView.value==="openings";
}
function inGlossaries(){
 return sequenceView.value==="glossaries";
}
function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(unit6Pilot.navLabel(step))+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(unit6Pilot.navLabel(step))+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(unit6Pilot.navLabel(step))+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';

function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';

function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);
 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;
 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";
 const reasons=r?.reasons??c.issues;
 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);

 });

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}

 document.getElementById("lesson-filter").add(new Option((group.track==="RW"?"读写":"听说")+"第 "+group.lesson+" 节，"+group.total+" 题",key));
}
for(const entry of document.querySelectorAll(".summary [data-ref], #digital-examples option[value]:not([value=\"\"])")){
 entry.hidden=!classroom.byId.has(entry.dataset.ref??entry.value);
}
document.getElementById("stat-total").textContent=primary.length;
for(const book of new Set([...classroom.openings,...classroom.glossaries].map(c=>c.book)))openingBook.add(new Option("Book "+book,String(book)));
sequenceView.querySelector('[value="openings"]').hidden=!classroom.openings.length;
sequenceView.querySelector('[value="glossaries"]').hidden=!classroom.glossaries.length;
const startView=new URLSearchParams(location.search).get("view");
if(classroom.openings.length&&startView==="openings")sequenceView.value="openings";
if(classroom.glossaries.length&&startView==="glossaries")sequenceView.value="glossaries";
const selectedLesson=new URLSearchParams(location.search).get("lesson")??"1";
if(/^[12]$/.test(selectedLesson??""))document.getElementById("lesson-filter").value=primary[0].track+selectedLesson;
updateSequenceHeading();
summaries();display(navigationOrder()[0]??0);
</script></body></html>
