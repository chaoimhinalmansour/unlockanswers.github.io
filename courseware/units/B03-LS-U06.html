"gap/closed"},{"kind":"item","id":"b4647.i02","label":"(2)","prompt":"They also possess ____ flexibility and know that there is rarely a single (3) ____ .","options":[],"type":"gap/closed"},{"kind":"item","id":"b4647.i05","label":"(5)","prompt":"A research scientist often works in this industry because they want to make a difference to the ____ of others.","options":[],"type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/1c6ec8ebe079c0ef91431f25-L3LS-U06.mp4","captions":[{"start":0.78,"end":4.4,"text":"Being a research scientist can be an exciting career."},{"start":5.34,"end":6.9,"text":"But what skills are needed?"},{"start":8.42,"end":11.84,"text":"Research scientists have a strong interest in their\nchosen area,"},{"start":12.36,"end":14.5,"text":"normally one of the STEM subjects."},{"start":15.7,"end":16.9,"text":"Science, technology,"},{"start":17.22,"end":18.54,"text":"engineering, or math."},{"start":19.78,"end":22.28,"text":"Asking why and how things happen,"},{"start":23.08,"end":25.38,"text":"testing ideas and evaluating solutions,"},{"start":26.08,"end":27.04,"text":"or critical thinking,"},{"start":27.62,"end":29.3,"text":"is fundamental to science."},{"start":30.64,"end":32.72,"text":"Mental flexibility is essential too,"},{"start":33.14,"end":38.28,"text":"the ability to move from one task to another and think\nof more than one solution to a problem."},{"start":40.56,"end":43.66,"text":"The inventor of the most popular vacuum cleaner in the\nUK,"},{"start":44.02,"end":44.7,"text":"James Dyson,"},{"start":45.14,"end":47.78,"text":"made over five ,000 unsuccessful attempts,"},{"start":48.16,"end":51.12,"text":"the first of which were made with just cardboard and\nsticky tape."},{"start":52.02,"end":59.88,"text":"But he succeeded in producing a vacuum cleaner that\nworked differently from all the others on the market at\nthe time."},{"start":60.84,"end":64.2,"text":"Flexibility helps in adapting to different environments\ntoo."},{"start":64.72,"end":66.74,"text":"Research scientists may work in a laboratory,"},{"start":68,"end":68.84,"text":"a lecture hall,"},{"start":70.16,"end":70.68,"text":"underwater,"},{"start":72.32,"end":72.78,"text":"outdoors,"},{"start":73.74,"end":75.1,"text":"or even in space."},{"start":76.52,"end":82.06,"text":"Successful scientists take the initiative and want to\nmake a real difference to people's lives."},{"start":83.78,"end":87.9,"text":"The laser -faco probe is a device which is used to\nremove cataracts."},{"start":89.22,"end":90.58,"text":"It was invented by Dr."},{"start":90.7,"end":91.46000000000001,"text":"Patricia Bath,"},{"start":91.9,"end":97.34,"text":"who noticed that her African -American patients in New\nYork were more likely to lose their sight."},{"start":98.42,"end":101.16,"text":"Her invention is now used in many countries."},{"start":102.14,"end":106.46000000000001,"text":"Research scientists also need to be good at teamwork\nand collaboration."},{"start":108.1,"end":112.25999999999999,"text":"The company BioNTech was started by scientists Ouzlem\nTureci,"},{"start":112.6,"end":116.5,"text":"Uğur Şahin, and Christoph Huber to research treatment\nfor cancer."},{"start":117.97999999999999,"end":128.44,"text":"This involved research into the immune system, and\nduring the pandemic they were able to partner with the\ndrug company Pfizer to produce a successful vaccine\nagainst COVID -19."},{"start":129.84,"end":136.02,"text":"So if you have a special interest and are keen to\ndevelop the skills, among others, of critical thinking,"},{"start":136.48,"end":136.98,"text":"flexibility,"},{"start":137.44,"end":139.34,"text":"taking initiative, and collaboration,"},{"start":139.9,"end":142.52,"text":"research science may be the career for you."},{"start":143.44,"end":145.54,"text":"Who knows what you may invent?"}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 solutions 2 mental 3 solution  4 environments\n5 lives","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":53,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4648","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Circle the correct answer. In some items, more than one answer is possible.","pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/65e7fda8da0d73fa4bbd182877105fcfd1ea996d383bc6e88c0e603372f86dd5.png"],"provided":"","items":[{"id":"b4648.i01","label":"1","prompt":"Which type of thinking does the speaker say is 'fundamental to science'?","options":["critical","logical","practical"],"type":"choice/closed"},{"id":"b4648.i02","label":"2","prompt":"What did James Dyson use during his first attempt at creating a vacuum cleaner?","options":["cardboard","plastic wire","sticky tape"],"type":"choice/closed"},{"id":"b4648.i03","label":"3","prompt":"In which location(s) might a research scientist work?","options":["underwater","in space","in a lecture hall"],"type":"choice/closed"},{"id":"b4648.i04","label":"4","prompt":"Which area did the creators of BioNTech first want to research?","options":["Covid-19","cancer","the immune system"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4648.i01","label":"1","prompt":"Which type of thinking does the speaker say is 'fundamental to science'?","options":["cr ich forms of entertainment could you use in the car while you drive?","options":[],"type":"qa/open"},{"kind":"item","id":"b4690.i03","label":"3","prompt":"How will you find your way to your destination? What will you do if you get lost?","options":[],"type":"qa/open"},{"kind":"item","id":"b4690.i04","label":"4","prompt":"Where are the address and phone numbers of the hotels where you want to stay?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":56,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4691","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"order":33,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"6.5 Listen to the lecture. Are your answers to the questions in Exercise 5 similar to the speaker's? Check your notes and add ideas.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d666652221a8229f63b2ae1fa118514c78a437f4545febf89434657c0c91cb1f.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B03-LS-U06-question:b4690","kind":"student-work","title":"LISTENING 2 Ex 5","pages":[137]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.5","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_4ef34c52618f71d8.mp3"}],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":56,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U06-question:b4692","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"order":34,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in groups of three students, A, B and C. Your teacher is going to give a text to each student in the group. Read your text and underline the key information in it. Then make notes about it.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d666652221a8229f63b2ae1fa118514c78a437f4545febf89434657c0c91cb1f.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B03-LS-U06-teacher-text:p056:A","title":"Ex7 Student A 原文","pages":[56],"text":"I'd like to start by talking a little bit about the first apps. These were included with each smartphone. These types of apps were placed on the phones to help users access the internet, check emails, send texts and so on. The first apps were designed to increase efficiency at work and allow people to access important information. However, it was the second generation of apps that really changed things. These were downloadable apps. Users simply downloaded apps from the internet and installed them on their phones. Since its introduction, the app market has grown far beyond anyone's expectations.","screens":["I'd like to start by talking a little bit about the first apps. These were included with each smartphone. These types of apps were placed on the phones to help users access the internet, check emails, send texts and so on. The first apps were designed to increase efficiency at work and allow people to access important information. However, it was the second generation of apps that really changed things. These were downloadable apps. Users simply downloaded apps from the internet and installed them on their phones. Since its introduction, the app market has grown far beyond anyone's expectations."],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/398673776fc51b31c29df5fe05535ca1e93cada9ed8ea228c523988febd37fea.png"}],"kind":"teacher_distributed_publisher_text","sourceBlockIds":[]},{"id":"B03-LS-U06-teacher-text:p056:B","title":"Ex7 Student B 原文","pages":[56],"text":"The first app store was opened in 2008. By 2011, it was reporting over 10 billion downloads and people were using apps more than internet browsers on their phones. And by 2017, an estimated 180 billion apps had been downloaded. These numbers have been growing ever since and they give us a good idea about how popular apps are and how quickly they've developed. People from all over the world use apps for entertainment, travel and communication. So, I'm going to briefly talk about how these apps have changed our lives.","screens":["The first app store was opened in 2008. By 2011, it was reporting over 10 billion downloads and people were using apps more than internet browsers on their phones. And by 2017, an estimated 180 billion apps had been downloaded. These numbers have been growing ever since and they give us a good idea about how popular apps are and how quickly they've developed. People from all over the world use apps for entertainment, travel and communication. So, I'm going to briefly talk about how these apps have changed our lives."],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/398673776fc51b31c29df5fe05535ca1e93cada9ed8ea228c523988febd37fea.png"}],"kind":"teacher_distributed_publisher_text","sourceBlockIds":[]},{"id":"B03-LS-U06-teacher-text:p056:C","title":"Ex7 Student C 原文","pages":[56],"text":"So, now I'd like to mention another important effect of the invention of apps. It has created a whole new IT sector. It is one of the fastest-growing industries and there is a great need for skilled software engineers. But apps have also had some negative effects. For one thing, people have become more helpless because they're so dependent on their phones for information. For example, if they're in a place with no phone signal, they're not very good at asking for and following directions. And apps have made people less patient because they expect to have information immediately. In fact, a recent study found that 87 percent of smartphone users leave a web page if it doesn't load in two seconds.","screens":["So, now I'd like to mention another important effect of the invention of apps. It has created a whole new IT sector. It is one of the fastest-growing industries and there is a great need for skilled software engineers. But apps have also had some negative effects. For one thing, people have become more helpless because they're so dependent on their phones for information. For example, if they're in a place with no phone signal, they're not very good at asking for and following directions. And apps have made people less patient because they expect to have information immediately. In fact, a recent study found that 87 percent of smartphone","users leave a web page if it doesn't load in two seconds."],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/398673776fc51b31c29df5fe05535ca1e93cada9ed8ea228c523988febd37fea.png"}],"kind":"teacher_distributed_publisher_text","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574af "Speaking task","text":"Give a presentation about an invention or a discovery which has changed our lives."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about research scientists."},{"label":"Listening skills","text":"Understand references to earlier ideas; understand lecture organization."},{"label":"Critical thinking","text":"Summarize information using Wh- questions."},{"label":"Grammar","text":"Use passive verb forms."},{"label":"Speaking skills","text":"Preview a topic; organize ideas; explain how something is used."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":124,"alt":""}}]}},{"id":"B03-LS-U06-classroom:resource:b4643","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b21d540f566092ac7c3233aa9e4997e8a39022f90f531353c2c4fae73d2d1525.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"fundamental","pos":"(adj)","definition":"more important than anything else","example":"Trust is fundamental to a strong friendship.","wordAudio":"fundamental","cardWord":false},{"term":"treatment","pos":"(n)","definition":"the use of medicine to make a sick or injured person healthy","example":"The doctor explained the treatment for the infection.","wordAudio":"treatment","cardWord":false},{"term":"immune system","pos":"(n)","definition":"the system in the body that protects it against infection","example":"The immune system helps the body fight infection.","wordAudio":"immune system","cardWord":false},{"term":"vaccine","pos":"(n)","definition":"a special substance that you take into your body to prevent a disease","example":"A vaccine can help protect people from a disease.","wordAudio":"vaccine","cardWord":false},{"term":"cataract","pos":"(n)","definition":"a disease which affects somebody's eye so that they can not see clearly","example":"A cataract made the letters on the page look blurry.","wordAudio":"cataract","cardWord":false},{"term":"pandemic","pos":"(n)","definition":"a dangerous disease that infects many people at the same time","example":"During the pandemic, many people worked from home.","wordAudio":"pandemic","cardWord":false}]]}},{"id":"B03-LS-U06-classroom:video","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/65e7fda8da0d73fa4bbd182877105fcfd1ea996d383bc6e88c0e603372f86dd5.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/1c6ec8ebe079c0ef91431f25-L3LS-U06.mp4","captions":[{"start":0.78,"end":4.4,"text":"Being a research scientist can be an exciting career."},{"start":5.34,"end":6.9,"text":"But what skills are needed?"},{"start":8.42,"end":11.84,"text":"Research scientists have a strong interest in their\nchosen area,"},{"start":12.36,"end":14.5,"text":"normally one of the STEM subjects."},{"start":15.7,"end":16.9,"text":"Science, technology,"},{"start":17.22,"end":18.54,"text":"engineering, or math."},{"start":19.78,"end":22.28,"text":"Asking why and how things happen,"},{"start":23.08,"end":25.38,"text":"testing ideas and evaluating solutions,"},{"start":26.08,"end":27.04,"text":"or critical thinking,"},{"start":27.62,"end":29.3,"text":"is fundamental to science."},{"start":30.64,"end":32.72,"text":"Mental flexibility is essential too,"},{"start":33.14,"end":38.28,"text":"the ability to move from one task to another and think\nof more than one solution to a problem."},{"start":40.56,"end":43.66,"text":"The inventor of the most popular vacuum cleaner in the\nUK,"},{"start":44.02,"end":44.7,"text":"James Dyson,"},{"start":45.14,"end":47.78,"text":"made over five ,000 unsuccessful attempts,"},{"start":48.16,"end":51.12,"text":"the first of which were made with just cardboard and\nsticky tape."},{"start":52.02,"end":59.88,"text":"But he succeeded in producing a vacuum cleaner that\nworked differently from all the others on the market at\nthe time."},{"start":60.84,"end":64.2,"text":"Flexibility helps in adapting to different environments\ntoo."},{"start":64.72,"end":66.74,"text":"Research scientists may work in a laboratory,"},{"start":68,"end":68.84,"text":"a lecture hall,"},{"start":70.16,"end":70.68,"text":"underwater,"},{"start":72.32,"end":72.78,"text":"outdoors,"},{"start":73.74,"end":75.1,"text":"or even in space."},{"start":76.52,"end":82.06,"text":"Successful scientists take the initiative and want to\nmake a real difference to people's lives."},{"start":83.78,"end":87.9,"text":"The laser -faco probe is a device which is used to\nremove cataracts."},{"start":89.22,"end":90.58,"text":"It was invented by Dr."},{"start":90.7,"end":91.46000000000001,"text":"Patricia Bath,"},{"start":91.9,"end":97.34,"text":"who noticed that her African -American patients in New\nYork were more likely to lose their sight."},{"start":98.42,"end":101.16,"text":"Her invention is now used in many countries."},{"start":102.14,"end":106.46000000000001,"text":"Research scientists also need to be good at teamwork\nand collaboration."},{"start":108.1,"end":112.25999999999999,"text":"The company BioNTech was started by scientists Ouzlem\nTureci,"},{"start":112.6,"end":116.5,"text":"Uğur Şahin, and Christoph Huber to research treatment\nfor cancer."},{"start":117.97999999999999,"end":128.44,"text":"This involved research into the immune system, and\nduring the pandemic they were able to partner with the\ndrug company Pfizer to produce a successful vaccine\nagainst COVID -19."},{"start":129.84,"end":136.02,"text":"So if you have a special interest and are keen to\ndevelop the skills, among others, of critical thinking,"},{"start":136.48,"end":136.98,"text":"flexibility,"},{"start":137.44,"end":139.34,"text":"taking initiative, and collaboration,"},{"start":139.9,"end":142.52,"text":"research science may be the career for you."},{"start":143.44,"end":145.54,"text":"Who knows what you may invent?"}],"launchInline":true}},{"id":"B03-LS-U06-classroom:review-1","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9412541091da26aa36288518d0d7c746c5447c1ded4de342b341df74c2eb1613.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-LS-U06-B-002","form":"allow","page":145},{"id":"B03-LS-U06-B-003","form":"app","page":145},{"id":"B03-LS-U06-B-004","form":"contribution","page":145},{"id":"B03-LS-U06-B-005","form":"create","page":145},{"id":"B03-LS-U06-B-006","form":"device","page":145},{"id":"B03-LS-U06-B-007","form":"diagram","page":145},{"id":"B03-LS-U06-B-008","form":"discovery","page":145},{"id":"B03-LS-U06-B-009","form":"industry","page":145},{"id":"B03-LS-U06-B-011","form":"make a comparison","page":145},{"id":"B03-LS-U06-B-012","form":"make a contribution","page":145},{"id":"B03-LS-U06-B-013","form":"make a decision","page":145},{"id":"B03-LS-U06-B-014","form":"make a difference","page":145},{"id":"B03-LS-U06-B-015","form":"make an inv "B03-LS-U06-B-017","form":"make improvements","page":145},{"id":"B03-LS-U06-B-018","form":"make public","page":145},{"id":"B03-LS-U06-B-019","form":"outcome","page":145},{"id":"B03-LS-U06-B-020","form":"product","page":145},{"id":"B03-LS-U06-B-021","form":"scholar","page":145},{"id":"B03-LS-U06-B-022","form":"technology","page":145},{"id":"B03-LS-U06-B-023","form":"user","page":145},{"id":"B03-LS-U06-B-024","form":"weapon","page":145}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"LISTENING 1","pages":[130],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1ad4f98e6f1024cd450767ba2e1dc88b482da341cdec55fc0ec7b7889d12b7ad.png"],"id":"B03-LS-U06-classroom:teaching:B03-LS-p130-01","context":{"moduleLabel":"LISTENING 1","phaseTitle":"POST-LISTENING"},"layout":"list","instruction":"Understanding references to earlier ideas","stageSkill":true,"flow":{"kind":"resource","pages":[{"blocks":[{"kind":"paragraph","text":"To refer to things they talked about earlier, speakers often use words such as <em>it</em>, <em>he</em>, <em>she</em>, <em>they</em>, <em>then</em> and <em>there</em>. This sounds more natural than repeating the same words."},{"kind":"paragraph","text":"In this sentence, the word <em>it</em> refers back to the invention of the telephone:"},{"kind":"examples","lines":["<em>In 1876, Alexander Graham Bell invented <u>the telephone</u>. ← **It** changed the way we communicate.</em>"]}]}]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"LISTENING 1","pages":[131],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99da39898af8bc1099508e0eb682578776de5584cfd890beba15bfa7f1b0dc4e.png"],"id":"B03-LS-U06-classroom:teaching:B03-LS-p131-01","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"layout":"list","instruction":"Weak and strong forms","flow":{"kind":"resource","pages":[{"blocks":[{"kind":"paragraph","text":"In spoken English, people don't usually stress words which do not carry the main meaning in a sentence, such as <em>a</em>, <em>an</em>, <em>in</em>, <em>the</em>, <em>do</em>, <em>does</em>, <em>to</em>, <em>from</em>, <em>and</em> or <em>of</em>. When these words are unstressed, they are called <em>weak forms</em>."},{"kind":"paragraph","text":"The unstressed vowel in these weak forms is pronounced /ə/ (<em>to</em> = /tə/, <em>the</em> = /ðə/, etc.)."},{"kind":"paragraph","text":"However, speakers sometimes stress these types of words to make them the main part of their message. When these words are stressed, they are called <em>strong forms</em>."},{"kind":"examples","lines":["<em>Andrea is funny **and** intelligent.</em> (The speaker is stressing that Andrea has both of these qualities.)"]}]}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"stageSkill":true},{"id":"B03-LS-U06-classroom:teaching:B03-LS-p138-01","book":3,"unit":6,"track":"LS","topic":"DISCOVERY AND INVENTION","lesson":2,"module":"LISTENING 2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[138],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/34b3ffe0bbd13cafcf5bffaf34d754ec434af4b8d80b7c439de223980c6e9b40.png"],"instruction":"Understanding lecture organization","flow":{"kind":"resource","pages":[{"image":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2982f69467d599e9cd027dac7456a9d86dc732fa908ee65e892425786e63b476.png","page":138,"titleInImage":true}]},"stageSkill":true,"layout":"list","provided":""," :true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part 环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B03-LS-U06":{"aspect":1.9591837,"cues":[[1.22,4.48,"Being a research scientist can be an exciting career.","从事科研工作可以是一项令人兴奋的职业。"],[5.39,6.9,"But what skills are needed?","那么，需要具备哪些技能呢？"],[8.16,11.87,"Research scientists have a strong interest in their chosen area,","科研人员对自己选择的领域有浓厚兴趣，"],[12.15,14.27,"normally one of the STEM subjects.","通常是 STEM 学科中的一门。"],[15.67,18.49,"Science, technology, engineering, or math.","也就是科学、技术、工程或数学。"],[19.69,22.31,"Asking why and how things happen,","追问事情为什么发生、怎样发生，"],[22.94,25.44,"testing ideas and evaluating solutions,","检验想法并评估解决办法。"],[25.99,27.27,"or critical thinking,","这就是批判性思维，"],[27.35,29.12,"is fundamental to science.","也是科学的基础。"],[30.52,32.8,"Mental flexibility is essential too,","思维灵活也很重要，"],[33.06,38.36,"the ability to move from one task to another and think of more than one solution to a problem.","也就是能在不同任务之间转换，并为同一个问题想出不止一种解决办法。"],[40.51,43.78,"The inventor of the most popular vacuum cleaner in the UK,","发明了英国最畅销的吸尘器的人，"],[43.87,44.89,"James Dyson,","詹姆斯·戴森，"],[45.04,47.79,"made over 5,000 unsuccessful attempts,","经历了五千多次失败的尝试。"],[48.08,51.12,"the first of which were made with just cardboard and sticky tape.","最早几次试制只用了纸板和胶带。"],[52.51,55.15,"But he succeeded in producing a vacuum cleaner","但他成功做出了一台吸尘器，"],[55.15,58.68,"that worked differently from all the others on the market at the time.","它的工作方式与当时市面上其他吸尘器都不同。"],[60.56,63.91,"Flexibility helps in adapting to different environments too.","灵活性也有助于适应不同的工作环境。"],[64.3,66.87,"Research scientists may work in a laboratory,","科研人员可能在实验室工作，"],[67.86,68.87,"a lecture hall,","也可能在报告厅、"],[69.97,70.94,"underwater,","水下、"],[72.05,73.06,"outdoors,","户外，"],[73.66,75.0,"or even in space.","甚至太空中工作。"],[76.38,81.99,"Successful scientists take the initiative and want to make a real difference to people's lives.","成功的科学家会主动行动，希望真正改变他人的生活。"],[83.69,88.01,"The laser -faco probe is a device which is used to remove cataracts.","激光乳化探针是一种用于去除白内障的设备。"],[89.13,91.55,"It was invented by Dr. Patricia Bath,","它是由帕特里夏·巴斯博士发明的。"],[91.79,97.38,"who noticed that her African-American patients in New York were more likely to lose their sight.","她发现，自己在纽约诊治的非裔美国患者更容易失明。"],[98.4,101.06,"Her invention is now used in many countries.","如今，许多国家都在使用她的发明。"],[102.34,106.54,"Research scientists also need to be good at teamwork and collaboration.","科研人员也需要擅长团队合作。"],[107.99,112.34,"The company BioNTech was started by scientists Ouzlem Tureci,","BioNTech 公司由厄兹莱姆·图雷奇、"],[112.48,116.56,"Uğur Şahin, and Christoph Huber to research treatment for cancer.","乌尔·萨欣和克里斯托夫·胡贝尔共同创立，目的是研究癌症治疗。"],[117.93,120.6,"This involved research into the immune system,","这涉及对免疫系统的研究。"],[120.9,125.14,"and during the pandemic they were able to partner with the drug company Pfizer","疫情期间，他们与辉瑞制药公司合作，"],[125.16,128.57,"to produce a successful vaccine against COVID-19.","成功研制出新冠疫苗。"],[130.18,133.92,"So if you have a special interest and are keen to develop the skills,","所以，如果你对某个领域特别感兴趣，也愿意培养一些技能，"],[133.98,136.14,"among others, of critical thinking,","比如批判性思维、"],[136.26,139.46,"flexibility, taking initiative, and collaboration,","灵活应变、主动性和协作能力，"],[139.58,142.28,"research science may be the career for you.","科研也许就是适合你的职业。"],[143.42,145.79,"Who knows what you may invent?","谁知道你将来会发明些什么呢？"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw. const unit6Pilot=createUnit6Pilot({cases});
function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+
 (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 const pilotBinding=unit6Pilot.bind(c); if(pilotBinding)return pilotBinding;
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;
 const size=c.feedback?.pageSize??(plan?.showAll?Math.max(1,items.length):plan?.kind==="definitions"?3:c.layout==="grid"?6:equalOptions?3:sourceItems.some(x=>x.options?.length>2)?2:4);
 const chunks=items.length?Array.from({length:Math.ceil(items.length/size)},(_,i)=>items.slice(i*size,(i+1)*size)):[[]];
 return {table,equalOptions,bank:equalOptions?sourceItems[0].options:[],chunks,provided,decks};
}
function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){
 return '<div class="split">'+groups.map(group=>'<section class="panel v-block">'+group.map(block=>
  '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';
}
function materialSplit(decks,task,feedback){
 const tabs=decks.map((deck,i)=>'<button type="button" data-deck="'+i+'" aria-pressed="'+(i===0)+'">'+esc(deck.label)+'</button>').join("");
 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+
  '<section class="panel v-block material-task" data-fixed-task aria-label="课堂任务">'+task+'</section></div>';
}
function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages||c.flow)return unit6Pilot.children(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function originalButton(c,page,label){
 return '<button type="button" data-original-case="'+esc(c.id)+'" data-original-page="'+page+'">'+label+'</button>';
}

 const binding=bind(c), readingPage=binding.reading?binding.chunks[p]:null;

 const isGlossary=c.flow?.kind==="glossary";

 const course=unit6Pilot.panels(c,p);

 const video=playback?.type==="video"?playbackHTML(playback,c.flow?.kind!=="video"):"";
 const reader=classroom.reader(c)?'<button type="button" data-reader-toggle aria-expanded="false">读全文</button>':"";

 const photoPage=isOpening?c.flow.pages[p].photo?.sourcePage:null;

 return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="'+esc(base)+'"><link rel="stylesheet" href="assets/classroom-typography.css"><link rel="stylesheet" href="prototype-style.css"><link rel="stylesheet" href="../shared/course-view.css?v=20261126-phase-title-blue"><link rel="stylesheet" href="../unit6/preview.css?v=20261126-listening-ex8-reason-heading"><link rel="stylesheet" href="'+classroomStage.sheet+'"></head><body data-revision="'+revision+'">'+
  '<div class="shell" style="transform:none"><header class="top"><div class="top-context"><div class="identity"><strong>Book '+classroom.bookNumber(c)+'</strong><span>Unit '+esc(c.unit??1)+(isOpening?" "+trackLabel(c.track):" "+esc(c.topic??"Places"))+'</span></div>'+
  '<span class="top-module">'+esc(heading.module)+'</span></div><div class="top-task">'+
  (heading.phase?'<span class="top-phase">'+esc(heading.phase)+'</span>':"")+
  (heading.activity?'<span class="top-activity">'+esc(heading.activity)+'</span>':"")+
  '</div><div class="top-source">'+
  (printedReading?'教材第 '+printedReading+' 页':c.pages.length?'教材第 '+esc(c.pages.join("、"))+' 页':"")+classroomStage.count(p,binding.chunks.length)+'</div>'+audio+'</header>'+
  '<nav class="rail" aria-label="课堂工具"><button type="button" data-move="-1">上一页</button><button type="button" data-move="1">下一页</button><div class="rail-gap"></div>'+

  (readingPage?readingScreen(c,readingPage):'<div class="content'+contentClass+'">'+(isOpening||isGlossary||c.stageSkill?"":unit6Pilot.instruction(c))+content(c,p,binding)+'</div>')+

function resultFor(c){return (c.comparison?comparisonResults:c.flow?lessonResults:results)[c.id];}
function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){
 const host=document.getElementById("preview-size"),scale=Math.min(host.parentElement.clientWidth/1280,maxProjectionScale);
 host.style.width=1280*scale+"px";host.style.height=720*scale+"px";frame.style.transform="scale("+scale+")";
}
function inClassroomOrder(){
 return Boolean(V.lessonFlow&&sequenceView.value==="school");
}
function inOpenings(){
 return sequenceView.value==="openings";
}
function inGlossaries(){
 return sequenceView.value==="glossaries";
}
function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(unit6Pilot.navLabel(step))+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(unit6Pilot.navLabel(step))+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(unit6Pilot.navLabel(step))+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
 return entry+gaps;
}
function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';
  document.getElementById("flow-coverage").textContent="当前显示教材 Ex 的实页验证。";
 }
}
function updateSequenceHeading(){

 const title=glossary?"UNLOCK 任务前 Glossary":opening?"UNLOCK 单元开篇":"Book "+classroom.bookNumber(first)+" Unit "+(first.unit??Number(/-U(\d+)/.exec(first.id)?.[1]))+" "+trackLabel(first.track);
 document.body.dataset.sequence=sequenceView.value;
 document.querySelector(".review-head h1").textContent=document.title=title;
 document.getElementById("review-description").textContent=opening||glossary?"本单元课堂材料。":first.topic??"课堂课件"; document.getElementById("review-description").append("，本机试排");

function changeSequence(){
 updateSequenceHeading();
 const order=navigationOrder();
 if(order.length&&!order.includes(current))display(order[0]);
 else{nav();updateReview();}
}
function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);
 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;
 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";
 const reasons=r?.reasons??c.issues;
 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';
 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");
 if(r?.inlineCheckTest)document.getElementById("metrics").append(" 原位核对检查 "+r.inlineCheckTest.points+" 处。");

function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){

 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();

 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";

 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];

 const references=classroom.related(c);

 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);

  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
