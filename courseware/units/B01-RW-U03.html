 even when the weather is bad,"},{"start":68.32,"end":69.84,"text":"they travel to school."},{"start":71.12,"end":76.18,"text":"Homes in this area only have electricity for 12 hours a\nday."},{"start":77.03999999999999,"end":82.56,"text":"People can sometimes get the Internet on their phones,\nbut it is difficult."},{"start":83.86,"end":89.42,"text":"They have to put the phone outside the window or go out\non the water in a boat."},{"start":90.44,"end":90.84,"text":"Today,"},{"start":91.18,"end":92.32,"text":"that is changing."},{"start":92.84,"end":96.12,"text":"Children here can now use the Internet at school."},{"start":99.82,"end":104.34,"text":"On top of the school building, there is a new satellite\ndish."},{"start":105.22,"end":107.46000000000001,"text":"For 12 hours a day,"},{"start":107.78,"end":109.7,"text":"when the electricity is on,"},{"start":110.1,"end":113.68,"text":"the school building has fast satellite Internet."},{"start":115.96000000000001,"end":118.84,"text":"Diego loves using the Internet for homework."},{"start":119.47999999999999,"end":123.5,"text":"He says it helps him work faster so he can do more."},{"start":124.24,"end":128.2,"text":"But he also loves going out on his dad's fishing boat."},{"start":128.76,"end":130.8,"text":"He wants to be a sailor."},{"start":134.4,"end":137.4,"text":"Carlos has bigger dreams for Diego."},{"start":138.3,"end":141.62,"text":"He wants the Internet to change Diego's future."},{"start":142.57999999999998,"end":148.52,"text":"He hopes the Internet will bring new job opportunities\nfor Diego and his friends."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 fisherman 2 is 3 the internet 4 sailor","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":34,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes": Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer.\n2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light.\n3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight.\n4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun.\n\n$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik","screens":["# LIFE UNDER THE MIDNIGHT SUN","Imagine life with the sun 24 hours a day. What changes can you make to your life?","1 Mandy Logan loves the midnight sun. 'I work in the garden at 3 am if I want to,' she says. Mandy lives in Inuvik in the Northwest Territories in Canada. She works for a Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer.","2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light.","3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight.","4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun.","$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik"],"sources":[{"page":63,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/c , the days are longer in the summer. We don’t\nsunbathe at midnight in my country and we don’t garden\nin the night.\n4 The people in Inuvik live differently to me. They eat\nlunch at different times and cook food when I sleep. They\ngo fishing at night and swimming at night. I go swimming\nin the afternoon. I do not want to live in Inuvik. It has\nlight 24 hours a day in the summer, and it is cold in winter.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U03-question:b1914","book":1,"unit":3,"track":"RW","topic":"LIFESTYLE","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Ask and answer the questions about Abdullah. If you can't remember the answer, look at the text on page 66 for help.","pages":[72],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/68e82f19bd9efecca50f59aa8a94b43ab05793e79b0b70fb4244fc32ed44d8f6.png"],"provided":"","items":[{"id":"b1914.i01","label":"1","prompt":"What is Abdullah's surname?","options":[],"type":"qa/open"},{"id":"b1914.i02","label":"2","prompt":"What university does Abdullah go to?","options":[],"type":"qa/open"},{"id":"b1914.i03","label":"3","prompt":"What courses does he take?","options":[],"type":"qa/open"},{"id":"b1914.i04","label":"4","prompt":"When does he get up?","options":[],"type":"qa/open"},{"id":"b1914.i05","label":"5","prompt":"When are his classes?","options":[],"type":"qa/open"},{"id":"b1914.i06","label":"6","prompt":"When does he meet with his study group?","options":[],"type":"qa/open"}, in idea in the example is that Abdullah is a student. The details give more information about Abdullah's life as a student. They talk about his school, timetable and courses. Remember that when you write, the details need to be about the main idea.","screens":["A main idea says what a paragraph is about. The details add information about the main idea.","main idea","details","Abdullah Taha is a student in my class. He has a busy timetable. Abdullah studies Engineering at Cairo University. He takes five courses. They are Physics, Maths, English, Engineering and Arab History. His favourite subjects are Physics and Maths.","The main idea is often at the beginning of the paragraph. Then the writer writes details after it. They give more information and explain the main idea.","The main idea in the example is that Abdullah is a student. The details give more information about Abdullah's life as a student. They talk about his school, timetable and courses. Remember that when you write, the details need to be about the main idea."],"sources":[{"page":76,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9da59f2c1122014c0ca108ab85deb5eac8a45bb687b154310ae60f8e1c3379cc.png"}],"kind":"resource","sourceBlockIds":["b1930"]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[{"page":77,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d18167118a9dd34734778f1b9ed57114dc586f8f9f28ef0b11374d172f81d27.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U03-question:b1936","book":1,"unit":3,"track":"RW","topic":"LIFESTYLE","lesson":2,"order":45,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Read the Task checklist below as you prepare your sen example":"The trip gave me an opportunity to practise English.","wordAudio":"opportunity","cardWord":true},{"term":"education","pos":"(n)","definition":"the process of teaching and learning in a school or college","example":"Every child should have access to education.","wordAudio":"education","cardWord":false},{"term":"satellite dish","pos":"(n)","definition":"a round piece of equipment that receives television and radio signals broadcast from satellites","example":"The satellite dish on the roof picks up television signals.","wordAudio":"satellite dish","cardWord":false},{"term":"sailor","pos":"(n)","definition":"somebody who sails ships or boats as their job or as a sport","example":"The sailor worked on a ship for ten years.","wordAudio":"sailor","cardWord":false},{"term":"dreams","pos":"(n)","definition":"something you want to happen although it is not very likely","example":"One of my dreams is to travel around the world.","wordAudio":"dreams","cardWord":false}]]}},{"id":"B01-RW-U03-classroom:video","book":1,"unit":3,"track":"RW","topic":"LIFESTYLE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6e5088f85ef105fe21a39ededf5c941e85774cd6d81188bd988ec2d84628e97.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/9a627ea5e881912e927deb12-L1RW-U03.mp4","captions":[{"start":0,"end":4.92,"text":"This is the Rilangkavi Estuary in Chile."},{"start":5.5,"end":8.26,"text":"It's a difficult place to travel to."},{"start":9.5,"end":12.54,"text":"On one side there are the Andes Mountains."},{"start":13.86,"end":17.1,"text":"And on the other side is the Pacific Ocean."},{"start":18.38,"end":23.2,"text":"The only way to travel between the small villages is by\nboat."},{"start":24.74,"end":29.32,"text":"People here make money by catching mussels like these."},{"start":30.88,"end":36.32,"text":"40 -year -old fisherman Carlos Guero says he loves\nliving here."},{"start":36.86,"end":39.58,"text":"It's a quiet life and his family has"},{"start":39.58,"end":39.9,"text":"no"},{"start":39.9,"end":40.54,"text":"stress."},{"start":42.62,"end":43.52,"text":"Every morning,"},{"start":44,"end":47.38,"text":"Carlos takes his seven -year -old son Diego to school."},{"start":48.22,"end":50.04,"text":"They walk for 30 minutes,"},{"start":50.4,"end":52.68,"text":"then go to the school by boat."},{"start":53.62,"end":55.82,"text":"When Carlos was a boy,"},{"start":56.56,"end":59.34,"text":"he didn't have the opportunity to go to school."},{"start":60.18,"end":64.62,"text":"He thinks it's very important for Diego to have a good\neducation."},{"start":65.52,"end":67.92,"text":"So, even when the weather is bad,"},{"start":68.32,"end":69.84,"text":"they travel to school."},{"start":71.12,"end":76.18,"text":"Homes in this area only have electricity for 12 hours a\nday."},{"start":77.03999999999999,"end":82.56,"text":"People can sometimes get the Internet on their phones,\nbut it is difficult."},{"start":83.86,"end":89.42,"text":"They have to put the phone outside the window or go out\non the water in a boat."},{"start":90.44,"end":90.84,"text":"Today,"},{"start":91.18,"end":92.32,"text":"that is changing."},{"start":92.84,"end":96.12,"text":"Children here can now use the Internet at school."},{"start":99.82,"end":104.34,"text":"On top of the school building, there is a new satellite\ndish."},{"start":105.22,"end":107.46000000000001,"text":"For 12 hours a day,"},{"start":107.78,"end":109.7,"text":"when the electricity is on,"},{"start":110.1,"end":113.68,"text":"the school building has fast satellite Internet."},{"start":115.96000000000001,"end":118.84,"text":"Diego loves using the Internet for homework."},{"start":119.47999999999999,"end":123.5,"text":"He says it helps him work faster so he can do more."},{"start":124.24,"end":128.2,"text":"But he also loves going out on his dad's fishing boat."},{"start":128.76,"end":130.8,"text":"He wants to be a sailor."},{"start":134.4,"end":137.4,"text":"Carlos has bigger dreams for Diego."},{"start":138.3,"end":141.62,"text":"He wants the Internet to change Diego's future."},{"start":142.57999999999998,"end":148.52,"text":"He hopes the Internet will bring new job opportunities\nfor Diego and his friends."}],"launchInline":true}},{"id":"B01-RW-U03-classroom:material:RW-M03","book":1,"unit":3,"track":"RW","topic":"LIFESTYLE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[63],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/39fe7c04177a7dab3fed69dde2f05e051a2439df87a6bd51bb9aba92fe305fc5.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# LIFE UNDER THE MIDNIGHT SUN\nImagine life with the sun 24 hours a day. What changes can you make to your life?\n1 Mandy Logan loves the midnight sun. 'I work in the garden at 3 am if I want to,' she says. Mandy lives in Inuvik in the Northwest Territories in Canada. She works for a Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer.\n2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light.\n3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight.\n4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun.","sourcePage":63},{"body":"$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik","sourcePage":63}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U03-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"LIFE UNDER THE MIDNIGHT SUN","pages":[{"page":63,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/39fe7c04177a7dab3fed69dde2f05e051a2439df87a6bd51bb9aba92fe305fc5.png","width":772,"height":1040}],"source":63,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# LIFE UNDER THE MIDNIGHT SUN\nImagine life with the sun 24 hours a day. What changes can you make to your life?\n1 Mandy Logan loves the midnight sun. 'I work in the garden at 3 am if I want to,' she says. Mandy lives in Inuvik in the Northwest Territories in Canada. She works for a Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer.\n2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light.\n3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight.\n4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun.","sourcePage":63},{"body":"$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik","sourcePage":63}],"text":"# LIFE UNDER THE MIDNIGHT SUN\nImagine l . She works for a Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer.\n2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light.\n3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight.\n4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun.\n\n$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b1875"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9d77f24f842881617e8ab08c98946b3ef05ac7f9c9ddf1d9dad3142e67877324.mp3","continueOnPage":true}},{"id":"B01-RW-U03-classroom:review-1","book":1,"unit":3,"track":"RW","topic":"LIFESTYLE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[79],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d218abdd457eaf3d8232c948b50c1b9e90cff4400d4c74d9fd92204df9a8fa3.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B01-RW-U03-B-001","form":"afternoon","page":79},{"id":"B01-RW-U03-B-002","form":"Art","page":79},{"id":"B01-RW-U03-B-003","form":"Biology","page":79},{"id":"B01-RW-U03-B-004","form":"breakfast","page":79},{"id":"B01-RW-U03-B-005","form":"Business","page":79},{"id 0,"text":"It is easy to get to my house. First, walk (1) __ the High Street. Go (2) __ the bank and (3) __ the bridge. Then walk (4) __ the park and (5) __ the next bridge. Go (6) __ the tunnel – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-RW-U03-question:b1910":{"rows":{"b1910.i01":{"mode":"choice","option":1},"b1910.i02":{"mode":"choice","option":2},"b1910.i03":{"mode":"choice","option":0},"b1910.i04":{"mode":"choice","option":2},"b1910.i05":{"mode":"choice","options":[0,1]},"b1910.i06":{"mode":"choice","options":[0,2]},"b1910.i07":{"mode":"choice","option":2},"b1910.i08":{"mode":"choice","option":0}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-RW-U03-question:b1889":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"textFills":[{"part":1,"block":2,"values":["f","b","e","a","d","c"],"text":"1 __ 2 __ 3 __ 4 __ 5 __ 6 __"}],"tableEdits":[]},"B01-RW-U03-question:b1938":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"textFills":[{"part":0,"block":0,"values":["b","a","c"],"text":"Jack is a student in my Environmental Sciences class at the University of Brighton. (1)__ He studies Chemistry, Geography, Ecology and Statistics. He gets up at 7:30 am every day and he has his breakfast at 7:45 am. (2)__ He has lunch at 1 pm. He studies in the library on Mondays, Wednesdays and Fridays from 1:30 pm to 5:30 pm. (3)__ He plays football every Saturday with his friends from university."}],"tableEdits":[]},"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B01-RW-U03-classroom:material:RW-M03":[{"body":"# LIFE UNDER THE MIDNIGHT SUN\nImagine life with the sun 24 hours a day. What changes can you make to your life?","sourcePage":63,"blocks":[{"kind":"text","text":"# LIFE UNDER THE MIDNIGHT SUN"},{"kind":"text","text":"Imagine life with the sun 24 hours a day. What changes can you make to your life?"}]},{"body":"1 Mandy Logan loves the midnight sun. 'I work in the garden at 3 am if I want to,' she says. Mandy lives in Inuvik in the Northwest Territories in Canada. She works for a Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer.","sourcePage":63,"blocks":[{"kind":"text","text":"1 Mandy Logan loves the midnight sun. 'I work in the garden at 3 am if I want to,' she says. Mandy lives in Inuvik in the Northwest Territories in Canada. She works for a Community Greenhouse $^{1}$ that grows fruit and vegetables in the summer."}]},{"body":"2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light.","sourcePage":63,"blocks":[{"kind":"text","text":"2 In the winter in Inuvik, it's always cold and dark. But in summer, there is light 24 hours a day. People there sleep less. They want to enjoy life and do lots of different things when they have light."}]},{"body":"3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight.","sourcePage":63,"blocks":[{"kind":"text","text":"3 People cook lunch at 2 am, they go to bed in the morning and get up early in the afternoon. Or maybe at 10:30 pm you go fishing or go for a swim. You can sunbathe at midnight."}]},{"body":"4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun.","sourcePage":63,"blocks":[{"kind":"text","text":"4 Fruit and vegetables are also different in the summer. 'Everything grows really fast between April and August,' says Mandy. People and plants all change under the midnight sun."}]},{"body":"$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik","sourcePage":63,"blocks":[{"kind":"text","text":"$^{1}$ Community Greenhouse (n phr) a building made of glass for growing plants in; for the community – everyone who lives in Inuvik"}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":" 庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-RW-U03":{"aspect":1.9085487,"cues":[[0,4.92,"This is the Rilangkavi Estuary in Chile.","这是智利的Rilangkavi Estuary。"],[5.5,8.26,"It's a difficult place to travel to.","远行难处。"],[9.5,12.54,"On one side there are the Andes Mountains.","一边是安第斯山脉。"],[13.86,17.1,"And on the other side is the Pacific Ocean.","而另一边则是太平洋。"],[18.38,23.2,"The only way to travel between the small villages is by boat.","在小村庄之间旅行的唯一方式是乘船。"],[24.74,29.32,"People here make money by catching mussels like these.","这里的人靠抓这种贻贝赚钱。"],[30.88,36.32,"40 -year -old fisherman Carlos Guero says he loves living here.","40岁的渔夫Carlos Guero说他喜欢住在这里"],[36.86,39.58,"It's a quiet life and his family has","这是一个安静的生活，他的家人有"],[39.58,39.9,"no","无"],[39.9,40.54,"stress.","压力。"],[42.62,43.52,"Every morning,","每天早上，我都会。.. ..."],[44,47.38,"Carlos takes his seven -year -old son Diego to school.","Carlos把他7岁的儿子Diego带到学校去"],[48.22,50.04,"They walk for 30 minutes,","他们走了30分钟，"],[50.4,52.68,"then go to the school by boat.","然后坐船去学校。"],[53.62,55.82,"When Carlos was a boy,","当卡洛斯还是个孩子时，"],[56.56,59.34,"he didn't have the opportunity to go to school.","他没有机会上学"],[60.18,64.62,"He thinks it's very important for Diego to have a good education.","他认为蒂亚戈有良好的教育是非常重要的。"],[65.52,67.92,"So, even when the weather is bad,","所以，即使天气不好，"],[68.32,69.84,"they travel to school.","他们去上学。"],[71.12,76.18,"Homes in this area only have electricity for 12 hours a day.","这一地区的家庭每天只有12小时的电力。"],[77.03999999999999,82.56,"People can sometimes get the Internet on their phones, but it is difficult.","人们有时可以上网，但这很困难。"],[83.86,89.42,"They have to put the phone outside the window or go out on the water in a boat.","他们必须把电话放在窗外，或者用船去水上。"],[90.44,90.84,"Today,","今天，我们。.."],[91.18,92.32,"that is changing.","这正在改变。"],[92.84,96.12,"Children here can now use the Internet at school.","这里的儿童现在可以在学校使用互联网。"],[99.82,104.34,"On top of the school building, there is a new satellite dish.","校舍上方有新的卫星天线。"],[105.22,107.46000000000001,"For 12 hours a day,","每天12小时"],[107.78,109.7,"when the electricity is on,","当电响起的时候，"],[110.1,113.68,"the school building has fast satellite Internet.","校舍有快速卫星互联网。"],[115.96000000000001,118.84,"Diego loves using the Internet for homework.","迭戈喜欢利用互联网做家庭作业。"],[119.47999999999999,123.5,"He says it helps him work faster so he can do more.","他说这能帮助他更快地工作这样他才能做得更多"],[124.24,128.2,"But he also loves going out on his dad's fishing boat.","但他也喜欢去他爸爸的渔船上"],[128.76,130.8,"He wants to be a sailor.","他想当水手"],[134.4,137.4,"Carlos has bigger dreams for Diego.","卡洛斯对迭戈有更大的梦想。"],[138.3,141.62,"He wants the Internet to change Diego's future.","他希望互联网能改变迭戈的未来。"],[142.57999999999998,148.52,"He hopes the Internet will bring new job opportunities for Diego and his friends.","他希望互联网能为迭戈和他的朋友带来新的就业机会。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B01-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/43bc79d96c1ab4c1c65fd30680983178026a8a97dcc42e2a052e66e91158d0e8.pdf","size":28669491},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e0    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

 }

function wireMaterials(doc,c,decks){

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);

async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();

  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;

 if(decks.length)wireMaterials(doc,c,decks);

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
