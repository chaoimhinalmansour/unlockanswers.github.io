 not true but is believed by many people","example":"The guide explained why the popular story was a myth.","wordAudio":"myth","cardWord":false},{"term":"unachievable","pos":"(adj)","definition":"something that is impossible to achieve","example":"With so little time, the target seemed unachievable.","wordAudio":"unachievable","cardWord":false},{"term":"impulsive","pos":"(adj)","definition":"showing behaviour in which you do things suddenly without any planning","example":"It was an impulsive purchase that he regretted the next day.","wordAudio":"impulsive","cardWord":false},{"term":"immune system","pos":"(n)","definition":"the cells and tissues in the body that make it able to protect itself against infection","example":"The immune system helps us fight infection.","wordAudio":"immune system","cardWord":false},{"term":"allergy","pos":"(n)","definition":"a condition that makes people become sick or develop skin or breathing problems because they have eaten certain foods or been near certain substances.","example":"She checks every label because she has a nut allergy.","wordAudio":"allergy","cardWord":false}]]}},{"id":"B04-RW-U08-classroom:video","book":4,"unit":8,"track":"RW","topic":"AGEING","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c4f1675583e7c585381d7f3827b315c1328ff2104419ed41e856549d28afa539.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/92bf437a446f89b4d688e6dd-L4RW-U08.mp4","captions":[{"start":0.86,"end":5.58,"text":"There's an old saying that your school days are the\nhappiest days of your life."},{"start":6.14,"end":8.4,"text":"Wouldn't life be disappointing if that were true?"},{"start":9.28,"end":11.42,"text":"Growing old is a common fear."},{"start":12,"end":13.48,"text":"According to many researchers,"},{"start":13.88,"end":19.52,"text":"it's a myth that youth is the most enjoyable or even\nthe healthiest time of your life."},{"start":20.58,"end":23.24,"text":"Aging comes with some significant benefits."},{"start":24.05,"end":36.18,"text":"A long -term study of 60 ,000 people in Australia,\nBritain and Germany found that we're at our happiest in\nour 60s and 70s after we retire from work."},{"start":36.88,"end":40.6,"text":"One possible reason for this is that our relationships\nimprove."},{"start":41.46,"end":47.74,"text":"We focus on the people we love and have more\nopportunities to be part of meaningful communities."},{"start":48.4,"end":55.52,"text":"In our 20s and 30s, we may sacrifice the things that\nmake us happy in order to climb the career ladder."},{"start":56.42,"end":57.96,"text":"However, as we age,"},{"start":58.38,"end":60.54,"text":"we forget unachievable ambitions."},{"start":61.5,"end":72.38,"text":"Some psychologists believe this makes us less happy in\nmiddle age, but most agree that by our 50s and 60s, we\nare better at accepting the lives we have."},{"start":72.94,"end":75.14,"text":"Age also gives us new skills."},{"start":76.03999999999999,"end":80.18,"text":"Life experience teaches us to avoid things that make us\nunhappy."},{"start":81.08,"end":85.62,"text":"When arguments or problems arise, we have strategies to\ndeal with them."},{"start":86.24,"end":90.36,"text":"Changes in our brains mean we are less anxious and less\nimpulsive."},{"start":91.12,"end":93.22,"text":"Our bodies and our brains improve,"},{"start":93.56,"end":93.68,"text":"too."},{"start":94.08,"end":100.1,"text":"The immune system works best in our 50s and 60s, so we\nget fewer colds."},{"start":100.34,"end":104.4,"text":"Our bodies recognize viruses and deal with them more\nefficiently."},{"start":105.14,"end":105.82,"text":"Allergies,"},{"start":106.18,"end":109.68,"text":"too, may disappear as our bodies adjust to our\nenvironments."},{"start":111.25999999999999,"end":113.56,"text":"Although we forget more in later life,"},{"start":114,"end":118.5,"text":"many mental abilities are better in our 50s than they\nwere in our 20s."},{"start":119.5,"end":122.26,"text":"Of course, there are disadvantages to aging,"},{"start":122.78,"end":122.88,"text":"too."},{"start":123.2,"end":128.24,"text":"And in countries where there isn't a great deal of\nsupport for elderly people,"},{"start":128.62,"end":131.54,"text":"poverty and loneliness may affect their happiness."},{"start":132.36,"end":135.18,"text":"But if this research can teach us anything,"},{"start":135.76,"end":137.56,"text":"it's not to fear getting older."},{"start":138.1,"end":140.2,"text":"The best may be yet to come."}],"launchInline":true}},{"id":"B04-RW-U08-classroom:material:RW-M03","book":4,"unit":8,"track":"RW","topic":"AGEING","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d1fccff0d9de5ec83732430eaeaf1de6aa38d24e89e6d727ce93cee7b8ff8812.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING\nIn the next instalment of our series on demographic changes, we interview Professor Robert Huffenheimer, an expert on the phenomenon of ageing.\n1 What exactly does ageing mean?\nIt means the population in many countries is, on average, getting older. According to a United Nations report, in 2050, there will be more people over the age of 60 than children under 16 for the first time in history.\n2 What impact is this ageing process likely to have globally?\nWell, obviously it is a good thing that people are living longer, but as a result of this, there are a number of issues which have to be dealt with.\n3 For example?","sourcePage":173},{"body":"In certain countries, an increasing number of older people are living by themselves, often without any relatives living nearby. The UN reports that 40% of the world's older population lives independently. Some older people are simply unable to take care of themselves, and others can only do so if their houses are specially adapted. Likewise, they may be unable to go shopping or wash themselves. Consequently, they need someone, perhaps a professional, to help. And, of course, older people need social activities as well.\n4 And how are societies adapting to this?","sourcePage":173},{"body":"Supermarkets, for example, have introduced more home-delivery services, which have been particularly beneficial for older people. In addition, there has been significant growth in companies providing services which would traditionally have been undertaken by relatives. These include private nursing care and 'Meals on Wheels' services, which deliver food to your door. In the USA, for example, Meals on Wheels serves nearly 2.2 million elderly people across the country, many of whom are living alone or isolated, according to the Urban Institute.\n5 Are there any other areas where the impact of ageing can be clearly seen?","sourcePage":173},{"body":"Although it is not a problem yet, many governments are worried about the economic impact of an ageing population. Fewer citizens working and paying taxes obviously results in less money for the government to pay for things like health and education. NBC World News recently reported that in Italy, which has Europe's oldest population, people are now living 30 to 40 years beyond retirement. This means that the number of needy pensioners¹ is rising.\n6 What advantages can an older population bring?","sourcePage":173},{"body":"Countries with a high percentage of young people need to spend a lot of money on education. In contrast, countries with a lower percentage of children have fewer education costs. In more developed countries, older people tend to have more savings and more leisure time. In Japan, for example, according to Bloomberg News, the popularity of luxury train travel among older Japanese people has exploded. Consequently, luxury routes are often sold out. Other elderly people may spend more time online or even go back to studying. Of course, older people do have a lot of experience, and if they can, some continue working in a voluntary capacity after they retire². This kind of activity adds a lot to society.\n¹ pensioner (n) a retired person who receives government money for living expenses\n² retire (v) to leave your job or stop working because of having reached a particular age","sourcePage":173}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U08-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING","pages":[{"page":173,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d1fccff0d9de5ec83732430eaeaf1de6aa38d24e89e6d727ce93cee7b8ff8812.png","width":3040,"height":4096}],"source":173,"embeddedIn":null,"photo":null,"clearPages":[{"body":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING\nIn the next instalment of our series on demographic changes, we interview Professor Robert Huffenheimer, an expert on the phenomenon of ageing.\n1 What exactly does ageing mean?\nIt means the population in many countries is, on average, getting older. According to a United Nations report, in 2050, there will be more people over the age of 60 than children under 16 for the first time in history.\n2 What impact is this ageing process likely to have globally?\nWell, obviously it is a good thing that people are living longer, but as a result of this, there are a number of issues which have to be dealt with.\n3 For example?","sourcePage":173},{"body":"In certain countries, an increasing number of older people are living by themselves, often without any relatives living nearby. The UN reports that 40% of the world's older population lives independently. Some older people are simply unable to take care of themselves, and others can only do so if their houses are specially adapted. Likewise, they may be unable to go shopping or wash themselves. Consequently, they need someone, perhaps a professional, to help. And, of course, older people need social activities as well.\n4 And how are societies adapting to this?","sourcePage":173},{"body":"Supermarkets, for example, have introduced more home-delivery services, which have been particularly beneficial for older people. In addition, there has been significant growth in companies providing services which would traditionally have been undertaken by relatives. These include private nursing care and 'Meals on Wheels' services, which deliver food to your door. In the USA, for example, Meals on Wheels serves nearly 2.2 million elderly people across the country, many of whom are living alone or isolated, according to the Urban Institute.\n5 Are there any other areas where the impact of ageing can be clearly seen?","sourcePage":173},{"body":"Although it is not a problem yet, many governments are worried about the economic impact of an ageing population. Fewer citizens working and paying taxes obviously results in less money for the government to pay for things like health and education. NBC World News recently reported that in Italy, which has Europe's oldest population, people are now living 30 to 40 years beyond retirement. This means that the number of needy pensioners¹ is rising.\n6 What advantages can an older population bring?","sourcePage":173},{"body":"Countries with a high percentage of young people need to spend a lot of money on education. In contrast, countries with a lower percentage of children have fewer education costs. In more developed countries, older people tend to have more savings and more leisure time. In Japan, for example, according to Bloomberg News, the popularity of luxury train travel among older Japanese people has exploded. Consequently, luxury routes are often sold out. Other elderly people may spend more time online or even go back to studying. Of course, older people do have a lot of experience, and if they can, some continue working in a voluntary capacity after they retire². This kind of activity adds a lot to society.\n¹ pensioner (n) a retired person who receives government money for living expenses\n² retire (v) to leave your job or stop working because of having reached a particular age","sourcePage":173}],"text":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING\nIn the next instalment of our series on demographic changes, we interview Professor Robert Huffenheimer, an expert on the phenomenon of ageing.\n1 What exactly does ageing mean?\nIt means the population in many countries is, on average, getting older. According to a United Nations report, in 2050, there will be more people over the age of 60 than children under 16 for the first time in history.\n2 What impact is this ageing process likely to have globally?\nWell, obviously it is a good thing that people are living longer, but as a result of this, there are a number of issues which have to be dealt with.\n3 For example?\nIn certain countries, an increasing number of older people are living by themselves, often without any relatives living nearby. The UN reports that 40% of the world's older population lives independently. Some older people are simply unable to take care of themselves, and others can only do so if their houses are specially adapted. Likewise, they may be unable to go shopping or wash themselves. Consequently, they need someone, perhaps a professional, to help. And, of course, older people need social activities as well.\n4 And how are societies adapting to this?\nSupermarkets, for example, have introduced more home-delivery services, which have been particularly beneficial for older people. In addition, there has been significant growth in companies providing services which would traditionally have been undertaken by relatives. These include private nursing care and 'Meals on Wheels' services, which deliver food to your door. In the USA, for example, Meals on Wheels serves nearly 2.2 million elderly people across the country, many of whom are living alone or isolated, according to the Urban Institute.\n5 Are there any other areas where the impact of ageing can be clearly seen?\nAlthough it is not a problem yet, many governments are worried about the economic impact of an ageing population. Fewer citizens working and paying taxes obviously results in less money for the government to pay for things like health and education. NBC World News recently reported that in Italy, which has Europe's oldest population, people are now living 30 to 40 years beyond retirement. This means that the number of needy pensioners¹ is rising.\n6 What advantages can an older population bring?\nCountries with a high percentage of young people need to spend a lot of money on education. In contrast, countries with a lower percentage of children have fewer education costs. In more developed countries, older people tend to have more savings and more leisure time. In Japan, for example, according to Bloomberg News, the popularity of luxury train travel among older Japanese people has exploded. Consequently, luxury routes are often sold out. Other elderly people may spend more time online or even go back to studying. Of course, older people do have a lot of experience, and if they can, some continue working in a voluntary capacity after they retire². This kind of activity adds a lot to society.\n¹ pensioner (n) a retired person who receives government money for living expenses\n² retire (v) to leave your job or stop working because of having reached a particular age","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae053c2979877513ba664de44bf405d96816f646b9cbeefd4775451a362cd6f1.mp3"},"original":{"id":"B04-RW-U08-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U08","book":4,"track":"RW","unit":8,"title":"READING 1","kind":"material","pages":[173],"sourceImages":[{"page":173,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d1fccff0d9de5ec83732430eaeaf1de6aa38d24e89e6d727ce93cee7b8ff8812.png","viewEvidenceReported":true}],"text":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING\n\nIn the next instalment of our series on demographic changes, we interview Professor Robert Huffenheimer, an expert on the phenomenon of ageing.\n\n1 What exactly does ageing mean?\n\nIt means the population in many countries is, on average, getting older. According to a United Nations report, in 2050, there will be more people over the age of 60 than children under 16 for the first time in history.\n\n2 What impact is this ageing process likely to have globally?\n\nWell, obviously it is a good thing that people are living longer, but as a result of this, there are a number of issues which have to be dealt with.\n\n3 For example?\n\nIn certain countries, an increasing number of older people are living by themselves, often without any relatives living nearby. The UN reports that 40% of the world's older population lives independently. Some older people are simply unable to take care of themselves, and others can only do so if their houses are specially adapted. Likewise, they may be unable to go shopping or wash themselves. Consequently, they need someone, perhaps a professional, to help. And, of course, older people need social activities as well.\n\n4 And how are societies adapting to this?\n\nSupermarkets, for example, have introduced more home-delivery services, which have been particularly beneficial for older people. In addition, there has been significant growth in companies providing services which would traditionally have been undertaken by relatives. These include private nursing care and 'Meals on Wheels' services, which deliver food to your door. In the USA, for example, Meals on Wheels serves nearly 2.2 million elderly people across the country, many of whom are living alone or isolated, according to the Urban Institute.\n\n5 Are there any other areas where the impact of ageing can be clearly seen?\n\nAlthough it is not a problem yet, many governments are worried about the economic impact of an ageing population. Fewer citizens working and paying taxes obviously results in less money for the government to pay for things like health and education. NBC World News recently reported that in Italy, which has Europe's oldest population, people are now living 30 to 40 years beyond retirement. This means that the number of needy pensioners¹ is rising.\n\n6 What advantages can an older population bring?\n\nCountries with a high percentage of young people need to spend a lot of money on education. In contrast, countries with a lower percentage of children have fewer education costs. In more developed countries, older people tend to have more savings and more leisure time. In Japan, for example, according to Bloomberg News, the popularity of luxury train travel among older Japanese people has exploded. Consequently, luxury routes are often sold out. Other elderly people may spend more time online or even go back to studying. Of course, older people do have a lot of experience, and if they can, some continue working in a voluntary capacity after they retire². This kind of activity adds a lot to society.\n\n¹ pensioner (n) a retired person who receives government money for living expenses\n\n² retire (v) to leave your job or stop working because of having reached a particular age","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b7177"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae053c2979877513ba664de44bf405d96816f646b9cbeefd4775451a362cd6f1.mp3","continueOnPage":true}},{"id":"B04-RW-U08-classroom:material:RW-M04","book":4,"unit":8,"track":"RW","topic":"AGEING","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/22e1929fb83d030212859427dc67bd6226fe85249acbd484a854be952bb2bca7.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"What are the impacts of a young population on a society?\nThere is a well-documented problem with the ageing of the global population, but there are also areas of the world where the demographics are very different. In many parts of the Middle East and North Africa, there is a much higher proportion of young people. The Kingdom of Saudi Arabia, a country of over 35 million people, is one such place. This reality has brought special challenges to the Kingdom in a number of different areas such as education, housing and the economy.","sourcePage":177},{"body":"2 The population graph shows the population of men and women in Saudi Arabia and their age ranges in 2023. The graph shows Saudi Arabia has a very young population. Upon close analysis, it can be seen that about 24% of the population is aged 14 and under, and approximately 13% of the total population is between the ages of 15 and 24. The number of Saudis in their mid-twenties to mid-fifties is particularly high, with almost 52% of the total population falling within this age range. In the United States the median age is 38, in the United Kingdom it is 40, in Italy it is 47 and in Japan it is 49. In contrast, Saudi Arabia is more youthful, as the median age is 30.5.","sourcePage":177},{"body":"3 The high percentage of children and young people leads to high education costs in Saudi Arabia. The focus on education is a high priority for Saudi society. A recent report showed that education receives 17% of the government's annual budget, making the country's education spending one of the highest in the world. As a result of its demographic profile, the government has been leading a university expansion programme to cope with the large number of college-aged students moving through the school system every year.\n4 This also has an impact on employment opportunities for young people. Youth unemployment could well become the Kingdom's biggest social challenge in the coming years. These days, the unemployment rate for Saudis between the ages of 15 and 24 is 33%. Unless Saudi Arabia's government can provide enough public-sector jobs, or attract more private-sector employers, more budget expenditure will be needed for unemployment benefits.","sourcePage":177},{"body":"5 There is a similar challenge in terms of housing, with more demand than supply. This is a particular problem in places such as Jeddah, Saudi Arabia's second-largest city. Jeddah is on the coast, with a mountain range to the east. Because of this, outward expansion is geographically impossible. As a consequence, houses have become more expensive, and young people may be unable to buy their own homes.\n6 Although Saudi Arabia faces several challenges in terms of education, employment and housing as a result of its young population, it does not have to cope with the demands of an ageing population. Because the country has relatively fewer old people than the places mentioned earlier, the costs of healthcare and pensions are lower. This will allow more funds to be allocated to improving the lives of young people.","sourcePage":177}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U08-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"What are the impacts of a young population on a society?","pages":[{"page":177,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/22e1929fb83d030212859427dc67bd6226fe85249acbd484a854be952bb2bca7.png","width":3040,"height":4096}],"source":177,"embeddedIn":null,"photo":null,"clearPages":[{"body":"What are the impacts of a young population on a society?\nThere is a well-documented problem with the ageing of the global population, but there are also areas of the world where the demographics are very different. In many parts of the Middle East and North Africa, there is a much higher proportion of young people. The Kingdom of Saudi Arabia, a country of over 35 million people, is one such place. This reality has brought special challenges to the Kingdom in a number of different areas such as education, housing and the economy.","sourcePage":177},{"body":"2 The population graph shows the population of men and women in Saudi Arabia and their age ranges in 2023. The graph shows Saudi Arabia has a very young population. Upon close analysis, it can be seen that about 24% of the population is aged 14 and under, and approximately 13% of the total population is between the ages of 15 and 24. The number of Saudis in their mid-twenties to mid-fifties is particularly high, with almost 52% of the total population falling within this age range. In the United States the median age is 38, in the United Kingdom it is 40, in Italy it is 47 and in Japan it is 49. In contrast, Saudi Arabia is more youthful, as the median age is 30.5.","sourcePage":177},{"body":"3 The high percentage of children and young people leads to high education costs in Saudi Arabia. The focus on education is a high priority for Saudi society. A recent report showed that education receives 17% of the government's annual budget, making the country's education spending one of the highest in the world. As a result of its demographic profile, the government has been leading a university expansion programme to cope with the large number of college-aged students moving through the school system every year.\n4 This also has an impact on employment opportunities for young people. Youth unemployment could well become the Kingdom's biggest social challenge in the coming years. These days, the unemployment rate for Saudis between the ages of 15 and 24 is 33%. Unless Saudi Arabia's government can provide enough public-sector jobs, or attract more private-sector employers, more budget expenditure will be needed for unemployment benefits.","sourcePage":177},{"body":"5 There is a similar challenge in terms of housing, with more demand than supply. This is a particular problem in places such as Jeddah, Saudi Arabia's second-largest city. Jeddah is on the coast, with a mountain range to the east. Because of this, outward expansion is geographically impossible. As a consequence, houses have become more expensive, and young people may be unable to buy their own homes.\n6 Although Saudi Arabia faces several challenges in terms of education, employment and housing as a result of its young population, it does not have to cope with the demands of an ageing population. Because the country has relatively fewer old people than the places mentioned earlier, the costs of healthcare and pensions are lower. This will allow more funds to be allocated to improving the lives of young people.","sourcePage":177}],"text":"What are the impacts of a young population on a society?\nThere is a well-documented problem with the ageing of the global population, but there are also areas of the world where the demographics are very different. In many parts of the Middle East and North Africa, there is a much higher proportion of young people. The Kingdom of Saudi Arabia, a country of over 35 million people, is one such place. This reality has brought special challenges to the Kingdom in a number of different areas such as education, housing and the economy.\n2 The population graph shows the population of men and women in Saudi Arabia and their age ranges in 2023. The graph shows Saudi Arabia has a very young population. Upon close analysis, it can be seen that about 24% of the population is aged 14 and under, and approximately 13% of the total population is between the ages of 15 and 24. The number of Saudis in their mid-twenties to mid-fifties is particularly high, with almost 52% of the total population falling within this age range. In the United States the median age is 38, in the United Kingdom it is 40, in Italy it is 47 and in Japan it is 49. In contrast, Saudi Arabia is more youthful, as the median age is 30.5.\n3 The high percentage of children and young people leads to high education costs in Saudi Arabia. The focus on education is a high priority for Saudi society. A recent report showed that education receives 17% of the government's annual budget, making the country's education spending one of the highest in the world. As a result of its demographic profile, the government has been leading a university expansion programme to cope with the large number of college-aged students moving through the school system every year.\n4 This also has an impact on employment opportunities for young people. Youth unemployment could well become the Kingdom's biggest social challenge in the coming years. These days, the unemployment rate for Saudis between the ages of 15 and 24 is 33%. Unless Saudi Arabia's government can provide enough public-sector jobs, or attract more private-sector employers, more budget expenditure will be needed for unemployment benefits.\n5 There is a similar challenge in terms of housing, with more demand than supply. This is a particular problem in places such as Jeddah, Saudi Arabia's second-largest city. Jeddah is on the coast, with a mountain range to the east. Because of this, outward expansion is geographically impossible. As a consequence, houses have become more expensive, and young people may be unable to buy their own homes.\n6 Although Saudi Arabia faces several challenges in terms of education, employment and housing as a result of its young population, it does not have to cope with the demands of an ageing population. Because the country has relatively fewer old people than the places mentioned earlier, the costs of healthcare and pensions are lower. This will allow more funds to be allocated to improving the lives of young people.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90392d836e3fe95b97e6d1c2c805bdbde92a5b4c07fb7cd3ef44bbe2a871df80.mp3"},"original":{"id":"B04-RW-U08-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U08","book":4,"track":"RW","unit":8,"title":"READING 2","kind":"material","pages":[177],"sourceImages":[{"page":177,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/22e1929fb83d030212859427dc67bd6226fe85249acbd484a854be952bb2bca7.png","viewEvidenceReported":true}],"text":"What are the impacts of a young population on a society?\n\nThere is a well-documented problem with the ageing of the global population, but there are also areas of the world where the demographics are very different. In many parts of the Middle East and North Africa, there is a much higher proportion of young people. The Kingdom of Saudi Arabia, a country of over 35 million people, is one such place. This reality has brought special challenges to the Kingdom in a number of different areas such as education, housing and the economy.\n\n2 The population graph shows the population of 11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U08-classroom:material:RW-M03":[{"body":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING\nIn the next instalment of our series on demographic changes, we interview Professor Robert Huffenheimer, an expert on the phenomenon of ageing.\n1 What exactly does ageing mean?","sourcePage":173,"blocks":[{"kind":"text","text":"THE SOCIAL AND ECONOMIC IMPACT OF AGEING"},{"kind":"text","text":"In the next instalment of our series on demographic changes, we interview Professor Robert Huffenheimer, an expert on the phenomenon of ageing."},{"kind":"text","text":"1 What exactly does ageing mean?"}]},{"body":"It means the population in many countries is, on average, getting older. According to a United Nations report, in 2050, there will be more people over the age of 60 than children under 16 for the first time in history.\n2 What impact is this ageing process likely to have globally?","sourcePage":173,"blocks":[{"kind":"text","text":"It means the population in many countries is, on average, getting older. According to a United Nations report, in 2050, there will be more people over the age of 60 than children under 16 for the first time in history."},{"kind":"text","text":"2 What impact is this ageing process likely to have globally?"}]},{"body":"Well, obviously it is a good thing that people are living longer, but as a result of this, there are a number of issues which have to be dealt with.\n3 For example?","sourcePage":173,"blocks":[{"kind":"text","text":"Well, obviously it is a good thing that people are living longer, but as a result of this, there are a number of issues which have to be dealt with."},{"kind":"text","text":"3 For example?"}]},{"body":"In certain countries, an increasing number of older people are living by themselves, often without any relatives living nearby. The UN reports that 40% of the world's older population lives independently. Some older people are simply unable to take care of themselves, and others can only do so if their houses are specially adapted. Likewise, they","sourcePage":173,"blocks":[{"kind":"text","text":"In certain countries, an increasing number of older people are living by themselves, often without any relatives living nearby. The UN reports that 40% of the world's older population lives independently. Some older people are simply unable to take care of themselves, and others can only do so if their houses are specially adapted. Likewise, they"}]},{"body":"may be unable to go shopping or wash themselves. Consequently, they need someone, perhaps a professional, to help. And, of course, older people need social activities as well.\n4 And how are societies adapting to this?","sourcePage":173,"blocks":[{"kind":"text","text":"may be unable to go shopping or wash themselves. Consequently, they need someone, perhaps a professional, to help. And, of course, older people need social activities as well."},{"kind":"text","text":"4 And how are societies adapting to this?"}]},{"body":"Supermarkets, for example, have introduced more home-delivery services, which have been particularly beneficial for older people. In addition, there has been significant growth in companies providing services which would traditionally have been undertaken by relatives. These include private nursing care and 'Meals on Wheels' services, which deliver","sourcePage":173,"blocks":[{"kind":"text","text":"Supermarkets, for example, have introduced more home-delivery services, which have been particularly beneficial for older people. In addition, there has been significant growth in companies providing services which would traditionally have been undertaken by relatives. These include private nursing care and 'Meals on Wheels' services, which deliver"}]},{"body":"food to your door. In the USA, for example, Meals on Wheels serves nearly 2.2 million elderly people across the country, many of whom are living alone or isolated, according to the Urban Institute.\n5 Are there any other areas where the impact of ageing can be clearly seen?","sourcePage":173,"blocks":[{"kind":"text","text":"food to your door. In the USA, for example, Meals on Wheels serves nearly 2.2 million elderly people across the country, many of whom are living alone or isolated, according to the Urban Institute."},{"kind":"text","text":"5 Are there any other areas where the impact of ageing can be clearly seen?"}]},{"body":"Although it is not a problem yet, many governments are worried about the economic impact of an ageing population. Fewer citizens working and paying taxes obviously results in less money for the government to pay for things like health and education. NBC World News recently reported that in Italy, which has Europe's oldest population, people are now","sourcePage":173,"blocks":[{"kind":"text","text":"Although it is not a problem yet, many governments are worried about the economic impact of an ageing population. Fewer citizens working and paying taxes obviously results in less money for the government to pay for things like health and education. NBC World News recently reported that in Italy, which has Europe's oldest population, people are now"}]},{"body":"living 30 to 40 years beyond retirement. This means that the number of needy pensioners¹ is rising.\n6 What advantages can an older population bring?","sourcePage":173,"blocks":[{"kind":"text","text":"living 30 to 40 years beyond retirement. This means that the number of needy pensioners¹ is rising."},{"kind":"text","text":"6 What advantages can an older population bring?"}]},{"body":"Countries with a high percentage of young people need to spend a lot of money on education. In contrast, countries with a lower percentage of children have fewer education costs. In more developed countries, older people tend to have more savings and more leisure time. In Japan, for example, according to Bloomberg News, the popularity of luxury","sourcePage":173,"blocks":[{"kind":"text","text":"Countries with a high percentage of young people need to spend a lot of money on education. In contrast, countries with a lower percentage of children have fewer education costs. In more developed countries, older people tend to have more savings and more leisure time. In Japan, for example, according to Bloomberg News, the popularity of luxury"}]},{"body":"train travel among older Japanese people has exploded. Consequently, luxury routes are often sold out. Other elderly people may spend more time online or even go back to studying. Of course, older people do have a lot of experience, and if they can, some continue working in a voluntary capacity after they retire². This kind of activity adds a lot\nto society.","sourcePage":173,"blocks":[{"kind":"text","text":"train travel among older Japanese people has exploded. Consequently, luxury routes are often sold out. Other elderly people may spend more time online or even go back to studying. Of course, older people do have a lot of experience, and if they can, some continue working in a voluntary capacity after they retire². This kind of activity adds a lot"},{"kind":"text","text":"to society."}]},{"body":"¹ pensioner (n) a retired person who receives government money for living expenses\n² retire (v) to leave your job or stop working because of having reached a particular age","sourcePage":173,"blocks":[{"kind":"text","text":"¹ pensioner (n) a retired person who receives government money for living expenses"},{"kind":"text","text":"² retire (v) to leave your job or stop working because of having reached a particular age"}]}],"B04-RW-U08-classroom:material:RW-M04":[{"body":"What are the impacts of a young population on a society?","sourcePage":177,"blocks":[{"kind":"text","text":"What are the impacts of a young population on a society?"}]},{"body":"There is a well-documented problem with the ageing of the global population, but there are also areas of the world where the demographics are very different. In many parts of the Middle East and North Africa, there is a much higher proportion of young people. The Kingdom of Saudi Arabia, a country of over 35 million people, is one such place. This","sourcePage":177,"blocks":[{"kind":"text","text":"There is a well-documented problem with the ageing of the global population, but there are also areas of the world where the demographics are very different. In many parts of the Middle East and North Africa, there is a much higher proportion of young people. The Kingdom of Saudi Arabia, a country of over 35 million people, is one such place. This"}]},{"body":"reality has brought special challenges to the Kingdom in a number of different areas such as education, housing and the economy.","sourcePage":177,"blocks":[{"kind":"text","text":"reality has brought special challenges to the Kingdom in a number of different areas such as education, housing and the economy."}]},{"body":"2 The population graph shows the population of men and women in Saudi Arabia and their age ranges in 2023. The graph shows Saudi Arabia has a very young population. Upon close analysis, it can be seen that about 24% of the population is aged 14 and under, and approximately 13% of the total population is between the ages of 15 and 24. The number of","sourcePage":177,"blocks":[{"kind":"text","text":"2 The population graph shows the population of men and women in Saudi Arabia and their age ranges in 2023. The graph shows Saudi Arabia has a very young population. Upon close analysis, it can be seen that about 24% of the population is aged 14 and under, and approximately 13% of the total population is between the ages of 15 and 24. The number of"}]},{"body":"Saudis in their mid-twenties to mid-fifties is particularly high, with almost 52% of the total population falling within this age range. In the United States the median age is 38, in the United Kingdom it is 40, in Italy it is 47 and in Japan it is 49. In contrast, Saudi Arabia is more youthful, as the median age is 30.5.","sourcePage":177,"blocks":[{"kind":"text","text":"Saudis in their mid-twenties to mid-fifties is particularly high, with almost 52% of the total population falling within this age range. In the United States the median age is 38, in the United Kingdom it is 40, in Italy it is 47 and in Japan it is 49. In contrast, Saudi Arabia is more youthful, as the median age is 30.5."}]},{"body":"3 The high percentage of children and young people leads to high education costs in Saudi Arabia. The focus on education is a high priority for Saudi society. A recent report showed that education receives 17% of the government's annual budget, making the country's education spending one of the highest in the world. As a result of its demographic","sourcePage":177,"blocks":[{"kind":"text","text":"3 The high percentage of children and young people leads to high education costs in Saudi Arabia. The focus on education is a high priority for Saudi society. A recent report showed that education receives 17% of the government's annual budget, making the country's education spending one of the highest in the world. As a result of its demographic"}]},{"body":"profile, the government has been leading a university expansion programme to cope with the large number of college-aged students moving through the school system every year.","sourcePage":177,"blocks":[{"kind":"text","text":"profile, the government has been leading a university expansion programme to cope with the large number of college-aged students moving through the school system every year."}]},{"body":"4 This also has an impact on employment opportunities for young people. Youth unemployment could well become the Kingdom's biggest social challenge in the coming years. These days, the unemployment rate for Saudis between the ages of 15 and 24 is 33%. Unless Saudi Arabia's government can provide enough public-sector jobs, or attract more","sourcePage":177,"blocks":[{"kind":"text","text":"4 This also has an impact on employment opportunities for young people. Youth unemployment could well become the Kingdom's biggest social challenge in the coming years. These days, the unemployment rate for Saudis between the ages of 15 and 24 is 33%. Unless Saudi Arabia's government can provide enough public-sector jobs, or attract more"}]},{"body":"private-sector employers, more budget expenditure will be needed for unemployment benefits.","sourcePage":177,"blocks":[{"kind":"text","text":"private-sector employers, more budget expenditure will be needed for unemployment benefits."}]},{"body":"5 There is a similar challenge in terms of housing, with more demand than supply. This is a particular problem in places such as Jeddah, Saudi Arabia's second-largest city. Jeddah is on the coast, with a mountain range to the east. Because of this, outward expansion is geographically impossible. As a consequence, houses have become more expensive,","sourcePage":177,"blocks":[{"kind":"text","text":"5 There is a similar challenge in terms of housing, with more demand than supply. This is a particular problem in places such as Jeddah, Saudi Arabia's second-largest city. Jeddah is on the coast, with a mountain range to the east. Because of this, outward expansion is geographically impossible. As a consequence, houses have become more expensive,"}]},{"body":"and young people may be unable to buy their own homes.","sourcePage":177,"blocks":[{"kind":"text","text":"and young people may be unable to buy their own homes."}]},{"body":"6 Although Saudi Arabia faces several challenges in terms of education, employment and housing as a result of its young population, it does not have to cope with the demands of an ageing population. Because the country has relatively fewer old people than the places mentioned earlier, the costs of healthcare and pensions are lower. This will allow","sourcePage":177,"blocks":[{"kind":"text","text":"6 Although Saudi Arabia faces several challenges in terms of education, employment and housing as a result of its young population, it does not have to cope with the demands of an ageing population. Because the country has relatively fewer old people than the places mentioned earlier, the costs of healthcare and pensions are lower. This will allow"}]},{"body":"more funds to be allocated to improving the lives of young people.","sourcePage":177,"blocks":[{"kind":"text","text":"more funds to be allocated to improving the lives of young people."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{ 本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-RW-U08":{"aspect":1.7777778,"cues":[[0.86,5.58,"There's an old saying that your school days are the happiest days of your life.","有个老话说你的学校是人生中最快乐的日子"],[6.14,8.4,"Wouldn't life be disappointing if that were true?","如果真是这样，生活就不会令人失望吗？"],[9.28,11.42,"Growing old is a common fear.","长老是常见的恐惧。"],[12,13.48,"According to many researchers,","许多研究者认为，"],[13.88,19.52,"it's a myth that youth is the most enjoyable or even the healthiest time of your life.","这是一个神话，青年是你生活中最享受，甚至最健康的时间。"],[20.58,23.24,"Aging comes with some significant benefits.","老龄化带来一些重大好处。"],[24.05,36.18,"A long -term study of 60 ,000 people in Australia, Britain and Germany found that we're at our happiest in our 60s and 70s after we retire from work.","一项对澳大利亚，英国和德国的60000人的长期研究发现，我们退休后在60和70岁时都处于最幸福的状态。"],[36.88,40.6,"One possible reason for this is that our relationships improve.","造成这种情况的一个可能原因是我们的关系有所改善。"],[41.46,47.74,"We focus on the people we love and have more opportunities to be part of meaningful communities.","我们注重我们所爱的人，并有更多的机会成为有意义的社区的一部分。"],[48.4,55.52,"In our 20s and 30s, we may sacrifice the things that make us happy in order to climb the career ladder.","在20到30年代，我们可以牺牲那些让我们快乐的东西，以便攀登事业的阶梯。"],[56.42,57.96,"However, as we age,","然而，随着我们的老化，"],[58.38,60.54,"we forget unachievable ambitions.","我们忘记了无法实现的野心。"],[61.5,72.38,"Some psychologists believe this makes us less happy in middle age, but most agree that by our 50s and 60s, we are better at accepting the lives we have.","一些心理学家认为这使我们在中年更不快乐，但大多数人都同意，到50和60岁时，我们更愿意接受我们的生活。"],[72.94,75.14,"Age also gives us new skills.","年龄也给了我们新的技能。"],[76.03999999999999,80.18,"Life experience teaches us to avoid things that make us unhappy.","生活经验教导我们避免那些让我们不幸福的事情。"],[81.08,85.62,"When arguments or problems arise, we have strategies to deal with them.","当出现争论或问题时，我们有处理这些争论或问题的战略。"],[86.24,90.36,"Changes in our brains mean we are less anxious and less impulsive.","我们大脑的改变意味着我们没有那么急躁和冲动。"],[91.12,93.22,"Our bodies and our brains improve,","我们的身体和大脑都有了改善"],[93.56,93.68,"too.","我也一样。"],[94.08,100.1,"The immune system works best in our 50s and 60s, so we get fewer colds.","免疫系统在五十到六十年代最有效，所以我们得到的感冒较少。"],[100.34,104.4,"Our bodies recognize viruses and deal with them more efficiently.","我们的身体能识别病毒，并能更有效地对付病毒。"],[105.14,105.82,"Allergies,","过敏症，"],[106.18,109.68,"too, may disappear as our bodies adjust to our environments.","随着我们身体适应环境，也可能消失。"],[111.25999999999999,113.56,"Although we forget more in later life,","虽然我们在后世会忘记更多"],[114,118.5,"many mental abilities are better in our 50s than they were in our 20s.","我们50多岁的心理能力比20多岁的好"],[119.5,122.26,"Of course, there are disadvantages to aging,","当然，衰老有缺点，"],[122.78,122.88,"too.","我也一样。"],[123.2,128.24,"And in countries where there isn't a great deal of support for elderly people,","而在那些对老年人没有很多支持的国家，"],[128.62,131.54,"poverty and loneliness may affect their happiness.","贫穷和孤独可能影响他们的幸福。"],[132.36,135.18,"But if this research can teach us anything,","但是如果这个研究能教我们什么"],[135.76,137.56,"it's not to fear getting older.","它不是害怕变老。"],[138.1,140.2,"The best may be yet to come.","最好的可能还没有到来。"]],"englishRows":2,"chineseRows":2}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansou function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+

function bind(c){

  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);

 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));

function taskTable(table,feedback){

  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");

function splitPanels(groups){

function materialSplit(decks,task,feedback){

  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))

function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");

 }

 }

 switch(c.layout){
