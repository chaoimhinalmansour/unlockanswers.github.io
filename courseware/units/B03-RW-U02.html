:"In the same day, you can have hot, dry weather,"},{"start":80.1,"end":81.76,"text":"followed by wind and snow."},{"start":89.18,"end":94.6,"text":"And every year, the Colorado River cuts a little deeper\ninto the bottom of the Grand Canyon."},{"start":102,"end":106.53999999999999,"text":"Water also formed Carlsbad Caverns in New Mexico."},{"start":111.34,"end":112.86,"text":"Carlsbad is the largest,"},{"start":113.2,"end":115.47999999999999,"text":"deepest cave system in North America."},{"start":121.64,"end":126.64,"text":"Even today, water continues to change the inside of the\ncaves."},{"start":137.6,"end":141.5,"text":"The results are spectacular."},{"start":168.34,"end":169.3,"text":"Finally,"},{"start":170.14,"end":174.38,"text":"high in the Sierra Mountains of California is Yosemite\nNational Park."},{"start":180.34,"end":182.02,"text":"Its famous landmark,"},{"start":182.48,"end":183.06,"text":"Half Dome,"},{"start":183.52,"end":187.36,"text":"was made by the frozen water in a glacier moving\nthrough the canyon."},{"start":195.54,"end":196.24,"text":"Today,"},{"start":196.88,"end":198.06,"text":"the glaciers are gone,"},{"start":198.36,"end":202.76,"text":"but water from the melting mountain snow flows\nthroughout the national park."},{"start":211.68,"end":216.26,"text":"Yosemite Falls drops nearly two ,500 feet."},{"start":218.76,"end":222.4,"text":"It's the tallest waterfall in North America."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 3 b 4 c 5 d 1 e 2 f 6","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":28,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U02-question:b5354","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":1,"order":5,"module":"WATCH AND LISTEN","e com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b0dfe6a59885bc7b234236b72c4b950d27092af7bfb26398fa7687d0eba5330b.png"],"provided":"solution to the problem ____\nchanging ecosystems ____\nmelting glaciers ____\ncauses of climate change ____","items":[{"id":"b5363.i01","label":"1","prompt":"solution to the problem ____","options":[],"type":"gap/closed"},{"id":"b5363.i02","label":"2","prompt":"changing ecosystems ____","options":[],"type":"gap/closed"},{"id":"b5363.i03","label":"melting glaciers","prompt":"melting glaciers ____","options":[],"type":"gap/closed"},{"id":"b5363.i04","label":"4","prompt":"causes of climate change ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"solution to the problem ____"},{"kind":"text","text":"changing ecosystems ____"},{"kind":"text","text":"melting glaciers ____"},{"kind":"text","text":"causes of climate change ____"}]],"courseMaterials":[{"id":"B03-RW-U02-classroom:material:RW-M03","title":"READING 1","text":"# Our changing planet\n1 Since 1900 the global temperature has gone up by around 1.0 °C. This may not sound like much, but such a small increase is causing sea levels to rise and threatening the habitat of many species of plants and animals. An increase of 2 °C in global temperatures could result in extinction for 30% of the world's land species.  \n2 The Northwest Passage is a sea route which runs along the northern coast of Canada between the Atlantic and Pacific Oceans. In the past, it was often difficult to use because the water was frozen; however, increasing temperatures and the subsequent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  \n3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  \nsuch as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.\n6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n¹ deglaciation (n) the melting of a glacier\n² mangrove forest (n) large areas of trees and other plants which grow next to ocean quent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  \n3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  \nsuch as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.\n6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n¹ deglaciation (n) the melting of a glacier\n² mangrove forest (n) large areas of trees and other plants which grow next to oceans, e.g. in Florida and Bangladesh\n³ coral reefs (n) colourful underwater ecosystems built by tiny animals","screens":["# Our changing planet\n1 Since 1900 the global temperature has gone up by around 1.0 °C. This may not sound like much, but such a small increase is causing sea levels to rise and threatening the habitat of many species of plants and animals. An increase of 2 °C in global temperatures could result in extinction for 30% of the world's land species.  \n2 The Northwest Passage is a sea route which runs along the northern coast of Canada between the Atlantic and Pacific Oceans. In the past, it was often difficult to use because the water was frozen; however, increasing temperatures and the subsequent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  ","3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  ","such as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.","6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n¹ deglaciation (n) the melting of a glacier\n² mangrove forest (n) large areas of trees and other plants which grow next to oceans, e.g. in Florida and Bangladesh\n³ coral reefs (n) colourful underwater ecosystems built by tiny animals"],"sources":[{"page":41,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f712da259dd72c845e0b1974cf07bc2acfa85de3dbc5fae3e399d31e099b8c8.png","width":772,"height":1040}],"kind":"reading"},{"id":"B03-RW-U02-publisher-page:p041","title":"原题或核对备注所引第41页","pages":[41],"text":"","screens":[],"sources":[{"page":41,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f712d NMENT","lesson":2,"order":21,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work with a partner. Read the essay and complete the summary using words from the text.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1907e928668aced78987c2caf8f8afd1039edfd7d67a8458290601f6bdd2d843.png"],"provided":"Forests are important because they produce (1) ____ and (2) ____ CO₂. They also provide a natural (3) ____ for many plants and animals. Deforestation, that is, the (4) ____ of forests, is happening all over the world. People cut down trees and use them for (5) ____ and as building material. However, the main cause of deforestation is the increase in both commercial and local (6) ____. Deforestation has serious consequences. These negative effects include soil (7) ____, loss of (8) ____ and (9) ____ change.","items":[{"id":"b5381.i01","label":"1","prompt":"Forests are important because they produce (1) ____","options":[],"type":"gap/closed"},{"id":"b5381.i02","label":"2","prompt":"and (2) ____ CO₂.","options":[],"type":"gap/closed"},{"id":"b5381.i03","label":"3","prompt":"They also provide a natural (3) ____ for many plants and animals.","options":[],"type":"gap/closed"},{"id":"b5381.i04","label":"4","prompt":"Deforestation, that is, the (4) ____ of forests, is happening all over the world.","options":[],"type":"gap/closed"},{"id":"b5381.i05","label":"5","prompt":"People cut down trees and use them for (5) ____ and as building material.","options":[],"type":"gap/closed"},{"id":"b5381.i06","label":"6","prompt":"However, the main cause of deforestation is the increase in both commercial and local (6) ____.","options":[],"type":"gap/closed"},{"id":"b5381.i07","label":"7","prompt":"These negative effects include soil (7) ____","options":[],"type":"gap/closed"},{"id":"b5381.i08","label":"8","prompt":"loss of (8) ____","options":[],"type":"gap/closed"},{"id":"b5381.i09","label":"9","prompt":"and (9) ____ change.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Forests are important because they produce (1) ____ and (2) ____ CO₂. They also provide a natural (3) ____ for many plants and animals. Deforestation, that is, the (4) ____ of forests, is happening all over the world. People cut down trees and use them for (5) ____ and as building material. However, the main cause of deforestation is the increase in both commercial and local (6) ____. Deforestation has serious consequences. These negative effects include soil (7) ____, loss of (8) ____ and (9) ____ change."}]],"courseMaterials":[{"id":"B03-RW-U02-classroom:material:RW-M04","title":"READING 2","text":"## THE CAUSES AND EFFECTS OF\n# DEFORESTATION\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of land. The destruction of forests occurs for several reasons; trees are used as fuel or for construction, and cleared land is used as pasture $^{1}$ for animals or fields for planting food. The main harmful effects of deforestation are climate change and damage to animal habitats.\n2 The main causes of deforestation are commercial farming by big business and farming by local people. Huge commercial farms have taken over large areas of forest in many countries. In Indonesia, for example, industrial logging is carried out to clear huge areas for the production of palm oil, while in Brazil, large areas of the Amazon rainforest are cleared to grow soy and produce vegetable oil. Local farmers also cut down and burn trees but they clear areas just big enough to graze cattle or grow crops. However, after two or three years, the land can no longer be used, so the farmer moves to another piece of land. Normally, it takes around ten years for cleared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.\n3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.\n4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment.","screens":["## THE CAUSES AND EFFECTS OF\n# DEFORESTATION\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of land. The destruction of forests occurs for several reasons; trees are used as fuel or for construction, and cleared land is used as pasture $^{1}$ for animals or fields for planting food. The main harmful effects of deforestation are climate change and damage to animal habitats.","2 The main causes of deforestation are commercial farming by big business and farming by local people. Huge commercial farms have taken over large areas of forest in many countries. In Indonesia, for example, industrial logging is carried out to clear huge areas for the production of palm oil, while in Brazil, large areas of the Amazon rainforest are cleared to grow soy and produce vegetable oil. Local farmers also cut down and burn trees but they clear areas just big enough to graze cattle or grow crops. However, after two or three years, the land can no longer be used, so the farmer moves to another piece of land. Normally, it takes around ten years for cleared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.","3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.","4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment."],"sources":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1ad56e63688831790edc5becc03be5a988fbbc4848b303ea699104d9696498bc.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_9131fd9edb360608.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 oxygen 2 absorb 3 habitat/home 4 destruction\n5 fuel 6 farming 7 erosion 8 habitat/biodiversity\n9 climate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":29,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U02-question:b5382","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":22,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay again. Write T (true), F (false), or DNS (does not say) next to the statements below. Then correct the false statements. onment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment."],"sources":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1ad56e63688831790edc5becc03be5a988fbbc4848b303ea699104d9696498bc.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_9131fd9edb360608.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F; In Indonesia, trees are cut down to make way for palm\noil plantations. 2 T 3 DNS 4 Deforestation destroys\nfuture sources of food and medicine 5 T 6 DNS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U02-question:b5384","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":23,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work with a partner. Answer the questions.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1907e928668aced78987c2caf8f8afd1039edfd7d67a8458290601f6bdd2d843.png"],"provided":"","items":[{"id":"b5384.i01","label":"1","prompt":"How do you think erosion leads to floods?","options":[],"type":"qa/open"},{"id":"b5384.i02","label":"2","prompt":"How does deforestation reduce future sources of food and medicine?","options":[],"t ared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.\n3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.\n4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment.","screens":["## THE CAUSES AND EFFECTS OF\n# DEFORESTATION\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of . The bottles are made from petroleum, and transporting them requires an enormous amount of polluting fossil fuels. In the 1970s, the United States was the world's biggest exporter of fossil fuels. Also, most plastic bottles are not recycled. They end up in our landfills, where they can take many decades to break down. Because of these harmful effects of plastic water bottles on people and the environment, I have stopped buying them. I now drink water from the"},{"kind":"text","text":"tap, and guess what: it tastes good!"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Main idea: Plastic water bottles hurt both people and the\nenvironment.\nCross out: In the 1970s, the United States was the world’s\nbiggest exporter of fossil fuels.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":32,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U02-question:b5413","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":34,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the paragraph in Exercise 1 on the opposite page again and answer the questions.","pages":[53],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2e01e78ad303577af62dfcdc5cfd4f5778bb3dff01310318a2e49e6f61c5df35.png"],"provided":"","items":[{"id":"b5413.i01","label":"1","prompt":"Find two supporting sentences and underline them.","options":[],"type":"qa/open"},{"id":"b5413.i02","label":"2","prompt":"What detail is given to explain the first supporting sentence? Is this a fact, example or reason?","o ":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0237b6a7efd03dc7795ad43d45d72f91a491f78a7faba9da58f119952f1170db.png"}],"kind":"task_checklist","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U02-question:b5423","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":39,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Read the introduction and conclusion of the cause-and-effect essay below. Complete the introduction paragraph by writing two or three causes of climate change that you will discuss in your body paragraphs.","pages":[55,56],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/921a0f26705fcb18e57345e04f41971d0bed6631ccb674b13227f9d21bb78b85.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0237b6a7efd03dc7795ad43d45d72f91a491f78a7faba9da58f119952f1170db.png"],"provided":"Causes and effects of climate change\nIntroduction: The Earth's climate has changed several times throughout history. According to the National Aeronautics and Space Administration (NASA), there have been seven cycles of warming and cooling in the last 650,000 years. These earlier cycles occurred naturally as a result of changes in the atmosphere. In contrast, nearly all climate scientists agree that the climate changes we are seeing today are caused by an increase in greenhouse gases. This increase is primarily the result of human activities, especially ____, and these activities are having serious negative effects on our planet.\nConclusion: To conclude, human activity is clearly causing the climate to change and, as a result, the planet is experiencing a number of negative effects. It is important that we reduce our negative impact on the planet as much as possible – for example, by using renewable energy instead of fossil fuels – before it is too late.","items":[{"id":"b5423.i01","label":"1","prompt":"This increase is primarily the result of human activities, especially ____, and these activities are having serious negative effects on our planet.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Causes and effects of climate change"},{"kind":"text","text":"Introduction: The Earth's climate has changed several times throughout history. According to the National Aeronautics and Space Administration (NASA), there have been seven cycles of warming and cooling in the last 650,000 years. These earlier cycles occurred naturally as a result of changes in the atmosphere. In contrast, nearly all climate scientists agree that the climate changes we are seeing today are caused by an increase in greenhouse gases. This increase is primarily the result of human activities, especially ____, and these activities are having serious negative effects on our planet."}],[{"kind":"text","text":"Conclusion: To conclude, human activity is clearly causing the climate to change and, as a result, the planet is experiencing a number of negative effects. It is important that we reduce our negative impact on the planet as much as possible – for example, by using renewable energy instead of fossil fuels – before it is too late."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoim water continues to change the inside of the\ncaves."},{"start":137.6,"end":141.5,"text":"The results are spectacular."},{"start":168.34,"end":169.3,"text":"Finally,"},{"start":170.14,"end":174.38,"text":"high in the Sierra Mountains of California is Yosemite\nNational Park."},{"start":180.34,"end":182.02,"text":"Its famous landmark,"},{"start":182.48,"end":183.06,"text":"Half Dome,"},{"start":183.52,"end":187.36,"text":"was made by the frozen water in a glacier moving\nthrough the canyon."},{"start":195.54,"end":196.24,"text":"Today,"},{"start":196.88,"end":198.06,"text":"the glaciers are gone,"},{"start":198.36,"end":202.76,"text":"but water from the melting mountain snow flows\nthroughout the national park."},{"start":211.68,"end":216.26,"text":"Yosemite Falls drops nearly two ,500 feet."},{"start":218.76,"end":222.4,"text":"It's the tallest waterfall in North America."}],"launchInline":true}},{"id":"B03-RW-U02-classroom:material:RW-M03","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[41],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f712da259dd72c845e0b1974cf07bc2acfa85de3dbc5fae3e399d31e099b8c8.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# Our changing planet\n1 Since 1900 the global temperature has gone up by around 1.0 °C. This may not sound like much, but such a small increase is causing sea levels to rise and threatening the habitat of many species of plants and animals. An increase of 2 °C in global temperatures could result in extinction for 30% of the world's land species.  \n2 The Northwest Passage is a sea route which runs along the northern coast of Canada between the Atlantic and Pacific Oceans. In the past, it was often difficult to use because the water was frozen; however, increasing temperatures and the subsequent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  ","sourcePage":41},{"body":"3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  ","sourcePage":41},{"body":"such as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.","sourcePage":41},{"body":"6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n¹ deglaciation (n) the melting of a glacier\n² mangrove forest (n) large areas of trees and other plants which grow next to oceans, e.g. in Florida and Bangladesh\n³ coral reefs (n) colourful underwater ecosystems built by tiny animals","sourcePage":41}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U02-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Our changing planet","pages":[{"page":41,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f712da259dd72c845e0b1974cf07bc2acfa85de3dbc5fae3e399d31e099b8c8.png","width":772,"height":1040}],"source":41,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# Our changing planet\n1 Since 1900 the global temperature has gone up by around 1.0 °C. This may not sound like much, but such a small increase is causing sea levels to rise and threatening the habitat of many species of plants and animals. An increase of 2 °C in global temperatures could result in extinction for 30% of the world's land species.  \n2 The Northwest Passage is a sea route which runs along the northern coast of Canada between the Atlantic and Pacific Oceans. In the past, it was often difficult to use because the water was frozen; however, increasing temperatures and the subsequent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  ","sourcePage":41},{"body":"3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  ","sourcePage":41},{"body":"such as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.","sourcePage":41},{"body":"6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n¹ deglaciation (n) the melting of a glacier\n² mangrove forest (n) large areas of trees and other plants which grow next to oceans, e.g. in Florida and Bangladesh\n³ coral reefs (n) colourful underwater ecosystems built by tiny animals","sourcePage":41}],"text":"# Our changing planet\n1 Since 1900 the global temperature has gone up by around 1.0 °C. This may not sound like much, but such a small increase is causing sea levels to rise and threatening the habitat of many species of plants and animals. An increase of 2 °C in global temperatures could result in extinction for 30% of the world's land species.  \n2 The Northwest Passage is a sea route which runs along the northern coast of Canada between the Atlantic and Pacific Oceans. In the past, it was often difficult to use because the water was frozen; however, increasing temperatures and the subsequent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  \n3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  \nsuch as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.\n6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n¹ deglaciation (n) the melting of a glacier\n² mangrove forest (n) large areas of trees and other plants which grow next to oceans, e.g. in Florida and Bangladesh\n³ coral reefs (n) colourful underwater ecosystems built by tiny animals","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7079f09bb5acbf96.mp3"},"original":{"id":"B03-RW-U02-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U02","book":3,"track":"RW","unit":2,"title":"READING 1","kind":"material","pages":[41],"sourceImages":[{"page":41,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f712da259dd72c845e0b1974cf07bc2acfa85de3dbc5fae3e399d31e099b8c8.png","viewEvidenceReported":true}],"text":"# Our changing planet\n\n1 Since 1900 the global temperature has gone up by around 1.0 °C. This may not sound like much, but such a small increase is causing sea levels to rise and threatening the habitat of many species of plants and animals. An increase of 2 °C in global temperatures could result in extinction for 30% of the world's land species.  \n2 The Northwest Passage is a sea route which runs along the northern coast of Canada between the Atlantic and Pacific Oceans. In the past, it was often difficult to use because the water was frozen; however, increasing temperatures and the subsequent deglaciation¹ have made it easier for ships to travel through this route. The trouble is that the melting of the ice is leading to loss of habitat for the polar bears and other species which live in this area.  \n3 Experts predict that global sea levels could rise by 30.5–122 cm by the end of the century. Consequently, some areas that were land a few hundred years ago are now under water, and many low-lying islands may be under water in the future.  \n4 As a result of the changing climate, the world's ecosystems are also changing faster than ever before. More than one-third of the world's mangrove forests² and around 50% of the world's coral reefs² have been destroyed in the last few decades. Forests are being cut down to provide land for food because human population is growing at such a rapid rate. 38% of the land on Earth is now used for growing food. As a result of the higher temperatures and higher levels of carbon dioxide in the atmosphere, plants are producing more pollen, which could lead to more cases of asthma, a medical condition which makes it hard to breathe.\n\n5 What is causing climate change?  \nThe main cause is the huge amount of greenhouse gases,  \nsuch as methane and carbon dioxide (CO₂), in the  \natmosphere, but the reason for this is the world's population – you and me. As the population increases, more land is needed to provide food and energy. Burning fossil fuels for heating, lighting, transport, electricity or manufacturing produces CO₂. Furthermore, humans breathe out CO₂ while trees 'breathe in' CO₂ and produce oxygen, so by cutting down trees, we are increasing the amount of CO₂ in the atmosphere and reducing the amount of oxygen. As a result of human activities, CO₂ levels are now at their highest in 800,000 years.\n\n6 The biggest challenge we all face is to prevent further environmental disasters. We must do something before it is too late. We need to reduce the amount of CO₂ in the atmosphere. We need to stop burning fossil fuels and start using renewable energy. We can get enough energy from renewable fuels, such as solar energy, hydroelectric energy or wind power, to be able to stop using fossil fuels completely.\n\n¹ deglaciation (n) the melting of a glacier\n\n² mangrove forest (n) large areas of trees and other plants which grow next to oceans, e.g. in Florida and Bangladesh\n\n³ coral reefs (n) colourful underwater ecosystems built by tiny animals","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5361"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7079f09bb5acbf96.mp3","continueOnPage":true}},{"id":"B03-RW-U02-classroom:resource:b5377","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[44],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/af10d21a6b4033ab3611e18631baba48e6ad669bbadff81b4afd1822be827653.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["absorb (v) to take in a liquid or gas through a surface and hold it\nconstruction (n) the process of building something, usually large structures such as houses, roads or bridges\ndestruction (n) the act of causing so much damage to something that it stops existing because it cannot be repaired\neffect (n) result; a change which happens because of a cause","farming (n) the job of working or organizing work on a farm\nlogging (n) the activity or business of cutting down trees for wood\nrainforest (n) a forest in a tropical area with a rainfall of $250~\\mathrm{cm}$ or more per year"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U02-classroom:material:RW-M04","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[45],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1ad56e63688831790edc5becc03be5a988fbbc4848b303ea699104d9696498bc.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## THE CAUSES AND EFFECTS OF\n# DEFORESTATION\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of land. The destruction of forests occurs for several reasons; trees are used as fuel or for construction, and cleared land is used as pasture $^{1}$ for animals or fields for planting food. The main harmful effects of deforestation are climate change and damage to animal habitats.","sourcePage":45},{"body":"2 The main causes of deforestation are commercial farming by big business and farming by local people. Huge commercial farms have taken over large areas of forest in many countries. In Indonesia, for example, industrial logging is carried out to clear huge areas for the production of palm oil, while in Brazil, large areas of the Amazon rainforest are cleared to grow soy and produce vegetable oil. Local farmers also cut down and burn trees but they clear areas just big enough to graze cattle or grow crops. However, after two or three years, the land can no longer be used, so the farmer moves to another piece of land. Normally, it takes around ten years for cleared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.","sourcePage":45},{"body":"3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.","sourcePage":45},{"body":"4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment.","sourcePage":45}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U02-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"THE CAUSES AND EFFECTS OF","pages":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1ad56e63688831790edc5becc03be5a988fbbc4848b303ea699104d9696498bc.png","width":772,"height":1040}],"source":45,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## THE CAUSES AND EFFECTS OF\n# DEFORESTATION\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of land. The destruction of forests occurs for several reasons; trees are used as fuel or for construction, and cleared land is used as pasture $^{1}$ for animals or fields for planting food. The main harmful effects of deforestation are climate change and damage to animal habitats.","sourcePage":45},{"body":"2 The main causes of deforestation are commercial farming by big business and farming by local people. Huge commercial farms have taken over large areas of forest in many countries. In Indonesia, for example, industrial logging is carried out to clear huge areas for the production of palm oil, while in Brazil, large areas of the Amazon rainforest are cleared to grow soy and produce vegetable oil. Local farmers also cut down and burn trees but they clear areas just big enough to graze cattle or grow crops. However, after two or three years, the land can no longer be used, so the farmer moves to another piece of land. Normally, it takes around ten years for cleared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.","sourcePage":45},{"body":"3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.","sourcePage":45},{"body":"4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment.","sourcePage":45}],"text":"## THE CAUSES AND EFFECTS OF\n# DEFORESTATION\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of land. The destruction of forests occurs for several reasons; trees are used as fuel or for construction, and cleared land is used as pasture $^{1}$ for animals or fields for planting food. The main harmful effects of deforestation are climate change and damage to animal habitats.\n2 The main causes of deforestation are commercial farming by big business and farming by local people. Huge commercial farms have taken over large areas of forest in many countries. In Indonesia, for example, industrial logging is carried out to clear huge areas for the production of palm oil, while in Brazil, large areas of the Amazon rainforest are cleared to grow soy and produce vegetable oil. Local farmers also cut down and burn trees but they clear areas just big enough to graze cattle or grow crops. However, after two or three years, the land can no longer be used, so the farmer moves to another piece of land. Normally, it takes around ten years for cleared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.\n3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.\n4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_9131fd9edb360608.mp3"},"original":{"id":"B03-RW-U02-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U02","book":3,"track":"RW","unit":2,"title":"READING 2","kind":"material","pages":[45],"sourceImages":[{"page":45,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1ad56e63688831790edc5becc03be5a988fbbc4848b303ea699104d9696498bc.png","viewEvidenceReported":true}],"text":"## THE CAUSES AND EFFECTS OF\n\n# DEFORESTATION\n\n1 Forests, which cover almost one-third of the surface of the Earth, produce oxygen and provide homes to plants, animals and humans. These days, many of the world's great forests are threatened by deforestation – the process of removing trees from large areas of land. The destruction of forests occurs for several reasons; trees are used as fuel or for construction, and cleared land is used as pasture $^{1}$ for animals or fields for planting food. The main harmful effects of deforestation are climate change and damage to animal habitats.\n2 The main causes of deforestation are commercial farming by big business and farming by local people. Huge commercial farms have taken over large areas of forest in many countries. In Indonesia, for example, industrial logging is carried out to clear huge areas for the production of palm oil, while in Brazil, large areas of the Amazon rainforest are cleared to grow soy and produce vegetable oil. Local farmers also cut down and burn trees but they clear areas just big enough to graze cattle or grow crops. However, after two or three years, the land can no longer be used, so the farmer moves to another piece of land. Normally, it takes around ten years for cleared land to recover, but in populated areas the land is never allowed to recover. This constant reuse of land leads to heavy erosion $^{2}$ – the loss of the top layer of soil which protects the ground. Erosion, in turn, can cause flooding in heavy rain.\n3 One serious effect of deforestation is climate change. Normally tropical rainforests help control the Earth's temperature by absorbing carbon dioxide. However, recently, the Amazon area, where much of the world's rainforests are found, has been releasing more carbon dioxide than it absorbs. In addition, in areas where deforestation has taken place, the carbon dioxide goes into the atmosphere and traps heat in a process called the greenhouse effect. The result is global warming. Increasing global temperatures result in less rain. This causes the rainforests to dry out and leads to fires – which cause more emissions of carbon dioxide. In this way, the rainforests actually contribute to global warming instead of helping to solve it.\n4 Forest destruction also has an effect on biodiversity $^{3}$ . Deforestation causes the loss of habitats and damage to land where plants and animal species live, leading to the extinction of many species. A decrease in biodiversity threatens entire ecosystems and destroys future sources of food and medicine.\n5 In conclusion, damage to the world's forests is leading to changes in the natural environment and causing global warming. Looking to the future, governments should act to plant more trees which will absorb carbon dioxide and protect forests from illegal logging. Otherwise, deforestation on such a large scale is sure to have terrible effects on the environment.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5379"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_9131fd9edb360608.mp3","continueOnPage":true}},{"id":"B03-RW-U02-classroom:review-1","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[57],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d27af33dc02eae8da9a5e1fd3f8f8c44a31d4767c512444a1075c58b1363f7c3.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-RW-U02-B-001","form":"absorb","page":57},{"id":"B03-RW-U02-B-002","form":"annual","page":57},{"id":"B03-RW-U02-B-003","form":"atmosphere","page":57},{"id":"B03-RW-U02-B-004","form":"cause","page":57},{"id":"B03-RW-U02-B-005","form":"challenge","page":57},{"id":"B03-RW-U02-B-006","form":"climate","page":57},{"id":"B03-RW-U02-B-007","form":"consequences","page":57},{"id":"B03-RW-U02-B-008","form":"constant","page":57},{"id":"B03-RW-U02-B-010","form":"contribute to","page":57},{"id":"B03-RW-U02-B-012","form":"ecosystem","page":57},{"id":"B03-RW-U02-B-013","form":"effect","page":57},{"id":"B03-RW-U02-B-014","form":"farming","page":57},{"id":"B03-RW-U02-B-015","form":"fossil fuel","page":57},{"id":"B03-RW-U02-B-016","form":"global warming","page":57},{"id":"B03-RW-U02-B-017","form":"greenhouse gas","page":57},{"id":"B03-RW-U02-B-018","form":"issue","page":57},{"id":"B03-RW-U02-B-019","form":"logging","page":57},{"id":"B03-RW-U02-B-020","form":"predict","page":57},{"id":"B03-RW-U02-B-021","form":"rainforest","page":57},{"id":"B03-RW-U02-B-022","form":"threaten","page":57},{"id":"B03-RW-U02-B-023","form":"trend","page":57}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U02-classroom:review-2","book":3,"unit":2,"track":"RW","topic":"THE ENVIRONMENT","
