ld do you think this species of bird of paradise comes from? What kind of habitat does it live in?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7353.i02","label":"2","prompt":"What do you think is happening in the third picture? What other threats might there be to this species' survival?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7353.i03","label":"3","prompt":"What do you think environmentalists are doing to protect them?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think that they come from tropical areas\nof the world, maybe places like Brazil.\nThey probably live in areas of tropical\njungle or rainforest.\n2 It’s difficult to tell but this is a plastic\nbottle that has something inside it.\n3 They are probably trying to protect their\nhabitat. They might have a breeding\nprogram to increase the numbers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":23,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[{"page":16,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/32add529dd360cf1057314e070367d98b7ab65a79224d32d75fcc4ad74e8ad8b.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7356","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Which statement best summarizes the main idea?","pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/32add529dd360cf1057314e070367d98b7ab65a79224d32d75fcc4ad74e8ad8b.png"],"provided":"","items":[{"id":"b7356.i01","label":"1","prompt":"Which statement best summarizes the main idea?","options":["There are many ways that humans are causing cendrawasih numbers to fall, but only one hope for saving them.","Illegal human activities are damaging the cendrawasih's habitat and in future it is likely that they will only be seen in books and zoos."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7356.i01","label":"1","prompt":"Which statement best summarizes the main idea?","options":["There are many ways that humans are causing cendrawasih numbers to fall, but only one hope for saving them.","Illegal human activities are damaging the cendrawasih's habitat and in future it is likely that they will only be seen in books and zoos."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/3334357a68123ef2de3e57be-L5LS-U01.mp4","captions":[{"start":1.18,"end":5,"text":"A rare glimpse and it's gone."},{"start":6,"end":7.4,"text":"Locally known as cendrawasi,"},{"start":7.84,"end":13.64,"text":"spotting these birds of paradise in the Indonesian\njungle is becoming increasingly difficult."},{"start":17.92,"end":24.5,"text":"The habitat of the cendrawasi bird is in danger because\nof human activities which are mostly destructive."},{"start":25.24,"end":33.06,"text":"There's illegal logging and then there is the\nconversion from tropical rainforests to agricultural\nplantations."},{"start":37.92,"end":40.94,"text":"Indonesia is home to 41 birds of paradise species,"},{"start":41.4,"end":44.66,"text":"37 of which can be found in the jungles of Papua."},{"start":46.02,"end":49.2,"text":"They are treasured by most locals and tourists alike."},{"start":51.96,"end":56.08,"text":"The cendrawasi bird is very special because it's called\nthe bird of paradise."},{"start":56.8,"end":59.18,"text":"Its colors are unique and it's not like other birds."},{"start":60.08,"end":62.08,"text":"It's only found in one place, not everywhere."},{"start":66.78,"end":69.56,"text":"Although authorities have banned the sale of birds of\nparadise,"},{"start":70.1,"end":74.64,"text":"an ever -growing illicit trade threatens exotic birds\nacross the archipelago,"},{"start":75.3,"end":80.36,"text":"often found smuggled in horrific ways to other parts of\nIndonesia and South East Asia."},{"start":83.74,"end":88.32,"text":"We ensure that the forests won't be destroyed and of\ncourse the cendrawasi will last."},{"start":88.86,"end":92.97999999999999,"text":"And we hope that in the future, since most of the\nforest in Raja Ampat is protected,"},{"start":93.58,"end":94.78,"text":"it's a protected area."},{"start":95.06,"end":96.6,"text":"We will really protect it."},{"start":99.16,"end":110.14,"text":"Papua boasts one -third of Indonesia's remaining\nrainforests and environmentalists here are looking for\nsolutions that will preserve the birds' habitat but\nalso boost the local economy."},{"start":114.12,"end":117.24000000000001,"text":"Birdwatchers provide jobs for the local people."},{"start":118.7,"end":119.44,"text":"For example,"},{"start":120.7,"end":122.3,"text":"the women who are in this village,"},{"start":122.84,"end":126.74,"text":"they can cook and the men can provide homestays."},{"start":129.8," :"b7361.i02","label":"2","prompt":"Do you think that it is more important to protect some endangered species than others? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The main challenge is habitat loss due\nto deforestation. This not only disrupts\nthe animals’ homes but also creates\nfragmented habitats, making it difficult\nfor species to thrive. Additionally, illegal\nhunting and poaching, often driven\nby demand for exotic animals or plant\nproducts, pose significant threats.\n2 Yes, it can be more important to protect\ncertain species which play a critical\nrole in maintaining the balance of the\necosystem, so their protection can\nbenefit other species too.\nNo, all endangered species deserve\nequal protection. Every species has\na unique role, and prioritizing some\nover others could disrupt the natural\ndiversity and balance within the\nrainforest ecosystem.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":23,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7364","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":1,"order":8,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I am happy to pay more for food that\nis organic and grown in a sustainable\nway. / I would accept a small rise in the\ncost of food, but a substantial rise would\nmake it unaffordable.\n2 It may increase the demand for industrial\nscale agriculture, as sustainable\nagriculture tends to be more\nlabour-intensive.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7383","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":1,"order":16,"module":"LISTENING 1","ex":"9","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Write a summary of your discussion about the two questions in Exercise 8. What are your conclusions? Write 150–200 words.","pages":[21],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/109bf0051425ffe8f0c2b1d97c1c39260dc5a4d0f8963af2d0ae0ee8ba5409f0.png"],"provided":"","items":[{"id":"b7383.i01","label":"9","prompt":"Write a summary of your discussion about the two questions in Exercise 8. What are your conclusions? Write 150–200 words.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U01-question:b7382","kind":"student-work","title":"LISTENING 1 Ex 8","pages":[21]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Sustainable agricultural practices would\nmake a huge difference to the health of\nour planet. However, not everyone can\nafford to purchase food which is organic or\nmade to higher environmental standards,\nas this typically costs significantly more\nthan industrially produced food. This, much\nof which is ultra-processed, now forms\na substantial portion of the diet of many\npeople, especially in western countries,\nalthough it is growing in popularity\nworldwide. As well as a detrimental\neffect on human health, this has a high\nenvironmental impact, contributing to\ndeforestation, pressure on water and other\nresources, as well as high emissions of\ngreenhouse gases which lead to climate\nchange. In contrast, sustainable food\nproduction is more suitable in regions\nwhere food will be consumed close to\nwhere it is grown and soon after it is\nharvested, in other words, in rural areas.\nHowever, it is more labour-intensive and so\ninvolves additional costs, which may make\nit unaffordable for many city inhabitants,\neven if they are attracted to the idea of\neating sustainably.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7385","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Put the words in order to make sentences with parallel structures.","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b0732369689e0299b6ce037cba95149594286c81e8ace063418f290d0c83141.png"],"provided":"","items":[{"id":"b7385.i01","label":"1","prompt":"it was / 1.1 degrees / The Earth / in the 1880s. / is now / an average of / warmer than","options":[],"type":"gap/open"},{"id":"b7385.i02","label":"2","prompt":"those / Carbon emissions / are five times / from road transport / higher than / from flying.","options":[],"type":"gap/open"},{"id":"b7385.i03","label":"3","prompt":"more electricity / about two times / currently produces. / Globally, / hydropower produces / than wind","options":[],"type":"gap/open"},{"id":"b7385.i04","label":"4","prompt":"by 2050 / Emissions / unless food production methods are reformed. / from food production / than they / could be 40% higher / are now","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7385.i01","label":"1","prompt":"it was / 1.1 degrees / The Earth / in the 1880s. / is now / an average of / warmer than","options":[],"type":"gap/open"},{"kind":"item","id":"b7385.i02","label":"2","prompt":"those / Carbon emissions / are five times / from road transport / higher than / from flying.","options":[],"type":"gap/open"},{"kind":"item","id":"b7385.i03","label":"3","prompt":"more electricity / about two times / currently produces. / Globally, / hydropower produces / than wind","options":[],"type":"gap/open"},{"kind":"item","id":"b7385.i04","label":"4","prompt":"by 2050 / Emissions / unless food production methods are reformed. / from food production / than they / could be 40% higher / are now","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Possible answers:\n1  The Earth is now an average of 1.1 degrees warmer than\nit was in the 1880s.\n2  Carbon emissions from road transport are five times\nhigher than those from flying.\n3  Globally, hydropower produces about two times more\nelectricity than wind currently produces.\n4  Emissions from food production could be 40% higher\nthan they are now by 2050 unless food production\nmethods are reformed.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7386","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite the non-parallel sentences so that they are clear.","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b0732369689e0299b6ce037cba95149594286c81e8ace063418f290d0c83141.png"],"provided":"","items":[{"id":"b7386.i01","label":"1","prompt":"Wind is expected to cause more coastal flooding than rain.","options":[],"type":"gap/open"},{"id":"b7386.i02","label":"2","prompt":"Farms take up a greater percentage of the land in Turkey than Saudi Arabia.","options":[],"type":"gap/open"},{"id":" ,"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7396","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":23,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to some students having a debate at a seminar on the topic of assigning responsibility for climate change. Before you listen, work with a partner. Look at the charts below and answer the questions.","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e9226145b24b6fc750b5ef645105a39f3533de522eab1bab12a05442b05fb4c9.png"],"provided":"(Source: ourworldindata.org)","items":[{"id":"b7396.i01","label":"1","prompt":"Why should we be concerned about $CO_{2}$ emissions and climate change?","options":[],"type":"qa/open"},{"id":"b7396.i02","label":"2","prompt":"How do you think the data in the diagram was gathered?","options":[],"type":"qa/open"},{"id":"b7396.i03","label":"3","prompt":"What conclusions can be drawn about the link between wealth and climate change?","options":[],"type":"qa/open"},{"id":"b7396.i04","label":"4","prompt":"How do you think a similar diagram produced in 30 years' time might look, and why?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"(Source: ourworldindata.org)"},{"kind":"item","id":"b7396.i01","label":"1","prompt":"Why should we be concerned about $CO_{2}$ emissions and climate change?","options":[],"type":"qa/open"},{"kind":"item","id":"b7396.i02","label":"2","prompt":"How do you think the data in the diagram was gathered?","options":[],"type":"qa/open"},{"kind":"item","id":"b7396.i03","label":"3","prompt":"What conclusions can be drawn about the link between wealth and climate change?","options":[],"type":"qa/open"},{"kind":"item","id":"b7396.i04","label":"4","prompt":"How do you think a similar diagram produced in 30 years' time might look, and why?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 CO2 emissions are known to cause\nclimate change. Rising temperatures can\nlead to melting ice caps and increased\nflooding, more frequent droughts\nand extreme weather events, and\nfood shortages.\n2 The data would be gathered by\nanalysing statistics of how many people\nlive in certain areas, what kind of income\nthey have and how much energy they\nuse on average.\n3 It shows that the higher the income,\nthe greater the contribution to global\nemissions. Therefore, wealth contributes\nto climate change.\n4 I think that it would look largely similar.\nThough hopefully there would be some\nreduction in the overall amount of\ncarbon emissions.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[{"page":25,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e9226145b24b6fc750b5ef645105a39f3533de522eab1bab12a05442b05fb4c9.png","width":3040,"height":4096}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7397","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":24,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the text from an environmental organization about its mission to promote sustainable transport. Work with a partner and write definitions of the words in bold.","pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9eea9ecef39edf4168cedbb2597d4889fd345fc9f5daa5fa56bc632abd4f1338.png"],"provided":"## OUR MISSION\n\nIt's been known for many years that the production of greenhouse gases, in particular from aeroplanes, is leading to potentially catastrophic levels of climate change. And yet, every year, unprecedented numbers of people are choosing to fly. As a result, the number of new airports and runways is accelerating. We believe that governments should be diverting funds away from such carbon-intensive projects, and instead, funding renewable energy initiatives that will enable us to effectively combat climate change. This is the most urgent issue facing the world today; it is not a burden we can simply leave to future generations. This is why we are working hard to promote green forms of transport. We are also calling for sanctions against companies and businesses who continue polluting or who refuse to dispose of their waste responsibly, continuing the shameful practice of dumping toxic waste in our rivers and oceans.\n\nunprecedented – when something has never happened before","items":[{"id":"b7397.i01","label":"1","prompt":"Write a definition for catastrophic.","options":[],"type":"qa/open"},{"id":"b7397.i02","label":"2","prompt":"Write a definition for accelerating.","options":[],"type":"qa/open"},{"id":"b7397.i03","label":"3","prompt":"Write a definition for diverting.","options":[],"type":"qa/open"},{"id":"b7397.i04","label":"4","prompt":"Write a definition for carbon-intensive.","options":[],"type":"qa/open"},{"id":"b7397.i05","label":"5","prompt":"Write a definition for combat.","options":[],"type":"qa/open"},{"id":"b7397.i06","label":"6","prompt":"Write a definition for burden.","options":[],"type":"qa/open"},{"id":"b7397.i07","label":"7","prompt":"Write a definition for sanctions.","options":[],"type":"qa/open"},{"id":"b7397.i08","label":"8","prompt":"Write a definition for dispose of.","options":[],"type":"qa/open"},{"id":"b7397.i09","label":"9","prompt":"Write a definition for shameful.","options":[],"type":"qa/open"},{"id":"b7397.i10","label":"10","prompt":"Write a definition for dumping.","options":[],"type":"qa/open"},{"id":"b7397.i11","label":"11","prompt":"Write a definition for toxic.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## OUR MISSION"},{"kind":"text","text":"It's been known for many years that the production of greenhouse gases, in particular from aeroplanes, is leading to potentially catastrophic levels of climate change. And yet, every year, unprecedented numbers of people are choosing to fly. As a result, the number of new airports and runways is accelerating. We believe that governments should be diverting funds away from such carbon-intensive projects, and instead, funding renewable energy initiatives that will enable us to effectively combat climate change. This is the most urgent issue facing the world today; it is not a burden we can simply leave to future generations. This is why we are working hard to promote green forms of transport. We are also calling for sanctions against companies and businesses who continue polluting or who refuse to dispose of their waste responsibly,"},{"kind":"text","text":"continuing the shameful practice of dumping toxic waste in our rivers and oceans."}],[{"kind":"text","text":"unprecedented – when something has never happened before"},{"kind":"item","id":"b7397.i01","label":"1","prompt":"Write a definition for catastrophic.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i02","label":"2","prompt":"Write a definition for accelerating.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i03","label":"3","prompt":"Write a definition for diverting.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i04","label":"4","prompt":"Write a definition for carbon-intensive.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i05","label":"5","prompt":"Write a definition for combat.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i06","label":"6","prompt":"Write a definition for burden.","options":[],"type":"qa/open"}],[{"kind":"item","id":"b7397.i07","label":"7","prompt":"Write a definition for sanctions.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i08","label":"8","prompt":"Write a definition for dispose of.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i09","label":"9","prompt":"Write a definition for shameful.","options":[],"type":"qa/open"},{"kind":"item","id":"b7397.i10","label":"10","prompt":"Write a definition for dumping.","options":[],"type":"qa/open"},{"kind":"item","id": \ncombatting it.\n2 She wants them to discuss, analyse and\nevaluate what they have read before\nclass, as well as what others say in the\ndiscussion.\n3 I would have done the research as\nadvised in advance of the lesson by\nreading from at least three or four\ndifferent sources. I would have made\nnotes, including details of where the\ninformation was sourced from.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7403","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":28,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"1.5 Listen to the seminar. Which student(s) expresses these opinions? Write E (Emma), J (Jack), S (Sam) and / or T (Tomoko).","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef1b03e8b9d202ad92c7795f816e833c90804b146fcd5f168f8dea3ff2dccc78.png"],"provided":"","items":[{"id":"b7403.i01","label":"1","prompt":"Too little has been done to reduce emissions of $CO_{2}$ .","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"},{"id":"b7403.i02","labe am)","T (Tomoko)"],"type":"choice/closed"},{"kind":"item","id":"b7403.i03","label":"3","prompt":"Combatting climate change may be unaffordable for some countries.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"}],[{"kind":"item","id":"b7403.i04","label":"4","prompt":"Wealthy countries have contributed more to global warming than poor ones have.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"},{"kind":"item","id":"b7403.i05","label":"5","prompt":"Climate change poses similar challenges to both rich and poor countries.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"},{"kind":"item","id":"b7403.i06","label":"6","prompt":"It can be difficult to fairly calculate a country's contribution to climate change.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"}],[{"kind":"item","id":"b7403.i07","label":"7","prompt":"Some countries should have to pay more than others to combat climate change.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"},{"kind":"item","id":"b7403.i08","label":"8","prompt":"The dialogue between countries about climate change should not be reduced to conflict about poor resource management.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"},{"kind":"item","id":"b7403.i09","label":"9","prompt":"The amount countries should pay to combat climate change can be calculated objectively.","options":["E (Emma)","J (Jack)","S (Sam)","T (Tomoko)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 1.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/50c093ba73127da339d26dab8929926293e1eb5ce8449419872f0ffc9276c70c.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 E (We haven’t yet managed to meaningfully bring down\nemissions, meaning that climate c70c.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Emma\nDeveloped countries should bear\nmost of the cost for controlling\nclimate change.\n•  developed countries have caused\nclimate change\n•  emissions = 37 billion tonnes per year\n•  much of this is in Europe and North America\n2 Jack\nPoorer countries are often more\nseverely affected by climate change.\n•  Bangladesh is very vulnerable to flooding\n•  Bangladesh has a large population but a low\ncarbon footprint\n3 Sam\nIt is pointless to calculate how\nmuch different countries have\ncontributed to climate change.\n•  it’s difficult to fairly say which countries are\nmost responsible for carbon emissions\n•  China has a high footprint, but is a\nmajor manufacturer\n•  Britain has been causing industrial pollution\nfor longer than other countries\n4 Tomoko\nImmediate action is needed to\ncombat climate change.\n•  in 8 consecutive years up to 2023, each was\nthe hottest\n•  temperatures are rising everywhere, even\nin Antarctica","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7406","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":30,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"The students made their points by linking two different quantities. Use your notes from Exercise 7 to match a quantity from box A with one from box B. Work with a partner to express the point the students were making when linking the quantities.","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d4e836c3b63a9832daeac7087a79be82e11ab6cdf28554b9a06141afef5f8e5f.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>1/2\u003c/td>\u003ctd>0.6%\u003c/td>\u003ctd>5%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd colspan=\"2\">7 tonnes\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>\n\n\u003ctable>\u003ctr>\u003ctd rowspan=\"2\">B\u003c/td>\u003ctd>1%\u003c/td>\u003ctd>15%\u003c/td>\u003ctd>2023\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"2\">170 million\u003c/td>\u003ctd>5 tonnes\u003c/td>\u003c/tr>\u003c/table>\n\nOne of the speakers said that the poorest half of the world's population release just 15% of all greenhouse gas emissions.","items":[{"id":"b7406.i01","label":"1/2","prompt":"1/2","options":["1%","15%","2023","170 million","5 tonnes"],"type":"choice/closed"},{"id":"b7406.i02","label":"0.6%","prompt":"0.6%","options":["1%","15%","2023","170 million","5 tonnes"],"type":"choice/closed"},{"id":"b7406.i03","label":"5%","prompt":"5%","options":["1%","15%","2023","170 million","5 tonnes"],"type":"choice/closed"},{"id":"b7406.i04","label":"7 tonnes","prompt":"7 tonnes","options":["1%","15%","2023","170 million","5 tonnes"],"type":"choice/closed"},{"id":"b7406.i05","label":"8","prompt":"8","options":["1%","15%","2023","170 million","5 tonnes"],"type":"choice/closed"}],"layout":"list","references":[{"id":"B05-LS-U01-question:b7405","kind":"student-work","title":"LISTENING 2 Ex 7","pages":[28]}],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"A","header":false,"colspan":1,"rowspan":1},{"text":"1/2","header":false,"colspan":1,"rowspan":1},{"text":"0.6%","header":false,"colspan":1,"rowspan":1},{"text":"5%","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"7 tonnes","header":false,"colspan":2,"rowspan":1},{"text":"8","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"table","rows":[[{"text":"B","header":false,"colspan":1,"rowspan":2},{"text":"1%","header":false,"colspan":1,"rowspan":1},{"text":"15%","header":false,"colspan":1,"rowspan":1},{"text":"2023","header":false,"colspan":1,"rowspan":1}],[{"text":"170 million","header":false,"colspan":2,"rowspan":1},{"text":"5 tonnes","header":false,"colspan":1,"rowspan":1}]]},{"kind":"text","text":"One of the speakers said that the poorest half of the world's population release just 15% of all greenhouse gas emissions."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1/2 & 15%—the poorest half of the\nworld contribute just 15% of the world’s\ngreenhouse gas emissions\n0.6% & 170 million—Bangladesh’s\npopulation of 170 million contribute 0.6%\nof emissions, meaning that the country’s\nper capita emissions are lower than the\nglobal average.\n7 & 5—China’s per capita emissions rate is\n7 tonnes of CO2, compared to the global\naverage of 5 tonnes\n1% & 5%—Britain contributes 1% of all\nemissions now, but has contributed 5% of\nall emissions ever\n8 & 2023—each of the 8 years up to 2023\nwas the hottest on record","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7408","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":31,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Read these rhetorical questions that the students used. Match the extracts (1–5) with the speaker's purpose (a–e).","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d4e836c3b63a9832daeac7087a79be82e11ab6cdf28554b9a06141afef5f8e5f.png"],"provided":"","items":[{"id":"b7408.i01","label":"1","prompt":"Is it really viable for us to wait for these poorer countries to somehow develop costly new green technologies themselves without help from wealthier countries?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"},{"id":"b7408.i02","label":"2","prompt":"Given the severity of the situation, isn't the most urgent issue for nations to combat climate change in unison, rather than arguing about who is to blame?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"},{"id":"b7408.i03","label":"3","prompt":"But is that really what the numbers are telling us?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"},{"id":"b7408.i04","label":"4","prompt":"What good will it do if international relations in the coming years are dominated by arguments about which countries are managing their natural resources in an unsustainable way?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"},{"id":"b7408.i05","label":"5","prompt":"But shouldn't this be done in a spirit of collaboration, rather than by green-shaming on the international stage?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7408.i01","label":"1","prompt":"Is it really viable for us to wait for these poorer countries to somehow develop costly new green technologies themselves without help from wealthier countries?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"}],[{"kind":"item","id":"b7408.i02","label":"2","prompt":"Given the severity of the situation, isn't the most urgent issue for nations to combat climate change in unison, rather than arguing about who is to blame?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"}],[{"kind":"item","id":"b7408.i03","label":"3","prompt":"But is that really what the numbers are telling us?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"}],[{"kind":"item","id":"b7408.i04","label":"4","prompt":"What good will it do if international relations in the coming years are dominated by arguments about which countries are managing their natural resources in an unsustainable way?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"}],[{"kind":"item","id":"b7408.i05","label":"5","prompt":"But shouldn't this be done in a spirit of collaboration, rather than by green-shaming on the international stage?","options":["recommending an approach which is preferable to an alternative","questioning whether a conclusion drawn from statistics is valid","suggesting that an expectation may be unreasonable","recommending something that should be prioritized","expressing concerns that possible future events are not desirable"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 c 2 d 3 b 4 e 5 a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":26,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7410","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":32,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Use ideas from Listening 1 and Listening 2 to answer the following questions.","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d4e836c3b63a9832daeac7087a79be82e11ab6cdf28554b9a06141afef5f8e5f.png"],"provided":"","items":[{"id":"b7410.i01","label":"1","prompt":"Which figure do you think is more important: a country's current carbon emissions, or its historical total emissions?","options":[],"type":"discuss/open"},{"id":"b7410.i02","label":"2","prompt":"If a country has to choose between allocating resources to economic development, or to environmental projects, which is the better course of action? Why?","options":[],"type":"discuss/open"},{"id":"b7410.i03","label":"3","prompt":"Do you think that farmers should be persuaded not to use any chemical pesticides or fertilizers? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7410.i01","label":"1","prompt":"Which figure do you think is more important: a country's current carbon emissions, or its historical total emissions?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7410.i02","label":"2","prompt":"If a country has to choose between allocating resources to economic development, or to environmental projects, which is the better course of action? Why?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7410.i03","label":"3","prompt":"Do you think that farmers should be persuaded not to use any chemical pesticides or fertilizers? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I believe that a country’s current\nemissions should be used, as this\nis likely to be the least complicated\nand controversial way of calculating\nwho pays the bill for combatting\nclimate change.\nIn my opinion, I think historical total\nemissions should be considered. There\nare industrialized countries which have\nbeen pouring out pollutants over many\nyears, and have built the wealth in doing\nso to tackle climate change.\n2 My position is that environmental\nprojects should always take priority,\nin order to safeguard the long-term\nwellbeing of the environment.\nAllocating resources to economic\ndevelopment should take priority,\nespecially if those projects directly\nimpact the social welfare of a\ncountry’s citizens.\n3 We have to save our land and our\nsoil. Pouring chemicals into the land\nis bad for the land, the environment\nand ourselves.\nI think we need fast and high-yield\ngrowth of crops in order to feed the\never-growing population of the world.\nHowever, we can’t damage the land,\nanimals and ourselves in order to do so.\nIt’s a difficult question.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7415","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Discuss the questions.","pages":[30],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d96a1ad584a9bd32997389242cf2a073511a10abc1b00393b605529e9cc44d47.png"],"provided":"","items":[{"id":"b7415.i01","label":"1","prompt":"Many nations have national parks, historically important or beautiful wild spaces that the government protects from development. Think about a national park – a place you have visited or would like to visit. Where is it? What did you do and see there? What do you remember most about your visit? Or, why would you like to visit it?","options":[],"type":"discuss/open"},{"id":"b7415.i02","label":"2","prompt":"Why do you think national parks were established?","options":[],"type":"discuss/open"},{"id":"b7415.i03","label":"3","prompt":"Why do you think governments choose particular places to become national parks?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7415.i01","label":"1","prompt":"Many nations have national parks, historically important or beautiful wild spaces that the government protects from development. Think about a national park – a place you have visited or would like to visit. Where is it? What did you do and see there? What do you remember most about your visit? Or, why would you like to visit it?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7415.i02","label":"2","prompt":"Why do you think national parks were established?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7415.i03","label":"3","prompt":"Why do you think governments choose particular places to become national parks?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I visited the Tatra Mountains in Poland,\nwhere I went hiking and camping. What\nmade the greatest impression was the\nspectacular view from the peak.\n2 To protect unspoilt areas of the world\nfrom human encroachment, and to\npreserve beautiful places for people\nto enjoy.\n3 They stimulate the local economy and\nbenefit the mental and physical health\nof visitors.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7416","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read about some of the issues that national parks need to address today. Consider the potential problems and write some possible consequences if the issues are not resolved.","pages":[30,31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d96a1ad584a9bd32997389242cf2a073511a10abc1b00393b605529e9cc44d47.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a068c4f8b58233afa9cfb66d7322e7b3bb0e332cde58fc233055c1a5154c17ee.png"],"provided":"## NEIGHBOURS\n\nParks do not exist in isolation. They are often surrounded by residential areas, as well as commercial, agricultural and industrial development. The wild species that live in a park do not recognize the park's boundaries, often moving in and out of it. Local human populations may threaten wild species by hunting them as game, to sell as pets or for exotic trophies and medicines.\n\nPossible consequences:\nNON-HUMAN VISITORS\n\nWild places like national parks are very attractive to all kinds of species, including those from other parts of the country or other parts of the world. They often arrive in the park with human visitors. These ‘invasive species’, including insects, plants and fish, pose a serious threat to a park’s native species and its ecosystem.\n\nPossible consequences:\nCLIMATE CHANGE\n\nAll over the world, weather conditions are getting more extreme every year. Parks in coastal and upland areas are experiencing accelerated soil erosion. Wetland parks are flooded to greater depths. In other parks, increased temperatures are causing rivers and streams to dry up.\n\nPossible consequences:\nPOPULARITY\n\nThe ever-growing popularity of national parks is placing increasing pressure on their ecosystems. Visitors to national parks need roads and services. What happens when the visitors' needs and desires conflict with those of the natural inhabitants?\n\nPossible consequences:\nNATURAL RESOURCES\n\nNational parks are often rich in natural resources, both on and under the land. These resources include trees, oil, gas and minerals. There is great pressure on the parks to allow private companies to extract these resources.\n\nPossible consequences:","items":[{"id":"b7416.i01","label":"NEIGHBOURS","prompt":"Possible consequences: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## NEIGHBOURS"},{"kind":"text","text":"Parks do not exist in isolation. They are often surrounded by residential areas, as well as commercial, agricultural and industrial development. The wild species that live in a park do not recognize the park's boundaries, often moving in and out of it. Local human populations may threaten wild species by hunting them as game, to sell as pets or for exotic trophies and medicines."},{"kind":"text","text":"NON-HUMAN VISITORS"},{"kind":"text","text":"Wild places like national parks are very attractive to all kinds of species, including those from other parts of the country or other parts of the world. They often arrive in the park with human visitors. These ‘invasive species’, including insects, plants and fish, pose a serious threat to a park’s native species and its ecosystem."}],[{"kind":"text","text":"CLIMATE CHANGE"},{"kind":"text","text":"All over the world, weather conditions are getting more extreme every year. Parks in coastal and upland areas are experiencing accelerated soil erosion. Wetland parks are flooded to greater depths. In other parks, increased temperatures are causing rivers and streams to dry up."},{"kind":"text","text":"POPULARITY"},{"kind":"text","text":"The ever-growing popularity of national parks is placing increasing pressure on their ecosystems. Visitors to national parks need roads and services. What happens when the visitors' needs and desires conflict with those of the natural inhabitants?"},{"kind":"text","text":"NATURAL RESOURCES"}],[{"kind":"text","text":"National parks are often rich in natural resources, both on and under the land. These resources include trees, oil, gas and minerals. There is great pressure on the parks to allow private companies to extract these resources."},{"kind":"item","id":"b7416.i01","label":"NEIGHBOURS","prompt":"Possible consequences: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Neighbours: The parks can be polluted\nor littered by neighbouring businesses\nor homes, damaging the habitat and\nthe animals that live there. Wild animals\nfrom the park could catch diseases from\ndomestic animals when they go out of the\npark; they could bring these diseases back\ninto the park and damage the population.\nHunting and poaching can cause species to\ngo extinct.\nNon-human visitors: Invasive species could\nreplace native species, damage the habitat\nand disrupt the park’s ecosystem. Any loss\nof species disrupts the ecosystem and\ncould cause the park to lose its value as an\nattraction and as a preserve for wildlife.\nClimate change: The landscape of parks\ncould change drastically. Animals will die or\nleave the park. Migrating species will go to\nnew places.\nPopularity: Building roads and services for\nvisitors could damage the habitat, but if\nthese are not built, visitors might not come.\nIf people do not visit the park, the park may\nnot have enough funding to protect wildlife\nfrom hunters or be able to justify its status\nas a park.\nNatural resources: The extraction\nof natural resources could lead to\nenvironmental pollution, such as oil spills or\npolluted river water, which are disastrous for\nanimal species. Deforestation of parkland\nreduces the size of the habitat and may\nresult in species being lost.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7423","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"NATURAL RESOURCES"},"instruction":"Work in small groups. Discuss the questions.","pages":[32],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae5fb9cde5686593fd5b780d5f8334a1de186edd3260ffc9503b39c732552acc.png"],"provided":"1 Which issues affect national parks in your part of the world or a park you know well?\nOne of the most urgent challenges in my country is ...\n2 Which of the issues facing national parks do you think represents the biggest challenge?\nFor me, the priority should be ...","items":[{"id":"b7423.i01","label":"1","prompt":"Which issues affect national parks in your part of the world or a park you know well?","options":[],"type":"discuss/open"},{"id":"b7423.i02","label":"2","prompt":"Which of the issues facing national parks do you think represents the biggest challenge?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePag ices for them.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":26,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7425","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"NATURAL RESOURCES"},"instruction":"Work in small groups. Discuss each potential mission of national parks. Take notes on all the arguments for and against each mission.","pages":[32],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae5fb9cde5686593fd5b780d5f8334a1de186edd3260ffc9503b39c732552acc.png"],"provided":"\u003ctable>\u003ctr>\u003ctd colspan=\"2\">mission A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>points in favour (for)\u003c/td>\u003ctd>points opposed (against)\u003c/td>\u003c/tr>\u003c/table>\n\u003ctable>\u003ctr>\u003ctd colspan=\"2\">mission B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>points in favour (for)\u003c/td>\u003ctd>points opposed (against)\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7425.i01","label":"1","prompt":"mission A: points in favour (for)","options":[],"type":"discuss/open"},{"id":"b7425.i02","label":"2","prompt":"mission A: points opposed (against)","options":[],"type":"discuss/open"},{"id":"b7425.i03","label":"3","prompt":"mission B: points in favour (for)","options":[],"type":"discuss/open"},{"id":"b7425.i04","label":"4","prompt":"mission B: points opposed (against)","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"mission A","header":false,"colspan":2,"rowspan":1}],[{"text":"points in favour (for)","header":false,"colspan":1,"rowspan":1},{"text":"points opposed (against)","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"table","rows":[[{"text":"mission B","header":false,"colspan":2,"rowspan":1}],[{"text":"points in favour (for)","header":false,"colspan":1,"rowspan":1},{"text":"points opposed (against)","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b7425.i02","label":"2","prompt":"mission A: points opposed (against)","options":[],"type":"discuss/open"},{"kind":"item","id":"b7425.i04","label":"4","prompt":"mission B: points opposed (against)","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"mission A\nfor: many animal species are in\ndecline, and national parks provide an\nenvironment where they can be more\neffectively protected\nagainst: national parks may contain\nvaluable resources, and preventing\nextraction of these could be damaging to\nthe local economy\nmission B\nfor: children can learn to look after\nthe natural world through visits to\nnational parks","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7426","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"6","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"NATURAL RESOURCES"},"instruction":"What do you think the mission, or missions, of national parks should be? Make notes on your position below. Consider the most important arguments that support your position.","pages":[32],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae5fb9cde5686593fd5b780d5f8334a1de186edd3260ffc9503b39c732552acc.png"],"provided":"My position: ____","items":[{"id":"b7426.i01","label":"My position","prompt":"My position: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"My position: ____"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"My position: the mission of national parks should be:\nto protect the landscape and wildlife\nto be great places to live, work and visit\nto provide leisure opportunities that leave no mark\non the landscape","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7430","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":39,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"Complete the conversation below with phrases a-d.","pages":[33],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99c2904ba7d365bd63f2e97b7d2aa21aca39ac3547112ec7ab45c50c5e7d0b56.png"],"provided":"a Not necessarily\nb I'm afraid that's not really the point\nc Actually\nd I would agree with you if\n\nSteve: You're poisoning the groundwater by using those pesticides in your garden.\nMia: (1) ____. If you use pesticides carefully, they're totally safe. At least, that's what I've read.\nSteve: (2) ____ there is no way to use these products safely. They should not be used under any circumstances.\nMia: (3) ____ there were any other options, but nothing works as well against the insects that ruin my flowers and vegetables.\nSteve: (4) ____. What does it matter if they work really well in your garden? It's irresponsible.","items":[{"id":"b7430.i01","label":"1","prompt":"Mia: (1) ____. If you use pesticides carefully, they're totally safe. At least, that's what I've read.","options":["Not necessarily","I'm afraid that's not really the point","Actually","I would agree with you if"],"type":"gap/open"},{"id":"b7430.i02","label":"2","prompt":"Steve: (2) ____ there is no way to use these products safely. They should not be used under any circumstances.","options":["Not necessarily","I'm afraid that's not really the point","Actually","I would agree with you if"],"type":"gap/open"},{"id":"b7430.i03","label":"3","prompt":"Mia: (3) ____ there were any other options, but nothing works as well against the insects that ruin my flowers and vegetables.","options":["Not necessarily","I'm afraid that's not really the point","Actually","I would agree with you if"],"type":"gap/open"},{"id":"b7430.i04","label":"4","prompt":"Steve: (4) ____. What does it matter if they work really well in your garden? It's irresponsible.","options":["Not necessarily","I'm afraid that's not really the point","Actually","I would agree with you if"],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a Not necessarily"},{"kind":"text","text":"b I'm afraid that's not really the point"},{"kind":"text","text":"c Actually"},{"kind":"text","text":"d I woul a94531cf2c1bdab13919a7e7950153ad38da9e6b6460a50f577a141563b.png"],"provided":"• conservation of existing wildlife habitats;\n- the value for money that investing in national parks can provide;\n- the role of national parks in a low-carbon future.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"• conservation of existing wildlife habitats;"},{"kind":"text","text":"- the value for money that investing in national parks can provide;"},{"kind":"text","text":"- the role of national parks in a low-carbon future."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"conservation of existing wildlife habitats","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7437","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":43,"module":"SPEAKING TASK","ex":"2","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Review your notes in Critical thinking on page 32. In small groups, write a statement that presents your point of view.","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a3d74a94531cf2c1bdab13919a7e7950153ad38da9e6b6460a50f577a141563b.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U01-question:b7426","kind":"student-work","title":"CRITICAL THINKING Ex 6","pages":[32]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U01-publisher-page:p032","title":"原题或核对备注所引第32页","pages":[32],"text":"","screens":[],"sources":[{"page":32,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae5fb9cde5686593fd5b780d5f8334a1de186edd3260ffc9503b39c732552acc.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Our position is that the primary purpose\nof national parks is to protect wildlife and\nthe landscape from the attack that it has\nbeen under from humankind for centuries.\nNational parks should be places where the\nneeds of the natural world come first, and\nthe needs of humans second.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7438","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":44,"module":"SPEAKING TASK","ex":"3","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Prepare a list of arguments you think the other side will make. Discuss how you would argue against them.","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a3d74a94531cf2c1bdab13919a7e7950153ad38da9e6b6460a50f577a141563b.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"• Public Access and Enjoyment: National\nparks are public resources meant for\neveryone to enjoy, promoting outdoor\nrecreation and mental well-being\nfor visitors.\n–  the primary role of national\nparks is conservation. If human\naccess compromises the health of\necosystems, it defeats the park’s\npurpose. Protecting nature ultimately\nbenefits everyone in the long run.\n• Economic Benefits: Parks boost local\neconomies through tourism, creating\njobs and supporting businesses, which\ncould suffer if human access is restricted.\n–  While tourism is important,\neconomic gains shouldn’t outweigh\nenvironmental preservation. Overuse\nfrom tourism can degrade the natural\nbeauty and resources that make these\nparks appealing in the first place.\n• Education and Awareness: Allowing\npeople to experience nature firsthand\nfosters appreciation and awareness,\nwhich can lead to greater public support\nfor conservation efforts.\n–  people can still learn about\nconservation through regulated access\nand educational programs that don’t\nharm the environment, like virtual\ntours, controlled visits, and outreach\nefforts that respect ecological limits.\n• Balancing Conservation with Use:\nMany argue that sustainable human use\nof parks is possible without damaging\necosystems, creating a balance between\npreservation and accessibility.\n–  While some areas can allow\nsustainable use, not all ecosystems\nwithstand heavy human activity.\nPrioritizing preservation ensures these\nlandscapes and species remain intact\nfor future generations.\n• Equity and Inclusion: Restricting\naccess could disproportionately affect\ncommunities with less access to green\nspaces, limiting opportunities for all\npeople to connect with nature.\n–  Inclusive access can be maintained\nthrough regulated programs and\nalternative green spaces, but we need\nto ensure that national parks serve\ntheir fundamental role – conservation –\nbefore recreational needs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7439","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":45,"module":"SPEAKING TASK","ex":"4","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Refer to the Task checklist as you prepare for your debate.","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a3d74a94531cf2c1bdab13919a7e7950153ad38da9e6b6460a50f577a141563b.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Present a statement of your point of view with supporting points.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ensure that any comparisons you make are parallel.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Use expressions for assigning credit and blame or responsibility where appropriate.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Challenge other points of view politely.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"TASK CHECKLIST","header":false,"colspan":1,"rowspan":1},{"text":"✓","header":false,"colspan":1,"rowspan":1}],[{"text":"Present a statement of your point of view with supporting points.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Ensure that any comparisons you make are parallel.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Use expressions for assigning credit and blame or responsibility where appropriate.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Challenge other points of view politely.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7441","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":46,"module":"SPEAKING TASK","ex":"5","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PRACTISE"},"instruction":"Practise responding to the list of arguments you made in Exercise 3.","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a3d74a94531cf2c1bdab13919a7e7950153ad38da9e6b6460a50f577a141563b.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U01-question:b7438","kind":"student-work","title":"SPEAKING TASK Ex 3","pages":[34]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U01-question:b7443","book":5,"unit":1,"track":"LS","topic":"CONSERVATION","lesson":2,"order":47,"module":"SPEAKING TASK","ex":"6","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"DISCUSS"},"instruction":"Join a group of students who support a different point of view. Have your debate. Each side should begin with an opening statement. Then, each student should contribute the following:","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a3d74a94531cf2c1bdab13919a7e7950153ad38da9e6b6460a50f577a141563b.png"],"provided":"- at least one statement arguing for your point of view;\n- at least one statement arguing against another point of view.","items":[],"layout":"list","references":[{"id":"B05-LS-U01-question:b7437","kind":"student-work","title":"SPEAKING TASK Ex 2","pages":[34]},{"id":"B05-LS-U01-question:b7438","kind":"student-work","title":"SPEAKING TASK Ex 3","pages":[34]}],"materials":[],"coursePages":[[{"kind":"text","text":"- at least one statement arguing for your point of view;"},{"kind":"text","text":"- at least one statement arguing against another point of view."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Student 1: For me, the primary purpose of\nnational parks should be to provide leisure\nopportunities for people to enjoy in their free\ntime. The national park authorities should\nensure that a range of outdoor pursuits can\nbe enjoyed by visitors to the area, from\nkayaking and rock-climbing to motor cycling\nand hunting, for example in the North York\nMoors National Park in England. I don’t think\nit is realistic to expect national parks to solve\nissues such as habitat loss and pollution.\nResponsibility falls on the shoulders of\ngovernments. They have more power and\nbigger budgets than national parks do!\nStudent 2: Actually, my position is rather\ndifferent. Why shouldn’t national parks step\nup and play a role in preserving the natural\nenvironment, and in shaping people’s\nbehaviour? I think national parks have a\nrole to play in setting an example. They can\ndemonstrate environmental good practice,\nfor example, allowing wildflowers to grow\nand species of wild animal to thrive. Then\nhopefully visitors to the national parks\ncan learn from their visit and take these\npractices back into their own communities\nand their own lives.\nUNIT 2\nUNLOCK YOUR\nKNOWLEDGE\npage 37\n1 Designers need to have the creativity\nto be able to imagine things which\ndon’t yet exist. They need to be critical\nin order to keep trying to improve a\ndesign, and they need determination.\n2 Computer programs can instantly show\nwhat something would look like in three\ndimensions. They can use modelling to\npredict how well something would cope\nwith real world conditions, for example\nhow air may slow down a moving car.\n3D printing enables a working model to\nbe produced quickly and at low cost.\n3 It depends on the consumer and\nhow concerned they are about the\nenvironmental impact of their behaviour.\nIn most cases, repairing something\nhas a smaller carbon footprint than\nreplacing it with a new one, which uses\nup valuable resources.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmanso
