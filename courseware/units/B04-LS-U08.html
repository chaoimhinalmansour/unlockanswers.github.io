"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c39a16b0450e077883b91c88-L4LS-U08.mp4","captions":[{"start":0,"end":3.94,"text":"Masako Wakamiya has always been a woman of action,"},{"start":4.24,"end":5.94,"text":"ready to take on challenges."},{"start":6.68,"end":7.62,"text":"She was a banker,"},{"start":8.16,"end":11.26,"text":"before it was common for women in Japan to have such\njobs."},{"start":11.8,"end":13.66,"text":"And when she retired at 60,"},{"start":14.12,"end":16.42,"text":"she began a new chapter in her life,"},{"start":16.8,"end":17.96,"text":"with new challenges."},{"start":18.98,"end":28.94,"text":"She had never used a computer before, but she read that\nusing a computer could help her connect with other\npeople while she stayed at home to look after her\nelderly mother."},{"start":29.5,"end":30.88,"text":"So she bought one."},{"start":31.66,"end":33.34,"text":"Over the next 20 years,"},{"start":33.72,"end":36.62,"text":"she taught herself about computers and the internet."},{"start":37.44,"end":40.28,"text":"She got a smartphone and started using apps."},{"start":40.98,"end":44.34,"text":"But she found that everything was designed for young\npeople."},{"start":44.92,"end":50.64,"text":"She knew that older people could learn to use\ntechnology and even have fun doing it,"},{"start":50.98,"end":53.52,"text":"if someone designed with them in mind."},{"start":54.4,"end":60,"text":"She contacted app designers and asked them to develop\ngames for older users."},{"start":60.54,"end":60.8,"text":"But"},{"start":60.8,"end":61.06,"text":"no"},{"start":61.06,"end":62.04,"text":"one was interested."},{"start":62.88,"end":65.38,"text":"So she did what she had always done."},{"start":65.96,"end":67.24,"text":"She did it herself."},{"start":68.06,"end":72.98,"text":"She learned Apple's coding language so she could\ndevelop an app for the iPhone."},{"start":73.84,"end":77.56,"text":"She used content that is familiar to older Japanese\nusers."},{"start":78.12,"end":81.58,"text":"Figures from the Japanese festival Hinamatsuri,"},{"start":82.14,"end":83.28,"text":"or Dolls Day."},{"start":83.98,"end":85.22,"text":"On this day,"},{"start":85.74,"end":88.86,"text":"dolls are placed on a platform in a specific order."},{"start":89.46000000000001,"end":90.84,"text":"In Wakamiya's game,"},{"start":91.3,"end":95.08,"text":"the goal is to place all the figures in the correct\norder."},{"start":95.97999999999999,"end":97.75999999999999,"text":"The game is harder than it sounds."},{"start":98.24000000000001,"end":99.8,"text":"The arrangements are complex."},{"start":100.7,"end":101.36,"text":"Tim Cook,"},{"start":101.8,"end":102.78,"text":"the head of Apple,"},{"start":103.18,"end":105.66,"text":"heard about Wakamiya and her app."},{"start":106.52000000000001,"end":108.52000000000001,"text":"Calling her work inspiring,"},{"start":109.14,"end":112.18,"text":"he invited her to an app developers conference."},{"start":112.18,"end":113.44,"text":"At 82,"},{"start":114.02000000000001,"end":116.22,"text":"she was the oldest participant."},{"start":117.72,"end":120.3,"text":"Describing her experience developing the app,"},{"start":120.96,"end":122.06,"text":"Wakamiya recalls..."},{"start":123.58,"end":128.62,"text":"Elderly people don't play games on their phones much\nbecause games aren't interesting for them."},{"start":130.62,"end":132.5,"text":"I've heard a lot of people say that."},{"start":132.86,"end":137.52,"text":"So I thought it would be nice if there were some apps\nwhich elderly people could enjoy."},{"start":142.94,"end":146.48,"text":"This game is based on traditional Japanese culture."},{"start":147.26,"end":150.74,"text":"I wanted to tell the next generation about traditional\nculture."},{"start":152.22,"end":158.98,"text":"I thought that making game and letting young people\nplay it would be easier than explaining culture to\nthem."},{"start":160.68,"end":164.52,"text":"When I first saw the pictures moving, I was really\nimpressed."},{"start":165.4,"end":167.4,"text":"First, I create the images."},{"start":167.92000000000002,"end":171.46,"text":"Then I run the simulation and they start moving and\ntalking."},{"start":172.04,"end":174.46,"text":"It's really impressive."},{"start":176.12,"end":179.6,"text":"Programming is the best way for me to feel a sense of\nachievement."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F (Wakamiya worked in banking before she retired.)\n2 F (She had never used a computer before she retired.)\n3 T 4 T 5 F (Wakamiya’s app uses figures from\ntraditional Japanese culture.)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6485","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again and complete the notes.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c30cc5b81c2d09c51bc0b9365198e65afa03a64f03f9293cb2a058f8fdcdfb80.png"],"provided":"Masako Wakamiya worked as a banker until she was\n\n(1)____ years old. After she retired, she took care of (2)____. In order to keep her mind active, she (3)____. She tried different apps for her smartphone, but one thing that disappointed her was that they were (4)____. The app designers she contacted (5)____, so she decided to (6)____.\n\nShe designed an app that used figures from ( d":17.96,"text":"with new challenges."},{"start":18.98,"end":28.94,"text":"She had never used a computer before, but she read that\nusing a computer could help her connect with other\npeople while she stayed at home to look after her\nelderly mother."},{"start":29.5,"end":30.88,"text":"So she bought one."},{"start":31.66,"end":33.34,"text":"Over the next 20 years,"},{"start":33.72,"end":36.62,"text":"she taught herself about computers and the internet."},{"start":37.44,"end":40.28,"text":"She got a smartphone and started using apps."},{"start":40.98,"end":44.34,"text":"But she found that everything was designed for young\npeople."},{"start":44.92,"end":50.64,"text":"She knew that older people could learn to use\ntechnology and even have fun doing it,"},{"start":50.98,"end":53.52,"text":"if someone designed with them in mind."},{"start":54.4,"end":60,"text":"She contacted app designers and asked them to develop\ngames for older users."},{"start":60.54,"end":60.8,"text":"But"},{"start":60.8,"end":61.06,"text":"no"},{"start":61.06,"end":62.04,"text":"one was interested."},{"start":62.88,"end":65.38,"text":"So she did what she had always done."},{"start":65.96,"end":67.24,"text":"She did it herself."},{"start":68.06,"end":72.98,"text":"She learned Apple's coding language so she could\ndevelop an app for the iPhone."},{"start":73.84,"end":77.56,"text":"She used content that is familiar to older Japanese\nusers."},{"start":78.12,"end":81.58,"text":"Figures from the Japanese festival Hinamatsuri,"},{"start":82.14,"end":83.28,"text":"or Dolls Day."},{"start":83.98,"end":85.22,"text":"On this day,"},{"start":85.74,"end":88.86,"text":"dolls are placed on a platform in a specific order."},{"start":89.46000000000001,"end":90.84,"text":"In Wakamiya's game,"},{"start":91.3,"end":95.08,"text":"the goal is to place all the figures in the correct\norder."},{"start":95.97999999999999,"end":97.75999999999999,"text":"The game is harder than it sounds."},{"start":98.24000000000001,"end":99.8,"text":"The arrangements are complex."},{"start":100.7,"end":101.36,"text":"Tim Cook,"},{"start":101.8,"end":102.78,"text":"the head of Apple,"},{"start":103.18,"end":105.66,"text":"heard about Wakamiya and her app."},{"start":106.52000000000001,"end":108.52000000000001,"text":"Calling her work inspiring,"},{"start":109.14,"end":112.18,"text":"he invited her to an app developers conference."},{"start":112.18,"end":113.44,"text":"At 82,"},{"start":114.02000000000001,"end":116.22,"text":"she was the oldest participant."},{"start":117.72,"end":120.3,"text":"Describing her experience developing the app,"},{"start":120.96,"end":122.06,"text":"Wakamiya recalls..."},{"start":123.58,"end":128.62,"text":"Elderly people don't play games on their phones much\nbecause games aren't interesting for them."},{"start":130.62,"end":132.5,"text":"I've heard a lot of people say that."},{"start":132.86,"end":137.52,"text":"So I thought it would be nice if there were some apps\nwhich elderly people could enjoy."},{"start":142.94,"end":146.48,"text":"This game is based on traditional Japanese culture."},{"start":147.26,"end":150.74,"text":"I wanted to tell the next generation about traditional\nculture."},{"start":152.22,"end":158.98,"text":"I thought that making game and letting young people\nplay it would be easier than explaining culture to\nthem."},{"start":160.68,"end":164.52,"text":"When I first saw the pictures moving, I was really\nimpressed."},{"start":165.4,"end":167.4,"text":"First, I create the images."},{"start":167.92000000000002,"end":171.46,"text":"Then I run the simulation and they start moving and\ntalking."},{"start":172.04,"end":174.46,"text":"It's really impressive."},{"start":176.12,"end":179.6,"text":"Programming is the best way for me to feel a sense of\nachievement."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 True (She was a banker before it was common for\nwomen in Japan to have such jobs. / Over the next\n20 years, she taught herself about computers and the\ninternet. / So, she did what she had always done: she did\nit herself.) 2 True (She contacted app designers and asked\nthem to develop games for older users, but nobody was\ninterested.) 3 False (She wanted to tell the next generation\nabout traditional Japanese culture.) 4 Tim Cook, the head\nof Apple, heard about Wakamiya and her app. Calling\nher work ‘inspiring’, he invited her to an app developers’\nconference.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6488","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner and answer the questions.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c30cc5b81c2d09c51bc0b9365198e65afa03a64f03f9293cb2a058f8fdcdfb80.png"],"provided":"1 What do you think is most difficult about new technology for elderly people?\n2 What do you think you will do when you retire?\n3 What do you think is the best way to stay active in retirement?","items":[{"id":"b6488.i01","label":"1","prompt":"What do you think is most difficult about new technology for elderly people?","options":[],"type":"discuss/open"},{"id":"b6488.i02","label":"2","prompt":"What do you think you will do when you retire?","options":[],"type":"discuss/open"},{"id":"b6488.i03","label":"3","prompt":"What do you think is the best way to stay active in retirement?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 What do you think is most difficult about new technology for elderly people?"},{"kind":"text","text":"2 What do you think you will do when you retire?"},{"kind":"text","text":"3 What do you think is the best way to stay active in retirement?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think the most difficult thing for\nelderly people is learning how to use\nnew technology because it can be\ncomplicated and changes quickly.\n2 When I retire, I’d like to travel, relax,\nand spend more time with family\nand hobbies.\n3 The best way to stay active in retirement\nis by exercising regularly, staying social\nwith friends, and doing activities you\nenjoy, like walking or gardening.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":62,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6491","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":8,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a finance podcast about retirement and the elderly. Before you listen, read the questions and make notes on your opinions. Then discuss the questions in a group.","pages":[172],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db3d6cad14908b1974638b669c4c5d71250f9104ffec1aaabf3e4c6d9fb11c1.png"],"provided":"","items":[{"id":"b6491.i01","label":"1","prompt":"At what age do people stop working in your country? Do you think that is too old, or should it be even older? Why?","options":[],"type":"discuss/open"},{"id":"b6491.i02","label":"2","prompt":"Do you think that most people in your country plan for what they will do when they stop working?","options":[],"type":"discuss/open"},{"id":"b6491.i03","label":"3","prompt":"Are people encouraged to save for their old age?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6491.i01","label":"1","prompt":"At what age do people stop working in your country? Do you think that is too old, or should it be even older? Why?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6491.i02","label":"2","prompt":"Do you think that most people in your country plan for what they will do when they stop working?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6491.i03","label":"3","prompt":"Are people encouraged to save for their old age?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 In my country, it’s 65 for both men and\nwomen. But I think there are plans to\nraise it even further. Although people\ncan certainly continue working after that\nage, and many do, I think this is too old.\nPeople should be given the chance to\nstop working earlier if they want to. /\nThe current retirement age is 65 for men\nand 60 for women, I think it could be\neven older. There’s no reason why older\npeople shouldn’t keep contributing to\nthe economy and making themselves\nuseful to society.\n2 Most people don’t start thinking about\nthis until they are in their 40s. It just\nseems too far away. / Most people plan\nwhat they will do, and look forward to it.\nThere is a strong sense in my country of\npreparing for what’s ahead.\n3 Yes, there are a lot of companies which\nhelp you to set up a way of saving for\nyour old age, and most companies\nencourage their employees to do this. /\nNo, I don’t think anyone is encouraged\nto save up. Most people are just\nencouraged to spend what they have\nand not think about the future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6493","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":9,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the definitions. Complete the sentences below with the correct form of the words in bold.","pages":[172],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db3d6cad14908b1974638b669c4c5d71250f9104ffec1aaabf3e4c6d9fb11c1.png"],"provided":"","items":[{"id":"b6493.i01","label":"1","prompt":"Many people look forward to ____, when they stop working permanently, live off the ____ they have saved all their working lives for and have more leisure time.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"},{"id":"b6493.i02","label":"2","prompt":"The older ____ is far luckier than people of my age. They have had more life chances, and it was a lot cheaper and easier in the past to buy your own ____.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"},{"id":"b6493.i03","label":"3","prompt":"People should be ____ to work for as long as they want to, no matter what their age, in any kind of job.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"},{"id":"b6493.i04","label":"4","prompt":"Because their children are more likely to be grown adults, elderly people don't really have any ____ – which means they don't have many responsibilities to other people.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"},{"id":"b6493.i05","label":"5","prompt":"Having a lot of ____ – for example, a house, cars and other valuable possessions – will ____ that you will be comfortable in later life.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6493.i01","label":"1","prompt":"Many people look forward to ____, when they stop working permanently, live off the ____ they have saved all their working lives for and have more leisure time.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"},{"kind":"item","id":"b6493.i02","label":"2","prompt":"The older ____ is far luckier than people of my age. They have had more life chances, and it was a lot cheaper and easier in the past to buy your own ____.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"}],[{"kind":"item","id":"b6493.i03","label":"3","prompt":"People should be ____ to work for as long as they want to, no matter what their age, in any kind of job.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"},{"kind":"item","id":"b6493.i04","label":"4","prompt":"Because their children are more likely to be grown adults, elderly people don't really have any ____ – which means they don't have many responsibilities to other people.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"}],[{"kind":"item","id":"b6493.i05","label":"5","prompt":"Having a lot of ____ – for example, a house, cars and other valuable possessions – will ____ that you will be comfortable in later life.","options":["asset","dependent","ensure","generation","pension","permit","property","retirement"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 retirement, pension 2 generation, property\n3 permitted 4 dependents 5 assets, ensure","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6495","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":10,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss how far you agree with each statement in Exercise 2. Give reasons.","pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/755f0a83a0624355eb19d9f0d9f46351cb2bdd5d38012a7e8c6e0393c33b6482.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U08-question:b6493","kind":"student-work","title":"LISTENING 1 Ex 2","pages":[172]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I agree with this. Personally, I’m looking\nforward to spending more time travelling\nand doing the things I couldn’t do\nbecause I was busy working and raising\na family. / I’m not sure this is true. Yes,\nyou will have more time on your hands,\nbut unless you are quite rich, you won’t\nbe able to do much with it. A lot of\npeople, unfortunately, won’t have been\nable to save for a big pension and will\nonly receive a small one.\n2 The older generation grew up in a time\nthat was more economically stable\nand definitely had the chance to buy\nproperty when it was much cheaper. My\ngeneration hasn’t had those chances.\nThe average property in the past cost\nthe same as a few years’ salary. Now, it’s\nmore like 40 years’ income. / Although\nproperty in the past was cheaper than it is\nnow, it was harder to get any kind of loan\nfrom banks. Also, the older generation\ngrew up in a time when the internet\ndidn’t exist, there was less technology\nand fewer opportunities for education.\n3 I think this is true, as long as the person\nis physically and mentally fit enough to\ndo the job. This might mean that they\nneed to have tests to find out if that’s\nthe case. / I don’t think this is true, as\nsome jobs are far too challenging for\npeople of a certain age. For example,\nthere’s a rule that pilots need to retire at\nthe age of 65, and I think that’s correct.\n4 This is true. After a certain age, elderly\npeople don’t have to worry about their\nchildren anymore and can relax and\nthink about themselves more. / This is\nnot true. I don’t think anyone ever really\nstops thinking about their children.\nThen, there might be grandchildren to\nthink about. Also, older people may still\nneed to take care of their partner.\n5 This is very true, and what we should all\naim for. When we are young and able\nto work, we should build up our assets\nas much as possible and then enjoy the\nresults of all that hard work. / This might\nbe true, but the most important thing in\nlater life is your own physical and mental\nhealth. We should all do more to ensure\nwe are as healthy as possible, because if\nwe’re not, we can’t enjoy anything.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6497","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":11,"module":"LISTENING 1","ex":"4","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Which of the topics below do you think will be discussed in the podcast? Why / Why not?","pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/755f0a83a0624355eb19d9f0d9f46351cb2bdd5d38012a7e8c6e0393c33b6482.png"],"provided":"1 a comparison of past and present retirement\n2 how to prepare for being a grandparent\n3 an example of an enjoyable retirement\n4 popular travel destinations for the over 60s\n5 the effects of increased health and fitness\n6 the role of pensioners in their grandchildren's lives\n7 a prediction about retirement\n8 advice on staying mentally active after retirement","items":[{"id":"b6497.i01","label":"1","prompt":"a comparison of past and present retirement","options":[],"type":"discuss/open"},{"id":"b6497.i02","label":"2","prompt":"how to prepare for being a grandparent","options":[],"type":"discuss/open"},{"id":"b6497.i03","label":"3","prompt":"an example of an enjoyable retirement","options":[],"type":"discuss/open"},{"id":"b6497.i04","label":"4","prompt":"popular travel destinations for the over 60s","options":[],"type":"discuss/open"},{"id":"b6497.i05","label":"5","prompt":"the effects of increased health and fitness","options":[],"type":"discuss/open"},{"id":"b6497.i06","label":"6","prompt":"the role of pensioners in their grandchildren's lives","options":[],"type":"discuss/open"},{"id":"b6497.i07","label":"7","prompt":"a prediction about retirement","options":[],"type":"discuss/open"},{"id":"b6497.i08","label":"8","prompt":"advice on staying mentally active after retirement","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 a comparison of past and present retirement"},{"kind":"text","text":"2 how to prepare for being a grandparent"},{"kind":"text","text":"3 an example of an enjoyable retirement"},{"kind":"text","text":"4 popular travel destinations for the over 60s"},{"kind":"text","text":"5 the effects of increased health and fitness"},{"kind":"text","text":"6 the role of pensioners in their grandchildren's lives"},{"kind":"text","text":"7 a prediction about retirement"}],[{"kind":"text","text":"8 advice on staying mentally active after retirement"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I don’t think topic 2 will be discussed, as it\ndoesn’t relate to financial issues in the same\nway that some of the others do.\nTopic 4 is related to what people can do\nin their retirement, but the podcast will\nprobably be more focused on retired\npeople, and not talk about destinations.\nI think it’s unlikely that topic 8 will be\ndiscussed, because staying mentally active\nisn’t really related to money or finances.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6498","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":12,"module":"LISTENING 1","ex":"5","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"8.1 Listen to the podcast and check your answers to Exercise 4.","pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/755f0a83a0624355eb19d9f0d9f46351cb2bdd5d38012a7e8c6e0393c33b6482.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U08-question:b6497","kind":"student-work","title":"LISTENING 1 Ex 4","pages":[173]}],"materials":[],"coursePages":[[]],"courseMaterials":[]," ncially independent as soon as\nthey have completed their studies\nand have started working. The age at\nwhich this happens will be different for\ndifferent people.\n2 We should always ask for and\nrespectfully listen to our parents’ advice,\nno matter what age we are. However,\nas we grow older, we should choose\nwhether or not to follow our parents’\nsuggestions. As adults, we should be\nable to make up our own minds about\nwhat is best for us.\n3 As our parents reach old age, they might\nbecome less physically or mentally able\nto look after themselves. It’s important\nthat we are there to provide them with\nsupport, from helping them at home to\nmanaging their affairs.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6513","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS WITH INFINITIVES OR GERUNDS"},"instruction":"Choose the correct verb forms to complete the sentences. In one case, both forms are possible.","pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a9 ages":[177]}],"materials":[],"coursePages":[[{"kind":"text","text":"I recently agreed to babysit my sister's children. I didn't mind doing it because I like spending time with them."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 I really recommend going to Ali’s, the\nTurkish restaurant near the city centre. I\nreally love going there when I can.\n3 I’ve arranged to meet my brother\ntomorrow morning; he’s coming here on\nbusiness for a few days.\n4 I started playing golf recently. I always\nthought it would be a sport that I’d hate,\nbut I actually really like it.\n5 I’d like to finish writing my report\ntomorrow so that I can enjoy\nthe weekend.\n6 I enjoy spending time with my\nclassmates because they are all so\nfriendly, and I hope to continue studying\nwith them in the future.\n7 I should practise speaking more in English,\nand I need to find ways of doing that.\n8 I’ve never managed to go to the gym for\nmore than a few months. I start going,\nbut then I get bored after a while. But I\nreally want to get fit!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6515","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":21,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS WITH INFINITIVES OR GERUNDS"},"instruction":"Read and correct the sentences.","pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b4a0ed043b684ea2603ebdc41c41e414a32e0d7c2ec3a195437917f37fc7977.png"],"provided":"","items":[{"id":"b6515.i01","label":"1","prompt":"I'd always advise people enjoy life and not think too much about the future.","options":[],"type":"gap/open"},{"id":"b6515.i02","label":"2","prompt":"I wouldn't encourage to anybody to retire early.","options":[],"type":"gap/open"},{"id":"b6515.i03","label":"3","prompt":"I will refuse for work after the age of 65.","options":[],"type":"gap/open"},{"id":"b6515.i04","label":"4","prompt":"I would never want to my children to take care of me when I'm old.","options":[],"type":"gap/open"},{"id":"b6515.i05","label":"5","prompt":"Governments should promise giving people all the financial help they need when they retire.","options":[],"type":"gap/open"},{"id":"b6515.i06","label":"6","prompt":"I'd prefer retire at the age of 50 than 65.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6515.i01","label":"1","prompt":"I'd always advise people enjoy life and not think too much about the future.","options":[],"type":"gap/open"},{"kind":"item","id":"b6515.i02","label":"2","prompt":"I wouldn't encourage to anybody to retire early.","options":[],"type":"gap/open"},{"kind":"item","id":"b6515.i03","label":"3","prompt":"I will refuse for work after the age of 65.","options":[],"type":"gap/open"},{"kind":"item","id":"b6515.i04","label":"4","prompt":"I would never want to my children to take care of me when I'm old.","options":[],"type":"gap/open"},{"kind":"item","id":"b6515.i05","label":"5","prompt":"Governments should promise giving people all the financial help they need when they retire.","options":[],"type":"gap/open"},{"kind":"item","id":"b6515.i06","label":"6","prompt":"I'd prefer retire at the age of 50 than 65.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 I’d always advise people to enjoy life and not think too\nmuch about the future.\n2 I wouldn’t encourage to anybody to retire early.\n3 I will refuse for to work after the age of 65.\n4 I would never want to my children to take care of me\nwhen I’m old.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":63,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6516","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS WITH INFINITIVES OR GERUNDS"},"instruction":"Work with a partner. Discuss which sentences in Exercise 3 you agree with.","pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b4a0ed043b684ea2603ebdc41c41e414a32e0d7c2ec3a195437917f37fc7977.png"],"provided":"I think it's about balance. It's important to enjoy life and not worry too much, but we also need to plan for the future.","items":[],"layout":"list","references":[{"id":"B04-LS-U08-question:b6515","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 3","pages":[177]}],"materials":[],"coursePages":[[{"kind":"text","text":"I think it's about balance. It's important to enjoy life and not worry too much, but we also need to plan for the future."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I agree. We don’t know what will happen\nin the future, so we should try to enjoy\nthe present as much as possible. / I\ndisagree with this. A bit of planning now\ncan mean we have better opportunities\nin the future.\n2 I agree. We should keep working as\nmuch as we can, because work keeps us\nmentally and physically active. / I disagree.\nWe shouldn’t spend our whole lives\nworking. We should enjoy our later years.\n3 I agree. This is the time of life when\nwe should take it easy and do things\nfor ourselves and our families, not for\nemployers. / I disagree. If someone still\nwants me to work for them when I’m at\nthat age, I’ll be very happy.\n4 I agree. My children have their own lives\nto lead. They might also have their own\nchildren to look after, and that’s more\nimportant than looking after me. / I\ndisagree. If I spend a lot of time looking\nafter and loving my children, then they\nhave a duty to give me help and support\nwhen I need it.\n5 I agree with this. People work hard and\npay taxes all their life, so governments\nshould make sure people get support\nwhen they can no longer work. / I don’t\nagree with this. People should take care\nof their own lives and plan for their own\nfuture. They shouldn’t expect anyone\nelse to do this for them.\n6 I agree. At the age of 50, I’ll still be able\nto do a lot of things like sport and going\ntravelling, and I could make the most of\nmy retirement. / I disagree. I will still be\nable to work and earn money when I’m\nin my 50s.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6517","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS WITH INFINITIVES OR GERUNDS"},"instruction":"Rewrite the sentences using the correct form of the verbs in brackets. In some items, more than one answer is possible.","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c0049e324bf46845b00395ba631a8998a84c9b58c0c7c279f3e77bfc6a884e8.png"],"provided":"1 I tried not to think about retirement when I was young. (avoid)\nI avoided thinking about retirement when I was young.\n2 Trina has plans to move to a new city. (consider)\n3 I don't advise you to leave it too late to make a pension plan. (suggest)\n4 Having a good pension has made sure that my grandparents have a comfortable life. (enable)","items":[{"id":"b6517.i01","label":"1","prompt":"I tried not to think about retirement when I was young. (avoid)","options":[],"type":"gap/open"},{"id":"b6517.i02","label":"2","prompt":"Trina has plans to move to a new city. (consider)","options":[],"type":"gap/open"},{"id":"b6517.i03","label":"3","prompt":"I don't advise you to leave it too late to make a pension plan. (suggest)","options":[],"type":"gap/open"},{"id":"b6517.i04","label":"4","prompt":"Having a good pension has made sure that my grandparents have a comfortable life. (enable)","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 I tried not to think about retirement when I was young. (avoid)"},{"kind":"text","text":"I avoided thinking about retirement when I was young."},{"kind":"text","text":"2 Trina has plans to move to a new city. (consider)"},{"kind":"text","text":"3 I don't advise you to leave it too late to make a pension plan. (suggest)"},{"kind":"text","text":"4 Having a good pension has made sure that my grandparents have a comfortable life. (enable)"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 Trina is considering moving to a\nnew city.\n3 I suggest (that) you don’t leave it too\nlate to make a pension plan. / I suggest\nnot leaving it too late to make a\npension plan.\n4 Having a good pension has enabled /\nis enabling my grandparents to have a\ncomfortable life.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6519","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":24,"module":"LANGUAGE DEVELOPMENT","ex":"6","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"ACADEMIC VERBS FOR SUPPORT AND ASSISTANCE"},"instruction":"Read the sentences below and replace the less formal verbs in bold with the correct form of an academic verb from the box.","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c0049e324bf46845b00395ba631a8998a84c9b58c0c7c279f3e77bfc6a884e8.png"],"provided":"assist attempt calculate cooperate devote indicate participate propose\n1 It is normal in my country for everybody in the family to work together to help older relatives.\n2 I suggest that you should save at least 30% of your salary for your retirement.\n3 In my country, the government tries to ensure that the elderly have access to high-quality care.\n4 I have worked out that I'll have an adequate amount of money by the time I stop working.\n5 Families often help older members of the family so they can continue to live independently.\n6 Recent statistics show that people are living longer than ever before.\n7 People give themselves to their children and expect care in return.\n8 Elderly people often take part in local community activities.","items":[{"id":"b6519.i01","label":"1","prompt":"It is normal in my country for everybody in the family to work together to help older relatives.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i02","label":"2","prompt":"I suggest that you should save at least 30% of your salary for your retirement.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i03","label":"3","prompt":"In my country, the government tries to ensure that the elderly have access to high-quality care.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i04","label":"4","prompt":"I have worked out that I'll have an adequate amount of money by the time I stop working.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i05","label":"5","prompt":"Families often help older members of the family so they can continue to live independently.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i06","label":"6","prompt":"Recent statistics show that people are living longer than ever before.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i07","label":"7","prompt":"People give themselves to their children and expect care in return.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"},{"id":"b6519.i08","label":"8","prompt":"Elderly people often take part in local community activities.","options":["assist","attempt","calculate","cooperate","devote","indicate","participate","propose"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"assist attempt calculate cooperate devote indicate participate propose"},{"kind":"text","text":"1 It is normal in my country for everybody in the family to work together to help older relatives."},{"kind":"text","text":"2 I suggest that you should save at least 30% of your salary for your retirement."},{"kind":"text","text":"3 In my country, the government tries to ensure that the elderly have access to high-quality care."},{"kind":"text","text":"4 I have worked out that I'll have an adequate amount of money by the time I stop working."},{"kind":"text","text":"5 Families often help older members of the family so they can continue to live independently."}],[{"kind":"text","text":"6 Recent statistics show that people are living longer than ever before."},{"kind":"text","text":"7 People give themselves to their children and expect care in return."},{"kind":"text","text":"8 Elderly people often take part in local community activities."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 cooperate 2 propose 3 attempts 4 calculated\n5 assist 6 indicate 7 devote 8 participate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6520","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":1,"order":25,"module":"LANGUAGE DEVELOPMENT","ex":"7","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"ACADEMIC VERBS FOR SUPPORT AND ASSISTANCE"},"instruction":"Work with a partner. Which of the sentences in Exercise 6 would you say are true?","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c0049e324bf46845b00395ba631a8998a84c9b58c0c7c279f3e77bfc6a884e8.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U08-question:b6519","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 6","pages":[178]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 This is true in my country. For example,\nin my family, my grandmother lives\nwith my father, and we all cooperate to\ntake care of her. / It’s not really normal\nin my country. Elderly people tend to\nlive on their own or go to a retirement\nhome, where they are looked after by\nprofessional carers.\n2 I agree. I think this would be a suitable\namount of money. / I’m not sure about\nthis. I think the percentage should\nbe less when you are younger and\ngradually increase as you become more\nfinancially stable.\n3 This is true in my country. The\ngovernment gives a lot of extra financial\nhelp to the elderly, including reduced\nbills and a generous state pension. /\nUnfortunately, the government in my\ncountry isn’t doing enough to ensure\nthat the elderly have comfortable lives,\nmeaning that family members have to\ntake on an extra supporting role.\n4 This is true for me. Hopefully, my\ncalculations will be correct! / I haven’t\nthought about my retirement at all, so I\ndon’t know how much I will have.\n5 In my country, it’s part of the culture that\nfamilies are there to support and assist\neach other, in any way possible. / Elderly\npeople who need care are usually\nassisted by professional carers who\nknow what they are doing, rather than\nfamily members, who are often too busy\nworking to care for elderly relatives.\n6 I’m not sure this is true in my country, as\npeople have been living well into their\n70s or 80s for a long time now. / This is\ndefinitely true, because medical care has\ngot a lot better in the last few decades.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6523","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":26,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to two students giving presentations on the subject of an ageing population. Before you listen, work with a partner. Read the sentences (1–8) below and choose the correct definition (a, b or c) for the words in bold.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d7316a715f43ca4af7883e54be87c8cbd28c8c12d1a609b43d6a45f9661efd65.png"],"provided":"","items":[{"id":"b6523.i01","label":"1","prompt":"Most people in their early 20s have few responsibilities.","options":["special skills","duties to take care of somebody or something","material possessions"],"type":"choice/closed"},{"id":"b6523.i02","label":"2","prompt":"Most people aged 65 or more are not capable of studying new things.","options":["able to do things effectively","interested in doing something","allowed to do something"],"type":"choice/closed"},{"id":"b6523.i03","label":"3","prompt":"We are dependent on our parents for money long after we become adults.","options":["in a close relationship with somebody","needing the support of somebody or something","influenced by somebody"],"type":"choice/closed"},{"id":"b6523.i04","label":"4","prompt":"The birth rate in my country has gone down a lot in recent decades.","options":["the amount something costs","how good or high-quality something is","the amount of something in a particular period"],"type":"choice/closed"},{"id":"b6523.i05","label":"5","prompt":"More than anything else, the food we eat has enabled us to live longer lives.","options":["to make something more difficult","to make it possible to do something","to stop something from happening"],"type":"choice/closed"},{"id":"b6523.i06","label":"6","prompt":"I estimate that the world's population will reach 10 billion in the next decade.","options":["doubt","guess or calculate","hope that something will happen"],"type":"choice/closed"},{"id":"b6523.i07","label":"7","prompt":"The time when we are teenagers is the most difficult phase of our life.","options":["a small part of something","a time when something begins","a stage in a series of events"],"type":"choice/closed"},{"id":"b6523.i08","label":"8","prompt":"We never really alter our personality as we grow older.","options":["improve","change","think about"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6523.i01","label":"1","prompt":"Most people in their early 20s have few responsibilities.","options":["special skills","duties to take care of somebody or something","material possessions"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":1}},{"kind":"item","id":"b6523.i02","label":"2","prompt":"Most people aged 65 or more are not capable of studying new things.","options":["able to do things effectively","interested in doing something","allowed to do something"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":0}},{"kind":"item","id":"b6523.i03","label":"3","prompt":"We are dependent on our parents for money long after we become adults.","options":["in a close relationship with somebody","needing the support of somebody or something","influenced by somebody"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":1}}],[{"kind":"item","id":"b6523.i04","label":"4","prompt":"The birth rate in my country has gone down a lot in recent decades.","options":["the amount something costs","how good or high-quality something is","the amount of something in a particular period"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":2}},{"kind":"item","id":"b6523.i05","label":"5","prompt":"More than anything else, the food we eat has enabled us to live longer lives.","options":["to make something more difficult","to make it possible to do something","to stop something from happening"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":1}},{"kind":"item","id":"b6523.i06","label":"6","prompt":"I estimate that the world's population will reach 10 billion in the next decade.","options":["doubt","guess or calculate","hope that something will happen"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":1}}],[{"kind":"item","id":"b6523.i07","label":"7","prompt":"The time when we are teenagers is the most difficult phase of our life.","options":["a small part of something","a time when something begins","a stage in a series of events"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":2}},{"kind":"item","id":"b6523.i08","label":"8","prompt":"We never really alter our personality as we grow older.","options":["improve","change","think about"],"type":"choice/closed","answer":{"label":"8","mode":"choice","option":1}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 b 2 a 3 b  4 c 5 b 6 b 7 c 8 b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6524","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":27,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a different partner. Do you agree with the sentences in Exercise 1? Give reasons for your opinions.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d7316a715f43ca4af7883e54be87c8cbd28c8c12d1a609b43d6a45f9661efd65.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U08-question:b6523","kind":"material-reference","title":"LISTENING 2 Ex 1","pages":[179]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U08-publisher-sheet:b6523","title":"LISTENING 2 Ex 1 原题面","pages":[179],"text":"","screens":[],"sources":[{"page":179,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d7316a715f43ca4af7883e54be87c8cbd28c8c12d1a609b43d6a45f9661efd65.png"}],"kind":"task_sheet","sourceBlockIds":["b6523"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 This is broadly true, as the majority don’t\nhave families to support or big financial\nobligations. / People in their early 20s\ndo have responsibilities to other people\nin their family, and also if they have jobs.\n2 They say it’s difficult to learn new things\nwhen you are older, and I think that’s\ntrue. The best time to learn is when\nyou are a child. / People of any age are\ncapable of learning new things. The only\nthing you need is motivation.\n3 It’s not normal for people to be\nfinancially dependent on their parents\nafter they have stopped being children.\n/ We can always ask our parents for\nfinancial support in an emergency, no\nmatter how old we are.\n4 I think the birth rate has remained\nstable for several years, or maybe\neven increased. / Unfortunately, a\nlot of people have left my country in\nrecent years, and also there have been\nfewer births than usual, so the rate\nhas decreased.\n5 There is much greater understanding\nnow of what food is healthy and what\nisn’t, and this has played an enormous\npart in our improved health. / There are\nmany other things which have played\nan important role, especially medical\ntechnology.\n6 I don’t think this will happen. It has now\nreached eight billion, and it’s impossible\nfor another two billion people to appear\nin the next ten years. / The world’s\npopulation has been increasing rapidly,\nand this prediction is quite likely to\nbecome true.\n7 This is definitely true, and I wouldn’t\nlike to be a teenager again! There are\nso many complicated emotions to deal\nwith. / I think every phase of our lives\nhas its own unique challenges.\n8 We change constantly throughout our\nlives, depending on what happens to\nus and who we meet. / At a basic level,\nafter we reach our teenage years, our\npersonalities don’t really alter. Our likes\nand dislikes remain essentially the same.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6526","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":28,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss the questions below. Then compare your answers with another pair.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46df3fbf0514660e4030ea90b8ccbc88375102db4a3c14047728ee99b471e9ae.png"],"provided":"","items":[{"id":"b6526.i01","label":"1","prompt":"What changes have there been in your country's population in the last 50 years? Are these changes similar all over the world?","options":[],"type":"discuss/open"},{"id":"b6526.i02","label":"2","prompt":"What changes do you think there will be in the global population in the next 30 years?","options":[],"type":"discuss/open"},{"id":"b6526.i03","label":"3","prompt":"What do you think will be the effect of these changes?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6526.i01","label":"1","prompt":"What changes have there been in your country's population in the last 50 years? Are these changes similar all over the world?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6526.i02","label":"2","prompt":"What changes do you think there will be in the global population in the next 30 years?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6526.i03","label":"3","prompt":"What do you think will be the effect of these changes?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 My country’s population has decreased\nfrom about 10 million to 9.5 million. I\nthink other countries’ populations have\nhad similar declines, but many others\nhave seen increases.\n2 I think there will be more elderly people,\nbecause people are living longer.\n3 Governments will need to spend more\non pensions and medical care for the\nincreased number of older people.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6528","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":29,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"8.3 Listen to two students, Munira and Lee, giving presentations on the effects of an ageing population. Make notes in the chart about the information each student presents.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46df3fbf0514660e4030ea90b8ccbc88375102db4a3c14047728ee99b471e9ae.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>Munira\u003c/td>\u003ctd>Lee\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b6528.i01","label":"Munira","prompt":"Munira","options":[],"type":"gap/open"},{"id":"b6528.i02","label":"Lee","prompt":"Lee","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Munira","header":false,"colspan":1,"rowspan":1},{"text":"Lee","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 8.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de4dec7c7837436cbc162d25d1c478b222d05ea51b6a32d5e65bf895e0253df2.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"Munira Lee\nHow the world’s\npopulation is changing,\nand the effects of this.\nThe world’s population has\nreached eight billion.\n• The number of people\naged 65 or older has\nincreased in the last\n40 years.\n• This will increase even\nmore in the future.\n• This is happening\neverywhere as a\nresult of improved\nmedicine/diet/\nexercise.\n• There are now more\nelderly people\nthan babies.\nWe assume older people\ncannot do things. This will\nneed to change. We need\nto reconsider our attitude\ntowards older people.\nHow long people are\nliving, and the effects\nof this.\nSteady decrease in the\nnumber of babies born\nsince the 1950s.\nPeople are living longer,\nand this trend\nwill continue.\n• Today’s five-year-olds\nare likely to live to be\n100 years old.\n• The number of\ncentenarians\nwill increase.\nWe need to change the\nway we think about our\nlives, and the phases of\nour lives. The way we\nthink about retirement,\nespecially, will have\nto change.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6529","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":30,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Use your notes from Exercise 4 to answer the questions. Then compare answers with a partner.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46df3fbf0514660e4030ea90b8ccbc88375102db4a3c14047728ee99b471e9ae.png"],"provided":"","items":[{"id":"b6529.i01","label":"1","prompt":"Who focuses more on how many older people there will be in the future? ____","options":[],"type":"qa/open"},{"id":"b6529.i02","label":"2","prompt":"What does the other person focus on most?","options":[],"type":"qa/open"},{"id":"b6529.i03","label":"","prompt":"Lee: ____","options":[],"type":"qa/open"},{"id":"b6529.i04","label":"","prompt":"Lee: ____","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B04-LS-U08-question:b6528","kind":"student-work","title":"LISTENING 2 Ex 4","pages":[180]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6529.i01","label":"1","prompt":"Who focuses more on how many older people there will be in the future? ____","options":[],"type":"qa/open"},{"kind":"item","id":"b6529.i02","label":"2","prompt":"What does the other person focus on most?","options":[],"type":"qa/open"},{"kind":"item","id":"b6529.i03","label":"","prompt":"Lee: ____","options":[],"type":"qa/open"},{"kind":"item","id":"b6529.i04","label":"","prompt":"Lee: ____","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Munira\n2 The effect of having a much larger population of\nelderly people\n3 Munira: Worldwide, the number of people over 65 has\nincreased over the last 40 years as a result of improved\nhealth. There are now more elderly people than babies,\nwhich didn’t use to be the case.\nLee: The number of babies being born has decreased\nsince the 1950s, and people are living longer.\n4 Munira: People will remain healthier and active for\nlonger, which means that the way we think about people\nover the age of 65 will need to change. It’s possible that\nwe won’t think of 65 as ‘old’.\nLee: People being born today are likely to live very long\nlives, and the number of people reaching the age of 100\nwill increase.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":64,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6530","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":3 se of the decrease in the birth rate.","options":["C (cause)","E (effect)"],"type":"choice/closed"},{"id":"b6532.i03","label":"3","prompt":"The fact that people are living longer lives will, of course, lead to huge changes in the future.","options":["C (cause)","E (effect)"],"type":"choice/closed"},{"id":"b6532.i04","label":"4","prompt":"An ageing population isn't something that's just happening in wealthy countries. It's happening everywhere and it stems from improved medicine and better technology.","options":["C (cause)","E (effect)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6532.i01","label":"1","prompt":"We are living longer because of improved medicine and a greater understanding of healthy eating and exercise habits. All this will result in a population that's getting older and older on average.","options":["C (cause)","E (effect)"],"type":"choice/closed"},{"kind":"item","id":"b6532.i02","label":"2","prompt":"The overall percentage of children is much less now than it used to be, because of the decrease in the birth rate.","options":["C (cause)","E (effect)"],"type":"choice/closed"}],[{"kind":"item","id":"b6532.i03","label":"3","prompt":"The fact that people are living longer lives will, of course, lead to huge changes in the future.","options":["C (cause)","E (effect)"],"type":"choice/closed"},{"kind":"item","id":"b6532.i04","label":"4","prompt":"An ageing population isn't something that's just happening in wealthy countries. It's happening everywhere and it stems from improved medicine and better technology.","options":["C (cause)","E (effect)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 E 2 C 3 E 4 C","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":65,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6534","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":33,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use your notes from Listening 1 and 2 to discuss the questions below.","pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2ed4fccd6e908821bbcfe2f63ba0c737be6c721e2da16fc6c7bddcfa70e32509.png"],"provided":"1 What do you think are the main 'phases' of life?\n2 Will some of these phases change in your lifetime? If so, how?\n3 How would you like your retirement to be?","items":[{"id":"b6534.i01","label":"1","prompt":"What do you think are the main 'phases' of life?","options":[],"type":"discuss/open"},{"id":"b6534.i02","label":"2","prompt":"Will some of these phases change in your lifetime? If so, how?","options":[],"type":"discuss/open"},{"id":"b6534.i03","label":"3","prompt":"How would you like your retirement to be?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U08-question:b6528","kind":"student-work","title":"LISTENING 2 Ex 4","pages":[180]},{"id":"B04-LS-U08-question:b6499","kind":"student-work","title":"LISTENING 1 Ex 6","pages":[173]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 What do you think are the main 'phases' of life?"},{"kind":"text","text":"2 Will some of these phases change in your lifetime? If so, how?"},{"kind":"text","text":"3 How would you like your retirement to be?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think that there are several phases:\nchildhood; your teenage years; your\nearly adult years, where you leave\nhome and are relatively free; your more\n‘responsible’ years, where you have a\njob and perhaps a family; and so on. I\nthink everyone’s life is different.\n2 In the past, people retired when they\nwere in their 50s or 60s, and enjoyed\na time of relaxation and leisure if they\nwere lucky. I think this will change in my\nlifetime, as I’m sure I’ll have to keep on\nworking until I’m 70, whether I want to\nor not.\n3 I wouldn’t really like to simply retire and\ndo nothing. I’d always like to be active\nin some way, even if it doesn’t mean\nearning money.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":65,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6535","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":34,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Write a short essay to follow the introduction below. Write three paragraphs of about 50 words each using your own ideas.","pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2ed4fccd6e908821bbcfe2f63ba0c737be6c721e2da16fc6c7bddcfa70e32509.png"],"provided":"The government has recently announced that it will increase the retirement age for both men and women in my country from 65 to 70. In this essay, I will discuss the advantages and disadvantages of this, before giving my own opinion about the new plan.","items":[{"id":"b6535.i01","label":"essay","prompt":"Write a short essay following the given introduction, with three paragraphs of about 50 words each using your own ideas.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"The government has recently announced that it will increase the retirement age for both men and women in my country from 65 to 70. In this essay, I will discuss the advantages and disadvantages of this, before giving my own opinion about the new plan."},{"kind":"item","id":"b6535.i01","label":"essay","prompt":"Write a short essay following the given introduction, with three paragraphs of about 50 words each using your own ideas.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The government has recently announced\nthat it will increase the retirement age for\nboth men and women in my country from\n65 to 70. In this essay, I will discuss the\nadvantages and disadvantages of this,\nbefore giving my own opinion about the\nnew plan.\nThere are a number of advantages to\nraising the retirement age. One, of course,\nis that it enables people to contribute to\nthe economy for longer. This means that\nbusinesses can employ more people,\npeople can remain economically active\nbecause they have more money to spend\nfrom their salaries, and the government can\ncollect more taxes.\nHowever, there are many people who will\nnot want to work until they are 70. Forcing\ncitizens to work longer could lead to a loss\nof quality of life. Also, if there are a larger\nnumber of older people employed, this\nwould result in fewer jobs being available\nfor younger people leading to higher youth\nunemployment.\nIn my view, the government should think\nseriously about raising the retirement\nage by so much. As enabling people to\nwork longer can have economic benefits,\nperhaps the government could consider a\nretirement age of 66 or 67, instead of 70, or\nmake retirement optional between the ages\nof 65 and 70.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":65,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U08-question:b6543","book":4,"unit":8,"track":"LS","topic":"AGEING","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Look at the line graph. Answer the questions.","pages":[182],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/17c91f72c45cb2cb08fdb26d6a0bac5b04f382fcea98293524066625c89694ad.png"],"provided":"","items":[{"id":"b6543.i01","label":"1","prompt":"What was Japan's population over the age of 65 in the year 2010?","options":[],"type":"qa/open"},{"id":"b6543.i02","label":"2","prompt":"What was Japan's population under the age of 14 in 2010?","options":[],"type":"qa/open"},{"id":"b6543.i03","label":"3","prompt":"What will Japan's population over the age of 65 be in 2050?","options":[],"type":"qa/open"},{"id"
