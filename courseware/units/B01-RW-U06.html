 narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?\nMC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls. There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family.\n4 AW: What do architects use to build houses?\nMC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different.\nFor example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls.\n¹ steep (adj) goes down very quickly and almost straight down\n² narrow (adj) not much space from one side to the other\n³ green (adj) something which does not use a lot of energy","screens":["Architect's world EXPERT INTERVIEW\n1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world.\n2 Architect's world: What are your favourite home designs?\nMichael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?","MC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle es":[[{"kind":"text","text":"The text about airports talksates about ..."},{"kind":"text","text":"1 the large number of flights and passengers at airports these days."},{"kind":"text","text":"2 problems with making changes to airports."},{"kind":"text","text":"3 different changes in airport buildings."},{"kind":"item","id":"b2186.i01","label":"1","prompt":"The text about airports talks about ...","options":["1 the large number of flights and passengers at airports these days.","2 problems with making changes to airports.","3 different changes in airport buildings."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B01-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.\nDo you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore\n## Dubai International Airport\n[IMAGE_2]\n## MINI CITIES\nThese days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.\nAll these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n## CHANGES AREN'T CHEAP\nIt costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n## Munich International Airport","screens":["Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.\nDo you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore\n## Dubai International Airport\n[IMAGE_2]\n## MINI CITIES\nThese days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.","All these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n## CHANGES AREN'T CHEAP\nIt costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n## Munich International Airport"],"sources":[{"page":132,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockan laza has more.\n2  The Istanbul Cevahir has many shops, but The SM Mall\nof Asia has more.\n3  The Country Club Plaza is modern, but the Metro\nCentre is more modern.\n4  The SM Mall of Asia is old, but the Country Club Plaza\nis older","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":53,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U06-question:b2223","book":1,"unit":6,"track":"RW","topic":"HOMES AND BUILDINGS","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the text below and correct the underlined words. Correct the spelling and/or add any missing capital letters.","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f043528e35f02658f5320bf566deef69362151e806f3d64ab4beb98c7baae3ee.png"],"provided":"WHAT ARE MALLS?\n\nMals are big buildings for shopping. They are near big cities. Sometimes they are inside skyscrapers. Many cities have more than one mall.\nMalls have restorants and sinemas. The restaraunts are biger than restrants in the city. Some malls also have gyms and swimming pools.\n\nsouthdale center in minnesota in the united states was the first mall in the world. It is popular today but there are bigger malls in america, europe, the gulf and asia.","items":[{"id":"b2223.i01","label":"1","prompt":"Mals","options":[],"type":"gap/closed"},{"id":"b2223.i02","label":"2","prompt":"restorants","options":[],"type":"gap/closed"},{"id":"b2223.i03","label":"3","prompt":"sinemas","options":[],"type":"gap/closed"},{"id":"b2223.i04","label":"4","prompt":"restaraunts","options":[],"type":"gap/closed"},{"id":"b2223.i05","label":"5","prompt":"biger","options":[],"type":"gap/closed"},{"id":"b2223.i06","label":"6","prompt":"restrants","options":[],"type":"gap/closed"},{"id":"b2223.i07","label":"7","prompt":"southdale center","options":[],"type":"gap/closed"},{"id":"b2223.i08","label":"8","prompt":"minnesota","options":[],"type":"gap/closed"},{"id":"b2223.i09","label":"9","prompt":"the united states","options":[],"type":"gap/closed"},{"id":"b2223.i10","label":"10","prompt":"america","options":[],"type":"gap/closed"},{"id":"b2223.i11","label":"11","prompt":"europe","options":[],"type":"gap/closed"},{"id":"b2223.i12","label":"12","prompt":"the gulf","options":[],"type":"gap/closed"},{"id":"b2223.i13","label":"13","prompt":"asia","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"WHAT ARE MALLS?"},{"kind":"text","text":"Mals are big buildings for shopping. They are near big cities. Sometimes they are inside skyscrapers. Many cities have more than one mall."},{"kind":"text","text":"Malls have restorants and sinemas. The restaraunts are biger than restrants in the city. Some malls also have gyms and swimming pools."},{"kind":"text","text":"southdale center in minnesota in the united states was the first mall in the world. It is popular today but there are bigger malls in america, europe, the gulf and asia."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"What are malls?\nMalls are big buildings for shopping. They are near big\ncities. Sometimes they are inside skyscrapers. Many cities\nhave more than one mall. Malls have restaurants and\ncinemas. The restaurants are bigger than restaurants in the\ncity. Some malls also have gyms and swimming pools.\nThe Southdale Center in Minnesota in the United States\nwas the first mall in the world. It is popular today but there\nare bigger malls in America, Europe, the Gulf and Asia.","references":[{" ts correctly; write supporting sentences and details."}],"photo":{"box":[282,249,458,783],"nativeWidth":776,"sourcePage":124,"alt":""}}]}},{"id":"B01-RW-U06-classroom:resource:b2159","book":1,"unit":6,"track":"RW","topic":"HOMES AND BUILDINGS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ce3d9516522bcbb8cd639af3e0e25e9be0fb6031ec91ec07c57f7eca49dfefc7.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"transport","pos":"(n)","definition":"a train, car, bus, ship or plane to get you from one place to another","example":"The last bus has left, so we need another form of transport.","wordAudio":"transport/(n)","cardWord":false},{"term":"port","pos":"(n)","definition":"a place near the water where ships arrive and leave from","example":"The ship arrived at the port before sunrise.","wordAudio":"port","cardWord":false},{"term":"traditional","pos":"(adj)","definition":"doing something in the old way","example":"They cook the soup in a traditional way.","wordAudio":"traditional","cardWord":false},{"term":"luxury hotel","pos":"(n)","definition":"a very expensive and comfortable hotel","example":"They spent two nights in a luxury hotel.","wordAudio":"luxury hotel","cardWord":false},{"term":"own","pos":"(v)","definition":"to have. when you own something, it is yours","example":"I own this bicycle, but you can borrow it.","wordAudio":"own","cardWord":false}]]}},{"id":"B01-RW-U06-classroom:video","book":1,"unit":6,"track":"RW","topic":"HOMES AND BUILDINGS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/09d8bd86808421068031beed970558a1f99332f4406e01746428848cbf6932c4.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/97567a3f5ab91f5b884790d0-L1RW-U06.mp4","captions":[{"start":0,"end":1.6,"text":"Singapore."},{"start":2.34,"end":5.98,"text":"It's an island, a city and a country."},{"start":6.54,"end":10.54,"text":"It's an important center for banking, technology and\ntransport."},{"start":11.04,"end":12.52,"text":"And it's growing."},{"start":13.68,"end":16.86,"text":"It has the second busiest port in the world."},{"start":18.54,"end":24.74,"text":"With an area of less than 720 square kilometers and\nfive and million people,"},{"start":25.1,"end":26.58,"text":"space is a problem."},{"start":27.54,"end":29.04,"text":"Where does everyone live?"},{"start":30.18,"end":35.38,"text":"In the first half of the 20th century, many people\nlived in buildings like these."},{"start":35.78,"end":40.24,"text":"There are shops on the bottom floor and people live on\nthe second floor."},{"start":40.6,"end":44.74,"text":"But there were not enough houses or flats for the\ngrowing population."},{"start":53.7,"end":59.38,"text":"The government began to build hundreds of tall\napartment buildings like these."},{"start":60.14,"end":61.54,"text":"The apartments are modern,"},{"start":61.96,"end":63.06,"text":"simple and light."},{"start":63.92,"end":64.32,"text":"Today,"},{"start":64.66,"end":68.53999999999999,"text":"more than 80 % of the population lives in these\nbuildings."},{"start":69.98,"end":74.2,"text":"Groups of buildings create high -rise neighborhoods\nwith schools,"},{"start":74.72,"end":74.94,"text":"shopping,"},{"start":75.62,"end":78.08,"text":"restaurants and medical offices nearby."},{"start":79.44,"end":86.3,"text":"About ten % of all tourists arrive by cruise ship and\nthere are lots of hotels."},{"start":87.46000000000001,"end":93.52000000000001,"text":"The country has more than a million hotel rooms for all\nof the tourists and business travelers."},{"start":95.53999999999999,"end":97.44,"text":"There are traditional hotels."},{"start":98.32,"end":102.58,"text":"This one is probably Singapore's most famous hotel,"},{"start":103.28,"end":103.74000000000001,"text":"Raffles."},{"start":104.32,"end":109.88,"text":"It was built in 1887 when Singapore was part of the\nBritish Empire."},{"start":111.46000000000001,"end":113.7,"text":"Most hotels in the city are modern."},{"start":114.52000000000001,"end":117.97999999999999,"text":"This luxury hotel stands next to the sea."},{"start":119.4,"end":121.36,"text":"But for the people of Singapore,"},{"start":122,"end":123.64,"text":"this looks like home."},{"start":124.92,"end":127.92,"text":"More than 90 % of them own their home,"},{"start":128.36,"end":130.92,"text":"one of the highest rates in the world."}],"launchInline":true}},{"id":"B01-RW-U06-classroom:material:RW-M03","book":1,"unit":6,"track":"RW","topic":"HOMES AND BUILDINGS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[129],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efa0d50a529815c44e2a1bcde8a2a87515462e69a45a337fc0952c8a85b752ce.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Architect's world EXPERT INTERVIEW\n1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world.\n2 Architect's world: What are your favourite home designs?\nMichael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?","sourcePage":129},{"body":"MC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls. There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family.\n4 AW: What do architects use to build houses?\nMC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different.\nFor example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls.\n¹ steep (adj) goes down very quickly and almost straight down\n² narrow (adj) not much space from one side to the other\n³ green (adj) something which does not use a lot of energy","sourcePage":129}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U06-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Architect’s world EXPERT INTERVIEW","pages":[{"page":129,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efa0d50a529815c44e2a1bcde8a2a87515462e69a45a337fc0952c8a85b752ce.png","width":772,"height":1040}],"source":129,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Architect's world EXPERT INTERVIEW\n1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world.\n2 Architect's world: What are your favourite home designs?\nMichael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?","sourcePage":129},{"body":"MC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls. There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family.\n4 AW: What do architects use to build houses?\nMC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different.\nFor example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls.\n¹ steep (adj) goes down very quickly and almost straight down\n² narrow (adj) not much space from one side to the other\n³ green (adj) something which does not use a lot of energy","sourcePage":129}],"text":"Architect's world EXPERT INTERVIEW\n1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world.\n2 Architect's world: What are your favourite home designs?\nMichael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?\nMC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls. There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family.\n4 AW: What do architects use to build houses?\nMC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different.\nFor example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls.\n¹ steep (adj) goes down very quickly and almost straight down\n² narrow (adj) not much space from one side to the other\n³ green (adj) something which does not use a lot of energy","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0d28032af27303115d806791372c55251b44e81985071e655dac558599c39a5.mp3"},"original":{"id":"B01-RW-U06-material:RW-M03","entry":"material:RW-M03","unitId":"B01-RW-U06","book":1,"track":"RW","unit":6,"title":"Architect’s world EXPERT INTERVIEW","kind":"material","pages":[129],"sourceImages":[{"page":129,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efa0d50a529815c44e2a1bcde8a2a87515462e69a45a337fc0952c8a85b752ce.png","viewEvidenceReported":true}],"text":"Architect's world EXPERT INTERVIEW\n\n1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world.\n2 Architect's world: What are your favourite home designs?\nMichael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?\nMC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls. There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family.\n4 AW: What do architects use to build houses?\nMC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different.\nFor example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls.\n\n¹ steep (adj) goes down very quickly and almost straight down\n² narrow (adj) not much space from one side to the other\n³ green (adj) something which does not use a lot of energy","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2173"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0d28032af27303115d806791372c55251b44e81985071e655dac558599c39a5.mp3","continueOnPage":true}},{"id":"B01-RW-U06-classroom:material:RW-M04","book":1,"unit":6,"track":"RW","topic":"HOMES AND BUILDINGS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"READING 2"},"pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/20ed07c7d2043dbc50942663e8b5296004b87a699ec0727a536ce8421a38de43.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.\nDo you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore\n## Dubai International Airport\n[IMAGE_2]\n## MINI CITIES\nThese days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.","sourcePage":132},{"body":"All these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n## CHANGES AREN'T CHEAP\nIt costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n## Munich International Airport","sourcePage":132}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"BEFORE YOU CATCH YOUR FLIGHT ...","pages":[{"page":132,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/20ed07c7d2043dbc50942663e8b5296004b87a699ec0727a536ce8421a38de43.png","width":772,"height":1040}],"source":132,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.\nDo you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore\n## Dubai International Airport\n[IMAGE_2]\n## MINI CITIES\nThese days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.","sourcePage":132},{"body":"All these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n## CHANGES AREN'T CHEAP\nIt costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n## Munich International Airport","sourcePage":132}],"text":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.\nDo you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore\n## Dubai International Airport\n[IMAGE_2]\n## MINI CITIES\nThese days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.\nAll these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n## CHANGES AREN'T CHEAP\nIt costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n## Munich International Airport","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fb0ea31e5a3dd1a1d64893d1fcbc7d7528cfa8dfd9e9f5c38fd71c3b8382b1c9.mp3"},"original":{"id":"B01-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B01-RW-U06","book":1,"track":"RW","unit":6,"title":"BEFORE YOU CATCH YOUR FLIGHT ...","kind":"material","pages":[132],"sourceImages":[{"page":132,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/20ed07c7d2043dbc50942663e8b5296004b87a699ec0727a536ce8421a38de43.png","viewEvidenceReported":true}],"text":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\n\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.\n\nDo you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore\n\n## Dubai International Airport\n\n[IMAGE_2]\n\n## MINI CITIES\n\nThese days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.\n\nAll these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n\n## CHANGES AREN'T CHEAP\n\nIt costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n\n## Munich International Airport","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2185"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fb0ea31e5a3dd1a1d64893d1fcbc7d7528cfa8dfd9e9f5c38fd71c3b8382b1c9.mp3","continueOnPage":true}},{"id":"B01-RW-U06-classroom:review-1","book":1,"unit":6,"track":"RW","topic":"HOMES AND BUILDINGS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6ebb5c0f6aa1d2a40dfce5b8214e183daae8ebdcda2e6aa91df9add47c3773c9.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B01-RW-U06-B-001","form":"apartment","page":145},{"id":"B01-RW-U06-B-002","form":"beautiful","page":145},{"id":"B01-RW-U06-B-003","form":"big","page":145},{"id":"B01-RW-U06-B-004","form":"building","page":145},{"id":"B01-RW-U06-B-005","form":"car park","page":145},{"id":"B01-RW-U06-B-006","form":"ceiling","page":145},{"id":"B01-RW-U06-B-008","form":"entrance","page":145},{"id":"B01-RW-U06-B-009","form":"exit","page":145},{"id":"B01-RW-U06-B-010","form":"fast","page":145},{"id":"B01-RW-U06-B-011","form":"fl or cars and motorbikes. There's a(n) 7 __ at the back for cars. There's also a small 8 __ with trees behind the building, but no-one goes there. People prefer to sit in the 9 __ on top of the building. There are some plants and chairs there. I think my apartment is beautiful. It has a high 10 __ and white 11 __ . There are big 12 __ in the lounge and bedroom. The apartment has a lot of light and space. Also, it's close to a modern 13 __ and it's easy to go shopping.","values":["apartment building","floors","lift","stairs","entrance","car park","exit","garden","roof","ceiling","walls","windows","shopping centre"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B02-RW-U05-question:b3751":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"It is easy to get to my house. First, walk (1) __ the High Street. Go (2) __ the bank and (3) __ the bridge. Then walk (4) __ the park and (5) __ the next bridge. Go (6) __ the tunnel – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-RW-U06-question:b2183":{"rows":{},"replaceBlocks":[{"part":0,"block":0,"blocks":[{"kind":"text","text":"1 What is the normal order for these activities when you catch a flight?"},{"kind":"item","label":"","prompt":"____ get a seat number","options":[],"answer":{"mode":"gap","answer":"3"}},{"kind":"item","label":"","prompt":"____ get on the plane","options":[],"answer":{"mode":"gap","answer":"5"}},{"kind":"item","label":"","prompt":"____ go to the airport","options":[],"answer":{"mode":"gap","answer":"1"}},{"kind":"item","label":"","prompt":"____ go through security","options":[],"answer":{"mode":"gap","answer":"4"}},{"kind":"item","label":"","prompt":"____ go to check in","options":[],"answer":{"mode":"gap","answer":"2"}}]}],"basis":"已对照教材第 131 页和答案手册 PDF 第 6 页，补回第 1 小题的五个排序位置。第 2、3 小题供课堂讨论。"},"B01-RW-U06-question:b2184":{"rows":{},"textFills":[{"part":0,"block":0,"text":"a ____ (v) when you have to pay money to buy something","values":["costs"]},{"part":0,"block":1,"text":"b ____ (n) a building where you can get on a plane","values":["terminal"]},{"part":0,"block":2,"text":"c ____ (n) a large object that children climb and go down as a fun thing to do","values":["slide"]},{"part":0,"block":3,"text":"d ____ (adj) when you feel happy and comfortable because nothing is worrying you","values":["relaxed"]}],"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{"B01-RW-U06-question:b2186":{"basis":"已核对教材原题和教师资料。","rows":{"b2186.i01":{"mode":"choice","option":2}},"overrideRows":true}},{"B01-RW-U06-classroom:material:RW-M03":[{"body":"Architect's world EXPERT INTERVIEW\n1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world.","sourcePage":129,"blocks":[{"kind":"text","text":"Architect's world EXPERT INTERVIEW"},{"kind":"text","text":"1 Professor Michael Chan teaches design to architects at the London School of Architecture. He has been at the school for 30 years. Home design is different today than it was 30 years ago. This week, Michael tells us more about new home design around the world."}]},{"body":"2 Architect's world: What are your favourite home designs?","sourcePage":129,"blocks":[{"kind":"text","text":"2 Architect's world: What are your favourite home designs?"}]},{"body":"Michael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside.\n3 AW: What do you think about 'green' homes?","sourcePage":129,"blocks":[{"kind":"text","text":"Michael Chan: I really like Japanese designs. Many people in Japan build interesting houses. For example, the roof house is very tall and has a steep¹ roof. The windows on the roof are different sizes. Inside the house, the rooms are very narrow² and the ceilings are very high. It is simple and very small inside."},{"kind":"text","text":"3 AW: What do you think about 'green' homes?"}]},{"body":"MC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls.","sourcePage":129,"blocks":[{"kind":"text","text":"MC: It is very important to build houses which are good for the Earth. My favourite example is a house in Saigon, Vietnam. It is a 'garden home'. This house is in the middle of a busy city, but there are plants everywhere. From the street, people see a tall garden. But, in fact, it is a house. There are plants and trees in front of the glass walls."}]},{"body":"There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family.\n4 AW: What do architects use to build houses?","sourcePage":129,"blocks":[{"kind":"text","text":"There is also a small garden on the roof. You can put chairs and a table there and enjoy tea with your family."},{"kind":"text","text":"4 AW: What do architects use to build houses?"}]},{"body":"MC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different.\nFor example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls.","sourcePage":129,"blocks":[{"kind":"text","text":"MC: Many architects use wood. It keeps your house warm in winter. They also use metal and glass. Sometimes they use something different."},{"kind":"text","text":"For example, one architect from Amsterdam put mirrors on every wall of a house. Other architects use glass or even plastic for the walls."}]},{"body":"¹ steep (adj) goes down very quickly and almost straight down\n² narrow (adj) not much space from one side to the other\n³ green (adj) something which does not use a lot of energy","sourcePage":129,"blocks":[{"kind":"text","text":"¹ steep (adj) goes down very quickly and almost straight down"},{"kind":"text","text":"² narrow (adj) not much space from one side to the other"},{"kind":"text","text":"³ green (adj) something which does not use a lot of energy"}]}],"B01-RW-U06-classroom:material:RW-M04":[{"body":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do.\nIf you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults.","sourcePage":132,"blocks":[{"kind":"text","text":"Think about an airport. You go there, you check in and then you catch your flight. Is that all you can do? No, airports have lots of interesting things to do."},{"kind":"text","text":"If you go to Changi Airport in Singapore, you can go down the world's tallest slide. In Terminal 3, there's a 12-metre-high slide for children and adults."}]},{"body":"Do you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours.\n[IMAGE_1]\nTerminal 3 Changi Airport, Singapore","sourcePage":132,"blocks":[{"kind":"text","text":"Do you want to feel very relaxed before your flight? Try the beautiful Zen Garden at Dubai Airport. Or if you are feeling very tired, there are Napcabs at Munich Airport. They are very small rooms where you can sleep for one or two hours."},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"Terminal 3 Changi Airport, Singapore"}]},{"body":"## Dubai International Airport\n[IMAGE_2]\n## MINI CITIES","sourcePage":132,"blocks":[{"kind":"text","text":"## Dubai International Airport"},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"## MINI CITIES"}]},{"body":"These days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares.","sourcePage":132,"blocks":[{"kind":"text","text":"These days, airports are like small cities. They all have lots of shops and restaurants and they are big. Changi Airport has an area of 2,500 hectares (that's 25 square kilometres). Munich Airport is a bit smaller with 1,575 hectares. But Dubai Airport is very big with an area of 2,900 square hectares."}]},{"body":"All these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area.\n## CHANGES AREN'T CHEAP","sourcePage":132,"blocks":[{"kind":"text","text":"All these airports have grown over the years. Changi Airport opened with one terminal in 1981. It now has four terminals. Dubai Airport was very small when it opened in 1960. It now has three terminals. Munich Airport opened with one terminal in 1992. It now has two terminals and Terminal 2 also has an extra new area."},{"kind":"text","text":"## CHANGES AREN'T CHEAP"}]},{"body":"It costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars.\n## Munich International Airport","sourcePage":132,"blocks":[{"kind":"text","text":"It costs a lot of money to make airports bigger and better. For example, Terminal 3 at Dubai Airport cost 4.5 billion dollars. Munich Airport's new area for Terminal 2 cost 695 million dollars. And Terminal 4 at Changi Airport cost 730 million dollars."},{"kind":"text","text":"## Munich International Airport"}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evidence: nurse in a big hospital","header":false,"colspan":1,"ro ___ It has 57 lifts.","answer":{"mode":"blanks","values":["Yes"]}}]},{"part":1,"block":5,"blocks":[{"kind":"text","text":"____ One World Trade Center has 54 lifts, but the Shanghai World Financial Center has fewer.","answer":{"mode":"blanks","values":["Yes"]}}]}],"rewriteKey":""},"B02-RW-U05-question:b3715":{"rows":{"b3715.i01":{"mode":"choice","option":1},"b3715.i02":{"mode":"choice","option":1},"b3715.i03":{"mode":"choice","options":[1,3]}},"basis":"教材第 107 页与教师书 PDF 第 47 页。第 3 项可同时选形容词和名词。","rewriteKey":""},"B02-RW-U05-question:b3721":{"rows":{"b3721.i01":{"mode":"choice","option":4},"b3721.i02":{"mode":"choice","option":1},"b3721.i03":{"mode":"choice","option":3},"b3721.i04":{"mode":"choice","option":0},"b3721.i05":{"mode":"choice","option":2}},"basis":"教材第 109 页与教师书 PDF 第 47 页。将阅读五段与 a 至 e 的运动名称核对。","rewriteKey":""},"B02-RW-U05-question:b3725":{"rows":{"b3725.i01":{"mode":"choice","option":0},"b3725.i02":{"mode":"choice","option":1},"b3725.i03":{"mode":"choice","option":1}},"basis":"教材第 110 页与教师书 PDF 第 47 页。按阅读对象、网页来源和文章体裁复核。","rewriteKey":""},"B02-RW-U05-question:b3741":{"rows":{"b3741.i01":{"mode":"choice","option":1},"b3741.i02":{"mode":"choice","option":1},"b3741.i03":{"mode":"choice","option":1},"b3741.i04":{"mode":"choice","option":0}},"basis":"教材第 113 页与教师书 PDF 第 48 页。按 Tough Guy 文章对应条目信息核对。 教材原页 Ex 5 共四项。","rewriteKey":""},"B02-RW-U05-question:b3765":{"rows":{"b3765.i01":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":23}]},"b3765.i02":{"mode":"indexed-mark","parts":[{"start":0,"end":2,"underline":true},{"start":3,"end":8}]},"b3765.i03":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":21}]}},"basis":"教材第 118 页与教师书 PDF 第 50 页。选择完整主语和限定动词。","itemPatches":{"b3765.i01":{"options":[]},"b3765.i02":{"options":[]},"b3765.i03":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-RW-U06":{"aspect":1.9085487,"cues":[[0,1.6,"Singapore.","(原始内容存档于2018-03-21). Singapore."],[2.34,5.98,"It's an island, a city and a country.","其岛，城及诸国。"],[6.54,10.54,"It's an important center for banking, technology and transport.","它是银行业，技术和交通的重要中心。"],[11.04,12.52,"And it's growing.","亦复增长。"],[13.68,16.86,"It has the second busiest port in the world.","它拥有世界上第二繁忙的港口。"],[18.54,24.74,"With an area of less than 720 square kilometers and five and million people,","面积不到720平方公里，有五百万人口，"],[25.1,26.58,"space is a problem.","空间是一个问题。"],[27.54,29.04,"Where does everyone live?","每个人都住在哪里？"],[30.18,35.38,"In the first half of the 20th century, many people lived in buildings like these.","在20世纪上半叶，许多人住在这样的建筑中。"],[35.78,40.24,"There are shops on the bottom floor and people live on the second floor.","底层有商店，人们住在二楼。"],[40.6,44.74,"But there were not enough houses or flats for the growing population.","但是，没有足够的房屋或公寓供不断增长的人口使用。"],[53.7,59.38,"The government began to build hundreds of tall apartment buildings like these.","政府开始建造数百座这样的高楼公寓建筑。"],[60.14,61.54,"The apartments are modern,","公寓是现代化的，"],[61.96,63.06,"simple and light.","简单又轻"],[63.92,64.32,"Today,","今天，我们。.."],[64.66,68.53999999999999,"more than 80 % of the population lives in these buildings.","超过80%的人口生活在这些建筑中。"],[69.98,74.2,"Groups of buildings create high -rise neighborhoods with schools,","建筑群创造了高楼街区与学校，"],[74.72,74.94,"shopping,","购物，"],[75.62,78.08,"restaurants and medical offices nearby.","附近有餐厅和医务室"],[79.44,86.3,"About ten % of all tourists arrive by cruise ship and there are lots of hotels.","大约10%的游客乘坐游轮抵达，而且有许多旅馆。"],[87.46000000000001,93.52000000000001,"The country has more than a million hotel rooms for all of the tourists and business travelers.","国家拥有100多万个酒店房间，供所有游客和商务旅行者使用。"],[95.53999999999999,97.44,"There are traditional hotels.","这里有传统的酒店。"],[98.32,102.58,"This one is probably Singapore's most famous hotel,","这个可能是新加坡最著名的酒店"],[103.28,103.74000000000001,"Raffles.","华夫网。"],[104.32,109.88,"It was built in 1887 when Singapore was part of the British Empire.","它建于1887年，当时新加坡是大英帝国的一部分。"],[111.46000000000001,113.7,"Most hotels in the city are modern.","市内大多数酒店都是现代化的。"],[114.52000000000001,117.97999999999999,"This luxury hotel stands next to the sea.","这座豪华酒店站在海边。"],[119.4,121.36,"But for the people of Singapore,","但对于新加坡人民来说，"],[122,123.64,"this looks like home.","这看起来像家。"],[124.92,127.92,"More than 90 % of them own their home,","90%以上的人拥有自己的家，"],[128.36,130.92,"one of the highest rates in the world.","这是世界上最高的利率之一。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B01-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/43bc79d96c1ab4c1c65fd30680983178026a8a97dcc42e2a052e66e91158d0e8.pdf","size":28669491},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");

  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

}

function jumpTo(id,vocabulary=false){
 const i=classroom.indexById.get(id);
 if(i===undefined)return;
 history.push({i:current,p:part,...(vocabulary?{vocabulary:id}:{})});
 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);
}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});
 return true;
}
function closeSource(){
 const modal=document.getElementById("source-modal");
 if(modal.hidden)return;
 modal.hidden=true;
 if(sourceTrigger?.isConnected)sourceTrigger.focus({preventScroll:true});
 sourceTrigger=null;
}
function showSource(){
 const source=sourceEntries[sourcePart];
 if(!source)return;
 document.getElementById("source-label").textContent="Book "+source.book+" "+(source.track==="RW"?"读写":"听说")+"，教材第 "+source.page+" 页";
 const image=document.getElementById("source-image");
 const status=document.getElementById("source-hd-status");
 const originalKey=source.originalKey??("B"+String(source.book).padStart(2,"0")+"-"+source.track+"/"+source.page);
 displayCourseOriginalImage(image,originalKey,status);
 const pdf=document.getElementById("source-pdf");
 pdf.hidden=!source.pdf;
 if(source.pdf)pdf.href=source.pdf;
 document.getElementById("source-prev").disabled=sourcePart===0;
 document.getElementById("source-next").disabled=sourcePart===sourceEntries.length-1;
}
function summaries(){
 const counts={直接适用:0,预设变体适用:0,不适用:0};
 for(const r of Object.values(results))counts[r.verdict]++;
