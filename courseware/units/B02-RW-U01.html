Quote":"boring","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-2","label":"cheap","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"cheap","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-3","label":"clean","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"clean","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-4","label":"expensive","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"expensive","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-5","label":"interesting","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"interesting","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-6","label":"noisy","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"noisy","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-7","label":"polluted","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"polluted","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-8","label":"quiet","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"quiet","sourceOrigin":"original-image","sourceQuotePage":25},{"id":"image:p025:adj-9","label":"ugly","prompt":"第25页练习2词框中的形容词","actionZh":"归入三列表格。","page":25,"sourceQuote":"ugly","sourceOrigin":"original-image","sourceQuotePage":25}],"references":[{"id":"B02-RW-U01-question:b3310","title":"LANGUAGE DEVELOPMENT Ex 2","pages":[25],"kind":"material-reference"}],"materials":[{"id":"B02-RW-U01-resource:b3307","title":"NOUNS AND ADJECTIVES","kind":"resource","pages":[25],"text":"A noun refers to a person, place or thing: girl, teacher, city, bus, homestay\n\nAn adjective describes a noun: tall, historic, busy, slow, expensive\n\nnoun\tadjective\tadjective\tnoun\tnoun\nAbdullah\tlives in a\tbig,\tcrowded\tcity\twith his family."},{"id":"B02-RW-U01-resource:b3309","title":"Adjectives","kind":"resource","pages":[25],"text":"Adjectives\nAdjectives describe nouns. Use the structure adjective + noun.\n\nadjective\t+ noun\nBeirut is an\tinteresting\tcity.\nThere are many\texcellent\trestaurants.\n\nAdjectives also come after the verb be.\nThe city is beautiful in the summer.\n\nAdjectives are never plural.\na different place → some differents places ✗ some different places ✓"},{"id":"B02-RW-U01-resource:b3312","title":"Countable and uncountable nouns","kind":"resource","pages":[26],"text":"Countable and uncountable nouns\n\nThere are two kinds of nouns in English: countable (C) and uncountable (U).\n\nCountable (C) nouns are nouns that we can count. They can be singular or plural.\n\none house → two houses\n\nUncountable (U) nouns are nouns that we cannot count. Uncountable nouns often refer to food, liquids and ideas. Uncountable nouns only have a singular form.\n\ninformations × information ✓"},{"id":"B02-RW-U01-resource:b3315","title":"Articles: a, an or zero article","kind":"resource","pages":[26],"text":"Articles: a, an or zero article\n\nUse a or an before a singular countable noun.\n\na house\n\nUse a before a countable noun that starts with a consonant.\n\na café\n\nUse an before a countable noun that starts with a vowel (a, e, i, o, u).\n\nan area\n\nDo not use a or an before a plural countable noun or an uncountable noun.\n\nThis is the zero article.\n\nbuildings information"},{"id":"B02-RW-U01-resource:b3317","title":"QUANTIFIERS","kind":"resource","pages":[27],"text":"## QUANTIFIERS\n\nUse a quantifier before a noun to describe the amount or number of something.\n\nSome restaurants are closed today.\n\nUse different quantifiers with countable and uncountable nouns.\n\n\u003ctable>\u003ctr>\u003ctd>quantifiers with countable nouns\u003c/td>\u003ctd>quantifiers with uncountable nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a lot of / lots of many some a few\u003c/td>\u003ctd>a lot of / lots of some a little\u003c/td>\u003c/tr>\u003c/table>\n\nIn negative sentences, use many with countable nouns and much with uncountable nouns.\n\nMy city doesn't have many tall buildings. My city doesn't have much traffic."}],"media":[],"sourceBlockIds":["b3311"],"inputNotes":[],"issues":[],"variant":true,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/caf366e423dc2e17cefb18b2712937d7ea4691816f682200c2baa7968187508a.jpg"],"fullTextSha256":"d6f635f49c466a07a5414b2b9fecc47b9ec363599f905a9cf6e9af0311da2e4c","activeMaterials":[],"presentation":{"kind":"table","bank":["beautiful","boring","cheap","clean","expensive","interesting","noisy","polluted","quiet","ugly"],"headers":true,"rows":[["positive (+)","negative (−)","(+) or (−)"],["beautiful","",""]]},"sourcePages":[25],"feedback":{"mode":"after","kind":"example","source":"读写教师书第 25 页","rows":[{"label":"+","prompt":"positive (+)","answer":"beautiful, clean, interesting","basis":"beautiful 已在教材表格中给出。","sourcePage":25,"anchor":{"kind":"cell","at":[1,0]},"display":"clean, interesting"},{"label":"−","prompt":"negative (−)","answer":"boring, noisy, polluted, ugly","basis":"这些词在本题参考分类中表示负面特征。","sourcePage":25,"anchor":{"kind":"cell","at":[1,1]}},{"label":"+ / −","prompt":"(+) or (−)","answer":"cheap, expensive, quiet","basis":"评价随场景和说话者改变。例如 quiet 可以让人休息，也可能让人觉得无聊。","sourcePage":25,"anchor":{"kind":"cell","at":[1,2]}}],"placement":"inline"}},{"id":"B02-RW-U01-question:b3313","track":"RW","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"4","pages":[26],"layout":"list","instruction":"Work with a partner. Decide if these nouns are countable or uncountable. Write C (countable) or U (uncountable).","provided":"","items":[{"id":"b3313.i01","label":"1","prompt":"food ____","type":"choice/closed","options":["C (countable)","U (uncountable)"]},{"id":"b3313.i02","label":"2","prompt":"building ____","type":"choice/closed","options":["C (countable)", ion":{"kind":"text","text":"Hi\n\nTokyo is great. There are (1) lots of / much cafés and other places to eat. As you know, my town is small and only has (2) a few / a little restaurants. (3) Many / Much people live here and there is (4) many / a lot of public transport. Go online if you want to find (5) some / a little things to do in the city when you visit me in the summer. Send me an email and tell me (6) a few / a little information about your town or city.","paperStyle":"textbook"},"sourcePages":[27],"feedback":{"mode":"after","kind":"answer","source":"读写教师书第 26 页","rows":[{"label":"1","prompt":"There are ____ cafés and other places to eat.","answer":"lots of","basis":"cafés 是可数复数。","sourcePage":27,"anchor":{"kind":"text-choice","match":"(1) lots of / much","alternatives":["lots of","much"],"options":[0]}},{"label":"2","prompt":"my town is small and only has ____ restaurants.","answer":"a few","basis":"restaurants 是可数复数，a few 表示少量。","sourcePage":27,"anchor":{"kind":"text-choice","match":"(2) a few / a little","alternatives":["a few","a little"],"options":[0]}},{"label":"3","prompt":"____ people live here","answer":"Many","basis":"people 是复数。","sourcePage":27,"anchor":{"kind":"text-choice","match":"(3) Many / Much","alternatives":["Many","Much"],"options":[0]}},{"label":"4","prompt":"there is ____ public transport.","answer":"a lot of","basis":"public transport 是不可数名词短语。","sourcePage":27,"anchor":{"kind":"text-choice","match":"(4) many / a lot of","alternatives":["many","a lot of"],"options":[1]}},{"label":"5","prompt":"if you want to find ____ things to do in the city when you visit me in the summer.","answer":"some","basis":"things 是可数复数，可以用 some。","sourcePage":27,"anchor":{"kind":"text-choice","match":"(5) some / a little","alternatives":["some","a little"],"options":[0]}},{"label":"6","prompt":"tell me ____ information about your town or city.","answer":"a little","basis":"information 是不可数名词。","sourcePage":27,"anchor":{"kind":"text-choice","match":"(6) a few / a little","alternatives":["a few","a little"],"options":[1]}}],"placement":"inline"}},{"id":"B02-RW-U01-question:b3319","track":"RW","lesson":1,"order":24,"module":"LANGUAGE DEVELOPMENT","ex":"8","pages":[27],"layout":"dual","instruction":"Write a short email to Karina. Tell her three things about your town or city. Use phrases from columns A and B with quantifiers.","provided":"\u003ctable>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>My town/city has\u003c/td>\u003ctd>traffic at night.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>We have\u003c/td>\u003ctd>people.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I have\u003c/td>\u003ctd>neighbours.\u003c/td>\u003c/tr>\u003c/table>\n\nHi Karina,","items":[{"id":"b3319.i01","label":"1","prompt":"Hi Karina,","type":"gap/open","options":[]}],"requirements":[{"localId":"a01","actionZh":"写邮件称呼“Hi Karina,”。","sourceItemIds":["b3319.i01"],"page":27,"sourceQuote":"Hi Karina,","sourceOrigin":"original-image","sourceQuotePage":27,"outputZh":"邮件称呼。","constraintsZh":[],"sourceTargetCue":"Hi Karina,"},{"localId":"a02","actionZh":"写第一件关于自己城镇或城市的事。","sourceItemIds":[],"page":27,"sourceQuote":"Tell her three things about your town or city.","sourceOrigin":"original-image","sourceQuotePage":27,"outputZh":"第一条信息。","constraintsZh":["使用A、B栏短语和量词"],"sourceTargetCue":""},{"localId":"a03","actionZh":"写第二件关于自己城镇或城市的事。","sourceItemIds":[],"page":27,"sourceQuote":"Tell her three things about your town or city.","sourceOrigin":"original-image","sourceQuotePage":27,"outputZh":"第二条信息。","constraintsZh":["使用A、B栏短语和量词"],"sourceTargetCue":""},{"localId":"a04","actionZh":"写第三件关于自己城镇或城市的事。","sourceItemIds":[],"page":27,"sourceQuote":"Tell her three things about your town or city.","sourceOrigin":"original-image","sourceQuotePage":27,"outputZh":"第三条信息。","constraintsZh":["使用A、B栏短语和量词"],"sourceTargetCue":""}],"additionalTargets":[{"id":"image:p027:email-body","label":"email body","prompt":"第27页练习8邮件正文框","actionZh":"写三条城镇或城市信息。","page":27,"sourceQuote":"Tell her three things about your town or city.","sourceOrigin":"original-image","sourceQuotePage":27}],"references":[],"materials":[{"id":"B02-RW-U01-resource:b3307","title":"NOUNS AND ADJECTIVES","kind":"resource","pages":[25],"text":"A noun refers to a person, place or thing: girl, teacher, city, bus, homestay\n\nAn adjective describes a noun: tall, historic, busy, slow, expensive\n\nnoun\tadjective\tadjective\tnoun\tnoun\nAbdullah\tlives in a\tbig,\tcrowded\tcity\twith his family."},{"id":"B02-RW-U01-resource:b3309","title":"Adjectives","kind":"resource","pages":[25],"text":"Adjectives\nAdjectives describe nouns. Use the structure adjective + noun.\n\nadjective\t+ noun\nBeirut is an\tinteresting\tcity.\nThere are many\texcellent\trestaurants.\n\nAdjectives also come after the verb be.\nThe city is beautiful in the summer.\n\nAdjectives are never plural.\na different place → some differents places ✗ some different places ✓"},{"id":"B02-RW-U01-resource:b3312","title":"Countable and uncountable nouns","kind":"resource","pages":[26],"text":"Countable and uncountable nouns\n\nThere are two kinds of nouns in English: countable (C) and uncountable (U).\n\nCountable (C) nouns are nouns that we can count. They can be singular or plural.\n\none house → two houses\n\nUncountable (U) nouns are nouns that we cannot count. Uncountable nouns often refer to food, liquids and ideas. Uncountable nouns only have a singular form.\n\ninformations × information ✓"},{"id":"B02-RW-U01-resource:b3315","title":"Articles: a, an or zero article","kind":"resource","pages":[26],"text":"Articles: a, an or zero article\n\nUse a or an before a singular countable noun.\n\na house\n\nUse a before a countable noun that starts with a consonant.\n\na café\n\nUse an before a countable noun that starts with a vowel (a, e, i, o, u).\n\nan area\n\nDo not use a or an before a plural countable noun or an uncountable noun.\n\nThis is the zero article.\n\nbuildings information"},{"id":"B02-RW-U01-resource:b3317","title":"QUANTIFIERS","kind":"resource","pages":[27],"text":"## QUANTIFIERS\n\nUse a quantifier before a noun to describe the amount or number of something.\n\nSome restaurants are closed today.\n\nUse different quantifiers with countable and uncountable nouns.\n\n\u003ctable>\u003ctr>\u003ctd>quantifiers with countable nouns\u003c/td>\u003ctd>quantifiers with uncountable nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a lot of / lots of many some a few\u003c/td>\u003ctd>a lot of / lots of some a little\u003c/td>\u003c/tr>\u003c/table>\n\nIn negative sentences, use many with countable nouns and much with uncountable nouns.\n\nMy city doesn't have many tall buildings. My city doesn't have much traffic."}],"media":[],"sourceBlockIds":["b3319"],"inputNotes":[],"issues":[],"variant":false,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/211a82755acd9548394c0b82e142f7cb86e9e5bddf2409f92fb9591a464008b9.jpg"],"fullTextSha256":"0b77e35b16bbc4790d755694a93d2a376972ab5ec48fe304c5bc4895a5857469","activeMaterials":[]},{"id":"B02-RW-U01-question:b3289","track":"RW","lesson":2,"order":25,"module":"READING 2","ex":"1","pages":[22],"layout":"dual","instruction":"Read the definitions. Complete the sentences with the words in bold.","provided":"","items":[{"id":"b3289.i01","label":"1","prompt":"My hotel is ____ and calm. It is not in the busy part of the city, so it isn't loud at night.","type":"choice/closed","options":["area","cheap","city centre","expensive","local","noisy","quiet"]},{"id":"b3289.i02","label":"2","prompt":"Central Park is a nice ____ to visit in New York.","type":"choice/closed","options":["area","cheap","city centre","expensive","local","noisy","quiet"]},{"id":"b3289.i03","label":"3","prompt":"When people visit new cities, it's a good idea to ask ____ people for the best restaurants. They know the most about their city.","type":"choice/closed","options":["a 依据。","page":23,"sourceQuote":"Homestays are becoming more and more popular","sourceOrigin":"original-image","sourceQuotePage":23}],"references":[{"id":"B02-RW-U01-question:b3292","title":"READING 2 Ex 3","pages":[22],"kind":"material-reference","use":"visible"}],"materials":[{"id":"B02-RW-U01-resource:b3288","title":"GLOSSARY","kind":"resource","pages":[22],"text":"area (n) a region or part of a larger place, like a country or city\ncheap (adj) not expensive, or costs less than usual\ncity centre (n) the main or central part of a city\nexpensive (adj) costs a lot of money; not cheap\nlocal (adj) relating to a particular area, city or town\nnoisy (adj) loud; makes a lot of noise\nquiet (adj) makes little or no noise"}],"media":[],"sourceBlockIds":["b3290"],"inputNotes":[],"issues":[],"variant":false,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9428f05133a7c7c4725bf26c8e714ed22965bf39238783fa95f8d8d8dc6712b2.jpg"],"supportText":"Homestays are becoming more and more popular, and people around the world are offering their homes as places to stay. Homestays offer cheap places to stay and the chance for guests to see the area like local people. They are very popular with students who want to stay in another country and learn a language. We asked three families who run homestays to tell us about where they live.","supportTitle":"Homestay Holidays introduction","fullTextSha256":"8ee331cad3d3a3263c1ec5c82270f76c8eb35de14dff80bfb1976740e163aee6","activeMaterials":[],"readingView":{"reading":"B02-RW-U01:reading-2","sections":["intro"]}},{"id":"B02-RW-U01-question:b3292","track":"RW","lesson":2,"order":27,"module":"READING 2","ex":"3","pages":[22],"layout":"dual","instruction":"Read the introduction in the homestay webpage again. Underline the words and phrases that answer the questions below. Then write the answers to the questions.","provided":"","items":[{"id":"b3292.i01","label in another country and learn a language. We asked three families who run homestays to tell us about where they live.\n\n[IMAGE_3]\n\ntay in the mountains\n\nhe Atal family\n\nA Our family home is in the north of Nepal, in the Himalayan Mountains, in the village of Manang. The village is small and very quiet. It is a very friendly place. The mountains are extremely beautiful. You can go for long walks and swim in the rivers, but there are no shops, cinemas or cafés.\n\n[IMAGE_4]\n\nhouse by the sea\n\nate and Julian Foxton\n\nB Our two-bedroom house is by the sea in the south-west of England. It is 15 minutes' drive to the nearest village of Portreath. There are lots of beaches, rivers and forests, and it is very quiet. We spend a lot of time reading books, watching films and going for walks. Our area is great for sports like surfing, kayaking and mountain biking. However, the houses here are expensive, which can be a problem for local people. There are no buses or trains here, so it can be difficult to get around without a car.\n\n[IMAGE_5]\n\nity holiday\n\nhafic and Asma Halwany\n\nC Our home is near the historic city centre of Beirut, Lebanon, a large city in the Middle East. There are lots of cafés and restaurants, which are open late at night. We love it here because it's so friendly and you can always find what you need. Lots of people come here to learn Arabic and French. There are also a lot of jobs and businesses here. However, it can be noisy at night and there is a lot of traffic during the day. The best thing about Beirut is the weather. It is nice all year round; it rains in the winter, but there is no snow.","supportTitle":"Homestay Holidays","fullTextSha256":"a659afab6fb5bfb9e07262df57aca1910c5f71e5ac907858b6c2f46ad8b206c8","activeMaterials":[],"materialDecks":[{"label":"A","pages":[{"reading":"B02-RW-U01:reading-2","section":"A"}]},{"label":"B","pages":[{"reading":"B02-RW-U01:reading-2","section":"B"}]},{"label":"C","pages":[{"reading":"B02-RW-U01:re ty or the countryside?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-2","label":"2","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Why?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-3","label":"3","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Which homestay in Reading 2 would you like to stay in and why?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-4","label":"4","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Which homestay in Reading 2 would you like to stay in and why?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-5","label":"5","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Would you like to live in the city or the countryside?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-6","label":"6","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Why?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-7","label":"7","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Think of a large city that you know.","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-8","label":"8","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"What do local people do for fun?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-9","label":"9","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"What do people who visit the city on holiday do for fun?","sourceOrigin":"original-image","sourceQuotePage":24},{"id":"image:p024:ex8-10","label":"10","prompt":"第24页练习8内容目标","actionZh":"完成该讨论目标。","page":24,"sourceQuote":"Do you think local people and tourists do the same things?","sourceOrigin":"original-image","sourceQuotePage":24}],"references":[],"materials":[],"media":[],"sourceBlockIds":["b3303"],"inputNotes":[],"issues":[],"variant":true,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76be21f77466956a260af7f4bbaa6d71efba9704c60218e2e9f39ff90f51e008.jpg","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/40b0025e800a9386a82a585cf918c33a97e73dce21d2b41b59f289f688202112.jpg","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a54b1a05e825e3ffcfdfcd2ec235154e498319419b9e19340ba60c64f67c9954.jpg"],"supportText":"laces to stay\n\n[IMAGE_2]\n\nLocation:\n\nAdd place\n\nCheck in:\n\nAdd date\n\nCheck out:\n\nAdd date\n\nGuests:\n\nAdd guests\n\nHomestays are becoming more and more popular, and people around the world are offering their homes as places to stay. Homestays offer cheap places to stay and the chance for guests to see the area like local people. They are very popular with students who want to stay in another country and learn a language. We asked three families who run homestays to tell us about where they live.\n\n[IMAGE_3]\n\ntay in the mountains\n\nhe Atal family\n\nA Our family home is in the north of Nepal, in the Himalayan Mountains, in the village of Manang. The village is small and very quiet. It is a very friendly place. The mountains are extremely beautiful. You can go for long walks and swim in the rivers, but there are no shops, cinemas or cafés.\n\n[IMAGE_4]\n\nhouse by the sea\n\nate and Julian Foxton\n\nB Our two-bedroom house is by the sea in the south-west of England. It is 15 minutes' drive to the nearest village of Portreath. There are lots of beaches, rivers and forests, and it is very quiet. We spend a lot of time reading books, watching films and going for walks. Our area is great for sports like surfing, kayaking and mountain biking. However, the houses here are expensive, which can be a problem for local people. There are no buses or trains here, so it can be difficult to get around without a car.\n\n[IMAGE_5]\n\nity holiday\n\nhafic and Asma Halwany\n\nC Our home is near the historic city centre of Beirut, Lebanon, a large city in the Middle East. There are lots of cafés and restaurants, which are open late at night. We love it here because it's so friendly and you can always find what you need. Lots of people come here to learn Arabic and French. There are also a lot of jobs and businesses here. However, it can be noisy at night and there is a lot of traffic during the day. The best thing about Beirut is the weather. It is nice all year round; it rains in the winter, but there is no snow.","supportTitle":"Homestay Holidays","fullTextSha256":"c861163f42ddd242ed453d60081c85d04277a96364cfc5d03681b45f8b3bcc58","activeMaterials":[],"materialDecks":[{"label":"Reading 1","pages":[{"reading":"B02-RW-U01:reading-1","section":"1-2"},{"reading":"B02-RW-U01:reading-1","section":"3-4"},{"reading":"B02-RW-U01:reading-1","section":"5"},{"reading":"B02-RW-U01:reading-1","section":"6"},{"reading":"B02-RW-U01:reading-1","section":"7"},{"reading":"B02-RW-U01:reading-1","section":"8"}]},{"label":"Reading 2","pages":[{"reading":"B02-RW-U01:reading-2","section":"intro"},{"reading":"B02-RW-U01:reading-2","section":"A"},{"reading":"B02-RW-U01:reading-2","section":"B"},{"reading":"B02-RW-U01:reading-2","section":"C"}]}],"sourcePages":[24,19,23]},{"id":"B02-RW-U01-question:b3323","track":"RW","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"1","pages":[28],"layout":"list","instruction":"What is the main difference between the places described in Reading 1 and the places in Reading 2?","provided":"","items":[{"id":"b3323.i01","label":"1","prompt":"What is the main difference between the places described in Reading 1 and the places in Reading 2?","type":"qa/open","options":[]}],"requirements":[{"localId":"a01","actionZh":"回答“What is the main difference between the places described i \nhafic and Asma Halwany\n\nC Our home is near the historic city centre of Beirut, Lebanon, a large city in the Middle East. There are lots of cafés and restaurants, which are open late at night. We love it here because it's so friendly and you can always find what you need. Lots of people come here to learn Arabic and French. There are also a lot of jobs and businesses here. However, it can be noisy at night and there is a lot of traffic during the day. The best thing about Beirut is the weather. It is nice all year round; it rains in the winter, but there is no snow.","supportTitle":"Homestay Holidays","fullTextSha256":"7f4849bdf408d53501ec4c4632da691420db4956585661feb6c395356995a883","activeMaterials":[],"materialDecks":[{"label":"Beirut","pages":[{"reading":"B02-RW-U01:reading-2","section":"C"}]}],"presentation":{"kind":"items","showAll":true,"items":[{"id":"b3324.i01","label":"1","prompt":"lots of cafés and restaurants ____","type":"choice/closed","options":[]},{"id":"b3324.i02","label":"2","prompt":"places stay open late at night ____","type":"choice/closed","options":[]},{"id":"b3324.i03","label":"3","prompt":"a lot of traffic ____","type":"choice/closed","options":[]},{"id":"b3324.i04","label":"4","prompt":"it can be noisy ____","type":"choice/closed","options":[]},{"id":"b3324.i05","label":"5","prompt":"a lot of jobs and businesses ____","type":"choice/closed","options":[]}]},"sourcePages":[28,23],"feedback":{"mode":"guided","kind":"answer","source":"读写教师书第 26 页","rows":[{"label":"1","prompt":"lots of cafés and restaurants ____","answer":"+","basis":"C 段将咖啡馆和餐馆作为便利设施。","choices":["+","−"],"sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"2","prompt":"places stay open late at night ____","answer":"+","basis":"C 段说餐馆和咖啡馆营业到很晚。","choices":["+","−"],"sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"3","prompt":"a lot of traffic ____","answer":"−","basis":"C 段在 However 后指出白天交通繁忙。","choices":["+","−"],"sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"4","pr rts like surfing, kayaking and mountain biking. However, the houses here are expensive, which can be a problem for local people. There are no buses or trains here, so it can be difficult to get around without a car.\n\n[IMAGE_5]\n\nity holiday\n\nhafic and Asma Halwany\n\nC Our home is near the historic city centre of Beirut, Lebanon, a large city in the Middle East. There are lots of cafés and restaurants, which are open late at night. We love it here because it's so friendly and you can always find what you need. Lots of people come here to learn Arabic and French. There are also a lot of jobs and businesses here. However, it can be noisy at night and there is a lot of traffic during the day. The best thing about Beirut is the weather. It is nice all year round; it rains in the winter, but there is no snow.","supportTitle":"Homestay Holidays","fullTextSha256":"ec52d8fe24ba296306d7a497ddab787d62543b935a23f6e89ea8944c01fd75f3","activeMaterials":[],"materialDecks":[{"label":"A","pages":[{"reading":"B02-RW-U01:reading-2","section":"A"}]},{"label":"B","pages":[{"reading":"B02-RW-U01:reading-2","section":"B"}]},{"label":"C","pages":[{"reading":"B02-RW-U01:reading-2","section":"C"}]}],"taskTable":{"headers":true,"openBody":true,"rows":[["positive (+)","negative (−)"],["**beautiful**","**not many buses or trains**"]]},"sourcePages":[29,23],"feedback":{"source":"读写答案手册第 1 页，学生书第 23 至 29 页","kind":"example","mode":"after","rows":[{"label":"+","prompt":"positive (+)","answer":"quiet, friendly, beautiful, clean, lots of animals, cheap food","basis":"答案手册用这些内容举例。学生的补充要适合自己选的地点。","sourcePage":23,"anchor":{"kind":"board","at":0},"display":"quiet, friendly, clean, lots of animals, cheap food"},{"label":"−","prompt":"negative (−)","answer":"boring, no shops, cinemas or cafés, no jobs","basis":"可结合所选地点解释理由，必要时补充查到的资料。","sourcePage":23,"anchor":{"kind":"board","at":1}}],"placement":"inline"},"presentation":{"kind":"shared-board","key":"reading-places-t-chart","labels":["positive (+) ia row 4","page":120,"evidence":"The first-column criterion cell is visibly blank on the original page.","prompt":"is a hard worker","actionZh":"在表格第一列第4行写入招聘广告中的职位标准“is a hard worker”。","sourceQuote":"In the first column, write the job criteria from Exercise 1 on page 119.","sourceOrigin":"original-image","sourceQuotePage":120}],"media":[],"references":[{"id":"B01-LS-U05-question:b1261","title":"CRITICAL THINKING Ex 1","pages":[119],"sourceOnly":true}],"sourcePages":[120,121,119],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4c063f56cf27f8db5e190672f4379dfea0b5379cd71d14b65f575b16b35c26.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47915156346ba88ca2a78ef3d1f91295afac088ac4e8cb80d5c6f4bb2f969cbc.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/707dc14d8941d188c182a8138e5a062f183ec9999092aacd2c9faa88726fc3bf.png"],"materials":[{"id":"B01-LS-U05-resource:b1263","title":"Inesh","pages":[121],"text":"Home > Jobs > Current vacancies\nbout you\nMy name's inesh and I'm from Jakarta, Indonesia. I speak four languages: Indonesian, Chinese, Spanish and English. I speak Spanish better than English.\nI'm studying to be a nurse in a big hospital in Jakarta.\nI'm polite and friendly. This is important because nurses have to help doctors and work with patients.\nI would like to go to Canada and work in your sports centre after I get my degree.\nI don't do a lot of sports at the moment, because I'm busy.","kind":"resource"},{"id":"B01-LS-U05-resource:b1264","title":"Morena","pages":[121],"text":"Home > Jobs > Current vacancies\nbout you\nMy name's Morena and I'm from São Paulo in Brazil. I speak Portuguese, Spanish and English.\nI'm a nurse in a small children's hospital. I like working with children, but I would like to work in your sports centre in Canada.\nI'm a friendly and helpful nurse. I love sport. I go running and do yoga. I'm strong and fit. This is important because nurses have to work hard.","kind":"resource"},{"id":"B01-LS-U05-resource:b1265","title":"Darren","pages":[121],"text":"Home > Jobs > Current vacancies\nbout you\nMy name's Darren and I'm from Chicago, Illinois, in the US. I'm a nurse in a big hospital. I work hard and I'm good at my job.\nI only speak English, but I'm a fast learner and a good student.\nI'm fit and healthy. I love football and basketball, and I go to a gym. This is important because a sports-centre nurse should play sports.\nI would like to live in Canada.","kind":"resource"}],"materialDecks":[{"label":"Student A","pages":[{"sourcePage":121,"title":"Inesh","body":"My name’s Inesh and I’m from Jakarta, Indonesia. I speak four languages: Indonesian, Chinese, Spanish and English. I speak Spanish better than English.\nI’m studying to be a nurse in a big hospital in Jakarta.\nI’m polite and friendly. This is important because nurses have to help doctors and work with patients.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/93e04a06322cbba7d89f73094a33090edd90d5e679cb4369cf2df2ebed3d8e40.jpg","alt":"Inesh","notes":[]},{"sourcePage":121,"title":"Inesh","body":"I would like to go to Canada and work in your sports centre after I get my degree.\nI don’t do a lot of sports at the moment, because I’m busy.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/93e04a06322cbba7d89f73094a33090edd90d5e679cb4369cf2df2ebed3d8e40.jpg","alt":"Inesh","notes":[]}]},{"label":"Student B","pages":[{"sourcePage":121,"title":"Morena","body":"My name’s Morena and I’m from São Paulo in Brazil. I speak Portuguese, Spanish and English.\nI’m a nurse in a small children’s hospital. I like working with children, but I would like to work in your sports centre in Canada.\nI’m a friendly and helpful nurse. I love sport. I go running and do yoga. I’m strong and fit. This is important because nurses have to work hard.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e00dc601b115f517458165ecb343c741c0cb7e1b4faf0bf606d93c049f6df673.jpg","alt":"Morena","notes":[]}]},{"label":"Student C","pages":[{"sourcePage":121,"title":"Darren","body":"My name’s Darren and I’m from Chicago, Illinois, in the US. I’m a nurse in a big hospital. I work hard and I’m good at my job.\nI only speak English, but I’m a fast learner and a good student.\nI’m fit and healthy. I love football and basketball, and I go to a gym. This is important because a sports-centre nurse should play sports.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28be76bd1b012e6834cd365667e066da45e7519e7c669e49f21e442bf2f6b47b.jpg","alt":"Darren","notes":[]},{"sourcePage":121,"title":"Darren","body":"I would like to live in Canada.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28be76bd1b012e6834cd365667e066da45e7519e7c669e49f21e442bf2f6b47b.jpg","alt":"Darren","notes":[]}]},{"label":"Ex 1","pages":[{"sourcePage":119,"title":"Sports Centre Nurse","body":"The UoY sports centre is looking for a new nurse. The nurse works closely with other staff and helps our students stay healthy.\n**We are looking for a person who:**\nhas experience in a hospital.\nspeaks English and another language.\nknows about sport.\nis a hard worker.","subtitle":"(Ref: UoY-SSv/SpC-0099)","photo":"","alt":"","notes":[]},{"sourcePage":119,"title":"About you","body":"**You should:**\nbe helpful.\nlike sport.\nbe friendly.\nThe job is full time and includes some nights and weekends.","subtitle":"","photo":"","alt":"","notes":[]}]}],"taskTable":{"rows":[["criteria","Inesh","Morena","Darren"],["**has experience in a hospital**","Points:\nEvidence:","Points:\nEvidence:","Points: **2**\nEvidence: **nurse in a big hospital**"],["","Points:\nEvidence:","Points:\nEvidence:","Points:\nEvidence:"],["","Points:\nEvidence:","Points:\nEvidence:","Points:\nEvidence:"],["","Points:\nEvidence:","Points:\nEvidence:","Points:\nEvidence:"],["**is helpful and friendly**","Points:\nEvidence:","Points:\nEvidence:","Points:\nEvidence:"]],"headers":true}},{"id":"B02-RW-U05-question:b3758","book":2,"unit":5,"topic":"Sports And Competition","track":"RW","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"1","pages":[116],"layout":"visual","instruction":"A triathlon is a race in which people swim, then cycle, then run without stopping between events. Look at the diagram of the triathlon course in Sydney, Australia. Label the diagram with the words from the box. Use the key to help you.","provided":"bridge  central library  cycling route\nrunning route  tunnel  swimming route","items":[],"requirements":[{"localId":"a01","actionZh":"在图中第1号标注位写入词框中对应的标签。","sourceItemIds":[],"page":116,"sourceQuote":"Label the diagram with the words from the box.","sourceOrigin":"original-image","sourceQuotePage":116,"outputZh":"第1号位置的标签。","constraintsZh":["每个词框标签使用一次","使用图例"],"sourceTargetCue":""},{"localId":"a02","actionZh":"在图中第2号标注位写入词框中对应的标签。","sourceItemIds":[],"page":116,"sourceQuote":"Label the diagram with the words from the box.","sourceOrigin":"original-image","sourceQuotePage":116,"outputZh":"第2号位置的标签。","constraintsZh":["每个词框标签使用一次","使用图例"],"sourceTargetCue":""},{"localId":"a03","actionZh":"在图中第3号标注位写入词框中对应的标签。","sourceItemIds":[],"page":116,"sourceQuote":"Label the diagram with the words from the box.","sourceOrigin":"original-image","sourceQuotePage":116,"outputZh":"第3号位置的 e":116},{"label":"6","prompt":"第116页路线图第6号空位","answer":"running route","basis":"6 号引线指向红色虚线。图例中红色虚线对应跑步路线。","sourcePage":116}]}}],"answerCheck":{"tasks":60,"modeLabels":{"after":"学生先做","guided":"老师带做"}},"readings":{"B02-RW-U01:reading-1":{"title":"Rise of the MEGACITIES","pages":[{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38cfad1287c9044af2fde557fc2a34faff92c5e9585cbb1f6bf8cb0c1da83529.jpg","alt":"教材原配城市天际线","notes":["¹ urban (adj) relating to towns and cities"],"id":"1-2","body":"1  The number of megacities is growing very quickly. In the 1950s, there were only two megacities in the world.\n2  Today, 12% of the world’s urban¹ **population** lives in megacities. Studies show that there will be 8.5 billion people in the world in 2030. **Experts** say that there will be 40 megacities.","lead":"Megacity: a city with more than 10 million people","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"","photo":"","alt":"教材原配城市天际线","notes":[],"id":"3-4","body":"3  Today, more than 35 cities in the world are megacities. The majority are in Asia, South America and Africa. More and more people around the world are leaving their homes in the **countryside** and moving to the city.\n4  Many megacities have better **opportunities**, such as more jobs and a choice of schools and universities. Megacities are also exciting places to live – there are lots of different people, languages and restaurants, and there are many interesting things to do.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"","photo":"","alt":"教材原配城市天际线","notes":["² housing (n) places to live, such as apartments or houses"],"id":"5","body":"5  However, megacities have problems, too. The cities are very big and this can cause problems like **pollution** or poor housing²","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"Tokyo, Japan 37.4 MILLION","photo":"","alt":"教材原配城市天际线","notes":[],"id":"6","body":"6  Tokyo is an exciting, **modern** city in the east of Japan. There are lots of jobs because most big companies in Japan are in Tokyo. It is also an excellent place to study – 18% of Japan’s universities are in the city. However, Tokyo is very busy and the **traffic** is very bad. More than 7.5 million people use the Tokyo Metro every day.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"Delhi, India 29.4 MILLION","photo":"","alt":"教材原配城市天际线","notes":[],"id":"7","body":"7  Delhi is in the north of India. It has many beautiful monuments, interesting museums and modern restaurants. There is an exciting mix of different cultures in the city, and there are four official languages: Hindi, Urdu, Punjabi and English. However, there are not enough houses in some parts of Delhi. This means that many people live in large slums in the city.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"Cairo, Egypt 20.5 MILLION","photo":"","alt":"教材原配城市天际线","notes":[],"id":"8","body":"8  Cairo is the **capital** of Egypt and is the second-largest city in Africa. Cairo has important car and film industries. The city is the centre of many government offices and has many universities, one of which is over 1,200 years old.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"}]},"B02-RW-U01:reading-2":{"title":"Homestay Holidays","pages":[{"sourcePage":23,"title":"Homestay Holidays","body":"Homestays are becoming more and more popular, and people around the world are offering their homes as places to stay. Homestays offer **cheap** places to stay and the chance for guests to see the **area** like **local** people. They are very popular with students who want to stay in another country and learn a language. We asked three families who run homestays to tell us about where they live.","subtitle":"A HOME AWAY FROM HOME","photo":"","alt":"","notes":[],"id":"intro"},{"sourcePage":23,"title":"Stay in the mountains","body":"A  Our family home is in the north of Nepal, in the Himalayan Mountains, in the village of Manang. The village is small and very **quiet**. It is a very friendly place. The mountains are extremely beautiful. You can go for long walks and swim in the rivers, but there are no shops, cinemas or cafés.","subtitle":"The Atal family","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04927ddf3dfa484aeaa209d7da1496be43451fe753ed2754820f4b0583a26159.jpg","alt":"尼泊尔马南村","notes":[],"id":"A"},{"sourcePage":23,"title":"A house by the sea","body":"B  Our two-bedroom house is by the sea in the south-west of England. It is 15 minutes’ drive to the nearest village of Portreath. There are lots of beaches, rivers and forests, and it is very quiet. We spend a lot of time reading books, watching films and going for walks. Our area is great for sports like surfing, kayaking and mountain biking. However, the houses here are **expensive**, which can be a problem for local people. There are no buses or trains here, so it can be difficult to get around without a car.","subtitle":"Kate and Julian Foxton","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5c7d6ec017d9f5eb53be97b6cbf5daf3bb4ab6a229d4aacd37d2d5b2251d2112.jpg","alt":"Foxton 一家在海边的住所","notes":[],"id":"B"},{"sourcePage":23,"title":"City holiday","body":"C  Our home is near the historic city centre of Beirut, Lebanon, a large city in the Middle East. There are lots of cafés and restaurants, which are open late at night. We love it here because it’s so friendly and you can always find what you need. Lots of people come here to learn Arabic and French. There are also a lot of jobs and businesses here. However, it can be **noisy** at night and there is a lot of traffic during the day. The best thing about Beirut is the weather. It is nice all year round; it rains in the winter, but there is no snow.","subtitle":"Chafic and Asma Halwany","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1c5776e568cc947b86ad1e7117785b020664224bec7cfb898e400847e1d6d7e1.jpg","alt":"Halwany 一家","notes":[],"id":"C"}]}},"textbooks":{"2/RW":{"file":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","printedPages":{"14":12,"15":13,"16":14,"17":15,"18":16,"19":17,"20":18,"21":19,"22":20,"23":21,"24":22,"25":23,"26":24,"27":25,"28":26,"29":27,"30":28,"31":29,"32":30,"33":31,"34":32,"35":33}},"2/LS":{"file":"https:// age":20,"titleInImage":true}]},"stageSkill":true,"layout":"list","provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U01-classroom:resource:b3307","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":1,"module":"NOUNS AND ADJECTIVES","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/caf366e423dc2e17cefb18b2712937d7ea4691816f682200c2baa7968187508a.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"NOUNS AND ADJECTIVES","flow":{"kind":"resource","pages":["A noun refers to a person, place or thing: girl, teacher, city, bus, homestay\nAn adjective describes a noun: tall, historic, busy, slow, expensive\nnoun\tadjective\tadjective\tnoun\tnoun\nAbdullah\tlives in a\tbig,\tcrowded\tcity\twith his family."]}},{"id":"B02-RW-U01-classroom:resource:b3309","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":1,"module":"Adjectives","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/caf366e423dc2e17cefb18b2712937d7ea4691816f682200c2baa7968187508a.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"Adjectives","flow":{"kind":"resource","pages":["Adjectives describe nouns. Use the structure adjective + noun.\nadjective\t+ noun\nBeirut is an\tinteresting\tcity.\nThere are many\texcellent\trestaurants.\nAdjectives also come after the verb be.\nThe city is beautiful in the summer.\nAdjectives are never plural.\na different place → some differents places ✗ some different places ✓"]}},{"id":"B02-RW-U01-classroom:resource:b3312","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":1,"module":"Countable and uncountable nouns","pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01d07f58081e295748e72dd859d41f4e0b6881aa09f3ecc6250e9b4d2ca127ac.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"Countable and uncountable nouns","flow":{"kind":"resource","pages":["There are two kinds of nouns in English: countable (C) and uncountable (U).\nCountable (C) nouns are nouns that we can count. They can be singular or plural.\none house → two houses\nUncountable (U) nouns are nouns that we cannot count. Uncountable nouns often refer to food, liquids and ideas. Uncountable nouns only have a singular form.\ninformations × information ✓"]}},{"id":"B02-RW-U01-classroom:resource:b3315","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":1,"module":"Articles: a, an or zero article","pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01d07f58081e295748e72dd859d41f4e0b6881aa09f3ecc6250e9b4d2ca127ac.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"Articles: a, an or zero article","flow":{"kind":"resource","pages":["Use a or an before a singular countable noun.\na house\nUse a before a countable noun that starts with a consonant.\na café\nUse an before a countable noun that starts with a vowel (a, e, i, o, u).\nan area\nDo not use a or an before a plural countable noun or an uncountable noun.\nThis is the zero article.\nbuildings information"]}},{"id":"B02-RW-U01-classroom:resource:b3317","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":1,"module":"QUANTIFIERS","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/211a82755acd9548394c0b82e142f7cb86e9e5bddf2409f92fb9591a464008b9.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"QUANTIFIERS","flow":{"kind":"resource","pages":["Use a quantifier before a noun to describe the amount or number of something.\nSome restaurants are closed today.\nUse different quantifiers with countable and uncountable nouns.\n\u003ctable>\u003ctr>\u003ctd>quantifiers with countable nouns\u003c/td>\u003ctd>quantifiers with uncountable nouns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a lot of / lots of many some a few\u003c/td>\u003ctd>a lot of / lots of some a little\u003c/td>\u003c/tr>\u003c/table>\nIn negative sentences, use many with countable nouns and much with uncountable nouns.\nMy city doesn't have many tall buildings. My city doesn't have much traffic."]}},{"id":"B02-RW-U01-classroom:resource:b3288","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":2,"module":"Vocabulary for Ex 1","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9428f05133a7c7c4725bf26c8e714ed22965bf39238783fa95f8d8d8dc6712b2.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["area (n) a region or part of a larger place, like a country or city\ncheap (adj) not expensive, or costs less than usual\ncity centre (n) the main or central part of a city\nexpensive (adj) costs a lot of money; not cheap\nlocal (adj) relating to a particular area, city or town\nnoisy (adj) loud; makes a lot of noise\nquiet (adj) makes little or no noise"]}},{"id":"B02-RW-U01-classroom:reading-question:b3297","book":2,"unit":1,"topic":"PLACES","track":"RW","lesson":2,"module":"Homestay Holidays","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a54b1a05e825e3ffcfdfcd2ec235154e498319419b9e19340ba60c64f67c9954.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;

 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;

 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");

 classroomStage.connect(doc);
 updateReview();nav();resize();
}

function outside(el,bounds){

 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

   checked.push({

    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}

 },

 },

};
