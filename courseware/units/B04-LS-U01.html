to goods and services that are bought. Therefore, more and more films are being made there.","options":[],"type":"select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5798.i01","label":"1","prompt":"In order to get these tax credits, though, you do need to be a business permanently established in Canada.","options":[],"type":"select/open"},{"kind":"item","id":"b5798.i02","label":"2","prompt":"Since foreign films made in Mexico are considered exports, producers are free from having to pay certain types of tax, making Mexico an appealing location for filmmakers.","options":[],"type":"select/open"},{"kind":"item","id":"b5798.i03","label":"3","prompt":"Jordan helps producers avoid taxes, such as the VAT (Value Added Tax) that is added to goods and services that are bought. Therefore, more and more films are being made there.","options":[],"type":"select/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 In order to get these tax credits, though, you do need to\nbe a business permanently established in Canada.\n2 Since foreign films made in Mexico are considered\nexports, producers are free from having to pay certain\ntypes of tax, making Mexico an appealing location for\nfilmmakers.\n3 Jordan helps producers avoid taxes, such as the VAT\n(Value Added Tax) that is added to goods and services\nthat are bought. Therefore, more and more films are being\nmade there.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5799","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":37,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner and read the sentences in Exercise 7 again.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5799.i01","label":"1","prompt":"Which words or phrases are used to link causes and effects?","options":[],"type":"discuss/open"},{"id":"b5799.i02","label":"2","prompt":"Do you know any other similar words or phrases?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U01-question:b5798","kind":"material-reference","title":"LISTENING 2 Ex 7","pages":[27]}],"materials":[],"coursePages":[[{"kind":"item","id":"b5799.i01","label":"1","prompt":"Which words or phrases are used to link causes and effects?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5799.i02","label":"2","prompt":"Do you know any other similar words or phrases?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B04-LS-U01-publisher-sheet:b5798","title":"LISTENING 2 Ex 7 原题面","pages":[27],"text":"","screens":[],"sources":[{"page":27,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"}],"kind":"task_sheet","sourceBlockIds":["b5798"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 In order to, Since, Therefore\n2 See Model Answer Booklet p3 for an example answer.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5800","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":38,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Complete the sentences with your own ideas. Then compare with a partner.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5800.i01","label":"1","prompt":"The film industry is becoming more multinational. Due to this, ____.","options":[],"type":"gap/open"},{"id":"b5800.i02","label":"2","prompt":"The biggest films sell in a huge number of different markets. As a result, ____.","options":[],"type":"gap/open"},{"id":"b5800.i03","label":"3","prompt":"Films which can guarantee international sales can make huge profits. Consequently, ____.","options":[],"type":"gap/open"},{"id":"b5800.i04","label":"4","prompt":"Producing films overseas earns profits for both countries, which therefore ____.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5800.i01","label":"1","prompt":"The film industry is becoming more multinational. Due to this, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b5800.i02","label":"2","prompt":"The biggest films sell in a huge number of different markets. As a result, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b5800.i03","label":"3","prompt":"Films which can guarantee international sales can make huge profits. Consequently, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b5800.i04","label":"4","prompt":"Producing films overseas earns profits for both countries, which therefore ____.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The film industry is becoming more\nmultinational. Due to this, job\nopportunities in filmmaking are opening\nup in countries where they were\npreviously unavailable.\n2 The biggest films sell in a huge number\nof different markets. As a result, the\nproducers have to ensure that they are\nedited in a culturally sensitive way.\n3 Films which can guarantee international\nsales can make huge profits.\nConsequently, making films with global\nappeal is a very desirable thing for the\nfilm industry.\n4 Producing films overseas earns profits\nfor both countries, which therefore\nmakes it a win-win situation for\nall involved.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5802","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":39,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Describe a film that you have enjoyed. Discuss these ideas, as well as your own.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5802.i01","label":"1","prompt":"Where is the film set?","options":[],"type":"discuss/open"},{"id":"b5802.i02","label":"2","prompt":"Do you think the film was made there or somewhere else? Why do you think so?","options":[],"type":"discuss/open"},{"id":"b5802.i03","label":"3","prompt":"Do you think it has international appeal? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5802.i01","label":"1","prompt":"Where is the film set?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5802.i02","label":"2","prompt":"Do you think the film was made there or somewhere else? Why do you think so?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5802.i03","label":"3","prompt":"Do you think it has international appeal? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 One of my favourite films is Don’t Look\nUp, which was set in the US. I remember\nthe story taking place in the US capital,\nWashington, DC, as well as other city\nlocations in the US.\n2 I never suspected that the film wasn’t\nmade in the US. But it could easily\nhave been shot in a Canadian city for\ncost reasons.\n3 It was shown on a popular international\nstreaming service, so I think a lot of\npeople around the world must have\nseen it. It also had a very global theme\n(it affected all of humanity), so the story\nwasn’t specifically about the US.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5803","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":40,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to discuss the following questions.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5803.i01","label":"1","prompt":"What are the possible disadvantages of filmmakers travelling long distances to make cheaper films? How are these disadvantages similar to the way the food industry works?","options":[],"type":"discuss/open"},{"id":"b5803.i02","label":"2","prompt":"What possible benefits to the viewer are there if a Hollywood film is made more cheaply in, for example, Canada than in the US? Are the benefits similar to those for consumers when food is produced cheaply?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5803.i01","label":"1","prompt":"What are the possible disadvantages of filmmakers travelling long distances to make cheaper films? How are these disadvantages similar to the way the food industry works?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5803.i02","label":"2","prompt":"What possible benefits to the viewer are there if a Hollywood film is made more cheaply in, for example, Canada than in the US? Are the benefits similar to those for consumers when food is produced cheaply?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Possible disadvantages: travelling with\nlarge film crews could negatively impact\nthe environment (which is similar to the\nfood industry shipping produce across\nthe world); shooting abroad means\na lack of work opportunities in the\noriginal country.\n2 Possible benefits: any savings might\nmean that more money can be spent\non hiring bigger-name actors or making\nbetter special effects, which audiences\ncan certainly enjoy. This is somewhat\nsimilar to the food industry, in that food\ngrown more cheaply abroad (because\nlabour is cheaper, for example) can\nresult in cheaper food being available\nin supermarkets.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5807","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":41,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Look at the pie chart. Answer the questions. Look at the pie chart and answer the questions.","pages":[28],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1777ebe5f9836f23df5c57ce8b49cbcbe0c41e54c397ec989164f17e8164627.png"],"provided":"The price of a banana: who gets what?\n¹ plantation (n) a large farm on which a particular crop is grown\n² ripening (n) (of fruit or vegetables) becoming mature and ready to eat\n³ distribution (n) the act of spreading or supplying something\n1 What does each section of the chart represent? How many different activities are presented?\n2 Which information in the pie chart do you find most surprising? Tell a partner why.\n3 If the government reduced taxes on bananas to 10%, what would happen to the other percentages in the chart? What about if supermarkets demanded a higher share of income?","items":[{"id":"b5808.i01","label":"1","prompt":"What does each section of the chart represent? How many different activities are presented?","options":[],"type":"qa/open"},{"id":"b5808.i02","label":"2","prompt":"Which information in the pie chart do you find most surprising? Tell a partner why.","options":[],"type":"qa/open"},{"id":"b5808.i03","label":"3","prompt":"If the government reduced taxes on bananas to 10%, what would happen to the other percentages in the chart? What about if supermarkets demanded a higher share of income?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"The price of a banana: who gets what?"},{"kind":"text","text":"¹ plantation (n) a large farm on which a particular crop is grown"},{"kind":"text","text":"² ripening (n) (of fruit or vegetables) becoming mature and ready to eat"},{"kind":"text","text":"³ distribution (n) the act of spreading or supplying something"},{"kind":"text","text":"1 What does each section of the chart represent? How many different activities are presented?"}],[{"kind":"text","text":"2 Which information in the pie chart do you find most surprising? Tell a partner why."},{"kind":"text","text":"3 If the government reduced taxes on bananas to 10%, what would happen to the other percentages in the chart? What about if supermarkets demanded a higher share of income?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 The percentage of the selling price of a banana linked to\neach factor involved in the process of producing it. There\nare nine activities or steps in the process.\n2 See Model Answer Booklet p3 for example answers.\n3 If the government reduced taxes, the other percentages\nwould increase. If supermarkets demanded a higher share,\nthe other percentages would decrease.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[{"page":28,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1777ebe5f9836f23df5c57ce8b49cbcbe0c41e54c397ec989164f17e8164627.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5810","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":42,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"Does the data in the pie chart support or oppose the following statements? Write S (support) or O (oppose).","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5ac8019606bff6a01e704f94a6eaf0b09faf820989993b2325d89e0f971fa807.png"],"provided":"","items":[{"id":"b5810.i01","label":"1","prompt":"The cost of transporting bananas from the plantation to the supermarket accounts for the largest share of the price.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"id":"b5810.i02","label":"2","prompt":"The international transport and export costs together are the same as the money paid in taxes.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"id":"b5810.i03","label":"3","prompt":"The ripening process accounts for a much bigger share of the price of bananas than the growing process.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"id":"b5810.i04","label":"4","prompt":"Taxes contribute the smallest amount to the price of bananas.","options":["S (support)","O (oppose)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5810.i01","label":"1","prompt":"The cost of transporting bananas from the plantation to the supermarket accounts for the largest share of the price.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"kind":"item","id":"b5810.i02","label":"2","prompt":"The international transport and export costs together are the same as the money paid in taxes.","options":["S (support)","O (oppose)"],"type":"choice/closed"}],[{"kind":"item","id":"b5810.i03","label":"3","prompt":"The ripening process accounts for a much bigger share of the price of bananas than the growing process.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"kind":"item","id":"b5810.i04","label":"4","prompt":"Taxes contribute the smallest amount to the price of bananas.","options":["S (support)","O (oppose)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 O 2 S 3 O 4 O","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5811","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":43,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"Work with a partner and answer the questions.","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5ac8019606bff6a01e704f94a6eaf0b09faf820989993b2325d89e0f971fa807.png"],"provided":"","items":[{"id":"b5811.i01","label":"1","prompt":"Why is so much of the price of bananas made up of supermarket costs? Does the figure seem reasonable to you?","options":[],"type":"discuss/open"},{"id":"b5811.i02","label":"2","prompt":"Why is the cost of growing bananas such a small component of the overall cost?","options":[],"type":"discuss/open"},{"id":"b5811.i03","label":"3","prompt":"Why do plantation owners receive much more than the workers? Do you think this is fair?","options":[],"type":"discuss/open"},{"id":"b5811.i04","label":"4","prompt":"What effect would doubling the amount of money plantation workers receive have on the overall price of bananas? If this happened, do you think there would be any other effects?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5811.i01","label":"1","prompt":"Why is so much of the price of bananas made up of supermarket costs? Does the figure seem reasonable to you?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5811.i02","label":"2","prompt":"Why is the cost of growing bananas such a small component of the overall cost?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5811.i03","label":"3","prompt":"Why do plantation owners receive much more than the workers? Do you think this is fair?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5811.i04","label":"4","prompt":"What effect would doubling the amount of money plantation workers receive have on the overall price of bananas? If this happened, do you think there would be any other effects?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Because of the cost of storing the\nbananas, advertising, paying workers\nand other overheads. It does seem\nreasonable to me but I feel that this\namount should be slightly lower so that\nmore money can go to the people who\ngrow the bananas.\n2 Because the workers are paid very little.\n3 Plantation owners have to pay for the\nland and growing supplies, and workers\ndo not. The owners also have to take on\nmore responsibility. I think it’s fair that\nthey should receive a bit more than the\nworkers, but not as much as they do.\n4 The overall price would increase. Other\ncosts would also increase.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5813","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":44,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"In this unit's speaking task, you are going to give a presentation agreeing or disagreeing with one of the statements below. Read the statements. With a partner, say if you agree or disagree with them. Write notes explaining why.","pages":[30],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9e10db31f60a86101b43f1481a9f9d105ddac2ce3c0a05ff92af7a3d0a548c.png"],"provided":"1 Food producers and exporters should be responsible for helping workers in developing countries get a fair deal.\n2 Governments in importing countries should take the lead in sharing their income from the food trade with workers in developing countries.\n3 Consumers should put pressure on supermarkets and distributors to do more for workers in developing countries.","items":[{"id":"b5813.i01","label":"1","prompt":"Food producers and exporters should be responsible for helping workers in developing countries get a fair deal.","options":[],"type":"discuss/open"},{"id":"b5813.i02","label":"2","prompt":"Governments in importing countries should take the lead in sharing their income from the food trade with workers in developing countries.","options":[],"type":"discuss/open"},{"id":"b5813.i03","label":"3","prompt":"Consumers should put pressure on supermarkets and distributors to do more for workers in developing countries.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Food producers and exporters should be responsible for helping workers in developing countries get a fair deal."},{"kind":"text","text":"2 Governments in importing countries should take the lead in sharing their income from the food trade with workers in developing countries."},{"kind":"text","text":"3 Consumers should put pressure on supermarkets and distributors to do more for workers in developing countries."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I agree. Food producers and exporters\nbenefit from the labour of workers\nin developing countries, so they\nshould ensure those workers are fairly\ncompensated and treated ethically.\nThis can help reduce exploitation and\npromote fair trade practices.\n2 I disagree. While governments\nin importing countries can create\npolicies that support fair trade, it’s\nnot necessarily their responsibility to\nshare income directly with workers in\ndeveloping countries. They should\ninstead focus on trade agreements\nand regulations that promote fairness\nand sustainability.\n3 I agree. Consumers have the power\nto influence business practices.\nBy demanding more ethically\nproduced products, they can pressure\nsupermarkets and distributors to ensure\nbetter conditions and fair wages for\nworkers in developing countries.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5814","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":45,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"Choose one of the statements in Exercise 4. Answer the questions about your statement.","pages":[30],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9e10db31f60a86101b43f1481a9f9d105ddac2ce3c0a05ff92af7a3d0a548c.png"],"provided":"1 What data in the pie chart on page 28 can you use to support your argument?\n2 What data in the pie chart contradicts your view? What can you do to minimize this problem?\n3 Do you need any other information to support your argument? Where could you find this?","items":[{"id":"b5814.i01","label":"1","prompt":"What data in the pie chart on page 28 can you use to support your argument?","options":[],"type":"qa/open"},{"id":"b5814.i02","label":"2","prompt":"What data in the pie chart contradicts your view? What can you do to minimize this problem?","options":[],"type":"qa/open"},{"id":"b5814.i03","label":"3","prompt":"Do you need any other information to support your argument? Where could you find this?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B04-LS-U01-question:b5813","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[30]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 What data in the pie chart on page 28 can you use to support your argument?"},{"kind":"text","text":"2 What data in the pie chart contradicts your view? What can you do to minimize this problem?"},{"kind":"text","text":"3 Do you need any other information to support your argument? Where could you find this?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Statement 1\n1 The fact that plantation workers receive\nonly 2% of the price paid by consumers\nsupports the argument. This tiny\npercentage highlights the need for\nfood producers and exporters to take\nresponsibility in ensuring that workers in\ndeveloping countries are compensated\nfairly for their labor.\n2 The 9% that goes to the plantation\nowner could be seen as contradicting\nthe argument, suggesting that some\nshare of the revenue stays within the\nproduction side in developing countries.\nTo minimize this problem, you could\nargue that despite the plantation owner\nreceiving a larger portion, it doesn’t\nguarantee that the workers are being\npaid fairly, and better regulations or\noversight by producers/exporters could\nensure that more of this income reaches\nthe workers directly.\n3 Additional information would be\nhelpful, such as: The average wages of\nplantation workers compared to living\nwages in the region; The distribution of\nprofit margins within the supply chain;\nFair trade policies or existing practices\nby food producers/exporters. This\ninformation could be found through\nreports from fair trade organizations,\nresearch papers on global food supply\nchains, and organizations that promote\nthe rights of agricultural workers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5816","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":46,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner. How much is a cup of coffee in a café in your country? What do you think is the difference between how much it is and how much it really costs to produce?","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7688726e0c7a79e03bc7691d0bcf12132c0f9fdc25ace703c8c759703e1cd3da.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A cup of coffee in my country is quite\nexpensive these days. For the price of a\nfew coffees in a café, I could probably pay\nfor a whole bag of coffee to make 30 cups\nat home. There’s a big difference between\nthe cost of the actual coffee I buy, and how\nmuch it’s really worth. But I suppose I’m\nalso paying to sit in the café, use its cups,\npay for the staff and so on.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github. al thinking","text":"Analyze and use data in pie charts; use data to support an argument."},{"label":"Grammar","text":"Use modals of present and past probability."},{"label":"Speaking skills","text":"Present data; describe a pie chart; draw conclusions from data."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":14,"alt":""}}]}},{"id":"B04-LS-U01-classroom:resource:b5734","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/acfb8cab47f7f6890bf83555616e0a7e3a65fda740400488786266590f6ad7ca.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"barrier","pos":"(n)","definition":"something that prevents something else from happening or makes it more difficult","example":"High fees can be a barrier to education.","wordAudio":"barrier","cardWord":false},{"term":"cost of living","pos":"(n phr)","definition":"the amount of money a person needs to live","example":"The cost of living in the city has risen.","wordAudio":"cost of living","cardWord":false},{"term":"customs procedures","pos":"(n phr)","definition":"official actions deciding what products can or can not enter or leave a country","example":"We had to learn the customs procedures before shipping the goods.","wordAudio":"customs procedures","cardWord":false},{"term":"food security","pos":"(n phr)","definition":"the fact that a place is able to make or get enough food to feed its people","example":"Growing more crops locally can improve food security.","wordAudio":"food security","cardWord":false},{"term":"red tape","pos":"(n phr)","definition":"official rules that seem unnecessary and make things harder or slower","example":"The business was delayed by months of red tape.","wordAudio":"red tape","cardWord":false},{"term":"reform","pos":"(v)","definition":"to improve a law or system, making it more modern or effective","example":"The council plans to reform the way it allocates housing.","wordAudio":"reform","cardWord":false}]]}},{"id":"B04-LS-U01-classroom:video","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/064a4d9446c40ff2e2f07de50d3de12818754f2edd98c8aef239ded4e292492c.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/8099ec6aa15934adc4d326f5-L4LS-U01.mp4","captions":[{"start":0,"end":7.58,"text":"Trade between nations has been a part of human\nexistence for thousands of years."},{"start":10.14,"end":18.28,"text":"Today's economists say that annual global trade may be\nworth up to $100 trillion by 2050."},{"start":21.16,"end":26.82,"text":"Being a member of the World Trade Organization can\nimprove a country's economic prospects."},{"start":27.96,"end":31.68,"text":"Out of 195 nations in the world,"},{"start":32.36,"end":35.98,"text":"164 nations are WTO members."},{"start":37.12,"end":40.72,"text":"Membership makes trade with other member nations\neasier."},{"start":43.54,"end":52.74,"text":"The WTO member nations work together to agree on the\nrules of free trade and to apply these fairly across\nthe world."},{"start":52.74,"end":55.1,"text":"This is a difficult task,"},{"start":55.5,"end":60.96,"text":"as the rules need to account for differences in how\ndeveloped each country is."},{"start":63.22,"end":69.52,"text":"One main aim of the WTO is to raise standards of living\nfor people around the world."},{"start":70.56,"end":73.58,"text":"With barriers to international trade removed,"},{"start":74.12,"end":76.18,"text":"food security can be improved."},{"start":76.18,"end":82.33,"text":"Importing food can make countries less dependent on\nsuccessful harvests."},{"start":84.3,"end":88.12,"text":"Consumers gain greater access to imported goods and\nservices,"},{"start":88.74,"end":93.28,"text":"so they have more choice over what to buy and pay\ncheaper prices."},{"start":93.62,"end":95.64,"text":"This lowers the cost of living."},{"start":97.72,"end":99.92,"text":"The world of business also benefits."},{"start":100.74000000000001,"end":103.03999999999999,"text":"Thanks to WTO rules,"},{"start":103.47999999999999,"end":106.94,"text":"corporations are able to operate more freely across\nborders."},{"start":107.92,"end":109.86,"text":"They encounter less red tape,"},{"start":110.2,"end":113.2,"text":"fewer trade costs, and simpler customs procedures."},{"start":114.44,"end":121.22,"text":"In theory, the result of this free growth in commerce\nand industry is that more jobs will be created."},{"start":122.04,"end":125.46,"text":"This in turn meets another of the WTO's goals,"},{"start":125.98,"end":127.9,"text":"full employment around the world."},{"start":129.92,"end":134.86,"text":"The WTO also helps smaller businesses to trade\ninternationally."},{"start":136.12,"end":136.54,"text":"Meanwhile,"},{"start":136.96,"end":141.64,"text":"WTO members continue to work on reforming agricultural\ntrade rules,"},{"start":142.02,"end":146.72,"text":"so that farmers in less economically developed\ncountries receive higher,"},{"start":147.07999999999998,"end":148.7,"text":"fairer prices for their produce."},{"start":151.66,"end":152.42000000000002,"text":"In the future,"},{"start":153.2,"end":155.92000000000002,"text":"international trade will undoubtedly face challenges,"},{"start":156.22,"end":159.32,"text":"particularly those created by new technologies."},{"start":159.92000000000002,"end":165.46,"text":"But the WTO members will continue to adapt to the\nchanging global economy,"},{"start":165.94,"end":168.78,"text":"as nations have done since trade rules began."}],"launchInline":true}},{"id":"B04-LS-U01-classroom:resource:b5790","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/18508bf894b7a9f4cf01773fa8a83594604d44710c866d7ed01616d9676b638f.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"4","pages":[[{"term":"incentive","pos":"(n)","definition":"something that encourages a person to do something","example":"The discount gives people an incentive to take the bus.","wordAudio":"incentive","cardWord":false},{"term":"permit","pos":"(n)","definition":"an official document that allows you to do something","example":"You need a permit to sell food in the park.","wordAudio":"permit","cardWord":false},{"term":"rebate","pos":"(n)","definition":"money that is returned to you by the government after you have paid tax","example":"She received a tax rebate after paying too much tax last year.","wordAudio":"rebate","cardWord":false}]]}},{"id":"B04-LS-U01-classroom:review-1","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58bdf8029e imming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evidence: nurse in a big hospital","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"ro ricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-LS-U01":{"aspect":1.7777778,"cues":[[0,7.58,"Trade between nations has been a part of human existence for thousands of years.","几千年来，国与国之间的贸易一直是人类生存的一部分。"],[10.14,18.28,"Today's economists say that annual global trade may be worth up to $100 trillion by 2050.","今天的经济学家说，到2050年，每年的全球贸易可能高达100万亿美元。"],[21.16,26.82,"Being a member of the World Trade Organization can improve a country's economic prospects.","作为世界贸易组织的成员，可以改善一个国家的经济前景。"],[27.96,31.68,"Out of 195 nations in the world,","在世界上195个国家中，"],[32.36,35.98,"164 nations are WTO members.","164个国家是世贸组织成员。"],[37.12,40.72,"Membership makes trade with other member nations easier.","加入《公约》使与其他成员国的贸易更加容易。"],[43.54,52.74,"The WTO member nations work together to agree on the rules of free trade and to apply these fairly across the world.","世贸组织成员国共同努力，商定自由贸易规则，并在全世界公平适用这些规则。"],[52.74,55.1,"This is a difficult task,","这是一个困难的任务，"],[55.5,60.96,"as the rules need to account for differences in how developed each country is.","由于规则需要考虑到每个国家在发展程度上的差异。"],[63.22,69.52,"One main aim of the WTO is to raise standards of living for people around the world.","世贸组织的一个主要目标是提高全世界人民的生活水平。"],[70.56,73.58,"With barriers to international trade removed,","随着国际贸易壁垒的消除，"],[74.12,76.18,"food security can be improved.","粮食安全可以改善。"],[76.18,82.33,"Importing food can make countries less dependent on successful harvests.","进口粮食可使各国减少对成功收获的依赖。"],[84.3,88.12,"Consumers gain greater access to imported goods and services,","消费者获得更多的进口货物和服务，"],[88.74,93.28,"so they have more choice over what to buy and pay cheaper prices.","因此，他们在购买什么以及以什么价格购买方面有更多选择。"],[93.62,95.64,"This lowers the cost of living.","这降低了生活费用。"],[97.72,99.92,"The world of business also benefits.","商业世界也受益匪浅。"],[100.74000000000001,103.03999999999999,"Thanks to WTO rules,","由于世贸组织的规则，"],[103.47999999999999,106.94,"corporations are able to operate more freely across borders.","公司能够更加自由地跨界经营。"],[107.92,109.86,"They encounter less red tape,","他们遇到的繁文缛节更少，"],[110.2,113.2,"fewer trade costs, and simpler customs procedures.","减少贸易成本，简化海关手续。"],[114.44,121.22,"In theory, the result of this free growth in commerce and industry is that more jobs will be created.","从理论上讲，商业和工业的这种自由增长的结果是，将创造更多的就业机会。"],[122.04,125.46,"This in turn meets another of the WTO's goals,","这又符合世贸组织的另一项目标，"],[125.98,127.9,"full employment around the world.","在全世界实现充分就业。"],[129.92,134.86,"The WTO also helps smaller businesses to trade internationally.","世贸组织还帮助小企业进行国际贸易。"],[136.12,136.54,"Meanwhile,","同时，"],[136.96,141.64,"WTO members continue to work on reforming agricultural trade rules,","世贸组织成员继续努力改革农业贸易规则，"],[142.02,146.72,"so that farmers in less economically developed countries receive higher,","使经济欠发达国家的农民得到更高的收入，"],[147.07999999999998,148.7,"fairer prices for their produce.","更公平的农产品价格。"],[151.66,152.42000000000002,"In the future,","将来，"],[153.2,155.92000000000002,"international trade will undoubtedly face challenges,","国际贸易无疑将面临挑战，"],[156.22,159.32,"particularly those created by new technologies.","特别是新技术创造的新技术。"],[159.92000000000002,165.46,"But the WTO members will continue to adapt to the changing global economy,","但世贸组织成员将继续适应不断变化的全球经济，"],[165.94,168.78,"as nations have done since trade rules began.","正如各国自贸易规则开始以来所做的那样。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B0 function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
