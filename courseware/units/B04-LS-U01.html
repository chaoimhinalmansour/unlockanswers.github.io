to goods and services that are bought. Therefore, more and more films are being made there.","options":[],"type":"select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5798.i01","label":"1","prompt":"In order to get these tax credits, though, you do need to be a business permanently established in Canada.","options":[],"type":"select/open"},{"kind":"item","id":"b5798.i02","label":"2","prompt":"Since foreign films made in Mexico are considered exports, producers are free from having to pay certain types of tax, making Mexico an appealing location for filmmakers.","options":[],"type":"select/open"},{"kind":"item","id":"b5798.i03","label":"3","prompt":"Jordan helps producers avoid taxes, such as the VAT (Value Added Tax) that is added to goods and services that are bought. Therefore, more and more films are being made there.","options":[],"type":"select/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 In order to get these tax credits, though, you do need to\nbe a business permanently established in Canada.\n2 Since foreign films made in Mexico are considered\nexports, producers are free from having to pay certain\ntypes of tax, making Mexico an appealing location for\nfilmmakers.\n3 Jordan helps producers avoid taxes, such as the VAT\n(Value Added Tax) that is added to goods and services\nthat are bought. Therefore, more and more films are being\nmade there.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5799","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":37,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner and read the sentences in Exercise 7 again.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5799.i01","label":"1","prompt":"Which words or phrases are used to link causes and effects?","options":[],"type":"discuss/open"},{"id":"b5799.i02","label":"2","prompt":"Do you know any other similar words or phrases?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U01-question:b5798","kind":"material-reference","title":"LISTENING 2 Ex 7","pages":[27]}],"materials":[],"coursePages":[[{"kind":"item","id":"b5799.i01","label":"1","prompt":"Which words or phrases are used to link causes and effects?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5799.i02","label":"2","prompt":"Do you know any other similar words or phrases?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B04-LS-U01-publisher-sheet:b5798","title":"LISTENING 2 Ex 7 原题面","pages":[27],"text":"","screens":[],"sources":[{"page":27,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"}],"kind":"task_sheet","sourceBlockIds":["b5798"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 In order to, Since, Therefore\n2 See Model Answer Booklet p3 for an example answer.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5800","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":38,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Complete the sentences with your own ideas. Then compare with a partner.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5800.i01","label":"1","prompt":"The film industry is becoming more multinational. Due to this, ____.","options":[],"type":"gap/open"},{"id":"b5800.i02","label":"2","prompt":"The biggest films sell in a huge number of different markets. As a result, ____.","options":[],"type":"gap/open"},{"id":"b5800.i03","label":"3","prompt":"Films which can guarantee international sales can make huge profits. Consequently, ____.","options":[],"type":"gap/open"},{"id":"b5800.i04","label":"4","prompt":"Producing films overseas earns profits for both countries, which therefore ____.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5800.i01","label":"1","prompt":"The film industry is becoming more multinational. Due to this, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b5800.i02","label":"2","prompt":"The biggest films sell in a huge number of different markets. As a result, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b5800.i03","label":"3","prompt":"Films which can guarantee international sales can make huge profits. Consequently, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b5800.i04","label":"4","prompt":"Producing films overseas earns profits for both countries, which therefore ____.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The film industry is becoming more\nmultinational. Due to this, job\nopportunities in filmmaking are opening\nup in countries where they were\npreviously unavailable.\n2 The biggest films sell in a huge number\nof different markets. As a result, the\nproducers have to ensure that they are\nedited in a culturally sensitive way.\n3 Films which can guarantee international\nsales can make huge profits.\nConsequently, making films with global\nappeal is a very desirable thing for the\nfilm industry.\n4 Producing films overseas earns profits\nfor both countries, which therefore\nmakes it a win-win situation for\nall involved.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5802","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":39,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Describe a film that you have enjoyed. Discuss these ideas, as well as your own.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5802.i01","label":"1","prompt":"Where is the film set?","options":[],"type":"discuss/open"},{"id":"b5802.i02","label":"2","prompt":"Do you think the film was made there or somewhere else? Why do you think so?","options":[],"type":"discuss/open"},{"id":"b5802.i03","label":"3","prompt":"Do you think it has international appeal? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5802.i01","label":"1","prompt":"Where is the film set?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5802.i02","label":"2","prompt":"Do you think the film was made there or somewhere else? Why do you think so?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5802.i03","label":"3","prompt":"Do you think it has international appeal? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 One of my favourite films is Don’t Look\nUp, which was set in the US. I remember\nthe story taking place in the US capital,\nWashington, DC, as well as other city\nlocations in the US.\n2 I never suspected that the film wasn’t\nmade in the US. But it could easily\nhave been shot in a Canadian city for\ncost reasons.\n3 It was shown on a popular international\nstreaming service, so I think a lot of\npeople around the world must have\nseen it. It also had a very global theme\n(it affected all of humanity), so the story\nwasn’t specifically about the US.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5803","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":40,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to discuss the following questions.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae3ba7e24b76ea14f00796ffd1e1082119c7357d5fe7ce419d4a02519ed80db3.png"],"provided":"","items":[{"id":"b5803.i01","label":"1","prompt":"What are the possible disadvantages of filmmakers travelling long distances to make cheaper films? How are these disadvantages similar to the way the food industry works?","options":[],"type":"discuss/open"},{"id":"b5803.i02","label":"2","prompt":"What possible benefits to the viewer are there if a Hollywood film is made more cheaply in, for example, Canada than in the US? Are the benefits similar to those for consumers when food is produced cheaply?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5803.i01","label":"1","prompt":"What are the possible disadvantages of filmmakers travelling long distances to make cheaper films? How are these disadvantages similar to the way the food industry works?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5803.i02","label":"2","prompt":"What possible benefits to the viewer are there if a Hollywood film is made more cheaply in, for example, Canada than in the US? Are the benefits similar to those for consumers when food is produced cheaply?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Possible disadvantages: travelling with\nlarge film crews could negatively impact\nthe environment (which is similar to the\nfood industry shipping produce across\nthe world); shooting abroad means\na lack of work opportunities in the\noriginal country.\n2 Possible benefits: any savings might\nmean that more money can be spent\non hiring bigger-name actors or making\nbetter special effects, which audiences\ncan certainly enjoy. This is somewhat\nsimilar to the food industry, in that food\ngrown more cheaply abroad (because\nlabour is cheaper, for example) can\nresult in cheaper food being available\nin supermarkets.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5807","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":41,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Look at the pie chart. Answer the questions. Look at the pie chart and answer the questions.","pages":[28],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1777ebe5f9836f23df5c57ce8b49cbcbe0c41e54c397ec989164f17e8164627.png"],"provided":"The price of a banana: who gets what?\n¹ plantation (n) a large farm on which a particular crop is grown\n² ripening (n) (of fruit or vegetables) becoming mature and ready to eat\n³ distribution (n) the act of spreading or supplying something\n1 What does each section of the chart represent? How many different activities are presented?\n2 Which information in the pie chart do you find most surprising? Tell a partner why.\n3 If the government reduced taxes on bananas to 10%, what would happen to the other percentages in the chart? What about if supermarkets demanded a higher share of income?","items":[{"id":"b5808.i01","label":"1","prompt":"What does each section of the chart represent? How many different activities are presented?","options":[],"type":"qa/open"},{"id":"b5808.i02","label":"2","prompt":"Which information in the pie chart do you find most surprising? Tell a partner why.","options":[],"type":"qa/open"},{"id":"b5808.i03","label":"3","prompt":"If the government reduced taxes on bananas to 10%, what would happen to the other percentages in the chart? What about if supermarkets demanded a higher share of income?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"The price of a banana: who gets what?"},{"kind":"text","text":"¹ plantation (n) a large farm on which a particular crop is grown"},{"kind":"text","text":"² ripening (n) (of fruit or vegetables) becoming mature and ready to eat"},{"kind":"text","text":"³ distribution (n) the act of spreading or supplying something"},{"kind":"text","text":"1 What does each section of the chart represent? How many different activities are presented?"}],[{"kind":"text","text":"2 Which information in the pie chart do you find most surprising? Tell a partner why."},{"kind":"text","text":"3 If the government reduced taxes on bananas to 10%, what would happen to the other percentages in the chart? What about if supermarkets demanded a higher share of income?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 The percentage of the selling price of a banana linked to\neach factor involved in the process of producing it. There\nare nine activities or steps in the process.\n2 See Model Answer Booklet p3 for example answers.\n3 If the government reduced taxes, the other percentages\nwould increase. If supermarkets demanded a higher share,\nthe other percentages would decrease.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[{"page":28,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1777ebe5f9836f23df5c57ce8b49cbcbe0c41e54c397ec989164f17e8164627.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5810","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":42,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"Does the data in the pie chart support or oppose the following statements? Write S (support) or O (oppose).","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5ac8019606bff6a01e704f94a6eaf0b09faf820989993b2325d89e0f971fa807.png"],"provided":"","items":[{"id":"b5810.i01","label":"1","prompt":"The cost of transporting bananas from the plantation to the supermarket accounts for the largest share of the price.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"id":"b5810.i02","label":"2","prompt":"The international transport and export costs together are the same as the money paid in taxes.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"id":"b5810.i03","label":"3","prompt":"The ripening process accounts for a much bigger share of the price of bananas than the growing process.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"id":"b5810.i04","label":"4","prompt":"Taxes contribute the smallest amount to the price of bananas.","options":["S (support)","O (oppose)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5810.i01","label":"1","prompt":"The cost of transporting bananas from the plantation to the supermarket accounts for the largest share of the price.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"kind":"item","id":"b5810.i02","label":"2","prompt":"The international transport and export costs together are the same as the money paid in taxes.","options":["S (support)","O (oppose)"],"type":"choice/closed"}],[{"kind":"item","id":"b5810.i03","label":"3","prompt":"The ripening process accounts for a much bigger share of the price of bananas than the growing process.","options":["S (support)","O (oppose)"],"type":"choice/closed"},{"kind":"item","id":"b5810.i04","label":"4","prompt":"Taxes contribute the smallest amount to the price of bananas.","options":["S (support)","O (oppose)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 O 2 S 3 O 4 O","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5811","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":43,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"Work with a partner and answer the questions.","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5ac8019606bff6a01e704f94a6eaf0b09faf820989993b2325d89e0f971fa807.png"],"provided":"","items":[{"id":"b5811.i01","label":"1","prompt":"Why is so much of the price of bananas made up of supermarket costs? Does the figure seem reasonable to you?","options":[],"type":"discuss/open"},{"id":"b5811.i02","label":"2","prompt":"Why is the cost of growing bananas such a small component of the overall cost?","options":[],"type":"discuss/open"},{"id":"b5811.i03","label":"3","prompt":"Why do plantation owners receive much more than the workers? Do you think this is fair?","options":[],"type":"discuss/open"},{"id":"b5811.i04","label":"4","prompt":"What effect would doubling the amount of money plantation workers receive have on the overall price of bananas? If this happened, do you think there would be any other effects?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5811.i01","label":"1","prompt":"Why is so much of the price of bananas made up of supermarket costs? Does the figure seem reasonable to you?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5811.i02","label":"2","prompt":"Why is the cost of growing bananas such a small component of the overall cost?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5811.i03","label":"3","prompt":"Why do plantation owners receive much more than the workers? Do you think this is fair?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5811.i04","label":"4","prompt":"What effect would doubling the amount of money plantation workers receive have on the overall price of bananas? If this happened, do you think there would be any other effects?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Because of the cost of storing the\nbananas, advertising, paying workers\nand other overheads. It does seem\nreasonable to me but I feel that this\namount should be slightly lower so that\nmore money can go to the people who\ngrow the bananas.\n2 Because the workers are paid very little.\n3 Plantation owners have to pay for the\nland and growing supplies, and workers\ndo not. The owners also have to take on\nmore responsibility. I think it’s fair that\nthey should receive a bit more than the\nworkers, but not as much as they do.\n4 The overall price would increase. Other\ncosts would also increase.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5813","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":44,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"In this unit's speaking task, you are going to give a presentation agreeing or disagreeing with one of the statements below. Read the statements. With a partner, say if you agree or disagree with them. Write notes explaining why.","pages":[30],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9e10db31f60a86101b43f1481a9f9d105ddac2ce3c0a05ff92af7a3d0a548c.png"],"provided":"1 Food producers and exporters should be responsible for helping workers in developing countries get a fair deal.\n2 Governments in importing countries should take the lead in sharing their income from the food trade with workers in developing countries.\n3 Consumers should put pressure on supermarkets and distributors to do more for workers in developing countries.","items":[{"id":"b5813.i01","label":"1","prompt":"Food producers and exporters should be responsible for helping workers in developing countries get a fair deal.","options":[],"type":"discuss/open"},{"id":"b5813.i02","label":"2","prompt":"Governments in importing countries should take the lead in sharing their income from the food trade with workers in developing countries.","options":[],"type":"discuss/open"},{"id":"b5813.i03","label":"3","prompt":"Consumers should put pressure on supermarkets and distributors to do more for workers in developing countries.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Food producers and exporters should be responsible for helping workers in developing countries get a fair deal."},{"kind":"text","text":"2 Governments in importing countries should take the lead in sharing their income from the food trade with workers in developing countries."},{"kind":"text","text":"3 Consumers should put pressure on supermarkets and distributors to do more for workers in developing countries."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I agree. Food producers and exporters\nbenefit from the labour of workers\nin developing countries, so they\nshould ensure those workers are fairly\ncompensated and treated ethically.\nThis can help reduce exploitation and\npromote fair trade practices.\n2 I disagree. While governments\nin importing countries can create\npolicies that support fair trade, it’s\nnot necessarily their responsibility to\nshare income directly with workers in\ndeveloping countries. They should\ninstead focus on trade agreements\nand regulations that promote fairness\nand sustainability.\n3 I agree. Consumers have the power\nto influence business practices.\nBy demanding more ethically\nproduced products, they can pressure\nsupermarkets and distributors to ensure\nbetter conditions and fair wages for\nworkers in developing countries.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5814","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":45,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"ANALYZING AND USING DATA IN A PIE CHART"},"instruction":"Choose one of the statements in Exercise 4. Answer the questions about your statement.","pages":[30],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9e10db31f60a86101b43f1481a9f9d105ddac2ce3c0a05ff92af7a3d0a548c.png"],"provided":"1 What data in the pie chart on page 28 can you use to support your argument?\n2 What data in the pie chart contradicts your view? What can you do to minimize this problem?\n3 Do you need any other information to support your argument? Where could you find this?","items":[{"id":"b5814.i01","label":"1","prompt":"What data in the pie chart on page 28 can you use to support your argument?","options":[],"type":"qa/open"},{"id":"b5814.i02","label":"2","prompt":"What data in the pie chart contradicts your view? What can you do to minimize this problem?","options":[],"type":"qa/open"},{"id":"b5814.i03","label":"3","prompt":"Do you need any other information to support your argument? Where could you find this?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B04-LS-U01-question:b5813","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[30]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 What data in the pie chart on page 28 can you use to support your argument?"},{"kind":"text","text":"2 What data in the pie chart contradicts your view? What can you do to minimize this problem?"},{"kind":"text","text":"3 Do you need any other information to support your argument? Where could you find this?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Statement 1\n1 The fact that plantation workers receive\nonly 2% of the price paid by consumers\nsupports the argument. This tiny\npercentage highlights the need for\nfood producers and exporters to take\nresponsibility in ensuring that workers in\ndeveloping countries are compensated\nfairly for their labor.\n2 The 9% that goes to the plantation\nowner could be seen as contradicting\nthe argument, suggesting that some\nshare of the revenue stays within the\nproduction side in developing countries.\nTo minimize this problem, you could\nargue that despite the plantation owner\nreceiving a larger portion, it doesn’t\nguarantee that the workers are being\npaid fairly, and better regulations or\noversight by producers/exporters could\nensure that more of this income reaches\nthe workers directly.\n3 Additional information would be\nhelpful, such as: The average wages of\nplantation workers compared to living\nwages in the region; The distribution of\nprofit margins within the supply chain;\nFair trade policies or existing practices\nby food producers/exporters. This\ninformation could be found through\nreports from fair trade organizations,\nresearch papers on global food supply\nchains, and organizations that promote\nthe rights of agricultural workers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5816","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":46,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner. How much is a cup of coffee in a café in your country? What do you think is the difference between how much it is and how much it really costs to produce?","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7688726e0c7a79e03bc7691d0bcf12132c0f9fdc25ace703c8c759703e1cd3da.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A cup of coffee in my country is quite\nexpensive these days. For the price of a\nfew coffees in a café, I could probably pay\nfor a whole bag of coffee to make 30 cups\nat home. There’s a big difference between\nthe cost of the actual coffee I buy, and how\nmuch it’s really worth. But I suppose I’m\nalso paying to sit in the café, use its cups,\npay for the staff and so on.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github. al thinking","text":"Analyze and use data in pie charts; use data to support an argument."},{"label":"Grammar","text":"Use modals of present and past probability."},{"label":"Speaking skills","text":"Present data; describe a pie chart; draw conclusions from data."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":14,"alt":""}}]}},{"id":"B04-LS-U01-classroom:resource:b5734","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/acfb8cab47f7f6890bf83555616e0a7e3a65fda740400488786266590f6ad7ca.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"barrier","pos":"(n)","definition":"something that prevents something else from happening or makes it more difficult","example":"High fees can be a barrier to education.","wordAudio":"barrier","cardWord":false},{"term":"cost of living","pos":"(n phr)","definition":"the amount of money a person needs to live","example":"The cost of living in the city has risen.","wordAudio":"cost of living","cardWord":false},{"term":"customs procedures","pos":"(n phr)","definition":"official actions deciding what products can or can not enter or leave a country","example":"We had to learn the customs procedures before shipping the goods.","wordAudio":"customs procedures","cardWord":false},{"term":"food security","pos":"(n phr)","definition":"the fact that a place is able to make or get enough food to feed its people","example":"Growing more crops locally can improve food security.","wordAudio":"food security","cardWord":false},{"term":"red tape","pos":"(n phr)","definition":"official rules that seem unnecessary and make things harder or slower","example":"The business was delayed by months of red tape.","wordAudio":"red tape","cardWord":false},{"term":"reform","pos":"(v)","definition":"to improve a law or system, making it more modern or effective","example":"The council plans to reform the way it allocates housing.","wordAudio":"reform","cardWord":false}]]}},{"id":"B04-LS-U01-classroom:video","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/064a4d9446c40ff2e2f07de50d3de12818754f2edd98c8aef239ded4e292492c.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/8099ec6aa15934adc4d326f5-L4LS-U01.mp4","captions":[{"start":0,"end":7.58,"text":"Trade between nations has been a part of human\nexistence for thousands of years."},{"start":10.14,"end":18.28,"text":"Today's economists say that annual global trade may be\nworth up to $100 trillion by 2050."},{"start":21.16,"end":26.82,"text":"Being a member of the World Trade Organization can\nimprove a country's economic prospects."},{"start":27.96,"end":31.68,"text":"Out of 195 nations in the world,"},{"start":32.36,"end":35.98,"text":"164 nations are WTO members."},{"start":37.12,"end":40.72,"text":"Membership makes trade with other member nations\neasier."},{"start":43.54,"end":52.74,"text":"The WTO member nations work together to agree on the\nrules of free trade and to apply these fairly across\nthe world."},{"start":52.74,"end":55.1,"text":"This is a difficult task,"},{"start":55.5,"end":60.96,"text":"as the rules need to account for differences in how\ndeveloped each country is."},{"start":63.22,"end":69.52,"text":"One main aim of the WTO is to raise standards of living\nfor people around the world."},{"start":70.56,"end":73.58,"text":"With barriers to international trade removed,"},{"start":74.12,"end":76.18,"text":"food security can be improved."},{"start":76.18,"end":82.33,"text":"Importing food can make countries less dependent on\nsuccessful harvests."},{"start":84.3,"end":88.12,"text":"Consumers gain greater access to imported goods and\nservices,"},{"start":88.74,"end":93.28,"text":"so they have more choice over what to buy and pay\ncheaper prices."},{"start":93.62,"end":95.64,"text":"This lowers the cost of living."},{"start":97.72,"end":99.92,"text":"The world of business also benefits."},{"start":100.74000000000001,"end":103.03999999999999,"text":"Thanks to WTO rules,"},{"start":103.47999999999999,"end":106.94,"text":"corporations are able to operate more freely across\nborders."},{"start":107.92,"end":109.86,"text":"They encounter less red tape,"},{"start":110.2,"end":113.2,"text":"fewer trade costs, and simpler customs procedures."},{"start":114.44,"end":121.22,"text":"In theory, the result of this free growth in commerce\nand industry is that more jobs will be created."},{"start":122.04,"end":125.46,"text":"This in turn meets another of the WTO's goals,"},{"start":125.98,"end":127.9,"text":"full employment around the world."},{"start":129.92,"end":134.86,"text":"The WTO also helps smaller businesses to trade\ninternationally."},{"start":136.12,"end":136.54,"text":"Meanwhile,"},{"start":136.96,"end":141.64,"text":"WTO members continue to work on reforming agricultural\ntrade rules,"},{"start":142.02,"end":146.72,"text":"so that farmers in less economically developed\ncountries receive higher,"},{"start":147.07999999999998,"end":148.7,"text":"fairer prices for their produce."},{"start":151.66,"end":152.42000000000002,"text":"In the future,"},{"start":153.2,"end":155.92000000000002,"text":"international trade will undoubtedly face challenges,"},{"start":156.22,"end":159.32,"text":"particularly those created by new technologies."},{"start":159.92000000000002,"end":165.46,"text":"But the WTO members will continue to adapt to the\nchanging global economy,"},{"start":165.94,"end":168.78,"text":"as nations have done since trade rules began."}],"launchInline":true}},{"id":"B04-LS-U01-classroom:resource:b5790","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/18508bf894b7a9f4cf01773fa8a83594604d44710c866d7ed01616d9676b638f.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"4","pages":[[{"term":"incentive","pos":"(n)","definition":"something that encourages a person to do something","example":"The discount gives people an incentive to take the bus.","wordAudio":"incentive","cardWord":false},{"term":"permit","pos":"(n)","definition":"an official document that allows you to do something","example":"You need a permit to sell food in the park.","wordAudio":"permit","cardWord":false},{"term":"rebate","pos":"(n)","definition":"money that is returned to you by the government after you have paid tax","example":"She received a tax rebate after paying too much tax last year.","wordAudio":"rebate","cardWord":false}]]}},{"id":"B04-LS-U01-classroom:review-1","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58bdf8029e function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+

function bind(c){

 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};

 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));

function taskTable(table,feedback){

 }).join("")+'</tr>').join("");

}
function splitPanels(groups){

   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];

 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);

 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

 refresh();
}

 }

 if(special)return special;

 }
 if(referenceIsInline(c)){

 }

 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;

function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
 return entry+gaps;
}
function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';
  document.getElementById("flow-coverage").textContent="当前显示教材 Ex 的实页验证。";
 }
}
function updateSequenceHeading(){
 const opening=inOpenings(),glossary=inGlossaries(),first=primary[0];
 const title=glossary?"UNLOCK 任务前 Glossary":opening?"UNLOCK 单元开篇":"Book "+classroom.bookNumber(first)+" Unit "+(first.unit??Number(/-U(\d+)/.exec(first.id)?.[1]))+" "+trackLabel(first.track);
 document.body.dataset.sequence=sequenceView.value;
 document.querySelector(".review-head h1").textContent=document.title=title;
 document.getElementById("review-description").textContent=opening||glossary?"本单元课堂材料。":first.topic??"课堂课件";
}
function changeSequence(){
 updateSequenceHeading();
 const order=navigationOrder();
 if(order.length&&!order.includes(current))display(order[0]);
 else{nav();updateReview();}
}
function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);
 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;
 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";
 const reasons=r?.reasons??c.issues;
 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';
 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");
 if(r?.inlineCheckTest)document.getElementById("metrics").append(" 原位核对检查 "+r.inlineCheckTest.points+" 处。");
 if(r?.screenChecks?.length)document.getElementById("metrics").append(" 已核对原页、前题和题面位置。");
 if(r?.playbackTest)document.getElementById("metrics").append(" 原音视频回放已实测。");
 document.getElementById("references").innerHTML=c.references.length?c.references.map(x=>'<button class="ref-button" '+(x.sourceOnly?'data-reference-page="'+x.pages[0]+'"':'data-ref="'+esc(x.id)+'"')+'>'+esc(x.title)+'，教材第 '+x.pages.join("、")+' 页</button>').join(""):'<p>本题记录中没有显式学生作答引用。</p>';
 document.getElementById("materials").innerHTML=c.materials.map(m=>'<details><summary>'+esc(m.title)+'，教材第 '+esc((m.pages||[]).join("、"))+' 页</summary><div class="resource-text">'+esc(m.text||"此条目通过教材原页核对。")+'</div></details>').join("")+(c.supportText&&!c.materialDecks?'<details><summary>'+esc(c.supportTitle)+'</summary><div class="resource-text">'+esc(c.supportText)+'</div></details>':"");
 if(c.materialDecks)document.getElementById("materials").innerHTML=classroom.materialDecks(c).map(deck=>'<details><summary>'+esc(deck.label)+'</summary><div class="resource-text">'+deck.pages.map(card=>esc([card.title,card.subtitle,card.lead,card.body.replace(/\*\*/g,""),...(card.notes??[])].filter(Boolean).join("\n"))).join("\n\n")+'</div></details>').join("");
 document.getElementById("materials").insertAdjacentHTML("afterbegin",vocabularyPlacement(c,part));
 document.getElementById("provided-record").innerHTML='<details><summary>完整给定内容和小题记录</summary><div class="resource-text">'+esc(c.provided)+'\n'+esc(c.items.map(x=>x.label+" "+x.prompt+(x.options?.length?"\n"+x.options.join("\n"):"")).join("\n\n"))+'</div></details>';
 const feedback=c.feedback;
 document.getElementById("feedback-record").innerHTML=feedback?
  '<p><strong>'+esc(V.answerCheck.modeLabels[feedback.mode])+'</strong>，'+feedback.rows.length+' 项。</p><p>'+esc(feedback.source)+'。</p>'+
  (feedback.note?'<p>'+esc(feedback.note)+'</p>':"")+
  (feedback.modelAsset?'<p><a href="'+esc(feedback.modelAsset)+'" target="_blank" rel="noopener">查阅答案手册原页</a></p>':""):"";
 document.getElementById("record-id").textContent=c.id;
}
async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){
 const i=classroom.indexById.get(id);
 if(i===undefined)return;
 history.push({i:current,p:part,...(vocabulary?{vocabulary:id}:{})});
 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);
}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});
 return true;
}
function closeSource(){
 const modal=document.getElementById("source-modal");
 if(modal.hidden)return;
 modal.hidden=true;
 if(sourceTrigger?.isConnected)sourceTrigger.focus({preventScroll:true});
 sourceTrigger=null;
}
function showSource(){
 const source=sourceEntries[sourcePart];
 if(!source)return;
 document.getElementById("source-label").textContent="Book "+source.book+" "+(source.track==="RW"?"读写":"听说")+"，教材第 "+source.page+" 页";
 document.getElementById("source-image").src=source.image;
 const pdf=document.getElementById("source-pdf");
 pdf.hidden=!source.pdf;
 if(source.pdf)pdf.href=source.pdf;
 document.getElementById("source-prev").disabled=sourcePart===0;
 document.getElementById("source-next").disabled=sourcePart===sourceEntries.length-1;
}
function summaries(){
 const counts={直接适用:0,预设变体适用:0,不适用:0};
 for(const r of Object.values(results))counts[r.verdict]++;
 document.getElementById("stat-direct").textContent=counts.直接适用;
 document.getElementById("stat-variant").textContent=counts.预设变体适用;
 document.getElementById("stat-fail").textContent=counts.不适用;
}
function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const checked=[];
 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
function inspectOriginalButton(button){
 const owner=classroom.byId.get(button.dataset.originalCase);
 const expected=classroom.source(owner,button.dataset.originalPage);
 if(!expected)return false;
 button.click();
 const matched=!document.getElementById("source-modal").hidden&&
  document.getElementById("source-image").getAttribute("src")===expected.image&&
  document.getElementById("source-label").textContent.endsWith("教材第 "+expected.page+" 页")&&
  (!expected.pdf||document.getElementById("source-pdf").getAttribute("href")===expected.pdf);
 closeSource();
 return matched;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
