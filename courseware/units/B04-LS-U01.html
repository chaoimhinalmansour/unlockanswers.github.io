. It has to buy things which aren’t\nproduced here, like cars, machines and\nelectrical equipment.\n2 Some places have a kind of tax on\ngoods that enter the country. This can\nmake it more expensive for companies\nto buy things from other countries, which\nthen raises prices for the consumer.\nCountries might also have strict safety\nrules about products that come in,\nespecially food. The products that don’t\nmeet the standards cannot enter.\n3 I prefer to buy local products because\nthen I know I am supporting local\nbusinesses and their families. I also have\na better idea of the conditions that the\ngoods are produced in. / I prefer to buy\nproducts from abroad because they are\nusually cheaper and I can choose from a\nwider variety of options.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5733","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":3,"module":"WATCH AND LISTEN","ex":"2","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"You are going to watch a video about the World Trade Organization. Before you watch, look at the photos from the video. Discuss the questions with your partner.","pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/acfb8cab47f7f6890bf83555616e0a7e3a65fda740400488786266590f6ad7ca.png"],"provided":"","items":[{"id":"b5733.i01","label":"1","prompt":"What can you see in each photo?","options":[],"type":"discuss/open"},{"id":"b5733.i02","label":"2","prompt":"What kind of things do you think might influence a country's ability to trade with other countries?","options":[],"type":"discuss/open"},{"id":"b5733.i03","label":"3","prompt":"What organizations or groups do you know that work to make international trade easier?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5733.i01","label":"1","prompt":"What can you see in each photo?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5733.i02","label":"2","prompt":"What kind of things do you think might influence a country's ability to trade with other countries?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5733.i03","label":"3","prompt":"What organizations or groups do you know that work to make international trade easier?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The first photo shows some ships either\ngetting ready to take products away\nor receiving them. The second shows\na local farmer, getting corn ready to\nsell to a local market. The third shows\na range of modern smartphones on\nsale in a shop. The fourth shows trucks\nentering and leaving an area, possibly at\na border.\n2 Some countries may have highly\nadvanced roads, airports and ports,\nmaking it very easy and quick to receive\nor take out goods. Other countries may\nlack this infrastructure. They might also\nhave streamlined customs processes\nwhich enable goods to be imported and\nexported quickly and easily.\nOther things might include: a country’s\ncurrency exchange rates; a country’s\ncost of production (how much it costs to\nmake things and employ people); local\nlaws; any agreements a particular country\nmight have with others; any international\ntrading groups or organizations that a\ncountry is a member of.\n3 There are global organizations such as\nthe World Trade Organization (WTO).\nThere are also organizations that groups\nof countries belong to, which have their\nown agreed trade rules. These include\nthe European Union (EU), the Asia Pacific\nEconomic Cooperation (APEC) and the\nOrganization of the Petroleum Exporting\nCountries (OPEC), among others.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[{"page":16,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/acfb8cab47f7f6890bf83555616e0a7e3a65fda740400488786266590f6ad7ca.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5737","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Write T (true) or F (false) next to the statements below. Then compare your answers with a partner.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/064a4d9446c40ff2e2f07de50d3de12818754f2edd98c8aef239ded4e292492c.png"],"provided":"","items":[{"id":"b5737.i01","label":"1","prompt":"The World Trade Organization (WTO) includes every country in the world.","options":["T (true)","F (false)"],"type":"choice/closed"},{"id":"b5737.i02","label":"2","prompt":"Countries join the WTO to increase their trade opportunities.","options":["T (true)","F (false)"],"type":"choice/closed"},{"id":"b5737.i03","label":"3","prompt":"Countries need to collaborate to make decisions about WTO rules.","options":["T (true)","F (false)"],"type":"choice/closed"},{"id":"b5737.i04","label":"4","prompt":"Only large corporations benefit from the WTO. The main aim of the WTO is to help large businesses do better.","options":["T (true)","F (false)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5737.i01","label":"1","prompt":"The World Trade Organization (WTO) includes every country in the world.","options":["T (true)","F (false)"],"type":"choice/closed"},{"kind":"item","id":"b5737.i02","label":"2","prompt":"Countries join the WTO to increase their trade opportunities.","options":["T (true)","F (false)"],"type":"choice/closed"},{"kind":"item","id":"b5737.i03","label":"3","prompt":"Countries need to collaborate to make decisions about WTO rules.","options":["T (true)","F (false)"],"type":"choice/closed"}],[{"kind":"item","id":"b5737.i04","label":"4","prompt":"Only large corporations benefit from the WTO. The main aim of the WTO is to help large businesses do better.","options":["T (true)","F (false)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/8099ec6aa15934adc4d326f5-L4LS-U01.mp4","captions":[{"start":0,"end":7.58,"text":"Trade between nations has been a part of human\nexistence for thousands of years."},{"start":10.14,"end":18.28,"text":"Today's economists say that annual global trade may be\nworth up to $100 trillion by 2050."},{"start":21.16,"end":26.82,"text":"Being a member of the World Trade Organization can\nimprove a country's economic prospects."},{"start":27.96,"end":31.68,"text":"Out of 195 nations in the world,"},{"start":32.36,"end":35.98,"text":"164 nations are WTO members."},{"start":37.12,"end":40.72,"text":"Membership makes trade with other member nations\neasier."},{"start":43.54,"end":52.74,"text":"The WTO member nations work together to agree on the\nrules of free trade and to apply these fairly across\nthe world."},{"start":52.74,"end":55.1,"text":"This is a difficult task,"},{"start":55.5,"end":60.96,"text":"as the rules need to account for differences in how\ndeveloped each country is."},{"start":63.22,"end":69.52,"text":"One main aim of the WTO is to raise standards of living\nfor people around the world."},{"start":70.56,"end":73.58,"text":"With barriers to international trade removed,"},{"start":74.12,"end":76.18,"text":"food security can be improved."},{"start":76.18,"end":82.33,"text":"Importing food can make countries less dependent on\nsuccessful harvests."},{"start":84.3,"end":88.12,"text":"Consumers gain greater access to imported goods and\nservices,"},{"start":88.74,"end":93.28,"text":"so they have more choice over what to buy and pay\ncheaper prices."},{"start":93.62,"end":95.64,"text":"This lowers the cost of living."},{"start":97.72,"end":99.92,"text":"The world of business also benefits."},{"start":100.74000000000001,"end":103.03999999999999,"text":"Thanks to WTO rules,"},{"start":103.47999999999999,"end":106.94,"text":"corporations are able to operate more freely across\nborders."},{"start":107.92,"end":109.86,"text":"They encounter less red tape,"},{"start":110.2,"end":113.2,"text":"fewer trade costs, and simpler customs procedures."},{"start":114.44,"end":121.22,"text":"In theory, the result of this free growth in commerce\nand industry is that more jobs will be created."},{"start":122.04,"end":125.46,"text":"This in turn meets another of the WTO's goals,"},{"start":125.98,"end":127.9,"text":"full employment around the world."},{"start":129.92,"end":134.86,"text":"The WTO also helps smaller businesses to trade\ninternationally."},{"start":136.12,"end":136.54,"text":"Meanwhile,"},{"start":136.96,"end":141.64,"text":"WTO members continue to work on reforming agricultural\ntrade rules,"},{"start":142.02,"end":146.72,"text":"so that farmers in less economically developed\ncountries receive higher,"},{"start":147.07999999999998,"end":148.7,"text":"fairer prices for their produce."},{"start":151.66,"end":152.42000000000002,"text":"In the future,"},{"start":153.2,"end":155.92000000000002,"text":"international trade will undoubtedly face challenges,"},{"start":156.22,"end":159.32,"text":"particularly those created by new technologies."},{"start":159.92000000000002,"end":165.46,"text":"But the WTO members will continue to adapt to the\nchanging global economy,"},{"start":165.94,"end":168.78,"text":"as nations have done since trade rules began."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F (Around 30 countries are not members of the WTO.)\n2 T 3 T 4 F (The WTO also helps smaller businesses to\ntrade internationally.)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":23,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5738","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again and make notes on these WTO aims. Then discuss the questions with a partner.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/064a4d9446c40ff2e2f07de50d3de12818754f2edd98c8aef239ded4e292492c.png"],"provided":"A Removing barriers to international trade\nWhat are the possible results of this? (1)____\nHow can this benefit individual countries? (2) ____\nHow can this benefit consumers? (3)____\nB Being able to operate freely across borders\nWho benefits from simpler customs procedures? (4) ____\nWhat are the possible results? (5)____\nC Reforming agricultural trade rules\nWho benefits? (6)____\nWhat are the possible results? (7)____","items":[{"id":"b5738.i01","label":"(1)","prompt":"What are the possible results  in the future?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 An increased standard of living means\nhappier, healthier populations. This\nmight hopefully lead to a decrease in\nthe number of people without food,\nwater or basic education. It might also\nlead to fewer wars. It could also mean\nthat people will live longer and use more\nresources, so we will need to look for\nmore sustainable solutions to meet all\nour needs.\n2 Technology will probably make it easier\nand faster for things to move around the\nworld, and to enter or leave countries.\nDigital methods will replace paper-\nbased ones. Computer intelligence will\nhelp find quicker routes for ships, and\nmay even start driving vehicles such\nas trucks.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5742","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":7,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the sentences (1–7). Write the correct form of the words in bold next to the definitions (a–g).","pages":[18],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/30428925c9dfeb0387a7b8e3b206b1f9c1af8ecece60e55ae1fb4b90eec7c8d6.png"],"provided":"1 A lot of people only purchase fruit and vegetables that are grown locally, to help the environment.\n2 Most consumers don't bother reading the labels on food products before they buy them.\n3 My country produces a lot of food that gets sold in other countries.\n4 My country imports most of its fresh fruit from abroad.\n5 Scientists aren't doing enough to investigate solutions to or ways of controlling climate change.\n6 Nowadays, it's easy to find a range of both home-grown foods and foods from overseas in the shops.\n7 In my country, there are large greenhouses for growing fresh fruit and salad all year round.","items":[{"id":"b5742.i01","label":"a","prompt":"____ (v) to buy something","options":["purchase","consumers","produces","imports","investigate","overseas","greenhouses"],"type":"choice/closed"},{"id":"b5742.i02","label":"b","prompt":"____ (adv) in, from, or to other countries","options":["purchase","consumers","produces","imports","investigate","overseas","greenhouses"],"type":"choice/closed"},{"id":"b5742.i03","label":"c","prompt":"____ (n) somebody who buys or uses goods or services","options":["purchase","consumers","produces","imports","investigate","overseas","greenhouses"],"type":"choice/closed"},{"id":"b5742.i04","label":"d","prompt":"____ (v) to bring products in from another country to sell or use","options":["purchase","consumers","produces","imports","investigate","overseas","greenhouses"],"type":"choice/closed"},{"id":"b5742.i05","label":"e","prompt":"____ (n) a building used to grow plants that need constant warmth and protection","options":["purchase","consumers","produces","imports","investigate","overseas","greenhouses"],"type":"choice/closed"},{"id":"b5742.i06","label":"f","prompt":"____ (v) to create something or bring it into existence","options":["purchase","consumers","produ ial-reference","title":"LISTENING 1 Ex 1","pages":[18]}],"materials":[],"coursePages":[[{"kind":"text","text":"A lot of people only purchase fruit and vegetables that are grown locally, to help the environment."},{"kind":"text","text":"Most consumers don’t bother reading the labels on food products before they buy them."},{"kind":"text","text":"My country produces a lot of food that gets sold in other countries."},{"kind":"text","text":"My country imports most of its fresh fruit from abroad."},{"kind":"text","text":"Scientists aren’t doing enough to investigate solutions to or ways of controlling climate change."}],[{"kind":"text","text":"Nowadays, it’s easy to find a range of both home-grown foods and foods from overseas in the shops."},{"kind":"text","text":"In my country, there are large greenhouses for growing fresh fruit and salad all year round."}]],"courseMaterials":[{"id":"B04-LS-U01-publisher-sheet:b5742","title":"LISTENING 1 Ex 1 原题面","pages":[18],"text":"1 A lot of people only purchase fruit and vegetables that are grown locally, to help the environment.\n2 Most consumers don't bother reading the labels on food products before they buy them.\n3 My country produces a lot of food that gets sold in other countries.\n4 My country imports most of its fresh fruit from abroad.\n5 Scientists aren't doing enough to investigate solutions to or ways of controlling climate change.\n6 Nowadays, it's easy to find a range of both home-grown foods and foods from overseas in the shops.\n7 In my country, there are large greenhouses for growing fresh fruit and salad all year round.","screens":["1 A lot of people only purchase fruit and vegetables that are grown locally, to help the environment.","2 Most consumers don't bother reading the labels on food products before they buy them.","3 My country produces a lot of food that gets sold in other countries.","4 My country imports most of its fresh fruit from abroad.","5 Scientists aren't doing enough to investigate solutions to or ways of controlling climate change.","6 Nowadays, it's easy to find a range of both home-grown foods and foods from overseas in the shops.","7 In my country, there are large greenhouses for growing fresh fruit and salad all year round."],"sources":[{"page":18,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/30428925c9dfeb0387a7b8e3b206b1f9c1af8ecece60e55ae1fb4b90eec7c8d6.png"}],"kind":"task_sheet","sourceBlockIds":["b5742"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I don’t think this is true. I can’t imagine\nmany people really know where their\nfood is from.\n2 I have seen some people doing this. But\nI think the only label most people really\ncheck is the one with the price on it.\n3 My country produces a lot of olive oil.\nIn fact, it’s one of the world’s biggest\nsuppliers and it’s quite famous.\n4 There are some fruits that simply don’t\ngrow in this country, and are imported\nfrom abroad. Bananas would be an\nexample. But we also grow our own fruit,\nand this changes with the seasons, as\nyou’d expect.\n5 I think the scientists are doing what they\ncan. The problem is that governments,\nor more importantly big companies,\naren’t acting on the scientists’ advice.\n6 Where I live, we have lots of food\nbrought from overseas because there\nare very few farms, so local fresh food is\nvery expensive.\n7 There are areas where you can see lots\nof greenhouses. They grow things like\nsalad greens and tomatoes. Some of this\nis sold abroad.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5747","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":9,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work in groups. How much thought do you give to where your food comes from and how it gets to your local shops? Do you think you are typical of most consumers?","pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/577850f4af20bbe993c75c976d633900fa1152c34562b0288cfada60a8127aab.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I give a lot of thought to it, as I’m very\nconscious about eating only fresh fruit\nand vegetables that are in season. I’m not\ninterested in eating things like strawberries\nthat were picked halfway around the world,\nput in a box and transported for weeks.\nApart from anything else, this kind of food\ndoesn’t taste very good – it’s often bland\nand flavourless. I don’t think most people\nare like me, though. Maybe most people\ndon’t really care about the food they eat.\nI tend to buy whatever’s at a good\nprice and looks nice when I’m at the\nsupermarket. I’m much more likely to worry\nabout how it looks or smells than imagining\nwhere it might have come from. I believe\nthe majority of people think like me.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5748","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":10,"module":"LISTENING 1","ex":"4","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a radio programme called The 51,500-kilometre fruit salad. Before you listen, work with a partner and discuss the questions below. Give reasons for your opinions.","pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/577850f4af20bbe993c75c976d633900fa1152c34562b0288cfada60a8127aab.png"],"provided":"","items":[{"id":"b5748.i01","label":"1","prompt":"Based on the title, what do you think the programme will be about?","options":[],"type":"discuss/open"},{"id":"b5748.i02","label":"2","prompt":"Do you think the programme is likely to approach the subject in a mostly positive or a mostly negative way?","options":[],"type":"discuss/open"},{"id":"b5748.i03","label":"3","prompt":"What are some of the possible positive and negative arguments it could include?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5748.i01","label":"1","prompt":"Based on the title, what do you think the programme will be about?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5748.i02","label":"2","prompt":"Do you think the programme is likely to approach the subject in a mostly positive or a mostly negative way?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5748.i03","label":"3","prompt":"What are some of the possible positive and negative arguments it could include?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It may be about the very long distances\nthings like fruit have travelled before\nthey end up on our plates.\n2 I don’t think it’s likely to approach the\nsubject in a positive way. The way the\ndistance is emphasized or exaggerated,\nrather than the quality the food tells me\nthis. / It might approach the subject in a\npositive way. The title seems like a joke,\nor something fun, so it might tell an\ninteresting story about how food gets to\nour plates.\n3 Positive arguments: A lot of different\npeople work hard to get our food to us;\nwe can eat a huge variety of food from\nevery corner of the world.\nNegative arguments: Food that travels\nso far cannot be fresh or nutritious; it’s\ndamaging to the environment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5750","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":11,"module":"LISTENING 1","ex":"5","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"1.1 Listen to the programme. Does it mention any of the arguments that you thought of in Exercise 4?","pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/577850f4af20bbe993c75c976d633900fa1152c34562b0288cfada60a8127aab.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U01-question:b5748","kind":"student-work","title":"LISTENING 1 Ex 4","pages":[19]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 1.1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b46443e4ddf2a56ed7682f4496d133c42c173dc970a724242661f32114b1ab9f.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"It mentioned damage to the environment\nbecause it talked about the long supply\nchain that is involved and the carbon\nfootprint that creates.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5751","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":12,"module":"LISTENING 1","ex":"6","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Discuss the main arguments included in the programme with a partner. Which were negative arguments and which were positive?","pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/577850f4af20bbe993c75c976d633900fa1152c34562b0288cfada60a8127aab.png"],"provided":"Positive: We can taste food from different cultures around the world without leaving the country.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Positive: We can taste food from different cultures around the world without leaving the country."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Positive arguments: We can taste food\nfrom different cultures around the world\nwithout leaving the country; people can\nstill eat fresh fruit in winter; people can\neat a huge variety of fresh food all year\nround; more convenient; local food can be\nexpensive and not as exciting.\nNegative arguments: Because of the long\ndistances involved, a lot of carbon dioxide\npollution is produced; this pollution is a\nmajor cause of climate change; even locally\ngrown food might be transported far just\nto be packaged, before being transported\nback again; it’s impossible to be sure how\nfar something has travelled unless you\npurchase it directly from a farm or grow it\nyourself; growing food from hot countries\nlocally needs greenhouses, which increases\nproduction costs; local food can be\nexpensive and not as exciting.","references":[{"source":"https://raw ","kind":"student-work","title":"LISTENING 1 Ex 7","pages":[20]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Imported products are cheaper than products that are grown locally."},{"kind":"text","text":"2 Locally grown food is always environmentally friendly."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Imported products are usually cheaper\nthan locally grown products because we\nhave little in the way of agriculture in my\ncountry, so growing things here is very\nexpensive. In contrast, imported foods\nare bought in bulk, so are much less\nexpensive. / We have a great climate\nfor growing things, and so have lots\nof farmland producing fresh produce\nat affordable prices. We don’t need to\nimport much food at all.\n2 I’d like to think that locally grown food\nis environmentally friendly, but I know\nfor a fact that many farmers use lots\nof pesticides and other chemicals to\nincrease the amount of crops they\nproduce. / I think locally produced food\nis definitely better for the planet – for\na start, it has a much smaller carbon\nfootprint because it doesn’t have to\ntravel nearly so far to get to the shops.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5758","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":15,"module":"LISTENING 1","ex":"9","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"1.2 Listen to the short extracts from the radio programme. Choose the statement (a–c) which best matches the reporter's opinion.","pages":[20],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/343c0e45144f015625f3217ad16b1f3b105bf291c363c9a48b39f8c088eded79.png"],"provided":"1 a Cheap food can have hidden negative effects.\nb Cheap food costs less for consumers.\nc Cheap food is better for the environment.\n\n2 a Shipping fruit by air is a good thing.\nb Shipping fruit by air is not environmentally friendly.\nc Shipping fruit by air is cheap and easy.\n\n3 a Shipping fruit around the world might contribute to global warming.\nb The price of fruit at the supermarket is too high because of air travel.\nc If we don't eat enough locally grown fruit, we won't be healthy.","items":[{"id":"b5758.i01","label":"1","prompt":"","options":["Cheap food can have hidden negative effects.","Cheap food costs less for consumers.","Cheap food is better for the environment."],"type":"choice/closed"},{"id":"b5758.i02","label":"2","prompt":"","options":["Shipping fruit by air is a good thing.","Shipping fruit by air is not environmentally friendly.","Shipping fruit by air is cheap and easy."],"type":"choice/closed"},{"id":"b5758.i03","label":"3","prompt":"","options":["Shipping fruit around the world might contribute to global warming.","The price of fruit at the supermarket is too high because of air travel.","If we don't eat enough locally grown fruit, we won't be healthy."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 a Cheap food can have hidden negative effects."},{"kind":"text","text":"b Cheap food costs less for consumers."},{"kind":"text","text":"c Cheap food is better for the environment."},{"kind":"text","text":"2 a Shipping fruit by air is a good thing."},{"kind":"text","text":"b Shipping fruit by air is not environmentally friendly."},{"kind":"text","text":"c Shipping fruit by air is cheap and easy."},{"kind":"text","text":"3 a Shipping fruit around the world might contribute to global warming."}],[{"kind":"text","text":"b The price of fruit at the supermarket is too high because of air travel."},{"kind":"text","text":"c If we don't eat enough locally grown fruit, we won't be healthy."}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 1.2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c54c9664c00472ad0bfaed7e9120c6acc11c529e97304fca28f93f684c73cb7f.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 a 2 b 3 a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5759","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":16,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"1.2 Listen again. Discuss with a partner whether you think the reporter states their opinion directly, or whether you have to 'read between the lines'.","pages":[21],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/da2c367728d0987b0ca4cff96e55fd548997841666a673ad93c26ca44067af87.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 1.2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c54c9664c00472ad0bfaed7e9120c6acc11c529e97304fca28f93f684c73cb7f.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 The reporter is being quite direct when\nthey say ‘cheap food comes at a price’.\nIt’s clear here that the reporter wants to\nsay that cheap food isn’t always good\nfor us.\n2 We have to ‘read between the lines’\nwhen the reporter talks about a\n51,500-kilometre fruit salad. This seems\nlike a factual statement, but the reporter\nuses this to say something about the\nextreme distances that something as\nsimple as fruit travels to get to us.\n3 By asking a question, What’s the\ntrue environmental cost of such well-\ntravelled food?, the reporter is putting\nthe idea into our heads that food which\ntravels long distances probably has\nharmful effects on the environment.\nRather than directly saying this, the\nreporter encourages us to think about\nthis issue.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5762","book":4,"unit":1,"track":"LS","topic":"GL s."},{"kind":"text","text":"2 Imported food from far away is harmful to the planet."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 People can buy different kinds of food,\nso they have a varied diet; it’s easier to\neat a healthy, balanced diet when there\nis a wide selection of food available;\npeople who are struggling financially\nshould still have access to healthy foods\nat affordable prices.\n2 Imported food has to travel long\ndistances, often thousands of\nkilometres to get to its final destination.\nThe vehicles it is transported in cause\nlots of pollution, and the ways used\nto keep it fresh (e.g. fridges, freezers,\npackaging) can also be bad for the\nenvironment; food brought in from\nabroad is often mass-produced with\nlots of chemicals, which harm the\nenvironment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5767","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":21,"module":"LISTENING 1","ex":"15","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Write two paragraphs on the topics below. At the start of each paragraph, state the topic, then provide two or three supporting arguments. Share your paragraphs with other students.","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9e60f273db0e19589d0b4a2ea3d1b482eda7842afcd29a3a6c55231a088bb542.png"],"provided":"- Paragraph 1: People should be able to buy a variety of affordable food all year round.\n- Paragraph 2: However, there is an environmental cost to importing food from distant countries.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Paragraph 1: People should be able to buy a variety of affordable food all year round."},{"kind":"text","text":"- Paragraph 2: However, there is an environmental cost to importing food from distant countries."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"People should be able to buy a variety of\naffordable food all year round. We should\nnot, in this day and age, be expected to\neat a limited choice of food, possibly at\nrisk to our health. In the winter, when fresh\nfood simply can’t be grown locally, it is only\nright that people should be able to find\nthings like salad or a range of fruit on their\nsupermarket shelves. Price is also extremely\nimportant. Most people are on limited\nbudgets and need to know they can rely\non supermarkets to stock food that they\ncan afford.\nHowever, there is an environmental cost\nto importing food from distant countries.\nThere is little doubt that sending food\nhalfway around the world in ships or\nfuel-guzzling trucks and trains is harmful\nto the planet in terms of carbon dioxide\nemissions. Also, many of the foods we buy,\nfrom soya and beef to food containing\npalm oil, is farmed in places where\nrainforests used to stand, or mass-produced\nusing chemicals that are harmful to wildlife\nand other plants.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5768","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":22,"module":"LISTENING 1","ex":"16","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work in groups. Discuss any solutions you can think of to the problems you described in Exercise 15.","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9e60f273db0e19589d0b4a2ea3d1b482eda7842afcd29a3a6c55231a088bb542.png"],"provided":"I think we should continue to import food from other countries, but where possible, we should ...","items":[],"layout":"list","references":[{"id":"B04-LS-U01-question:b5767","kind":"student-work","title":"LISTENING 1 Ex 15","pages":[22]}],"materials":[],"coursePages":[[{"kind":"text","text":"I think we should continue to import food from other countries, but where possible, we should ..."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I think we should continue to import food\nfrom other countries, but where possible,\nwe should encourage local farmers to\ngrow only seasonal produce, and people\nshould grow their own food as well. Also,\nperhaps consumers could be encouraged\nto rely less on exotic produce and become\nmore familiar with food grown in their\nown countries.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5775","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"MODALS OF PRESENT AND PAST PROBABILITY"},"instruction":"Circle the correct modal and verb form. Use the information in brackets to help you.","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99da6570ccec767ca6613ceaa1dd8f34c55ae0c8c32aa79db676186ec42372bf.png"],"provided":"","items":[{"id":"b5775.i01","label":"1","prompt":"Alana ____ tickets to Ecuador last week. (Guessing – you aren't really sure.)","options":["couldn't have bought","may have bought"],"type":"choice/closed"},{"id":"b5775.i02","label":"2","prompt":"Ahmed ____ from Oman. (You think it's the only logical conclusion.)","options":["must be","could be"],"type":"choice/closed"},{"id":"b5775.i03","label":"3","prompt":"I ____ my passport on the way hom chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5776","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":24,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"MODALS OF PRESENT AND PAST PROBABILITY"},"instruction":"Work with a partner. Think of a way to continue each sentence in Exercise 1, giving a reason.","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99da6570ccec767ca6613ceaa1dd8f34c55ae0c8c32aa79db676186ec42372bf.png"],"provided":"Alana may have bought tickets to Ecuador last week. She asked me about ticket prices.","items":[],"layout":"list","references":[{"id":"B04-LS-U01-question:b5775","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[23]}],"materials":[],"coursePages":[[{"kind":"text","text":"Alana may have bought tickets to Ecuador last week. She asked me about ticket prices."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 I saw his passport earlier.\n3 It was in my pocket when I left work, and\nthen it wasn’t there when I got home.\n4 They do a lot of international business.\n5 There isn’t a big smartphone\nindustry there.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5777","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":25,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"MODALS OF PRESENT AND PAST PROBABILITY"},"instruction":"Look again at Exercise 1. Work with a partner. Discuss how the meaning of each sentence would change if the other modal and verb form was used and extend each sentence as in Exercise 2.","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99da6570ccec767ca6613ceaa1dd8f34c55ae0c8c32aa79db676186ec42372bf.png"],"provided":"You think it's impossible (couldn't have bought): It's impossible that Alana bought tickets to Ecuador last week. She hasn't got enough money.","items":[],"layout":"list","references":[{"id":"B04-LS-U01-question:b5775","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[23]},{"id":"B04-LS-U01-question:b5776","kind":"material-reference","title":"LANGUAGE DEVELOPMENT Ex 2","pages":[23]}],"materials":[],"coursePages":[[{"kind":"text","text":"You think it's impossible (couldn't have bought): It's impossible that Alana bought tickets to Ecuador last week. She hasn't got enough money."}]],"courseMaterials":[{"id":"B04-LS-U01-publisher-sheet:b5776","title":"LANGUAGE DEVELOPMENT Ex 2 原题面","pages":[23],"text":"Alana may have bought tickets to Ecuador last week. She asked me about ticket prices.","screens":["Alana may have bought tickets to Ecuador last week. She asked me about ticket prices."],"sources":[{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99da6570ccec767ca6613ceaa1dd8f34c55ae0c8c32aa79db676186ec42372bf.png"}],"kind":"task_sheet","sourceBlockIds":["b5776"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 Guessing – you aren’t really sure (could\nbe). It’s possible that Ahmed is from\nOman, as his parents live there, but he\nhas an Egyptian accent.\n3 Guessing – you aren’t really sure (might\nhave lost). It’s possible that I lost my\npassport on the way home from work,\nbut I could also have left it in my desk\ndrawer in the office.\n4 You think it’s only logical conclusion\n(must send). They have to send Jan to\nDubai next week because there’s no one\nelse in the office who can handle the\nnegotiation.\n5 You think it’s the only logical conclusion\n(must be). It can only be from Tahiti\nbecause it’s got ‘Made in Tahiti’ on\nthe back.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5778","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":26,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"MODALS OF PRESENT AND PAST PROBABILITY"},"instruction":"Work in groups. By yourself, write one sentence about each of the people in your group, including a reason, using the ideas below. Use a modal verb in each sentence. Then take turns to say your sentences. Which ones are correct?","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99da6570ccec767ca6613ceaa1dd8f34c55ae0c8c32aa79db676186ec42372bf.png"],"provided":"- something that's definitely true, now or in the past\n- something that's definitely not true, now or in the past\n- something that's possibly true, now or in the past\n\nYou must be under 30 years old. You look about 25!\n\nYou must have started studying English a long time ago. You can speak it really well.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- something that's definitely true, now or in the past"},{"kind":"text","text":"- something that's definitely not true, now or in the past"},{"kind":"text","text":"- something that's possibly true, now or in the past"},{"kind":"text","text":"You must be under 30 years old. You look about 25!"},{"kind":"text","text":"You must have started studying English a long time ago. You can speak it really well."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"You can’t have had much sleep last night.\nI’ve seen you yawning a lot.\nYour phone can’t be new. I saw you using\nthe same one months ago.\nYou might be hungry. It’s nearly lunch time.\nYou may have been waiting for a message.\nYou were looking at your phone a lot.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5780","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":27,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"GLOBALIZATION VOCABULARY"},"instruction":"Work with a partner. What are some of the benefits of globalization? Make a list of your ideas and share them with the class.","pages":[24],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/837a4d28aaad5c1e71ca763b9daee11d95281296d385579f931b9444ba7c0483.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Access to new cultures and ideas; easy\navailability of food, culture and fashion from\ndifferent countries; spread of knowledge\nand technology; increased understanding\nof other cultures","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5781","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":28,"module":"LANGUAGE DEVELOPMENT","ex":"6","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"GLOBALIZATION VOCABULARY"},"instruction":"Complete the text below with the correct words and phrases from the box. Use the Glossary on page 190 to help you. Does the text mention any of your ideas from Exercise 5?","pages":[24],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/837a4d28aaad5c1e71ca763b9daee11d95281296d385579f931b9444ba7c0483.png"],"provided":"exported goods multinational outsourcing produce prosperity purchase supply chain transport\n\nGlobalization is beneficial to our society. Thanks to faster and more efficient methods of (1) ____, a huge variety of (2) ____ can now be taken around the world in ever-increasing quantities. For example, fresh food can be (3) ____ from different countries via lorry, plane and ship. Although this makes the (4) ____ longer, with more people involved before (5) ____ reaches the customer, there's an amazing variety of fruit and vegetables to choose from. Even if your country doesn't grow kiwi fruit, you can (6) ____ them from supermarkets all year round! Companies are now (7) ____: Coca-Cola is an American company, but it has offices around the world, from Argentina to Japan and Spain. Globalization has brought greater (8) ____ to a lot of countries. The trend in (9) ____ – when a company asks outside suppliers to provide services – has been very beneficial to India, for example. This country is now a leader in supplying IT customer services for companies all over the world. Globalization is definitely bringing people, places and products together!","items":[{"id":"b5781.i01","label":"1","prompt":"Thanks to faster and more efficient methods of (1) ____,","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i02","label":"2","prompt":"a huge variety of (2) ____ can now be taken around the world in ever-increasing quantities.","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i03","label":"3","prompt":"For example, fresh food can be (3) ____ from different countries via lorry, plane and ship.","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i04","label":"4","prompt":"Although this makes the (4) ____ longer,","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i05","label":"5","prompt":"with more people involved before (5) ____ reaches the customer,","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i06","label":"6","prompt":"Even if your country doesn't grow kiwi fruit, you can (6) ____ them from supermarkets all year round!","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i07","label":"7","prompt":"Companies are now (7) ____: Coca-Cola is an American company, but it has offices around the world, from Argentina to Japan and Spain.","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i08","label":"8","prompt":"Globalization has brought greater (8) ____ to a lot of countries.","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"},{"id":"b5781.i09","label":"9","prompt":"The trend in (9) ____ – when a company asks outside suppliers to provide services – has been very beneficial to India, for example.","options":["exported goods","multinational","outsourcing","produce","prosperity","purchase","supply chain","transport"],"type":"choice/closed"}],"layout":"list","references":[{"id":"B04-LS-U01-question:b5780","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 5","pages":[24]}],"materials":[],"coursePages":[[{"kind":"text","text":"exported goods multinational outsourcing produce prosperity purchase supply chain transport"},{"kind":"text","text":"Globalization is beneficial to our society. Thanks to faster and more efficient methods of (1) ____, a huge variety of (2) ____ can now be taken around the world in ever-increasing quantities. For example, fresh food can be (3) ____ from different countries via lorry, plane and ship. Although this makes the (4) ____ longer, with more people involved before (5) ____ reaches the customer, there's an amazing variety of fruit and vegetables to choose from. Even if your country doesn't grow kiwi fruit, you can (6) ____ them from supermarkets all year round! Companies are now (7) ____: Coca-Cola is an American company, but it has offices around the world, from Argentina to Japan and Spain. Globalization has brought greater (8) ____ to a lot of countries. The trend in (9) ____ – when a company asks outside suppliers to provide services – has"}],[{"kind":"text","text":"been very beneficial to India, for example. This country is now a leader in supplying IT customer services for companies all over the world. Globalization is definitely bringing people, places and products together!"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 transport 2 goods 3 exported 4 supply chain\n5 produce 6 purchase 7 multinational 8 prosperity\n9 outsourcing","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5782","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":1,"order":29,"module":"LANGUAGE DEVELOPMENT","ex":"7","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"GLOBALIZATION VOCABULARY"},"instruction":"Do you agree that 'globalization is beneficial to our society'? What negative points does the text fail to mention? Compare your ideas in small groups.","pages":[24],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/837a4d28aaad5c1e71ca763b9daee11d95281296d385579f931b9444ba7c0483.png"],"provided":"I agree that globalization helps us to ...\nYes, but the text doesn't mention ...","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"I agree that globalization helps us to ..."},{"kind":"text","text":"Yes, but the text doesn't mention ..."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I agree that globalization helps us to\nhave access to a large variety of goods.\nThis variety is good, but the text doesn’t\nmention the environmental concerns of\nshipping goods long distances. Another\nproblem that the text doesn’t mention is\nthat everywhere seems to be becoming\nthe same (often like the US). There is a\nloss of local cultures and traditions, and\nmultinational companies – not traditional\nlocal companies – are dominating towns\nand cities.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5785","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":30,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Read the sentences and discuss the meaning of each word in bold.","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f06e384bd4cfe6a034d6ddff3a9926a17869cdddb2b2634b079bdc29ce4ccaa1.png"],"provided":"1 Starbucks began in 1971 in a single US city. It has now become a multinational company, operating in 80 countries worldwide.\n2 When you buy expensive goods in one country, you often have to pay additional taxes when you bring them into another country.\n3 Companies try to save on production costs, so that they can make more money when the product is sold later. These costs might include workers' salaries, or the materials used.\n4 The 2009 film Avatar originally cost around $237 million to make. So far, it has made around $3 billion in ticket sales, meaning that it has made a huge profit.\n5 Some films aren't very popular with domestic audiences, although they might become big hits internationally.\n6 Labour costs can be expensive because they not only include the salaries that companies have to pay their workers, but also extra benefits like pension contributions.\n7 On Wednesday afternoons, my local cinema offers half-price tickets for students. That's quite a generous discount.","items":[{"id":"b5785.i01","label":"1","prompt":"Starbucks began in 1971 in a single US city. It has now become a multinational company, operating in 80 countries worldwide.","options":[],"type":"discuss/open"},{"id":"b5785.i02","label":"2","prompt":"When you buy expensive goods in one country, you often have to pay additional taxes when you bring them into another country.","options":[],"type":"discuss/open"},{"id":"b5785.i03","label":"3","prompt":"Companies try to save on production costs, so that they can make more money when the product is sold later. These costs might include workers' salaries, or the materials used.","options":[],"type":"discuss/open"},{"id":"b5785.i04","label":"4","prompt":"The 2009 film Avatar originally cost around $237 million to make. So far, it has made around $3 billion in ticket sales, meaning that it has made a huge profit.","options":[],"type":"discuss/open"},{"id":"b5785.i05","label":"5","prompt":"Some films aren't very popular with domestic audiences, although they might become big hits internationally.","options":[],"type":"discuss/open"},{"id":"b5785.i06","label":"6","prompt":"Labour costs can be expensive because they not only include the salaries that companies have to pay their workers, but also extra benefits like pension contributions.","options":[],"type":"discuss/open"},{"id":"b5785.i07","label":"7","prompt":"On Wednesday afternoons, my local cinema offers half-price tickets for students. That's quite a generous discount.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Starbucks began in 1971 in a single US city. It has now become a multinational company, operating in 80 countries worldwide."},{"kind":"text","text":"2 When you buy expensive goods in one country, you often have to pay additional taxes when you bring them into another country."},{"kind":"text","text":"3 Companies try to save on production costs, so that they can make more money when the product is sold later. These costs might include workers' salaries, or the materials used."},{"kind":"text","text":"4 The 2009 film Avatar originally cost around $237 million to make. So far, it has made around $3 billion in ticket sales, meaning that it has made a huge profit."}],[{"kind":"text","text":"5 Some films aren't very popular with domestic audiences, although they might become big hits internationally."},{"kind":"text","text":"6 Labour costs can be expensive because they not only include the salaries that companies have to pay their workers, but also extra benefits like pension contributions."},{"kind":"text","text":"7 On Wednesday afternoons, my local cinema offers half-price tickets for students. That's quite a generous discount."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 multinational: producing and selling goods in\nseveral countries\n2 goods: things for sale\n3 production costs: the amount of money needed to\nmake something\n4 profit: money that is earned in business after paying the\ncosts of producing and selling something\n5 domestic: relating to a person’s own country\n6 labour: related to work and workers\n7 discount: a reduction in the usual price","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":25,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5786","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":31,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Write down an example for as many of these topics as you can in one minute. Then work with a partner. Take turns giving an example. Can your partner say what the topic is?","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f06e384bd4cfe6a034d6ddff3a9926a17869cdddb2b2634b079bdc29ce4ccaa1.png"],"provided":"- electronic goods\n- a labour cost (not including salaries)\n- a domestic product from your country\n- a multinational company\n- a way of giving a discount\n- a film that has made a large profit in your country\n- a production cost\nRenting office space.\nIs that a production cost?","items":[{"id":"b5786.i01","label":"1","prompt":"electronic goods","options":[],"type":"gap/open"},{"id":"b5786.i02","label":"2","prompt":"a labour cost (not including salaries)","options":[],"type":"gap/open"},{"id":"b5786.i03","label":"3","prompt":"a domestic product from your country","options":[],"type":"gap/open"},{"id":"b5786.i04","label":"4","prompt":"a multinational company","options":[],"type":"gap/open"},{"id":"b5786.i05","label":"5","prompt":"a way of giving a discount","options":[],"type":"gap/open"},{"id":"b5786.i06","label":"6","prompt":"a film that has made a large profit in your country","options":[],"type":"gap/open"},{"id":"b5786.i07","label":"7","prompt":"a production cost","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- electronic goods"},{"kind":"text","text":"- a labour cost (not including salaries)"},{"kind":"text","text":"- a domestic product from your country"},{"kind":"text","text":"- a multinational company"},{"kind":"text","text":"- a way of giving a discount"},{"kind":"text","text":"- a film that has made a large profit in your country"},{"kind":"text","text":"- a production cost"}],[{"kind":"text","text":"Renting office space."},{"kind":"text","text":"Is that a production cost?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"• electronic goods: laptop, fridge, tablet\n• a labour cost (not including salaries):\nstaff training, pension contributions,\nholiday pay\n• a domestic product from your country:\nbeef, potatoes, rice\n• a multinational company: Amazon,\nHonda, Aramco\n• a way of giving a discount: charging a\nlower price for large quantities, giving a\npercentage off the original price\n• a film that has made a large profit in\nyour country: answers will vary\n• a production cost: rent, raw\nmaterials, energy","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5787","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":32,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a presentation on the film industry. Before you listen, discuss the questions with a partner.","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f06e384bd4cfe6a034d6ddff3a9926a17869cdddb2b2634b079bdc29ce4ccaa1.png"],"provided":"1 What are your favourite films? In which countries do you think have they been most successful?\n2 What issues do you think film-makers consider when choosing a location in which to make their films?","items":[{"id":"b5787.i01","label":"1","prompt":"What are your favourite films? In which countries do you think have they been most successful?","options":[],"type":"discuss/open"},{"id":"b5787.i02","label":"2","prompt":"What issues do you think film-makers consider when choosing a location in which to make their films?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 What are your favourite films? In which countries do you think have they been most successful?"},{"kind":"text","text":"2 What issues do you think film-makers consider when choosing a location in which to make their films?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 My favourite films are Studio Ghibli films\nfrom Japan. They’ve been successful\nin Japan, obviously, but they’ve been\ntranslated into several languages and\nsome are very well-known internationally.\n2 They might consider using a particular\nlocation to add interest to a film;\nbecause the story requires a specific\nsetting; because weather conditions\nmight be better for shooting a\nfilm outdoors; because there are\nfinancial benefits.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":26,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U01-question:b5792","book":4,"unit":1,"track":"LS","topic":"GLOBALIZATION","lesson":2,"order":33,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"1.5 Listen to a presentation about the film industry. Number the main ideas in the order they are mentioned. Then listen again and check your answers.","pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/18508bf894b7a9f4cf01773fa8a83594604d44710c866d7ed01616d9676b638f.png"],"provided":"","items":[{"id":"b5792.i01","label":"a","prompt":"____ Hollywood itself has become more multinational.","options":[],"type":"gap/closed"},{"id":"b5792.i02","label":"b","prompt":"____ Films made in Mexico are considered exports.","options":[],"type":"gap/closed"},{"id":"b5792.i03","label":"c","prompt":"____ Canada is sometimes called 'Hollywood North'.","options":[],"type":"gap/closed"},{"id":"b5792.i04","label":"d","prompt":"____ Another popular area for filming is the Middle East.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5792.i01","label":"a","prompt":"____ Hollywood itself has become more multinational.","options":[],"type":"gap/closed"},{"kind":"item","id":"b5792.i02","label":"b","prompt":"____ Films made in Mexico are considered exports.","options":[],"type":"gap/closed"},{"kind":"item"
