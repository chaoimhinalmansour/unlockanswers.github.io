ia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[{"page":148,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4e810c5f51fbf7f4ee5a05523665b07074597345b2ddb7a2034418b77d91f65b.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U07-question:b4745","book":3,"unit":7,"track":"LS","topic":"FASHION","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video and check your ideas in Exercise 2. Then complete the sentence.","pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4e810c5f51fbf7f4ee5a05523665b07074597345b2ddb7a2034418b77d91f65b.png"],"provided":"Christopher Raeburn's fashions are sustainable and ethical because ____","items":[{"id":"b4745.i01","label":"1","prompt":"Christopher Raeburn's fashions are sustainable and ethical because ____","options":[],"type":"choice/closed"}],"layout":"list","references":[{"id":"B03-LS-U07-question:b4742","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[148]}],"materials":[],"coursePages":[[{"kind":"text","text":"Christopher Raeburn's fashions are sustainable and ethical because ____"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/a86eafde431b2ee080e33382-L3LS-U07.mp4","captions":[{"start":1.24,"end":5.46,"text":"Christopher Rayburn is a fashion designer with a\ndifference."},{"start":9.14,"end":14.38,"text":"His clothes are both extremely fashionable and good for\nthe environment too."},{"start":20.6,"end":27.62,"text":"He started making recycled fashion items from old\nmilitary uniforms when he was at university."},{"start":30,"end":31.02,"text":"These days,"},{"start":31.44,"end":35.42,"text":"his recycled brand, Re -Made, is a fashion success."},{"start":35.82,"end":39.84,"text":"And he is now making clothes from other spare military\nmaterials,"},{"start":40.32,"end":42.1,"text":"such as parachute material."},{"start":43.58,"end":45.04,"text":"I'm based here in London,"},{"start":45.7,"end":46.76,"text":"in the East End, Hackney Wick,"},{"start":47.26,"end":50.02,"text":"but originally I'm from Kent, in South East England."},{"start":50.36,"end":55.26,"text":"I never really set out to create an ethical or\nsustainable brand."},{"start":55.26,"end":57.96,"text":"For me it's just more about intelligent use of\nmaterials."},{"start":58.16,"end":62.12,"text":"It's about the fact that I knew I wanted to do my\nproduction here in England."},{"start":62.82,"end":69.06,"text":"And because I love the fabrics and I recycle the\nfabrics, inherently you've already got a very\nsustainable brand."},{"start":69.38,"end":74.12,"text":"Because you are recycling, because you are doing your\nproduction, because you are employing local people."},{"start":78.96000000000001,"end":82.4,"text":"This season we're actually splitting the collection\ninto three sections."},{"start":82.4,"end":85.72,"text":"We have the Re -Made, that everyone hopefully knows and\nloves me for."},{"start":85.94,"end":90.3,"text":"We've got our lightweight fabrics, you know, the\nparachute and waterproof fabrics."},{"start":90.74,"end":95.3,"text":"But this season we're also working in a new British\nsection of the collection."},{"start":95.7,"end":100.5,"text":"And that's very much focused on incredibly good quality\nBritish milled wools."},{"start":102.32,"end":106.12,"text":"We're actually doing my London Fashion Week\npresentation at Aldwych Tube Station."},{"start":106.22,"end":110.74000000000001,"text":"It hasn't actually been used for proper underground\ntrains for ten to 15 years now."},{"start":110.74000000000001,"end":113.16,"text":"So we'll be getting in there and doing a very different\nevent."},{"start":113.42,"end":114.72,"text":"It will be multimedia,"},{"start":115.06,"end":116.56,"text":"I'll be presenting my new film."},{"start":125.1,"end":129.92,"text":"Then for the first time I'll also be working with\nmodels as well, presenting the garments,"},{"start":130.3,"end":131.68,"text":"both men's and women's wear."},{"start":133.6,"end":141.24,"text":"The ideas for Christopher's designs come firstly from\nthe old fabric or piece of clothing he's recycling."},{"start":142.74,"end":146.04,"text":"Then he adds ideas he gets from other places."},{"start":147.12,"end":149.9,"text":"He's particularly interested in the military,"},{"start":150.32,"end":150.76,"text":"adventure,"},{"start":151.34,"end":156.32,"text":"outdoor activities and cultures that come from cold\nplaces like the Inuit."},{"start":156.32,"end":161.88,"text":"He connects all these ideas in the different garments\nin each collection."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"he uses recycled materials\npage147\n1 The woman in the photo is a fashion designer working\nin a studio.\n2-4 See Model Answer  Booklet  p9 for example  answers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9bd592b7ca24f6285fd439fa52530cfef819f35bab4766cf614bff86575b0c6b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U07-question:b4747","book":3,"unit":7,"track":"LS","topic":"FASHION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex": ING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Speaking task","text":"Take part in an interview about attitudes on uniforms."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about a College of Art graduate."},{"label":"Listening skills","text":"Take notes on main ideas and detail; identify auxiliary verbs for emphasis."},{"label":"Critical thinking","text":"Create a purpose statement; evaluate interview questions."},{"label":"Grammar","text":"Talk about recent events and actions using adverbs; make predictions and talk about expectations for the future."},{"label":"Speaking skills","text":"Ask for opinions and check information; ask follow-up questions."}],"photo":{"box":[4,0,445,765],"nativeWidth":772,"sourcePage":147,"alt":"A person with a tape measure working with clothes"}}]}},{"id":"B03-LS-U07-classroom:resource:b4743","book":3,"unit":7,"track":"LS","topic":"FASHION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4e810c5f51fbf7f4ee5a05523665b07074597345b2ddb7a2034418b77d91f65b.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"military","pos":"(adj)","definition":"relating to the army","example":"The museum has a collection of military uniforms.","wordAudio":"military","cardWord":false},{"term":"parachute","pos":"(n)","definition":"a large piece of material that helps you to drop safely from an aircraft","example":"The parachute opened as she fell through the air.","wordAudio":"parachute","cardWord":false},{"term":"production","pos":"(n)","definition":"all the things that you do in order to make a product which you then sell","example":"The factory stopped production for a week.","wordAudio":"production","cardWord":false},{"term":"fabric","pos":"(n)","definition":"cloth, material","example":"This fabric is soft and easy to wash.","wordAudio":"fabric","cardWord":false},{"term":"garment","pos":"(n)","definition":"a piece of clothing","example":"Check the label before you wash the garment.","wordAudio":"garment","cardWord":false}]]}},{"id":"B03-LS-U07-classroom:video","book":3,"unit":7,"track":"LS","topic":"FASHION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4e810c5f51fbf7f4ee5a05523665b07074597345b2ddb7a2034418b77d91f65b.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/a86eafde431b2ee080e33382-L3LS-U07.mp4","captions":[{"start":1.24,"end":5.46,"text":"Christopher Rayburn is a fashion designer with a\ndifference."},{"start":9.14,"end":14.38,"text":"His clothes are both extremely fashionable and good for\nthe environment too."},{"start":20.6,"end":27.62,"text":"He started making recycled fashion items from old\nmilitary uniforms when he was at university."},{"start":30,"end":31.02,"text":"These days,"},{"start":31.44,"end":35.42,"text":"his recycled brand, Re -Made, is a fashion success."},{"start":35.82,"end":39.84,"text":"And he is now making clothes from other spare military\nmaterials,"},{"start":40.32,"end":42.1,"text":"such as parachute material."},{"start":43.58,"end":45.04,"text":"I'm based here in London,"},{"start":45.7,"end":46.76,"text":"in the East End, Hackney Wick,"},{"start":47.26,"end":50.02,"text":"but originally I'm from Kent, in South East England."},{"start":50.36,"end":55.26,"text":"I never really set out to create an ethical or\nsustainable brand."},{"start":55.26,"end":57.96,"text":"For me it's just more about intelligent use of\nmaterials."},{"start":58.16,"end":62.12,"text":"It's about the fact that I knew I wanted to do my\nproduction here in England."},{"start":62.82,"end":69.06,"text":"And because I love the fabrics and I recycle the\nfabrics, inherently you've already got a very\nsustainable brand."},{"start":69.38,"end":74.12,"text":"Because you are recycling, because you are doing your\nproduction, because you are employing local people."},{"start":78.96000000000001,"end":82.4,"text":"This season we're actually splitting the collection\ninto three sections."},{"start":82.4,"end":85.72,"text":"We have the Re -Made, that everyone hopefully knows and\nloves me for."},{"start":85.94,"end":90.3,"text":"We've got our lightweight fabrics, you know, the\nparachute and waterproof fabrics."},{"start":90.74,"end":95.3,"text":"But this season we're also working in a new British\nsection of the collection."},{"start":95.7,"end":100.5,"text":"And that's very much focused on incredibly good quality\nBritish milled wools."},{"start":102.32,"end":106.12,"text":"We're actually doing my London Fashion Week\npresentation at Aldwych Tube Station."},{"start":106.22,"end":110.74000000000001,"text":"It hasn't actually been used for proper underground\ntrains for ten to 15 years now."},{"start":110.74000000000001,"end":113.16,"text":"So we'll be getting in there and doing a very different\nevent."},{"start":113.42,"end":114.72,"text":"It will be multimedia,"},{"start":115.06,"end":116.56,"text":"I'll be presenting my new film."},{"start":125.1,"end":129.92,"text":"Then for the first time I'll also be working with\nmodels as well, presenting the garments,"},{"start":130.3,"end":131.68,"text":"both men's and women's wear."},{"start":133.6,"end":141.24,"text":"The ideas for Christopher's designs come firstly from\nthe old fabric or piece of clothing he's recycling."},{"start":142.74,"end":146.04,"text":"Then he adds ideas he gets from other places."},{"start":147.12,"end":149.9,"text":"He's particularly interested in the military,"},{"start":150.32,"end":150.76,"text":"adventure,"},{"start":151.34,"end":156.32,"text":"outdoor activities and cultures that come from cold\nplaces like the Inuit."},{"start":156.32,"end":161.88,"text":"He connects all these ideas in the different garments\nin each collection."}],"launchInline":true}},{"id":"B03-LS-U07-classroom:resource:b4753","book":3,"unit":7,"track":"LS","topic":"FASHION","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e0cf11eaa3e52362585947793d601747a9d83e2e2e1f70237b56c7f29dd6ec63.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["convert (v) to change something into something else\ncollaborate (v) to work with somebody for a special purpose\ncriticize (v) to express that you believe something or somebody is bad\ncopyright (n) the legal right to control the use of a design, an artwork, a piece of music, etc.","ethical (adj) something that meets society's standards of acceptable and honest behaviour\nfocus on (phr v) to give a lot of attention to one subject or thing\nimage (n) a picture or photograph\npractical (adj) able to be done or put into action"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-LS-U07-classroom:resource:b4755","book":3,"unit":7,"track":"LS","topic":"FASHION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105 function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}

  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);

 }

}

 }

function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);

function measure(doc){

 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");

  if(outside(panel,box))return true;

  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);

 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
