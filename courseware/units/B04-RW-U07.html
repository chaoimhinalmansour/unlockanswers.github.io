st about feeding people's appetites, it is a passion and an expression of their artistry, just as an artist would do."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Many chefs regard themselves as artists and they see\ncooking very much as a creative process when they are\nmaking a dish. Several Michelin star chefs have defended\nthis claim by stating that their food can cause people to\nhave an emotional reaction,\njust as art can cause people to have an emotional\nreaction. Further to this, they say that a dish is prepared","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7325","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":35,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read each pair of arguments and circle the stronger argument. Explain why you think the other argument is weaker.","pages":[164],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8a4a5de7773ed2b99458bf65caa722b40e96fdfd0c34e77c220628756202c8da.png"],"provided":"","items":[{"id":"b7325.i01","label":"1","prompt":"Circle the stronger argument, then explain why the other is weaker.","options":["Video games have visual effects, so I think they can be considered as art.","Some video games can cause a great emotional response from the player, and this is at the root of all art forms."],"type":"choice/closed"},{"id":"b7325.i02","label":"2","prompt":"Circle the stronger argument, then explain why the other is weaker.","options":["Fashion is art because fashion designers have to make decisions about colour.","Fashion design is an art form because it has influenced culture and different trends over time."],"type":"choice/closed"},{"id":"b7325.i03","label":"3","prompt":"Circle the stronger argument, then explain why the other is weaker.","options":["Students should study art because, in my opinion, it is fun to create art.","Students should study art because it has been linked with general success in other subject areas."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7325.i01","label":"1","prompt":"Circle the stronger argument, then explain why the other is weaker.","options":["Video games have visual effects, so I think they can be considered as art.","Some video games can cause a great emotional response from the player, and this is at the root of all art forms."],"type":"choice/closed"},{"kind":"item","id":"b7325.i02","label":"2","prompt":"Circle the stronger argument, then explain why the other is weaker.","options":["Fashion is art because fashion designers have to make decisions about colour.","Fashion design is an art form because it has influenced culture and different trends over time."],"type":"choice/closed"}],[{"kind":"item","id":"b7325.i03","label":"3","prompt":"Circle the stronger argument, then explain why the other is weaker.","options":["Students should study art because, in my opinion, it is fun to create art.","Students should study art because it has been linked with general success in other subject areas."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 a weaker b stronger; There is a stronger rationale for b.\n2 a weaker b stronger; There is a stronger rationale for b.\n3 a weaker b stronger; a is too subjective and not\nevidence-based like the other statement.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":59,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7328","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":36,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Work with a partner. Complete these counter-argument and refutation sentences in a way which makes sense.","pages":[165],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3216c8b33e3d8c8a122bbaec96316cdcf260b97b33314e96a3dcc3f5fb44d8da.png"],"provided":"","items":[{"id":"b7328.i01","label":"1","prompt":"Critics of mandatory art education say that art is not as important as academic subjects. Even though that might be true, ____.","options":[],"type":"gap/open"},{"id":"b7328.i02","label":"2","prompt":"Some people believe that art is only for the rich. However, ____.","options":[],"type":"gap/open"},{"id":"b7328.i03","label":"3","prompt":"Opponents of public funding for art ____. Nevertheless, public art beautifies our town and enriches our community culture.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7328.i01","label":"1","prompt":"Critics of mandatory art education say that art is not as important as academic subjects. Even though that might be true, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b7328.i02","label":"2","prompt":"Some people believe that art is only for the rich. However, ____.","options":[],"type":"gap/open"},{"kind":"item","id":"b7328.i03","label":"3","prompt":"Opponents of public funding for art ____. Nevertheless, public art beautifies our town and enriches our community culture.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Critics of mandatory art education say\nthat art is not as important as academic\nsubjects. Even though that might be\ntrue, art education is still important\nsince it encourages students to use\ntheir creativity.\n2 Some people believe that art is only for\nthe rich. However, all people should be\nable to see great art.\n3 Opponents of public funding for\nart think that it is not a good use of\npublic money. Nevertheless, public art\nbeautifies our town and enriches our\ncommunity culture.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7329","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the arguments and counter-arguments and give a refutation.","pages":[165],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3216c8b33e3d8c8a122bbaec96316cdcf260b97b33314e96a3dcc3f5fb44d8da.png"],"provided":"","items":[{"id":"b7329.i01","label":"","prompt":"Refutation: ____","options":[],"type":"gap/open"},{"id":"b7329.i02","label":"","prompt":"Refutation: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7329.i01","label":"","prompt":"Refutation: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7329.i02","label":"","prompt":"Refutation: ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U07-resource:b7324","title":"Arguments","pages":[164],"text":"Arguments\nIn academic writing, it is important to know how to create an effective argument. Using facts, statistics or other kinds of examples will make your argument more convincing. Also, the logic of your argument should be clear.\n\nHere is an example of a weak argument:\nThis painting is not good because I don't like it.\nThis argument is weak because it does not contain any evidence and only gives the writer's opinion.\n\nHere is an example of a stronger argument:\nThis painting is not good because it does not evoke any emotion for me, and I find the subject matter dull. For example, the painting next to it is a much livelier piece and I really feel a connection to the theme of the painting.\nThis argument is much stronger because the writer has added an example and logic to their argument.","screens":["Arguments","In academic writing, it is important to know how to create an effective argument. Using facts, statistics or other kinds of examples will make your argument more convincing. Also, the logic of your argument should be clear.","Here is an example of a weak argument:","This painting is not good because I don't like it.","This argument is weak because it does not contain any evidence and only gives the writer's opinion.","Here is an example of a stronger argument:","This painting is not good because it does not evoke any emotion for me, and I find the subject matter dull. For example, the painting next to it is a much livelier piece and I really feel a connection to the theme of the painting.","This argument is much stronger because the writer has added an example and logic to their argument."],"sources":[{"page":164,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8a4a5de7773ed2b99458bf65caa722b40e96fdfd0c34e77c220628756202c8da.png"}],"kind":"resource","sourceBlockIds":["b7324"]},{"id":"B04-RW-U07-resource:b7327","title":"Counter-arguments and refutations","pages":[165],"text":"You can strengthen your argument by giving a counter-argument and a refutation. By presenting the counter-argument, you show that you have considered another point of view. By refuting it with reasons and evidence, you show why the counter-argument does not weaken your own point of view.\n\nConsider this argument:\n\nPhotography is a useful medium, but it is not art.\n\nThe writer follows this with a counter-argument:\n\nIt is true that photography and fine art have some things in common.\n\nThen the writer gives a refutation. Refuting the counter-argument shows the strength of the writer's position:\n\nHowever, it is still the case that using your hands to create art requires more imagination than using a mechanical device.\n\nThe phrase 'However, it is still the case that …' indicates the author's argument is still valid.","screens":["You can strengthen your argument by giving a counter-argument and a refutation. By presenting the counter-argument, you show that you have considered another point of view. By refuting it with reasons and evidence, you show why the counter-argument does not weaken your own point of view.","Consider this argument:","Photography is a useful medium, but it is not art.","The writer follows this with a counter-argument:","It is true that photography and fine art have some things in common.","Then the writer gives a refutation. Refuting the counter-argument shows the strength of the writer's position:","However, it is still the case that using your hands to create art requires more imagination than using a mechanical device.","The phrase 'However, it is still the case that …' indicates the author's argument is still valid."],"sources":[{"page":165,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3216c8b33e3d8c8a122bbaec96316cdcf260b97b33314e96a3dcc3f5fb44d8da.png"}],"kind":"resource","sourceBlockIds":["b7327"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 However, just because music is not visual\nit doesn’t mean to say it can’t have\nan impact.\n2 Just because something violates the law,\nthis does not mean that creativity and\nartistry have not gone into the work.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7330","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":38,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Work in pairs. Compare your answers and refutations. Do 09907f6752ac9b5b1a8b9b7fd9e1c6e1920dcb1696b25581c2ec9fe31.png"],"sourceHashes":["3c7d2f509907f6752ac9b5b1a8b9b7fd9e1c6e1920dcb1696b25581c2ec9fe31"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write an argumentative essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about an art district in Beijing."},{"label":"Reading skill","text":"Scan to find information."},{"label":"Critical thinking","text":"Understand and evaluate analogies."},{"label":"Grammar","text":"Paraphrase quotations; use substitution; use ellipsis."},{"label":"Academic writing skill","text":"Write arguments, counter-arguments and refutations."}],"photo":{"box":[1107,977,1791,3076],"nativeWidth":3040,"sourcePage":146,"alt":""}}]}},{"id":"B04-RW-U07-classroom:resource:b7260","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e81d97a01665a3974e2b1e322c27f68f702c3568be4c4c7a5c712f7c647c7c77.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"state-run","pos":"(adj)","definition":"operated by the government","example":"The documentary aired on a state-run television channel.","wordAudio":"state-run","cardWord":false},{"term":"present a ... face","pos":"(phr)","definition":"give a impression","example":"The company tried to present a friendlier face to the public.","wordAudio":"present a ... face","cardWord":false},{"term":"mainstream arts scene","pos":"(phr)","definition":"the places and ways in which well-known artists usually work and exhibit their work","example":"Street artists began gaining recognition in the mainstream arts scene.","wordAudio":"mainstream arts scene","cardWord":false},{"term":"struggling artist","pos":"(n)","definition":"an artist who works hard but whose work is not well known","example":"As a struggling artist, she could rarely afford to rent a studio.","wordAudio":"struggling artist","cardWord":false}]]}},{"id":"B04-RW-U07-classroom:video","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e81d97a01665a3974e2b1e322c27f68f702c3568be4c4c7a5c712f7c647c7c77.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/9b3cb2382df685321ef23c39-L4RW-U07.mp4","captions":[{"start":0,"end":5.3,"text":"This was once a vast, state -run military factory on\nthe outskirts of Beijing,"},{"start":5.94,"end":8.52,"text":"employing as many as 20 ,000 workers,"},{"start":9.3,"end":11,"text":"complete with housing for the workers,"},{"start":11.72,"end":12.88,"text":"athletics facilities,"},{"start":13.38,"end":13.98,"text":"a hospital,"},{"start":14.4,"end":15.88,"text":"and even its own orchestra."},{"start":18.3,"end":20.58,"text":"But that was the 1950s."},{"start":21.08,"end":21.58,"text":"Today,"},{"start":21.98,"end":27.02,"text":"this factory complex presents a more peaceful and\ndramatically different face."},{"start":28.12,"end":36.28,"text":"798 Art Zone became a space where artists could live\nand create art in a supportive community that included\npainters,"},{"start":37,"end":37.76,"text":"sculptors,"},{"start":38.3,"end":39.14,"text":"fashion designers,"},{"start":39.58,"end":41.82,"text":"photographers and film directors."},{"start":43.34,"end":46.06,"text":"It attracted well -known Chinese artists,"},{"start":46.54,"end":47.28,"text":"such as C .A."},{"start":47.3,"end":48.04,"text":"Zhang Guo,"},{"start":48.44,"end":51.02,"text":"whose dinosaurs are popular with visitors."},{"start":52.72,"end":59.6,"text":"Visitors stopped to examine and photograph these red\nmetal men, not quite sure if they are singing,\nshouting,"},{"start":60.26,"end":61.4,"text":"staring in surprise,"},{"start":61.8,"end":64.06,"text":"or just hoping to catch some raindrops."},{"start":66.48,"end":69.12,"text":"Although the Art Zone began as a place for outsiders,"},{"start":69.76,"end":72.86,"text":"artists whose work was not seen in traditional museums,"},{"start":73.36,"end":76.02,"text":"it has become a part of the mainstream art scene,"},{"start":76.48,"end":81,"text":"a popular attraction with both local visitors and\ninternational tourists."},{"start":81.86,"end":83.92,"text":"The centre hosts art exhibitions,"},{"start":84.6,"end":87.1,"text":"annual film festivals, fashion shows,"},{"start":87.68,"end":89.52,"text":"art auctions and theatre productions,"},{"start":90.2,"end":93.68,"text":"and it has all the services common to other tourist\ndestinations,"},{"start":94.34,"end":96.52000000000001,"text":"including gift shops and cafes,"},{"start":97.06,"end":97.74000000000001,"text":"like this one,"},{"start":98.24000000000001,"end":104.14,"text":"located in an old train station that used to transport\nmaterials to and from the original factory."},{"start":105.08,"end":106.24000000000001,"text":"It's free to the public,"},{"start":106.72,"end":110.56,"text":"and tens of thousands of visitors enjoy the centre\nevery day."},{"start":112.12,"end":113.62,"text":"When it began,"},{"start":114.06,"end":119.41,"text":"the 798 Art Zone provided inexpensive living and\nworkspace for struggling artists."},{"start":120.54,"end":121.88,"text":"Today, the rents are high,"},{"start":122.3,"end":126.26,"text":"and only the most successful artists can afford to show\ntheir work here."},{"start":127.22,"end":130.39,"text":"The struggling artists have moved on to new locations,"},{"start":131.42,"end":134.28,"text":"perhaps to the next 798."}],"launchInline":true}},{"id":"B04-RW-U07-classroom:resource:b7269","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/85a190728ec5dc194121f3dfcb250a740ee38bb3cb3273002fb6439067fd19f7.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["aesthetic (adj) relating to the enjoyment or study of beauty, or showing great beauty\nconceptual (adj) based on ideas or principles\ncontemporary (adj) existing or happening now\ndistinction (n) a difference between similar things","established (adj) generally accepted or familiar; having a long history\nnotion (n) a belief or idea\nsignificance (n) importance"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U07-classroom:material:RW-M03","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[152],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/aae103849701b9c204c786c19cacd384134c9fb881c13aff222d46d4a2131cbb.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"ALL THAT ART IS\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.","sourcePage":152},{"body":"2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.","sourcePage":152},{"body":"3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.","sourcePage":152},{"body":"4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.","sourcePage":152},{"body":"5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","sourcePage":152}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U07-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"ALL THAT ART IS","pages":[{"page":152,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/aae103849701b9c204c786c19cacd384134c9fb881c13aff222d46d4a2131cbb.png","width":3040,"height":4096}],"source":152,"embeddedIn":null,"photo":null,"clearPages":[{"body":"ALL THAT ART IS\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.","sourcePage":152},{"body":"2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.","sourcePage":152},{"body":"3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.","sourcePage":152},{"body":"4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.","sourcePage":152},{"body":"5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","sourcePage":152}],"text":"ALL THAT ART IS\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.\n2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.\n3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.\n4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.\n5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1889e5dc8f2bfc74a779c34f257524f0de679ea454dd11426ebacd3cdb48c9a1.mp3"},"original":{"id":"B04-RW-U07-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U07","book":4,"track":"RW","unit":7,"title":"READING 1","kind":"material","pages":[152],"sourceImages":[{"page":152,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/aae103849701b9c204c786c19cacd384134c9fb881c13aff222d46d4a2131cbb.png","viewEvidenceReported":true}],"text":"ALL THAT ART IS\n\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.\n\n2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.\n\n3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.\n\n4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.\n\n5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b7275"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1889e5dc8f2bfc74a779c34f257524f0de679ea454dd11426ebacd3cdb48c9a1.mp3","continueOnPage":true}},{"id":"B04-RW-U07-classroom:material:RW-M04","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/559ec3f70f921d5908eaee1927cd36ade080fa9309c626060a944e991db04651.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.","sourcePage":155},{"body":"2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.","sourcePage":155},{"body":"3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.","sourcePage":155},{"body":"4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","sourcePage":155}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U07-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/559ec3f70f921d5908eaee1927cd36ade080fa9309c626060a944e991db04651.png","width":3040,"height":4096}],"source":155,"embeddedIn":null,"photo":null,"clearPages":[{"body":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.","sourcePage":155},{"body":"2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.","sourcePage":155},{"body":"3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.","sourcePage":155},{"body":"4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","sourcePage":155}],"text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c6c99b9f73eb7ec8c5702ed624b79dd772de74d0ce48e70077c7409aa2689ce.mp3"},"original":{"id":"B04-RW-U07-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U07","book":4,"track":"RW","unit":7,"title":"READING 2","kind":"material","pages":[155],"sourceImages":[{"page":155,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/559ec3f70f921d5908eaee1927cd36ade080fa9309c626060a944e991db04651.png","viewEvidenceReported":true}],"text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b7291"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c6c99b9f73eb7ec8c5702ed624b79dd772de74d0ce48e70077c7409aa2689ce.mp3","continueOnPage":true}},{"id":"B04-RW-U07-classroom:review-1","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[167],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/967a701ac0fc40579206268287f3e66bf1e92a14aebbfe19c8be5c865d5225c4.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B04-RW-U07-B-001","form":"abstract","page":167},{"id":"B04-RW-U07-B-003","form":"aesthetic","page":167},{"id":"B04-RW-U07-B-004","form":"avant-garde","page":167},{"id":"B04-RW-U07-B-005","form":"conceptual","page":167},{"id":"B04-RW-U07-B-006","form":"contemporary","page":167},{"id":"B04-RW-U07-B-008","form":"distinction","page":167},{"id":"B04-RW-U07-B-009","form":"established","page":167},{"id":"B04-RW-U07-B-010","form":"expressive","page":167},{"id":"B04-RW-U07-B-011","form":"figurative","page":167},{"id":"B04-RW-U07-B-012","form":"lifelike","page":167},{"id":"B04-RW-U07-B-015","form":"moving","page":167},{"id":"B04-RW-U07-B-016","form":"notion","page":167},{"id":"B04-RW-U07-B-019","form":"significance","page":167}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U07-classroom:review-2","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"module":"Vocabulary Review","context":{"moduleL
