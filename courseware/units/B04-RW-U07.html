 the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B04-RW-U07-question:b7264":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"Years ago, Art Zone 798 was a (1) __. In the 1990s, after the buildings were abandoned, (2) __ began to move in. It was the perfect space for the (3) __ that many of these artists created. Many different kinds of artists worked at Art Zone 798, including (4) __, fashion designers, photographers and film directors. Soon, more well-known artists began to display their work there, and the centre became (5) __ with tourists and local visitors. In addition to the art work, there are services for visitors, including (6) __. Struggling artists can no longer (7) __ in Art Zone 798. They have moved to (8) __.","values":["military factory","artists","large works of art","painters, sculptors","popular","gift shops and cafés","afford to work","new locations"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U07-classroom:material:RW-M03":[{"body":"ALL THAT ART IS\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or","sourcePage":152,"blocks":[{"kind":"text","text":"ALL THAT ART IS"},{"kind":"text","text":"1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or"}]},{"body":"that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.","sourcePage":152,"blocks":[{"kind":"text","text":"that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored."}]},{"body":"2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something","sourcePage":152,"blocks":[{"kind":"text","text":"2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something"}]},{"body":"which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather","sourcePage":152,"blocks":[{"kind":"text","text":"which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather"}]},{"body":"than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.","sourcePage":152,"blocks":[{"kind":"text","text":"than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful."}]},{"body":"3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama","sourcePage":152,"blocks":[{"kind":"text","text":"3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama"}]},{"body":"created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their","sourcePage":152,"blocks":[{"kind":"text","text":"created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their"}]},{"body":"art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.","sourcePage":152,"blocks":[{"kind":"text","text":"art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'."}]},{"body":"4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China","sourcePage":152,"blocks":[{"kind":"text","text":"4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China"}]},{"body":"in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.","sourcePage":152,"blocks":[{"kind":"text","text":"in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them."}]},{"body":"5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","sourcePage":152,"blocks":[{"kind":"text","text":"5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach."}]}],"B04-RW-U07-classroom:material:RW-M04":[{"body":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a","sourcePage":155,"blocks":[{"kind":"text","text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a"}]},{"body":"significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.","sourcePage":155,"blocks":[{"kind":"text","text":"significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art."}]},{"body":"2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the","sourcePage":155,"blocks":[{"kind":"text","text":"2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the"}]},{"body":"American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets,","sourcePage":155,"blocks":[{"kind":"text","text":"American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets,"}]},{"body":"whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.","sourcePage":155,"blocks":[{"kind":"text","text":"whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist."}]},{"body":"3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the","sourcePage":155,"blocks":[{"kind":"text","text":"3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the"}]},{"body":"photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted","sourcePage":155,"blocks":[{"kind":"text","text":"photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted"}]},{"body":"that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.","sourcePage":155,"blocks":[{"kind":"text","text":"that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone."}]},{"body":"4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography","sourcePage":155,"blocks":[{"kind":"text","text":"4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography"}]},{"body":"is a medium that can be used to make art, but that does not mean that all photography is art.","sourcePage":155,"blocks":[{"kind":"text","text":"is a medium that can be used to make art, but that does not mean that all photography is art."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to univers ction":""},"b7277.i08":{"mode":"status","answer":"F","correction":"Damien Hirst’s assistants produce his art, although the ideas are his own."}},"basis":"教材第 153 页与教师书 PDF 第 56 页。原判断句保留，并补回 DNS 和三个订正。","itemPatches":{"b7277.i01":{"options":[]},"b7277.i02":{"options":[]},"b7277.i03":{"options":[]},"b7277.i04":{"options":[]},"b7277.i05":{"options":[]},"b7277.i06":{"options":[]},"b7277.i07":{"options":[]},"b7277.i08":{"options":[]}},"rewriteKey":""},"B04-RW-U07-question:b7297":{"rows":{},"basis":"实页复验发现同组选项被重复列在每个小题后。按原教材保留题干、编号和字母对应，完整选项通过材料窗调出，原答位揭示配对字母。","displayPages":[[{"id":"b7297.i01","label":"1","prompt":"There's no reason for a great photograph to be any cheaper than a great painting. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"c"}},{"id":"b7297.i02","label":"2","prompt":"Even a child could take a great picture of that view. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"d"}},{"id":"b7297.i03","label":"3","prompt":"There's a lot more skill to making a picture than just pointing a camera at something and clicking. It's something that I create. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"a"}}],[{"id":"b7297.i04","label":"4","prompt":"Most of us would just walk by and not notice something that could make a fabulous photo. And even if we did notice we probably wouldn't know how to take a photo that would stir other people's feelings. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"e"}},{"id":"b7297.i05","label":"5","prompt":"Sometimes you just see something that will make a great picture and the light is perfect and you have your camera with you. At other times, nothing seems to be right. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"b"}}]],"materials":[{"id":"B04-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","screens":["The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.","2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.","3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.","4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art."],"sources":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/559ec3f70f921d5908eaee1927cd36ade080fa9309c626060a944e991db04651.png","width":3040,"height":4096}],"kind":"reading"},{"id":"B04-RW-U07-question:b7297:review-options","title":"Options","screens":["a Ansel Adams","b Henri Cartier-Bresson","c Andreas Gursky","d The author of the essay","e Someone who believes photography is art"],"sources":[]}],"rewriteKey":""},"B04-RW-U07-question:b7325":{"rows":{"b7325.i01":{"mode":"choice","option":1,"note":"The second argument gives a reason about emotional impact."},"b7325.i02":{"mode":"choice","option":1,"note":"The second argument gives a reason about design as a creative process."},"b7325.i03":{"mode":"choice","option":1,"note":"The second argument supports the claim with evidence."}},"basis":"教材第 164 页与教师书 PDF 第 59 页。","rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its ,"然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-RW-U07":{"aspect":1.9472617,"cues":[[0,5.3,"This was once a vast, state -run military factory on the outskirts of Beijing,","这曾经是北京市郊的一家大型国营军工厂"],[5.94,8.52,"employing as many as 20 ,000 workers,","雇用多达20 000名工人，"],[9.3,11,"complete with housing for the workers,","完成为工人 function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){

  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);

function wireMaterials(doc,c,decks){

async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;

 current=i;part=p;

  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const checked=[];
 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
function inspectOriginalButton(button){

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};

  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
