 Zone became a space where artists could live\nand create art in a supportive community that included\npainters,"},{"start":37,"end":37.76,"text":"sculptors,"},{"start":38.3,"end":39.14,"text":"fashion designers,"},{"start":39.58,"end":41.82,"text":"photographers and film directors."},{"start":43.34,"end":46.06,"text":"It attracted well -known Chinese artists,"},{"start":46.54,"end":47.28,"text":"such as C .A."},{"start":47.3,"end":48.04,"text":"Zhang Guo,"},{"start":48.44,"end":51.02,"text":"whose dinosaurs are popular with visitors."},{"start":52.72,"end":59.6,"text":"Visitors stopped to examine and photograph these red\nmetal men, not quite sure if they are singing,\nshouting,"},{"start":60.26,"end":61.4,"text":"staring in surprise,"},{"start":61.8,"end":64.06,"text":"or just hoping to catch some raindrops."},{"start":66.48,"end":69.12,"text":"Although the Art Zone began as a place for outsiders,"},{"start":69.76,"end":72.86,"text":"artists whose work was not seen in traditional museums,"},{"start":73.36,"end":76.02,"text":"it has become a part of the mainstream art scene,"},{"start":76.48,"end":81,"text":"a popular attraction with both local visitors and\ninternational tourists."},{"start":81.86,"end":83.92,"text":"The centre hosts art exhibitions,"},{"start":84.6,"end":87.1,"text":"annual film festivals, fashion shows,"},{"start":87.68,"end":89.52,"text":"art auctions and theatre productions,"},{"start":90.2,"end":93.68,"text":"and it has all the services common to other tourist\ndestinations,"},{"start":94.34,"end":96.52000000000001,"text":"including gift shops and cafes,"},{"start":97.06,"end":97.74000000000001,"text":"like this one,"},{"start":98.24000000000001,"end":104.14,"text":"located in an old train station that used to transport\nmaterials to and from the original factory."},{"start":105.08,"end":106.24000000000001,"text":"It's free to the public,"},{"start":106.72,"end":110.56,"text":"and tens of thousands of visitors enjoy the centre\nevery day."},{ n has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.\n2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.\n3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.\n4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.\n5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","screens":["ALL THAT ART IS\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could eading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1889e5dc8f2bfc74a779c34f257524f0de679ea454dd11426ebacd3cdb48c9a1.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 I don’t think that art has to have a\npurpose. It can just be beautiful.\nThat doesn’t mean that it has to be\nbeautiful though.\n2 Yes, I think that some video games\nshould be classified as art. Some of the\nscenery in video games is incredibly\ndetailed and intricate, it is like looking at\nan amazing painting.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7283","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"order":14,"module":"READING 1","ex":"7","context":{"moduleLabel":"READING 1","phaseTitle":"DISCUSSION"},"instruction":"Choose one of the artists in Reading 1. Write a paragraph saying whether you agree or disagree with their view of what art is.","pages":[153],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/859c8dbae47d731d490703bc5d5e75872dadf60  artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.\n3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.\n4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.\n5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","screens":["ALL THAT ART IS\n1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.","2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.","3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.","4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.","5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach."],"sources":[{"page":152,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/aae103849701b9c204c786c19cacd384134c9fb881c13aff222d46d4a2131cbb.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1889e5dc8f2bfc74a779c34f257524f0de679ea454dd11426ebacd3cdb48c9a1.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"I agree with Banksy’s view of art. He\nbelieves that art should be available to\neveryone, not just the wealthy. His street\nart reflects this belief. By creating artworks\non building walls in public areas, Banksy\nchallenges traditional art institutions and\ncommercial galleries. His work is free to\nview, which encourages people to engage\nwith art in everyday settings.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7303","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"order":15,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Read the quotations and write sentences paraphrasing them. Your paraphrase should include the suggested language.","pages":[158],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d56b3291488b7ad540869b59d0ff0c7da865d9dd85f375fea06f1fa4993ca363.png"],"provided":"Example:\n'A picture is worth a thousand words.' – Napoleon Bonaparte (use the verb explain)\nNapoleon Bonaparte explained that a picture could tell us the same as a thousand words could.","items":[{"id":"b7303.i01","label":"1","prompt":"'A picture is a poem without words.' – Horace (use the reporting verb pointed out and a synonym phrase for poem)","options":[],"type":"gap/open"},{"id":"b7303.i02","label":"2","prompt":"'Creativity takes courage.' – Henri Matisse (use the reporting verb felt and an antonym for courage)","options":[],"type":"gap/open"},{"id":"b7303.i03","label":"3","prompt":"'The painter has the universe in his mind and hands.' – Leonardo da Vinci (use the reporting verb state and sequence the ideas differently)","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Example:"},{"kind":"text","text":"'A picture is worth a thousand words.' – Napoleon Bonaparte (use the verb explain)"},{"kind":"text","text":"Napoleon Bonaparte explained that a picture could tell us the same as a thousand words could."},{"kind":"item","id":"b7303.i01","label":"1","prompt":"'A picture is a poem without words.' – Horace (use the reporting verb pointed out and a synonym phrase for poem)","options":[],"type":"gap/open"},{"kind":"item","id":"b7303.i02","label":"2","prompt":"'Creativity takes courage.' – Henri Matisse (use the reporting verb felt and an antonym for courage)","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7303.i03","label":"3","prompt":"'The painter has the universe in his mind and hands.' – Leonardo da Vinci (use the reporting verb state and sequence the ideas differently)","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Horace pointed out that a picture is like\na work of literature without words.\n2 Henri Matisse felt that being creative\nrequired overcoming cowardice.\n3 Leonardo da Vinci stated that a painter\nuses his or her mind and hands to paint\nunlimited subjects.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7304","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"order":16,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Paraphrase the quotations using the strategies given opposite.","pages":[159],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/12d3774b316228d672f546d95254a4211bff3f4c68f11c58b944f7c4938de8ff.png"],"provided":"1 'Creativity is the power to connect the seemingly unconnected.' – William Plomer\n2 'I fight pain, anxiety and fear every day, and the only method I have found that relieves my illness is to keep creating art.' – Yayoi Kusama\n3 'Art enables us to find ourselves and lose ourselves at the same time.' – Thomas Merton","items":[{"id":"b7304.i01","label":"1","prompt":"'Creativity is the power to connect the seemingly unconnected.' – William Plomer","options":[],"type":"gap/open"},{"id":"b7304.i02","label":"2","prompt":"'I fight pain, anxiety and fear every day, and the only method I have found that relieves my illness is to keep creating art.' – Yayoi Kusama","options":[],"type":"gap/open"},{"id":"b7304.i03","label":"3","prompt":"'Art enables us to find ourselves and lose ourselves at the same time.' – Thomas Merton","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 'Creativity is the power to connect the seemingly unconnected.' – William Plomer"},{"kind":"text","text":"2 'I fight pain, anxiety and fear every day, and the only method I have found that relieves my illness is to keep creating art.' – Yayoi Kusama"},{"kind":"text","text":"3 'Art enables us to find ourselves and lose ourselves at the same time.' – Thomas Merton"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Creativity involves making connections\nbetween things or ideas that do not\nseem to be connected at first.\n2 Creating art helps me feel better when I\nam feeling bad.\n3 When we create art, we can understand\nourselves better and we can also escape\nfrom our usual identity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7305","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"In pairs discuss these quotes. Which ones do you agree or disagree with?","pages":[159],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/12d3774b316228d672f546d95254a4211bff3f4c68f11c58b944f7c4938de8ff.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I agree with the first two quotes. I think\nthat creativity involves making connections\nbetween things that don’t seem to be\nconnected at first. And I think that creating\nart can be a type of therapy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7307","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3956c74cc87c84f565738732110965c36a443e336d1c8f979798650e681e940f.png"],"provided":"","items":[{"id":"b7289.i01","label":"1","prompt":"What does Ansel Adams say about photography?","options":[],"type":"qa/open"},{"id":"b7289.i02","label":"2","prompt":"According to Henri Cartier-Bresson what is the key to taking a successful photograph?","options":[],"type":"qa/open"},{"id":"b7289.i03","label":"3","prompt":"Why was Edward Steichen able to sell his photograph for a substantial amount of money?","options":[],"type":"qa/open"},{"id":"b7289.i04","label":"4","prompt":"According to the text, what other roles can photography have?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7289.i01","label":"1","prompt":"What does Ansel Adams say about photography?","options":[],"type":"qa/open"},{"kind":"item","id":"b7289.i02","label":"2","prompt":"According to Henri Cartier-Bresson what is the key to taking a successful photograph?","options":[],"type":"qa/open"},{"kind":"item","id":"b7289.i03","label":"3","prompt":"Why was Edward Steichen able to sell his photograph for a substantial amount of money?","options":[],"type":"qa/open"},{"kind":"item","id":"b7289.i04","label":"4","prompt":"According to the text, what other roles can photography have?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B04-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","screens":["The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.","2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.","3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.","4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art."],"sources":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/559ec3f70f921d5908eaee1927cd36ade080fa9309c626060a944e991db04651.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c6c99b9f73eb7ec8c5702ed62 dely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 ... he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph.\n5 ... no one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n\nParaphrases\na The value of a photograph comes from the natural world, not from the skill of the person holding the camera.\nb ____ ____\nc ____\nd ____\ne ____","items":[{"id":"b7294.i01","label":"b","prompt":"b ____ ____","options":["The value of a photograph comes from the natural world, not from the skill of the person holding the camera.","____ ____"],"type":"choice/closed"},{"id":"b7294.i02","label":"c","prompt":"c ____","options":["The value of a photograph comes from the natural world, not from the skill of the person holding the camera.","____ ____"],"type":"choice/closed"},{"id":"b7294.i03","label":"d","prompt":"d ____","options":["The value of a photograph comes from the natural world, not from the skill of the person holding the camera.","____ ____"],"type":"choice/closed"},{"id":"b7294.i04","label":"e","prompt":"e ____","options":["The value of a photograph comes from the natural world, not from the skill of the person holding the camera.","____ ____"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Original statements"},{"kind":"text","text":"1 ... any beauty that is perceived in the picture is the beauty of the time and place where it was taken, and it is not the creation of the photographer."},{"kind":"text","text":"2 ... there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking."},{"kind":"text","text":"3 ... photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone."}],[{"kind":"text","text":"4 ... he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph."},{"kind":"text","text":"5 ... no one would likely pay that much for a photograph unless the photographer presented himself as an artist."},{"kind":"text","text":"Paraphrases"},{"kind":"text","text":"a The value of a photograph comes from the natural world, not from the skill of the person holding the camera."},{"kind":"text","text":"b ____ ____"}],[{"kind":"text","text":"c ____"}]],"courseMaterials":[{"id":"B04-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. "https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7297","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":27,"module":"READING 2","ex":"8","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Match the opinions (1–5) to the people (a–e).","pages":[157],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/822b6503e0ad64d2af54b0604f7a763cc5d17cd9d2ce106acbe37be7ee736fa3.png"],"provided":"## Opinions\n1 There's no reason for a great photograph to be any cheaper than a great painting. ____\n2 Even a child could take a great picture of that view. ____\n3 There's a lot more skill to making a picture than just pointing a camera at something and clicking. It's something that I create. ____\n4 Most of us would just walk by and not notice something that could make a fabulous photo. And even if we did notice we probably wouldn't know how to take a photo that would stir other people's feelings. ____\n5 Sometimes you just see something that will make a great picture and the light is perfect and you have your camera with you. At other times, nothing seems to be right. ____\n\n## People\na Ansel Adams\nb Henri Cartier-Bresson\nc Andreas Gursky\nd The author of the essay\ne Someone who believes photography is art","items":[{"id":"b7297.i01","label":"1","prompt":"There's no reason for a great photograph to be any cheaper than a great painting.","options":["Ansel Adams","Henri Cartier-Bresson","Andreas Gursky","The author of the essay","Someone who believes photography is art"],"type":"choice/closed"},{"id":"b7297.i02","label":"2","prompt":"Even a child could take a great picture of that view.","options":["Ansel Adams","Henri Cartier-Bresson","Andreas Gursky","The author of the essay","Someone who believes photography is art"],"type":"choice/closed"},{"id":"b7297.i03","label":"3","prompt":"There's a lot more skill to making a picture than just pointing a camera at something and clicking. It's something that I create.","options":["Ansel Adams","Henri Cartier-Bresson","Andreas Gursky","The author of the essay","Someone who believes photography is art"],"type":"choice/closed"},{"id":"b7297.i04","label":"4","prompt":"Most of us would just walk by and not notice something that could make a fabulous photo. And even if we did notice we probably wouldn't know how to take a photo that would stir other people's feelings.","options":["Ansel Adams","Henri Cartier-Bresson","Andreas Gursky","The author of the essay","Someone who believes photography is art"],"type":"choice/closed"},{"id":"b7297.i05","label":"5","prompt":"Sometimes you just see something that will make a great picture and the light is perfect and you have your camera with you. At other times, nothing seems to be right.","options":["Ansel Adams","Henri Cartier-Bresson","Andreas Gursky","The author of the essay","Someone who believes photography is art"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 There's no reason for a great photograph to be any cheaper than a great painting. ____"},{"kind":"text","text":"2 Even a child could take a great picture of that view. ____"},{"kind":"text","text":"3 There's a lot more skill to making a picture than just pointing a camera at something and clicking. It's something that I create. ____"},{"kind":"text","text":"4 Most of us would just walk by and not notice something that could make a fabulous photo. And even if we did notice we probably wouldn't know how to take a photo that would stir other people's feelings. ____"},{"kind":"text","text":"5 Sometimes you just see something that will make a great picture and the light is perfect and you have your camera with you. At other times, nothing seems to be right. ____"}],[{"kind":"text","text":"a Ansel Adams"},{"kind":"text","text":"b Henri Cartier-Bresson"},{"kind":"text","text":"c Andreas Gursky"},{"kind":"text","text":"d The author of the essay"},{"kind":"text","text":"e Someone who believes photography is art"}]],"courseMaterials":[{"id":"B04-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","screens":["The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clic deo game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.\n\n2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.\n\n3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.\n\n4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows where to look for them.\n\n5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach.","screens":["ALL THAT ART IS","1 What is art? This question has puzzled philosophers and great thinkers for centuries. In fact, there is disagreement about exactly what art is. Most of us would agree that Leonardo da Vinci's Mona Lisa is art, but what about a video game? One dictionary definition states that art is 'making objects, images or music, etc. that are beautiful or that express certain feelings'. This, however, could be regarded as too broad a definition. There are actually a number of different categories of objects and processes under the umbrella term of art which can be explored.","2 Art is typically divided into two areas: fine art (such as painting, sculpture, music and poetry) and applied art (such as pottery, weaving, metalworking, furniture making and calligraphy). However, some claim that the art label can also be attached to car design, fashion, photography, cooking or even sports. Fine art is categorized as something which only has an aesthetic or conceptual function. This point was made over a thousand years ago by the Greek philosopher Aristotle, who wrote, 'The aim of art is to represent not the outward appearance of things but their inward significance'. He noted that artists produced objects, drama and","music which reflected their emotions and ideas, rather than just trying to capture a true image of nature. Andy Warhol, the American artist famous for his Pop Art in the 1960s, once said, 'An artist produces things that people don't need to have'. This is the distinction between fine and applied art. Applied arts require an object to be functional as well as beautiful.","3 In the twentieth century, artists began to challenge the established idea of art. The French artist Marcel Duchamp changed people's notion of what sculpture was, for example, by mounting a bicycle wheel upside down on a stool in 1913 and calling it art. Duchamp said, 'Everything an artist produces is art'. In 2002, Japanese artist Yayoi Kusama created a viewer participation work called The Obliteration Room. In this work, a white room, with white furniture and objects, is covered by visitors with many colourful sticker dots. Today, many people complain about the lack of skill in the production of conceptual artistic objects. Some","contemporary artists use assistants to produce all their art for them. British artist Damien Hirst claims that as long as he had the idea, it is his work. He has compared his art to architecture, saying, 'You have to look at it as if the artist is an architect, and we don't have a problem that great architects don't actually build the houses'.","4 Despite a hundred years of modern art, fine art is still regarded as a preserve of the wealthy. Hirst's works, for example, sell for millions of dollars. Even so, we can see examples of art all around us which are not expensive. Many towns and cities have public art which can be enjoyed by all. Some museums, like the National Art Museum of China in Beijing, are free. Others are free for children and students. Street art is also popular in different neighbourhoods around the world. One British artist, Banksy, has become world famous for unauthorized works of art painted on building walls. These can be viewed at no charge by anyone who knows","where to look for them.","5 Art anthropologist Ellen Dissanayake, in the book What is Art For?, offers one intriguing function of art: 'the heightening of existence'. In other words, art makes our ordinary, everyday lives a little more special. This notion may not apply to all art, but perhaps we can agree that it is a good goal towards which all artists should reach."],"sources":[{"page":152,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/aae103849701b9c204c786c19cacd384134c9fb881c13aff222d46d4a2131cbb.png"}],"kind":"material","sourceBlockIds":["b7275"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c6c99b9f73eb7ec8c5702ed624b79dd772de74d0ce48e70077c7409aa2689ce.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 No, I don’t think they should. It can take\na very long time and a lot of materials to\nmake a painting and that is not the same\nfor photographs. So I think that painting\nshould be worth more.\n2 I strongly agree that photography\ninvolves creativity, and the camera is just\na tool used to express the photographer’s\nvision. Just like a sculptor shapes\nstone with a hammer, a photographer\nmakes choices that they make with the\ncomposition, lighting, and timing.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7311","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Go back to Reading 2 and find examples where the author has a particular opinion, presents an opinion which is different and then explains why the other side is wrong. Complete the table.","pages":[160],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efa086a1e76408efafcc06f2779b309c55a6290f2a24d3f8571b44dede375112.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>Paragraph 1 argument:It cannot be said that photography is unquestionably art.\u003c/td>\u003ctd>Argument against author's opinion:Photography does have features in common with other kinds of art.\u003c/td>\u003ctd>Why the other side is wrong:Pointing a mechanical device at something interesting and pushing a button is not enough to be 'art'.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 2 argument:\u003c/td>\u003ctd>Argument against author's opinion:\u003c/td>\u003ctd>Why the other side is wrong:\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 3 argument:\u003c/td>\u003ctd>Argument against author's opinion:\u003c/td>\u003ctd>Why the other side is wrong:\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7311.i01","label":"1","prompt":"Paragraph 2 argument: ____","options":[],"type":"gap/open"},{"id":"b7311.i02","label":"2","prompt":"Argument against author's opinion (Paragraph 2): ____","options":[],"type":"gap/open"},{"id":"b7311.i03","label":"3","prompt":"Why the other side is wrong (Paragraph 2): ____","options":[],"type":"gap/open"},{"id":"b7311.i04","label":"4","prompt":"Paragraph 3 argument: ____","options":[],"type":"gap/open"},{"id":"b7311.i05","label":"5","prompt":"Argument against author's opinion (Paragraph 3): ____","options":[],"type":"gap/open"},{"id":"b7311.i06","label":"6","prompt":"Why the other side is wrong (Paragraph 3): ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Paragraph 1 argument:It cannot be said that photography is unquestionably art.","header":false,"colspan":1,"rowspan":1},{"text":"Argument against author's opinion:Photography does have features in common with other kinds of art.","header":false,"colspan":1,"rowspan":1},{"text":"Why the other side is wrong:Pointing a mechanical device at something interesting and pushing a button is not enough to be 'art'.","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 2 argument:","header":false,"colspan":1,"rowspan":1},{"text":"Argument against author's opinion:","header":false,"colspan":1,"rowspan":1},{"text":"Why the other side is wrong:","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 3 argument:","header":false,"colspan":1,"rowspan":1},{"text":"Argument against author's opinion:","header":false,"colspan":1,"rowspan":1},{"text":"Why the other side is wrong:","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b7311.i02","label":"2","prompt":"Argument against author's opinion (Paragraph 2): ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7311.i03","label":"3","prompt":"Why the other side is wrong (Paragraph 2): ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7311.i05","label":"5","prompt":"Argument against author's opinion (Paragraph 3): ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U07-material:RW-M04","title":"READING 2","pages":[155],"text":"The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.\n2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.\n3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson, the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.\n4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art.","screens":["The production of fine art is the use of skill and imagination to create aesthetic objects or experiences which can be shared with other people. Photography is thought by some to be a form of fine art because it is made using the same critical and creative process that a painter or sculptor would use. It seems clear, however, that there is a significant difference between creating images by hand – using paint, clay or other tools – and pointing a mechanical device at something interesting and clicking. Although photography does have some features in common with other kinds of art, it cannot be said that photography is unquestionably art.","2 It is true that photography can be appreciated on the same level as other recognized forms of visual art. Sometimes decisions involved in creating a photograph are similar to those made by any other artist. A photograph is not always just a record of the world, but a deliberately created image with its own artistic features. Ansel Adams, the American photographer, commented on this point when he noted that take is not the right verb for a photograph. Instead, he said, one makes a photograph. To this end, there is a growing trend for photographers to call themselves artists. However, we cannot ignore the fact that artists can sell their","pieces in the higher-priced, fine-art markets, whereas photographers usually cannot. A photograph by artist Edward Steichen, for example, recently sold for $11.8 million. No one would likely pay that much for a photograph unless the photographer presented himself as an artist.","3 Although some photography can be abstract, most photographs are basically objective records of a particular place at a particular time. Certainly we can appreciate a beautiful photograph when we see one, but any beauty that is perceived in the picture comes from the time and place where it was taken, and it is not the creation of the photographer. Also, sophisticated and expensive equipment often plays a greater role in the success of a photograph than the photographer's creativity. Even some of the greatest photographers acknowledge that there is a limit to the amount of influence they can have on a final product. Henri Cartier-Bresson,","the famous French photographer, admitted that luck was the most important factor. Finally, photography is so widely used for practical functions that have little or nothing to do with art, such as police work, advertising and news reporting, that it cannot claim to be made for aesthetic purposes alone.","4 People have argued whether photography is art ever since the first photographers shared their work. A photographer may make the same aesthetic choices as a fine artist: subject matter, lighting, colour or even a theme or message. However, cameras can also be purely functional tools, capturing visual records and presenting information. Photography is a medium that can be used to make art, but that does not mean that all photography is art."],"sources":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/559ec3f70f921d5908eaee1927cd36ade080fa9309c626060a944e991db04651.png"}],"kind":"material","sourceBlockIds":["b7291"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Paragraph 2\nargument:\nPhotography\nhas similarities\nto other art,\nbut artists can\nsell their pieces\nin the higher-\npriced, fine-\nart markets,\nwhereas\nphotographers\nusually cannot.\nArgument\nagainst author’s\nopinion:\nA photograph\ncan be a\ndeliberately\ncreated image\nwith its own\nartistic features.\nAs Ansel\nAdams said, we\ndon’t ‘take’ a\nphotograph, we\n‘make it’.\nWhy the other\nside is wrong:\nIt is rare for a\nphotographer to\nget a high price for\nhis/her ‘art’, unlike\nother artists.\nParagraph 3\nargument:\nPhotography\ncannot really be\n‘abstract’ in the\nway that other\nart can.\nArgument\nagainst author’s\nopinion:\nSometimes it\ncan, but not as\neasily.\nWhy the other\nside is wrong:\nBeauty that is\nperceived in a\nphotograph comes\nfrom the time\nand place where\nit was taken, the\nequipment used,\nand luck.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7313","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read the quotations that use analogies. Write S if the quotation supports the idea that fashion, cooking or video games are fine art, or C if it challenges the idea.","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c257303302456d21e0dae02c1f19654b34ec14cb62cedaa14231f3fdfbdab645.png"],"provided":"","items":[{"id":"b7313.i01","label":"1","prompt":"'Unlike art, fashion rarely expresses more than the headlines of history'. – Alice Rawsthorn","options":[],"type":"choice/open"},{"id":"b7313.i02","label":"2","prompt":"'Video games are a unique form of artistic expression through what I call the \"three voices\": the voice of the designer or artist, the voice of the game and its mechanics and the voice of the player'. – Chris Melissinos","options":[],"type":"choice/open"},{"id":"b7313.i03","label":"3","prompt":"'The same amount of artistic expression goes into clothes, a piece of pottery or a painting'. – Zandra Rhodes","options":[],"type":"choice/open"},{"id":"b7313.i04","label":"4","prompt":"'For most gamers, video games represent a loss of those precious hours we have available to make ourselves more cultured, civilized and empathetic'. – Roger Ebert","options":[],"type":"choice/open"},{"id":"b7313.i05","label":"5","prompt":"Cooking 'doesn't involve the sense of transmission of human emotion in the way that the arts at their highest do'. – Denis Dutton","options":[],"type":"choice/open"},{"id":"b7313.i06","label":"6","prompt":"'The art of cooking: it's when you mix craftsmanship at the highest level with creativity'. – Éric Ripert","options":[],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7313.i01","label":"1","prompt":"'Unlike art, fashion rarely expresses more than the headlines of history'. – Alice Rawsthorn","options":[],"type":"choice/open"},{"kind":"item","id":"b7313.i02","label":"2","prompt":"'Video games are a unique form of artistic expression through what I call the \"three voices\": the voice of the designer or artist, the voice of the game and its mechanics and the voice of the player'. – Chris Melissinos","options":[],"type":"choice/open"},{"kind":"item","id":"b7313.i03","label":"3","prompt":"'The same amount of artistic expression goes into clothes, a piece of pottery or a painting'. – Zandra Rhodes","options":[],"type":"choice/open"},{"kind":"item","id":"b7313.i04","label":"4","prompt":"'For most gamers, video games represent a loss of those precious hours we have available to make ourselves more cultured, civilized and empathetic'. – Roger Ebert","options":[],"type":"choice/open"}],[{"kind":"item","id":"b7313.i05","label":"5","prompt":"Cooking 'doesn't involve the sense of transmission of human emotion in the way that the arts at their highest do'. – Denis Dutton","options":[],"type":"choice/open"},{"kind":"item","id":"b7313.i06","label":"6","prompt":"'The art of cooking: it's when you mix craftsmanship at the highest level with creativity'. – Éric Ripert","options":[],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 C 2 S 3 S 4 C 5 C 6 S","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7314","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Complete the sentences. Give reasons for your answers.","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c257303302456d21e0dae02c1f19654b34ec14cb62cedaa14231f3fdfbdab645.png"],"provided":"","items":[{"id":"b7314.i01","label":"1","prompt":"I agree / disagree with Zandra Rhodes's argument that the same amount of artistic expression goes into clothing, pottery and paintings because clothes have to be practical enough to wear.","options":[],"type":"gap/open"},{"id":"b7314.i02","label":"2","prompt":"I agree / disagree with Éric Ripert when he says cooking is the mixture of great craftsmanship with creativity because ...","options":[],"type":"gap/open"},{"id":"b7314.i03","label":"3","prompt":"I agree / disagree with Roger Ebert, who argued that video games make us less civilized and empathetic, because ...","options":[],"type":"gap/open"},{"id":"b7314.i04","label":"4","prompt":"I agree / disagree with Denis Dutton, who suggests that cooking doesn't involve the expression of human emotion in the way that other forms of art do, because ...","options":[],"type":"gap/open"},{"id":"b7314.i05","label":"5","prompt":"I agree / disagree with Chris Melissinos's argument that video games are a unique form of artistic expression because ...","options":[],"type":"gap/open"},{"id":"b7314.i06","label":"6","prompt":"I agree / disagree with Alice Rawsthorn's suggestion that fashion is not a true art form because ...","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7314.i01","label":"1","prompt":"I agree / disagree with Zandra Rhodes's argument that the same amount of artistic expression goes into clothing, pottery and paintings because clothes have to be practical enough to wear.","options":[],"type":"gap/open"},{"kind":"item","id":"b7314.i02","label":"2","prompt":"I agree / disagree with Éric Ripert when he says cooking is the mixture of great craftsmanship with creativity because ...","options":[],"type":"gap/open"},{"kind":"item","id":"b7314.i03","label":"3","prompt":"I agree / disagree with Roger Ebert, who argued that video games make us less civilized and empathetic, because ...","options":[],"type":"gap/open"},{"kind":"item","id":"b7314.i04","label":"4","prompt":"I agree / disagree with Denis Dutton, who suggests that cooking doesn't involve the expression of human emotion in the way that other forms of art do, because ...","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7314.i05","label":"5","prompt":"I agree / disagree with Chris Melissinos's argument that video games are a unique form of artistic expression because ...","options":[],"type":"gap/open"},{"kind":"item","id":"b7314.i06","label":"6","prompt":"I agree / disagree with Alice Rawsthorn's suggestion that fashion is not a true art form because ...","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 I agree … because good chefs have\ntechnical skill and knowledge of cooking\nbut they create new dishes all the time.\n3 I disagree … because some games can\nopen up new worlds of imagination or of\nhistory and can require cooperation with\nother players.\n4 I disagree …because when you are\ncooking traditional foods from your\nculture, or cooking for family and\nfriends, you are showing your love to\nthose people and things.\n5 I disagree … because all artists create\nwork from different materials or tools\nthat are then perceived by the audience\nin different ways.\n6 I agree because … although some\ndesigners create avant-garde clothes for\nfasion shows, most fashion design is just\nabout creating functional items.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7315","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Can you think of any analogies of your own related to the essay question?","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c257303302456d21e0dae02c1f19654b34ec14cb62cedaa14231f3fdfbdab645.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U07-resource:b7312","title":"Understanding and evaluating analogies","pages":[160],"text":"Understanding and evaluating analogies\n\nAn analogy is a comparison between two things, often used to help explain a principle or idea. They might seem to have no clear relationship, but by focusing on particular factors, interesting similarities can be identified. An example might be how a doctor and a detective approach their work in similar ways – they are both looking for causes which are not immediately obvious.","screens":["Understanding and evaluating analogies","An analogy is a comparison between two things, often used to help explain a principle or idea. They might seem to have no clear relationship, but by focusing on particular factors, interesting similarities can be identified. An example might be how a doctor and a detective approach their work in similar ways – they are both looking for causes which are not immediately obvious."],"sources":[{"page":160,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efa086a1e76408efafcc06f2779b309c55a6290f2a24d3f8571b44dede375112.png"}],"kind":"resource","sourceBlockIds":["b7312"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I think that video games are like theatre or\nfilms. Like a stage or film director guiding\nactors, a video game designer directs\ndigital characters. They create stories that\nare told to the audience but the narrative\nis interactive.\nACADEMIC WRITING\nSKILLS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7318","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":33,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Read the paragraph below about the fashion designer Issey Miyake. Underline the words used in order to avoid repeating his name.","pages":[162],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d1953f26d62a30ff8723a1417ca15a11311ded86bd337961408ed86cadd7d8a.png"],"provided":"Issey Miyake was a Japanese fashion designer who was born in 1938 in Hiroshima, and he died in 2022. Even early on in his career, this inspirational figure was very expressive with his style and he didn't conform to traditional ideas of what fashion should be. His catwalk shows were like art exhibitions and they often evoked a reaction from the public. Between 1996 and 1999, the innovator collaborated with artists as part of his Guest Artist series. Miyake stated that his intention was not to answer the question 'Is fashion art?' but instead to create a relationship between art and the people who admired it. By wearing the visionary's clothes people were experiencing art and fashion at the same time.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Issey Miyake was a Japanese fashion designer who was born in 1938 in Hiroshima, and he died in 2022. Even early on in his career, this inspirational figure was very expressive with his style and he didn't conform to traditional ideas of what fashion should be. His catwalk shows were like art exhibitions and they often evoked a reaction from the public. Between 1996 and 1999, the innovator collaborated with artists as part of his Guest Artist series. Miyake stated that his intention was not to answer the question 'Is fashion art?' but instead to create a relationship between art and the people who admired it. By wearing the visionary's clothes people were experiencing art and fashion at the same time."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Issy Miyake was a Japanese fashion designer who was born\nin 1938 in Hiroshima, and he died in 2022. Even early on\nin his career, this inspirational figure was very expressive\nwith his style and he didn’t conform to traditional ideas\nof what fashion should be. His catwalk shows were like\nart exhibitions and they often evoked a reaction from the\npublic. Between 1996 and 1999, the innovator collaborated\nwith artists as part of his Guest Artist series. Miyake\nstated that his intention was not to answer the question\n‘Is fashion art?’ but instead to create a relationship\nbetween art and the people who admired it. By wearing\nthe visionary’s clothes people were experiencing art and\nfashion at the same time.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U07-question:b7322","book":4,"unit":7,"track":"RW","topic":"ART AND DESIGN","lesson":2,"order":34,"module":"GRAMMAR FOR WRITING","ex":"2","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Read the paragraph and cross out any words or phrases which can be removed without affecting the meaning of the text. Add any substitutions (such as pronouns) which you think are necessary.","pages":[163],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/265f738ea317a90a4b495cf8b0289f946f0fdd6b7fa761c8481cb4e7d4e430e4.png"],"provided":"Many chefs regard themselves as artists and they see cooking very much as a creative process when they are making a dish. Several Michelin star chefs have defended this claim by stating that their food can cause people to have
