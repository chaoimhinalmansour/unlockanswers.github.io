G 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the first sentence of each paragraph and check your answer.","pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/07f86a67f26c1f2654a908133c5ea366d4fbee1efacadb9975f0b599ad1b784f.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B02-RW-U03-question:b3495","kind":"student-work","title":"READING 1 Ex 3","pages":[64]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U03-question:b3499","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":1,"order":13,"module":"READING 1","ex":"5","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the whole text on page 63 quickly. Circle the statement that best describes the main idea of paragraph 3.","pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/07f86a67f26c1f2654a908133c5ea366d4fbee1efacadb9975f0b599ad1b784f.png"],"provided":"","items":[{"id":"b3499.i01","label":"1","prompt":"The statement that best describes the main idea of paragraph 3 is","options":["Third-party cookies belong to advertising companies and are used to follow your online activities and collect personal information about you.","People often use the internet to search for things they want to buy, for example a new smartphone.","If you use free websites, it is important to delete your browsing history regularly."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3499.i01","label":"1","prompt":"The statement that best describes the main idea of paragraph 3 is","options":["Third-party cookies belong to advertising companies and are used to follow your online activities and collect personal information about you.","People often use the internet to search for things they want to buy, for example a new smartphone.","If you use free websites, it is important to delete your browsing history regularly."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B02-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"[IMAGE_1]\n1 Do you know how websites remember your sign-in information or just give you a personal feel? The answer is internet cookies. A cookie is a small piece of information that a website puts on your computer. Some cookies are needed for websites to work properly. For example, they collect and remember things about you, like what language you prefer. Other cookies are used by companies to try to sell you things.\n2 The simple job of a cookie is to record your online activities. A website owner uses a cookie, called a first-party cookie. This is a necessary cookie. It keeps you signed in and follows you as you use the website. For example, if you shop online, a cookie remembers what you put into your shopping basket. When you visit the website again, it knows that you are the same person. The website feels more personal and is quicker to use because the cookie knows the changes you made to the website when you visited it before.\n3 Some cookies belong to someone other than the website owner, usually an advertising company. These are called third-party cookies. People want to use free websites, so website owners make money by 'renting' website space to companies. Third-party cookies can follow you between websites and record your browsing history. For example, you browsed¹ the internet one day for a new smartphone. You looked at some different websites but decided not to buy a phone. A few days later, you see adverts for smartphones on many websites you visit. You see targeted² adverts because a third-party cookie is on your computer.\n4 If you use websites that share information with a social media account then you might receive a social media cookie. The main job of social media cookies, like third-party cookies, is to decide what adverts are best for you. Social media cookies can build a profile ³ of you by collecting information about your habits and interests, even if you do not have a social media account – for example, if you go to a news website and click on a video link from a social media company. If you do not agree to receive social media cookies, then some parts of the website, like video sharing, may not work.\n5 Cookies cannot steal passwords but there are security problems. For example, cookie scraping is when a hacker ⁴ steals information from a cookie. This information gives the hacker your secret log-in information and the hacker can sign in to a website as you. You can, however, reduce the number of cookies on your computer and keep your personal information more private. Website owners must ask you to accept cookies when you use their website, so you can choose not to accept advertising or other third-party cookies. You can also delete cookies saved in your browser history.\n¹ browse (v) to look at information on the internet\n² targeted (adj) aimed at a particular person\n³ profile (n) a description of a person's life, personality, work, etc.\n⁴ hacker (n) a person who illegally gets into a computer system\n[IMAGE_2]\nACCEPT\nDECLINE","screens":["[IMAGE_1]\n1 Do you know how websites remember your sign-in information or just give you a personal feel? The answer is internet cookies. A cookie is a small piece of information that a website puts on your computer. Some cookies are needed for websites to work properly. For example, they collect and remember things about you, like what language you prefer. Other cookies are used by companies to try to sell you things.\n2 The simple job of a cookie is to record your onlin :{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work with a partner. Read the essay. Student A: underline the advantages of the hobby. Student B: underline the disadvantages.","pages":[66],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b97dfe08695df3105b7cce4b396421fc7d6590bd880d01346a3312036d16195d.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B02-RW-U03-classroom:material:RW-M04","title":"READING 2","text":"1 Do ____ affect our children negatively? Today, our children spend more and more time online. Many children spend a lot of their free time playing ____ on the internet, on ____ systems or on their mobile devices. In the UK, 99% of kids aged 8 to 15 play ____ every week, and children as young as five play ____ regularly. This information tells us that the benefits and dangers of ____ must be carefully considered.\n2 For many people, are fun and educational. They have bright lights, funny cartoons¹ and exciting stories. Everywhere you look, you can see children playing these. They play on buses and trains, in restaurants and even at school. also make you think in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.\n3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.\n4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount","screens":["1 Do ____ affect our children negatively? Today, our children spend more and more time online. Many children spend a lot of their free time playing ____ on the internet, on ____ systems or on their mobile devices. In the UK, 99% of kids aged 8 to 15 play ____ every week, and children as young as five play ____ regularly. This information tells us that the benefits and dangers of ____ must be carefully considered.","2 For many people, are fun and educational. They have bright lights, funny cartoons¹ and exciting stories. Everywhere you look, you can see children playing these. They play on buses and trains, in restaurants and even at school. also make you think in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.","3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.","4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount"],"sources":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/022940689ea8051dbf3122828afa15ba729ee28835b8808539 hes them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.","4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount"],"sources":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/022940689ea8051dbf3122828afa15ba729ee28835b880853940042f41b90244.png","width":772,"height":1040}],"kind":"reading"},{"id":"B02-RW-U03-publisher-sheet:b3521","title":"READING 2 Ex 6 原题面","pages":[68],"text":"","screens":[],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5d41d774823063a1ec2c2f5c349357bc8dffeef75f45d8f47ae91bea4ae813f2.png"}],"kind":"task_sheet","sourceBlockIds":["b3521"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_1e6f9af13fc0d19b.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1080e41b19a0131087231c9488370b1919723395ba8ae7ef elps us do work. Do you agree or disagree?","options":["Give your opinion about whether the internet wastes our time or helps us do more work. Give examples to support your argument.","Describe the ways the internet wastes our time and the ways it helps us do more work."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 b 2 a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":38,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U03-question:b3537","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read what the three students think about the internet. What advantages and disadvantages do they talk about?","pages":[71],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/91fb827f4beeacf0d00ceef6f6bce0ac1a79b07821cf2ac6ff6166a5b7d49a3e.png"],"provided":"Yasir\nThe internet is great for being able to read newspapers from all over the world. I can read news from back home in China. Also, when I read a newspaper in English, I learn new words. If I just want to have fun, I can play a few video games. However, I have to be careful about how much time I spend on the internet because I don't want to get addicted to it.\n\nChen\nSometimes I like to do my homework at home, instead of going to the library. The internet is useful for that. I can go to a lot of different websites for help with my homework, and I can email my classmates and teachers if I have questions. Sometimes I worry, though. I have so much information on my computer that if it breaks, I'll lose a lot of it.\n\nAdalaide\nI love social media sites because I can connect with people who like the same music that I do. And without social media, I wouldn't learn about all the films that are made in different countries and which ones I should go and see. Of course, the internet is a great place for learning, too. I watch a lot of educational videos and I learn interesting things about cultures and traditions that are different from mine.","items":[{"id":"b3537.i01","label":"Yasir","prompt":"What advantages and disadvantages does Yasir talk about?","options":[],"type":"qa/open"},{"id":"b3537.i02","label":"Chen","prompt":"What advantages and disadvantages does Chen talk about?","options":[],"type":"qa/open"},{"id":"b3537.i03","label":"Adalaide","prompt":"What advantages and disadvantages does Adalaide talk about?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Yasir"},{"kind":"text","text":"The internet is great for being able to read newspapers from all over the world. I can read news from back home in China. Also, when I read a newspaper in English, I learn new words. If I just want to have fun, I can play a few video games. However, I have to be careful about how much time I spend on the internet because I don't want to get addicted to it."},{"kind":"text","text":"Chen"},{"kind":"text","text":"Sometimes I like to do my homework at home, instead of going to the library. The internet is useful for that. I can go to a lot of different websites for help with my homework, and I can email my classmates and teachers if I have questions. Sometimes I worry, though. I have so much information on my computer that if it breaks, I'll lose a lot of it."}],[{"kind":"text","text":"Adalaide"},{"kind":"text","text":"I love social media sites because I can connect with people who like the same music that I do. And without social media, I wouldn't k in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.\n3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.\n4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount","screens":["1 Do ____ affect our children negatively? Today, our children spend  disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.","¹ cartoons (n) films made using characters that are drawn and not real","² overweight (adj) too heavy or weighing more than the usual amount"],"sources":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/022940689ea8051dbf3122828afa15ba729ee28835b880853940042f41b90244.png"}],"kind":"material","sourceBlockIds":["b3518"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Paragraph 2: For many people, video games are fun and\neducational.\nParagraph 3: However, a recent study suggests that video\ngames can also be bad for children.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":39,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U03-question:b3559","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":2,"order":48,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the topic sentences. Underline the topic. Circle the controlling idea.","pages":[76],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9e21ba46111da3f76201bf84c1d501f82290162ef1df65a535bae574c8c26352.png"],"provided":"","items":[{"id":"b3559.i01"," ement":"inline","mode":"after","kind":"answer","source":"课堂词汇练习","rows":[{"label":"1","answer":"affect","basis":"Too little sleep can affect your work.","anchor":{"kind":"line"}},{"label":"2","answer":"creative","basis":"She has a creative idea for a new app.","anchor":{"kind":"line"}},{"label":"3","answer":"download","basis":"You can download the app onto your phone.","anchor":{"kind":"line"}},{"label":"4","answer":"educational","basis":"We watched an educational video about space.","anchor":{"kind":"line"}},{"label":"5","answer":"imagination","basis":"This story shows the writer’s imagination.","anchor":{"kind":"line"}},{"label":"6","answer":"improve","basis":"Regular practice can improve your writing.","anchor":{"kind":"line"}}]}},{"id":"B02-RW-U03-classroom:resource:b3473","book":2,"unit":3,"topic":"THE INTERNET AND TECHNOLOGY","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[58],"sourcePages":[58],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/696d6d9caf932b30d6cabf0c3054053fd0bd42f6c25d08b494efdde8ad985323.png"],"sourceHashes":["696d6d9caf932b30d6cabf0c3054053fd0bd42f6c25d08b494efdde8ad985323"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a one-sided opinion paragraph."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about livestreaming in China."},{"label":"Reading skills","text":"Read for main ideas; make inferences."},{"label":"Critical thinking","text":"Identify appropriate answers."},{"label":"Grammar","text":"Give opinions; connect ideas."},{"label":"Academic writing skill","text":"Write topic sentences."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":58,"alt":""}}]}},{"id":"B02-RW-U03-classroom:resource:b3481","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[60],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8ef28733dfccf99659b2e76a1582c09c8cedcb5dae89ab8e4591c8761745182.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"celebrities","pos":"(n)","definition":"people who are famous, especially in shows, in films or on television","example":"Several celebrities attended the film festival.","wordAudio":"celebrities","cardWord":false},{"term":"viewers","pos":"(n)","definition":"people who watch something, especially television, film or video","example":"Millions of viewers watched the match on television.","wordAudio":"viewers","cardWord":false},{"term":"encourage","pos":"(v)","definition":"to make somebody more likely to do something","example":"Our coach tries to encourage everyone to take part.","wordAudio":"encourage","cardWord":false},{"term":"advice","pos":"(n)","definition":"an opinion or suggestion that somebody gives you about what you should do","example":"My teacher gave me some useful advice.","wordAudio":"advice","cardWord":false},{"term":"compete","pos":"(v)","definition":"to try to be more successful than somebody or something else","example":"Two teams will compete for the trophy.","wordAudio":"compete","cardWord":false},{"term":"notice","pos":"(v)","definition":"to see or become aware of somebody or something","example":"Did you notice the new sign at the entrance?","wordAudio":"notice","cardWord":false}]]}},{"id":"B02-RW-U03-classroom:video","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f032d5ba0c9625ec6eef5bf0bf082b02dfb1992039712fdb79804aa591d48d0f.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/85658c75225b9db37d0dac6c-L2RW-U03.mp4","captions":[{"start":0.92,"end":2.52,"text":"This is Guilin,"},{"start":2.92,"end":4.64,"text":"a city in southern China."},{"start":8.3,"end":11.68,"text":"It's the middle of the night here, but these young\npeople aren't sleeping."},{"start":12.46,"end":13.48,"text":"They're on a bridge,"},{"start":13.88,"end":16.24,"text":"talking and singing to other people online."},{"start":17.88,"end":21.34,"text":"They're some of China's many live streamers."},{"start":22.82,"end":25.48,"text":"Live streaming is big business in China."},{"start":27.38,"end":33.76,"text":"About 730 million people there used live streaming apps\nin 2023."},{"start":35.96,"end":39.14,"text":"That's 68 % of Chinese internet users."},{"start":40.78,"end":41.72,"text":"On these apps,"},{"start":42.26,"end":45.94,"text":"social media, celebrities and shopping all mix\ntogether."},{"start":46.92,"end":51.02,"text":"Viewers can chat with the live streamers, and they can\nspend money."},{"start":51.02,"end":55,"text":"Some Chinese live streams belong to businesses."},{"start":56.62,"end":61.4,"text":"The live streamers answer viewers' questions and\nencourage viewers to buy more."},{"start":63.14,"end":67.04,"text":"Companies often use popular live streamers to sell\ntheir products."},{"start":67.8,"end":71.96000000000001,"text":"They sell about 200 % more products this way."},{"start":73.84,"end":75.7,"text":"Other live streams are social."},{"start":76.18,"end":79.92,"text":"Live streamers talk to viewers, sing songs or share\nadvice."},{"start":79.92,"end":84.12,"text":"Viewers can buy emoji gifts for their favorite live\nstreamers."},{"start":86.48,"end":90.74,"text":"Different emojis, for example a rocket or a carrot,"},{"start":91.32,"end":95.03999999999999,"text":"give a different amount of money to the live streamer."},{"start":96.5,"end":101.42,"text":"The most popular Chinese live streamers make millions\nof dollars in a day."},{"start":102.34,"end":105.08,"text":"But back in Guilin,"},{"start":105.52000000000001,"end":110.44,"text":"live streamers on the bridge get just a little extra\nmoney from their online job."},{"start":112.32,"end":117.62,"text":"27 -year -old Qiao Ya sings and chats about daily life\non her live stream."},{"start":118.36,"end":121.66,"text":"She's here every evening from 9pm to 3am."},{"start":123.8,"end":128.54,"text":"There are too many indoor live streamers, so it's very\ndifficult to compete."},{"start":129.22,"end":131.6,"text":"On Chinese live streaming apps,"},{"start":132.12,"end":134.2,"text":"there are thousands of live streams."},{"start":135.4,"end":138.88,"text":"Qiao Ya hopes that the bridge will make her live stream\nlook different,"},{"start":139.26,"end":140.54,"text":"and viewers will notice her."},{"start":141.68,"end":143.2,"text":"It's so cold outside."},{"start":143.56,"end":146.32,"text":"When it reaches zero degrees, I can't stand it."},{"start":146.4,"end":147.5,"text":"It's too cold."},{"start":148.54,"end":153.62,"text":"The live streamers on the bridge hope viewers will be\nkinder to them because they're outside."},{"start":155.16,"end":160.76,"text":"Viewers might feel if we're outside and alone, late at\nnight, that's very hard for us."}],"launchInline":true}},{"id":"B02-RW-U03-classroom:material:RW-M03","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[63],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58561952b990be95fdf02473ed9c79a55ff08fffa3571248dfdf6236ead7295f.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"[IMAGE_1]\n1 Do you know how websites remember your sign-in information or just give you a personal feel? The answer is internet cookies. A cookie is a small piece of information that a website puts on your computer. Some cookies are needed for websites to work properly. For example, they collect and remember things about you, like what language you prefer. Other cookies are used by companies to try to sell you things.\n2 The simple job of a cookie is to record your online activities. A website owner uses a cookie, called a first-party cookie. This is a necessary cookie. It keeps you signed in and follows you as you use the website. For example, if you shop online, a cookie remembers what you put into your shopping basket. When you visit the website again, it knows that you are the same person. The website feels more personal and is quicker to use because the cookie knows the changes you made to the website when you visited it before.","sourcePage":63},{"body":"3 Some cookies belong to someone other than the website owner, usually an advertising company. These are called third-party cookies. People want to use free websites, so website owners make money by 'renting' website space to companies. Third-party cookies can follow you between websites and record your browsing history. For example, you browsed¹ the internet one day for a new smartphone. You looked at some different websites but decided not to buy a phone. A few days later, you see adverts for smartphones on many websites you visit. You see targeted² adverts because a third-party cookie is on your computer.","sourcePage":63},{"body":"4 If you use websites that share information with a social media account then you might receive a social media cookie. The main job of social media cookies, like third-party cookies, is to decide what adverts are best for you. Social media cookies can build a profile ³ of you by collecting information about your habits and interests, even if you do not have a social media account – for example, if you go to a news website and click on a video link from a social media company. If you do not agree to receive social media cookies, then some parts of the website, like video sharing, may not work.","sourcePage":63},{"body":"5 Cookies cannot steal passwords but there are security problems. For example, cookie scraping is when a hacker ⁴ steals information from a cookie. This information gives the hacker your secret log-in information and the hacker can sign in to a website as you. You can, however, reduce the number of cookies on your computer and keep your personal information more private. Website owners must ask you to accept cookies when you use their website, so you can choose not to accept advertising or other third-party cookies. You can also delete cookies saved in your browser history.\n¹ browse (v) to look at information on the internet\n² targeted (adj) aimed at a particular person\n³ profile (n) a description of a person's life, personality, work, etc.\n⁴ hacker (n) a person who illegally gets into a computer system\n[IMAGE_2]\nACCEPT\nDECLINE","sourcePage":63}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U03-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"[IMAGE_1]","pages":[{"page":63,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58561952b990be95fdf02473ed9c79a55ff08fffa3571248dfdf6236ead7295f.png","width":772,"height":1040}],"source":63,"embeddedIn":null,"photo":null,"clearPages":[{"body":"[IMAGE_1]\n1 Do you know how websites remember your sign-in information or just give you a personal feel? The answer is internet cookies. A cookie is a small piece of information that a website puts on your computer. Some cookies are needed for websites to work properly. For example, they collect and remember things about you, like what language you prefer. Other cookies are used by companies to try to sell you things.\n2 The simple job of a cookie is to record your online activities. A website owner uses a cookie, called a first-party cookie. This is a necessary cookie. It keeps you signed in and follows you as you use the website. For example, if you shop online, a cookie remembers what you put into your shopping basket. When you visit the website again, it knows that you are the same person. The website feels more personal and is quicker to use because the cookie knows the changes you made to the website when you visited it before.","sourcePage":63},{"body":"3 Some cookies belong to someone other than the website owner, usually an advertising company. These are called third-party cookies. People want to use free websites, so website owners make money by 'renting' website space to companies. Third-party cookies can follow you between websites and record your browsing history. For example, you browsed¹ the internet one day for a new smartphone. You looked at some different websites but decided not to buy a phone. A few days later, you see adverts for smartphones on many websites you visit. You see targeted² adverts because a third-party cookie is on your computer.","sourcePage":63},{"body":"4 If you use websites that share information with a social media account then you might receive a social media cookie. The main job of social media cookies, like third-party cookies, is to decide what adverts are best for you. Social media cookies can build a profile ³ of you by collecting information about your habits and interests, even if you do not have a social media account – for example, if you go to a news website and click on a video link from a social media company. If you do not agree to receive social media cookies, then some parts of the website, like video sharing, may not work.","sourcePage":63},{"body":"5 Cookies cannot steal passwords but there are security problems. For example, cookie scraping is when a hacker ⁴ steals information from a cookie. This information gives the hacker your secret log-in information and the hacker can sign in to a website as you. You can, however, reduce the number of cookies on your computer and keep your personal information more private. Website owners must ask you to accept cookies when you use their website, so you can choose not to accept advertising or other third-party cookies. You can also delete cookies saved in your browser history.\n¹ browse (v) to look at information on the internet\n² targeted (adj) aimed at a particular person\n³ profile (n) a description of a person's life, personality, work, etc.\n⁴ hacker (n) a person who illegally gets into a computer system\n[IMAGE_2]\nACCEPT\nDECLINE","sourcePage":63}],"text":"[IMAGE_1]\n1 Do you know how websites remember your sign-in information or just give you a personal feel? The answer is internet cookies. A cookie is a small piece of information that a website puts on your computer. Some cookies are needed for websites to work properly. For example, they collect and remember things about you, like what language you prefer. Other cookies are used by companies to try to sell you things.\n2 The simple job of a cookie is to record your online activities. A website owner uses a cookie, called a first-party cookie. This is a necessary cookie. It keeps you signed in and follows you as you use the website. For example, if you shop online, a cookie remembers what you put into your shopping basket. When you visit the website again, it knows that you are the same person. The website feels more personal and is quicker to use because the cookie knows the changes you made to the website when you visited it before.\n3 Some cookies belong to someone other than the website owner, usually an advertising company. These are called third-party cookies. People want to use free websites, so website owners make money by 'renting' website space to companies. Third-party cookies can follow you between websites and record your browsing history. For example, you browsed¹ the internet one day for a new smartphone. You looked at some different websites but decided not to buy a phone. A few days later, you see adverts for smartphones on many websites you visit. You see targeted² adverts because a third-party cookie is on your computer.\n4 If you use websites that share information with a social media account then you might receive a social media cookie. The main job of social media cookies, like third-party cookies, is to decide what adverts are best for you. Social media cookies can build a profile ³ of you by collecting information about your habits and interests, even if you do not have a social media account – for example, if you go to a news website and click on a video link from a social media company. If you do not agree to receive social media cookies, then some parts of the website, like video sharing, may not work.\n5 Cookies cannot steal passwords but there are security problems. For example, cookie scraping is when a hacker ⁴ steals information from a cookie. This information gives the hacker your secret log-in information and the hacker can sign in to a website as you. You can, however, reduce the number of cookies on your computer and keep your personal information more private. Website owners must ask you to accept cookies when you use their website, so you can choose not to accept advertising or other third-party cookies. You can also delete cookies saved in your browser history.\n¹ browse (v) to look at information on the internet\n² targeted (adj) aimed at a particular person\n³ profile (n) a description of a person's life, personality, work, etc.\n⁴ hacker (n) a person who illegally gets into a computer system\n[IMAGE_2]\nACCEPT\nDECLINE","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_11b123e08f50257b.mp3"},"original":{"id":"B02-RW-U03-material:RW-M03","entry":"material:RW-M03","unitId":"B02-RW-U03","book":2,"track":"RW","unit":3,"title":"READING 1","kind":"material","pages":[63],"sourceImages":[{"page":63,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58561952b990be95fdf02473ed9c79a55ff08fffa3571248dfdf6236ead7295f.png","viewEvidenceReported":true}],"text":"[IMAGE_1]\n1 Do you know how websites remember your sign-in information or just give you a personal feel? The answer is internet cookies. A cookie is a small piece of information that a website puts on your computer. Some cookies are needed for websites to work properly. For example, they collect and remember things about you, like what language you prefer. Other cookies are used by companies to try to sell you things.\n2 The simple job of a cookie is to record your online activities. A website owner uses a cookie, called a first-party cookie. This is a necessary cookie. It keeps you signed in and follows you as you use the website. For example, if you shop online, a cookie remembers what you put into your shopping basket. When you visit the website again, it knows that you are the same person. The website feels more personal and is quicker to use because the cookie knows the changes you made to the website when you visited it before.\n3 Some cookies belong to someone other than the website owner, usually an advertising company. These are called third-party cookies. People want to use free websites, so website owners make money by 'renting' website space to companies. Third-party cookies can follow you between websites and record your browsing history. For example, you browsed¹ the internet one day for a new smartphone. You looked at some different websites but decided not to buy a phone. A few days later, you see adverts for smartphones on many websites you visit. You see targeted² adverts because a third-party cookie is on your computer.\n4 If you use websites that share information with a social media account then you might receive a social media cookie. The main job of social media cookies, like third-party cookies, is to decide what adverts are best for you. Social media cookies can build a profile ³ of you by collecting information about your habits and interests, even if you do not have a social media account – for example, if you go to a news website and click on a video link from a social media company. If you do not agree to receive social media cookies, then some parts of the website, like video sharing, may not work.\n5 Cookies cannot steal passwords but there are security problems. For example, cookie scraping is when a hacker ⁴ steals information from a cookie. This information gives the hacker your secret log-in information and the hacker can sign in to a website as you. You can, however, reduce the number of cookies on your computer and keep your personal information more private. Website owners must ask you to accept cookies when you use their website, so you can choose not to accept advertising or other third-party cookies. You can also delete cookies saved in your browser history.\n\n¹ browse (v) to look at information on the internet\n² targeted (adj) aimed at a particular person\n³ profile (n) a description of a person's life, personality, work, etc.\n⁴ hacker (n) a person who illegally gets into a computer system\n\n[IMAGE_2]\nACCEPT\nDECLINE","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3493"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github. ren as young as five play ____ regularly. This information tells us that the benefits and dangers of ____ must be carefully considered.","sourcePage":67},{"body":"2 For many people, are fun and educational. They have bright lights, funny cartoons¹ and exciting stories. Everywhere you look, you can see children playing these. They play on buses and trains, in restaurants and even at school. also make you think in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.","sourcePage":67},{"body":"3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.","sourcePage":67},{"body":"4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount","sourcePage":67}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U03-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/022940689ea8051dbf3122828afa15ba729ee28835b880853940042f41b90244.png","width":772,"height":1040}],"source":67,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Do ____ affect our children negatively? Today, our children spend more and more time online. Many children spend a lot of their free time playing ____ on the internet, on ____ systems or on their mobile devices. In the UK, 99% of kids aged 8 to 15 play ____ every week, and children as young as five play ____ regularly. This information tells us that the benefits and dangers of ____ must be carefully considered.","sourcePage":67},{"body":"2 For many people, are fun and educational. They have bright lights, funny cartoons¹ and exciting stories. Everywhere you look, you can see children playing these. They play on buses and trains, in restaurants and even at school. also make you think in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.","sourcePage":67},{"body":"3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.","sourcePage":67},{"body":"4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount","sourcePage":67}],"text":"1 Do ____ affect our children negatively? Today, our children spend more and more time online. Many children spend a lot of their free time playing ____ on the internet, on ____ systems or on their mobile devices. In the UK, 99% of kids aged 8 to 15 play ____ every week, and children as young as five play ____ regularly. This information tells us that the benefits and dangers of ____ must be carefully considered.\n2 For many people, are fun and educational. They have bright lights, funny cartoons¹ and exciting stories. Everywhere you look, you can see children playing these. They play on buses and trains, in restaurants and even at school. also make you think in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.\n3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.\n4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_1e6f9af13fc0d19b.mp3"},"original":{"id":"B02-RW-U03-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U03","book":2,"track":"RW","unit":3,"title":"READING 2","kind":"material","pages":[67],"sourceImages":[{"page":67,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/022940689ea8051dbf3122828afa15ba729ee28835b880853940042f41b90244.png","viewEvidenceReported":true}],"text":"1 Do ____ affect our children negatively? Today, our children spend more and more time online. Many children spend a lot of their free time playing ____ on the internet, on ____ systems or on their mobile devices. In the UK, 99% of kids aged 8 to 15 play ____ every week, and children as young as five play ____ regularly. This information tells us that the benefits and dangers of ____ must be carefully considered.\n2 For many people, are fun and educational. They have bright lights, funny cartoons¹ and exciting stories. Everywhere you look, you can see children playing these. They play on buses and trains, in restaurants and even at school. also make you think in a creative way and you have to move your hands and eyes quickly. This can improve the way that a child's brain works. also make children use their imagination. The player has to do many creative things, like draw, tell stories and build things. are also a good way to teach children about technology because they can learn how computers and other devices work while they play.\n3 However, a recent study suggests that ____ can also be bad for children. First, children can download many ____ for free. They don't need money, so they don't need to ask their parents if they can download the ____ . This means that parents often don't know if their children are playing violent or scary ____ . Second, many children spend too much time playing ____ on computers, smartphones and tablets and this can lead to health problems – children who spend too much time on the computer and don't exercise can become overweight². Third, if children spend too much time playing ____ instead of doing homework, they can have problems at school and get bad grades. Finally, ____ can affect children's social skills. Playing and working with friends is very important for children and it teaches them how to talk to other people. If children spend too much time playing ____ by themselves, they might not learn how to play with their friends.\n4 In conclusion, it seems clear that have some advantages and some disadvantages. On the one hand, they are fun and have many educational benefits for children. On the other hand, they can cause problems with children's health and social skills. It is up to parents to know what their children are playing and how much time they spend on them. Parents should also make sure their children get enough exercise and spend time with other children.\n\n¹ cartoons (n) films made using characters that are drawn and not real\n² overweight (adj) too heavy or weighing more than the usual amount","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3518"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_1e6f9af13fc0d19b.mp3","continueOnPage":true}},{"id":"B02-RW-U03-classroom:review-1","book":2,"unit":3,"track":"RW","topic":"THE INTERNET AND TECHNOLOGY","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[79],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd function materialSplit(decks,task,feedback){
 const tabs=decks.map((deck,i)=>'<button type="button" data-deck="'+i+'" aria-pressed="'+(i===0)+'">'+esc(deck.label)+'</button>').join("");
 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+
  '<section class="panel v-block material-task" data-fixed-task aria-label="课堂任务">'+task+'</section></div>';
}
function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

  (printedReading?'教材第 '+printedReading+' 页':c.pages.length?'教材第 '+esc(c.pages.join("、"))+' 页':"")+classroomStage.count(p,binding.chunks.length)+'</div>'+audio+'</header>'+

function resultFor(c){return (c.comparison?comparisonResults:c.flow?lessonResults:results)[c.id];}
function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){
 const host=document.getElementById("preview-size"),scale=Math.min(host.parentElement.clientWidth/1280,maxProjectionScale);
 host.style.width=1280*scale+"px";host.style.height=720*scale+"px";frame.style.transform="scale("+scale+")";
}
function inClassroomOrder(){
 return Boolean(V.lessonFlow&&sequenceView.value==="school");
}
function inOpenings(){
 return sequenceView.value==="openings";
}
function inGlossaries(){
 return sequenceView.value==="glossaries";
}
function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
 return entry+gaps;
}
function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';
  document.getElementById("flow-coverage").textContent="当前显示教材 Ex 的实页验证。";
 }
}

function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}

 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;

 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");
 if(r?.inlineCheckTest)document.getElementById("metrics").append(" 原位核对检查 "+r.inlineCheckTest.points+" 处。");
 if(r?.screenChecks?.length)document.getElementById("metrics").append(" 已核对原页、前题和题面位置。");

 document.getElementById("references").innerHTML=c.references.length?c.references.map(x=>'<button class="ref-button" '+(x.sourceOnly?'data-reference-page="'+x.pages[0]+'"':'data-ref="'+esc(x.id)+'"')+'>'+esc(x.title)+'，教材第 '+x.pages.join("、")+' 页</button>').join(""):'<p>本题记录中没有显式学生作答引用。</p>';
 document.getElementById("materials").innerHTML=c.materials.map(m=>'<details><summary>'+esc(m.title)+'，教材第 '+esc((m.pages||[]).join("、"))+' 页</summary><div class="resource-text">'+esc(m.text||"此条目通过教材原页核对。")+'</div></details>').join("")+(c.supportText&&!c.materialDecks?'<details><summary>'+esc(c.supportTitle)+'</summary><div class="resource-text">'+esc(c.supportText)+'</div></details>':"");
 if(c.materialDecks)document.getElementById("materials").innerHTML=classroom.materialDecks(c).map(deck=>'<details><summary>'+esc(deck.label)+'</summary><div class="resource-text">'+deck.pages.map(card=>esc([card.title,card.subtitle,card.lead,card.body.replace(/\*\*/g,""),...(card.notes??[])].filter(Boolean).join("\n"))).join("\n\n")+'</div></details>').join("");
 document.getElementById("materials").insertAdjacentHTML("afterbegin",vocabularyPlacement(c,part));
 document.getElementById("provided-record").innerHTML='<details><summary>完整给定内容和小题记录</summary><div class="resource-text">'+esc(c.provided)+'\n'+esc(c.items.map(x=>x.label+" "+x.prompt+(x.options?.length?"\n"+x.options.join("\n"):"")).join("\n\n"))+'</div></details>';
 const feedback=c.feedback;
 document.getElementById("feedback-record").innerHTML=feedback?

 document.getElementById("record-id").textContent=c.id;

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){
 const i=classroom.indexById.get(id);
 if(i===undefined)return;
 history.push({i:current,p:part,...(vocabulary?{vocabulary:id}:{})});
 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);
}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});
 return true;
}
function closeSource(){

function showSource(){

 const pdf=document.getElementById("source-pdf");

function summaries(){

 for(const r of Object.values(results))counts[r.verdict]++;

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const checked=[];
 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
function inspectOriginalButton(button){

 const expected=classroom.source(owner,button.dataset.originalPage);
