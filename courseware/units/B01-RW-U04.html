":[{"id":"B01-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"1 The Maldives are islands in the Indian Ocean. The islands are near Sri Lanka. The Maldives are famous for their good climate, beautiful beaches and warm seas.\n2 There are 580,000 people in the Maldives. Most people live on small islands.\n3 The capital of the Maldives is Malé. It is a modern city with an international airport and a big harbour¹.\n4 People in Malé speak English and Dhivehi. English is useful because many tourists come here.\n5 Tourism and fishing are very important industries in the Maldives. There are many tourist hotels. Many people work there. Others work as fishermen or in fish factories². The currency is the rufiyaa.\n¹ harbour (n) area of water next to land for ships and boats\n² factories (n) buildings where a large number of things or products are made\n³ currency (n) the money a country uses\n⁴ industry (n) types of businesses\n¹ harbour (n) area of water next to land for ships and boats\n² factories (n) buildings where a large number of things or products are made\n³ currency (n) the money a country uses\n⁴ industry (n) types of businesses\n\u003ctable>\n\u003ctr>\u003ctd>FULL NAME:\u003c/td>\u003ctd>Republic of Maldives\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>POPULATION:\u003c/td>\u003ctd>580,000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CAPITAL:\u003c/td>\u003ctd>Malé\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>GEOGRAPHY:\u003c/td>\u003ctd>1,192 islands\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CLIMATE:\u003c/td>\u003ctd>good, average temperature +30 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>LANGUAGES:\u003c/td>\u003ctd>Dhivehi and English\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>RELIGION:\u003c/td>\u003ctd>Islam\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CURRENCY³:\u003c/td>\u003ctd>rufiyaa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>INDUSTRY⁴:\u003c/td>\u003ctd>tourism and fishing\u003c/td>\u003c/tr>\n\u003c/table>\n6 I live on an island south of Malé. Life on my island is very simple. There are some shops and there is one mosque. We speak Dhivehi but we also learn English in high school. It is a nice place to live.\n7 The Maldives are famous for their fish. There is a popular fish soup here. It is called garudiya. It is delicious.\n8 People in the Maldives like to swim and dive.","screens":["1 The Maldives are islands in the Indian Ocean. The islands are near Sri Lanka. The Maldives are famous for their good climate, beautiful beaches and warm seas.\n2 There are 580,000 people in the Maldives. Most people live on small islands.\n3 The capital of the Maldives is Malé. It is a modern city with an international airport and a big harbour¹.\n4 People in Malé speak English and Dhivehi. English is useful because many tourists come here.\n5 Tourism and fishing are very important industries in the Maldives. There are many tourist hotels. Many people work there. Others work as fishermen or in fish factories². The currency is the rufiyaa.\n¹ harbour (n) area of water next to land for ships and boats\n² factories (n) buildings where a large number of things or products are made\n³ currency (n) the money a country uses\n⁴ industry (n) types of businesses","¹ harbour (n) area of water next to land for ships and boats\n² factories (n) buildings where a large number of things or products are made\n³ currency (n) the money a country uses\n⁴ industry (n) types of businesses","\u003ctable>\n\u003ctr>\u003ctd>FULL NAME:\u003c/td>\u003ctd>Republic of Maldives\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>POPULATION:\u003c/td>\u003ctd>580,000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CAPITAL:\u003c/td>\u003ctd>Malé\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>GEOGRAPHY:\u003c/td>\u003ctd>1,192 islands\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CLIMATE:\u003c/td>\u003ctd>good, average temperature +30 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>LANGUAGES:\u003c/td>\u003ctd>Dhivehi and English\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>RELIGION:\u003c/td>\u003ctd>Islam\u003c/td>\u003c/tr>\n\ d Track","My blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.","2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.","3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.","4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.","5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight."],"sources":[{"page":85,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a54962e66cc2b4103d5e8f7f7268697b89fc24ec0b222a496de7179952dc2632.png"}],"kind":"material","sourceBlockIds":["b1972"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/863c6df14e64a921a0d1a80bb0987aff0c16016e793a29a55763864df4a653c2.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f7cbd217d36eca7f27509320e2f57a0d7eb4cbc1270050c823ca6c39de4fef6.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[], "label":"Paragraph 1","prompt":"Write the first paragraph about your country.","options":[],"type":"gap/open"},{"kind":"item","id":"b2047.i02","label":"Paragraph 2","prompt":"Write the second paragraph about your country.","options":[],"type":"gap/open"},{"kind":"item","id":"b2047.i03","label":"Paragraph 3","prompt":"Write the third paragraph about your country.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B01-RW-U04-publisher-sheet:b2045","title":"WRITING TASK Ex 3 原题面","pages":[100],"text":"In Switzerland, there are four important languages, German, French, Italian and Romansh. People in different parts of Switzerland speak different languages. About 63% speak German, about 23% speak French and about 8% speak Italian. Only about 0.5% speak Romansch.","screens":["In Switzerland, there are four important languages, German, French, Italian and Romansh. People in different parts of Switzerland speak different languages. About 63% speak German, about 23% speak French and about 8% speak Italian. Only about 0.5% speak Romansch."],"sources":[{"page":100,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c887919c1d40ba86cf5325830e9cf8230b75e394c393c33673e73a7a21e641d.png"}],"kind":"task_sheet","sourceBlockIds":["b2045"]},{"id":"B01-RW-U04-resource:b2034","title":"PARAGRAPH STRUCTURE","pages":[98],"text":"PARAGRAPH STRUCTURE\n\nParagraphs are groups of sentences which talk about one idea. This is called the main idea. Good paragraphs have three parts: a topic sentence, supporting sentences / details and a concluding sentence.\nThe topic sentence usually comes first. The details, also called the supporting sentences, come next and give more information about the main idea. The paragraph ends with a concluding sentence.\n\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>topic sentence\u003c/th>\u003cth colspan=\"3\">supporting sentences / details\u003c/th>\u003cth>concluding sentence\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>I live on an island south of Malé.\u003c/td>\u003ctd>Life on my island is very simple.\u003c/td>\u003ctd>There are some shops and there is one mosque.\u003c/td>\u003ctd>We speak Dhivehi, but we also learn English in high school.\u003c/td>\u003ctd>It is a nice place to live.\u003c/td>\u003c/tr>\u003c/table>\n\nTopic sentences\nThe topic sentence tells the reader what the paragraph is about. It tells the main idea of the paragraph. In the paragraph above, the topic is 'an island south of Malé'. The main idea in the topic sentence is that it is where the writer lives. The topic sentence is usually the first sentence in a paragraph. Then the following sentences add details to the topic.","screens":["PARAGRAPH STRUCTURE","Paragraphs are groups of sentences which talk about one idea. This is called the main idea. Good paragraphs have three parts: a topic sentence, supporting sentences / details and a concluding sentence.","The topic sentence usually comes first. The details, also called the supporting sentences, come next and give more information about the main idea. The paragraph ends with a concluding sentence.","\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>topic sentence\u003c/th>\u003cth colspan=\"3\">supporting sentences / details\u003c/th>\u003cth>concluding sentence\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>I live on an island south of Malé.\u003c/td>\u003ctd>Life on my island is very simple.\u003c/td>\u003ctd>There are some shops and there is one mosque.\u003c/td>\u003ctd>We speak Dhivehi, but we also learn English in high school.\u003c/td>\u003ctd>It is a nice place to live.\u003c/td>\u003c/tr>\u003c/table>","Topic sentences","The topic sentence tells the reader what the paragraph is about. It tells the main idea of the paragraph. In the paragraph above, the topic is 'an island south of Malé'. The main idea in the topic sentence is that it is where the writer lives. The topic sentence is usually the first sentence in a paragraph. Then the following sentences add details to the topic."],"sources":[{"page":98,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a3578229ceddd2f0e84428f9715aec6f759b7a3dc0d802e57743e01c07dca79.png"}],"kind":"resource","sourceBlockIds":["b2034"]},{"id":"B01-RW-U04-material:Task checklist p100","title":"p100 Task checklist","pages":[100],"text":"","screens":[],"sources":[{"page":100,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c887919c1d40ba86cf5325830e9cf8230b75e394c393c33673e73a7a21e641d.png"}],"kind":"task_checklist","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f7cbd217d36eca7f27509320e2f57a0d7eb4cbc1270050c823ca6c39de4fef6.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U04-question:b2049","book":1,"unit":4,"track":"RW","topic":"PLACES","lesson":2,"order":48,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"EDIT"},"instruction":"Use the Task checklist to review your paragraphs.","pages":[100],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c887919c1d40ba86cf5325830e9cf8230b75e394c393c33673e73a7a21e641d.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u0 "","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write facts about your country."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about cenotes in Mexico."},{"label":"Reading skill","text":"Read for main ideas."},{"label":"Critical thinking","text":"Classify topics and key words."},{"label":"Grammar","text":"Use noun phrases with of; use there is / there are; use articles."},{"label":"Academic writing skills","text":"Use capital letters for cities, country names and nationalities; write topic sentences."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":80,"alt":""}}]}},{"id":"B01-RW-U04-classroom:resource:b1959","book":1,"unit":4,"track":"RW","topic":"PLACES","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228191ebef30bc352a233ea38625e2fb49e034ae4b0f205451d0b19bc790b93c.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"space","pos":"(n)","definition":"an empty area","example":"There is enough space for another chair.","wordAudio":"space","cardWord":false},{"term":"full of","pos":"(adj phr)","definition":"containing a lot of things","example":"This box is full of old photographs.","wordAudio":"full of","cardWord":false},{"term":"lily pad","pos":"(n)","definition":"the large leaf of a water plant that floats on the surface of water, for example, on a lake or pond","example":"A frog was sitting on a lily pad.","wordAudio":"lily pad","cardWord":false},{"term":"turtle","pos":"(n)","definition":"an animal with four legs and a hard shell that usually lives in water","example":"We watched the turtle swim across the pond.","wordAudio":"turtle","cardWord":false}]]}},{"id":"B01-RW-U04-classroom:video","book":1,"unit":4,"track":"RW","topic":"PLACES","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fa028d014570f877f9a3025bd8ac00aee5f0178e6ab999e31a0b0d2ad4e0bba0.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c39e7e908459bcc1e0f7ac61-L1RW-U04.mp4","captions":[{"start":4.82,"end":7.44,"text":"In the southeast part of Mexico,"},{"start":8.02,"end":9.5,"text":"known as the Yucatan,"},{"start":10.12,"end":12.8,"text":"there are many rich green forests."},{"start":21.8,"end":26.12,"text":"Here these amazing holes are the only spaces in the\ntrees."},{"start":26.8,"end":28.28,"text":"They are very deep."},{"start":28.28,"end":30.22,"text":"They are made of rock,"},{"start":30.72,"end":32.76,"text":"and they are often full of water."},{"start":33.6,"end":36.06,"text":"Mexicans call these places cenotes."},{"start":38.62,"end":41.36,"text":"Almod Torres Talamente is a scientist."},{"start":42.14,"end":42.8,"text":"For him,"},{"start":43.1,"end":45,"text":"the cenotes are very special."},{"start":45,"end":54.12,"text":"He studies them and the plants and animals in and\naround them."},{"start":65.48,"end":68,"text":"Water is very important in the Yucatan."},{"start":68,"end":71,"text":"It rains a lot here, but there are"},{"start":71,"end":71.26,"text":"no"},{"start":71.26,"end":73,"text":"lakes or rivers."},{"start":81.68,"end":83.08,"text":"When it rains,"},{"start":83.44,"end":86.72,"text":"the water goes down into the rock under the Yucatan."},{"start":95.22,"end":98.25999999999999,"text":"Over time, it makes the cenotes."},{"start":122.8,"end":127.6,"text":"Cenotes are the only places to find fresh water in the\nYucatan."},{"start":138.5,"end":142.76,"text":"They help the animals and plants in the forest live."},{"start":148,"end":149.07999999999998,"text":"Lily pads,"},{"start":149.68,"end":150.07999999999998,"text":"fish,"},{"start":150.62,"end":155.56,"text":"and turtles all live at the top of the cenotes where\nit's warm and light."},{"start":161.26,"end":164.54,"text":"But when Almo swims deeper into the cave,"},{"start":164.9,"end":166.48,"text":"it gets cold and dark."},{"start":168.76,"end":171.76,"text":"How can anything live here?"},{"start":174.4,"end":177.66,"text":"But even here, the scientist finds life."}],"launchInline":true}},{"id":"B01-RW-U04-classroom:material:RW-M03","book":1,"unit":4,"track":"RW","topic":"PLACES","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[85],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a54962e66cc2b4103d5e8f7f7268697b89fc24ec0b222a496de7179952dc2632.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track\nMy blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.\n2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.\n3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.\n4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.","sourcePage":85},{"body":"5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight.","sourcePage":85}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U04-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Who needs to be comfortable? The scenery is amazing!","pages":[{"page":85,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a54962e66cc2b4103d5e8f7f7268697b89fc24ec0b222a496de7179952dc2632.png","width":772,"height":1040}],"source":85,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track\nMy blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.\n2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.\n3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.\n4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.","sourcePage":85},{"body":"5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight.","sourcePage":85}],"text":"Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track\nMy blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.\n2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.\n3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.\n4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.\n5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/32fd22b8635f0f868205abff9e261d2735a767d27210259d00850dd04fd0cfa6.mp3"},"original":{"id":"B01-RW-U04-material:RW-M03","entry":"material:RW-M03","unitId":"B01-RW-U04","book":1,"track":"RW","unit":4,"title":"Who needs to be comfortable? The scenery is amazing!","kind":"material","pages":[85],"sourceImages":[{"page":85,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a54962e66cc2b4103d5e8f7f7268697b89fc24ec0b222a496de7179952dc2632.png","viewEvidenceReported":true}],"text":"Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track\nMy blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.\n2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.\n3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.\n4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.\n5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b1972"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/32fd22b8635f0f868205abff9e261d2735a767d27210259d00850dd04fd0cfa6.mp3","continueOnPage":true}},{"id":"B01-RW-U04-classroom:material:RW-M04","book":1,"unit":4,"track":"RW","topic":"PLACES","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c8f4bce8b42ca2a43ea7a7c0b86c009c41e9a6ae42c7b0d90109509f1e5a3dd9.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 The Maldives are islands in the Indian Ocean. The islands are near Sri Lanka. The Maldives are famous for their good climate, beautiful beaches and warm seas.\n2 There are 580,000 people in the Maldives. Most people live on small islands.\n3 The capital of the Maldives is Malé. It is a modern ci ue,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-RW-U04-question:b2045":{"rows":{"b2045.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B01-RW-U04-classroom:material:RW-M03":[{"body":"Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track","sourcePage":85,"blocks":[{"kind":"text","text":"Who needs to be comfortable?"},{"kind":"text","text":"The scenery is amazing!"},{"kind":"text","text":"1 Day 2 on the Milford Track"}]},{"body":"My blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.","sourcePage":85,"blocks":[{"kind":"text","text":"My blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track."}]},{"body":"2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.\n3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.","sourcePage":85,"blocks":[{"kind":"text","text":"2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life."},{"kind":"text","text":"3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest."}]},{"body":"4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.","sourcePage":85,"blocks":[{"kind":"text","text":"4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views."}]},{"body":"5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight.","sourcePage":85,"blocks":[{"kind":"text","text":"5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight."}]}],"B01-RW-U04-classroom:material:RW-M04":[{"body":"1 The Maldives are islands in the Indian Ocean. The islands are near Sri Lanka. The Maldives are famous for their good climate, beautiful beaches and warm seas.\n2 There are 580,000 people in the Maldives. Most people live on small islands.","sourcePage":88,"blocks":[{"kind":"text","text":"1 The Maldives are islands in the Indian Ocean. The islands are near Sri Lanka. The Maldives are famous for their good climate, beautiful beaches and warm seas."},{"kind":"text","text":"2 There are 580,000 people in the Maldives. Most people live on small islands."}]},{"body":"3 The capital of the Maldives is Malé. It is a modern city with an international airport and a big harbour¹.\n4 People in Malé speak English and Dhivehi. English is useful because many tourists come here.","sourcePage":88,"blocks":[{"kind":"text","text":"3 The capital of the Maldives is Malé. It is a modern city with an international airport and a big harbour¹."},{"kind":"text","text":"4 People in Malé speak English and Dhivehi. English is useful because many tourists come here."}]},{"body":"5 Tourism and fishing are very important industries in the Maldives. There are many tourist hotels. Many people work there. Others work as fishermen or in fish factories². The currency is the rufiyaa.\n¹ harbour (n) area of water next to land for ships and boats","sourcePage":88,"blocks":[{"kind":"text","text":"5 Tourism and fishing are very important industries in the Maldives. There are many tourist hotels. Many people work there. Others work as fishermen or in fish factories². The currency is the rufiyaa."},{"kind":"text","text":"¹ harbour (n) area of water next to land for ships and boats"}]},{"body":"² factories (n) buildings where a large number of things or products are made\n³ currency (n) the money a country uses\n⁴ industry (n) types of businesses","sourcePage":88,"blocks":[{"kind":"text","text":"² factories (n) buildings where a large number of things or products are made"},{"kind":"text","text":"³ currency (n) the money a country uses"},{"kind":"text","text":"⁴ industry (n) types of businesses"}]},{"body":"¹ harbour (n) area of water next to land for ships and boats\n² factories (n) buildings where a large number of things or products are made\n³ currency (n) the money a country uses\n⁴ industry (n) types of businesses","sourcePage":88,"blocks":[{"kind":"text","text":"¹ harbour (n) area of water next to land for ships and boats"},{"kind":"text","text":"² factories (n) buildings where a large number of things or products are made"},{"kind":"text","text":"³ currency (n) the money a country uses"},{"kind":"text","text":"⁴ industry (n) types of businesses"}]},{"body":"FULL NAME: Republic of Maldives POPULATION: 580,000 CAPITAL: Malé GEOGRAPHY: 1,192 islands CLIMATE: good, average temperature +30 °C","sourcePage":88,"blocks":[{"kind":"table","rows":[[{"text":"FULL NAME:","header":false},{"text":"Republic of Maldives","header":false}],[{"text":"POPULATION:","header":false},{"text":"580,000","header":false}],[{"text":"CAPITAL:","header":false},{"text":"Malé","header":false}],[{"text":"GEOGRAPHY:","header":false},{"text":"1,192 islands","header":false}],[{"text":"CLIMATE:","header":false},{"text":"good, average temperature +30 °C","header":false}]]}]},{"body":"FULL NAME: Republic of Maldives LANGUAGES: Dhivehi and English RELIGION: Islam CURRENCY³: rufiyaa INDUSTRY⁴: tourism and fishing","sourcePage":88,"blocks":[{"kind":"table","rows":[[{"text":"FULL NAME:","header":false},{"text":"Republic of Maldives","header":false}],[{"text":"LANGUAGES:","header":false},{"text":"Dhivehi and English","header":false}],[{"text":"RELIGION:","header":false},{"text":"Islam","header":false}],[{"text":"CURRENCY³:","header":false},{"text":"rufiyaa","header":false}],[{"text":"INDUSTRY⁴:","header":false},{"text":"tourism and fishing","header":false}]]}]},{"body":"6 I live on an island south of Malé. Life on my island is very simple. There are some shops and there is one mosque. We speak Dhivehi but we also learn English in high school. It is a nice place to live.\n7 The Maldives are famous for their fish. There is a popular fish soup here. It is called garudiya. It is delicious.","sourcePage":88,"blocks":[{"kind":"text","text":"6 I live on an island south of Malé. Life on my island is very simple. There are some shops and there is one mosque. We speak Dhivehi but we also learn English in high school. It is a nice place to live."},{"kind":"text","text":"7 The Maldives are famous for their fish. There is a popular fish soup here. It is called garudiya. It is delicious."}]},{"body":"8 People in the Maldives like to swim and dive.","sourcePage":88,"blocks":[{"kind":"text","text":"8 People in the Maldives like to swim and dive."}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"col ng in the water."}},"basis":"教材第 82 页 Ex 2 的四组词和教师书 PDF 第 39 页的完整句。","itemPatches":{"b1958.i01":{"options":[]},"b1958.i02":{"options":[]},"b1958.i03":{"options":[]},"b1958.i04":{"options":[]}},"rewriteKey":""},"B01-RW-U04-question:b1976":{"rows":{"b1976.i01":{"mode":"line","answer":"New Zealand"},"b1976.i02":{"mode":"line","answer":"Fiordland National Park, in the southwest of New Zealand"},"b1976.i03":{"mode":"line","answer":"Mintaro Hut"},"b1976.i04":{"mode":"line","answer":"Lake Te Anau, beautiful forest, views of the river and the mountains, waterfalls, Lake Mintaro and fantastic views."}},"basis":"教材第 85 页探访 Milford Track 的文章、第 86 页 Ex 5 与教师书 PDF 第 40 页。","materials":[{"id":"B01-RW-U04-classroom:material:RW-M03","title":"READING 1","text":"Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track\nMy blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the Fiordland National Park in the southwest of New Zealand. I'm walking the Milford Track.\n2 It's the end of Day 2, and I'm staying at the Mintaro Hut. This is not a luxury hotel, but it doesn't matter. In the past two days, I have seen some of the most beautiful scenery of my life.\n3 Day 1 was easy. We travelled across Lake Te Anau to start our walk. Then we walked only five kilometres through beautiful forest.\n4 Today we walked along the Clinton Valley with beautiful views of the river and the mountains. We walked past some amazing waterfalls and arrived at Lake Mintaro. Tomorrow, we walk up a mountain for more fantastic views.\n5 I'm very tired, but very happy. Who needs a luxury hotel? After a lot of walking, I know I'll sleep very well tonight.","screens":["Who needs to be comfortable?\nThe scenery is amazing!\n1 Day 2 on the Milford Track\nMy blogs are usually about beautiful places with nice hotels. I like comfortable travel. But I also love beautiful scenery. For this trip, I am in the ,"itemPatches":{"b3765.i01":{"options":[]},"b3765.i02":{"options":[]},"b3765.i03":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-RW-U04":{"aspect":1.7777778,"cues":[[4.82,7.44,"In the southeast part of Mexico,","在墨西哥东南部，"],[8.02,9.5,"known as the Yucatan,","被称为尤卡坦人，"],[10.12,12.8,"there are many rich green forests.","有许多丰富的绿林。"],[21.8,26.12,"Here these amazing holes are the only spaces in the trees.","这里这些惊人的洞是树上唯一的空间。"],[26.8,28.28,"They are very deep.","它们是非常深的。"],[28.28,30.22,"They are made of rock,","他们是用石头做的，"],[30.72,32.76,"and they are often full of water.","他们常常是充满水的。"],[33.6,36.06,"Mexicans call these places cenotes.","墨西哥人称这些地方为\"笔记\"."],[38.62,41.36,"Almod Torres Talamente is a scientist.","阿尔莫德·托雷斯·塔拉门特(Almod Torres Talamente)是一个科学家。"],[42.14,42.8,"For him,","为了他"],[43.1,45,"the cenotes are very special.","笔记很特别。"],[45,54.12,"He studies them and the plants and animals in and around them.","他研究它们和周围的植物和动物。"],[65.48,68,"Water is very important in the Yucatan.","水在尤卡坦语中非常重要。"],[68,71,"It rains a lot here, but there are","这里下了很多雨，但是。.."],[71,71.26,"no","无"],[71.26,73,"lakes or rivers.","湖泊或河流。"],[81.68,83.08,"When it rains,","当下雨时，"],[83.44,86.72,"the water goes down into the rock under the Yucatan.","水下进入尤卡坦河下的岩石中。"],[95.22,98.25999999999999,"Over time, it makes the cenotes.","随着时间的流逝，它制造了笔记。"],[122.8,127.6,"Cenotes are the only places to find fresh water in the Yucatan.","锡诺特是尤卡坦岛上唯一能找到淡水的地方。"],[138.5,142.76,"They help the animals and plants in the forest live.","它们帮助森林中的动物和植物生存。"],[148,149.07999999999998,"Lily pads,","百合垫，"],[149.68,150.07999999999998,"fish,","鱼"],[150.62,155.56,"and turtles all live at the top of the cenotes where it's warm and light.","和龟都住在顶端的笔记上里面是温暖和光明的。"],[161.26,164.54,"But when Almo swims deeper into the cave,","但当阿尔莫游进洞穴深处时，"],[164.9,166.48,"it gets cold and dark.","它变得寒冷和黑暗。"],[168.76,171.76,"How can anything live here?","怎么会有什么东西住在这里？"],[174.4,177.66,"But even here, the scientist finds life.","但即使在这里，科学家也找到了生命。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B01-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/43bc79d96c1ab4c1c65fd30680983178026a8a97dcc42e2a052e66e91158d0e8.pdf","size":28669491},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22 function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){

  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));

  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));

  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);

 const matchGrid=doc.querySelector(".flow-match-pictures");

  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?

 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};

if(classroom.openings.length&&startView==="openings")sequenceView.value="openings";

if(/^[12]$/.test(selectedLesson??""))document.getElementById("lesson-filter").value=primary[0].track+selectedLesson;
updateSequenceHeading();
summaries();display(navigationOrder()[0]??0);
