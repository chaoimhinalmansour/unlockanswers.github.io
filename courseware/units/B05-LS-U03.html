type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/40acaea546645ee09b7a3c87-L5LS-U03.mp4","captions":[{"start":1.1,"end":4.92,"text":"Privacy is key to online safety and security."},{"start":5.8,"end":10.1,"text":"When cybercriminals obtain unauthorized access to our\ninformation,"},{"start":10.58,"end":12.38,"text":"or hack a computer system,"},{"start":12.8,"end":16.42,"text":"it can cause significant problems for individuals,"},{"start":16.84,"end":17.26,"text":"businesses,"},{"start":17.72,"end":18.74,"text":"and organizations."},{"start":20.48,"end":25.92,"text":"It's estimated that cybercrime costs the global economy\nup to $ten .five"},{"start":25.92,"end":27.9,"text":"trillion each year."},{"start":29,"end":33.38,"text":"Much of this is caused by the actions of malicious\nhackers,"},{"start":34.14,"end":37.54,"text":"individuals who may be motivated initially by\ncuriosity,"},{"start":38.06,"end":42.78,"text":"but later by the desire for financial gain or personal\nrecognition,"},{"start":43.14,"end":45.84,"text":"or a simple desire to disrupt systems."},{"start":46.78,"end":53.36,"text":"Such hackers find ways to bypass computer security\nmeasures in order to interfere with websites,"},{"start":53.9,"end":56.66,"text":"crash servers, or cause power outages."},{"start":56.66,"end":60.16,"text":"They may also gain access to individuals'"},{"start":60.86,"end":62.06,"text":"personal online accounts,"},{"start":62.38,"end":70.12,"text":"including bank accounts, or engage in data theft by\naccessing private documents and confidential\ninformation."},{"start":71.08,"end":71.66,"text":"Fortunately,"},{"start":72.06,"end":79.44,"text":"businesses and organizations worldwide can try to keep\nthemselves safe by employing ethical hackers,"},{"start":80.02,"end":86.16,"text":"whose job it is to stop malicious hackers taking\nadvantage of vulnerabilities in their clients'"},{"start":88.56,"end":91.86,"text":"They do this by launching controlled cyberattacks,"},{"start":92.32,"end":96.08,"text":"with the goal of identifying and then resolving\nweaknesses."},{"start":97.28,"end":101.92,"text":"Ethical hackers adopt the same strategies and tactics\nas malicious hackers,"},{"start":102.3,"end":105.44,"text":"but instead employ them for constructive purposes."},{"start":106.5,"end":107.22,"text":"Interestingly,"},{"start":107.64,"end":110.5,"text":"many originally started on the wrong side of the law."},{"start":111.32,"end":114.4,"text":"They often learned their skills in online chat rooms,"},{"start":114.78,"end":119.1,"text":"and then progressed to hacking into systems and\nwebsites to test those skills."},{"start":120,"end":122.2,"text":"Some faced legal consequences,"},{"start":122.68,"end":124.48,"text":"including arrest and jail time,"},{"start":124.9,"end":128.92,"text":"before questioning their own values and leaving\ncybercrime behind."},{"start":128.92,"end":136.68,"text":"But a successful ethical hacking career does not simply\ncome from a belief in the importance of right and\nwrong."},{"start":137.24,"end":139.22,"text":"Ethical hackers need to be curious,"},{"start":139.52,"end":140.76,"text":"work well in a team,"},{"start":141.18,"end":142.34,"text":"have research skills,"},{"start":142.82,"end":144,"text":"enjoy problem solving,"},{"start":144.57999999999998,"end":146.66,"text":"and be willing to learn from failures."},{"start":147.76,"end":151.6,"text":"Their key challenge comes from the unpredictable nature\nof their work."},{"start":151.6,"end":156.52,"text":"Malicious hackers choose the time and method of their\ncyberattack,"},{"start":157.04,"end":161,"text":"making it harder for ethical hackers to secure systems\neffectively."},{"start":162.32,"end":165.2,"text":"Cybercrime may never be eradicated completely,"},{"start":166.02,"end":170.86,"text":"but ethical hackers play a crucial role in minimizing\nthe damage caused."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 4 b 1 c 5 d 2 e 3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":34,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7566","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Write T (true), F (false) or DNS (does not say) next to the statements below.","pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/19bd939617b62f73bc214a73a5ebd5825a4c8a6c295d3aa56b64ee9b898ce933.png"],"provided":"","items":[{"id":"b7566.i01","label":"1","prompt":"Worldwide, $10.5 trillion is spent fighting cybercrime every year.","options":["T (true)","F (false)","DNS (does not say)"],"type":"choice/closed"},{"id":"b7566.i02","label":"2","prompt":"All hackers pose a threat to businesses and organizations.","options":["T (true)","F (false)","DNS (does not say)"],"type":"choice/closed"},{"id":"b7566.i03","label":"3","prompt":"Some ethical hackers started out as cybercriminals.","options":["T (true)","F (false)","DNS (does not say)"],"type":"choice/closed"},{"id":"b7566.i04","label":"4","prompt":"As ethical hackers gain experience, they become better at predicting what cybercriminals will do.","options":["T (true)","F (false)","DNS (does not say)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7566.i01","label":"1","prompt":"Worldwide, $10.5 trillion is spent fighting cy references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Why might a malicious hacker choose to start working in cybersecurity?"},{"kind":"text","text":"2 How willing would you be to employ a former cybercriminal to resolve your business's security issues?"},{"kind":"text","text":"3 To what extent do you agree that cybercrime may never be eradicated, and why?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 They may want to use their skills legally\nand earn a stable income, or they might\nwant to make a positive impact by\nhelping others secure their systems.\n2 I’d be cautiously open to it, provided\nthey’ve reformed, have credible\nreferences, and can demonstrate\nethical intentions.\n3 I agree; technology constantly evolves,\nwhich means new vulnerabilities will\nalways emerge, making complete\neradication very difficult.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7571","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":1,"order":7,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a moderated public forum about ithubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7572","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":1,"order":8,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the sentences and choose the best definition (a–c) for the words in bold.","pages":[62,63],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/19f05456fff874d10f949657c92d8985685d5437b4ee3f2cd00d48d6a1fec6d7.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ce6ecf1cb1f2ff05fecda3c9ea2d06ee9baf72b02d2d5684adb95db5e11808b3.png"],"provided":"The interviews with detectives who solve crimes involving identity theft gave viewers an insight into the threats that exist online.\nYou can buy the cheaper security software, but the trade-off is that it will probably not work as well as the more expensive products.","items":[{"id":"b7572.i01","label":"1","prompt":"This law was passed in the interest of protecting public safety.","options":["as one option for","for the purpose of","to limit the cost of"],"type":"choice/closed"},{"id":"b7572.i02","label":"2","prompt":"The court requires a legitimate reason for requesting information about private citizens.","options":["valid","easy to understand","bringing benefits to many people"],"type":"choice/closed"},{"id":"b7572.i03","label":"3","prompt":"The manager was compelled to resign because his actions had led to a huge loss of customers' financial information.","options":["to force somebody to do something","to advise somebody to ng about the physical world – like unlocking the door to your apartment.","options":[],"type":"select/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7589.i01","label":"1","prompt":"We'll take questions and comments from listeners at the end of the programme. (6)","options":[],"type":"select/closed"},{"kind":"item","id":"b7589.i02","label":"2","prompt":"Joel, should companies have to hand over information about their customers? (5)","options":[],"type":"select/closed"},{"kind":"item","id":"b7589.i03","label":"3","prompt":"Law enforcement is made more difficult without access to this kind of information.","options":[],"type":"select/closed"},{"kind":"item","id":"b7589.i04","label":"4","prompt":"I think the majority of these agencies have their own experts.","options":[],"type":"select/closed"},{"kind":"item","id":"b7589.i05","label":"5","prompt":"Without evidence from surveillance that's admissible in court, we don't have a hope of putting them away.","options":[],"type":"select/closed"},{"kind":"item","id":"b7589.i06","label":"6","prompt":"The information on that phone doesn't belong to the tech company; it belongs to a private individual.","options":[],"type":"select/closed"}],[{"kind":"item","id":"b7589.i07","label":"7","prompt":"That might be true if we were talking about the physical world – like unlocking the door to your apartment.","options":[],"type":"select/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 3.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/89d39069150850f0f468abb041c6e3438a892d84bc8fcec0ca3407305587a814.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  We’ll take questions and comments from listeners at\nthe end of the programme.\n2  Joel, should companies have to hand over information\nabout their customers?\n3  Law enforcement is made more difficult without access\nto this kind of information.\n4  I think the majority of these agencies have their own\nexperts.\n5   Without evidence from surveillance that’s admissible in\ncourt, we don’t have a hope of putting them away.\n6  The information on that phone doesn’t belong to the\ntech company; it belongs to a private individual.\n7  That might be true if we were talking about the physical\nworld – like unlocking the door to your apartment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7591","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":1,"order":16,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[66],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6850b83fb32e46c4f62c80bdedbc49532c0fc8fabf009a5b07e72f92a475fb85.png"],"provided":"","items":[{"id":"b7591.i01","label":"1","prompt":"Which of the speakers in Listening 1 do you agree with? Why?","options":[],"type":"discuss/open"},{"id":"b7591.i02","label":"2","prompt":"Will any of the information change how you store personal information? What will you do differently?","options":[],"type":"discuss/open"},{"id":"b7591.i03","label":"3","prompt":"What kind of crime do you think police need information from private devices to solve? How would they have got this information before the invention of mobile technology?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7591.i01","label":"1","prompt":"Which of the speakers in Listening 1 do you agree with? Why?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7591.i02","label":"2","prompt":"Will any of the information change how you store personal information? What will you do differently?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7591.i03","label":"3","prompt":"What kind of crime do you think police need information from private devices to solve? How would they have got this information before the invention of mobile technology?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I agree with Karina because she\nsupports data sharing only with a\nwarrant, balancing privacy and security,\nand opposes device cracking to protect\npersonal data.\n2 Yes, I’ll be more careful with my personal\ninformation. I’ll avoid storing sensitive\ninfo directly on my device and use\nstronger encryption and backup options.\n3 Police might need information from\ndevices for crimes like organized crime\nor trafficking. Before mobile tech,\nthey relied on wiretaps, informants, or\nphysical records to gather evidence.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7592","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":1,"order":17,"module":"LISTENING 1","ex":"11","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Plan and write a 200-word essay explaining to what extent you agree with ONE of the following statements.","pages":[66],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6850b83fb32e46c4f62c80bdedbc49532c0fc8fabf009a5b07e72f92a475fb85.png"],"provided":"- Tech companies should have to give information about the activities of private individuals to the police.\n- Tech companies should have to help law enforcement agencies break into the devices of private individuals.\n\nIn your essay, you should include:\n- an introduction identifying the statement you are evaluating and why it is important\n- one paragraph in support of the statement, giving reasons\n- one paragraph against the statement, giving reasons\n- conclusion giving your opinion\n\nWhether or not tech companies should be required to ... is a controversial question, which it is important to discuss because ...","items":[{"id":"b7592.i01","label":"1","prompt":"Write a 200-word essay explaining to what extent you agree with ONE of the given statements, following the required structure.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Tech companies should have to give information about the activities of private individuals to the police."},{"kind":"text","text":"- Tech companies should have to help law enforcement agencies break into the devices of private individuals."},{"kind":"text","text":"In your essay, you should include:"},{"kind":"text","text":"- an introduction identifying the statement you are evaluating and why it is important"},{"kind":"text","text":"- one paragraph in support of the statement, giving reasons"},{"kind":"text","text":"- one paragraph against the statement, giving reasons"}],[{"kind":"text","text":"- conclusion giving your opinion"},{"kind":"text","text":"Whether or not tech companies should be required to ... is a controversial question, which it is important to discuss because ..."},{"kind":"item","id":"b7592.i01","label":"1","prompt":"Write a 200-word essay explaining to what extent you agree with ONE of the given statements, following the required structure.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Whether or not tech companies should be\nrequired to help law enforcement agencies\nbreak into the devices of private individuals\nis a controversial question, involving a\ntrade-off between combating crime and\nsafeguarding individual privacy.\nMany people argue that it is in the interests\nof public safety to compel IT companies to\nenable police and other law enforcement\nagencies to have access to data stored\nin the devices of people who are under\ncriminal investigation. Enabling the police\nto access messages stored on the phones\nof criminals could provide vital evidence\nthat could lead to a conviction. Perhaps\nmore importantly, it could even enable\nthe authorities to prevent a crime from\nhappening, for example if two people\nwere exchanging messages about a plot to\ncommit an act of terrorism.\nHowever, it could be argued that if the\nauthorities are to be given such powers,\nthese could easily be abused. Law-abiding\ncitizens may find that their private business\nbecomes public knowledge. Tools for\ndeciphering encrypted messages could\nfall into the wrong hands, and be used by\ncriminals to commit fraud.\nProvided it is possible to gain access to\ndevices in a fair and appropriate manner,\nI believe that tech companies should be\nrequired to help the authorities combat crime\nby allowing them access wherever required.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7596","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Put the words and phrases in order to make sentences. Then complete them with the correct form of the verb in brackets in the present tense.","pages":[67],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/23cf0be7b56a4d01700607ce333a4decf99c1605d5cc1bd17d155cc0ccbd3fba.png"],"provided":"","items":[{"id":"b7596.i01","label":"1","prompt":"of online retailers / The majority / (offer) / of payment. / a secure form","options":[],"type":"gap/closed"},{"id":"b7596.i02","label":"2","prompt":"the browser. / Some of / (be) stored / the cookies / outside of ____","options":[],"type":"gap/closed"},{"id":"b7596.i03","label":"3","prompt":"the information / Half of / that you / factual errors. / read online / (contain)","options":[],"type":"gap/closed"},{"id":"b7596.i04","label":"4","prompt":"visible / your online activity / (be) / to cybercriminals. / Most of","options":[],"type":"gap/closed"}],"layout":"lis  are usually otherwise"},{"kind":"text","text":"Why do you think it is so common in so many countries for"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It’s hard to say, but I suspect it’s just that\nwell-lit streets simply make people feel\nsafe, as they can see where they are\ngoing without worrying that they are\nheading towards a dangerous situation\nin a dark place.\n2 People need to remain vigilant, for\nexample by checking their bank\nstatements frequently and making\nsure they can account for all the\ntransactions shown.\n3 Law-abiding people may feel it’s\nacceptable to bend rules which don’t\nadversely affect anyone, for example,\nleaving their car parked somewhere for\nslightly longer than they are actually\nallowed to.\n4 It’s true that people working as police\nor at border controls always seem to\nwear uniforms. I suppose it’s a way of\nindicating that they have authority over\nthe general public, who are obliged to\ndo as they say.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7603","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":23,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING ,"references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7606.i01","label":"1","prompt":"When you engage in the online activities in Exercise 2, what kind of information about you is stored online (for example, your search history)? How can this information be used?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7606.i02","label":"2","prompt":"Do you actively control what information gets stored about you? If so, how? If not, why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7606.i03","label":"3","prompt":"Do you always click 'agree' or 'yes' when a website asks you to accept all cookies? Why / Why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7606.i04","label":"4","prompt":"Have you or anybody you know ever been a victim of online fraud in any way? What was stolen? Was the incident reported to the authorities, and what happened in the end?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Lots of things are stored – passwords,\nbank details and personal details, but\nalso things like your interests and political\nbeliefs. This can be used to predict what\nkind of content you might be interested\nin seeing, whether it’s the latest football\nscores or adverts for fishing equipment.\n2 I sometimes control this, for example\nI never allow a site to retain my bank\ndetails, because I worry this might make\nthem more easily available to criminals. /\nI hardly ever control this. I’m usually in\na hurry, so don’t take the time to read\nor click through to make changes when\nasked. I just click ‘agree’.\n3 I have to admit that I do, yes, although I\nprobably should give it more thought. /\nNo, I don’t. I always read the warnings\nand select the option which best limits the\namount of information stored about me.\n4 I’ve been lucky so far, but my uncle\nrecently had someone use his account\nto buy computer games fraudulently.\nHe did not report it to the police but\nhe immediately contacted his bank and\ncancelled his card before the thief could\nmake any big purchases.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7607","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":27,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the sentences. With a partner, discuss the meaning of the words in bold. Use a dictionary to help you.","pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90307a0008614fd0c000a685ec82b593a487d39d40b502d82a93841c932f37e4.png"],"provided":"1 Tariq had worked in internet security for fifteen years when he decided to move on. He changed to a position in finance.\n2 Lana likes to personalize her screen so it looks the way she likes it, by changing settings such as the screen colour.\n3 Whenever Carrie gets a spam email, she tries to trace it to see who it is actually from.\n4 Ilona prefers to work offline as much as she can, as she feels there are fewer security issues that way.\n5 Jaloliddin always disables the camera on his computer in online meetings because he feels uneasy about people seeing him.\n6 Marie is setting up a blog, which she's targeting at young women between 15 and 20 with an interest in make-up.\n7 Zeynah prefers to buy from retailers who can demonstrate that their business is truly sustainable.\n8 Lee Min-jae feels that taking steps to protect himself against online fraud is pointless, because everyone is vulnerable online.","items":[{"id":"b7607.i01","label":"1","prompt":"Tariq had worked in internet security for fifteen years when he decided to move on. He changed to a position in finance.","options":[],"type":"discuss/open"},{"id":"b7607.i02","label":"2","prompt":"Lana likes to personalize her screen so it looks the way she likes it, by changing settings such as the screen colour.","options":[],"type":"discuss/open"},{"id":"b7607.i03","label":"3","prompt":"Whenever Carrie gets a spam email, she tries to trace it to see who it is actually from.","options":[],"type":"discuss/open"},{"id":"b7607.i04","label":"4","prompt":"Ilona prefers to work offline as much as she can, as she feels there are fewer security issues that way.","options":[],"type":"discuss/open"},{"id":"b7607.i05","label":"5","prompt":"Jaloliddin always disables the camera on his computer in online meetings because he feels uneasy about people seeing him.","options":[],"type":"discuss/open"},{"id":"b7607.i06","label":"6","prompt":"Marie is setting up a blog, which she's targeting at young women between 15 and 20 with an interest in make-up.","options":[],"type":"discuss/open"},{"id":"b7607.i07","label":"7","prompt":"Zeynah prefers to buy from retailers who can demonstrate that their business is truly sustainable.","options":[],"type":"discuss/open"},{"id":"b7607.i08","label":"8","prompt":"Lee Min-jae feels that taking steps to protect himself against online fraud is pointless, because everyone is vulnerable online.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Tariq had worked in internet security for fifteen years when he decided to move on. He changed to a position in finance."},{"kind":"text","text":"2 Lana likes to personalize her screen so it looks the way she likes it, by changing settings such as the screen colour."},{"kind":"text","text":"3 Whenever Carrie gets a spam email, she tries to trace it to see who it is actually from."},{"kind":"text","text":"4 Ilona prefers to work offline as much as she can, as she feels there are fewer security issues that way."},{"kind":"text","text":"5 Jaloliddin always disables the camera on his computer in online meetings because he feels uneasy about people seeing him."}],[{"kind":"text","text":"6 Marie is setting up a blog, which she's targeting at young women between 15 and 20 with an interest in make-up."},{"kind":"text","text":"7 Zeynah prefers to buy from retailers who can demonstrate that their business is truly sustainable."},{"kind":"text","text":"8 Lee Min-jae feels that taking steps to protect himself against online fraud is pointless, because everyone is vulnerable online."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 move on: to start a new activity\n2 personalize: to make something suitable for a\nparticular person\n3 trace: to find the origin of something\n4 offline: not connected to the internet\n5 disable: to stop something from working\n6 target: to direct something at somebody\n7 retailer: a business that sells to the public\n8 take steps: to begin to act towards achieving a\nparticular goal","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7608","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":28,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"With your partner, discuss which of the people in Exercise 5 you are most / least similar to, and why.","pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90307a0008614fd0c000a685ec82b593a487d39d40b502d82a93841c932f37e4.png"],"provided":"","items":[{"id":"b7608.i01","label":"1","prompt":"Discuss which of the people in Exercise 5 you are most / least similar to, and why.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U03-question:b7607","kind":"material-reference","title":"LISTENING 2 Ex 5","pages":[70]}],"materials":[],"coursePages":[[{"kind":"item","id":"b7608.i01","label":"1","prompt":"Discuss which of the people in Exercise 5 you are most / least similar to, and why.","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-LS-U03-publisher-sheet:b7607","title":"LISTENING 2 Ex 5 原题面","pages":[70],"text":"1 Tariq had worked in internet security for fifteen years when he decided to move on. He changed to a position in finance.\n2 Lana likes to personalize her screen so it looks the way she likes it, by changing settings such as the screen colour.\n3 Whenever Carrie gets a spam email, she tries to trace it to see who it is actually from.\n4 Ilona prefers to work offline as much as she can, as she feels there are fewer security issues that way.\n5 Jaloliddin always disables the camera on his computer in online meetings because he feels uneasy about people seeing him.\n6 Marie is setting up a blog, which she's targeting at young women between 15 and 20 with an interest in make-up.\n7 Zeynah prefers to buy from retailers who can demonstrate that their business is truly sustainable.\n8 Lee Min-jae feels that taking steps to protect himself against online fraud is pointless, because everyone is vulnerable online.","screens":["1 Tariq had worked in internet security for fifteen years when he decided to move on. He changed to a position in finance.","2 Lana likes to personalize her screen so it looks the way she likes it, by changing settings such as the screen colour.","3 Whenever Carrie gets a spam email, she tries to trace it to see who it is actually from.","4 Ilona prefers to work offline as much as she can, as she feels there are fewer security issues that way.","5 Jaloliddin always disables the camera on his computer in online meetings because he feels uneasy about people seeing him.","6 Marie is setting up a blog, which she's targeting at young women between 15 and 20 with an interest in make-up.","7 Zeynah prefers to buy from retailers who can demonstrate that their business is truly sustainable.","8 Lee Min-jae feels that taking steps to protect himself against online fraud is pointless, because everyone is vulnerable online."],"sources":[{"page":70,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90307a0008614fd0c000a685ec82b593a487d39d40b502d82a93841c932f37e4.png"}],"kind":"task_sheet","sourceBlockIds":["b7607"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I’m definitely not like Jaloliddin, because\nI always like to have my camera enabled\nwhen I’m on a call. And I’d say I’m with\nZeynah on only buying from genuinely\nsustainable retailers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee09 g your privacy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Survey data: 86% had taken steps to (4)____\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Browsers and websites often ask us to (5)____ cookies\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7609.i01","label":"1","prompt":"Discuss what you think BEHAVIOURAL TARGETING means.","options":[],"type":"discuss/open"},{"id":"b7609.i02","label":"COOKIES","prompt":"Discuss what you think COOKIES means.","options":[],"type":"discuss/open"},{"id":"b7609.i03","label":"SECURE COOKIES","prompt":"Discuss what you think SECURE COOKIES means.","options":[],"type":"discuss/open"},{"id":"b7609.i04","label":"4","prompt":"Discuss what you think NON-SECURE COOKIES means.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Notes on technology and privacy talk (Hana Tanaka)","header":false,"colspan":1,"rowspan":1}],[{"text":"How the technology works","header":false,"colspan":1,"rowspan":1}],[{"text":"Survey data: only 9% of people said they had (1)____.","header":false,"colspan":1,"rowspan":1}],[{"text":"Retailers show you adverts for products you've previously viewed","header":false,"colspan":1,"rowspan":1}],[{"text":"This is known as BEHAVIOURAL TARGETING","header":false,"colspan":1,"rowspan":1}],[{"text":"Servers remember which websites users have visited and store this in their browsing history","header":false,"colspan":1,"rowspan":1}],[{"text":"Companies track and remember you with COOKIES","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"table","rows":[[{"text":"Cookies remember what users put in their (2)____","header":false,"colspan":1,"rowspan":1}],[{"text":"Third-party cookies monitor browsing across different sites in order to build (3)____","header":false,"colspan":1,"rowspan":1}],[{"text":"Retail sites use either:","header":false,"colspan":1,"rowspan":1}],[{"text":"SECURE COOKIES or NON-SECURE COOKIES","header":false,"colspan":1,"rowspan":1}],[{"text":"Protecting your privacy","header":false,"colspan":1,"rowspan":1}],[{"text":"Survey data: 86% had taken steps to (4)____","header":false,"colspan":1,"rowspan":1}],[{"text":"Browsers and websites often ask us to (5)____ cookies","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"item","id":"b7609.i01","label":"1","prompt":"Discuss what you think BEHAVIOURAL TARGETING means.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7609.i02","label":"COOKIES","prompt":"Discuss what you think COOKIES means.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7609.i03","label":"SECURE COOKIES","prompt":"Discuss what you think SECURE COOKIES means.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7609.i04","label":"4","prompt":"Discuss what you think NON-SECURE COOKIES means.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"behavioural targeting: this could be\nadvertising aimed at a specific person and\nbased on what they are interested in\ncookies: I think this are ways that browsers\nremember what websites a person\nhas visited\nsecure cookies: these must be traces left\nby your browsing, but which aren’t a\nsecurity risk\nnon-secure cookies: this must mean that a\nperson’s browsing history can be seen by\nothers, and may make them vulnerable to\nfraud or online theft\ndisable cookies: these are possibly to stop\ncookies working\nbrowse incognito: I’m not sure, but maybe\nyou are browsing secretly\nflash cookies : I’m guessing but I think these\nmight be something need to watch videos\nweb beacons: I really don’t know about this.\nObviously, because of ‘web’ it’s something\nto do with the internet","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.g text files which are\ndownloaded onto your brower when you\nvisit a site and which save information\nabout what you do while you are on the site\nsecure cookies: cookies which are\ntransmitted over a secure network, sent in a\ntype of code\nnon-secure cookies: cookies which make\npeople more vulnerable to theft\ndisable cookies: preventing sites\nfrom collecting information on their\nweb activities\nbrowse incognito: so no information is\ncollected about their activity\nflash cookies: store information outside\nthe browser\nweb beacons: a tiny invisible graphic on\nweb pages that can tell a server a user is on\na specific page","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7614","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":32,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Are these statements facts (F), the speaker's opinions (O), or do they include both fact and opinion (B)?","pages":[71],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/35a56832ddbd17d3021c456d18f3385a5b35a84626e2da8252c9dfdfa050fc4f.png"],"provided":"","items":[{"id":"b7614.i01","label":"1","prompt":"Companies track your browsing activity and use it to send you advertisements that target you specifically.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"},{"id":"b7614.i02","label":"2","prompt":"Let's be honest, when a website tracks and remembers where you've been, it can be pretty useful.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"},{"id":"b7614.i03","label":"3","prompt":"Every time you visit another site that has advertisements from the same company, the cookies can be traced back to you.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"},{"id":"b7614.i04","label":"4","prompt":"I think more sites will probably move to secure cookies in the future, but for now, only about half of all websites use secure cookies.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7614.i01","label":"1","prompt":"Companies track your browsing activity and use it to send you advertisements that target you specifically.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"},{"kind":"item","id":"b7614.i02","label":"2","prompt":"Let's be honest, when a website tracks and remembers where you've been, it can be pretty useful.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"}],[{"kind":"item","id":"b7614.i03","label":"3","prompt":"Every time you visit another site that has advertisements from the same company, the cookies can be traced back to you.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"},{"kind":"item","id":"b7614.i04","label":"4","prompt":"I think more sites will probably move to secure cookies in the future, but for now, only about half of all websites use secure cookies.","options":["F (fact)","O (speaker's opinion)","B (both fact and opinion)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F 2 O 3 F 4 B (first half opinion, second half fact)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7615","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":33,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in small groups. Based on the content in the listening, discuss what each of the following people (1–5) should do. Use some of the phrases in the box to help you, as well as your own ideas.","pages":[72],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c068b6217d4d58b5b1f69741eaef66250ee3b52be5e6a2850db88978384d9cd4.png"],"provided":"use flash cookies avoid non-secure sites\nbrowse incognito clear the browsing history disable cookies\ntrack consumer behaviour use third-party cookies\nstore information about customers' browsing habits\nuse web beacons","items":[{"id":"b7615.i01","label":"1","prompt":"Tomoko attended the talk about being secure online. In the past, she clicked on 'I agree' whenever asked, but now accepts that she needs to be more in control of her online privacy.","options":[],"type":"discuss/open"},{"id":"b7615.i02","label":"2","prompt":"Piotr is an IT specialist in the marketing department of an online bookshop. His main job is to encourage purchases.","options":[],"type":"discuss/open"},{"id":"b7615.i03","label":"3","prompt":"Helsya feels uneasy that companies she has never purchased from have access to so much information about her as a consumer. She is keen to maintain as much privacy as possible.","options":[],"type":"discuss/open"},{"id":"b7615.i04","label":"4","prompt":"Arón runs a website offering online courses. He wants to know how many users are viewing the information pages for each course, and how many start to fill out an enquiry form but do not submit it.","options":[],"type":"discuss/open"},{"id":"b7615.i05","label":"5","prompt":"Vijay is planning to surprise his wife with a romantic holiday for their wedding anniversary, and is discreetly searching for travel options on the laptop they both use. He is determined to keep it a surprise and for her to not see what he has been looking at.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"use flash cookies avoid non-secure sites"},{"kind":"text","text":"browse incognito clear the browsing history disable cookies"},{"kind":"text","text":"track consumer behaviour use third-party cookies"},{"kind":"text","text":"store information about customers' browsing habits"},{"kind":"text","text":"use web beacons"},{"kind":"item","id":"b7615.i01","label":"1","prompt":"Tomoko attended the talk about being secure online. In the past, she clicked on 'I agree' whenever asked, but now accepts that she needs to be more in control of her online privacy.","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b7615.i02","label":"2","prompt":"Piotr is an IT specialist in the marketing department of an online bookshop. His main job is to encourage purchases.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7615.i03","label":"3","prompt":"Helsya feels uneasy that companies she has never purchased from have access to so much information about her as a consumer. She is keen to maintain as much privacy as possible.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7615.i04","label":"4","prompt":"Arón runs a website offering online courses. He wants to know how many users are viewing the information pages for each course, and how many start to fill out an enquiry form but do not submit it.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7615.i05","label":"5","prompt":"Vijay is planning to surprise his wife with a romantic holiday for their wedding anniversary, and is discreetly searching for travel options on the laptop they both use. He is determined to keep it a surprise and for her to not see what he has been looking at.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Tomoko should be more selective and\nremember that she doesn’t necessarily\nneed to accept cookies in order to\nnavigate to a website.\n2 Piotr needs to find ways to employ\ncookies (including third-party cookies) in\norder to use behavioural targeting more\neffectively, in order to prompt people to\nbuy, and gain new customers.\n3 Helsya should adjust her security\nsettings and disable cookies.\n4 Arón may find that web beacons could\ngive him the information he needs.\n5 Vijay must remember to only browse\nincognito, to delete his search history and\ndisallow cookies. This would reduce the\npossibility of an advert opening up when\nhis wife is using the laptop which could\npotentially ruin the element of surprise.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfP y advertisers when\nI’m surfing the net.\n2 As far as I know, data is collected about\nus by all browsers and most websites,\nalthough I may of course be wrong\nabout that.\n3 One of the things that make this easy\nfor criminals is human error. Social\nengineering attacks, such as phishing,\nrely on manipulating individuals within\nan organization. If employees aren’t\nadequately trained to recognize and\nrespond to these threats, cyber-criminals\nmay find it easier to gain unauthorized\naccess. Organizations need to remain\non guard, and be prepared to employ\nspecialists to ensure their own\ncyber-security.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7621","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Consider the two issues that are explored in this unit: internet use and protecting personal information (review Listening 1) and privacy and crime (review Listening 2). What opinions or behaviour do you want to investigate? Brainstorm a list of topics. (e.g. how people ensure their online security.) e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":37,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7623","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Discuss which of these questions would work well in a survey. Explain your choices.","pages":[74],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/97b5ef0636fbf6ba71c3baf13d83873bdda9e7fdbb48881b68d962d9891f97c5.png"],"provided":"1 How many internet-enabled devices do you use at least once per day?\n2 Do you ever disable cookies when you surf the internet?\n3 How do you protect your information on the internet?\n4 Do you think tech companies should help the police?\n5 How often do you click 'I agree' when a website asks you to enable cookies?\n6 'The police should have to get permission from a judge before obtaining an individual's private information.' Do you agree, disagree or have no opinion?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 How many internet-enabled devices do you use at least once per day?"},{"kind":"text","text":"2 Do you ever disable cookies when you surf the internet?"},{"kind":"text","text":"3 How do you protect your information on the internet?"},{"kind":"text","text":"4 Do you think tech companies should help the police?"},{"kind":"text","text":"5 How often do you click 'I agree' when a website asks you to enable cookies?"},{"kind":"text","text":"6 'The police should have to get permission from a judge before obtaining an individual's private information.' Do you agree, disagree or have no opinion?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"In a survey, questions 1, 2, 5, and 6 would\nwork well because they’re straightforward,\neasy to answer, and can provide clear data.\nQuestion 3 might be too open-ended for\na survey, as it requires a detailed response.\nQuestion 4 could work, but it may be more\nsuitable for a discussion, as it involves a\ncomplex opinion.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7624","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with your group. Complete the tasks to create your survey.","pages":[74],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/97b5ef0636fbf6ba71c3baf13d83873bdda9e7fdbb48881b68d962d9891f97c5.png"],"provided":"1 Choose an issue from Exercise 1 as the topic of your survey.\n2 Write five questions that you feel will give you the information you need to address the issue. Include a variety of question types, such as wh- (information) questions, yes/no questions and statements for participants to agree or disagree with.","items":[{"id":"b7624.i01","label":"Q1","prompt":"Q1: ____","options":[],"type":"gap/open"},{"id":"b7624.i02","label":"Q2","prompt":"Q2: ____","options":[],"type":"gap/open"},{"id":"b7624.i03","label":"Q3","prompt":"Q3: ____","options":[],"type":"gap/open"},{"id":"b7624.i04","label":"Q4","prompt":"Q4: ____","options":[],"type":"gap/open"},{"id":"b7624.i05","label":"Q5","prompt":"Q5: ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-LS-U03-question:b7621","kind":"student-work","title":"CRITICAL THINKING Ex 1","pages":[73]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Choose an issue from Exercise 1 as the topic of your survey."},{"kind":"text","text":"2 Write five questions that you feel will give you the information you need to address the issue. Include a variety of question types, such as wh- (information) questions, yes/no questions and statements for participants to agree or disagree with."},{"kind":"item","id":"b7624.i01","label":"Q1","prompt":"Q1: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7624.i02","label":"Q2","prompt":"Q2: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7624.i03","label":"Q3","prompt":"Q3: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7624.i04","label":"Q4","prompt":"Q4: ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7624.i05","label":"Q5","prompt":"Q5: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"How people ensure their online security\n1 Do you think a new law should be\nintroduced requiring all websites to use\nsecure cookies?\n2 How often do you use incognito mode\nwhen browsing the internet?\n3 Have you been a victim of identity theft?\n4 What anti-virus software do you use?\n5 Do you believe tech companies prioritize\nthe privacy of their users?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7625","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Exchange surveys with another group. Complete the other group's survey in order to give feedback on the points below.","pages":[74],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/97b5ef0636fbf6ba71c3baf13d83873bdda9e7fdbb48881b68d962d9891f97c5.png"],"provided":"- clarity of questions: Are they easy to understand?\n- neutrality of tone: Will your respondents be comfortable answering the questions?","items":[],"layout":"list","references":[{"id":"B05-LS-U03-question:b7624","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[74]}],"materials":[],"coursePages":[[{"kind":"text","text":"- clarity of questions: Are they easy to understand?"},{"kind":"text","text":"- neutrality of tone: Will your respondents be comfortable answering the questions?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Most of the questions are straightforward.\nHowever, some of them might be difficult\nto understand – some people may not\nknow the meaning of some of the technical\nlanguage. Also question three might be\ntoo personal – some people may not feel\ncomfortable answering that. And some of\nthe questions might be better suited to a\ndiscussion rather than a survey.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":37,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7626","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":40,"module":"CRITICAL THINKING","ex":"6","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Think about the results you will get from your survey. Answer the questions.","pages":[74],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/97b5ef0636fbf6ba71c3baf13d83873bdda9e7fdbb48881b68d962d9891f97c5.png"],"provided":"","items":[{"id":"b7626.i01","label":"1","prompt":"Who are the respondents to your survey? What is their age, gender, country of origin, socio-economic status (e.g. are they middle class, rich, etc.), and level of education?","options":[],"type":"qa/open"},{"id":"b7626.i02","label":"2","prompt":"How much do you think these factors will affect their responses?","options":[],"type":"qa/open"},{"id":"b7626.i03","label":"3","prompt":"How much do you think you can generalize from your survey responses to a larger population?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7626.i01","label":"1","prompt":"Who are the respondents to your survey? What is their age, gender, country of origin, socio-economic status (e.g. are they middle class, rich, etc.), and level of education?","options":[],"type":"qa/open"},{"kind":"item","id":"b7626.i02","label":"2","prompt":"How much do you think these factors will affect their responses?","options":[],"type":"qa/open"},{"kind":"item","id":"b7626.i03","label":"3","prompt":"How much do you think you can generalize from your survey responses to a larger population?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The respondents to our survey are adults\naged 18-40, from various backgrounds,\nmostly middle class, with a high school\nor college education.\n2 These factors might affect their\nresponses, as younger people and\nthose with more education might be\nmore aware of online security practices,\nand socio-economic background may\ninfluence opinions on privacy.\n3 We can generalize somewhat, but the\nsurvey may not fully represent other age\ngroups, countries, or income levels, so it\nmay not reflect the broader population.\nPREPARATION FOR\nSPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f44 eb using incognito mode under certain circumstances."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"As you can see from the pie chart, the\nvast majority of respondents browse the\nweb using incognito mode under certain\ncircumstances. The most common reason\ngiven was to prevent data from being\nstored, and this accounted for roughly two\nout of every five responses. One in five said\nthey used incognito mode whenever making\na purchase; this demonstrates that many\npeople do have concerns about the security\nof their banking details online. However,\n11% of respondents said that they never use\nincognito mode for any purpose whatsoever.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[{"page":76,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/089edcc4bebb9486af85417dbdfd47200a7fc93a73f206bede96ef2de0941644.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7638","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":46,"module":"PREPARATION FOR SPEAKING","ex":"6","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"What can you conclude based on the pie chart? Practise presenting your conclusions to others in your group.","pages":[77],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7fc0467a09a43e79e6a53ab75944682d92c9fa6b18c2c22030195770f8103594.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7641","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":47,"module":"SPEAKING TASK","ex":"1","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Work with your group. Look back at the issue you chose as the topic of your survey (Critical thinking, Exercise 4 on page 74) and the tables of analysis of your survey questions (Preparation for Speaking, Exercise 4 on page 75). Does the data you gathered in your survey adequately address the issue you chose? If not, what questions should be asked in a further survey?","pages":[77],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7fc0467a09a43e79e6a53ab75944682d92c9fa6b18c2c22030195770f8103594.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U03-question:b7624","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[74]},{"id":"B05-LS-U03-question:b7634","kind":"student-work","title":"PREPARATION FOR SPEAKING Ex 4","pages":[75]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U03-publisher-page:p074","title":"原题或核对备注所引第74页","pages":[74],"text":"","screens":[],"sources":[{"page":74,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/97b5ef0636fbf6ba71c3baf13d83873bdda9e7fdbb48881b68d962d9891f97c5.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B05-LS-U03-publisher-page:p075","title":"原题或核对备注所引第75页","pages":[75],"text":"","screens":[],"sources":[{"page":75,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a556f098d720d9c51af00f97d577ccef7d4f2338f8a9cb620d9ef30b340b92a.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The data does adequately address the issue\nof how people ensure their online security\nin general terms. However, future surveys\ncould ask further specific question about\nthe use of encryption or privacy-focused\ntools (e.g., VPNs, encrypted messaging),\nthe frequency of reading privacy policies\nbefore using apps or websites, and\nknowledge and use of privacy settings on\nsocial media.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7642","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":48,"module":"SPEAKING TASK","ex":"2","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"What kind of visuals would work best to display your results:\n- a pie chart (for data that adds up to $100\\%$ )?\n- a bar graph (with a bar for each kind of response)?\n- some other type?\n\nCreate your visual(s). Do you want to present all the data visually, or just the most important results? What will you talk about when you are showing these visuals?","pages":[77],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7fc0467a09a43e79e6a53ab75944682d92c9fa6b18c2c22030195770f8103594.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Because there are only 5 questions in which\nresults total 100%, a pie-chart would be\nthe most straightforward way to present\nthe data. This also means that it would be\npossible to present the data without visuals.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7643","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":49,"module":"SPEAKING TASK","ex":"3","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"With your survey group, review your data analysis from Preparation for speaking, Exercise 4 on page 75. What are the limitations of your survey results? How general can you be in your conclusions? How will you express those limitations in your presentations.","pages":[77],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7fc0467a09a43e79e6a53ab75944682d92c9fa6b18c2c22030195770f8103594.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U03-question:b7634","kind":"student-work","title":"PREPARATION FOR SPEAKING Ex 4","pages":[75]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U03-publisher-page:p075","title":"原题或核对备注所引第75页","pages":[75],"text":"","screens":[],"sources":[{"page":75,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a556f098d720d9c51af00f97d577ccef7d4f2338f8a9cb620d9ef30b340b92a.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The survey was only presented to\n20 people, therefore, while general\nconclusions can be drawn, it would be\nnecessary to expand the survery to a much\nwider group of people to be able to draw\nmore definite conclusions.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7644","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":50,"module":"SPEAKING TASK","ex":"4","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Prepare notes to help you remember what to talk about, but do not write out full sentences. Make sure you include the following:","pages":[78],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a66e25410983f1490533ce31567f5ee0ed35f79a381970fd6a1eda5fd16c683.png"],"provided":"- a description of your survey and data collection process, including a description of the population you surveyed and the number of people who participated\n- an explanation of your results, including any visuals you wish to use\n- the conclusions you have drawn from the data\n- limitations on your conclusion","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- a description of your survey and data collection process, including a description of the population you surveyed and the number of people who participated"},{"kind":"text","text":"- an explanation of your results, including any visuals you wish to use"},{"kind":"text","text":"- the conclusions you have drawn from the data"},{"kind":"text","text":"- limitations on your conclusion"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Survey & Data Collection\n• Surveyed population: adults aged 18-40,\nmixed gender, mostly middle-class, high\nschool/college educated\n• Number of participants: 20\n•  Questions focused on online privacy,\nsecurity practices, views on tech\ncompanies’ privacy priorities\nResults & Visuals\n• Strong support (70%) for secure\ncookies law\n• Incognito mode usage: 40% occasional,\n35% frequent, 25% rarely\n• Identity theft: 15% reported\nbeing affected\n• Anti-virus use: 60% commercial software,\n25% free software, 15% no anti-virus\nSkepticism about tech companies’\npriorities: 55% believe privacy isn’t\nprioritized, 30% say it is, 15% neutral\nVisuals: Pie charts for each question,\nshowing majority trends\nConclusions\n• High public demand for secure cookies\nand improved online privacy laws\n• Varied approaches to personal browsing\nhabits and privacy\n• Common distrust of tech companies’\ncommitment to privacy\nLimitations\n• Limited age and socio-economic\ndiversity; doesn’t represent older age\ngroups or other income levels\n• Self-reported data: possible bias or\nunderreporting in responses","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U03-question:b7645","book":5,"unit":3,"track":"LS","topic":"PRIVACY","lesson":2,"order":51,"module":"SPEAKING TASK","ex":"5","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"If you are doing a group presentation, assign roles. Who will ...","pages":[78],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalma PRACTISE"},"instruction":"Give your presentation.","pages":[78],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a66e25410983f1490533ce31567f5ee0ed35f79a381970fd6a1eda5fd16c683.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The survey results indicate mixed views\non online privacy practices and security\nconcerns. In response to the first question,\n70% of respondents support a law requiring\nsecure cookies on all websites, suggesting\nstrong public support for improved\ninternet security measures. About 25% felt\nuncertain, while 5% disagreed, mostly citing\nconcerns about government overreach.\nRegarding private browsing, 40%\nof respondents use incognito mode\noccasionally—mainly for browsing unrelated\nto their usual interests—while 35% reported\nfrequent use for added privacy. The\nremaining 25% rarely or never use incognito\nmode, indicating varied levels of concern\nfor browsing privacy among users.\nSurprisingly, 15% of respondents reported\nbeing victims of identity theft, highlighting\nthat online threats are a real and present risk\nfor many. This figure could indicate either a\ngrowing prevalence of cybercrime or greater\nawareness and reporting among users.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105
