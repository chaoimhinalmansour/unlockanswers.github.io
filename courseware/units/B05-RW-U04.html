long","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B05-RW-U04-question:b8548":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{"b8548.i01":{"mode":"choice","option":3},"b8548.i02":{"mode":"choice","options":[0,1]},"b8548.i03":{"mode":"choice","option":4},"b8548.i04":{"mode":"choice","options":[2,1]}},"textItems":[],"overrideRows":true},"B05-RW-U04-question:b8552":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"textFills":[{"part":0,"block":2,"values":["on a small scale"],"text":"B: Thanks. It's always been my dream to own a business. I'm planning to start (1) __ and sell books by local authors only."},{"part":0,"block":3,"values":["make a profit / generate revenue"],"text":"A: Can you (2) __ by only selling only a small selection of books?"},{"part":0,"block":4,"values":["to break even"],"text":"B: Probably not, but I hope to at least (3) __ so I don't go into debt."},{"part":1,"block":0,"values":["make a profit / generate revenue"],"text":"A: Why don't you think about other ways to (4) __? You could sell mugs, T-shirts and art made by local artists."},{"part":1,"block":1,"values":["start-up costs","brick-and-mortar"],"text":"B: I love your idea, but I'm afraid that would increase my (5) __. I need to keep those low if I want any chance at success. I originally wanted to open a (6) __ business in the neighbourhood but that was just too expensive."},{"part":1,"block":2,"values":["track record"],"text":"A: I understand that. And bookshops haven't had a very good (7) __ in recent years. It seems like more have closed than opened."},{"part":2,"block":0,"values":["marketing tools","Utility bills"],"text":"B: I also don't need sophisticated (8) __ for a mobile business. I'll just paint my van in bright colours and update my social media every day, and I'll be off to a good start. (9) __ will be lower, too. I'll have to pay for gas, of course, but there won't be water or electricity costs."}],"tableEdits":[]},"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U04-classroom:material:RW-M03":[{"body":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a","sourcePage":92,"blocks":[{"kind":"text","text":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a"}]},{"body":"hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.","sourcePage":92,"blocks":[{"kind":"text","text":"hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step."}]},{"body":"2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business.","sourcePage":92,"blocks":[{"kind":"text","text":"2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business."}]},{"body":"In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .","sourcePage":92,"blocks":[{"kind":"text","text":"In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ ."}]},{"body":"3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are","sourcePage":92,"blocks":[{"kind":"text","text":"3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are"}]},{"body":"generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses\nare relatively low-risk propositions.","sourcePage":92,"blocks":[{"kind":"text","text":"generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses"},{"kind":"text","text":"are relatively low-risk propositions."}]},{"body":"4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of","sourcePage":92,"blocks":[{"kind":"text","text":"4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of"}]},{"body":"gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.","sourcePage":92,"blocks":[{"kind":"text","text":"gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state."}]},{"body":"5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and","sourcePage":92,"blocks":[{"kind":"text","text":"5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and"}]},{"body":"continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone","sourcePage":92,"blocks":[{"kind":"text","text":"continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone"}]},{"body":"– the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.","sourcePage":92,"blocks":[{"kind":"text","text":"– the largest in the mobile retail sector – generates an annual revenue of $2.7 billion."}]},{"body":"6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile","sourcePage":92,"blocks":[{"kind":"text","text":"6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile"}]},{"body":"component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building","sourcePage":92,"blocks":[{"kind":"text","text":"component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times."},{"kind":"text","text":"$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building"}]},{"body":"$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business","sourcePage":92,"blocks":[{"kind":"text","text":"$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business"}]}],"B05-RW-U04-classroom:material:RW-M04":[{"body":"# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes,","sourcePage":96,"blocks":[{"kind":"text","text":"# Keeping your — customers"},{"kind":"text","text":"1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes,"}]},{"body":"and subscription services.","sourcePage":96,"blocks":[{"kind":"text","text":"and subscription services."}]},{"body":"2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific","sourcePage":96,"blocks":[{"kind":"text","text":"2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific"}]},{"body":"number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.","sourcePage":96,"blocks":[{"kind":"text","text":"number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers."}]},{"body":"3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable.","sourcePage":96,"blocks":[{"kind":"text","text":"3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable."}]},{"body":"Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.","sourcePage":96,"blocks":[{"kind":"text","text":"Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences."}]},{"body":"4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription","sourcePage":96,"blocks":[{"kind":"text","text":"4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription"}]},{"body":"services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$","sourcePage":96,"blocks":[{"kind":"text","text":"services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$"}]},{"body":"products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty","sourcePage":96,"blocks":[{"kind":"text","text":"products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty"}]},{"body":"schemes, a rich source of data about buying behaviour.","sourcePage":96,"blocks":[{"kind":"text","text":"schemes, a rich source of data about buying behaviour."}]},{"body":"5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having","sourcePage":96,"blocks":[{"kind":"text","text":"5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having"}]},{"body":"paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.","sourcePage":96,"blocks":[{"kind":"text","text":"paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription."}]},{"body":"6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.","sourcePage":96,"blocks":[{"kind":"text","text":"6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones."}]},{"body":"$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","sourcePage":96,"blocks":[{"kind":"text","text":"$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display"}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.", 22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城 hree, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B05-RW-U04":{"aspect":1.9085487,"cues":[[0,9.12,"Visit any UK high street or marketplace and you will find an array of specialist shops from fishmongers to craft boutiques,","参观任何英国高架街道或市场你会发现很多专业商店从渔夫到小店铺"],[9.52,11.28,"coffee shops to fashion stalls.","咖啡店到时装摊。"],[12.14,14.98,"Small businesses are at the heart of Britain's economy.","小企业是英国经济的核心。"],[16.14,17.32,"There are five .two","有五个。.. 2个"],[17.32,22.26,"million small businesses in the UK employing over 12 million people.","英国有百万家小企业雇用了1200多万人。"],[22.78,27.14,"A third of all purchases in the private sector are made at small firms.","私营部门采购的三分之一是小公司采购的。"],[28.58,30.92,"Today, on Small Business Saturday,","今天，关于小生意周六，"],[31.46,33.86,"the retailers are bustling with customers,","零售商们挤满了顾客，"],[34.22,37.5,"encouraged to go out and explore their unique offerings.","鼓励他们出去探索他们独特的祭品。"],[38.62,42.3,"The event takes place on the first Saturday in December every year.","活动于每年12月的第一个星期六举行。"],[42.82,43.48,"Last year,","去年，我们。.."],[43.9,49.24,"over three quarters of a billion pounds were taken at the tills on Small Business Saturday alone.","仅周六的\"小生意\"就收了四分之三多英镑"],[50.22,50.82,"David Young,","大卫·杨，"],[51.14,58.02,"an advisor to the Government on Business and Enterprise, says there has never been a better time to start your own small business.","政府商业和企业顾问说，现在有更好的时机开始自己的小企业。"],[58.6,64.42,"We have far more people working for themselves now than we've ever had now, past before.","我们现在为自己工作的人比以前要多得多。"],[64.82,67.86,"And if you look ahead, it's going to be a small firms world.","如果你往前看，它将会是一个小公司的世界。"],[71,75.3,"But many small business owners feel that times for them are challenging.","但是，许多小企业主感到，对他们来说，时代是挑战性的。"],[75.3,78.3,"The business is still going on.","生意还在继续"],[83.4,88.53999999999999,"Eve recently started her business for just 50 pounds and is struggling to keep afloat.","夏娃最近只开了50磅的生意并努力维持生计"],[88.82,95.1,"The money I earned last week I paid because they gave me the opportunity to open the shop without deposits.","我上周赚的钱是因为他们给我机会开店时没有存款"],[96,98.38,"Just paying every week, I have to pay 200 pounds.","我每周都要付200英镑"],[99.16,101.58,"But they said, you pay 200 deposit.","但他们说，你付200个押金。"],[101.58,103.8,"For the week you start and you pay.","你开始的一周，你支付。"],[103.94,105.94,"So every week Friday I have to pay 200 pounds.","所以每周五我都要付200英镑"],[106.53999999999999,109.86,"Business rates, the taxes that business owners pay on their premises,","企业税率，企业主在其房地缴纳的税款，"],[110.4,114.25999999999999,"are a major cost that many would like to see reduced for smaller businesses.","对于小企业来说，这是许多人希望减少的一大代价。"],[115.06,117.06,"Jamie runs the family greengrocers.","杰米管理着家族的绿种人。"],[117.6,120.94,"His dad sold the family home to start the business ten years ago.","他爸爸10年前卖了家里的生意"],[121.24,125.1,"We could do with a little bit more than just the basic relief rate from the business rates really.","我们可以做一点更多的事情，不只是基本减免率从商业利率真的。"],[125.24,128.6,"Because I mean, we pay a lot for business rates and we don't actually get much for it.","因为，我们花了很多钱来支付商业费用，而实际上我们没有得到很多。"],[128.6,131.88,"We sweep up ourselves, we have to clear up, we have to give it up our own waste.","我们自己扫荡，要清理，要放弃自己的浪费。"],[132.06,132.1,"There's","有个"],[132.1,132.26,"no","无"],[132.26,133.18,"help towards that.","帮助实现这一点。"],[133.4,135.84,"Effectively all we're paying for is the road to these swaps.","实际上，我们所付出的只是这些互换之路。"],[136.06,137.76,"Kate, who has a craft shop,","凯特，他有一个工艺品店，"],[138.14,141.7,"pays seven ,000 pounds a year in business rates on top of her rent.","每年支付7 000英镑的营业租金，而不是她的房租。"],[142.18,145.02,"The tax is calculated according to the size of her shop.","税额根据她的店面大小计算。"],[145.26,146.12,"It's a huge chunk.","这是一个巨大的块。"],[146.26,148.64,"It's over half of what our rent is to be here.","我们这里的租金已经超过一半了"],[148.92000000000002,152.94,"So we do get a small discount on the rates because it's worked out on square footage.","所以，我们确实得到一个小折扣价格，因为它是解决的平方片段。"],[153.14,155.34,"But we're quite a big premises for a small business.","但我们是一个很大的小生意场所。"],[155.34,159.52,"So we don't get as much discount as say some smaller stores would do.","所以，我们没有得到像一些小商店那样的折扣。"],[159.6,161.82,"But it works out at just around seven ,000, seven .five","大约七千，七千，五"],[161.82,162.9,"thousand pounds a year.","一年一千英镑。"],[163.7,168.56,"Business experts agree that there are ways to make life easier for small UK firms.","商业专家一致认为，有使英国小公司生活更加轻松的方法。"],[170.28,175,"The majority of businesses in the UK are small and they start to be able to become medium large businesses.","联合王国的大多数企业是小企业，它们开始能够成为中型大型企业。"],[175.3,176.4,"They need help at the bottom level.","他们需要底层的帮助。"],[176.76,179.7,"So ways to find them to help in terms of access to finance,","因此，找到他们帮助获得资金的途径，"],[180.08,184.14,"but also ways to cut the regulatory burden as well are critical by all parties.","但是，减轻监管负担的方法也是所有各方的关键。"],[185.34,189.62,"Small Business Saturday has been a great success today here in Claygate.","小商周六今天在这里克莱盖特取得了巨大成功。"],[190.16,196.57999999999998,"But such events are just part of what is needed to keep the heart of Britain's economy beating in the years ahead.","但是，这种事件只是维持英国经济在未来几年中跳动的需要的一部分。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B05-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bca4b38a5788ec6ada449ac84df843375dac881fc02b042173e99ae3b588622.pdf","size":27488549}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35"    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;

 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
