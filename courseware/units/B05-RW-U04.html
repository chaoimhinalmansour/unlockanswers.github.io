r":"follow suit","basis":"One shop stopped giving out plastic bags and several others soon decided to follow suit."},{"id":"B05-RW-U04-W-9b5ee7d3c","label":"4","before":"The discount gives people an ","after":" to take the bus.","answer":"incentive","basis":"The discount gives people an incentive to take the bus."}],"bank":["incentive","accumulate","follow suit","attainable"]},{"rows":[{"id":"B05-RW-U04-W-a9aa36b8a","label":"5","before":"The committee is still discussing the results of its ","after":" review.","answer":"ongoing","basis":"The committee is still discussing the results of its ongoing review."},{"id":"B05-RW-U04-W-a2d4d7ee3","label":"6","before":"The website was a ","after":" in the concept of information crowdsourcing.","answer":"pioneer","basis":"The website was a pioneer in the concept of information crowdsourcing."},{"id":"B05-RW-U04-W-31e69adfb","label":"7","before":"For example, loyalty schemes that reward customers with free coffee or members-only discounts are incentives that will lead to customer ","after":".","answer":"retention","basis":"For example, loyalty schemes that reward customers with free coffee or members-only discounts are incentives that will lead to customer retention."},{"id":"B05-RW-U04-W-47a7896ba","label":"8","before":"He ","after":" sold his bookshop shortly before e-books became popular.","answer":"shrewdly","basis":"He shrewdly sold his bookshop shortly before e-books became popular."}],"bank":["ongoing","retention","shrewdly","pioneer"]}],"mode":"wordbank","fitAnswer":true},"provided":"","items":[],"references":[],"materials":[],"issues":[],"feedback":{"placement":"inline","mode":"after","kind":"answer","source":"课堂词汇练习","rows":[{"label":"1","answer":"accumulate","basis":"Dust can accumulate on the shelves if the room is rarely used.","anchor":{"kind":"line"}},{"label":"2","answer":"attainable","basis":"They are simple and easy to understand, but most important, their rewards are attainable.","anchor":{"kind":"line"}},{"label":"3","answer":"follow suit","basis":"One shop stopped giving out plastic bags and several others soon decided to follow suit.","anchor":{"kind":"line"}},{"label":"4","answer":"incentive","basis":"The discount gives people an incentive to take the bus.","anchor":{"kind":"line"}},{"label":"5","answer":"ongoing","basis":"The committee is still discussing the results of its ongoing review.","anchor":{"kind":"line"}},{"label":"6","answer":"pioneer","basis":"The website was a pioneer in the concept of information crowdsourcing.","anchor":{"kind":"line"}},{"label":"7","answer":"retention","basis":"For example, loyalty schemes that reward customers with free coffee or members-only discounts are incentives that will lead to customer retention.","anchor":{"kind":"line"}},{"label":"8","answer":"shrewdly","basis":"He shrewdly sold his bookshop shortly before e-books became popular.","anchor":{"kind":"line"}}]}},{"id":"B05-RW-U04-classroom:resource:b8495","book":5,"unit":4,"topic":"BUSINESS","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[86],"sourcePages":[86],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3dcd56880788fadd4901f964c50b1a0fd42e6f4e29caccb5b70c1cf1f52181b7.png"],"sourceHashes":["3dcd56880788fadd4901f964c50b1a0fd42e6f4e29caccb5b70c1cf1f52181b7"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a compare and contrast essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about problems faced by small, independent businesses."},{"label":"Reading skill","text":"Work out meaning from context."},{"label":"Critical thinking","text":"Analyze advantages and disadvantages"},{"label":"Grammar","text":"Express contrast; use reductions of subordinate clauses."},{"label":"Academic writing skill","text":"Write about similarities and differences."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":86,"alt":""}}]}},{"id":"B05-RW-U04-classroom:resource:b8504","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b4b918f88986e2650afbdc7d5fb0588cc53d7871ff8ffd43cbccf388609390ce.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"private sector","pos":"(n)","definition":"businesses not owned/ controlled by the government","example":"The private sector employs many people in the city.","wordAudio":"private sector","cardWord":false},{"term":"afloat","pos":"(adj)","definition":"having enough money to pay what you owe","example":"The new contract helped keep the company afloat.","wordAudio":"afloat","cardWord":false},{"term":"deposit","pos":"(n)","definition":"an amount of money that you pay when you rent something, and is returned to you when you return the thing you have rented","example":"We paid a deposit when we rented the bikes.","wordAudio":"deposit","cardWord":false},{"term":"premises","pos":"(n)","definition":"the building(s) that a company uses for their business activities","example":"The café moved to larger premises near the station.","wordAudio":"premises","cardWord":false},{"term":"relief","pos":"(n)","definition":"money or other services that provide help for people who need it","example":"The appeal raised money for flood relief.","wordAudio":"relief","cardWord":false},{"term":"regulatory burden","pos":"(n phr)","definition":"laws that business owners have to obey, including laws regarding the amount of tax they pay","example":"Small firms asked the council to reduce the regulatory burden.","wordAudio":"regulatory burden","cardWord":false}]]}},{"id":"B05-RW-U04-classroom:video","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b4b918f88986e2650afbdc7d5fb0588cc53d7871ff8ffd43cbccf388609390ce.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/5ec7d5b7291479bae8b4b43c-L5RW-U04.mp4","captions":[{"start":0,"end":9.12,"text":"Visit any UK high street or marketplace and you will\nfind an array of specialist shops from fishmongers to\ncraft boutiques,"},{"start":9.52,"end":11.28,"text":"coffee shops to fashion stalls."},{"start":12.14,"end":14.98,"text":"Small businesses are at the heart of Britain's economy."},{"start":16.14,"end":17.32,"text":"There are five .two"},{"start":17.32,"end":22.26,"text":"million small businesses in the UK employing over 12\nmillion people."},{"start":22.78,"end":27.14,"text":"A third of all purchases in the private sector are made\nat small firms."},{"start":28.58,"end":30.92,"text":"Today, on Small Business Saturday,"},{"start":31.46,"end":33.86,"text":"the retailers are bustling with customers,"},{"start":34.22,"end":37.5,"text":"encouraged to go out and explore their unique\nofferings."},{"start":38.62,"end":42.3,"text":"The event takes place on the first Saturday in December\nevery year."},{"start":42.82,"end":43.48,"text":"Last year,"},{"start":43.9,"end":49.24,"text":"over three quarters of a billion pounds were taken at\nthe tills on Small Business Saturday alone."},{"start":50.22,"end":50.82,"text":"David Young,"},{"start":51.14,"end":58.02,"text":"an advisor to the Government on Business and\nEnterprise, says there has never been a better time to\nstart your own small business."},{"start":58.6,"end":64.42,"text":"We have far more people working for themselves now than\nwe've ever had now, past before."},{"start":64.82,"end":67.86,"text":"And if you look ahead, it's going to be a small firms\nworld."},{"start":71,"end":75.3,"text":"But many small business owners feel that times for them\nare challenging."},{"start":75.3,"end":78.3,"text":"The business is still going on."},{"start":83.4,"end":88.53999999999999,"text":"Eve recently started her business for just 50 pounds\nand is struggling to keep afloat."},{"start":88.82,"end":95.1,"text":"The money I earned last week I paid because they gave\nme the opportunity to open the shop without deposits."},{"start":96,"end":98.38,"text":"Just paying every week, I have to pay 200 pounds."},{"start":99.16,"end":101.58,"text":"But they said, you pay 200 deposit."},{"start":101.58,"end":103.8,"text":"For the week you start and you pay."},{"start":103.94,"end":105.94,"text":"So every week Friday I have to pay 200 pounds."},{"start":106.53999999999999,"end":109.86,"text":"Business rates, the taxes that business owners pay on\ntheir premises,"},{"start":110.4,"end":114.25999999999999,"text":"are a major cost that many would like to see reduced\nfor smaller businesses."},{"start":115.06,"end":117.06,"text":"Jamie runs the family greengrocers."},{"start":117.6,"end":120.94,"text":"His dad sold the family home to start the business ten\nyears ago."},{"start":121.24,"end":125.1,"text":"We could do with a little bit more than just the basic\nrelief rate from the business rates really."},{"start":125.24,"end":128.6,"text":"Because I mean, we pay a lot for business rates and we\ndon't actually get much for it."},{"start":128.6,"end":131.88,"text":"We sweep up ourselves, we have to clear up, we have to\ngive it up our own waste."},{"start":132.06,"end":132.1,"text":"There's"},{"start":132.1,"end":132.26,"text":"no"},{"start":132.26,"end":133.18,"text":"help towards that."},{"start":133.4,"end":135.84,"text":"Effectively all we're paying for is the road to these\nswaps."},{"start":136.06,"end":137.76,"text":"Kate, who has a craft shop,"},{"start":138.14,"end":141.7,"text":"pays seven ,000 pounds a year in business rates on top\nof her rent."},{"start":142.18,"end":145.02,"text":"The tax is calculated according to the size of her\nshop."},{"start":145.26,"end":146.12,"text":"It's a huge chunk."},{"start":146.26,"end":148.64,"text":"It's over half of what our rent is to be here."},{"start":148.92000000000002,"end":152.94,"text":"So we do get a small discount on the rates because it's\nworked out on square footage."},{"start":153.14,"end":155.34,"text":"But we're quite a big premises for a small business."},{"start":155.34,"end":159.52,"text":"So we don't get as much discount as say some smaller\nstores would do."},{"start":159.6,"end":161.82,"text":"But it works out at just around seven ,000, seven .five"},{"start":161.82,"end":162.9,"text":"thousand pounds a year."},{"start":163.7,"end":168.56,"text":"Business experts agree that there are ways to make life\neasier for small UK firms."},{"start":170.28,"end":175,"text":"The majority of businesses in the UK are small and they\nstart to be able to become medium large businesses."},{"start":175.3,"end":176.4,"text":"They need help at the bottom level."},{"start":176.76,"end":179.7,"text":"So ways to find them to help in terms of access to\nfinance,"},{"start":180.08,"end":184.14,"text":"but also ways to cut the regulatory burden as well are\ncritical by all parties."},{"start":185.34,"end":189.62,"text":"Small Business Saturday has been a great success today\nhere in Claygate."},{"start":190.16,"end":196.57999999999998,"text":"But such events are just part of what is needed to keep\nthe heart of Britain's economy beating in the years\nahead."}],"launchInline":true}},{"id":"B05-RW-U04-classroom:resource:b8516","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[90],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/852b273d8585f33fe9dd8e9063d764cb2ea484612112d3093365b5c2922d6f8c.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["aspiring (adj) wishing to become successful\nbreak even (idiom) to have no profit or loss at the end of a business activity\ncomponent (n) one of the parts of something\nfluctuating (adj) changing frequently from one level to another","outweigh (v) to be greater or more important than something else\nproposition (n) a proposal or suggestion, especially in business\nrevenue (n) the money that a business receives regularly\ntransition (n) a change from one form or type to another"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U04-classroom:material:RW-M03","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[92],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8d79507b39e42960bc8339b03e8f8f1d99b0bc9a46ed6b871c285f1f4132ec2.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.","sourcePage":92},{"body":"2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business. In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .","sourcePage":92},{"body":"3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses are relatively low-risk propositions.","sourcePage":92},{"body":"4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.","sourcePage":92},{"body":"5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.","sourcePage":92},{"body":"6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business","sourcePage":92}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U04-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":92,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8d79507b39e42960bc8339b03e8f8f1d99b0bc9a46ed6b871c285f1f4132ec2.png","width":772,"height":1040}],"source":92,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.","sourcePage":92},{"body":"2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business. In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .","sourcePage":92},{"body":"3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses are relatively low-risk propositions.","sourcePage":92},{"body":"4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.","sourcePage":92},{"body":"5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.","sourcePage":92},{"body":"6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business","sourcePage":92}],"text":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.\n2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business. In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .\n3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses are relatively low-risk propositions.\n4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.\n5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.\n6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01cc70b3d8a2b1d0c412f82d9a4118d2aa19ecf29fa1e3ba14f80a38d3df8ab3.mp3"},"original":{"id":"B05-RW-U04-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U04","book":5,"track":"RW","unit":4,"title":"READING 1","kind":"material","pages":[92],"sourceImages":[{"page":92,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8d79507b39e42960bc8339b03e8f8f1d99b0bc9a46ed6b871c285f1f4132ec2.png","viewEvidenceReported":true}],"text":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A e street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.\n\n5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.\n\n6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building\n\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8523"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01cc70b3d8a2b1d0c412f82d9a4118d2aa19ecf29fa1e3ba14f80a38d3df8ab3.mp3","continueOnPage":true}},{"id":"B05-RW-U04-classroom:material:RW-M04","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[96],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df1bcb0475d1c53d4eaf08490f2a4bf0fa626aea4a6ceff465736e40d0c8495b.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  ","sourcePage":96},{"body":"2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  ","sourcePage":96},{"body":"3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  ","sourcePage":96},{"body":"4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.","sourcePage":96},{"body":"5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","sourcePage":96}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U04-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Keeping your — customers","pages":[{"page":96,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df1bcb0475d1c53d4eaf08490f2a4bf0fa626aea4a6ceff465736e40d0c8495b.png","width":772,"height":1040}],"source":96,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  ","sourcePage":96},{"body":"2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  ","sourcePage":96},{"body":"3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  ","sourcePage":96},{"body":"4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.","sourcePage":96},{"body":"5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","sourcePage":96}],"text":"# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  \n2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  \n3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  \n4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.\n5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92bf666889f89275da9cf919b6db8b90c387fb8fe5ab418d31dd8e755629cb05.mp3"},"original":{"id":"B05-RW-U04-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U04","book":5,"track":"RW","unit":4,"title":"READING 2","kind":"material","pages":[96],"sourceImages":[{"page":96,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df1bcb0475d1c53d4eaf08490f2a4bf0fa626aea4a6ceff465736e40d0c8495b.png","viewEvidenceReported":true}],"text":"# Keeping your — customers\n\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  \n2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  \n3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  \n4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.\n\n5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8537"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92bf666889f89275da9cf919b6db8b90c387fb8fe5ab418d31dd8e755629cb05.mp3","continueOnPage":true}},{"id":"B05-RW-U04-classroom:review-1","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[109],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2eabfcebb0ee01ac421f4112a253c145dba8009fbab4c9918f950c43f4d1ad78.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"wor
