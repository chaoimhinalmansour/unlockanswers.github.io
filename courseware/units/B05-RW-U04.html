,"text":"Visit any UK high street or marketplace and you will\nfind an array of specialist shops from fishmongers to\ncraft boutiques,"},{"start":9.52,"end":11.28,"text":"coffee shops to fashion stalls."},{"start":12.14,"end":14.98,"text":"Small businesses are at the heart of Britain's economy."},{"start":16.14,"end":17.32,"text":"There are five .two"},{"start":17.32,"end":22.26,"text":"million small businesses in the UK employing over 12\nmillion people."},{"start":22.78,"end":27.14,"text":"A third of all purchases in the private sector are made\nat small firms."},{"start":28.58,"end":30.92,"text":"Today, on Small Business Saturday,"},{"start":31.46,"end":33.86,"text":"the retailers are bustling with customers,"},{"start":34.22,"end":37.5,"text":"encouraged to go out and explore their unique\nofferings."},{"start":38.62,"end":42.3,"text":"The event takes place on the first Saturday in December\nevery year."},{"start":42.82,"end":43.48,"text":"Last year,"},{"start":43.9,"end":49.24,"text":"over three quarters of a billion pounds were taken at\nthe tills on Small Business Saturday alone."},{"start":50.22,"end":50.82,"text":"David Young,"},{"start":51.14,"end":58.02,"text":"an advisor to the Government on Business and\nEnterprise, says there has never been a better time to\nstart your own small business."},{"start":58.6,"end":64.42,"text":"We have far more people working for themselves now than\nwe've ever had now, past before."},{"start":64.82,"end":67.86,"text":"And if you look ahead, it's going to be a small firms\nworld."},{"start":71,"end":75.3,"text":"But many small business owners feel that times for them\nare challenging."},{"start":75.3,"end":78.3,"text":"The business is still going on."},{"start":83.4,"end":88.53999999999999,"text":"Eve recently started her business for just 50 pounds\nand is struggling to keep afloat."},{"start":88.82,"end":95.1,"text":"The money I earned last week I paid because they gave\nme the opportunity to open the shop without deposits."},{"start":96,"end":98.38,"text":"Just paying every week, I have to pay 200 pounds."},{"start":99.16,"end":101.58,"text":"But they said, you pay 200 deposit."},{"start":101.58,"end":103.8,"text":"For the week you start and you pay."},{"start":103.94,"end":105.94,"text":"So every week Friday I have to pay 200 pounds."},{"start":106.53999999999999,"end":109.86,"text":"Business rates, the taxes that business owners pay on\ntheir premises,"},{"start":110.4,"end":114.25999999999999,"text":"are a major cost that many would like to see reduced\nfor smaller businesses."},{"start":115.06,"end":117.06,"text":"Jamie runs the family greengrocers."},{"start":117.6,"end":120.94,"text":"His dad sold the family home to start the business ten\nyears ago."},{"start":121.24,"end":125.1,"text":"We could do with a little bit more than just the basic\nrelief rate from the business rates really."},{"start":125.24,"end":128.6,"text":"Because I mean, we pay a lot for business rates and we\ndon't actually get much for it."},{"start":128.6,"end":131.88,"text":"We sweep up ourselves, we have to clear up, we have to\ngive it up our own waste."},{"start":132.06,"end":132.1,"text":"There's"},{"start":132.1,"end":132.26,"text":"no"},{"start":132.26,"end":133.18,"text":"help towards that."},{"start":133.4,"end":135.84,"text":"Effectively all we're paying for is the road to these\nswaps."},{"start":136.06,"end":137.76,"text":"Kate, who has a craft shop,"},{"start":138.14,"end":141.7,"text":"pays seven ,000 pounds a year in business rates on top\nof her rent."},{"start":142.18,"end":145.02,"text":"The tax is calculated according to the size of her\nshop."},{"start":145.26,"end":146.12,"text":"It's a huge chunk."},{"start":146.26,"end":148.64,"text":"It's over half of what our rent is to be here."},{"start":148.92000000000002,"end":152.94,"text":"So we do get a small discount on the rates because it's\nworked out on square footage."},{"start":153.14,"end":155.34,"text":"But we're quite a big premises for a small business."},{"start":155.34,"end":159.52,"text":"So we don't get as much discount as say some smaller\nstores would do."},{"start":159.6,"end":161.82,"text":"But it works out at just around seven ,000, seven .five"},{"start":161.82,"end":162.9,"text":"thousand pounds a year."},{"start":163.7,"end":168.56,"text":"Business experts agree that there are ways to make life\neasier for small UK firms."},{"start":170.28,"end":175,"text":"The majority of businesses in the UK are small and they\nstart to be able to become medium large businesses."},{"start":175.3,"end":176.4,"text":"They need help at the bottom level."},{"start":176.76,"end":179.7,"text":"So ways to find them to help in terms of access to\nfinance,"},{"start":180.08,"end":184.14,"text":"but also ways to cut the regulatory burden as well are\ncritical by all parties."},{"start":185.34,"end":189.62,"text":"Small Business Saturday has been a great success today\nhere in Claygate."},{"start":190.16,"end":196.57999999999998,"text":"But such events are just part of what is needed to keep\nthe heart of Britain's economy beating in the years\nahead."}]}],"courseAnswer":{"kind":"model-excerpt","text":"There is an event, ‘Small Business\nSaturday’, which hopes to attract shoppers\nto small businesses. They are also\ndiscussing the ways that government taxes\ncan help small businesses.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":39,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d47 pay 200 pounds."},{"start":99.16,"end":101.58,"text":"But they said, you pay 200 deposit."},{"start":101.58,"end":103.8,"text":"For the week you start and you pay."},{"start":103.94,"end":105.94,"text":"So every week Friday I have to pay 200 pounds."},{"start":106.53999999999999,"end":109.86,"text":"Business rates, the taxes that business owners pay on\ntheir premises,"},{"start":110.4,"end":114.25999999999999,"text":"are a major cost that many would like to see reduced\nfor smaller businesses."},{"start":115.06,"end":117.06,"text":"Jamie runs the family greengrocers."},{"start":117.6,"end":120.94,"text":"His dad sold the family home to start the business ten\nyears ago."},{"start":121.24,"end":125.1,"text":"We could do with a little bit more than just the basic\nrelief rate from the business rates really."},{"start":125.24,"end":128.6,"text":"Because I mean, we pay a lot for business rates and we\ndon't actually get much for it."},{"start":128.6,"end":131.88,"text":"We sweep up ourselves, we have to clear up, we have to\ngive it up our own waste."},{"start":132.06,"end":132.1,"text":"There's"},{"start":132.1,"end":132.26,"text":"no"},{"start":132.26,"end":133.18,"text":"help towards that."},{"start":133.4,"end":135.84,"text":"Effectively all we're paying for is the road to these\nswaps."},{"start":136.06,"end":137.76,"text":"Kate, who has a craft shop,"},{"start":138.14,"end":141.7,"text":"pays seven ,000 pounds a year in business rates on top\nof her rent."},{"start":142.18,"end":145.02,"text":"The tax is calculated according to the size of her\nshop."},{"start":145.26,"end":146.12,"text":"It's a huge chunk."},{"start":146.26,"end":148.64,"text":"It's over half of what our rent is to be here."},{"start":148.92000000000002,"end":152.94,"text":"So we do get a small discount on the rates because it's\nworked out on square footage."},{"start":153.14,"end":155.34,"text":"But we're quite a big premises for a small business."},{"start":155.34,"end":159.52,"text":"So we don't get as much discount as say some smaller\nstores would do."},{"start":159.6,"end":161.82,"text":"But it works out at just around seven ,000, seven .five"},{"start":161.82,"end":162.9,"text":"thousand pounds a year."},{"start":163.7,"end":168.56,"text":"Business experts agree that there are ways to make life\neasier for small UK firms."},{"start":170.28,"end":175,"text":"The majority of businesses in the UK are small and they\nstart to be able to become medium large businesses."},{"start":175.3,"end":176.4,"text":"They need help at the bottom level."},{"start":176.76,"end":179.7,"text":"So ways to find them to help in terms of access to\nfinance,"},{"start":180.08,"end":184.14,"text":"but also ways to cut the regulatory burden as well are\ncritical by all parties."},{"start":185.34,"end":189.62,"text":"Small Business Saturday has been a great success today\nhere in Claygate."},{"start":190.16,"end":196.57999999999998,"text":"But such events are just part of what is needed to keep\nthe heart of Britain's economy beating in the years\nahead."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 c 2 b 3 c 4 b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":39,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8512","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work in a small group. Discuss the question.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f21bdfc08babbbaa7aea7c503c5f952c2bd1c58a7c0418bc7f0ce8621b701130.png"],"provided":"Would you be prepared to take a risk like selling your home to start a business? If so, in what circumstances? If not, why not?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Would you be prepared to take a risk like selling your home to start a business? If so, in what circumstances? If not, why not?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Yes, I would consider it if I had a solid\nbusiness plan and there was a strong\nmarket demand for the product or service I\nwas providing.\nNo, I wouldn’t risk losing my home. I have\nread that most new businesses fail in the\nfirst year or two. I feel the uncertainty of\nstarting a business is too high.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":39,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8515","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read an article about mobile businesses. Discuss the statements with a partner. Rate each statement on a scale of 1 (completely disagree) to 5 (completely agree).","pages":[90],"sourceImages":[" \n£3,000 to start a mobile business. -2\n3 I think that street food van owners\nusually have less overheads than new\nrestaurant owners. So it is probably\neasier to make a profit. -4\n4 I think mobile business are become\nmore and more popular. -5\n5 I think it is possible that street food vans\nare the most common type of mobile\nbusiness. -3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8517","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"order":9,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the words and their definitions below. Use the correct forms of the words in bold to complete the sentences below.","pages":[90],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/852b273d8585f33fe9dd8e9063d764cb2ea484612112d3093365b5c2922d6f8c.png"],"provided":"","items":[{"id":"b8517.i01","label":"1","prompt":"The price of oil has ____ dramatically since 2000, going from £30 a barrel to almost £120, then down to £70!","options":["aspiring","break even","component","fluctuating","outweigh","proposition","r tions":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B05-RW-U04-classroom:material:RW-M03","title":"READING 1","text":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.\n2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business. In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .\n3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses are relatively low-risk propositions.\n4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.\n5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.\n6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone busi . Many people do not have enough of either of these, so they never take the first step.\n2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business. In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .\n3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses are relatively low-risk propositions.\n4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total tar business (n phr) a business with a physical location in a building\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business"],"sources":[{"page":92,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8d79507b39e42960bc8339b03e8f8f1d99b0bc9a46ed6b871c285f1f4132ec2.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01cc70b3d8a2b1d0c412f82d9a4118d2aa19ecf29fa1e3ba14f80a38d3df8ab3.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 I have always loved inventing my own\nrecipes and cooking unique dishes.\nBecause of this and because food vans\nare very popular right now, I think a food\nvan that serves dishes based on recipes I\ninvent would be successful.\n2 I already know how to create recipes\nand cook; however, neither of us really\nknows anything about owning our\nown business. We would have to take\nclasses on the financial and marketing\naspects of being entrepreneurs. We\nwould also need money for a van and\ncooking equipment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"}]}," hoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.","6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business"],"sources":[{"page":92,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8d79507b39e42960bc8339b03e8f8f1d99b0bc9a46ed6b871c285f1f4132ec2.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01cc70b3d8a2b1d0c412f82d9a4118d2aa19ecf29fa1e3ba14f80a38d3df8ab3.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Dear future business partner,\nI am an aspiring entrepreneur and I recently\nhad a terrific idea for a mobile food\nbusiness. I want to start a food van that\nserves dishes based exclusively on recipes\nthat I have invented. For example, I recently\nmade Asian fusion meatballs and brought\nthem to a party. All evening long, people\ntold me how much they loved them. Any\ntime I cook for people, I tend to receive a\nlot of compliments.\nI believe that I create such unique versions\nof food that a mobile food van based on\nthis idea would be successful, and I want to\ninvite you to help me make my business a\nreality. While I have the creativity and skill\nto make the food, I do not have a lot of\nmoney to invest.\nI have given the matter a lot of thought\nand I have concluded that I would need an\ninitial investment for startup costs such as a\nvan and equipment to cook with, including\nan oven and a refrigerator. Basically, I would\nneed to build a small kitchen in my van.\nWhile the startup costs would be somewhat\nhigh, I think my business is unique, and\ntherefore it would begin to earn revenue\nrelatively quickly. Once that happened, I\nwould be able to repay your investment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8548","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Choose the best contrast connector from the box to complete each sentence. More than one answer may be possible. Use each connector only once.","pages":[99],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/908cf699e66ade8dba2e6d08e5c0dea8e0267d2345d761088b6e02942a2a40b4.png"],"provided":"By contrast However In fact Rather than Unlike","items":[{"id":"b8548.i01","label":"1","prompt":"____ offering bonuses like discounts or free products, some businesses donate a portion of their profits to charity as part of their loyalty scheme.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"},{"id":"b8548.i02","label":"2","prompt":"Some companies offer the same rewards to all loyalty scheme customers. ____, some businesses offer different levels of benefits based on how much the customer spends.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"},{"id":"b8548.i03","label":"3","prompt":"____ major online retailers, small brick-and-mortar businesses often charge low or no fees for their subscription services.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"},{"id":"b8548.i04","label":"4","prompt":"They assumed their mobile business would be successful within a year. ____, it was several years before they made a profit.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"By contrast However In fact Rather than Unlike"},{"kind":"item","id":"b8548.i01","label":"1","prompt":"____ offering bonuses like discounts or free products, some businesses donate a portion of their profits to charity as part of their loyalty scheme.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"},{"kind":"item","id":"b8548.i02","label":"2","prompt":"Some companies offer the same rewards to all loyalty scheme customers. ____, some businesses offer different levels of benefits based on how much the customer spends.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"}],[{"kind":"item","id":"b8548.i03","label":"3","prompt":"____ major online retailers, small brick-and-mortar businesses often charge low or no fees for their subscription services.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"},{"kind":"item","id":"b8548.i04","label":"4","prompt":"They assumed their mobile business would be successful within a year. ____, it was several years before they made a profit.","options":["By contrast","However","In fact","Rather than","Unlike"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Rather than 2 By contrast / However 3 Unlike\n4 In fact / However","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":41,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8549","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Complete the sentences below with a contrast connector from the box and your own information. Compare your answers with a partner. Then discuss other possible connectors you could use in each sentence.","pages":[99],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/908cf699e66ade8dba2e6d08e5c0dea8e0267d2345d761088b6e02942a2a40b4.png"],"provided":"Despite However Instead Instead of Nevertheless Rather Rather than\n1 The restaurant offered unlimited free delivery and a free food item with each purchase. However, they did not see an increase in sales.","items":[{"id":"b8549.i01","label":"2","prompt":"____ spending a lot of money on advertising, ____.","options":[],"type":"discuss/open"},{"id":"b8549.i02","label":"3","prompt":"____ paying full price for an airline ticket, ____.","options":[],"type":"discuss/open"},{"id":"b8549.i03","label":"4","prompt":"Everyone knows that subscription services like Amazon collect our personal data. ____ ____.","options":[],"type":"discuss/open"},{"id":"b8549.i04","label":"5","prompt":"Many people no longer shop at brick-and-mortar businesses. ________________ .","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Despite However Instead Instead of Nevertheless Rather Rather than"},{"kind":"text","text":"1 The restaurant offered unlimited free delivery and a free food item with each purchase. However, they did not see an increase in sales."},{"kind":"item","id":"b8549.i01","label":"2","prompt":"____ spending a lot of money on advertising, ____.","options":[],"type":"discuss/open"},{"kind":"item","id":"b8549.i02","label":"3","prompt":"____ paying full price for an airline ticket, ____.","options":[],"type":"discuss/open"},{"kind":"item","id":"b8549.i03","label":"4","prompt":"Everyone knows that subscription services like Amazon collect our personal data. ____ ____.","options":[],"type":"discuss/open"},{"kind":"item","id":"b8549.i04","label":"5","prompt":"Many people no longer shop at brick-and-mortar businesses. ________________ .","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 Despite / In spite of spending a lot of\nmoney on advertising, the company did\nnot acquire new customers.\n3 Rather than / Instead of paying full price\nfor an airline ticket, she used air miles\nfrom her loyalty scheme and got the\nticket for free.\n4 Everyone knows that subscription\nservices like Amazon collect our\npersonal data. Nevertheless / However,\nthe benefits are worth it for members.\n5 Many people no longer shop at brick-\nand-mortar businesses. Instead / Rather,\nthey do all their shopping online.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8552","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"BUSINESS AND MARKETING VOCABULARY"},"instruction":"Work with a partner. Complete the conversation below with the correct words and phrases from the box. In some items, more than one answer is possible.","pages":[100],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f68dc570b63715a6d4b410b957a39d38d0a17395b4926c3914824d7da6a79d92.png"],"provided":"break even brick-and-mortar generate revenue make a profit marketing tool on a large/small scale start-up costs track record utility bills\n\nA: I heard you were starting a mobile bookshop business. Congratulations!\n\nB: Thanks. It's always been my dream to own a business. I'm planning to start (1) ____ and sell books by local authors only.\n\nA: Can you (2) ____ by only selling only a small selection of books?\n\nB: Probably not, but I hope to at least (3) ____ so I don't go into debt.\n\nA: Why don't you think about other ways to (4) ____? You could sell mugs, T-shirts and art made by local artists.\n\nB: I love your idea, but I'm afraid that would increase my (5) ____. I need to keep those low if I want any chance at success. I originally wanted to open a (6) ____ business in the neighbourhood but that was just too expensive.\n\nA: I understand that. And bookshops haven't had a very good (7) ____ in recent years. It seems like more have closed than opened.\n\nB: I also don't need sophisticated (8) ____ for a mobile business. I'll just paint my van in bright colours and update my social media every day, and I'll be off to a good start. (9) ____ will be lower, too. I'll have to pay for gas, of course, but there won't be water or electricity costs.","items":[{"id":"b8552.i01","label":"1","prompt":"I'm planning to start ____ and sell books by local authors only.","options":["break even","brick-and-mortar","generate revenue","make a profit","marketing tool","on a large/small scale","start-up costs","track record","utility bills"],"type":"choice/closed"},{"id":"b8552.i02","label":"2","prompt":"Can you ____ by only selling only a small selection of books?","options":["break even","brick-and-mortar","generate revenue","make a profit","marketing tool","on a large/small scale","start-up costs","track record","utility bills"],"type":"c options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8532.i01","label":"1","prompt":"What are some things businesses can do to encourage customers to return?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8532.i02","label":"2","prompt":"When you shop, do you prefer to have a lot of items to choose from, for example several brands of shampoo, styles of shoes or types of snacks? Or do you prefer to have fewer choices? Explain your answer.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Businesses can use several techniques\nto encourage customers to return. For\nexample, they can offer discounts and\nearly access to sales, they can give their\ncustomers free gifts with purchases\nand they can provide bonuses like free\nhome delivery.\n2 When I shop, I prefer to have a lot of\nchoices. If something didn’t work for\nme in the past, I like having the option\nto try a different product. I also enjoy\nbrowsing, so having a lot of choices\nmeans there is always something new to\nlook at.\nI prefer fewer choices. If I want to buy\nsomething like shoes or a dress, I don’t\nreally need hundreds of different styles\nand colours to consider. As long as the\nproduct is high quality and suits my\npersonality, I am happy with it.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094 References":[],"issues":[]},{"id":"B05-RW-U04-question:b8536","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"order":23,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay on page 96. Then match the claims made in the essay (a–c) with the evidence that supports the claims (1–3).","pages":[95],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eea27453c311ee984513d26f71f5154cd03fce4d3b97781bbf291088465ca675.png"],"provided":"a Subscription services give customers fewer choices.\nb Subscription services increase sales.\nc Reward schemes are a good way to keep customers loyal.\n1 When customers fly with one airline on multiple trips, that airline rewards them with free travel. ____\n2 Subscription services make decisions for consumers who may have difficulty making decisions for themselves. ____\n3 A company calculated that customers, having paid for the subscription service, will even shop for items they might otherwise buy at the local supermarket. ____","items":[{"id":"b8536.i01","label":"1","prompt":"When customers fly with one airline on multiple trips, that airline rewards them with free travel.","options":["Subscription services give customers fewer choices.","Subscription services increase sales.","Reward schemes are a good way to keep customers loyal."],"type":"choice/closed"},{"id":"b8536.i02","label":"2","prompt":"Subscription services make decisions for consumers who may have difficulty making decisions for themselves.","options":["Subscription services give customers fewer choices.","Subscription services increase sales.","Reward schemes are a good way to keep customers loyal."],"type":"choice/closed"},{"id":"b8536.i03","label":"3","prompt":"A company calculated that customers, having paid for the subscription service, will even shop for items they might otherwise buy at the local supermarket.","options":["Subscription services give customers fewer choices.","Subscription services increase sales.","Reward schemes are a good way to keep customers loyal."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a Subscription services give customers fewer choices."},{"kind":"text","text":"b Subscription services increase sales."},{"kind":"text","text":"c Reward schemes are a good way to keep customers loyal."},{"kind":"text","text":"1 When customers fly with one airline on multiple trips, that airline rewards them with free travel. ____"},{"kind":"text","text":"2 Subscription services make decisions for consumers who may have difficulty making decisions for themselves. ____"}],[{"kind":"text","text":"3 A company calculated that customers, having paid for the subscription service, will even shop for items they might otherwise buy at the local supermarket. ____"}]],"courseMaterials":[{"id":"B05-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  \n2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  \n3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  \n4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.\n5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","screens":["# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  ","2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  ","3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understan omers."},{"kind":"item","id":"b8538.i01","label":"1","prompt":"(1)____","options":["The most effective loyalty schemes provide bonuses like free delivery.","The most effective loyalty schemes are simple and have attainable rewards."],"type":"choice/closed"}],[{"kind":"item","id":"b8538.i02","label":"2","prompt":"(2)____","options":["Airlines were the first to offer reward schemes, and they are probably still the most familiar to the public.","However, customers enjoy free delivery or access to digital content."],"type":"choice/closed"},{"kind":"item","id":"b8538.i03","label":"3","prompt":"(3)____","options":["Research suggests that customers buy more products when they have a subscription.","Research has shown that subscription customers spend more on items like shaving products, snacks and make-up."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  \n2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  \n3 Consumers often belong to multiple loyalty schemes, yet most people participate actively i umber of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  \n3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  \n4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.\n5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display","screens":["# Keeping your — customers\n1 It costs at least five times more to sell a product to a new customer than to an existing one. So what are businesses doing to hold on to their customers? The answer is – everything they possibly can. Two popular business strategies with successful track records for customer retention are reward schemes, often also referred to as loyalty schemes, and subscription services.  ","2 Loyalty schemes encourage customers to continue buying products or services from one particular company by offering customers rewards. Airlines, pioneers of loyalty schemes, provide a good example. When customers fly with one airline on multiple trips, that airline rewards them with free travel. Generally, customers have to accumulate a specific number of 'air miles' in order to receive their reward, providing an incentive to continue flying with one airline. Other companies, from Starbucks to Tesco, have followed suit, offering rewards to loyal customers.  ","3 Consumers often belong to multiple loyalty schemes, yet most people participate actively in only a few. Companies are interested in understanding the reasons behind this behaviour. The most successful loyalty schemes have several features in common. They are simple and easy to understand, but most important, their rewards are attainable. Customers receive rewards often enough that they see the benefit of remaining loyal to the company. The schemes not only keep customers buying the company's products or services, they also provide the company with valuable information about their customers' behaviour and preferences.  ","4 A second successful strategy for maintaining customer relationships is the subscription service. In these schemes, customers sign up to purchase items, such as shaving products, snacks or make-up, on a regular basis. These items are delivered to the customer's home. The convenience of home delivery is an idea with a long history, but subscription services offer more than a convenient way to replace household necessities. They offer customers products that are tailored to their own personal needs and desires. This kind of treatment makes customers feel special and deepens their connection to the brand. In a retail environment where consumers are faced with a dizzying array of $^{1}$ products, this kind of service can combat what has been referred to as 'the paralysis of choice'. In other words, the service makes decisions for consumers who may have difficulty making decisions for themselves. For the company, subscription services offer guaranteed regular sales, an ongoing relationship with their customers and, like loyalty schemes, a rich source of data about buying behaviour.","5 Some companies, such as Amazon, even charge their customers for their subscription services. In return, customers get what they value most, for example, free delivery or access to digital content. It may seem as if Amazon would lose money by not charging their customers for delivery, but the company has shrewdly calculated that customers, having paid for the subscription service, will even shop on Amazon for items they might otherwise buy at the local supermarket. Studies show that Amazon subscription customers spend more than twice as much as customers who don't have a subscription.  \n6 Reward schemes and subscription services are just two of the marketing tools that businesses use to hold on to customers. They have learned that it makes better business sense to devote attention and even money to their current customers than to try to attract new ones.\n$^{1}$ a dizzying array of (quantifier) a confusingly large number of different things on display"],"sources":[{"page":96,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df1bcb0475d1c53d4eaf08490f2a4bf0fa626aea4a6ceff465736e40d0c8495b.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U04-material:RW-M03","title":"READING 1","pages":[92],"text":"1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.\n\n2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. The first entrepreneurs to do this have been in the food business. In recent years a wave of street food vans has arrived on the scene, serving everything from gourmet cupcakes and burgers to Vietnamese street food. Street food vans have become a way for aspiring chefs to try out recipes and test the water before making a big investment in a traditional, brick-and-mortar business $^{1}$ .\n\n3 Beginning on a small scale has its advantages, the most important of which is the relatively modest size of start-up costs. These costs, which consist primarily of the vehicle and any required equipment, usually come to about £5,000–£10,000, a fraction of what it would cost to start a shop or restaurant. Similarly, overhead costs $^{2}$ are generally low. Mobile business owners must pay for fuel, of course, but other utility payments are modest. With such tightly controlled costs, mobile businesses often break even in a year or two; in contrast, success comes to brick-and-mortar businesses much more slowly, and they often fail within the first two years. In short, mobile businesses are relatively low-risk propositions.\n\n4 The mobile food vendor trend in the US and Europe has spread to other parts of the globe. Today, you can get waffles and pancakes from a truck in Jeddah, Saudi Arabia and tacos from an old school bus in Dubai. The success of these street food vans has inspired other entrepreneurs to consider starting out on wheels. Rich Harper once ran a chain of gyms, but his real interest was boxing. In 2005, he bought an old truck, equipped it with some gym equipment and took to the streets – all for a total start-up cost of just under £5,000. His business quickly made a profit and is still going strong, as he brings the boxing ring to customers all over his state.\n\n5 United Kingdom entrepreneurs could take inspiration from the United States where, today, there are vehicles that sell flowers, shoes, clothes and all kinds of specialty food items. There are also mobile businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.\n\n6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.\n\n$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building\n\n$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business","screens":["1 Maybe you make the world's best pies, or you have always helped your friends and neighbours by mending their computers, or perhaps you have green fingers and your garden is the envy of the street. A lot of businesses are started by people who have hobbies or special talents and want to turn these interests into a business. But scaling up from a hobby to a real business, such as a bakery, restaurant or shop, requires business know-how and substantial investment. Many people do not have enough of either of these, so they never take the first step.","2 An increasing number of aspiring business owners have found a way to take a first step that makes this transition from hobby to business more gradual, less expensive and less risky. They are taking their dreams and talents on the road – in vans and trucks, and even horse trailers. Th businesses that provide services, such as hair styling, pet grooming and repair of high-tech devices. Mobile retail has grown steadily and continues to gain popularity. Mobile retail is not without problems, however. Weather, the fluctuating price of fuel, and just finding a place to set up are all challenges that mobile entrepreneurs have to deal with. These business owners, however, feel the advantages outweigh the disadvantages. In the","United States, the mobile food business alone – the largest in the mobile retail sector – generates an annual revenue of $2.7 billion.","6 Once convinced that their business has achieved sufficient success, some successful mobile entrepreneurs move on to a brick-and-mortar business. Others, like Rich Harper and his boxing gym, are satisfied to stay mobile. In an interesting twist, some brick-and-mortar business owners, observing the success of mobile retailers, have added a mobile component to their business. The vehicle acts as a marketing tool to bring business into the shop. As stand-alone businesses or as extensions of shops, mobile retail has huge future potential in these economic times.","$^{1}$ brick-and-mortar business (n phr) a business with a physical location in a building","$^{2}$ overhead costs (n) the regular costs, such as rent and heating, that are involved in operating a business"],"sources":[{"page":92,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8d79507b39e42960bc8339b03e8f8f1d99b0bc9a46ed6b871c285f1f4132ec2.png"}],"kind":"material","sourceBlockIds":["b8523"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92bf666889f89275da9cf919b6db8b90c387fb8fe5ab418d31dd8e755629cb05.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 If the mobile vendor is a food van, they\ncould offer free products as part of their\nloyalty scheme. For example, a bagel\nvan could give every customer their\ntenth bagel for free.\n2 If I have a subscription to an online\nshopping platform, I will shop there\nmore often so I can take advantage\nof benefits like free shipping. I usually\nreturn to the shops and restaurants\nthat offer loyalty schemes with\ngenerous bonuses.\n3 Yes, I participate in a loyalty scheme.\nThe thing I like about it the most is\nbeing notified in advance when there’s a\nsale on clothes. That means that loyalty\nscheme customers have access to sales\nbefore the general public does. One\nthing I don’t like about it is that it is\nexpensive and the price increases each\nyear. I’m afraid I won’t be able to afford\nthe fee soon.\nNo, I’m not part of a loyalty scheme. I\nthink, in the long run, loyalty schemes\ncause customers to spend money\nrather than save money. The business\nmight offer a free gift, but only after\nthe customer has spent more money\nthan they ever intended to. Rewards\nschemes are just another marketing tool;\nthey’re more valuable to businesses than\nto customers.\n4 Yes, I participate in a subscription\nservice. No, I don’t think it has\nencouraged me to buy more. I\nparticipate in the service because it\nallows me to receive free and fast\ndelivery, but I only purchase things I\nwould normally have bought anyway.\nFor example, I buy shampoo, toothpaste\nand even some food items. The\nsubscription service doesn’t lead me to\nbuy extra items that I don’t need.\nNo, I don’t participate in a subscription\nservice. I think they have all got very\nexpensive and it doesn’t pay off for me\nin the end. For example, I don’t shop\nonline very often, so I wouldn’t be able\nto take advantage of the free delivery\nthat members might get.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a710  why? How would going mobile affect the customer experience?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1\nadvantages of a mobile\nsetting\ndisadvantages of a\nmobile setting\na good way to test your\nbusiness idea for a lower cost\ngradual start for those who\ndon’t know much about\nbusiness\ncan take product directly\nto customers\nparking costs\npetrol prices are\nunpredictable\nbad weather can affect\nsales\nsmall size limits activity\nnot every kind of business\ncan work in a van\n2 See Model Answer Booklet p10 for example answers.\n3 See Model Answer Booklet p10 for example answers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8557","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"order":28,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Complete the tasks.","pages":[102],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e7af63a04f830e9c10790c4fc7c8d8b51d5b3919c13b2665d1cf282db4de2fa4.png"],"provided":"1 Read the hat too? Another important aspect of a smart business plan is a marketing strategy. If used correctly, marketing tools should attract and build relationships with customers. For example, loyalty schemes that reward customers with free coffee or members-only discounts are incentives that will lead to customer retention. And remember, unless impressed by the product and service, customers will not return. Finally, potential business owners should have a reserve of extra money while waiting to make a profit.","items":[{"id":"b8560.i01","label":"1","prompt":"","options":[],"type":"gap_select/open"},{"id":"b8560.i02","label":"2","prompt":"","options":[],"type":"gap_select/open"},{"id":"b8560.i03","label":"3","prompt":"","options":[],"type":"gap_select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Before starting a new business, entrepreneurs should have a smart business plan. When researching ideas, aspiring owners should make sure they are filling a need that exists. Someone might want to make fancy winter jackets for pets, but do consumers want that too? Another important aspect of a smart business plan is a marketing strategy. If used correctly, marketing tools should attract and build relationships with customers. For example, loyalty schemes that reward customers with free coffee or members-only discounts are incentives that will lead to customer retention. And remember, unless impressed by the product and service, customers will not return. Finally, potential business owners should have a reserve of extra money while waiting to make a profit."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhi  – ____ working for someone else – ____"},{"kind":"text","text":"3 Working conditions"},{"kind":"text","text":"working for yourself - ____ working for someone else - ____"},{"kind":"text","text":"4 Conclusion"},{"kind":"item","id":"b8568.i02","label":"2","prompt":"Financial security – working for someone else – ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8568.i04","label":"4","prompt":"Working conditions – working for someone else – ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Point-by-point outline\n2 Financial security\nworking for yourself – possibility of\nlosing a lot of money, successful\nbusiness may lead to unlimited income\nworking for someone else – receive\nregular salary and promotions, salary\nand promotions may be limited\n3 Working conditions\nworking for yourself – work wherever\nand whenever I want, may be isolating\nto work without colleagues working for\nsomeone else – can collaborate with\ncolleagues and ask boss for advice, less\nflexibility and freedom in work hours","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8575","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"A report usually contains recommendations or considerations for the future. Which of the conclusions below would be best for this report? Give reasons for your choice.","pages":[107],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96fde54da6023fc57467351c125151c7ffef962f3332296a3e25dda661f59515.png"],"provided":"","items":[{"id":"b8575.i01","label":"a","prompt":"Today, the street food van business is an enormously successful industry, which could lead aspiring bakers to try their luck with a mobile business. However, a mobile bakery would require more investment than another type of street food van.","options":[],"type":"choice/open"},{"id":"b8575.i02","label":"b","prompt":"A mobile bakery has potential as a business model. Although the initial investment may be higher than with other street food vans, it is significantly lower than that of a brick-and-mortar bakery and there is an opportunity to be a pioneer of street food baking.","options":[],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8575.i01","label":"a","prompt":"Today, the street food van business is an enormously successful industry, which could lead aspiring bakers to try their luck with a mobile business. However, a mobile bakery would require more investment than another type of street food van.","options":[],"type":"choice/open"},{"kind":"item","id":"b8575.i02","label":"b","prompt":"A mobile bakery has potential as a business model. Although the initial investment may be higher than with other street food vans, it is significantly lower than that of a brick-and-mortar bakery and there is an opportunity to be a pioneer of street food baking.","options":[],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"ambiguous-heading","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":43},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8572","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"order":38,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Work with a partner. Describe the products or services you plan to write about and the features you are comparing. You will use some of this information in your introduction.","pages":[107],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96fde54da6023fc57467351c125151c7ffef962f3332296a3e25dda661f59515.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U04-question:b8557-ex4","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[102]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The two mobile businesses I plan to\nwrite about are a vintage clothes van\nand a flower van. The features I am\ncomparing are the level of expertise I\nneed and the potential for customers.\nI have a lot of experience with vintage\nclothes. I have always loved fashion,\nespecially fashion that comes from\nanother era. On the other hand, I don’t\nknow a lot about flowers, except that I\nenjoy being around them. I’m not sure\nhow to grow flowers or keep them alive.\nThe second feature is the potential for\ncustomers. With a flower van, I think\nthere are more places to go where\nI could access new customers. For\nexample, I could go to outdoor flower\nmarkets and food markets. I could also\nprovide flowers at special occasions like\nweddings or graduations. With a flower\nvan, it would be easy and convenient to\ndrive to my customers. The same is not\ntrue with a vintage clothes van. There\nare not many special events to drive\nto and sell from, so I would probably\npark in two or three different locations\nthroughout the week. I would have to\nrely more on repeat customers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8573","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"order":39,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Prepare an outline for your essay using the block or point-by-point organization given in Academic writing skills. Provide evidence for each point you want to make in your essay. Exchange your outline with a partner to confirm the evidence you provided is relevant.","pages":[107],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96fde54da6023fc57467351c125151c7ffef962f3332296a3e25dda661f59515.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U04-question:b8557-ex4","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[102]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U04-resource:b8555","title":"Analyzing advantages and disadvantages","pages":[101],"text":"Analyzing advantages and disadvantages\n\nMany comparison essays involve a discussion of the ways in which one thing is better or worse than another. When you discuss advantages and disadvantages, consider all the aspects of the situation, including all the people involved. This will mean that you consider all the possible advantages and disadvantages and have the widest possible view of the situation you are analyzing.","screens":["Analyzing advantages and disadvantages","Many comparison essays involve a discussion of the ways in which one thing is better or worse than another. When you discuss advantages and disadvantages, consider all the aspects of the situation, including all the people involved. This will mean that you consider all the possible advantages and disadvantages and have the widest possible view of the situation you are analyzing."],"sources":[{"page":101,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f961871175b1377d96e18363c389715940ee162d0fb4ace75c445262f1cdb6c4.png"}],"kind":"resource","sourceBlockIds":["b8555"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Introduction\n2 Level of expertise\n•  vintage clothes van – no expert\nknowledge required, already own a\nlarge collection of vintage clothes that\nare ready to sell, familiar with all of the\nlocal vintage shops so could possibly\npurchase inventory at a discount\n•  flower van – some expert advice is\nneeded, even if flowers come from\nwholesalers, will need to know how to\nkeep them alive\n3 Potential for customers\n•  vintage clothes shop – customers\nmay be used to shopping indoors\nwith more space and fitting rooms,\nnot many local special events that\nwould be appropriate for selling\nvintage clothes\n•  flower van – people buy flowers for\nmany different occasions, customer\nbase could be huge, easy to drive to\nvenues and fulfil customers’ orders\n4 Conclusion","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U04-question:b8574","book":5,"unit":4,"track":"RW","topic":"BUSINESS","lesson":2,"order":40,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Make notes on the background information for your introduction.","pages":[107],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96fde54da6023fc57467351c125151c7ffe
