i01","label":"1","prompt":"What kind of company might a manufacturer of electric vehicles need to partner with, and what could be the benefits for them of doing this?","options":[],"type":"discuss/open"},{"id":"b8095.i02","label":"2","prompt":"Why might the EV market be an attractive sector for a company to become involved in?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8095.i01","label":"1","prompt":"What kind of company might a manufacturer of electric vehicles need to partner with, and what could be the benefits for them of doing this?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8095.i02","label":"2","prompt":"Why might the EV market be an attractive sector for a company to become involved in?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 An EV manufacturer might team up with\na company specializing in a particular\ncomponent, such as tyres or engine\nparts. Enabling them to specialize may\nlead to an economy of scale, keeping\ndown the costs of vehicles sold.\n2 It is widely assumed that the number\nof EVs sold will continue to increase as\npetrol vehicle sales fall given concerns\nabout climate change and the role of\nfossil fuels in causing this. Partnering\nwith an EV manufacturer may therefore\nseem like a safe bet for another\ncompany, as EV sales are likely to be\nhigh for the foreseeable future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[{"page":170,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2feadd1a716738e542e2a535f46b542fbda8685d440f2d4f4b29806e797f3e82.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8100","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Does it suggest the following? Write 'yes' or 'no'. If you write 'no', explain your answer.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef41805c8734c7f78bb24a87df9ebcaed1dd6b4a0bc06f1fb1f72c60e59d536b.png"],"provided":"","items":[{"id":"b8100.i01","label":"1","prompt":"It is rare to find an example of different businesses collaborating successfully. ____","options":["yes","no"],"type":"choice/mixed"},{"id":"b8100.i02","label":"2","prompt":"Tesla has changed the way people think about the electric vehicle industry. ____","options":["yes","no"],"type":"choice/mixed"},{"id":"b8100.i03","label":"3","prompt":"Tesla's first EVs were criticized for having such a short range. ____","options":["yes","no"],"type":"choice/mixed"},{"id":"b8100.i04","label":"4","prompt":"Tesla resolved its supply issues by making an agreement with Panasonic. ____","options":["yes","no"],"type":"choice/mixed"},{"id":"b8100.i05","label":"5","prompt":"By 2035, half of all cars on the roads globally will be electric. ____","options":["yes","no"],"type":"choice/mixed"},{"id":"b8100.i06","label":"6","prompt":"The collaboration between Tesla and Panasonic has contributed to increasing sales of EVs. ____","options":["yes","no"],"type":"choice/mixed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8100.i01","label":"1","prompt":"It is rare to find an example of different businesses collaborating successfully. ____","options":["yes","no"],"type":"choice/mixed"},{"kind":"item","id":"b8100.i02","label":"2","prompt":"Tesla has changed the way people think about the electric vehicle industry. ____","options":["yes","no"],"type":"choice/mixed"},{"kind":"item","id":"b8100.i03","label":"3","prompt":"Tesla's first EVs were criticized for having such a short range. ____","options":["yes","no"],"type":"choice/mixed"}],[{"kind":"item","id":"b8100.i04","label":"4","prompt":"Tesla resolved its supply issues by making an agreement with Panasonic. ____","options":["yes","no"],"type":"choice/mixed"},{"kind":"item","id":"b8100.i05","label":"5","prompt":"By 2035, half of all cars on the roads globally will be electric. ____","options":["yes","no"],"type":"choice/mixed"},{"kind":"item","id":"b8100.i06","label":"6","prompt":"The collaboration between Tesla and Panasonic has contributed to increasing sales of EVs. ____","options":["yes","no"],"type":"choice/mixed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/bbd311e45d81b27c5e2010db-L5LS-U08.mp4","captions":[{"start":0,"end":2.5,"text":"In the world of business,"},{"start":2.86,"end":6.84,"text":"the idea of companies competing against each other is a\nfamiliar one."},{"start":7.56,"end":9.92,"text":"But what happens when they work together?"},{"start":11.08,"end":14.88,"text":"Collaboration in business often proves to be a winning\nstrategy."},{"start":15.7,"end":17.72,"text":"Formula One teams, for instance,"},{"start":18.42,"end":25.4,"text":"benefit from engineering companies collaborating to\nconstruct the fastest, most sophisticated cars\npossible."},{"start":26.58,"end":32.62,"text":"Spotify Premium subscribers can control the music\nplaying on their Uber driver's stereo system,"},{"start":33.26,"end":35.84,"text":"thanks to a collaboration between the two companies."},{"start":36.92,"end":39.22,"text":"And the pioneer of electric vehicles,"},{"start":39.58,"end":39.9,"text":"Tesla,"},{"start":40.38,"end":45.48,"text":"stands as a prime example of how collaboration can help\nto redefine an industry."},{"start":46.86,"end":59.28,"text":"Back in the mid -2000s, the mass market potential of\nEVs was still uncertain, primarily due to the limited\ndistances they could cover before the battery needed to\nbe recharged."},{"start":59.88,"end":62.22,"text":"Tesla pushed what was possible at that time,"},{"start":62.68,"end":68.38,"text":"with its earliest car able to travel 245 miles on a\nsingle charge."},{"start":69.38,"end":70.02,"text":"Nevertheless,"},{"start":70.52,"end":79.76,"text":"the company faced challenges as manufacturers had\nconcerns about selling them the cylindrical lithium\n-ion batteries their EVs required."},{"start":79.76,"end":81.36,"text":"Eventually,"},{"start":81.76,"end":82.98,"text":"in 2009,"},{"start":83.76,"end":89.32,"text":"Tesla secured a deal with the Japanese company\nPanasonic, ensuring a stable supply of batteries."},{"start":90.5,"end":93.82,"text":"This marked the beginning of a fruitful business\npartnership."},{"start":94.8,"end":95.68,"text":"In 2010,"},{"start":96.2,"end":99.28,"text":"Panasonic invested $30 million in Tesla,"},{"start":99.88,"end":107.68,"text":"which led to a cooperation agreement for developing\nbatteries and the construction of the world's largest\nEV battery factory."},{"start":107.68,"end":109.14,"text":"Today,"},{"start":109.64,"end":115.82,"text":"the automotive industry is making significant progress\nin introducing EVs onto our roads,"},{"start":116.44,"end":119.8,"text":"with battery technology which is more advanced than\never."},{"start":120.82,"end":123.12,"text":"It's predicted that by 2035,"},{"start":123.62,"end":128.76,"text":"just 25 years after the collaboration between Tesla and\nPanasonic began,"},{"start":129.84,"end":134.62,"text":"EVs will account for approximately half of new car\nsales worldwide."},{"start":136.2,"end":141.76,"text":"Collaboration offers companies the opportunity to tap\ninto each other's expertise,"},{"start":142.22,"end":144.34,"text":"often with innovative outcomes."},{"start":145.28,"end":145.88,"text":"Arguably,"},{"start":146.3,"end":151.7,"text":"the partnership between Tesla and Panasonic led to the\ngrowth of the EV industry."},{"start":152.64,"end":155.86,"text":"Not only did it bring financial success to both\ncompanies,"},{"start":156.4,"end":160.56,"text":"but also benefits both to their customers and to the\nenvironment."},{"start":162,"end":169.76,"text":"It just goes to show that collaboration is key to\nunlocking new solutions to the problems of the 21st\ncentury."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 No – Other examples of successful partnerships are\nprovided, e.g. Formula 1 racing teams and engineering\nfirms.\n2 Yes\n3 No – There were concerns about EVs having a limited\nrange, but Tesla ‘pushed what was possible’ and\nproduced cars with a longer range than most.\n4 Yes\n5 No – Half of the new cars being sold then will be\nelectric. But this does not mean that half of all cars\nalready on the roads will be electric.\n6 Yes","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":59,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8101","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Then answer the questions with a partner.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef41805c8734c7f78bb24a87df9ebcaed1dd6b4a0bc06f1fb1f72c60e59d536b.png"],"provided":"","items":[{"id":"b8101.i01","label":"1","prompt":"What was said about Spotify, and how do you think this was relevant to the main point of the video?","options":[],"type":"qa/open"},{"id":"b8101.i02","label":"2","prompt":"The partnership between Tesla and Panasonic is described as 'fruitful'. How do you think Tesla and Panasonic might both assess whether it had been fruitful for them?","options":[],"type":"qa/open"},{"id":"b8101.i03","label":"3","prompt":"The video claims the partnership also benefits customers and the environment. To what extent do you agree with this claim? Why?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8101.i01","label":"1","prompt":"What was said about Spotify, and how do you think this was relevant to the main point of the video?","options":[],"type":"qa/open"},{"kind":"item","id":"b8101.i02","label":"2","prompt":"The partnership between Tesla and Panasonic is described as 'fruitful'. How do you think Tesla and Panasonic might both assess whether it had been fruitful for them?","options":[],"type":"qa/open"},{"kind":"item","id":"b8101.i03","label":"3","prompt":"The video claims the partnership also benefits customers and the environment. To what extent do you agree with this claim? Why?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B05-LS-U08-publisher-sheet:b8100","title":"WATCH AND LISTEN Ex 3 原题面","pages":[171],"text":"","screens":[],"sources":[{"page":171,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef41805c8734c7f78bb24a87df9ebcaed1dd6b4a0bc06f1fb1f72c60e59d536b.png"}],"kind":"task_sheet","sourceBlockIds":["b8100"]}],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/bbd311e45d81b27c5e2010db-L5LS-U08.mp4","captions":[{"start":0,"end":2.5,"text":"In the world of business,"},{"start":2.86,"end":6.84,"text":"the idea of companies competing against each other is a\nfamiliar one."},{"start":7.56,"end":9.92,"text":"But what happens when they work together?"},{"start":11.08,"end":14.88,"text":"Collaboration in business often proves to be a winning\nstrategy."},{"start":15.7,"end":17.72,"text":"Formula One teams, for instance,"},{"start":18.42,"end":25.4,"text":"benefit from engineering companies collaborating to\nconstruct the fastest, most sophisticated cars\npossible."},{"start":26.58,"end":32.62,"text":"Spotify Premium subscribers can control the music\nplaying on their Uber driver's stereo system,"},{"start":33.26,"end":35.84,"text":"thanks to a collaboration between the two companies."},{"start":36.92,"end":39.22,"text":"And the pioneer of electric vehicles,"},{"start":39.58,"end":39.9,"text":"Tesla,"},{"start":40.38,"end":45.48,"text":"stands as a prime example of how collaboration can help\nto redefine an industry."},{"start":46.86,"end":59.28,"text":"Back in the mid -2000s, the mass market potential of\nEVs was still uncertain, primarily due to the limited\ndistances they could cover before the battery needed to\nbe recharged."},{"start":59.88,"end":62.22,"text":"Tesla pushed what was possible at that time,"},{"start":62.68,"end":68.38,"text":"with its earliest car able to travel 245 miles on a\nsingle charge."},{"start":69.38,"end":70.02,"text":"Nevertheless,"},{"start":70.52,"end":79.76,"text":"the company faced challenges as manufacturers had\nconcerns about selling them the cylindrical lithium\n-ion batteries their EVs required."},{"start":79.76,"end":81.36,"text":"Eventually,"},{"start":81.76,"end":82.98,"text":"in 2009,"},{"start":83.76,"end":89.32,"text":"Tesla secured a deal with the Japanese company\nPanasonic, ensuring a stable supply of batteries."},{"start":90.5,"end":93.82,"text":"This marked the beginning of a fruitful business\npartnership."},{"start":94.8,"end":95.68,"text":"In 2010,"},{"start":96.2,"end":99.28,"text":"Panasonic invested $30 million in Tesla,"},{"start":99.88,"end":107.68,"text":"which led to a cooperation agreement for developing\nbatteries and the construction of the world's largest\nEV battery factory."},{"start":107.68,"end":109.14,"text":"Today,"},{"start":109.64,"end":115.82,"text":"the automotive industry is making significant progress\nin introducing EVs onto our roads,"},{"start":116.44,"end":119.8,"text":"with battery technology which is more advanced than\never."},{"start":120.82,"end":123.12,"text":"It's predicted that by 2035,"},{"start":123.62,"end":128.76,"text":"just 25 years after the collaboration between Tesla and\nPanasonic began,"},{"start":129.84,"end":134.62,"text":"EVs will account for approximately half of new car\nsales worldwide."},{"start":136.2,"end":141.76,"text":"Collaboration offers companies the opportunity to tap\ninto each other's expertise,"},{"start":142.22,"end":144.34,"text":"often with innovative outcomes."},{"start":145.28,"end":145.88,"text":"Arguably,"},{"start":146.3,"end":151.7,"text":"the partnership between Tesla and Panasonic led to the\ngrowth of the EV industry."},{"start":152.64,"end":155.86,"text":"Not only did it bring financial success to both\ncompanies,"},{"start":156.4,"end":160.56,"text":"but also benefits both to their customers and to the\nenvironment."},{"start":162,"end":169.76,"text":"It just goes to show that collaboration is key to\nunlocking new solutions to the problems of the 21st\ncentury."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 Spotify customers can have their music\nplayed in the Uber they are travelling\nin. This supports the main point that\npartnerships between different kinds of\nbusiness can benefit both parties.\n2 I expect they would assess whether\nthe partnership had enabled them to\nearn more money than they would have\nearned if the partnership didn’t exist.\n3 I think it’s a valid point that the\nenvironment will benefit, as the\nmove towards EVs is a move away\nfrom harmful fossil fuels. But I’m not\nconvinced that customers are really\nbenefitting, as the price of Tesla’s EVs is\nstill very high.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8103","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work in a small group. Think of a well-known international firm. Then suggest another firm (which specializes in a different sector) which it could form a partnership with. Prepare to present your proposal to other groups, and explain how the partnership could benefit both companies.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef41805c8734c7f78bb24a87df9ebcaed1dd6b4a0bc06f1fb1f72c60e59d536b.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I would like to see a partnership between\nthe electronics firm that made my fridge\nand a recipe app that I use a lot. Using\nsensors, the fridge would identify all the\ningredients that I have inside and then send\nto my app a suggested recipe, enabling me\nto first use up the food that needed eating\nbefore it went off.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8105","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":7,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a training session on group dynamics. Before you listen, work with a partner. Discuss the questions. Do you work well in collaborative settings? Write T (true) or F (false) for each statement to find out your style.","pages":[172,173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff9a4d2ee3f078cfd72d234f1a9df00390dfde28e489924cfb2c9e784b30ec7d.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/edfbb5a5e7fa06083e271c4898235bab7d1eb4c71d51cfcf311fcf1f97f5d432.png"],"provided":"Now calculate your score. Give yourself five (5) points for each F.\n95-100:\nYou are a collaboration superstar. You generally trust others and enjoy working in collaborative situations.\n80-90:\nYou are a team player. You will probably function well in a group. But some of your beliefs and attitudes could interfere with your ability to get the most out of collaboration.\n65-75:\nYou are a doubter. You don't always see the value in collaborative work. Perhaps you've had a bad experience in the past.\n60 AND BELOW:\nYou are a loner. You find collaborative work difficult, and you don't see the value in it. You prefer tasks that allow you to work independently and be rewarded for your own work. When you have to work in groups, you respond negatively.","items":[{"id":"b8105.i01","label":"1","prompt":"What can an individual do to make sure a group in which they are a member works well and that it accomplishes its tasks? What kind of behaviour makes group work more effective?","options":[],"type":"discuss/open"},{"id":"b8105.i02","label":"2","prompt":"What kinds of things might an individual do to disrupt the work of a group and prevent it from accomplishing its tasks? What kind of behaviour can impair group work?","options":[],"type":"discuss/open"},{"id":"b8105.i03","label":"3","prompt":"Have you ever had an experience in which one member of a group behaved inappropriately and prevented the group from working well together? If so, describe what happened.","options":[],"type":"discuss/open"},{"id":"b8105.i04","label":"4","prompt":"If you have had, or know about, a negative experience like this, what did you, or anybody else in the group, try to do to respond to this individual?","options":[],"type":"discuss/open"},{"id":"b8108.i01","label":"1","prompt":"I tend to give in to group pressure easily.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i02","label":"2","prompt":"I produce my best results when I work on my own.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i03","label":"3","prompt":"My work would be so much easier if I didn't have to depend on others to do it.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i04","label":"4","prompt":"Other people will almost always let you down.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i05","label":"5","prompt":"I don't care about my job that much; I just do what they tell me to do.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i06","label":"6","prompt":"If too many people are working on the same thing, it usually doesn't turn out very well.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i07","label":"7","prompt":"I usually know what's best and get impatient when I have to listen to a lot of other opinions.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i08","label":"8","prompt":"Some of the people I work with really annoy me.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i09","label":"9","prompt":"When somebody talks, I think about how to respond while they're speaking.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i10","label":"10","prompt":"You have to protect your own interests because nobody else will.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i11","label":"11","prompt":"When you disagree with somebody, the best course of action is to stay silent.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i12","label":"12","prompt":"Meetings are usually a waste of time.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i13","label":"13","prompt":"Creativity is something that applies to individuals not groups.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i14","label":"14","prompt":"I always seem to end up doing the most work on a group project.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i15","label":"15","prompt":"I do my best to avoid conflict.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i16","label":"16","prompt":"I hate(d) working on group projects in school.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i17","label":"17","prompt":"When somebody challenges my ideas, I just stay quiet.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i18","label":"18","prompt":"If I want the job done right, I do it myself.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i19","label":"19","prompt":"We spend too much time discussing and not enough time doing.","options":["True","False"],"type":"choice/closed"},{"id":"b8108.i20","label":"20","prompt":"I'd rather just go with what the rest of the group wants than fight for my idea.","options":["True","False"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Now calculate your score. Give yourself five (5) points for each F."},{"kind":"text","text":"95-100:"},{"kind":"text","text":"You are a collaboration superstar. You generally trust others and enjoy working in collaborative situations."},{"kind":"text","text":"80-90:"},{"kind":"text","text":"You are a team player. You will probably function well in a group. But some of your beliefs and attitudes could interfere with your ability to get the most out of collaboration."},{"kind":"text","text":"65-75:"}],[{"kind":"text","text":"You are a doubter. You don't always see the value in collaborative work. Perhaps you've had a bad experience in the past."},{"kind":"text","text":"60 AND BELOW:"},{"kind":"text","text":"You are a loner. You find collaborative work difficult, and you don't see the value in it. You prefer tasks that allow you to work independently and be rewarded for your own work. When you have to work in groups, you respond negatively."},{"kind":"item","id":"b8105.i01","label":"1","prompt":"What can an individual do to make sure a group in which they are a member works well and that it accomplishes its tasks? What kind of behaviour makes group work more effective?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b8105.i02","label":"2","prompt":"What kinds of things might an individual do to disrupt the work of a group and prevent it from accomplishing its tasks? What kind of behaviour can impair group work?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8105.i03","label":"3","prompt":"Have you ever had an experience in which one member of a group behaved inappropriately and prevented the group from working well together? If so, describe what happened.","options":[],"type":"discuss/open"},{"kind":"item","id":"b8105.i04","label":"4","prompt":"If you have had, or know about, a negative experience like this, what did you, or anybody else in the group, try to do to respond to this individual?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8108.i01","label":"1","prompt":"I tend to give in to group pressure easily.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i02","label":"2","prompt":"I produce my best results when I work on my own.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i03","label":"3","prompt":"My work would be so much easier if I didn't have to depend on others to do it.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i04","label":"4","prompt":"Other people will almost always let you down.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i05","label":"5","prompt":"I don't care about my job that much; I just do what they tell me to do.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i06","label":"6","prompt":"If too many people are working on the same thing, it usually doesn't turn out very well.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i07","label":"7","prompt":"I usually know what's best and get impatient when I have to listen to a lot of other opinions.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i08","label":"8","prompt":"Some of the people I work with really annoy me.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i09","label":"9","prompt":"When somebody talks, I think about how to respond while they're speaking.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i10","label":"10","prompt":"You have to protect your own interests because nobody else will.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i11","label":"11","prompt":"When you disagree with somebody, the best course of action is to stay silent.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i12","label":"12","prompt":"Meetings are usually a waste of time.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i13","label":"13","prompt":"Creativity is something that applies to individuals not groups.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i14","label":"14","prompt":"I always seem to end up doing the most work on a group project.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i15","label":"15","prompt":"I do my best to avoid conflict.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i16","label":"16","prompt":"I hate(d) working on group projects in school.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i17","label":"17","prompt":"When somebody challenges my ideas, I just stay quiet.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i18","label":"18","prompt":"If I want the job done right, I do it myself.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b8108.i19","label":"19","prompt":"We spend too much time discussing and not enough time doing.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b8108.i20","label":"20","prompt":"I'd rather just go with what the rest of the group wants than fight for my idea.","options":["True","False"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 They can contribute ideas, listen\nto others, stay organized, and\nbe respectful. Positive behaviors\nlike supporting each other and\ncommunicating clearly make group\nwork smoother.\n2 If a person is not listening, being\nnegative, dominating conversations, or\nignoring deadlines. These behaviors can\nslow down or derail group progress.\n3 Yes, there was a group member who\noften interrupted others and ignored\nfeedback, which made it hard for\neveryone to work together.\n4 We tried addressing it directly by calmly\nexplaining the problem, setting ground\nrules for discussions, and dividing tasks\nso everyone had a role.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/ body, the best course of action is to stay silent."},{"kind":"text","text":"Meetings are usually a waste of time."},{"kind":"text","text":"Creativity is something that applies to individuals not groups."},{"kind":"text","text":"I always seem to end up doing the most work on a group project."}],[{"kind":"text","text":"I do my best to avoid conflict."},{"kind":"text","text":"I hate(d) working on group projects in school."},{"kind":"text","text":"When somebody challenges my ideas, I just stay quiet."},{"kind":"text","text":"If I want the job done right, I do it myself."},{"kind":"text","text":"We spend too much time discussing and not enough time doing."},{"kind":"text","text":"I'd rather just go with what the rest of the group wants than fight for my idea."},{"kind":"text","text":"Now calculate your score. Give yourself five (5) points for each F."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I got 74. It says that I am a doubter and\nthat I don’t always see the value in\ncollaborative work. I don’t think I have ever\nreally had a bad experience in the past, but\nI have to admit that I generally do prefer\nworking alone.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues": e":"LISTENING 1","ex":"4","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"8.1 Listen to the presentation and summarize the main idea in one or two sentences. Compare your summary statement with a partner.","pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d03b4ebbb79b20f41acd2bdbca64fe0c87f8b800dfece0621bcfb03045725c9e.png"],"provided":"","items":[{"id":"b8117.i01","label":"1","prompt":"Summarize the main idea of the presentation in one or two sentences.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8117.i01","label":"1","prompt":"Summarize the main idea of the presentation in one or two sentences.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 8.1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8925c67ffe78b24104d511cd265cda7c236f1f4bc3cd4b4fba79aedbf560b687.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"The behaviour of one ‘bad apple’ can\nnegatively affect the dynamics of an entire\ngroup, and there are only a few ways to\ncounteract this phenomenon.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8118","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":11,"module":"LISTENING 1","ex":"5","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"8.1 Listen again. To support her claim, the speaker reports on a research study. Take notes on how she explains the study and its results. Use your notes to complete the table below.","pages":[175],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bd27e8b6ebad2722a20379cbe8934e9cdea8a31dfb5c6acbf41b5a5e2933db8.png"],"provided":"Participants:\n\nMethods (How was the study organized and carried out?):\n\nResults:\n\nConclusion:","items":[{"id":"b8118.i01","label":"Participants","prompt":"Participants: ____","options":[],"type":"gap/open"},{"id":"b8118.i02","label":"Methods","prompt":"Methods (How was the study organized and carried out?): ____","options":[],"type":"gap/open"},{"id":"b8118.i03","label":"Results","prompt":"Results: ____","options":[],"type":"gap/open"},{"id":"b8118.i04","label":"Conclusion","prompt":"Conclusion: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Participants:"},{"kind":"text","text":"Methods (How was the study organized and carried out?):"},{"kind":"text","text":"Conclusion:"},{"kind":"item","id":"b8118.i03","label":"Results","prompt":"Results: ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-LS-U08-publisher-sheet:b8117","title":"LISTENING 1 Ex 4 原题面","pages":[174],"text":"","screens":[],"sources":[{"page":174,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d03b4ebbb79b20f41acd2bdbca64fe0c87f8b800dfece0621bcfb03045725c9e.png"}],"kind":"task_sheet","sourceBlockIds":["b8117"]}],"courseMedia":[{"type":"audio","title":"Track 8.1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8925c67ffe78b24104d511cd265cda7c236f1f4bc3cd4b4fba79aedbf560b687.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Participants: groups consisting of regular\npeople and one hired actor to play the\n‘bad apple’\nMethods: The regular members of the\ngroups didn’t know the bad apple was an\nactor playing a part. The actor engaged in\nnegative behaviour that ran counter to\nthe group.\nResults: Groups performed 30–40% worse.\nOthers started to mirror bad behaviour.\nOthers did not oppose the bad apple’s\nbehaviour. The bad apple’s behaviour\nresulted in perceptions of unfairness among\nmembers.\nConclusion: The group’s worst member\nwas the best predictor of the whole group’s\nperformance. The behaviour of one bad\napple can spread to the whole group.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8121","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":12,"module":"LISTENING 1","ex":"6","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"8.2 Read the tasks and then listen to the excerpt from the presentation. Complete the tasks.","pages":[175],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bd27e8b6ebad2722a20379cbe8934e9cdea8a31dfb5c6acbf41b5a5e2933db8.png"],"provided":"1 Consider the proverb, 'One bad apple can spoil the barrel'. Work with a partner to write an explanation of the literal meaning and how it applies to the content of the presentation.\n2 The presenter names three types of 'bad apples' and gives examples of their behaviour. Complete the table with information from the presentation.\n\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>type of bad apple\u003c/td>\u003ctd>examples of behaviour\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a\u003c/td>\u003ctd>\u003c/td>\u003ctd>exhibits lack of interest in task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>b\u003c/td>\u003ctd>naysayer\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>c\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b8121.i01","label":"1","prompt":"Consider the proverb, 'One bad apple can spoil the barrel'. Work with a partner to write an explanation of the literal meaning and how it applies to the content of the presentation.","options":[],"type":"gap/open"},{"id":"b8121.i02","label":"2a","prompt":"a. type of bad apple: ____; examples of behaviour: exhibits lack of interest in task","options":[],"type":"gap/open"},{"id":"b8121.i03","label":"2b","prompt":"b. type of bad apple: naysayer; examples of behaviour: ____","options":[],"type":"gap/open"},{"id":"b8121.i04","label":"2c","prompt":"c. type of bad apple: ____; examples of behaviour: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Consider the proverb, 'One bad apple can spoil the barrel'. Work with a partner to write an explanation of the literal meaning and how it applies to the content of the presentation."},{"kind":"text","text":"2 The presenter names three types of 'bad apples' and gives examples of their behaviour. Complete the table with information from the presentation."}],[{"kind":"table","rows":[[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"type of bad apple","header":false,"colspan":1,"rowspan":1},{"text":"examples of behaviour","header":false,"colspan":1,"rowspan":1}],[{"text":"a","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"exhibits lack of interest in task","header":false,"colspan":1,"rowspan":1}],[{"text":"b","header":false,"colspan":1,"rowspan":1},{"text":"naysayer","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"c","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b8121.i02","label":"2a","prompt":"a. type of bad apple: ____; examples of behaviour: exhibits lack of interest in task","options":[],"type":"gap/open"},{"kind":"item","id":"b8121.i03","label":"2b","prompt":"b. type of bad apple: naysayer; examples of behaviour: ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8121.i04","label":"2c","prompt":"c. type of bad apple: ____; examples of behaviour: ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-LS-U08-publisher-sheet:b8118","title":"LISTENING 1 Ex 5 原题面","pages":[175],"text":"Participants:\n\nMethods (How was the study organized and carried out?):\n\nResults:\n\nConclusion:","screens":["Participants:","Methods (How was the study organized and carried out?):","Results:","Conclusion:"],"sources":[{"page":175,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bd27e8b6ebad2722a20379cbe8934e9cdea8a31dfb5c6acbf41b5a5e2933db8.png"}],"kind":"task_sheet","sourceBlockIds":["b8118"]}],"courseMedia":[{"type":"audio","title":"Track 8.2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/23ae0d99c34083627c394dccffc64dc822aef9892be581d57cf290f90f9fe4a5.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 A diseased or rotten apple spoils all\nthe other apples around it. The bad\nbehaviour of one person can also\nnegatively affect, or spoil, the dynamics\nof a group and the behaviour of all the\nindividuals in the group.\n2\ntype of\nbad apple\nexamples of behaviour\na slacker exhibits a lack of\ninterest; refuses to\nparticipate or contribute\nto the group’s efforts\nb naysayer expresses generally\nnegative feelings and\nattitude; rejects or\ncriticizes the ideas\nand opinions of others\nwithout offering\nanything constructive as\nan alternative.\nc bully insists on doing things\nhis or her own way\nwith no alternative;\nexhibits typical bullying\nbehaviour to group\nmembers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8122","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":13,"module":"LISTENING 1","ex":"7","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Work in small groups. Discuss the meaning of each of the proverbs in bold. What larger principles or ideas do they illustrate?","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9596f7233882f6394452cb3f63c589ff77163e2fef7f3bb0f0e4d87a69d0ff8.png"],"provided":"1 Lots of people came into our shop because of the sale, but nobody actually bought anything. It just shows that you can lead a horse to water, but you can't make it drink.\n2 Film footage shows the CEO being extremely rude to a reporter. Still, there is no smoke without fire. Who knows what she had said to him off-camera?\n3 When the firm increased from five partners to seven, their profits fell. Sometimes it's true that too many cooks spoil the broth.\n4 I entered a competition online, but now they're sending me adverts constantly. There is no such thing as a free lunch.","items":[{"id":"b8122.i01","label":"1","prompt":"Lots of people came into our shop because of the sale, but nobody actually bought anything. It just shows that you can lead a horse to water, but you can't make it drink.","options":[],"type":"discuss/open"},{"id":"b8122.i02","label":"2","prompt":"Film footage shows the CEO being extremely rude to a reporter. Still, there is no smoke without fire. Who knows what she had said to him off-camera?","options":[],"type":"discuss/open"},{"id":"b8122.i03","label":"3","prompt":"When the firm increased from five partners to seven, their profits fell. Sometimes it's true that too many cooks spoil the broth.","options":[],"type":"discuss/open"},{"id":"b8122.i04","label":"4","prompt":"I entered a competition online, but now they're sending me adverts constantly. There is no such thing as a free lunch.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Lots of people came into our shop because of the sale, but nobody actually bought anything. It just shows that you can lead a horse to water, but you can't make it drink."},{"kind":"text","text":"2 Film footage shows the CEO being extremely rude to a reporter. Still, there is no smoke without fire. Who knows what she had said to him off-camera?"},{"kind":"text","text":"3 When the firm increased from five partners to seven, their profits fell. Sometimes it's true that too many cooks spoil the broth."},{"kind":"text","text":"4 I entered a competition online, but now they're sending me adverts constantly. There is no such thing as a free lunch."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  You can offer people something that is good for them,\nbut you cannot force them to take it. You can only help\nsomebody who wants to be helped.\n2  If unpleasant things are said about somebody or\nsomething, there is probably a good reason for it.\n3  Sometimes, combining the talents of too many people\ndoes not make something better.\n4 Something is always expected of you in return for a\nfavour or gift. Every gift has an expectation from the\ngiver attached to it.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8125","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":14,"module":"LISTENING 1","ex":"8","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"instruction":"8.3 Listen to the sentences. Circle the pairs of words with /j/ or /w/ links between them. Compare answers with a partner.","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9596f7233882f6394452cb3f63c589ff77163e2fef7f3bb0f0e4d87a69d0ff8.png"],"provided":"1 They'll insist on doing things their way and only their way.\n2 Of course, individual members of a group may also have their own goals, which may or may not be consistent with the group goal.\n3 The other members began to adopt the same negative behaviour.\n4 'This will never work,' or 'This is so stupid', other members also became critical or began to express similarly negative views.\n5 And perhaps just as importantly, everybody had a negative response to the entire experience.","items":[{"id":"b8125.i01","label":"1","prompt":"They'll insist on doing things their way and only their way.","options":[],"type":"select/open"},{"id":"b8125.i02","label":"2","prompt":"Of course, individual members of a group may also have their own goals, which may or may not be consistent with the group goal.","options":[],"type":"select/open"},{"id":"b8125.i03","label":"3","prompt":"The other members began to adopt the same negative behaviour.","options":[],"type":"select/open"},{"id":"b8125.i04","label":"4","prompt":"'This will never work,' or 'This is so stupid', other members also became critical or began to express similarly negative views.","options":[],"type":"select/open"},{"id":"b8125.i05","label":"5","prompt":"And perhaps just as importantly, everybody had a negative response to the entire experience.","options":[],"type":"select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 They'll insist on doing things their way and only their way."},{"kind":"text","text":"2 Of course, individual members of a group may also have their own goals, which may or may not be consistent with the group goal."},{"kind":"text","text":"3 The other members began to adopt the same negative behaviour."},{"kind":"text","text":"4 'This will never work,' or 'This is so stupid', other members also became critical or began to express similarly negative views."},{"kind":"text","text":"5 And perhaps just as importantly, everybody had a negative response to the entire experience."}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 8.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c3f21c93530a516ce22e379b6d72eac7f717473711c5357211a51d3dfbe289f2.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 way- / j / -and 2 may- / j / -also; may- / j / -or\n3 the- / j / -other; to- / w / -adopt 4 to- / w / -express\n5 the- / j / -entire","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8127","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":15,"module":"LISTENING 1","ex":"9","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9596f7233882f6394452cb3f63c589ff77163e2fef7f3bb0f0e4d87a69d0ff8.png"],"provided":"1 What is the best way to deal with each type of bad apple?\n2 Why do you think negative behaviour and attitudes spread so easily? Do you think positive behaviour spreads as easily?","items":[{"id":"b8127.i01","label":"1","prompt":"What is the best way to deal with each type of bad apple?","options":[],"type":"discuss/open"},{"id":"b8127.i02","label":"2","prompt":"Why do you think negative behaviour and attitudes spread so easily? Do you think positive behaviour spreads as easily?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 What is the best way to deal with each type of bad apple?"},{"kind":"text","text":"2 Why do you think negative behaviour and attitudes spread so easily? Do you think positive behaviour spreads as easily?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 For the slacker I would suggest trying to\ngive them small, clear tasks and check\nin regularly. Sometimes they just need a\nlittle push or reminder of why their\npart matters.\nFor the naysayer I think you can\nencourage them to suggest solutions\ninstead of just pointing out problems –\nask them to help improve ideas rather\nthan shut them down.\nFor the bully I think you need to set\nboundaries early and involve the\nwhole group in setting expectations.\nIf they don’t respect others, calmly\nremind them of the group’s goals and\nguidelines, or ask a leader to step in\nif necessary.\n2 Negative behaviour spreads easily\nbecause people tend to react to strong\nemotions, like frustration or criticism,\nwhich can quickly bring down the\ngroup’s morale. People also mirror\neach other’s behaviour, so negativity\ncan feel contagious. Positive behaviour\ncan spread too, but it often takes more\neffort. People may need a few examples\nof encouragement or kindness before\nthey follow along, especially if the\ngroup’s mood is already tense. Positive\nattitudes can be powerful, though,\nbecause they boost trust and motivation\nonce they catch on.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8131","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":16,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite the sentences using what clefts.","pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe79520a7220193a1e0ad8dbf900fd784721c98c4c05d738820d6fde8e6b3717.png"],"provided":"","items":[{"id":"b8131.i01","label":"1","prompt":"The report revealed that bad apples destroy group dynamics.","options":[],"type":"gap/open"},{"id":"b8131.i02","label":"2","prompt":"The participants said their group didn't have a good leader.","options":[],"type":"gap/open"},{"id":"b8131.i03","label":"3","prompt":"The researchers saw an increase in negative behaviour.","options":[],"type":"gap/open"},{"id":"b8131.i04","label":"4","prompt":"The study showed that one member can have a disproportionate effect.","options":[],"type":"gap/open"},{"id":"b8131.i05","label":"5","prompt":"People are easily influenced by others to behave badly, which really surprised me.","options":[],"type":"gap/open"},{"id":"b8131.i06","label":"6","prompt":"It wasn't clear why people can behave so differently in different situations.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8131.i01","label":"1","prompt":"The report revealed that bad apples destroy group dynamics.","options":[],"type":"gap/open"},{"kind":"item","id":"b8131.i02","label":"2","prompt":"The participants said their group didn't have a good leader.","options":[],"type":"gap/open"},{"kind":"item","id":"b8131.i03","label":"3","prompt":"The researchers saw an increase in negative behaviour.","options":[],"type":"gap/open"},{"kind":"item","id":"b8131.i04","label":"4","prompt":"The study showed that one member can have a disproportionate effect.","options":[],"type":"gap/open"},{"kind":"item","id":"b8131.i05","label":"5","prompt":"People are easily influenced by others to behave badly, which really surprised me.","options":[],"type":"gap/open"},{"kind":"item","id":"b8131.i06","label":"6","prompt":"It wasn't clear why people can behave so differently in different situations.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"2  What the participants said was (that) their group didn’t\nhave a good leader.\n3  What the researchers saw was an increase in negative\nbehaviour.\n4  What the study showed was (that) one member can\nhave a disproportionate effect.\n5 What really surprised me was (that) people are easily\ninfluenced by others to behave badly.\n6 What wasn’t clear was why people can behave so\ndifferently in different situations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8132","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite the sentences as clarifications using what clefts. Use the words in brackets in the clefts.","pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe79520a7220193a1e0ad8dbf900fd784721c98c4c05d738820d6fde8e6b3717.png"],"provided":"","items":[{"id":"b8132.i01","label":"1","prompt":"This was a poorly designed study. (I'm trying to tell you)","options":[],"type":"gap/open"},{"id":"b8132.i02","label":"2","prompt":"Nobody was aware of the effect his behaviour had on them. (we discovered)","options":[],"type":"gap/open"},{"id":"b8132.i03","label":"3","prompt":"The results were the same for children, teens and adults. (you're saying)","options":[],"type":"gap/open"},{"id":"b8132.i04","label":"4","prompt":"Studies like this are hard to replicate because every group of people is different. (I mean)","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8132.i01","label":"1","prompt":"This was a poorly designed study. (I'm trying to tell you)","options":[],"type":"gap/open"},{"kind":"item","id":"b8132.i02","label":"2","prompt":"Nobody was aware of the effect his behaviour had on them. (we discovered)","options":[],"type":"gap/open"},{"kind":"item","id":"b8132.i03","label":"3","prompt":"The results were the same for children, teens and adults. (you're saying)","options":[],"type":"gap/open"},{"kind":"item","id":"b8132.i04","label":"4","prompt":"Studies like this are hard to replicate because every group of people is different. (I mean)","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"2  What we discovered was (that) nobody was aware of\nthe effect his behaviour had on them.\n3  What you’re saying is (that) the results were the same\nfor children, teens and adults.\n4  What I mean is (that) studies like this are hard to\nreplicate because every group of people is different.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":60,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8133","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Complete the sentences containing wh- clefts expressing your opinions about any issue which is important to people of your age group (e.g. job security). Then work with a partner to discuss which of your sentences you both agree with and why.","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/06b3ffc5a2a7d18e2a35de06a725e5904993d66cf0a9b7c1fc45586287968f13.png"],"provided":"","items":[{"id":"b8133.i01","label":"1","prompt":"What worries me is ____","options":[],"type":"discuss/open"},{"id":"b8133.i02","label":"2","prompt":"What we need to do is ____","options":[],"type":"discuss/open"},{"id":"b8133.i03","label":"3","prompt":"Where we've made some progress is ____","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8133.i01","label":"1","prompt":"What worries me is ____","options":[],"type":"discuss/open"},{"kind":"item","id":"b8133.i02","label":"2","prompt":"What we need to do is ____","options":[],"type":"discuss/open"},{"kind":"item","id":"b8133.i03","label":"3","prompt":"Where we've made some progress is ____","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 What worries me is that many jobs will\nbe replaced by artificial intelligence.\n2 What we need to is think carefully about\nthe careers we choose and be prepared\nto learn new skills.\n3 Where we’ve made some progress is\nequality in the workplace.I agree with\nthe part about being prepared to learn\nnew skills but I’m not worried about\nbeing replaced by AI. It’s always been\nimportant to choose your\ncareer carefully!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8136","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"DEPENDENT PREPOSITIONS"},"instruction":"Complete the sentences with a verb from the Vocabulary box and its dependent preposition. Make sure the verbs are in the correct form. In some items, more than one answer is possible.","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/06b3ffc5a2a7d18e2a35de06a725e5904993d66cf0a9b7c1fc45586287968f13.png"],"provided":"Vocabulary box:\ndepend on, concentrate on, rely on, insist on, plan on, believe in, engage in, participate in, result in, succeed in, interfere with, engage with, provide (somebody) with, present (somebody) with, compare (somebody/something) with","items":[{"id":"b8136.i01","label":"1","prompt":"The psychologist recruited more than 50 students to ____ ____ the study as research subjects.","options":[],"type":"gap/open"},{"id":"b8136.i02","label":"2","prompt":"They've asked us to ____ them ____ all kinds of information that will take a considerable time to pull together.","options":[],"type":"gap/open"},{"id":"b8136.i03","label":"3","prompt":"There are different aspects we could consider, but I think we really need to ____ ____ the fundamental issues for now.","options":[],"type":"gap/open"},{"id":"b8136.i04","label":"4","prompt":"Some less reputable researchers have been known to ____ ____ the data to exaggerate the significance of their findings.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"depend on, concentrate on, rely on, insist on, plan on, believe in, engage in, participate in, result in, succeed in, interfere with, engage with, provide (somebody) with, present (somebody) with, compare (somebody/something) with"},{"kind":"item","id":"b8136.i01","label":"1","prompt":"The psychologist recruited more than 50 students to ____ ____ the study as research subjects.","options":[],"type":"gap/open"},{"kind":"item","id":"b8136.i02","label":"2","prompt":"They've asked us to ____ them ____ all kinds of information that will take a considerable time to pull together.","options":[],"type":"gap/open"},{"kind":"item","id":"b8136.i03","label":"3","prompt":"There are different aspects we could consider, but I think we really need to ____ ____ the fundamental issues for now.","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8136.i04","label":"4","prompt":"Some less reputable researchers have been known to ____ ____ the data to exaggerate the significance of their findings.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 participate in 2 provide / present; with\n3 concentrate on, engage with 4 interfere with","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8137","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"DEPENDENT PREPOSITIONS"},"instruction":"Write three questions about working in groups using the verbs and their dependent prepositions in the Vocabulary box. Then work with a partner to ask and answer them.","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/06b3ffc5a2a7d18e2a35de06a725e5904993d66cf0a9b7c1fc45586287968f13.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Do you think that deciding things in a\nlarger group results in fairer decisions?\nYes, I think it does. You can make a\ndecision based on a wider range of\nopinions and which considers everyone’s\ncircumstances. / No, not necessarily, but\nit might take longer to reach a decision.\n2 Do you think managers should insist on\nall staff going to every meeting?\nYes, I think they should. Everyone should\nbe told the same information. / No, I\ndon’t think this is practical or necessary.\nYou should only have to go to a meeting\nif it is relevant to your work.\n3 In your culture, how acceptable is it\nto disagree with your manager or\nsomeone who is senior to you?\nIn my country, it would be seen as quite\nrude to do this. / It is acceptable to do\nthis in my culture but it must be done\nin and respectful way and you need to\noffer good reasons for disagreeing.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8140","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":21,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a talk comparing two systems for decision making. Before you listen, put the phrases in order to make a definition of majority rule.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d562f7ca88964cfb52b9e73afbd3c30247760d00a16d42c62453e53dfb016ac.png"],"provided":"Majority rule is a principle that states that a majority, / and the power / to make decisions / have both the right / of an organized group, / usually constituted by 50% plus one / that apply to and govern the entire group.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Majority rule is a principle that states that a majority, / and the power / to make decisions / have both the right / of an organized group, / usually constituted by 50% plus one / that apply to and govern the entire group."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"… a majority, usually constituted by 50% plus one of an\norganized group, have both the right and the power to\nmake decisions that apply to and govern the entire group.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8141","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":22,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner and answer the questions.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d562f7ca88964cfb52b9e73afbd3c30247760d00a16d42c62453e53dfb016ac.png"],"provided":"","items":[{"id":"b8141.i01","label":"1","prompt":"What institutions operate by majority rule?","options":[],"type":"discuss/open"},{"id":"b8141.i02","label":"2","prompt":"Have you ever participated in a group that operates by majority rule? Describe the group and why it operates this way.","options":[],"type":"discuss/open"},{"id":"b8141.i03","label":"3","prompt":"Do you think majority rule is a fair system? Is it an effective one? Does it have any disadvantages?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8141.i01","label":"1","prompt":"What institutions operate by majority rule?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8141.i02","label":"2","prompt":"Have you ever participated in a group that operates by majority rule? Describe the group and why it operates this way.","options":[],"type":"discuss/open"},{"kind":"item","id":"b8141.i03","label":"3","prompt":"Do you think majority rule is a fair system? Is it an effective one? Does it have any disadvantages?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 legislative bodies (parliament, the UN,\netc.), juries, boards of directors, etc.\n2 Yes, I was in a group project in school\nwhere we used majority rule to make\ndecisions on our approach and tasks.\nWe did this because it was a quick\nway to get everyone’s input and keep\nthings moving without getting stuck\non disagreements.\n3 Majority rule is usually fair and effective\nsince it gives everyone a chance to\nvote and prevents one person from\ncontrolling the group. However, it has\ndownsides. It can make people in the\nminority feel ignored, and sometimes\nthe best ideas get overlooked if they\ndon’t have enough initial support.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8142","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":23,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"With your partner, read the quote and answer the questions.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d562f7ca88964cfb52b9e73afbd3c30247760d00a16d42c62453e53dfb016ac.png"],"provided":"'I do not believe in the doctrine of the greatest good for the greatest number. It means ... that in order to achieve the supposed good of fifty-one percent, the interest of forty-nine may be, or rather should be, sacrificed. It is a heartless doctrine and has done harm to humanity.'\nMahatma Gandhi (1909)","items":[{"id":"b8142.i01","label":"1","prompt":"What did Gandhi mean? Why is he suggesting the doctrine of majority rule is 'heartless'?","options":[],"type":"discuss/open"},{"id":"b8142.i02","label":"2","prompt":"What are the alternatives to majority rule? Which system do you think is fairer?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"'I do not believe in the doctrine of the greatest good for the greatest number. It means ... that in order to achieve the supposed good of fifty-one percent, the interest of forty-nine may be, or rather should be, sacrificed. It is a heartless doctrine and has done harm to humanity.'"},{"kind":"text","text":"Mahatma Gandhi (1909)"},{"kind":"item","id":"b8142.i01","label":"1","prompt":"What did Gandhi mean? Why is he suggesting the doctrine of majority rule is 'heartless'?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8142.i02","label":"2","prompt":"What are the alternatives to majority rule? Which system do you think is fairer?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Gandhi meant that the system of\nmajority rule allows for the wishes of the\nminority to be ignored, which could be\nconsidered unfair and cruel.\n2 I’ve read that institutions such as the\nUnited Nations and the European\nCouncil make decisions by consensus.\nA resolution is proposed and, if no\none objects, then the resolution is\ndeclared accepted. This seems fair to\nme but it wouldn’t be practical in a lot\nof situations. However, when someone\naccepts something, it doesn’t always\nmean that they agree with it or that it\ndoesn’t have a negative affect on them.\nI think there are always going to be\nconflicting interests which are hard\nto reconcile.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8143","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":24,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Choose the correct word to complete the sentences.","pages":[179,180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/c
