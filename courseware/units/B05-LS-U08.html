ed together to","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8147","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":27,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Use your notes to review the discussion. Complete the tasks.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/15d452088eba0cf82e4d0fa1347e6e09ee5071620453a22b34056559e3d1ed89.png"],"provided":"","items":[{"id":"b8147.i01","label":"1","prompt":"In what ways were the two decision-making processes similar, and in what ways were they different?","options":[],"type":"discuss/open"},{"id":"b8147.i02","label":"2","prompt":"Why do you think the consensus-building activity took so much longer than the vote?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U08-question:b8146","kind":"student-work","title":"LISTENING 2 Ex 6","pages":[180]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8147.i01","label":"1","prompt":"In what ways were the two decision-making processes similar, and in what ways were they different?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8147.i02","label":"2","prompt":"Why do you think the consensus-building activity took so much longer than the vote?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 One similarity was that both approaches\nwere used to make the same decision,\nnamely the proposed museum\ndevelopment on the waterfront site.\nThey differed in terms of the stages\ninvolved, and the final decision that the\ngroup reached.\n2 The consensus building was a more\nthorough approach, as it requires each\nobjection to be addressed in a way that\nis considered satisfactory by the person\nwho objected. This is why it took longer.\nIn contrast, a vote allows for many issues\nto be ignored and not resolved.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8148","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":28,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"8.4 Listen again. Focus on the process described in the second approach, and complete the flowchart using phrases a–f. Write the letter. Then work with a partner. With your books closed, take turns explaining each step of the process.","pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4827873a737b673432ac41666810e9c17710798edd78a44380d8412c7c5dfa7b.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"The facilitator describes the two options, but does not"},{"kind":"text","text":"The students"},{"kind":"text","text":"Based on these, the students"},{"kind":"text","text":"The facilitator checks whether everybody can"},{"kind":"text","text":"Everybody accepts that their views"}]],"courseMaterials":[{"id":"B05-LS-U08-publisher-sheet:b8146","title":"LISTENING 2 Ex 6 原题面","pages":[180],"text":"- The scenario\n- Students' comments about the two approaches to decision-making\n- The two approaches\n- What was agreed","screens":["- The scenario","- Students' comments about the two approaches to decision-making","- The two approaches","- What was agreed"],"sources":[{"page":180,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/15d452088eba0cf82e4d0fa1347e6e09ee5071620453a22b34056559e3d1ed89.png"}],"kind":"task_sheet","sourceBlockIds":["b8146"]}],"courseMedia":[{"type":"audio","title":"Track 8.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4e1aa6b4e4d07b49383fa8d88b9d877790bc23da31231dc38264b8c678fd7b77.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 d 2 e 3 f 4 c 5 b 6 a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8150","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":29,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in small groups. Discuss the questions.","pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4827873a737b673432ac41666810e9c17710798edd78a44380d8412c7c5dfa7b.png"],"provided":"","items":[{"id":"b8150.i01","label":"1","prompt":"Based on the students' comments, which method do you think they will use in future?","options":[],"type":"discuss/open"},{"id":"b8150.i02","label":"2","prompt":"What do you think the teacher wanted the students to learn by doing this activity? How successful do you think it was as a learning experience?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8150.i01","label":"1","prompt":"Based on the students' comments, which method do you think they will use in future?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8150.i02","label":"2","prompt":"What do you think the teacher wanted the students to learn by doing this activity? How successful do you think it was as a learning experience?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Based on the fact that the consensus-\nbuilding approach had no losers and\nreached a conclusion that everyone\ncould accept, I expect they would opt\nfor this approach in a future task. They\nalso mentioned that they felt a sense\nof ownership over the proposal, which\nsuggests they were really engaged in\nthe process.\n2 The teacher must have wanted the\nstudents to learn by doing, and then\nreflecting on the approach they had\ntaken. As they kept up the activity for\nso long, I presume they must have been\nmotivated and engaged, so I would\nconclude it was probably successful.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8152","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":30,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Use ideas from Listening 1 and Listening 2 to answer the following questions.","pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4827873a737b673432ac41666810e9c17710798edd78a44380d8412c7c5dfa7b.png"],"provided":"","items":[{"id":"b8152.i01","label":"1","prompt":"How do you think a bad apple in a group might affect the consensus-building process?","options":[],"type":"discuss/open"},{"id":"b8152.i02","label":"2","prompt":"Which form of decision-making would you prefer to use in groups or organizations where you are a member? Why?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8152.i01","label":"1","prompt":"How do you think a bad apple in a group might affect the consensus-building process?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8152.i02","label":"2","prompt":"Which form of decision-making would you prefer to use in groups or organizations where you are a member? Why?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It would depend on the bad apple’s\nbehaviour. If they weren’t contributing\nto the discussion, or were expressing\ndoubts as to whether the discussion had\nany value or purpose, this behaviour\ncould possibly spread to others in\nthe group. This could undermine the\neffectiveness of the whole discussion.\n2 The form I would like to use would\ndepend entirely on the decision being\nmade. I think that both forms are useful\nand have their benefits and drawbacks,\nso the type of decision would definitely\ninfluence which form would lead more\nefficiently towards a desired outcome.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8153","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":31,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Plan and write a 250-word essay: When a group of people needs to award a prize, would a voting or consensus-building approach be more effective?","pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4827873a737b673432ac41666810e9c17710798edd78a44380d8412c7c5dfa7b.png"],"provided":"Use this structure:\n- Introduction: Summarize the question.\n- Main paragraphs: Make arguments for and against both approaches.\n- Conclusion: Give your opinion (provide reasons for your support).","items":[{"id":"b8153.i01","label":"Essay","prompt":"When a group of people needs to award a prize, would a voting or consensus-building approach be more effective?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Use this structure:"},{"kind":"text","text":"- Introduction: Summarize the question."},{"kind":"text","text":"- Main paragraphs: Make arguments for and against both approaches."},{"kind":"text","text":"- Conclusion: Give your opinion (provide reasons for your support)."},{"kind":"item","id":"b8153.i01","label":"Essay","prompt":"When a group of people needs to award a prize, would a voting or consensus-building approach be more effective?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"In the context of awarding a prize, whether\nfor the best film of the year or the most\npromising startup business in the city,\nthere is a choice between a voting and\nconsensus-building approach. Both reflect\nthe dynamics within the group, and both\nhave their own strengths.\nThe method of voting can either resolve\nthe matter efficiently or create tensions,\nespecially if a strong majority prevails\nand this leads to resentment among the\nminority. The solution in this case would\nbe to ensure that the process remains\nconstructive, considering any reservations\nthat some participants may have. It is\nessential to resolve any potential conflicts\nthat may arise, preserving a sense of\nownership in the process for each member.\nOn the other hand, consensus-building\ncan be a more time-consuming and\nintricate process. The dynamics of such\nan approach require careful navigation to\nprevent bullying tactics that may emerge\nif one participant attempts to prevail over\nothers. Striking a balance between the two\nmethods becomes crucial, maintaining\nefficiency while fostering a constructive\nenvironment where all voices contribute to\nthe final decision.\nUltimately, the choice between voting\nand consensus-building depends on the\ngoals of the award. If efficiency and a\nquick decision are desirable, voting may\nbe preferable. If fostering collaboration,\ninclusivity, and a sense of shared ownership\nare key considerations, a consensus-\nbuilding approach may be more effective.\nIn some cases, a hybrid approach that\nincludes elements of both methods may\nstrike the right balance, ensuring a fair and\nsatisfactory outcome for all involved.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8158","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Discuss the questions.","pages":[182],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47ddd9aee89ea7c4c103c3b25fd63dc36d6d9e8e822d86fab0b7a36c4d933ea9.png"],"provided":"","items":[{"id":"b8158.i01","label":"1","prompt":"What are the dining options on your campus or near your college or university?","options":[],"type":"discuss/open"},{"id":"b8158.i02","label":"2","prompt":"Do you ever eat at fast-food restaurants? If so, what do you like about them? If not, why not?","options":[],"type":"discuss/open"},{"id":"b8158.i03","label":"3","prompt":"Describe your experiences of eating in 'institutional' dining facilities (those found in hospitals, schools, etc.).","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8158.i01","label":"1","prompt":"What are the dining options on your campus or near your college or university?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8158.i02","label":"2","prompt":"Do you ever eat at fast-food restaurants? If so, what do you like about them? If not, why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8158.i03","label":"3","prompt":"Describe your experiences of eating in 'institutional' dining facilities (those found in hospitals, schools, etc.).","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 We have a main dining hall with various\nfood stations, a few coffee shops, and\nsome kiosk spots. Nearby, there are\nalso cafes, fast-food restaurants, and a\ncouple of sit-down restaurants.\n2 Yes, sometimes. They’re convenient,\nquick, and usually affordable. Plus, they\noffer a lot of options when you’re in\na hurry.\n3 It’s usually quite basic. The food is often\nmade in bulk, so it can be a bit bland.\nIt’s not bad, though; it’s convenient,\nespecially when you need a quick meal\nbetween classes or appointments.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":62,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8159","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Listen as a university administrator describes each of the possible dining options at the campus Student Centre. Take notes as you listen.","pages":[183],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cbe50551007de5fed4d389189c36cf258a2eb27c9888448e136d883d9cb0d3c5.png"],"provided":"1 8.5 DINESCO (a commercial food services provider)\n2 8.6 Sharzad (a fast-food restaurant)\n3 8.7 Unihub (a café run by students studying Hospitality and Catering)","items":[{"id":"b8159.i01","label":"1","prompt":"DINESCO (a commercial food services provider)","options":[],"type":"gap/open"},{"id":"b8159.i02","label":"2","prompt":"Sharzad (a fast-food restaurant)","options":[],"type":"gap/open"},{"id":"b8159.i03","label":"3","prompt":"Unihub (a café run by students studying Hospitality and Catering)","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 8.5 DINESCO (a commercial food services provider)"},{"kind":"text","text":"2 8.6 Sharzad (a fast-food restaurant)"},{"kind":"text","text":"3 8.7 Unihub (a café run by students studying Hospitality and Catering)"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 8.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a4e457cfa12e3e1c28ca4f9c1f339afec1bbc0fe6d1c2193c68de47a4319c1e2.mp3"},{"type":"audio","title":"Track 8.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1c27f226e117aa6bca340dec843748c9965e0f4fadb1da628bdcda1ec9812e3c.mp3"},{"type":"audio","title":"Track 8.7","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e795fc53b6b8f2521bec362b405de4089340dbbfe0cf441149207a732760892a.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  DINESCO: current provider; serves hot meals, salads,\nsandwiches, snacks, desserts; open 7 am–11 am;\nuniversity pays annual fee; part of dining contract for\non-campus students – no limit for them, but others\nmust pay; prices good for some but not others; quality\nand choice not good\n2  Sharzad: fast food; serves breakfast, pita sandwiches,\nkebabs, salad, snacks; moderate prices; would be\nopen 24 hours; part of dining contract but with limits\non amount; quality – popular, but not much variety;\nSharzad pays university to rent space – 10% would go\nto support student activities\n3  Unihub: student-run café; doesn’t already exist; would\nbe run by students studying hospitality and catering;\nstudents get experience and it would be part of their\ndegree; would serve sandwiches, salads, pasta, informal\nfood; lunch/dinner only with some late-night takeaway\noptions; part of dining contract but no breakfast; prices\nfor non-students higher than DINESCO; university\nwould help with costs (from students’ activity fund)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8160","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner on a cost-benefit analysis of the three options. Who would be the winners and who would be the losers in each option? Compare your notes in Exercise 2 and complete the table.","pages":[183],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cbe50551007de5fed4d389189c36cf258a2eb27c9888448e136d883d9cb0d3c5.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>DINESCO\u003c/td>\u003ctd>Sharzad\u003c/td>\u003ctd>Unihub\u003c/td>\u003c/tr>\u003ctr>\u003ctd>costs\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>benefits\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>winners\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>losers\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/t xt":"","header":false,"colspan":1,"rowspan":1}],[{"text":"winners","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"losers","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b8160.i01","label":"costs - DINESCO","prompt":"costs: DINESCO","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i02","label":"costs - Sharzad","prompt":"costs: Sharzad","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8160.i03","label":"costs - Unihub","prompt":"costs: Unihub","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i04","label":"4","prompt":"benefits: DINESCO","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i05","label":"5","prompt":"benefits: Sharzad","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i06","label":"6","prompt":"benefits: Unihub","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i07","label":"7","prompt":"winners: DINESCO","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i08","label":"8","prompt":"winners: Sharzad","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i09","label":"winners - Unihub","prompt":"winners: Unihub","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8160.i10","label":"losers - DINESCO","prompt":"losers: DINESCO","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i11","label":"losers - Sharzad","prompt":"losers: Sharzad","options":[],"type":"gap/open"},{"kind":"item","id":"b8160.i12","label":"losers - Unihub","prompt":"losers: Unihub","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"DINESCO Sharzad Unihub\ncosts university pays annual fee;\nnon- contract prices high for\nstudents; not good quality\nchoice for students\nexpansion into whole\nuniversity system; not a lot\nof variety; not unlimited\nmust be created, which\nwill cost money; university\nwould subsidize operation;\nprices high; no breakfasts\nfor students on campus\nbenefits already on campus so no\nadditional costs; part of\ndining contract;\nno limits on food for\ncontract students\nalready has one location on\ncampus, so knows how to\ndo it; popular with students;\npart of dining contract (with\nlimits); open 24/7; would\npay university\n– 10% to go to support\nstudents activities\nStudents get credit for\nworking there; part of\ndining contract (lunch /\ndinner only); late-night\ntakeaway food\nwinners food staff (no changes);\nstudents on contract\n(unlimited food); university\n(nothing to change)\nstudents who like Sharzad;\nstudents’ activity\nfund and university\nstudents studying\nhospitality and catering\nlosers University (annual fee);\nStudents and visitors\n(quality, lack of choice)\nstudents (lack of variety and\nlimits on amount)\nStudents who want\nbreakfast; students’ activity\nfund; food staff","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":62,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8161","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Imagine that you go to this university. Which option would be best for you? For the community? Are the two answers the same? Decide on your position. Write a position statement in which you say which option you support and why.","pages":[183],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cbe50551007de5fed4d389189c36cf258a2eb27c9888448e136d883d9cb0d3c5.png"],"provided":"","items":[{"id":"b8161.i01","label":"1","prompt":"Write a position statement in which you say which dining option you support and why.","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-LS-U08-question:b8160","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[183]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8161.i01","label":"1","prompt":"Write a position statement in which you say which dining option you support and why.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"My preference would be for Sharzad. I like\nthat type of food and being open 24 hours\nis also very convenient. I think it would\nmake a difference for the live-in students\nthat they don’t have unlimited food\noptions. But I think the main benefit would\nbe the contribution to the students’\nactivity fund.\nPREPARATION FOR\nSPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":62,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8164","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":36,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner or in small groups. Review each of the steps for consensus-building. Discuss any questions you have.","pages":[184],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f1f997060ac2652f2243bfbf9e493c364e38d321bf9b1bd5ccdad86bf224d0c7.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Describe the situation in objective terms."},{"kind":"text","text":"Generate key questions that must be answered in the process."},{"kind":"text","text":"State the needs and concerns of all participants."},{"kind":"text","text":"Generate ideas."},{"kind":"text","text":"Accept everything at this point in the process."},{"kind":"text","text":"Avoid criticizing others’ ideas."},{"kind":"text","text":"Discuss the costs and benefits of each idea."}],[{"kind":"text","text":"Discuss consequences of each option for all the stakeholders."},{"kind":"text","text":"Summarize what has been discussed so far."},{"kind":"text","text":"Look for points of agreement"},{"kind":"text","text":"try to synthesize them to create a preliminary proposal."},{"kind":"text","text":"Check for concerns and reservations members of the group may have."},{"kind":"text","text":"Amend your proposal(s), taking into account any concerns or objections."},{"kind":"text","text":"Summarize the proposal that is on the table."}],[{"kind":"text","text":"Test for agreement among the group members."},{"kind":"text","text":"If there are no blocks, finalize your agreement"},{"kind":"text","text":"dealing with reservations and concessions if possible."},{"kind":"text","text":"If there are blocks, return to step 3 and repeat the consensus-building process."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Step 1: How do we make sure everyone’s\nneeds are really understood? What if\nsomeone’s concerns aren’t fully clear?\nStep 2: What if someone brings up an idea\nthat seems completely unrealistic? Do we\nstill include it, or is there a limit?\nStep 3: How do we make sure we’re\nconsidering all possible consequences?\nWhat if we disagree on the impact of\ncertain options?\nStep 4: How do we know if we’ve really\nfound common ground? What if there’s only\nminor agreement?\nStep 5: What if people are hesitant to voice\nconcerns? How do we make sure everyone\nfeels comfortable speaking up?\nStep 6: How do we decide which concerns\nare important enough to change the\nproposal? Do we need everyone’s concerns\naddressed, or just the main ones?\nStep 7: What does “agreement” mean?\nDoes everyone need to be 100% on board,\nor is partial agreement enough?\nStep 8: If someone blocks, do we have to\nrestart from step 3 every time? Is\nthere a way to move forward without\ntotal consensus?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8170","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":37,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"COLLABORATIVE LANGUAGE: SUGGESTION AND CONCESSION"},"instruction":"Work with a partner. Read Scenario 1 and the list of responses (a–g) from a consensus-building process.","pages":[186],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b544881d4740a2a6400edaa5296e4de0272c40d2d53dcbd3654f15115a61dda.png"],"provided":"1 Decide if each response is:\n- blocking\n- standing aside\n- expressing reservations\n- agreeing\n2 Circle the responses that use collaborative language.\n\n## Scenario 1\nYour group is trying to decide where to place a facility for former prisoners who were convicted of non-violent crimes. The former prisoners will live in the facility for six months under supervision before they are released. At the testing-for-agreement stage, the proposal is to place the facility at the edge of town in an old school that has not been used for six years.","items":[{"id":"b8170.i01","label":"a","prompt":"I don't like this, but I recognize that it is a difficult decision for all of us in the community. Since everyone else seems to agree, I will not oppose it.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"id":"b8170.i02","label":"b","prompt":"This proposal makes no sense at all and I cannot support it.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"id":"b8170.i03","label":"c","prompt":"I still think this is a dangerous proposal. Perhaps if we could consider some additional security measures, it would be more acceptable to the whole group.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"id":"b8170.i04","label":"d","prompt":"I think this is the best possible solution to a difficult problem. How can we make it more acceptable for the rest of you?","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"id":"b8170.i05","label":"e","prompt":"This is a solid and sensible plan and I say we should move forward.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"id":"b8170.i06","label":"f","prompt":"How about we consider an alternative site – one a little farther from the centre of population? This site is just too close to our homes for me to feel comfortable supporting it.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"id":"b8170.i07","label":"g","prompt":"I'm not in favour of this proposal at all, but I will abstain (= not vote).","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Decide if each response is:"},{"kind":"text","text":"- blocking"},{"kind":"text","text":"- standing aside"},{"kind":"text","text":"- expressing reservations"},{"kind":"text","text":"- agreeing"},{"kind":"text","text":"2 Circle the responses that use collaborative language."}],[{"kind":"text","text":"Your group is trying to decide where to place a facility for former prisoners who were convicted of non-violent crimes. The former prisoners will live in the facility for six months under supervision before they are released. At the testing-for-agreement stage, the proposal is to place the facility at the edge of town in an old school that has not been used for six years."},{"kind":"item","id":"b8170.i01","label":"a","prompt":"I don't like this, but I recognize that it is a difficult decision for all of us in the community. Since everyone else seems to agree, I will not oppose it.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"kind":"item","id":"b8170.i02","label":"b","prompt":"This proposal makes no sense at all and I cannot support it.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"}],[{"kind":"item","id":"b8170.i03","label":"c","prompt":"I still think this is a dangerous proposal. Perhaps if we could consider some additional security measures, it would be more acceptable to the whole group.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"kind":"item","id":"b8170.i04","label":"d","prompt":"I think this is the best possible solution to a difficult problem. How can we make it more acceptable for the rest of you?","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"kind":"item","id":"b8170.i05","label":"e","prompt":"This is a solid and sensible plan and I say we should move forward.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"}],[{"kind":"item","id":"b8170.i06","label":"f","prompt":"How about we consider an alternative site – one a little farther from the centre of population? This site is just too close to our homes for me to feel comfortable supporting it.","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"},{"kind":"item","id":"b8170.i07","label":"g","prompt":"I'm not in favour of this proposal at all, but I will abstain (= not vote).","options":["blocking","standing aside","expressing reservations","agreeing"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 b block c expressing reservations d agreeing\ne agreeing f expressing reservations g standing aside\n2 collaborative language: a, c, d, f","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8171","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":38,"module":"PREPARATION FOR SPEAKING","ex":"3","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"COLLABORATIVE LANGUAGE: SUGGESTION AND CONCESSION"},"instruction":"Write a response of your own to Scenario 1, using one of the four consensus-building approaches and some collaborative language from the Skills box on page 185 if appropriate.","pages":[186],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b544881d4740a2a6400edaa5296e4de0272c40d2d53dcbd3654f15115a61dda.png"],"provided":"","items":[{"id":"b8171.i01","label":"1","prompt":"Write your own response to Scenario 1:","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8171.i01","label":"1","prompt":"Write your own response to Scenario 1:","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-LS-U08-publisher-page:p185","title":"原题或核对备注所引第185页","pages":[185],"text":"","screens":[],"sources":[{"page":185,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f1d5324be9ba7ebe386bb4e8f4ffc0feacea1c422fcce5154cde6d065d1a6ae1.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8172","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":39,"module":"PREPARATION FOR SPEAKING","ex":"4","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"COLLABORATIVE LANGUAGE: SUGGESTION AND CONCESSION"},"instruction":"Work in small groups. Identify which of the four consensus-building approaches your classmates used in their response.","pages":[186],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b544881d4740a2a6400edaa5296e4de0272c40d2d53dcbd3654f15115a61dda.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8173","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":40,"module":"PREPARATION FOR SPEAKING","ex":"5","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"COLLABORATIVE LANGUAGE: SUGGESTION AND CONCESSION"},"instruction":"Work with a new partner. Read Scenario 2. Write a response of each type to the proposal. Use collaborative language.","pages":[187],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52a9fca4ccf7a3abf751c5a6ec595bf5f46831123dfee07985cc8ebabeb38dac.png"],"provided":"## Scenario 2\n\nCurrently, your school has a very strict policy regarding plagiarism; any student found guilty of plagiarism is expelled from the school on their first offence. Administrators want to adopt a new and less harsh policy that gives students a chance to learn and change. The first offence would result in a failing grade for that assignment, plus the student would have to attend a seminar on how to avoid plagiarism. The second offence would result in a failing grade in the class. The third offence would result in expulsion from the school.","items":[{"id":"b8173.i01","label":"1","prompt":"block: ____","options":[],"type":"gap/open"},{"id":"b8173.i02","label":"2","prompt":"stand aside: ____","options":[],"type":"gap/open"},{"id":"b8173.i03","label":"3","prompt":"express reservations: ____","options":[],"type":"gap/open"},{"id":"b8173.i04","label":"4","prompt":"agree: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Currently, your school has a very strict policy regarding plagiarism; any student found guilty of plagiarism is expelled from the school on their first offence. Administrators want to adopt a new and less harsh policy that gives students a chance to learn and change. The first offence would result in a failing grade for that assignment, plus the student would have to attend a seminar on how to avoid plagiarism. The second offence would result in a failing grade in the class. The third offence would result in expulsion from the school."},{"kind":"item","id":"b8173.i01","label":"1","prompt":"block: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8173.i02","label":"2","prompt":"stand aside: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8173.i03","label":"3","prompt":"express reservations: ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8173.i04","label":"4","prompt":"agree: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 block: I cannot support this proposal.\nLowering the penalty might make\nplagiarism seem less serious, which\ncould hurt the school’s standards.\n2 stand aside: I’m not fully convinced,\nbut I’m happy to move forward with\nthis proposal.\n3 express reservations: I support the\nchange, but I worry a single failing grade\nmay not show how serious plagiarism is.\nMaybe the first penalty could be a\nbit stronger.\n4 agree: I agree; this approach is fair.\nIt allows students to learn from their\nmistakes without immediate expulsion.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8174","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":41,"module":"PREPARATION FOR SPEAKING","ex":"6","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"COLLABORATIVE LANGUAGE: SUGGESTION AND CONCESSION"},"instruction":"Work in small groups. Discuss the scenarios in Exercises 2 and 5. Which position would you actually take for each scenario? Why?","pages":[187],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52a9fca4ccf7a3abf751c5a6ec595bf5f46831123dfee07985cc8ebabeb38dac.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U08-question:b8173","kind":"student-work","title":"PREPARATION FOR SPEAKING Ex 5","pages":[187]},{"id":"B05-LS-U08-question:b8170","kind":"material-reference","title":"PREPARATION FOR SPEAKING Ex 2","pages":[186]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U08-publisher-sheet:b8170","title":"PREPARATION FOR SPEAKING Ex 2 原题面","pages":[186],"text":"1 Decide if each response is:\n- blocking\n- standing aside\n- expressing reservations\n- agreeing\n2 Circle the responses that use collaborative language.\n\n## Scenario 1\nYour group is trying to decide where to place a facility for former prisoners who were convicted of non-violent crimes. The former prisoners will live in the facility for six months under supervision before they are released. At the testing-for-agreement stage, the proposal is to place the facility at the edge of town in an old school that has not been used for six years.","screens":["1 Decide if each response is:","- blocking","- standing aside","- expressing reservations","- agreeing","2 Circle the responses that use collaborative language.","## Scenario 1","Your group is trying to decide where to place a facility for former prisoners who were convicted of non-violent crimes. The former prisoners will live in the facility for six months under supervision before they are released. At the testing-for-agreement stage, the proposal is to place the facility at the edge of town in an old school that has not been used for six years."],"sources":[{"page":186,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b544881d4740a2a6400edaa5296e4de0272c40d2d53dcbd3654f15115a61dda.png"}],"kind":"task_sheet","sourceBlockIds":["b8170"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I agree with the proposal for Scenario 1.\nI think that former prisoners, especially\nones who have been convicted of\nnon-violent crimes, need to be given\nopportunities to restart their lives in a\nsupportive but controlled environment.\nI also agree with Scenario 2. I think that\nexpulsion for a first offence of plagiarism\nis very harsh. Especially if the student has\nnot fully understood what plagiarism is and\nwhy it is wrong. I think that the proposal will\nhelp students learn from their mistakes and\nbecome better students","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"co ences":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8181","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":45,"module":"SPEAKING TASK","ex":"4","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PRACTISE"},"instruction":"Work with a partner. Practise presenting the reasons that favour your proposal, responses to the arguments that you anticipate from others, and suggestions or concessions that you would be willing to make. Make sure you include collaborative language. Give each other feedback.","pages":[188],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c9cb59da15ee8fe848cc8e57a9ebd621461f467cff662291e054ce196507f53e.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8183","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":46,"module":"SPEAKING TASK","ex":"5","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"DISCUSS"},"instruction":"Follow the steps for consensus-building (Preparation for speaking, page 184) to carry out the speaking task. The facilitator (your teacher) will begin the discussion by describing the general situation.","pages":[188],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c9cb59da15ee8fe848cc8e57a9ebd621461f467cff662291e054ce196507f53e.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Describe the situation in objective terms."},{"kind":"text","text":"Generate key questions that must be answered in the process."},{"kind":"text","text":"State the needs and concerns of all participants."},{"kind":"text","text":"Generate ideas."},{"kind":"text","text":"Accept everything at this point in the process."},{"kind":"text","text":"Avoid criticizing others’ ideas."},{"kind":"text","text":"Discuss the costs and benefits of each idea."}],[{"kind":"text","text":"Discuss consequences of each option for all the stakeholders."},{"kind":"text","text":"Summarize what has been discussed so far."},{"kind":"text","text":"Look for points of agreement"},{"kind":"text","text":"try to synthesize them to create a preliminary proposal."},{"kind":"text","text":"Check for concerns and reservations members of the group may have."},{"kind":"text","text":"Amend your proposal(s), taking into account any concerns or objections."},{"kind":"text","text":"Summarize the proposal that is on the table."}],[{"kind":"text","text":"Test for agreement among the group members."},{"kind":"text","text":"If there are no blocks, finalize your agreement"},{"kind":"text","text":"dealing with reservations and concessions if possible."},{"kind":"text","text":"If there are blocks, return to step 3 and repeat the consensus-building process."}]],"courseMaterials":[{"id":"B05-LS-U08-publisher-page:p184","title":"原题或核对备注所引第184页","pages":[184],"text":"","screens":[],"sources":[{"page":184,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f1f997060ac2652f2243bfbf9e493c364e38d321bf9b1bd5ccdad86bf224d0c7.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":63,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U08-question:b8184","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":2,"order":47,"module":"SPEAKING TASK","ex":"6","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"DISCUSS"},"instruction":"When you have finished the task and made your decision, discuss the questions below as a group.","pages":[188],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c9cb59da15ee8fe848cc8e57a9ebd621461f467cff662291e054ce196507f53e.png"],"provided":"- Which of the steps in the Skills box on page 184 did you follow?\n- Was the process successful? Explain your answer.\n- Why do you think it was (un)successful?\n- Which members of your group made concessions? Why eferences":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"redefine","pos":"(v)","definition":"to make people think about something in a new or different way","example":"The exhibition aims to redefine how we think about everyday objects.","wordAudio":"redefine","cardWord":false},{"term":"mass-market","pos":"(adj)","definition":"connected to something that is sold to large numbers of people","example":"The company makes affordable mass-market furniture.","wordAudio":"mass-market","cardWord":false},{"term":"fruitful","pos":"(adj)","definition":"productive. having good results","example":"The designers had a fruitful discussion about the new plans.","wordAudio":"fruitful","cardWord":false},{"term":"account for","pos":"(phr v)","definition":"to form a certain amount of something","example":"Transport can account for a large part of the cost of a school trip.","wordAudio":"account for","cardWord":false},{"term":"tap into","pos":"(phr v)","definition":"to use something and benefit from it","example":"The project aims to tap into the skills of local volunteers.","wordAudio":"tap into","cardWord":false}]]}},{"id":"B05-LS-U08-classroom:video","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef41805c8734c7f78bb24a87df9ebcaed1dd6b4a0bc06f1fb1f72c60e59d536b.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/bbd311e45d81b27c5e2010db-L5LS-U08.mp4","captions":[{"start":0,"end":2.5,"text":"In the world of business,"},{"start":2.86,"end":6.84,"text":"the idea of companies competing against each other is a\nfamiliar one."},{"start":7.56,"end":9.92,"text":"But what happens when they work together?"},{"start":11.08,"end":14.88,"text":"Collaboration in business often proves to be a winning\nstrategy."},{"start":15.7,"end":17.72,"text":"Formula One teams, for instance,"},{"start":18.42,"end":25.4,"text":"benefit from engineering companies collaborating to\nconstruct the fastest, most sophisticated cars\npossible."},{"start":26.58,"end":32.62,"text":"Spotify Premium subscribers can control the music\nplaying on their Uber driver's stereo system,"},{"start":33.26,"end":35.84,"text":"thanks to a collaboration between the two companies."},{"start":36.92,"end":39.22,"text":"And the pioneer of electric vehicles,"},{"start":39.58,"end":39.9,"text":"Tesla,"},{"start":40.38,"end":45.48,"text":"stands as a prime example of how collaboration can help\nto redefine an industry."},{"start":46.86,"end":59.28,"text":"Back in the mid -2000s, the mass market potential of\nEVs was still uncertain, primarily due to the limited\ndistances they could cover before the battery needed to\nbe recharged."},{"start":59.88,"end":62.22,"text":"Tesla pushed what was possible at that time,"},{"start":62.68,"end":68.38,"text":"with its earliest car able to travel 245 miles on a\nsingle charge."},{"start":69.38,"end":70.02,"text":"Nevertheless,"},{"start":70.52,"end":79.76,"text":"the company faced challenges as manufacturers had\nconcerns about selling them the cylindrical lithium\n-ion batteries their EVs required."},{"start":79.76,"end":81.36,"text":"Eventually,"},{"start":81.76,"end":82.98,"text":"in 2009,"},{"start":83.76,"end":89.32,"text":"Tesla secured a deal with the Japanese company\nPanasonic, ensuring a stable supply of batteries."},{"start":90.5,"end":93.82,"text":"This marked the beginning of a fruitful business\npartnership."},{"start":94.8,"end":95.68,"text":"In 2010,"},{"start":96.2,"end":99.28,"text":"Panasonic invested $30 million in Tesla,"},{"start":99.88,"end":107.68,"text":"which led to a cooperation agreement for developing\nbatteries and the construction of the world's largest\nEV battery factory."},{"start":107.68,"end":109.14,"text":"Today,"},{"start":109.64,"end":115.82,"text":"the automotive industry is making significant progress\nin introducing EVs onto our roads,"},{"start":116.44,"end":119.8,"text":"with battery technology which is more advanced than\never."},{"start":120.82,"end":123.12,"text":"It's predicted that by 2035,"},{"start":123.62,"end":128.76,"text":"just 25 years after the collaboration between Tesla and\nPanasonic began,"},{"start":129.84,"end":134.62,"text":"EVs will account for approximately half of new car\nsales worldwide."},{"start":136.2,"end":141.76,"text":"Collaboration offers companies the opportunity to tap\ninto each other's expertise,"},{"start":142.22,"end":144.34,"text":"often with innovative outcomes."},{"start":145.28,"end":145.88,"text":"Arguably,"},{"start":146.3,"end":151.7,"text":"the partnership between Tesla and Panasonic led to the\ngrowth of the EV industry."},{"start":152.64,"end":155.86,"text":"Not only did it bring financial success to both\ncompanies,"},{"start":156.4,"end":160.56,"text":"but also benefits both to their customers and to the\nenvironment."},{"start":162,"end":169.76,"text":"It just goes to show that collaboration is key to\nunlocking new solutions to the problems of the 21st\ncentury."}],"launchInline":true}},{"id":"B05-LS-U08-classroom:resource:b8114","book":5,"unit":8,"track":"LS","topic":"COLLABORATION","lesson":1,"module":"Vocabulary for Ex 3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d03b4ebbb79b20f41acd2bdbca64fe0c87f8b800dfece0621bcfb03 "blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evi
