 From the photos it looks like the\nexperiment is being conducted inside\na home.\n2 If the photos show someone’s house,\nthen the scientist might be related to the\nboy, probably his father.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[{"page":214,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0966e28082f3b5c3bf7b02a43d74cd50622c48848cdee176bc4f1fb87e1608be.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9097","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video and check your predictions in Exercise 2.","pages":[214],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0966e28082f3b5c3bf7b02a43d74cd50622c48848cdee176bc4f1fb87e1608be.png"],"provided":"Watch the video and check your predictions in Exercise 2.","items":[],"layout":"list","references":[{"id":"B05-LS-U10-question:b9093","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[214]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/93da1ee9a9e6ec566e9d2d7f-L5LS-U010.mp4","captions":[{"start":1.3,"end":6.14,"text":"Cognitive scientist Deb Roy realized that to discover\nhow a child learns to speak,"},{"start":8.28,"end":11.98,"text":"he'd have to be able to see and hear them 24 hours a\nday."},{"start":13.8,"end":19.34,"text":"His solution was to take the extraordinary step of\nturning his own home into a language laboratory."},{"start":20.42,"end":22.4,"text":"And his guinea pig was his own son."},{"start":25.58,"end":31.08,"text":"My wife and I were expecting our first child, and we\nhad many conversations around, you know, would this be\npossible?"},{"start":31.2,"end":43.74,"text":"Could we set up our home as an observation space and\nactually capture this kind of rich longitudinal record\nof our own child's development from birth?"},{"start":43.96,"end":45.98,"text":"And that's what we set out to do."},{"start":52.1,"end":54.28,"text":"And so was born the Speech Home Project."},{"start":55.92,"end":60.46,"text":"Oh, the most ambitious language observation experiment\never seen."},{"start":61.44,"end":69.7,"text":"Cameras and microphones recorded every second of Deb's\nson's life from the moment he was born until he was\nthree years old."},{"start":73.44,"end":77.42,"text":"Capturing in precise detail the process of how we learn\nto talk."},{"start":84.28,"end":85.44,"text":"Blue ball."},{"start":85.94,"end":86.74,"text":"Blue ball."},{"start":87.36,"end":88.72,"text":"Blue ball, yeah."},{"start":89.86,"end":94.64,"text":"From the earliest unintelligible babble to the\nemergence of a very first word."},{"start":99.14,"end":99.6,"text":"Apple."},{"start":100.18,"end":100.64,"text":"Apple."},{"start":101.12,"end":102.03999999999999,"text":"Yeah."},{"start":102.8,"end":103.34,"text":"Apple."},{"start":103.38,"end":103.64,"text":"Apple."},{"start":104.88,"end":110.36,"text":"My interest going in was really to understand the\nearliest stages of language formation."},{"start":110.36,"end":113.46000000000001,"text":"And the typical development stages in language,"},{"start":113.96000000000001,"end":121.58,"text":"a child will go from babbling to using single words,\nusually as complete requests and descriptions."},{"start":122.06,"end":128.12,"text":"And then from that they will start what's called a two\n-word stage, where they'll put two words together like\nmore milk."},{"start":128.58,"end":133.26,"text":"And from that very quickly more complex grammatical\nstructures emerge."},{"start":141.02,"end":146.06,"text":"My focus and my aim was to capture the phase up to the\ntwo -word utterance."},{"start":146.54,"end":150.52,"text":"And that could happen anywhere between second and third\nbirthday."},{"start":151.38,"end":157.1,"text":"It turned out my son was an early talker, so by the\ntime his second birthday arrived we had the main data\nset we wanted."},{"start":158.74,"end":160.28,"text":"By the time recording was complete,"},{"start":160.84,"end":163.84,"text":"more than 240 ,000 hours of information"},{"start":164.26,"end":166.76,"text":"and 16 million words had been collected."},{"start":168.16,"end":169.46,"text":"It's a lot of data,"},{"start":170.04,"end":173.1,"text":"but in its raw form it's useless."},{"start":173.72,"end":180.56,"text":"And so the challenges this now sets up for us is how to\nstart extracting the right kind of metadata,"},{"start":180.98,"end":182.46,"text":"transcripts of who said what,"},{"start":182.98,"end":184.82,"text":"annotations of where those people were,"},{"start":185.4,"end":191.04,"text":"annotations of how they're moving and the relationships\nthat they were in as they were speaking."},{"start":191.16,"end":195.94,"text":"And these are the tools that we're now building to\nanalyze the raw data."},{"start":195.94,"end":201.8,"text":"And from that we're starting to see some early insights\ninto the patterns of language development."},{"start":205.64,"end":207.44,"text":"Despite the mountains of video footage,"},{"start":208.06,"end":212.86,"text":"Debrau is already uncovering the intricate effect daily\nlife has on language development."},{"start":214.7,"end":217.78,"text":"It seems cooing to your baby is not just instinct,"},{"start":218.3,"end":219.02,"text":"it's essential."},{"start":220.1,"end":226,"text":"In the months leading up to their son's first words, he\nand his wife unconsciously simplified their speech."},{"start":228.42000000000002,"end":230.94,"text":"Then as their son's own speech develops,"},{"start":231.54,"end":233.8,"text":"they began to use longer sentences again,"},{"start":234.12,"end":235.8,"text":"mirroring the child's own development."},{"start":236.3,"end":237.84,"text":"What's that over there?"},{"start":238.34,"end":239.56,"text":"Over there, that ball."},{"start":241.34,"end":242.18,"text":"Game ball."},{"start":242.92,"end":243.42,"text":"Oh."},{"start":244.88,"end":247.38,"text":"For the very first time,"},{"start":247.86,"end":252.68,"text":"the analysis has also enabled Deb to piece together the\nprecise emergence of individual words,"},{"start":253.64,"end":255.56,"text":"charting how a new word is born."},{"start":255.9,"end":256.92,"text":"That's water."},{"start":257.94,"end":258.32,"text":"Water."},{"start":262.48,"end":262.86,"text":"Water."},{"start":264.76,"end":264.82,"text":"Water."},{"start":264.82,"end":265.54,"text":"Water."},{"start":266.58,"end":267,"text":"Water."},{"start":267,"end":267.1,"text":"Water."},{"start":269.22,"end":269.92,"text":"Water."},{"start":269.92,"end":273.36,"text":"It will take years for Debrau and his team to analyze\nall of the data."},{"start":274.76,"end":278.36,"text":"But buried within this footage are the secrets of how\nwe learn language."},{"start":279.65999999999997,"end":281.02,"text":"If the patterns can be unlocked,"},{"start":281.6,"end":283.76,"text":"then once this remarkable project is complete,"},{"start":284.32,"end":290.82,"text":"we will have the clearest understanding yet of how a\nchild achieves the remarkable feat of learning to talk."}]}],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9098","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Read the questions below. Watch again and take notes. Discuss the answers with a partner using your notes.","pages":[214],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0966e28082f3b5c3bf7b02a43d74cd50622c48848cdee176bc4f1fb87e1608be.png"],"provided":"Read the questions below. Watch again and take notes. Discuss the answers with a partner using your notes.","items":[{"id":"b9098.i01","label":"1","prompt":"What are the main aims of the study?","options":[],"type":"qa/open"},{"id":"b9098.i02","label":"2","prompt":"What discoveries has Deb Roy already made about language development?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9098.i01","label":"1","prompt":"What are the main aims of the study?","options":[],"type":"qa/open"},{"kind":"item","id":"b9098.i02","label":"2","prompt":"What discoveries has Deb Roy already made about language development?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/93da1ee9a9e6ec566e9d2d7f-L5LS-U010.mp4","captions":[{"start .64,"end":255.56,"text":"charting how a new word is born."},{"start":255.9,"end":256.92,"text":"That's water."},{"start":257.94,"end":258.32,"text":"Water."},{"start":262.48,"end":262.86,"text":"Water."},{"start":264.76,"end":264.82,"text":"Water."},{"start":264.82,"end":265.54,"text":"Water."},{"start":266.58,"end":267,"text":"Water."},{"start":267,"end":267.1,"text":"Water."},{"start":269.22,"end":269.92,"text":"Water."},{"start":269.92,"end":273.36,"text":"It will take years for Debrau and his team to analyze\nall of the data."},{"start":274.76,"end":278.36,"text":"But buried within this footage are the secrets of how\nwe learn language."},{"start":279.65999999999997,"end":281.02,"text":"If the patterns can be unlocked,"},{"start":281.6,"end":283.76,"text":"then once this remarkable project is complete,"},{"start":284.32,"end":290.82,"text":"we will have the clearest understanding yet of how a\nchild achieves the remarkable feat of learning to talk."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 second birthday 2 240 000; 16 million 3 simplified\n4 years","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":69,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9101","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Work with a partner. Discuss the questions.","pages":[215],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/baedbf3ec19d49a35ae89b099c2b2f287b397d7b9d3700f886fec573fe04a13e.png"],"provided":"Work with a partner. Discuss the questions.","i {"kind":"item","id":"b9103.i02","label":"2","prompt":"Do you think Deb Roy's son was an 'early talker' because of his surroundings or for some other reason?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9103.i03","label":"3","prompt":"What kind of activities promote language learning in children?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I think parents have a big impact.\nKids learn language by hearing their\nparents talk and repeating words they\nhear often.\n2 I think Deb Roy’s son was an early\ntalker partly because this is Deb Roy’s\nprofession and area of expertise. His son\nwas surrounded by adults talking to him,\nso he picked up language faster.\n3 Activities like reading books, singing\nsongs, and having conversations with\nchildren all help with language learning.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9106","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":9,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the sentences. Write the words in bold next to their de understand. People are friendly, helpful, smiling and caring about you and each other. Being able to read the Greek alphabet is a great reward, especially when near the city, there are signs and subway stations. Carrying the Greek/Roman alphabet forms helps, or fortunately is having a fluent companion with you, like me.\n5 something is up (idiom) there is a problem or something unusual is happening","items":[{"id":"b9107.i01","label":"1","prompt":"What do you think of the accuracy of the translations? Which sentences has the machine done the best job of translating?","options":[],"type":"qa/open"},{"id":"b9107.i02","label":"2","prompt":"Which individual translation mistake is the most misleading, in your opinion?","options":[],"type":"qa/open"},{"id":"b9107.i03","label":"3","prompt":"Which language seems more problematic for the translation machine? Why do you think that is?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Things are on the up. There's a lot of renovation going on, especially in Athens. High-end cars like Porsches and Mercs accelerating with boy-racer menace down city streets. English is spoken in most settings – it's not difficult to get by if you can speak English. People are friendly, helpful, smiley and care about you and each other. Being able to read the Greek alphabet is a big bonus, especially when on foot around the city, with street signs and Metro stops. Carrying a table with Greek/Roman letter equivalents helps or being lucky enough to have a fluent travelling companion with you, as I do."},{"kind":"text","text":"1 on the up (UK, idiom) currently improving in condition, for example, becoming more successful or wealthy"},{"kind":"text","text":"2 boy racer (UK, n, informal) a young man who drives fast and aggressively in high-powered cars around the public roads for fun"}],[{"kind":"text","text":"MACHINE TRANSLATION FROM GREEK"},{"kind":"text","text":"Things are on the rise. There's a lot of renovation going on, especially in Athens. High-quality cars like Porsches and Mercs accelerating the boy-racer face down city streets. English is spoken in most installations – it is not hard to get, if you can speak English. People are friendly, helpful, smiley and take care of you and with each other. Being able to read Greek is a big bonus, especially when on foot around the city, with street signs and subway stops. Carrying out a table with Greek/Roman letters helps equivalents, or be lucky enough to have a free companion with you, as I do."},{"kind":"text","text":"3 on the rise (phrase) currently increasing in amount, for example, unemployment, crime"}],[{"kind":"text","text":"4 face down (phr v / adv) to defeat somebody or something that is opposing you by being brave and strong / with the face or front turned towards the ground"},{"kind":"text","text":"MACHINE TRANSLATION FROM SIMPLIFIED CHINESE"},{"kind":"text","text":"Things are up. There are a lot of renovations, especially in Athens. High-end cars such as Porsche and Meyers accelerate the threat of boy racing with city streets. English can be used in most environments – and if you can speak English, it is not difficult to understand. People are friendly, helpful, smiling and caring about you and each other. Being able to read the Greek alphabet is a great reward, especially when near the city, there are signs and subway stations. Carrying the Greek/Roman alphabet forms helps, or fortunately is having a fluent companion with you, like me."}],[{"kind":"text","text":"5 something is up (idiom) there is a problem or something unusual is happening"},{"kind":"item","id":"b9107.i01","label":"1","prompt":"What do you think of the accuracy of the translations? Which sentences has the machine done the best job of translating?","options":[],"type":"qa/open"},{"kind":"item","id":"b9107.i02","label":"2","prompt":"Which individual translation mistake is the most misleading, in your opinion?","opti ch can have a\nliteral or idiomatic meaning, depending on the context\n2  a literal or idiomatic meaning, depending on the context\n3  since the 1950s\n4  To translate a small section of text required more\nprogramming than it took to simulate the flight of a\nguided missile.\n5  The scientists have to create an enormous database\nof grammar, language rules and vocabulary sets; the\nmachine then translates from one language to another\nby searching for equivalents.\n6  The machine utilizes databases made up of parallel\nbilingual texts – texts that have already been translated\nby humans – and uses data-mining techniques to\ndetect patterns across hundreds of millions of\ndocuments and then make intelligent guesses as to their\nmeaning; a final, grammatical translation is\nthen created.\n7  As a starting point – then he revises the translation and\ncorrects any lexical inaccuracies.\n8  In Spanish, nouns have gender and so the English\npronoun it has to be translated according to whether\nit is referring to a female noun or a masculine noun.\nEnglish word order usually follows the subject-verb-\nobject pattern. However, there are many languages,\nlike Arabic, that follow a different word order.\n9  The use of logographic characters, which represent\nconcepts rather than sounds; the sentence structure,\nwhich is radically different from English sentence\nstructure","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":70,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9115","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":13,"module":"LISTENING 1","ex":"5","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Listen to the seminar again and take notes. As you do, underline or make a note about anything you don't fully understand. After the lecture, review your notes and write three follow-up questions for the lecturer. Then work in small groups and discuss the questions.","pages":[219],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/817c7bd8371a039284776778a3bd55c7928a51bfc666e0c69eb0250146e75560.png"],"provided":"Listen to the seminar again and take notes. As you do, underline or make a note about anything you don't fully understand. After the lecture, review your notes and write three follow-up questions for the lecturer. Then work in small groups and discuss the questions.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 10.1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a9c0bb3f3de51c3e8a5ddb993800eb0325d2ae1d796e4b5bf54da7ef19932242.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"What makes it so difficult for a machine\ntranslation program to understand the\nmeaning of words in context?\nHow does the statistical method decide\nwhich translations are most accurate, and\ndoes it ever ‘learn’ from its mistakes?\nWhy does having a different word order\nin languages like Arabic cause issues in\nmachine translation?\nCan machine translators eventually be\ntrained to handle logographic characters in\nChinese or to understand multiple dialects?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":70,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9117","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":14,"module":"LISTENING 1","ex":"6","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Listen to the anecdote told by the student during the seminar. Answer the questions.","pages":[219],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/817c7bd8371a039284776778a3bd55c7928a51bfc666e0c69eb0250146e75560.png"],"provided":"Listen to the anecdote told by the student during the seminar. Answer the questions.","items":[{"id":"b9117.i01","label":"1","prompt":"How does the student use translation tools, and how does this compare to your use of translation tools?","options":[],"type":"qa/open"},{"id":"b9117.i02","label":"2","prompt":"The student mentioned that his university does not approve of using machine translation. What do you think the university's reasons for that might be?","options":[],"type":"qa/open"},{"id":"b9117.i03","label":"3","prompt":"Why do you think the lecturer encourages the students to tell anecdotes?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9117.i01","label":"1","prompt":"How does the student use translation tools, and how does this compare to your use of translation tools?","options":[],"type":"qa/open"},{"kind":"item","id":"b9117.i02","label":"2","prompt":"The student mentioned that his university does not approve of using machine translation. What do you think the university's reasons for that might be?","options":[],"type":"qa/open"},{"kind":"item","id":"b9117.i03","label":"3","prompt":"Why do you think the lecturer encourages the students to tell anecdotes?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 10.2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/69b98240988ba89822b95b4d9b3eab191427385991943274ba6c3856c61e232b.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 The student knows Spanish and can fix\nany mistakes the translator makes. My\nuse is similar to the student – I check\nthe translation because I know some of\nthe language.\n2 The university likely doesn’t approve\nbecause machine translation often\nmakes mistakes with grammar, context,\nand meaning. This could make students\nrely on inaccurate translations instead of\nlearning the language properly.\n3 The lecturer probably wants the students\nto share personal experiences to make\nthe topic more relatable and to help\nthem see the real-world issues and\nlimitations of machine translation.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":70,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9119","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":15,"module":"LISTENING 1","ex":"7","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[219],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/817c7bd8371a039284776778a3bd55c7928a51bfc666e0c69eb0250146e75560.png"],"provided":"Work with a partner. Discuss the questions.","items":[{"id":"b9119.i01","label":"1","prompt":"What kinds of texts may need the most care and expertise to translate? How effectively do you think AI can cope with these?","options":[],"type":"discuss/open"},{"id":"b9119.i02","label":"2","prompt":"What problems could result from relying on machine translation? Are any of them potentially quite serious?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9119.i01","label":"1","prompt":"What kinds of texts may need the most care and expertise to translate? How effectively do you think AI can cope with these?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9119.i02","label":"2","prompt":"What problems could result from relying on machine translation? Are any of them potentially quite serious?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think AI could probably cope very\nwell with translating factual documents,\nbut I suspect it would perform less\nsuccessfully with texts of a more creative\nnature, such as poetry, because it would\nlack human instincts and feelings about\nlanguage. / I think legal documents\nwould be very difficult to translate\nbecause there are different legal systems\nwith different concepts which do not\nexist in other countries. AI would have to\nunderstand these different legal systems\nand then find equivalent concepts or\nknow when to explain completely new\nconcepts in the target language.\n2 I think there’s a danger that relying on\nit may prevent us from keeping our\nown language skills alive. There could\nbe ambiguities or even errors if AI or\nmachine translation is used to translate\nimportant documents or instruction\nmanuals, and so I think that anything\nthat has been translated by AI should\nalso be checked by a competent\nhuman.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":70,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9120","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":16,"module":"LISTENING 1","ex":"8","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Plan and write a 250-word essay for or against the following statement: Due to advances in AI, working as a human translator is no longer a viable career option.","pages":[219],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/817c7bd8371a039284776778a3bd55c7928a51bfc666e0c69eb0250146e75560.png"],"provided":"Plan and write a 250-word essay for or against the following statement: Due to advances in AI, working as a human translator is no longer a viable career option.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The idea that being a translator is no longer\nworth considering as a career because of AI\nadvances needs careful thought. While AI\nand machine translation have improved,\nI do not agree that human translators are\nno longer needed.\nFirstly, languages are complex and have\nmany nuances that machines find hard to\nunderstand. Human translators understand\nculture, emotions, and context, making sure\ntranslations are not just correct but also\nculturally fitting. It is unlikely that AI can or\nwill ever be able to match this.\nSecondly, in fields like law, medicine, and\nliterature, accuracy and understanding\nare crucial. Human expertise is necessary\nfor difficult texts, idioms, and capturing\nthe right feelings in translations. For\nexample, translated novels need to convey\nthe particular ways in which specific\ncharacters express themselves. I believe\na human translator is needed in order to\nachieve this.\nAI has made some translation tasks quicker\nand easier. AI can translate at any place\nand any time and does not need to rest.\nHowever, human translators still have\nimportant and irreplaceable skills. The\nfuture might involve working together with\nAI, using technology for efficiency, and\nrelying on human judgement for a\ndeep understanding.\nIn conclusion, human translators still have\nspecial skills that AI cannot fully copy. Even\nwhen AI is used to produce a translation,\nthe text should always be read carefully by\na competent person who can ensure that\nthe meaning of the original text has been\nfaithfully reproduced. It may be that in the\nfuture, translators spend more of their time\nchecking texts that have been translated by\nAI, rather than translating themselves.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":70,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9124","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Read the definitions. Use the correct forms of the phrasal verbs in bold to complete the sentences. Write one word in each gap.","pages":[220],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41318fff53d7165793e1fe84bb76d6a33fa1c04ea9db2b6915602e97818a26b.png"],"provided":"Read the definitions. Use the correct forms of the phrasal verbs in bold to complete the sentences. Write one word in each gap.","items":[{"id":"b9124.i01","label":"1","prompt":"He didn’t ____ ____ ____ their hints to change the subject and continued for some time.","options":[],"type":"gap/open"},{"id":"b9124.i02","label":"2","prompt":"You ____ ____ ____ some strange remarks sometimes. They can be hurtful to some people.","options":[],"type":"gap/open"},{"id":"b9124.i03","label":"3","prompt":"Using diagrams and graphics is a great way to ____ complicated in _____.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I can usually pick up on other\npeople’s moods.\n2 It is easy to talk me out of spending\nmoney on things I don’t need.\n3 I can come across as a bit shy when I first\nmeet people.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":71,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9127","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite the two sentences in each item to create a single sentence. Replace the words in bold with a complex gerund formed from the first sentence. In some items, more than one answer is possible.","pages":[222],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a185acdc73a04770493305c0f7f78a52436f587594608e0c221d16f244cbda81.png"],"provided":"Rewrite the two sentences in each item to create a single sentence. Replace the words in bold with a complex gerund formed from the first sentence. In some items, more than one answer is possible.","items":[{"id":"b9127.i01","label":"1","prompt":"We didn't do any speaking activities in the lessons. It had an obvious impact on our fluency in the end-of-term test.","options":[],"type":"gap/open"},{"id":"b9127.i02","label":"2","prompt":"We didn't study any grammar. Despite that, we were remarkably competent communicators.","options":[],"type":"gap/open"},{"id":"b9127.i03","label":"3","prompt":"He travelled to different countries. It taught him the usefulness of knowing a few phrases in the local language.","options":[],"type":"gap/open"},{"id":"b9127.i04","label":"4","prompt":"I was not exposed to native speakers at school. It didn't really affect me.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9127.i01","label":"1","prompt":"We didn't do any speaking activities in the lessons. It had an obvious impact on our fluency in the end-of-term test.","options":[],"type":"gap/open"},{"kind":"item","id":"b9127.i02","label":"2","prompt":"We didn't study any grammar. Despite that, we were remarkably competent communicators.","options":[],"type":"gap/open"},{"kind":"item","id":"b9127.i03","label":"3","prompt":"He travelled to different countries. It taught him the usefulness of knowing a few phrases in the local language.","options":[],"type":"gap/open"},{"kind":"item","id":"b9127.i04","label":"4","prompt":"I was not exposed to native speakers at school. It didn't really affect me.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  Not doing / Not having done any speaking activities\nin the lessons had an obvious impact on our fluency in\nthe end-of-term test.\n2  Despite not studying / not having studied any grammar,\nwe were remarkably competent communicators.\n3  Travelling to different countries taught him the usefulness\nof knowing a few phrases in the local language.\n4  Not being exposed to native speakers at school didn’t\nreally affect me.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":71,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9128","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Complete the sentences with a correct infinitive form of the verb in brackets, either in the positive or negative. In some items, more than one answer is possible.","pages":[222],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a185acdc73a04770493305c0f7f78a52436f587594608e0c221d16f244cbda81.png"],"provided":"Complete the sentences with a correct infinitive form of the verb in brackets, either in the positive or negative. In some items, more than one answer is possible.","items":[{"id":"b9128.i01","label":"1","prompt":"I would have preferred __________ (start) learning English younger than when I actually did.","options":[],"type":"gap/open"},{"id":"b9128.i02","label":"2","prompt":"It's useful practice __________ (make) sentences with complex gerunds and infinitives.","options":[],"type":"gap/open"},{"id":"b9128.i03","label":"3","prompt":"The only way for assessment to be fair is for dictionaries __________ (allow) in exams.","options":[],"type":"gap/open"},{"id":"b9128.i04","label":"4","prompt":"I would expect English __________ (still / be) the world's international language 100 years from now.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9128.i01","label":"1","prompt":"I would have preferred __________ (start) learning English younger than when I actually did.","options":[],"type":"gap/open","answer":{"label":"1","mode":"gap","answer":"to have started"}},{"kind":"item","id":"b9128.i02","label":"2","prompt":"It's useful practice __________ (make) sentences with complex gerunds and infinitives.","options":[],"type":"gap/open","answer":{"label":"2","mode":"gap","answer":"to make / to be making"}},{"kind":"item","id":"b9128.i03","label":"3","prompt":"The only way for assessment to be fair is for dictionaries __________ (allow) in exams.","options":[],"type":"gap/open","answer":{"label":"3","mode":"gap","answer":"not to be allowed"}},{"kind":"item","id":"b9128.i04","label":"4","prompt":"I would expect English __________ (still / be) the world's international language 100 years from now.","options":[],"type":"gap/open","answer":{"label":"4","mode":"gap","answer":"(not) to still be"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 to have started\n2 to make / to be making\n3 not to be allowed\n4 (not) to still be","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":71,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9129","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"order":21,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Discuss the extent to which you agree with the statements in Exercise 4, giving reasons.","pages":[222],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a185acdc73a04770493305c0f7f78a52436f587594608e0c221d16f244cbda81.png"],"provided":"Work with a partner. Discuss the extent to which you agree with the statements in Exercise 4, giving reasons.","items":[],"layout":"list","references":[{"id":"B05-LS-U10-question:b9128","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 4","pages":[222]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 No, I started learning when I was nine,\nwhich I think is about the right age. /\nYes, I started learning English when I was\n17, and although I have made a lot of\nprogress, I have had to work very hard to\nattain the level that I have now.\n2 Yes, it’s definitely helpful to do this,\nand to have to use different tenses\nand forms. / I’m not sure. I think it will\nprobably be useful, but it depends on\nhow often I will use it in future.\n3 I’m in favour of dictionaries not being\nused in exams. The purpose of exams is\nto determine how much a student really\nknows, and allowing dictionaries to be\nused would undermine this. / I don’t\nreally agree with this. Using a dictionary\nappropriately is also a skill and I think\nexams should test skills as well\nas memory.\n4 I partly agree, but I think English is\nlikely to be one of a few international\nlanguages, along with Arabic\nand Spanish.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":71,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9134","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":2,"order":22,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the feedback a student has received from his professor. Then match the definitions (a–h) to the words in bold.","pages":[223],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/32e49c622642418e733ef9f8caa68fa43ec1dbecb5b4ba098d3d06c926605284.png"],"provided":"Read the feedback a student has received from his professor. Then match the definitions (a–h) to the words in bold.\nStudent name: Goran Popović\nAssignment title: The influence of Shakespeare on English vocabulary\nFeedback: Thank you, Goran, for a mostly successful assignment. One area that you excelled in was that you demonstrated a strong grasp of the words which Shakespeare may have invented, and which are still used today. You explained yourself well and produced a coherent piece of writing which was easy to follow. Overall, you demonstrated a strong aptitude for English language and literature.\nHowever, the major weakness was that, despite my explicit instructions to mention at least five of Shakespeare's plays, your assignment was completely lacking in details about which quotation came from which play. Please ensure that you always follow instructions precisely, because if there's ever a discrepancy between what a student was asked to do and what they actually did, this can affect their mark. I'm sure you would find it frustrating for such an impressive essay to lose marks in this way.\nProfessor Miller","items":[{"id":"b9134.i01","label":"1","prompt":"(n) a natural ability or skill","options":["excelled","grasp","coherent","a tive speaker teachers","options":[],"type":"gap/open"},{"id":"b9138.i08","label":"8","prompt":"2a Preferred language teaching methods (with reasons)","options":[],"type":"gap/open"},{"id":"b9138.i09","label":"9","prompt":"Follow-up: Some methods not suitable for children – why?","options":[],"type":"gap/key"},{"id":"b9138.i10","label":"10","prompt":"2b Explanation for the discrepancy between high and low achievers","options":[],"type":"gap/open"},{"id":"b9138.i11","label":"11","prompt":"Follow-up: Motivation – how does this help?","options":[],"type":"gap/key"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9138.i01","label":"1","prompt":"name of student teacher being interviewed","options":[],"type":"gap/key"},{"kind":"item","id":"b9138.i02","label":"2","prompt":"1a Age when they started learning English","options":[],"type":"gap/key"},{"kind":"item","id":"b9138.i03","label":"3","prompt":"1b First teachers: native speakers or non-native speakers?","options":[],"type":"gap/open"},{"kind":"item","id":"b9138.i04","label":"4","prompt":"1c Opinion about their English teachers/lessons at school","options":[],"type":"gap/open"},{"kind":"item","id":"b9138.i05","label":"5","prompt":"Follow-up: Maya's first teachers not qualified – why does she think so?","options":[],"type":"gap/key"},{"kind":"item","id":"b9138.i06","label":"6","prompt":"1d Experience of high school English lessons","options":[],"type":"gap/open"},{"kind":"item","id":"b9138.i07","label":"7","prompt":"1e Opinion about any difference between native speaker and non-native speaker teachers","options":[],"type":"gap/open"}],[{"kind":"item","id":"b9138.i08","label":"8","prompt":"2a Preferred language teaching methods (with reasons)","options":[],"type":"gap/open"},{"kind":"item","id":"b9138.i09","label":"9","prompt":"Follow-up: Some methods not suitable for children – why?","options":[],"type":"gap/key"},{"kind":"item","id":"b9138.i10","label":"10","prompt":"2b Explanation for the discrepancy between high and low achievers","options":[],"type":"gap/open"},{"kind":"item","id":"b9138.i11","label":"11","prompt":"Follow-up: Motivation – how does this help?","options":[],"type":"gap/key"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 10.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/56b0c8206379bd2d571ebbe95eea971772bd23f3f98110a626ac4e0bc8e2d4cd.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  Experience of learning English: a nine years old\nb native speakers c the teachers were not highly\nqualified; they were fun, young and enthusiastic\nd lessons were well-structured; practised all four skills\nand did a lot of grammar e no, more to do with their\ntraining; a teacher who trained at a British institute had\na similar style to native speakers; most local teachers\nstudied English at university – knowledgeable but\nlessons not always interesting\n2  Beliefs about teaching English: a she prefers to work\nout rules; they appeal to her logical–mathematical\nintelligence; however, not having explicit input from the\nteacher may be frustrating for some students – they\nmay feel short-changed if the teacher asks them to\nguess the language rules. Another issue: asking students\nto work out the language rules on their own may not\nbe feasible with complete beginners or small children –\nuse different methods with younger learners and\nbeginners b two crucial factors determine whether a\nstudent is successful or not: aptitude and motivation","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":71,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9139","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":2,"order":26,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Listen again and answer the questions below. Then compare your answers with a partner. What does Maya mean when she says …","pages":[225],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/63f00287012d4093b265d685c23d52b52adb7080738b1da9b1a432288e09e064.png"],"provided":"Listen again and answer the questions below. Then compare your answers with a partner. What does Maya mean when she says …","items":[{"id":"b9139.i01","label":"1","prompt":"her primary school teachers were not highly qualified?","options":[],"type":"qa/open"},{"id":"b9139.i02","label":"2","prompt":"asking students to work out the language rules on their own may not be feasible with complete beginners or small children?","options":[],"type":"qa/open"},{"id":"b9139.i03","label":"3","prompt":"there are two crucial factors affecting student achievement – aptitude and motivation?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9139.i01","label":"1","prompt":"her primary school teachers were not highly qualified?","options":[],"type":"qa/open"},{"kind":"item","id":"b9139.i02","label":"2","prompt":"asking students to work out the language rules on their own may not be feasible with complete beginners or small children?","options":[],"type":"qa/open"},{"kind":"item","id":"b9139.i03","label":"3","prompt":"there are two crucial factors affecting student achievement – aptitude and motivation?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 10.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/56b0c8206379bd2d571ebbe95eea971772bd23f3f98110a626ac4e0bc8e2d4cd.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  They didn’t have teaching qualifications/were\nvolunteers; they came across as lacking teaching\nexperience; their classes did not seem to have much\nstructure; she feels they were fresh from university.\n2  In order to be able to guess or discuss language rules,\nyou may need to have terms to talk about language. For\nexample, you need to understand what nouns\nand verbs are, or what a subject and object are in\na sentence.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":71,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9141","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":2,"order":27,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Listen to excerpts (1–5). What information can you infer from Maya's statements? Choose the best answer (a–c).","pages":[225],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/63f00287012d4093b265d685c23d52b52adb7080738b1da9b1a432288e09e064.png"],"provided":"Listen to excerpts (1–5). What information can you infer from Maya's statements? Choose the best answer (a–c).","items":[{"id":"b9141.i01","label":"1","prompt":"1","options":["Her first teachers helped her to become a motivated language learner.","Her teachers were more interested in travelling than teaching.","Her first teachers didn't really know what they were doing in the classroom."],"type":"choice/open"},{"id":"b9141.i02","label":"2","prompt":"2","options":["Her high school English lessons were better organized than the lessons she had received as a young child.","At high school, she was able to build on the English she had learned as a young child.","She struggled with English as a young child but improved greatly in high school."],"type":"choice/open"},{"id":"b9141.i03","label":"3","prompt":"3","options":["Ms Ahmed tended to avoid discussing literature in her classes.","Ms Ahmed encouraged her students to speak like native speakers.","Ms Ahmed was a more effective teacher than many of her colleagues."],"type":"choice/open"},{"id":"b9141.i04","label":"4","prompt":"4","options":["There are arguments in favour of both teaching methods.","Teachers should always help their students work out grammar rules.","Many students dislike being taught in detail about grammar rules."],"type":"choice/open"},{"id":"b9141.i05","label":"5","prompt":"5","options":["Working out language rules requires students to have more advanced knowledge.","It is essential for all students to be taught about nouns, verbs, subjects and objects.","Teaching beginner students can be difficult because of the gaps in their understanding."],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9141.i01","label":"1","prompt":"1","options":["Her first teachers helped her to become a motivated language learner.","Her teachers were more interested in travelling than teaching.","Her first teachers didn't really know what they were doing in the classroom."],"type":"choice/open","answer":{"label":"1","mode":"choice","option":2}},{"kind":"item","id":"b9141.i02","label":"2","prompt":"2","options":["Her high school English lessons were better organized than the lessons she had received as a young child.","At high school, she was able to build on the English she had learned as a young child.","She struggled with English as a young child but improved greatly in high school."],"type":"choice/open","answer":{"label":"2","mode":"choice","option":0}}],[{"kind":"item","id":"b9141.i03","label":"3","prompt":"3","op tening 1 and Listening 2 to answer the following questions.","items":[{"id":"b9146.i01","label":"1","prompt":"Could AI ever replace human language teachers? If so, what would be the advantages and disadvantages of this?","options":[],"type":"discuss/open"},{"id":"b9146.i02","label":"2","prompt":"To what extent do developments in technology affect the need to learn foreign languages? Do you think this may change in the future?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9146.i01","label":"1","prompt":"Could AI ever replace human language teachers? If so, what would be the advantages and disadvantages of this?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9146.i02","label":"2","prompt":"To what extent do developments in technology affect the need to learn foreign languages? Do you think this may change in the future?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 AI could definitely replace human\nteachers in theory, although whether this\nwill ever happen in practice is doubtful.\nThe main advantage of this would be\ncheap or even free teachers for anyone\nwith a smartphone, so more people\ncould learn a language, and to a higher\nstandard at very little cost. Downsides\ncould include human teachers losing\nwork, and a loss of motivation among\nstudents caused by lack of contact with\na human teacher.\n2 I don’t think that advances in technology\nreduce the need for people to\nlearn other languages. If anything,\ntechnological progress enables more\ncontact between people of different\nnationalities, and so it is likely that\nthe need for people to know foreign\nlanguages will actually increase. / I don’t\nthink people will need to learn foreign\nlanguages in the future. First, it will be\ninstant machine translation using devices\nsuch as smartphones. Then later, we’ll\nbe able to get brain implants which will\nallow us to speak and understand other\nlanguages. It will be like getting an\nupgrade or a download with no need for\nthe learning process.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":72,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":31,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":32,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U10-question:b9149","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Read the interview questions (1–8). Tick the questions which are appropriate and productive. Put a cross next to the questions with problems. What kind of problem do these questions present?","pages":[228],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9d541fdaf10bab6d9567e9a1b3d7584dabaaf150f2fe39508aa2e98c0e584779.png"],"provided":"Work with a partner. Read the interview questions (1–8). Tick the questions which are appropriate and productive. Put a cross next to the questions with problems. What kind of problem do these questions present?","items":[{"id":"b9149.i01","label":"1","prompt":"How beneficial is using social media for learning English?","option ","text":"Interrupt and handle questions."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":212,"alt":""}}]}},{"id":"B05-LS-U10-classroom:resource:b9094","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[214],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0966e28082f3b5c3bf7b02a43d74cd50622c48848cdee176bc4f1fb87e1608be.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"guinea pig","pos":"(n)","definition":"somebody who is used in a test for something","example":"I volunteered to be the guinea pig for the new teaching activity.","wordAudio":"guinea pig","cardWord":false},{"term":"unintelligible","pos":"(adj)","definition":"impossible to understand","example":"The announcement was almost unintelligible above the noise.","wordAudio":"unintelligible","cardWord":false},{"term":"babbling","pos":"(n)","definition":"to talk quickly in a way that is confused, silly or has no meaning","example":"We could hear the baby's babbling from the next room.","wordAudio":"babbling","cardWord":false},{"term":"utterance","pos":"(n)","definition":"something that somebody says","example":"The researcher wrote down each utterance during the conversation.","wordAudio":"utterance","cardWord":false},{"term":"cooing","pos":"(v)","definition":"to speak in a soft, gentle or loving way","example":"She was cooing softly to calm the baby.","wordAudio":"cooing","cardWord":false},{"term":"unconsciously","pos":"(adv)","definition":"to do something without knowing that you are doing it","example":"He unconsciously copied the way his friend was sitting.","wordAudio":"unconsciously","cardWord":false}]]}},{"id":"B05-LS-U10-classroom:video","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[214],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0966e28082f3b5c3bf7b02a43d74cd50622c48848cdee176bc4f1fb87e1608be.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/93da1ee9a9e6ec566e9d2d7f-L5LS-U010.mp4","captions":[{"start":1.3,"end":6.14,"text":"Cognitive scientist Deb Roy realized that to discover\nhow a child learns to speak,"},{"start":8.28,"end":11.98,"text":"he'd have to be able to see and hear them 24 hours a\nday."},{"start":13.8,"end":19.34,"text":"His solution was to take the extraordinary step of\nturning his own home into a language laboratory."},{"start":20.42,"end":22.4,"text":"And his guinea pig was his own son."},{"start":25.58,"end":31.08,"text":"My wife and I were expecting our first child, and we\nhad many conversations around, you know, would this be\npossible?"},{"start":31.2,"end":43.74,"text":"Could we set up our home as an observation space and\nactually capture this kind of rich longitudinal record\nof our own child's development from birth?"},{"start":43.96,"end":45.98,"text":"And that's what we set out to do."},{"start":52.1,"end":54.28,"text":"And so was born the Speech Home Project."},{"start":55.92,"end":60.46,"text":"Oh, the most ambitious language observation experiment\never seen."},{"start":61.44,"end":69.7,"text":"Cameras and microphones recorded every second of Deb's\nson's life from the moment he was born until he was\nthree years old."},{"start":73.44,"end":77.42,"text":"Capturing in precise detail the process of how we learn\nto talk."},{"start":84.28,"end":85.44,"text":"Blue ball."},{"start":85.94,"end":86.74,"text":"Blue ball."},{"start":87.36,"end":88.72,"text":"Blue ball, yeah."},{"start":89.86,"end":94.64,"text":"From the earliest unintelligible babble to the\nemergence of a very first word."},{"start":99.14,"end":99.6,"text":"Apple."},{"start":100.18,"end":100.64,"text":"Apple."},{"start":101.12,"end":102.03999999999999,"text":"Yeah."},{"start":102.8,"end":103.34,"text":"Apple."},{"start":103.38,"end":103.64,"text":"Apple."},{"start":104.88,"end":110.36,"text":"My interest going in was really to understand the\nearliest stages of language formation."},{"start":110.36,"end":113.46000000000001,"text":"And the typical development stages in language,"},{"start":113.96000000000001,"end":121.58,"text":"a child will go from babbling to using single words,\nusually as complete requests and descriptions."},{"start":122.06,"end":128.12,"text":"And then from that they will start what's called a two\n-word stage, where they'll put two words together like\nmore milk."},{"start":128.58,"end":133.26,"text":"And from that very quickly more complex grammatical\nstructures emerge."},{"start":141.02,"end":146.06,"text":"My focus and my aim was to capture the phase up to the\ntwo -word utterance."},{"start":146.54,"end":150.52,"text":"And that could happen anywhere between second and third\nbirthday."},{"start":151.38,"end":157.1,"text":"It turned out my son was an early talker, so by the\ntime his second birthday arrived we had the main data\nset we wanted."},{"start":158.74,"end":160.28,"text":"By the time recording was complete,"},{"start":160.84,"end":163.84,"text":"more than 240 ,000 hours of information"},{"start":164.26,"end":166.76,"text":"and 16 million words had been collected."},{"start":168.16,"end":169.46,"text":"It's a lot of data,"},{"start":170.04,"end":173.1,"text":"but in its raw form it's useless."},{"start":173.72,"end":180.56,"text":"And so the challenges this now sets up for us is how to\nstart extracting the right kind of metadata,"},{"start":180.98,"end":182.46,"text":"transcripts of who said what,"},{"start":182.98,"end":184.82,"text":"annotations of where those people were,"},{"start":185.4,"end":191.04,"text":"annotations of how they're moving and the relationships\nthat they were in as they were speaking."},{"start":191.16,"end":195.94,"text":"And these are the tools that we're now building to\nanalyze the raw data."},{"start":195.94,"end":201.8,"text":"And from that we're starting to see some early insights\ninto the patterns of language development."},{"start":205.64,"end":207.44,"text":"Despite the mountains of video footage,"},{"start":208.06,"end":212.86,"text":"Debrau is already uncovering the intricate effect daily\nlife has on language development."},{"start":214.7,"end":217.78,"text":"It seems cooing to your baby is not just instinct,"},{"start":218.3,"end":219.02,"text":"it's essential."},{"start":220.1,"end":226,"text":"In the months leading up to their son's first words, he\nand his wife unconsciously simplified their speech."},{"start":228.42000000000002,"end":230.94,"text":"Then as their son's own speech develops,"},{"start":231.54,"end":233.8,"text":"they began to use longer sentences again,"},{"start":234.12,"end":235.8,"text":"mirroring the child's own development."},{"start":236.3,"end":237.84,"text":"What's that over there?"},{"start":238.34,"end":239.56,"text":"Over there, that ball."},{"start":241.34,"end":242.18,"text":"Game ball."},{"start":242.92,"end":243.42,"text":"Oh."},{"start":244.88,"end":247.38,"text":"For the very first time,"},{"start":247.86,"end":252.68,"text":"the analysis has also enabled Deb to piece together the\nprecise emergence of individual words,"},{"start":253.64,"end":255.56,"text":"charting how a new word is born."},{"start":255.9,"end":256.92,"text":"That's water."},{"start":257.94,"end":258.32,"text":"Water."},{"start":262.48,"end":262.86,"text":"Water."},{"start":264.76,"end":264.82,"text":"Water."},{"start":264.82,"end":265.54,"text":"Water."},{"start":266.58,"end":267,"text":"Water."},{"start":267,"end":267.1,"text":"Water."},{"start":269.22,"end":269.92,"text":"Water."},{"start":269.92,"end":273.36,"text":"It will take years for Debrau and his team to analyze\nall of the data."},{"start":274.76,"end":278.36,"text":"But buried within this footage are the secrets of how\nwe learn language."},{"start":279.65999999999997,"end":281.02,"text":"If the patterns can be unlocked,"},{"start":281.6,"end":283.76,"text":"then once this remarkable project is complete,"},{"start":284.32,"end":290.82,"text":"we will have the clearest understanding yet of how a\nchild achieves the remarkable feat of learning to talk."}],"launchInline":true}},{"id":"B05-LS-U10-classroom:resource:b9123","book":5,"unit":10,"track":"LS","topic":"LANGUAGE","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"pages":[220],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c41318fff53d7165793e1fe84bb76d6a33fa1c04ea9db2b6915602e97818a26b.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["come across (as something) to behave in a way that makes people believe that you have certain characteristics\ncome out with something to say something unexpectedly\nbe getting at something to express something in a way that some people find difficult to understand\nget something across to communicate an idea successfully","pick up on something to notice or understand something that is communicated directly or indirectly\ntalk somebody into / out of something to persuade somebody to do / not to do something\ntalk somebody through something to explain an idea, a plan, etc."]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-LS-U
