"}],[{"kind":"item","id":"b6788.i04","label":"4","prompt":"Doctors use VR to investigate tumours because it is easier to understand their size.","options":["True","False"],"type":"choice_gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c4ff895ff03248e7139c3b8e-L4RW-U03.mp4","captions":[{"start":0,"end":3.88,"text":"Barcelona is a beautiful city to cycle through,"},{"start":4.36,"end":6.54,"text":"and here at the Hospital del Mar,"},{"start":7.08,"end":11.52,"text":"they remind their patients in the intensive care unit\nof that each day."},{"start":12.14,"end":19.98,"text":"These doctors hope that virtual reality will make using\nphysiotherapy bicycles in bed more bearable for\npatients."},{"start":20.92,"end":28.92,"text":"Our hypothesis is that using cycling will generate more\nbenefits to our musculoskeletal system in terms of\nfunctional physiotherapy."},{"start":28.92,"end":40.52,"text":"However, adding the VR headset increases well -being\nand makes this physical therapy, which can be tough and\ncomplex for patients in intensive care units, more\ncomfortable and pleasant."},{"start":41.02,"end":45.4,"text":"With 15 minutes a day cycling through the virtual\nstreets of Barcelona,"},{"start":45.96,"end":51.2,"text":"their patients may be able to restart their lives\noutside the ICU sooner."},{"start":51.94,"end":57.14,"text":"They're not the only medical team to recognize the\nvalue of escaping from reality."},{"start":58.92,"end":61.48,"text":"12 -year -old Noel has a rare condition,"},{"start":61.8,"end":65.7,"text":"which means frequent surgery and physiotherapy to help\nhim walk."},{"start":66.78,"end":70.46000000000001,"text":"Now researchers are using VR to help with that."},{"start":70.72,"end":72.88,"text":"Our biggest concern was how do we make walking fun?"},{"start":73.9,"end":75.3,"text":"So just keep walking down the road."},{"start":75.74,"end":79.16,"text":"Once you see those monsters, just try to aim at them."},{"start":79.76,"end":80.6,"text":"These days,"},{"start":80.98,"end":86.5,"text":"Noel is killing monsters and escaping giant spiders\nwhile working on his mobility."},{"start":87.18,"end":93.92,"text":"I don't realize how far I'm walking because I'm so\nconcentrated on the game with my score."},{"start":94.62,"end":97.52000000000001,"text":"He now looks forward to his physiotherapy sessions."},{"start":98.52000000000001,"end":104.56,"text":"A different use of VR experiences is helping patients\nunderstand the source of their pain."},{"start":105.46000000000001,"end":110.1,"text":"Matt Flanagan was one of the first chiropractors to use\nthis method in the UK."},{"start":110.7,"end":115.8,"text":"He uses scans of his patients' spines to create a\nvirtual tour for them."},{"start":116.66,"end":122.06,"text":"There are lots of limitations with the old methods of\ncommunication and education."},{"start":124.46,"end":127.98,"text":"Patients are not used to looking at anatomical models."},{"start":128.74,"end":133.86,"text":"And so often one of the things is patients find it\ndifficult to know which is the front, which is the\nback."},{"start":133.9,"end":139.76,"text":"It's almost surreal because you're in another world\nwhere you're looking at your pulse, you're looking at\nyourself."},{"start":139.76,"end":146.46,"text":"It does motivate me to do the exercise because I can\nsee the relevance of how it would help me get better."},{"start":147.3,"end":156.04,"text":"A similar VR application for cancer doctors has\nresulted from a collaboration between experts in the\nfields of cancer medicine,"},{"start":156.5,"end":157.12,"text":"video gaming,"},{"start":157.62,"end":158.38,"text":"and astronomy."},{"start":159.24,"end":164.18,"text":"They can use it to investigate an individual patient's\ntumor from the inside."},{"start":164.18,"end":169.07999999999998,"text":"It's so much easier to notice differences,"},{"start":169.46,"end":170.72,"text":"to notice features,"},{"start":171.04,"end":177.18,"text":"to notice peculiarities when you're actually in a thing\nthan when you're looking at it through a spreadsheet or\na photograph."},{"start":177.38,"end":184.22,"text":"You can see how a certain type of cell might be beside\na blood vessel or a milk duct."},{"start":184.56,"end":188.46,"text":"That might be important for the future prognosis of\nthat patient."},{"start":192.74,"end":203.62,"text":"The team have shown that understanding the organization\nof cells in a tumor can help predict how a patient's\ncondition might progress and respond to treatment."},{"start":204.56,"end":209.4,"text":"Virtual reality headsets are becoming a more common\nsight in clinical settings."},{"start":210.44,"end":215.26,"text":"No doubt more creative applications of this technology are\non the way."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 DNS 2 T 3 T 4 DNS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":34,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[{"page":60,"original":"rehabilitation (n) to help someone live a normal life again after they have had a serious illness","text":"词头和n保留；原释义保留。教学可另用the process of helping...解释，不能把词性n判作错误或把原词偷偷换为rehabilitate。"}],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6789","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again and complete the sentences using words from the video. Use no more than THREE WORDS.","pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/ t would help me get better."},{"start":147.3,"end":156.04,"text":"A similar VR application for cancer doctors has\nresulted from a collaboration between experts in the\nfields of cancer medicine,"},{"start":156.5,"end":157.12,"text":"video gaming,"},{"start":157.62,"end":158.38,"text":"and astronomy."},{"start":159.24,"end":164.18,"text":"They can use it to investigate an individual patient's\ntumor from the inside."},{"start":164.18,"end":169.07999999999998,"text":"It's so much easier to notice differences,"},{"start":169.46,"end":170.72,"text":"to notice features,"},{"start":171.04,"end":177.18,"text":"to notice peculiarities when you're actually in a thing\nthan when you're looking at it through a spreadsheet or\na photograph."},{"start":177.38,"end":184.22,"text":"You can see how a certain type of cell might be beside\na blood vessel or a milk duct."},{"start":184.56,"end":188.46,"text":"That might be important for the future prognosis of\nthat patient."},{"start":192.74,"end":203.62,"text":"The team have shown that understanding the organization\nof cells in a tumor can help predict how a patient's\ncondition might progress and respond to treatment."},{"start":204.56,"end":209.4,"text":"Virtual reality headsets are becoming a more common\nsight in clinical settings."},{"start":210.44,"end":215.26,"text":"No doubt more creative applications of this technology are\non the way."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 It makes his sessions fun, he doesn’t\nrealise how much work he is doing. He\nlooks forward to his sessions.\n2 It is easier for the patients to understand\nwhat they are looking at.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afda ustomed to\ntechnology and enjoy using it more. It\nmight be more difficult for older people\nto understand.\n2 The high cost of the technology might\nbe a drawback. It may also take time\nfor patients and doctors to become\ncomfortable and skilled in using\nVR effectively.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6795","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the sentences and choose the best definition for the words in bold.","pages":[62],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/31fcd55f68d2307c8f4595731f02fd789ae3dca63bc1447d128ac0b545354c1a.png"],"provided":"","items":[{"id":"b6795.i01","label":"1","prompt":"After my knee surgery, my leg was sore for several weeks.","options":["taking medicine for a period of time after you are sick","the cutting open of the body to repair a damaged part"],"type":"choice/closed"},{"id":"b6795.i02","label":"2","prompt":"Two symptoms of the common cold are coughing and sneezing.","options" ernative medical treatments."}],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6796.i01","label":"1","prompt":"Which statement best describes what the article is about?","options":[{"optionLabel":"1","optionEn":"The article presents the arguments for and against conventional types of medicine."},{"optionLabel":"2","optionEn":"The article discusses why some alternative medical treatments are free."},{"optionLabel":"3","optionEn":"The article gives two people's opinions on the effectiveness of using homeopathy."},{"optionLabel":"4","optionEn":"The article discusses a range of alternative medical treatments."}],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6799","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article on the homeopathy debate. Highlight each writer's opinion in a different colour and underline the support each writer provides. Write notes in the margin as you read.","pages":[63],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3cd0e6b4097c018feaeaad552194a0f66b1c39202244e7c6e3c6042c609a5352.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)\n2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?\n3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)\n4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.\n5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","screens":["# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that recommend homeopathic treatments, since they are\ncheap and popular. … difficult to understand why the\ngovernment is considering cutting funding for them.\nWhy shouldn’t people be allowed to make their own\nhealth choices? … hundreds of examples of patients who\nhave been cured. … plenty of research which shows the\nbenefits it can bring. … wouldn’t have survived so long if it\nwere complete nonsense.\nPiers: We don’t really know whether homeopathy helps\npeople feel better because of the remedies themselves\nor because people believe they will work.\nSome people just feel better when they get personal\ncare and attention ... absolutely no proof that says\nhomeopathic treatment works. The government’s chief\nscientist confirmed ... there was ‘no real evidence’ to\nsupport homeopathy. ... every penny the government\nspends should be checked to ensure that it is not wasted.\n75% of British doctors are against the state funding of\nhomeopathy. ... people may think they are treating their\nillness ... no scientific evidence this is true.\n... more seriously, patients who rely on homeopathy\nalone ... could be taking a big risk. ... might no longer\nbe treatable ... if the patient has waited too long trying\nhomeopathy. This can cost lives.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6800","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article again. Write T (true), F (false) or DNS (does not say) next to the statements. Correct the false statements.","pages":[63],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3cd0e6b4097c018feaeaad552194a0f66b1c39202244e7c6e3c6042c609a5352.png"],"provided":"","items":[{"id":"b6800.i01","label":"1","prompt":"The majority of countries use alternative rather than conventional medicine.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i02","label":"2","prompt":"Supporters of homeopathy believe that patients should have choices in their treatment.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i03","label":"3","prompt":"More than two-thirds of doctors in the UK are against state-funded homeopathic treatment.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i04","label":"4","prompt":"Traditional Indian doctors frequently use homeopathy.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i05","label":"5","prompt":"Abigail Hayes thinks that homeopathic remedies only work because of the placebo effect.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i06","label":"6","prompt":"In the UK, people currently have a choice as to what treatment they can get.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i07","label":"7","prompt":"Homeopathic healthcare is not available in the United States.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6800.i08","label":"8","prompt":"Weak, highly diluted liquids are a common form of homeopathic treatment.","options":["True","False"],"type":"choice_gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6800.i01","label":"1","prompt":"The majority of countries use alternative rather than conventional medicine.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6800.i02","label":"2","prompt":"Supporters of homeopathy believe that patients should have choices in their treatment.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6800.i03","label":"3","prompt":"More than two-thirds of doctors in the UK are against state-funded homeopathic treatment.","options":["True","False"],"type":"choice_gap/closed"}],[{"kind":"item","id":"b6800.i04","label":"4","prompt":"Traditional Indian doctors frequently use homeopathy.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6800.i05","label":"5","prompt":"Abigail Hayes thinks that homeopathic remedies only work because of the placebo effect.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6800.i06","label":"6","prompt":"In the UK, people currently have a choice as to what treatment they can get.","options":["True","False"],"type":"choice_gap/closed"}],[{"kind":"item","id":"b6800.i07","label":"7","prompt":"Homeopathic healthcare is not available in the United States.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6800.i08","label":"8","prompt":"Weak, highly diluted liquids are a common form of homeopathic treatment.","options":["True","False"],"type":"choice_gap/closed"}]],"courseMaterials":[{"id":"B04-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)\n2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?\n3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)\n4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.\n5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","screens":["# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)","2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cos ors are against the state funding of homeopathy.","5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment"],"sources":[{"page":64,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b0a8199d443f804c83b5f4452f14e6521caa6a5faec780166c583aee0fc2ea9d.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d13567569b6d2740c4746343411ce4f058307e667362e8635c991ca2ea6e8fd3.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Conventional medicine is very expensive\nbecause it needs a great deal of testing\nand the pharmaceutical companies want\nto make a large profit.\nI agree with the statement that\nhomeopathic treatment is much cheaper\nbut something being cheaper does not\nusually mean that it is better.\n2 There is a great deal of evidence to show\nthat if people believe they are being\ncured, they get better. This is called the\n‘placebo effect’. People are less stressed\nif they believe that they are well.\nI think that there have been many cases\nwhen this has been shown to happen, so\nI believe it but I don’t really understand\nhow it is possible.\n3 People may be less worried if they have\nshared their medical problems and know\nthat somebody is looking after them.\nThey may also be more motivated to\nlook after themselves.\nI agree with the idea that we can help\npeople to help themselves and that\neveryone feels better if they feel like\nsomeone cares about them.\n4 Most mainstream doctors will say this,\nand this opinion is widespread and can\nbe found everywhere.\nI disagree with this. My aunt uses\nhomeopathic medicine and it has really\nhelped her.\n5 Conventional medicine is based on\nscience. Doctors also have to prove that\nthey are not wasting money when\nusing homeopathy.\nI think it is true that doctors need to be\nscientific in their approach but I believe\nthat sometimes things happen that can’t\nbe explained by science.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6807","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"order":14,"module":"READING 1","ex":"7","context":{"moduleLabel":"READING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[65],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.g "LANGUAGE DEVELOPMENT","phaseTitle":"ACADEMIC VOCABULARY"},"instruction":"In pairs see if you can produce the noun from each of these adjectives and then create a sentence. Use a dictionary if needed.","pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/235923bdecc723bc74657bd522a49e26b1e8df162d36e73867b0d03e76691978.png"],"provided":"I really appreciated the nurse's professionalism when she gave me the injection.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"I really appreciated the nurse's professionalism when she gave me the injection."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 She faced adversity with great courage.\n2  His professionalism earned him respect\nat work.\n3  The illegality of the action was clear\nto everyone.\n4  It is a challenging sport due to the\nphysicality required.\n5  This requires careful thought because of\nthe complexity of the problem.\n6  The adequacy of the solution was\nquestioned by the team.\n7  He prefers conventionalism over\nradical change.\n8  The surgeon worked with precision\nduring the operation.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6831","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"ACADEMIC VOCABULARY"},"instruction":"In pairs or small groups discuss the questions in Exercise 1.","pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/235923bdecc723bc74657bd522a49e26b1e8df162d36e73867b0d03e76691978.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-RW-U03-question:b6828","kind":"material-reference","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[70]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U03-publisher-sheet:b6828","title":"LANGUAGE DEVELOPMENT Ex 1 原题面","pages":[70],"text":"- A surgeon has to be very precise when performing an operation. Is this type of work best completed by a robot?\n- Do you think doctors should only subscribe to conventional methods of treatment?\n- Do you think that providing healthcare for a country is a very complex issue, or can it be easily resolved?\n- Do you think there is adequate healthcare provision for the elderly in your country?\n- Do you think it should be illegal for pharmaceutical companies to make large profits on their medicines?\n- Have you always found the doctors and nurses you have met to be professional in their approach?\n- Do you think you do enough physical exercise to maintain a healthy lifestyle?\n- Have you ever experienced any adverse effects after having any medicines or vaccines?","screens":["- A surgeon has to be very precise when performing an operation. Is this type of work best completed by a robot?","- Do you think doctors should only subscribe to conventional methods of treatment?","- Do you think that providing healthcare for a country is a very complex issue, or can it be easily resolved?","- Do you think there is adequate healthcare provision for the elderly in your country?","- Do you think it should be illegal for pharmaceutical companies to make large profits on their medicines?","- Have you always found the doctors and nurses you have met to be professional in their approach?","- Do you think you do enough physical exercise to maintain a healthy lifestyle?","- Have you ever experienced any adverse effects after having any medicines or vaccines?"],"sources":[{"page":70,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/235923bdecc723bc74657bd522a49e26b1e8df162d36e73867b0d03e76691978.png"}],"kind":"task_sheet","sourceBlockIds":["b6828"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Robots can assist with precision in\nsurgery, but I think that a human doctor\nshould always be there for decision-\nmaking and unexpected situations.\n2 No, I think doctors should consider\nboth conventional and alternative\ntreatments based on evidence and\npatient needs.\n3 I believe that providing healthcare for\na country, especially a country with a\nlarge population, is a highly\ncomplex issue.\n4 I think it can vary but overall, it needs\nsignificant improvements.\n5 It’s debatable, because the companies\nneed to make money to help them\nresearch other medicines, but there\nneeds to be some regulation of prices.\n6 Generally, yes, though I think people can\nhave different experiences depending\non the situation circumstances.\n7 I think so. I walk a lot and I go\nswimming regularly.\n8 I have had some mild effects like feeling\na little ill but nothing very serious.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":37,"title":"教师书"},{"source":"ht  more than 10% of the population do not have health coverage. Those who are not enrolled in government schemes have to pay for health insurance.\nd Under the National Health Service, all workers pay National Insurance according to how much they earn. This is collected by the government and used to pay for hospitals and other medical treatment.","items":[{"id":"b6811.i01","label":"1","prompt":"Do you have to pay for healthcare in your country? What healthcare provision, if any, does your government pay for?","options":["This country spends more on healthcare per person than almost all of its neighbouring countries. Healthcare is free (or almost free) for everyone. This is paid for by the government.","Most workers have to pay for government health insurance from their salaries or buy insurance on their own.","Healthcare is expensive and more than 10% of the population do not have health coverage. Those who are not enrolled in government schemes have to pay for health insurance.","Under the National Health Service, all workers pay National Insurance according to how much they earn. This is collected by the government and used to pay for hospitals and other medical treatment."],"type":"choice/closed"},{"id":"b6811.i02","label":"2","prompt":"What do you know about healthcare systems in other countries?","options":["This country spends more on healthcare per person than almost all of its neighbouring countries. Healthcare is free (or almost free) for everyone. This is paid for by the government.","Most workers have to pay for government health insurance from their salaries or buy insurance on their own.","Healthcare is expensive and more than 10% of the population do not have health coverage. Those who are not enrolled in government schemes have to pay for health insurance.","Under the National Health Service, all workers pay National Insurance according to how much they earn. This is collected by the government and used to pay for hospitals and other medical treatment." ealthcare."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6815","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":2,"order":25,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Underline the key features of each healthcare system mentioned in the article (an example has been done for you). Write notes about each healthcare system mentioned.","pages":[68],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/12e47738e2e03e6d4b9154d52d6a1c495548dad9da595a2f25bb18ba41fa75f0.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U03-classroom:material:RW-M04","title":"READING 2","text":"# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare\n2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare\n3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system\n4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion\n5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","screens":["# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare","2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals an pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare\n2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare\n3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system\n4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion\n5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","screens":["# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare","2 Within the countries which provide free public healthca anies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion","5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen."],"sources":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e797fce1322834e8e18cdd59a1a56d0affdea585735813190c661f953625568.png","width":3040,"height":4096}],"kind":"reading"},{"id":"B04-RW-U03-publisher-sheet:b6817","title":"READING 2 Ex 7 原题面","pages":[68],"text":"Match the following words from the text to their synonym.","screens":["Match the following words from the text to their synonym."],"sources":[{"page":68,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/12e47738e2e03e6d4b9154d52d6a1c495548dad9da595a2f25bb18ba41fa75f0.png"}],"kind":"task_sheet","sourceBlockIds":["b6817"]},{"id":"B04-RW-U03-material:RW-M03","title":"READING 1","pages":[64],"text":"# The homeopathy debate\n\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)\n\n2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?\n\n3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)\n\n4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.\n\n5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","screens":["# The homeopathy debate","Most national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and","one critic present their cases.","## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)","2 The British National Health Service was founded to provide free ,"5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.","¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment"],"sources":[{"page":64,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b0a8199d443f804c83b5f4452f14e6521caa6a5faec780166c583aee0fc2ea9d.png"}],"kind":"material","sourceBlockIds":["b6801"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1375c8c098b28408dec7ddd601f4bd19a1f8bb7f24631ff93dc651fc00fbaef5.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 I think that a public healthcare system\nis best because everyone should be\ntreated equally. It also means that\nthere are enough doctors and nurses\nfor everyone.\n2 When I was eight years old, I broke my\narm when I fell off my bike. I had to go\nto the emergency department of my\nlocal hospital and although I had to wait\na few hours I received good care when I\nwas seen.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6823","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":2,"order":30,"module":"READING 2","ex":"10","context":{"moduleLabel":"READING 2","phaseTitle":"DISCUSSION"},"instruction":"What do you value about your country's healthcare system and what do you think could be improved? Write 100–150 words.","pages":[69],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9ef71f10653f0e77219ab6c690d5e2cb8b1f372488703daa86a4c4f3fdb8a296.png"],"provided":"","items":[{"id":"b6823.i01","label":"10","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U03-classroom:material:RW-M04","title":"READING 2","text":"# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare\n2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare\n3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system\n4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion\n5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","screens":["# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare","2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare","3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system","4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion","5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen."],"sources":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e797fce1322834e8e18cdd59a1a56d0affdea585735813190c661f953625568.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1375c8c098b28408dec7ddd601f4bd19a1f8bb7f24631ff93dc651fc00fbaef5.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"In my country the healthcare system is very\ngood. We have both public and private\nhospitals. Everyone can go to the public\nhospital and you don’t even need to make\nan appointment – you can just turn up, and\nyou take a number and wait for the doctor\nto see you. If you need an operation or\nsome special treatment, you may have to\nwait a couple of months but you don’t have\nto pay anything. If you have the money,\nyou can pay for private treatment and have\nthe operation very quickly. If you stay in a\nprivate hospital, you don’t need to share a\nroom with other patients – the rooms are\nvery nice and you have your own bathroom\nand good food. You are also allowed to\nhave a family member or friend stay in the\nroom with you.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c7351 provided":"","items":[],"layout":"list","references":[{"id":"B04-RW-U03-question:b6856","kind":"student-work","title":"WRITING TASK Ex 1","pages":[77]}],"materials":[],"coursePages":[[{"kind":"text","text":"Paragraph 1: Introduce the topic / your opinion / thesis statement (about 50–100 words)"},{"kind":"text","text":"Paragraph 2: Why is it the responsibility of the individual? (about 100 words)"},{"kind":"text","text":"Paragraph 3: Why is it the responsibility of the government? (about 100 words)"},{"kind":"text","text":"Paragraph 4: summary & re-instate your own opinion (about 50–100 words)"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Introduction\n• Debate on who is responsible for\ndisease prevention: individuals or\nthe government.\n• Thesis: preventing disease is a shared\nresponsibility between individuals and\nthe government.\nResponsibility of the individual\n• Individuals should maintain a healthy\nlifestyle: balanced diet, regular\nexercise, avoiding bad habits, good\nhygiene practices.\n•  Argument for individual responsibility:\npeople can best care for themselves and\nreduce the spread of diseases.\nRole of the government\n• Government has resources and power\nto protect public health: vaccination\nprograms, laws and regulations ensuring\nsafe food and water, public health\neducation to promote\ndisease prevention.\n• Argument for government responsibility:\nthe government can reach more people\nand have a larger societal impact.\nConclusion\n• Disease prevention is most effective\nwhen both individuals and the\ngovernment share the responsibility. It\nrequires cooperation between both.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers. s":[{"page":78,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b88cf40d6f0c9ae0758e72e602120438ce7b2b2a291e7015e5b134b9a00430a9.png"}],"kind":"task_checklist","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[{"page":77,"original":"Write 350/400 words.","text":"原字面都保留，教学词数范围回指第71页明示的350–400。"}],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U03-question:b6860","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":2,"order":46,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay using the outline.","pages":[78],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b88cf40d6f0c9ae0758e72e602120438ce7b2b2a291e7015e5b134b9a00430a9.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-RW-U03-question:b6857","kind":"student-work","title":"WRITING TASK Ex 2","pages":[77]}],"materials":[],"coursePages":[[{"kind":"text","text":"Write 350–400 words."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Some people believe that preventing\ndisease is the responsibility of the\nindividual. On the other hand, some claim\nthat this is a role for government. While\nthere are good arguments on both sides of\nthis debate, I think that preventing diseases\nis a shared responsibility.\nIt is true that each person should take\ncare of their own health by living a healthy\nlifestyle. This includes eating a balanced\ndiet, exercising regularly, and avoiding\nbad habits. People should also have good\nhygiene, such as washing their hands\nregularly. By doing this, people can reduce\ntheir chances of getting sick and spreading\ndiseases to others. Supporters of this view\nargue that everyone should be responsible\nfor their own health because no one can\ntake better care of themselves than\nthey can.\nOthers claim that the government has more\npower and resources to protect public\nhealth. For example, the government can\nrun vaccination programs to prevent the\nspread of diseases. The government can\nalso make laws and regulations to ensure\nthat food and water are safe. Additionally,\nthe government can provide public health\neducation to teach people how to protect\nthemselves from diseases. People who\nhold this view think that the government\nshould take the lead because it can reach\nmore people and have a bigger impact on\nsociety as a whole.\nIn my opinion, disease prevention should\nbe a shared responsibility between\nindividuals and the government. Individuals\nshould do their best to take care of their\nhealth, but they need support from the\ngovernment. The government should\nprovide the necessary resources, such as\nvaccines and health education, to help\npeople stay healthy. At the same time,\npeople should use these resources and\nfollow the advice of health experts. When\nboth the government and individuals work\ntogether, they can prevent the spread of\ndiseases and create a healthier society.\nUNIT 4\nUNLOCK YOUR\nKNOWLEDGE\npage 81\n1 Yes, recently there were wildfires in my\narea. Some people I know had to leave\ntheir homes. It took three days for the\nfires to go out.\n2 I think climate change and rising\ntemperatures are causing natural\ndisasters to happen more regularly.\n3 I think we can do a great deal to help\nthe environment. People can make\nsure that they do not waste precious\nresources such as food, water and\nelectricity. I always make sure that\nI recycle as much as possible and I\nwould like to plant more trees in\nmy community.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca10
