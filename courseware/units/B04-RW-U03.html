ce:b6786","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[60],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b4013f33c091af3051bbf607a1f086e9539213d166551477a8765e63c93c9c05.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"state of mind","pos":"(n)","definition":"how you are feeling at a particular time","example":"A quiet walk helped her return to a calmer state of mind.","wordAudio":"state of mind","cardWord":false},{"term":"physiotherapy","pos":"(n)","definition":"the treatment of problems of the muscles, joints, or nerves","example":"He started physiotherapy after injuring his shoulder.","wordAudio":"physiotherapy","cardWord":false},{"term":"rehabilitation","pos":"(n)","definition":"to help someone live a normal life again after they have had a serious illness","example":"Rehabilitation helped her return to everyday life after the operation.","wordAudio":"rehabilitation","cardWord":false},{"term":"mobility","pos":"(n)","definition":"the ability to move freely or be easily moved","example":"The new lift will improve mobility for residents who use wheelchairs.","wordAudio":"mobility","cardWord":false},{"term":"tumour","pos":"(n)","definition":"a mass of diseased cells that might become a lump or cause illness","example":"The doctors found a tumour during the scan.","wordAudio":"tumour","cardWord":false}]]}},{"id":"B04-RW-U03-classroom:video","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[60],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b4013f33c091af3051bbf607a1f086e9539213d166551477a8765e63c93c9c05.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c4ff895ff03248e7139c3b8e-L4RW-U03.mp4","captions":[{"start":0,"end":3.88,"text":"Barcelona is a beautiful city to cycle through,"},{"start":4.36,"end":6.54,"text":"and here at the Hospital del Mar,"},{"start":7.08,"end":11.52,"text":"they remind their patients in the intensive care unit\nof that each day."},{"start":12.14,"end":19.98,"text":"These doctors hope that virtual reality will make using\nphysiotherapy bicycles in bed more bearable for\npatients."},{"start":20.92,"end":28.92,"text":"Our hypothesis is that using cycling will generate more\nbenefits to our musculoskeletal system in terms of\nfunctional physiotherapy."},{"start":28.92,"end":40.52,"text":"However, adding the VR headset increases well -being\nand makes this physical therapy, which can be tough and\ncomplex for patients in intensive care units, more\ncomfortable and pleasant."},{"start":41.02,"end":45.4,"text":"With 15 minutes a day cycling through the virtual\nstreets of Barcelona,"},{"start":45.96,"end":51.2,"text":"their patients may be able to restart their lives\noutside the ICU sooner."},{"start":51.94,"end":57.14,"text":"They're not the only medical team to recognize the\nvalue of escaping from reality."},{"start":58.92,"end":61.48,"text":"12 -year -old Noel has a rare condition,"},{"start":61.8,"end":65.7,"text":"which means frequent surgery and physiotherapy to help\nhim walk."},{"start":66.78,"end":70.46000000000001,"text":"Now researchers are using VR to help with that."},{"start":70.72,"end":72.88,"text":"Our biggest concern was how do we make walking fun?"},{"start":73.9,"end":75.3,"text":"So just keep walking down the road."},{"start":75.74,"end":79.16,"text":"Once you see those monsters, just try to aim at them."},{"start":79.76,"end":80.6,"text":"These days,"},{"start":80.98,"end":86.5,"text":"Noel is killing monsters and escaping giant spiders\nwhile working on his mobility."},{"start":87.18,"end":93.92,"text":"I don't realize how far I'm walking because I'm so\nconcentrated on the game with my score."},{"start":94.62,"end":97.52000000000001,"text":"He now looks forward to his physiotherapy sessions."},{"start":98.52000000000001,"end":104.56,"text":"A different use of VR experiences is helping patients\nunderstand the source of their pain."},{"start":105.46000000000001,"end":110.1,"text":"Matt Flanagan was one of the first chiropractors to use\nthis method in the UK."},{"start":110.7,"end":115.8,"text":"He uses scans of his patients' spines to create a\nvirtual tour for them."},{"start":116.66,"end":122.06,"text":"There are lots of limitations with the old methods of\ncommunication and education."},{"start":124.46,"end":127.98,"text":"Patients are not used to looking at anatomical models."},{"start":128.74,"end":133.86,"text":"And so often one of the things is patients find it\ndifficult to know which is the front, which is the\nback."},{"start":133.9,"end":139.76,"text":"It's almost surreal because you're in another world\nwhere you're looking at your pulse, you're looking at\nyourself."},{"start":139.76,"end":146.46,"text":"It does motivate me to do the exercise because I can\nsee the relevance of how it would help me get better."},{"start":147.3,"end":156.04,"text":"A similar VR application for cancer doctors has\nresulted from a collaboration between experts in the\nfields of cancer medicine,"},{"start":156.5,"end":157.12,"text":"video gaming,"},{"start":157.62,"end":158.38,"text":"and astronomy."},{"start":159.24,"end":164.18,"text":"They can use it to investigate an individual patient's\ntumor from the inside."},{"start":164.18,"end":169.07999999999998,"text":"It's so much easier to notice differences,"},{"start":169.46,"end":170.72,"text":"to notice features,"},{"start":171.04,"end":177.18,"text":"to notice peculiarities when you're actually in a thing\nthan when you're looking at it through a spreadsheet or\na photograph."},{"start":177.38,"end":184.22,"text":"You can see how a certain type of cell might be beside\na blood vessel or a milk duct."},{"start":184.56,"end":188.46,"text":"That might be important for the future prognosis of\nthat patient."},{"start":192.74,"end":203.62,"text":"The team have shown that understanding the organization\nof cells in a tumor can help predict how a patient's\ncondition might progress and respond to treatment."},{"start":204.56,"end":209.4,"text":"Virtual reality headsets are becoming a more common\nsight in clinical settings."},{"start":210.44,"end":215.26,"text":"No doubt more creative applications of this technology are\non the way."}],"launchInline":true}},{"id":"B04-RW-U03-classroom:material:RW-M03","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b0a8199d443f804c83b5f4452f14e6521caa6a5faec780166c583aee0fc2ea9d.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)","sourcePage":64},{"body":"2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?","sourcePage":64},{"body":"3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)","sourcePage":64},{"body":"4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.","sourcePage":64},{"body":"5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","sourcePage":64}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U03-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"The homeopathy debate","pages":[{"page":64,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b0a8199d443f804c83b5f4452f14e6521caa6a5faec780166c583aee0fc2ea9d.png","width":3040,"height":4096}],"source":64,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)","sourcePage":64},{"body":"2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?","sourcePage":64},{"body":"3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)","sourcePage":64},{"body":"4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.","sourcePage":64},{"body":"5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","sourcePage":64}],"text":"# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)\n2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?\n3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)\n4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.\n5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d13567569b6d2740c4746343411ce4f058307e667362e8635c991ca2ea6e8fd3.mp3"},"original":{"id":"B04-RW-U03-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U03","book":4,"track":"RW","unit":3,"title":"READING 1","kind":"material","pages":[64],"sourceImages":[{"page":64,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b0a8199d443f804c83b5f4452f14e6521caa6a5faec780166c583aee0fc2ea9d.png","viewEvidenceReported":true}],"text":"# The homeopathy debate\n\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which may cause the symptoms of a disease in healthy people. The idea is that they will cure similar symptoms in sick people. Supporters of homeopathy believe that it can be effective. Others argue, however, that homeopathy does not work and agree that the state should not fund it. Here, one proponent and one critic present their cases.\n\n## Homeopathy should be state funded by Abigail Hayes (Professional Homeopath)\n\n2 The British National Health Service was founded to provide free healthcare to people who needed it. Since it was founded in 1948, patients have been able to get homeopathic treatment, and there's no good reason why this shouldn't continue. Most importantly, it's estimated that homeopathic treatments only cost the NHS around 4 million pounds a year. This is a fraction of the cost paid out to conventional drug companies. Many doctors regularly recommend homeopathic treatments, since they are cheap and popular. Therefore, I find it difficult to understand why the government is considering cutting funding for them. Why shouldn't people be allowed to make their own health choices? They have this freedom in other aspects of their lives – for example, which school to send their children to – so why not in terms of their healthcare?\n\n3 As for the critics who argue that homeopathy doesn't work, I could give hundreds of examples of patients who have been cured by my treatment. On top of that, there's plenty of research which shows the benefits it can bring. Homeopathy wouldn't have survived so long if it were complete nonsense. It has much more than just a placebo effect². Too much emphasis is sometimes put on providing 'proof' of why something works. Belief is just as powerful.\n\n## Homeopathy should not be state funded by Dr Piers Wehner (NHS General Practitioner)\n\n4 We don't really know whether homeopathy helps people feel better because of the remedies themselves or because people believe they will work. Some people just feel better when they get personal care and attention from their homeopathic practitioner. For me and many others in my profession, there is absolutely no proof that says homeopathic treatment works. The government's chief scientist confirmed this when he said there was 'no real evidence' to support homeopathy. We live in difficult economic times, and every penny the government spends should be checked to ensure that it is not wasted. In fact, 75% of British doctors are against the state funding of homeopathy.\n\n5 One of the main arguments put forward by supporters of homeopathy is that this therapy doesn't cause any damage. However, people may think they are treating their illness by taking homeopathic remedies when there is actually no scientific evidence that this is true. Even more seriously, patients who rely on homeopathy alone for treating life-threatening illnesses like cancer could be taking a big risk. The cancer might no longer be treatable by proven methods if the patient has waited too long trying homeopathy. This can cost lives.\n\n¹ diluted (adj) made weaker by mixing with something else, such as water ² placebo effect (n) an improvement in a patient's condition caused only by his or her belief in the benefit of the treatment","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6801"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d13567569b6d2740c4746343411ce4f058307e667362e8635c991ca2ea6e8fd3.mp3","continueOnPage":true}},{"id":"B04-RW-U03-classroom:material:RW-M04","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[67],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e797fce1322834e8e18cdd59a1a56d0affdea585735813190c661f953625568.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare","sourcePage":67},{"body":"2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare","sourcePage":67},{"body":"3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system","sourcePage":67},{"body":"4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion","sourcePage":67},{"body":"5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","sourcePage":67}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U03-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"SHOULD HEALTHCARE BE FREE?","pages":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e797fce1322834e8e18cdd59a1a56d0affdea585735813190c661f953625568.png","width":3040,"height":4096}],"source":67,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare","sourcePage":67},{"body":"2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare","sourcePage":67},{"body":"3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system","sourcePage":67},{"body":"4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion","sourcePage":67},{"body":"5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","sourcePage":67}],"text":"# SHOULD HEALTHCARE BE FREE?\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\nree public healthcare\n2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\nrivate healthcare\n3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system\n4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion\n5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1375c8c098b28408dec7ddd601f4bd19a1f8bb7f24631ff93dc651fc00fbaef5.mp3"},"original":{"id":"B04-RW-U03-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U03","book":4,"track":"RW","unit":3,"title":"READING 2","kind":"material","pages":[67],"sourceImages":[{"page":67,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e797fce1322834e8e18cdd59a1a56d0affdea585735813190c661f953625568.png","viewEvidenceReported":true}],"text":"# SHOULD HEALTHCARE BE FREE?\n\n1 Who pays for healthcare? The answer varies from country to country. While in some nations it is completely free for all residents, in others people often receive their health insurance through their employer. There are also places where you can only see a doctor if you pay. Often, a patient is faced with the choice of medium-quality but cheap care versus high-quality but expensive care. Unfortunately, providing healthcare to an entire nation of citizens is a complicated matter. While different healthcare systems have various advantages and disadvantages, no system is ideal.\n\nree public healthcare\n\n2 Within the countries which provide free public healthcare, there are many models. In some countries, consultations, treatment and medicines are free to all citizens. This may be paid for directly by the government, perhaps funded by the country's valuable natural resources that the government owns. Other countries collect money from citizens through taxes based on their income. Workers pay according to how much they earn, and employers also make a contribution. Hospitals and other medical services are then provided and run by the government. There may also be some private medical services which people can choose to buy. The advantage of systems such as these is clear: free basic healthcare for all, regardless of income. However, it is a very expensive system and, as life expectancy and costs rise, many countries are facing either an unsustainable financial burden, or a drop in the quality of services and facilities provided.\n\nrivate healthcare\n\n3 In countries where citizens use private providers, healthcare is only available to patients who pay for it, and healthcare providers are commercial companies. In wealthier countries, most citizens take out health insurance to cover their potential medical costs. However, not everyone can afford this, and some governments have a scheme which gives financial assistance to those who need urgent medical care but are unable to afford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\n\nmixed system\n\n4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems, private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\n\nonclusion\n\n5 Most of us will likely agree that no healthcare system is perfect. Several countries are now considering a combination of the models for their national health systems. The challenge is to find a system which provides a high-quality level of healthcare to all citizens, but which is also affordable and practical. Whether or not such a system can work remains to be seen.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6813"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1375c8c098b28408dec7ddd601f4bd19a1f8bb7f24631ff93dc651fc00fbaef5.mp3","continueOnPage":true}},{"id":"B04-RW-U03-classroom:review-1","book":4,"unit":3,"track":"RW","topic":"MEDICINE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[79],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6e504ddd7a8c20880e3464da0a219e0109c7022fc092e8c9b075d41b8556ddcb.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B04-RW-U03-B-001","form":"adequate","page":79},{"id":"B04-RW-U03-B-002","form":"adverse","page":79},{"id":"B04-RW-U03-B-004","form":"chief","page":79},{"id":"B04-RW-U03-B-005","form":"complex","page":79},{"id":"B04-RW-U03-B-008","form":"controversial","page":79},{"id":"B04-RW-U03-B-009","form":"conventional","page":79},{"id":"B04-RW-U03-B-010","form":"diabetes","page":79},{"id":"B04-RW-U03-B-011","form":"drug","page":79},{"id":"B04-RW-U03-B-012","form":"epidemic","page":79},{"id":"B04-RW-U03-B-013","form":"fund","page":79},{"id":"B04-RW-U03-B-014","form":"illegal","page":79},{"id":"B04-RW-U03-B-016","form":"medical","page":79},{"id":"B04-RW-U03-B-017","form":"mobility","page":79},{"id":"B04-RW-U03-B-018","form":"obesity","page":79},{"id":"B04-RW-U03-B-019","form":"patent","page":79},{"id":"B04-RW-U03-B-020","form":"pharmaceutical","page":79}],[{"id":"B04-RW-U03-B-021","form":"physical","page":79},{"id":"B ke football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U03-classroom:material:RW-M03":[{"body":"# The homeopathy debate\nMost national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which","sourcePage":64,"blocks":[{"kind":"text","text":"# The homeopathy debate"},{"kind":"text","text":"Most national health systems use conventional medicine, meaning that illnesses are treated using drugs and surgery. However, there is also a range of alternative medical treatments to choose from. One controversial treatment is homeopathy. Homeopathic remedies are highly diluted¹ mixtures of natural substances, such as plants and minerals, which"}]},{"body":"may cause the symptoms of a disease in healthy people. The fford it. In other nations, there is no such safety net, and those who cannot pay simply do not get the healthcare they need, unless they can get financial help. The disadvantages of this system are obvious: not only are individuals deprived of the medical attention they"}]},{"body":"need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones.\nmixed system","sourcePage":67,"blocks":[{"kind":"text","text":"need, but also the lack of preventative medicine means that infectious diseases can quickly spread. One advantage, however, is that commercial organizations can sometimes provide higher-quality care than struggling government-funded ones."},{"kind":"text","text":"mixed system"}]},{"body":"4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems,","sourcePage":67,"blocks":[{"kind":"text","text":"4 In many countries, there is a mix of public and private funding. This system requires all its citizens to take out health insurance. This is deducted from salaries by the employer, who also has to make a contribution for each worker. Citizens are able to choose their healthcare providers, which may be public or private. However, in some systems,"}]},{"body":"private companies are not permitted to make a profit from providing basic healthcare. This model provides more flexibility than either the public or private models, and ensures access to healthcare for all. However, it has been criticized for driving up the cost of labour, which can lead to unemployment.\nonclusion","sourcePage":67,"blocks":[{"kind":"text", ology can also be ⁷ ____ very relaxing experience and helps many people with feelings of stress and anxiety.","answer":{"mode":"blanks","values":["The","the","the","the","∅","a"]}}]}],"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-RW-U03":{"aspect":1.7777778,"cues":[[0,3.88,"Barcelona is a beautiful city to cycle through,","巴塞罗那是一个美丽的城市循环通过，"],[4.36,6.54,"and here at the Hospital del Mar,","在德尔马医院，"],[7.08,11.52,"they remind their patients in the intensive care unit of that each day.","他们每天提醒重症监护室的病人注意这一点。"],[12.14,19.98,"These doctors hope that virtual reality will make using physiotherapy bicycles in bed more bearable for patients.","这些医生希望虚拟现实能使床上使用物理疗法自行车对患者更加耐用。"],[20.92,28.92,"Our hypothesis is that using cycling will generate more benefits to our musculoskeletal system in terms of functional physiotherapy.","我们的假设是，使用循环会给我们的肌肉骨骼系统带来更多的好处，在功能物理疗法方面。"],[28.92,40.52,"However, adding the VR headset increases well -being and makes this physical therapy, which can be tough and complex for patients in intensive care units, more comfortable and pleasant.","然而，加入 \" VR耳机 \" 将增加福利，使这种物理治疗更加舒适和舒适，对重症监护单位的病人来说，这种治疗可能既困难又复杂。"],[41.02,45.4,"With 15 minutes a day cycling through the virtual streets of Barcelona,","每天骑着15分钟穿过巴塞罗纳的虚拟街道"],[45.96,51.2,"their patients may be able to restart their lives outside the ICU sooner.","他们的病人也许能够更早地在伊斯兰法院联盟之外重新开始生活。"],[51.94,57.14,"They're not the only medical team to recognize the value of escaping from reality.","他们并不是唯一认识到逃离现实价值的医疗队。"],[58.92,61.48,"12 -year -old Noel has a rare condition,","12 - 年 - 诺埃尔有罕见的病情，"],[61.8,65.7,"which means frequent surgery and physiotherapy to help him walk.","这意味着频繁的手术和理疗来帮助他行走。"],[66.78,70.46000000000001,"Now researchers are using VR to help with that.","现在研究者正在使用VR来帮助。"],[70.72,72.88,"Our biggest concern was how do we make walking fun?","我们最关心的是我们如何让步行变得有趣？"],[73.9,75.3,"So just keep walking down the road.","继续走下去"],[75.74,79.16,"Once you see those monsters, just try to aim at them.","一旦你看到那些怪物，就试着瞄准它们。"],[79.76,80.6,"These days,","这些天"],[80.98,86.5,"Noel is killing monsters and escaping giant spiders while working on his mobility.","诺埃尔在研究机动性的同时，正在杀死怪物并逃离巨型蜘蛛。"],[87.18,93.92,"I don't realize how far I'm walking because I'm so concentrated on the game with my score.","我不知道我走多远因为我这么专注于比赛与我的分数。"],[94.62,97.52000000000001,"He now looks forward to his physiotherapy sessions.","他现在期待着他的物理治疗课程。"],[98.52000000000001,104.56,"A different use of VR experiences is helping patients understand the source of their pain.","对VR经历的一种不同用途是帮助患者理解其痛苦的来源。"],[105.46000000000001,110.1,"Matt Flanagan was one of the first chiropractors to use this method in the UK.","马特·弗拉纳根(Matt Flanagan)是英国最早使用这种方法的脊椎动物之一。"],[110.7,115.8,"He uses scans of his patients' spines to create a virtual tour for them.","他使用他的病人的脊椎扫描来为他们创造虚拟的巡演。"],[116.66,122.06,"There are lots of limitations with the old methods of communication and education.","旧的交流和教育方法有许多限制。"],[124.46,127.98,"Patients are not used to looking at anatomical models.","患者不习惯于看解剖模型。"],[128.74,133.86,"And so often one of the things is patients find it difficult to know which is the front, which is the back.","经常有一种情况是，病人很难知道哪个是前卫，哪个是后卫。"],[133.9,139.76,"It's almost surreal because you're in another world where you're looking at your pulse, you're looking at yourself.","这几乎是超现实的，因为你处在另一个世界，你看着你的脉搏，你看着自己。"],[139.76,146.46,"It does motivate me to do the exercise because I can see the relevance of how it would help me get better.","这确实促使我做这项工作，因为我可以看到它如何帮助我改善情况的相关性。"],[147.3,156.04,"A similar VR application for cancer doctors has resulted from a collaboration between experts in the fields of cancer medicine,","癌症医学领域的专家合作，为癌症医生提出了类似的VR申请。"],[156.5,157.12,"video gaming,","视频游戏，"],[157.62,158.38,"and astronomy.","和天文学。"],[159.24,164.18,"They can use it to investigate an individual patient's tumor from the inside.","他们可以利用它从内侧调查个体患者的肿瘤。"],[164.18,169.07999999999998,"It's so much easier to notice differences,","很容易发现差异"],[169.46,170.72,"to notice features,","发现特征，"],[171.04,177.18,"to notice peculiarities when you're actually in a thing than when you're looking at it through a spreadsheet or a photograph.","当你真正处于某种状态时就会注意到一些特殊之处而不是你通过电子表格或照片来看待它时"],[177.38,184.22,"You can see how a certain type of cell might be beside a blood vessel or a milk duct.","你可以看到某种类型的细胞可能就在血管或牛奶管道旁边。"],[184.56,188.46,"That might be important for the future prognosis of that patient.","这对病人的未来预测可能很重要。"],[192.74,203.62,"The team have shown that understanding the organization of cells in a tumor can help predict how a patient's condition might progress and respond to treatment.","团队已经表明，了解肿瘤中的细胞组织，可以帮助预测患者的病情会如何发展并响应治疗。"],[204.56,209.4,"Virtual reality headsets are becoming a more common sight in clinical settings.","虚拟现实耳机在临床环境下正变得更为常见。"],[210.44,215.26,"No doubt more creative applications of this technology are on the way.","毫无疑问，这一技术的更具创造性的应用正在路上。"]],"englishRows":3,"chineseRows":2}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02 "use strict";

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+

function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};

 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};

 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));

function taskTable(table,feedback){

  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");

 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function exerciseVisible(c){

function neighbor(amount){

function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
