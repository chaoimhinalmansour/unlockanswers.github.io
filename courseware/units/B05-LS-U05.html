CH"},"instruction":"You are going to watch a video about scientific research into dementia. Before you watch, look at the photos from the video. Discuss the questions with your partner.","pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b3922c57966d7fd313d943279cd0f502599d979c1032e5194a32e142c916790.png"],"provided":"","items":[{"id":"b7773.i01","label":"1","prompt":"What technologies are the scientists using to research dementia?","options":[],"type":"discuss/open"},{"id":"b7773.i02","label":"2","prompt":"What mental abilities might the researchers be interested in?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7773.i01","label":"1","prompt":"What technologies are the scientists using to research dementia?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7773.i02","label":"2","prompt":"What mental abilities might the researchers be interested in?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It looks like this might be something\nconnected to games or virtual reality.\n2 I know that dementia makes you\nforget things, so they are probably\nresearching memory.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":44,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[{"page":104,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b3922c57966d7fd313d943279cd0f502599d979c1032e5194a32e142c916790.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7776","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Which statement best summarizes the main idea?","pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b3922c57966d7fd313d943279cd0f502599d979c1032e5194a32e142c916790.png"],"provided":"","items":[{"id":"b7776.i01","label":"1","prompt":"Which statement best summarizes the main idea?","options":["A new game, Sea Hero Quest, is being launched to help scientists diagnose dementia in young people via their mobile phones.","The game Sea Hero Quest, which has helped dementia researchers learn about how people navigate, will now be available for virtual reality headsets."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7776.i01","label":"1","prompt":"Which statement best summarizes the main idea?","options":["A new game, Sea Hero Quest, is being launched to help scientists diagnose dementia in young people via their mobile phones.","The game Sea Hero Quest, which has helped dementia researchers learn about how people navigate, will now be available for virtual reality headsets."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/67bbb73f72df485b91cf7acb-L5LS-U05.mp4","captions":[{"start":14.54,"end":22.72,"text":"Sea Hero Quest is the world's first virtual reality\ngame designed to help researchers understand dementia."},{"start":23.58,"end":31.52,"text":"While players are immersed in a mission at sea, the\ngame collects information on their ability to navigate\nthrough simple mazes."},{"start":32.52,"end":35.3,"text":"In many forms of dementia, particularly Alzheimer's\ndisease,"},{"start":36.14,"end":40.16,"text":"your spatial awareness, your ability to navigate is one\nof the first things that goes."},{"start":40.52,"end":48.62,"text":"And that's, we know, is because that's where some of\nthe earliest damage occurs in your brain, the bit of\nyour brain that does your spatial navigation."},{"start":48.98,"end":62.48,"text":"So it links to what we're seeing at the kind of cell\nlevel of your brain cell struggling and then dying, and\nthen what's happening at the functional level, it\nimpacts your real ability to find the right aisle in\nthe shopping and the supermarket or something."},{"start":63.2,"end":68,"text":"Over 55 million people in the world today are living\nwith dementia,"},{"start":68.7,"end":72.38,"text":"a figure expected to almost triple by 2050."},{"start":73.22,"end":76.64,"text":"It is most common in over 65s."},{"start":76.76,"end":77.34,"text":"However,"},{"start":77.84,"end":81.74,"text":"scientists believe it begins to develop when people are\nmuch younger."},{"start":82.58,"end":88.48,"text":"Dementia causes sufferers to slowly lose certain mental\nabilities and there is"},{"start":88.48,"end":88.8,"text":"no"},{"start":88.8,"end":89.53999999999999,"text":"known cure,"},{"start":90.08,"end":93.03999999999999,"text":"but early diagnosis can slow its progress."},{"start":94.14,"end":97.92,"text":"Improved early diagnosis techniques are urgently\nneeded."},{"start":99.12,"end":100.88,"text":"To collect essential data,"},{"start":101.3,"end":108.03999999999999,"text":"Alzheimer's Research UK teamed up with scientists and\nDeutsche Telekom to develop Sea Hero Quest."},{"start":108.68,"end":112.92,"text":"The game was first rolled out on mobile devices in\n2016."},{"start":113.78,"end":117.32,"text":"Over three million people around the world played the\ngame,"},{"start":117.72,"end":121.76,"text":"giving scientists a huge amount of data about how\npeople navigate."},{"start":123.08,"end":124.72,"text":"Until we got Sea Hero Quest,"},{"start":125.16,"end":130.1,"text":"the largest study looking at spatial navigation, so how\nyou navigate around a complex environment,"},{"start":130.62,"end":131.9,"text":"was about 600 people."},{"start":132,"end":135.96,"text":"We've now got three million, so that's orders of\nmagnitude more information."},{"start":135.96,"end":140.64,"text":"With that information we can understand much better\nwhat normal looks like."},{"start":140.94,"end":144.22,"text":"Because until you know what normal healthy people, how\nwell they perform,"},{"start":144.56,"end":147.5,"text":"it's difficult to tell when somebody starts to have\nproblems,"},{"start":147.86,"end":154.28,"text":"particularly in the early stages where those problems\nthey've got are perhaps very small and subtle compared\nto a healthy individual."},{"start":155.16,"end":172.16,"text":"And maybe for the topic of dementia, the most relevant\ndiscovery in this large data set is that qualitative\nchange in how well people perform the navigation tasks\nin this game starts much earlier than what you would\nexpect."},{"start":172.8,"end":181.64,"text":"Traditional laboratory -based research normally focuses\non observations that people at my age start to slowly\ndecline and then it goes down."},{"start":182.12,"end":192.14,"text":"But what we can actually pinpoint in this large data\nset is that from the age of about 19 onwards there are\nmeasurable differences that you wouldn't just obtain in\na traditional laboratory study."},{"start":192.3,"end":195.9,"text":"With the launch of the free virtual reality version of\nthe game,"},{"start":196.56,"end":199.7,"text":"researchers hope to discover even more about dementia."},{"start":200.38,"end":211.22,"text":"What the virtual reality game really adds is much more\nfine -grained detail because people are immersed in the\nworld that they're navigating around, just as we are in\nthe real world."},{"start":211.54,"end":217.94,"text":"And that will give us a lot more insight, I think, than\nplaying it on a mobile phone using your thumbs to\nnavigate about."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":44,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7778","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Complete the student notes with one to three words in each gap.","pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/add710b8a6b7e73c7b30610f6c06e8a675246249198d84137064a10d5ad919b0.png"],"provided":"Sea Hero Quest\nWorld's first (1) ____ for dementia research\nCollects data on navigation (2) ____\n\nDementia and navigation\nIn dementia, (3) ____ = first ability to be damaged\nCell level = brain cells are (4) ____\n(5) ____ level = impacts real world ability\n\nDementia research\n47 million dementia sufferers - expected to (6) ____ by 2050\nNo (7) ____ but early diagnosis can help\nSea Hero Quest first launched on (8) ____\nHelped list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Would you like to take part in the Sea Hero Quest study?"},{"kind":"text","text":"2 In what ways are the Sea Hero Quest studies innovative?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I’d like to take part because I think\nit would interesting and it contributes\nto research which can help with early\ndetection of dementia. / No, I wouldn’t\nlike to. I don’t like the idea of being part\nof a scientific test.\n2 Sea Hero Quest is innovative because it\ncombines mobile gaming with scientific\nresearch, allowing researchers to collect\nlarge-scale data on spatial navigation\nskills quickly and effectively.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7785","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":8,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a group of students discussing an assignment on the topic of first impressions. Before you listen, answer the questions then discuss your answers in small groups.","pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58144b855183004277be00a5f09176db38867ee0afd81128080ebddd3684cf8e.png"],"provided":"1 How important are the elements listed below when you meet somebody for the first time and form an initial impression of them? Grade each one from 1 (very important) to 3 (unimportant).\n____ eye contact ____ clean and tidy\n____ clothing appearance\n____ greeting ____ voice\n____ facial expression ____ handshake\n2 Which of the elements above helps you decide if the person is friendly, distant, confident, nervous, etc.? For example, could making eye contact with a person make you decide that they are trustworthy?\n3 Some people say that we should never judge people by their appearance. Why might they feel this, and to what extent do you agree?","items":[{"id":"b7785.i01","label":"1","prompt":"How important are the elements listed below when you meet somebody for the first time and form an initial impression of them? Grade each one from 1 (very important) to 3 (unimportant).","options":[],"type":"discuss/open"},{"id":"b7785.i02","label":"2","prompt":"Which of the elements above helps you decide if the person is friendly, distant, confident, nervous, etc.? For example, could making eye contact with a person make you decide that they are trustworthy?","options":[],"type":"discuss/open"},{"id":"b7785.i03","label":"3","prompt":"Some people say that we should never judge people by their appearance. Why might they feel this, and to what extent do you agree?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 How important are the elements listed below when you meet somebody for the first time and form an initial impression of them? Grade each one from 1 (very important) to 3 (unimportant)."},{"kind":"text","text":"____ eye contact ____ clean and tidy"},{"kind":"text","text":"____ clothing appearance"},{"kind":"text","text":"____ greeting ____ voice"},{"kind":"text","text":"____ facial expression ____ handshake"}],[{"kind":"text","text":"2 Which of the elements above helps you decide if the person is friendly, distant, confident, nervous, etc.? For example, could making eye contact with a person make you decide that they are trustworthy?"},{"kind":"text","text":"3 Some people say that we should never judge people by their appearance. Why might they feel this, and to what extent do you agree?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"eye contact 1\nclothing 3\ngreeting 1\nfacial expression 1\nclean and tidy 2\nappearance 2\nvoice 3\nhandshake 2\n2 Yes, the fact that a person makes eye\ncontact may create the impression that\nthey are trustworthy, although this may\nnot necessarily be true. A loud voice\nand strong handshake would probably\nmake a person seem confident. A\nfriendly person will usually smile when\nyou meet them and make lots of eye\ncontact. A nervous person would do\nthe opposite, they would avoid eye\ncontact, talk quietly and have negative\nbody language, such as hunching\ntheir shoulders.\n3 People may feel that judging people\non their appearance is discriminatory,\nand may unfairly penalize people who\nperhaps are not conventionally ‘good-\nlooking’. I agree that we should not\njudge people by their appearance, but\naccept that it is human nature to do so.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7786","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":9,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work in small groups. Discuss the questions.","pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58144b855183004277be00a5f09176db38867ee0afd81128080ebddd3684cf8e.png"],"provided":"1 When you meet people, what makes you decide if you like them, and how long does this usually take?\n2 What kind of behaviour do you think is most important in making a first impression? What actions are likely to make a positive first impression? A negative one?\n3 How strong do you think first impressions are? Do you often change your mind about somebody after you get to know the person better?","items":[{"id":"b7786.i01","label":"1","prompt":"When you meet people, what makes you decide if you like them, and how long does this usually take?","options":[],"type":"discuss/open"},{"id":"b7786.i02","label":"2","prompt":"What kind of behaviour do you think is most important in making a first impression? What actions are likely to make a positive first impression? A negative one?","options":[],"type":"discuss/open"},{"id":"b7786.i03","label":"3","prompt":"How strong do you think first impressions are? Do you often change your mind about somebody after you get to know the person better?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 When you meet people, what makes you decide if you like them, and how long does this usually take?"},{"kind":"text","text":"2 What kind of behaviour do you think is most important in making a first impression? What actions are likely to make a positive first impression? A negative one?"},{"kind":"text","text":"3 How strong do you think first impressions are? Do you often change your mind about somebody after you get to know the person better?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I’m usually pretty quick to decide\nwhether or not I like someone, and\nI base this on whether we have a\ncomfortable and enjoyable conversation\nwhen we first meet.\n2 People like to think the other person is\ninterested in them, and when a person\nshows interest, this is likely to create\na positive impression. Conversely,\nbehaviours that indicate a lack of\ninterest, such as looking at a phone\nduring a conversation may make a bad\nimpression on someone.\n3 I don’t think they’re particularly strong in\nmost cases, and people may forget the\ninitial impression they had of a person\nwhen speaking to them for the first time.\nAs for me personally, yes, I’d say I often\nchange my mind about a person.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issu "],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":0}},{"kind":"item","id":"b7795.i06","label":"6","prompt":"One scientist broke down facial expressions into 65 separate features.","options":["MI","D"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":1}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 MI 2 MI 3 D 4 D 5 MI 6 D","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7796","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":15,"module":"LISTENING 1","ex":"8","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Look at the computer-generated faces from the last study the students discussed. Which facial features (eyes, eyebrows, nose, smile, etc.) do you think were most important for the subjects' decisions about each of the traits?","pages":[109],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b69301a5ed10b787b16dd566ede49ff13af0878e28238152b9b37fd13c6a0fe.png"],"provided":"Faces on the left received low scores for the specified trait while faces on the right scored highly.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Faces on the left received low scores for the specified trait while faces on the right scored highly."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I don’t think that the nose is very\nimportant, either the size or the shape.\nI think eyebrows can be important in\nshowing some expressions, like anger.\nOverall, I think that smile is probably one\nof the most important things, especially\nfor approachability. The shape of the\nface seems to be quite important for","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7800","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":16,"module":"LISTENING 1","ex":"9","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"instruction":"5.3 Listen to the excerpts from the conversation and underline the emphasized word(s) in each thought group.","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/63da3726e5984c01cf8edc956dc3b9b342b493706fa303f21938ef56743c0d67.png"],"provided":"","items":[{"id":"b7800.i01","label":"","prompt":"Ramzi: Well, in a nutshell, / it's physical appearance / that's the most important cue / in first impressions ...","options":[],"type":"select/closed"},{"id":"b7800.i02","label":"Eva: It probably still is! / That's really interesting","prompt":"Ramzi: Basically / deciding quickly / if you could trust somebody / must have been a really important ability / during early human evolution. Eva: It probably still is! / That’s really interesting. / I read another study / on a similar topic / but it was a little more specific.","options":[],"type":"select/closed"},{"id":"b7800.i03","label":"3","prompt":"Sara: Some of the photos / were of really attractive people / and all the participants / pretty much agreed / they were fours. / But there were some photos / that only a few people found attractive.","options":[],"type":"select/closed"},{"id":"b7800.i04","label":"4","prompt":"Sara: Our first response / is to go for somebody who is generally attractive, / what they call / 'a good catch'.","options":[],"type":"select/closed"},{"id":"b7800.i05","label":"5","prompt":"Sara: But the different preferences / suggest we also make judgments / about who'd be 'a good catch for me'.","options":[],"type":"select/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7800.i01","label":"","prompt":"Ramzi: Well, in a nutshell, / it's physical appearance / that's the most important cue / in first impressions ...","options":[],"type":"select/closed"},{"kind":"item","id":"b7800.i02","label":"Eva: It probably still is! / That's really interesting","prompt":"Ramzi: Basically / deciding quickly / if you could trust somebody / must have been a really important ability / during early human evolution. Eva: It probably still is! / That’s really interesting. / I read another study / on a similar topic / but it was a little more specific.","options":[],"type":"select/closed"},{"kind":"item","id":"b7800.i03","label":"3","prompt":"Sara: Some of the photos / were of really attractive people / and all the participants / pretty much agreed / they were fours. / But there were some photos / that only a few people found attractive.","options":[],"type":"select/closed"}],[{"kind":"item","id":"b7800.i04","label":"4","prompt":"Sara: Our first response / is to go for somebody who is generally attractive, / what they call / 'a good catch'.","options":[],"type":"select/closed"},{"kind":"item","id":"b7800.i05","label":"5","prompt":"Sara: But the different preferences / suggest we also make judgments / about who'd be 'a good catch for me'.","options":[],"type":"select/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 5.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d5352c5c793c11b868122bbe41b4ab8839375c9eca7e3e0e0ec0e33cccfbfcaf.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  Eva: So, cues; Ramzi: nutshell, physical appearance,\nimportant cue, first impressions\n2  Ramzi: Basically, quickly, trust, most important, early;\nEva: probably, is, really, another, similar, specific\n3 Sara: photos, attractive, all, agreed, fours, some, few\n4 Sra: first, generally, call, good catch\n5 Sara: different, also, who, good catch, me","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7802","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":17,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/63da3726e5984c01cf8edc956dc3b9b342b493706fa303f21938ef56743c0d67.png"],"provided":"","items":[{"id":"b7802.i01","label":"1","prompt":"Why do you think some of the judgments of traits in relation to particular facial features were more consistent than others (e.g. trustworthiness)?","options":[],"type":"discuss/open"},{"id":"b7802.i02","label":"2","prompt":"The authors of one of the studies speculated that in the past, there might have been an evolutionary advantage to being able to make quick decisions about people. What advantage might it provide today?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7802.i01","label":"1","prompt":"Why do you think some of the judgments of traits in relation to particular facial features were more consistent than others (e.g. trustworthiness)?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7802.i02","label":"2","prompt":"The authors of one of the studies speculated that in the past, there might have been an evolutionary advantage to being able to make quick decisions about people. What advantage might it provide today?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Some judgments, like trustworthiness,\nmight be more consistent because\ncertain facial features (like a friendly\nexpression) tend to be universally\nassociated with positive traits.\n2 Today, the ability to make quick\njudgments could help people make\nfast decisions in situations where safety,\ntrust, or first impressions are important,\nlike in social or professional settings.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7805","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite each pair of sentences as one sentence. Change the question into a noun clause in the new sentence.","pages":[111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/02f82fcdc8aa2e1e6d1507e7435f423aa4b9fbcc949a5be24d21f0774f01f658.png"],"provided":"","items":[{"id":"b7805.i01","label":"1","prompt":"Why do we fall in love? Scientific research has not yet been able to establish this.","options":[],"type":"gap/open"},{"id":"b7805.i02","label":"2","prompt":"What do people react to when forming first impressions? It's difficult to say.","options":[],"type":"gap/open"},{"id":"b7805.i03","label":"3","prompt":"Might a particular person make a good life partner for you? Dating agencies are skilled at working that out.","options":[],"type":"gap/open"},{"id":"b7805.i04","label":"4","prompt":"What kind of personality do you have? Personality quizzes are an excellent way of identifying this.","options":[],"type":"gap/open"},{"id":"b7805.i05","label":"5","prompt":"In which season were you born? This affects your personality later in life.","options":[],"type":"gap/open"},{"id":"b7805.i06","label":"6","prompt":"How quickly do we form judgements about people? We're all different in terms of this.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7805.i01","label":"1","prompt":"Why do we fall in love? Scientific research has not yet been able to establish this.","options":[],"type":"gap/open"},{"kind":"item","id":"b7805.i02","label":"2","prompt":"What do people react to when forming first impressions? It's difficult to say.","options":[],"type":"gap/open"},{"kind":"item","id":"b7805.i03","label":"3","prompt":"Might a particular person make a good life partner for you? Dating agencies are skilled at working that out.","options":[],"type":"gap/open"},{"kind":"item","id":"b7805.i04","label":"4","prompt":"What kind of personality do you have? Personality quizzes are an excellent way of identifying this.","options":[],"type":"gap/open"},{"kind":"item","id":"b7805.i05","label":"5","prompt":"In which season were you born? This affects your personality later in life.","options":[],"type":"gap/open"},{"kind":"item","id":"b7805.i06","label":"6","prompt":"How quickly do we form judgements about people? We're all different in terms of this.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"2 It’s difficult to say what people react to when forming\nfirst impressions.\n3 Dating agencies are skilled at working out if/whether\na particular person might make a good life partner\nfor you.\n4 Personality quizzes are an excellent way of working out\nwhat kind of personality you have.\n5 The season in which you were born affects your\npersonality later in life.\n6 We’re all different in terms of how quickly we form\njudgements about people.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7806","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Discuss whether you agree with the statements in Exercise 1. Give reasons why / why not.","pages":[111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/02f82fcdc8aa2e1e6d1507e7435f423aa4b9fbcc949a5be24d21f0774f01f658.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U05-question:b7805","kind":"material-reference","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[111]}],"materials":[],"coursePages":[[{"kind":"text","text":"Why do we fall in love? Scientific research has not yet been able to establish this."},{"kind":"text","text":"What do people react to when forming first impressions? It's difficult to say."},{"kind":"text","text":"Might a particular person make a good life partner for you? Dating agencies are skilled at working that out."},{"kind":"text","text":"What kind of personality do you have? Personality quizzes are an excellent way of identifying this."},{"kind":"text","text":"In which season were you born? This affects your personality later in life."},{"kind":"text","text":"How quickly do we form judgements about people? We're all different in terms of this."}]],"courseMaterials":[{"id":"B05-LS-U05-publisher-sheet:b7805","title":"LANGUAGE DEVELOPMENT Ex 1 原题面","pages":[111],"text":"","screens":[],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/02f82fcdc8aa2e1e6d1507e7435f423aa4b9fbcc949a5be24d21f0774f01f658.png"}],"kind":"task_sheet","sourceBlockIds":["b7805"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I agree with statements 2 and 6, based\nmy own experience, but to be honest, the\nothers sound rather unscientific. Quizzes\nabout your personality are fun to do, and\nperhaps we enjoy the idea of getting a\ncomment about us based on our answers,\nbut I don’t think we can read much into\nthem. And I don’t believe that when a\nperson is born has much impact their\npersonality, as there are so many other\nfactors, such as upbringing and genetics,\nwhich are scientifically proven to be\ninfluential in shaping our personalities.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7807","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Write three sentences about first impressions using wh- noun clauses.","pages":[111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/02f82fcdc8aa2e1e6d1507e7435f423aa4b9fbcc949a5be24d21f0774f01f658.png"],"provided":"Example: When I meet people for the first time, I try to find out what topics we are both interested in.","items":[{"id":"b7807.i01","label":"1","prompt":"First sentence about first impressions using a wh- noun clause:","options":[],"type":"gap/open"},{"id":"b7807.i02","label":"2","prompt":"Second sentence about first impressions using a wh- noun clause:","options":[],"type":"gap/open"},{"id":"b7807.i03","label":"3","prompt":"Third sentence about first impressions using a wh- noun clause:","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Example: When I meet people for the first time, I try to find out what topics we are both interested in."},{"kind":"item","id":"b7807.i01","label":"1","prompt":"First sentence about first impressions using a wh- noun clause:","options":[],"type":"gap/open"},{"kind":"item","id":"b7807.i02","label":"2","prompt":"Second sentence about first impressions using a wh- noun clause:","options":[],"type":"gap/open"},{"kind":"item","id":"b7807.i03","label":"3","prompt":"Third sentence about first impressions using a wh- noun clause:","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"When meeting new people, I often wonder\nwhat impression I’m giving off and how\nthey might perceive me.\nIt’s interesting to see what small details\npeople remember about a first encounter\nand how that shapes their view of me.\nI’m always curious about why certain first\nimpressions stick, while others change\nover time.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7810","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"order":21,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"WORD FAMILIES"},"instruction":"Complete the sentences with words from the Vocabulary box.","pages":[112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38e16f8051c84a0661ad19069e3aef8f75ecba978047c9d6001f9376df25ef58.png"],"provided":"Vocabulary box: aggressive, aggression, approachable, approachability, attractive, attractiveness, competent, competence, dominant, dominance, likeable, likeability, thoughtful, thoughtfulness","items":[{"id":"b7810.i01","label":"1","prompt":"It was so ____ of you to remember our anniversary.","options":[],"type":"gap/open"},{"id":"b7810.i02","label":"2","prompt":"I saw Taylor Swift at a restaurant once. I was nervous about talking to her, but a few other people went up to her, and she was surprisingly ____. She even gave me a signed menu as a souvenir.","options":[],"type":"gap/open"},{"id":"b7810.i03","label":"3","prompt":"The physical ____ of a job candidate should never be a factor in our hiring decisions. The most important qualities are relevant experience and proven ____ at dealing with customers.","options":[],"type":"gap/open"},{"id":"b7810.i04","label":"4","prompt":"The scientists quickly learnt that a male chimpanzee they called Freddie was the ____ member of the group. He maintained his position by displaying ____ and being violent towards any other males who challenged him.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Vocabulary box: aggressive, aggression, approachable, approachability, attractive, attractiveness, competent, competence, domin keable, likeability, thoughtful, thoughtfulness","screens":["Vocabulary box: aggressive, aggression, approachable, approachability, attractive, attractiveness, competent, competence, dominant, dominance, likeable, likeability, thoughtful, thoughtfulness"],"sources":[{"page":112,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38e16f8051c84a0661ad19069e3aef8f75ecba978047c9d6001f9376df25ef58.png"}],"kind":"task_sheet","sourceBlockIds":["b7810"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 My cousin works on security at a\nfootball stadium, and sometimes has\nto cope with aggressive behaviour\nfrom customers.\n2 My elderly neighbour is one of the most\nlikeable people I’ve ever met.\n3 A friend of mine was told he was not\nattractive enough to be an actor. I don’t\nsee what that has to do with his ability\nto act!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7814","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":23,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a lecture on how the brain makes and uses mental maps. Before you listen, work with a partner and complete the quiz.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2b6dd02de18c889be8ccdb1e07bbd2ebff56aa5ec9058dc53fddbd8272de447.png"],"provided":"","items":[{"id":"b7814.i01","label":"1","prompt":"People generally use ____ of their brains.","options":["10%","100%"],"type":"choice/closed"},{"id":"b7814.i02","label":"2","prompt":"An adult brain weighs approximately ____.","options":["0.5kg","1.5kg"],"type":"choice/closed"},{"id":"b7814.i03","label":"3","prompt":"Approximately 60% of the brain's weight consists of ____.","options":["fat","water"],"type":"choice/closed"},{"id":"b7814.i04","label":"4","prompt":"Information in the brain travels at approximately ____ km/h.","options":["400","40,000"],"type":"choice/closed"},{"id":"b7814.i05","label":"5","prompt":"The human brain ____ at around the age of 25.","options":["stops developing","starts deteriorating"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7814.i01","label":"1","prompt":"People generally use ____ of their brains.","options":["10%","100%"],"type":"choice/closed"},{"kind":"item","id":"b7814.i02","label":"2","prompt":"An adult brain weighs approximately ____.","options":["0.5kg","1.5kg"],"type":"choice/closed"},{"kind":"item","id":"b7814.i03","label":"3","prompt":"Approximately 60% of the brain's weight consists of ____.","options":["fat","water"],"type":"choice/closed"}],[{"kind":"item","id":"b7814.i04","label":"4","prompt":"Information in the brain travels at approximately ____ km/h.","options":["400","40,000"],"type":"choice/closed"},{"kind":"item","id":"b7814.i05","label":"5","prompt":"The human brain ____ at around the age of 25.","options":["stops developing","starts deteriorating"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 100% 2 1.5kg 3 fat. 4 400 5 stops developing","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7815","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":24,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Only three of the six statements (a–f) are completely true. Which three do you think they are? Use a dictionary to help you.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2b6dd02de18c889be8ccdb1e07bbd2ebff56aa5ec9058dc53fddbd8272de447.png"],"provided":"","items":[{"id":"b7815.i01","label":"a","prompt":"A lobe is a part of an organ, and the human brain has six of them.","options":["True","False"],"type":"choice/closed"},{"id":"b7815.i02","label":"b","prompt":"An MRI (magnetic resonance imaging) is a test using magnets and radio waves to create detailed images of the inside of the body.","options":["True","False"],"type":"choice/closed"},{"id":"b7815.i03","label":"c","prompt":"Dementia is a disease which makes the muscles of elderly people deteriorate.","options":["True","False"],"type":"choice/closed"},{"id":"b7815.i04","label":"d","prompt":"Parts of the brain are grey, which is why the phrases grey cells and grey matter mean a person's ability to think.","options":["True","False"],"type":"choice/closed"},{"id":"b7815.i05","label":"e","prompt":"The hippocampus is a brain condition affecting a person's spatial memory and navigation.","options":["True","False"],"type":"choice/closed"},{"id":"b7815.i06","label":"f","prompt":"Research has shown that a baby's spatial reasoning is a good predictor of their maths skills in later childhood.","options":["True","False"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7815.i01","label":"a","prompt":"A lobe is a part of an organ, and the human brain has six of them.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b7815.i02","label":"b","prompt":"An MRI (magnetic resonance imaging) is a test using magnets and radio waves to create detailed images of the inside of the body.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b7815.i03","label":"c","prompt":"Dementia is a disease which makes the muscles of elderly people deteriorate.","options":["True","False"],"type":"choice/closed"}],[{"kind":"item","id":"b7815.i04","label":"d","prompt":"Parts of the brain are grey, which is why the phrases grey cells and grey matter mean a person's ability to think.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b7815.i05","label":"e","prompt":"The hippocampus is a brain condition affecting a person's spatial memory and navigation.","options":["True","False"],"type":"choice/closed"},{"kind":"item","id":"b7815.i06","label":"f","prompt":"Research has shown that a baby's spatial reasoning is a good predictor of their maths skills in later childhood.","options":["True","False"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Only b, d and f are completely true.\na A lobe is a part of an organ, but the brain has four major\nlobes, not six. These are the frontal, temporal, parietal and\noccipital lobes.\nc Dementia is the reduced ability to think, remember\nand make decisions, and most commonly affects older\npeople.\ne The hippocampus is a part of the brain.","references":[{"source":"https://ra landmarks","navigate","reconstruct","reliance"],"type":"choice/closed"}],[{"kind":"item","id":"b7817.i05","label":"e","prompt":"to damage (a skill) ____","options":["definitely","deteriorate","impair","intensively","landmarks","navigate","reconstruct","reliance"],"type":"choice/closed"},{"kind":"item","id":"b7817.i06","label":"f","prompt":"to find the way from one place to another ____","options":["definitely","deteriorate","impair","intensively","landmarks","navigate","reconstruct","reliance"],"type":"choice/closed"}],[{"kind":"item","id":"b7817.i07","label":"g","prompt":"the state of depending on something ____","options":["definitely","deteriorate","impair","intensively","landmarks","navigate","reconstruct","reliance"],"type":"choice/closed"},{"kind":"item","id":"b7817.i08","label":"h","prompt":"places or structures that are easy to recognize ____","options":["definitely","deteriorate","impair","intensively","landmarks","navigate","reconstruct","reliance"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-LS-U05-publisher-sheet:b7816","title":"LISTENING 2 Ex 3 原题面","pages":[114],"text":"definitely (adv) deteriorate (v) impair (v) intensively (adv) landmarks (n) navigate (v) reconstruct (v) reliance (n)","screens":["definitely (adv) deteriorate (v) impair (v) intensively (adv) landmarks (n) navigate (v) reconstruct (v) reliance (n)"],"sources":[{"page":114,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc4efa127048a646405e0ce09c0858ed23f2df306372bfc2dbe8e393c1f79359.png"}],"kind":"task_sheet","sourceBlockIds":["b7816"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a deteriorate b definitively c intensively\nd reconstruct e impair f navigate g reliance\nh landmarks","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7818","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":27,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Ask and answer the questions in Exercise 3.","pages":[114],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc4efa127048a646405e0ce09c0858ed23f2df306372bfc2dbe8e393c1f79359.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U05-question:b7816","kind":"student-work","title":"LISTENING 2 Ex 3","pages":[114]}],"materials":[],"coursePages":[[{"kind":"text","text":"When you are working ____, what is the most effective way to stay focused on what you are doing?"},{"kind":"text","text":"After a crime has been committed, what do the police do in order to ____ what actually happened?"},{"kind":"text","text":"What are some possible things a person can do so their health does not ____ as much as they grow older?"},{"kind":"text","text":"What ____ in your home town, such as parks and buildings, enable people to work out where they are?"},{"kind":"text","text":"Do you think that scientists can prove ____ how we are able to remember things?"}],[{"kind":"text","text":"Many species of animals undertake extremely long journeys; how do you think they are able to ____ so successfully?"},{"kind":"text","text":"Besides hunger, what else can sometimes temporarily ____ a person's ability to think clearly?"},{"kind":"text","text":"To what extent do you feel that our ____ on technology may actually be bad for our brains?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Taking regular short breaks and limiting\ndistractions help me to stay focused on\na task.\n2 They use various techniques, including\nreviewing CCTV footage (if available),\nwitness statements and mobile\nphone records.\n3 It’s inevitable that our health deteriorates\nin old age, but many things, from\ngetting enough sleep and exercise\nto eating healthily, can help us stay\nhealthier for longer.\n4 There’s a very tall building near where\nI live, which everyone knows and\nrecognises, as it can be seen from a long\nway off.\n5 I think scientists will gradually\nunderstand human memory more and\nmore, but no, I don’t think there’ll ever\nbe a time when they claim to completely\nunderstand it.\n6 Animals use all sorts of techniques to\nnavigate, for example sea turtles are\nbelieved to be able to detect the earth’s\nmagnetic field, and use this to find\ntheir way.\n7 Tiredness and / or lack of sleep greatly\naffect our ability to understand problems\nand make good decisions. Feeling under\nstress can also impair our ability to\nact rationally.\n8 I personally think that being able to\nuse technology, for example to store\nsomeone’s phone number so that you\ndon’t have to remember it, is actually\nbeneficial for our brains, as it enables us\nto use them for more interesting things.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7820","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":28,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Answer the questions.","pages":[115],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/878fa2f45d91d8291e1f790b803194ced185284e52fc869e839e3d8783ed708c.png"],"provided":"","items":[{"id":"b7820.i01","label":"1","prompt":"How good would you say you are at remembering routes? What makes some people more adept at doing this than others are?","options":[],"type":"discuss/open"},{"id":"b7820.i02","label":"2","prompt":"When you are in an unfamiliar place, how do you navigate? How do you find your way again if you get lost?","options":[],"type":"discuss/open"},{"id":"b7820.i03","label":"3","prompt":"Do you know anybody who has suffered from dementia? Describe what happened. What were the symptoms?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7820.i01","label":"1","prompt":"How good would you say you are at remembering routes? What makes some people more adept at doing this than others are?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7820.i02","label":"2","prompt":"When you are in an unfamiliar place, how do you navigate? How do you find your way again if you get lost?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7820.i03","label":"3","prompt":"Do you know anybody who has suffered from dementia? Describe what happened. What were the symptoms?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Personally I’d say I’m not bad at\nremembering routes. This may be\nbecause some of my favourite hobbies\nare things like cycling and hiking,\nwhich themselves involve planning or\nfinding routes. So doing these activities\nmay have trained me to be better\nat navigating.\n2 I know it’s old-fashioned, but I actually\nlike to stop and ask people, rather than\nuse the map on my phone when I’m lost.\n3 Yes, my grandfather had dementia. His\npersonality changed virtually overnight,\nand he was often confused as to who\npeople were or where he was. It was so\nsad to see.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7822","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":29,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"5.4 Listen to the lecture and number the topics (a–i) in the order the lecturer mentions them.","pages":[115],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/878fa2f45d91d8291e1f790b803194ced185284e52fc869e839e3d8783ed708c.png"],"provided":"","items":[{"id":"b7822.i01","label":"a","prompt":"which part of the brain was found to be responsible for creating mental maps ____","options":[]
