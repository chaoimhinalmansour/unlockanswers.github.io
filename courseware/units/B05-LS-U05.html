o be responsible for creating mental maps – the hippocampus helps us use landmarks to work out location","items":[],"layout":"list","references":[{"id":"B05-LS-U05-question:b7822","kind":"student-work","title":"LISTENING 2 Ex 7","pages":[115]}],"materials":[],"coursePages":[[{"kind":"text","text":"which part of the brain was found to be responsible for creating mental maps – the hippocampus helps us use landmarks to work out location"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 5.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ee82d262c3ad2bbcdc48604d46c148226df4a00c8e0a119cfdf7adda8b728d3.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"a  which part of the brain was found to be\nresponsible for creating mental maps\nthe hippocampus makes mental maps\n‘In the 1970s, scientists discovered that\nthe site of this map-making ability is\nthe hippocampus.’\nb whether or not the response strategy\ndepends on a mental map\n–  it doesn’t use a mental map\n‘This strategy does not require the\nconstruction of a mental map.’\nc why spatial memory is a key factor in\ngeneral memory\n–  it helps us reconstruct experiences\nand link these with physical spaces\n‘Spatial memory is involved in more\nthan just remembering where things are,\nhowever. It plays a crucial role\nin memory overall because it allows us\nto reconstruct experiences\nand events.’\nd if planning a journey leads to increased\nactivity in the hippocampus\n–  research by Maguire – MRI images of\nthe brains of London taxi drivers while\nplanning a route revealed high activity\nlevels in hippocampus\n‘MRI images of the drivers’ brains\nas they planned their routes\nshowed a high level of activity in\nthe hippocampus.’\ne what two different methods humans\ndepend on in order to navigate\n1  landmark strategy – creates a\nmental map using landmarks (e.g.\nbuildings; trees)\n2  response strategy – memorising\nthrough repeated visits\n‘Humans navigate in one of two ways.\nThe first is the spatial or landmark\nstrategy…The second method is the\nresponse strategy,’\nf what impact a person’s use of GPS may\nhave on their health in later life\n–  research by Bohbot – participants\nwho didn’t rely on GPS performed\nbetter in tests, including in those\nwhich can reveal early dementia\n‘The hippocampus plays a key role\nin spatial memory and navigation.\nThese are among the first abilities to\ndeteriorate as we age.’\ng what the connection is between\nhippocampus size and spatial memory\n–  causal relationship – creating mental\nmaps leads to a larger hippocampus\n‘The hippocampi of the second group\n– the ones who had become drivers –\nwere much larger,… So all this points\nto a causal relationship between the\ncreation of mental maps and the\nincreased size of the hippocampus.’\nh research into whether using GPS may be\nlinked to poor spatial memory\n–  research by Burnett – working out a\nroute for yourself may make it easier\nto recall later\n‘... researchers began to wonder\nwhether the increasing use of these\ndevices might impair our ability to create\nmental maps. In 2005, Gary Burnett at\nNottingham University conducted\na study…’\ni which abilities tend to decline as a result\nof old age\n–  spatial memory and navigation\ndeteriorate, sometimes leading to\ndementia\n‘The hippocampus plays a key role\nin spatial memory and navigation.\nThese are among the first abilities to\ndeteriorate as we age.’","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7825","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":31,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"5.4 Listen again. Listen for the dependency signposts in bold and complete the information, writing up to eleven words in each gap.","pages":[116],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/db9b982d55db905d665065c4ef723fe2d22e77f29878d20ae60a03807a0a142b.png"],"provided":"","items":[{"id":"b7825.i01","label":"1","prompt":"The lecturer plans to speak about how our cognitive health may be affected by our increasing reliance on ____","options":[],"type":"gap/closed"},{"id":"b7825.i02","label":"2","prompt":"In the response to strategy, your knowledge of the route is the result of","options":[],"type":"gap/closed"},{"id":"b7825.i03","label":"3","prompt":"In her second study, she was able to prove a causal relationship between the","options":[],"type":"gap/closed"},{"id":"b7825.i04","label":"4","prompt":"The Nottingham University study found that the kind of navigation strategy chosen impacts ____.","options":[],"type":"gap/closed"},{"id":"b7825.i05","label":"5","prompt":"With the Bohbot and Maguire studies, it cannot be said definitively that the connection between ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7825.i01","label":"1","prompt":"The lecturer plans to speak about how our cognitive health may be affected by our increasing reliance on ____","options":[],"type":"gap/closed","answer":{"label":"1","mode":"gap","answer":"navigation aids such as GPS"}},{"kind":"item","id":"b7825.i02","label":"2","prompt":"In the response to strategy, your knowledge of the route is the result of","options":[],"type":"gap/closed","answer":{"label":"2","mode":"line","answer":"repeated trips along the same route"}},{"kind":"item","id":"b7825.i03","label":"3","prompt":"In her second study, she was able to prove a causal relationship between the","options":[],"type":"gap/closed","answer":{"label":"3","mode":"line","answer":"creation of mental maps and the increased size of the hippocampus"}},{"kind":"item","id":"b7825.i04","label":"4","prompt":"The Nottingham University study found that the kind of navigation strategy chosen impacts ____.","options":[],"type":"gap/closed","answer":{"label":"4","mode":"gap","answer":"this type of memory"}},{"kind":"item","id":"b7825.i05","label":"5","prompt":"With the Bohbot and Maguire studies, it cannot be said definitively that the connection between ____","options":[],"type":"gap/closed","answer":{"label":"5","mode":"gap","answer":"GPS use and lower test performance is a causal one"}}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 5.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ee82d262c3ad2bbcdc48604d46c148226df4a00c8e0a119cfdf7adda8b728d3.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 navigation aids such as GPS\n2 repeated trips along the same route\n3 creation of mental maps and the increased size of the\nhippocampus\n4 this type of memory\n5 GPS use and lower test performance is a causal one","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":47,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7826","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":32,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in groups of four. Each group member will give an oral summary of one of the four studies described in the presentation. Other members of the group will ask questions.","pages":[116],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/db9b982d55db905d665065c4ef723fe2d22e77f29878d20ae60a03807a0a142b.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Student A: The first study was by Eleanor\nMaguire, a psychologist at University\nCollege London. She aimed to understand\nmore about the role of the hippocampus in\nsubjects who relied on landmark strategy.\nHer method was to perform MRI scans on\nLondon taxi drivers while they planned\nroutes. She found that the hippocampus\nwas extremely active when the taxi drivers\nplanned routes using this strategy, and\nalso that the taxi drivers had an enlarged\nhippocampus. However she was not certain\nthat the relationship was causal and so\nundertook a second study.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7828","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":33,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in small groups. Read the excerpts from the lecture and discuss the questions.","pages":[117],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff64e807212f896bb199298532198c698776e0a0eb433d5f2990673e438c49a9.png"],"provided":"1 The speaker starts the talk by saying, 'Perhaps you've had the experience of getting step-by-step directions from somebody or using your smartphone to find a place, and later, when trying to find your way a second time, you discover that you have no memory of the route you took.'\nWhy do you think he started his lecture in this way?\n2 The speaker says, 'These are among the first abilities to deteriorate as we age, sometimes ending in dementia. So, you can see why understanding how it (the hippocampus) works is a top priority for researchers today.'\nWhy do you think this is considered a 'top priority', and is it valid to prioritize this kind of research?\n3 The speaker says, 'So, Maguire did a longitudinal follow-up study.' How would you define a 'longitudinal study', and why do you think Maguire chose to do one?\n4 The speaker says, 'If we limit our reliance on GPS, we'll strengthen our brain's navigational skills.'\nHow practical or desirable is it for people to reduce their reliance on GPS while navigating? And how likely do you think it is that the brain would benefit as a result?","items":[{"id":"b7828.i01","label":"1","prompt":"The speaker starts the talk by saying, 'Perhaps you've had the experience of getting step-by-step directions from somebody or using your smartphone to find a place, and later, when trying to find your way a second time, you discover that you have no memory of the route you took.' Why do you think he started his lecture in this way?","options":[],"type":"discuss/open"},{"id":"b7828.i02","label":"2","prompt":"The speaker says, 'These are among the first abilities to deteriorate as we age, sometimes ending in dementia. So, you can see why understanding how it (the hippocampus) works is a top priority for researchers today.' Why do you think this is considered a 'top priority', and is it valid to prioritize this kind of research?","options":[],"type":"discuss/open"},{"id":"b7828.i03","label":"3","prompt":"The speaker says, 'So, Maguire did a longitudinal follow-up study.' How would you define a 'longitudinal study', and why do you think Maguire chose to do one?","options":[],"type":"discuss/open"},{"id":"b7828.i04","label":"4","prompt":"The speaker says, 'If we limit our reliance on GPS, we'll strengthen our brain's navigational skills.' How practical or desirable is it for people to reduce their reliance on GPS while navigating? And how likely do you think it is that the brain would benefit as a result?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The speaker starts the talk by saying, 'Perhaps you've had the experience of getting step-by-step directions from somebody or using your smartphone to find a place, and later, when trying to find your way a second time, you discover that you have no memory of the route you took.'"},{"kind":"text","text":"Why do you think he started his lecture in this way?"},{"kind":"text","text":"2 The speaker says, 'These are among the first abilities to deteriorate as we age, sometimes ending in dementia. So, you can see why understanding how it (the hippocampus) works is a top priority for researchers today.'"},{"kind":"text","text":"Why do you think this is considered a 'top priority', and is it valid to prioritize this kind of research?"}],[{"kind":"text","text":"3 The speaker says, 'So, Maguire did a longitudinal follow-up study.' How would you define a 'longitudinal study', and why do you think Maguire chose to do one?"},{"kind":"text","text":"4 The speaker says, 'If we limit our reliance on GPS, we'll strengthen our brain's navigational skills.'"},{"kind":"text","text":"How practical or desirable is it for people to reduce their reliance on GPS while navigating? And how likely do you think it is that the brain would benefit as a result?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 He probably started by describing an\nexperience the listeners had probably\nhad in order to help them relate to the\ncontent of the lecture.\n2 It is considered a top priority because of\nthe high and growing number of people\nsuffering from dementia. Yes, it is valid\nbecause the research has the potential\nto improve the quality of life of dementia\nsufferers and their families.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7830","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":34,"module":"LISTENING 2","ex":"12","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to discuss the following statement.","pages":[117],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff64e807212f896bb199298532198c698776e0a0eb433d5f2990673e438c49a9.png"],"provided":"Funding for psychology research should prioritize areas which have the potential for improving people's quality of life (such as the causes of dementia) rather than areas which are interesting but not necessarily useful (such as first impressions based on faces).","items":[{"id":"b7830.i01","label":"12","prompt":"Funding for psychology research should prioritize areas which have the potential for improving people's quality of life (such as the causes of dementia) rather than areas which are interesting but not necessarily useful (such as first impressions based on faces).","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Funding for psychology research should prioritize areas which have the potential for improving people's quality of life (such as the causes of dementia) rather than areas which are interesting but not necessarily useful (such as first impressions based on faces)."}]],"courseMaterials":[{"id":"B05-LS-U05-publisher-sheet:b7792","title":"LISTENING 1 Ex 5 原题面","pages":[108],"text":"","screens":[],"sources":[{"page":108,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dd8f828c933cf3f126f8e9f93b07ddcd091773e52f1ba9c761bc456c07e5ecf1.png"}],"kind":"task_sheet","sourceBlockIds":["b7792"]},{"id":"B05-LS-U05-publisher-sheet:b7823","title":"LISTENING 2 Ex 8 原题面","pages":[115],"text":"which part of the brain was found to be responsible for creating mental maps – the hippocampus helps us use landmarks to work out location","screens":["which part of the brain was found to be responsible for creating mental maps – the hippocampus helps us use landmarks to work out location"],"sources":[{"page":115,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/878fa2f45d91d8291e1f790b803194ced185284e52fc869e839e3d8783ed708c.png"}],"kind":"task_sheet","sourceBlockIds":["b7823"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Unless a country, ministry of education or\na university has virtually unlimited funding,\nthen yes, I agree that only research which\ncan yield a definite benefit should receive\nfunding. While it may be interesting to\nknow more about areas such as reading\nfaces, an increased understanding of\nthis will make little difference to people’s\nquality of life. / I think that the idea of what\nresearch is useful can be slightly subjective.\nPresumably some ‘interesting’ studies\nreceived funding because a committee\ndecided that research in the proposed\narea was required and would have a useful\napplication. Also, research can sometimes\nraise unexpected findings which have a use\nbeyond the original scope of the study and\nmerit further research.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7831","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":35,"module":"LISTENING 2","ex":"13","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Choose one area which you think would benefit from a psychology research project. Write a 200-word summary for your university, outlining what research you would do and why, and what the benefits would be.","pages":[117],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff64e807212f896bb199298532198c698776e0a0eb433d5f2990673e438c49a9.png"],"provided":"In your summary, include one paragraph on each of the following:\n- what you intend to research and why it is important\n- what you will investigate and how\n- who will benefit from the research and in what ways.\nOur research project aims to investigate the effect of online learning on students / music on calming young children / reducing the number of working hours ...","items":[{"id":"b7831.i01","label":"13","prompt":"Write a 200-word summary for your university about a psychology research project you would do, including one paragraph on each of the following: what you intend to research and why it is important; what you will investigate and how; who will benefit from the research and in what ways.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"In your summary, include one paragraph on each of the following:"},{"kind":"text","text":"- what you intend to research and why it is important"},{"kind":"text","text":"- what you will investigate and how"},{"kind":"text","text":"- who will benefit from the research and in what ways."},{"kind":"text","text":"Our research project aims to investigate the effect of online learning on students / music on calming young children / reducing the number of working hours ..."}],[{"kind":"item","id":"b7831.i01","label":"13","prompt":"Write a 200-word summary for your university about a psychology research project you would do, including one paragraph on each of the following: what you intend to research and why it is important; what you will investigate and how; who will benefit from the research and in what ways.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Our research project aims to investigate\nthe potential benefits of mindfulness-\nbased interventions (MBIs) in reducing\nworkplace stress and enhancing\nproductivity. Workplace stress is a common\nissue affecting individuals across various\nindustries, with negative consequences for\nboth employees and organizations. This\nresearch is crucial as it addresses the well-\nbeing of individuals in the workforce and\nthe performance of businesses.\nOur study will involve a carefully designed\nintervention programme involving\nemployees from various sectors. We will\nassess the impact of MBIs on their stress\nlevels, emotional well-being, and overall\nproductivity through a combination of\nsurveys, physiological measurements, and\nproductivity metrics. By using rigorous\nscientific methods, we will be able to\nmeasure and analyze the effectiveness of\nMBIs, providing valuable insights into their\npotential as a cost-effective stress reduction\nstrategy for employers.\nThe benefits of this research include\ncontributing to a more sustainable and\nhealthier work environment, potentially\nreducing absenteeism and employee\nturnover, and increasing overall\nproductivity. Furthermore, the findings\ncan inform corporate policies and\npromote well-being and mental health in\nthe workplace.\nWe hope that this project will not only help\nadvance the field of psychology but also\nfoster positive change in the world of work.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7835","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":36,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in groups of four. Read the information about three human behaviour studies (A–C) below. Decide which one your group would like to present, or choose and research an alternative topic (D).","pages":[119],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/07675a250c69432316303ddfeaeb353de08f9b7ed22b955426af4b623064e8b5.png"],"provided":"PERCEPTUAL BLINDNESS\nPerceptual blindness refers to the failure to see or notice a stimulus that is in plain sight. However, this lack of attention has nothing to do with vision problems. A number of studies have tested this idea, especially when the stimulus is unexpected.\n### References:\nInvisible gorilla experiment\nClown on a unicycle experiment\n\nCONFORMITY\nConformity experiments test the degree to which people report their true feelings or beliefs when others around them state opposing feelings and beliefs.\n### References:\nAsch experiments\nSherif: Group norms and conformity\n\nTHE JUDGMENT OF OTHERS\nThe halo effect describes the fact that people frequently extend their judgments of others in one area (e.g. physical attractiveness) to another area (e.g. intelligence). Experiments have documented this effect in many different contexts.\n### References:\nThe halo effect\nBeauty is talent","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"PERCEPTUAL BLINDNESS"},{"kind":"text","text":"Perceptual blindness refers to the failure to see or notice a stimulus that is in plain sight. However, this lack of attention has nothing to do with vision problems. A number of studies have tested this idea, especially when the stimulus is unexpected."},{"kind":"text","text":"### References:"},{"kind":"text","text":"Invisible gorilla experiment"},{"kind":"text","text":"Clown on a unicycle experiment"},{"kind":"text","text":"CONFORMITY"}],[{"kind":"text","text":"Conformity experiments test the degree to which people report their true feelings or beliefs when others around them state opposing feelings and beliefs."},{"kind":"text","text":"### References:"},{"kind":"text","text":"Asch experiments"},{"kind":"text","text":"Sherif: Group norms and conformity"},{"kind":"text","text":"THE JUDGMENT OF OTHERS"}],[{"kind":"text","text":"The halo effect describes the fact that people frequently extend their judgments of others in one area (e.g. physical attractiveness) to another area (e.g. intelligence). Experiments have documented this effect in many different contexts."},{"kind":"text","text":"### References:"},{"kind":"text","text":"The halo effect"},{"kind":"text","text":"Beauty is talent"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"D: The Bystander effect\nThe bystander effect is a phenomenon\nwhere people are less likely to help\nsomeone in need when others are present.\nThis effect occurs because people tend to\nassume that someone else will intervene,\nwhich reduces their sense of personal\nresponsibility. Studies have tested this\nconcept to understand how group presence\naffects individuals’ willingness to assist.\nReferences:\nKitty Genovese incident\nSeizure experiment","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7836","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Go online and follow up on the two scientific studies referenced for the topic you chose in Exercise 1. Complete the table with notes to answer the questions.","pages":[119],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/07675a250c69432316303ddfeaeb353de08f9b7ed22b955426af4b623064e8b5.png"],"provided":"ANALYZE\n\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>study 1\u003c/td>\u003ctd>study 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>goal:What was the research question?\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>participants:How were they chosen?\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>study description:What were the participants asked to do?\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>results:What did the study show?\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conclusions:What did the researcher(s) conclude from the results?\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7836.i01","label":"goal / study 1","prompt":"goal: What was the research question? (study 1)","options":[],"type":"gap/open"},{"id":"b7836.i02","label":"goal / study 2","prompt":"goal: What was the research question? (study 2)","options":[],"type":"gap/open"},{"id":"b7836.i03","label":"3","prompt":"participants: How were they chosen? (study 1)","options":[],"type":"gap/open"},{"id":"b7836.i04","label":"4","prompt":"participants: How were they chosen? (study 2)","options":[],"type":"gap/open"},{"id":"b7836.i05","label":"5","prompt":"study description: What were the participants asked to do? (study 1)","options":[],"type":"gap/open"},{"id":"b7836.i06","label":"6","prompt":"study description: What were the participants asked to do? (study 2)","options":[],"type":"gap/open"},{"id":"b7836.i07","label":"7","prompt":"results: What did the study show? (study 1)","options":[],"type":"gap/open"},{"id":"b7836.i08","label":"8","prompt":"results: What did the study show? (study 2)","options":[],"type":"gap/open"},{"id":"b7836.i09","label":"9","prompt":"conclusions: What did the researcher(s) conclude from the results? (study 1)","options":[],"type":"gap/open"},{"id":"b7836.i10","label":"10","prompt":"conclusions: What did the researcher(s) conclude from the results? (study 2)","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-LS-U05-question:b7835","kind":"student-work","title":"CRITICAL THINKING Ex 1","pages":[119]}],"materials":[],"coursePages":[[{"kind":"text","text":"ANALYZE"},{"kind":"table","rows":[[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"study 1","header":false,"colspan":1,"rowspan":1},{"text":"study 2","header":false,"colspan":1,"rowspan":1}],[{"text":"goal:What was the research question?","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"participants:How were they chosen?","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"study description:What were the participants asked to do?","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"results:What did the study show?","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"conclusions:What did the researcher(s) conclude from the results?","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"item","id":"b7836.i01","label":"goal / study 1","prompt":"goal: What was the research question? (study 1)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i02","label":"goal / study 2","prompt":"goal: What was the research question? (study 2)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i03","label":"3","prompt":"participants: How were they chosen? (study 1)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i04","label":"4","prompt":"participants: How were they chosen? (study 2)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i05","label":"5","prompt":"study description: What were the participants asked to do? (study 1)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i06","label":"6","prompt":"study description: What were the participants asked to do? (study 2)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i07","label":"7","prompt":"results: What did the study show? (study 1)","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7836.i08","label":"8","prompt":"results: What did the study show? (study 2)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i09","label":"9","prompt":"conclusions: What did the researcher(s) conclude from the results? (study 1)","options":[],"type":"gap/open"},{"kind":"item","id":"b7836.i10","label":"10","prompt":"conclusions: What did the researcher(s) conclude from the results? (study 2)","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A: Perceptual Blindness\nStudy 1:\nGoal: How does focused attention\nimpact an individual’s ability to perceive\nunexpected objects?\nParticipants: Typically volunteer college\nstudents from psychology courses\nStudy description: Participants watched a\nvideo of two teams passing a basketball\nand were instructed to count the number\nof passes made by one team. During the\nvideo, a person in a gorilla costume walked\nthrough the scene, stopped, thumped their\nchest, and walked out. The participants\nwere not informed of the gorilla’s\npresence beforehand.\nResults: Approximately half of the\nparticipants failed to notice the gorilla,\ndemonstrating that their focused attention\non the counting task led them to overlook\nan obvious and unexpected stimulus.\nConclusions: The researchers concluded\nthat focused attention on a specific task\ncould cause individuals to miss other\nsignificant information in their visual\nfield, highlighting the limitations of\nperceptual awareness.\nStudy 2:\nGoal: Does the level of attention engaged\nin mobile phone use affect an individual’s\nability to perceive unusual stimuli in\ntheir environment?\nParticipants: Pedestrians were chosen\nrandomly on a college campus, with\nparticipants categorized based on whether\nthey were walking alone, in pairs, or on\ntheir cell phones.\nStudy description: Participants walked\nacross a square where a unicycling clown\nrode around. Researchers observed and\nlater asked if they noticed anything unusual\n(i.e., the clown).\nResults: Those on their cell phones\nwere far less likely to notice the clown\nthan participants who were not using\ntheir phones.\nConclusions: The study concluded that\ncellphone use could cause inattentional\nblindness, as the mental engagement\ninvolved in phone conversations diminished\nawareness of the surroundings.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7837","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in pairs. For each of the studies, verify the reliability of your resources.","pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94c213a649b9776102214766f9e5d470c3648c953d3c22b365d131aa7f318f8b.png"],"provided":"1 What website(s) did you consult?\n2 What is the purpose of the website?\n3 Who is/are the author(s) of the study?\n4 When was the study conducted? Are other scholars still citing the findings?\n5 Do you believe the website offers reliable information? Why / Why not?","items":[{"id":"b7837.i01","label":"1","prompt":"What website(s) did you consult?","options":[],"type":"discuss/open"},{"id":"b7837.i02","label":"2","prompt":"What is the purpose of the website?","options":[],"type":"discuss/open"},{"id":"b7837.i03","label":"3","prompt":"Who is/are the author(s) of the study?","options":[],"type":"discuss/open"},{"id":"b7837.i04","label":"4","prompt":"When was the study conducted? Are other scholars still citing the findings?","options":[],"type":"discuss/open"},{"id":"b7837.i05","label":"5","prompt":"Do you believe the website offers reliable information? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 What website(s) did you consult?"},{"kind":"text","text":"2 What is the purpose of the website?"},{"kind":"text","text":"3 Who is/are the author(s) of the study?"},{"kind":"text","text":"4 When was the study conducted? Are other scholars still citing the findings?"},{"kind":"text","text":"5 Do you believe the website offers reliable information? Why / Why not?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I looked at theinvisiblegorilla.com as\nwell as secondary research on sites such\nas Google Scholar and Scholarpedia.\n2 It explains the concept of inattentional\nblindness and presents findings and\ndiscussions about the experiment for\neducational purposes.\n3 The study was conducted and co-\nauthored by Christopher Chabris and\nDaniel Simons.\n4 The study was conducted in 1999, and\nscholars still frequently cite its findings in\nresearch on attention and perception.\n5 Yes, The Invisible Gorilla website is\nreliable as it’s authored by the original\nresearchers, Simons and Chabris,\nproviding direct insights into their study\nand findings.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7838","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with your group. Discuss the questions.","pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94c213a649b9776102214766f9e5d470c3648c953d3c22b365d131aa7f318f8b.png"],"provided":"1 In what ways are the two studies you read about the same? In what ways are they different?\n2 Does each study confirm, expand on, or conflict with the findings of the other(s)?","items":[{"id":"b7838.i01","label":"1","prompt":"In what ways are the two studies you read about the same? In what ways are they different?","options":[],"type":"discuss/open"},{"id":"b7838.i02","label":"2","prompt":"Does each study confirm, expand on, or conflict with the findings of the other(s)?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 In what ways are the two studies you read about the same? In what ways are they different?"},{"kind":"text","text":"2 Does each study confirm, expand on, or conflict with the findings of the other(s)?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Both studies explore inattentional\nblindness, showing that people can miss\nobvious things when focused on another\ntask. However, they differ in focus: the\n‘gorilla’ study looked at focus during a\nvisual counting task, while the ‘clown’\nexperiment examined distractions while\npeople walked.\n2 Each study confirms and expands on the\nother by demonstrating inattentional\nblindness in different situations, showing\nthat people often miss unexpected\nstimuli when their attention is divided or\nfocused elsewhere.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7839","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":40,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Use the information in the table in Exercise 2 to synthesize the two studies you researched for your topic. Write notes for your presentation. Use the notes below as a model for your own notes.","pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94c213a649b9776102214766f9e5d470c3648c953d3c22b365d131aa7f318f8b.png"],"provided":"1 Why were these research studies conducted? What important questions do they address or answer?\nScientists wanted to understand how the hippocampus works and the effects of the creation of mental maps on different areas of the brain.\n\n2 What are the areas of overlap, similarity or contrast?\nBoth of Maguire's studies explore how navigation strategies impact the brain. Maguire's first study found a relationship between spatial navigation and larger hippocampi, but not which was the cause and which was the effect. By controlling for the size of participants' hippocampi in the second study, she was able to support the claim that spatial navigation leads to a larger hippocampus.\n\n3 Is it possible to conclude anything from the two sets of results?\nThere is a causal connection between the creation of mental maps and the size of the hippocampus.","items":[{"id":"b7839.i01","label":"1","prompt":"Why were these research studies conducted? What important questions do they address or answer?","options":[],"type":"gap/open"},{"id":"b7839.i02","label":"2","prompt":"What are the areas of overlap, similarity or contrast?","options":[],"type":"gap/open"},{"id":"b7839.i03","label":"3","prompt":"Is it possible to conclude anything from the two sets of results?","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-LS-U05-question:b7836","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[119]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Why were these research studies conducted? What important questions do they address or answer?"},{"kind":"text","text":"Scientists wanted to understand how the hippocampus works and the effects of the creation of mental maps on different areas of the brain."},{"kind":"text","text":"2 What are the areas of overlap, similarity or contrast?"},{"kind":"text","text":"Both of Maguire's studies explore how navigation strategies impact the brain. Maguire's first study found a relationship between spatial navigation and larger hippocampi, but not which was the cause and which was the effect. By controlling for the size of participants' hippocampi in the second study, she was able to support the claim that spatial navigation leads to a larger hippocampus."}],[{"kind":"text","text":"3 Is it possible to conclude anything from the two sets of results?"},{"kind":"text","text":"There is a causal connection between the creation of mental maps and the size of the hippocampus."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 These studies were conducted to\nunderstand inattentional blindness –\nhow people can overlook obvious stimuli\nin their surroundings when focused on\nsomething else. They address questions\nabout the limits of human attention and\nhow distractions affect awareness of\nour environment.\n2 Both studies show similarities in\ndemonstrating inattentional blindness.\nThey differ in context: the Invisible\nGorilla study involves focused visual\ntasks, while the Clown on a Unicycle\nstudy tests awareness during mobile\nphone use while walking, highlighting\nthe impact of different types of\ndistractions.\n3 Yes, we can conclude that focused\nattention or distraction can lead people\nto miss unexpected stimuli, confirming\nthat inattentional blindness occurs across\ndifferent settings and tasks.\nPREPARATION FOR\nSPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7841","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":41,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Follow this outline to prepare your talking points.","pages":[121],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2746681dcacd021e1caace60265cf4b0b0d7379a0626b61bc605fe67c7439f2.png"],"provided":"1 Explain the research question(s) that the studies were investigating.\n2 Explain why the question is important in a broader context.\n3 Make a statement that brings together the two studies.\n4 Explain briefly and concisely what happened in each study.\n5 Give a brief description of the results of the two studies.\n6 Compare the results of the two studies.\n7 Suggest how the conclusions may be useful in the future.","items":[{"id":"b7841.i01","label":"1","prompt":"Explain the research question(s) that the studies were investigating.","options":[],"type":"qa/open"},{"id":"b7841.i02","label":"2","prompt":"Explain why the question is important in a broader context.","options":[],"type":"qa/open"},{"id":"b7841.i03","label":"3","prompt":"Make a statement that brings together the two studies.","options":[],"type":"qa/open"},{"id":"b7841.i04","label":"4","prompt":"Explain briefly and concisely what happened in each study.","options":[],"type":"qa/open"},{"id":"b7841.i05","label":"5","prompt":"Give a brief description of the results of the two studies.","options":[],"type":"qa/open"},{"id":"b7841.i06","label":"6","prompt":"Compare the results of the two studies.","options":[],"type":"qa/open"},{"id":"b7841.i07","label":"7","prompt":"Suggest how the conclusions may be useful in the future.","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-LS-U05-question:b7839","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[120]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Explain the research question(s) that the studies were investigating."},{"kind":"text","text":"2 Explain why the question is important in a broader context."},{"kind":"text","text":"3 Make a statement that brings together the two studies."},{"kind":"text","text":"4 Explain briefly and concisely what happened in each study."},{"kind":"text","text":"5 Give a brief description of the results of the two studies."},{"kind":"text","text":"6 Compare the results of the two studies."},{"kind":"text","text":"7 Suggest how the conclusions may be useful in the future."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Invisible Gorilla Study: How does\nfocused attention affect our ability to\nnotice unexpected stimuli?\nClown on a Unicycle Study: How does\nbeing distracted, like using a mobile\nphone, affect our awareness of unusual\nevents around us?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U05-question:b7843","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":2,"order":42,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"INCORPORATING VISUAL SUPPORT"},"instruction":"Most formal presentations include slides to support what the speaker is saying. Work with a partner and plan your slides. Decide whether a presenter should or shouldn't do the following and why:","pages":[121],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2746681dcacd021e1caace60265cf4b0b0d7379a0626b61bc605fe67c7439f2.png"],"provided":"1 include long texts and full sentences on the slides;\n2 state where all information and visuals on the slides come from;\n3 have as much information as possible on each slide;\n4 include images, photographs and graphics on some of the slides;\n5 use a different colour font and background on different slides;\n6 include only the most important information for the slides, and omit minor details.","items":[{"id":"b7843.i01","label":"1","prompt":"include long texts and full sentences on the slides","options":[],"type":"discuss/open"},{"id":"b7843.i02","label":"2","prompt":"state where all information and visuals on the slides come from","options":[],"type":"discuss/open"},{"id":"b7843.i03","label":"3","prompt":"have as much information as possible on each slide","options":[],"type":"discuss/open"},{"id":"b7843.i04","label":"4","prompt":"include images, photographs and graphics on some of the slides","options":[],"type":"discuss/open"},{"id":"b7843.i05","label":"5","prompt":"use a different colour font and background on different slides","options":[],"type":"discuss/open"},{"id":"b7843.i06","label":"6","prompt":"include only the most important information for the slides, and omit minor details","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 include long texts and full sentences on the slides;"},{"kind":"text","text":"2 state where all information and visuals on the slides come from;"},{"kind":"text","text":"3 have as much information as possible on each slide;"},{"kind":"text","text":"4 include images, photographs and graphics on some of the slides;"},{"kind":"text","text":"5 use a different colour font and background on different slides;"},{"kind":"text","text":"6 include only the most important information for the slides, and omit minor details."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 shouldn’t – audiences are unlikely to\nread long texts and full sentences on\nthe slides, as they are concentrating\nprimarily on listening to the presenter,\nnot on reading the slides\n2 should – including references to say\nwhere information comes from is\nstandard academic practice, this allows\nyour audience to verify if they want to,\nand demonstrates that you have done\nyour research thoroughly\n3 shouldn’t – too much text can make a\nslide dull and difficult to read\n4 should – visuals can make a presentation\nmore interesting for your audience, and\nconvey a lot of information so that you\ndon’t have to give it all verbally\n5 shouldn’t – different colours and fonts\ncan be distracting and makes the\npresentation appear less serious\n6 should – it is important to be concise, so\nthat your listeners know what your main\npoint is","r "},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about scientific research into dementia."},{"label":"Listening skills","text":"Listen for generalizations and summaries; listen for dependency relationships."},{"label":"Critical thinking","text":"Synthesize information from multiple sources."},{"label":"Grammar","text":"Use noun clauses with wh-words and if/whether."},{"label":"Speaking skills","text":"Talk about research; incorporate visual support."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":102,"alt":""}}]}},{"id":"B05-LS-U05-classroom:resource:b7774","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b3922c57966d7fd313d943279cd0f502599d979c1032e5194a32e142c916790.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"immerse","pos":"(v)","definition":"surround the audience so that they feel completely involved","example":"The sound and lighting immerse visitors in the performance.","wordAudio":"immerse","cardWord":false},{"term":"navigate","pos":"(v)","definition":"to find the way from one place to another","example":"We used a map to navigate the old town.","wordAudio":"navigate","cardWord":false},{"term":"maze","pos":"(n)","definition":"a system of paths that people try to find their way through","example":"It took us ten minutes to find a way out of the maze.","wordAudio":"maze","cardWord":false},{"term":"spatial awareness","pos":"(n)","definition":"the ability to know where your body is in relation to other objects. understanding space between objects","example":"Catching a ball requires good spatial awareness.","wordAudio":"spatial awareness","cardWord":false},{"term":"diagnosis","pos":"(n)","definition":"a judgment about what a particular illness or problem is","example":"The doctor explained the diagnosis to the patient.","wordAudio":"diagnosis","cardWord":false},{"term":"subtle","pos":"(adj)","definition":"small but important. not noticeable or obvious in any way","example":"The two colours have a subtle difference in tone.","wordAudio":"subtle","cardWord":false}]]}},{"id":"B05-LS-U05-classroom:video","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b3922c57966d7fd313d943279cd0f502599d979c1032e5194a32e142c916790.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/67bbb73f72df485b91cf7acb-L5LS-U05.mp4","captions":[{"start":14.54,"end":22.72,"text":"Sea Hero Quest is the world's first virtual reality\ngame designed to help researchers understand dementia."},{"start":23.58,"end":31.52,"text":"While players are immersed in a mission at sea, the\ngame collects information on their ability to navigate\nthrough simple mazes."},{"start":32.52,"end":35.3,"text":"In many forms of dementia, particularly Alzheimer's\ndisease,"},{"start":36.14,"end":40.16,"text":"your spatial awareness, your ability to navigate is one\nof the first things that goes."},{"start":40.52,"end":48.62,"text":"And that's, we know, is because that's where some of\nthe earliest damage occurs in your brain, the bit of\nyour brain that does your spatial navigation."},{"start":48.98,"end":62.48,"text":"So it links to what we're seeing at the kind of cell\nlevel of your brain cell struggling and then dying, and\nthen what's happening at the functional level, it\nimpacts your real ability to find the right aisle in\nthe shopping and the supermarket or something."},{"start":63.2,"end":68,"text":"Over 55 million people in the world today are living\nwith dementia,"},{"start":68.7,"end":72.38,"text":"a figure expected to almost triple by 2050."},{"start":73.22,"end":76.64,"text":"It is most common in over 65s."},{"start":76.76,"end":77.34,"text":"However,"},{"start":77.84,"end":81.74,"text":"scientists believe it begins to develop when people are\nmuch younger."},{"start":82.58,"end":88.48,"text":"Dementia causes sufferers to slowly lose certain mental\nabilities and there is"},{"start":88.48,"end":88.8,"text":"no"},{"start":88.8,"end":89.53999999999999,"text":"known cure,"},{"start":90.08,"end":93.03999999999999,"text":"but early diagnosis can slow its progress."},{"start":94.14,"end":97.92,"text":"Improved early diagnosis techniques are urgently\nneeded."},{"start":99.12,"end":100.88,"text":"To collect essential data,"},{"start":101.3,"end":108.03999999999999,"text":"Alzheimer's Research UK teamed up with scientists and\nDeutsche Telekom to develop Sea Hero Quest."},{"start":108.68,"end":112.92,"text":"The game was first rolled out on mobile devices in\n2016."},{"start":113.78,"end":117.32,"text":"Over three million people around the world played the\ngame,"},{"start":117.72,"end":121.76,"text":"giving scientists a huge amount of data about how\npeople navigate."},{"start":123.08,"end":124.72,"text":"Until we got Sea Hero Quest,"},{"start":125.16,"end":130.1,"text":"the largest study looking at spatial navigation, so how\nyou navigate around a complex environment,"},{"start":130.62,"end":131.9,"text":"was about 600 people."},{"start":132,"end":135.96,"text":"We've now got three million, so that's orders of\nmagnitude more information."},{"start":135.96,"end":140.64,"text":"With that information we can understand much better\nwhat normal looks like."},{"start":140.94,"end":144.22,"text":"Because until you know what normal healthy people, how\nwell they perform,"},{"start":144.56,"end":147.5,"text":"it's difficult to tell when somebody starts to have\nproblems,"},{"start":147.86,"end":154.28,"text":"particularly in the early stages where those problems\nthey've got are perhaps very small and subtle compared\nto a healthy individual."},{"start":155.16,"end":172.16,"text":"And maybe for the topic of dementia, the most relevant\ndiscovery in this large data set is that qualitative\nchange in how well people perform the navigation tasks\nin this game starts much earlier than what you would\nexpect."},{"start":172.8,"end":181.64,"text":"Traditional laboratory -based research normally focuses\non observations that people at my age start to slowly\ndecline and then it goes down."},{"start":182.12,"end":192.14,"text":"But what we can actually pinpoint in this large data\nset is that from the age of about 19 onwards there are\nmeasurable differences that you wouldn't just obtain in\na traditional laboratory study."},{"start":192.3,"end":195.9,"text":"With the launch of the free virtual reality version of\nthe game,"},{"start":196.56,"end":199.7,"text":"researchers hope to discover even more about dementia."},{"start":200.38,"end":211.22,"text":"What the virtual reality game really adds is much more\nfine -grained detail because people are immersed in the\nworld that they're navigating around, just as we are in\nthe real world."},{"start":211.54,"end":217.94,"text":"And that will give us a lot more insight, I think, than\nplaying it on a mobile phone using your thumbs to\nnavigate about."}],"launchInline":true}},{"id":"B05-LS-U05-classroom:review-1","book":5,"unit":5,"track":"LS","topic":"PSYCHOLOGY","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"p ]}]}},{"B05-LS-U05-question:b7789":{"basis":"已核对教材原题和教师资料。","rows":{"b7789.i01":{"mode":"mark","selected":true,"omitGeneratedTruthOptions":true},"b7789.i02":{"mode":"mark","selected":false,"omitGeneratedTruthOptions":true},"b7789.i03":{"mode":"mark","selected":true,"omitGeneratedTruthOptions":true},"b7789.i04":{"mode":"mark","selected":true,"omitGeneratedTruthOptions":true},"b7789.i05":{"mode":"mark","selected":false,"omitGeneratedTruthOptions":true}},"overrideRows":true,"replaceBlocks":[],"textFills":[]}},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mo
