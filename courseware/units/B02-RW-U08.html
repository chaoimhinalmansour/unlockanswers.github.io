're going to live\nand learn and develop new technologies,"},{"start":50.18,"end":53.08,"text":"because we're eventually going to Mars."},{"start":54.26,"end":57.78,"text":"NASA's Artemis mission will build a base on the moon."},{"start":59.68,"end":62.66,"text":"The astronauts will fly there in an Orion rocket,"},{"start":62.96,"end":63.9,"text":"like this one."},{"start":65.3,"end":68.74,"text":"It can carry more astronauts than the Apollo rockets,"},{"start":69.16,"end":70.82,"text":"six, not three."},{"start":77.58,"end":80.66,"text":"It will be safer for them returning to Earth,"},{"start":81.1,"end":81.38,"text":"too."},{"start":82.66,"end":85.3,"text":"That's not all that's different."},{"start":86.94,"end":89.03999999999999,"text":"Apollo, right, was 50 years ago."},{"start":89.18,"end":91.3,"text":"We put the first man on the moon."},{"start":92.12,"end":99,"text":"Artemis is the sister of Apollo, and so it's just\nfitting, because we're going to try to put the first\nwoman on the moon."},{"start":99.08,"end":102.38,"text":"Not try, we are going to put the first woman on the\nmoon."},{"start":102.38,"end":104.42,"text":"Jessica Watkins,"},{"start":104.78,"end":107.46000000000001,"text":"who works at the International Space Station,"},{"start":107.94,"end":111.03999999999999,"text":"hopes that one day she'll stay at the moon base."},{"start":112.84,"end":115.42,"text":"But living on the moon won't be easy."},{"start":116.78,"end":119.5,"text":"The base that they build will need to protect them."},{"start":120.54,"end":121.98,"text":"They'll need to make water."},{"start":123.06,"end":124.42,"text":"They'll need electricity."},{"start":125.9,"end":129.8,"text":"Sending people to the moon will cost $93 billion."},{"start":129.8,"end":134.72,"text":"Some people ask if it is a good way to use money."},{"start":135.68,"end":137.1,"text":"NASA says yes."},{"start":137.82,"end":141.46,"text":"Technology from the Apollo missions has changed the\nworld."},{"start":142.96,"end":146.54,"text":"We use it in more than one ,800 products,"},{"start":147.02,"end":148,"text":"including medicine,"},{"start":148.36,"end":148.74,"text":"food,"},{"start":149.2,"end":149.6,"text":"furniture,"},{"start":150,"end":151.9,"text":"and safety equipment today."},{"start":153.56,"end":156.14,"text":"NASA says Artemis will change the world,"},{"start":156.64,"end":156.8,"text":"too."},{"start":157.72,"end":162.84,"text":"But the most important thing NASA wants to learn is how\nto live on another planet."},{"start":164.52,"end":167.24,"text":"The moon base will prepare people for Mars,"},{"start":167.8,"end":171.56,"text":"a planet where some people think humans could live one\nday."}]}],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4029","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Choose the best answer for each question.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/275f6c70d833fc63a1170cd9b7fca12f105f219da3ee4b2072d5c1cafab2814d.png"],"provided":"","items":[{"id":"b4029.i01","label":"1","prompt":"How many times did people go to the moon from 1969 to 1972?","options":["six","ten"],"type":"choice/closed"},{"id":"b4029.i02","label":"2","prompt":"How many astronauts can the Orion rocket carry?","options":["three","six"],"type":"choice/closed"},{"id":"b4029.i03","label":"3","prompt":"How much will it cost to send people to the moon?","options":["93 billion dollars","93 million dollars"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4029.i01","label":"1","prompt":"How many t 4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1080e41b19a0131087231c9488370b1919723395ba8ae7efd6d5e3db37eb6b73.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4040","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":1,"order":11,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article on page 173. Answer the questions.","pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f44e0f30802654101609cd7b2fc134194b9c356f9983ab66df30db1c6296803a.png"],"provided":"","items":[{"id":"b4040.i01","label":"1","prompt":"What is the Space Age?","options":[],"type":"qa/open"},{"id":"b4040.i02","label":"2","prompt":"What are countries competing with one another for?","options":[],"type":"qa/open"},{"id":"b4040.i03","label":"3","prompt":"What are some goals of future space travel?","options":[],"type":"qa/open"},{"id":"b4040.i04","label":"4","prompt":"What is one difference between public and private companies?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4040.i01","label":"1","prompt":"What is the Space Age?","options":[],"type":"qa/open"},{"kind":"item","id":"b4040.i02","label":"2","prompt":"What are countries competing with one another for?","options":[],"type":"qa/open"},{"kind":"item","id":"b4040.i03","label":"3","prompt":"What are some goals of future space travel?","options":[],"type":"qa/open"},{"kind":"item","id":"b4040.i04","label":"4","prompt":"What is one difference between public and private companies?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B02-RW-U08-classroom:material:RW-M03","title":"READING 1","text":"NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n[IMAGE_1]\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Administration (NASA) successfully sent another spacecraft, Explorer I, into space. In the years that followed, incredible advances were made. Astronauts orbited Earth and men walked on the moon. The world, it seemed, wanted to learn what was beyond Earth.\n2 Today, space exploration continues, and governments still compete with one another to make new discoveries. In 2012, NASA landed its unmanned $^{3}$ spacecraft Curiosity on Mars in order to collect information about the planet. In 2016, Europe and Russia worked together and sent a spacecraft to Mars. China and India are also working on similar projects. However, there has been one big change: private companies, instead of public government organizations, are entering the Space Race $^{4}$.\n3 SpaceX has been very successful in commercial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.\n4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.\n6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft","screens":["NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n[IMAGE_1]\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Administration (NASA) successfully sent another spacecraft, Explorer I, into space. In the years that followed, incredible advances were made. Astronauts orbited Earth and men walked on the moon. The world, it seemed, wanted to learn what was beyond Earth.","2 Today, space exploration continues, and governments still compete with one another to make new discoveries. In 2012, NASA landed its unmanned $^{3}$ spacecraft Curiosity on Mars in order to collect information about the planet. In 2016, Europe and Russia worked together and sent a spacecraft to Mars. China and India are also working on similar projects. However, there has been one big change: private companies, instead of public government organizations, are entering the Space Race $^{4}$.\n3 SpaceX has been very successful in commercial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.","4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.","6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft"],"sources":[{"page":173,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5da59f54c09fe2e9c56e134a617b13790cb77628a3e3c55148752c2782e8103a.png","width":772,"height":1040}],"kind":"reading"},{"id":"B02-RW-U08-publisher-page:p173","title":"原题 ial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.\n4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.\n6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft","screens":["NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n[IMAGE_1]\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Adminis rseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1080e41b19a0131087231c9488370b1919723395ba8ae7efd6d5e3db37eb6b73.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4056","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":21,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Skim the text on page 177. What type of text is it?","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/256286c53e8fd6835b07fba1c079f3d9a6e3e2f23b69ba144c04e3e990c9264d.png"],"provided":"","items":[{"id":"b4056.i01","label":"1","prompt":"What type of text is the text on page 177?","options":["a story","an essay","a news article"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4056.i01","label":"1","prompt":"What type of text is the text on page 177?","options":["a story","an essay","a news article"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B02-RW-U08-publisher-page:p177","title":"原题或核对备注所引第177页","pages":[177],"text":"","screens":[],"sources":[{"page":177,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0c212e3db7bc6e73b18c62803a6308f9d85b130e3c5de68e6d3a2be07a1a26c.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":64,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4058","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":22,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work with a partner. Read the topic sentences below for paragraphs 2 and 3. Which idea (a or b) do you think each paragraph will include? Read the text and check your answers.","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/256286c53e8fd6835b07fba1c079f3d9a6e3e2f23b69ba144c04e3e990c9264d.png"],"provided":"","items":[{"id":"b4058.i01","label":"1","prompt":"It is true that the universe has thousands of solar systems and there are planets similar to Earth. ____","options":["Experts have looked for signs of life on other planets.","Experts want to know how big the universe is."],"type":"choice/closed"},{"id":"b4058.i02","label":"2","prompt":"A planet needs very particular conditions to support life. ____","options":["Technology can create water and air so that people can live.","It not likely that other planets have the same environment as Earth."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4058.i01","label":"1","prompt":"It is true that the universe has thousands of solar systems and there are planets similar to Earth. ____","options":["Experts have looked for signs of life on other planets.","Experts want to know how big the universe is."],"type":"choice/closed"},{"kind":"item","id":"b4058.i02","label":"2","prompt":"A planet needs very particular conditions to support life. ____","options":["Technology can create water and air so that people can live.","It not likely that other planets have the same environment as Earth."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B02-RW-U08-classroom:material:RW-M04","title":"READING 2","text":"[IMAGE_1]\n1 For many years, people have wondered whether we are the only living things in the universe. Some scientists believe that there must be life on other planets because the universe is so big. However, it is unlikely that there is life on other planets because planets need a very specific environment for life to start. In the end, there are no facts that support the idea of life on other planets.\n2 It is true that the universe has thousands of solar systems and there are planets similar to Earth. During its nine years in space, the very powerful Kepler telescope $^{1}$ found more than 2,600 planets in orbit around stars. In fact, a number of scientists think that one of these planets, named Kepler 22b, has the right conditions – the right atmosphere $^{2}$ and temperature – to support life. However, there is no evidence that there is life on Kepler 22b. Experts argue that even with the best technology we can see no signs of life there. Until research shows us hard evidence, we cannot use Kepler 22b to support the idea of life on other planets.\n3 A planet needs very particular conditions to support life. A planet with life would need to have water, the right temperature and the right mix of chemicals in the atmosphere. Earth has the perfect conditions for life, and it is very unlikely that another planet has exactly the same environment as Earth. In addition, although some experts argue that life might exist on other planets, they have never found evidence to prove it. A report from Princeton University suggests that it is highly unlikely that there is life on other planets. The researchers believe that we don't have enough scientific evidence to decide if there is life on other planets. They say that just because conditions similar to Earth exist on other planets, it doesn't mean that life exists there.\n4 In conclusion, I do not believe that there is life on other planets. Although the universe is very big, a planet with life needs very special conditions. Earth has exactly the right conditions for life. It is not too hot or too cold. It has water, air and the right chemicals. I do not think that any other planets could have exactly the same conditions as Earth. Therefore, I do not think that there could be life on other planets.\n$^{1}$telescope (n) a piece of equipment, in the shape of a tube, that makes things that are far away look bigger or nearer\n$^{2}$atmosphere (n) the layer of gases around a planet","screens":["[IMAGE_1]\n1 For many years, people have wondered whether we are the only living things in the universe. Some scientists believe that there must be life on other planets because the universe is so big. However, it is unlikely that there is life on other planets because planets need a very specific environment for life to start. In the end, there are no facts that support the idea of life on other planets.","2 It is true that the universe has thousands of solar systems and there are planets similar to Earth. During its nine years in space, the very powerful Kepler telescope $^{1}$ found more than 2,600 planets in orbit around stars. In fact, a number of scientists think that one of these planets, named Kepler 22b, has the right conditions – the right atmosphere $^{2}$ and temperature – to support life. However, there is no evidence that there is life on Kepler 22b. Experts argue that even with the best technology we can see no signs of life there. Until research shows us hard evidence, we cannot use Kepler 22b to support the idea of life on other planets.","3 A planet needs very particular conditions to support life. A planet with life would need to have water, the right temperature and the right mix of chemicals in the atmosphere. Earth has the perfect conditions for life, and it is very unlikely that another planet has exactly the same environment as Earth. In addition, although some experts argue that life might exist on other planets, they have never found evidence to prove it. A report from Princeton University suggests that it is highly unlikely that there is life on other planets. The researchers believe that we don't have enough scientific evidence to decide if there is life on other planets. They say that just because conditions similar to Earth exist on other planets, it doesn't mean that life exists there.","4 In conclusion, I do not believe that there is life on other planets. Although the universe is very big, a planet with life needs very special conditions. Earth has exactly the right conditions for life. It is not too hot or too cold. It has water, air and the right chemicals. I do not think that any other planets could have exactly the same conditions as Earth. Therefore, I do not think that there could be life on other planets.\n$^{1}$telescope (n) a piece of equipment, in the shape of a tube, that makes things that are far away look bigger or nearer\n$^{2}$atmosphere (n) the layer of gases around a planet"],"sources":[{"page":177,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0c212e3db7bc6e73b18c62803a6308f9d85b130e3c5de68e6d3a2be07a1a26c.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_8a51f03a204efb0c.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 a 2 b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPag RW-U08-question:b4080","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"What are the reasons the author gives to support their argument? Look at paragraphs 2 and 3.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92b7024b405739b28cbe329b7e751a8e920d6a9c4457d36eca05b4d237660604.png"],"provided":"Paragraph 2: ____\nParagraph 3: ____","items":[{"id":"b4080.i01","label":"Paragraph 2","prompt":"Paragraph 2: ____","options":[],"type":"gap/open"},{"id":"b4080.i02","label":"Paragraph 3","prompt":"Paragraph 3: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Paragraph 2: ____"},{"kind":"text","text":"Paragraph 3: ____"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Paragraph 2: Although Kepler 22b has the right\nconditions, even with the best technology we can see no\nsigns of life there. Until research shows us hard evidence,\nwe cannot use Kepler 22b to support the idea of life on\nother planets.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4081","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read the opinions about funding for space exploration on page 181. Notice that the opinions come from different people and organizations. Underline the sentence or sentences that show each writer's opinion about funding space travel.","pages":[180,181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92b7024b405739b28cbe329b7e751a8e920d6a9c4457d36eca05b4d237660604.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/531586d9a3986a331e6993ab59448a74ad8d76537b3262d4bece52fac56bdc28.png"],"provided":"Source: The International Space Agency\n\nGovernments around the world should spend more money on space programmes. The International Space Station (ISS) is a good example why. The ISS has existed since 1998 and brings together many countries. Astronauts live in space and take part in important experiments. In 2022, astronauts from Japan and Canada went to the ISS for six months to observe the effect of space on the human body. Long-term journeys, such as travelling to Mars, will never happen without this important research. The ISS cost about $100 billion and one country could not pay for that on its own. International space exploration proves that countries can work together. It represents the spirit of partnership. With so much war in the world, governments should spend more money on things they can achieve together. Maybe that will help bring peace.\nSource: A newspaper editorial\n\nThe US has spent more than $16 billion per year on its space programme since 1958. For a long time, the cost was worth it because of the advances made in science and technology. However, space travel is not only expensive, but it is also dangerous. Astronauts have been killed as recently as 2014. In fact, as of 2022, 19 astronauts have died in space and 4 more have died before flight. Also, we shouldn't waste natural resources on building new spacecraft. More money should be spent on people who need clean water and food, on access to education and on medical research. For example, a Japanese study found that a drug made from sea sponges helps treat several types of cancer. And yet 90% of the Earth's oceans are still unexplored. The ocean is a valuable resource. Governments should spend more money on ocean exploration than on space exploration.\nSource: A government agency\n\nUncovering the mysteries of space is a huge task that should continue to be funded. Imagine the discoveries and advances in technology that will be made as countries go farther and farther into space, especially in the race to be the first to Mars. Furthermore, people may need to live on Mars someday because Earth will become too crowded and too hot. Also, asking questions about the universe encourages young people to study Science and Engineering, which is a huge benefit to society. Medical advances are also made as a result of sending humans to space. For example, when astronauts are in space, their bones become weaker and more likely to break. Many elderly people also have weak bones. Drugs that can help elderly people can be tested on astronauts in space. Research done in space can improve life on Earth. Governments should absolutely spend more money on space programmes.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Source: The International Space Agency"},{"kind":"text","text":"Governments around the world should spend more money on space programmes. The International Space Station (ISS) is a good example why. The ISS has existed since 1998 and brings together many countries. Astronauts live in space and take part in important experiments. In 2022, astronauts from Japan and Canada went to the ISS for six months to observe the effect of space on the human body. Long-term journeys, such as travelling to Mars, will never happen without this important research. The ISS cost about $100 billion and one country could not pay for that on its own. International space exploration proves that countries can work together. It represents the spirit of partnership. With so much war in the world, governments should spend more money on things they can achieve together. Maybe that will help bring peace."},{"kind":"text","text":"Source: A newspaper editorial"}],[{"kind":"text","text":"The US has spent more than $16 billion per year on its space programme since 1958. For a long time, the cost was worth it because of the advances made in science and technology. However, space travel is not only expensive, but it is also dangerous. Astronauts have been killed as recently as 2014. In fact, as of 2022, 19 astronauts have died in space and 4 more have died before flight. Also, we shouldn't waste natural resources on building new spacecraft. More money should be spent on people who need clean water and food, on access to education and on medical research. For example, a Japanese study found that a drug made from sea sponges helps treat several types of cancer. And yet 90% of the Earth's oceans are still unexplored. The ocean is a valuable resource. Governments should spend more money on ocean exploration than on space"},{"kind":"text","text":"Source: A government agency"}],[{"kind":"text","text":"Uncovering the mysteries of space is a huge task that should continue to be funded. Imagine the discoveries and advances in technology that will be made as countries go farther and farther into space, especially in the race to be the first to Mars. Furthermore, people may need to live on Mars someday because Earth will become too crowded and too hot. Also, asking questions about the universe encourages young people to study Science and Engineering, which is a huge benefit to society. Medical advances are also made as a result of sending humans to space. For example, when astronauts are in space, their bones become weaker and more likely to break. Many elderly people also have weak bones. Drugs that can help elderly people can be tested on astronauts in space. Research done in space can improve life on Earth. Governments should absolutely"},{"kind":"text","text":"spend more money on space programmes."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a  Governments around the world should spend more\nmoney on space programmes.\nb  More money should be spent on people who need\nclean water and food, on access to education and on\nmedical research. Governments should spend more\nmoney on ocean exploration than on space exploration.\nc  Uncovering the mysteries of space is a huge task that\nshould continue to be funded. Governments should\nabsolutely spend more money on space programmes.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4085","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Complete the T-chart with the reasons and evidence the writers give for and against funding space exploration. List the source (a, b or c) next to each reason you list.","pages":[182],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61152963299215806687e5349f6cd84dff5c6375c6f12d32cdb8fd88cde430de.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>for\u003c/td>\u003ctd>against\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Astronauts take part in important experiments (a)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b4085.i01","label":"for","prompt":"for column of the T-chart","options":[],"type":"gap/open"},{"id":"b408 almansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":67,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4105","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":44,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Look at the essay in Reading 2 again on page 177. Follow the instructions.","pages":[186],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/31af44c719e52b7e6b80566921a5d13617d3b031fd9f764c06d6a401a9974571.png"],"provided":"1 In the introductory paragraph, circle the background information about the topic. Underline the thesis statement.\n2 In the main body paragraphs, highlight the facts, reasons and examples that support the argument.\n3 In the concluding paragraph, circle the phrases that retell the main points in the essay. Underline the writer's opinion.","items":[{"id":"b4105.i01","label":"1","prompt":"In the introductory paragraph, circle the background information about the topic. Underline the thesis statement.","options":[],"type":"select/open"},{"id":"b4105.i02","label":"2","prompt":"In the main body paragraphs, highlight the facts, reasons and examples that support the argument.","options":[],"type":"select/open"},{"id":"b4105.i03","label":"3","prompt":"In the concluding paragraph, circle the phrases that retell the main points in the essay. Underline the writer's opinion.","options":[],"type":"select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 In the introductory paragraph, circle the background information about the topic. Underline the thesis statement."},{"kind":"text","text":"2 In the main body paragraphs, highlight the facts, reasons and examples that support the argument."},{"kind":"text","text":"3 In the concluding paragraph, circle the phrases that retell the main points in the essay. Underline the writer's opinion."}]],"courseMaterials":[{"id":"B02-RW-U08-publisher-page:p177","title":"原题或核对备注所引第177页","pages":[177],"text":"","screens":[],"sources":[{"page":177,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0c212e3db7bc6e73b18c62803a6308f9d85b130e3c5de68e6d3a2be07a1a26c.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Background information: For many years, people have\nwondered whether we are the only living things in the\nuniverse. Some scientists believe that there must be life\non other planets because the universe is so big. However,\nit is unlikely that there is life on other planets because\nplanets need a very specific environment for life to start.\nThesis statement: In the end, there are no facts that\nsupport the idea of life on other planets.\n2 Facts, reasons and examples: There is no evidence that\nthere is life on Kepler 22b. Experts argue that even with\nthe best technology, we can see no signs of life there. A\nplanet needs very particular conditions to have life. It is\nvery unlikely that another planet has exactly the same\nenvironment as Earth. Although some experts argue that\nlife might exist on other planets, they have never found\nevidence to prove it. A recent report from Princeton\nUniversity suggests that it is very unlikely that there is\nlife on other planets. We don’t have enough scientific\nevidence to decide if there is life on other planets. Just\nbecause similar conditions to Earth exist on other planets,\nit doesn’t mean that life exists there.\n3 Phrases that retell the main points in the essay:\nAlthough the universe is very big, a planet with life needs\nvery special conditions. I do not think that any other\nplanets could have exactly the same conditions as Earth.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":67,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U08-question:b4108","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"order":45,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Read the essay question. Look back at the T-chart you completed in Exercise 4 on page 182 and remind yourself of the arguments. What is your opinion?","pages":[187],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/882ea45f148090462366045bfd61fbf47bc2f80c2af9e7be321e2c8b8049c901.png"],"provided":"","items":[{"id":"b4108.i01","label":"1","prompt":"What is your opinion about whether governments should spend more money on space exploration?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B02-RW-U08-question:b4085","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[182]}],"materials":[],"coursePages":[[{"kind":"item","id":"b4108.i01","label":"1","prompt":"What is your opinion about whether governments should spend more money on space exploration?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B02-RW-U08-publisher-page:p182","title":"原题或核对备注所引第182页","pages":[182],"text":"","screens":[],"sources":[{"page":182,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61152963299215806687e5349f6cd84dff5c6375c6f12d32cdb8fd88cde430de.png"}],"kind":"referenced_page","sourceBlock ontext":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/275f6c70d833fc63a1170cd9b7fca12f105f219da3ee4b2072d5c1cafab2814d.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/936e1f54248f39d6c06ebf99-L2RW-U08.mp4","captions":[{"start":0,"end":7.4,"text":"I was strolling on the moon one day in the very, very\nmonth of December..."},{"start":7.4,"end":8.04,"text":"May."},{"start":8.36,"end":9.08,"text":"May."},{"start":9.08,"end":9.32,"text":"May."},{"start":9.5,"end":13.86,"text":"This is the last time a human walked on the moon."},{"start":14.72,"end":18.26,"text":"From 1969 to 1972,"},{"start":19.08,"end":19.68,"text":"the U .S."},{"start":20,"end":21.52,"text":"space agency, NASA,"},{"start":22.14,"end":24.74,"text":"sent people to the moon six times."},{"start":26.94,"end":33.04,"text":"Many people say the Apollo missions are the biggest\nhuman achievement in technology."},{"start":34.46,"end":37.7,"text":"Now, NASA is sending people back to the moon."},{"start":38.96,"end":42.12,"text":"And this time, the astronauts will live there."},{"start":43.6,"end":49.22,"text":"We're going back to the moon, but we're going to live\nand learn and develop new technologies,"},{"start":50.18,"end":53.08,"text":"because we're eventually going to Mars."},{"start":54.26,"end":57.78,"text":"NASA's Artemis mission will build a base on the moon."},{"start":59.68,"end":62.66,"text":"The astronauts will fly there in an Orion rocket,"},{"start":62.96,"end":63.9,"text":"like this one."},{"start":65.3,"end":68.74,"text":"It can carry more astronauts than the Apollo rockets,"},{"start":69.16,"end":70.82,"text":"six, not three."},{"start":77.58,"end":80.66,"text":"It will be safer for them returning to Earth,"},{"start":81.1,"end":81.38,"text":"too."},{"start":82.66,"end":85.3,"text":"That's not all that's different."},{"start":86.94,"end":89.03999999999999,"text":"Apollo, right, was 50 years ago."},{"start":89.18,"end":91.3,"text":"We put the first man on the moon."},{"start":92.12,"end":99,"text":"Artemis is the sister of Apollo, and so it's just\nfitting, because we're going to try to put the first\nwoman on the moon."},{"start":99.08,"end":102.38,"text":"Not try, we are going to put the first woman on the\nmoon."},{"start":102.38,"end":104.42,"text":"Jessica Watkins,"},{"start":104.78,"end":107.46000000000001,"text":"who works at the International Space Station,"},{"start":107.94,"end":111.03999999999999,"text":"hopes that one day she'll stay at the moon base."},{"start":112.84,"end":115.42,"text":"But living on the moon won't be easy."},{"start":116.78,"end":119.5,"text":"The base that they build will need to protect them."},{"start":120.54,"end":121.98,"text":"They'll need to make water."},{"start":123.06,"end":124.42,"text":"They'll need electricity."},{"start":125.9,"end":129.8,"text":"Sending people to the moon will cost $93 billion."},{"start":129.8,"end":134.72,"text":"Some people ask if it is a good way to use money."},{"start":135.68,"end":137.1,"text":"NASA says yes."},{"start":137.82,"end":141.46,"text":"Technology from the Apollo missions has changed the\nworld."},{"start":142.96,"end":146.54,"text":"We use it in more than one ,800 products,"},{"start":147.02,"end":148,"text":"including medicine,"},{"start":148.36,"end":148.74,"text":"food,"},{"start":149.2,"end":149.6,"text":"furniture,"},{"start":150,"end":151.9,"text":"and safety equipment today."},{"start":153.56,"end":156.14,"text":"NASA says Artemis will change the world,"},{"start":156.64,"end":156.8,"text":"too."},{"start":157.72,"end":162.84,"text":"But the most important thing NASA wants to learn is how\nto live on another planet."},{"start":164.52,"end":167.24,"text":"The moon base will prepare people for Mars,"},{"start":167.8,"end":171.56,"text":"a planet where some people think humans could live one\nday."}],"launchInline":true}},{"id":"B02-RW-U08-classroom:material:RW-M03","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5da59f54c09fe2e9c56e134a617b13790cb77628a3e3c55148752c2782e8103a.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n[IMAGE_1]\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Administration (NASA) successfully sent another spacecraft, Explorer I, into space. In the years that followed, incredible advances were made. Astronauts orbited Earth and men walked on the moon. The world, it seemed, wanted to learn what was beyond Earth.","sourcePage":173},{"body":"2 Today, space exploration continues, and governments still compete with one another to make new discoveries. In 2012, NASA landed its unmanned $^{3}$ spacecraft Curiosity on Mars in order to collect information about the planet. In 2016, Europe and Russia worked together and sent a spacecraft to Mars. China and India are also working on similar projects. However, there has been one big change: private companies, instead of public government organizations, are entering the Space Race $^{4}$.\n3 SpaceX has been very successful in commercial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.","sourcePage":173},{"body":"4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.","sourcePage":173},{"body":"6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft","sourcePage":173}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U08-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"NEWS","pages":[{"page":173,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5da59f54c09fe2e9c56e134a617b13790cb77628a3e3c55148752c2782e8103a.png","width":772,"height":1040}],"source":173,"embeddedIn":null,"photo":null,"clearPages":[{"body":"NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n[IMAGE_1]\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Administration (NASA) successfully sent another spacecraft, Explorer I, into space. In the years that followed, incredible advances were made. Astronauts orbited Earth and men walked on the moon. The world, it seemed, wanted to learn what was beyond Earth.","sourcePage":173},{"body":"2 Today, space exploration continues, and governments still compete with one another to make new discoveries. In 2012, NASA landed its unmanned $^{3}$ spacecraft Curiosity on Mars in order to collect information about the planet. In 2016, Europe and Russia worked together and sent a spacecraft to Mars. China and India are also working on similar projects. However, there has been one big change: private companies, instead of public government organizations, are entering the Space Race $^{4}$.\n3 SpaceX has been very successful in commercial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.","sourcePage":173},{"body":"4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.","sourcePage":173},{"body":"6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft","sourcePage":173}],"text":"NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n[IMAGE_1]\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Administration (NASA) successfully sent another spacecraft, Explorer I, into space. In the years that followed, incredible advances were made. Astronauts orbited Earth and men walked on the moon. The world, it seemed, wanted to learn what was beyond Earth.\n2 Today, space exploration continues, and governments still compete with one another to make new discoveries. In 2012, NASA landed its unmanned $^{3}$ spacecraft Curiosity on Mars in order to collect information about the planet. In 2016, Europe and Russia worked together and sent a spacecraft to Mars. China and India are also working on similar projects. However, there has been one big change: private companies, instead of public government organizations, are entering the Space Race $^{4}$.\n3 SpaceX has been very successful in commercial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.\n4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.\n6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_a94aaadefc0d4057.mp3"},"original":{"id":"B02-RW-U08-material:RW-M03","entry":"material:RW-M03","unitId":"B02-RW-U08","book":2,"track":"RW","unit":8,"title":"READING 1","kind":"material","pages":[173],"sourceImages":[{"page":173,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5da59f54c09fe2e9c56e134a617b13790cb77628a3e3c55148752c2782e8103a.png","viewEvidenceReported":true}],"text":"NEWS\nSCIENCE\nDISCOVERIES\nTECHNOLOGY\nEDUCATION\nBLOGS\nCOMMUNITY\n\n[IMAGE_1]\n\n1 In 1957, the Soviet Union sent Sputnik I into space. It was the first successful spacecraft to orbit $^{2}$ Earth, and it started the time period known as the Space Age. A short time later, in the United States, the National Aeronautics and Space Administration (NASA) successfully sent another spacecraft, Explorer I, into space. In the years that followed, incredible advances were made. Astronauts orbited Earth and men walked on the moon. The world, it seemed, wanted to learn what was beyond Earth.\n\n2 Today, space exploration continues, and governments still compete with one another to make new discoveries. In 2012, NASA landed its unmanned $^{3}$ spacecraft Curiosity on Mars in order to collect information about the planet. In 2016, Europe and Russia worked together and sent a spacecraft to Mars. China and India are also working on similar projects. However, there has been one big change: private companies, instead of public government organizations, are entering the Space Race $^{4}$.\n\n3 SpaceX has been very successful in commercial space travel. They designed the spacecraft Dragon in order to deliver supplies to the International Space Station (ISS). In 2012, Dragon was the first commercial spacecraft in history to do that. Elon Musk, the man who started the company, has dreams that go beyond making deliveries. He hopes to build a base on Mars by 2028 and a one million-person city there in the next 50 to 100 years.\n\n4 Another entrepreneur who supports commercial space travel is Sir Richard Branson. He started a private company called Virgin Galactic. Their goal is to open space travel to everyone. The company has sold about 700 future trips to space, some at the high cost of $450,000 per person. Those future space tourists come from countries all over the world and are all different ages.\n\n5 Private companies are lucky in one way. They don't have to wait for money from the government like NASA does. However, that doesn't mean that setbacks $^{5}$ and accidents don't happen. In 2014, Virgin Galactic's VSS Enterprise crashed in the Mojave Desert in the US during a test flight. The 39-year-old pilot, Michael Alsbury, was killed. In 2023, the SpaceX spacecraft Starship exploded on its first flight after around two or three minutes. No one was hurt and Elon Musk said they were going to try again in a few months.\n\n6 The race to explore the universe continues and many private companies are competing. Some of those companies want to take people to the moon and back someday. Others want to take people to Mars. The possibilities are endless. Maybe in our lifetime, those dreams will come true.\n\n[IMAGE_2]\nSir Richard Branson and a Virgin Galactic spacecraft","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b4036"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_a94aaadefc0d4057.mp3","continueOnPage":true}},{"id":"B02-RW-U08-classroom:material:RW-M04","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0c212e3db7bc6e73b18c62803a6308f9d85b130e3c5de68e6d3a2be07a1a26c.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"[IMAGE_1]\n1 For many years, people have wondered whether we are the only living things in the universe. Some scientists believe that there must be life on other planets because the universe is so big. However, it is unlikely that there is life on other planets because planets need a very specific environment for life to start. In the end, there are no facts that support the idea of life on other planets.","sourcePage":177},{"body":"2 It is true that the universe has thousands of solar systems and there are planets similar to Earth. During its nine years in space, the very powerful Kepler telescope $^{1}$ found more than 2,600 planets in orbit around stars. In fact, a number of scientists think that one of these planets, named Kepler 22b, has the right conditions – the right atmosphere $^{2}$ and temperature – to support life. However, there is no evidence that there is life on Kepler 22b. Experts argue that even with the best technology we can see no signs of life there. Until research shows us hard evidence, we cannot use Kepler 22b to support the idea of life on other planets.","sourcePage":177},{"body":"3 A planet needs very particular conditions to support life. A planet with life would need to have water, the right temperature and the right mix of chemicals in the atmosphere. Earth has the perfect conditions for life, and it is very unlikely that another planet has exactly the same environment as Earth. In addition, although some experts argue that life might exist on other planets, they have never found evidence to prove it. A report from Princeton University suggests that it is highly unlikely that there is life on other planets. The researchers believe that we don't have enough scientific evidence to decide if there is life on other planets. They say that just because conditions similar to Earth exist on other planets, it doesn't mean that life exists there.","sourcePage":177},{"body":"4 In conclusion, I do not believe that there is life on other planets. Although the universe is very big, a planet with life needs very special conditions. Earth has exactly the right conditions for life. It is not too hot or too cold. It has water, air and the right chemicals. I do not think that any other planets could have exactly the same conditions as Earth. Therefore, I do not think that there could be life on other planets.\n$^{1}$telescope (n) a piece of equipment, in the shape of a tube, that makes things that are far away look bigger or nearer\n$^{2}$atmosphere (n) the layer of gases around a planet","sourcePage":177}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U08-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"[IMAGE_1]","pages":[{"page":177,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0c212e3db7bc6e73b18c62803a6308f9d85b130e3c5de68e6d3a2be07a1a26c.png","width":772,"height":1040}],"source":177,"embeddedIn":null,"photo":null,"clearPages":[{"body":"[IMAGE_1]\n1 For many years, people have wondered whether we are the only living things in the universe. Some scientists believe that there must be life on other planets because the universe is so big. However, it is unlikely that there is life on other planets because planets need a very specific environment for life to start. In the end, there are no facts that support the idea of life on other planets.","sourcePage":177},{"body":"2 It is true that the universe has thousands of solar systems and there are planets similar to Earth. During its nine years in space, the very powerful Kepler telescope $^{1}$ found more than 2,600 planets in orbit around stars. In fact, a number of scientists think that one of these planets, named Kepler 22b, has the right conditions – the right atmosphere $^{2}$ and temperature – to support life. However, there is no evidence that there is life on Kepler 22b. Experts argue that even with the best technology we can see no signs of life there. Until research shows us hard evidence, we cannot use Kepler 22b to support the idea of life on other planets.","sourcePage":177},{"body":"3 A planet needs very particular conditions to support life. A planet with life would need to have water, the right temperature and the right mix of chemicals in the atmosphere. Earth has the perfect conditions for life, and it is very unlikely that another planet has exactly the same environment as Earth. In addition, although some experts argue that life might exist on other planets, they have never found evidence to prove it. A report from Princeton University suggests that it is highly unlikely that there is life on other planets. The researchers believe that we don't have enough scientific evidence to decide if there is life on other planets. They say that just because conditions similar to Earth exist on other planets, it doesn't mean that life exists there.","sourcePage":177},{"body":"4 In conclusion, I do not believe that there is life on other planets. Although the universe is very big, a planet with life needs very special conditions. Earth has exactly the right conditions for life. It is not too hot or too cold. It has water, air and the right chemicals. I do not think that any other planets could have exactly the same conditions as Earth. Therefore, I do not think that there could be life on other planets.\n$^{1}$telescope (n) a piece of equipment, in the shape of a tube, that makes things that are far away look bigger or nearer\n$^{2}$atmosphere (n) the layer of gases around a planet","sourcePage":177}],"text":"[IMAGE_1]\n1 For many years, people have wondered whether we are the only living things in the universe. Some scientists believe that there must be life on other planets because the universe is so big. However, it is unlikely that there is life on other planets because planets need a very specific environment for life to start. In the end, there are no facts that support the idea of life on other planets.\n2 It is true that the universe has thousands of solar systems and there are planets similar to Earth. During its nine years in space, the very powerful Kepler telescope $^{1}$ found more than 2,600 planets in orbit around stars. In fact, a number of scientists think that one of these planets, named Kepler 22b, has the right conditions – the right atmosphere $^{2}$ and temperature – to support life. However, there is no evidence that there is life on Kepler 22b. Experts argue that even with the best technology we can see no signs of life there. Until research shows us hard evidence, we cannot use Kepler 22b to support the idea of life on other planets.\n3 A planet needs very particular conditions to support life. A planet with life would need to have water, the right temperature and the right mix of chemicals in the atmosphere. Earth has the perfect conditions for life, and it is very unlikely that another planet has exactly the same environment as Earth. In addition, although some experts argue that life might exist on other planets, they have never found evidence to prove it. A report from Princeton University suggests that it is highly unlikely that there is life on other planets. The researchers believe that we don't have enough scientific evidence to decide if there is life on other planets. They say that just because conditions similar to Earth exist on other planets, it doesn't mean that life exists there.\n4 In conclusion, I do not believe that there is life on other planets. Although the universe is very big, a planet with life needs very special conditions. Earth has exactly the right conditions for life. It is not too hot or too cold. It has water, air and the right chemicals. I do not think that any other planets could have exactly the same conditions as Earth. Therefore, I do not think that there could be life on other planets.\n$^{1}$telescope (n) a piece of equipment, in the shape of a tube, that makes things that are far away look bigger or nearer\n$^{2}$atmosphere (n) the layer of gases around a planet","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_8a51f03a204efb0c.mp3"},"original":{"id":"B02-RW-U08-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U08","book":2,"track":"RW","unit":8,"title":"READING 2","kind":"material","pages":[177],"sourceImages":[{"page":177,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0c212e3db7bc6e73b18c62803a6308f9d85b130e3c5de68e6d3a2be07a1a26c.png","viewEvidenceReported":true}],"text":"[IMAGE_1]\n\n1 For many years, people have wondered whether we are the only living things in the universe. Some scientists believe that there must be life on other planets because the universe is so big. However, it is unlikely that there is life on other planets because planets need a very specific environment for life to start. In the end, there are no facts that support the idea of life on other planets.\n2 It is true that the universe has thousands of solar systems and there are planets similar to Earth. During its nine years in space, the very powerful Kepler telescope $^{1}$ found more than 2,600 planets in orbit around stars. In fact, a number of scientists think that one of these planets, named Kepler 22b, has the right conditions – the right atmosphere $^{2}$ and temperature – to support life. However, there is no evidence that there is life on Kepler 22b. Experts argue that even with the best technology we can see no signs of life there. Until research shows us hard evidence, we cannot use Kepler 22b to support the idea of life on other planets.\n3 A planet needs very particular conditions to support life. A planet with life would need to have water, the right temperature and the right mix of chemicals in the atmosphere. Earth has the perfect conditions for life, and it is very unlikely that another planet has exactly the same environment as Earth. In addition, although some experts argue that life might exist on other planets, they have never found evidence to prove it. A report from Princeton University suggests that it is highly unlikely that there is life on other planets. The researchers believe that we don't have enough scientific evidence to decide if there is life on other planets. They say that just because conditions similar to Earth exist on other planets, it doesn't mean that life exists there.\n4 In conclusion, I do not believe that there is life on other planets. Although the universe is very big, a planet with life needs very special conditions. Earth has exactly the right conditions for life. It is not too hot or too cold. It has water, air and the right chemicals. I do not think that any other planets could have exactly the same conditions as Earth. Therefore, I do not think that there could be life on other planets.\n\n$^{1}$telescope (n) a piece of equipment, in the shape of a tube, that makes things that are far away look bigger or nearer\n$^{2}$atmosphere (n) the layer of gases around a planet","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b4061"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_8a51f03a204efb0c.mp3","continueOnPage":true}},{"id":"B02-RW-U08-classroom:review-1","book":2,"unit":8,"track":"RW","topic":"THE UNIVERSE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[189],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3278895dad152a93cbf0fb8839ed0d9d1d5238b6272aee9b380fbc3794473447.png"],"layout":"list","instruction":"Review the words.","flow":{"kind function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+
 (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;
 const size=c.feedback?.pageSize??(plan?.showAll?Math.max(1,items.length):plan?.kind==="definitions"?3:c.layout==="grid"?6:equalOptions?3:sourceItems.some(x=>x.options?.length>2)?2:4);
 const chunks=items.length?Array.from({length:Math.ceil(items.length/size)},(_,i)=>items.slice(i*size,(i+1)*size)):[[]];
 return {table,equalOptions,bank:equalOptions?sourceItems[0].options:[],chunks,provided,decks};
}
function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){
 return '<div class="split">'+groups.map(group=>'<section class="panel v-block">'+group.map(block=>
  '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';
}
function materialSplit(decks,task,feedback){
 const tabs=decks.map((deck,i)=>'<button type="button" data-deck="'+i+'" aria-pressed="'+(i===0)+'">'+esc(deck.label)+'</button>').join("");
 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+
  '<section class="panel v-block material-task" data-fixed-task aria-label="课堂任务">'+task+'</section></div>';
}
function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function originalButton(c,page,label){
 return '<button type="button" data-original-case="'+esc(c.id)+'" data-original-page="'+page+'">'+label+'</button>';
