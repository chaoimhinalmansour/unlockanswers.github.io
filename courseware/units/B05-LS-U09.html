u think that the use of robots can enable people to enjoy a better work-life balance?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8989.i04","label":"4","prompt":"Should there be regulations governing the use of robots in the workplace, and if so, should these aim to ensure fair and safe working conditions for robots?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"open-response","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b8992","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":2,"module":"WATCH AND LISTEN","ex":"1","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"Work with a partner. Discuss the questions.","pages":[192],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac347a7277ab0f6738a09023a6853dfafd41b1aa106ec2e7eac83759405bc7da.png"],"provided":"Work with a partner. Discuss the questions.","items":[{"id":"b8992.i01","label":"1","prompt":"What is the meaning of artificial intelligence (AI)?","options":[],"type":"discuss/open"},{"id":"b8992.i02","label":"2","prompt":"What human tasks do robots excel at?","options":[],"type":"discuss/open"},{"id":"b8992.i03","label":"3","prompt":"What human abilities are difficult to replicate in robots?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8992.i01","label":"1","prompt":"What is the meaning of artificial intelligence (AI)?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8992.i02","label":"2","prompt":"What human tasks do robots excel at?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8992.i03","label":"3","prompt":"What human abilities are difficult to replicate in robots?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Artificial Intelligence (AI) means\ncreating computer systems that can\nlearn, make decisions, and solve\nproblems like humans.\n2 Robots excel at repetitive tasks, heavy\nlifting, precise manufacturing, and data\nprocessing. They handle jobs that need\naccuracy and endurance, which humans\nmight find exhausting or boring.\n3 Difficult abilities to replicate include\nhuman creativity, emotions, social\nunderstanding, and complex\ndecision-making that requires intuition\nand empathy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b8993","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":3,"module":"WATCH AND LISTEN","ex":"2","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"You are going to watch a video about an unusual robot. Before you watch, look at the photos from the video. Discuss the questions with your partner.","pages":[192],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac347a7277ab0f6738a09023a6853dfafd41b1aa106ec2e7eac83759405bc7da.png"],"provided":"You are going to watch a video about an unusual robot. Before you watch, look at the photos from the video. Discuss the questions with your partner.","items":[{"id":"b8993.i01","label":"1","prompt":"Is the robot shown in the pictures different from other robots that you have seen? If yes, how is it different? If no, where have you seen similar robots?","options":[],"type":"discuss/open"},{"id":"b8993.i02","label":"2","prompt":"The robot in the pictures is an anthropomimetic robot; it mimics the human body. In what ways is it human-like?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8993.i01","label":"1","prompt":"Is the robot shown in the pictures different from other robots that you have seen? If yes, how is it different? If no, where have you seen similar robots?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8993.i02","label":"2","prompt":"The robot in the pictures is an anthropomimetic robot; it mimics the human body. In what ways is it human-like?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Most robots that I have seen – the\nones that work in factories and places\nlike that – just look like machines. This\nrobot looks different to that as it has\nsome human features. I have seen some\nexamples of robots that have a human\nbody shape and that can walk, but I\ndon’t think those are typical.\n2 This robot has a human body shape\nto the extent that it has arms and\nshoulders, and the torso looks like\nhuman beings. The hands are also\nsimilar to humans but it doesn’t have a\n‘head’. Instead it has a large ‘eye’ and it\ndoesn’t seem to have legs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[{"page":192,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac347a7277ab0f6738a09023a6853dfafd41b1aa106ec2e7eac83759405bc7da.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b8997","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video and check your predictions in Exercise 2. Which statement best expresses the main idea of the video?","pages":[192],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac347a7277ab0f6738a09023a6853dfafd41b1aa106ec2e7eac83759405bc7da.png"],"provided":"Watch the video and check your predictions in Exercise 2. Which statement best expresses the main idea of the video?","items":[{"id":"b8997.i01","label":"1","prompt":"Which statement best expresses the main idea of the video?","options":["In order to replicate human intelligence, robots need a human-like body.","Until now, robots have not been able to mimic human movements."],"type":"choice/open"}],"layout":"list","references":[{"id":"B05-LS-U09-question:b8993","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[192]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8997.i01","label":"1","prompt":"Which statement best expresses the main idea of the video?","options":["In order to replicate human intelligence, robots need a human-like body.","Until now, robots have not been able to mimic human movements."],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/a9a29eaf7e1f1592fce8deb3-L5LS-U09.mp4","captions":[{"start":6.96,"end":12.3,"text":"I've come to meet a scientist who has built the world's\nfirst anthropomimetic robot,"},{"start":13.82,"end":16.86,"text":"which means it mimics the human body."},{"start":21.45,"end":27.24,"text":"Because he believes that our physical form actually\nhelps shape the way we think."},{"start":27.24,"end":28.84,"text":"And without a body,"},{"start":29.64,"end":31.72,"text":"artificial intelligence cannot exist."},{"start":33.5,"end":36.62,"text":"What we're interested in is how the brain controls the\nbody."},{"start":36.86,"end":40.48,"text":"And having built the body, we've realised what a\nserious problem that is."},{"start":41.74,"end":43.92,"text":"This robot, called Eke Robot,"},{"start":44.44,"end":45.06,"text":"obviously has"},{"start":45.06,"end":45.36,"text":"no"},{"start":45.36,"end":46.88,"text":"blood, skin or flesh."},{"start":47.58,"end":49.76,"text":"But it has bones, joints,"},{"start":50.12,"end":53.22,"text":"muscles and tendons that move exactly like ours."},{"start":54,"end":57.64,"text":"So it's able to have human -like interactions with its\nworld."},{"start":59.34,"end":66.04,"text":"Now, this is an extraordinary piece of engineering, but\nhow does it help in actually getting insight into\nintelligence?"},{"start":66.46,"end":70.3,"text":"We're interested in what is known as embodied\nintelligence."},{"start":70.68,"end":76,"text":"And this is the idea that your intelligence is not a\nsort of abstract, free intelligence."},{"start":76.38,"end":81.38,"text":"It's actually tied very much to having a body, and in\nparticular to having a human body."},{"start":81.38,"end":89.4,"text":"Now, in order to investigate this, what we had to do\nwas build a robot that had as near to a human body as\nwe could manage."},{"start":89.92,"end":101.22,"text":"Then we can begin investigating how the way it\ninteracts with the world enables it to develop a\nparticular sort of intelligence for dealing with\nobjects and so on."},{"start":101.6,"end":105.72,"text":"And once we get on that track, we'll be able to see how\nthat intelligence,"},{"start":106.08,"end":112.18,"text":"I won't call it a mind, I'll just call it an\nintelligence, how that is actually determined and\nconditioned by its body."},{"start":112.42,"end":116.36,"text":"And you think it'll be distinct from the sort of\nintelligence that..."},{"start":116.86,"end":118.4,"text":"Does it know it's talking about me?"},{"start":119.02000000000001,"end":120.76,"text":"It seems to be very..."},{"start":120.76,"end":129.54,"text":"The sort of intelligence that, before they were doing\nthings in robots, it was sort of computers, and that\ndoesn't really have a sense of a body at all, I mean,\nit's sort of a box."},{"start":130.06,"end":142.8,"text":"What happened when people started trying to make robots\nthat were controlled by AI and computers is that they\nfound that the things that we thought would be\ndifficult, like playing drafts or something like that,\nwere extremely easy."},{"start":143.22,"end":146.4,"text":"What was really difficult was actually moving the\npieces."},{"start":146.98,"end":151.54,"text":"So the interaction with the world is very, very\ndifficult and requires a lot of computation."},{"start":152.02,"end":153.44,"text":"But we're completely unaware of this."},{"start":155.62,"end":162.56,"text":"Eke Robot suggests that human intelligence simply\ncannot be divorced from the human body that created it."},{"start":163.6,"end":168.26,"text":"So the hunt for AI has ended up on an alternative path."},{"start":170.68,"end":172.52,"text":"It's not about hardware and software,"},{"start":173.22,"end":175.98,"text":"but about trying to replicate human biology."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":64,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b8999","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Answer the questions.","pages":[193],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6e0ca2a8589cc5870a90e68385bb5e99a597039121a3bd31c6844b69ab60b97.png"],"provided":"Watch again. Answer the questions.","items":[{"id":"b8999.i01","label":"1","prompt":"What is the importance of a body in creating AI?","options":[],"type":"qa/open"},{"id":"b8999.i02","label":"2","prompt":"What parts of the robot's body resemble the human body?","options":[],"type":"qa/open"},{"id":"b8999.i03","label":"3","prompt":"How does creating human-like robot help scientists understand human intelligence?","options":[],"type":"qa/open"},{"id":"b8999.i04","label":"4","prompt":"In what ways were the first robots different from the human-like robots?","options":[],"type":"qa/open"},{"id":"b8999.i05","label":"5","prompt":"What type of tasks were difficult for the first robots to perform? Why?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[ ould happen in wider society if scientists actually managed to create a human-like machine?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Reasons for creating human-like\nmachines might include understanding\nhuman intelligence better, helping with\ntasks that require a personal touch\n(like caregiving), exploring new forms\nof companionship, and advancing\ntechnology to improve human life.\n2 Yes, I agree; human intelligence is\ndeeply connected to our bodies,\nsenses, and emotions. These physical\nand emotional experiences shape our\nunderstanding and reactions, which\nwould be hard to fully capture in\na machine.\n3 If scientists created a human-like\nmachine, society might face both\nexcitement and concern. It could lead\nto incredible advances in healthcare and\nsupport services, but it might also spark\ndebates over ethics, job impacts, and\nthe nature of human identity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":65,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9006","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":8,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO L l":"4","prompt":"What kind of fear is exemplified by the example of these workers?","options":[],"type":"qa/open"},{"id":"b9015.i05","label":"5","prompt":"What did some people in the 1820s think of travelling by train?","options":[],"type":"qa/open"},{"id":"b9015.i06","label":"6","prompt":"What does the train example illustrate?","options":[],"type":"qa/open"},{"id":"b9015.i07","label":"7","prompt":"What technology was believed to cause cancer in the late 1990s?","options":[],"type":"qa/open"},{"id":"b9015.i08","label":"8","prompt":"What differentiates normal feelings from irrational feelings according to the speaker?","options":[],"type":"qa/open"},{"id":"b9015.i09","label":"9","prompt":"What do innovators and early adopters have in common?","options":[],"type":"qa/open"},{"id":"b9015.i10","label":"10","prompt":"When is the tipping point in the adoption of technology?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-LS-U09-question:b9011","kind":"student-work","title":"LISTENING 1 Ex 3","pages":[195]},{"id":"B05-LS-U09-question:b9012","kind":"student-work","title":"LISTENING 1 Ex 4","pages":[195]},{"id":"B05-LS-U09-question:b9014","kind":"student-work","title":"LISTENING 1 Ex 5","pages":[196]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9015.i01","label":"1","prompt":"What does the example of computer phobia illustrate?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i02","label":"2","prompt":"What happened to the workers in the late eighteenth and early nineteenth centuries?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i03","label":"3","prompt":"How did the government react to the workers' protests?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i04","label":"4","prompt":"What kind of fear is exemplified by the example of these workers?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i05","label":"5","prompt":"What did some people in the 1820s think of travelling by train?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i06","label":"6","prompt":"What does the train example illustrate?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i07","label":"7","prompt":"What technology was believed to cause cancer in the late 1990s?","options":[],"type":"qa/open"}],[{"kind":"item","id":"b9015.i08","label":"8","prompt":"What differentiates normal feelings from irrational feelings according to the speaker?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i09","label":"9","prompt":"What do innovators and early adopters have in common?","options":[],"type":"qa/open"},{"kind":"item","id":"b9015.i10","label":"10","prompt":"When is the tipping point in the adoption of technology?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  People can have irrational responses to new technology.\n2 They lost their jobs to machines.\n3  The British government made damaging machines a\ncapital offence (punishable by death).\n4 a rational fear\n5  They feared that travelling at the incredible speed of\n30 miles an hour could kill you; that peoples’ organs\nwould melt or explode while travelling on the train at\nthis velocity; that people might not be able to breathe;\nthat passing trains would harm crops and livestock, and\nso on.\n6  an irrational fear of technology – one that is not based\non scientific facts\n7  In the late 1990s, large sections of the population were\nconvinced that using mobile phones caused brain tumours.\n8  We do need to distinguish between a rational fear of\ntechnology (for instance, when machines threaten to\ntake over our jobs) and an irrational fear (which is often\nunfounded and based on hearsay and speculation).\n9  Both innovators and early adopters are distinguished\nfrom the other groups by two factors: they are able to\ntake financial risks, and they perform leadership roles\nin their social networks.\n10  Once the early majority starts to buy into the new\ntechnology, the late majority has no choice but to\nadopt it – this is the tipping point in its adoption.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":65,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9017","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":14,"module":"LISTENING 1","ex":"7","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Answer the questions. Use your notes or Audio script 9.1 on page 264 to help you. Then compare your answers with a partner.","pages":[197],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b61c8bffe16f32a1e9906cdae14de6a6edb1fd2e60118890fc05cc8f878b92d3.png"],"provided":"Answer the questions. Use your notes or Audio script 9.1 on page 264 to help you. Then compare your answers with a partner.","items":[{"id":"b9017.i01","label":"1","prompt":"The lecturer expresses some bias when describing the groups of people mentioned in her lecture. Which group of people is she biased against? Which groups of people is she biased towards?","options":[],"type":"qa/open"},{"id":"b9017.i02","label":"2","prompt":"Which words, expressions and statements used by the speaker show bias?","options":[],"type":"qa/open"},{"id":"b9017.i03","label":"3","prompt":"The lecturer implies that all laggards are technophobes. Do you agree with her opinion?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-LS-U09-question:b9014","kind":"student-work","title":"LISTENING 1 Ex 5","pages":[196]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9017.i01","label":"1","prompt":"The lecturer expre ____ __________ new technology.","options":[],"type":"gap/open"},{"kind":"item","id":"b9020.i02","label":"2","prompt":"Many specialized __________ were __________ during the nineteenth century.","options":[],"type":"gap/open"},{"kind":"item","id":"b9020.i03","label":"3","prompt":"These speculations had no scientific __________.","options":[],"type":"gap/open"},{"kind":"item","id":"b9020.i04","label":"4","prompt":"Similar accusations __________ been levelled at modern technologies.","options":[],"type":"gap/open"},{"kind":"item","id":"b9020.i05","label":"5","prompt":"They're usually the __________ __________ adopt new technology.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 9.3","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62c1d93be54623b040b18628331dca18d1136976f4b50d67a59d9fee6bbbf6c3.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 resentment; towards 2 crafts; lost 3 grounds 4 have\n5 last; to","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9022","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":17,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[198],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61716534e040336bc7dc1e21ec90847e0cb62f1aa4934f519e37f901e76bddab.png"],"provided":"Work with a partner. Discuss the questions.","items":[{"id":"b9022.i01","label":"1","prompt":"Look at the graph on page 195 again. Which group of adopters do you think you belong to? Why?","options":[],"type":"discuss/open"},{"id":"b9022.i02","label":"2","prompt":"What advice would you give to workers who lose their jobs due to automation?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9022.i01","label":"1","prompt":"Look at the graph on page 195 again. Which group of adopters do you think you belong to? Why?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9022.i02","label":"2","prompt":"What advice would you give to workers who lose their jobs due to automation?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think I’m in the early majority because I\nwait until new technology is popular and\nproven, but I don’t want to be the last to\ntry it.\n2 I’d suggest learning new skills that are\nin demand, especially ones that can’t\nbe automated easily, like creative\nproblem-solving or jobs involving\nhuman interaction.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9023","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":18,"module":"LISTENING 1","ex":"11","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Plan and write a 250-word essay on the following statement: 'All technological progress will inevitably have drawbacks, including occasional job losses, but this is the price of progress and we should simply accept it.' Do you agree? Include an introduction, main paragraphs with one current and one historical example, and a conclusion with at least two reasons.","pages":[198],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61716534e040336bc7dc1e21ec90847e0cb62f1aa4934f519e37f901e76bddab.png"],"provided":"Plan and write a 250-word essay on the following statement: 'All technological progress will inevitably have drawbacks, including occasional job losses, but this is the price of progress and we should simply accept it.' Do you agree? Include an introduction, main paragraphs with one current and one historical example, and a conclusion with at least two reasons.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I agree with the statement that all\ntechnological progress will inevitably\nhave drawbacks, including occasional job\nlosses, but I also recognize the challenges\nassociated with this phenomenon.\nOne historical example of technology\nreplacing human jobs is the Industrial\nRevolution in the 18th and 19th centuries.\nThe introduction of machinery in\nmanufacturing processes led to increased\nefficiency but also displaced many\nskilled workers, causing social and\neconomic upheaval.\nA current example is the widespread\nadoption of automation in manufacturing.\nThis has led to the reduction of certain\nmanual-labour jobs. While these\ntechnological advancements contribute\nto increased productivity and economic\ngrowth, they can result in job losses for\nthose with routine and repetitive tasks.\nHowever, I believe that this is a price worth\npaying for material progress. While some\njobs are lost, this creates space for new\nemployment opportunities, often more\nsophisticated ones. Besides, humans are\nhighly adaptable, and will find ways to\ncope with job losses, such as retraining.\nBy investing in these areas, societies can\ncreate a smoother transition for workers\nand reduce the negative impacts of\ntechnological advancements.\nIn conclusion, I agree with the statement\nthat this is the price of progress. The\nkey lies in proactive and compassionate\nmeasures to address the challenges,\nin order to ensure that the benefits of\ntechnology are distributed equitably\nacross society.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9026","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Discuss the meaning of each adjective in the table below. Check your answe d / would look like us.","options":["weren't","wouldn't","looked","would look"],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 were given; may struggle\n2 wouldn’t; looked","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9033","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":25,"module":"LANGUAGE DEVELOPMENT","ex":"7","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite the statements to make them refer to a hypothetical future. In some items, more than one answer is possible.","pages":[200],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/88e98de63f192b8a57c8ed431d786b4661ae533d40382a6dd646b9423cdc4cbf.png"],"provided":"Rewrite the statements to make them refer to a hypothetical future. In some items, more than one answer is possible.","items":[{"id":"b9033.i01","label":"1","prompt":"Once AI takes over, there are going to be super-intelligent robots.","options":[],"type":"gap/open"},{"id":"b9033.i02","label":"2","prompt":"While robots keep evolving, human cognitive skills gradually diminish.","options":[],"type":"gap/open"},{"id":"b9033.i03","label":"3","prompt":"It is difficult for many young people to find part-time jobs because they have been filled by robots.","options":[],"type":"gap/open"},{"id":"b9033.i04","label":"4","prompt":"How people spend the free time created by the widespread use of AI will be determined by how much disposable income they have.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9033.i01","label":"1","prompt":"Once AI takes over, there are going to be super-intelligent robots.","options":[],"type":"gap/open"},{"kind":"item","id":"b9033.i02","label":"2","prompt":"While robots keep evolving, human cognitive skills gradually diminish.","options":[],"type":"gap/open"},{"kind":"item","id":"b9033.i03","label":"3","prompt":"It is difficult for many young people to find part-time jobs because they have been filled by robots.","options":[],"type":"gap/open"},{"kind":"item","id":"b9033.i04","label":"4","prompt":"How people spend the free time created by the widespread use of AI will be determined by how much disposable income they have.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Once AI takes over, there could / might\nbe super-intelligent robots.\n2 While robots kept evolving, human\ncognitive skills could / might\ngradually diminish.\n3 It would / could / might be difficult for\nyoung people to find part-time jobs\nbecause they would / could / might have\nbeen filled by robots.\n4 How people spent the free time created\nby the widespread use of AI would be\ndetermined by how much disposable\nincome they had.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9034","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"order":26,"module":"LANGUAGE DEVELOPMENT","ex":"8","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Imagine a future world where all motor vehicles were driven by AI. Write two sentences about possible benefits, and two about possible drawbacks. Use hypothetical future forms. Then compare your sentences with a partner and discuss the extent to which you agree.","pages":[201],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3ee101a231db531263157b0c6b158826bca5af851627f34a06b6734d8564b4ac.png"],"provided":"Imagine a future world where all motor vehicles were driven by AI. Write two sentences about possible benefits, and two about possible drawbacks. Use hypothetical future forms. Then compare your sentences with a partner and discuss the extent to which you agree.","items":[{"id":"b9034.i01","label":"1","prompt":"Benefits:","options":[],"type":"discuss/open"},{"id":"b9034.i02","label":"2","prompt":"Drawbacks:","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9034.i01","label":"1","prompt":"Benefits:","options":[],"type":"discuss/open"},{"kind":"item","id":"b9034.i02","label":"2","prompt":"Drawbacks:","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Benefits:\nIf people didn’t need to control the vehicle\nthey were in themselves, this could enable\nthem to work or read during the journey,\ninstead of concentrating on the road.\nThe fact that there weren’t any human\ndrivers on the roads could reduce the\nnumber of accidents.\nDrawbacks:\nOnce AI was driving all cars, driving\ninstructors would no longer be needed.\nIt may not be so easy for drivers to take\nspontaneous detours, for example if they\nsaw a country road that they thought\nlooked scenic.\nPersonally, I think the concerns about\npossible drawbacks of driverless cars are\noverstated. As I see it, there are as many\ndisadvantages of driverless vehicles as\nthere are of other labour-saving devices\nsuch as washing machines, namely none. / I\nget a lot of pleasure out of driving so this is\nnot a very appealing development for me.\nI wouldn’t want to be the only human driver\non a road full of driverless vehicles. I think\ngovernments also need to very carefully\nmanage the transition to driverless cars with\nrespect to the job market.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9038","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":27,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Complete the sentences with a word or phrase from the box below, replacing the explanation provided in brackets. Use a dictionary to help you.","pages":[202],"sourceImages":["https://raw.githubusercontent.com/ abel":"6","prompt":"There are several tasks in which computers can easily __________ (do something better than) people, and are less likely to make errors.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open"},{"id":"b9038.i07","label":"7","prompt":"Phones contain several __________ (unnecessary) features which the vast majority of users could quite happily live without.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open"},{"id":"b9038.i08","label":"8","prompt":"I tend to be __________ (suspicious) about accepting cookies, software updates and so on, and only ever click 'Accept' if I don't really have a choice.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9038.i01","label":"1","prompt":"Life would be so much more pleasant if all __________ (boring) household tasks were done by robots.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"1","mode":"choice","option":3}},{"kind":"item","id":"b9038.i02","label":"2","prompt":"It __________ (is obvious) that a new device is always going to be an improvement on an older model, that's why it always makes sense to upgrade if you can afford it.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"2","mode":"choice","option":2}}],[{"kind":"item","id":"b9038.i03","label":"3","prompt":"AI can __________ (realistically copy) human communication so convincingly that it's hard to know whether you're speaking to a chatbot or a real person.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"3","mode":"choice","option":5}},{"kind":"item","id":"b9038.i04","label":"4","prompt":"If you're explaining tech to very young children, a useful __________ (comparison) to use is that if the internet is the world, then each website is a house.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"4","mode":"choice","option":0}}],[{"kind":"item","id":"b9038.i05","label":"5","prompt":"Mobile phone designers appear to have no __________ (sympathy or concern for others), as they have made no effort to ensure that phones are easy for older people to learn to use.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"5","mode":"choice","option":1}},{"kind":"item","id":"b9038.i06","label":"6","prompt":"There are several tasks in which computers can easily __________ (do something better than) people, and are less likely to make errors.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"6","mode":"choice","option":4}}],[{"kind":"item","id":"b9038.i07","label":"7","prompt":"Phones contain several __________ (unnecessary) features which the vast majority of users could quite happily live without.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"7","mode":"choice","option":6}},{"kind":"item","id":"b9038.i08","label":"8","prompt":"I tend to be __________ (suspicious) about accepting cookies, software updates and so on, and only ever click 'Accept' if I don't really have a choice.","options":["analogy","compassion","goes without saying","mundane","outperform","simulate","superfluous","wary"],"type":"gap_select/open","answer":{"label":"8","mode":"choice","option":7}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 mundane 2 goes without saying 3 simulate\n4 analogy 5 compassion 6 outperform\n7 superfluous 8 wary","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9039","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":28,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss to what extent you agree with the statements in Exercise 1.","pages":[202],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1c65081dac0c47e6d0b32b68954878a17710098bb308c9b3b4998f3646fd8d76.png"],"provided":"Work with a partner. Discuss to what extent you agree with the statements in Exercise 1.","items":[],"layout":"list","references":[{"id":"B05-LS-U09-question:b9038","kind":"student-work","title":"LISTENING 2 Ex 1","pages":[202]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 This is definitely true, as repetitive\ndomestic tasks are so tedious. / I’m\nprobably in the minority, but I get a\nlot of satisfaction from cooking and\ncleaning. I find it quite therapeutic after\nspending all day at a computer!\n2 I disagree, because there is always an\nenvironmental cost, and so I believe\nin making things last. / I agree with\nthis, technology goes out of date so\nquickly now. Often you can’t use new\napplications if your device is more than a\nfew years old.\n3 No, I usually know (at least I think I know)\nwhen I’m talking to a bot and not a\nhuman. / This is true to an extent. There\nhave been a few instances where I’d\nthought that I was speaking to another\nperson, until the chatbot informed\nme that it would direct my issue to a\nmember of staff.\n4 I’m not sure this would be clear to\na child. / Yes, I think this analogy\nmay make it easier for the child\nto understand.\n5 Having seen elderly relatives struggle to\nlearn to perform even the most basic of\nfunctions on a phone, such as turning\nit on or answering a call, I have to say\nthat I agree. / Actually, I think that once\nthe phone has been set up for them,\nand they’ve had a few attempts, elderly\npeople can manage to use a mobile\nphone. I think voice recognition will also\nmake this easier in future.\n6 I agree with the first part of the\nstatement, but not the second, as there\nare countless things that humans can\ndo better than computers, such as tell\njokes and understand how another\nperson feels.\n7 Perhaps there are one or two features\nthat are superfluous for me, but there\nwill be others who do need them, and\nafter all, if I don’t need a particular app\nI can just delete it.\n8 No, I’m usually happy to agree to\nwhatever I’m asked to do, whether it’s\nupdating my phone’s operating system\nor agreeing to cookies. / Yes, this is what\nI do. I’m very cautious about sharing any\ndata because I know many companies\nsell this data and I want to protect\nmy privacy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9042","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":29,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a university seminar about the skills that robots and AI have which could lead to them replacing humans at work. Work with a partner. Look at the photographs above and discuss the questions.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0902bd78faa4be90233f9dbeb0f3dd9ca71c65a3e42be9c2ba43c0ccd9ff5906.png"],"provided":"You are going to listen to a university seminar about the skills that robots and AI have which could lead to them replacing humans at work. Work with a partner. Look at the photographs above and discuss the questions.","items":[{"id":"b9042.i01","label":"1","prompt":"What are the advantages and disadvantages of getting robots to do the jobs shown, and how common do you expect such situations to be during your lifetime?","options":[],"type":"discuss/open"},{"id":"b9042.i02","label":"2","prompt":"What jobs have been made superfluous in the past by advances in technology, and how likely is it that something similar will happen in the future?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9042.i01","label":"1","prompt":"What are the advantages and disadvantages of getting robots to do the jobs shown, and how common do you expect such situations to be during your lifetime?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9042.i02","label":"2","prompt":"What jobs have been made superfluous in the past by advances in technology, and how likely is it that something similar will happen in the future?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Advantages include savings in cost and\ntime. A disadvantage is that robots\nwould provide a very impersonal\nexperience, which isn’t suitable in a\nmedical setting, or when teaching young\nchildren. I don’t expect domestic robots\nto become all that popular. It could\nhave happened years ago, but for some\nreason, it never has. However, I think","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[{"page":203,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0902bd78faa4be90233f9dbeb0f3dd9ca71c65a3e42be9c2ba43c0ccd9ff5906.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9043","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":30,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Listen to the introduction to the seminar. Answer the questions.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0902bd78faa4be90233f9dbeb0f3dd9ca71c65a3e42be9c2ba43c0ccd9ff5906.png"],"provided":"Listen to the introduction to the seminar. Answer the questions.","items":[{"id":"b9043.i01","label":"1","prompt":"What does the Images":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5a240cf8cbb3d52f2355b589e6f907f6678f52fdbb9ff8933c2736daa591d9d8.png"],"provided":"Listen again and make detailed notes. Include any names and dates that you hear.","items":[{"id":"b9046.i01","label":"1","prompt":"translation","options":[],"type":"gap/open"},{"id":"b9046.i02","label":"2","prompt":"media","options":[],"type":"gap/open"},{"id":"b9046.i03","label":"3","prompt":"medicine and drug discovery","options":[],"type":"gap/open"},{"id":"b9046.i04","label":"4","prompt":"recruitment","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9046.i01","label":"1","prompt":"translation","options":[],"type":"gap/open"},{"kind":"item","id":"b9046.i02","label":"2","prompt":"media","options":[],"type":"gap/open"},{"kind":"item","id":"b9046.i03","label":"3","prompt":"medicine and drug discovery","options":[],"type":"gap/open"},{"kind":"item","id":"b9046.i04","label":"4","prompt":"recruitment","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 9.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b604d3d4409a71e029fcee60334794d9fb047d48cc87c1d33f35eb82303e3a21.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"area advantages and\ndisadvantages of AI\ntranslation ‘Chinese Room’ analogy\nfrom John Searle\n(philosopher) in 1980, still\nrelevant today: AI simulates\nunderstanding of Chinese\nbut doesn’t understand a\nword of Chinese.\nAI gives the impression\nof expertise, when it\nhas none.\nmedia AI sometimes displays\na lack of understanding\nof human emotions and\nbehaviour, e.g. when\nMicrosoft Start (news\naggregator) published a\nstory with an inappropriate\nquiz question about\nthe death of a young\nwoman. (2023)\nmedicine\nand drug\ndiscovery\nAI may play a key role in\nsaving lives, e.g. in 2020\nMassachusetts Institute of\nTechnology’s antibiotic,\ndeveloped using AI. AI\ngood at recognizing\npatterns, learning and\nworking quickly. Brilliant at\ninstantly detecting signs of\ndiseases which would take\nhumans hours to do.\nPeople may not want to use\nan AI doctor, as they lack\nthe compassion needed.\nHuman doctor who consults\nAI would be the best of\nboth worlds.\nrecruitment AI may decline in popularity\nowing to negative publicity\nabout its accidental\nbias, e.g. favouring male\napplicants to work at\nAmazon because of past\nrecruitment preferences.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":67,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9047","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":33,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Review your notes with a partner. Discuss the questions below, using examples from the seminar.","pages":[204],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5a240cf8cbb3d52f2355b589e6f907f6678f52fdbb9ff8933c2736daa591d9d8.png"],"provided":"Review your notes with a partner. Discuss the questions below, using examples from the seminar.","items":[{"id":"b9047.i01","label":"1","prompt":"Areas where AI works best.","options":[],"type":"discuss/open"},{"id":"b9047.i02","label":"2","prompt":"Areas where humans work best.","options":[],"type":"discuss/open"},{"id":"b9047.i03","label":"3","prompt":"Areas where a combination of humans and AI work best.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U09-question:b9046","kind":"student-work","title":"LISTENING 2 Ex 6","pages":[204]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9047.i01","label":"1","prompt":"Areas where AI works best.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9047.i02","label":"2","prompt":"Areas where humans work best.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9047.i03","label":"3","prompt":"Areas where a combination of humans and AI work best.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 AI seems to work best at analyzing\ndata which means it is great for drug\ndiscovery. The example of MIT using\nAI to identifying a new antibiotic\nshows this.\n2 AI doesn’t understand human emotions\nand behaviour so it is not suitable for\nuse in the media, which reports on\nhuman stories, as demonstrated by the\nexample of Microsoft Start. Also, AI\nlearns from past patterns and cannot\nidentify and correct bias, so it is not\nsuitable for recruitment, as shown by\nAI recruitment system that favoured\nmale applicants.\n3 Medicine is a great example of where\nhumans and AI could work really well\ntogether. AI can detect diseases like\ncancer and diabetes more easily than\ndoctors, but doctors are trained to\nadvise and explain illnesses to patients\nin a sensitive way. Translation is also an\nexample. AI can do most of a translation\nbut a human needs to check that it is\nappropriate to the cultural context.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":67,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9050","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":34,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Read the speculations that the speakers made in the discussion. Listen to extracts 1–6 and note down the support given for each speculation.","pages":[205],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62ca3b713eefc88438f4c7d178bbec5c59c49e72da11a2e9d251da043edd60a4.png"],"provided":"Read the speculations that the speakers made in the discussion. Listen to extracts 1–6 and note down the support given for each speculation.","items":[{"id":"b9050.i01","label":"1","prompt":"People think AI can do more than it really can.","options":[],"type":"qa/key"},{"id":"b9050.i02","label":"2","prompt":"AI will always be less effective than humans.","options":[],"type":"qa/open"},{"id":"b9050.i03","label":"3","prompt":"AI saves many lives.","options":[],"type":"qa/open"},{"id":"b9050.i04","label":"4","prompt":"Humans won't be able to work as effectively as AI.","options":[],"type":"qa/open"},{"id":"b9050.i05","label":"5","prompt":"People probably won't want to consult AI doctors.","options":[],"type":"qa/open"},{"id":"b9050.i06","label":"6","prompt":"It is not rational to worry about jobs being replaced.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9050.i01","label":"1","prompt":"People think AI can do more than it really can.","options":[],"type":"qa/key"},{"kind":"item","id":"b9050.i02","label":"2","prompt":"AI will always be less effective than humans.","options":[],"type":"qa/open"},{"kind":"item","id":"b9050.i03","label":"3","prompt":"AI saves many lives.","options":[],"type":"qa/open"},{"kind":"item","id":"b9050.i04","label":"4","prompt":"Humans won't be able to work as effectively as AI.","options":[],"type":"qa/open"},{"kind":"item","id":"b9050.i05","label":"5","prompt":"People probably won't want to consult AI doctors.","options":[],"type":"qa/open"},{"kind":"item","id":"b9050.i06","label":"6","prompt":"It is not rational to worry about jobs being replaced.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 9.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bbb9beceb6a2689b06899ba8696b1b4d887dda611f1fc4d6527c9803167a07e3.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"2 It has a lack of understanding of human emotions and\nbehaviour, e.g. including the question about how the\nwoman died.\n3 MIT used AI to develop an antibiotic in 2020.\n4 AI can work at very high speeds compared to humans.\n5 An AI doctor would lack compassion, and have no\nunderstanding of what it might mean to a person to\nhear that they have a disease.\n6 It is more likely that people will work alongside AI,\nrather than being replaced by it.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":67,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9051","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":35,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work in small groups. Compare notes on the speculations in Exercise 8. What kind of support did each speaker provide (fact, analogy, opinion, example)?","pages":[205],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62ca3b713eefc88438f4c7d178bbec5c59c49e72da11a2e9d251da043edd60a4.png"],"provided":"Work in small groups. Compare notes on the speculations in Exercise 8. What kind of support did each speaker provide (fact, analogy, opinion, example)?","items":[],"layout":"list","references":[{"id":"B05-LS-U09-question:b9050","kind":"student-work","title":"LISTENING 2 Ex 8","pages":[205]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 analogy 2 example; fact 3 example 4 fact\n5 opinion 6 opinion","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":67,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9053","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":36,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to answer the following questions.","pages":[205],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62ca3b713eefc88438f4c7d178bbec5c59c49e72da11a2e9d251da043edd60a4.png"],"provided":"Work with a partner. Use ideas from Listening 1 and Listening 2 to answer the following questions.","items":[{"id":"b9053.i01","label":"1","prompt":"The lecturer says, 'But AI on its own couldn't run an accountancy firm or a school or a business consultancy.' Think about each of these contexts and how AI's lack of compassion might cause problems.","options":[],"type":"discuss/open"},{"id":"b9053.i02","label":"2","prompt":"Is it inevitable that human jobs will be replaced by automation? Should we try and stop this from happening, and if so, how?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9053.i01","label":"1","prompt":"The lecturer says, 'But AI on its own couldn't run an accountancy firm or a school or a business consultancy.' Think about each of these contexts and how AI's lack of compassion might cause problems.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9053.i02","label":"2","prompt":"Is it inevitable that human jobs will be replaced by automation? Should we try and stop this from happening, and if so, how?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-LS-U09-module:LS-M03","title":"Listening 1 published content","pages":[194,195,196,197,198],"text":"","screens":[],"sources":[{"page":194,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6648478982a7d28ddd5feec82e0fef9a256b83a92510fa8286720186ecc7630e.png"},{"page":195,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e43728299134103cee2703b157be1f3522db936fcf38d2fd770df2790be2f522.png"},{"page":196,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/84ef10ed2ac51f777a3d932663e6cb08c175f1388190b9f89946b5c50e93a8f5.png"},{"page":197,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b61c8bffe16f32a1e9906cdae14de6a6edb1fd2e60118890fc05cc8f878b92d3.png"},{"page":198,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61716534e040336bc7dc1e21ec90847e0cb62f1aa4934f519e37f901e76bddab.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 AI would be excellent for identifying\nfinancial issues in an accountancy firm\nor business consultancy, but it might\nnot make humane decisions about\nhow to cut costs. I also wouldn’t want\nAI to deliver bad news to me, like if I\nwas about to lose my job. In a school,\nit could be useful for timetabling or\nidentifying gaps in students’ learning,\nbut it couldn’t provide the motivational\nor emotional support of a teacher.\n2 I suspect that it is inevitable and that\ntrying to prevent it from happening\nis unrealistic and pointless. / I think\ncompanies will try to automate tasks\nwhere they can in order to save money.\nHowever, if customers are dissatisfied\nand this affects sales, companies will\nhave to respond to this. I never use the\nself-checkouts at supermarkets for\nthis reason.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":67,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9056","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read the opinions about developing AI. Do you agree or disagree? Why? Compare your ideas with a partner.","pages":[206],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6bc72fc73df48b06e16ad668ae63ce08063cdaf2a78168016ed4a26bf750b044.png"],"provided":"Read the opinions about developing AI. Do you agree (✓) or disagree (✗)? Why? Compare your ideas with a partner.","items":[{"id":"b9056.i01","label":"1","prompt":"Even if AI could make medical evaluations and diagnoses, it should not act as a doctor.","options":["agree","disagree"],"type":"choice/open"},{"id":"b9056.i02","label":"2","prompt":"Robots might evolve so much that there would be no need for human engineers to maintain them. They would create their own super-intelligent robots and take over the world.","options":["agree","disagree"],"type":"choice/open"},{"id":"b9056.i03","label":"3","prompt":"We should not be afraid of robots; they are very useful.","options":["agree","disagree"],"type":"choice/open"},{"id":"b9056.i04","label":"4","prompt":"Developing AI and robots that can do human tasks is unwise; if we continue, there will be no jobs left for us in the future.","options":["agree","disagree"],"type":"choice/open"},{"id":"b9056.i05","label":"5","prompt":"If robots had emotions like humans, they'd need laws to protect them.","options":["agree","disagree"],"type":"choice/open"},{"id":"b9056.i06","label":"6","prompt":"Robots can never completely replace humans.","options":["agree","disagree"],"type":"choice/open"},{"id":"b9056.i07","label":"7","prompt":"People will not accept the use of AI and robots in some jobs.","options":["agree","disagree"],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9056.i01","label":"1","prompt":"Even if AI could make medical evaluations and diagnoses, it should not act as a doctor.","options":["agree","disagree"],"type":"choice/open"},{"kind":"item","id":"b9056.i02","label":"2","prompt":"Robots might evolve so much that there would be no need for human engineers to maintain them. They would create their own super-intelligent robots and take over the world.","options":["agree","disagree"],"type":"choice/open"},{"kind":"item","id":"b9056.i03","label":"3","prompt":"We should not be afraid of robots; they are very useful.","options":["agree","disagree"],"type":"choice/open"}],[{"kind":"item","id":"b9056.i04","label":"4","prompt":"Developing AI and robots that can do human tasks is unwise; if we continue, there will be no jobs left for us in the future.","options":["agree","disagree"],"type":"choice/open"},{"kind":"item","id":"b9056.i05","label":"5","prompt":"If robots had emotions like humans, they'd need laws to protect them.","options":["agree","disagree"],"type":"choice/open"},{"kind":"item","id":"b9056.i06","label":"6","prompt":"Robots can never completely replace humans.","options":["agree","disagree"],"type":"choice/open"}],[{"kind":"item","id":"b9056.i07","label":"7","prompt":"People will not accept the use of AI and robots in some jobs.","options":["agree","disagree"],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 ✓ AI can help, but a human doctor\nshould make the final decision because\nthey understand patients better.\n2 ✗ That seems unlikely; robots would still\nneed humans for complex decisions.\n3 ✓ Yes, they make many tasks easier and\nsafer for people.\n4 ✓ It’s a risk; too many robots doing\nhuman tasks could limit our job options.\n5 ✗ Emotions in robots would be artificial,\nso I don’t think laws would\nbe necessary.\n6 ✓ Robots can’t fully replace human\nintuition and empathy.\n7 ✓ Some roles, like teaching or caregiving,\nmight always need a human touch.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9058","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"The ideas in Exercise 1 are opinions; they are not well-developed or supported. Work with a partner and add supporting details to each idea.","pages":[206],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6bc72fc73df48b06e16ad668ae63ce08063cdaf2a78168016ed4a26bf750b044.png"],"provided":"The ideas in Exercise 1 are opinions; they are not well-developed or supported. Work with a partner and add supporting details to each idea.","items":[],"layout":"list","references":[{"id":"B05-LS-U09-question:b9056","kind":"material-reference","title":"CRITICAL THINKING Ex 1","pages":[206]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U09-publisher-sheet:b9056","title":"CRITICAL THINKING Ex 1 原题面","pages":[206],"text":"Read the opinions about developing AI. Do you agree (✓) or disagree (✗)? Why? Compare your ideas with a partner.","screens":["Read the opinions about developing AI. Do you agree (✓) or disagree (✗)? Why? Compare your ideas with a partner."],"sources":[{"page":206,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6bc72fc73df48b06e16ad668ae63ce08063cdaf2a78168016ed4a26bf750b044.png"}],"kind":"task_sheet","sourceBlockIds":["b9056"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 AI can help diagnose diseases quickly\nand accurately, but a human doctor\nbrings experience, empathy, and moral\njudgment that AI can’t provide, making\nthem essential.\n2 Robots need regular programming and\ntroubleshooting, and creating their own\nrobots would require more complexity\nthan they’re capable of now.\n3 Robots handle repetitive and dangerous\ntasks well, which makes them valuable in\nplaces like factories, hospitals, and even\nspace missions.\n4 While robots improve efficiency, if\nthey handle too many roles, especially\nroutine ones, humans may struggle to\nfind work without new skills.\n5 Simulated emotions wouldn’t be real\nfeelings, so giving robots legal rights\nmay not be logical, especially since they\nfollow programmed responses.\n6 Robots lack genuine human qualities\nlike creativity, empathy, and critical\njudgment, so humans will likely always\nbe needed in certain fields.\n7 In fields like teaching, therapy, and art,\npeople expect a human connection that\nrobots can’t truly offer, so AI might not\nbe widely accepted there.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9059","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Decide on a profession you would like to investigate and talk about. You may select one from the list below, or come up with one of your own.","pages":[207],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a010947f0fea7d63a27eaac5b50e33ab57bd6e0c1709fa8cab6618ccadf95c6d.png"],"provided":"Decide on a profession you would like to investigate and talk about. You may select one from the list below, or come up with one of your own.","items":[{"id":"b9059.i01","label":"1","prompt":"Choose a profession.","options":["home plumber","dentist","graphic designer","civil engineer","chef","pharmacist","bank clerk","nurse","artist","firefighter","software developer","lorry driver","HR manager","journalist","salesperson in a shop"],"type":"select/open"}],"layout":"list","
