things?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9070","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":45,"module":"PREPARATION FOR SPEAKING","ex":"4","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"Listen to these sentences. Underline all the consonants that change their sound. Work with a partner. Practise reading the questions. Use assimilation where appropriate.","pages":[209],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c560441f57e15fc7bb029c345b1ce1443a1d60f083553ddf62da43d9547558a6.png"],"provided":"Listen to these sentences. Underline all the consonants that change their sound. Work with a partner. Practise reading the questions. Use assimilation where appropriate.","items":[{"id":"b9070.i01","label":"1","prompt":"Could you be more specific?","options":[],"type":"gap/open"},{"id":"b9070.i02","label":"2","prompt":"What do you mean by saying that?","options":[],"type":"gap/open"},{"id":"b9070.i03","label":"3","prompt":"Don't you think that robots will soon be in every workplace?","options":[],"type":"gap/open"},{"id":"b9070.i04","label":"4","prompt":"Would you elaborate, please?","options":[],"type":"gap/open"},{"id":"b9070.i05","label":"5","prompt":"Wouldn't you see a robot doctor, if you needed medical attention?","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9070.i01","label":"1","prompt":"Could you be more specific?","options":[],"type":"gap/open"},{"kind":"item","id":"b9070.i02","label":"2","prompt":"What do you mean by saying that?","options":[],"type":"gap/open"},{"kind":"item","id":"b9070.i03","label":"3","prompt":"Don't you think that robots will soon be in every workplace?","options":[],"type":"gap/open"},{"kind":"item","id":"b9070.i04","label":"4","prompt":"Would you elaborate, please?","options":[],"type":"gap/open"},{"kind":"item","id":"b9070.i05","label":"5","prompt":"Wouldn't you see a robot doctor, if you needed medical attention?","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 9.9","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/65531b3b902cea6def60860c4e6566f1205afec1a7e4e73c54e19cf1c48d3c0e.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Could you be more specific?\n2 What do you mean by saying that?\n3 Don’t you think that robots will soon be in every\nworkplace?\n4 Would you elaborate, please?\n5 Wouldn’t you see a robot doctor, if you needed\nmedical attention?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9074","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":46,"module":"SPEAKING TASK","ex":"1","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Work in groups of four. Take turns telling your classmates about the profession you have chosen. Focus on the key skills in the profession and whether it would be possible for AI to accomplish each of the skills. Ask the speaker for clarification if anything is unclear.","pages":[209],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c560441f57e15fc7bb029c345b1ce1443a1d60f083553ddf62da43d9547558a6.png"],"provided":"Work in groups of four. Take turns telling your classmates about the profession you have chosen. Focus on the key skills in the profession and whether it would be possible for AI to accomplish each of the skills. Ask the speaker for clarification if anything is unclear.","items":[],"layout":"list","references":[{"id":"B05-LS-U09-question:b9059","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[207]},{"id":"B05-LS-U09-question:b9060","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[207]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A: I chose graphic design as a profession\nto investigate. It needs creativity, visual\ncommunication, technical skills,\nand adaptability.\nB: Interesting! Do you think AI could do\nthose things?\nA: Well, AI can help with technical tasks,\nlike resizing images, but creativity and\nadapting styles for different clients still\nneed a human touch.\nC: So, it’s not possible for AI to fully replace\ngraphic designers?\nA: Right. AI can speed up simple tasks, but\nit lacks the originality and nuance that good\ndesigners bring.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9075","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":47,"module":"SPEAKING TASK","ex":"2","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"As a group, decide if you agree with each classmate's assessment of the profession's future.","pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/05006f02e9850a18ff19b5fda80d591a040887a411cec89d07ee4e641245304e.png"],"provided":"As a group, decide if you agree with each classmate's assessment of the profession's future. Make sure your arguments are well supported. Consider possible counter-arguments.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"As a group, decide if you agree with each classmate's assessment of the profession's future. Make sure your arguments are well supported. Consider possible counter-arguments."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I agree with my classmate’s assessment of\ngraphic design’s future. While AI is getting\nbetter at basic tasks, like resizing images\nor applying templates, it still lacks the\ncreativity, personal style, and adaptability\nrequired for unique designs tailored to\nclient needs. The true value of a graphic\ndesigner lies in their ability to bring original\nideas and creative problem-solving, which\nAI, even at its most advanced, struggles to\nreplicate. Some may argue that AI could\neventually learn to mimic creative styles,\nbut originality and understanding cultural\ntrends go beyond programmed patterns.\nTherefore, while AI will assist designers, it\nwon’t fully replace them anytime soon.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9076","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":48,"module":"SPEAKING TASK","ex":"3","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Consider how you might use the hypothetical future forms that you studied on page 200 in your discussion. Work with a partner to complete the following sentences.","pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/05006f02e9850a18ff19b5fda80d591a040887a411cec89d07ee4e641245304e.png"],"provided":"Consider how you might use the hypothetical future forms that you studied on page 200 in your discussion. Work with a partner to complete the following sentences.","items":[{"id":"b9076.i01","label":"1","prompt":"Firms would be unable to remain competitive in the future if they didn't save costs by using AI to complete a high proportion of tasks previously done by humans.","options":[],"type":"gap/key"},{"id":"b9076.i02","label":"2","prompt":"Once a company started replacing human employees with AI or robots, __________","options":[],"type":"gap/open"},{"id":"b9076.i03","label":"3","prompt":"Even if old jobs became superfluous, __________","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9076.i01","label":"1","prompt":"Firms would be unable to remain competitive in the future if they didn't save costs by using AI to complete a high proportion of tasks previously done by humans.","options":[],"type":"gap/key"},{"kind":"item","id":"b9076.i02","label":"2","prompt":"Once a company started replacing human employees with AI or robots, __________","options":[],"type":"gap/open"},{"kind":"item","id":"b9076.i03","label":"3","prompt":"Even if old jobs became superfluous, __________","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-LS-U09-publisher-page:p200","title":"原题或核对备注所引第200页","pages":[200],"text":"","screens":[],"sources":[{"page":200,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/88e98de63f192b8a57c8ed431d786b4661ae533d40382a6dd646b9423cdc4cbf.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 it may find that it was able to make\nsubstantial savings on labour costs.\n3 new ones would become necessary, so\noverall job losses would be limited.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pd f4d8574afdae6c989e097094dd043/content/05006f02e9850a18ff19b5fda80d591a040887a411cec89d07ee4e641245304e.png"],"provided":"Work in your groups. Practise presenting your arguments and refuting any counterarguments.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U09-question:b9081","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":2,"order":51,"module":"SPEAKING TASK","ex":"6","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"DISCUSS"},"instruction":"Have a class discussion with the following goals:","pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/05006f02e9850a18ff19b5fda80d591a040887a411cec89d07ee4e641245304e.png"],"provided":"Have a class discussion with the following goals:","items":[{"id":"b9081.i01","label":"1","prompt":"Decide which skills determine the likelihood that a profession will be replaced by AI.","options":[],"type":"discuss/open"},{"id":"b9081.i02","label":"2","prompt":"Place each of the professions into one of three categories: Very likely / reasonably likely / unlikely to be replaced by 2040.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9081.i01","label":"1","prompt":"Decide which skills determine the likelihood that a profession will be replaced by AI.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9081.i02","label":"2","prompt":"Place each of the professions into one of three categories: Very likely / reasonably likely / unlikely to be replaced by 2040.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"a AI is more likely to replace roles where\ntasks are repetitive, predictable, and\ndata-driven. Skills that reduce the\nlikelihood of AI replacement include:\nCreativity and originality – skills that\nrequire innovation, such as design or\ncreative writing, are harder for AI\nto replicate.\nComplex problem-solving – professions\nthat involve unpredictable situations\nand nuanced decision-making, such as\nemergency response or certain medical\nroles, are less likely to be replaced.\nEmotional intelligence and human\ninteraction – roles requiring empathy,\nnegotiation, or complex interpersonal\nskills, like nursing and therapy, are\nharder for AI to replace.\nPhysical dexterity and motor skills –\nroles involving fine motor skills in\nunpredictable environments, such as\nplumbing and firefighting, are difficult\nfor robots and AI to handle effectively.\nEthical and judgment-based decision-\nmaking – professions where decisions\ndepend on ethical considerations, like\nHR management or journalism, are\nharder for AI to replicate.\nb\nvery likely\nto be\nreplaced\nreasonably\nlikely to be\nreplaced\nunlikely\nto be\nreplaced\nbank clerk\nlorry driver\nsalesperson\nin a shop\npharmacist\njournalist\nchef\ngraphic\ndesigner\nhome\nplumber\ndentist\ncivil\nengineer\nnurse\nartist\nfirefighter\nsoftware\ndeveloper\nhr manager\nUNIT 10\nUNLOCK YOUR\nKNOWLEDGE\npage 213\n1 In my opinion the younger the better,\nespecially if a child under the age of\naround seven starts learning a language,\nas they are more likely to gain native-\nlike mastery of the language. / I think\nmotivation is very important. Adults\ncan learn languages well but they need\nto have lots of motivation and be very\nconsistent. As adults we have more\nresponsibilities whereas children often\ndon’t have much choice about how they\nspend their time, and they spend a lot of\nit learning!\n2 Strong communication skills, motivation\nand skill at imitating sounds are key\nskills. People are certainly able to train\nthemselves to become more effective\nlearners to an extent, and can do this\nby using learning strategies that have\nproved effective for other people.\n3 Languages change because older\nspeakers die and new ones grow up\nin a world that is different to the one\ntheir parents were young in. In my own\nlanguage (Polish), we now have a lot of\nimports from English, often with Polish\ngrammatical endings added on. There\nare also a lot of new words related to\ntechnology which didn’t exist a few\nyears ago.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":29,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":30,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]}],"lessonFlow":{"entries":[{"id":"B05-LS-U09-classroom:opening-1-cards","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"module":"Word Cards","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESS erences":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"mimic","pos":"(v)","definition":"in science, to copy or imitate another living thing","example":"Some insects mimic the shapes of leaves.","wordAudio":"mimic","cardWord":false},{"term":"anthropomimetic","pos":"(adj)","definition":"in robotics, human-like in senses, behaviour, movement and interaction","example":"An anthropomimetic robot might move its hands in a human-like way.","wordAudio":"anthropomimetic","cardWord":false},{"term":"condition","pos":"(v)","definition":"to train or influence a person or an animal so that they do a particular thing without thinking about it","example":"Researchers can condition an animal to respond to a sound.","wordAudio":"condition","cardWord":false},{"term":"draughts","pos":"(n)","definition":"a game for two people, each with twelve circular pieces that they move on a board with black and white squares","example":"We played a game of draughts after dinner.","wordAudio":"draughts","cardWord":false}]]}},{"id":"B05-LS-U09-classroom:video","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[192],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac347a7277ab0f6738a09023a6853dfafd41b1aa106ec2e7eac83759405bc7da.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/a9a29eaf7e1f1592fce8deb3-L5LS-U09.mp4","captions":[{"start":6.96,"end":12.3,"text":"I've come to meet a scientist who has built the world's\nfirst anthropomimetic robot,"},{"start":13.82,"end":16.86,"text":"which means it mimics the human body."},{"start":21.45,"end":27.24,"text":"Because he believes that our physical form actually\nhelps shape the way we think."},{"start":27.24,"end":28.84,"text":"And without a body,"},{"start":29.64,"end":31.72,"text":"artificial intelligence cannot exist."},{"start":33.5,"end":36.62,"text":"What we're interested in is how the brain controls the\nbody."},{"start":36.86,"end":40.48,"text":"And having built the body, we've realised what a\nserious problem that is."},{"start":41.74,"end":43.92,"text":"This robot, called Eke Robot,"},{"start":44.44,"end":45.06,"text":"obviously has"},{"start":45.06,"end":45.36,"text":"no"},{"start":45.36,"end":46.88,"text":"blood, skin or flesh."},{"start":47.58,"end":49.76,"text":"But it has bones, joints,"},{"start":50.12,"end":53.22,"text":"muscles and tendons that move exactly like ours."},{"start":54,"end":57.64,"text":"So it's able to have human -like interactions with its\nworld."},{"start":59.34,"end":66.04,"text":"Now, this is an extraordinary piece of engineering, but\nhow does it help in actually getting insight into\nintelligence?"},{"start":66.46,"end":70.3,"text":"We're interested in what is known as embodied\nintelligence."},{"start":70.68,"end":76,"text":"And this is the idea that your intelligence is not a\nsort of abstract, free intelligence."},{"start":76.38,"end":81.38,"text":"It's actually tied very much to having a body, and in\nparticular to having a human body."},{"start":81.38,"end":89.4,"text":"Now, in order to investigate this, what we had to do\nwas build a robot that had as near to a human body as\nwe could manage."},{"start":89.92,"end":101.22,"text":"Then we can begin investigating how the way it\ninteracts with the world enables it to develop a\nparticular sort of intelligence for dealing with\nobjects and so on."},{"start":101.6,"end":105.72,"text":"And once we get on that track, we'll be able to see how\nthat intelligence,"},{"start":106.08,"end":112.18,"text":"I won't call it a mind, I'll just call it an\nintelligence, how that is actually determined and\nconditioned by its body."},{"start":112.42,"end":116.36,"text":"And you think it'll be distinct from the sort of\nintelligence that..."},{"start":116.86,"end":118.4,"text":"Does it know it's talking about me?"},{"start":119.02000000000001,"end":120.76,"text":"It seems to be very..."},{"start":120.76,"end":129.54,"text":"The sort of intelligence that, before they were doing\nthings in robots, it was sort of computers, and that\ndoesn't really have a sense of a body at all, I mean,\nit's sort of a box."},{"start":130.06,"end":142.8,"text":"What happened when people started trying to make robots\nthat were controlled by AI and computers is that they\nfound that the things that we thought would be\ndifficult, like playing drafts or something like that,\nwere extremely easy."},{"start":143.22,"end":146.4,"text":"What was really difficult was actually moving the\npieces."},{"start":146.98,"end":151.54,"text":"So the interaction with the world is very, very\ndifficult and requires a lot of computation."},{"start":152.02,"end":153.44,"text":"But we're completely unaware of this."},{"start":155.62,"end":162.56,"text":"Eke Robot suggests that human intelligence simply\ncannot be divorced from the human body that created it."},{"start":163.6,"end":168.26,"text":"So the hunt for AI has ended up on an alternative path."},{"start":170.68,"end":172.52,"text":"It's not about hardware and software,"},{"start":173.22,"end":175.98,"text":"but about trying to replicate human biology."}],"launchInline":true}},{"id":"B05-LS-U09-classroom:resource:b9005","book":5,"unit":9,"track":"LS","topic":"TECHNOLOGY","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[194],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

  const pages=decks[selected].pages, material=pages[subpage];

 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';

   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();

function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

 const box=main?.getBoundingClientRect();

 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;

 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
