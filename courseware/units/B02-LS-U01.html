"variant":false,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bdf4ebadb690d3dece096452539b0439c523dbc5aad9e3864cc4691c42082b3f.jpg"],"fullTextSha256":"04d74654166b3d70a7db904c21bd1dcb6d3c5a6da48a665a1c2dc0aa94764286","activeMaterials":[]},{"id":"B02-LS-U01-question:b2461","track":"LS","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"1","pages":[22],"layout":"table","instruction":"Work with a partner. Write the past simple forms of the verbs below. Then take turns saying them. Use a dictionary to help you.","provided":"","items":[{"id":"b2461.i01","label":"1","prompt":"agree ____","type":"gap/closed","options":[]},{"id":"b2461.i02","label":"2","prompt":"is / are ____","type":"gap/closed","options":[]},{"id":"b2461.i03","label":"3","prompt":"drive ____","type":"gap/closed","options":[]},{"id":"b2461.i04","label":"4","prompt":"go ____","type":"gap/closed","options":[]},{"id":"b2461.i05","label":"5","prompt":"shop ____","type":"gap/closed","options":[]},{"id":"b2461.i06","label":"6","prompt":"sit ____","type":"gap/closed","options":[]}],"requirements":[{"localId":"a01","actionZh":"写出agree的一般过去式。","sourceItemIds":["b2461.i01"],"page":22,"sourceQuote":"agree ____","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一个过去式词形","constraintsZh":[],"cuesZh":["原页编号：1"],"sourceTargetCue":"agree ____"},{"localId":"a02","actionZh":"写出is/are的一般过去式形式。","sourceItemIds":["b2461.i02"],"page":22,"sourceQuote":"is / are ____","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一个过去式词形","constraintsZh":[],"cuesZh":["原页编号：2"],"sourceTargetCue":"is / are ____"},{"localId":"a03","actionZh":"写出drive的一般过去式。","sourceItemIds":["b2461.i03"],"page":22,"sourceQuote":"drive ____","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一个过去式词形","constraintsZh":[],"cuesZh":["原页编号：3"],"sourceTargetCue":"drive ____"},{"localId":"a04","actionZh":"写出go的一般过去式。","sourceItemIds":["b2461.i04"],"page":22,"sourceQuote":"go ____","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一个过去式词形","constraintsZh":[],"cuesZh":["原页编号：4"],"sourceTargetCue":"go ____"},{"localId":"a05","actionZh":"写出shop的一般过去式。","sourceItemIds":["b2461.i05"],"page":22,"sourceQuote":"shop ____","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一个过去式词形","constraintsZh":[],"cuesZh":["原页编号：5"],"sourceTargetCue":"shop ____"},{"localId":"a06","actionZh":"写出sit的一般过去式。","sourceItemIds":["b2461.i06"],"page":22,"sourceQuote":"sit ____","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一个过去式词形","constraintsZh":[],"cuesZh":["原页编号：6"],"sourceTargetCue":"sit ____"},{"localId":"a07","actionZh":"与同伴轮流读出六个一般过去式词形。","sourceItemIds":[],"page":22,"sourceQuote":"Then take turns saying them.","sourceOrigin":"original-image","sourceQuotePage":22,"outputZh":"一次轮流朗读","constraintsZh":[],"sourceTargetCue":""}],"additionalTargets":[],"references":[],"materials":[{"id":"B02-LS-U01-resource:b2460","title":"REVIEW OF THE PAST SIMPLE","kind":"resource","pages":[22],"text":"Use the past simple to talk about events that happened in the past. Regular verbs end in -ed. Use the same form for all persons (I, you, we, they, he, she, it).\nFor negative statements in the past simple, use did not (didn't) + infinitive.\nThey did not live in Dubai for a long time.\nI didn't see much of Seoul.\nBe is an irregular verb. The past forms of be are was / were. Use was with I / he / she / it. Use were with you / we / they.\nWhen I was younger, I went to Türkiye.\nThey were very strange buildings.\nFor negative statements with be, use was not (wasn't) or were not (weren't). Do not use did / didn't with be.\nMarco wasn't in Mexico City last week.\nThey weren't there for a long time.\n\u003ctable>\u003ctr>\u003ctd colspan=\"2\">spelling rules for regular verbs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rule\u003c/td>\u003ctd>example\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed to the infinitive.\u003c/td>\u003ctd>He visited Colombia. (visit → visited)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -d to verbs that end in -e.\u003c/td>\u003ctd>She lived there for 20 years. (live → lived)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Double the consonant before -ed for verbs of one syllable that end in a vowel and a consonant.\u003c/td>\u003ctd>We planned to take a trip to Kenya. (plan → planned)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Take off the -y and add -ied for verbs that end in a consonant and -y.\u003c/td>\u003ctd>I studied for hours last night. (study → studied)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed when the word ends in a vowel and -y.\u003c/td>\u003ctd>The children played outside. (play → played)\u003c/td>\u003c/tr>\u003c/table>\nIrregular verbs do not end in -ed. Try to learn the past forms of these verbs.\nThey made them out of rock. (make → made)\nI saw some tall buildings. (see → saw)\nI went to Türkiye. (go → went)\nThey built the bridge in 1345. (build → built)\nThey put houses there. (put → put)"},{"id":"B02-LS-U01-resource:b2462","title":"Past simple questions","kind":"resource","pages":[23],"text":"Past simple questions\nFor Yes / No questions in the past simple, use Did + subject + infinitive for all persons (I, you, we, they, he, she, it).\nDid they build a new bridge last year?\nDid you live in Dubai for a long time?\nFor information questions, use a Wh- word (Where, When, Why, etc.) + did + subject + infinitive.\nWhere did he go?\nWhy did he move to Cairo?\nWhen did they build their house?\nFor past simple questions with the verb be, use Was / Were + subject.\nWas the trip interesting?\nWere the houses ancient?\nWas he at school in July?"}],"media":[],"sourceBlockIds":["b2461"],"inputNotes":[],"issues":[],"variant":false,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b46978f29782da5c0589b3984ef11e6f8a2df9e4502d91b227e007927024a9ed.jpg"],"fullTextSha256":"4c08f537f4ddf91e0ffdeccf75136b92d5030ee92f6882c74b6f2dce8193947b","activeMaterials":[],"presentation":{"kind":"items","showAll":true,"twoColumns":true,"itemCount":6},"sourcePages":[22],"feedback":{"mode":"after","kind":"answer","source":"听说教师书第 24 页，学生书第 22 页","rows":[{"label":"1","prompt":"agree ____","answer":"agreed","basis":"规则动词以 e 结尾，添加 d。","sourcePage":22,"anchor":{"kind":"gaps"}},{"label":"2","prompt":"is / are ____","answer":"was / were","basis":"be 的两个不规则过去式。","sourcePage":22,"anchor":{"kind":"gaps"}},{"label":"3","prompt":"drive ____","answer":"drove","basis":"drive 是不规则动词。","sourcePage":22,"anchor":{"kind":"gaps"}},{"label":"4","prompt":"go ____","answer":"went","basis":"go 是不规则动词。","sourcePage":22,"anchor":{"kind":"gaps"}},{"label":"5","prompt":"shop ____","answer":"shopped","basis":"shop 是单音节词，双写 p 后添加 ed。","sourcePage":22,"anchor":{"kind":"gaps"}},{"label":"6","prompt":"sit ____","answer":"sat","basis":"sit 是不规则动词。","sourcePage":22,"anchor":{"kind":"gaps"}}],"placement":"inline","pageSize":6}},{"id":"B02-LS-U01-question:b2463","track":"LS","lesson":1,"order":21,"module":"LANGUAGE DEVELOPMENT","ex":"2","pages":[23],"layout":"list","instruction":"Complete the sentences with the past simple form of the verbs in brackets. Compare your answers with a partner.","provided":"","items":[{"id":"b2463.i01","label":"1","prompt":"Years ago, people ____ (live) in boats on the river.","type":"gap/open","options":[]},{"id":"b2463.i02","label":"2","prompt":"On Tuesday, we ____ (walk) in the park.","type":"gap/open","options":[]},{"id":"b2463.i03","label":"3","prompt":"I ____ (not call) my sister last week.","type":"gap/open","options":[]},{"id":"b2463.i04","label":"4","prompt":"They ____ (stay) at a hotel by the sea.","type":"gap/open","options":[]},{"id":"b2463.i05","label":"5","prompt":"He ____ (try) to relax every day.","type":"gap/open","options":[]}],"requirements":[{"localId":"a01","actionZh":"把live变为一般过去式，补全“过去人们住在河上船里”的句子。","sourceItemIds":["b2463.i01"],"page":23,"sourceQuote":"Years ago, people ____ (live) in boats on the river.","sourceOrigin":"original-image","sourceQuotePage":23,"outputZh":"一个过去时句子","constraintsZh":[],"cuesZh":["原页编号：1"],"sourceTargetCue":"Years ago, people ____ (live) in boats on the river."},{"localId":"a02","actionZh":"把walk变为一般过去式，补全周二在公园散步的句子。","sourceItemIds":["b2463.i02"],"page":23,"sourceQuote":"On Tuesday, we ____ (walk) in the park.","sourceOrigin":"original-image","sourceQuotePage":23,"outputZh":"一个过去时句子","constraintsZh":[],"cuesZh":["原页编号：2"],"sourceTargetCue":"On Tuesday, we ____ (walk) in the park."},{"localId":"a03","actionZh":"把not call变为一般过去时否定形式，补全上周未打电话的句子。","sourceItemIds":["b2463.i03"],"page":23,"sourceQuote":"I ____ (not call) my sister last week.","sourceOrigin":"original-image","sourceQuotePage":23,"outputZh":"一个过去时句子","constraintsZh":[],"cuesZh":["原页编号：3"],"sourceTargetCue":"I ____ (not call) my sister last week."},{"localId":"a04","actionZh":"把stay变为一般过去式，补全住海边酒店的句子。","sourceItemIds":["b2463.i04"],"page":23,"sourceQuote":"They ____ (stay) at a hotel by the sea.","sourceOrigin":"original-image","sourceQuotePage":23,"outputZh":"一个过去时句子","constraintsZh":[],"cuesZh":["原页编号：4"],"sourceTargetCue":"They ____ (stay) at a hotel by the sea."},{"localId":"a05","actionZh":"把try变为一般过去式，补全每天努力放松的句子。","sourceItemIds":["b2463.i05"],"page":23,"sourceQuote":"He ____ (try) to relax every day.","sourceOrigin":"original-image","sourceQuotePage":23,"outputZh":"一个过去时句子","constraintsZh":[],"cuesZh":["原页编号：5"],"sourceTargetCue":"He ____ (try) to relax every day."},{"localId":"a06","actionZh":"与同伴逐项比较五个过去时句子的答案。","sourceItemIds":[],"page":23,"sourceQuote":"Compare your answers with a partner.","sourceOrigin":"original-image","sourceQuotePage":23,"outputZh":"一次五项答案比较","constraintsZh":[],"sourceTargetCue":""}],"additionalTargets":[],"references":[],"materials":[{"id":"B02-LS-U01-resource:b2460","title":"REVIEW OF THE PAST SIMPLE","kind":"resource","pages":[22],"text":"Use the past simple to talk about events that happened in the past. Regular verbs end in -ed. Use the same form for all persons (I, you, we, they, he, she, it).\nFor negative statements in the past simple, use did not (didn't) + infinitive.\nThey did not live in Dubai for a long time.\nI didn't see much of Seoul.\nBe is an irregular verb. The past forms of be are was / were. Use was with I / he / she / it. Use were with you / we / they.\nWhen I was younger, I went to Türkiye.\nThey were very strange buildings.\nFor negative statements with be, use was not (wasn't) or were not (weren't). Do not use did / didn't with be.\nMarco wasn't in Mexico City last week.\nThey weren't there for a long time.\n\u003ctable>\u003ctr>\u003ctd colspan=\"2\">spelling rules for regular verbs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rule\u003c/td>\u003ctd>example\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed to the infinitive.\u003c/td>\u003ctd>He visited Colombia. (visit → visited)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -d to verbs that end in -e.\u003c/td>\u003ctd>She lived there for 20 years. (live → lived)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Double the consonant before -ed for verbs of one syllable that end in a vowel and a consonant.\u003c/td>\u003ctd>We planned to take a trip to Kenya. (plan → planned)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Take off the -y and add -ied for verbs that end in a consonant and -y.\u003c/td>\u003ctd>I studied for hours last night. (study → studied)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed when the word ends in a vowel and -y.\u003c/td>\u003ctd>The children played outside. (play → played)\u003c/td>\u003c/tr>\u003c/table>\nIrregular verbs do not end in -ed. Try to learn the past forms of these verbs.\nThey made them out of rock. (make → made)\nI saw some tall buildings. (see → saw)\nI went to Türkiye. (go → went)\nThey built the bridge in 1345. (build → built)\nThey put houses there. (put → put)"},{"id":"B02-LS-U01-resource:b2462","title":"Past simple questions","kind":"resource","pages":[23],"text":"Past simple questions\nFor Yes / No questions in the past simple, use Did + subject + infinitive for all persons (I, you, we, they, he, she, it).\nDid they build a new bridge last year?\nDid you live in Dubai for a long time?\nFor information questions, use a Wh- word (Where, When, Why, etc.) + did + subject + infinitive.\nWhere did he go?\nWhy did he move to Cairo?\nWhen did they build their house?\nFor past simple questions with the verb be, use Was / Were + subject.\nWas the trip interesting?\nWere the houses ancient?\nWas he at school in July?"}],"media":[],"sourceBlockIds":["b2463"],"inputNotes":[],"issues":[],"variant":false,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a24c3944ae67681a3bf245c31e8398e0114aa872dd4681e79ba3cc6b2aa53d88.jpg"],"fullTextSha256":"128f39f8abe3adc21d44eca43304404362d9de94817f859644fb3774c9efaed3","activeMaterials":[],"feedback":{"mode":"after","kind":"answer","source":"听说教师书第 24 页与学生书第 23 页","rows":[{"label":"1","prompt":"Years ago, people ____ (live) in boats on the river.","answer":"lived","basis":"live 以 e 结尾，过去式加 d。","sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"2","prompt":"On Tuesday, we ____ (walk) in the park.","answer":"walked","basis":"walk 的规则过去式加 ed。","sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"3","prompt":"I ____ (not call) my sister last week.","answer":"didn't call","basis":"过去式否定用 did not 或 didn’t 加动词原形。","sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"4","prompt":"They ____ (stay) at a hotel by the sea.","answer":"stayed","basis":"stay 末尾是元音字母加 y，过去式直接加 ed。","sourcePage":23,"anchor":{"kind":"gaps"}},{"label":"5","prompt":"He ____ (try) to relax every day.","answer":"tried","basis":"try 末尾是辅音字母加 y，过去式变 y 为 i 再加 ed。","sourcePage":23,"anchor":{"kind":"gaps"}}],"placement":"inline","pageSize":5}},{"id":"B02-LS-U01-question:b2469","track":"LS","lesson":1,"order":22,"module":" in Mexico City last week.\nThey weren't there for a long time.\n\u003ctable>\u003ctr>\u003ctd colspan=\"2\">spelling rules for regular verbs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rule\u003c/td>\u003ctd>example\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed to the infinitive.\u003c/td>\u003ctd>He visited Colombia. (visit → visited)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -d to verbs that end in -e.\u003c/td>\u003ctd>She lived there for 20 years. (live → lived)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Double the consonant before -ed for verbs of one syllable that end in a vowel and a consonant.\u003c/td>\u003ctd>We planned to take a trip to Kenya. (plan → planned)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Take off the -y and add -ied for verbs that end in a consonant and -y.\u003c/td>\u003ctd>I studied for hours last night. (study → studied)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed when the word ends in a vowel and -y.\u003c/td>\u003ctd>The children played outside. (play → played)\u003c/td>\u003c/tr>\u003c/table>\nIrregular verbs do not end in -ed. Try to learn the past forms of these verbs.\nThey made them out of rock. (make → made)\nI saw some tall buildings. (see → saw)\nI went to Türkiye. (go → went)\nThey built the bridge in 1345. (build → built)\nThey put houses there. (put → put)"},{"id":"B02-LS-U01-resource:b2462","title":"Past simple questions","kind":"resource","pages":[23],"text":"Past simple questions\nFor Yes / No questions in the past simple, use Did + subject + infinitive for all persons (I, you, we, they, he, she, it).\nDid they build a new bridge last year?\nDid you live in Dubai for a long time?\nFor information questions, use a Wh- word (Where, When, Why, etc.) + did + subject + infinitive.\nWhere did he go?\nWhy did he move to Cairo?\nWhen did they build their house?\nFor past simple questions with the verb be, use Was / Were + subject.\nWas the trip interesting?\nWere the houses ancient?\nWas he at school in July?"}],"media":[],"sourceBlockIds":["b2471"],"inputNotes":[],"issues":[],"variant":false,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a24c3944ae67681a3bf245c31e8398e0114aa872dd4681e79ba3cc6b2aa53d88.jpg"],"fullTextSha256":"a6ed45cddcccea63a56ffa3642e90fbe91f042ef518b5fea4f8db6dc98a4fe4b","activeMaterials":[],"feedback":{"mode":"after","kind":"answer","source":"听说教师书第 24 页与学生书第 23 页","rows":[{"label":"2","prompt":"Fahd travelled to Mumbai by train. (How?)","answer":"How did Fahd travel to Mumbai?","basis":"用 How 询问出行方式，did 后用 travel。","sourcePage":23,"anchor":{"kind":"line"}},{"label":"3","prompt":"The rain stopped at 9:30. (What time?)","answer":"What time did the rain stop?","basis":"用 What time 询问钟点，did 后用 stop。","sourcePage":23,"anchor":{"kind":"line"}},{"label":"4","prompt":"Carlos went to Egypt last week. (When?)","answer":"When did Carlos go to Egypt?","basis":"用 When 询问时间，did 后用 go。","sourcePage":23,"anchor":{"kind":"line"}},{"label":"5","prompt":"They were happy because they were on holiday. (Why?)","answer":"Why were they happy?","basis":"原句谓语是 were，问句把 were 移到主语前。","sourcePage":23,"anchor":{"kind":"line"}}],"given":{"1":"Where did Yasemin study?"},"placement":"inline","pageSize":5}},{"id":"B02-LS-U01-question:b2477","track":"LS","lesson":1,"order":25,"module":"LANGUAGE DEVELOPMENT","ex":"6","pages":[24],"layout":"list","instruction":"Work in small groups. Choose one of the topics below to discuss. Ask each other questions and practise using negative statements.","provided":"1 Talk about a place that you liked as a child.\n2 Talk about a popular place that you went to in the past.","items":[],"requirements":[{"localId":"a01","actionZh":"在“童年喜欢的地方”和“过去去过的热门地点”中选择一个话题。","sourceItemIds":[],"page":24,"sourceQuote":"Choose one of the topics below to discuss.","sourceOrigin":"original-image","sourceQuotePage":24,"outputZh":"一个话题选择","constraintsZh":[],"sourceTargetCue":""},{"localId":"a02","actionZh":"围绕所选地点互相提 ,"sourceOnly":true}],"sourcePages":[120,121,119],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4c063f56cf27f8db5e190672f4379dfea0b5379cd71d14b65f575b16b35c26.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47915156346ba88ca2a78ef3d1f91295afac088ac4e8cb80d5c6f4bb2f969cbc.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/707dc14d8941d188c182a8138e5a062f183ec9999092aacd2c9faa88726fc3bf.png"],"materials":[{"id":"B01-LS-U05-resource:b1263","title":"Inesh","pages":[121],"text":"Home > Jobs > Current vacancies\nbout you\nMy name's inesh and I'm from Jakarta, Indonesia. I speak four languages: Indonesian, Chinese, Spanish and English. I speak Spanish better than English.\nI'm studying to be a nurse in a big hospital in Jakarta.\nI'm polite and friendly. This is important because nurses have to help doctors and work with patients.\nI would like to go to Canada and work in your sports centre after I get my degree.\nI don't do a lot of sports at the moment, because I'm busy.","kind":"resource"},{"id":"B01-LS-U05-resource:b1264","title":"Morena","pages":[121],"text":"Home > Jobs > Current vacancies\nbout you\nMy name's Morena and I'm from São Paulo in Brazil. I speak Portuguese, Spanish and English.\nI'm a nurse in a small children's hospital. I like working with children, but I would like to work in your sports centre in Canada.\nI'm a friendly and helpful nurse. I love sport. I go running and do yoga. I'm strong and fit. This is important because nurses have to work hard.","kind":"resource"},{"id":"B01-LS-U05-resource:b1265","title":"Darren","pages":[121],"text":"Home > Jobs > Current vacancies\nbout you\nMy name's Darren and I'm from Chicago, Illinois, in the US. I'm a nurse in a big hospital. I work hard and I'm good at my job.\nI only speak English, but I'm a fast learner and a good student.\nI'm fit and healthy. I love football and basketball, and I go to a gym. This is important because a sports-centre nurse should play sports.\nI would like to live in Canada.","kind":"resource"}],"materialDecks":[{"label":"Student A","pages":[{"sourcePage":121,"title":"Inesh","body":"My name’s Inesh and I’m from Jakarta, Indonesia. I speak four languages: Indonesian, Chinese, Spanish and English. I speak Spanish better than English.\nI’m studying to be a nurse in a big hospital in Jakarta.\nI’m polite and friendly. This is important because nurses have to help doctors and work with patients.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/93e04a06322cbba7d89f73094a33090edd90d5e679cb4369cf2df2ebed3d8e40.jpg","alt":"Inesh","notes":[]},{"sourcePage":121,"title":"Inesh","body":"I would like to go to Canada and work in your sports centre after I get my degree.\nI don’t do a lot of sports at the moment, because I’m busy.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/93e04a06322cbba7d89f73094a33090edd90d5e679cb4369cf2df2ebed3d8e40.jpg","alt":"Inesh","notes":[]}]},{"label":"Student B","pages":[{"sourcePage":121,"title":"Morena","body":"My name’s Morena and I’m from São Paulo in Brazil. I speak Portuguese, Spanish and English.\nI’m a nurse in a small children’s hospital. I like working with children, but I would like to work in your sports centre in Canada.\nI’m a friendly and helpful nurse. I love sport. I go running and do yoga. I’m strong and fit. This is important because nurses have to work hard.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e00dc601b115f517458165ecb343c741c0cb7e1b4faf0bf606d93c049f6df673.jpg","alt":"Morena","notes":[]}]},{"label":"Student C","pages":[{"sourcePage":121,"title":"Darren","body":"My name’s Darren and I’m from Chicago, Illinois, in the US. I’m a nurse in a big hospital. I work hard and I’m good at my job.\nI only speak English, but I’m a fast learner and a good student.\nI’m fit and healthy. I love football and basketball, and I go to a gym. This is important because a sports-centre nurse should play sports.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28be76bd1b012e6834cd365667e066da45e7519e7c669e49f21e442bf2f6b47b.jpg","alt":"Darren","notes":[]},{"sourcePage":121,"title":"Darren","body":"I would like to live in Canada.","subtitle":"About you","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28be76bd1b012e6834cd365667e066da45e7519e7c669e49f21e442bf2f6b47b.jpg","alt":"Darren","notes":[]}]},{"label":"Ex 1","pages":[{"sourcePage":119,"title":"Sports Centre Nurse","body":"The UoY sports centre is looking for a new nurse. The nurse works closely with other staff and helps our students stay healthy.\n**We are looking for a person who:**\nhas experience in a hospital.\nspeaks English and another language.\nknows about sport.\nis a hard worker.","subtitle":"(Ref: UoY-SSv/SpC-0099)","photo":"","alt":"","notes":[]},{"sourcePage":119,"title":"About you","body":"**You should:**\nbe helpful.\nlike sport.\nbe friendly.\nThe job is full time and includes some nights and weekends.","subtitle":"","photo":"","alt":"","notes":[]}]}],"taskTable":{"rows":[["criteria","Inesh","Morena","Darren"],["**has experience in a hospital**","Points:\nEvidence:","Points:\nEvidence:","Points: **2**\nEvidence: **nurse in a big hospital**"],["","Points:\nEvidence:","Points:\nEvidence:","Points:\nEvidence:"],["","Points:\nEvidence:" 5a953f4d8574afdae6c989e097094dd043/content/38cfad1287c9044af2fde557fc2a34faff92c5e9585cbb1f6bf8cb0c1da83529.jpg","alt":"教材原配城市天际线","notes":["¹ urban (adj) relating to towns and cities"],"id":"1-2","body":"1  The number of megacities is growing very quickly. In the 1950s, there were only two megacities in the world.\n2  Today, 12% of the world’s urban¹ **population** lives in megacities. Studies show that there will be 8.5 billion people in the world in 2030. **Experts** say that there will be 40 megacities.","lead":"Megacity: a city with more than 10 million people","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"","photo":"","alt":"教材原配城市天际线","notes":[],"id":"3-4","body":"3  Today, more than 35 cities in the world are megacities. The majority are in Asia, South America and Africa. More and more people around the world are leaving their homes in the **countryside** and moving to the city.\n4  Many megacities have better **opportunities**, such as more jobs and a choice of schools and universities. Megacities are also exciting places to live – there are lots of different people, languages and restaurants, and there are many interesting things to do.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"","photo":"","alt":"教材原配城市天际线","notes":["² housing (n) places to live, such as apartments or houses"],"id":"5","body":"5  However, megacities have problems, too. The cities are very big and this can cause problems like **pollution** or poor housing²","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"Tokyo, Japan 37.4 MILLION","photo":"","alt":"教材原配城市天际线","notes":[],"id":"6","body":"6  Tokyo is an exciting, **modern** city in the east of Japan. There are lots of jobs because most big companies in Japan are in Tokyo. It is also an excellent place to study – 18% of Japan’s universities are in the city. However, Tokyo is very busy and the **traffic** is very bad. More than 7.5 million people use the Tokyo Metro every day.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"Delhi, India 29.4 MILLION","photo":"","alt":"教材原配城市天际线","notes":[],"id":"7","body":"7  Delhi is in the north of India. It has many beautiful monuments, interesting museums and modern restaurants. There is an exciting mix of different cultures in the city, and there are four official languages: Hindi, Urdu, Punjabi and English. However, there are not enough houses in some parts of Delhi. This means that many people live in large slums in the city.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"},{"sourcePage":19,"title":"Rise of the MEGACITIES","subtitle":"Cairo, Egypt 20.5 MILLION","photo":"","alt":"教材原配城市天际线","notes":[],"id":"8","body":"8  Cairo is the **capital** of Egypt and is the second-largest city in Africa. Cairo has important car and film industries. The city is the centre of many government offices and has many universities, one of which is over 1,200 years old.","background":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/412eccde4804a32d5f51e3360a8fbe8e0bbf7a8a9d9c9f6b46e029c0b95cabc4.jpg"}]},"B02-RW-U01:reading-2":{"title":"Homestay Holidays","pages":[{"sourcePage":23,"title":"Homestay Holidays","body":"Homestays are becoming more and more popular, and people around the world are offering their homes as places to stay. Homestays offer **cheap** places to stay and the chance for guests to see the **area** like **local** people. They are very popular with students who want to stay in another country and learn a language. We asked three families who run homestays to tell us about where they live.","subtitle":"A HOME AWAY FROM HOME","photo":"","alt":"","notes":[],"id":"intro"},{"sourcePage":23,"title":"Stay in the mountains","body":"A  Our family home is in the north of Nepal, in the Himalayan Mountains, in the village of Manang. The village is small and very **quiet**. It is a very friendly place. The mountains are extremely beautiful. You can go for long walks and swim in the rivers, but there are no shops, cinemas or cafés.","subtitle":"The Atal family","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04927ddf3dfa484aeaa209d7da1496be43451fe753ed2754820f4b0583a26159.jpg","alt":"尼泊尔马南村","notes":[],"id":"A"},{"sourcePage":23,"title":"A house by the sea","body":"B  Our two-bedroom house is by the sea in the south-west of England. It is 15 minutes’ drive to the nearest village of Portreath. There are lots of beaches, rivers and forests, and it is very quiet. We spend a lot of time reading books, watching films and going for walks. Our area is great for sports like surfing, kayaking and mountain biking. However, the houses here are **expensive**, which can be a problem for local people. There are no buses or trains here, so it can be difficult to get around without a car.","subtitle":"Kate and Julian Foxton","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5c7d6ec017d9f5eb53be97b6cbf5daf3bb4ab6a229d4aacd37d2d5b2251d2112.jpg","alt":"Foxton 一家在海边的住所","notes":[],"id":"B"},{"sourcePage":23,"title":"City holiday","body":"C  Our home is near the historic city centre of Beirut, Lebanon, a large city in the Middle East. There are lots of cafés and restaurants, which are open late at night. We love it here because it’s so friendly and you can always find what you need. Lots of people come here to learn Arabic and French. There are also a lot of jobs and businesses here. However, it can be **noisy** at night and there is a lot of traffic during the day. The best thing about Beirut is the weather. It is nice all year round; it rains in the winter, but there is no snow.","subtitle":"Chafic and Asma Halwany","photo":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1c5776e568cc947b86ad1e7117785b020664224bec7cfb898e400847e1d6d7e1.jpg","alt":"Halwany 一家","notes":[],"id":"C"}]}},"textbooks":{"2/RW":{"file":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","printedPages":{"14":12,"15":13,"16":14,"17":15,"18":16,"19":17,"20":18,"21":19,"22":20,"23":21,"24":22,"25":23,"26":24,"27":25,"28":26,"29":27,"30":28,"31":29,"32":30,"33":31,"34":32,"35":33}},"2/LS":{"file":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","printedPages":{"14":12,"15":13,"16":14,"17":15,"18":16,"19":17,"20":18,"21":19,"22":20,"23":21,"24":22,"25":23,"26":24,"27":25,"28":26,"29":27,"30":28,"31":29,"32":30,"33":31,"34":32,"35":33,"191":189}}},"artwork":[{"book":2,"track":"RW","page":25, ","targetExercise":"1","pages":[[{"term":"canal","pos":"(n)","definition":"a river made by people","example":"We walked beside the canal.","wordAudio":"canal","cardWord":true},{"term":"gondola","pos":"(n)","definition":"a narrow boat with a raised point at both ends, used on canals in Venice","example":"The gondola moved slowly along the canal.","wordAudio":"gondola","cardWord":true},{"term":"man-made","pos":"(adj)","definition":"not natural but made by people","example":"This man-made lake is near our town.","wordAudio":"man-made","cardWord":true},{"term":"palace","pos":"(n)","definition":"a large, important house or building, often where a king or queen lives","example":"The queen lived in a beautiful palace.","wordAudio":"palace","cardWord":true},{"term":"stilts","pos":"(n)","definition":"long pieces of wood or metal that a building stands on so that it is above the ground or water","example":"The house stands on stilts above the water.","wordAudio":"stilts","cardWord":true}]]}},{"id":"B02-LS-U01-classroom:video","book":2,"unit":1,"topic":"PLACES","track":"LS","lesson":1,"module":"The Grand Canal","pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/77bc71b33d9dfb02a772cf0cca5c0f2390e36b1280c14c9538a371cd0af26456.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"Watch the video.","flow":{"kind":"video"},"playback":{"type":"video","mediaId":"B02-LS-U01:video"}},{"id":"B02-LS-U01-classroom:resource:b2452","book":2,"unit":1,"topic":"PLACES","track":"LS","lesson":1,"module":"GLOSSARY","pages":[21],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bdf4ebadb690d3dece096452539b0439c523dbc5aad9e3864cc4691c42082b3f.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"edge","pos":"(n)","definition":"the part around something that is furthest from the centre","example":"We sat at the edge of the lake.","wordAudio":"edge","cardWord":true},{"term":"ground","pos":"(n)","definition":"the surface of the earth","example":"The bag fell onto the ground.","wordAudio":"ground","cardWord":true},{"term":"soil","pos":"(n)","definition":"the top layer of earth that plants grow in","example":"These plants grow well in this soil.","wordAudio":"soil","cardWord":true}]]}},{"id":"B02-LS-U01-classroom:resource:b2441","book":2,"unit":1,"track":"LS","topic":"PLACES","lesson":1,"module":"LISTENING 1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[18],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4c52a20fd65dca5385e4bb3aedeb37aa2cb2d584dd3655b74c314931b2fdd217.jpg"],"instruction":"Predicting content using visuals","flow":{"kind":"resource","pages":[{"image":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9bbb6513c8c29568ca67845381d0de51e6510c9c732e8a22164d60aec276060a.png","page":18,"titleInImage":true}]},"stageSkill":true,"layout":"list","provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-LS-U01-classroom:resource:b2445","book":2,"unit":1,"topic":"PLACES","track":"LS","lesson":1,"module":"PRONUNCIATION FOR LISTENING","pages":[20],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e4208007b93771b833b685209dccca625e1f407d0f9b8a77dbd29bd0c82b5d73.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"PRONUNCIATION FOR LISTENING","flow":{"kind":"resource","pages":["Vowel sounds /eɪ/, /ɒ/, /ɪ/, /ʌ/\nPronunciation is just as important for listening as it is for speaking. When you improve your English pronunciation, you also improve your ability to understand others when you are listening.\n/eɪ/ place\n/ɒ/ hot\n/ɪ/ quick\n/ʌ/ up"]},"playback":{"type":"audio","mediaId":"B02-LS-U01:1.1"}},{"id":"B02-LS-U01-classroom:resource:b2460","book":2,"unit":1,"topic":"PLACES","track":"LS","lesson":1,"module":"REVIEW OF THE PAST SIMPLE","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b46978f29782da5c0589b3984ef11e6f8a2df9e4502d91b227e007927024a9ed.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"REVIEW OF THE PAST SIMPLE","flow":{"kind":"resource","pages":["Use the past simple to talk about events that happened in the past. Regular verbs end in -ed. Use the same form for all persons (I, you, we, they, he, she, it).\nFor negative statements in the past simple, use did not (didn't) + infinitive.\nThey did not live in Dubai for a long time.\nI didn't see much of Seoul.\nBe is an irregular verb. The past forms of be are was / were. Use was with I / he / she / it. Use were with you / we / they.\nWhen I was younger, I went to Türkiye.\nThey were very strange buildings.\nFor negative statements with be, use was not (wasn't) or were not (weren't). Do not use did / didn't with be.\nMarco wasn't in Mexico City last week.","They weren't there for a long time.","\u003ctable>\u003ctr>\u003ctd colspan=\"2\">spelling rules for regular verbs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rule\u003c/td>\u003ctd>example\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed to the infinitive.\u003c/td>\u003ctd>He visited Colombia. (visit → visited)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -d to verbs that end in -e.\u003c/td>\u003ctd>She lived there for 20 years. (live → lived)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Double the consonant before -ed for verbs of one syllable that end in a vowel and a consonant.\u003c/td>\u003ctd>We planned to take a trip to Kenya. (plan → planned)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Take off the -y and add -ied for verbs that end in a consonant and -y.\u003c/td>\u003ctd>I studied for hours last night. (study → studied)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add -ed when the word ends in a vowel and -y.\u003c/td>\u003ctd>The children played outside. (play → played)\u003c/td>\u003c/tr>\u003c/table>","Irregular verbs do not end in -ed. Try to learn the past forms of these verbs.\nThey made them out of rock. (make → made)\nI saw some tall buildings. (see → saw)\nI went to Türkiye. (go → went)\nThey built the bridge in 1345. (build → built)\nThey put houses there. (put → put)"]}},{"id":"B02-LS-U01-classroom:resource:b2462","book":2,"unit":1,"topic":"PLACES","track":"LS","lesson":1,"module":"Past simple questions","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a24c3944ae67681a3bf245c31e8398e0114aa872dd4681e79ba3cc6b2aa53d88.jpg"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"Past simple questions","flow":{"kind":"resource","pages":["For Yes / No questions in the past simple, use Did + subject + infinitive for all persons (I, you, we, they, he, she, it).\nDid they build a new bridge last year?\nDid you live in Dubai for a long time?\nFor information questions, use a Wh- word (Where, When, Why, etc.) + did + subject + infinitive.\nWhere did he go?\nWhy did he move to Cairo?\nWhen did they build their house?\nFor past simple questions with the verb be, use Was / Were + subject.\nWas the trip interesting?\nWere the houses ancient?\nWas he at school in July?"]}},{"id":"B02-LS-U01-classroom:resource:b2489","book":2,"unit":1,"track":"LS","topic":"PLACES","lesson":2,"module":"LISTENING 2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[26],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9f20737eeae47c1c98966f470061eb9c684ff2b07878705f41638c3da3350a8.jpg"],"instruction":"Distinguishing fact from opinion","flow":{"kind":"resource","pages":[{"image":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a0e1824bb27be091c6862ea83b9cb9a4e3d02aab5b70c167651da0da396b59d4.png","page":26,"titleInImage":true}]},"stageSkill":true,"layout":"list","provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-LS-U01-classroom:resource:b2500","book":2,"unit":1,"track":"LS","topic":"PLACES","lesson":2,"module":"CRITICAL THINKING","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/777e1692b5303baee509493cf4a2b0f0f5f6946eb7beba0256737e2cc92e302e.jpg"],"instruction":"Deciding if ideas are relevant","flow":{"kind":"resource","pages":[{"image":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ead34ed5121d0d6b9873ad8bab9539419b37f8420312547c732ef170a7e2b3dd.png","page":29,"titleInImage":true}]},"stageSkill":true,"layout":"list","provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-LS-U01-classroom:resource:b2508","book":2,"unit":1,"track":"LS","topic":"PLACES","lesson":2,"module":"PREPARATION FOR SPEAKING","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4bd21b0464a654755960f7a9b5040f8b8a40a43b614f92f1ec81a7f78c6a264d.jpg"],"instruction":"SIGNPO ":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPa ine":true},{"start":19,"end":23}]},"b3765.i02":{"mode":"indexed-mark","parts":[{"start":0,"end":2,"underline":true},{"start":3,"end":8}]},"b3765.i03":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":21}]}},"basis":"教材第 118 页与教师书 PDF 第 50 页。选择完整主语和限定动词。","itemPatches":{"b3765.i01":{"options":[]},"b3765.i02":{"options":[]},"b3765.i03":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01- function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};

 },

 },
 async runOpenings(){
  const checked={};

 },

};
