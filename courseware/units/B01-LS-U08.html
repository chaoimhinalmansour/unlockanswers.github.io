here are big highways that go between different parts\nof the country."},{"start":31.1,"end":35.16,"text":"This highway goes from the mountains of Xinjiang in the\nnorth,"},{"start":36.86,"end":39.7,"text":"to the city of Dongxing in the south."},{"start":41.56,"end":44.88,"text":"It is over ten ,000 kilometers long."},{"start":46.26,"end":51.4,"text":"Some of China's highways go to important cities by the\nsea,"},{"start":53.14,"end":55.3,"text":"such as Hong Kong."},{"start":56.52,"end":59.48,"text":"Ships leave from the port in Hong Kong,"},{"start":61.28,"end":64.38,"text":"and take Chinese products across the world."},{"start":65.94,"end":68.38,"text":"There are a lot of factories in China,"},{"start":68.76,"end":71.52,"text":"such as this one, which makes cars."},{"start":72.7,"end":76.46000000000001,"text":"And to take things from the factories to the sea,"},{"start":77.12,"end":78.4,"text":"China needs roads."},{"start":78.94,"end":80.26,"text":"A lot of them."},{"start":81.92,"end":84.26,"text":"And so the Chinese built."},{"start":86.1,"end":89.6,"text":"In the mountains, they built very long bridges,"},{"start":90,"end":91.98,"text":"like these in Yunnan."},{"start":93.88,"end":96.22,"text":"In the cities, they built highways,"},{"start":96.68,"end":98.66,"text":"like these in Chongqing."},{"start":100.22,"end":105.68,"text":"One big highway goes from Hong Kong to Macau,"},{"start":106.12,"end":108.16,"text":"55 kilometers away,"},{"start":108.78,"end":110.03999999999999,"text":"across the sea."},{"start":111.1,"end":115,"text":"To make the highway, they built this island in the sea."},{"start":117.03999999999999,"end":117.44,"text":"Now,"},{"start":117.84,"end":121.78,"text":"cars go from Hong Kong in a tunnel under the sea,"},{"start":123.56,"end":124.56,"text":"to the island."},{"start":124.56,"end":129.14,"text":"From there, they go across a bridge to Macau."},{"start":130.38,"end":132,"text":"Before the new highway,"},{"start":132.8,"end":136.84,"tex eVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U08-question:b1613","book":1,"unit":8,"track":"LS","topic":"TRANSPORT","lesson":2,"order":52,"module":"PREPARATION FOR SPEAKING","ex":"9","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"DESCRIBING A SOLUTION"},"instruction":"Work with a partner. Think of a problem you know about and its solution. Take turns to describe it.","pages":[188],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/34525335bac860faa4d828c13fc4de7e88d78ce05ea2c20ff61b4d6f23d49b7f.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"See Model Answer Booklet p/3 for example answers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U08-question:b1615","book":1,"unit":8,"track":"LS","topic":"TRANSPORT","lesson":2,"order":53,"module":"PREPARATION FOR SPEAKING","ex":"10","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"DESCRIBING RESULTS"},"instruction":"Look at the table. Match the correct problems, solutions and results. Then write them as short paragraphs below.","pages":[188],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/34525335bac860faa4d828c13fc4de7e88d78ce05ea2c20ff61b4d6f23d49b7f.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>problem\u003c/td>\u003ctd>solution\u003c/td>\u003ctd>result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There was no public transport, so people had to drive everywhere.\u003c/td>\u003ctd>One solution is self-driving cars.\u003c/td>\u003ctd>These cars are safer because there are fewer accidents.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There are a lot of bad drivers, so there are a lot of accidents.\u003c/td>\u003ctd>So Transport for London started Oyster Cards.\u003c/td>\u003ctd>That way, there were fewer cars, and workers felt better.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>It took a long time because people waited to buy tickets and go through the gate.\u003c/td>\u003ctd>One solution was car sharing.\u003c/td>\u003ctd>The result is that it is now very fast and easy.\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b1615.i01","label":"1","prompt":"____","options":[],"type":"choice/closed"},{"id":"b1615.i02","label":"2","prompt":"____","options":[],"type":"choice/closed"},{"id":"b1615.i03","label":"3","prompt":"____","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"problem","header":false,"colspan":1,"rowspan":1},{"text":"solution","header":false,"colspan":1,"rowspan":1},{"text":"result","header":false,"colspan":1,"rowspan":1}],[{"text":"There was no public transport, so people had to drive everywhere.","header":false,"colspan":1,"rowspan":1},{"text":"One solution is self-driving cars.","header":false,"colspan":1,"rowspan":1},{"text":"These cars are safer because there are fewer accidents.","header":false,"colspan":1,"rowspan":1}],[{"text":"There are a lot of bad drivers, so there are a lot of accidents.","header":false,"colspan":1,"rowspan":1},{"text":"So Transport for London started Oyster Cards.","header":false,"colspan":1,"rowspan":1},{"text":"That way, there were fewer cars, and workers felt better.","header":false,"colspan":1,"rowspan":1}],[{"text":"It took a long time because people waited to buy tickets and go through the gate.","header":false,"colspan":1,"rowspan":1},{"text":"One solution was car sharing.","header":false,"colspan":1,"rowspan":1},{"text":"The result is that it is now very fast and easy.","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 There was no public transport,  so people  had to drive\neverywhere. One solution was car shar ing. That way,\nthere were fewer cars and workers felt better.\n2 There are a lot of bad drivers, so there are a lot of\naccidents. One solution is self-driving cars. So, these\ncars are safer because there are fewer accidents.\n3 It took a long time because people waited to buy\ntickets and go through the gate. So Transport  for\nLondon  started  Oyster Cards.  The result  is that it is\nvery fast and easy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U08-question:b1616","book":1,"unit":8,"track":"LS","topic":"TRANSPORT","lesson":2,"order":54,"module":"PREPARATION FOR SPEAKING","ex":"11","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"DESCRIBING RESULTS"},"instruction":"Work with a partner. Take turns to describe the results in Exercise 10. Use the phrases to help you.","pages":[189],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5d44aa5b1b980d9f4d509065ba95afe4ac77946a62cb5480d69be83c9b73e9df.png"],"provided":"I think it was a good solution.\nI don't think it was a good solution.\nWhy?\nBecause that means ...","items":[],"layout":"list","references":[{"id":"B01-LS-U08-question:b1615","kind":"material-reference","title":"PREPARATION FOR SPEAKING Ex 10","pages":[188]}],"materials":[],"coursePages":[[{"kind":"text king task","text":"Describe a transport problem, solution and results."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about China's roads."},{"label":"Listening skills","text":"Listen for definitions; synthesize information."},{"label":"Critical thinking","text":"Synthesize information for a talk."},{"label":"Grammar","text":"Use the past simple (2); use because and so."},{"label":"Speaking skills","text":"Describe a topic; describe a problem; describe a solution; describe results."}],"photo":{"box":[247,127,529,904],"nativeWidth":777,"sourcePage":170,"alt":""}}]}},{"id":"B01-LS-U08-classroom:resource:b1525","book":1,"unit":8,"track":"LS","topic":"TRANSPORT","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WATCH AND LISTEN"},"pages":[172],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/593bc390782eb4d93950f827972cad89d9d4d344749c5d6792458230d0612f85.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"highway","pos":"(n)","definition":"a main, usually large, road","example":"We drove along the highway for two hours.","wordAudio":"highway","cardWord":false},{"term":"port","pos":"(n)","definition":"part of a city next to water where big ships come and go","example":"The ferry leaves from the port at noon.","wordAudio":"port","cardWord":false},{"term":"transport","pos":"(v)","definition":"to take things from one place to another","example":"Lorries transport fresh food to the city every day.","wordAudio":"transport/(v)","cardWord":false},{"term":"tunnel","pos":"(n)","definition":"a long road under the ground or through a mountain that cars can travel through","example":"We drove through a tunnel under the river.","wordAudio":"tunnel","cardWord":false}]]}},{"id":"B01-LS-U08-classroom:video","book":1,"unit":8,"track":"LS","topic":"TRANSPORT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[172],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/593bc390782eb4d93950f827972cad89d9d4d344749c5d6792458230d0612f85.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/868071335386cd6ff953cfb1-L1LS-U08.mp4","captions":[{"start":1.2,"end":5.02,"text":"To make money, first you build a road."},{"start":7.2,"end":9.04,"text":"People in China say this,"},{"start":9.36,"end":12.66,"text":"and in China there are a lot of roads."},{"start":14.58,"end":17.62,"text":"Like these, in the cities of Beijing,"},{"start":19.16,"end":19.78,"text":"Shanghai,"},{"start":21.68,"end":22.78,"text":"and Guangzhou."},{"start":24.18,"end":29.36,"text":"There are big highways that go between different parts\nof the country."},{"start":31.1,"end":35.16,"text":"This highway goes from the mountains of Xinjiang in the\nnorth,"},{"start":36.86,"end":39.7,"text":"to the city of Dongxing in the south."},{"start":41.56,"end":44.88,"text":"It is over ten ,000 kilometers long."},{"start":46.26,"end":51.4,"text":"Some of China's highways go to important cities by the\nsea,"},{"start":53.14,"end":55.3,"text":"such as Hong Kong."},{"start":56.52,"end":59.48,"text":"Ships leave from the port in Hong Kong,"},{"start":61.28,"end":64.38,"text":"and take Chinese products across the world."},{"start":65.94,"end":68.38,"text":"There are a lot of factories in China,"},{"start":68.76,"end":71.52,"text":"such as this one, which makes cars."},{"start":72.7,"end":76.46000000000001,"text":"And to take things from the factories to the sea,"},{"start":77.12,"end":78.4,"text":"China needs roads."},{"start":78.94,"end":80.26,"text":"A lot of them."},{"start":81.92,"end":84.26,"text":"And so the Chinese built."},{"start":86.1,"end":89.6,"text":"In the mountains, they built very long bridges,"},{"start":90,"end":91.98,"text":"like these in Yunnan."},{"start":93.88,"end":96.22,"text":"In the cities, they built highways,"},{"start":96.68,"end":98.66,"text":"like these in Chongqing."},{"start":100.22,"end":105.68,"text":"One big highway goes from Hong Kong to Macau,"},{"start":106.12,"end":108.16,"text":"55 kilometers away,"},{"start":108.78,"end":110.03999999999999,"text":"across the sea."},{"start":111.1,"end":115,"text":"To make the highway, they built this island in the sea."},{"start":117.03999999999999,"end":117.44,"text":"Now,"},{"start":117.84,"end":121.78,"text":"cars go from Hong Kong in a tunnel under the sea,"},{"start":123.56,"end":124.56,"text":"to the island."},{"start":124.56,"end":129.14,"text":"From there, they go across a bridge to Macau."},{"start":130.38,"end":132,"text":"Before the new highway,"},{"start":132.8,"end":136.84,"text":"drivers needed four hours to go from Hong Kong to\nMacau."},{"start":137.52,"end":140.18,"text":"Now it takes just 30 minutes."},{"start":143.16,"end":148.24,"text":"China builds thousands of kilometers of new highways\nevery year."},{"start":149.46,"end":153.34,"text":"And that means it's easy to transport products,"},{"start":155.52,"end":157.57999999999998,"text":"which is very good for business."},{"start":159.57999999999998,"end":161.44,"text":"So, perhaps it is true."},{"start":162.1,"end":165.42000000000002,"text":"To make money, first you build a road."}],"launchInline":true}},{"id":"B01-LS-U08-classroom:resource:b1549","book":1,"unit":8,"track":"LS","topic":"TRANSPORT","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENI "block":0,"values":["paper tickets"],"text":"- Before the Oyster Card, people only used (3) __. You can still use these now."},{"part":1,"block":2,"values":["bank card","smartphone","smartwatch"],"text":"- (4) __    - (5) __    - (6) __"}],"tableEdits":[]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","ans  houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-LS-U08":{"aspect":1.9085487,"cues":[[1.2,5.02,"To make money, first you build a road.","为了赚钱，首先要修路。"],[7.2,9.04,"People in China say this,","在中国的人说，"],[9.36,12.66,"and in China there are a lot of roads.","在中国，有许多道路。"],[14.58,17.62,"Like these, in the cities of Beijing,","像这样，在北京的城市里，"],[19.16,19.78,"Shanghai,","上海上海上海"],[21.68,22.78,"and Guangzhou.","和广州。"],[24.18,29.36,"There are big highways that go between different parts of the country.","各地之间有大高速公路通车。"],[31.1,35.16,"This highway goes from the mountains of Xinjiang in the north,","这条高速公路从北部的新疆山区出发，"],[36.86,39.7,"to the city of Dongxing in the south.","南至东兴城。"],[41.56,44.88,"It is over ten ,000 kilometers long.","它的长度超过10 000公里。"],[46.26,51.4,"Some of China's highways go to important cities by the sea,","部分中国的高速公路通向海边的重要城市，"],[53.14,55.3,"such as Hong Kong.","香港之类的"],[56.52,59.48,"Ships leave from the port in Hong Kong,","船舶从香港港驶出"],[61.28,64.38,"and take Chinese products across the world.","并且把中国的产品带到世界各地。"],[65.94,68.38,"There are a lot of factories in China,","中国有很多工厂"],[68.76,71.52,"such as this one, which makes cars.","比如这个制造汽车的"],[72.7,76.46000000000001,"And to take things from the factories to the sea,","为了把东西从工厂带到大海"],[77.12,78.4,"China needs roads.","中国需要道路。"],[78.94,80.26,"A lot of them.","甚处来。"],[81.92,84.26,"And so the Chinese built.","故华人建也。"],[86.1,89.6,"In the mountains, they built very long bridges,","在山上，他们建造了很长的桥梁，"],[90,91.98,"like these in Yunnan.","像这些在云南。"],[93.88,96.22,"In the cities, they built highways,","在城市里，他们建造了高速公路，"],[96.68,98.66,"like these in Chongqing.","像这样在重庆。"],[100.22,105.68,"One big highway goes from Hong Kong to Macau,","一条大公路从香港到澳门"],[106.12,108.16,"55 kilometers away,","55公里外，"],[108.78,110.03999999999999,"across the sea.","横跨大海。"],[111.1,115,"To make the highway, they built this island in the sea.","为了制造高速公路，他们在海上建造了这座岛。"],[117.03999999999999,117.44,"Now,","现在，"],[117.84,121.78,"cars go from Hong Kong in a tunnel under the sea,","汽车从香港驶入海底隧道"],[123.56,124.56,"to the island.","去岛上。"],[124.56,129.14,"From there, they go across a bridge to Macau.","从那里，他们穿过一座桥去澳门。"],[130.38,132,"Before the new highway,","在新高速公路开通之前"],[132.8,136.84,"drivers needed four hours to go from Hong Kong to Macau.","司机需要四个小时从香港到澳门。"],[137.52,140.18,"Now it takes just 30 minutes.","现在只需要30分钟。"],[143.16,148.24,"China builds thousands of kilometers of new highways every year.","中国每年新建高速公路数千公里。"],[149.46,153.34,"And that means it's easy to transport products,","这意味着它很容易运输产品，"],[155.52,157.57999999999998,"which is very good for business.","这对生意很有好处"],[159.57999999999998,161.44,"So, perhaps it is true.","所以，也许这是真的。"],[162.1,165.42000000000002,"To make money, first you build a road.","为了赚钱，首先要修路。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33},"B01-LS/36":{"pdf":34},"B01-LS/37":{"pdf":35},"B01-LS/38":{"pdf":36},"B01-LS/39":{"pdf":37},"B01-LS/40":{"pdf":38},"B01-LS/41":{"pdf":39},"B01-LS/42":{"pdf":40},"B01-LS/43":{"pdf":41},"B01-LS/44":{"pdf":42},"B01-LS/45":{"pdf":43},"B0 function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+
 (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;
 const size=c.feedback?.pageSize??(plan?.showAll?Math.max(1,items.length):plan?.kind==="definitions"?3:c.layout==="grid"?6:equalOptions?3:sourceItems.some(x=>x.options?.length>2)?2:4);
 const chunks=items.length?Array.from({length:Math.ceil(items.length/size)},(_,i)=>items.slice(i*size,(i+1)*size)):[[]];
 return {table,equalOptions,bank:equalOptions?sourceItems[0].options:[],chunks,provided,decks};
}
function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){

  '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';

function materialSplit(decks,task,feedback){

 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){

 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function status(c){return resultFor(c)?.verdict??"待实页检查";}

function inClassroomOrder(){

}
function inGlossaries(){

function selectedUnitPages(){

  (openingTrack.value==="all"||c.track===openingTrack.value));

function selectedLessons(){

function exerciseVisible(c){

function flowSteps(lesson){

function navigationOrder(){

function neighbor(amount){

function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';

function nav(){

  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");

   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||

function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);

 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;
 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";
 const reasons=r?.reasons??c.issues;
 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';
 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");

function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();

 const inset=property=>Number.parseFloat(css.getPropertyValue(property));

 const isGlossary=c.flow?.kind==="glossary";

 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";

  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;

 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);

  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
