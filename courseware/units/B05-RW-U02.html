CAL THINKING Ex 2","pages":[53]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Choose a logo for your analysis. ____"},{"kind":"text","text":"2 Apply the criteria from the list you made in Exercise 1. Does your logo meet each of the criteria completely, partly or not at all?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Starbucks\n2 It partly meets the criteria. It is unique\nbut it is not as simple as some logos\nbecause it has a more detailed image.\nIt is clear but it might not be as flexible\nas some simpler designs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8353","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Answer the questions.","pages":[54],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cbebdf518cbbde8c92d0c1c9e03e803dab9acb8918331036b47a4370e286cf5.png"],"provided":"1 How successful do you think the logo is? Explain your answer.\n2 Is your judgment based on the criteria in the chapter or were other criteria important? If so, what were they? Why were they important?","items":[{"id":"b8353.i01","label":"1","prompt":"How successful do you think the logo is? Explain your answer.","options":[],"type":"discuss/open"},{"id":"b8353.i02","label":"2","prompt":"Is your judgment based on the criteria in the chapter or were other criteria important? If so, what were they? Why were they important?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 How successful do you think the logo is? Explain your answer."},{"kind":"text","text":"2 Is your judgment based on the criteria in the chapter or were other criteria important? If so, what were they? Why were they important?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It is successful because it is unique\nand it is instantly recognizable not only\nbecause of the symbol but also the\ncolour that is used.\n2 Other criteria include the timelessness\nof the logo – it should remain relevant\nand effective for years, even decades,\nwithout the need for major redesigns. It\nshould be versatile, and it should work\nin different orientations, sizes and colour\nschemes, and also in black and white. It\nshould also be culturally sensitive and\nable to be used successfully in different\ncultural contexts.\nGRAMMAR FOR WRITING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8356","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":32,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Combine the sentences to make non-defining relative clauses. The second sentence contains additional information.","pages":[54,55],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cbebdf518cbbde8c92d0c1c9e03e803dab9acb8918331036b47a4370e286cf5.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2960453afe22832326eff5aa16f5f1a8dac874d7b618d8d0710e7641f2f5a58b.png"],"provided":"1 The logo for Dove skincare company is a good example of a symbol that reminds consumers of the company name. Dove was founded in 1957.","items":[{"id":"b8356.i01","label":"1","prompt":"The logo for Dove skincare company is a good example of a symbol that reminds consumers of the company name. Dove was founded in 1957.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The logo for Dove skincare company is a good example of a symbol that reminds consumers of the company name. Dove was founded in 1957."}]],"courseMaterials":[{"id":"B05-RW-U02-publisher-continuation:p055:b8356:pairs2-4","title":"GRAMMAR FOR WRITING Ex 1 第2–4组合句跨页续项","pages":[55],"text":"2 Marimekko is known for its patterns that contain bright and colourful, yet simple, designs. Marimekko is a fashion company based in Finland.\n3 A Welsh artist, Annie Atkins, has designed graphics for many Hollywood movies. Annie Atkins once quit a job in advertising to go to film school.\n4 The Korean company Kia redesigned its cars and subsequently refined its logo. The refined logo now represents confidence and innovation.","screens":["2 Marimekko is known for its patterns that contain bright and colourful, yet simple, designs. Marimekko is a fashion company based in Finland.","3 A Welsh artist, Annie Atkins, has designed graphics for many Hollywood movies. Annie Atkins once quit a job in advertising to go to film school.","4 The Korean company Kia redesigned its cars and subsequently refined its logo. The refined logo now represents confidence and innovation."],"sources":[{"page":55,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2960453afe22832326eff5aa16f5f1a8dac874d7b618d8d0710e7641f2f5a58b.png"}],"kind":"publisher_task_continuation","sourceBlockIds":["b8356"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  The logo for Dove skincare company, which was\nfounded in 1957, is a good example of a symbol that\nreminds consumers of the company name.\n2  Marimekko, (which is) a fashion company based in\nFinland, is known for its patterns that contain bright\nand colourful, yet simple designs.\n3  A Welsh artist, Annie Atkins, who once quit a job in\nadvertising to go to film school, has designed graphics\nfor many Hollywood movies.\n4  The Korean company KIA redesigned its cars and\nsubsequently refined its logo, which now represents\nconfidence and innovation.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8358","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":33,"module":"GRAMMAR FOR WRITING","ex":"2","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Use non-defining relative clauses to write sentences about two brands, logos or designers you are familiar with. Share your sentences with a partner.","pages":[55],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2960453afe22832326eff5aa16f5f1a8dac874d7b618d8d0710e7641f2f5a58b.png"],"provided":"","items":[{"id":"b8358.i01","label":"1","prompt":"1 ____","options":[],"type":"gap/open"},{"id":"b8358.i02","label":"2","prompt":"2 ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8358.i01","label":"1","prompt":"1 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8358.i02","label":"2","prompt":"2 ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Gucci’s logo, which consists of the initials\nof founder Guccio Gucci, is one of the\nfashion industry’s most recognizable\nsymbols.\n2 Milton Glaser, who died in 2020,\ncreated many famous logos that we\nrecognize today.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8361","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":34,"module":"GRAMMAR FOR WRITING","ex":"3","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"APPOSITIVES"},"instruction":"Rewrite the paragraph, using appositives for the additional information.","pages":[56],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7db35dc0ec3b9e5828425de8f910b94139edb2e4074381bdc1e81b01c481acdf.png"],"provided":"McDonald's is a multinational company that was founded in 1940. The founders were Richard and Maurice McDonald. The founders were brothers. The fast food company is famous for its logo. The logo consists of a gold symbol in the shape of the letter 'm'. The 'golden arches' is among the most recognized symbols in the world. The 'golden arches' is the logo's nickname.","items":[{"id":"b8361.i01","label":"3","prompt":"Rewrite the paragraph, using appositives for the additional information.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"McDonald's is a multinational company that was founded in 1940. The founders were Richard and Maurice McDonald. The founders were brothers. The fast food company is famous for its logo. The logo consists of a gold symbol in the shape of the letter 'm'. The 'golden arches' is among the most recognized symbols in the world. The 'golden arches' is the logo's nickname."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"McDonald’s, a multinational company,\nwas founded in 1940. The founders were\nbrothers Richard and Maurice McDonald.\nThe fast food company is famous for its\nlogo, a gold symbol in the shape of the\nletter ‘m’. The golden arches, the logo’s\nnickname, is among the most recognized\nlogos in the world.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8362","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":35,"module":"GRAMMAR FOR WRITING","ex":"4","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"APPOSITIVES"},"instruction":"Write two sentences of your own with appositives, using the proper nouns given.","pages":[56],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7db35dc0ec3b9e5828425de8f910b94139edb2e4074381bdc1e81b01c481acdf.png"],"provided":"","items":[{"id":"b8362.i01","label":"1","prompt":"Harry Styles","options":[],"type":"gap/open"},{"id":"b8362.i02","label":"2","prompt":"Adidas","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8362.i01","label":"1","prompt":"Harry Styles","options":[],"type":"gap/open"},{"kind":"item","id":"b8362.i02","label":"2","prompt":"Adidas","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Pop star Harry Styles generates a lot\nof excitement among his fans when he\nperforms live.\n2 Adidas, a giant in the sporting\napparel industry, has one of the most\nrecognizable logos in the world.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8364","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":36,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Summarize the seventh paragraph of Reading 1. Using format 1 write a response to that summary in one or two sentences.","pages":[57],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3733487c39ea8be3c9d8720c36717b0c59985739c2f04389f37cb192e5ec7b51.png"],"provided":"1 Summarize the seventh paragraph of Reading 1. Using format 1 write a response to that summary in one or two sentences.","items":[{"id":"b8364.i01","label":"1","prompt":"Summarize the seventh paragraph of Reading 1, then write a format 1 response in one or two sentences.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Summarize the seventh paragraph of Reading 1. Using format 1 write a response to that summary in one or two sentences."},{"kind":"item","id":"b8364.i01","label":"1","prompt":"Summarize the seventh paragraph of Reading 1, then write a format 1 response in one or two sentences.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Widely recognized logos often surpass\ncompany names in importance. Logos like\nNike’s swoosh and McDonald’s arches are\ninstantly recognizable and can enhance\ncustomer loyalty. Research shows that\nsymbolic logos, rather than text-based ones,\nhave a stronger impact on brand loyalty. A\nwell-designed logo can become a key asset\nfor businesses, boosting recognition and\nloyalty beyond just the company name.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8365","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Summarize the fourth paragraph of Reading 2. Using format 2 write a response, in one or two sentences.","pages":[57],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3733487c39ea8be3c9d8720c36717b0c59985739c2f04389f37cb192e5ec7b51.png"],"provided":"2 Summarize the fourth paragraph of Reading 2. Using format 2 write a response, in one or two sentences.","items":[{"id":"b8365.i01","label":"2","prompt":"Summarize the fourth paragraph of Reading 2, then write a format 2 response in one or two sentences.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"2 Summarize the fourth paragraph of Reading 2. Using format 2 write a response, in one or two sentences."},{"kind":"item","id":"b8365.i01","label":"2","prompt":"Summarize the fourth paragraph of Reading 2, then write a format 2 response in one or two sentences.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Public resistance to the rebranding of\na trusted logo is common. Generally,\npeople don’t like change in any form,\nwhich includes brands that they may have\nbeen using for years. However, consumer\nloyalty can be maintained if the colours or\nother familiar elements remain unchanged,\neven if the overall logo looks different.\nPeople want to believe that the brand they\nhave supported is taking their feelings\ninto consideration. If there is too much\nchange, consumer rejection will follow. As\na result, the rebranded company may lose\ncustomers and ultimately, revenue.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8366","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":38,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Compare your summaries and responses with a partner.","pages":[57],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3733487c39ea8be3c9d8720c36717b0c59985739c2f04389f37cb192e5ec7b51.png"],"provided":"3 Compare your summaries and responses with a partner.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"3 Compare your summaries and responses with a partner."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8368","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":39,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Work with a partner. Complete the tasks.","pages":[58],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1520eec65bd6b0f022a4fc16a5396e2fcdfefcbb211e9aa33a5f8d4c30047e2c.png"],"provided":"","items":[{"id":"b8368.i01","label":"1","prompt":"Circle the sentence that expresses the main idea of Reading 1.","options":["A suc ockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Format 1 – Summarize then respond. I like\nthe idea of giving an overall summary of\nthe source text first, then responding with\nmy own ideas. For me, this feels like a\nstraightforward approach.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8372","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":41,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"What logo will you discuss in your essay? See Critical thinking, Exercise 3, page 54. Describe the logo to a partner and explain why you chose to write about it.","pages":[58],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1520eec65bd6b0f022a4fc16a5396e2fcdfefcbb211e9aa33a5f8d4c30047e2c.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U02-question:b8352","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[54]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U02-publisher-page:p054","title":"原题或核对备注所引第54页","pages":[54],"text":"","screens":[],"sources":[{"page":54,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cbebdf518cbbde8c92d0c1c9e03e803dab9acb8918331036b47a4370e286cf5.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I will discuss the Starbucks logo in my\nessay because it is iconic and because I’ve\nalways enjoyed visiting Starbucks cafes.\nThe Starbucks logo features a green circular\ndesign with a twin-tailed mermaid at its\ncentre. The mermaid is depicted in white\nagainst a green background, with the\nStarbucks name displayed in a bold font\naround the edge of the circle.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8373","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":42,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Review your list of criteria from Critical thinking, Exercise 2, page 53. Paraphrase each of the criteria. Read your paraphrases to a partner to make sure you have kept the original meaning. Use your paraphrases in your essay.","pages":[59],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/da06169548daf353c3cb2487190ebc49043e8afd3ad3d805d7577342aa313801.png"],"provided":"1 ____\n2 ____\n3 ____\n4 ____\n5 ____","items":[{"id":"b8373.i01","label":"1","prompt":"1 ____","options":[],"type":"gap/open"},{"id":"b8373.i02","label":"2","prompt":"2 ____","options":[],"type":"gap/open"},{"id":"b8373.i03","label":"3","prompt":"3 ____","options":[],"type":"gap/open"},{"id":"b8373.i04","label":"4","prompt":"4 ____","options":[],"type":"gap/open"},{"id":"b8373.i05","label":"5","prompt":"5 ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U02-question:b8351","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[53]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 ____"},{"kind":"text","text":"4 ____"},{"kind":"item","id":"b8373.i02","label":"2","prompt":"2 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8373.i03","label":"3","prompt":"3 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8373.i05","label":"5","prompt":"5 ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U02-publisher-page:p053","title":"原题或核对备注所引第53页","pages":[53],"text":"","screens":[],"sources":[{"page":53,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e99771858b79ac467b7a7cff6902dd2d94ac6c427951ce606057a51c34aefd65.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Original: simple and easy to remember\nParaphrase: uncomplicated\nand memorable\n2 Original: unique\nParaphrase: there are no other logos\nlike it\n3 Original: arouses curiosity\nParaphrase: evokes a sense of wonder\n4 Original: can be recognized from\na distance\nParaphrase: even from far away, it’s clear\nwho the logo belongs to\n5 Original: evokes an emotional response\nParaphrase: stirs up feelings","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8374","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":43,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Review the information that applies to the format you will follow.","pages":[59],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/da06169548daf353c3cb2487190ebc49043e8afd3ad3d805d7577342aa313801.png"],"provided":"Format 1: summary and then response\n\nOpening paragraph: Review the main idea that you chose (Academic writing skills, Exercise 4 on page 58) and use it as the basis of your one-paragraph summary of Reading 1. Make sure you have explained the criteria.\n\nBody paragraphs: Write one paragraph or more applying the criteria for a successful logo to your choice of product or service.\n\n- Add details from Reading 2 if they are relevant to your essay.\n- Review your notes on applying the criteria to the logo you have chosen (see Critical thinking, Exercises 2 and 3 on pages 53–54). You probably will not need a separate paragraph for each criterion.\n\n- Refer to the criteria in your introduction, but do not explain them again here. Logo X is indeed simple, but not unique, so it may easily be confused with other, more famous logos.\n\nConclusion: Make sure your conclusion answers this question:\n\nAfter considering all of the criteria, do you believe the logo you selected is successful? Why / Why not?\n\nFormat 2: integrated summary and response\n\nOpening paragraph: Review the main idea that you chose (Academic writing skills, Exercise 4 on page 58) and use it as the basis of your opening paragraph.\n\nBody paragraphs: Write one or more paragraphs explaining and applying each of the criteria for a successful logo to your choice of product or service. If there are any additional criteria that you think are important, discuss them as well.\n\nConclusion: Make sure your conclusion answers this question:\n\nAfter considering all of the criteria, do you believe the logo you selected is successful? Why / Why not?","items":[],"layout":"list","references":[{"id":"B05-RW-U02-question:b8371","kind":"student-work","title":"WRITING TASK Ex 1","pages":[58]},{"id":"B05-RW-U02-question:b8368","kind":"student-work","title":"ACADEMIC WRITING SKILLS Ex 4","pages":[58]},{"id":"B05-RW-U02-question:b8372","kind":"student-work","title":"WRITING TASK Ex 2","pages":[58]}],"materials":[],"coursePages":[[{"kind":"text","text":"Format 1: summary and then response"},{"kind":"text","text":"Opening paragraph: Review the main idea that you chose (Academic writing skills, Exercise 4 on page 58) and use it as the basis of your one-paragraph summary of Reading 1. Make sure you have explained the criteria."},{"kind":"text","text":"Body paragraphs: Write one paragraph or more applying the criteria for a successful logo to your choice of product or service."},{"kind":"text","text":"- Add details from Reading 2 if they are relevant to your essay."}],[{"kind":"text","text":"- Review your notes on applying the ic in some tropical areas.","wordAudio":"endemic","cardWord":false},{"term":"exclamation point","pos":"(US n phr)","definition":"exclamation mark","example":"She added an exclamation point after the word welcome.","wordAudio":"exclamation point","cardWord":false},{"term":"cursive","pos":"(n, adj)","definition":"joined-up writing","example":"I find it difficult to read notes written in cursive.","wordAudio":"cursive","cardWord":false},{"term":"typography","pos":"(n)","definition":"the design of writing in a piece of printing or on a computer screen","example":"The designer chose simple typography for the signs.","wordAudio":"typography","cardWord":false},{"term":"be in full swing","pos":"(idiom)","definition":"be fully underway. be at the highest level of activity, popularity, etc.","example":"By the time we arrived, the festival was in full swing.","wordAudio":"be in full swing","cardWord":false},{"term":"period","pos":"(US n)","definition":"full stop","example":"Put a period at the end of the sentence.","wordAudio":"period","cardWord":false},{"term":"authoritarian","pos":"(adj)","definition":"demanding total obedience","example":"The authoritarian leader demanded complete obedience.","wordAudio":"authoritarian","cardWord":false},{"term":"come off (as)","pos":"(phr v, informal)","definition":"seem a particular way to other people. create a particular impression","example":"I did not want to come off as rude during the meeting.","wordAudio":"come off (as)","cardWord":false}]]}},{"id":"B05-RW-U02-classroom:video","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[41],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0114e107e5f45907d61f083905e0cb64cd80adeaa1cad8a7b497cf11d2f49e37.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/86a04a5043de87c99f0bf0a8-L5RW-U02.mp4","captions":[{"start":0.72,"end":2.62,"text":"So this is what I'm talking about."},{"start":2.74,"end":5.62,"text":"This is Life Magazine, 1953."},{"start":7.06,"end":8.52,"text":"One ad after another in here."},{"start":8.56,"end":13.64,"text":"It just kind of shows every single visual bad habit\nthat was like endemic in those days."},{"start":14.34,"end":17.28,"text":"You've got zany hand lettering everywhere,"},{"start":17.68,"end":19.98,"text":"just exclamation points, exclamation points,\nexclamation points."},{"start":20.58,"end":23.52,"text":"Cursive wedding invitation typography down here,\nreading,"},{"start":24.04,"end":25.76,"text":"almost everyone appreciates the best."},{"start":26.44,"end":28.08,"text":"This was everywhere in the 50s."},{"start":28.08,"end":29.72,"text":"This is how everything looked in the 50s."},{"start":29.92,"end":30.74,"text":"You cut to,"},{"start":31.08,"end":34.38,"text":"this is after Helvetica was in full swing, same\nproduct,"},{"start":34.84,"end":35.58,"text":"no people,"},{"start":35.68,"end":35.98,"text":"no"},{"start":35.98,"end":37.02,"text":"smiling bakery,"},{"start":37.34,"end":41.02,"text":"just a beautiful big glass of ice cold Coke."},{"start":41.66,"end":42.62,"text":"The slogan underneath,"},{"start":43.02,"end":44.2,"text":"it's the real thing,"},{"start":44.58,"end":44.98,"text":"period."},{"start":45.42,"end":45.94,"text":"Coke,"},{"start":46.78,"end":47.22,"text":"period."},{"start":47.56,"end":49.04,"text":"In Helvetica,"},{"start":49.54,"end":49.88,"text":"period."},{"start":50.2,"end":51,"text":"Any questions?"},{"start":51.12,"end":52.06,"text":"Of course not."},{"start":52.44,"end":53.52,"text":"Drink Coke,"},{"start":54.02,"end":54.4,"text":"period."},{"start":54.84,"end":55.26,"text":"Simple."},{"start":56.62,"end":62,"text":"Governments and corporations love Helvetica because on\none hand it makes them seem neutral and efficient,"},{"start":62.46,"end":68,"text":"but also it's the smoothness of the letters makes them\nseem almost human."},{"start":68.76,"end":75.7,"text":"That is a quality they all want to convey because of\ncourse they have the image they're always fighting that\nthey are authoritarian,"},{"start":76.1,"end":79.51,"text":"they're bureaucratic, you lose yourself in them,\nthey're oppressive."},{"start":80.12,"end":84.62,"text":"So instead, by using Helvetica, they can come off\nseeming more accessible,"},{"start":85.4,"end":86.68,"text":"transparent, and accountable."}],"launchInline":true}},{"id":"B05-RW-U02-classroom:material:RW-M03","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[44],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.","sourcePage":44},{"body":"2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.","sourcePage":44},{"body":"3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?","sourcePage":44},{"body":"4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.","sourcePage":44},{"body":"6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.","sourcePage":44},{"body":"8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come.","sourcePage":44}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U02-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png","width":772,"height":1040}],"source":44,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.","sourcePage":44},{"body":"6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.","sourcePage":44},{"body":"8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come.","sourcePage":44}],"text":"1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.\n2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.\n3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?\n4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.\n6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.\n8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c0c1ef95860644b4b45994ae83ccb25e3e90883d8f03822d2ba3e891b6bb0a6.mp3"},"original":{"id":"B05-RW-U02-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U02","book":5,"track":"RW","unit":2,"title":"READING 1","kind":"material","pages":[44],"sourceImages":[{"page":44,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png","viewEvidenceReported":true}],"text":"1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.\n2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.\n3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?\n4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.\n6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.\n8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8316"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c0c1ef95860644b4b45994ae83ccb25e3e90883d8f03822d2ba3e891b6bb0a6.mp3","continueOnPage":true}},{"id":"B05-RW-U02-classroom:material:RW-M04","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[47,48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.","sourcePage":47},{"body":"2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.","sourcePage":47},{"body":"3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.","sourcePage":47},{"body":"4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.","sourcePage":48},{"body":"5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.","sourcePage":48},{"body":"6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.","sourcePage":48},{"body":"7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment.","sourcePage":48}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U02-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png","width":772,"height":1040},{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png","width":772,"height":1040}],"source":47,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.","sourcePage":47},{"body":"2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.","sourcePage":47},{"body":"3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.","sourcePage":47},{"body":"4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.","sourcePage":48},{"body":"5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.","sourcePage":48},{"body":"6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.","sourcePage":48},{"body":"7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment.","sourcePage":48}],"text":"1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.\n2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.\n3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.\n4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.\n5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.\n6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.\n7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5c504b00d6fd63faf1ed68e5483ab57a8028cde0ec0048ec7f1c79014fa8ee30.mp3"},"original":{"id":"B05-RW-U02-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U02","book":5,"track":"RW","unit":2,"title":"READING 2","kind":"material","pages":[47,48],"sourceImages":[{"page":47,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png","viewEvidenceReported":true},{"page":48,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png","viewEvidenceReported":true}],"text":"1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.\n2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.\n3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.\n4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.\n\n5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.\n6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.\n7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8328","b8329"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5c504b00d6fd63faf1ed68e5483ab57a8028cde0ec0048ec7f1c79014fa8ee30.mp3","continueOnPage":true}},{"id":"B05-RW-U02-classroom:review-1","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb438438701c61026211238f525665bd26bdaa2904acf2dbb52af8644ac5fda5.png"],"layout":"lis
