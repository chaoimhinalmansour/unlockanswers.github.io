\nand doesn’t look very professional. The\nfourth one is only a logo and does not\nreally tell us anything about the product.\nThe first and the third are the most\neffective in my opinion.\n2 In the first and second, the writing\nis bright and colourful the fonts are\ninteresting but they look more old-\nfashioned. In the third and fourth, the\nfonts are quite plain. It feels more\nmodern but also a little boring.\n3 The font affects the look of a logo,\nadvertisement, or sign by setting the\ntone and creating a visual identity. It\ncould be bold, elegant, playful, modern\nor traditional.\n4 Yes, the font does influence how people\nperceive the information. It can make a\ndifference by conveying professionalism,\ntrust, or informality depending on\nthe style.\n5 The benefits include easy readability,\nclarity, and a clean, professional\nappearance that quickly communicates\nthe message to the audience.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[{"page":40,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3b024693a4a9a0cd392a29272b49c44d8930b9c0df71a91c05ef062becb2ff59.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-que hem,\nthey're oppressive."},{"start":80.12,"end":84.62,"text":"So instead, by using Helvetica, they can come off\nseeming more accessible,"},{"start":85.4,"end":86.68,"text":"transparent, and accountable."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"2","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":29,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8303","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video again. Write examples for each main idea.","pages":[41],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0114e107e5f45907d61f083905e0cb64cd80adeaa1cad8a7b497cf11d2f49e37.png"],"provided":"","items":[{"id":"b8303.i01","label":"1","prompt":"In the 1950s, bad typography was prevalent.","options":[],"type":"gap/open"},{"id":"b8303.i02","label":"2","prompt":"Helvetica has several characteristics which make it successful.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8303.i01","label":"1","prompt":"In the 1950s, bad typography was prevalent.","options":[],"type":"gap/open"},{"kind":"item","id":"b8303.i02","label":"2","prompt":"Helvetica has several characteristics which make it successful.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/86a04a5043de87c99f0bf0a8-L5RW-U02.mp4","caption here was lots of variety and it was\nbright and colourful.\n2 Yes, it is crucial. It creates a first\nimpression, sets the tone for the brand\nand helps convey the company’s identity.\nPoor font choices might confuse or deter\npotential customers.\nNo, I don’t think it makes a big\ndifference. Nowadays it seems like\neverything looks the same anyway.\n3 One advertisement I find attractive\nis Apple’s logo and ads. The simple\nfont and apple symbol are instantly\nrecognizable. It appeals to me because\nit reflects the brand’s values. It feels\nmodern, sophisticated and professional.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8308","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read a chapter from a marketing textbook about logos. Work with a partner. Preview the text on page 44 and discuss the questions.","pages":[42],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b49391f30a4238730664a6a503f331125f4db5dfcc8ba23b13f8f190056f5a2e.p t":"____ (adj) next; happening after something else","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"id":"b8309.i04","label":"d","prompt":"____ (adj) causing little or no damage to the environment and therefore able to continue for a long time","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"id":"b8309.i05","label":"e","prompt":"____ (n) standards used for judging something","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"id":"b8309.i06","label":"f","prompt":"____ (v) to keep; to continue having","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"id":"b8309.i07","label":"g","prompt":"____ (v) to express an idea so that it is understood by other people","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"id":"b8309.i08","label":"h","prompt":"____ (v) to make someone have a particular feeling or reaction","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The researchers used specific criteria to rate the quality of the products."},{"kind":"text","text":"2 The initial report said that the business had made a 10% profit last year, but a subsequent report corrected the amount to 7%."},{"kind":"text","text":"3 The new smartphone has aroused tremendous interest in consumers in Kuwait."},{"kind":"text","text":"4 The president's speech was an effort to reinforce a positive image of the company."},{"kind":"text","text":"5 The advertisement conveys the message that these products use the most advanced technology."},{"kind":"text","text":"6 Advertisements that are evocative of childhood adventure have been successful for us in the past."}],[{"kind":"text","text":"7 We should stop using plastic and find a way to package our products that is more sustainable."},{"kind":"text","text":"8 The best way to retain customers is to give them a good price and good service."},{"kind":"item","id":"b8309.i01","label":"a","prompt":"____ (v) to provide more proof or support for an idea or opinion and make it seem true","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"}],[{"kind":"item","id":"b8309.i02","label":"b","prompt":"____ (adj) making a person remember or feel a particular thing","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"kind":"item","id":"b8309.i03","label":"c","prompt":"____ (adj) next; happening after something else","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"}],[{"kind":"item","id":"b8309.i04","label":"d","prompt":"____ (adj) causing little or no damage to the environment and therefore able to continue for a long time","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"kind":"item","id":"b8309.i05","label":"e","prompt":"____ (n) standards used for judging something","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"}],[{"kind":"item","id":"b8309.i06","label":"f","prompt":"____ (v) to keep; to continue having","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"},{"kind":"item","id":"b8309.i07","label":"g","prompt":"____ (v) to express an idea so that it is understood by other people","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"}],[{"kind":"item","id":"b8309.i08","label":"h","prompt":"____ (v) to make someone have a particular feeling or reaction","options":["criteria","subsequent","aroused","reinforce","conveys","evocative","sustainable","retain"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a reinforce b evocative c subsequent d sustainable\ne criteria f retain g convey h arouse","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8311","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the textbook chapter. Then circle the statement that gives the most complete and accurate description of a good logo.","pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/638fa171aee6c358dda743e048090bbbd144b32c7dd0519adec40c8e2cf6e79e.png"],"provided":"","items":[{"id":"b8311.i01","label":"3","prompt":"Circle the statement that gives the most complete and accurate description of a good logo.","options":["A good logo is easy for anybody to recognize and understand.","A good logo expresses a company's identity in a way that is easy to recognize.","A good logo will last forever in the public's mind.","A good logo helps the company to make a profit."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8311.i01","label":"3","prompt":"Circle the statement that gives the most complete and accurate description of a good logo.","options":["A good logo is easy for anybody to recognize and understand.","A good logo expresses a company's identity in a way that is easy to recognize.","A good logo will last forever in the public's mind.","A good logo helps the company to make a profit."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U02-classroom:material:RW-M03","title":"READING 1","text":"1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.\n2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.\n3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?\n4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.\n6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.\n8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come.","screens":["1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.","2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.","3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?","4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.","6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.","8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come."],"sources":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U02-material:B05-RW-U02:p44:SuccessfulLogo","title":"第44页 Chapter 5 教材章节","pages":[44],"text":"","screens":[],"sources":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c0c1ef95860644b4b45994ae83ccb25e3e90883d8f03822d2ba3e891b6bb0a6.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8313","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Complete the outline with information from the textbook chapter. Complete the main ideas, details and examples. Use examples from the text.","pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/638fa171aee6c358dda743e048090bbbd144b32c7dd0519adec40c8e2cf6e79e.png"],"provided":"Criteria for a successful logo\nI. Efficient form of visual communication\nA. Simple and easy to remember\nB. eria for a successful logo"},{"kind":"text","text":"I. Efficient form of visual communication"},{"kind":"text","text":"A. Simple and easy to remember"},{"kind":"text","text":"B. ____ so it is unlikely to be confused with other logos. Example: ____"},{"kind":"text","text":"C. Arouses ____ Example: ____"},{"kind":"text","text":"II. ____ and adaptable"},{"kind":"text","text":"A. Across ____ Example: ____"}],[{"kind":"text","text":"B. Across ____"},{"kind":"text","text":"1. Can shrink"},{"kind":"text","text":"2. ____ from a distance"},{"kind":"text","text":"III. Tells a ____"},{"kind":"text","text":"A. Conveys company's ____"},{"kind":"text","text":"1. Example: ____"},{"kind":"text","text":"2. Example: ____"}],[{"kind":"text","text":"B. Evokes ____"},{"kind":"item","id":"b8313.i09","label":"II.B.1 Examples","prompt":"Examples: ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U02-classroom:material:RW-M03","title":"READING 1","text":"1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.\n2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.\n3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?\n4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.\n6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.\n8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come.","screens":["1 A logo is an efficient visual form that conveys an organization's message. Logos may seem quite simple. After all, they are often just a name or very basic image, but in fact, designing a good logo takes a lot of time and thought. So, what are the criteria that define a good logo? If you ask ten different graphic designers, you may get ten different answers. However, there are some common themes.","2 A good logo is clear and simple. Simple logos are easy to remember. In studies where participants were shown hundreds of unfamiliar logos, the ones they remembered later all had simple designs. Some designers advise the use of no more than two colours. A good logo must also be unique so it will not be confused with the logo from another organization. For example, the logo for IKEA is so familiar that any new logo in those shades of blue and yellow would probably remind people of IKEA. A unique logo also arouses curiosity when people see it for the first time. They want to know more about it. When tennis star Novak Djokovic began wearing shirts by the Japanese clothing manufacturer UNIQLO, people unfamiliar with the company became curious about the odd combination of letters that make up its logo.","3 Logos should be flexible enough to adapt across time and placement. Apple's iconic logo was originally rainbow coloured, which worked in the 1970s, but today it would look dated. The subsequent grey and black Apple logo looks more contemporary, yet it retains the original design. Designers also need to consider where the logo will appear. Will it be on shopping bags? Coffee cups? Does it need to shrink down to a tiny icon on a digital device, like the Netflix N or the Facebook f? Will people be able to recognize it from far away on the side of a truck?","4 More than anything else, a logo needs to tell a story – to convey the company's identity and evoke an emotional response in the people who see it. But to be successful, the message and the response must be appropriate for the organization that the logo represents. The Barbie logo, with its easygoing yet elegant handwriting in the signature pink colour, represents the brand precisely. It is spontaneous and fun. It works for a doll, but it probably would not be effective for a bank or an insurance company.\n5 In contrast, the FedEx logo, with its block letters forming a forward pointing arrow between the 'E' and the 'x', looks like it belongs to a serious business. Its aim is to inspire confidence: we are a company you can trust to deliver your package.","6 An emotional response is particularly important for charitable organizations. The World Wide Fund for Nature (WWF) hopes that its iconic black and white panda resonates with the public, and encourages people to make a donation to support its global conservation work saving endangered species and their habitats, and reducing people's footprint for a sustainable future.\n7 Once a logo becomes widely recognized, businesses and organizations often rely more on the logo than their name. The public immediately recognizes the Nike swoosh, the McDonald's golden arches or Apple's apple. Research has shown that the more evocative the logo, the more positive the impact on customer loyalty – suggesting that the most powerful logos are those which forgo' lettering to rely on symbols.","8 Making a brand stand out from the crowd is key to the survival of a business – and a logo is one powerful tool in achieving this. For other types of organizations, it is the public's connection to the role the organization plays in society that is important, and logos can help to reinforce this. Whatever the type of organization, those who get their logos right will reap the benefits² for many years to come."],"sources":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U02-material:B05-RW-U02:p44:SuccessfulLogo","title":"第44页 Chapter 5 教材章节","pages":[44],"text":"","screens":[],"sources":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c0c1ef95860644b4b45994ae83ccb25e3e90883d8f03822d2ba3e891b6bb0a6.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"Criteria for a successful logo\nI. Efficient form of visual communication\nA.  Simple and easy to remember\nB. Unique so it is unlikely to be confused with\nother logos.\nExample: IKEA\nC.  Arouses curiosity\nExample: UNIQLO\nII. Flexible and adaptable\nA.  Across time\nExample: Apple\nB. Across placement\n1. Can shrink\nExamples: Netflix, Facebook\n2.  Can be recognized from a distance\nIII. Tells a story\nA.  Conveys company’s identity\n1. Example: Barbie\n2.  Example: FedEx\nB. Evokes emotional response\nExample: World Wide Fund for Natur af5e.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2c0c1ef95860644b4b45994ae83ccb25e3e90883d8f03822d2ba3e891b6bb0a6.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1   A logo should be simple, clear and\neasy to remember. It should be\npossible to use at a very small size. It\nshould convey the company’s identity.\n2–3  The Dropbox logo is an excellent\nexample. It features a simple, clear\ndesign of a stylized open box, which\neffectively represents the company’s\nfocus on file storage and sharing.\nThe logo is easily recognizable and\nmemorable, even at small sizes,\nand its minimalistic design conveys\nthe company’s identity of providing\nstraightforward, user-friendly\ncloud storage.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8322","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":14,"module":"READING 1","ex":"7","context":{"moduleLabel":"READING 1","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Discuss the question.","pages":[45],"sourceImages" ","interest, excitement, enthusiasm","____","6 provoke","controversy, outrage, anger, anxiety","____"],"sources":[{"page":51,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/567396a1e0a7a90fe677be861791f52af75f9a981ae3b860aa01c0042644cfc6.png"}],"kind":"task_sheet","sourceBlockIds":["b8342"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  aroused interest / aroused curiosity / generated\ninterest / generated excitement / generated\nenthusiasm\n2  evokes memories / evokes feelings / evokes emotions\n3  provoke controversy / provoke outrage / provoke\nanger / stir up opposition / stir up anger / arouse anger\n4  positive: generated interest / generated excitement /\ngenerated enthusiasm / aroused interest\nnegative: provoked controversy / stirred up trouble","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":31,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8344","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Using some of the collocations from Exercise 1, describe possible emotional responses to the unusual or difficult situations below.","pages":[51],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/567396a1e0a7a90fe677be861791f52af75f9a981ae3b860aa01c0042644cfc6.png"],"provided":"1 Imagine someone wrote something dishonest about you on social media.\n2 Imagine a famous person was going to teach your class for a day.","items":[{"id":"b8344.i01","label":"1","prompt":"Imagine someone wrote something dishonest about you on social media.","options":[],"type":"discuss/open"},{"id":"b8344.i02","label":"2","prompt":"Imagine a famous person was going to teach your class for a day.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U02-question:b8342","kind":"material-reference","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[51]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Imagine someone wrote something dishonest about you on social media."},{"kind":"text","text":"2 Imagine a famous person was going to teach your class for a day."}]],"courseMaterials":[{"id":"B05-RW-U02-publisher-sheet:b8342","title":"LANGUAGE DEVELOPMENT Ex 1 原题面","pages":[51],"text":"1 evoke\nfeeling(s), memories, emotions mixed\n2 inspire\nconfidence, awe, fear\n____\n3 arouse\ninterest, curiosity, suspicion, anger\n____\n4 stir up\ntrouble, opposition, feelings, anger\n____\n5 generate\ninterest, excitement, enthusiasm\n____\n6 provoke\ncontroversy, outrage, anger, anxiety\n____","screens":["1 evoke","feeling(s), memories, emotions mixed","2 inspire","confidence, awe, fear","____","3 arouse","interest, curiosity, suspicion, anger","____","4 stir up","trouble, opposition, feelings, anger","____","5 generate","interest, excitement, enthusiasm","____","6 provoke","controversy, outrage, anger, anxiety","____"],"sources":[{"page":51,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/567396a1e0a7a90fe677be861791f52af75f9a981ae3b860aa01c0042644cfc6.png"}],"kind":"task_sheet","sourceBlockIds":["b8342"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Seeing something dishonest about\nmyself on social media would arouse\nanger but also curiosity. I would wonder\nwhy someone chose to write something\nnegative about me. It would also\nprovoke anger, because I dislike people\nwho lie.\n2 A famous person teaching my class\nwould generate enthusiasm among\nmy classmates. It may also inspire\nawe, depending on how famous the\nperson is.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8346","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"PARAPHRASING"},"instruction":"Match the paraphrases (a–c) to the statements (1–3).","pages":[52],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c494008b0e35f52ee2dc52875eb7ef55da9d8441b2c1fa593b7a5766fdb2ede8.png"],"provided":"","items":[{"id":"b8346.i01","label":"1","prompt":"Logos are commonly used by organizations to promote their identity and to increase public recognition. ____","options":["To make it easier for customers to connect an image to an organization, logos often echo how the company began, what products they offer and what they are called.","Establishing what a company represents and making people more aware of them is often the purpose of logos.","Because colour can evoke the past, it is an important aspect of a logo, helping customers remember it and tell it apart from other logos it might resemble."],"type":"choice/closed"},{"id":"b8346.i02","label":"2","prompt":"Many companies choose logos that reflect their name, origins or products so that consumers can easily associate the logo with the company. ____","options":["To make it easier for customers to connect an image to an organization, logos often echo how the company began, what products they offer and what they are called.","Establishing what a company represents and making people more aware of them is often the purpose of logos.","Because colour can evoke the past, it is an important aspect of a logo, helping customers remember it and tell it apart from other logos it might resemble."],"type":"choice/closed"},{"id":"b8346.i03","label":"3","prompt":"Colour is a crucial element of any logo because colours help anchor the logo in consumers' memories, allowing them to distinguish the logo from other, similar logos. ____","options":["To make it easier for customers to connect an image to an organization, logos often echo how the company began, what products they offer and what they are called.","Establishing what a company represents and making people more aware of them is often the purpose of logos.","Because colour can evoke the past, it is an important aspect of a logo, helping customers remember it and tell it apart from other logos it might resemble."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8346.i01","label":"1","prompt":"Logos are commonly used by organizations to promote their identity and to increase public recognition. ____","options":["To make it easier for customers to connect an image to an organization, logos often echo how the company began, what products they offer and what they are called.","Establishing what a company represents and making people more aware of them is often the purpose of logos.","Because colour can evo content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png"},{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Some businesses decide to rebrand\nbecause they want to create a more\npositive reputation.\n2 When newer businesses become\nestablished and begin to find success,\nthey might update their logo to reach a\nbroader base of customers.\n3 Logos must remain identifiable, even if\nthey get smaller to fit onto the screens\nof smaller devices.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8325","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":20,"module":"READING 2","ex":"1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read another chapter in the textbook. Preview the chapter on pages 47–48 and discuss the questions with a partner.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac997b56f6dd918ad89648ddbf8e7864f8a5ff268aeb0dd167ba15b7dca4481d.png"],"provided":"","items":[{"id":"b8325.i01","label":"1","prompt":"The chapter title uses the word 'brand' to describe an action and adds the prefix 're-'. What does 'rebranding' involve?","options":[],"type":"discuss/open"},{"id":"b8325.i02","label":"2","prompt":"Several major companies rebranded in 2023. What are some reasons these companies may have rebranded?","options":[],"type":"discuss/open"},{"id":"b8325.i03","label":"3","prompt":"Would you mind if one of your favourite brands changed their logo? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8325.i01","label":"1","prompt":"The chapter title uses the word 'brand' to describe an action and adds the prefix 're-'. What does 'rebranding' involve?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8325.i02","label":"2","prompt":"Several major companies rebranded in 2023. What are some reasons these companies may have rebranded?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8325.i03","label":"3","prompt":"Would you mind if one of your favourite brands changed their logo? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-RW-U02-publisher-page:p047","title":"原题或核对备注所引第47页","pages":[47],"text":"","screens":[],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B05-RW-U02-publisher-page:p048","title":"原题或核对备注所引第48页","pages":[48],"text":"","screens":[],"sources":[{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Rebranding involves a company\nchanging their image and/or trying to\nredefine what the public thinks about\nthem. For any company, it is most likely\na long and expensive process.\n2 These companies have all been around\nfor a long time, so they needed to\nupdate their brands in order to appeal\nto a new generation. They may also\nwant to distinguish themselves from\ncompetitors and avoid confusion with\nsimilar brands.\n3 Yes, I would mind. I like the feeling of\nfamiliarity I get when I purchase items\nfrom my favourite brands. If I no longer\nfelt that, I would be less likely to be a\nloyal consumer.\nNo, I wouldn’t mind, as long as the\ncompany maintained or improved the\nquality of their products.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8326","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":21,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Read the sentences and cross out one word in each that does not have a similar meaning to the words in bold.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac997b56f6dd918ad89648ddbf8e7864f8a5ff268aeb0dd167ba15b7dca4481d.png"],"provided":"","items":[{"id":"b8326.i01","label":"1","prompt":"The company is holding a contest to refine their existing logo.","options":["improve","change","create"],"type":"choice/closed"},{"id":"b8326.i02","label":"2","prompt":"She graduated from the foremost university for graphic design, so she won't have any trouble finding a job.","options":["leading","wealthy","principal"],"type":"choice/closed"},{"id":"b8326.i03","label":"3","prompt":"Because of the fashion designer's distinctive patterns, her brand is the most famous one in the world.","options":["recognizable","different","common"],"type":"choice/closed"},{"id":"b8326.i04","label":"4","prompt":"We want people to associate our products with other high-quality goods.","options":["distinguish","connect","relate"],"type":"choice/closed"},{"id":"b8326.i05","label":"5","prompt":"A recent public survey showed opposition to our new logo, so we have decided not to use it.","options":["disagreement with","offense towards","objection to"],"type":"choice/closed"},{"id":"b8326.i06","label":"6","prompt":"In our meeting, we discussed strategic changes we should make to our brand so we can attract more customers.","options":["trivial","tactical","calculated"],"type":"choice/closed"},{"id":"b8326.i07","label":"7","prompt":"If the logo resembles a familiar person or animal, consumers will connect with it more easily.","options":["looks like","is similar to","competes with"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8326.i01","label":"1","prompt":"The company is holding a contest to refine their existing logo.","options":["improve","change","create"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":2}},{"kind":"item","id":"b8326.i02","label":"2","prompt":"She graduated from the foremost university for graphic design, so she won't have any trouble finding a job.","options":["leading","wealthy","principal"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":1}},{"kind":"item","id":"b8326.i03","label":"3","prompt":"Because of the fashion designer's distinctive patterns, her brand is the most famous one in the world.","options":["recognizable","different","common"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":2}}],[{"kind":"item","id":"b8326.i04","label":"4","prompt":"We want people to associate our products with other high-quality goods.","options":["distinguish","connect","relate"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":0}},{"kind":"item","id":"b8326.i05","label":"5","prompt":"A recent public survey showed opposition to our new logo, so we have decided not to use it.","options":["disagreement with","offense towards","objection to"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":1}},{"kind":"item","id":"b8326.i06","label":"6","prompt":"In our meeting, we discussed strategic changes we should make to our brand so we can attract more customers.","options":["trivial","tactical","calculated"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":0}}],[{"kind":"item","id":"b8326.i07","label":"7","prompt":"If the logo resembles a familiar person or animal, consumers will connect with it more easily.","options":["looks like","is similar to","competes with"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":2}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 create 2 wealthy 3 common 4 distinguish\n5 offense towards 6 trivial 7 competes with","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f up and evolved. ____","options":[],"type":"gap/closed"}]],"courseMaterials":[{"id":"B05-RW-U02-classroom:material:RW-M04","title":"READING 2","text":"1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.\n2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.\n3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.\n4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.\n5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.\n6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.\n7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment.","screens":["1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.","2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped il service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.\n2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.\n3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.\n4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.\n5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.\n6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.\n7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost imated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.","7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment."],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png","width":772,"height":1040},{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U02-publisher-page:p050","title":"原题或核对备注所引第50页","pages":[50],"text":"","screens":[],"sources":[{"page":50,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c9ae28203eac72215c8b058ddf66b37cf1acdbbd512b172247903bdc00803aa.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B05-RW-U02-material:B05-RW-U02:p47-48:Rebranding","title":"第47–48页 Chapter 6 教材章节","pages":[47,48],"text":"","screens":[],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a39636 //raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8339","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":27,"module":"READING 2","ex":"8","context":{"moduleLabel":"READING 2","phaseTitle":"DISCUSSION"},"instruction":"Use ideas from Reading 1 and Reading 2 to complete the task.","pages":[50],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c9ae28203eac72215c8b058ddf66b37cf1acdbbd512b172247903bdc00803aa.png"],"provided":"Think of a company or product you believe should rebrand. Write an email to the company explaining why you think they should rebrand and give them some ideas for a new logo.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Think of a company or product you believe should rebrand. Write an email to the company explaining why you think they should rebrand and give them some ideas for a new logo."}]],"courseMaterials":[{"id":"B05-RW-U02-classroom:material:RW-M04","title":"READING 2","text":"1 Businesses need to be able to change as markets change. To keep up with changes, they frequently update their brands and advertising in a process called rebranding. Rebranding often prompts these companies to redesign their logos at the same time. Take Netflix, for example. The company was founded in 1997 as a DVD-by-mail service. The logo featured the brand name as two separate words, with the image of a film reel swirling between them. The company rebranded over the years as it developed, first into a streaming service and then into a production company. The current logo was introduced in 2014, featuring a signature red colour to display the Netflix name. In 2016, the company's distinctive letter N was added to their branding. This is used on their app and to identify original programming on the streaming platform.\n2 Rebranding and new logo designs are always strategic decisions. They may be needed because a company has changed its focus. For example, Xerox, a company whose primary product was once photocopiers, wanted to call attention to the fact that it handles a much wider range of document technology now. Some companies may want to change their image because there have been some negative associations with their old one. For example, Kentucky Fried Chicken hoped to distance itself from unhealthy fried foods. When it redesigned the product's logo, the word 'fried' disappeared and only the initials, KFC, remained. The logo for oil company British Petroleum (BP) looked like any sign you might see at a gas station. Customers often associate fossil fuels with climate change and a negative impact on the environment, so BP opted for a 'greener' logo, one that resembles a sunflower.\n3 Some brands simply mature and need a new logo to show this. Many high-tech companies, often founded by young entrepreneurs, begin with logos that reflect the age of their founders. If the companies are successful and begin to appeal to a wider audience, they may want to refine their logo. Both Spotify, the music and video streaming service, and Snapchat, the image messaging app, have gone through this process. Spotify's earlier, youthful logo has recently evolved into a simple graphic that evokes sound waves. Snapchat's cute ghost has lost its silly face, retaining only the figure's outline.\n4 The public generally resists changes to familiar logos at first. However, opposition to the new design usually dies down after a while, especially if the new logo retains some familiar elements. For example, the new BP logo kept the colour scheme of the old logo, and the new KFC logo retains the familiar bearded face of its founder, Colonel Sanders. If there is too much change, however, customers may become confused or reject the change. Executives at PepsiCo found this out when they changed the logo for one of their brands: Tropicana orange juice. Customers were looking for the familiar orange with a straw; they did not recognize the product with the new logo, which consisted of an ordinary glass of orange juice, as Tropicana. Sales dropped dramatically, and PepsiCo brought back the old logo.\n5 A final reason for a new logo design comes from technology. New platforms $^{1}$ may necessitate modifications. As devices become smaller, logos need to be simpler and easier to recognize on a small scale. Companies like Airbnb and PayPal dropped their names and chose simpler graphics for their latest logos so that users can identify them more easily on their mobile devices.\n6 Changes in technology can place limits on logo designs, but can also offer new options. In particular, as more business and personal interactions take place in digital environments, more companies are creating logos that are animated and interactive. The foremost example of this is Google's latest logo, which appeared in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.\n7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with  in 2015. The new logo has the same four basic colours as the old logo, but it transforms into a number of different images, depending on the product. For example, at the start of a Google voice search, the logo transforms into four dots in the Google colours, then into four wiggling lines that look like sound waves.","7 New logos can be expensive. The sunflower logo cost BP £4.6 million to design, and a further £132 million to rebrand all its assets. New logos can also be risky. PepsiCo lost $33 million in revenue on top of the cost of rebranding twice with its short-lived Tropicana logo. Yet, for most companies, the process can inject new energy into a brand, and is therefore considered worth the investment."],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png","width":772,"height":1040},{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U02-material:B05-RW-U02:p44:SuccessfulLogo","title":"第44页 Chapter 5 教材章节","pages":[44],"text":"","screens":[],"sources":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/efac8c2342429db2c1e53fee3dcc1be28d5b705afb1a10b85b128f14111daf5e.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]},{"id":"B05-RW-U02-material:B05-RW-U02:p47-48:Rebranding","title":"第47–48页 Chapter 6 教材章节","pages":[47,48],"text":"","screens":[],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92aeae9f7377a396361384c4943f93c5ab89479a2318282c78ca4c10bf516cd0.png"},{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7f5630484466e6474cc9d2ecfb4ca1fc606d7c1ad53967d88cc71789fa220acf.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5c504b00d6fd63faf1ed68e5483ab57a8028cde0ec0048ec7f1c79014fa8ee30.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Dear Microsoft,\nI think it is time to take a look at your\nbrand and consider refining your logo.\nI understand that your company has\nexisted for a long time and that you have\nmany loyal customers. For those reasons,\nI believe your customers would support\nrebranding and remain faithful to you.\nThere are a few reasons why I think you\nshould rebrand. I read an article that stated\nhow important it is for logos to provoke an\nemotional response. Therefore, you should\nchange your logo to an image that arouses\ncuriosity and stirs up feelings in your\nconsumers. You might think about changing\nthe existing colours to shades that are more\nvibrant, or adding an element of movement\nto your logo. As it appears now, the logo\nis somewhat flat. I would like to see a new\nlogo that evokes more power and energy.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U02-question:b8350","book":5,"unit":2,"track":"RW","topic":"DESIGN","lesson":2,"order":28,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Review the entire outline (Parts I, II and III) of the criteria for a successful logo on page 43. Write the criteria below.","pages":[53],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e99771858b79ac467b7a7cff6902dd2d94ac6c427951ce606057a51c34aefd65.png"],"provided":"","items":[{"id":"b8350.i01","label":"1","prompt":"____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U02-question:b8313","kind":"student-work","title":"READING 1 Ex 4","pages":[43]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U02-publisher-page:p043","title":"原题或核对备注所引第43页","pages":[43],"text":"","screens":[],"sources":[{"page":43,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/638fa171aee6c358dda743e048090bbbd144b32c7dd0519adec40c8e2cf6e79e.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Efficient: simple and easy to remember, unique, arouses\ncuriosity\nFlexible and adaptable across time and placement (can\nshrink and be recognized from a distance)\nTells a story: conveys a company’s identity and evokes an\nemotional response","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632 a logo? Add them to your list. Reorder your list if necessary.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U02-question:b8319","kind":"student-work","title":"READING 1 Ex 5","pages":[45]},{"id":"B05-RW-U02-question:b8350","kind":"student-work","title":"CRITICAL THINKING Ex 1","pages":[53]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Which criteria do you think are crucial for a successful logo?"},{"kind":"text","text":"Which are important but not essential? Based on your discussion in Exercise 5 on page 45, are some criteria not valid at all?"},{"kind":"text","text":"Choose the top five criteria and rank them in order of importance."},{"kind":"text","text":"1  "},{"kind":"text","text":"2  "},{"kind":"text","text":"3 ____  "}],[{"kind":"text","text":"4  "},{"kind":"text","text":"5 ____"},{"kind":"text","text":"2 Compare your ordered list with a partner's. Discuss any differences between the two lists. Explain your order to your partner. Make any changes that you agree on."},{"kind":"text","text":"3 Work with a partner. Are there additional criteria that you think are important or helpful in creating a logo? Add them to your list. Reorder your list if necessary."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Efficient form of visual communication:\nsimple and easy to remember\n2 Flexible and adaptable across\nplacement: can shrink (must remain\nrecognizable and effective at\nvarious sizes, ensuring versatility in\ndifferent applications.\n3 Tells a story: conveys company’s identity\n4 Flexible and adaptable across time:\na timeless logo that remains relevant\nover the years avoids the need for\nfrequent redesigns and maintains\nbrand consistency.\n5 Efficient form of visual communication:\nunique so it is unlikely to be confused\nwith other logos, helps avoid confusion\nwith competitors and strengthens\nbrand identity.","references":[{"source":"https://raw.githubusercontent.
