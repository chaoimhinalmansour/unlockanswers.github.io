e the test-taking\nexperience.\n2 This powerful tool has the potential\n– if used appropriately – to educate\ncountless students around the globe.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9266","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":45,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Refer to the Task checklist below as you prepare your essay.","pages":[228],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/540068bc75f03c04cb121a700fd6c097bbbb63980453aab34045a71406828171.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Is your opinion clearly identifiable throughout the essay?"},{"kind":"text","text":"Do all three arguments support your opinion?"},{"kind":"text","text":"Have you acknowledged and countered an opposite point of view?"},{"kind":"text","text":"Have you summarized the three main arguments in the conclusion?"},{"kind":"text","text":"Does your conclusion leave your readers something to think about?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9268","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":46,"module":"WRITING TASK","ex":"7","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words. Be sure to use formal language in your essay.","pages":[228],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/540068bc75f03c04cb121a700fd6c097bbbb63980453aab34045a71406828171.png"],"provided":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words. Be sure to use formal language in your essay.","items":[],"layout":"list","references":[{"id":"B05-RW-U09-question:b9262","kind":"student-work","title":"WRITING TASK Ex 2","pages":[227]},{"id":"B05-RW-U09-question:b9263","kind":"student-work","title":"WRITING TASK Ex 3","pages":[227]},{"id":"B05-RW-U09-question:b9264","kind":"student-work","title":"WRITING TASK Ex 4","pages":[227]},{"id":"B05-RW-U09-question:b9265","kind":"student-work","title":"WRITING TASK Ex 5","pages":[228]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Artificial intelligence is an emerging\ntechnology in education that will have\na positive impact on individual learning\nstyles, students with disabilities and\nassessments. Artificial intelligence has\nexisted in the education domain for\nsome time now. Some of the goals are to\nenhance the individual learning experience,\nsupport students with disabilities and make\nthe test-taking experience more efficient\nand productive.\nAn example of educational AI is the\nlanguage learning app Duolingo, which\nhas been using AI for several years.\nOnce users begin a lesson, the software\nassesses strengths and weaknesses and\nthen adjusts the lessons accordingly. AI\ncan evaluate current skill levels and offer\nlessons tailored to each student. Students’\nindividual needs are considered; they\nhave more control over their learning\nexperience. An example of adaptive\nlearning software is Mathspace.\nAI can enhance the learning experience\nof students with disabilities. Speech\nrecognition tools can provide subtitles\nand transcriptions for video content for\nhearing impaired students; screen readers\ncan read text out loud to students who are\nvisually impaired.\nAI-based assessments can tailor tests to\nindividual students. AI assessments can\noften evaluate tests, providing a grade and/\nor instant feedback for each student. AI\nplatforms can also track student progress\nbased on assessments and provide the\nresults to students, parents and teachers.\nThere is ongoing concern that AI\ntechnology will largely replace teachers,\ndepriving students of human interaction,\nwhich is necessary for learning. While AI\ntechnology has taken on a larger role in\nsome aspects of education, such as online\ntesting, it does not have the ability to\nreplace human interaction.\nArtificial intelligence cannot evaluate\nwhen an individual student is struggling\nwith a task or if they’re having a bad\nday. AI lacks empathy and an in-depth\nunderstanding of learning styles and\nhuman interaction. For these reasons,\nAI will not replace teachers.\nArtificial intelligence is going to reshape\nthe way students learn. It has the ability to\nconsider individual learning needs, provide\nsupport for students with disabilities and\nenhance the test-taking experience. This\npowerful tool has the potential – if used\nappropriately – to educate countless\nstudents around the globe.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[{"page":228,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/540068bc75f03c04cb121a700fd6c097bbbb63980453aab34045a71406828171.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9270","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":47,"module":"WRITING TASK","ex":"8","context":{"moduleLabel":"WRITING TASK","phaseTitle":"REVISE"},"instruction":"Use the Task checklist to review your essay for content and structure.","pages":[228],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/540068bc75f03c04cb121a700fd6c097bbbb63980453aab34045a71406828171.png"],"provided":"Use the Task checklist to review your essay for content and structure.","items":[{"id":"b9270.i01","label":"1","prompt":"Is your opinion clearly identifiable throughout the essay?","options":[],"type":"gap/open"},{"id":"b9270.i02","label":"2","prompt":"Do all three arguments support your opinion?","options":[],"type":"gap/open"},{"id":"b9270.i03","label":"3","prompt":"Have you acknowledged and countered an opposite point of view?","options":[],"type":"gap/open"},{"id":"b9270.i04","label":"4","prompt":"Have you summ program computers","example":"She wrote code to make the robot turn left.","wordAudio":"code","cardWord":false},{"term":"impersonate","pos":"(v)","definition":"to intentionally copy a person's speech or behaviour","example":"The actor can impersonate several famous singers.","wordAudio":"impersonate","cardWord":false},{"term":"misinformation","pos":"(n)","definition":"wrong information intended to deceive","example":"The organisation is working to stop the spread of misinformation.","wordAudio":"misinformation","cardWord":false},{"term":"bias","pos":"(n)","definition":"prejudice in favour of or against someone or something","example":"The study checked for bias in the way participants were selected.","wordAudio":"bias","cardWord":false},{"term":"robust","pos":"(adj)","definition":"strong and unlikely to fail","example":"The camera has a robust design for outdoor use.","wordAudio":"robust","cardWord":false},{"term":"rigorously","pos":"(adv)","definition":"in a detailed and careful way","example":"The team tested the bridge design rigorously.","wordAudio":"rigorously","cardWord":false},{"term":"safeguard","pos":"(n)","definition":"protection from harm, loss or damage","example":"A backup is a safeguard against losing your work.","wordAudio":"safeguard","cardWord":false}]]}},{"id":"B05-RW-U09-classroom:video","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[209],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de08b4ab4ac9d84968b775fd3e660dec43dfeae82d9e270ac771535281d4735a.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/6fbd74adcf45ca12b18504e6-L5RW-U09.mp4","captions":[{"start":4.84,"end":8.94,"text":"As artificial intelligence grows ever more\nsophisticated,"},{"start":9.46,"end":15.24,"text":"the idea that it might become a threat to humans is\nheard not only from science fiction writers,"},{"start":15.74,"end":16.5,"text":"but economists,"},{"start":17.08,"end":17.48,"text":"academics,"},{"start":17.8,"end":19.78,"text":"and even the AI developers."},{"start":21.2,"end":23.84,"text":"But I think there are real scenarios where there's\nmassive harm."},{"start":23.94,"end":25.14,"text":"I think there's a lot of those."},{"start":25.82,"end":29.56,"text":"Critical government service, a cyber attack on some\ncritical government service."},{"start":29.56,"end":32.94,"text":"They can deceive,"},{"start":33.5,"end":36.92,"text":"they can be propagandists, they can say all sorts of\nnonsense."},{"start":37.54,"end":39.96,"text":"There are ways that they can be abused by bad actors."},{"start":42.14,"end":45.12,"text":"It can potentially be extremely damaging."},{"start":46.66,"end":52.1,"text":"Yeah, the danger is that they don't understand the\ndifference between right and wrong, true and false."},{"start":55.14,"end":58.24,"text":"Experts believe AI presents multiple risks."},{"start":58.96,"end":63.18,"text":"People may use AI that was designed to be helpful to\ncause harm."},{"start":63.72,"end":64.68,"text":"In other cases,"},{"start":65.34,"end":70.46000000000001,"text":"failures in an AI's design may cause the systems to\nbehave in harmful ways."},{"start":71.76,"end":76.92,"text":"An AI which can write computer code could be used to\nhack vital services."},{"start":78.26,"end":85.78,"text":"Autonomous AI used for tasks such as medical diagnosis\nor air traffic control could make fatal errors."},{"start":86.84,"end":90.22,"text":"Chatbots, which can produce realistic human language,"},{"start":90.6,"end":94.56,"text":"can be used to convincingly impersonate real sources."},{"start":95.4,"end":99.84,"text":"Bad actors can use them in fraud or to spread\nmisinformation."},{"start":101.06,"end":105.75999999999999,"text":"AIs which can alter film can create videos known as\ndeepfakes,"},{"start":106.24000000000001,"end":108.97999999999999,"text":"which show people saying things they have not said."},{"start":109.82,"end":112.94,"text":"These technologies can cause public distrust,"},{"start":113.36,"end":114.53999999999999,"text":"create false beliefs,"},{"start":115,"end":117.97999999999999,"text":"and exacerbate divisions in society."},{"start":119.75999999999999,"end":126.3,"text":"AIs may also reinforce existing prejudices and biases\nthat come from the data they work with."},{"start":126.86,"end":127.74,"text":"For example,"},{"start":128.24,"end":134.54,"text":"an AI used to select job candidates may discriminate\nagainst those from particular backgrounds."},{"start":135.4,"end":139.54,"text":"And one of the biggest threats is in the nature of AI\nitself."},{"start":140.4,"end":143.4,"text":"By replicating the capabilities of humans,"},{"start":144.07999999999998,"end":145.64,"text":"AI can replace us."},{"start":146.07999999999998,"end":151.5,"text":"Some fear that mass unemployment could be caused by the\nautomation of many human tasks."},{"start":152.68,"end":155.04,"text":"So why develop AI at all?"},{"start":156.12,"end":160.9,"text":"Because it has just as much potential to solve problems\nas to hurt us."},{"start":161.64,"end":168.76,"text":"AI could advance scientific knowledge and show us how\nto solve some of humanity's biggest challenges."},{"start":169.62,"end":172.56,"text":"It could help to develop new clean energy sources,"},{"start":172.86,"end":174.3,"text":"such as nuclear fusion."},{"start":175.02,"end":181.72,"text":"It can show us how to optimize harvests in agriculture\nand how to mitigate the effects of climate change."},{"start":182.72,"end":188.96,"text":"AI used in medicine can help us live longer, healthier\nlives by detecting health problems earlier."},{"start":190,"end":196.54,"text":"It can make our jobs more interesting by automating\nrepetitive and mundane human tasks."},{"start":197.84,"end":198.12,"text":"However,"},{"start":198.5,"end":206.26,"text":"many experts feel that competition between big\ncompanies encourages them to launch AI before it is\nsafe."},{"start":207.36,"end":212.92000000000002,"text":"Everyone wants to be one step ahead of their rivals, so\nthe rival doesn't grab market share without them."},{"start":213.32,"end":214.9,"text":"And so that's what's driving it."},{"start":214.96,"end":215.72,"text":"It's competition."},{"start":216.09,"end":223.48,"text":"To avoid the harm of AI, they feel we need robust laws\nto ensure developers act responsibly."},{"start":224.46,"end":233.04,"text":"When companies rigorously test new AI and allow outside\nresearchers access to it, when they constantly monitor\nAI's behavior,"},{"start":233.48,"end":234.84,"text":"there is more safety."},{"start":235.78,"end":241.74,"text":"Experts advise that governments and industry should\nanticipate job losses to AI."},{"start":242.42,"end":247.44,"text":"Retraining employees in time for change can help avoid\nunemployment."},{"start":248.78,"end":254.46,"text":"Educators should focus on developing skills in our\nyoung people that AI cannot yet handle."},{"start":256,"end":259.44,"text":"But fighting misinformation is one of the biggest\nchallenges,"},{"start":259.78,"end":265.5,"text":"and it may be years before we have real -time fact\n-checkers or deepfake identification."},{"start":266.22,"end":273.82,"text":"For now, the best safeguard may be to teach people to\nthink critically about the sources of their\ninformation."},{"start":275.06,"end":277.18,"text":"The average person has to say to themselves,"},{"start":277.6,"end":278.15999999999997,"text":"I know."},{"start":278.42,"end":284.56,"text":"I will use a chatbot because it's very convenient,\nsaves time, but I realize that some of it is nonsense."},{"start":285.32,"end":285.72,"text":"Meanwhile,"},{"start":286.04,"end":286.58,"text":"industry,"},{"start":286.96,"end":287.38,"text":"academia,"},{"start":287.72,"end":294.65999999999997,"text":"and governments must continue to work together to\nensure AI is developed in the public interest."},{"start":294.65999999999997,"end":300.24,"text":"That way, we can avoid the harm of AI and unlock its\ngreat potential."}],"launchInline":true}},{"id":"B05-RW-U09-classroom:resource:b9199","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/27721459a28c49a7d34e89861fc193491683dae7c4dbf192e177b6d2b77e94be.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["domain (n) a field, area of knowledge, etc. belonging to or controlled by a particular person or group of people\nhazard (n) something that is dangerous and likely to cause damage\nimmersive (adj) seeming to surround the audience, player, etc. so that they feel completely involved\ninterpretation (n) translation of one language into another","projection (n) an image displayed by a device onto a separate screen or another surface\nsimultaneous (adj) happening or being done at exactly the same time\nsuperimpose (v) to put an image, words, etc. onto another image or surface\nsupplement (v) to add something to something else in order to improve it"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U09-classroom:material:RW-M03","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[211],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.","sourcePage":211},{"body":"4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","sourcePage":211}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U09-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":211,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png","width":772,"height":1040}],"source":211,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.","sourcePage":211},{"body":"4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","sourcePage":211}],"text":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.\n4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3"},"original":{"id":"B05-RW-U09-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U09","book":5,"track":"RW","unit":9,"title":"READING 1","kind":"material","pages":[211],"sourceImages":[{"page":211,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png","viewEvidenceReported":true}],"text":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.\n4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9202"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3","continueOnPage":true}},{"id":"B05-RW-U09-classroom:material:RW-M04","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[215],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.","sourcePage":215},{"body":"6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","sourcePage":215}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U09-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"AR in education – A positive or negative development?","pages":[{"page":215,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png","width":772,"height":1040}],"source":215,"embeddedIn":null,"photo":null,"clearPages":[{"body":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.","sourcePage":215},{"body":"6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","sourcePage":215}],"text":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.\n6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e70e808a369dc19cff500f08cc2ecf45f56f6ee88941133cd91e5d74e1a2afa7.mp3"},"original":{"id":"B05-RW-U09-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U09","book":5,"track":"RW","unit":9,"title":"READING 2","kind":"material","pages":[215],"sourceImages":[{"page":215,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png","viewEvidenceReported":true}],"text":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.\n6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9223"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e70e808a369dc19cff500f08cc2ecf45f56f6ee88941133cd91e5d74e1a2afa7.mp3","continueOnPage":true}},{"id":"B05-RW-U09-classroom:review-1","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[229],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/823e28c0da89038a74aa41622d47f259c70af715519e6ec11b4df74858c2392b.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-RW-U09-B-001","form":"advocate","page":229},{"id":"B05-RW-U09-B-003","form":"assert","page":229},{"id":"B05-RW-U09-B-004","form":"claim","page":229},{"id":"B05-RW-U09-B-005","form":"conclude","page":229},{"id":"B05-RW-U09-B-006","form":"domain","page":229},{"id" b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U09-classroom:material:RW-M03":[{"body":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body.","sourcePage":211,"blocks":[{"kind":"text","text":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body."}]},{"body":"These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.","sourcePage":211,"blocks":[{"kind":"text","text":"These advances are both examples of augmented reality (AR)."},{"kind":"text","text":"2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections."}]},{"body":"3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.","sourcePage":211,"blocks":[{"kind":"text","text":"3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too."}]},{"body":"4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.","sourcePage":211,"blocks":[{"kind":"text","text":"4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards."},{"kind":"text","text":"5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field."}]},{"body":"6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","sourcePage":211,"blocks":[{"kind":"text","text":"6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections."},{"kind":"text","text":"7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier."}]}],"B05-RW-U09-classroom:material:RW-M04":[{"body":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.","sourcePage":215,"blocks":[{"kind":"text","text":"AR in education – A positive or negative development?"},{"kind":"text","text":"1 From primary school to higher education, AR apps and devices are now available for use as educational aids."}]},{"body":"2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.","sourcePage":215,"blocks":[{"kind":"text","text":"2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles."},{"kind":"text","text":"3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History."}]},{"body":"4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.","sourcePage":215,"blocks":[{"kind":"text","text":"4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention."}]},{"body":"5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.","sourcePage":215,"blocks":[{"kind":"text","text":"5 Advocates of AR in education also emphasize its usefulness for schools in remote locations."}]},{"body":"6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","sourcePage":215,"blocks":[{"kind":"text","text":"6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class."},{"kind":"text","text":"7 It is evident that the adoption of AR technology by educators will be a positive development for all involved."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject "b9251.i01":{"mode":"line","answer":"Some business owners are concerned, and rightfully so, that virtual experiences will finally put an end to brick-and-mortar stores."},"b9251.i02":{"mode":"line","answer":"With AR menus (when restaurants utilize them), diners can view pictures, descriptions and ingredients of the dishes they want to order."},"b9251.i03":{"mode":"line","answer":"The couple purchased a house, which was located in a distant city, after taking a virtual tour led by their estate agent."},"b9251.i04":{"mode":"line","answer":"At some hotels, guests can scan a wall map in their room, which will then show them – via a smartphone – all the local attractions nearby."},"b9251.i05":{"mode":"line","answer":"Some car manufacturers have invented AR apps, which can be used by owners to repair minor mechanical problems, to make their cars more marketable to consumers."},"b9251.i06":{"mode":"line","answer":"Extended reality encompasses technologies (augmented reality, virtual reality) which allow people to step into another world, even if only for a few moments."}},"basis":"教材第 224 页 Ex 2 与答案手册 PDF 实际第 26 页。逗号、括号、破折号可按句法和信息层级选择。","itemPatches":{"b9251.i01":{"options":[]},"b9251.i02":{"options":[]},"b9251.i03":{"options":[]},"b9251.i04":{"options":[]},"b9251.i05":{"options":[]},"b9251.i06":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B05-RW-U09":{"aspect":1.9472617,"cues":[[4.84,8.94,"As artificial intelligence grows ever more sophisticated,","随着人工智能的不断完善"],[9.46,15.24,"the idea that it might become a threat to humans is heard not only from science fiction writers,","不仅科幻小说家认为它可能成为对人类的威胁，"],[15.74,16.5,"but economists,","但经济学家，"],[17.08,17.48,"academics,","学术界，"],[17.8,19.78,"and even the AI developers.","甚至是人工智能开发者"],[21.2,23.84,"But I think there are real scenarios where there's massive harm.","但我认为有些真实的情景会有巨大的伤害。"],[23.94,25.14,"I think there's a lot of those.","我认为有很多这样的。"],[25.82,29.56,"Critical government service, a cyber attack on some critical government service.","关键政府服务，例如针对某项关键政府服务的网络攻击。"],[29.56,32.94,"They can deceive,","他们可以欺骗，"],[33.5,36.92,"they can be propagandists, they can say all sorts of nonsense.","他们可以是宣传者，他们可以说各种胡说八道。"],[37.54,39.96,"There are ways that they can be abused by bad actors.","它们可能被恶意行为者滥用。"],[42.14,45.12,"It can potentially be extremely damaging.","这可能具有极大的破坏力。"],[46.66,52.1,"Yeah, the danger is that they don't understand the difference between right and wrong, true and false.","危险在于他们不理解对与错的区别，真与假。"],[55.14,58.24,"Experts believe AI presents multiple risks.","专家认为AI带来多种风险。"],[58.96,63.18,"People may use AI that was designed to be helpful to cause harm.","人们可能利用原本设计来帮助人的人工智能造成伤害。"],[63.72,64.68,"In other cases,","在其他情况下，"],[65.34,70.46000000000001,"failures in an AI's design may cause the systems to behave in harmful ways.","AI设计失败可能导致系统行为有害。"],[71.76,76.92,"An AI which can write computer code could be used to hack vital services.","能够编写计算机代码的人工智能，可能被用于入侵关键服务。"],[78.26,85.78,"Autonomous AI used for tasks such as medical diagnosis or air traffic control could make fatal errors.","用于医疗诊断或空中交通管制等任务的自主AI可能会产生致命错误。"],[86.84,90.22,"Chatbots, which can produce realistic human language,","能够生成逼真人类语言的聊天机器人，"],[90.6,94.56,"can be used to convincingly impersonate real sources.","可能被用来以假乱真地冒充真实信息来源。"],[95.4,99.84,"Bad actors can use them in fraud or to spread misinformation.","恶意行为者可能用它们实施欺诈或传播虚假信息。"],[101.06,105.75999999999999,"AIs which can alter film can create videos known as deepfakes,","能够篡改影像的人工智能可以制作所谓的深度伪造视频，"],[106.24000000000001,108.97999999999999,"which show people saying things they have not said.","让人看起来说了他们其实从未说过的话。"],[109.82,112.94,"These technologies can cause public distrust,","这些技术会引起公众的不信任，"],[113.36,114.53999999999999,"create false beliefs,","制造错误信念，"],[115,117.97999999999999,"and exacerbate divisions in society.","并加剧社会分裂。"],[119.75999999999999,126.3,"AIs may also reinforce existing prejudices and biases that come from the data they work with.","人工智能还可能强化其所用数据中已有的偏见和成见。"],[126.86,127.74,"For example,","举例来说，"],[128.24,134.54,"an AI used to select job candidates may discriminate against those from particular backgrounds.","用于筛选求职者的人工智能，可能歧视来自特定背景的人。"],[135.4,139.54,"And one of the biggest threats is in the nature of AI itself.","而最大的威胁之一是AI本身的性质。"],[140.4,143.4,"By replicating the capabilities of humans,","通过复制人类的能力，"],[144.07999999999998,145.64,"AI can replace us.","AI可以代替我们。"],[146.07999999999998,151.5,"Some fear that mass unemployment could be caused by the automation of many human tasks.","一些人担心，许多人类任务的自动化可能造成大规模失业。"],[152.68,155.04,"So why develop AI at all?","那为什么要开发人工智能呢？"],[156.12,160.9,"Because it has just as much potential to solve problems as to hurt us.","因为它既有解决问题的巨大潜力，也可能伤害我们。"],[161.64,168.76,"AI could advance scientific knowledge and show us how to solve some of humanity's biggest challenges.","AI可以推进科学知识，告诉我们如何解决人类面临的一些最大挑战。"],[169.62,172.56,"It could help to develop new clean energy sources,","它可以帮助开发新的清洁能源，"],[172.86,174.3,"such as nuclear fusion.","例如核聚变。"],[175.02,181.72,"It can show us how to optimize harvests in agriculture and how to mitigate the effects of climate change.","它可以向我们展示如何优化农业收获以及如何减轻气候变化的影响。"],[182.72,188.96,"AI used in medicine can help us live longer, healthier lives by detecting health problems earlier.","在医学中使用的AI可以通过更早的发现健康问题来帮助我们过上更长，更健康的生活。"],[190,196.54,"It can make our jobs more interesting by automating repetitive and mundane human tasks.","它可以使我们的工作更加有趣，使重复的和普通的人类任务自动化。"],[197.84,198.12,"However,","不过，"],[198.5,206.26,"many experts feel that competition between big companies encourages them to launch AI before it is safe.","许多专家认为，大公司之间的竞争会促使它们在人工智能尚未安全时就推出产品。"],[207.36,212.92000000000002,"Everyone wants to be one step ahead of their rivals, so the rival doesn't grab market share without them.","每个人都想领先竞争对手一步，免得对手在他们之前抢走市场份额。"],[213.32,214.9,"And so that's what's driving it.","因此，这就是驱动它。"],[214.96,215.72,"It's competition.","这是竞争。"],[216.09,223.48,"To avoid the harm of AI, they feel we need robust laws to ensure developers act responsibly.","为了避免AI的伤害，他们觉得我们需要强有力的法律来确保开发者负责地行动。"],[224.46,233.04,"When companies rigorously test new AI and allow outside researchers access to it, when they constantly monitor AI's behavior,","当公司严格测试新的AI并允许外部研究人员访问时，当他们不断监控AI的行为时，"],[233.48,234.84,"there is more safety.","安全性就会更高。"],[235.78,241.74,"Experts advise that governments and industry should anticipate job losses to AI.","专家建议政府和产业界应预先应对人工智能造成的失业。"],[242.42,247.44,"Retraining employees in time for change can help avoid unemployment.","及时对雇员进行再培训以避免失业。"],[248.78,254.46,"Educators should focus on developing skills in our young people that AI cannot yet handle.","教育者应重视培养人工智能尚无法胜任的青年技能。"],[256,259.44,"But fighting misinformation is one of the biggest challenges,","但打击错误信息是最大的挑战之一"],[259.78,265.5,"and it may be years before we have real -time fact -checkers or deepfake identification.","我们可能还要多年才能拥有实时事实核查工具或深度伪造识别技术。"],[266.22,273.82,"For now, the best safeguard may be to teach people to think critically about the sources of their information.","目前，最好的保障可能是教育人们认真思考其信息来源。"],[275.06,277.18,"The average person has to say to themselves,","普通人必须对自己说，"],[277.6,278.15999999999997,"I know.","我知道，"],[278.42,284.56,"I will use a chatbot because it's very convenient, saves time, but I realize that some of it is nonsense.","我会使用聊天机器人，因为它方便又节省时间，但我也明白其中有些内容并不可靠。"],[285.32,285.72,"Meanwhile,","同时，"],[286.04,286.58,"industry,","工业，"],[286.96,287.38,"academia,","学术界，"],[287.72,294.65999999999997,"and governments must continue to work together to ensure AI is developed in the public interest.","产业界、学术界和政府必须继续合作，确保人工智能的开发符合公共利益。"],[294.65999999999997,300.24,"That way, we can avoid the harm of AI and unlock its great potential.","这样，我们就可以避免AI的伤害，并释放它的巨大潜力。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B05-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bca4b38a5788ec6ada449ac84df843375dac881fc02b042173e99ae3b588622.pdf","size":27488549}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-L async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;

 current=i;part=p;

function outside(el,bounds){

 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
