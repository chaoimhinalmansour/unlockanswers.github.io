program computers","example":"She wrote code to make the robot turn left.","wordAudio":"code","cardWord":false},{"term":"impersonate","pos":"(v)","definition":"to intentionally copy a person's speech or behaviour","example":"The actor can impersonate several famous singers.","wordAudio":"impersonate","cardWord":false},{"term":"misinformation","pos":"(n)","definition":"wrong information intended to deceive","example":"The organisation is working to stop the spread of misinformation.","wordAudio":"misinformation","cardWord":false},{"term":"bias","pos":"(n)","definition":"prejudice in favour of or against someone or something","example":"The study checked for bias in the way participants were selected.","wordAudio":"bias","cardWord":false},{"term":"robust","pos":"(adj)","definition":"strong and unlikely to fail","example":"The camera has a robust design for outdoor use.","wordAudio":"robust","cardWord":false},{"term":"rigorously","pos":"(adv)","definition":"in a detailed and careful way","example":"The team tested the bridge design rigorously.","wordAudio":"rigorously","cardWord":false},{"term":"safeguard","pos":"(n)","definition":"protection from harm, loss or damage","example":"A backup is a safeguard against losing your work.","wordAudio":"safeguard","cardWord":false}]]}},{"id":"B05-RW-U09-classroom:video","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[209],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de08b4ab4ac9d84968b775fd3e660dec43dfeae82d9e270ac771535281d4735a.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/6fbd74adcf45ca12b18504e6-L5RW-U09.mp4","captions":[{"start":4.84,"end":8.94,"text":"As artificial intelligence grows ever more\nsophisticated,"},{"start":9.46,"end":15.24,"text":"the idea that it might become a threat to humans is\nheard not only from science fiction writers,"},{"start":15.74,"end":16.5,"text":"but economists,"},{"start":17.08,"end":17.48,"text":"academics,"},{"start":17.8,"end":19.78,"text":"and even the AI developers."},{"start":21.2,"end":23.84,"text":"But I think there are real scenarios where there's\nmassive harm."},{"start":23.94,"end":25.14,"text":"I think there's a lot of those."},{"start":25.82,"end":29.56,"text":"Critical government service, a cyber attack on some\ncritical government service."},{"start":29.56,"end":32.94,"text":"They can deceive,"},{"start":33.5,"end":36.92,"text":"they can be propagandists, they can say all sorts of\nnonsense."},{"start":37.54,"end":39.96,"text":"There are ways that they can be abused by bad actors."},{"start":42.14,"end":45.12,"text":"It can potentially be extremely damaging."},{"start":46.66,"end":52.1,"text":"Yeah, the danger is that they don't understand the\ndifference between right and wrong, true and false."},{"start":55.14,"end":58.24,"text":"Experts believe AI presents multiple risks."},{"start":58.96,"end":63.18,"text":"People may use AI that was designed to be helpful to\ncause harm."},{"start":63.72,"end":64.68,"text":"In other cases,"},{"start":65.34,"end":70.46000000000001,"text":"failures in an AI's design may cause the systems to\nbehave in harmful ways."},{"start":71.76,"end":76.92,"text":"An AI which can write computer code could be used to\nhack vital services."},{"start":78.26,"end":85.78,"text":"Autonomous AI used for tasks such as medical diagnosis\nor air traffic control could make fatal errors."},{"start":86.84,"end":90.22,"text":"Chatbots, which can produce realistic human language,"},{"start":90.6,"end":94.56,"text":"can be used to convincingly impersonate real sources."},{"start":95.4,"end":99.84,"text":"Bad actors can use them in fraud or to spread\nmisinformation."},{"start":101.06,"end":105.75999999999999,"text":"AIs which can alter film can create videos known as\ndeepfakes,"},{"start":106.24000000000001,"end":108.97999999999999,"text":"which show people saying things they have not said."},{"start":109.82,"end":112.94,"text":"These technologies can cause public distrust,"},{"start":113.36,"end":114.53999999999999,"text":"create false beliefs,"},{"start":115,"end":117.97999999999999,"text":"and exacerbate divisions in society."},{"start":119.75999999999999,"end":126.3,"text":"AIs may also reinforce existing prejudices and biases\nthat come from the data they work with."},{"start":126.86,"end":127.74,"text":"For example,"},{"start":128.24,"end":134.54,"text":"an AI used to select job candidates may discriminate\nagainst those from particular backgrounds."},{"start":135.4,"end":139.54,"text":"And one of the biggest threats is in the nature of AI\nitself."},{"start":140.4,"end":143.4,"text":"By replicating the capabilities of humans,"},{"start":144.07999999999998,"end":145.64,"text":"AI can replace us."},{"start":146.07999999999998,"end":151.5,"text":"Some fear that mass unemployment could be caused by the\nautomation of many human tasks."},{"start":152.68,"end":155.04,"text":"So why develop AI at all?"},{"start":156.12,"end":160.9,"text":"Because it has just as much potential to solve problems\nas to hurt us."},{"start":161.64,"end":168.76,"text":"AI could advance scientific knowledge and show us how\nto solve some of humanity's biggest challenges."},{"start":169.62,"end":172.56,"text":"It could help to develop new clean energy sources,"},{"start":172.86,"end":174.3,"text":"such as nuclear fusion."},{"start":175.02,"end":181.72,"text":"It can show us how to optimize harvests in agriculture\nand how to mitigate the effects of climate change."},{"start":182.72,"end":188.96,"text":"AI used in medicine can help us live longer, healthier\nlives by detecting health problems earlier."},{"start":190,"end":196.54,"text":"It can make our jobs more interesting by automating\nrepetitive and mundane human tasks."},{"start":197.84,"end":198.12,"text":"However,"},{"start":198.5,"end":206.26,"text":"many experts feel that competition between big\ncompanies encourages them to launch AI before it is\nsafe."},{"start":207.36,"end":212.92000000000002,"text":"Everyone wants to be one step ahead of their rivals, so\nthe rival doesn't grab market share without them."},{"start":213.32,"end":214.9,"text":"And so that's what's driving it."},{"start":214.96,"end":215.72,"text":"It's competition."},{"start":216.09,"end":223.48,"text":"To avoid the harm of AI, they feel we need robust laws\nto ensure developers act responsibly."},{"start":224.46,"end":233.04,"text":"When companies rigorously test new AI and allow outside\nresearchers access to it, when they constantly monitor\nAI's behavior,"},{"start":233.48,"end":234.84,"text":"there is more safety."},{"start":235.78,"end":241.74,"text":"Experts advise that governments and industry should\nanticipate job losses to AI."},{"start":242.42,"end":247.44,"text":"Retraining employees in time for change can help avoid\nunemployment."},{"start":248.78,"end":254.46,"text":"Educators should focus on developing skills in our\nyoung people that AI cannot yet handle."},{"start":256,"end":259.44,"text":"But fighting misinformation is one of the biggest\nchallenges,"},{"start":259.78,"end":265.5,"text":"and it may be years before we have real -time fact\n-checkers or deepfake identification."},{"start":266.22,"end":273.82,"text":"For now, the best safeguard may be to teach people to\nthink critically about the sources of their\ninformation."},{"start":275.06,"end":277.18,"text":"The average person has to say to themselves,"},{"start":277.6,"end":278.15999999999997,"text":"I know."},{"start":278.42,"end":284.56,"text":"I will use a chatbot because it's very convenient,\nsaves time, but I realize that some of it is nonsense."},{"start":285.32,"end":285.72,"text":"Meanwhile,"},{"start":286.04,"end":286.58,"text":"industry,"},{"start":286.96,"end":287.38,"text":"academia,"},{"start":287.72,"end":294.65999999999997,"text":"and governments must continue to work together to\nensure AI is developed in the public interest."},{"start":294.65999999999997,"end":300.24,"text":"That way, we can avoid the harm of AI and unlock its\ngreat potential."}],"launchInline":true}},{"id":"B05-RW-U09-classroom:resource:b9199","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/27721459a28c49a7d34e89861fc193491683dae7c4dbf192e177b6d2b77e94be.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["domain (n) a field, area of knowledge, etc. belonging to or controlled by a particular person or group of people\nhazard (n) something that is dangerous and likely to cause damage\nimmersive (adj) seeming to surround the audience, player, etc. so that they feel completely involved\ninterpretation (n) translation of one language into another","projection (n) an image displayed by a device onto a separate screen or another surface\nsimultaneous (adj) happening or being done at exactly the same time\nsuperimpose (v) to put an image, words, etc. onto another image or surface\nsupplement (v) to add something to something else in order to improve it"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U09-classroom:material:RW-M03","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[211],"sourceIma ky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.\n4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3"},"original":{"id":"B05-RW-U09-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U09","book":5,"track":"RW","unit":9,"title":"READING 1","kind":"material","pages":[211],"sourceImages":[{"page":211,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png","viewEvidenceReported":true}],"text":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.\n4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9202"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3","continueOnPage":true}},{"id":"B05-RW-U09-classroom:material:RW-M04","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[215],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.","sourcePage":215},{"body":"6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","sourcePage":215}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U09-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"AR in education – A positive or negative development?","pages":[{"page":215,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png","width":772,"height":1040}],"source":215,"embeddedIn":null,"photo":null,"clearPages":[{"body":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.","sourcePage":215},{"body":"6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","sourcePage":215}],"text":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.\n6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e70e808a369dc19cff500f08cc2ecf45f56f6ee88941133cd91e5d74e1a2afa7.mp3"},"original":{"id":"B05-RW-U09-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U09","book":5,"track":"RW","unit":9,"title":"READING 2","kind":"material","pages":[215],"sourceImages":[{"page":215,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png","viewEvidenceReported":true}],"text":"AR in education – A positive or negative development?\n1 From primary school to higher education, AR apps and devices are now available for use as educational aids.\n2 One of the greatest benefits of using AR in education so far is that it has brought science to life. Students can view and manipulate the 3D objects from all angles.\n3 The potential of AR to bring the same life to other subjects is equally promising, for example Geography and History.\n4 Educational researchers assert that one of the major outcomes of using AR in the classroom is an increase in student motivation. S. Özeren and E. Top (2023) state that students who used AR reported greater enjoyment. Alzahrani (2020) maintains that educational AR applications increase student engagement, concentration and knowledge retention.\n5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.\n6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9223"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e70e808a369dc19cff500f08cc2ecf45f56f6ee88941133cd91e5d74e1a2afa7.mp3","continueOnPage":true}},{"id":"B05-RW-U09-classroom:review-1","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[229],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/823e28c0da89038a74aa41622d47f259c70af715519e6ec11b4df74858c2392b.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-RW-U09-B-001","form":"advocate","page":229},{"id":"B05-RW-U09-B-003","form":"assert","page":229},{"id":"B05-RW-U09-B-004","form":"claim","page":229},{"id":"B05-RW-U09-B-005","form":"conclude","page":229},{"id":"B05-RW-U09-B-006","form":"domain","page":229},{"id"  (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;
 const size=c.feedback?.pageSize??(plan?.showAll?Math.max(1,items.length):plan?.kind==="definitions"?3:c.layout==="grid"?6:equalOptions?3:sourceItems.some(x=>x.options?.length>2)?2:4);
 const chunks=items.length?Array.from({length:Math.ceil(items.length/size)},(_,i)=>items.slice(i*size,(i+1)*size)):[[]];
 return {table,equalOptions,bank:equalOptions?sourceItems[0].options:[],chunks,provided,decks};
}
function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){
 return '<div class="split">'+groups.map(group=>'<section class="panel v-block">'+group.map(block=>
  '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';
}
function materialSplit(decks,task,feedback){
 const tabs=decks.map((deck,i)=>'<button type="button" data-deck="'+i+'" aria-pressed="'+(i===0)+'">'+esc(deck.label)+'</button>').join("");
 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+
  '<section class="panel v-block material-task" data-fixed-task aria-label="课堂任务">'+task+'</section></div>';
}
function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function originalButton(c,page,label){
 return '<button type="button" data-original-case="'+esc(c.id)+'" data-original-page="'+page+'">'+label+'</button>';
}

 const binding=bind(c), readingPage=binding.reading?binding.chunks[p]:null;
 const heading=classroomStage.heading(c,classroom.header(c));

 const isGlossary=c.flow?.kind==="glossary";
 const contentClass=(c.stageSkill?" stage-skill-content":"")+(binding.decks?.length?" with-materials":"")+(c.flow?.kind==="cards"?" with-word-card":"")+
  (c.feedback?.placement==="inline"?(c.presentation?.kind==="map-labels"?" with-inline-map":" with-inline-check"):"");
 const course=coursePanels(c,p);
 const playback=c.playback?.launchInline?null:classroom.playback(c);
 const audio=playback?.type==="audio"?playbackHTML(playback):"";
 const video=playback?.type==="video"?playbackHTML(playback,c.flow?.kind!=="video"):"";
 const reader=classroom.reader(c)?'<button type="button" data-reader-toggle aria-expanded="false">读全文</button>':"";
 const record=c.work?'<button type="button" data-record-toggle aria-expanded="false">记录</button>':"";
 const related=!referenceIsInline(c)&&classroom.related(c).length?'<button type="button" data-reference-toggle aria-expanded="false">前题</button>':"";

 return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="'+esc(base)+'"><link rel="stylesheet" href="assets/classroom-typography.css"><link rel="stylesheet" href="prototype-style.css"><link rel="stylesheet" href="../shared/course-view.css"><link rel="stylesheet" href="'+classroomStage.sheet+'"></head><body data-revision="'+revision+'">'+
  '<div class="shell" style="transform:none"><header class="top"><div class="top-context"><div class="identity"><strong>Book '+classroom.bookNumber(c)+'</strong><span>Unit '+esc(c.unit??1)+(isOpening?" "+trackLabel(c.track):" "+esc(c.topic??"Places"))+'</span></div>'+

  (readingPage?'材料第 '+readingPage.sourcePage+' 页':c.pages.length?'教材第 '+esc(c.pages.join("、"))+' 页':"")+classroomStage.count(p,binding.chunks.length)+'</div>'+audio+'</header>'+
  '<nav class="rail" aria-label="课堂工具"><button type="button" data-move="-1">上一页</button><button type="button" data-move="1">下一页</button><div class="rail-gap"></div>'+
  source+(c.playback?.launchInline?"":lessonRailHTML(c))+course.rail+vocabTools+reader+record+related+classroomStage.back(c,history.at(-1))+'</nav><article class="page"><div class="slide-area">'+
  (readingPage?readingScreen(c,readingPage):'<div class="content'+contentClass+'">'+(isOpening||isGlossary||c.stageSkill?"":instructionHTML(c))+content(c,p,binding)+'</div>')+

function resultFor(c){return (c.comparison?comparisonResults:c.flow?lessonResults:results)[c.id];}
function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){
 const host=document.getElementById("preview-size"),scale=Math.min(host.parentElement.clientWidth/1280,maxProjectionScale);
 host.style.width=1280*scale+"px";host.style.height=720*scale+"px";frame.style.transform="scale("+scale+")";
}
function inClassroomOrder(){
 return Boolean(V.lessonFlow&&sequenceView.value==="school");
}
function inOpenings(){
 return sequenceView.value==="openings";
}
function inGlossaries(){
 return sequenceView.value==="glossaries";
}
function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
 return entry+gaps;
}
function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';
  document.getElementById("flow-coverage").textContent="当前显示教材 Ex 的实页验证。";
 }
}
function updateSequenceHeading(){
 const opening=inOpenings(),glossary=inGlossaries(),first=primary[0];
 const title=glossary?"UNLOCK 任务前 Glossary":opening?"UNLOCK 单元开篇":"Book "+classroom.bookNumber(first)+" Unit "+(first.unit??Number(/-U(\d+)/.exec(first.id)?.[1]))+" "+trackLabel(first.track);
 document.body.dataset.sequence=sequenceView.value;
 document.querySelector(".review-head h1").textContent=document.title=title;
 document.getElementById("review-description").textContent=opening||glossary?"本单元课堂材料。":first.topic??"课堂课件";
}
function changeSequence(){
 updateSequenceHeading();
 const order=navigationOrder();
 if(order.length&&!order.includes(current))display(order[0]);
 else{nav();updateReview();}
}
function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);
 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;
 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";
 const reasons=r?.reasons??c.issues;
 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';
 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");
 if(r?.inlineCheckTest)document.getElementById("metrics").append(" 原位核对检查 "+r.inlineCheckTest.points+" 处。");
 if(r?.screenChecks?.length)document.getElementById("metrics").append(" 已核对原页、前题和题面位置。");
 if(r?.playbackTest)document.getElementById("metrics").append(" 原音视频回放已实测。");
 document.getElementById("references").innerHTML=c.references.length?c.references.map(x=>'<button class="ref-button" '+(x.sourceOnly?'data-reference-page="'+x.pages[0]+'"':'data-ref="'+esc(x.id)+'"')+'>'+esc(x.title)+'，教材第 '+x.pages.join("、")+' 页</button>').join(""):'<p>本题记录中没有显式学生作答引用。</p>';
 document.getElementById("materials").innerHTML=c.materials.map(m=>'<details><summary>'+esc(m.title)+'，教材第 '+esc((m.pages||[]).join("、"))+' 页</summary><div class="resource-text">'+esc(m.text||"此条目通过教材原页核对。")+'</div></details>').join("")+(c.supportText&&!c.materialDecks?'<details><summary>'+esc(c.supportTitle)+'</summary><div class="resource-text">'+esc(c.supportText)+'</div></details>':"");
 if(c.materialDecks)document.getElementById("materials").innerHTML=classroom.materialDecks(c).map(deck=>'<details><summary>'+esc(deck.label)+'</summary><div class="resource-text">'+deck.pages.map(card=>esc([card.title,card.subtitle,card.lead,card.body.replace(/\*\*/g,""),...(card.notes??[])].filter(Boolean).join("\n"))).join("\n\n")+'</div></details>').join("");
 document.getElementById("materials").insertAdjacentHTML("afterbegin",vocabularyPlacement(c,part));

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;

 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);

function move(amount){
 const chunks=bind(cases[current]).chunks.length;

 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;

function original(c,page=c.pages[0],trigger=null,group=c.pages){

 if(!entry)return false;

 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);

 document.getElementById("source-modal").hidden=false;

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){

function inspectMaterials(doc,c){

   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,

    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });

 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
