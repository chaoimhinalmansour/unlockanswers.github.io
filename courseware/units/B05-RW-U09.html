":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":3,"module":"WATCH AND LISTEN","ex":"2","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"Look at the photos and discuss the questions with a partner.","pages":[208],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cf2f4b04287e2c45fa889ccb90b612b07ff7f6fb40001e33982f763bb1069e4d.png"],"provided":"Look at the photos and discuss the questions with a partner.","items":[{"id":"b9186.i01","label":"1","prompt":"Why do laws related to AI need to be created and enforced?","options":[],"type":"discuss/open"},{"id":"b9186.i02","label":"2","prompt":"How can AI be used for medical purposes?","options":[],"type":"discuss/open"},{"id":"b9186.i03","label":"3","prompt":"What do you think 'deepfake' means? Look at the words surrounding the text for clues.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9186.i01","label":"1","prompt":"Why do laws related to AI need to be created and enforced?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9186.i02","label":"2","prompt":"How can AI be used for medical purposes?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9186.i03","label":"3","prompt":"What do you think 'deepfake' means? Look at the words surrounding the text for clues.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 AI is a powerful tool that can sometimes\nmimic human behaviour. Laws need to\nbe created so that people know when\nAI has created something versus when\na human has created it. In addition,\nthere should be some limitations on\nwhat AI can be used for. If there are\nno limitations, we will begin to rely\non AI too much. AI should be a tool\nthat complements human actions, not\nreplaces them.\n2 AI could be used to make medical\ndiagnoses. For example, a patient\ncould input their symptoms into a\ndatabase. The AI could respond with\nquestions specific to the patient, until\nthe AI has a good idea of what illnesses\nmay match the symptoms. The AI\ncould then recommend a treatment or\na local doctor that specializes in that\nmedical condition.\n3 A ‘deepfake’ is something that is fake\nbut appears so real that it fools many\npeople. A deepfake could impersonate\na real person via video, making it look\nlike that person is saying something\nthey are not. If the ‘deepfake’ video\nis widespread, many people could\nend up believing it, even though it is\nfalse information.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":65,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[{"page":208,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cf2f4b04287e2c45fa889ccb90b612b07ff7f6fb40001e33982f763bb1069e4d.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9191","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video and check your predictions from Exercise 2. Write two main ideas from the video.","pages":[209],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de08b4ab4ac9d84968b775fd3e660dec43dfeae82d9e270ac771535281d4735a.png"],"provided":"Watch the video and check your predictions from Exercise 2. Write two main ideas from the video.","items":[],"layout":"list","references":[{"id":"B05-RW-U09-question:b9186","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[208]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/6fbd74adcf45ca12b18504e6-L5RW-U09.mp4","captions":[{"start":4.84,"end":8.94,"text":"As artificial intelligence grows ever more\nsophisticated,"},{"start":9.46,"end":15.24,"text":"the idea that it might become a threat to humans is\nheard not only from science fiction writers,"},{"start":15.74,"end":16.5,"text":"but economists,"},{"start":17.08,"end":17.48,"text":"academics,"},{"start":17.8,"end":19.78,"text":"and even the AI developers."},{"start":21.2,"end":23.84,"text":"But I think there are real scenarios where there's\nmassive harm."},{"start":23.94,"end":25.14,"text":"I think there's a lot of those."},{"start":25.82,"end":29.56,"text":"Critical government service, a cyber attack on some\ncritical government service."},{"start":29.56,"end":32.94,"text":"They can deceive,"},{"start":33.5,"end":36.92,"text":"they can be propagandists, they can say all sorts of\nnonsense."},{"start":37.54,"end":39.96,"text":"There are ways that they can be abused by bad actors."},{"start":42.14,"end":45.12,"text":"It can potentially be extremely damaging."},{"start":46.66,"end":52.1,"text":"Yeah, the danger is that they don't understand the\ndifference between right and wrong, true and false."},{"start":55.14,"end":58.24,"text":"Experts believe AI presents multiple risks."},{"start":58.96,"end":63.18,"text":"People may use AI that was designed to be helpful to\ncause harm."},{"start":63.72,"end":64.68,"text":"In other cases,"},{"start":65.34,"end":70.46000000000001,"text":"failures in an AI's design may cause the systems to\nbehave in harmful ways."},{"start":71.76,"end":76.92,"text":"An AI which can write computer code could be used to\nhack vital services."},{"start":78.26,"end":85.78,"text":"Autonomous AI used for tasks such as medical diagnosis\nor air traffic control could make fatal errors."},{"start":86.84,"end":90.22,"text":"Chatbots, which can produce realistic human language,"},{"start":90.6,"end":94.56,"text":"can be used to convincingly impersonate real sources."},{"start":95.4,"end":99.84,"text":"Bad actors can use them in fraud or to spread\nmisinformation."},{"start":101.06,"end":105.75999999999999,"text":"AIs which can alter film can create videos known as\ndeepfakes,"},{"start":106.24000000000001,"end":108.97999999999999,"text":"which show people saying things they have not said."},{"start":109.82,"end":112.94,"text":"These technologies can cause public distrust,"},{"start":113.36,"end":114.53999999999999,"text":"create false beliefs,"},{"start":115,"end":117.97999999999999,"text":"and exacerbate divisions in society."},{"start":119.75999999999999,"end":126.3,"text":"AIs may also reinforce existing prejudices and biases\nthat come from the data they work with."},{"start":126.86,"end":127.74,"text":"For example,"},{"start":128.24,"end":134.54,"text":"an AI used to select job candidates may discriminate\nagainst those from particular backgrounds."},{"start":135.4,"end":139.54,"text":"And one of the biggest threats is in the nature of AI\nitself."},{"start":140.4,"end":143.4,"text":"By replicating the capabilities of humans,"},{"start":144.07999999999998,"end":145.64,"text":"AI can replace us."},{"start":146.07999999999998,"end":151.5,"text":"Some fear that mass unemployment could be caused by the\nautomation of many human tasks."},{"start":152.68,"end":155.04,"text":"So why develop AI at all?"},{"start":156.12,"end":160.9,"text":"Because it has just as much potential to solve problems\nas to hurt us."},{"start":161.64,"end":168.76,"text":"AI could advance scientific knowledge and show us how\nto solve some of humanity's biggest challenges."},{"start":169.62,"end":172.56,"text":"It could help to develop new clean energy sources,"},{"start":172.86,"end":174.3,"text":"such as nuclear fusion."},{"start":175.02,"end":181.72,"text":"It can show us how to optimize harvests in agriculture\nand how to mitigate the effects of climate change."},{"start":182.72,"end":188.96,"text":"AI used in medicine can help us live longer, healthier\nlives by detecting health problems earlier."},{"start":190,"end":196.54,"text":"It can make our jobs more interesting by automating\nrepetitive and mundane human tasks."},{"start":197.84,"end":198.12,"text":"However,"},{"start":198.5,"end":206.26,"text":"many experts feel that competition between big\ncompanies encourages them to launch AI before it is\nsafe."},{"start":207.36,"end":212.92000000000002,"text":"Everyone wants to be one step ahead of their rivals, so\nthe rival doesn't grab market share without them."},{"start":213.32,"end":214.9,"text":"And so that's what's driving it."},{"start":214.96,"end":215.72,"text":"It's competition."},{"start":216.09,"end":223.48,"text":"To avoid the harm of AI, they feel we need robust laws\nto ensure developers act responsibly."},{"start":224.46,"end":233.04,"text":"When companies rigorously test new AI and allow outside\nresearchers access to it, when they constantly monitor\nAI's behavior,"},{"start":233.48,"end":234.84,"text":"there is more safety."},{"start":235.78,"end":241.74,"text":"Experts advise that governments and industry should\nanticipate job losses to AI."},{"start":242.42,"end":247.44,"text":"Retraining employees in time for change can help avoid\nunemployment."},{"start":248.78,"end":254.46,"text":"Educators should focus on developing skills in our\nyoung people that AI cannot yet handle."},{"start":256,"end":259.44,"text":"But fighting misinformation is one of the biggest\nchallenges,"},{"start":259.78,"end":265.5,"text":"and it may be years before we have real -time fact\n-checkers or deepfake identification."},{"start":266.22,"end":273.82,"text":"For now, the best safeguard may be to teach people to\nthink critically about the sources of their\ninformation."},{"start":275.06,"end":277.18,"text":"The average person has to say to themselves,"},{"start":277.6,"end":278.15999999999997,"text":"I know."},{"start":278.42,"end":284.56,"text":"I will use a chatbot because it's very convenient,\nsaves time, but I realize that some of it is nonsense."},{"start":285.32,"end":285.72,"text":"Meanwhile,"},{"start":286.04,"end":286.58,"text":"industry,"},{"start":286.96,"end":287.38,"text":"academia,"},{"start":287.72,"end":294.65999999999997,"text":"and governments must continue to work together to\nensure AI is developed in the public interest."},{"start":294.65999999999997,"end":300.24,"text":"That way, we can avoid the harm of AI and unlock its\ngreat potential."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 Several dangers are associated with AI.\n2 Steps should be taken to avoid the\npotential risks.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":65,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097 :["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de08b4ab4ac9d84968b775fd3e660dec43dfeae82d9e270ac771535281d4735a.png"],"provided":"Watch again. Work with a partner and explain the words in bold in each sentence.","items":[{"id":"b9193.i01","label":"1","prompt":"I think there are real scenarios with this massive harm … a cyber-attack on some critical government service …","options":[],"type":"discuss/open"},{"id":"b9193.i02","label":"2","prompt":"They can deceive. They can be propagandists. They can say all sorts of nonsense.","options":[],"type":"discuss/open"},{"id":"b9193.i03","label":"3","prompt":"Autonomous AI used for tasks such as medical diagnosis or air traffic control could make fatal errors.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9193.i01","label":"1","prompt":"I think there are real scenarios with this massive harm … a cyber-attack on some critical government service …","options":[],"type":"discuss/open"},{"kind":"item","id":"b9193.i02","label":"2","prompt":"They can deceive. They can be propagandists. They can say all sorts of nonsense.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9193.i03","label":"3","prompt":"Autonomous AI used for tasks such as medical diagnosis or air traffic control could make fatal errors.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/6fbd74adcf45ca12b18504e6-L5RW-U09.mp4","captions":[{"start":4.84,"end":8.94,"text":"As artificial intelligence grows ever more\nsophisticated,"},{"start":9.46,"end":15.24,"text":"the idea that it might become a threat to humans is\nheard not only from science fiction writers,"},{"start":15.74,"end":16.5,"text":"but economists,"},{"start":17.08,"end":17.48,"text":"academics,"},{"start":17.8,"end":19.78,"text":"and even the AI developers."},{"start":21.2,"end":23.84,"text":"But I think there are real scenarios where there's\nmassive harm."},{"start":23.94,"end":25.14,"text":"I think there's a lot of those."},{"start":25.82,"end":29.56,"text":"Critical government service, a cyber attack on some\ncritical government service."},{"start":29.56,"end":32.94,"text":"They can deceive,"},{"start":33.5,"end":36.92,"text":"they can be propagandists, they can say all sorts of\nnonsense."},{"start":37.54,"end":39.96,"text":"There are ways that they can be abused by bad actors."},{"start":42.14,"end":45.12,"text":"It can potentially be extremely damaging."},{"start":46.66,"end":52.1,"text":"Yeah, the danger is that they don't understand the\ndifference between right and wrong, true and false."},{"start":55.14,"end":58.24,"text":"Experts believe AI presents multiple risks."},{"start":58.96,"end":63.18,"text":"People may use AI that was designed to be helpful to\ncause harm."},{"start":63.72,"end":64.68,"text":"In other cases,"},{"start":65.34,"end":70.46000000000001,"text":"failures in an AI's design may cause the systems to\nbehave in harmful ways."},{"start":71.76,"end":76.92,"text":"An AI which can write computer code could be used to\nhack vital services."},{"start":78.26,"end":85.78,"text":"Autonomous AI used for tasks such as medical diagnosis\nor air traffic control could make fatal errors."},{"start":86.84,"end":90.22,"text":"Chatbots, which can produce realistic human language,"},{"start":90.6,"end":94.56,"text":"can be used to convincingly impersonate real sources."},{"start":95.4,"end":99.84,"text":"Bad actors can use them in fraud or to spread\nmisinformation."},{"start":101.06,"end":105.75999999999999,"text":"AIs which can alter film can create videos known as\ndeepfakes,"},{"start":106.24000000000001,"end":108.97999999999999,"text":"which show people saying things they have not said."},{"start":109.82,"end":112.94,"text":"These technologies can cause public distrust,"},{"start":113.36,"end":114.53999999999999,"text":"create false beliefs,"},{"start":115,"end":117.97999999999999,"text":"and exacerbate divisions in society."},{"start":119.75999999999999,"end":126.3,"text":"AIs may also reinforce existing prejudices and biases\nthat come from the data they work with."},{"start":126.86,"end":127.74,"text":"For example,"},{"start":128.24,"end":134.54,"text":"an AI used to select job candidates may discriminate\nagainst those from particular backgrounds."},{"start":135.4,"end":139.54,"text":"And one of the biggest threats is in the nature of AI\nitself."},{"start":140.4,"end":143.4,"text":"By replicating the capabilities of humans,"},{"start":144.07999999999998,"end":145.64,"text":"AI can replace us."},{"start":146.07999999999998,"end":151.5,"text":"Some fear that mass unemployment could be caused by the\nautomation of many human tasks."},{"start":152.68,"end":155.04,"text":"So why develop AI at all?"},{"start":156.12,"end":160.9,"text":"Because it has just as much potential to solve problems\nas to hurt us."},{"start":161.64,"end":168.76,"text":"AI could advance scientific knowledge and show us how\nto solve some of humanity's biggest challenges."},{"start":169.62,"end":172.56,"text":"It could help to develop new clean energy sources,"},{"start":172.86,"end":174.3,"text":"such as nuclear fusion."},{"start":175.02,"end":181.72,"text":"It can show us how to optimize harvests in agriculture\nand how to mitigate the effects of climate change."},{"start":182.72,"end":188.96,"text":"AI used in medicine can help us live longer, healthier\nlives by detecting health problems earlier."},{"start":190,"end":196.54,"text":"It can make our jobs more interesting by automating\nrepetitive and mundane human tasks."},{"start":197.84,"end":198.12,"text":"However,"},{"start":198.5,"end":206.26,"text":"many experts feel that competition between big\ncompanies encourages them to launch AI before it is\nsafe."},{"start":207.36,"end":212.92000000000002,"text":"Everyone wants to be one step ahead of their rivals, so\nthe rival doesn't grab market share without them."},{"start":213.32,"end":214.9,"text":"And so that's what's driving it."},{"start":214.96,"end":215.72,"text":"It's competition."},{"start":216.09,"end":223.48,"text":"To avoid the harm of AI, they feel we need robust laws\nto ensure developers act responsibly."},{"start":224.46,"end":233.04,"text":"When companies rigorously test new AI and allow outside\nresearchers access to it, when they constantly monitor\nAI's behavior,"},{"start":233.48,"end":234.84,"text":"there is more safety."},{"start":235.78,"end":241.74,"text":"Experts advise that governments and industry should\nanticipate job losses to AI."},{"start":242.42,"end":247.44,"text":"Retraining employees in time for change can help avoid\nunemployment."},{"start":248.78,"end":254.46,"text":"Educators should focus on developing skills in our\nyoung people that AI cannot yet handle."},{"start":256,"end":259.44,"text":"But fighting misinformation is one of the biggest\nchallenges,"},{"start":259.78,"end":265.5,"text":"and it may be years before we have real -time fact\n-checkers or deepfake identification."},{"start":266.22,"end":273.82,"text":"For now, the best safeguard may be to teach people to\nthink critically about the sources of their\ninformation."},{"start":275.06,"end":277.18,"text":"The average person has to say to themselves,"},{"start":277.6,"end":278.15999999999997,"text":"I know."},{"start":278.42,"end":284.56,"text":"I will use a chatbot because it's very convenient,\nsaves time, but I realize that some of it is nonsense."},{"start":285.32,"end":285.72,"text":"Meanwhile,"},{"start":286.04,"end":286.58,"text":"industry,"},{"start":286.96,"end":287.38,"text":"academia,"},{"start":287.72,"end":294.65999999999997,"text":"and governments must continue to work together to\nensure AI is developed in the public interest."},{"start":294.65999999999997,"end":300.24,"text":"That way, we can avoid the harm of AI and unlock its\ngreat potential."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 situations that may develop in the future\n2  people who create or broadcast information, often\nonly giving one part of an argument, intended to\ninfluence people’s opinions\n3  independent and having the power to make one’s\nown decisions","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":65,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9195","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[209],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de08b4ab4ac9d84968b775fd3e660dec43dfeae82d9e270ac771535281d4735a.png"],"provided":"Work with a partner. Discuss the questions.","items":[{"id":"b9195.i01","label":"1","prompt":"Do you think companies will follow the advice suggested in the video to rigorously test and monitor AI? Explain your answer.","options":[],"type":"discuss/open"},{"id":"b9195.i02","label":"2","prompt":"The video advises people to think critically about their information sources. How can people achieve this?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9195.i01","label":"1","prompt":"Do you think companies will follow the advice suggested in the video to rigorously test and monitor AI? Explain your answer.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9195.i02","label":"2","prompt":"The video advises people to think critically about their information sources. How can people achieve this?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think companies will follow the advice.\nIt is in their interest to do so because it\nwill help develop the technology to the\nbest of its ability. I also believe there will\neventually be laws that require this, so\nthey had better follow recommended\nguidelines from the beginning.\nI don’t think companies will test and\nmonitor AI. For one thing, performing\nrigorous tests and allowing access\nto AI by outside researchers will cost\ncompanies a lot of money, which they\nwill be reluctant to spend. For another\nthing, companies want to keep their\nnewest technology private. Allowing it\nto be tested and monitored will expose\nit to too many people.\n2 The most important thing people\nshould do is carefully examine their\nsources of information. It should come\nfrom a trusted source that is well\nknown. Whether the source is a social\nmedia post, an online article, a video\nor something else, people should\nalways try to verify the source and\nthe information.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":65,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9198","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read a popular science blog about augmented reality (AR). Work with a partner. Look at the photos in the blog and discuss the questions.","pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/27721459a28c49a7d34e89861fc193491683dae7c4dbf192e177b6d2b77e94be.png"],"provided":"You are going to read a popular science blog about augmented reality (AR). Work with a partner. Look at the photos in the blog and discuss the questions.","items":[{"id":"b9198.i01","label":"1","prompt":"What do you think augmented reality means?","options":[],"type":"discuss/open"},{"id":"b9198.i02","label":"2","prompt":"How might AR be useful in everyday situations?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9198.i01","label":"1","prompt":"What do you think augmented reality means?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9198.i02","label":"2","prompt":"How might AR be useful in everyday situations?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Augmented means improved or\nenhanced. Virtual reality creates an\nentirely digital experience but AR is\npartially digital but combined with the\nreal world by using to the real world\nthrough devices like smartphones\nor special glasses so that real-world\nphysical environment is blended with\nvirtual content.\n2 AR can be useful in everyday situations\nby helping with navigation or enhancing\nshopping experiences to show you what\nclothes, hairstyle and makeup look like,\nor assisting in repairs by displaying step-\nby-step instructions.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[{"page":210,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/27721459a28c49a7d34e89861fc193491683dae7c4dbf192e177b6d2b77e94be.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9200","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":9,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the words and their definitions. Use the correct form of the words in bold to complete the sentences below.","pages":[210],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/27721459a28c49a7d34e89861fc193491683dae7c4dbf192e177b6d2b77e94be.png"],"provided":"Read the words and their definitions. Use the correct form of the words in bold to complete the sentences below.","items":[{"id":"b9200.i01","label":"1","prompt":"Whilst drivers are focused on their devices they may fail to identify __________ on the road ahead.","options":[],"type":"gap/open"},{"id":"b9200.i02","label":"2","prompt":"Virtual reality glasses offer a completely __________ experience.","options":[],"type":"gap/open"},{"id":"b9200.i03","label":"3","prompt":"On the new device, you can receive __________ audio and video from two different sources.","options":[],"type":"gap/open"},{"id":"b9200.i04","label":"4","prompt":"You can __________ your English classes with apps for learning English.","options":[],"type":"gap/open"},{"id":"b9200.i05","label":"5","prompt":"Social networking is no longer the __________ of the young.","options":[],"type":"gap/open"},{"id":"b9200.i06","label":"6","prompt":"The lecturer used a __________ of human anatomy to explain the digestive system to the students.","options":[],"type":"gap/open"},{"id":"b9200.i07","label":"7","prompt":"The new app allows you to __________ images on print, and print on images.","options":[],"type":"gap/open"},{"id":"b9200.i08","label":"8","prompt":"His __________ of the report from the Chinese office was incorrect, so the board didn't understand the new project.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9200.i01","label":"1","prompt":"Whilst drivers are focused on their devices they may fail to identify __________ on the road ahead.","options":[],"type":"gap/open","answer":{"label":"1","mode":"gap","answer":"hazards"}},{"kind":"item","id":"b9200.i02","label":"2","prompt":"Virtual reality glasses offer a completely __________ experience.","options":[],"type":"gap/open","answer":{"label":"2","mode":"gap","answer":"immersive"}},{"kind":"item","id":"b9200.i03","label":"3","prompt":"On the new device, you can receive __________ audio and video from two different sources.","options":[],"type":"gap/open","answer":{"label":"3","mode":"gap","answer":"simultaneous"}},{"kind":"item","id":"b9200.i04","label":"4","prompt":"You can __________ your English classes with apps for learning English.","options":[],"type":"gap/open","answer":{"label":"4","mode":"gap","answer":"supplement"}},{"kind":"item","id":"b9200.i05","label":"5","prompt":"Social networking is no longer the __________ of the young.","options":[],"type":"gap/open","answer":{"label":"5","mode":"gap","answer":"domain"}},{"kind":"item","id":"b9200.i06","label":"6","prompt":"The lecturer used a __________ of human anatomy to explain the digestive system to the students.","options":[],"type":"gap/open","answer":{"label":"6","mode":"gap","answer":"projection"}}],[{"kind":"item","id":"b9200.i07","label":"7","prompt":"The new app allows you to __________ images on print, and print on images.","options":[],"type":"gap/open","answer":{"label":"7","mode":"gap","answer":"superimpose"}},{"kind":"item","id":"b9200.i08","label":"8","prompt":"His __________ of the report from the Chinese office was incorrect, so the board didn't understand the new project.","options":[],"type":"gap/open","answer":{"label":"8","mode":"gap","answer":"interpretation"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 hazards 2 immersive 3 simultaneous 4 supplement\n5 domain 6 projection 7 superimpose 8 interpretation","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9205","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the blog on page 211 and check your ideas from Exercise 1. Which sentence best expresses the main idea of the blog?","pages":[212],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/354cf6a1faf398c746060c48276d9675e4b1cf36b7bd556d235d0b04b886f69d.png"],"provided":"Read the blog on page 211 and check your ideas from Exercise 1. Which sentence best expresses the main idea of the blog?","items":[{"id":"b9205.i01","label":"1","prompt":"Which sentence best expresses the main idea of the blog?","options":["AR technology has the potential to change how we see reality.","AR technology has practical applications in many areas of life."],"type":"choice/open"}],"layout":"list","references":[{"id":"B05-RW-U09-question:b9198","kind":"student-work","title":"READING 1 Ex 1","pages":[210]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9205.i01","label":"1","prompt":"Which sentence best expresses the main idea of the blog?","options":["AR technology has the potential to change how we see reality.","AR technology has practical applications in many areas of life."],"type":"choice/open"}]],"courseMaterials":[{"id":"B05-RW-U09-classroom:material:RW-M03","title":"READING 1","text":"1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.\n4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","screens":["1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.","4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier."],"sources":[{"page":211,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U09-publisher-page:p211","title":"原题或核对备注所引第211页","pages":[211],"text":"","screens":[],"sources":[{"page":211,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":66,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9206","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read a summary of the blog written by a student. Six facts are incorrect. Correct the mistakes.","pages":[212],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/354cf6a1faf398c746060c48276d9675e4b1cf36b7bd556d235d0b04b886f6  augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.\n4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier.","screens":["1 Do you look up at the sky at night and marvel at the universe? Nowadays, all you have to do is point your smartphone at the night sky to reveal the names of the stars, constellations and planets. These days there are mirrors which take the hard work out of shopping by superimposing your chosen outfits directly onto a live reflection of your body. These advances are both examples of augmented reality (AR).\n2 What is augmented reality? Unlike virtual reality, which creates an immersive 3D environment, augmented reality interacts with and enhances the world that surrounds us. AR devices can supplement the environment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.","4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier."],"sources":[{"page":211,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Two speculations about the future of\nAR apps:\n• Experts suggest that future AR apps\nwill allow simultaneous interpretation of\nspoken language too.\n• Once the domain of the gaming and\nretail industries, AR has revealed its\npotential to revolutionize our lives.\nOne problem with relying on a device\nto translate spoken language is the\npotential for mistakes. There may be\nseveral translations of a particular word; for\nexample, one translation may be suitable for\none occasion but not another. The app may\nnot understand those subtle differences in\nthe same way that a human would. Another\nproblem is that humans often rely on body\nlanguage to get their point across when\nspeaking. If we rely only s are the most powerful when\nit comes to saving lives and staying\nhealthy. They will allow doctors to\ndiagnose and treat patients in non-\nsurgical ways, reducing the health risks\nthat come with surgery. GPS navigation\napps that warn drivers of hazards will\npotentially save the lives of both drivers\nand pedestrians.\n2 Yes, I think one day AR technology will\nbe as widespread as the internet. AR\nenhances the experience of the internet\nby making digital experiences more\nlifelike. Internet users are only going to\nwant more of those lifelike experiences.\nSince we now have the technology, it will\ncontinue to become more widespread\nin order to meet consumer demand.\nAugmented reality is the next logical\nstep in our digital world.\nNo, I don’t think it will be as widespread.\nObviously, the internet is here to stay,\nbut I think AR is more of a trend when it\ncomes to mainstream use. I think people\nwill always use AR for both practical\nand entertainment purposes, but I\ndon’t think it will ever take over and be\nubiquitous, like the internet.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":66,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9214","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":1,"order":1 ment with interactive 3D projections.\n3 Travel has never been easier. Tourists can now download apps that superimpose facts and information directly on their surroundings. Future AR apps will allow simultaneous interpretation of spoken language too.","4 The directions are on the road. With AR navigation technology, drivers don't need to take their eyes off the road. Some AR navigation apps can even warn drivers about possible hazards.\n5 Helping engineers and technicians. With an AR headset, you can clearly see detailed blueprints of the pipes overlaid on your view of the field.\n6 Medicine. AR allows medical professionals to see a patient's internal organs and circulatory system displayed on their skin. One of the most common uses is with IV injections.\n7 The future of AR technology is unlimited. Across tourism and travel, industry and engineering, and even surgery, it is already making our lives easier."],"sources":[{"page":211,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/429a2358e062c476994f1c7fbabfb92f480cec70bb3b17c1ddde5c5700f33555.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36db389969f300f7a0eb72225644ce8cb7e0865e34637792c4f3901de4e82766.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"In my opinion, the home décor app will\nbe widely used one day. In general, I find\nit very difficult to make decisions about\nhow to decorate my home. It is not easy to\nvisualize, for example, how well a particular\nnew sofa might look next to a chair I\nalready own. Being able to cast projections\nof furniture into the actual rooms of my\nhome would be very helpful. It would cut\ndown on the stress of uncertainty. It would\nalso save the time of having to visit endless\nshops to see in person 5 Advocates of AR in education also emphasize its usefulness for schools in remote locations.","6 Despite the numerous advantages, not everybody is convinced that it is a positive development. Critics point out the presence of attention tunnelling when using AR in class.\n7 It is evident that the adoption of AR technology by educators will be a positive development for all involved."],"sources":[{"page":215,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/228ae872c0d6812d77fae3ae8139e3f883a9e69c321cdb5682342fabec3b7142.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e70e808a369dc19cff500f08cc2ecf45f56f6ee88941133cd91e5d74e1a2afa7.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 education: It is important for people\naround the world to be educated. AR\ntechnology is another step towards\nmaking that a reality.\nmedicine: AR technology has the\npotential to diagnose diseases and\nsave countless lives. It is almost as\nimportant as using it for education, but","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":67,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9242","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"The table below lists some of the features of cloud computing in education. Work in small groups and discuss the possible benefits and drawbacks for each feature. Note your ideas in the table.","pages":[221],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/20253d498301be002eeca9de6cb286e8ed535ff9f6e1383e7a3e5c73048e9145.png"],"provided":"The table below lists some of the features of cloud computing in education. Work in small groups and discuss the possible benefits and drawbacks for each feature. Note your ideas in the table.","items":[{"id":"b9242.i01","label":"1","prompt":"Students can access e-books and digital materials easily.","options":[],"type":"gap/open"},{"id":"b9242.i02","label":"2","prompt":"Students can take exams online.","options":[],"type":"gap/open"},{"id":"b9242.i03","label":"3","prompt":"Students can communicate with other students via a webcam.","options":[],"type":"gap/open"},{"id":"b9242.i04","label":"4","prompt":"Students can listen to lectures at home.","options":[],"type":"gap/open"},{"id":"b9242.i05","label":"5","prompt":"School documents and student information are stored in the cloud.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9242.i01","label":"1","prompt":"Students can access e-books and digital materials easily.","options":[],"type":"gap/open"},{"kind":"item","id":"b9242.i02","label":"2","prompt":"Students can take exams online.","options":[],"type":"gap/open"},{"kind":"item","id":"b9242.i03","label":"3","prompt":"Students can communicate with other students via a webcam.","options":[],"type":"gap/open"},{"kind":"item","id":"b9242.i04","label":"4","prompt":"Students can listen to lectures at home.","options":[],"type":"gap/open"},{"kind":"item","id":"b9242.i05","label":"5","prompt":"School documents and student information are stored in the cloud.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Cloud computing\nfeatures benefits drawbacks\nStudents can\naccess e-books\nand digital\nmaterials easily.\nSaves paper\nNo need to\ncarry heavy\nbooks\nStudents\naround the\nworld have\nthe same\naccess\nto books\nE-books\ncould be\nplagiarized\neasily\nCan’t make\npersonal\nnotes in the\ne-books\nE-books not\navailable if\nthe internet\nfails\nStudents can\ntake exams\nonline.\nStudents\nin distant\nlocations can\ntake exams\nMore students\ncan take the\nexams\nExams can be\nshared and\nstandardized\nmore easily\nExams could\nbe stolen\neasily\nIssues with\nmonitoring\nadequately\nand cheating\nTechnical\nissues\nLimitations of\ntype of exam\npossible\nStudents can\ncommunicate\nwith other\nstudents via a\nwebcam.\nStudents\ncan work\non projects\ntogether from\nhome\nStudents\nmay waste\ntheir time\nby chatting\nonline\ninstead of\nworking\nStudents\ncan listen to\nlectures at\nhome.\nStudents\ncan review\nlectures and\nremember the\ninformation\nbetter\nStudents\nmight not\nattend their\nclasses if they\ncan listen at\nhome\nSchool\ndocuments\nand student\ninformation are\nstored in the\ncloud.\nEasy access\nfrom any\ndevice\nMakes\nteachers’\nrecord\nkeeping more\neffective and\nstandardized\nVarious\nsecurity risks\nPossibility of\nidentity theft\nTeachers\nhave to learn\nhow to use\nthe system","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":68,"title":"教师书"},{"source":"ht nalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/20253d498301be002eeca9de6cb286e8ed535ff9f6e1383e7a3e5c73048e9145.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Arguments for: Enables real-time\ncollaboration between students and\nteachers; Reduces the cost of physical\ninfrastructure and IT maintenance\nfor schools.\nArguments against: Dependence on a\nstable internet connection for access to\nresources; Limited access for students in\nareas with poor or no internet connectivity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9244","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Choose another new technology with features that have potential applications in the classroom. Do some research about how this technology has been used, its benefits, and any potential drawbacks or challenges it poses. Complete the table below.","pages":[222],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9a7ea1cf6f8686c801278174d313a51775813853de896de600a7bfc7d7dcd9b3.png"],"provided":"Choose another new technology with features that have potential applications in the classroom. Do some research about how this technology has been used, its benefits, and any potential drawbacks or challenges it poses. Complete the table below.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Artificial intelligence\nfeatures benefits drawbacks/\nchallenges\nPersonalized\nlearning\nAI can adapt\nlessons to\neach student’s\nlearning style\nand pace,\ngiving them\npersonalized\nassignments\nand feedback.\nStudents may\nbecome too\ndependent\non the AI,\nreducing their\nability to learn\nin a traditional,\none-size-fits-all\nsetting.\nAutomated\ngrading\nAI can\nautomatically\ngrade\nassignments\nand quizzes,\nsaving teachers\ntime and\nproviding\ninstant\nfeedback to\nstudents.\nAutomated\nsystems might\nmiss the\nnuances of\nmore complex\nanswers, like\nessays, leading\nto inaccurate\ngrading.\nVirtual tutors AI-powered\ntutors are\navailable\n24/7 to help\nstudents with\nhomework and\nextra practice,\noffering instant\nassistance.\nStudents might\nrely too much\non virtual\ntutors instead\nof developing\nproblem-\nsolving skills on\ntheir own.\nData analysis\nfor tracking\nprogress\nAI can analyze\nstudent\nperformance\nover time,\nhelping\nteachers\nidentify learning\ngaps and\nprovide extra\nsupport where\nneeded.\nOver-reliance\non data may\noverlook the\nemotional or\nsocial factors\naffecting a\nstudent’s\nperformance.\nSpeech\nrecognition\nand language\nlearning\nAI’s speech\nrecognition\nhelps students\npractice\nlanguage\npronunciation\nand\nconversational\nskills in real-\ntime.\nSpeech\nrecognition\ntools might\nstruggle\nwith accents\nor speech\nimpediments,\nleading to\nfrustration\nor incorrect\nfeedback.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":68,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":24,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9245","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Exchange tables with a partner. Give feedback on his or her table.","pages":[222],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9a7ea1cf6f8686c801278174d313a51775813853de896de600a7bfc7d7dcd9b3.png"],"provided":"Exchange tables with a partner. Give feedback on his or her table.","items":[{"id":"b9245.i01","label":"1","prompt":"Are these features likely to be used in the classroom? Does their use seem realistic, now or in the future?","options":[],"type":"discuss/open"},{"id":"b9245.i02","label":"2","prompt":"Are they likely to be beneficial?","options":[],"type":"discuss/open"},{"id":"b9245.i03","label":"3","prompt":"Are the drawbacks a realistic reflection of problems in the classroom?","options":[],"type":"discuss/open"},{"id":"b9245.i04","label":"4","prompt":"Can you think of any other benefits or drawbacks?","options":[] n necessary","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9254","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":38,"module":"GRAMMAR FOR WRITING","ex":"4","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Combine the independent clauses in the box to form two sentences using semicolons.","pages":[225],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e9c9ab7c12eb8023982f3406aebb611506bc64e34438dec6a824fac6dde62886.png"],"provided":"Combine the independent clauses in the box to form two sentences using semicolons. Write the sentences below.\ntechnology allows for personalized learning; thus, technology will complement but never replace teachers; students will always need human interaction in the classroom; this empowers students to make their own decisions about what they want to learn","items":[{"id":"b9254.i01","label":"1","prompt":"1","options":[],"type":"gap/open"},{"id":"b9254.i02","label":"2","prompt":"2","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Combine the independent clauses in the box to form two sentences using semicolons. Write the sentences below."},{"kind":"text","text":"technology allows for personalized learning; thus, technology will complement but never replace teachers; students will always need human interaction in the classroom; this empowers students to make their own decisions about what they want to learn"},{"kind":"item","id":"b9254.i01","label":"1","prompt":"1","options":[],"type":"gap/open"},{"kind":"item","id":"b9254.i02","label":"2","prompt":"2","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  Students will always need human interaction in the\nclassroom; thus, technology will complement but never\nreplace teachers.\n2  Technology allows for personalized learning; this\nempowers students to make their own decisions about\nwhat they want to learn.\nACADEMIC WRITING SKILLS\nLearning objective\n• Revise a variety of types of informal language in\nsentences, using an appropriate academic style","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9257","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":39,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the paragraph, underline the informal language and rewrite the paragraph in a more formal style.","pages":[226],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9f422883ec43d3aaf2f4aaee883e1ed9b66eaf78ce24f6bf135fd96810afba11.png"],"provided":"Read the paragraph, underline the informal language and rewrite the paragraph in a more formal style.","items":[{"id":"b9257.i01","label":"1","prompt":"There are tons of apps that teachers can use to make their classes engaging. Augmented reality apps are really immersive and totally amazing at getting kids to get up and move around. All you gotta do is find the app that's right for you. Imagine you are teaching about space. With this app, when the kids view the classroom through their devices, it will look like they're walking on the moon. How come every school doesn't have this? If you're a teacher who uses this kind of stuff, everyone will wanna take your class. In the end, it's all about the best ways to help kids learn and grow.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9257.i01","label":"1","prompt":"There are tons of apps that teachers can use to make their classes engaging. Augmented reality apps are really immersive and totally amazing at getting kids to get up and move around. All you gotta do is find the app that's right for you. Imagine you are teaching about space. With this app, when the kids view the classroom through their devices, it will look like they're walking on the moon. How come every school doesn't have this? If you're a teacher who uses this kind of stuff, everyone will wanna take your class. In the end, it's all about the best ways to help kids learn and grow.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Numerous apps exist that teachers can\nuse to make their classes engaging.\nAugmented reality apps are extremely\nimmersive and useful for getting young\npeople to get up and move around.\nTeachers simply have to explore the various\noptions and then select the apps that are\nbest for their students. When learning\nabout topics such as space, learners can\nview the classroom through their devices\nand it will look like they are walking on\nthe moon. Teachers who use AR apps\nwill find higher levels of participation and\nmotivation among students and that is the\nmost important outcome.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9261","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":40,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Discuss with a partner the emerging technology that you chose in Critical thinking, Exercise 3 on page 222. Why did you choose it?","pages":[227],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8c01744e531b8f25544c9dddd7f1c5591c735dcbb9b7539917444b0756a93c83.png"],"provided":"Discuss with a partner the emerging technology that you chose in Critical thinking, Exercise 3 on page 222. Why did you choose it?","items":[],"layout":"list","references":[{"id":"B05-RW-U09-question:b9244","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[222]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U09-publisher-page:p222","title":"原题或核对备注所引第222页","pages":[222],"text":"","screens":[],"sources":[{"page":222,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9a7ea1cf6f8686c801278174d313a51775813853de896de600a7bfc7d7dcd9b3.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I am going to write about the use of\nartificial intelligence in education. I chose\nthis topic because it is on the cutting\nedge of both technology and education.\nAI has the power to create richer learning\nexperiences for students with all types of\nlearning styles.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9262","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":41,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Review your notes in Critical thinking, Exercises 3–5 on page 222. Complete the outline below with notes on your arguments and add supporting details.","pages":[227],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8c01744e531b8f25544c9dddd7f1c5591c735dcbb9b7539917444b0756a93c83.png"],"provided":"Review your notes in Critical thinking, Exercises 3–5 on page 222. Complete the outline below with notes on your arguments and add supporting details.","items":[{"id":"b9262.i01","label":"1","prompt":"Paragraph 1 / Feature 1 / Supporting details","options":[],"type":"gap/open"},{"id":"b9262.i02","label":"2","prompt":"Paragraph 2 / Feature 2 / Supporting details","options":[],"type":"gap/open"},{"id":"b9262.i03","label":"3","prompt":"Paragraph 3 / Feature 3 / Supporting details","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U09-question:b9244","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[222]},{"id":"B05-RW-U09-question:b9246","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[222]},{"id":"B05-RW-U09-question:b9245","kind":"material-reference","title":"CRITICAL THINKING Ex 4","pages":[222]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9262.i01","label":"1","prompt":"Paragraph 1 / Feature 1 / Supporting details","options":[],"type":"gap/open"},{"kind":"item","id":"b9262.i02","label":"2","prompt":"Paragraph 2 / Feature 2 / Supporting details","options":[],"type":"gap/open"},{"kind":"item","id":"b9262.i03","label":"3","prompt":"Paragraph 3 / Feature 3 / Supporting details","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U09-publisher-page:p222","title":"原题或核对备注所引第222页","pages":[222],"text":"","screens":[],"sources":[{"page":222,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9a7ea1cf6f8686c801278174d313a51775813853de896de600a7bfc7d7dcd9b3.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Paragraph 1: Adaptive learning\nFeature 1: AI can evaluate current skill\nlevels and offer lessons tailored to\neach student.\nSupporting details: Students’ individual\nneeds are considered; they have more\ncontrol over their learning experience. An\nexample of adaptive learning software\nis Mathspace.\nParagraph 2: Assistive technology\nFeature 2: AI can enhance the learning\nexperience of students with disabilities.\nSupporting details: Speech recognition\ntools can provide subtitles and\ntranscriptions for video content for hearing\nimpaired students; screen readers can\nread text out loud to students who are\nvisually impaired.\nParagraph 3: Assessment\nFeature 3: AI-based assessments can tailor\ntests to individual students.\nSupporting details: AI assessments can\noften evaluate tests, providing a grade and/\nor instant feedback for each student. AI\nplatforms can also track student progress\nbased on assessments and provide the\nresults to students, parents and teachers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9263","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":42,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Review your table and notes in the Critical thinking section again. Choose one of the drawbacks to include in your essay. Use it to write a counter-argument, a concession and a refutation.","pages":[227],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8c01744e531b8f25544c9dddd7f1c5591c735dcbb9b7539917444b0756a93c83.png"],"provided":"Review your table and notes in the Critical thinking section again. Choose one of the drawbacks to include in your essay. Use it to write a counter-argument, a concession and a refutation.","items":[{"id":"b9263.i01","label":"1","prompt":"Counter-argument","options":[],"type":"gap/open"},{"id":"b9263.i02","label":"2","prompt":"Concession","options":[],"type":"gap/open"},{"id":"b9263.i03","label":"3","prompt":"Refutation","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U09-question:b9244","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[222]},{"id":"B05-RW-U09-question:b9246","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[222]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9263.i01","label":"1","prompt":"Counter-argument","options":[],"type":"gap/open"},{"kind":"item","id":"b9263.i02","label":"2","prompt":"Concession","options":[],"type":"gap/open"},{"kind":"item","id":"b9263.i03","label":"3","prompt":"Refutation","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Counter-argument: There is ongoing\nconcern that AI technology will largely\nreplace teachers, depriving students of\nhuman interaction, which is necessary\nfor learning.\nConcession: While AI technology has\ntaken on a larger role in some aspects of\neducation, such as online testing, it does\nnot have the ability to replace human\ninteraction.\nRefutation: Artificial intelligence cannot\nevaluate when an individual student is\nstruggling with a task or if they’re having a\nbad day. AI lacks empathy and an in-depth\nunderstanding of learning styles and human\ninteraction. For these reasons, AI will not\nreplace teachers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U09-question:b9264","book":5,"unit":9,"track":"RW","topic":"TECHNOLOGY","lesson":2,"order":43,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Think about your introduction. Review your thesis statement from Critical thinking, Exercise 5 on page 222. Your readers may not be familiar with the technology. What information can you include in the introduction to help them understand this technology?","pages":[227],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8c01744e531b8f25544c9dddd7f1c5591c735dcbb9b7539917444b0756a93c83.png"],"provided":"Think about your introduction. Review your thesis statement from Critical thinking, Exercise 5 on page 222. Your readers may not be familiar with the technology. What information can you include in the introduction to help them understand this technology?","items":[{"id":"b9264.i01","label":"1","prompt":"Review your thesis statement. Make any revisions based on the review of your notes.","options":[],"type":"discuss/open"},{"id":"b9264.i02","label":"2","prompt":"What information can you include in the introduction to help readers understand this technology?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U09-question:b9246","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[222]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9264.i01","label":"1","prompt":"Review your thesis statement. Make any revisions based on the review of your notes.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9264.i02","label":"2","prompt":"What information can you include in the introduction to help readers understand this technology?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-RW-U09-publisher-page:p222","title":"原题或核对备注所引第222页","pages":[222],"text":"","screens":[],"sources":[{"page":222,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9a7ea1cf6f8686c801278174d313a51775813853de896de600a7bfc7d7dcd9b3.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Artificial intelligence is an emerging\ntechnology in education that will\nhave a positive impact on individual\nlearning styles, students with disabilities\nand assessments.\n2 Artificial intelligence has existed in\nthe education domain for some time\nnow. Some of the goals are to enhance\nthe individual learning experience,\nsupport students with disabilities and\nmake the test-taking experience more\nefficient and productive. An example of\neducational AI is the language learning\napp Duolingo, which has been using AI\nfor several years. Once users begin a\nlesson, the software assesses strengths\nand weaknesses and then adjusts the\nlessons accordingly.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":69,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":25,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae
