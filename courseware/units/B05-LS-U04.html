answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type" options":[]},"b7715.i07":{"options":[]}},"rewriteKey":""},"B05-LS-U04-question:b7717":{"rows":{},"basis":"全册逐空复核。原课文或表格已接入原位答案，提取出的独立小题重复了相同答位。回读现用题面与已绑定教师书，保留完整原文及答案，合并重复投屏页。","displayPages":[[{"kind":"text","text":"(1) __ differ from businesses that operate for a profit in that they cannot keep the money they raise or distribute it to owners or shareholders as (2) __. Instead, their (3) __, most of which is provided through (4) __, must be used to pay for the organization's (5) __. To ensure that the organization remains focused on carrying out its primary (6) __ at all times, a (7) __ maintains oversight of all operations.","answer":{"mode":"blanks","values":["Non-profit organizations","equity","revenue","fundraising","programmes","mission","board of directors"]}}]],"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B05-LS-U04":{"aspect":1.9085487,"cues":[[1.16,4.66,"With a successful gaming app already under his belt,","在他的腰带里有一个成功的游戏应用软件"],[5.04,8.58,"Jasper Onono has joined the growing ranks of East Africa's WizKids,","贾斯珀・奥诺诺已经加入了越来越多的东非的WizKids，"],[8.92,11.5,"helping to propel the region into the tech spotlight.","帮助推动该地区进入技术聚光灯。"],[12.36,12.86,"Metatu,","梅塔图，"],[13.2,15.02,"a traditional two -player card game,","一个传统的双玩家卡片游戏，"],[15.34,17.32,"has long been popular here in Uganda.","在乌干达很受欢迎"],[17.9,20.34,"But with the rapid growth of the smartphone market,","但随着智能手机市场的迅速发展，"],[20.88,24.12,"in Kenya alone one in five people access the web through their phones.","仅肯尼亚就有五分之一的人通过手机上网。"],[24.74,28.92,"Entrepreneurs like Jasper are building apps that cater to the needs of local markets.","像贾斯珀这样的企业家正在建造适应当地市场需求的应用软件。"],[29.58,33.52,"Metatu is a very popular two -card playing game in Uganda.","Metatu是乌干达非常受欢迎的两张牌游戏。"],[34.04,37.86,"It's one of the, it's actually the most popular game in Uganda right now.","这是目前乌干达最受欢迎的游戏之一。"],[38.3,50.92,"So the idea came up back in campus when we were attending a conference and a thought just hit us that why don't people have this game in their phones?","所以当我们参加一个会议的时候，这个想法又回到了校园，一个想法刚刚击中我们，为什么人们不把这个游戏放在他们的电话里呢？"],[51.06,52.18,"Can we do this game?","我们能玩这个游戏吗？"],[52.88,61.08,"In 2011, Metatu was a finalist in Google's Android Developer Challenge for Sub -Saharan Africa, providing them with publicity and mentoring,","2011年，Metatu是Google的撒哈拉以南非洲Android开发者挑战赛的决赛选手，向他们提供宣传和指导，"],[61.5,65.14,"as well as having their app posted in Google Play Store and Google Cloud.","以及他们的应用在Google Play Store和Google Cloud上发布。"],[65.76,68.64,"Now, with more than 60 ,000 downloads,","下载量超过六万次"],[69.03999999999999,72.8,"Metatu's success is the latest sign of the region's high -tech hopes.","梅塔图的成功是该地区高科技希望的最新标志。"],[73.74,83.5,"I like having it on the phone because then I can play it anytime and even when I'm alone I don't need to have friends around or a group of people.","我喜欢用电话，因为这样我就可以随时播放，即使我一个人的时候，我不需要朋友或一群人。"],[83.68,86.7,"I can just have it on my phone, play it anytime, anywhere.","我可以把它放在手机上随时随地播放"],[87.18,88.16,"And it's fun.","亦复欢喜。"],[89.34,93.2,"From the laying of fiber optic cables to popular mobile money systems,","从铺设光纤电缆到流行的移动货币系统，"],[93.8,96.68,"East Africa has experienced a dramatic tech hub boom,","东非经历了一个戏剧性的技术中心繁荣，"],[97.28,102.64,"spurred on by collaborative workspaces such as Nairobi's iHub and growing international investment.","在诸如内罗毕iHub等合作性工作空间和国际投资不断增长的推动下。"],[103.7,107.25999999999999,"Africa has the highest concentration of young people anywhere on the planet,","非洲是世界上年轻人最集中的地方，"],[107.8,110.7,"many of whom have at least some disposable income.","其中许多人至少有一些可支配收入。"],[111.18,115.62,"And increasingly, investors are looking to break into these lucrative local markets.","投资者越来越想进入这些有利可图的当地市场。"],[115.62,132.72,"But if we can have a place whereby somebody can say when they're listing in the top five apps on their phone, we'll have at least one or two Kenyan or African apps on it, I feel like that will go a long way in encouraging other young people to begin to believe that there is more potential than what they see.","但如果我们有一个地方，有人可以说当他们在手机上列出前五个应用程序时，我们至少会有一个或两个肯尼亚或非洲应用程序，我觉得这将非常有助于鼓励其他年轻人开始相信比他们所看到的有更大的潜力。"],[132.84,135.74,"We're not just consumers of content, we're creators of it.","我们不仅仅是内容的消费者，我们是内容的创造者。"],[136.46,138.6,"If the future of computing lies in mobile,","如果计算的未来在于移动，"],[139.06,142.16,"and the fastest growth in mobile comes from developing world,","而移动增长最快的来自发展中国家，"],[142.6,146.98,"many are beginning to look to African startups for a taste of things to come.","许多人开始期待非洲的初创企业来品尝即将到来的东西。"]],"englishRows":4,"chineseRows":2}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");

 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));

 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){

 return display(i);
}
function returnToTask(){

}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){

function inspectMaterials(doc,c){

  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
