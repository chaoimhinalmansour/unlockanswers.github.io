est in African tech companies.","options":["True","False"],"type":"choice_gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7669.i01","label":"1","prompt":"The Ugandan smartphone market is growing quickly.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b7669.i02","label":"2","prompt":"Ugandan tech companies are developing apps for a global market.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b7669.i03","label":"3","prompt":"The game Mutatu has become popular all over the world.","options":["True","False"],"type":"choice_gap/closed"}],[{"kind":"item","id":"b7669.i04","label":"4","prompt":"Young people in Africa have money to spend on games.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b7669.i05","label":"5","prompt":"Very few people want to invest in African tech companies.","options":["True","False"],"type":"choice_gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/05b6368b8a3f6c4d2f181192-L5LS-U04.mp4","captions":[{"start":1.16,"end":4.66,"text":"With a successful gaming app already under his belt,"},{"start":5.04,"end":8.58,"text":"Jasper Onono has joined the growing ranks of East\nAfrica's WizKids,"},{"start":8.92,"end":11.5,"text":"helping to propel the region into the tech spotlight."},{"start":12.36,"end":12.86,"text":"Metatu,"},{"start":13.2,"end":15.02,"text":"a traditional two -player card game,"},{"start":15.34,"end":17.32,"text":"has long been popular here in Uganda."},{"start":17.9,"end":20.34,"text":"But with the rapid growth of the smartphone market,"},{"start":20.88,"end":24.12,"text":"in Kenya alone one in five people access the web\nthrough their phones."},{"start":24.74,"end":28.92,"text":"Entrepreneurs like Jasper are building apps that cater\nto the needs of local markets."},{"start":29.58,"end":33.52,"text":"Metatu is a very popular two -card playing game in\nUganda."},{"start":34.04,"end":37.86,"text":"It's one of the, it's actually the most popular game in\nUganda right now."},{"start":38.3,"end":50.92,"text":"So the idea came up back in campus when we were\nattending a conference and a thought just hit us that\nwhy don't people have this game in their phones?"},{"start":51.06,"end":52.18,"text":"Can we do this game?"},{"start":52.88,"end":61.08,"text":"In 2011, Metatu was a finalist in Google's Android\nDeveloper Challenge for Sub -Saharan Africa, providing\nthem with publicity and mentoring,"},{"start":61.5,"end":65.14,"text":"as well as having their app posted in Google Play Store\nand Google Cloud."},{"start":65.76,"end":68.64,"text":"Now, with more than 60 ,000 downloads,"},{"start":69.03999999999999,"end":72.8,"text":"Metatu's success is the latest sign of the region's\nhigh -tech hopes."},{"start":73.74,"end":83.5,"text":"I like having it on the phone because then I can play\nit anytime and even when I'm alone I don't need to have\nfriends around or a group of people."},{"start":83.68,"end":86.7,"text":"I can just have it on my phone, play it anytime,\nanywhere."},{"start":87.18,"end":88.16,"text":"And it's fun."},{"start":89.34,"end":93.2,"text":"From the laying of fiber optic cables to popular mobile\nmoney systems,"},{"start":93.8,"end":96.68,"text":"East Africa has experienced a dramatic tech hub boom,"},{"start":97.28,"end":102.64,"text":"spurred on by collaborative workspaces such as\nNairobi's iHub and growing international investment."},{"start":103.7,"end":107.25999999999999,"text":"Africa has the highest concentration of young people\nanywhere on the planet,"},{"start":107.8,"end":110.7,"text":"many of whom have at least some disposable income."},{"start":111.18,"end":115.62,"text":"And increasingly, investors are looking to break into\nthese lucrative local markets."},{"start":115.62,"end":132.72,"text":"But if we can have a place whereby somebody can say\nwhen they're listing in the top five apps on their\nphone, we'll have at least one or two Kenyan or African\napps on it, I feel like that will go a long way in\nencouraging other young people to begin to believe that\nthere is more potential than what they see."},{"start":132.84,"end":135.74,"text":"We're not just consumers of content, we're creators of\nit."},{"start":136.46,"end":138.6,"text":"If the future of computing lies in mobile,"},{"start":139.06,"end":142.16,"text":"and the fastest growth in mobile comes from developing\nworld,"},{"start":142.6,"end":146.98,"text":"many are beginning to look to African startups for a\ntaste of things to come."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 T 2 F; Ugandan tech companies are developing apps\nfor local markets. 3 DNS 4 T 5 F; Increasingly, people\nwant to invest in African tech companies.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":39,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7670","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Complete the sentences with one to three words in each gap.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38bfdec1b6f8b059620e93030fc83b97c5f8c497a52a3bb109f8a9938863870c.png"],"provided":"","items":[{"id":"b7670.i01","label":"1","prompt":"Jasper Nunu developed a successful ____ called Mutatu.","options":[],"type":"gap/closed"},{"id":"b7670.i02","label 4-question:b7672","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work in a small group. Discuss the questions.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38bfdec1b6f8b059620e93030fc83b97c5f8c497a52a3bb109f8a9938863870c.png"],"provided":"","items":[{"id":"b7672.i01","label":"1","prompt":"Why do you think Google run developer competitions in Sub-Saharan Africa?","options":[],"type":"discuss/open"},{"id":"b7672.i02","label":"2","prompt":"Do you know where the apps you use were developed? Were any developed in Africa? Were any of the apps you use developed in your country?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7672.i01","label":"1","prompt":"Why do you think Google run developer competitions in Sub-Saharan Africa?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7672.i02","label":"2","prompt":"Do you know where the apps you use were developed? Were any developed in Africa? Were any of the apps you use developed in your country?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think Google runs developer\ncompetitions in Sub-Saharan Africa\nto support tech growth and discover\nnew talent in emerging markets. It also\nhelps them tap into local innovations\nand ideas.\n2 Most apps I use are developed in the\nU.S. or Europe, like Instagram and\nWhatsApp. I don’t think I have any\napps developed in Africa, but some\nlocal news and banking apps I use were\ndeveloped in my country.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":39,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7675","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"order":7,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the two posts from an online forum about sustainable banks. Then write the words in bold next to their definitions below (1–8).","pages":[84],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e12013b20570cab821f01c3134f2d6ff45542e4b80fb04c682d64af7d38abdf1.png"],"provided":"## Liam\nI've always been convinced that everything we do has consequences. Every single transaction we're involved in, whether it's filling up your car with biodiesel, or buying sustainably-sourced food, has an impact on the world we are creating. I'd advise everyone to bear this in mind when, for example, choosing which bank to open an account with. Many banks will happily deal with any venture at all, provided it is legal. If an entrepreneur wants to start a business related to factory farming, fast fashion or fossil fuels, they'll easily find a bank to lend them the capital they need. But it doesn't have to be like this – there are plenty of sustainable banks out there that are proving highly disruptive in the marketplace and which have high environmental, social and governance standards. So I urge everybody out there to take a stand for a better world – and start using a sustainable bank today.\n7 Likes Comments → Share\n\n## Mariza\nFor me, sustainability has become such a buzzword in the world of business that I'm frankly bored of hearing about it. If I'm choosing a bank to deal with, I'm concerned with finding what's best for me and my money. The last thing I'm going to do is dump my old bank simply because somebody online doesn't think they're very sustainable. It's not an issue for me if my bank deals with an intensive farming business that is cutting down the rainforest and using pesticides. I don't need to know if my bank thinks it's making the world a better place by supporting food vendors that stock only organic produce, and to be honest, I simply don't care. So for me, sustainable banks are a waste of time.\n7 Likes Comments → Share","items":[{"id":"b7675.i01","label":"1","prompt":"sellers ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i02","label":"2","prompt":"a new business ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i03","label":"3","prompt":"to keep a supply of something for sale ____ (v)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i04","label":"4","prompt":"money for a company to grow or operate ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i05","label":"5","prompt":"an activity that involves the movement of money ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i06","label":"6","prompt":"changing the traditional way a business operates ____ (adj)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i07","label":"7","prompt":"to stop using something because it's not wanted ____ (v)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"},{"id":"b7675.i08","label":"8","prompt":"popular word or expression that is sometimes overused ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## Liam"},{"kind":"text","text":"I've always been convinced that everything we do has consequences. Every single transaction we're involved in, whether it's filling up your car with biodiesel, or buying sustainably-sourced food, has an impact on the world we are creating. I'd advise everyone to bear this in mind when, for example, choosing which bank to open an account with. Many banks will happily deal with any venture at all, provided it is legal. If an entrepreneur wants to start a business related to factory farming, fast fashion or fossil fuels, they'll easily find a bank to lend them the capital they need. But it doesn't have to be like this – there are plenty of sustainable banks out there that are proving highly disruptive in the marketplace and which have high environmental, social and governance standards. So I urge everybody out there to take a stand for a"},{"kind":"text","text":"better world – and start using a sustainable bank today."}],[{"kind":"text","text":"7 Likes Comments → Share"},{"kind":"text","text":"## Mariza"},{"kind":"text","text":"For me, sustainability has become such a buzzword in the world of business that I'm frankly bored of hearing about it. If I'm choosing a bank to deal with, I'm concerned with finding what's best for me and my money. The last thing I'm going to do is dump my old bank simply because somebody online doesn't think they're very sustainable. It's not an issue for me if my bank deals with an intensive farming business that is cutting down the rainforest and using pesticides. I don't need to know if my bank thinks it's making the world a better place by supporting food vendors that stock only organic produce, and to be honest, I simply don't care. So for me, sustainable banks are a waste of time."}],[{"kind":"text","text":"7 Likes Comments → Share"},{"kind":"item","id":"b7675.i01","label":"1","prompt":"sellers ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":6}},{"kind":"item","id":"b7675.i02","label":"2","prompt":"a new business ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":1}}],[{"kind":"item","id":"b7675.i03","label":"3","prompt":"to keep a supply of something for sale ____ (v)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":7}},{"kind":"item","id":"b7675.i04","label":"4","prompt":"money for a company to grow or operate ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":2}}],[{"kind":"item","id":"b7675.i05","label":"5","prompt":"an activity that involves the movement of money ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":0}},{"kind":"item","id":"b7675.i06","label":"6","prompt":"changing the traditional way a business operates ____ (adj)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":3}}],[{"kind":"item","id":"b7675.i07","label":"7","prompt":"to stop using something because it's not wanted ____ (v)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":5}},{"kind":"item","id":"b7675.i08","label":"8","prompt":"popular word or expression that is sometimes overused ____ (n)","options":["transaction","venture","capital","disruptive","buzzword","dump","vendors","stock"],"type":"choice/closed","answer":{"label":"8","mode":"choice","option":4}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 vendors 2 venture 3 stock 4 capital 5 transaction\n6 disruptive 7 dump 8 buzzword","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":40,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7677","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"order":8,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work in small groups. Whose argument (Liam's or Mariza's) do you find more persuasive, and why? Try to use the words in bold.","pages":[85],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/56d4848d76397677e7dd19638cee16c5a1e5ff47e8b803274fe3b870ed0e57a6.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I tend to agree with Liam’s position. As\nindividuals we have little power, but if\nenough people choose how to spend\nmoney based on ethical considerations,\nI think we can make a difference.\nI think Mariza is right—it’s unrealistic of\npeople to think that they can really change\nthe world just through little day-to-day\ndecisions, such as which bank to use.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7678","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"order":9,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Complete the questions with a word in bold from Exercise 1 in an appropriate form. Work with a partner to answer the questions.","pages":[85],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/56d4848d76397677e7dd19638cee16c5a1e5ff47e8b803274fe3b870ed0e57a6.png"],"provided":"","items":[{"id":"b7678.i01","label":"1","prompt":"Can you give an example of a ____ which you hear a lot, but which you think people sometimes misuse?","options":[],"type":"gap/open"},{"id":"b7678.i02","label":"2","prompt":"Can you think of any product that your local shop doesn't ____, but that you wish it would?","options":[],"type":"gap/open"},{"id":"b7678.i03","label":"3","prompt":"What would you do if you were using your banking app and saw details of a ____ which you didn't recognize?","options":[],"type":"gap/open"},{"id":"b7678.i04","label":"4","prompt":"In a professional sector that you know, can you give an example of a ____ firm or product that is changing the nature of the sector itself? Do you think the influence is positive or negative, and why?","options":[],"type":"gap/open"},{"id":"b7678.i05","label":"5","prompt":"In what circumstances might a company consider ____ its CEO?","options":[],"type":"gap/open"},{"id":"b7678.i06","label":"6","prompt":"In your country, do you think a person who wants to open a fast-food business would be more likely to succeed as a street ____ or working out of a fixed premises?","options":[],"type":"gap/open"},{"id":"b7678.i07","label":"7","prompt":"What would be the most efficient way for an entrepreneur from your country to raise ____ in order to fund a new ____?","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-LS-U04-question:b7675","kind":"material-reference","title":"LISTENING 1 Ex 1","pages":[84]}],"materials":[],"coursePages":[[{"kind":"item","id":"b7678.i01","label":"1","prompt":"Can you give an example of a ____ which you hear a lot, but which you think people sometimes misuse?","options":[],"type":"gap/open"},{"kind":"item","id":"b7678.i02","label":"2","prompt":"Can you think of any product that your local shop doesn't ____, but that you wish it would?","options":[],"type":"gap/open"},{"kind":"item","id":"b7678.i03","label":"3","prompt":"What would you do if you were using your banking app and saw details of a ____ which you didn't recognize?","options":[],"type":"gap/open"},{"kind":"item","id":"b7678.i04","label":"4","prompt":"In a professional sector that you know, can you give an example of a ____ firm or product that is changing the nature of the sector itself? Do you think the influence is positive or negative, and why?","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7678.i05","label":"5","prompt":"In what circumstances might a company consider ____ its CEO?","options":[],"type":"gap/open"},{"kind":"item","id":"b7678.i06","label":"6","prompt":"In your country, do you think a person who wants to open a fast-food business would be more likely to succeed as a street ____ or working out of a fixed premises?","options":[],"type":"gap/open"},{"kind":"item","id":"b7678.i07","label":"7","prompt":"What would be the most efficient way for an entrepreneur from your country to raise ____ in order to fund a new ____?","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-LS-U04-publisher-sheet:b7675","title":"LISTENING 1 Ex 1 原题面","pages":[84],"text":"## Liam\nI've always been convinced that everything we do has consequences. Every single transaction we're involved in, whether it's filling up your car with biodiesel, or buying sustainably-sourced food, has an impact on the world we are creating. I'd advise everyone to bear this in mind when, for example, choosing which bank to open an account with. Many banks will happily deal with any venture at all, provided it is legal. If an entrepreneur wants to start a business related to factory farming, fast fashion or fossil fuels, they'll easily find a bank to lend them the capital they need. But it doesn't have to be like this – there are plenty of sustainable banks out there that are proving highly disruptive in the marketplace and which have high environmental, social and governance standards. So I urge everybody out there to take a stand for a better world – and start using a sustainable bank today.\n7 Likes Comments → Share\n\n## Mariza\nFor me, sustainability has become such a buzzword in the world of business that I'm frankly bored of hearing about it. If I'm choosing a bank to deal with, I'm concerned with finding what's best for me and my money. The last thing I'm going to do is dump my old bank simply because somebody online doesn't think they're very sustainable. It's not an issue for me if my bank deals with an intensive farming business that is cutting down the rainforest and using pesticides. I don't need to know if my bank thinks it's making the world a better place by supporting food vendors that stock only organic produce, and to be honest, I simply don't care. So for me, sustainable banks are a waste of time.\n7 Likes Comments → Share","screens":["## Liam","I've always been convinced that everything we do has consequences. Every single transaction we're involved in, whether it's filling up your car with biodiesel, or buying sustainably-sourced food, has an impact on the world we are creating. I'd advise everyone to bear this in mind when, for example, choosing which bank to open an account with. Many banks will happily deal with any venture at all, provided it is legal. If an entrepreneur wants to start a business related to factory farming, fast fashion or fossil fuels, they'll easily find a bank to lend them the capital they need. But it doesn't have to be like this – there are plenty of","sustainable banks out there that are proving highly disruptive in the marketplace and which have high environmental, social and governance standards. So I urge everybody out there to take a stand for a better world – and start using a sustainable bank today.","7 Likes Comments → Share","## Mariza","For me, sustainability has become such a buzzword in the world of business that I'm frankly bored of hearing about it. If I'm choosing a bank to deal with, I'm concerned with finding what's best for me and my money. The last thing I'm going to do is dump my old bank simply because somebody online doesn't think they're very sustainable. It's not an issue for me if my bank deals with an intensive farming business that is cutting down the rainforest and using pesticides. I don't need to know if my bank thinks it's making the world a better place by supporting food vendors that stock only organic produce, and to be honest, I simply don't care. So","for me, sustainable banks are a waste of time.","7 Likes Comments → Share"],"sources":[{"page":84,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e12013b20570cab821f01c3134f2d6ff45542e4b80fb04c682d64af7d38abdf1.png"}],"kind":"task_sheet","sourceBlockIds":["b7675"]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7679","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"order":10,"module":"LISTENING 1","ex":"4","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a lecture about disruptive innovation. Before you listen, work with a partner to discuss these questions.","pages":[85],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/56d4848d76397677e7dd19638cee16c5a1e5ff47e8b803274fe3b870ed0e57a6.png"],"provided":"","items":[{"id":"b7679.i0 sour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/89e35a4e318510aae236bb9276f69b87499a59c9ad4634eaf07219617e845594.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U04-question:b7707","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 4","pages":[90]}],"materials":[],"coursePages":[[{"kind":"text","text":"In what circumstances might a company get its business data ____ by a person rather than by specialist software?"},{"kind":"text","text":"Do you know anybody who has now ____ books completely and does all their reading on mobile devices?"},{"kind":"text","text":"Why do food manufacturers often advise on packaging that ____ of nuts may be found in a product?"},{"kind":"text","text":"What new technologies are currently ____"},{"kind":"text","text":"how do you think they will impact a sector you are interested in?"}],[{"kind":"text","text":"Do you feel it is reasonable for companies to spend a ____ sum on private air travel for their top executives, but then claim that they follow sustainable practices?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It would make sense for a one-person\nbusiness to analyse data in this way, for\nexample a self-employed photographer\nlooking at where their customers had\ncome from over the previous year.\nAnalyzing a small amount of data\nshould be manageable for one person\nto do themselves. But I imagine larger\ncompanies dealing with more\nsubstantial amounts of data would\nanalyse it electronically.\n2 I know people who only occasionally\nread books, but I don’t know any\nconsistent readers who have abandoned\nthem altogether.\n3 This is to raise awareness of nuts and\nother allergens which may be present in\na food product in very small quantities.\nAs this can be enough to trigger an\nallergic reaction, and potentially lead to\nlegal action against a business, I think\nthey are right to do this.\n4 Artificial intelligence is beco eMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Work extremely hard: push the limits, run\na marathon\nExperience a difficult time in your life:\nweather a storm, walk through fire","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7724","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":34,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to answer the following questions.","pages":[94],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0e5d542436d3936550a27c82d6f173d893733ca99ef80bfe14721e1e4e8c181f.png"],"provided":"1 How do you (or would you) choose an organization to donate your time or money to?\n2 Can you think of a fundraising campaign you have been aware of recently? How effectively do you think it achieved its goals?","items":[{"id":"b7724.i01","label":"1","prompt":"How do you (or would you) choose an organization to donate your time or money to?","options":[],"type":"discuss/open"},{"id":"b7724.i02","label":"2","prompt":"Can you think of a fundraising campaign you have been aware of recently? How effectively do you think it achieved its goals?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 How do you (or would you) choose an organization to donate your time or money to?"},{"kind":"text","text":"2 Can you think of a fundraising campaign you have been aware of recently? How effectively do you think it achieved its goals?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I would always look at their social media\npresence to find more about their\nactivities, and form a view as to whether\ntheir goals and priorities are similar\nto mine. I would also look for case\nstudies of people who have benefited\nfrom the support of the organization to\nsee that they have a real effect. There\nare also websites that provide ratings\nof different organizations and their\neffectiveness.\n2 A friend of mine participated in an event\nwhere lots of people slept outside for\none night and received donations from\nfriends and family members which went\nto help homeless people in the local\narea. I think this raises awareness of the\nhardship homeless people experience.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7725","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":35,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Write an essay (200 words) outlining whether or not non-profit organizations can learn from for-profit businesses. Do some online research on three businesses or charities. Use the ideas below to help you.","pages":[94],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0e5d542436d3936550a27c82d6f173d893733ca99ef80bfe14721e1e4e8c181f.png"],"provided":"mission use of technology use of data social media collaboration connections reputation fundraising\n\nInclude an introduction with opening statement, a short paragraph on each business or charity and a conclusion.","items":[{"id":"b7725.i01","label":"1","prompt":"Write an essay (200 words) outlining whether or not non-profit organizations can learn from for-profit businesses. Do some online research on three businesses or charities. Use the ideas below to help you. Include an introduction with opening statement, a short paragraph on each business or charity and a conclusion.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"mission use of technology use of data social media collaboration connections reputation fundraising"},{"kind":"text","text":"Include an introduction with opening statement, a short paragraph on each business or charity and a conclusion."},{"kind":"item","id":"b7725.i01","label":"1","prompt":"Write an essay (200 words) outlining whether or not non-profit organizations can learn from for-profit businesses. Do some online research on three businesses or charities. Use the ideas below to help you. Include an introduction with opening statement, a short paragraph on each business or charity and a conclusion.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"This essay will argue that non-profit\norganizations can gain insights from for-\nprofit businesses to enhance their impact.\nFor-profits’ skill at exploiting technology is\nevident in the example of Khan Academy,\nwhich transformed education through\ndigital platforms. Non-profits can similarly\nembrace technological innovation to\nbroaden their reach, as seen in online\nlearning initiatives.\nStrategic planning and goal setting are\nareas where for-profits excel, exemplified\nby the Bill & Melinda Gates Foundation. By\nincorporating measurable objectives and\ndata-driven decision-making, non-profits\ncan enhance their effectiveness. Non-profits\ncan learn to set clear goals and adapt\nstrategies based on outcomes to enhance\ntheir effectiveness.\nCollaborations are a strength of for-profit\ncompanies, demonstrated by TOMS Shoes\nthrough its One for One model. Through\nthis scheme, one pair of shoes is given\naway for each pair that is sold. Non-profits\ncan learn to form strategic alliances that\nincrease their impact through shared\nresources and expertise.\nIn conclusion, while non-profits and for-\nprofits may differ in their missions, the latter\nprovides valuable lessons. By adopting\nefficient financial practices, embracing\ntechnology, and drawing inspiration\nfrom successful charities, non-profits\ncan maximize their potential, fulfill their\nmissions, and contribute to a better and\nfairer world.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7731","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":36,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Read the descriptions. Discuss each venture's potential to succeed and to attract interest from investors or donors.","pages":[95],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9379f04fb910a79ebdfa78a4c83cd9f1ae8411eb18211d9a5b3ee38f5c7f000a.png"],"provided":"Work in small groups. Read the descriptions. Discuss each venture's potential to succeed and to attract interest from investors or donors.\nThe Full Wardrobe: a service to help women with a lot of clothes generate income by renting out their clothing to others\nProud City: a service that connects visitors with city residents who can act as guides, giving visitors a richer city experience\nMany Hands: a service that connects individuals with certified, reliable, and affordable caregivers for family members\nRain To Go: a group that works with private companies to develop portable water purifiers and distribute them in poor countries\nBeauty for Good: an organization that makes organic beauty products from crops grown by collective farms in Africa. Part of the profits are returned to the farmers\nReset: a service that provides language classes and job training for refugees who have been displaced by war, conflicts or natural disaster","items":[{"id":"b7731.i01","label":"1","prompt":"Work in small groups. Read the descriptions. Discuss each venture's potential to succeed and to attract interest from investors or donors. ## group A: ideas for P2P businesses","options":[],"type":"discuss/open"},{"id":"b7732.i01","label":"1","prompt":"The Full Wardrobe: a service to help women with a lot of clothes generate income by renting out their clothing to others","options":[],"type":"gap/open"},{"id":"b7733.i01","label":"2","prompt":"Proud City: a service that connects visitors with city residents who can act as guides, giving visitors a richer city experience","options":[],"type":"gap/open"},{"id":"b7734.i01","label":"3","prompt":"Many Hands: a service that connects individuals with certified, reliable, and affordable caregivers for family members ## group B: ideas for non-profits working for social good","options":[],"type":"gap/open"},{"id":"b7735.i01","label":"1","prompt":"Rain To Go: a group that works with private companies to develop portable water purifiers and distribute them in poor countries","options":[],"type":"gap/open"},{"id":"b7736.i01","label":"2","prompt":"Beauty for Good: an organization that makes organic beauty products from crops grown by collective farms in Africa. Part of the profits are returned to the farmers","options":[],"type":"gap/open"},{"id":"b7737.i01","label":"3","prompt":"Reset: a service that provides language classes and job training for refugees who have been displaced by war, conflicts or natural disaster","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"The Full Wardrobe: a service to help women with a lot of clothes generate income by renting out their clothing to others"},{"kind":"text","text":"Proud City: a service that connects visitors with city residents who can act as guides, giving visitors a richer city experience"},{"kind":"text","text":"Many Hands: a service that connects individuals with certified, reliable, and affordable caregivers for family members"},{"kind":"text","text":"Rain To Go: a group that works with private companies to develop portable water purifiers and distribute them in poor countries"}],[{"kind":"text","text":"Beauty for Good: an organization that makes organic beauty products from crops grown by collective farms in Africa. Part of the profits are returned to the farmers"},{"kind":"text","text":"Reset: a service that provides language classes and job training for refugees who have been displaced by war, conflicts or natural disaster"},{"kind":"item","id":"b7731.i01","label":"1","prompt":"Work in small groups. Read the descriptions. Discuss each venture's potential to succeed and to attract interest from investors or donors. ## group A: ideas for P2P businesses","options":[],"type":"discuss/open"},{"kind":"item","id":"b7734.i01","label":"3","prompt":"Many Hands: a service that connects individuals with certified, reliable, and affordable caregivers for family members ## group B: ideas for non-profits working for social good","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Group A\n1 The Full Wardrobe\nHigh demand for sustainable fashion\nand rental services, especially among\neco-conscious consumers.\nCould attract investors interested in\nsustainability and the sharing economy.\n2 Proud City\nUnique offering that enhances tourism\nexperiences; appeals to travelers\nseeking authentic local insights.\nMay attract investment from tourism\nboards or local governments wanting to\nboost tourism.\n3 Many Hands\nGrowing need for affordable caregiver\nservices as populations age; connects\nfamilies with essential services.\nPotential appeal to health-focused\ninvestors or organizations aiming to\nsupport family care solutions.\nGroup B\n1 Rain To Go\nStrong social impact focus addressing\nclean water access in developing\ncountries; essential need.\nLikely to attract investors focused on\nsocial entrepreneurship and sustainable\ndevelopment.\n2 Beauty for Good\nIncreasing demand for organic and\nethically sourced products; positive\nimpact on local farming communities.\nMay draw interest from investors in the\nbeauty industry and those focused on\nethical sourcing.\n3 Reset\nHigh demand for refugee support\nservices, especially for language and job\ntraining; fills a crucial gap.\nAppeals to donors and investors\ninterested in social justice and refugee\nassistance programs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7738","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Brainstorm ideas for what you think investors or donors might want to know about a venture before they invest/donate. Make notes in the table below.","pages":[96],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/826bdd123711ee22fcca9e3005fc9562cfb8550d2ce0b94ecd769e607bbce802.png"],"provided":"\u003 e":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7739","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with your group. Review your work in Exercises 1 and 2, and rank the three ventures in each group.","pages":[97],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/89fa617efded71e712ddb630b898891ef37e72ab83096a35ad753f4a009137e0.png"],"provided":"1 If you were an investor, which start-up would you give your money to? Why?\n1 ____\n2 ____\n3 ____\n2 If you were a donor, which non-profit would you contribute money to? Why?\n1 ____\n2 ____\n3 ____","items":[],"layout":"list","references":[{"id":"B05-LS-U04-question:b7738","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[96]},{"id":"B05-LS-U04-question:b7731","kind":"material-reference","title":"CRITICAL THINKING Ex 1","pages":[95]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 If you were an investor, which start-up would you give your money to? Why?"},{"kind":"text","text":"3 ____"},{"kind":"text","text":"2 If you were a donor, which non-profit would you contribute money to? Why?"},{"kind":"text","text":"3 ____"}]],"courseMaterials":[{"id":"B05-LS-U04-publisher-sheet:b7731","title":"CRITICAL THINKING Ex 1 原题面","pages":[95],"text":"Work in small groups. Read the descriptions. Discuss each venture's potential to succeed and to attract interest from investors or donors.\nThe Full Wardrobe: a service to help women with a lot of clothes generate income by renting out their clothing to others\nProud City: a service that connects visitors with city residents who can act as guides, giving visitors a richer city experience\nMany Hands: a service that connects individuals with certified, reliable, and affordable caregivers for family members\nRain To Go: a group that works with private companies to develop portable water purifiers and distribute them in poor countries\nBeauty for Good: an organization that makes organic beauty products from crops grown by collective farms in Africa. Part of the profits are returned to the farmers\nReset: a service that provides language classes and job training for refugees who have been displaced by war, conflicts or natural disaster","screens":["Work in small groups. Read the descriptions. Discuss each venture's potential to succeed and to attract interest from investors or donors.","The Full Wardrobe: a service to help women with a lot of clothes generate income by renting out their clothing to others","Proud City: a service that connects visitors with city residents who can act as guides, giving visitors a richer city experience","Many Hands: a service that connects individuals with certified, reliable, and affordable caregivers for family members","Rain To Go: a group that works with private companies to develop portable water purifiers and distribute them in poor countries","Beauty for Good: an organization that makes organic beauty products from crops grown by collective farms in Africa. Part of the profits are returned to the farmers","Reset: a service that provides language classes and job training for refugees who have been displaced by war, conflicts or natural disaster"],"sources":[{"page":95,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9379f04fb910a79ebdfa78a4c83cd9f1ae8411eb18211d9a5b3ee38f5c7f000a.png"}],"kind":"task_sheet","sourceBlockIds":["b7731","b7732","b7733","b7734","b7735","b7736","b7737"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1\n1  Many Hands: This service connects\nindividuals with reliable caregivers,\naddressing a crucial need for families\nseeking support for their loved ones.\nThe potential for high demand in an\naging population makes this a strong\ninvestment choice.\n2  The Full Wardrobe: Renting out\nclothing is an innovative way to\npromote sustainability and help\nwomen generate income. It taps into\nthe growing sharing economy and\nappeals to environmentally\nconscious consumers, making it a\npromising venture.\n3  Proud City: While connecting visitors\nwith local guides can enhance\nthe travel experience, it may face\ncompetition from existing services.\nIts success depends on effective\nmarketing and differentiation in a\ncrowded market.\n2\n1  Reset: This organization addresses\nurgent social issues by providing\nlanguage classes and job training\nto refugees. Supporting displaced\nindividuals helps them integrate into\nsociety and rebuild their lives, making\na significant and immediate impact.\n2  Rain To Go: Access to clean water is\na fundamental human right, and this\norganization’s focus on developing\nportable water purifiers is essential\nfor improving health and sanitation\nin poor countries. The potential for\nlong-term health benefits makes this a\nworthy cause.\n3  Beauty for Good: While making\norganic beauty products is\ncommendable, it may not address\nimmediate survival needs as directly\nas the other two. However, the\nmodel of returning profits to farmers\nsupports sustainable agriculture and\neconomic empowerment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7740","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Now think about your own venture. Work with your group. Follow the steps to select a venture that you would like to set up.","pages":[97],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/89fa617efded71e712ddb630b898891ef37e72ab83096a35ad753f4a009137e0.png"],"provided":"step 1: Decide if you would like to do a presentation on a peer-to-peer business or a non-profit organization.\nstep 2: Brainstorm ideas for a new P2P business or non-profit organization.\nstep 3: Narrow your list down to three possibilities. Make a table listing the pros and cons of each.\nstep 4: Choose one business or organization for your presentation.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"step 1: Decide if you would like to do a presentation on a peer-to-peer business or a non-profit organization."},{"kind":"text","text":"step 2: Brainstorm ideas for a new P2P business or non-profit organization."},{"kind":"text","text":"step 3: Narrow your list down to three possibilities. Make a table listing the pros and cons of each."},{"kind":"text","text":"step 4: Choose one business or organization for your presentation."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Step 1: Non-Profit Organization\nStep 2:\nCommunity Skill-Sharing Program: A\nplatform where community members can\nshare skills and knowledge, offering classes\nor workshops on various topics.\nFood Rescue Initiative: A program that\nconnects restaurants and grocery stores\nwith local food banks to redistribute surplus\nfood to those in need.\nMental Health Support Network: A non-\nprofit focused on providing accessible\nmental health resources, workshops, and\nsupport groups in local communities.\nStep 3:\n1 Community Skill-Sharing Program\nPros: Encourages community bonding\nand cooperation. Low operating\ncosts; relies on volunteers. Empowers\nindividuals by sharing knowledge\nand skills.\nCons: Finding enough volunteers and\nparticipants may be challenging. Limited\nfunding opportunities compared to\nother non-profits.\n2 Food Rescue Initiative\nPros: Directly addresses food waste and\nhunger in communities. Potential for\npartnerships with local businesses and\norganizations. High visibility and public\nsupport for food-related causes.\nCons: Requires strong logistical planning\nand coordination. Need for consistent\nvolunteers and donors.\n3 Mental Health Support Network\nPros: Addresses a growing need\nfor mental health support. Can\nprovide a safe space for individuals\nto share experiences. Opportunities\nfor partnerships with mental health\nprofessionals.\nCons: Requires trained professionals\nor volunteers to provide support.\nStigma surrounding mental health may\nlimit participation.\nStep 4: The Food Rescue Initiative\nThis initiative has a clear social impact,\naddressing both food waste and hunger.\nIt has strong potential for community\nengagement and collaboration with local\nbusinesses, making it an appealing choice\nfor potential donors and volunteers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7741","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":40,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Focus on the idea you chose in Exercise 4 and decide what exactly you want to accomplish. Discuss questions you developed in Exercise 2 in your group to help you develop your pitch. Make notes.","pages":[97],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/89fa617efded71e712ddb630b898891ef37e72ab83096a35ad753f4a009137e0.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U04-question:b7740","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[97]},{"id":"B05-LS-U04-question:b7738","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[96]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Food Rescue Initiative\nGoal: Reduce food waste by connecting\nrestaurants and grocery stores with local food\nbanks and shelters to distribute surplus food.\nGeneral Issues: Disruptive of the traditional\nwaste disposal businesses and the food\nsupply chain that typically discards\nunsold food.\nFocused on sustainability, community\nsupport, and tackling hunger.\nInvolves local businesses, food banks,\ncommunity volunteers, and the public.\nPractical Issues: Initially, start with a small\nteam (2-3 full-time staff) and rely\non volunteers.\nEstablish partnerships with local businesses\nand food banks, and create a logistical plan\nfor food pickup and delivery.\nInitial funding through grants, donations,\nand local sponsorships; outline potential\noperational costs.\nA user-friendly app or platform to\nconnect donors with recipients and track\nfood donations.\nAppeal: Utilizing technology to combat food\nwaste and hunger in a local, sustainable way.\nReducing food waste, addressing food\ninsecurity, and engaging the community in\nvolunteer opportunities.\nMetrics include the amount of food rescued,\nthe number of partnerships formed, and the\ncommunity engagement level.\nPREPARATION FOR\nSPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7744","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":41,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRE restaurants and grocery\nstores. We will partner with local food\nbanks and shelters to deliver the\nfood. We will engage with community\nmembers to assist with pickups and\ndeliveries. We will educate the public\nabout food waste and hunger issues.\n3 We will conduct small-scale trials\nwith a few local businesses and food\nbanks. We will gather feedback from\npartners to refine logistics and improve\nprocesses.\n4 We will measure the amount of food\nrescued. We will measure the number\nof partnerships formed (businesses\nand food banks). We will measure\nthe community engagement levels\n(volunteers and donations). We will\nconduct surveys from recipients to\nmeasure the difference made in","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7750","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":45,"module":"PREPARATION FOR SPEAKING","ex":"5","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Answer the questions to help you develop the style of your pitch. Make notes, but do not write out your answers.","pages":[99],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7ca75a9796c55c0f8fe7695b82f831b54e9961a875f48b3fe08625de65700d8a.png"],"provided":"","items":[{"id":"b7750.i01","label":"1","prompt":"Who is your audience (investors or donors)? What are their goals?","options":[],"type":"qa/open"},{"id":"b7750.i02","label":"2","prompt":"What story could you use to help illustrate the value of your idea?","options":[],"type":"qa/open"},{"id":"b7750.i03","label":"3","prompt":"What imagery could you use for your pitch?","options":[],"type":"qa/open"},{"id":"b7750.i04","label":"4","prompt":"How can you appeal to their emotions?","options":[],"type":"qa/open"},{"id":"b7750.i05","label":"5","prompt":"What could you say as a strong statement of support for your idea and yourself? Why should they invest in or donate to your venture?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7750.i01","label":"1","prompt":"Who is your audience (investors or donors)? What are their goals?","options":[],"type":"qa/open"},{"kind":"item","id":"b7750.i02","label":"2","prompt":"What story could you use to help illustrate the value of your idea?","options":[],"type":"qa/open"},{"kind":"item","id":"b7750.i03","label":"3","prompt":"What imagery could you use for your pitch?","options":[],"type":"qa/open"},{"kind":"item","id":"b7750.i04","label":"4","prompt":"How can you appeal to their emotions?","options":[],"type":"qa/open"},{"kind":"item","id":"b7750.i05","label":"5","prompt":"What could you say as a strong statement of support for your idea and yourself? Why should they invest in or donate to your venture?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Donors and community supporters;\nReduce food waste, combat hunger,\nsupport local initiatives.\n2 Share a real-life case of a family\nreceiving food from a local shelter,\nhighlighting the impact on their lives.\n3 Before-and-after photos of rescued\nfood, graphs showing food waste\nreduction, images of happy families\nreceiving meals.\n4 Emphasize compassion for those in\nneed, urgency of food waste issue,\ncommunity empowerment.\n5 “Together, we can turn excess food\ninto hope and nourishment for\nour neighbors.”\nImpact on community well-being,\npotential for positive change, personal\ncommitment to the cause.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":43,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U04-question:b7753","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"order":46,"module":"SPEAKING TASK","ex":"1","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Review your notes in Critical thinking, Exercise 4 on page 97, and in the Preparation for speaking section. Rewrite your notes so that they are clear and organized, but do not write full sentences.","pages":[100],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6f8f93b0e95465f5257c6d4570d9a16043e8cefedec6b0027ae0262b37f406ff.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U04-question:b7740","kind":"student-work","title":"C  to launch\nan app which would enable users to make\na small donation to a charity of their choice\nwith any transaction made using their\naccount. I was impressed that Khalid had\nalready analyzed the market and presented\ndata suggesting there is considerable\nscope for the app to become a major\nplayer in the digital payments market.\nUNIT 5\nUNLOCK YOUR\nKNOWLEDGE\nPage 103\n1 Personally, I’m not bad at remembering\nfaces, but I sometimes struggle with\nnames, at least until I’ve met someone\ntwo or three times. I’m reasonably\nconfident that I tend to make a positive\nimpression on people when I first meet\nthem, as I’m quite good at making small\ntalk, even with people I don’t know. To\nbe honest, I do struggle to remember\nhow to get to places, and tend to rely on\nGPS, even when I’m driving somewhere\nI’ve been many times before.\n2 I do wish that I was better at\nremembering information, for example\nnews items that I have heard or read,\nbecause I think this would help me with\nmy studies.\n3 I think you have to meet a person\nseveral times and see how they behave\nunder different circumstances in order\nto really get to know what a person is\nlike. Anyone can be friendly at a first\nmeeting, but this tells how they want\nto appear, rather than what they are\ngenuinely like.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]}],"lessonFlow":{"entries":[{"id":"B05-LS-U04-classroom:opening-1-cards","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"module":"Word Cards","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON START"},"pages":[101],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f ,"phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c79afcff18aeea32b0fc8f2a4578bab6cda75a4f525519ab20a41521f1aa8877.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"market","pos":"(n)","definition":"the business or trade in a particular product","example":"The company is entering the market for electric bikes.","wordAudio":"market","cardWord":false},{"term":"entrepreneur","pos":"(n)","definition":"somebody who starts their own business, especially when this involves seeing a new opportunity","example":"The entrepreneur started a business repairing old computers.","wordAudio":"entrepreneur","cardWord":false},{"term":"mentoring","pos":"(n)","definition":"the activity of supporting and advising somebody with less experience to help them develop in their work","example":"The school offers mentoring to new teachers.","wordAudio":"mentoring","cardWord":false},{"term":"tech hub","pos":"(n)","definition":"a centre which supports new technology businesses when they are starting out","example":"Several new software companies have offices at the tech hub.","wordAudio":"tech hub","cardWord":false},{"term":"concentration","pos":"(n)","definition":"a large number or amount of something in the same place","example":"The city centre has a high concentration of museums.","wordAudio":"concentration","cardWord":false},{"term":"disposable income","pos":"(n)","definition":"the money that is left over after you have paid your bills that you can spend as you wish","example":"After paying her bills, she used some of her disposable income to buy a bicycle.","wordAudio":"disposable income","cardWord":false}]]}},{"id":"B05-LS-U04-classroom:video","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38bfdec1b6f8b059620e93030fc83b97c5f8c497a52a3bb109f8a9938863870c.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/05b6368b8a3f6c4d2f181192-L5LS-U04.mp4","captions":[{"start":1.16,"end":4.66,"text":"With a successful gaming app already under his belt,"},{"start":5.04,"end":8.58,"text":"Jasper Onono has joined the growing ranks of East\nAfrica's WizKids,"},{"start":8.92,"end":11.5,"text":"helping to propel the region into the tech spotlight."},{"start":12.36,"end":12.86,"text":"Metatu,"},{"start":13.2,"end":15.02,"text":"a traditional two -player card game,"},{"start":15.34,"end":17.32,"text":"has long been popular here in Uganda."},{"start":17.9,"end":20.34,"text":"But with the rapid growth of the smartphone market,"},{"start":20.88,"end":24.12,"text":"in Kenya alone one in five people access the web\nthrough their phones."},{"start":24.74,"end":28.92,"text":"Entrepreneurs like Jasper are building apps that cater\nto the needs of local markets."},{"start":29.58,"end":33.52,"text":"Metatu is a very popular two -card playing game in\nUganda."},{"start":34.04,"end":37.86,"text":"It's one of the, it's actually the most popular game in\nUganda right now."},{"start":38.3,"end":50.92,"text":"So the idea came up back in campus when we were\nattending a conference and a thought just hit us that\nwhy don't people have this game in their phones?"},{"start":51.06,"end":52.18,"text":"Can we do this game?"},{"start":52.88,"end":61.08,"text":"In 2011, Metatu was a finalist in Google's Android\nDeveloper Challenge for Sub -Saharan Africa, providing\nthem with publicity and mentoring,"},{"start":61.5,"end":65.14,"text":"as well as having their app posted in Google Play Store\nand Google Cloud."},{"start":65.76,"end":68.64,"text":"Now, with more than 60 ,000 downloads,"},{"start":69.03999999999999,"end":72.8,"text":"Metatu's success is the latest sign of the region's\nhigh -tech hopes."},{"start":73.74,"end":83.5,"text":"I like having it on the phone because then I can play\nit anytime and even when I'm alone I don't need to have\nfriends around or a group of people."},{"start":83.68,"end":86.7,"text":"I can just have it on my phone, play it anytime,\nanywhere."},{"start":87.18,"end":88.16,"text":"And it's fun."},{"start":89.34,"end":93.2,"text":"From the laying of fiber optic cables to popular mobile\nmoney systems,"},{"start":93.8,"end":96.68,"text":"East Africa has experienced a dramatic tech hub boom,"},{"start":97.28,"end":102.64,"text":"spurred on by collaborative workspaces such as\nNairobi's iHub and growing international investment."},{"start":103.7,"end":107.25999999999999,"text":"Africa has the highest concentration of young people\nanywhere on the planet,"},{"start":107.8,"end":110.7,"text":"many of whom have at least some disposable income."},{"start":111.18,"end":115.62,"text":"And increasingly, investors are looking to break into\nthese lucrative local markets."},{"start":115.62,"end":132.72,"text":"But if we can have a place whereby somebody can say\nwhen they're listing in the top five apps on their\nphone, we'll have at least one or two Kenyan or African\napps on it, I feel like that will go a long way in\nencouraging other young people to begin to believe that\nthere is more potential than what they see."},{"start":132.84,"end":135.74,"text":"We're not just consumers of content, we're creators of\nit."},{"start":136.46,"end":138.6,"text":"If the future of computing lies in mobile,"},{"start":139.06,"end":142.16,"text":"and the fastest growth in mobile comes from developing\nworld,"},{"start":142.6,"end":146.98,"text":"many are beginning to look to African startups for a\ntaste of things to come."}],"launchInline":true}},{"id":"B05-LS-U04-classroom:resource:b7710","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"pages":[91],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/89e35a4e318510aae236bb9276f69b87499a59c9ad4634eaf07219617e845594.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["concisely (adv) expressing information in a way that is short, without using unnecessary words\ndonor (n) somebody who gives money or goods to a person or organization that needs them\nenterprise (n) a business or organization\noversight (n) responsibility for a job or activity and for ensuring it is being done correctly","overview (n) a short description giving the most important facts about something\nscope (n) the range of a subject covered by a book, programme, discussion, class, etc.\nstatus (n) the official or legal position of a person or organization\nworthy (adj) deserving respect, admiration or support"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-LS-U04-classroom:review-1","book":5,"unit":4,"track":"LS","topic":"BUSINESS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[101],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26e74084b7bdf4a04a87a4c4c3505893d1598d5a5a38232f2512016559aaec90.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-LS-U04-B-001","form":"abandon","page":101}
