ivities in the photos?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The guitar teacher and garage\nmechanics are the most likely to do the\nwork as full-time jobs. The other two are\nlikely to be activities which the people\noccasionally do in order to earn a little\nextra money.\n2 I think it is most likely that all the jobs\nwill still exist, although many people\nmight opt to employ a robot or AI for\njobs such as photography or car repairs,\nrather than employing a human.\n3 The greatest challenge is likely to be\nfinding enough customers, especially\nfor the blogger, the music teacher and\nthe photographer. For the mechanics,\nthe main challenge would be to ensure\nthat costs (rent, bills, etc.) do not\ncompromise the business’s profitability.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":49,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[{"page":126,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6dc02e284f1f0d4dac8c8820b9126d867bcdd63ce0e9f7129f2366702f0307c1.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7872","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Work with a partner. Read the summary and try to predict the words and phrases you will hear. Then watch the video and complete the gaps.","pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f1699ec23885a81c736b4c6b98235a7fcf5938fe732cfa9c4001ecaf52c91bca.png"],"provided":"These days, people are less likely to spend their entire working lives in the same (1)____. Many young people have at least one extra (2)____.\n\nMany existing jobs may become (3) ____. Freelancers often don't have job security, holidays or sick pay, and their earnings can be unpredictable and quite (4) ____. But freelance work offers people variety and the chance to develop more (5) ____.\n\nBeing able to work in different roles will be more important in the future, as (6)____ gets better at doing more and more jobs. Young workers want to pursue different (7)____ and find that working freelance is the way to achieve this.","items":[{"id":"b7872.i01","label":"1","prompt":"These days, people are less likely to spend their entire working lives in the same (1)____.","options":[],"type":"gap/closed"},{"id":"b7872.i02","label":"2","prompt":"Many young people have at least one extra (2)____.","options":[],"type":"gap/closed"},{"id":"b7872.i03","label":"3","prompt":"Many existing jobs may become (3) ____.","options":[],"type":"gap/closed"},{"id":"b7872.i04","label":"4","prompt":"Freelancers often don't have job security, holidays or sick pay, and their earnings can be unpredictable and quite (4) ____.","options":[],"type":"gap/closed"},{"id":"b7872.i05","label":"5","prompt":"But freelance work offers people variety and the chance to develop more (5) ____.","options":[],"type":"gap/closed"},{"id":"b7872.i06","label":"6","prompt":"Being able to work in different roles will be more important in the future, as (6)____ gets better at doing more and more jobs.","options":[],"type":"gap/closed"},{"id":"b7872.i07","label":"7","prompt":"Young workers want to pursue different (7)____ and find that working freelance is the way to achieve this.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"These days, people are less likely to spend their entire working lives in the same (1)____. Many young people have at least one extra (2)____."},{"kind":"text","text":"Many existing jobs may become (3) ____. Freelancers often don't have job security, holidays or sick pay, and their earnings can be unpredictable and quite (4) ____. But freelance work offers people variety and the chance to develop more (5) ____."},{"kind":"text","text":"Being able to work in different roles will be more important in the future, as (6)____ gets better at doing more and more jobs. Young workers want to pursue different (7)____ and find that working freelance is the way to achieve this."}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/80aeb8e9d4d7aead8baa4722-L5LS-U06.mp4","captions":[{"start":0,"end":5.4,"text":"In recent years, the world of employment has been\ntransformed,"},{"start":5.82,"end":7.74,"text":"particularly for younger people."},{"start":8.58,"end":17.14,"text":"Those beginning their careers today are doing so in a\nglobal economy that's arguably more unstable than it\nhas been for decades."},{"start":18.4,"end":25.34,"text":"There has been a shift away from the traditional\nconcept of spending an entire career in one field or\nindustry."},{"start":25.34,"end":27.08,"text":"What is more,"},{"start":27.58,"end":32.12,"text":"improvements in technology have made remote work more\npopular than ever."},{"start":32.64,"end":38.22,"text":"Staff are not always expected to be in the same\nworkplace at the same hours every day."},{"start":38.48,"end":41.06,"text":"And with fewer fixed work arrangements,"},{"start":41.56,"end":43.66,"text":"people spend less time on commuting."},{"start":44.64,"end":45.8,"text":"Within this context,"},{"start":46.24,"end":52.78,"text":"many young workers have concluded that they want and\nneed more than one single full -time job."},{"start":52.78,"end":54.26,"text":"In fact,"},{"start":54.6,"end":57.94,"text":"according to a recent global survey by the Kantar\nGroup,"},{"start":58.66,"end":62.58,"text":"40 % of Generation Z work in two or more roles,"},{"start":63.16,"end":64.78,"text":"their primary occupation,"},{"start":65.56,"end":68.98,"text":"plus at least one additional job that brings in extra\nincome."},{"start":70.34,"end":73.92,"text":"These additional jobs are often known as side hustles."},{"start":75.72,"end":88.58,"text":"It's an approach to work that particularly appeals to\npeople keen to monetize their hobbies and passions,\nsuch as a nurse with a sneaker page on Instagram or an\naccountant who does photography on the side."},{"start":89.48,"end":93.75999999999999,"text":"But this transformation of the workplace is not\nentirely positive."},{"start":94.8,"end":99.88,"text":"Many traditional jobs have become or are at risk of\nbecoming obsolete."},{"start":100.9,"end":101.7,"text":"Additionally,"},{"start":102.25999999999999,"end":111.56,"text":"freelancers often lack job security and benefits like\nholiday or sickness pay, and their income can be\nuncertain and relatively low."},{"start":112.82,"end":113.97999999999999,"text":"Despite these challenges,"},{"start":114.66,"end":123.06,"text":"side hustles help avoid the risks of working in an\nindustry that is in decline or which is being\ntransformed by artificial intelligence,"},{"start":123.66,"end":126.68,"text":"in which job losses are becoming increasingly common."},{"start":127.9,"end":135.26,"text":"The variety offered by freelancing also helps provide\nan escape from the frustration of being tied to one\njob."},{"start":135.26,"end":137.04,"text":"Moreover,"},{"start":137.66,"end":145.34,"text":"flexible work arrangements can provide the freedom for\npeople to diversify their skills and more easily adapt\nto different roles."},{"start":146.34,"end":153.12,"text":"This will become increasingly important as artificial\nintelligence becomes capable of performing more jobs,"},{"start":153.44,"end":154.76,"text":"such as designing,"},{"start":155.46,"end":155.88,"text":"translating,"},{"start":156.8,"end":158.6,"text":"and other intellectual work."},{"start":159.36,"end":161.22,"text":"With all these developments,"},{"start":161.62,"end":165.12,"text":"the traditional employment model seems unlikely to\nreturn."},{"start":166.44,"end":170.68,"text":"Young workers are motivated by the opportunity to\npursue multiple interests,"},{"start":171.42000000000002,"end":174.28,"text":"the possibility of finding a sense of purpose in their\nwork,"},{"start":174.96,"end":178.28,"text":"and by increased access to learning and personal\ndevelopment."},{"start":179.36,"end":186.32,"text":"Huge numbers of them are embracing the evolving world\nof side hustles and establishing freelance work as a\nnew,"},{"start":186.7,"end":187.62,"text":"standard way of working."},{"start":188.78,"end":192.56,"text":"This means that young people are choosing to shape\ntheir own futures,"},{"start":193.4,"end":196.88,"text":"rather than allowing employers to determine their\nopportunities."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 field or industry 2 job 3 obsolete 4 low 5 skills\n6 artificial intelligence 7 interests","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":49,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"co d":137.04,"text":"Moreover,"},{"start":137.66,"end":145.34,"text":"flexible work arrangements can provide the freedom for\npeople to diversify their skills and more easily adapt\nto different roles."},{"start":146.34,"end":153.12,"text":"This will become increasingly important as artificial\nintelligence becomes capable of performing more jobs,"},{"start":153.44,"end":154.76,"text":"such as designing,"},{"start":155.46,"end":155.88,"text":"translating,"},{"start":156.8,"end":158.6,"text":"and other intellectual work."},{"start":159.36,"end":161.22,"text":"With all these developments,"},{"start":161.62,"end":165.12,"text":"the traditional employment model seems unlikely to\nreturn."},{"start":166.44,"end":170.68,"text":"Young workers are motivated by the opportunity to\npursue multiple interests,"},{"start":171.42000000000002,"end":174.28,"text":"the possibility of finding a sense of purpose in their\nwork,"},{"start":174.96,"end":178.28,"text":"and by increased access to learning and personal\ndevelopment."},{"start":179.36,"end":186.32,"text":"Huge numbers of them are embracing the evolving world\nof side hustles and establishing freelance work as a\nnew,"},{"start":186.7,"end":187.62,"text":"standard way of working."},{"start":188.78,"end":192.56,"text":"This means that young people are choosing to shape\ntheir own futures,"},{"start":193.4,"end":196.88,"text":"rather than allowing employers to determine their\nopportunities."}]}],"courseAnswer":{"kind":"model-excerpt","text":"monetize: this word is used to say that\npeople find a way to make money from\ntheir hobbies, such as photography\non the side: this phrase shows that these\nside hustles are in addition to the main job\nobsolete: this word is used to suggest that\nsome jobs will no longer be needed in\nthe future\nfreelancer: this word describes people\nwho charge per job completed, but do not\nusually work for one main employer\ndiversify: this word describes how people\ncan develop a wider range of skills","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":49,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7875","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work in a small group. Discuss what the narrator meant by the following, and the extent to which you agree, giving reasons.","pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f1699ec23885a81c736b4c6b98235a7fcf5938fe732cfa9c4001ecaf52c91bca.png"],"provided":"1 'The variety offered by freelancing also helps provide an escape from the frustration of being tied to one job.'\n2 By having side hustles and working freelance, 'young people are choosing to shape their own futures, rather than allowing employers to determine their opportunities.'","items":[{"id":"b7875.i01","label":"1","prompt":"'The variety offered by freelancing also helps provide an escape from the frustration of being tied to one job.'","options":[],"type":"discuss/open"},{"id":"b7875.i02","label":"2","prompt":"By having side hustles and working freelance, 'young people are choosing to shape their own futures, rather than allowing employers to determine their opportunities.'","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 'The variety offered by freelancing also helps provide an escape from the frustration of being tied to one job.'"},{"kind":"text","text":"2 By having side hustles and working freelance, 'young people are choosing to shape their own futures, rather than allowing employers to determine their opportunities.'"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think this refers to the fact that many\nfull-time jobs involve dull repetitive\ntasks, such as completing spreadsheets.\nWorking freelance allows people to do\ndifferent jobs that are more varied, and\nso more interesting.\n2 This suggests that people with side\nhustles or freelance work are less\nlikely to be stuck in a job they don’t\nwant to do. I am not convinced by this\nstatement, as I think it would be equally\ntrue for employees.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":49,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7878","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"ord n.com, and others.\nFreelancers who consider themselves entrepreneurs\n[IMAGE_5]","items":[{"id":"b7902.i01","label":"1","prompt":"Read the information in Failure rates of start-ups. Why do you think so many of these businesses fail? Explain each of the four business situations using the example of a new restaurant.","options":[],"type":"discuss/open"},{"id":"b7902.i02","label":"2","prompt":"Why do you think that entrepreneurs continue to open new businesses when the chance of failure is so high?","options":[],"type":"discuss/open"},{"id":"b7902.i03","label":"3","prompt":"Look at the bar graph. What does it show? What is the relationship between the two sets of data?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"FAILURE RATES OF START-UPS"},{"kind":"text","text":"[IMAGE_1] of start-ups don't meet their projections."},{"kind":"text","text":"[IMAGE_2] of start-ups fail to see projected return on investment."},{"kind":"text","text":"[IMAGE_3] of start-ups liquidate and lose most or all investment."},{"kind":"text","text":"[IMAGE_4] of failures result from lack of planning & experience."},{"kind":"text","text":"Data from various sources including Harvard Business School, University of Tennessee Research, StatisticBrain.com, and others."}],[{"kind":"text","text":"Freelancers who consider themselves entrepreneurs"},{"kind":"text","text":"[IMAGE_5]"},{"kind":"item","id":"b7902.i01","label":"1","prompt":"Read the information in Failure rates of start-ups. Why do you think so many of these businesses fail? Explain each of the four business situations using the example of a new restaurant.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7902.i02","label":"2","prompt":"Why do you think that entrepreneurs continue to open new businesses when the chance of failure is so high?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7902.i03","label":"3","prompt":"Look at the bar graph. What does it show? What is the relationship between the two sets of data?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 With regards to not meeting their\nprojections: A restaurant may project\nhigh sales but misjudge operational\ncosts or customer demand, resulting in\nlower revenue.\nFor return on investment: If a restaurant\ninvests heavily in renovations and\nmarketing but fails to attract enough\ncustomers, it won’t achieve the\nexpected returns.\nOn liquidation and loss of investment:\nPoor sales may force a restaurant to\nclose, causing the owner to lose\ntheir investment in equipment and\nstart-up costs.\nFor planning and experience: A\nfirst-time owner might neglect crucial\nplanning and market research, leading\nto operational challenges and poor\ncustomer service, ultimately resulting\nin failure.\n2 Many people have dreams of running\ntheir own business but they perhaps\ndon’t realise what the challenges and\ntheir own limitations are.\n3 It shows freelancers from a range of\ndifferent fields and industries and what\npercentage of them consider themselves\nto be entrepreneurs. Industries\nlike business consulting, software\ndevelopment, marketing, and virtual\nassistance show a high percentage of\nfreelancers who consider themselves\nentrepreneurs. This may suggest that\nindividuals in these fields are more\nwilling to take risks and embrace the\nentrepreneurial mindset, despite the\nhigh failure rates of start-ups.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":50,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7903","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"order":17,"module":"LISTENING 1","ex":"11","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Discuss the questions. Explain your answers.","pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6e1bcc5b0f3321ee86b2aff018f98abaf7203592f00f14c5ed364e1ec7c48479.png"],"provided":"","items":[{"id":"b7903.i01","label":"1","prompt":"What career advice would you give an undergraduate in computer science who is about to finish their degree?","options":[],"type":"discuss/open"},{"id":"b7903.i02","label":"2","prompt":"What career advice would you give somebody graduating with an advanced degree in computer science?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7903.i01","label":"1","prompt":"What career advice would you give an undergraduate in computer science who is about to finish their degree?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7903.i02","label":"2","prompt":"What career advice would you give somebody graduating with an advanced degree in computer science?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I would advise them to consider a\npostgraduate degree, to make them\nstand out from other graduates in the\njob market. / I would tell them to start\napplying for jobs immediately and to\ntry and get some work experience with\na company that they are interested in\nworking for.\n2 I think they should apply for positions\nat various organizations which interest\nthem and compare the offers they\nreceive. They should consider the salary,\nother benefits, opportunities for career\nprogression, the vision of the company\nand work-life balance. Once they have\nmade lots of contacts in the industry,\nthey can think about working as a self-\nemployed consultant.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":50,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7904","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"order":18,"module":"LISTENING 1","ex":"12","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Write a 250-word personal statement about your chosen career. Include real examples which demonstrate your skills.","pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6e1bcc5b0f3321ee86b2aff018f98abaf7203592f00f14c5ed364e1ec7c48479.png"],"provided":"Introduction: explain why you chose this field.\nMain paragraph(s): explain how your studies have prepared you for this career and give details of other relevant training or experience.\nConclusion: explain how you plan to progress in your career.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Introduction: explain why you chose this field."},{"kind":"text","text":"Main paragraph(s): explain how your studies have prepared you for this career and give details of other relevant training or experience."},{"kind":"text","text":"Conclusion: explain how you plan to progress in your career."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I have been fascinated by computers since\nchildhood, and have always wanted to\nlearn more about them. For this reason,\nchoosing a degree in Computer Science\nwas an obvious choice and will, I hope,\nenable me to turn my passion into my\ncareer. I am driven by a passion to innovate\nand contribute to the technological\ndevelopments of the future.\nDuring my degree, I have studied, in depth,\na range of areas including cybersecurity,\nnetwork administration and software\ndevelopment. I received a distinction\nfor my project in which I designed a\ncomprehensive inventory management\nsystem. This demonstrated my skills in\nprogramming languages such as Java\nand Python.\nI am committed to keeping up to date\nwith developments in the industry, and\nhave attained additional certifications in\ncloud computing and cybersecurity. This\ndemonstrates my motivation and ability to\nwork independently, as I completed this\nextra training voluntarily and in addition to\nmy university degree work. I was the only\nstudent in my year to do this.\nLooking ahead to my career, I am excited\nabout the prospect of contributing my skills\nto drive technological advancements. The\nIT field, with its constant challenges and\nopportunities, is not just a career choice\nfor me; it is a calling that suits my natural\ncuriosity and desire to make a meaningful\nimpact in the world of IT. I am highly\nmotivated, hard-working and committed\nto undertaking further professional\ndevelopment training throughout\nmy career.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":50,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7908","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite the two sentences in each item to create a single sentence using a degree expression, so ... that or such / such a ... that.","pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/522012d464cd45f498235d8de9e76f2b80e4178fedebac4cffcfa05453857012.png"],"provided":"","items":[{"id":"b7908.i01","label":"1","prompt":"Most businesses can make a profit. The current market is very strong.","options":[],"type":"gap/open"},{"id":"b7908.i02","label":"2","prompt":"She cannot get to work most days. She has very little energy.","options":[],"type":"gap/open"},{"id":"b7908.i03","label":"3","prompt":"Everyone asks her for business advice. Her company has been a huge success.","options":[],"type":"gap/open"},{"id":"b7908.i04","label":"4","prompt":"We can't find anywhere to put it. We bought a lot of equipment.","options":[],"type":"gap/open"},{"id":"b7908.i05","label":"5","prompt":"Nobody can hear the sound. The volume is very low.","options":[],"type":"gap/open"},{"id":"b7908.i06","label":"6","prompt":"I made a quick decision. I was in a real hurry.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7908.i01","label":"1","prompt":"Most businesses can make a profit. The current market is very strong.","options":[],"type":"gap/open"},{"kind":"item","id":"b7908.i02","label":"2","prompt":"She cannot get to work most days. She has very little energy.","options":[],"type":"gap/open"},{"kind":"item","id":"b7908.i03","label":"3","prompt":"Everyone asks her for business advice. Her company has been a huge success.","options":[],"type":"gap/open"},{"kind":"item","id":"b7908.i04","label":"4","prompt":"We can't find anywhere to put it. We bought a lot of equipment.","options":[],"type":"gap/open"},{"kind":"item","id":"b7908.i05","label":"5","prompt":"Nobody can hear the sound. The volume is very low.","options":[],"type":"gap/open"},{"kind":"item","id":"b7908.i06","label":"6","prompt":"I made a quick decision. I was in a real hurry.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  The current market is so strong that most businesses\ncan make a profit.\n2  She has so little energy that she cannot get to work\nmost days.\n3  Her company has been such a (huge) success that\neveryone asks her for business advice.\n4  We bought so much / such a lot of equipment that we\ncan’t find anywhere to put it.\n5 The volume is so low that nobody can hear the sound.\n6  I was in such a hurry that I had to make / made a very\nquick decision.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7909","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Imagine that you have launched a highly successful start-up company together and are giving a presentation about it. Write three sentences about your start-up company, using so ... that and such (a) ... that.","pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/522012d464cd45f498235d8de9e76f2b80e4178fedebac4cffcfa05453857012.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Our business took off so quickly that there\nwere times when we hardly even had time\nto eat or sleep.\nAfter our first year, we had made so much\nprofit that we actually considered selling\nthe company and retiring.\nWe learned such an enormous amount\nin those first few months that we could\nprobably write a book about it.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalman to do next week.","Kerolin: Yes, of course. Our dreaded assessed presentation to the whole group — I have to admit it's a slightly daunting prospect.","Yaya: I know what you mean, but don't worry, it won't just be you. It's very much a collaboration between the two of us.","Kerolin: Yeah, luckily! So we've got to give a profile of SoftTech Corporation's financial performance over the past year ... Do we actually need to present first? Or could we just get them to ask us questions?","Yaya: No, the format is fixed. They'll be expecting a traditional presentation with slides.","Kerolin: So we need to explain their main accomplishments over the last year."],"sources":[{"page":134,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8ac22cfee2bbeb065c0ca370f012ab7b3cc64cdbf4f7d597f4ff3532c09e873.png"}],"kind":"task_sheet","sourceBlockIds":["b7914"]},{"id":"B05-LS-U06-publisher-sheet:b7915","title":"LISTENING 2 Ex 2 原题面","pages":[135],"text":"","screens":[],"sources":[{"page":135,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/18b26c947627df0fb3093c05bf6917e16791a3672ed9086d9a6ab6b81b49633e.png"}],"kind":"task_sheet","sourceBlockIds":["b7915"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 format; give a presentation / complete a\ntask / do a test\n2 accomplishments from your work\nor studies\n3 ramble for too long\n4 rehearsed\n•  Learn about the company’s mission,\nproducts, recent news, and culture.\nKnowing the company well helps you\nalign your answers with its values.\n•  Prepare a few questions for the\ninterviewer. Ask about the team, the\nwork culture, or any recent projects. It\nshows your interest and engagement.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a136 "gap/open"},{"kind":"item","id":"b7917.i03","label":"3","prompt":"TEAMWORK: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7917.i04","label":"4","prompt":"AMBITIONS: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":51,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":19,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7918","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":26,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a new partner. Think of a job you would like to do, but do not tell your partner. Interview each other using your questions in Exercise 4. Guess what job your partner would like to do.","pages":[136],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c7f1f280005355f114e9b4424219f2d1d10396381b649a4295508780ad80643c.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U06-question:b7917","kind":"student-work","title":"LISTENING 2 Ex 4","pages":[136]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947ef ourseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7922","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":29,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"6.4 Read questions 1–6. Then listen again and add to your notes.","pages":[136],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c7f1f280005355f114e9b4424219f2d1d10396381b649a4295508780ad80643c.png"],"provided":"","items":[{"id":"b7922.i01","label":"1","prompt":"What things did the speaker say you should do to prepare before an interview?","options":[],"type":"qa/open"},{"id":"b7922.i02","label":"2","prompt":"What did the speaker advise the students not to do while preparing for an interview?","options":[],"type":"qa/open"},{"id":"b7922.i03","label":"3","prompt":"What do you think the speaker means by the phrase 'talking points'?","options":[],"type":"qa/open"},{"id":"b7922.i04","label":"4","prompt":"Can you remember three of the general questions the speaker said are often asked at interviews?","options":[],"type":"qa/open"},{"id":"b7922.i05","label":"5","prompt":"Why does the speaker say that listening is one of the most important things to do?","options":[],"type":"qa/open"},{"id":"b7922.i06","label":"6","prompt":"Should you write to the interviewer after the interview? If 'yes', what should you write?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-LS-U06-question:b7920","kind":"student-work","title":"LISTENING 2 Ex 6","pages":[136]}],"materials":[],"coursePages":[[{"kind":"item","id":"b7922.i01","label":"1","prompt":"What things did the speaker say you should do to prepare before an interview?","options":[],"type":"qa/open"},{"kind":"item","id":"b7922.i02","label":"2","prompt":"What did the speaker advise the students not to do while preparing for an interview?","options":[],"type":"qa/open"},{"kind":"item","id":"b7922.i03","label":"3","prompt":"What do you think the speaker means by the phrase 'talking points'?","options":[],"type":"qa/open"},{"kind":"item","id":"b7922.i04","label":"4","prompt":"Can you remember three of the general questions the speaker said are often asked at interviews?","options":[],"type":"qa/open"},{"kind":"item","id":"b7922.i05","label":"5","prompt":"Why does the speaker say that listening is one of the most important things to do?","options":[],"type":"qa/open"},{"kind":"item","id":"b7922.i06","label":"6","prompt":"Should you write to the interviewer after the interview? If 'yes', what should you write?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3bb203883ddbba0dc2859de7db6c8f4303f5c603ebce31fc8c65ee68aae6241b.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 The speaker said you should prepare by finding out\nabout the company and what it does, and about\nthe person you may be working with. It’s also worth\nanticipating questions.\n2 The speaker advised against memorizing a whole\nspeech, as a highly prepared answer may sound\nrehearsed and unconvincing.\n3 Talking points are topics that you want to bring up in\nan interview.\n4 Common questions include: What are your most\nimportant accomplishments? Where do you see\nyourself in five or ten years? How well do you adapt\nto change?\n5 Interviewers want to know about a person’s\ncommunication skills, of which listening skills are an\nimportant component. Interviewees should answer the\nquestion which is being asked, not the question they\nthink or hope is being asked.\n6 The speaker says you should send a brief, informal email\nto the interviewer thanking them for the interview, as\nwell as reiterating your interest in the position and\nyour suitability.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7925","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":30,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"6.5 Listen to the extracts from the workshop. Decide if the statements (1–5) can be inferred from what the speaker says in each extract. Write 'yes' or 'no'. If 'yes', write the words which helped you decide.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5b84407b461d6ec91919827fcb5219ca9df176f00216dd7066cb69a793d07e10.png"],"provided":"","items":[{"id":"b7925.i01","label":"1","prompt":"The speaker wants the students to ask questions.","options":["yes","no"],"type":"choice/closed"},{"id":"b7925.i02","label":"2","prompt":"It is particularly important to find out about your interviewer before the interview if they work in HR.","options":["yes","no"],"type":"choice/closed"},{"id":"b7925.i03","label":"3","prompt":"Job selection processes tend to follow the same format.","options":["yes","no"],"type":"choice/closed"},{"id":"b7925.i04","label":"4","prompt":"It is possible that a candidate's answers may make them appear arrogant.","options":["yes","no"],"type":"choice/closed"},{"id":"b7925.i05","label":"5","prompt":"People can feel nervous about an upcoming job interview.","options":["yes","no"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7925.i01","label":"1","prompt":"The speaker wants the students to ask questions.","options":["yes","no"],"type":"choice/closed"},{"kind":"item","id":"b7925.i02","label":"2","prompt":"It is particularly important to find out about your interviewer before the interview if they work in HR.","options":["yes","no"],"type":"choice/closed"},{"kind":"item","id":"b7925.i03","label":"3","prompt":"Job selection processes tend to follow the same format.","options":["yes","no"],"type":"choice/closed"}],[{"kind":"item","id":"b7925.i04","label":"4","prompt":"It is possible that a candidate's answers may make them appear arrogant.","options":["yes","no"],"type":"choice/closed"},{"kind":"item","id":"b7925.i05","label":"5","prompt":"People can feel nervous about an upcoming job interview.","options":["yes","no"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0af4cf65264b23b363981423b5f550e73f0088e92fe90c9abd5c5fb1180830e.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"2 No – If your interview is with somebody you might\nbe working with, by all means; you should find out\nwhat you can about that person. But often you’ll be\ninterviewed by people in Human Resources who are\njust in charge of the hiring process.\nThe speaker suggests that you should find out about\nyour interviewer if you will be working for them.\nBut they do not make the same suggestion if the\ninterviewer is an HR employee.\n3 No – You should find out the format for the interview.\nWill there just be general questions like the one you\nmentioned, or will there be a written part, or even a\ntest of your knowledge or analytical skills?\nThis strongly suggests that the format varies.\n4 Yes – You also shouldn’t say something smug like ‘My\nstandards are too high’.\n5 Yes – One thing you can do to help you feel less\nnervous is a practice interview with one of the advisors\nin this office.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":52,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7927","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":31,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to answer the following questions.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5b84407b461d6ec91919827fcb5219ca9df176f00216dd7066cb69a793d07e10.png"],"provided":"","items":[{"id":"b7927.i01","label":"1","prompt":"How important is it for universities to give careers advice as well as providing academic teaching?","options":[],"type":"discuss/open"},{"id":"b7927.i02","label":"2","prompt":"Would you prefer to receive advice from a professional careers advisor, or from a professional in your chosen field? Why, and what would be the advantages of each?","options":[],"type":"discuss/open"},{"id":"b7927.i03","label":"3","prompt":"If you were about to have an interview for a job, what would your talking points be?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7927.i01","label":"1","prompt":"How important is it for universities to give careers advice as well as providing academic teaching?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7927.i02","label":"2","prompt":"Would you prefer to receive advice from a professional careers advisor, or from a professional in your chosen field? Why, and what would be the advantages of each?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7927.i03","label":"3","prompt":"If you were about to have an interview for a job, what would your talking points be?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think careers advice is just as important\nas academic training; after all when\nyou’re at university, the main thing\nyou’re doing is preparing yourself for\nyour working life. / I think the main focus\nat university should be on achieving\nas much as you can academically. But I\nthink some career advice is necessary in\nthe last one or two years of a degree.\n2 Personally, as a trainee architect, I’d\nrather hear from a practising architect,\nwho has first-hand experience of the\nfield I’m going to work in myself. A\nprofessional careers advisor wouldn’t\nhave that experience themselves. / If\nyou are not sure what career you want\nto pursue yet, it might be useful to go to\na careers advisor because they can give\nyou advice about more than one type\nof career. I asked a careers advisor for\nadvice about journalism, teaching and\nmarketing. She explained to me about\nthe different types of courses I could do\nto work in those fields.\n3 My talking points would be the\ndissertation that I am currently working\non, as it is directly related to the job I am\napplying for. / I would talk about what I\nhave found out about the company, as\nthis would demonstrate that I am\nhighly motivated.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7932","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups on the first step toward a job interview – the evaluation of job descriptions. What kinds of information would you expect the different sections of a job description to include? Brainstorm ideas.","pages":[138],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/733326863ea76bfe8f00bc8ce96520edfb1991ce2fa77334ccb0096644c7764e.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"an introduction that gives information about the company"},{"kind":"text","text":"Duties/Responsibilities: information about the available position"},{"kind":"text","text":"Skills required: information about the skills, experience and traits that a successful candidate would need"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Job Title: exact role name (e.g., “Marketing\nCoordinator,” “Software Engineer”).\nJob Summary: brief overview of the role’s\nmain purpose and key responsibilities.\nResponsibilities and Duties: detailed\ntasks, day-to-day activities, and main\njob functions.\nQualifications: required education,\ncertifications, and work experience.\nSkills: specific skills needed (e.g.,\ncommunication, problem-solving,\ntechnical skills).\nWork Environment: location, remote/hybrid\noptions, and any physical requirements.\nSalary and Benefits: salary range,\nhealthcare, retirement plans, and\nother perks.\nCompany Overview: information about the\ncompany’s mission, values, and culture.\nApplication Process: instructions on how to\napply, deadlines, and contact information.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7933","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read the job advertisements and answer the questions. Compare your answers with your group.","pages":[138],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/733326863ea76bfe8f00bc8ce96520edfb1991ce2fa77334ccb0096644c7764e.png"],"provided":"","items":[{"id":"b7933.i01","label":"1","prompt":"What elements are common to both job advertisements?","options":[],"type":"qa/open"},{"id":"b7933.i02","label":"2","prompt":"What kind of language is used to describe duties and responsibilities (e.g. verbs, nouns)? What language is used to describe the skills required?","options":[],"type":"qa/open"},{"id":"b7933.i03","label": baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7953","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"6","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"EDUCATION AND EXPERIENCE:"},"instruction":"Which attributes/experiences listed in the job description does your partner not have? Do they have experiences from another area of life they could make relevant? Brainstorm ideas with your partner and add them to the table.","pages":[140],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3275d71bbb30adcfba1bbbb1651cf0d73658418e15fc834d06c067ada16b8077.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"There are two areas where my partner does\nnot have the right level of experience:\nAssisting with preparation of manuscripts,\npresentations, grants, and reports and\nCoordinating research team meetings\nThey could use the following ideas\nas evidence:\nAcademic Coursework Projects:\ncompleting class assignments or group\nprojects that involved research,\norganizing information, writing reports,\nor creating presentations.\nStudent Club or Organization Involvement:\nleading or organizing club meetings,\npreparing agendas, and managing project\ntimelines, which shows coordination and\nplanning skills.\nVolunteer Work: assisting in nonprofit\nevents or initiatives where the they created\nmaterials like presentations, reports, or\nnewsletters to support the team’s goals.\nPart-Time Work: any job where they\nmanaged documentation, created reports,\nor prepared materials (e.g., assisting in\noffice work, creating slides for a meeting).\nPersonal Projects: developing a personal\nblog, website, or social media content that\ninvolves research, summarizing information,\nand presenting it clearly to an audience.\nPREPARATION\nFOR SPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U06-question:b7955","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":2,"order":38,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Read the Skills box. Then complete the advice using the phrases a-f.","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/223e5653feb89ddb0e703186847c3cac769efc8b9b4f4ee8a48df629c6f3767b.png"],"provided":"a feel at ease\nb cross your arms\nc lean forward slightly\nd indicate that you are engaged\ne show confidence and maturity\nf convey nervousness and anxiety\n\nBody language is an important aspect of communication. It refers to how we position and move our bodies, as well as facial expressions and how and where our eyes focus. Having positive body language is important in a job interview.\n\no ...\n✓ sit or ccomplish professionally in the next couple of years?\n\nInterviewee: Yes. One of my main interests ____ in researching consumer behaviour. It's what I'm writing my dissertation on, and I hope to be able to put what I have learned into practice when working at this company.","items":[{"id":"b7959.i01","label":"1","prompt":"Of course. (1) ____ in international marketing, and am very close to completing it.","options":[],"type":"gap/open"},{"id":"b7959.i02","label":"2","prompt":"Yes. (2) ____ is that I meet all of the requirements included in the job description.","options":[],"type":"gap/open"},{"id":"b7959.i03","label":"3","prompt":"Well, my (3) ____ people person.","options":[],"type":"gap/open"},{"id":"b7959.i04","label":"4","prompt":"One (4) ____ is collaboration, whether it's with teammates on the football field or with classmates in the classroom.","options":[],"type":"gap/open"},{"id":"b7960.i01","label":"5","prompt":"Playing a lot of sport has meant that (5)____ at making decisions quickly.","options":[],"type":"gap/open"},{"id":"b7960.i02","label":"6","prompt":"And as captain of the university team, (6)____ how to motivate people effectively.","options":[],"type":"gap/open"},{"id":"b7960.i03","label":"7","prompt":"One of my main interests (7)____ in researching consumer behaviour.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Interviewer: First of all, could you tell me about your background?"},{"kind":"text","text":"Interviewee: Of course. (1) ____ in international marketing, and am very close to completing it."},{"kind":"text","text":"Interviewer: So, can you tell me why you feel you are the right candidate for this position?"},{"kind":"text","text":"Interviewee: Yes. (2) ____ is that I meet all of the requirements included in the job description."},{"kind":"text","text":"Interviewer: In what way?"}],[{"kind":"text","text":"Interviewee: Well, my (3) ____ people person. I know that yo . For example, you could ask about perks of the job, any particular attributes the jobholder needs, or practicalities such as parking.","pages":[143,144],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f837b1589dccda6ea17b6a0cccc941cd5aa5ee6454988b9fafae2a47164c463a.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4c0d6326bc9e182265ee36ad3f2ef886539ee93f1c006681b984b14776908c1e.png"],"provided":"- How would you answer the accomplishments question mentioned in Listening 2? (What are your most important accomplishments?)\n- How would you answer the weakness question mentioned in Listening 2? (What is your greatest weakness?)","items":[{"id":"b7966.i01","label":"1","prompt":"Write the interview questions you would definitely ask, using notes from Critical thinking on pages 138–140 and common interview questions from Listening 2 (about accomplishments, career goals and weaknesses).","options":[],"type":"qa/open"},{"id":"b7967.i01","label":"2","prompt":"Plan how you will begin the interview: how will you introduce yourself, and what will you say about the format of the interview?","options":[],"type":"qa/open"},{"id":"b7968.i01","label":"3","prompt":"Plan what you will say so that the interviewee knows it is the end of the interview.","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-LS-U06-question:b7963","kind":"student-work","title":"SPEAKING TASK Ex 1","pages":[143]},{"id":"B05-LS-U06-question:b7953","kind":"student-work","title":"CRITICAL THINKING Ex 6","pages":[140]}],"materials":[],"coursePages":[[{"kind":"text","text":"- How would you answer the accomplishments question mentioned in Listening 2? (What are your most important accomplishments?)"},{"kind":"text","text":"- How would you answer the weakness question mentioned in Listening 2? (What is your greatest weakne G"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f1699ec23885a81c736b4c6b98235a7fcf5938fe732cfa9c4001ecaf52c91bca.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/80aeb8e9d4d7aead8baa4722-L5LS-U06.mp4","captions":[{"start":0,"end":5.4,"text":"In recent years, the world of employment has been\ntransformed,"},{"start":5.82,"end":7.74,"text":"particularly for younger people."},{"start":8.58,"end":17.14,"text":"Those beginning their careers today are doing so in a\nglobal economy that's arguably more unstable than it\nhas been for decades."},{"start":18.4,"end":25.34,"text":"There has been a shift away from the traditional\nconcept of spending an entire career in one field or\nindustry."},{"start":25.34,"end":27.08,"text":"What is more,"},{"start":27.58,"end":32.12,"text":"improvements in technology have made remote work more\npopular than ever."},{"start":32.64,"end":38.22,"text":"Staff are not always expected to be in the same\nworkplace at the same hours every day."},{"start":38.48,"end":41.06,"text":"And with fewer fixed work arrangements,"},{"start":41.56,"end":43.66,"text":"people spend less time on commuting."},{"start":44.64,"end":45.8,"text":"Within this context,"},{"start":46.24,"end":52.78,"text":"many young workers have concluded that they want and\nneed more than one single full -time job."},{"start":52.78,"end":54.26,"text":"In fact,"},{"start":54.6,"end":57.94,"text":"according to a recent global survey by the Kantar\nGroup,"},{"start":58.66,"end":62.58,"text":"40 % of Generation Z work in two or more roles,"},{"start":63.16,"end":64.78,"text":"their primary occupation,"},{"start":65.56,"end":68.98,"text":"plus at least one additional job that brings in extra\nincome."},{"start":70.34,"end":73.92,"text":"These additional jobs are often known as side hustles."},{"start":75.72,"end":88.58,"text":"It's an approach to work that particularly appeals to\npeople keen to monetize their hobbies and passions,\nsuch as a nurse with a sneaker page on Instagram or an\naccountant who does photography on the side."},{"start":89.48,"end":93.75999999999999,"text":"But this transformation of the workplace is not\nentirely positive."},{"start":94.8,"end":99.88,"text":"Many traditional jobs have become or are at risk of\nbecoming obsolete."},{"start":100.9,"end":101.7,"text":"Additionally,"},{"start":102.25999999999999,"end":111.56,"text":"freelancers often lack job security and benefits like\nholiday or sickness pay, and their income can be\nuncertain and relatively low."},{"start":112.82,"end":113.97999999999999,"text":"Despite these challenges,"},{"start":114.66,"end":123.06,"text":"side hustles help avoid the risks of working in an\nindustry that is in decline or which is being\ntransformed by artificial intelligence,"},{"start":123.66,"end":126.68,"text":"in which job losses are becoming increasingly common."},{"start":127.9,"end":135.26,"text":"The variety offered by freelancing also helps provide\nan escape from the frustration of being tied to one\njob."},{"start":135.26,"end":137.04,"text":"Moreover,"},{"start":137.66,"end":145.34,"text":"flexible work arrangements can provide the freedom for\npeople to diversify their skills and more easily adapt\nto different roles."},{"start":146.34,"end":153.12,"text":"This will become increasingly important as artificial\nintelligence becomes capable of performing more jobs,"},{"start":153.44,"end":154.76,"text":"such as designing,"},{"start":155.46,"end":155.88,"text":"translating,"},{"start":156.8,"end":158.6,"text":"and other intellectual work."},{"start":159.36,"end":161.22,"text":"With all these developments,"},{"start":161.62,"end":165.12,"text":"the traditional employment model seems unlikely to\nreturn."},{"start":166.44,"end":170.68,"text":"Young workers are motivated by the opportunity to\npursue multiple interests,"},{"start":171.42000000000002,"end":174.28,"text":"the possibility of finding a sense of purpose in their\nwork,"},{"start":174.96,"end":178.28,"text":"and by increased access to learning and personal\ndevelopment."},{"start":179.36,"end":186.32,"text":"Huge numbers of them are embracing the evolving world\nof side hustles and establishing freelance work as a\nnew,"},{"start":186.7,"end":187.62,"text":"standard way of working."},{"start":188.78,"end":192.56,"text":"This means that young people are choosing to shape\ntheir own futures,"},{"start":193.4,"end":196.88,"text":"rather than allowing employers to determine their\nopportunities."}],"launchInline":true}},{"id":"B05-LS-U06-classroom:review-1","book":5,"unit":6,"track":"LS","topic":"CAREERS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e89651124306669516d52975014ff29a248da7a8ed3f7cd6ee38c9c83aa146b0.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-LS-U06-B-003","form":"be landed with","page":145},{"id":"B05-LS-U06-B-004","form":"cap","page":145},{"id":"B05-LS-U06-B-006","form":"daunting","page":145},{"id":"B05-LS-U06-B-007","form":"discrimination","page":145},{"id":"B05-LS-U06-B-008","form":"distinct","page":145},{"id":"B05-LS-U06-B-011","form":"probationary period","page":145},{"id":"B05-LS-U06-B-013","form":"rehearsed","page":145},{"id":"B05-LS-U06-B-015","form":"start out","page":145},{"id":"B05-LS-U06-B-016","form":"vision","page":145}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]} swer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evidence: nurse in a big hospital","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","he
