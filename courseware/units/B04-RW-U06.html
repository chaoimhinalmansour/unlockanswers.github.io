43.68,"end":45.78,"text":"once Britain's primary source of energy,"},{"start":46.18,"end":48.46,"text":"for the first time in 2016."},{"start":49.4,"end":54.54,"text":"The result was the lowest carbon emission rate since\nthe 1920s."},{"start":54.78,"end":59.94,"text":"The blades of the wind turbine turn a shaft, which\npasses the energy to a generator,"},{"start":60.52,"end":64.22,"text":"which in turn transforms this energy into electricity."},{"start":65.68,"end":66.78,"text":"The wind is free,"},{"start":67.2,"end":77.52,"text":"but the cost of power generation and storage actually\nmakes wind power more expensive than traditional fossil\nfuel sources like coal, oil and gas."},{"start":78.56,"end":81.66,"text":"Smart technology is steadily bringing these costs down,"},{"start":82.02,"end":85.14,"text":"however, and this trend is expected to continue."},{"start":88.2,"end":91.16,"text":"There are two different types of wind power,"},{"start":91.7,"end":93.5,"text":"onshore and offshore."},{"start":94.5,"end":98.12,"text":"Onshore wind farms are cheaper to build and maintain,"},{"start":98.72,"end":101.75999999999999,"text":"but many people don't want wind farms in their areas."},{"start":102.5,"end":104.06,"text":"The turbines are quite noisy,"},{"start":104.6,"end":107.12,"text":"and many people say they spoil the landscape."},{"start":108.14,"end":110.03999999999999,"text":"Offshore wind farms, in contrast,"},{"start":110.38,"end":111.68,"text":"are located in the sea,"},{"start":112,"end":115.24000000000001,"text":"where few people care about their noise or appearance."},{"start":115.96000000000001,"end":119.46000000000001,"text":"The UK is a leader in offshore wind power."},{"start":120.2,"end":123.76,"text":"The London Array, off the east coast of England in the\nNorth Sea,"},{"start":124.18,"end":126.84,"text":"is the largest offshore wind farm in the world."},{"start":127.72,"end":131.54,"text":"The UK is also home to the world's first floating wind\nfarm,"},{"start":132.14,"end":134.12,"text":"off the north -east coast of Scotland."},{"start":134.64,"end":137.72,"text":"Although there is considerable public support for wind\npower,"},{"start":138.18,"end":140.3,"text":"there is also opposition to these large,"},{"start":140.66,"end":141.44,"text":"noisy devices."},{"start":142.32,"end":147.4,"text":"It's also important to remember that all of them are\nsubject to changes in weather patterns."},{"start":148.3,"end":151.36,"text":"There are windy days and not -so -windy days."},{"start":151.84,"end":154.22,"text":"There are also not -so -windy years."},{"start":154.9,"end":157,"text":"Denmark, a leader in wind power,"},{"start":157.46,"end":162.16,"text":"saw its wind power level drop in 2016 because of a lack\nof wind."},{"start":163.2,"end":163.84,"text":"Nevertheless,"},{"start":164.4,"end":170.14,"text":"the shift to renewable energy sources like wind is\nlikely to continue unabated."},{"start":170.14,"end":182.34,"text":"If you look at a more flexible, more dynamic energy\nsystem with, say, more electric vehicles on going out\ninto the 2030s, then the backbone of that energy system\nshould be cheap renewables."},{"start":182.44,"end":189.36,"text":"That is going to be the way to keep bills low, and you\nwon't find an energy analyst out there that disagrees\nwith that vision of the future."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F; It provides 5%. 2 T 3 T 4 F; It is more expensive.\n5 DNS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":49,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7072","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"W ese large,"},{"start":140.66,"end":141.44,"text":"noisy devices."},{"start":142.32,"end":147.4,"text":"It's also important to remember that all of them are\nsubject to changes in weather patterns."},{"start":148.3,"end":151.36,"text":"There are windy days and not -so -windy days."},{"start":151.84,"end":154.22,"text":"There are also not -so -windy years."},{"start":154.9,"end":157,"text":"Denmark, a leader in wind power,"},{"start":157.46,"end":162.16,"text":"saw its wind power level drop in 2016 because of a lack\nof wind."},{"start":163.2,"end":163.84,"text":"Nevertheless,"},{"start":164.4,"end":170.14,"text":"the shift to renewable energy sources like wind is\nlikely to continue unabated."},{"start":170.14,"end":182.34,"text":"If you look at a more flexible, more dynamic energy\nsystem with, say, more electric vehicles on going out\ninto the 2030s, then the backbone of that energy system\nshould be cheap renewables."},{"start":182.44,"end":189.36,"text":"That is going to be the way to keep bills low, and you\nwon't find an energy analyst out there that disagrees\nwith that vision of the future."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 There is widespread support because:\nthe UK is windy, people want to reduce\nCO2 emissions. There is also opposition\nbecause: people think the turbines spoil\nthe landscape, they are noisy.\n2 Experts know that fossil fuels will run out\nand we will need to switch to renewable\nsources of energy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":50,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/ thub.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":50,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7086","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article and choose the best title.","pages":[130],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4ec5cd1d50b6447495ba7faf2db745dc9dff683b32aa3c43703508a8dbc50442.png"],"provided":"","items":[{"id":"b7086.i01","label":"1","prompt":"Choose the best title for the article.","options":["'Why are fossil fuels running out?'","'The disadvantages of clean energy generation'","'An overview of renewable energy production'","'The benefits of renewable energy sources'","'The pros and cons of environmental conservation'"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7086.i01","label":"1","prompt":"Choose the best title for the article.","options":["'Why are fossil fuels running out?'","'The disadvantages of clean energy generation'","'An overview of renewable energy production'","'The benefits of renewable energy sources'","'The pros and cons of environmental conservation'"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B04-RW-U06-classroom:material:RW-M03","title":"READING 1","text":"YDROPOWER\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\nIND POWER\n2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\nOLAR ENERGY\n3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations. Also, photovoltaic cells are fragile and can be easily damaged.\nIOMASS ENERGY\n4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines, generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\nEOTHERMAL ENERGY\n5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","screens":["YDROPOWER\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower syste  way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\nEOTHERMAL ENERGY","5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low."],"sources":[{"page":129,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1105ef80c3a10a3868f9c92f13df528ce6ea9b77167bd639abecc1c1a9530d93.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f77f8455209ec4cc1468f64897d5bf470a261128ae7549b159327b0106f9a36.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"c","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf"," consequences for the\nbillions of people who live on Earth. In recent years, both\npeople and governments have become more interested\nin managing the world’s resources in a better way. While\nalternative energy solutions are important, they are\nnot always practical. An immediate way to improve the\nsituation is to encourage everyone to reduce, reuse\nand recycle.\nWe must all learn to use fewer natural resources on a\ndaily basis. We can initiate this by reducing the number\nof electrical items we leave plugged in or use less water.\nIn our homes, we could use only energy-saving light bulbs\nand install water meters. Parents should inform children\nfrom an early age to turn off lights which they are not\nusing. Also, many cities are instigating carbon emissions\ntaxes, which is definitely a step in the right direction.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7114","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"FORMAL AND INFORMAL ACADEMIC VERBS"},"instruction":"Work with a partner. Answer the questions.","pages":[136],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/630ab42f4c2da01243d0b84fb4309222c4d57fde551082d6c07a112c1c75ba80.png"],"provided":"","items":[{"id":"b7114.i01","label":"1","prompt":"What do you think of the writer's ideas? Do you agree or disagree?","options":[],"type":"discuss/open"},{"id":"b7114.i02","label":"2","prompt":"Can you think of any other ways we could conserve natural resources?","option it costs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7100","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"order":23,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay about the pros and cons of electric cars and then answer the questions below.","pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c1ef346139d74de6050b44d6cbc0d0c9f7b8bde4bf07bf78d467a9f26df196a0.png"],"provided":"1 What does the writer say are the main advantages of electric cars?\n2 What are the main disadvantages of an electric car?\n3 What is the writer's final conclusion on this topic?","items":[{"id":"b7100.i01","label":"1","prompt":"What does the writer say are the main advantages of electric cars?","options":[],"type":"qa/open"},{"id":"b7100.i02","label":"2","prompt":"What are the main disadvantages of an electric car?","options":[],"type":"qa/open"},{"id":"b7100.i03","label":"3","prompt":"What is the writer's final conclusion on this topic?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 What does the writer say are the main advantages of electric cars?"},{"kind":"text","text":"2 What are the main disadvantages of an electric car?"},{"kind":"text","text":"3 What is the writer's final conclusion on this topic?"}]],"courseMaterials":[{"id":"B04-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"# THE PROS AND CONS OF THE ELECTRIC CAR\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars, which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the argument.  \n2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.  \n3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level of damage over time as a gasoline-fuelled car.\n4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.  \n5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately $542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding r country use a lot of renewable energy?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7106.i03","label":"3","prompt":"Do you think all cars will be electric in the future? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B04-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"# THE PROS AND CONS OF THE ELECTRIC CAR\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars, which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the argument.  \n2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.  \n3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level of damage over time as a gasoline-fuelled car.\n4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.  \n5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately $542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging "page":134,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/305bcd2addf32ba6c4f8d7b4f03663cd635e1bb136168a5fe630681647646db3.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/911a741c3f08f829b01298cfe4689a24916d26233c3dd17c5477859def017a33.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"I think there are several initiatives\ngovernments worldwide could enforce in\norder to encourage the use and purchase\nof electric cars. Firstly, I think they could do\nsomething about the cost of EVs, as this\nseems to be one of the most challenging\nissues related to buying this type of car.\nMost people are currently unable to afford\nan EV. Therefore, governments could offer\nsome financial incentives to buy an EV or\nfind some way to make them cheaper.\nSecondly, governments need to develop\nthe infrastructure of charging points for\nEVs. By making these points more visible\nto the consumer, they are more likely to\ninvest in an EV. I believe many people do\nnot purchase EVs because they are not\nconfident that they will be able to recharge\nthe car battery when needed.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d wever, it is also an economy (2) which / who is making significant progress in terms of green energy sources. Xi Jinping, (3) which / who is China's president, has pledged that China will reach carbon neutrality by 2060. China is currently the country (4) which / where produces the most solar power and the nation (5) that / where has triple the amount of wind installations compared to any other country."},{"kind":"item","id":"b7128.i01","label":"1","prompt":"China is ____ the biggest challenge lies.","options":["which","where"],"type":"choice/closed"}],[{"kind":"item","id":"b7128.i02","label":"2","prompt":"it is also an economy ____ is making significant progress in terms of green energy sources.","options":["which","who"],"type":"choice/closed"},{"kind":"item","id":"b7128.i03","label":"3","prompt":"Xi Jinping, ____ is China's president, has pledged that China will reach carbon neutrality by 2060.","options":["which","who"],"type":"choice/closed"},{"kind":"item","id":"b7128.i04","label":"4","prompt":"China is currently the country ____ produces the most solar power","options":["which","where"],"type":"choice/closed"}],[{"kind":"item","id":"b7128.i05","label":"5","prompt":"the nation ____ has triple the amount of wind installations compared to any other country.","options":["that","where"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 where 2 which 3 who 4 which 5 that\nACADEMIC WRITING SKILLS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":53,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7131","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"order":35,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Complete the sentence below with one of the expressions from the box. There is more than one answer for each question.","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac1cc1d85460600bdefcdc767b4751f6470b08ff8ffaea058f0ad1bb80a97afa.png"],"provided":"","items":[{"id":"b7131.i01","label":"1","prompt":"____ of geothermal energy is that the initial costs of installing the system are very high.","options":[],"type":"gap/open"},{"id":"b7131.i02","label":"2","prompt":"____ of biomass is that it can re-grow over a relatively short period of time.","options":[],"type":"gap/open"},{"id":"b7131.i03","label":"3","prompt":"____ of hydropower is that it can have a negative environmental impact on aquatic wildlife.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7131.i01","label":"1","prompt":"____ of geothermal energy is that the initial costs of installing the system are very high.","options":[],"type":"gap/open"},{"kind":"item","id":"b7131.i02","label":"2","prompt":"____ of biomass is that it can re-grow over a relatively short period of time.","options":[],"type":"gap/open"},{"kind":"item","id":"b7131.i03","label":"3","prompt":"____ of hydropower is that it can have a negative environmental impact on aquatic wildlife.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 A distinct drawback … 2 The most\nobvious benefit … 3 One other inherent\ndisadvantage …","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7132","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"order":36,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Imagine you live in a small village, and there is a plan to build a large solar farm near your home. Work with a partner and discuss the opposing views on this development. Use the ideas below to help you.","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac1cc1d85460600bdefcdc767b4751f6470b08ff8ffaea058f0ad1bb80a97afa.png"],"provided":"Person 1 (against the proposal): too big, rural landscape would change, harmful to wildlife, traffic chaos, impact on property values, etc.\nPerson 2 (for the proposal): help the environment, create jobs, etc.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Person 1 (against the proposal): too big, rural landscape would change, harmful to wildlife, traffic chaos, impact on property values, etc."},{"kind":"text","text":"Person 2 (for the proposal): help the environment, create jobs, etc."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Building a large solar farm near our\nvillage would have a significant negative\nimpact on our rural landscape. It would\nbe too big and drastically change the\nnatural beauty we all enjoy. There’s also\nthe risk it could harm local wildlife. One\nother inherent disadvantage is that the\nconstruction process would lead to\ntraffic chaos, making daily life difficult for\nresidents. Another potential drawback\nis the likely drop in property values, as\nnot everyone will want to live near an\nindustrial-sized project like this.\n2 I believe the solar farm would be a\ngreat benefit to our community. The\nmost obvious benefit is in helping\nthe environment by providing clean,\nrenewable energy, reducing our reliance\non fossil fuels. A further possible benefit\nis that it could create jobs during the\nconstruction phase and potentially even\nfor maintenance afterward, which would\nbe a boost to our local economy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7136","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"COHERENCE"},"instruction":"Read the paragraph and complete the text with the words from the box below.","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5969b2b63297bce4414d95d3c26affe9b3b75844c365781c09db44346f13ea93.png"],"provided":"for example however in the same way they (×2) this\n\nPeople have different attitudes about alternative energy sources. (1) ____, some people welcome the construction of wind turbines in their towns and cities. Others, (2) ____, think that (3) ____ are undesirable. For (4) ____ second group of people, turbines are noisy and unattractive. (5) ____ that some people think hydropower dams are harmful to river environments, people who are against wind turbines think that (6) ____ ruin natural landscapes and pose dangers to local birds.","items":[{"id":"b7136.i01","label":"1","prompt":"People have different attitudes about alternative energy sources. (1) ____, some people welcome the construction of wind turbines in their towns and cities.","options":["for example","however","in the same way","they","this"],"type":"choice/closed"},{"id":"b7136.i02","label":"2","prompt":"Others, (2) ____, think that (3) ____ are undesirable.","options":["for example","however","in the same way","they","this"],"type":"choice/closed"},{"id":"b7136.i03","label":"3","prompt":"Others, (2) ____, think that (3) ____ are undesirable.","options":["for example","however","in the same way","they","this"],"type":"choice/closed"},{"id":"b7136.i04","label":"4","prompt":"For (4) ____ second group of people, turbines are noisy and unattractive.","options":["for example","however","in the same way","they","this"],"type":"choice/closed"},{"id":"b7136.i05","label":"5","prompt":"(5) ____ that some people think hydropower dams are harmful to river environments, people who are against wind turbines think that (6) ____ ruin natural landscapes and pose dangers to local birds.","options":["for example","however","in the same way","they","this"],"type":"choice/closed"},{"id":"b7136.i06","label":"6","prompt":"(5) ____ that some people think hydropower dams are harmful to river environments, people who are against wind turbines think that (6) ____ ruin natural landscapes and pose dangers to local birds.","options":["for example","however","in the same way","they","this"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"for example however in the same way they (×2) this"},{"kind":"text","text":"People have different attitudes about alternative energy sources. (1) ____, some people welcome the construction of wind turbines in their towns and cities. Others, (2) ____, think that (3) ____ are undesirable. For (4) ____ second group of people, turbines are noisy and unattractive. (5) ____ that some people think hydropower dams are harmful to river environments, people who are against wind turbines think that (6) ____ ruin natural landscapes and pose dangers to local birds."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 For example 2 however 3 they 4 this 5 In the\nsame way 6 they","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":53,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7137","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"order":38,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"COHERENCE"},"instruction":"Read the sentences and write a coherent paragraph using all the information. Use Exercise 2 to help you.","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5969b2b63297bce4414d95d3c26affe9b3b75844c365781c09db44346f13ea93.png"],"provided":"1 Turbines and hydropower plants both change the landscape of an area.\n2 Some think that they are important sources of alternative energy.\n3 Fossil fuel use has been linked to global warming.\n4 Some people are more concerned about using fossil fuels than other people are.\n5 Some people think it is more important to save money than to reduce global warming.\n6 Alternative energy production facilities can be expensive to construct.","items":[{"id":"b7137.i01","label":"1","prompt":"Write a coherent paragraph using all the information from sentences 1–6. Use Exercise 2 to help you.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-RW-U06-question:b7132","kind":"material-reference","title":"ACADEMIC WRITING SKILLS Ex 2","pages":[141]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Turbines and hydropower plants both change the landscape of an area."},{"kind":"text","text":"2 Some think that they are important sources of alternative energy."},{"kind":"text","text":"3 Fossil fuel use has been linked to global warming."},{"kind":"text","text":"4 Some people are more concerned about using fossil fuels than other people are."},{"kind":"text","text":"5 Some people think it is more important to save money than to reduce global warming."},{"kind":"text","text":"6 Alternative energy production facilities can be expensive to construct."}],[{"kind":"item","id":"b7137.i01","label":"1","prompt":"Write a coherent paragraph using all the information from sentences 1–6. Use Exercise 2 to help you.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Turbines and hydropower plants both\nchange the landscape of an area. Even\nthough some people think they alter the\nnatural landscape in an unattractive way,\nothers think that they are important sources\nof alternative energy. It is important to use\nalternative energy sources so that we are\nless dependent on fossil fuels, which have\nbeen linked to global warming. There is\nresistance to this idea, however. Some\npeople are more concerned about using\nfossil fuels than other people are. Also,\nsome think it is more important to save\nmoney than to reduce global warming, and\nalternative energy production facilities can\nbe expensive to construct.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U06-question:b7140","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"order":39,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Look back at Reading 1 and 2, which both examine the advantages and disadvantages of a topic. With a partner discuss how each article is structured and look the language used to write this type of essay.","pages":[143],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b989b14401aa35a4e2cfd6546243385a47bfd2d56ebbfca74a05113d4fcad3af.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Reading 1 is structured by discussing five\n
