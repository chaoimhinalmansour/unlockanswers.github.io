ec1900756f33d4f4c20cd878.mp3"}},{},{},{"B04-RW-U06-W-9e59d4253":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a8e184d74268a60d6bb6343b229c0401cc05c294c0db43f74dd32989bb0e9660.png","nativeWidth":1254,"box":[839,839,412,412],"alt":""}},{"B04-RW-U06-W-9e59d4253":{"example":"The turbines generate electricity for the water treatment plant.","mark":"generate","clip":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62ea9c3c9a0ea82aeef9342056fe516d9eb8b0feed3897d94279ad3d7d8bc87e.mp3"}},{},{},{},{},{},{},{"B01-LS-U05-question:b1192":{"rows":{"b1192.i01":{"mode":"choice","option":2},"b1192.i02":{"mode":"choice","option":3},"b1192.i03":{"mode":"choice","option":1},"b1192.i04":{"mode":"choice","option":0}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B02-RW-U05-question:b3751":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"It is easy to get to my house. First, walk (1) __ the High Street. Go (2) __ the bank and (3) __ the bridge. Then walk (4) __ the park and (5) __ the next bridge. Go (6) __ the tunnel – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B04-RW-U06-question:b7136":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":1,"text":"People have different attitudes about alternative energy sources. (1) __, some people welcome the construction of wind turbines in their towns and cities. Others, (2) __, think that (3) __ are undesirable. For (4) __ second group of people, turbines are noisy and unattractive. (5) __ that some people think hydropower dams are harmful to river environments, people who are against wind turbines think that (6) __ ruin natural landscapes and pose dangers to local birds.","values":["For example","however","they","this","in the same way","they"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U06-classroom:material:RW-M03":[{"body":"YDROPOWER\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered","sourcePage":129,"blocks":[{"kind":"text","text":"YDROPOWER"},{"kind":"text","text":"1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered"}]},{"body":"turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\nIND POWER","sourcePage":129,"blocks":[{"kind":"text","text":"turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million."},{"kind":"text","text":"IND POWER"}]},{"body":"2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the","sourcePage":129,"blocks":[{"kind":"text","text":"2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the"}]},{"body":"air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\nOLAR ENERGY","sourcePage":129,"blocks":[{"kind":"text","text":"air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds."},{"kind":"text","text":"OLAR ENERGY"}]},{"body":"3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of","sourcePage":129,"blocks":[{"kind":"text","text":"3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of"}]},{"body":"environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations.","sourcePage":129,"blocks":[{"kind":"text","text":"environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations."}]},{"body":"Also, photovoltaic cells are fragile and can be easily damaged.\nIOMASS ENERGY","sourcePage":129,"blocks":[{"kind":"text","text":"Also, photovoltaic cells are fragile and can be easily damaged."},{"kind":"text","text":"IOMASS ENERGY"}]},{"body":"4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines,","sourcePage":129,"blocks":[{"kind":"text","text":"4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines,"}]},{"body":"generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people","sourcePage":129,"blocks":[{"kind":"text","text":"generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people"}]},{"body":"are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\nEOTHERMAL ENERGY","sourcePage":129,"blocks":[{"kind":"text","text":"are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive."},{"kind":"text","text":"EOTHERMAL ENERGY"}]},{"body":"5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is","sourcePage":129,"blocks":[{"kind":"text","text":"5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is"}]},{"body":"inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is","sourcePage":129,"blocks":[{"kind":"text","text":"inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is"}]},{"body":"usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","sourcePage":129,"blocks":[{"kind":"text","text":"usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low."}]}],"B04-RW-U06-classroom:material:RW-M04":[{"body":"# THE PROS AND CONS OF THE ELECTRIC CAR\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars,","sourcePage":134,"blocks":[{"kind":"text","text":"# THE PROS AND CONS OF THE ELECTRIC CAR"},{"kind":"text","text":"We are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars,"}]},{"body":"which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the\nargument.","sourcePage":134,"blocks":[{"kind":"text","text":"which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the"},{"kind":"text","text":"argument."}]},{"body":"2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies","sourcePage":134,"blocks":[{"kind":"text","text":"2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies"}]},{"body":"suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.","sourcePage":134,"blocks":[{"kind":"text","text":"suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions."}]},{"body":"3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's","sourcePage":134,"blocks":[{"kind":"text","text":"3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's"}]},{"body":"cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level","sourcePage":134,"blocks":[{"kind":"text","text":"cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level"}]},{"body":"of damage over time as a gasoline-fuelled car.","sourcePage":134,"blocks":[{"kind":"text","text":"of damage over time as a gasoline-fuelled car."}]},{"body":"4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers","sourcePage":134,"blocks":[{"kind":"text","text":"4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers"}]},{"body":"the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.","sourcePage":134,"blocks":[{"kind":"text","text":"the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future."}]},{"body":"5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately","sourcePage":134,"blocks":[{"kind":"text","text":"5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately"}]},{"body":"$542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and","sourcePage":134,"blocks":[{"kind":"text","text":"$542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and"}]},{"body":"even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging points are still not sufficiently accessible. Consequently,","sourcePage":134,"blocks":[{"kind":"text","text":"even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging points are still not sufficiently accessible. Consequently,"}]},{"body":"owners of EVs must plan their journeys carefully.","sourcePage":134,"blocks":[{"kind":"text","text":"owners of EVs must plan their journeys carefully."}]},{"body":"6 In conclusion, whilst owning an EV is clearly much better for the environment and will most probably become mandatory in the future, currently the initiative is still experiencing teething problems. However, once these technologies have been developed further, then EVs will have a very positive impact on societies worldwide.","sourcePage":134,"blocks":[{"kind":"text","text":"6 In conclusion, whilst owning an EV is clearly much better for the environment and will most probably become mandatory in the future, currently the initiative is still experiencing teething problems. However, once these technologies have been developed further, then EVs will have a very positive impact on societies worldwide."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","i om an early age to turn off lights which they are not using. Also, many cities are introducing ____ carbon emissions taxes, which is definitely a step in the right direction.","answer":{"mode":"blanks","values":["inform","instigating"]}}]}],"rewriteKey":""},"B04-RW-U06-question:b7123":{"rows":{"b7123.i01":{"mode":"choice","option":0,"note":"who developed the first modern water turbine. Antecedent: James Francis."},"b7123.i02":{"mode":"choice","option":0,"note":"whose houses are near renewable energy farms. Antecedent: people."},"b7123.i03":{"mode":"choice","option":1,"note":"where the electricity meter is located. Antecedent: cupboard."},"b7123.i04":{"mode":"choice","option":1,"note":"when fewer people are using it. Antecedent: at night."}},"basis":"教材第 139 页与教师书 PDF 第 53 页。分别保留关系词和所修饰的词。","rewriteKey":""},"B04-RW-U06-question:b7128":{"rows":{"b7128.i01":{"mode":"gap","answer":"where"},"b7128.i02":{"mode":"gap","answer":"which"},"b7128.i03":{"mode":"gap","answer":"who"},"b7128.i04":{"mode":"gap","answer":"which"},"b7128.i05":{"mode":"gap","answer":"that"}},"basis":"教材第 140 页与教师书 PDF 第 53 页。","itemPatches":{"b7128.i01":{"options":[]},"b7128.i02":{"options":[]},"b7128.i03":{"options":[]},"b7128.i04":{"options":[]},"b7128.i05":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-RW-U06":{"aspect":1.7777778,"cues":[[0,4.78,"Wind power provides only about five % of the world's energy needs today.","风力发电目前仅提供世界能源需求的5%左右。"],[5.54,11.48,"But many environmental experts believe that figure could rise to almost 20 % by 2030.","但许多环境专家认为，到2030年，这一数字可能上升到近20%。"],[12.26,15.88,"Wind generates almost half a million megawatts of power.","风能发电近50万兆瓦。"],[16.44,19.58,"That's a 19 % jump in just five years.","短短五年内就跳了19%"],[21.3,27.56,"The UK is in a particularly good position to develop wind power, because it is so, well,","英国在发展风力方面处于特别有利的地位，因为它是如此，嗯，"],[28.14,28.46,"windy.","风曰。"],[29.34,32.58,"At present it ranks sixth in terms of capacity,","目前，就能力而言，它排在第六位，"],[33.1,36.36,"but is investing heavily in this renewable energy source.","但却在这种可再生能源上投入大量资金。"],[37.26,43.16,"The percentage of electricity in the UK generated from wind power overtook that of coal,","英国风能发电量超过煤炭发电量的百分比，"],[43.68,45.78,"once Britain's primary source of energy,","曾经是英国的主要能源来源"],[46.18,48.46,"for the first time in 2016.","(原始内容存档于2016年). For the first in 2016."],[49.4,54.54,"The result was the lowest carbon emission rate since the 1920s.","结果是自20世纪20年代以来碳排放率最低。"],[54.78,59.94,"The blades of the wind turbine turn a shaft, which passes the energy to a generator,","风力涡轮机的叶片转动轴线将能量传递给发电机"],[60.52,64.22,"which in turn transforms this energy into electricity.","这反过来又将这种能量转化为电力。"],[65.68,66.78,"The wind is free,","风是自由的，"],[67.2,77.52,"but the cost of power generation and storage actually makes wind power more expensive than traditional fossil fuel sources like coal, oil and gas.","但发电和储存的成本实际上使风力比煤炭，石油和天然气等传统化石燃料来源更昂贵。"],[78.56,81.66,"Smart technology is steadily bringing these costs down,","智能技术正在稳步降低成本，"],[82.02,85.14,"however, and this trend is expected to continue.","然而，这一趋势预计将继续下去。"],[88.2,91.16,"There are two different types of wind power,","风力有两种不同的类型"],[91.7,93.5,"onshore and offshore.","在岸上和岸外。"],[94.5,98.12,"Onshore wind farms are cheaper to build and maintain,","岸上风力发电场更便宜建造和维护，"],[98.72,101.75999999999999,"but many people don't want wind farms in their areas.","但很多人不希望风力发电场在他们的地区。"],[102.5,104.06,"The turbines are quite noisy,","涡轮机很吵"],[104.6,107.12,"and many people say they spoil the landscape.","很多人说他们破坏风景。"],[108.14,110.03999999999999,"Offshore wind farms, in contrast,","与此相反，近海风力发电场，"],[110.38,111.68,"are located in the sea,","位于大海中，"],[112,115.24000000000001,"where few people care about their noise or appearance.","很少有人关心他们的噪音或外表。"],[115.96000000000001,119.46000000000001,"The UK is a leader in offshore wind power.","英国是海上风力的领先者。"],[120.2,123.76,"The London Array, off the east coast of England in the North Sea,","伦敦阵列，在北海英格兰东岸"],[124.18,126.84,"is the largest offshore wind farm in the world.","是世界上最大的岸外风力场"],[127.72,131.54,"The UK is also home to the world's first floating wind farm,","联合王国也是世界上第一个漂浮风力发电场的所在地，"],[132.14,134.12,"off the north -east coast of Scotland.","在苏格兰东北海岸"],[134.64,137.72,"Although there is considerable public support for wind power,","虽然公众相当支持风力发电，"],[138.18,140.3,"there is also opposition to these large,","也有人反对这些庞大的，"],[140.66,141.44,"noisy devices.","噪音装置。"],[142.32,147.4,"It's also important to remember that all of them are subject to changes in weather patterns.","同样重要的是要记住，它们都受到天气模式变化的影响。"],[148.3,151.36,"There are windy days and not -so -windy days.","有风的日子，没有风的日子。"],[151.84,154.22,"There are also not -so -windy years.","也没有这么风化的岁月。"],[154.9,157,"Denmark, a leader in wind power,","丹麦，风力的领先者，"],[157.46,162.16,"saw its wind power level drop in 2016 because of a lack of wind.","2016年其风力水平因风力不足而下降。"],[163.2,163.84,"Nevertheless,","不过，"],[164.4,170.14,"the shift to renewable energy sources like wind is likely to continue unabated.","转向可再生能源，如风力，很可能继续有增无减。"],[170.14,182.34,"If you look at a more flexible, more dynamic energy system with, say, more electric vehicles on going out into the 2030s, then the backbone of that energy system should be cheap renewables.","如果你看看一个更灵活，更动态的能源系统，比如说，在20世纪30年代，更多的电动车辆，那么能源系统的支柱应该是廉价的可再生能源。"],[182.44,189.36,"That is going to be the way to keep bills low, and you won't find an energy analyst out there that disagrees with that vision of the future.","这会是降低账单的方法，并且你不会找到一个能源分析师在那里，不同意对未来的愿景。"]],"englishRows":3,"chineseRows":2}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33},"B01-LS/36":{"pdf":34},"B01-LS/37":{"pdf":35},"B01-LS/38":{"pdf":36},"B01-LS/39":{"pdf":37},"B01-LS/40":{"pdf":38},"B01-LS/41":{"pdf":39},"B01-LS/42":{"pdf":40},"B01-LS/43":{"pdf":41},"B01-LS/44":{"pdf":42},"B01-LS/45":{"pdf":43},"B01-LS/46":{"pdf":44},"B01-LS/47":{"pdf":45},"B01-LS/48":{"pdf":46},"B01-LS/49":{"pdf":47},"B01-LS/50":{"pdf":48},"B01-LS/51":{"pdf":49},"B01-LS/52":{"pdf":50},"B01 function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){

function bind(c){

  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);

function taskTable(table,feedback){

  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';

function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";

}

 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
