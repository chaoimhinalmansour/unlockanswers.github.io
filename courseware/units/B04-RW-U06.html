6,"topic":"ENERGY","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[124],"sourcePages":[124],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5bc6dbce7c5b4e54f71fa0db7f279f40a4c0258e135855985bd29b1598a228e5.png"],"sourceHashes":["5bc6dbce7c5b4e54f71fa0db7f279f40a4c0258e135855985bd29b1598a228e5"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write an advantages and disadvantages essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about wind power."},{"label":"Reading skill","text":"Work out meaning from context."},{"label":"Critical thinking","text":"Evaluate benefits and drawbacks; organize ideas for an essay."},{"label":"Grammar","text":"Use defining and non-defining relative clauses."},{"label":"Academic writing skill","text":"Introduce advantages and disadvantages; make academic writing coherent."}],"photo":{"box":[965,500,2071,3553],"nativeWidth":3040,"sourcePage":124,"alt":""}}]}},{"id":"B04-RW-U06-classroom:resource:b7068","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0aa947597b1aa7a44b5b43f79b29ef6a03242ec611800271d14ce0a3f555334a.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"renewable energy","pos":"(n)","definition":"energy that is produced using the sun, wind, etc., or from crops, rather than using fossil fuels such as oil or coal","example":"The village gets most of its electricity from renewable energy.","wordAudio":"renewable energy","cardWord":false},{"term":"overtake","pos":"(v)","definition":"to go past something by being larger or faster","example":"The faster runner began to overtake the others.","wordAudio":"overtake","cardWord":false},{"term":"smart technology","pos":"(phr)","definition":"smart technology uses computers and information in electronic form","example":"The lights use smart technology to switch off when the room is empty.","wordAudio":"smart technology","cardWord":false},{"term":"continue unabated","pos":"(v)","definition":"to keep going without becoming weaker or less","example":"The protests continued unabated throughout the week.","wordAudio":"continue unabated","cardWord":false}]]}},{"id":"B04-RW-U06-classroom:video","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0aa947597b1aa7a44b5b43f79b29ef6a03242ec611800271d14ce0a3f555334a.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/a494c3f04e4f0b6af3e8a36e-L4RW-U06.mp4","captions":[{"start":0,"end":4.78,"text":"Wind power provides only about five % of the world's\nenergy needs today."},{"start":5.54,"end":11.48,"text":"But many environmental experts believe that figure\ncould rise to almost 20 % by 2030."},{"start":12.26,"end":15.88,"text":"Wind generates almost half a million megawatts of\npower."},{"start":16.44,"end":19.58,"text":"That's a 19 % jump in just five years."},{"start":21.3,"end":27.56,"text":"The UK is in a particularly good position to develop\nwind power, because it is so, well,"},{"start":28.14,"end":28.46,"text":"windy."},{"start":29.34,"end":32.58,"text":"At present it ranks sixth in terms of capacity,"},{"start":33.1,"end":36.36,"text":"but is investing heavily in this renewable energy\nsource."},{"start":37.26,"end":43.16,"text":"The percentage of electricity in the UK generated from\nwind power overtook that of coal,"},{"start":43.68,"end":45.78,"text":"once Britain's primary source of energy,"},{"start":46.18,"end":48.46,"text":"for the first time in 2016."},{"start":49.4,"end":54.54,"text":"The result was the lowest carbon emission rate since\nthe 1920s."},{"start":54.78,"end":59.94,"text":"The blades of the wind turbine turn a shaft, which\npasses the energy to a generator,"},{"start":60.52,"end":64.22,"text":"which in turn transforms this energy into electricity."},{"start":65.68,"end":66.78,"text":"The wind is free,"},{"start":67.2,"end":77.52,"text":"but the cost of power generation and storage actually\nmakes wind power more expensive than traditional fossil\nfuel sources like coal, oil and gas."},{"start":78.56,"end":81.66,"text":"Smart technology is steadily bringing these costs down,"},{"start":82.02,"end":85.14,"text":"however, and this trend is expected to continue."},{"start":88.2,"end":91.16,"text":"There are two different types of wind power,"},{"start":91.7,"end":93.5,"text":"onshore and offshore."},{"start":94.5,"end":98.12,"text":"Onshore wind farms are cheaper to build and maintain,"},{"start":98.72,"end":101.75999999999999,"text":"but many people don't want wind farms in their areas."},{"start":102.5,"end":104.06,"text":"The turbines are quite noisy,"},{"start":104.6,"end":107.12,"text":"and many people say they spoil the landscape."},{"start":108.14,"end":110.03999999999999,"text":"Offshore wind farms, in contrast,"},{"start":110.38,"end":111.68,"text":"are located in the sea,"},{"start":112,"end":115.24000000000001,"text":"where few people care about their noise or appearance."},{"start":115.96000000000001,"end":119.46000000000001,"text":"The UK is a leader in offshore wind power."},{"start":120.2,"end":123.76,"text":"The London Array, off the east coast of England in the\nNorth Sea,"},{"start":124.18,"end":126.84,"text":"is the largest offshore wind farm in the world."},{"start":127.72,"end":131.54,"text":"The UK is also home to the world's first floating wind\nfarm,"},{"start":132.14,"end":134.12,"text":"off the north -east coast of Scotland."},{"start":134.64,"end":137.72,"text":"Although there is considerable public support for wind\npower,"},{"start":138.18,"end":140.3,"text":"there is also opposition to these large,"},{"start":140.66,"end":141.44,"text":"noisy devices."},{"start":142.32,"end":147.4,"text":"It's also important to remember that all of them are\nsubject to changes in weather patterns."},{"start":148.3,"end":151.36,"text":"There are windy days and not -so -windy days."},{"start":151.84,"end":154.22,"text":"There are also not -so -windy years."},{"start":154.9,"end":157,"text":"Denmark, a leader in wind power,"},{"start":157.46,"end":162.16,"text":"saw its wind power level drop in 2016 because of a lack\nof wind."},{"start":163.2,"end":163.84,"text":"Nevertheless,"},{"start":164.4,"end":170.14,"text":"the shift to renewable energy sources like wind is\nlikely to continue unabated."},{"start":170.14,"end":182.34,"text":"If you look at a more flexible, more dynamic energy\nsystem with, say, more electric vehicles on going out\ninto the 2030s, then the backbone of that energy system\nshould be cheap renewables."},{"start":182.44,"end":189.36,"text":"That is going to be the way to keep bills low, and you\nwon't find an energy analyst out there that disagrees\nwith that vision of the future."}],"launchInline":true}},{"id":"B04-RW-U06-classroom:material:RW-M03","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[129],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1105ef80c3a10a3868f9c92f13df528ce6ea9b77167bd639abecc1c1a9530d93.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"YDROPOWER\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\nIND POWER","sourcePage":129},{"body":"2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\nOLAR ENERGY","sourcePage":129},{"body":"3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations. Also, photovoltaic cells are fragile and can be easily damaged.\nIOMASS ENERGY","sourcePage":129},{"body":"4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines, generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\nEOTHERMAL ENERGY","sourcePage":129},{"body":"5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","sourcePage":129}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U06-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"YDROPOWER","pages":[{"page":129,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1105ef80c3a10a3868f9c92f13df528ce6ea9b77167bd639abecc1c1a9530d93.png","width":3040,"height":4096}],"source":129,"embeddedIn":null,"photo":null,"clearPages":[{"body":"YDROPOWER\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\nIND POWER","sourcePage":129},{"body":"2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\nOLAR ENERGY","sourcePage":129},{"body":"3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations. Also, photovoltaic cells are fragile and can be easily damaged.\nIOMASS ENERGY","sourcePage":129},{"body":"4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines, generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\nEOTHERMAL ENERGY","sourcePage":129},{"body":"5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","sourcePage":129}],"text":"YDROPOWER\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\nIND POWER\n2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\nOLAR ENERGY\n3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations. Also, photovoltaic cells are fragile and can be easily damaged.\nIOMASS ENERGY\n4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines, generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\nEOTHERMAL ENERGY\n5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f77f8455209ec4cc1468f64897d5bf470a261128ae7549b159327b0106f9a36.mp3"},"original":{"id":"B04-RW-U06-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U06","book":4,"track":"RW","unit":6,"title":"READING 1","kind":"material","pages":[129],"sourceImages":[{"page":129,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1105ef80c3a10a3868f9c92f13df528ce6ea9b77167bd639abecc1c1a9530d93.png","viewEvidenceReported":true}],"text":"HYDROPOWER\n\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\n\nWIND POWER\n\n2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\n\nSOLAR ENERGY\n\n3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations. Also, photovoltaic cells are fragile and can be easily damaged.\n\nBIOMASS ENERGY\n\n4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines, generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\n\nGEOTHERMAL ENERGY\n\n5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b7082"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。","rawTranscribedText":"YDROPOWER\n\n1 Hydropower is created when moving water turns turbines to create electricity. The source of the moving water can be rivers, waterfalls or the sea. Because flowing water continues to move, this creates an inexhaustible amount of energy which can be stored and used when the demand is highest. There are a few drawbacks, however. Water-powered turbines can have a negative environmental impact on aquatic wildlife and can endanger boats. Also, creating hydropower dams causes land behind the dams to permanently flood. Finally, it is expensive to set up hydropower systems – the average cost is between $1 million and $4 million.\n\nIND POWER\n\n2 To create wind power, large turbines are placed on top of hills or offshore. The wind turns the blades, which generate energy. Wind turbines can be utilized on a large scale or on a small scale. Unlike hydropower, this process is relatively cheap and is considered one of the most affordable forms of electricity today. Also, it does not harm the air or land it uses. However, many people consider wind turbines ugly and noisy. Also, they rely on the wind, so if it is not windy, no energy is produced. Finally, like hydropower, wind turbines can be a threat to wildlife such as local birds.\n\nOLAR ENERGY\n\n3 To use solar energy, solar panels absorb sunlight and, using devices called photovoltaic cells, turn it into electricity. The sun produces energy constantly, which makes solar energy an inexhaustible resource. Another benefit is that it generates no pollution. Solar energy can be adapted to work on a variety of buildings and in a variety of environments. However, a large area of land is needed to produce a large amount of solar power. Scientists have determined that if we wanted to try to power the entire Earth with renewable solar power, we would need to cover a land area about the size of Spain with solar panels. In places with less sunlight, solar power generation has limitations. Also, photovoltaic cells are fragile and can be easily damaged.\n\nIOMASS ENERGY\n\n4 Biomass is a biologically produced fuel made from plant and animal material, which is mostly composed of carbon, hydrogen and oxygen. It is the oldest source of renewable energy, used since humans first started burning wood for fire. Today, steam from burning biomass – made up of garbage and other organic waste, rather than wood – turns turbines, generating electricity. Biomass can regrow over a relatively short period of time compared to the hundreds of millions of years that it takes for fossil fuels to form. It is also an efficient way to generate power, and it is universal. Another benefit is that it reduces the need to bury garbage under the ground in a landfill. However, some people are concerned that burning biomass contributes to global warming because it produces greenhouse gases¹. Also, using biomass to generate energy on a large scale can be expensive.\n\nEOTHERMAL ENERGY\n\n5 With geothermal energy, heat which is trapped in the ground can be converted into steam to turn turbines. The power it generates can then be used to produce electricity and heat buildings. Geothermal energy uses relatively simple technology. Like several of the other energy sources already mentioned, this process causes no pollution and is inexhaustible. The most active geothermal resources are usually found in areas near volcanoes or where geothermal activity naturally occurs. The largest area of this kind is known as the 'Ring of Fire'. It rims the Pacific Ocean and is bounded by eastern Asia and the western edge of the Americas. Outside of regions like these, geothermal energy is usually unavailable. The initial costs of installing a geothermal energy system are very high, but once it is built, the running costs are low.","textCorrectionEvidence":{"page":129,"reason":"原抽取遗漏五个小标题首字母；按原图补齐。","reviewFile":"material-registry-repairs-root-v1.json"}}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f77f8455209ec4cc1468f64897d5bf470a261128ae7549b159327b0106f9a36.mp3","continueOnPage":true}},{"id":"B04-RW-U06-classroom:material:RW-M04","book":4,"unit":6,"track":"RW","topic":"ENERGY","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[134],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/305bcd2addf32ba6c4f8d7b4f03663cd635e1bb136168a5fe630681647646db3.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# THE PROS AND CONS OF THE ELECTRIC CAR\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars, which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the argument.  ","sourcePage":134},{"body":"2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.  ","sourcePage":134},{"body":"3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level of damage over time as a gasoline-fuelled car.","sourcePage":134},{"body":"4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.  ","sourcePage":134},{"body":"5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately $542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging points are still not sufficiently accessible. Consequently, owners of EVs must plan their journeys carefully.  ","sourcePage":134},{"body":"6 In conclusion, whilst owning an EV is clearly much better for the environment and will most probably become mandatory in the future, currently the initiative is still experiencing teething problems. However, once these technologies have been developed further, then EVs will have a very positive impact on societies worldwide.","sourcePage":134}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"THE PROS AND CONS OF THE ELECTRIC CAR","pages":[{"page":134,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/305bcd2addf32ba6c4f8d7b4f03663cd635e1bb136168a5fe630681647646db3.png","width":3040,"height":4096}],"source":134,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# THE PROS AND CONS OF THE ELECTRIC CAR\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars, which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the argument.  ","sourcePage":134},{"body":"2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.  ","sourcePage":134},{"body":"3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level of damage over time as a gasoline-fuelled car.","sourcePage":134},{"body":"4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.  ","sourcePage":134},{"body":"5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately $542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging points are still not sufficiently accessible. Consequently, owners of EVs must plan their journeys carefully.  ","sourcePage":134},{"body":"6 In conclusion, whilst owning an EV is clearly much better for the environment and will most probably become mandatory in the future, currently the initiative is still experiencing teething problems. However, once these technologies have been developed further, then EVs will have a very positive impact on societies worldwide.","sourcePage":134}],"text":"# THE PROS AND CONS OF THE ELECTRIC CAR\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars, which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the argument.  \n2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.  \n3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level of damage over time as a gasoline-fuelled car.\n4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.  \n5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately $542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging points are still not sufficiently accessible. Consequently, owners of EVs must plan their journeys carefully.  \n6 In conclusion, whilst owning an EV is clearly much better for the environment and will most probably become mandatory in the future, currently the initiative is still experiencing teething problems. However, once these technologies have been developed further, then EVs will have a very positive impact on societies worldwide.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/911a741c3f08f829b01298cfe4689a24916d26233c3dd17c5477859def017a33.mp3"},"original":{"id":"B04-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U06","book":4,"track":"RW","unit":6,"title":"READING 2","kind":"material","pages":[134],"sourceImages":[{"page":134,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/305bcd2addf32ba6c4f8d7b4f03663cd635e1bb136168a5fe630681647646db3.png","viewEvidenceReported":true}],"text":"# THE PROS AND CONS OF THE ELECTRIC CAR\n\nWe are on the brink of $^{1}$ change for the car industry and countries around the world agree that all cars should be fuelled by an energy source which is more environmentally friendly, such as electricity. Essentially, an electric car is a vehicle powered by a battery, which is charged by an external electricity source. Unlike most current cars, which run on $^{2}$ fossil fuels, the electric car would not create extreme levels of pollution. However, despite this, many countries are delaying this switch to a greener energy source, because whilst this change would bring with it some enormous benefits, it also has some significant drawbacks. The following essay will consider both sides of the argument.  \n2 As already mentioned, perhaps the greatest advantage of electric vehicles (EVs), is that they are kinder to the environment. According to the Mayor of London, road pollution is currently responsible for half the city's air pollution. Unlike gasoline- or diesel $^{3}$ -fuelled cars, EVs produce zero exhaust pipe $^{6}$ emissions and studies suggest that just one electric car on the road, could save an average of 1.5 million grams of CO $_{2}$ per year. This idea is further evidenced by countries such as Norway, where an increased uptake in the use of EVs has significantly reduced the country's level of carbon emissions.  \n3 Other advantages of EVs is that they perform well and don't require much maintenance. According to many car manufacturers EVs now outperform comparable diesel- or gasoline-powered cars. Furthermore, EVs are much quieter than conventional cars. Gasoline-fuelled cars are noisy due to the process of combustion occurring in each of the engine's cylinders. However, this is not necessary with EVs and therefore by comparison the driving experience can feel much smoother and quieter. Moreover, electric cars are more efficient to maintain. This is because the battery motor will not need oil changes, you will not need to replace engine parts, and generally EVs will not experience the same level of damage over time as a gasoline-fuelled car.\n\n4 However, as with all new technologies, EVs do come with some notable drawbacks. One of the major difficulties with banning all fossil fuel cars is the cost implication. Although in the long term EVs might be cheaper to run, in the short term EVs are still quite expensive to buy. One of the main reasons for this is that the battery which powers the car is costly. It is the most expensive part of an EV because it is still relatively expensive to produce. However, as battery technologies improve, the price is predicted to decrease in the future.  \n5 Another significant disadvantage of EVs is that electric cars can travel less distance. The average range for an EV is estimated to be $340\\mathrm{km}$ per charge, whereas some luxury models are able to reach 483 km plus per charge. However, these types of cars are expensive. For example, the Tesla Model X, which provides approximately $542\\mathrm{km}$ of range, has a starting price of about £90,000. By comparison, the average gasoline or diesel vehicle can reach $483\\mathrm{km}$ on a full tank, and more fuel-efficient cars can achieve a much further distance. Fuelling an all-electric car can also be problematic. Fully recharging the battery pack can take up to eighty hours, and even fast charging stations can take 30 minutes to charge to $80\\%$ capacity. The location and availability of EV charging points is also a concern for those wanting to purchase an electric car. Although the EV charging infrastructure is expanding all the time, in many countries charging points are still not sufficiently accessible. Consequently, owners of EVs must plan their journeys carefully.  \n6 In conclusion, whilst owning an EV is clearly much better for the environment and will most probably become mandatory in the future, currently the initiative is still experiencing teething problems. However, once these technologies have been developed further, then EVs will have a very positive impact on societies worldwide.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b7102"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){

 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);

 const matchGrid=doc.querySelector(".flow-match-pictures");

  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?

 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};

});

if(saved)results=JSON.parse(saved.textContent);

if(reuse)comparisonResults=JSON.parse(reuse.textContent);
 const school=document.getElementById("saved-lesson-results");
 if(school)lessonResults=JSON.parse(school.textContent);
const scopes=new Map();
for(const c of primary){
 const key=c.track+c.lesson;
 const group=scopes.get(key)??{track:c.track,lesson:c.lesson,total:0};
 group.total++;scopes.set(key,group);
}
for(const [key,group] of scopes){
 document.getElementById("lesson-filter").add(new Option((group.track==="RW"?"读写":"听说")+"第 "+group.lesson+" 节，"+group.total+" 题",key));
}
for(const entry of document.querySelectorAll(".summary [data-ref], #digital-examples option[value]:not([value=\"\"])")){
 entry.hidden=!classroom.byId.has(entry.dataset.ref??entry.value);
}

for(const book of new Set([...classroom.openings,...classroom.glossaries].map(c=>c.book)))openingBook.add(new Option("Book "+book,String(book)));
sequenceView.querySelector('[value="openings"]').hidden=!classroom.openings.length;
sequenceView.querySelector('[value="glossaries"]').hidden=!classroom.glossaries.length;
const startView=new URLSearchParams(location.search).get("view");
if(classroom.openings.length&&startView==="openings")sequenceView.value="openings";
if(classroom.glossaries.length&&startView==="glossaries")sequenceView.value="glossaries";
const selectedLesson=new URLSearchParams(location.search).get("lesson");
if(/^[12]$/.test(selectedLesson??""))document.getElementById("lesson-filter").value=primary[0].track+selectedLesson;
updateSequenceHeading();
summaries();display(navigationOrder()[0]??0);
