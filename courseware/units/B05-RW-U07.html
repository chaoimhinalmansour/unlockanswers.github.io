nerals such as asbestos\nexposure of foetus in\nthe womb\nair pollution","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8859","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"6","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Read the facts about asthma. Then list some possible consequences if the prevalence of asthma continues. Think of one consequence for each fact for each group. Make sure the relationships between events are causal and not correlational or simply sequential. For causal relationships, consider the strength of the causality.","pages":[175],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/104860685d807ed7a0b9c796be1878eace2486a8cc0b83297d4277e6664b1b11.png"],"provided":"## Facts about asthma\n- Although there is no known cure, there are several treatments.\n- The most common treatment is an inhaler.\n- A severe asthma attack may require hospitalization; average stay is 3–5 days.\n- A small percentage of cases are fatal.\n- Air pollution can lead to an asthma attack.\n\n## Consequences:\nFor individuals and families:\n\nFor nations and regions:","items":[{"id":"b8859.i01","label":"1","prompt":"List possible consequences for individuals and families if the prevalence of asthma continues (one consequence per fact).","options":[],"type":"gap/open"},{"id":"b8859.i02","label":"2","prompt":"List possible consequences for nations and regions if the prevalence of asthma continues (one consequence per fact).","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Although there is no known cure, there are several treatments."},{"kind":"text","text":"- The most common treatment is an inhaler."},{"kind":"text","text":"- A severe asthma attack may require hospitalization; average stay is 3–5 days."},{"kind":"text","text":"- A small percentage of cases are fatal."},{"kind":"text","text":"- Air pollution can lead to an asthma attack."},{"kind":"text","text":"For individuals and families:"},{"kind":"text","text":"For nations and regions:"}],[{"kind":"item","id":"b8859.i01","label":"1","prompt":"List possible consequences for individuals and families if the prevalence of asthma continues (one consequence per fact).","options":[],"type":"gap/open"},{"kind":"item","id":"b8859.i02","label":"2","prompt":"List possible consequences for nations and regions if the prevalence of asthma continues (one consequence per fact).","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Consequences: For individuals\nand families\nAsthma sufferers will deal with the\nsymptoms of the illness, as well as the cost\nof treatment, for their entire lives.\nIf people do not get accurately diagnosed,\nthey won’t receive proper care.\nA hospital stay may place a financial burden\non a family or individual. A person may lose\ndays of work due to being hospitalized.\nIndividuals may die from an illness that is\ntreatable, simply because the treatment\nwas not available to them. Families will\nsuffer from the loss of a loved one.\nAs the problem of air pollution increases,\nmore people will suffer asthma attacks,\nwhich may lead to further illness,\nhospitalization or even death.\nFor nations and regions:\nAsthma disproportionately affects children\nand the elderly, putting the most vulnerable\npeople at risk around the world, without\nhope for a cure.\nAccurate diagnoses are necessary for the\noverall public health of a nation.\nHospitalization of individuals places a\nfinancial burden on a nation’s healthcare\nsystem. People must be absent from the\nlabour force while they are hospitalized.\nCountries are losing people to deaths\nwhich may be largely preventable, which\nmeans losing productive members\nof society.\nNations that do not act to reduce air\npollution will be contributing to the\nillness, hospitalization and even deaths\nof asthma sufferers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8860","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"7","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Review the cause and effect chains you completed on page 168. Develop two or three cause and effect chains for the illness you researched in Exercise 4. These will become the basis of your body paragraphs in the writing task.","pages":[175],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/104860685d807ed7a0b9c796be1878eace2486a8cc0b83297d4277e6664b1b11.png"],"provided":"CREATE","items":[{"id":"b8860.i01","label":"1","prompt":"Develop two or three cause and effect chains for the illness you researched in Exercise 4.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U07-question:b8855","kind":"student-work","title":"CRITICAL THINKING Ex 4","pages":[174]}],"materials":[],"coursePages":[[{"kind":"text","text":"CREATE"},{"kind":"item","id":"b8860.i01","label":"1","prompt":"Develop two or three cause and effect chains for the illness you researched in Exercise 4.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U07-publisher-page:p168","title":"原题或核对备注所引第168页","pages":[168],"text":"","screens":[],"sources":[{"page":168,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5bd639df99b13a4a27339a5ff9d70d0f421511e66d9701df7fedeb03dac6750d.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Air pollution and strokes\ncause and effect chain 1\nfossil fuels create air pollution in the form of\nfine particulate matter > particulate matter\nsettles in the atmosphere > people breathe\nin particulate matter > immune system is\ntriggered > inflammation in the body >\ninflammation narrows arteries and veins,\nrestricting blood supply to brain > can lead\nto stroke\ncause and effect chain 2\nvehicles emit poisonous chemicals like\ncarbon monoxide > particulate matter\ncirculate  airports suffer from lack of sleep and, (5) ____, problems with memory and shorter attention spans. (6) ____, their schoolwork tends to suffer."}]],"courseMaterials":[{"id":"B05-RW-U07-publisher-page:p176","title":"原题或核对备注所引第176页","pages":[176],"text":"","screens":[],"sources":[{"page":176,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4cca3d6e94961b0953aabc934c50d634e59f809c5d7bf319e469af839b61ee68.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B05-RW-U07-resource:Explanation box p176","title":"第176页逻辑连接词词框","pages":[176],"text":"","screens":[],"sources":[{"page":176,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4cca3d6e94961b0953aabc934c50d634e59f809c5d7bf319e469af839b61ee68.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 results from / is a consequence of 2 Due to / Because\nof 3 As a result / Therefore / As a consequence /\nConsequently 4 since/because 5 as a consequence /\nas a result / consequently / therefore 6 Therefore / As\na result / As a consequence / Consequently","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":59,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8869","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Write about one of the cause and effect chains you created in Critical thinking, Exercise 7 on page 175. Write a short paragraph describing the cause and effect relationships in the chain. Use the words, phrases and grammatical structures of cause and effect that you have learned in this unit. Then compare your work with a partner.","pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/39e41544f9a1a668d80d02bcfabd7ce594c0ef5f84e2081864fe638bda376b47.png"],"provided":"","items":[{"id":"b8869.i01","label":"1","prompt":"Write a short paragraph describing the cause and effect relationships in the chain.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U07-question:b8860","kind":"student-work","title":"CRITICAL THINKING Ex 7","pages":[175]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8869.i01","label":"1","prompt":"Write a short paragraph describing the cause and effect relationships in the chain.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U07-publisher-page:p175","title":"原题或核对备注所引第175页","pages":[175],"text":"","screens":[],"sources":[{"page":175,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/104860685d807ed7a0b9c796be1878eace2486a8cc0b83297d4277e6664b1b11.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Air pollution from fossil fuels releases fine\nparticulate matter into the atmosphere. Due\nto this, the particulate matter settles in the\nair, which people then inhale. As a result of\ninhaling these particles, the immune system\nis triggered, leading to inflammation in the\nbody. This inflammation, in turn, causes the\narteries and veins to narrow, consequently\nrestricting the blood supply to the brain.\nAs a result, the restricted blood flow can\nincrease the risk of stroke.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8873","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":41,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"For each of your cause and effect chains from Critical thinking, Exercise 7 on page 175, write a topic sentence that introduces and unites the material in that chain. (Review Academic writing skills, Exercises 2 and 3 on page 178.) Share your topic sentences with a partner to make sure they are clear.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b26ae587dd5250181c31f4497f893a5e25a7b668daa3294857e91042336eefd.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U07-question:b8860","kind":"student-work","title":"CRITICAL THINKING Ex 7","pages":[175]},{"id":"B05-RW-U07-question:b8869","kind":"student-work","title":"ACADEMIC WRITING SKILLS Ex 3","pages":[178]},{"id":"B05-RW-U07-question:b8868","kind":"material-reference","title":"ACADEMIC WRITING SKILLS Ex 2","pages":[178]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U07-publisher-page:p175","title":"原题或核对备注所引第175页","pages":[175] roblems. Studies have found that children who live near airports suffer from lack of sleep and, (5) ____, problems with memory and shorter","attention spans. (6) ____, their schoolwork tends to suffer."],"sources":[{"page":178,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/39e41544f9a1a668d80d02bcfabd7ce594c0ef5f84e2081864fe638bda376b47.png"}],"kind":"task_sheet","sourceBlockIds":["b8868"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"topic sentence: Breathing in air pollution\ntriggers a person’s immune system, which\ncan cause inflammation and prevent fresh\nblood from reaching the brain.\ntopic sentence: Inhaling particulate matter\ncomposed of poisonous chemicals can\nultimately reach the lungs and organs,\nincreasing the risk of blood clots.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8874","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":42,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Think about the introductory paragraph. Complete the tasks.","pages":[179],"sourceImages":[ okes are most\nprevalent, average age of people\nwho suffer from strokes, how many\npeople have strokes each year; causes,\nsymptoms, treatment of strokes\n2 claim: If air pollution is not reduced,\npeople will continue to suffer from\nstrokes and the rate of strokes will rise.\n3 A common factor that leads to strokes\nis air pollution, an urgent problem\nthat must be reduced in the interest of\npublic health.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8875","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":43,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Think about your conclusion. Complete the tasks.","pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b26ae587dd5250181c31f4497f893a5e25a7b668daa3294857e91042336eefd.png"],"provided":"Share these items with a partner to be sure they make a final impact on the reader.","items":[{"id":"b8875.i01","label":"1","prompt":"How will you begin your conclusion? Make sure you remind your readers of the importance of your claim, but do not repeat your thesis statement.","options":[],"type":"gap/open"},{"id":"b8875.i02","label":"2","prompt":"What do you want your readers to think about as they finish your essay?","options":[],"type":"gap/open"},{"id":"b8875.i03","label":"a","prompt":"future possibilities: ____","options":[],"type":"gap/open"},{"id":"b8875.i04","label":"b","prompt":"wider consequences: ____","options":[],"type":"gap/open"},{"id":"b8875.i05","label":"c","prompt":"other: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Share these items with a partner to be sure they make a final impact on the reader."},{"kind":"item","id":"b8875.i01","label":"1","prompt":"How will you begin your conclusion? Make sure you remind your readers of the importance of your claim, but do not repeat your thesis statement.","options":[],"type":"gap/open"},{"kind":"item","id":"b8875.i02","label":"2","prompt":"What do you want your readers to think about as they finish your essay?","options":[],"type":"gap/open"},{"kind":"item","id":"b8875.i03","label":"a","prompt":"future possibilities: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8875.i04","label":"b","prompt":"wider consequences: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8875.i05","label":"c","prompt":"other: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 In order to reduce the risk of strokes,\nair pollution must be dealt with on a\nworldwide basis.\n2 a  future possibilities: air pollution is\nreduced and the risk of strokes along\nwith it\nb  wider consequences: people around\nthe world breathe cleaner air; global\nmortality rate declines\nc  economic impact: healthier people\nmeans fewer days off work for people\nin the labour force; if people are\nhealthier, they may not have to deal\nwith high healthcare costs","references":[{"source":"https://raw.githubusercontent.com/chao paragraph that refers to your claim and leaves the reader with something to think about?"}]],"courseMaterials":[{"id":"B05-RW-U07-publisher-page:p180","title":"原题或核对备注所引第180页","pages":[180],"text":"","screens":[],"sources":[{"page":180,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057461be9848b1e133032d5dfb76d0b1f307a6d6e15c4f9ca4a0006e049dd1c2.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B05-RW-U07-material:Task checklist p180","title":"第180页 Task checklist","pages":[180],"text":"","screens":[],"sources":[{"page":180,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057461be9848b1e133032d5dfb76d0b1f307a6d6e15c4f9ca4a0006e049dd1c2.png"}],"kind":"task_checklist","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8878","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":45,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057461be9848b1e133032d5dfb76d0b1f307a6d6e15c4f9ca4a0006e049dd1c2.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U07-question:b8875","kind":"student-work","title":"WRITING TASK Ex 3","pages":[179]},{"id":"B05-RW-U07-question:b8873","kind":"student-work","title":"WRITING TASK Ex 1","pages":[179]},{"id":"B05-RW-U07-question:b8874","kind":"student-work","title":"WRITING TASK Ex 2","pages":[179]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A common factor that leads to strokes is\nair pollution, an urgent problem that must\nbe reduced in the interest of public health.\nStrokes are most prevalent in low and\nmiddle-income regions, with the highest\nincidences occurring in Southeast Asia and\nAfrica. The average age of people who\nsuffer from strokes is typically over 65,\nbut younger populations are increasingly\naffected. Each year, over 12 million people\nworldwide suffer from strokes.\nStrokes are caused by a sudden disruption\nof blood flow to the brain, often due\nto blocked or burst arteries. Symptoms\ninclude numbness, confusion, difficulty\nspeaking, and loss of balance. Immediate\ntreatment can prevent long-term damage,\nbut the rising number of cases makes\nprevention essential.\nIf air pollution is not reduced, people will\ncontinue to suffer from strokes, and the\nrate of strokes will rise. Air pollution from\nfossil fuels releases fine particulate matter\ninto the atmosphere. Due to this, the\nparticulate matter settles in the air, which\npeople then inhale. As a result of inhaling\nthese particles, the immune system is\ntriggered, leading to inflammation in the\nbody. This inflammation, in turn, causes the\narteries and veins to narrow, consequently\nrestricting the blood supply to the brain.\nAs a result, the restricted blood flow can\nincrease the risk of stroke.\nAnother harmful effect of air pollution\nis the inhalation of particulate matter\ncomposed of poisonous chemicals, which\ncan increase the risk of blood clots. Vehicles\nemit chemicals like carbon monoxide that\ncirculate in the air. This particulate matter is\ninhaled into the lungs, where it can travel to\ninternal organs, increasing the risk of blood\nclots. These clots can travel to the brain\nand cause strokes.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[{"page":180,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057461be9848b1e133032d5dfb76d0b1f307a6d6e15c4f9ca4a0006e049dd1c2.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8880","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":46,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"REVISE"},"instruction":"Use the Task checklist to review your essay for content and structure.","pages":[180],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057461be9848b1e133032d5dfb76d0b1f307a6d6e15c4f9ca4a0006e049dd1c2.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you introduced and provided background on the disease or illness?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you stated your claim clearly in your thesis statement?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you developed and explained the cause and effect chains in the occurrence of the disease?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Does each body paragraph provide y","basis":"Its proximity to a river does."},{"id":"B05-RW-U07-W-c5b9c04ce","label":"6","before":"Based on a 2023 study in the journal PLOS One, there has been a ","after":" in ocean plastic pollution since 2005.","answer":"surge","basis":"Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005."}],"bank":["eradicate","confined to","proximity","incurable","surge","accessible"]}],"mode":"wordbank","fitAnswer":true},"provided":"","items":[],"references":[],"materials":[],"issues":[],"feedback":{"placement":"inline","mode":"after","kind":"answer","source":"课堂词汇练习","rows":[{"label":"1","answer":"accessible","basis":"The new ramp makes the building accessible to wheelchair users.","anchor":{"kind":"line"}},{"label":"2","answer":"confined to","basis":"Tragically, the danger is not confined to adults.","anchor":{"kind":"line"}},{"label":"3","answer":"eradicate","basis":"The park service aims to eradicate the invasive weeds that are crowding out native plants.","anchor":{"kind":"line"}},{"label":"4","answer":"incurable","basis":"Mercury poisoning puts adults at risk of incurable diseases, such as heart disease and dementia.","anchor":{"kind":"line"}},{"label":"5","answer":"proximity","basis":"Its proximity to a river does.","anchor":{"kind":"line"}},{"label":"6","answer":"surge","basis":"Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005.","anchor":{"kind":"line"}}]}},{"id":"B05-RW-U07-classroom:resource:b8790","book":5,"unit":7,"topic":"HEALTH SCIENCES","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[158],"sourcePages":[158],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f6a214bbb5e351e62464775c109ab2f841809d17b460608bb740beb478dbd8c.png"],"sourceHashes":["2f6a214bbb5e351e62464775c109ab2f841809d17b460608bb740beb478dbd8c"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a cause and effect essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about medical implants."},{"label":"Reading skill","text":"Recognize discourse organization."},{"label":"Critical thinking","text":"Analyze causes and effects."},{"label":"Grammar","text":"Use logical connectors with causes and effects."},{"label":"Academic writing skill","text":"Write about causes and effects."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":158,"alt":""}}]}},{"id":"B05-RW-U07-classroom:resource:b8796","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[160],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/379fb700a645835caeabf77be0a027036835a3ace12613616e4eddf87d1b81de.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"profoundly deaf","pos":"(phr)","definition":"unable to hear any sound. the most severe form of deafness. extremely deaf","example":"The school has a support team for pupils who are profoundly deaf.","wordAudio":"profoundly deaf","cardWord":false},{"term":"brainstem","pos":"(n)","definition":"the area at the base of the brain that carries brain signals to the rest of the body","example":"The brainstem helps carry signals between the brain and the spinal cord.","wordAudio":"brainstem","cardWord":false},{"term":"implant","pos":"(n)","definition":"something, such as a device, that has been put into the body in a medical operation","example":"The surgeon fitted an implant to replace the damaged joint.","wordAudio":"implant","cardWord":false},{"term":"pioneering","pos":"(adj)","definition":"using ideas and methods that have never been used before","example":"The team used a pioneering method to restore the damaged artwork.","wordAudio":"pioneering","cardWord":false},{"term":"trial","pos":"(v)","definition":"to test something in a formal way to discover how effective or suitable it is","example":"The researchers will trial the new device in several clinics.","wordAudio":"trial","cardWord":false},{"term":"paralysis","pos":"(n)","definition":"a condition in which you are unable to move all or part of your body because of illness or injury","example":"The injury caused paralysis in his legs.","wordAudio":"paralysis","cardWord":false}]]}},{"id":"B05-RW-U07-classroom:video","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5d8e12d886bfa577a285eb019519f11a95d5f3bb98c318eaa25c9301b71d42ae.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/5e7490bab26a107544e58980-L5RW-U07.mp4","captions":[{"start":1.3,"end":7.28,"text":"Leia Armitage was born profoundly deaf without any\nconnections between her ears and her brain."},{"start":7.88,"end":10.24,"text":"But when she was just 22 months old,"},{"start":10.68,"end":15.66,"text":"Leia had pioneering surgery to insert an implant\ndirectly into her brainstem."},{"start":16.24,"end":18.92,"text":"It has enabled her to both hear and speak."},{"start":19.1,"end":21.18,"text":"Leia is doing fantastically well."},{"start":21.58,"end":29.6,"text":"Some children can develop a degree of speech where\nothers may only become aware of the environmental\nsound,"},{"start":30.78,"end":37.2,"text":"but the implants can help them to communicate better\nwith hearing people and with their peers."},{"start":38.44,"end":39.38,"text":"For Leia's parents,"},{"start":39.82,"end":43.02,"text":"it was a difficult decision to allow surgeons to\noperate,"},{"start":43.42,"end":45.6,"text":"but they're delighted with the results."},{"start":46.92,"end":53.48,"text":"Yeah, it's just been great, just been fantastic to\nwatch her development and the interaction that we can\nhave as a family."},{"start":54.98,"end":60.98,"text":"The implant Leia received is now approved for other\nprofoundly deaf young children."},{"start":62.18,"end":62.74,"text":"Meanwhile,"},{"start":63.24,"end":66.54,"text":"more such life -changing devices are on the way."},{"start":67.5,"end":70.26,"text":"Each one will need to be trialed by patients."},{"start":71.74,"end":74.06,"text":"Rodney Gorham suffers from ALS,"},{"start":74.53999999999999,"end":76.36,"text":"a disease which causes paralysis."},{"start":77.26,"end":83.8,"text":"He's trialing a brain implant designed to allow people\nlike him to interact with their devices."},{"start":85.1,"end":87.5,"text":"So for people who have paralysis,"},{"start":88.14,"end":92.97999999999999,"text":"their brain can still work, but their body is not\nresponding to how the brain moves."},{"start":93.5,"end":104.53999999999999,"text":"So we have our users think about trying to move certain\nparts of their body, and then we convert those into key\npresses that are used to make selections on the screen."},{"start":105.52000000000001,"end":113,"text":"Once a salesman and travel enthusiast, Rodney was\nbecoming increasingly more isolated by his disease."},{"start":114.02000000000001,"end":114.34,"text":"Today,"},{"start":114.68,"end":117.3,"text":"Rodney can communicate with an on -screen keyboard,"},{"start":117.86,"end":118.6,"text":"play games,"},{"start":119.16,"end":122.34,"text":"and even take part in interviews via text messages."},{"start":123.28,"end":128.7,"text":"And he has contributed hugely to a technology which may\nhelp many people."},{"start":131.16,"end":132.56,"text":"It's been monumental."},{"start":132.76,"end":139.86,"text":"I don't think we would be anywhere if he hadn't taken\nthe brave step of volunteering and pioneering this\ntechnology."},{"start":140.52,"end":144.78,"text":"Medical implants cannot be successfully developed\nwithout human trials."},{"start":145.64,"end":148.12,"text":"Not all devices will work the first time,"},{"start":148.57999999999998,"end":153.6,"text":"but brave patients who test them make it possible for\nothers to lead better lives."}],"launchInline":true}},{"id":"B05-RW-U07-classroom:material:RW-M03","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[164],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2810b4b211e3d584276a231139daf8ffccca6e8da6bf3f607d18d12ddd848a1.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.","sourcePage":164},{"body":"2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.","sourcePage":164},{"body":"3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.","sourcePage":164},{"body":"4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.","sourcePage":164},{"body":"5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.","sourcePage":164},{"body":"6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.","sourcePage":164},{"body":"7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","sourcePage":164}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U07-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":164,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2810b4b211e3d584276a231139daf8ffccca6e8da6bf3f607d18d12ddd848a1.png","width":772,"height":1040}],"source":164,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.","sourcePage":164},{"body":"2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.","sourcePage":164},{"body":"3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.","sourcePage":164},{"body":"4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.","sourcePage":164},{"body":"5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.","sourcePage":164},{"body":"6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.","sourcePage":164},{"body":"7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","sourcePage":164}],"text":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.\n2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.\n3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.\n4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.\n5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.\n6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.\n7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8ff82cbe oving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.\n7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8812"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8ff82cbe8cfe0e96dd0148fd73742482d0a4d8bec00c014b2face46932feeca.mp3","continueOnPage":true}},{"id":"B05-RW-U07-classroom:resource:b8824","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[166],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ca7ce9a4e283960eb09a472ac2ab4d8c1d8c42f90cd35aec7ee928b7224ad61f.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["proximity (n) nearness\nincurable (adj) impossible to cure\ntransmission (n) the process of passing something from one person or place to another\nfacilitate (v) to make something possible or easier","surge (n) a sudden, large increase\nconfined to (phr) existing in only a particular group of people\nreliance (n) when someone or something depends on someone or something else\neradicate (v) to get rid of something completely"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U07-classroom:material:RW-M04","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[167],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/25d01de07a0dcdd2fd2aaa43038c5dd06b5219fe8e71d304e815a581179688fb.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.","sourcePage":167},{"body":"2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.","sourcePage":167},{"body":"3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,","sourcePage":167},{"body":"digestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.","sourcePage":167},{"body":"4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.","sourcePage":167},{"body":"5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","sourcePage":167}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U07-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"HOW OCEAN POLLUTION AFFECTS HEALTH","pages":[{"page":167,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/25d01de07a0dcdd2fd2aaa43038c5dd06b5219fe8e71d304e815a581179688fb.png","width":772,"height":1040}],"source":167,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.","sourcePage":167},{"body":"2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.","sourcePage":167},{"body":"3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,","sourcePage":167},{"body":"digestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.","sourcePage":167},{"body":"4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.","sourcePage":167},{"body":"5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","sourcePage":167}],"text":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.\n2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.\n3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,\ndigestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.\n4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.\n5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66717ac240349345361f28be94b8e7aa02e6467f7c95cfac12c7ee303cd60bf6.mp3"},"original":{"id":"B05-RW-U07-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U07","book":5,"track":"RW","unit":7,"title":"READING 2","kind":"material","pages":[167],"sourceImages":[{"page":167,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/25d01de07a0dcdd2fd2aaa43038c5dd06b5219fe8e71d304e815a581179688fb.png","viewEvidenceReported":true}],"text":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shippin alled ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine, digestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.\n4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.\n5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8826"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66717ac240349345361f28be94b8e7aa02e6467f7c95cfac12c7ee303cd60bf6.mp3","continueOnPage":true}},{"id":"B05-RW-U07-classroom:review-1","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[181],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e3b8ce766dff2675b50225ae417b22c0b80c8208c9482e91ef40da9a050bc579.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-RW-U07-B-002","form":"adverse","page":181},{"id":"B05-RW-U07-B-003","form":"bacteria","page":181},{"id":"B05-RW-U07-B-004","form":"bacterial","page":181},{"id":"B05-RW-U07-B-005","form":"complications","page":181},{"id":"B05-RW-U07-B-007","form":"counter","page":181},{"id":"B05-RW-U07-B-008","form":"drive","page":181},{"id":"B05-RW-U07-B-009","form":"enable","page":181},{"id":"B05-RW-U07-B-011","form":"facilitate","page":181},{"id":"B05-RW-U07-B-012","form":"fuel","page":181},{"id":"B05-RW-U07-B-013","form":"grim","page":181},{"id":"B05-RW-U07-B-015","form":"infect","page":181},{"id":"B05-RW-U07-B-016","form":"infection","page":181},{"id":"B05-RW-U07-B-017","form":"infectious","page":181},{"id":"B05-RW-U07-B-018","form":"mutant","page":181}],[{"id":"B05-RW-U07-B-019","form":"phase out","page":181},{"id":"B05-RW-U07-B-020","form":"prevent","page":181},{"id":"B05-RW-U07-B-021","form":"preventable","page":181},{"id":"B05-RW-U07-B-022","form":"preventative","page":181},{"id"
