They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U07-classroom:material:RW-M03":[{"body":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or","sourcePage":164,"blocks":[{"kind":"text","text":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or"}]},{"body":"invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all","sourcePage":164,"blocks":[{"kind":"text","text":"invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all"}]},{"body":"deaths. There are several causes of air pollution, though they all stem from human activity.","sourcePage":164,"blocks":[{"kind":"text","text":"deaths. There are several causes of air pollution, though they all stem from human activity."}]},{"body":"2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil","sourcePage":164,"blocks":[{"kind":"text","text":"2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil"}]},{"body":"fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.","sourcePage":164,"blocks":[{"kind":"text","text":"fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution."}]},{"body":"3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the","sourcePage":164,"blocks":[{"kind":"text","text":"3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the"}]},{"body":"bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the","sourcePage":164,"blocks":[{"kind":"text","text":"bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the"}]},{"body":"global mortality rate, a fact that should raise the alarm for immediate action to be taken.","sourcePage":164,"blocks":[{"kind":"text","text":"global mortality rate, a fact that should raise the alarm for immediate action to be taken."}]},{"body":"4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke","sourcePage":164,"blocks":[{"kind":"text","text":"4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke"}]},{"body":"carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or","sourcePage":164,"blocks":[{"kind":"text","text":"carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or"}]},{"body":"'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.","sourcePage":164,"blocks":[{"kind":"text","text":"'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure."}]},{"body":"5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report","sourcePage":164,"blocks":[{"kind":"text","text":"5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report"}]},{"body":"from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.","sourcePage":164,"blocks":[{"kind":"text","text":"from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma."}]},{"body":"6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone,","sourcePage":164,"blocks":[{"kind":"text","text":"6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone,"}]},{"body":"over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.","sourcePage":164,"blocks":[{"kind":"text","text":"over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century."}]},{"body":"7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","sourcePage":164,"blocks":[{"kind":"text","text":"7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet."}]}],"B05-RW-U07-classroom:material:RW-M04":[{"body":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many","sourcePage":167,"blocks":[{"kind":"text","text":"# HOW OCEAN POLLUTION AFFECTS HEALTH"},{"kind":"text","text":"1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many"}]},{"body":"tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is\nfacilitating a public health crisis.","sourcePage":167,"blocks":[{"kind":"text","text":"tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is"},{"kind":"text","text":"facilitating a public health crisis."}]},{"body":"2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown","sourcePage":167,"blocks":[{"kind":"text","text":"2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown"}]},{"body":"away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the","sourcePage":167,"blocks":[{"kind":"text","text":"away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the"}]},{"body":"sea by the middle of the twenty-first century.","sourcePage":167,"blocks":[{"kind":"text","text":"sea by the middle of the twenty-first century."}]},{"body":"3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way,","sourcePage":167,"blocks":[{"kind":"text","text":"3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way,"}]},{"body":"the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take","sourcePage":167,"blocks":[{"kind":"text","text":"the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take"}]},{"body":"in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the","sourcePage":167,"blocks":[{"kind":"text","text":"in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found e in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B05-RW-U07":{"aspect":1.9085487,"cues":[[1.3,7.28,"Leia Armitage was born profoundly deaf without any connections between her ears and her brain.","莱娅·阿米蒂奇天生重度耳聋，耳朵与大脑之间没有神经连接。"],[7.88,10.24,"But when she was just 22 months old,","但当她刚刚22个月大的时候，"],[10.68,15.66,"Leia had pioneering surgery to insert an implant directly into her brainstem.","但在她只有22个月大时，莱娅接受了一项开创性手术，将植入物直接置入脑干。"],[16.24,18.92,"It has enabled her to both hear and speak.","这使她既能听到又能说话。"],[19.1,21.18,"Leia is doing fantastically well.","莉娅表现得很好"],[21.58,29.6,"Some children can develop a degree of speech where others may only become aware of the environmental sound,","有些儿童能够发展出一定的言语能力，另一些儿童可能只能察觉环境声音，"],[30.78,37.2,"but the implants can help them to communicate better with hearing people and with their peers.","但是植入物可以帮助他们更好地与听觉者和同龄人沟通。"],[38.44,39.38,"For Leia's parents,","对于莱娅的父母，"],[39.82,43.02,"it was a difficult decision to allow surgeons to operate,","允许外科医生做手术是个困难的决定，"],[43.42,45.6,"but they're delighted with the results.","但他们对结果很满意"],[46.92,53.48,"Yeah, it's just been great, just been fantastic to watch her development and the interaction that we can have as a family.","是的，看到她的成长，以及我们一家人能够有的互动，这实在太美好了。"],[54.98,60.98,"The implant Leia received is now approved for other profoundly deaf young children.","莱娅接受的这种植入物现已获批用于其他重度耳聋幼儿。"],[62.18,62.74,"Meanwhile,","同时，"],[63.24,66.54,"more such life -changing devices are on the way.","更多改变生命的装置在路上了"],[67.5,70.26,"Each one will need to be trialed by patients.","每一个都要接受病人的考验。"],[71.74,74.06,"Rodney Gorham suffers from ALS,","罗德尼·戈尔汉姆患有ALS，"],[74.53999999999999,76.36,"a disease which causes paralysis.","一种导致瘫痪的疾病。"],[77.26,83.8,"He's trialing a brain implant designed to allow people like him to interact with their devices.","他正在试用一种脑部植入物，旨在让像他这样的人与自己的设备互动。"],[85.1,87.5,"So for people who have paralysis,","对于瘫痪的人来说，"],[88.14,92.97999999999999,"their brain can still work, but their body is not responding to how the brain moves.","瘫痪患者的大脑仍能工作，但身体无法响应大脑发出的运动指令。"],[93.5,104.53999999999999,"So we have our users think about trying to move certain parts of their body, and then we convert those into key presses that are used to make selections on the screen.","我们让使用者设想移动身体的某些部位，再把这些意图转换成键盘按键，以便在屏幕上作出选择。"],[105.52000000000001,113,"Once a salesman and travel enthusiast, Rodney was becoming increasingly more isolated by his disease.","曾经是推销员和旅行爱好者，罗德尼因病越来越孤立。"],[114.02000000000001,114.34,"Today,","如今，"],[114.68,117.3,"Rodney can communicate with an on -screen keyboard,","Rodney可以用屏幕上的键盘进行交流，"],[117.86,118.6,"play games,","玩游戏，"],[119.16,122.34,"and even take part in interviews via text messages.","甚至通过短信参与采访。"],[123.28,128.7,"And he has contributed hugely to a technology which may help many people.","他为可能帮助很多人的技术做出了巨大贡献。"],[131.16,132.56,"It's been monumental.","这是一项意义重大的成就。"],[132.76,139.86,"I don't think we would be anywhere if he hadn't taken the brave step of volunteering and pioneering this technology.","如果他没有勇敢地自愿参与并开创这项技术，我们不可能走到今天。"],[140.52,144.78,"Medical implants cannot be successfully developed without human trials.","未经人体试验，医学植入无法成功发展。"],[145.64,148.12,"Not all devices will work the first time,","并不是所有设备都第一次起作用"],[148.57999999999998,153.6,"but brave patients who test them make it possible for others to lead better lives.","但勇敢参与测试的患者，让其他人有可能过上更好的生活。"]],"englishRows":3,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}

  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);

function itemHTML(x,letterChoices=false){

function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;

function measure(doc){

 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");

  if(outside(panel,box))return true;

  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};

  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
