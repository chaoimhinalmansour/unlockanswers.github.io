.92,"end":53.48,"text":"Yeah, it's just been great, just been fantastic to\nwatch her development and the interaction that we can\nhave as a family."},{"start":54.98,"end":60.98,"text":"The implant Leia received is now approved for other\nprofoundly deaf young children."},{"start":62.18,"end":62.74,"text":"Meanwhile,"},{"start":63.24,"end":66.54,"text":"more such life -changing devices are on the way."},{"start":67.5,"end":70.26,"text":"Each one will need to be trialed by patients."},{"start":71.74,"end":74.06,"text":"Rodney Gorham suffers from ALS,"},{"start":74.53999999999999,"end":76.36,"text":"a disease which causes paralysis."},{"start":77.26,"end":83.8,"text":"He's trialing a brain implant designed to allow people\nlike him to interact with their devices."},{"start":85.1,"end":87.5,"text":"So for people who have paralysis,"},{"start":88.14,"end":92.97999999999999,"text":"their brain can still work, but their body is not\nresponding to how the brain moves."},{"start":93.5,"end":104.53999999999999,"text":"So we have our users think about trying to move certain\nparts of their body, and then we convert those into key\npresses that are used to make selections on the screen."},{"start":105.52000000000001,"end":113,"text":"Once a salesman and travel enthusiast, Rodney was\nbecoming increasingly more isolated by his disease."},{"start":114.02000000000001,"end":114.34,"text":"Today,"},{"start":114.68,"end":117.3,"text":"Rodney can communicate with an on -screen keyboard,"},{"start":117.86,"end":118.6,"text":"play games,"},{"start":119.16,"end":122.34,"text":"and even take part in interviews via text messages."},{"start":123.28,"end":128.7,"text":"And he has contributed hugely to a technology which may\nhelp many people."},{"start":131.16,"end":132.56,"text":"It's been monumental."},{"start":132.76,"end":139.86,"text":"I don't think we would be anywhere if he hadn't taken\nthe brave step of volunteering and pioneering this\ntechnology."},{"start":140.52,"end":144.78,"t track":"RW","topic":"HEALTH SCIENCES","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article on page 164. Circle the main ideas.","pages":[163],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e43446d58214c7658220fff8c8118fc1222b6b8c0db719b7c6b5d22fc79eb5b3.png"],"provided":"","items":[{"id":"b8809.i01","label":"a","prompt":"Fossil fuels can transform into toxic particles in the air, which cause numerous health problems.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8809.i02","label":"b","prompt":"Reducing wildfires and the use of fossil fuels is essential to the fight against air pollution.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8809.i03","label":"c","prompt":"Asthma is one of the most common illnesses in children who live in polluted regions.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8809.i04","label":"d","prompt":"Some of the most vulnerable victims of air pollution related illnesses are children.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8809.i05","label":"e","prompt":"Some countries rely too much on fossil fuels.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8809.i06","label":"f","prompt":"Fossil fuels, which are a common source of energy, lead to air pollution.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8809.i07","label":"g","prompt":"Air pollution from wildfires creates health problems, even for people who are far away.","options":["Main idea","Not a main idea"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8809.i01","label":"a","prompt":"Fossil fuels can transform into toxic particles in the air, which cause numerous health problems.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8809.i02","label":"b","prompt":"Reducing wildfires and the use of fossil fuels is essential to the fight against air pollution.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8809.i03","label":"c","prompt":"Asthma is one of the most common illnesses in children who live in polluted regions.","options":["Main idea","Not a main idea"],"type":"choice/closed"}],[{"kind":"item","id":"b8809.i04","label":"d","prompt":"Some of the most vulnerable victims of air pollution related illnesses are children.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8809.i05","label":"e","prompt":"Some countries rely too much on fossil fuels.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8809.i06","label":"f","prompt":"Fossil fuels, which are a common source of energy, lead to air pollution.","options":["Main idea","Not a main idea"],"type":"choice/closed"}],[{"kind":"item","id":"b8809.i07","label":"g","prompt":"Air pollution from wildfires creates health problems, even for people who are far away.","options":["Main idea","Not a main idea"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U07-classroom:material:RW-M03","title":"READING 1","text":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.\n2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.\n3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.\n4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.\n5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.\n6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.\n7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","screens":["1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visib al threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.\n2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.\n3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.\n4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.\n5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.\n6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.\n7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to n s carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.","5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.","6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.","7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet."],"sources":[{"page":164,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2810b4b211e3d584276a231139daf8ffccca6e8da6bf3f607d18d12ddd848a1.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8ff82cbe8cfe0e96dd0148fd73742482d0a4d8bec00c014b2face46932feeca.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Dear Editor,\nI am writing out of concern that air pollution\nis impacting the health of my community. I\nwould like to suggest some steps that can\nbe taken to help prevent illnesses that arise\ndue to air pollution.\nFirst of all, there should be a local law\nagainst burning leaves, rubbish and yard\nwaste. The smoke that results from this\npractice not only harms the person doing it,\nbut may also damage the health of others\nwho live nearby.\nSecondly, local news organizations should\nalert residents on days when there is an\nespecially high chance of smog, wildfire\nsmoke or other form or air pollution. On\nthose days, people should be encouraged\nto stay indoors, or wear a protective mask\nif they have to be outside. Perhaps free\nmasks can be distributed to residents on a\nregular basis.\nFinally, people in our city need better\naccess to medical care. I suggest that the\ncity pay for a medical van that is staffed\nwith doctors, nurses and other healthcare\nprofessionals. The van should travel\nto different neighbourhoods, offering\ntreatment to anyone who is suffering from\nadverse effects related to air pollution.\nI realize that the steps mentioned above\nwill not solve the problem of air pollution-\nrelated illness entirely; however, I do\nbelieve they will help everyone in our\ncommunity stay healthier.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250 confined to","reliance","eradicate"],"type":"choice/closed"},{"kind":"item","id":"b8825.i04","label":"4","prompt":"Some diseases, such as diabetes, are ____ yet treatable; sufferers can still live relatively healthy lives.","options":["proximity","incurable","transmission","facilitate","surge","confined to","reliance","eradicate"],"type":"choice/closed"}],[{"kind":"item","id":"b8825.i05","label":"5","prompt":"Asthma is not ____ any one region; however, living somewhere with heavy air pollution can make it worse.","options":["proximity","incurable","transmission","facilitate","surge","confined to","reliance","eradicate"],"type":"choice/closed"},{"kind":"item","id":"b8825.i06","label":"6","prompt":"According to the World Health Organization, smallpox was ____ by the year 1980.","options":["proximity","incurable","transmission","facilitate","surge","confined to","reliance","eradicate"],"type":"choice/closed"}],[{"kind":"item","id":"b8825.i07","label":"7","prompt":"Poor hygiene ____ the spread of germs.","options":["proximity","incurable","transmission","facilitate","surge","confined to","reliance","eradicate"],"type":"choice/closed"},{"kind":"item","id":"b8825.i08","label":"8","prompt":"The residents who lived in ____ to the factory began to complain of headaches and dizziness.","options":["proximity","incurable","transmission","facilitate","surge","confined to","reliance","eradicate"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 surge 2 transmission 3 reliance 4 incurable\n5 confined to 6 eradicated 7 facilitates 8 proximity","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":56,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8828","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":24,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the article. Which statement best expresses the main idea?","pages":[168],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5bd639df99b13a4a27339a5ff9d70d0f421511e66d9701df7fedeb03dac6750d.png"],"provided":"","items":[{"id":"b8828.i01","label":"3","prompt":"Which statement best expresses the main idea?","options":["Plastic waste and mercury are the two most preventable forms of ocean pollution.","Plastic waste has surpassed mercury as the deadliest form of ocean pollution.","Ocean pollution from plastic waste and mercury pose a serious threat to public health.","If we do not reduce ocean pollution, marine life will suffer worse consequences than humans."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8828.i01","label":"3","prompt":"Which statement best expresses the main idea?","options":["Plastic waste and mercury are the two most preventable forms of ocean pollution.","Plastic waste has surpassed mercury as the deadliest form of ocean pollution.","Ocean pollution from plastic waste and mercury pose a serious threat to public health.","If we do not reduce ocean pollution, marine life will suffer worse consequences than humans."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.\n2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.\n3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,\ndigestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.\n4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.\n5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","screens":["# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.","2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.","3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,","digestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.","4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.","5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result."],"sources":[{"page":167,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/25d01de07a0dcdd2fd2aaa43038c5dd06b5219fe8e71d304e815a581179688fb.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66717ac240349345361f28be94b8e7aa02e6467f7c95cfac12c7ee303cd60bf6.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"c","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":56,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8829","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":25,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read paragraph 3 again. Use the phrases in the box to label the cause-and-effect chain.","pages":[168],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5bd639df99b13a4a27339a5ff9d70d0f421511e66d9701df7fedeb03dac6750d.png"],"provided":"consumed by fish\nmicroplastics\norgan damage, respiratory illness, cancer, etc.\nplastic decomposes; absorbs pollutants\nconsumed by humans","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"consumed by fish"},{"kind":"text","text":"microplastics"},{"kind":"text","text":"organ damage, respiratory illness, cancer, etc."},{"kind":"text","text":"plastic decomposes; absorbs pollutants"},{"kind":"text","text":"consumed by humans"}]],"courseMaterials":[{"id":"B05-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.\n2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.\n3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,\ndigestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.\n4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.\n5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","screens":["# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.","2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. m. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.","5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result."],"sources":[{"page":167,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/25d01de07a0dcdd2fd2aaa43038c5dd06b5219fe8e71d304e815a581179688fb.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66717ac240349345361f28be94b8e7aa02e6467f7c95cfac12c7ee303cd60bf6.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Microplastics may be called ‘the silent\nmenace’ because, even though they are\nsmall and seemingly insignificant, their\npotential to harm the ocean, marine\nlife and humans is enormous. Because\nmicroplastics are made up of such tiny\nfragments, they have the potential to\nspread far and wide without detection,\ncausing damage everywhere they exist.\n2 I would guess that lead is on the list\nbecause, historically, lead has been used\nin paint and other common products. As\na result, people may be exposed to it\nand suffer health consequences without\nrealizing the cause. I also predict that\nany chemical contained in pesticides\nis on the list because pesticides are a\nwidespread global problem.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8834","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":28,"module":"READING 2","ex":"7","context":{"moduleLabel":"READING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Reading 1 and Reading 2 to answer the following questions.","pages":[169],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a14dfca4dc4d6773fb7088c06ea987055924dfe0123f58ab1b1ace4850d1302.png"],"provided":"","items":[{"id":"b8834.i01","label":"1","prompt":"In your opinion, what is the most urgent pollution related threat to public health that is mentioned in the reading texts? Explain your answer.","options":[],"type":"discuss/open"},{"id":"b8834.i02","label":"2","prompt":"How do fossil fuels contribute to each type of pollution discussed in the reading texts?","options":[],"type":"discuss/open"},{"id":"b8834.i03","label":"3","prompt":"Reading 1 mentions that children are impacted by air pollution. What other groups may be especially vulnerable to pollution related illnesses? Explain your answer.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8834.i01","label":"1","prompt":"In your opinion, what is the most urgent pollution related threat to public health that is mentioned in the reading texts? Explain your answer.","options":[],"type":"discuss/open"},{"kind":"item","id":"b8834.i02","label":"2","prompt":"How do fossil fuels contribute to each type of pollution discussed in the reading texts?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8834.i03","label":"3","prompt":"Reading 1 mentions that children are impacted by air pollution. What other groups may be especially vulnerable to pollution related illnesses? Explain your answer.","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.\n2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.\n3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,\ndigestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.\n4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.\n5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result.","screens":["# HOW OCEAN POLLUTION AFFECTS HEALTH\n1 In many ways, the world's oceans pose a great mystery. Covering more than $70\\%$ of the earth, they remain largely unexplored and unseen by human eyes. Nevertheless, oceans around the globe are polluted by human activity. And while it may be easy to blame it on the fishing or shipping industries or on beaches piled with rubbish by too many tourists, the truth is that $80\\%$ of marine pollution originates on land. It is brought about by air pollution from urban factories, disease-carrying bacteria from agricultural regions and the plastic we use on a day-to-day basis. These pollutants not only harm marine life, but also promote the transmission of disease to humans. Ocean pollution is facilitating a public health crisis.","2 Plastic waste is the leading cause of sea pollution. Because it is lightweight and durable, plastic is used in countless ways in almost every aspect of our lives. To illustrate its pervasiveness, the nonprofit Plastic Oceans International estimates that, around the world, one million plastic bags are used every sixty seconds. Many are then thrown away. Research shows that, as of 2019, 460 million tonnes of plastic are produced per year and an astounding $0.5\\%$ of that finds its way into the ocean. The problem is so severe that Nikola Simpson of the United Nation's Development Programme warns that, if we don't reduce our reliance on plastic, plastic fragments may outnumber the fish in the sea by the middle of the twenty-first century.","3 How does plastic find its way to the ocean? Research suggests it is primarily carried by rivers. Imagine, for example, a plastic water bottle is inadequately disposed of in Budapest. That the landlocked city is 500 kilometres away from the coast makes no difference; its proximity to a river does. The river carries it out to sea. Along the way, the plastic decomposes, absorbing pesticides and other pollutants that were already present in the water. The plastic eventually breaks down into microplastics, categorized as fragments that are less than 5 millimetres in length, small enough for fish and shellfish to consume. Humans then eat the contaminated fish, allowing our bodies to also take in those tiny, toxic fragments. Research on the consequences of ingesting microplastics, which has been called ‘the silent menace’, points to cause for concern. A 2023 study in Environment & Health found evidence that microplastics can damage the liver, intestines and brain; they may also damage DNA. Additional research published in 2023 for the California State Legislature listed endocrine,","digestive and reproductive problems, as well as respiratory illnesses and cancer, as some of the health hazards of microplastics.","4 Another dangerous ocean pollutant is mercury, a naturally occurring element that comes from coal. When coal is burned as an energy source, mercury settles into the atmosphere. With the help of rain or snow, it is washed into rivers and carried to the ocean. Over time, fish may accumulate large amounts of mercury in their systems, which is then delivered to humans via the contaminated fish. As a neurotoxin, mercury can damage the nervous system. It may also harm the digestive and immune systems, as well as the lungs, kidneys, skin and eyes. Mercury poisoning puts adults at risk of incurable diseases such as heart disease and dementia. Tragically, the danger is not confined to adults. If an expectant mother consumes mercury, it can harm the developing brain of her unborn baby. The World Health Organization includes mercury in their top ten chemicals of public health concern.","5 Work must be done to reduce ocean pollution; however, the trend is heading in the wrong direction. Based on a 2023 study in the journal PLOS One, there has been a surge in ocean plastic pollution since 2005; that research estimated that approximately 171 trillion plastic particles are now present in the world's oceans. The United Nations Environment Programme is pushing for an 80% reduction in plastic use over the next 20 years. On the part of consumers, reusing and recycling are major steps toward reaching that goal. However, real change must occur at the root. Our global reliance on plastic must be minimized, forcing a decrease in production. Once that happens, we can begin the work of eradicating the illnesses that arise as a result."],"sources":[{"page":167,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/25d01de07a0dcdd2fd2aaa43038c5dd06b5219fe8e71d304e815a581179688fb.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U07-material:RW-M03","title":"READING 1","pages":[164],"text":"1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.\n2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.\n3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.\n4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.\n5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.\n6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have increased by up to 50% by the end of the 21st century.\n7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet.","screens":["1 It may be a familiar sight: a dull haze lingers over a city. The haze has a brownish quality and limits visibility, even as people go about their daily lives. While this may be a common scenario in some cities, it is important to know that air pollution in every form, whether visible as smog (a combination of the words smoke and fog) or invisible, poses a global threat to human health. Smog may not be present in every city, but data from the World Health Organization indicates that 99% of the world's population breathes polluted air. Globally, air pollution is one of the leading causes of chronic disease and premature death; in some","countries, it contributes to up to 10% of all deaths. There are several causes of air pollution, though they all stem from human activity.","2 Fossil fuels are energy sources that are extracted from plants and animals that have been fossilized – or preserved in rock – for hundreds of thousands of years or more. These extracts are converted into such energy sources as electricity, heat and gasoline. Everything from cars to homes to small businesses to gigantic industries relies on fossil fuels to generate energy. However, fossil fuels contain high levels of carbon, allowing carbon dioxide and other greenhouse gases to be emitted into the atmosphere. This creates air pollution.","3 How, then, does air pollution impact health? Take one example: fossil fuel powered vehicles. Cars, trucks and buses release poisonous chemicals into the air in the form of particulate matter, which is inhaled into the body by the simple act of breathing. And because the matter is smaller than a grain of sand, it can easily make its way into the bloodstream or lungs. This triggers adverse effects, including breathing difficulties and lung infections. People with existing health conditions are especially vulnerable to complications that arise from air pollution. Prolonged exposure can lead to lung cancer, heart disease and serious respiratory","illnesses. In short, air pollution impacts the global mortality rate, a fact that should raise the alarm for immediate action to be taken.","4 Another cause of air pollution is wildfires. Across the globe, climate change is evident. Temperatures are rising, resulting in warmer seasons that last longer and a ground that is drier than ever. One spark, whether from a carelessly thrown cigarette, a smouldering' campfire or a strike of lightning, can ignite a wildfire. The resulting smoke carries toxic particulate matter for potentially thousands of kilometres, exposing countless people to air pollution. Wildfire smoke also releases carbon monoxide. Breathing in this poisonous gas prevents sufficient oxygen from reaching the body's organs and tissues. Consequences include dizziness and","nausea. People also report feeling fatigue or 'brain fog' during wildfire season. One study has found that particulate matter can impact the attention span after only a few hours of exposure.","5 It is imperative that action be taken to counter the effects of air pollution. It is a health hazard for all humankind, but especially problematic for vulnerable populations. A California study found that children who were exposed to the smoky air of wildfires suffered from coughing, bronchitis, colds and other respiratory ailments. A 2020 report from the Centre for Research on Energy and Clean Air concluded that, as a result of air pollution, 16 million children live with asthma.","6 Reducing air pollution is key to improving public health. Countries like the United States, where 81% of the total energy is derived from fossil fuels, must phase out non-renewable energy sources and instead utilize sustainable sources such as solar and wind power. In the face of recent world events, reducing wildfires is urgent. In 2023 alone, over 800,000 acres of land burned in Chile, Canada experienced its most devastating fires in recorded history, and Spain reported that their wildfire season now lasts longer than ever. The United Nations Environment Programme provides a grim warning, predicting that extreme wildfires will have","increased by up to 50% by the end of the 21st century.","7 Air pollution is closely intertwined with public health; therefore, reducing the former will improve the latter. For this reason, it is essential to take steps now, especially if we want future generations to not only survive but thrive. Children should be able to grow up breathing clean air rather than being at the mercy of a dying planet."],"sources":[{"page":164,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2810b4b211e3d584276a231139daf8ffccca6e8da6bf3f607d18d12ddd848a1.png"}],"kind":"material","sourceBlockIds":["b8812"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66717ac240349345361f28be94b8e7aa02e6467f7c95cfac12c7ee303cd60bf6.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 In my opinion, the most urgent threat is\nair pollution that results from wildfires.\nWildfire smoke can spread quickly and\nto areas that are not even close to where\nthe wildfires are burning. As a result, the\ntoxic smoke has the potential to reach\nmany, many people and pollute their\nbodies with poisonous chemicals that\noriginated hundreds of kilometres away\nor more.\n2 Air pollution: burning fossil fuels often\nresults in tiny, poisonous particles being\nreleased into the air around us.\nWildfire smoke: the tiny particles\nemitted from burning fossil fuels are\npart of what makes up the smoke\nfrom wildfires, making the smoke even\nmore toxic.\nPlastic waste in the ocean: plastic is\nmade from chemicals created from\nfossil fuels; it is also manufactured\nby industries that burn fossil fuels\nfor energy.\nMercury poisoning: mercury is a result\nof burning coal and coal is a fossil fuel.\n3 Other than children, elderly people are\nprobably at risk from illnesses brought\nabout by pollution. If, for example, an\nelderly person gets a lung infection, they\nare less likely than a younger person to\nrecover completely. People with existing\nconditions such as asthma, heart disease\nor kidney problems are also more\nvulnerable, because pollution has the\npotential to make those illnesses worse.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8851","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. List the factors you have read about in this unit that have contributed to illnesses caused by pollution.","pages":[172],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/49812aa7ed4d15c796d9ed2eb3c35f2cc131033d41fe0555f40a2a4af6e26ff0.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"smog, fossil-fuelled vehicles, particulate\nmatter, carbon monoxide from wildfires,\nreliance on plastic, mercury, microplastics,\ncontaminated water, contaminated fish,\nharmful bacterial carried from agricultural\nregions in water supplies","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8852","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"You are going to write a case history of an illness caused or made worse by pollution. Read the case histories for three illnesses that have created global concern in recent years on page 173. Then work with a partner and discuss the ways in which all the illnesses are similar and how they differ.","pages":[172,173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/49812aa7ed4d15c796d9ed2eb3c35f2cc131033d41fe0555f40a2a4af6e26ff0.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6604cf12364e0921fb46877178aa396ef14eb011b757ae22db5c90f25e269959.png"],"provided":"Asthma\n\n- symptoms caused by inflammation and narrowing of small airways of the lungs\n- first case reported in a Chinese medical textbook dating back to 2600 BCE\n- more asthma related deaths occur in low- to middle-income countries, where diagnosis and treatment are not always accessible\n• affected 262 million people in 2019\n• responsible for 455,000 deaths in 2019\n• incurable but many treatments available\n• main treatment is an inhaler\n• symptoms: coughing, wheezing, shortness of breath, tightness in chest\n- cause: single cause has not been identified; exposure to air pollution in early life increases risk; air pollution makes symptoms worse\n\nLung cancer\n\n- first case reported in the mid-nineteenth century\n- most common in people ages 45–75\n- leading cause of cancer related deaths in the world\n• responsible for almost 10 million deaths in 2020\n- cure rate may be 80–90% if diagnosed early\n- treatment: depends on various factors; may include surgery, radiation, chemotherapy\n- symptoms: persistent cough, chest pain, shortness of breath, fatigue, frequent lung infections\n- cause: 85% of cases linked to smoking; air pollution another contributing factor and makes symptoms worse\n\nMercury poisoning\n\n• fatal cases first reported in 1865\n- was used on crops to kill fungus beginning in 1914; poisoning and food poisoning increased\n- different types of mercury: elemental, inorganic and organic\n- elemental and inorganic mercury found in everyday products: glass thermometers, fluorescent light bulbs, batteries\n- organic mercury: comes from fumes from burning coal and fish with high levels of mercury\n- exposure to some levels of mercury is unavoidable; too much exposure leads to mercury poisoning\n• high levels or prolonged exposure can result in death\n- is curable for some; depends on amount of damage it has caused\n- treatment: chelation therapy; uses medicine to remove buildup of mercury in system\n- symptoms: loss of peripheral vision, lack of coordination of movement, muscle weakness, trouble speaking, hearing or walking, shaking or tremors, memory problems; may cause permanent brain damage in unborn babies\n- most common cause: eating contaminated fish and shellfish","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Asthma"},{"kind":"text","text":"- symptoms caused by inflammation and narrowing of small airways of the lungs"},{"kind":"text","text":"- first case reported in a Chinese medical textbook dating back to 2600 BCE"},{"kind":"text","text":"- more asthma related deaths occur in low- to middle-income countries, where diagnosis and treatment are not always accessible"},{"kind":"text","text":"• affected 262 million people in 2019"},{"kind":"text","text":"• responsible for 455,000 deaths in 2019"}],[{"kind":"text","text":"• incurable but many treatments available"},{"kind":"text","text":"• main treatment is an inhaler"},{"kind":"text","text":"• symptoms: coughing, wheezing, shortness of breath, tightness in chest"},{"kind":"text","text":"- cause: single cause has not been identified; exposure to air pollution in early life increases risk; air pollution makes symptoms worse"},{"kind":"text","text":"Lung cancer"},{"kind":"text","text":"- first case reported in the mid-nineteenth century"}],[{"kind":"text","text":"- most common in people ages 45–75"},{"kind":"text","text":"- leading cause of cancer related deaths in the world"},{"kind":"text","text":"• responsible for almost 10 million deaths in 2020"},{"kind":"text","text":"- cure rate may be 80–90% if diagnosed early"},{"kind":"text","text":"- treatment: depends on various factors; may include surgery, radiation, chemotherapy"},{"kind":"text","text":"- symptoms: persistent cough, chest pain, shortness of breath, fatigue, frequent lung infections"}],[{"kind":"text","text":"- cause: 85% of cases linked to smoking; air pollution another contributing factor and makes symptoms worse"},{"kind":"text","text":"Mercury poisoning"},{"kind":"text","text":"• fatal cases first reported in 1865"},{"kind":"text","text":"- was used on crops to kill fungus beginning in 1914; poisoning and food poisoning increased"},{"kind":"text","text":"- different types of mercury: elemental, inorganic and organic"},{"kind":"text","text":"- elemental and inorganic mercury found in everyday products: glass thermometers, fluorescent light bulbs, batteries"}],[{"kind":"text","text":"- organic mercury: comes from fumes from burning coal and fish with high levels of mercury"},{"kind":"text","text":"- exposure to some levels of mercury is unavoidable; too much exposure leads to mercury poisoning"},{"kind":"text","text":"• high levels or prolonged exposure can result in death"},{"kind":"text","text":"- is curable for some; depends on amount of damage it has caused"},{"kind":"text","text":"- treatment: chelation therapy; uses medicine to remove buildup of mercury in system"}],[{"kind":"text","text":"- symptoms: loss of peripheral vision, lack of coordination of movement, muscle weakness, trouble speaking, hearing or walking, shaking or tremors, memory problems; may cause permanent brain damage in unborn babies"},{"kind":"text","text":"- most common cause: eating contaminated fish and shellfish"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Similarities\nPollution is a factor in each disease.\nLung cancer and mercury poisoning may be\ncurable if caught early enough.\nSeveral types of treatment are available for\neach illness.\nAll illnesses may be fatal.\nSome symptoms of asthma and lung cancer\nare similar: coughing, shortness of breath.\nDifferences\nThe factors that cause the diseases vary:\na single cause for asthma has not been\nidentified; most lung cancer illnesses are\nrelated to smoking; eating contaminated\nfish causes mercury poisoning.\nWhile lung cancer and mercury poisoning\nmay be curable, there is no cure for asthma.\nThe symptoms of mercury poisoning are\nvery different than the symptoms of asthma\nand lung cancer.\nThe time periods when the diseases first\nappeared vary greatly.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferen at the\nUniversity of Jordan, Amman.\n3 18 October 18 2023\n4 It is a medical journal.\n5 .org\n6  It is a trustworthy site because the article was\npublished in a well-known medical journal and the\nauthors are medical doctors, as well as faculty members\nat a well-known university.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U07-question:b8855","book":5,"unit":7,"track":"RW","topic":"HEALTH SCIENCES","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Do research using the sources you identified in Exercise 3. Write a case history for another pollution related illness in box D.","pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4aa1270599fa9a3a92b1c6082a2316e68340c1460611dc285bc271f1c7db227c.png"],"provided":"## D ____\n-  \n• ____\n- ____\n• ____\n- ____\n- ____\n- ____\n- ____\n- ____\n- ____","items":[{"id":"b8855.i01","label":"D title","prompt":"D ____","options":[],"type":"gap/open"},{"id":"b8855.i02","label":"1","prompt":"• ____","options":[],"type":"gap/open"},{"id":"b8855.i03","label":"2","prompt":"- ____","options":[],"type":"gap/open"},{"id":"b8855.i04","label":"3","prompt":"• ____","options":[],"type":"gap/open"},{"id":"b8855.i05","label":"4","prompt":"- ____","options":[],"type":"gap/open"},{"id":"b8855.i06","label":"5","prompt":"- ____","options":[],"type":"gap/open"},{"id":"b8855.i07","label":"6","prompt":"- ____","options":[],"type":"gap/open"},{"id":"b8855.i08","label":"7","prompt":"- ____","options":[],"type":"gap/open"},{"id":"b8855.i09","label":"8","prompt":"- ____","options":[],"type":"gap/open"},{"id":"b8855.i10","label":"9","prompt":"- ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U07-question:b8854","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[174]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8855.i01","label":"D title","prompt":"D ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Stroke\n• two types: ischemic (a blood clot in the\nbrain) and haemorrhagic (a blood vessel\nin the brain breaks open)\n• approximately 15 million people suffer\nfrom strokes globally every year\n• of the 15 million, approximately\n5 million die and 5 million are\npermanently disabled\n• air pollution can harden the arteries in\nthe brain, thicken the blood and raise\nblood pressure, all of which are risk\nfactors for stroke\n• both short-term exposure and long-term\nexposure to air pollution have been\nproven to increase the risk of stroke\n• other risk factors for stroke include\neating too many saturated fats, drinking\ntoo much alcohol, smoking and lack\nof exercise\n• stroke symptoms include: numbness\nor weakness of the face, arm or leg;\nconfusion; difficulty seeing; dizziness,\nloss of balance; headache\n• getting medical help as soon as\nsymptoms appear is important to the\npatient’s survival and recovery\n• treatment depends on severity of stroke:\nsome people may be permanently\ndisabled and require full-time care;\nothers may require physical therapy to\nregain speech and/or mobility\n• strokes are most common in people\naged 65 or older","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockans
