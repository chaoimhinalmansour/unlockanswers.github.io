energy source that makes all life on Earth\npossible."},{"start":9.62,"end":12.72,"text":"The Sun's energy comes from nuclear fusion reactions."},{"start":14.48,"end":16.12,"text":"Since the 1950s,"},{"start":16.52,"end":21.08,"text":"scientists around the world have been trying to\nrecreate its power on Earth."},{"start":21.58,"end":27.14,"text":"In other words, they want to design a power station\nwhich uses fusion reactions."},{"start":29.22,"end":34.34,"text":"With this technology, they say we could solve the\nworld's energy problems."},{"start":35.58,"end":40.24,"text":"Scientists have already made good progress at the Jet\nLaboratory in the UK."},{"start":41.26,"end":43.36,"text":"Inside a machine called a tokamak,"},{"start":43.78,"end":48.26,"text":"they've used nuclear fusion to create a small,\nartificial sun."},{"start":49.6,"end":50.1,"text":"However,"},{"start":50.56,"end":54.74,"text":"some people worry about nuclear energy and the dangers\nof an accident,"},{"start":55.06,"end":57.12,"text":"like Chernobyl or Fukushima,"},{"start":57.64,"end":63.12,"text":"but nuclear fusion is different from the nuclear\nfission used in today's power stations."},{"start":63.7,"end":65.74,"text":"Scientists say it is safe."},{"start":67.62,"end":70.14,"text":"Nuclear fusion involves joining atoms,"},{"start":70.68,"end":72.62,"text":"not splitting them like fission."},{"start":74.64,"end":78.08,"text":"It uses hydrogen molecules from seawater as fuel."},{"start":79.24,"end":83.94,"text":"For a fusion reaction, there must be extreme heat or\npressure or both,"},{"start":84.26,"end":87.26,"text":"and these conditions are very difficult to create."},{"start":89.12,"end":92.9,"text":"But if something goes wrong, a fusion reaction just\nstops."},{"start":94.66,"end":97.36,"text":"That means there can never be a nuclear accident."},{"start":99.34,"end":104.44,"text":"The hydrogen fuel used in nuclear fusion is almost\nunlimited on our planet,"},{"start":104.82,"end":109.28,"text":"and we only need a little of it compared with\ntraditional fuels."},{"start":111.1,"end":112.92,"text":"Fusion energy is clean,"},{"start":113.82,"end":113.84,"text":"too."},{"start":115.02000000000001,"end":116.92,"text":"There are zero carbon emissions."},{"start":117.4,"end":117.56,"text":"It's"},{"start":117.56,"end":117.74000000000001,"text":"no"},{"start":117.74000000000001,"end":123.64,"text":"surprise, then, that governments and private companies\nall around the world are working on this technology."},{"start":125.82,"end":131.2,"text":"The ITER project in France is building a tokamak twice\nas big as the one at Jet,"},{"start":131.84,"end":135.32,"text":"and at the National Ignition Facility in the United\nStates,"},{"start":135.62,"end":139.57999999999998,"text":"they use lasers as big as three football fields to\ncreate fusion."},{"start":141.12,"end":142.92000000000002,"text":"They achieved a huge breakthrough."},{"start":143.66,"end":146.62,"text":"For the first time in more than 60 years of research,"},{"start":147.4,"end":151.82,"text":"they produced more power from fusion than they used to\ncreate the reaction."},{"start":154.1,"end":157.62,"text":"But all the equipment developed so far is very\nexpensive."},{"start":159.04,"end":163.9,"text":"Fusion power needs to be cheap and efficient before it\ncan solve the energy problem."},{"start":165.5,"end":170.4,"text":"We're not there yet, but with so many top scientists\nracing to find the answers,"},{"start":170.8,"end":175.5,"text":"we could soon have the power to create all the cheap,\nclean energy we need."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"2","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":50,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[ de":"choice","option":4}},{"kind":"item","id":"b5052.i04","label":"4","prompt":"These plants can live in very difficult ____ where temperatures are low and there is very little water.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":0}}],[{"kind":"item","id":"b5052.i05","label":"5","prompt":"The human brain has an almost ____ memory capacity, far more than that of a computer.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":6}},{"kind":"item","id":"b5052.i06","label":"6","prompt":"If you want to be an engineer or a scientist, it's ____ that you have good qualifications in Science and Maths.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":1}}],[{"kind":"item","id":"b5052.i07","label":"7","prompt":"The engineer used diagrams to ____ his point about the mechanics of suspension bridges like the Golden Gate Bridge.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":3}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 harmful 2 range 3 prevent 4 conditions\n5 unlimited 6 essential 7 illustrate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U06-question:b5053","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"order":8,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Work with a partner. Discuss the questions.","pages":[128],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66ebad425d5c8e778af6f660994230e0345115929e8536699888409893877f36.png"],"provided":"","items":[{"id":"b5053.i01","label":"1","prompt":"Bio- is a prefix which means 'life'. What words do you know that start with bio-?","options":[],"type":"discuss/open"},{"id":"b5053.i02","label":"2","prompt":"Read the title and the first paragraph of the article on page 129. What do you think mimicry and biomimicry mean?","options":[],"type":"discuss/open"},{"id":"b5053.i03","label":"3","prompt":"Can you think of any inventions which copy their shape or function from something in nature?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5053.i01","label":"1","prompt":"Bio- is a prefix which means 'life'. What words do you know that start with bio-?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5053.i02","label":"2","prompt":"Read the title and the first paragraph of the article on page 129. What do you think mimicry and biomimicry mean?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5053.i03","label":"3","prompt":"Can you think of any inventions which copy their shape or function from something in nature?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d  a huge range of everyday products, from clothing to cars.\n2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.\n3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.\n4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]\ncan see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","screens":["To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.","2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.","3 Another example comes from the ocean where mussels can stick to surfaces even when the l":"3","prompt":"Clearly, this technology offers the film industry many benefits."},{"kind":"item","label":"4","prompt":"Deepfakes can also threaten privacy."},{"kind":"item","label":"5","prompt":"Finally, deepfakes can be used to spread false information."},{"kind":"item","label":"6","prompt":"Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities."}]],"courseMaterials":[{"id":"B03-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.\n2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.\n3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.\n5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","screens":["1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.","2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.","3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.","5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly."],"sources":[{"page":133,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png","width":772,"height":1040}],"kind":"reading"},{"id":"B03-RW-U06-publisher-page:p133","title":"原题或核对备注所引第133页","pages":[133],"text":"","screens":[],"sources":[{"page":133,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3663f172862b4da6.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"c s":"The internet helps to spread information and ideas around the world.","anchor":{"kind":"line"}}]}},{"id":"B03-RW-U06-classroom:resource:b5037","book":3,"unit":6,"topic":"DISCOVERY AND INVENTION","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[124],"sourcePages":[124],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4eea9e604f97b1e60deac5330975d12aca03c9b80ca26c27a6592e8e01a5e47b.png"],"sourceHashes":["4eea9e604f97b1e60deac5330975d12aca03c9b80ca26c27a6592e8e01a5e47b"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write an explanatory essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about Nuclear Fusion."},{"label":"Reading skill","text":"Scan to find information."},{"label":"Critical thinking","text":"Analyze advantages and disadvantages."},{"label":"Grammar","text":"Make predictions with modals and adverbs of certainty; use relative clauses; use nouns with dependent prepositions: advantages and disadvantages."},{"label":"Academic writing skill","text":"Write an introductory paragraph (hook, background information, thesis statement)."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":124,"alt":""}}]}},{"id":"B03-RW-U06-classroom:resource:b5043","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/636d92039f80f2f7d3956f2a8c4d390fc6a26b6d38ed82227857c8e2119c1298.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"reaction","pos":"(n)","definition":"a change that occurs when two chemicals are mixed together","example":"Mixing the two liquids caused a chemical reaction.","wordAudio":"reaction","cardWord":false},{"term":"recreate","pos":"(v)","definition":"to make something exist or happen again","example":"The team tried to recreate the conditions of the first experiment.","wordAudio":"recreate","cardWord":false},{"term":"power station","pos":"(n)","definition":"a factory that produces electricity","example":"The new power station supplies electricity to nearby towns.","wordAudio":"power station","cardWord":false},{"term":"pressure","pos":"(n)","definition":"the force or weight that is put against something","example":"The pressure of the water pushed against the gate.","wordAudio":"pressure","cardWord":false},{"term":"unlimited","pos":"(adj)","definition":"having the greatest possible amount","example":"Members get unlimited access to the library.","wordAudio":"unlimited","cardWord":false},{"term":"breakthrough","pos":"(n)","definition":"an important discovery that helps solve a problem","example":"The discovery was a breakthrough for the research team.","wordAudio":"breakthrough","cardWord":false}]]}},{"id":"B03-RW-U06-classroom:video","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b7b6b3314c96be550e74ac2b58bd40619cb7b1cd40a31766610b23b4e844054.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/615c2792578eddc0210286f2-L3RW-U06.mp4","captions":[{"start":0.78,"end":3.54,"text":"The Awesome Power of the Sun."},{"start":4.96,"end":8.24,"text":"It's the energy source that makes all life on Earth\npossible."},{"start":9.62,"end":12.72,"text":"The Sun's energy comes from nuclear fusion reactions."},{"start":14.48,"end":16.12,"text":"Since the 1950s,"},{"start":16.52,"end":21.08,"text":"scientists around the world have been trying to\nrecreate its power on Earth."},{"start":21.58,"end":27.14,"text":"In other words, they want to design a power station\nwhich uses fusion reactions."},{"start":29.22,"end":34.34,"text":"With this technology, they say we could solve the\nworld's energy problems."},{"start":35.58,"end":40.24,"text":"Scientists have already made good progress at the Jet\nLaboratory in the UK."},{"start":41.26,"end":43.36,"text":"Inside a machine called a tokamak,"},{"start":43.78,"end":48.26,"text":"they've used nuclear fusion to create a small,\nartificial sun."},{"start":49.6,"end":50.1,"text":"However,"},{"start":50.56,"end":54.74,"text":"some people worry about nuclear energy and the dangers\nof an accident,"},{"start":55.06,"end":57.12,"text":"like Chernobyl or Fukushima,"},{"start":57.64,"end":63.12,"text":"but nuclear fusion is different from the nuclear\nfission used in today's power stations."},{"start":63.7,"end":65.74,"text":"Scientists say it is safe."},{"start":67.62,"end":70.14,"text":"Nuclear fusion involves joining atoms,"},{"start":70.68,"end":72.62,"text":"not splitting them like fission."},{"start":74.64,"end":78.08,"text":"It uses hydrogen molecules from seawater as fuel."},{"start":79.24,"end":83.94,"text":"For a fusion reaction, there must be extreme heat or\npressure or both,"},{"start":84.26,"end":87.26,"text":"and these conditions are very difficult to create."},{"start":89.12,"end":92.9,"text":"But if something goes wrong, a fusion reaction just\nstops."},{"start":94.66,"end":97.36,"text":"That means there can never be a nuclear accident."},{"start":99.34,"end":104.44,"text":"The hydrogen fuel used in nuclear fusion is almost\nunlimited on our planet,"},{"start":104.82,"end":109.28,"text":"and we only need a little of it compared with\ntraditional fuels."},{"start":111.1,"end":112.92,"text":"Fusion energy is clean,"},{"start":113.82,"end":113.84,"text":"too."},{"start":115.02000000000001,"end":116.92,"text":"There are zero carbon emissions."},{"start":117.4,"end":117.56,"text":"It's"},{"start":117.56,"end":117.74000000000001,"text":"no"},{"start":117.74000000000001,"end":123.64,"text":"surprise, then, that governments and private companies\nall around the world are working on this technology."},{"start":125.82,"end":131.2,"text":"The ITER project in France is building a tokamak twice\nas big as the one at Jet,"},{"start":131.84,"end":135.32,"text":"and at the National Ignition Facility in the United\nStates,"},{"start":135.62,"end":139.57999999999998,"text":"they use lasers as big as three football fields to\ncreate fusion."},{"start":141.12,"end":142.92000000000002,"text":"They achieved a huge breakthrough."},{"start":143.66,"end":146.62,"text":"For the first time in more than 60 years of research,"},{"start":147.4,"end":151.82,"text":"they produced more power from fusion than they used to\ncreate the reaction."},{"start":154.1,"end":157.62,"text":"But all the equipment developed so far is very\nexpensive."},{"start":159.04,"end":163.9,"text":"Fusion power needs to be cheap and efficient before it\ncan solve the energy problem."},{"start":165.5,"end":170.4,"text":"We're not there yet, but with so many top scientists\nracing to find the answers,"},{"start":170.8,"end":175.5,"text":"we could soon have the power to create all the cheap,\nclean energy we need."}],"launchInline":true}},{"id":"B03-RW-U06-classroom:resource:b5051","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[128],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66ebad425d5c8e778af6f660994230e0345115929e8536699888409893877f36.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["conditions (n) the physical situation that something is in\nessential (adj) very important or necessary\nharmful (adj) able to hurt or damage\nillustrate (v) to show the meaning or truth of something more clearly, especially by giving examples","prevent (v) to stop something from happening or stop someone from doing something\nrange (n) a set of similar things\nunlimited (adj) without end or restriction"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U06-classroom:material:RW-M03","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[129],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10917fb9e84113b11ed831830c7fa24faaba6c0203ad06f6c4341e8acf6fe8f9.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.","sourcePage":129},{"body":"2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.","sourcePage":129},{"body":"3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.","sourcePage":129},{"body":"4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]","sourcePage":129},{"body":"can see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","sourcePage":129}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U06-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":129,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10917fb9e84113b11ed831830c7fa24faaba6c0203ad06f6c4341e8acf6fe8f9.png","width":772,"height":1040}],"source":129,"embeddedIn":null,"photo":null,"clearPages":[{"body":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.","sourcePage":129},{"body":"2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.","sourcePage":129},{"body":"3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.","sourcePage":129},{"body":"4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]","sourcePage":129},{"body":"can see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","sourcePage":129}],"text":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.\n2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.\n3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.\n4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]\ncan see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3bd46e4cfc5b3992.mp3"},"original":{"id":"B03-RW-U06-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U06","book":3,"track":"RW","unit":6,"title":"READING 1","kind":"material","pages":[129],"sourceImages":[{"page":129,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10917fb9e84113b11ed831830c7fa24faaba6c0203ad06f6c4341e8acf6fe8f9.png","viewEvidenceReported":true}],"text":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.\n\n2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.\n\n3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n\n[IMAGE_1]\n\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.\n\n4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n\n[IMAGE_2]\n\ncan see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n\n¹adhesive (n) a material that can make things stick together","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5054"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3bd46e4cfc5b3992.mp3","continueOnPage":true}},{"id":"B03-RW-U06-classroom:material:RW-M04","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.","sourcePage":133},{"body":"2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.","sourcePage":133},{"body":"3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.","sourcePage":133},{"body":"5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","sourcePage":133}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":133,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png","width":772,"height":1040}],"source":133,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.","sourcePage":133},{"body":"2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.","sourcePage":133},{"body":"3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.","sourcePage":133},{"body":"5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","sourcePage":133}],"text":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.\n2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.\n3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.\n5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3663f172862b4da6.mp3"},"original":{"id":"B03-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U06","book":3,"track":"RW","unit":6,"title":"READING 2","kind":"material","pages":[133],"sourceImages":[{"page":133,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png","viewEvidenceReported":true}],"text":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.\n\n2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.\n\n3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.\n\n5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5075"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3663f172862b4da6.mp3","continueOnPage":true}},{"id":"B03-RW-U06-classroom:review-1","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef18918b28c4c3193651e
