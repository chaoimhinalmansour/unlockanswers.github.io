energy source that makes all life on Earth\npossible."},{"start":9.62,"end":12.72,"text":"The Sun's energy comes from nuclear fusion reactions."},{"start":14.48,"end":16.12,"text":"Since the 1950s,"},{"start":16.52,"end":21.08,"text":"scientists around the world have been trying to\nrecreate its power on Earth."},{"start":21.58,"end":27.14,"text":"In other words, they want to design a power station\nwhich uses fusion reactions."},{"start":29.22,"end":34.34,"text":"With this technology, they say we could solve the\nworld's energy problems."},{"start":35.58,"end":40.24,"text":"Scientists have already made good progress at the Jet\nLaboratory in the UK."},{"start":41.26,"end":43.36,"text":"Inside a machine called a tokamak,"},{"start":43.78,"end":48.26,"text":"they've used nuclear fusion to create a small,\nartificial sun."},{"start":49.6,"end":50.1,"text":"However,"},{"start":50.56,"end":54.74,"text":"some people worry about nuclear energy and the dangers\nof an accident,"},{"start":55.06,"end":57.12,"text":"like Chernobyl or Fukushima,"},{"start":57.64,"end":63.12,"text":"but nuclear fusion is different from the nuclear\nfission used in today's power stations."},{"start":63.7,"end":65.74,"text":"Scientists say it is safe."},{"start":67.62,"end":70.14,"text":"Nuclear fusion involves joining atoms,"},{"start":70.68,"end":72.62,"text":"not splitting them like fission."},{"start":74.64,"end":78.08,"text":"It uses hydrogen molecules from seawater as fuel."},{"start":79.24,"end":83.94,"text":"For a fusion reaction, there must be extreme heat or\npressure or both,"},{"start":84.26,"end":87.26,"text":"and these conditions are very difficult to create."},{"start":89.12,"end":92.9,"text":"But if something goes wrong, a fusion reaction just\nstops."},{"start":94.66,"end":97.36,"text":"That means there can never be a nuclear accident."},{"start":99.34,"end":104.44,"text":"The hydrogen fuel used in nuclear fusion is almost\nunlimited on our planet,"},{"start":104.82,"end":109.28,"text":"and we only need a little of it compared with\ntraditional fuels."},{"start":111.1,"end":112.92,"text":"Fusion energy is clean,"},{"start":113.82,"end":113.84,"text":"too."},{"start":115.02000000000001,"end":116.92,"text":"There are zero carbon emissions."},{"start":117.4,"end":117.56,"text":"It's"},{"start":117.56,"end":117.74000000000001,"text":"no"},{"start":117.74000000000001,"end":123.64,"text":"surprise, then, that governments and private companies\nall around the world are working on this technology."},{"start":125.82,"end":131.2,"text":"The ITER project in France is building a tokamak twice\nas big as the one at Jet,"},{"start":131.84,"end":135.32,"text":"and at the National Ignition Facility in the United\nStates,"},{"start":135.62,"end":139.57999999999998,"text":"they use lasers as big as three football fields to\ncreate fusion."},{"start":141.12,"end":142.92000000000002,"text":"They achieved a huge breakthrough."},{"start":143.66,"end":146.62,"text":"For the first time in more than 60 years of research,"},{"start":147.4,"end":151.82,"text":"they produced more power from fusion than they used to\ncreate the reaction."},{"start":154.1,"end":157.62,"text":"But all the equipment developed so far is very\nexpensive."},{"start":159.04,"end":163.9,"text":"Fusion power needs to be cheap and efficient before it\ncan solve the energy problem."},{"start":165.5,"end":170.4,"text":"We're not there yet, but with so many top scientists\nracing to find the answers,"},{"start":170.8,"end":175.5,"text":"we could soon have the power to create all the cheap,\nclean energy we need."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"2","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":50,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[ de":"choice","option":4}},{"kind":"item","id":"b5052.i04","label":"4","prompt":"These plants can live in very difficult ____ where temperatures are low and there is very little water.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":0}}],[{"kind":"item","id":"b5052.i05","label":"5","prompt":"The human brain has an almost ____ memory capacity, far more than that of a computer.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":6}},{"kind":"item","id":"b5052.i06","label":"6","prompt":"If you want to be an engineer or a scientist, it's ____ that you have good qualifications in Science and Maths.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":1}}],[{"kind":"item","id":"b5052.i07","label":"7","prompt":"The engineer used diagrams to ____ his point about the mechanics of suspension bridges like the Golden Gate Bridge.","options":["conditions","essential","harmful","illustrate","prevent","range","unlimited"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":3}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 harmful 2 range 3 prevent 4 conditions\n5 unlimited 6 essential 7 illustrate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U06-question:b5053","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"order":8,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Work with a partner. Discuss the questions.","pages":[128],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66ebad425d5c8e778af6f660994230e0345115929e8536699888409893877f36.png"],"provided":"","items":[{"id":"b5053.i01","label":"1","prompt":"Bio- is a prefix which means 'life'. What words do you know that start with bio-?","options":[],"type":"discuss/open"},{"id":"b5053.i02","label":"2","prompt":"Read the title and the first paragraph of the article on page 129. What do you think mimicry and biomimicry mean?","options":[],"type":"discuss/open"},{"id":"b5053.i03","label":"3","prompt":"Can you think of any inventions which copy their shape or function from something in nature?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5053.i01","label":"1","prompt":"Bio- is a prefix which means 'life'. What words do you know that start with bio-?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5053.i02","label":"2","prompt":"Read the title and the first paragraph of the article on page 129. What do you think mimicry and biomimicry mean?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5053.i03","label":"3","prompt":"Can you think of any inventions which copy their shape or function from something in nature?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d  a huge range of everyday products, from clothing to cars.\n2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.\n3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.\n4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]\ncan see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","screens":["To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.","2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.","3 Another example comes from the ocean where mussels can stick to surfaces even when the 3f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U06-question:b5077","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":2,"order":23,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the first sentence of each paragraph of the article on page 133 to answer the question.","pages":[134],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/109742336cf409d8b306cf00419ef9e721cffb0d41e3990746176816bd9b010a.png"],"provided":"Do you think the author's view of deepfake technology is more positive or more negative? Explain your answer to a partner.","items":[{"id":"b5077.i01","label":"1","prompt":"Do you think the author's view of deepfake technology is more positive or more negative? Explain your answer to a partner.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Do you think the author's view of deepfake technology is more positive or more negative? Explain your answer to a partner."}]],"courseMaterials":[{"id":"B03-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.\n2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.\n3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.\n5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We b ges."},{"label":"Grammar","text":"Make predictions with modals and adverbs of certainty; use relative clauses; use nouns with dependent prepositions: advantages and disadvantages."},{"label":"Academic writing skill","text":"Write an introductory paragraph (hook, background information, thesis statement)."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":124,"alt":""}}]}},{"id":"B03-RW-U06-classroom:resource:b5043","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/636d92039f80f2f7d3956f2a8c4d390fc6a26b6d38ed82227857c8e2119c1298.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"reaction","pos":"(n)","definition":"a change that occurs when two chemicals are mixed together","example":"Mixing the two liquids caused a chemical reaction.","wordAudio":"reaction","cardWord":false},{"term":"recreate","pos":"(v)","definition":"to make something exist or happen again","example":"The team tried to recreate the conditions of the first experiment.","wordAudio":"recreate","cardWord":false},{"term":"power station","pos":"(n)","definition":"a factory that produces electricity","example":"The new power station supplies electricity to nearby towns.","wordAudio":"power station","cardWord":false},{"term":"pressure","pos":"(n)","definition":"the force or weight that is put against something","example":"The pressure of the water pushed against the gate.","wordAudio":"pressure","cardWord":false},{"term":"unlimited","pos":"(adj)","definition":"having the greatest possible amount","example":"Members get unlimited access to the library.","wordAudio":"unlimited","cardWord":false},{"term":"breakthrough","pos":"(n)","definition":"an important discovery that helps solve a problem","example":"The discovery was a breakthrough for the research team.","wordAudio":"breakthrough","cardWord":false}]]}},{"id":"B03-RW-U06-classroom:video","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b7b6b3314c96be550e74ac2b58bd40619cb7b1cd40a31766610b23b4e844054.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/615c2792578eddc0210286f2-L3RW-U06.mp4","captions":[{"start":0.78,"end":3.54,"text":"The Awesome Power of the Sun."},{"start":4.96,"end":8.24,"text":"It's the energy source that makes all life on Earth\npossible."},{"start":9.62,"end":12.72,"text":"The Sun's energy comes from nuclear fusion reactions."},{"start":14.48,"end":16.12,"text":"Since the 1950s,"},{"start":16.52,"end":21.08,"text":"scientists around the world have been trying to\nrecreate its power on Earth."},{"start":21.58,"end":27.14,"text":"In other words, they want to design a power station\nwhich uses fusion reactions."},{"start":29.22,"end":34.34,"text":"With this technology, they say we could solve the\nworld's energy problems."},{"start":35.58,"end":40.24,"text":"Scientists have already made good progress at the Jet\nLaboratory in the UK."},{"start":41.26,"end":43.36,"text":"Inside a machine called a tokamak,"},{"start":43.78,"end":48.26,"text":"they've used nuclear fusion to create a small,\nartificial sun."},{"start":49.6,"end":50.1,"text":"However,"},{"start":50.56,"end":54.74,"text":"some people worry about nuclear energy and the dangers\nof an accident,"},{"start":55.06,"end":57.12,"text":"like Chernobyl or Fukushima,"},{"start":57.64,"end":63.12,"text":"but nuclear fusion is different from the nuclear\nfission used in today's power stations."},{"start":63.7,"end":65.74,"text":"Scientists say it is safe."},{"start":67.62,"end":70.14,"text":"Nuclear fusion involves joining atoms,"},{"start":70.68,"end":72.62,"text":"not splitting them like fission."},{"start":74.64,"end":78.08,"text":"It uses hydrogen molecules from seawater as fuel."},{"start":79.24,"end":83.94,"text":"For a fusion reaction, there must be extreme heat or\npressure or both,"},{"start":84.26,"end":87.26,"text":"and these conditions are very difficult to create."},{"start":89.12,"end":92.9,"text":"But if something goes wrong, a fusion reaction just\nstops."},{"start":94.66,"end":97.36,"text":"That means there can never be a nuclear accident."},{"start":99.34,"end":104.44,"text":"The hydrogen fuel used in nuclear fusion is almost\nunlimited on our planet,"},{"start":104.82,"end":109.28,"text":"and we only need a little of it compared with\ntraditional fuels."},{"start":111.1,"end":112.92,"text":"Fusion energy is clean,"},{"start":113.82,"end":113.84,"text":"too."},{"start":115.02000000000001,"end":116.92,"text":"There are zero carbon emissions."},{"start":117.4,"end":117.56,"text":"It's"},{"start":117.56,"end":117.74000000000001,"text":"no"},{"start":117.74000000000001,"end":123.64,"text":"surprise, then, that governments and private companies\nall around the world are working on this technology."},{"start":125.82,"end":131.2,"text":"The ITER project in France is building a tokamak twice\nas big as the one at Jet,"},{"start":131.84,"end":135.32,"text":"and at the National Ignition Facility in the United\nStates,"},{"start":135.62,"end":139.57999999999998,"text":"they use lasers as big as three football fields to\ncreate fusion."},{"start":141.12,"end":142.92000000000002,"text":"They achieved a huge breakthrough."},{"start":143.66,"end":146.62,"text":"For the first time in more than 60 years of research,"},{"start":147.4,"end":151.82,"text":"they produced more power from fusion than they used to\ncreate the reaction."},{"start":154.1,"end":157.62,"text":"But all the equipment developed so far is very\nexpensive."},{"start":159.04,"end":163.9,"text":"Fusion power needs to be cheap and efficient before it\ncan solve the energy problem."},{"start":165.5,"end":170.4,"text":"We're not there yet, but with so many top scientists\nracing to find the answers,"},{"start":170.8,"end":175.5,"text":"we could soon have the power to create all the cheap,\nclean energy we need."}],"launchInline":true}},{"id":"B03-RW-U06-classroom:resource:b5051","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[128],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/66ebad425d5c8e778af6f660994230e0345115929e8536699888409893877f36.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["conditions (n) the physical situation that something is in\nessential (adj) very important or necessary\nharmful (adj) able to hurt or damage\nillustrate (v) to show the meaning or truth of something more clearly, especially by giving examples","prevent (v) to stop something from happening or stop someone from doing something\nrange (n) a set of similar things\nunlimited (adj) without end or restriction"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U06-classroom:material:RW-M03","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[129],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10917fb9e84113b11ed831830c7fa24faaba6c0203ad06f6c4341e8acf6fe8f9.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.","sourcePage":129},{"body":"2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.","sourcePage":129},{"body":"3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.","sourcePage":129},{"body":"4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]","sourcePage":129},{"body":"can see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","sourcePage":129}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U06-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":129,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10917fb9e84113b11ed831830c7fa24faaba6c0203ad06f6c4341e8acf6fe8f9.png","width":772,"height":1040}],"source":129,"embeddedIn":null,"photo":null,"clearPages":[{"body":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.","sourcePage":129},{"body":"2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.","sourcePage":129},{"body":"3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.","sourcePage":129},{"body":"4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]","sourcePage":129},{"body":"can see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","sourcePage":129}],"text":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.\n2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.\n3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n[IMAGE_1]\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.\n4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n[IMAGE_2]\ncan see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n¹adhesive (n) a material that can make things stick together","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3bd46e4cfc5b3992.mp3"},"original":{"id":"B03-RW-U06-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U06","book":3,"track":"RW","unit":6,"title":"READING 1","kind":"material","pages":[129],"sourceImages":[{"page":129,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10917fb9e84113b11ed831830c7fa24faaba6c0203ad06f6c4341e8acf6fe8f9.png","viewEvidenceReported":true}],"text":"To mimic people means to copy their speech, dress or behaviour. In contrast, in science, mimic means copying ideas from nature or natural processes to prevent or solve problems or to create helpful products. The influence of this so-called biomimicry can be seen in a huge range of everyday products, from clothing to cars.\n\n2 Perhaps the best-known example of biomimicry is Velcro®. It was invented in 1941 by a Swiss engineer called George de Mestral. One day, Mestral noticed the burdock seeds that stuck to his dog's hair. Under the microscope, he discovered that these seeds had hooks on them, so they stuck to loops on clothing or hair. Mestral copied this idea and created two strips of material: one with tiny hooks and the other with loose loops. When he put both strips together, they stuck like glue. However, unlike with glue, he could peel the strips apart and reattach them. Velcro® was initially unpopular with fashion companies, but after it was used by NASA to stop items from floating in space, it became popular with children's clothing companies. Today, it is used to fasten everything from lunch bags to shoes.\n\n3 Another example comes from the ocean where mussels can stick to surfaces even when the water is moving very fast around them. Mussels produce a very strong adhesive¹ that works in wet conditions\n\n[IMAGE_1]\n\nScientists were able to copy this material and found that it was three times stronger than other underwater adhesives. Another advantage is that it will not hurt the environment.\n\n4 For NASA, protecting astronauts' eyes from the sun's rays is very important, but protecting their eyes from other dangerous radiation is also essential. Scientists studied how eagles and falcons clearly recognize their prey. Scientists discovered that the birds have yellow oil in their eyes, which filters out harmful radiation and allows them to see very clearly. NASA copied this oil, and it is now used by astronauts and pilots in Eagle Eyes® glasses. In addition to protecting eyes from dangerous rays, these sunglasses also improve vision in different weather conditions such as fog, sunlight or just normal light.\n\n5 For birds, cities full of tall glass buildings are a problem. Spider's webs may be the solution. Birds cannot see the glass, so more than a billion of them fly into buildings and die every year. However, they\n\n[IMAGE_2]\n\ncan see spider's webs and they try to avoid them. So, engineers have used this idea in the invention of a new kind of window. These windows have tiny lines on them that look like spider's webs. Birds can see them, but the lines are so thin that humans cannot see them easily. It is likely that we will see these bird-friendly windows on more buildings in the future, and as a result, a significant drop in bird deaths.\n\n6 As these examples illustrate, biomimicry appears to have an unlimited number of applications. It will be interesting to see which problems nature helps us solve in the future.\n\n¹adhesive (n) a material that can make things stick together","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5054"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3bd46e4cfc5b3992.mp3","continueOnPage":true}},{"id":"B03-RW-U06-classroom:material:RW-M04","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.","sourcePage":133},{"body":"2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.","sourcePage":133},{"body":"3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.","sourcePage":133},{"body":"5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","sourcePage":133}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":133,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png","width":772,"height":1040}],"source":133,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.","sourcePage":133},{"body":"2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.","sourcePage":133},{"body":"3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.","sourcePage":133},{"body":"5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","sourcePage":133}],"text":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.\n2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.\n3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.\n5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3663f172862b4da6.mp3"},"original":{"id":"B03-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U06","book":3,"track":"RW","unit":6,"title":"READING 2","kind":"material","pages":[133],"sourceImages":[{"page":133,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/887c661e16c643cb8d4fcba86ea8a019d0a312737d48ce34f9bd803c2f39875e.png","viewEvidenceReported":true}],"text":"1 You have probably already seen something like this online: the head of one actor on the body of a completely different actor. This type of image is created by a computer, and it is called a deepfake. Deepfakes use a form of artificial intelligence in which a computer model is trained to use information in the same way as the human brain. It can create images and voices that look and sound almost like real people, including actors, politicians and other famous people. In the past, only experts were able to use this technology, but now anyone can create a deepfake. This is causing both excitement and worry.\n\n2 The most familiar use of deepfakes is in entertainment. For example, deepfake technology can make actors in films look much younger. It works much better than make-up! Directors can also use it to produce the image or voice of actors who are not available. For example, a director may discover a mistake and want to film a scene again, but the actors are already working on other projects. The scene can be recreated by artificial intelligence without the live actors. How? Deepfake technology uses the rest of the film to “learn” the actors’ appearance, speech and movement. It can even recreate actors who are dead.\n\n3 Clearly, this technology offers the film industry many benefits. However, this technology also creates problems. Today, so much of our lives are online. What if someone creates a deepfake of you? Could it be used to get access to your bank account? Your health records? In 2020, thieves created a deepfake voice of a bank manager in the United Arab Emirates. They used it to steal $35 million! As the technology improves, these threats to security will definitely increase.\n\n4 Deepfakes can also threaten privacy. Our personal information, including photos, is often available on the internet. Someone could use your photo and put it on someone else's body. Some celebrities have already found their own images on the internet. They are doing things they never did and saying things they never said! This can be embarrassing or even dangerous. It is very difficult to control these images once they appear on the internet.\n\n5 Finally, deepfakes can be used to spread false information. Today, when we watch the news on television or online, we generally believe everything is real. We believe that the heads, bodies and voices all belong to the same, real people. As deepfake technology improves, however, that will probably change. We will not be able to trust what we see and hear because it could be fake. Deepfakes can change today's news, but they may also change history. For example, someone could \"discover\" a \"lost\" video of a famous person saying terrible things. Deepfakes may change how we view our world, and our past.\n\n6 Although this technology offers important benefits to the entertainment industry, it also presents some frightening possibilities. Experts advise that we should use the same tool – artificial intelligence – to tackle these problems and make sure that this technology is used responsibly.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5075"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_3663f172862b4da6.mp3","continueOnPage":true}},{"id":"B03-RW-U06-classroom:review-1","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ef18918b28c4c3193651ec6c909c6c678ca7d4fde5d4fc134d99990ea2966357.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-RW-U06-B-002","form":"conditions","page":145},{"id":"B03-RW-U06-B-003","form":"dehumanize","page":145},{"id":"B03-RW-U06-B-004","form":"disorganized","page":145},{"id":"B03-RW-U06-B-005","form":"essential","page":145},{"id":"B03-RW-U06-B-006","form":"harmful","page":145},{"id":"B03-RW-U06-B-007","form":"illustrate","page":145},{"id":"B03-RW-U06-B-011","form":"preview","page":145},{"id":"B03-RW-U06-B-013","form":"range","page":145},{"id":"B03-RW-U06-B-014","form":"rethink","page":145},{"id":"B03-RW-U06-B-017","form":"translate","page":145},{"id":"B03-RW-U06-B-018","form":"unlimited","page":145},{"id":"B03-RW-U06-B-019","form":"unsafe","page":145}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U06-classroom:review-2","book":3,"unit":6,"track":"RW","topic":"DISCOVERY AND INVENTION","lesson":2,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":[ function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
