tem","id":"b8596.i02","label":"2","prompt":"What do you think the man in the picture's job is?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8596.i03","label":"3","prompt":"Do you think the man is successful at his job? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 There are lots of models made from\nblocks so the video will talk about\nbuilding blocks, probably Lego.\n2 He might design some of the\ndifferent types of model sets that the\ncompany sells.\n3 If he is doing something that he enjoys\nand he is able to make a living from it,\nthen he is successful.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[{"page":112,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5727a99620fd8632512930f46b6f4fa800a1a1d141fffe717753b05429ebed70.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8601","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video and take notes. Circle the ideas you hear.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2370ae6b18ef10c70a9585e8f674cfaccb060fc723817a87f0800adc05ec304.png"],"provided":"","items":[{"id":"b8601.i01","label":"1","prompt":"Watch the video and take notes. Circle the ideas you hear.","options":["According to psychologists, Lego is popular because it is easy to make things from.","Nathan's work is difficult to transport to other countries.","Nathan gave up his career as a lawyer to become a Lego sculptor.","Nathan doesn't make much profit from his work."],"type":"choice/closed"},{"id":"b8601.i02","label":"2","prompt":"Nathan's work is difficult to transport to other countries.","options":[],"type":"choice/closed"},{"id":"b8601.i03","label":"3","prompt":"Nathan gave up his career as a lawyer to become a Lego sculptor.","options":[],"type":"choice/closed"},{"id":"b8601.i04","label":"4","prompt":"Nathan doesn't make much profit from his work.","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8601.i01","label":"1","prompt":"Watch the video and take notes. Circle the ideas you hear.","options":["According to psychologists, Lego is popular because it is easy to make things from.","Nathan's work is difficult to transport to other countries.","Nathan gave up his career as a lawyer to become a Lego sculptor.","Nathan doesn't make much profit from his work."],"type":"choice/closed"},{"kind":"item","id":"b8601.i02","label":"2","prompt":"Nathan's work is difficult to transport to other countries.","options":[],"type":"choice/closed"},{"kind":"item","id":"b8601.i03","label":"3","prompt":"Nathan gave up his career as a lawyer to become a Lego sculptor.","options":[],"type":"choice/closed"},{"kind":"item","id":"b8601.i04","label":"4","prompt":"Nathan doesn't make much profit from his work.","options":[],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/f712f389d9956ce3e96b4379-L5RW-U05.mp4","captions":[{"start":0,"end":5.12,"text":"Modelling bricks such as Lego are an irresistible toy\nfor many children."},{"start":5.48,"end":9.54,"text":"But just what is it that makes the brightly coloured\nblocks so popular?"},{"start":10.02,"end":17.2,"text":"Psychologists say their appeal lies in the ease with\nwhich a child can get started on building models from\ntheir imagination."},{"start":17.82,"end":21.48,"text":"A box of Lego is a chaos of endless possibilities."},{"start":22.08,"end":28.46,"text":"It doesn't take any particular physical skill to get\nstarted, and a child can build, change their ideas,"},{"start":28.96,"end":30.52,"text":"undo and rebuild."},{"start":32.94,"end":36.32,"text":"And Lego is not just a creative medium for children."},{"start":37.18,"end":42.66,"text":"New York artist Nathan Sawyer's work has been shown in\ngalleries around the world."},{"start":43.54,"end":48.7,"text":"His models prove that ultimately Lego is a three\n-dimensional paint box,"},{"start":49.1,"end":52.04,"text":"only limited by your vision and imagination."},{"start":54.3,"end":56.32,"text":"My name is Nathan Sawyer."},{"start":57.02,"end":58.74,"text":"I am a brick artist."},{"start":59.76,"end":62.26,"text":"We're in my art studio here in New York City."},{"start":63.04,"end":66.46,"text":"Well, my art studio holds about one .five"},{"start":66.46,"end":68.1,"text":"million bricks at any given time."},{"start":68.48,"end":71.28,"text":"And then as I'm working on pieces, I just pull from\ninventory."},{"start":72.1,"end":79.7,"text":"Some of the larger projects, I did a billboard in\nHollywood that used over 500 ,000 individual pieces."},{"start":79.7,"end":85.16,"text":"I did a Tyrannosaurus Rex skeleton that measures 20\nfeet long."},{"start":85.48,"end":87.4,"text":"So that's one of the largest pieces I've ever done."},{"start":87.48,"end":89.5,"text":"That's currently on tour in Australia."},{"start":90.02,"end":91.36,"text":"Just depends, you know,"},{"start":91.86,"end":96.68,"text":"a life -size human form is going to use about 20 to 30\n,000 bricks per project."},{"start":97.97999999999999,"end":106.1,"text":"I used to practice corporate law here in New York City,\nand I would spend 80 hours a week in a boardroom\nnegotiating contracts."},{"start":106.1,"end":108.34,"text":"And I found at the end of the day,"},{"start":108.68,"end":110.64,"text":"I would need some sort of creative release."},{"start":111.1,"end":114.7,"text":"Sometimes it was painting, sometimes it was drawing,\nand sometimes it was sculpting."},{"start":114.72,"end":117.4,"text":"And I found I enjoyed sculpting with Lego bricks."},{"start":118.24000000000001,"end":124.48,"text":"And so I eventually would leave the law firm to create\nart full -time out of Lego."},{"start":124.7,"end":130.46,"text":"I opened the art studio here in New York and left the\nlaw firm all behind to become a full -time artist."},{"start":132.04,"end":135.02,"text":"Well, the process is fairly straightforward."},{"start":135.78,"end":137.72,"text":"Gravity forces me to work up."},{"start":139.38,"end":140.96,"text":"So as I build,"},{"start":141.92000000000002,"end":145.42000000000002,"text":"I do put a little bit of glue and then add the brick."},{"start":150.92000000000002,"end":152.3,"text":"I've got a lot going on lately."},{"start":152.84,"end":156.82,"text":"I've been receiving several commissions from all over\nthe world, which keeps it interesting."},{"start":156.94,"end":164.56,"text":"I think one of the great parts about my job is that\nevery morning I check my email and I get requests from\nall sorts of people."},{"start":164.56,"end":168.1,"text":"Some I take on, some I don't, but it keeps it very\ninteresting."},{"start":171.42000000000002,"end":175,"text":"Well, the works sell for tens to $20 ,000 generally."},{"start":175.07999999999998,"end":177.12,"text":"Some of the larger pieces have sold for more than that."},{"start":177.14,"end":177.86,"text":"The largest,"},{"start":178.32,"end":180.28,"text":"I did sell a piece for six figures."},{"start":186.14,"end":186.96,"text":"It's amazing."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1, 3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8602","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Write two details for each main idea.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2370ae6b18ef10c70a9585e8f674cfaccb060fc723817a87f0800adc05ec304.png"],"provided":"","items":[{"id":"b8602.i01","label":"","prompt":"Detail 2: ____","options":[],"type":"gap/open"},{"id":"b8602.i02","label":"","prompt":"Detail 2: ____","options":[],"type":"gap/open"},{"id":"b8602.i03","label":"","prompt":"Detail 2: ____","options":[],"type":"gap/open"},{"id":"b8602.i04","label":"","prompt":"Detail 2: ____","options":[],"type":"gap/open"},{"id":"b8602.i05","label":"","prompt":"Detail 2: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8602.i01","label":"","prompt":"Detail 2: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8602.i02","label":"","prompt":"Detail 2 ns from all over\nthe world, which keeps it interesting."},{"start":156.94,"end":164.56,"text":"I think one of the great parts about my job is that\nevery morning I check my email and I get requests from\nall sorts of people."},{"start":164.56,"end":168.1,"text":"Some I take on, some I don't, but it keeps it very\ninteresting."},{"start":171.42000000000002,"end":175,"text":"Well, the works sell for tens to $20 ,000 generally."},{"start":175.07999999999998,"end":177.12,"text":"Some of the larger pieces have sold for more than that."},{"start":177.14,"end":177.86,"text":"The largest,"},{"start":178.32,"end":180.28,"text":"I did sell a piece for six figures."},{"start":186.14,"end":186.96,"text":"It's amazing."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  easy to get started; build from imagination; no physical\nskill needed; can change ideas, undo and rebuild\n2  Lego artist; models shown in galleries around the world;\n3-D paint-box only limited by vision and imagination\n3  billboard in Hollywood (500,000 bricks); Tyrannosaurus\nrex skeleton (20 feet long)\n4  corporate law; New York City; 80 hours per week;\nnegotiating contracts (in board room); needed\ncreative release\n5  straightforward process; gravity (forces him to work up);\nadds glue, then the brick\nPSYCHOLOGY UNIT 5","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8604","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work in a small group. Discuss the questions.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2370ae6b18ef10c70a9585e8f674cfaccb060fc723817a87f0800adc05ec304.png"],"provided":"","items":[{"id":"b8604.i01","label":"1","prompt":"What do you think of Nathan Sawaya's models? Which models in the video did you like the most? Why?","options":[],"type":"discuss/open"},{"id":"b8604.i02","label":"2","prompt":"Why, do you think, are Nathan's models so popular? Why, do you think, are Nathan's models so expensive to buy?","options":[],"type":"discuss/open"},{"id":"b8604.i03","label":"3","prompt":"Is the amount of creativity required an important factor in your choice of career? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b8604.i04","label":"4","prompt":"Would you say that being creative is generally an advantage in life? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8604.i01","label":"1","prompt":"What do you think of Nathan Sawaya's models? Which models in the video did you like the most? Why?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8604.i02","label":"2","prompt":"Why, do you think, are Nathan's models so popular? Why, do you think, are Nathan's models so expensive to buy?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8604.i03","label":"3","prompt":"Is the amount of creativity required an important factor in your choice of career? Why / Why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8604.i04","label":"4","prompt":"Would you say that being creative is generally an advantage in life? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think the models are amazing. I like the\ndinosaur model. It’s really interesting\nthat he is able to make something\nthat large and that detailed from\nLego blocks.\n2 I think that Lego are very popular in\ngeneral and people appreciate his\ncreativity. The models are expensive\nbecause the must take a long time to\nbuild and it must be expensive to buy\nthe blocks that he needs to create them.\n3 I enjoy having some creativity in my work\nbut it’s not the most important thing for\nme. It’s more important that I have a\nstable job and a good salary.\nIt’s very important to me. I can’t imagine\nhaving to spend every day not doing\nsomething that I enjoy so I need to have\nwork that allows me to be creative.\n4 I think that being creative can help\nyou solve problems and that is an\nadvantage. It can also lead to very\ninteresting and sometimes well-paid\ncareers and that is an advantage too.\nI don’t think it’s that important. Most\npeople don’t need to be creative to\nbe able to live a good life and get a\ngood job.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8607","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"order":7,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read an article about what makes people creative. Read the definitions. Use the correct forms of the words in bold to complete the sentences below.","pages":[114],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/211477f6275d4f9162cbe604ae8105b441420275db37db2578f2bfaed2e272f5.png"],"provided":"","items":[{"id":"b8607.i01","label":"1","prompt":"His violent behaviour has been ____ a brain injury.","options":["attribute to","cognition","genius","label","norm","stimulation","suppress","trauma"],"type":"choice/closed"},{"id":"b8607.i02","label":"2","prompt":"This kind of behaviour is definitely not the ____ for traditional society, but it is more acceptable among young people.","options":["attribute to","cognition","genius","label","norm","stimulation","suppress","trauma"],"type":"choice/closed"},{"id":"b8607.i03","label":"3","prompt":"Scientists hope that this new medication will improve ____ in older people who have experienced problems with memory.","options":["attribute to","cognition","genius","label","norm","stimulation","suppress","trauma"],"type":"choice/closed"},{"id":"b8607.i04","label":"4","prompt":"She tried to ____ all her other thoughts in order to concentrate completely on the exam questions.","options":["attribute to","cognition","genius","label","norm","stimulation","suppress","trauma"],"type":"choice/closed"},{"id":"b8607.i05","label":"5","prompt":"If you always complain and do not work well with others, you will be ____ an unsatisfactory employee.","options":["attribute to","cognition","genius","label","norm","stimulation","suppress","trauma"],"type":"choice/closed"},{"id":"b8607.i06","label":"6","prompt":"Many children who live in extreme poverty suffer significant ____ that can last a lifetime.","options":["attribute to","cognition","genius","label","norm","stimulation","suppress","trauma"],"type":"choice/closed"},{"id":"b8607.i07","label":"7","prompt":"After she started working, she found that she missed the intellectual ____ of student life at the universi the article and check your predictions from Exercise 2.","pages":[115],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8ae8710eedc8df90f17a72991d1fb5034205f3bbd46953acf1b9c973e77bf7c7.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U05-question:b8608","kind":"student-work","title":"READING 1 Ex 2","pages":[115]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U05-classroom:material:RW-M03","title":"READING 1","text":"1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence cannot be the key, as numerous studies have shown that a high IQ¹ alone does not lead to creativity.\nCreative thinkers seem to have a special way of thinking. Creativity researcher and neuroscientist Nancy Andreasen, in a 2014 Atlantic Magazine article, describes creative people as 'better at recognizing relationships, making associations and connections, and seeing things in an original way – seeing things that others cannot see'. For example, in the early 2000s, Jack Dorsey, one of the founders of Twitter, tried to use text messages to improve the system for reserving and sending out taxis. He made a connection between two seemingly unrelated systems, but he was too far ahead of his time – the necessary technology was not yet available. Today, most taxi services use a version of Dorsey's original idea.\n2 So what are the requirements for creativity?\nFirst of all, creativity takes time. We tend to think of breakthroughs as coming in a sudden flash of brilliance, but this is rarely the case. Ideas often evolve and form over a long period. Andreasen, who conducted a study of creative thinking, described her findings this way, '... almost all of my (research) subjects confirmed that when Eureka moments occur, they tend to be precipitated by long periods of preparation and incubation², and to strike when the mind is relaxed.' In fact, many of history's most creative people have a reputation as daydreamers or procrastinators. Martin Luther King, Jr, reportedly wrote his 'I Have a Dream' speech at ten o'clock the night before he delivered it, although it is likely to have gone through a long period of 'preparation and incubation' in his mind before that.\n3 In a surprising twist, creativity may also be sparked by suffering, such as a serious illness or the loss of a loved one. We can see examples of this in the lives of many great creative geniuses. Artist Paul Klee suffered great pain for much of his life, as did many other artists, and composer Johann Sebastian Bach lost both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.\n4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'\n5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds.","screens":["1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence cannot be the key, as numerous studies have shown that a high IQ¹ alone does not lead to creativity.","Creative thinkers seem to have a special way of thinking. Creativity researcher and neuroscientist Nancy Andreasen, in a 2014 Atlantic Magazine article, describes creative people as 'better at recognizing relationships, making associations and connections, and seeing things in an original way – seeing things that others cannot see'. For example, i Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'","5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds."],"sources":[{"page":116,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/078f4e5d3e01f6bdbe0a743cfcda324cba7688371dc777660622941e0001e63c.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04e9630fc41de10ece6fc84b428bb2ccad27670646606bfc37405b6e15d4c67e.mp3"}],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubu  improve the system for reserving and sending out taxis. He made a connection between two seemingly unrelated systems, but he was too far ahead of his time – the necessary technology was not yet available. Today, most taxi services use a version of Dorsey's original idea.\n2 So what are the requirements for creativity?\nFirst of all, creativity takes time. We tend to think of breakthroughs as coming in a sudden flash of brilliance, but this is rarely the case. Ideas often evolve and form over a long period. Andreasen, who conducted a study of creative thinking, described her findings this way, '... almost all of my (research) subjects confirmed that when Eureka moments occur, they tend to be precipitated by long periods of preparation and incubation², and to strike when the mind is relaxed.' In fact, many of history's most creative people have a reputation as daydreamers or procrastinators. Martin Luther King, Jr, reportedly wrote his 'I Have a Dream' speech at ten o'clock the night before he delivered it, although it is likely to have gone through a long period of 'preparation and incubation' in his mind before that.\n3 In a surprising twist, creativity may also be sparked by suffering, such as a serious illness or the loss of a loved one. We can see examples of this in the lives of many great creative geniuses. Artist Paul Klee suffered great pain for much of his life, as did many other artists, and composer Johann Sebastian Bach lost both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.\n4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'\n5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds.","screens":["1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence canno st both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.","4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'","5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds."],"sources":[{"page":116,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/078f4e5d3e01f6bdbe0a743cfcda324cba7688371dc777660622941e0001e63c.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04e9630fc41de10ece6fc84b428bb2ccad27670646606bfc37405b6e15d4c67e.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Artistic environments often value\nindividuality, self-expression, and\nbreaking conventions, which aligns with\nnon-conformity. So such groups are\nmore likely to support people who don’t\nfit in with society’s norms.\n2 When I need to think of ideas for\na project I use techniques like\nbrainstorming and mind mapping.\nSometimes just taking a break and\nspending time doing something\ncompletely different helps my mind\nrelax, and then I am able to think of new\nideas.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8624","book": ey building and there was\nno lift. Whenever I served food to\ncustomers, I had to walk up two flights\nof stairs to the kitchen and then back","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8643","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"order":16,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work in pairs. Read the passages (1–3) quickly and think about words or phrases that could fill the gaps. Then use the correct form of the words and phrases in the box to complete the passages.","pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/53cca8e1e98c21c4c6201fc588e06a292ff6261d5bc8c95434e0c1ac415acdab.png"],"provided":"1 Does listening to music improve focus while studying? To find out, researchers studied two groups. The students in the ____ listened to music with lyrics while they studied. The students in the ____ studied without listening to music.\n2 Researchers ____ to find the link between physical activity and creativity. The ____ were divided into two gr id":"B05-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"1 Most of us would like to be more creative, but we assume there is little we can do about it. Is creativity indeed something that only some of us are born with? Perhaps, but current thinking suggests we should not be satisfied with our inborn talents. Psychology professor K. Anders Ericsson claims that with enough practice, any of us can become experts, in ice skating, piano or anything else. However, he is quick to add that this requires a specific kind of practice and lots of it – about 10,000 hours. To develop expertise, simple repetition is not enough; what Ericsson calls 'deliberate practice', is required: that is, pushing beyond one's comfort zone¹ and setting goals that are above one's current level of performance. The more deliberate practice, the better the performance. In his 2016 book, Peak: Secrets from the New Science of Expertise, Ericsson says he has spent 30 years looking 'for kinds of limits that would actually constrain some individuals from being successful ...'. He says he has yet to find those limits and he doesn't believe they exist. Not everyone agrees,\nhowever. A 2014 study concluded that practice explains only about 25% of the difference between top performers and performers who were just 'very good'. The rest was due to natural ability. Still, 25% is not insignificant.\n2 Ericsson has looked primarily at artistic and athletic expertise, but can these findings apply to creativity? Is it a skill, like ice skating or playing the piano? Can we learn to be more creative? Most experts agree that even if most people cannot hope to become creative geniuses, they can learn to become more creative through practice. Psychologists contend that there are actually two levels of creativity, which they refer to as 'Big C' and 'small c'. Big C creativity applies to breakthrough ideas, ones that may change the course of a field or even history. It's unlikely that any amount of practice can lead ordinary thinkers to Big C creativity. Small c, however, is a different story. Small c creativity refers to everyday creative problem solving, like creating a new recipe or improving a process, which psychologists subdivide further into convergent and divergent thinking. Convergent thinking involves examining all the facts and arriving at a single solution. In contrast, divergent thinking involves coming up with many possible solutions – for example, thinking of many different\nuses for a brick or a paperclip. What most people think of as creativity generally involves divergent thinking. And divergent thinking can be taught, practised and learned.\n3 Even with practice, divergent thinking alone cannot make one creative, however. Scott Barry Kaufman, a cognitive psychologist, says that most creative people share one personality trait: openness to new experience. Since this trait and these processes have been identified, less creative people can try to emulate them. Creativity experts advise that we be open to many different and possibly contradictory ideas, that we take time to let our own ideas form and develop, allowing new connections to become apparent. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.\n4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.\n¹comfort zone (n phr) a familiar place or situation in which you feel at ease","screens":["1 Most of us would like to be more creative, but we assume there is little we can do about it. Is creativity indeed something that only some of us are born with? Perhaps, but current thinking suggests we should not be satisfied with our inborn talents. Psychology professor K. Anders Ericsson claims that with enough practice, any of us can become experts, in ice skating, piano or anything else. However, he is quick to add that this requires a specific kind of practice and lots of it – about 10,000 hours. To develop expertise, simple repetition is not enough; what Ericsson calls 'deliberate practice', is required: that is, pushing beyond one's comfort zone¹ and setting goals that are above one's current level of performance. The more deliberate practice, the better the performance. In his 2016 book, Peak: Secrets from the New Science of Expertise, Ericsson says he has spent 30 years looking 'for kinds of limits that would actually constrain some individuals from being successful ...'. He says he has yet to find those limits and he doesn't believe they exist. Not everyone agrees,","however. A 2014 study concluded that practice explains only about 25% of the difference between top performers and performers who were just 'very good'. The rest was due to natural ability. Still, 25% is not insignificant.","2 Ericsson has looked primarily at artistic and athletic expertise, but can these findings apply to creativity? Is it a skill, like ice skating or playing the piano? Can we learn to be more creative? Most experts agree that even if most people cannot hope to become creative geniuses, they can learn to become more creative through practice. Psychologists contend that there are actually two levels of creativity, which they refer to as 'Big C' and 'small c'. Big C creativity applies to breakthrough ideas, ones that may change the course of a field or even history. It's unlikely that any amount of practice can lead ordinary thinkers to Big C creativity. Small c, however, is a different story. Small c creativity refers to everyday creative problem solving, like creating a new recipe or improving a process, which psychologists subdivide further into convergent and divergent thinking. Convergent thinking involves examining all the facts and arriving at a single solution. In contrast, divergent thinking involves coming up with many possible solutions – for example, thinking of many different","uses for a brick or a paperclip. What most people think of as creativity generally involves divergent thinking. And divergent thinking can be taught, practised and learned.\n3 Even with practice, divergent thinking alone cannot make one creative, however. Scott Barry Kaufman, a cognitive psychologist, says that most creative people share one personality trait: openness to new experience. Since this trait and these processes have been identified, less creative people can try to emulate them. Creativity experts advise that we be open to many different and possibly contradictory ideas, that we take time to let our own ideas form and develop, allowing new connections to become apparent. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.","4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.","¹comfort zone (n phr) a familiar place or situation in which you feel at ease"],"sources":[{"page":120,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe6f4cbb449b97886663a21a67f5bf87541baed5d1319a1a1c71ea378c796dd2.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a1cb0c0ebf2dde8b749b9b51e74c3a5184c22bab10392ff8948041e909193ae.mp3"}],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8632","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":2,"order":21,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Using your annotations and the sentences below, complete the missing main ideas and details in the box.","pages":[121],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/271dd398c9836b55fdb17371dab132c7a55b72727393de967081ddb43772435b.png"],"provided":"a Thomas Edison invented many versions of his lightbulb.\nb Creative people often engage in divergent thinking.\nc People can become exp nt. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.","4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.","¹comfort zone (n phr) a familiar place or situation in which you feel at ease"],"sources":[{"page":120,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe6f4cbb449b97886663a21a67f5bf87541baed5d1319a1a1c71ea378c796dd2.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a1cb0c0ebf2dde8b749b9b51e74c3a5184c22bab10392ff8948041e909193ae.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 I get my best ideas when I’m exercising.\nFor example, if I’m writing an essay and\nhaving a hard time thinking of good\nideas, I’ll take a break and go for a run.\nWhile I’m running, ideas usually come to\nme without any effort.\n2 I am more of a divergent thinker. For\nexample, I took my broken computer\napart, figured out the problem and fixed\nit. Then I put it back together again.\n3 I like to step out of my comfort zone.\nFor example, I like to order food in\nrestaurants that I’ve never tried before,\neven if I’m not sure what the food is.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8647","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":2,"order":26,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Review Reading 1 and Reading 2. As you read, review your annotations. Then summarize the topics that are discussed and the main points the writer is making about them. Compare your summaries with a partner.","pages":[124],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8fd342deb2688bbf4192c8ca8868caddeb7ddd3d5af4e25c2e748b832212c8b4.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U05-question:b8613","kind":"student-work","title":"READING 1 Ex 5","pages":[115]},{"id":"B05-RW-U05-question:b8631","kind":"student-work","title": nd":"item","id":"b8649.i08","label":"h","prompt":"suggestions for increasing an individual's creativity","options":[],"type":"gap/open"},{"kind":"item","id":"b8649.i09","label":"i","prompt":"additional topic 1","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8649.i10","label":"j","prompt":"additional topic 2","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"topic Reading 1 Reading 2\na sources of creativity genes, intelligence, suffering emotional\ntrauma, openness to experience (genetic?)\ngenes, deliberate practice, personality trait of openness\nto new experience, emulating creative people’s\nopenness, willingness to carry on in the face of failure\nb research findings Andreasen: Eureka moments occur when\nprecipitated by long periods of preparation\nand incubation, and strike when the mind is\nrelaxed.\nKeri: individuals with artistic creativity\nsuffered from severe traumas in life.\nEricsson: no limit on individual success in any skill\nScientists checking Ericsson’s findings:\nA 2014 study concluded that practice explains only\nabout 25% of the difference between top performers\nand performers who were just ‘very good’. The rest was\ndue to natural ability.\nc  descriptions of\ncreative behaviour\nmake new connections, procrastination risk-taking, convergent thinking, divergent thinking\nd  specific examples of\ncreative individuals\nKlee, MLK, Bach, Jack Dorsey Hemingway, Edison\ne  different kinds\nof creativity\nX big C creativity, small c creativity, convergent thinking,\ndivergent thinking\nf  traits that creative\nthinkers share\npush limits, openness, take risks, curious openness to new experience, toleration of contradiction\ng  disadvantages of creativity could be labelled as a troublemaker in school potential for failure\nh  suggestions for increasing\nan individual’s creativity\nX train in divergent thinking, move outside comfort zone\ni)  Role of life experiences\nin creativity\nLife experiences, particularly suffering, such\nas illness or loss, can significantly influence\ncreativity. Examples include the struggles of\nPaul Klee and Johann Sebastian Bach, which\nare linked to their creative output.\nOpenness to new experiences – implies that life\nexperiences play a role in creativity. Willingness to take\nrisks and fail, highlights how creative individuals use\ntheir experiences to refine their work. This emphasizes\nthe role of life challenges.\nj)  Creativity as an\nevolutionary trait\nCharacteristics such as restlessness and\ncuriosity, were likely advantageous in the\npast when humans depended on hunting –\nindicates that these traits have evolutionary\nroots.\nFacing risk and failure contrasts with the natural human\ntendency to do what is already known because of\ncomfort. It could have evolutionary roots in risk-taking\nfor progress. Early humans faced uncertain and risky\nenvironments. Suggests that creativity could be an\nadaptive trait evolved for problem-solving in complex\nand unpredictable situations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[{"page":125,"original":"make similar claims or converge from the ideas in the previous text","text":"原书版保留实际印文并标明疑点；校内讲解说明比较相似与不同观点，可使用diverge from ativity comes from a wide range of\nsources. Some people become more\ncreative after experiencing trauma, while\nothers put in hours of practice, working\nactively to acquire skills that will lead to\ndeeper creativity.\n2 Examples of individuals throughout\nhistory help illustrate the traits that\ncreative people share.\n3 Creative people may not always fit in.\nThey may be looked upon as unusual\nbecause they think outside the box","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":49,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8669","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":2,"order":37,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Work with a partner. Discuss the information you will use to complete the table on page 130. Use your notes from Exercise 4 on page 129 as needed. Complete the plan for your expository essay.","pages":[129,130],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6ab382ee54b1ecfbf091dc36f64089d90fb1f91b076bc9982dc5a5ba90d46cfe.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574af githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":49,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8674","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":2,"order":40,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 400–450 words.","pages":[131],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58b1fd242d74a7fe2df9282eab32b3f2bd904daa4ab296819e95073f22f2ea23.png"],"provided":"","items":[{"id":"b8674.i01","label":"Essay","prompt":"Write your essay (400–450 words), using your essay plan to structure your ideas.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U05-question:b8671","kind":"student-work","title":"WRITING TASK Ex 2","pages":[131]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8674.i01","label":"Essay","prompt":"Write your essay (400–450 words), using your essay plan to structure your ideas.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"To understand creative thinking, it is\nimportant to know the sources it originates\nfrom and how it emerges in individuals,\nincluding what traits creative people share.\nIt is also important to acknowledge that\ncreativity can come with disadvantages.\nCreativity is not solely a product of genetic\nluck or sheer intelligence. Research\nindicates that only about ten percent of\ncreativity can be attributed to genetics,\nand a high IQ alone does not guarantee\ncreativity. Instead, creative thinkers excel\nat recognizing relationships, making\nconnections, and seeing things from\noriginal perspectives. Nancy Andreasen’s\nstudies reveal that creativity often involves\nextended periods of preparation and\nincubation before a breakthrough occurs.\nThe traits of creative individuals include\na high degree of openness to new\nexperiences and a propensity for divergent\nthinking. Divergent thinking – generating\nmultiple solutions to a problem – is a\ncritical component of creativity and can be\ndeveloped through deliberate practice. K.\nAnders Ericsson’s research suggests that\nexpertise in any field, including creativity,\nrequires about 10,000 hours of deliberate\npractice. This practice involves pushing\nbeyond one’s comfort zone and setting\nambitious goals. However, creativity also\ndemands resilience in the face of failure\nand criticism, as seen in the processes of\nfamous creators like Thomas Edison and\nErnest Hemingway.\nMoreover, recent studies highlight the\nimpact of external factors on creativity.\nKathleen Esfahany’s 2023 research shows\nthat sleep onset significantly affects\ncreativity, emphasizing the role of rest in\nthe creative process. In the workplace,\nas AI automates routine tasks, Naeema\nPasha from MKAI notes that employees\nwill have more opportunities to engage in\ncreative tasks. This shift underscores the\nevolving understanding of creativity as not\njust an innate ability but as a skill that can\nbe nurtured and developed through both\npractice and favorable conditions.\nIn summary, creative thinking is complex\ncombination of factors. It involves more\nthan just inherent traits or intelligence. It is\nshaped by a blend of personal characteristics\nsuch as openness to new experiences and\ndivergent thinking, alongside deliberate and\nsustained practice. Furthermore, external\nfactors, including adequate rest and changes\nin the work environment, play a crucial role in\nenhancing creativity.\nUNIT 6\nUNLOCK YOUR\nKNOWLEDGE\npage 135\n1 The fastest-growing careers in the next\nten years will probably be in fields such\nas computer science and engineering.\nAnything related to artificial intelligence\nwill also be popular, as will careers in the\nmedical field.\n2 The purpose of a university education\nis not necessarily to train people for a\nspecific career, but to provide a more\ngeneral education. Students should be\nexposed to various career paths they\nmight take and then guided toward\ntheir specific goals. But, because there\nare so many different careers to choose\nfrom, it is not possible to train everyone\nwell for their future careers. That is what\npostgraduate education and training\nprogrammes are for.\n3 I want to work as an environmental\nengineer, which is a job that\ninvolves research related to current\nenvironmental issues. I chose this job\nbecause I want a career that makes a\nglobal impact. In addition, there are\nenvironmental problems all over the\nworld, so my work would not be limited\nby location. I also think there will be a lot\nof work for environmental engineers in\nthe near and distant future.\n4 There are many career paths other\nthan attending university, especially for\nhighly specialized jobs. For example,\nif a person wants to be a chef or\na carpenter, they most likely need\nsome type of training programme or\nvocational qualification, where they\nlearn only the specific skills they need.\nAnother non-university path to a career\nmight be a training scheme that is\noffered by a company. A person can get\nhired directly after they finish secondary\nschool and begin training for their\nspecific job immediately.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":49,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[{"page":131,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/58b1fd242d74a7fe2df9282eab32b3f2bd904daa4ab296819e95073f22f2ea23.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U05-question:b8676","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":2,"order":41,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Use the Task checklist to review your essay for content and structure.","pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2275413adb952036dd9bbd3f7119f1c1ff746ae8c148d8777c60d555b3aa18f8.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you introduced and explained your topic?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you included information from all your sources?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you paraphrased the information in the articles in your own words?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you used quotations from experts?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Have you used a variety of sentence structures?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Does your concluding paragraph leave your readers with something to think about?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tabl
