than one text."},{"label":"Grammar","text":"Use complex noun phrases with what."},{"label":"Academic writing skills","text":"Cite quoted material; write an expository essay."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":110,"alt":""}}]}},{"id":"B05-RW-U05-classroom:resource:b8597","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5727a99620fd8632512930f46b6f4fa800a1a1d141fffe717753b05429ebed70.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"irresistible","pos":"(adj)","definition":"impossible to ignore or refuse because it is too pleasant or attractive","example":"The smell of warm bread was irresistible.","wordAudio":"irresistible","cardWord":false},{"term":"creative medium","pos":"(n phr)","definition":"a method or way of expressing an artistic idea such as writing or painting","example":"He chose photography as his creative medium.","wordAudio":"creative medium","cardWord":false},{"term":"vision","pos":"(v)","definition":"the ability to imagine how something could be developed and to plan for this","example":"Her vision for the library included space for workshops.","wordAudio":"vision","cardWord":false},{"term":"boardroom","pos":"(n)","definition":"a room where the people who control a company or organization meet","example":"The directors met in the boardroom.","wordAudio":"boardroom","cardWord":false},{"term":"creative release","pos":"(n phr)","definition":"an artistic activity somebody does to feel free of negative emotions such as stress","example":"For him, drawing is a creative release after a stressful day.","wordAudio":"creative release","cardWord":false},{"term":"commission","pos":"(n)","definition":"a request to do a special piece of work","example":"The artist received a commission to paint a portrait.","wordAudio":"commission","cardWord":false}]]}},{"id":"B05-RW-U05-classroom:video","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c2370ae6b18ef10c70a9585e8f674cfaccb060fc723817a87f0800adc05ec304.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/f712f389d9956ce3e96b4379-L5RW-U05.mp4","captions":[{"start":0,"end":5.12,"text":"Modelling bricks such as Lego are an irresistible toy\nfor many children."},{"start":5.48,"end":9.54,"text":"But just what is it that makes the brightly coloured\nblocks so popular?"},{"start":10.02,"end":17.2,"text":"Psychologists say their appeal lies in the ease with\nwhich a child can get started on building models from\ntheir imagination."},{"start":17.82,"end":21.48,"text":"A box of Lego is a chaos of endless possibilities."},{"start":22.08,"end":28.46,"text":"It doesn't take any particular physical skill to get\nstarted, and a child can build, change their ideas,"},{"start":28.96,"end":30.52,"text":"undo and rebuild."},{"start":32.94,"end":36.32,"text":"And Lego is not just a creative medium for children."},{"start":37.18,"end":42.66,"text":"New York artist Nathan Sawyer's work has been shown in\ngalleries around the world."},{"start":43.54,"end":48.7,"text":"His models prove that ultimately Lego is a three\n-dimensional paint box,"},{"start":49.1,"end":52.04,"text":"only limited by your vision and imagination."},{"start":54.3,"end":56.32,"text":"My name is Nathan Sawyer."},{"start":57.02,"end":58.74,"text":"I am a brick artist."},{"start":59.76,"end":62.26,"text":"We're in my art studio here in New York City."},{"start":63.04,"end":66.46,"text":"Well, my art studio holds about one .five"},{"start":66.46,"end":68.1,"text":"million bricks at any given time."},{"start":68.48,"end":71.28,"text":"And then as I'm working on pieces, I just pull from\ninventory."},{"start":72.1,"end":79.7,"text":"Some of the larger projects, I did a billboard in\nHollywood that used over 500 ,000 individual pieces."},{"start":79.7,"end":85.16,"text":"I did a Tyrannosaurus Rex skeleton that measures 20\nfeet long."},{"start":85.48,"end":87.4,"text":"So that's one of the largest pieces I've ever done."},{"start":87.48,"end":89.5,"text":"That's currently on tour in Australia."},{"start":90.02,"end":91.36,"text":"Just depends, you know,"},{"start":91.86,"end":96.68,"text":"a life -size human form is going to use about 20 to 30\n,000 bricks per project."},{"start":97.97999999999999,"end":106.1,"text":"I used to practice corporate law here in New York City,\nand I would spend 80 hours a week in a boardroom\nnegotiating contracts."},{"start":106.1,"end":108.34,"text":"And I found at the end of the day,"},{"start":108.68,"end":110.64,"text":"I would need some sort of creative release."},{"start":111.1,"end":114.7,"text":"Sometimes it was painting, sometimes it was drawing,\nand sometimes it was sculpting."},{"start":114.72,"end":117.4,"text":"And I found I enjoyed sculpting with Lego bricks."},{"start":118.24000000000001,"end":124.48,"text":"And so I eventually would leave the law firm to create\nart full -time out of Lego."},{"start":124.7,"end":130.46,"text":"I opened the art studio here in New York and left the\nlaw firm all behind to become a full -time artist."},{"start":132.04,"end":135.02,"text":"Well, the process is fairly straightforward."},{"start":135.78,"end":137.72,"text":"Gravity forces me to work up."},{"start":139.38,"end":140.96,"text":"So as I build,"},{"start":141.92000000000002,"end":145.42000000000002,"text":"I do put a little bit of glue and then add the brick."},{"start":150.92000000000002,"end":152.3,"text":"I've got a lot going on lately."},{"start":152.84,"end":156.82,"text":"I've been receiving several commissions from all over\nthe world, which keeps it interesting."},{"start":156.94,"end":164.56,"text":"I think one of the great parts about my job is that\nevery morning I check my email and I get requests from\nall sorts of people."},{"start":164.56,"end":168.1,"text":"Some I take on, some I don't, but it keeps it very\ninteresting."},{"start":171.42000000000002,"end":175,"text":"Well, the works sell for tens to $20 ,000 generally."},{"start":175.07999999999998,"end":177.12,"text":"Some of the larger pieces have sold for more than that."},{"start":177.14,"end":177.86,"text":"The largest,"},{"start":178.32,"end":180.28,"text":"I did sell a piece for six figures."},{"start":186.14,"end":186.96,"text":"It's amazing."}],"launchInline":true}},{"id":"B05-RW-U05-classroom:resource:b8606","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[114],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/211477f6275d4f9162cbe604ae8105b441420275db37db2578f2bfaed2e272f5.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["attribute to (phr v) to say that something is caused by something else\ncognition (n) the use of conscious mental processes\ngenius (n) someone with great and rare natural ability\nlabel (v) to assign a (usually negative) characteristic to somebody or something","norm (n) accepted standard or way of doing something\nstimulation (n) an action that causes someone to become active, interested or enthusiastic\nsuppress (v) to prevent something from being expressed or known\ntrauma (n) severe emotional shock or physical injury that affects you for a long time"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U05-classroom:material:RW-M03","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[116],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/078f4e5d3e01f6bdbe0a743cfcda324cba7688371dc777660622941e0001e63c.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence cannot be the key, as numerous studies have shown that a high IQ¹ alone does not lead to creativity.","sourcePage":116},{"body":"Creative thinkers seem to have a special way of thinking. Creativity researcher and neuroscientist Nancy Andreasen, in a 2014 Atlantic Magazine article, describes creative people as 'better at recognizing relationships, making associations and connections, and seeing things in an original way – seeing things that others cannot see'. For example, in the early 2000s, Jack Dorsey, one of the founders of Twitter, tried to use text messages to improve the system for reserving and sending out taxis. He made a connection between two seemingly unrelated systems, but he was too far ahead of his time – the necessary technology was not yet available. Today, most taxi services use a version of Dorsey's original idea.\n2 So what are the requirements for creativity?","sourcePage":116},{"body":"First of all, creativity takes time. We tend to think of breakthroughs as coming in a sudden flash of brilliance, but this is rarely the case. Ideas often evolve and form over a long period. Andreasen, who conducted a study of creative thinking, described her findings this way, '... almost all of my (research) subjects confirmed that when Eureka moments occur, they tend to be precipitated by long periods of preparation and incubation², and to strike when the mind is relaxed.' In fact, many of history's most creative people have a reputation as daydreamers or procrastinators. Martin Luther King, Jr, reportedly wrote his 'I Have a Dream' speech at ten o'clock the night before he delivered it, although it is likely to have gone through a long period of 'preparation and incubation' in his mind before that.","sourcePage":116},{"body":"3 In a surprising twist, creativity may also be sparked by suffering, such as a serious illness or the loss of a loved one. We can see examples of this in the lives of many great creative geniuses. Artist Paul Klee suffered great pain for much of his life, as did many other artists, and composer Johann Sebastian Bach lost both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.","sourcePage":116},{"body":"4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'","sourcePage":116},{"body":"5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds.","sourcePage":116}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U05-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":116,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/078f4e5d3e01f6bdbe0a743cfcda324cba7688371dc777660622941e0001e63c.png","width":772,"height":1040}],"source":116,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence cannot be the key, as numerous studies have shown that a high IQ¹ alone does not lead to creativity.","sourcePage":116},{"body":"Creative thinkers seem to have a special way of thinking. Creativity researcher and neuroscientist Nancy Andreasen, in a 2014 Atlantic Magazine article, describes creative people as 'better at recognizing relationships, making associations and connections, and seeing things in an original way – seeing things that others cannot see'. For example, in the early 2000s, Jack Dorsey, one of the founders of Twitter, tried to use text messages to improve the system for reserving and sending out taxis. He made a connection between two seemingly unrelated systems, but he was too far ahead of his time – the necessary technology was not yet available. Today, most taxi services use a version of Dorsey's original idea.\n2 So what are the requirements for creativity?","sourcePage":116},{"body":"First of all, creativity takes time. We tend to think of breakthroughs as coming in a sudden flash of brilliance, but this is rarely the case. Ideas often evolve and form over a long period. Andreasen, who conducted a study of creative thinking, described her findings this way, '... almost all of my (research) subjects confirmed that when Eureka moments occur, they tend to be precipitated by long periods of preparation and incubation², and to strike when the mind is relaxed.' In fact, many of history's most creative people have a reputation as daydreamers or procrastinators. Martin Luther King, Jr, reportedly wrote his 'I Have a Dream' speech at ten o'clock the night before he delivered it, although it is likely to have gone through a long period of 'preparation and incubation' in his mind before that.","sourcePage":116},{"body":"3 In a surprising twist, creativity may also be sparked by suffering, such as a serious illness or the loss of a loved one. We can see examples of this in the lives of many great creative geniuses. Artist Paul Klee suffered great pain for much of his life, as did many other artists, and composer Johann Sebastian Bach lost both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.","sourcePage":116},{"body":"4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'","sourcePage":116},{"body":"5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds.","sourcePage":116}],"text":"1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence cannot be the key, as numerous studies have shown that a high IQ¹ alone does not lead to creativity.\nCreative thinkers seem to have a special way of thinking. Creativity researcher and neuroscientist Nancy Andreasen, in a 2014 Atlantic Magazine article, describes creative people as 'better at recognizing relationships, making associations and connections, and seeing things in an original way – seeing things that others cannot see'. For example, in the early 2000s, Jack Dorsey, one of the founders of Twitter, tried to use text messages to improve the system for reserving and sending out taxis. He made a connection between two seemingly unrelated systems, but he was too far ahead of his time – the necessary technology was not yet available. Today, most taxi services use a version of Dorsey's original idea.\n2 So what are the requirements for creativity?\nFirst of all, creativity takes time. We tend to think of breakthroughs as coming in a sudden flash of brilliance, but this is rarely the case. Ideas often evolve and form over a long period. Andreasen, who conducted a study of creative thinking, described her findings this way, '... almost all of my (research) subjects confirmed that when Eureka moments occur, they tend to be precipitated by long periods of preparation and incubation², and to strike when the mind is relaxed.' In fact, many of history's most creative people have a reputation as daydreamers or procrastinators. Martin Luther King, Jr, reportedly wrote his 'I Have a Dream' speech at ten o'clock the night before he delivered it, although it is likely to have gone through a long period of 'preparation and incubation' in his mind before that.\n3 In a surprising twist, creativity may also be sparked by suffering, such as a serious illness or the loss of a loved one. We can see examples of this in the lives of many great creative geniuses. Artist Paul Klee suffered great pain for much of his life, as did many other artists, and composer Johann Sebastian Bach lost both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.\n4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'\n5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04e9630fc41de10ece6fc84b428bb2ccad27670646606bfc37405b6e15d4c67e.mp3"},"original":{"id":"B05-RW-U05-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U05","book":5,"track":"RW","unit":5,"title":"READING 1","kind":"material","pages":[116],"sourceImages":[{"page":116,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/078f4e5d3e01f6bdbe0a743cfcda324cba7688371dc777660622941e0001e63c.png","viewEvidenceReported":true}],"text":"1 What is the secret to the world's most creative minds – the minds of resourceful inventors, innovative scientists and inspired artists? Are they simply lucky to be born with the right genes? That may be part of the explanation, but most studies suggest that only about ten percent of creativity can be attributed to a person's genes. So, are they simply smarter than the rest of us? Such individuals are certainly intelligent, but intelligence cannot be the key, as numerous studies have shown that a high IQ¹ alone does not lead to creativity.\n\nCreative thinkers seem to have a special way of thinking. Creativity researcher and neuroscientist Nancy Andreasen, in a 2014 Atlantic Magazine article, describes creative people as 'better at recognizing relationships, making associations and connections, and seeing things in an original way – seeing things that others cannot see'. For example, in the early 2000s, Jack Dorsey, one of the founders of Twitter, tried to use text messages to improve the system for reserving and sending out taxis. He made a connection between two seemingly unrelated systems, but he was too far ahead of his time – the necessary technology was not yet available. Today, most taxi services use a version of Dorsey's original idea.\n\n2 So what are the requirements for creativity?\n\nFirst of all, creativity takes time. We tend to think of breakthroughs as coming in a sudden flash of brilliance, but this is rarely the case. Ideas often evolve and form over a long period. Andreasen, who conducted a study of creative thinking, described her findings this way, '... almost all of my (research) subjects confirmed that when Eureka moments occur, they tend to be precipitated by long periods of preparation and incubation², and to strike when the mind is relaxed.' In fact, many of history's most creative people have a reputation as daydreamers or procrastinators. Martin Luther King, Jr, reportedly wrote his 'I Have a Dream' speech at ten o'clock the night before he delivered it, although it is likely to have gone through a long period of 'preparation and incubation' in his mind before that.\n\n3 In a surprising twist, creativity may also be sparked by suffering, such as a serious illness or the loss of a loved one. We can see examples of this in the lives of many great creative geniuses. Artist Paul Klee suffered great pain for much of his life, as did many other artists, and composer Johann Sebastian Bach lost both his parents when he was only nine years old. Research by Hungarian scientist Szabolcs Keri confirms this. He says, 'We found that many individuals with artistic creativity suffered from severe traumas in life.' He and other researchers believe that this trauma affects brain structure and expands the brain's ability to make the diverse and multiple connections that underlie much of creative thinking.\n\n4 Those investigating the sources of creativity have noted that some creative geniuses do not always fit in well with societal norms. They don't seem able to suppress the fountain of ideas that bubble up in their minds, some of which may seem irrelevant or inappropriate to others. Creative people are also curious; they seem wired³ to seek novelty, take risks and push limits in their explorations. The reward centres in their brains seem to need more than the average amount of stimulation in order to release dopamine, the chemical that triggers feelings of pleasure. In a 2022 article published on the American Psychological Association website, neuroscientist Anna Abraham summarized the key to creative cognition. 'Across different age groups, the best predictor of creativity is openness to new experiences,' she said. 'Creative people have the kind of curiosity that draws them toward learning new things and experiencing the world in new ways.'\n\n5 As children, creative people are often unable to sit still, unable to focus on their lessons, instead, always looking for something new and interesting to capture their attention. Today, many children who display this kind of behaviour are often labelled as trouble makers. However, their characteristics were probably extremely useful in the past – when humans depended on hunting, a risky and unpredictable but exciting activity – and researchers suspect they may also contribute to creativity.\n\n6 The search for the source of creativity continues. Most researchers agree that the answer will be complex and that there is probably no single characteristic which can explain the world's most creative minds.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8615"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04e9630fc41de10ece6fc84b428bb2ccad27670646606bfc37405b6e15d4c67e.mp3","continueOnPage":true}},{"id":"B05-RW-U05-classroom:resource:b8642","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/53cca8e1e98c21c4c6201fc588e06a292ff6261d5bc8c95434e0c1ac415acdab.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["conduct a study (v phr) to do academic research, such as an experiment\ncontend (v) claim\ncontrol group (n phr) participants in an experiment who do not receive experimental treatment\nestablish a causal link (v phr) to show a cause and effect connection","experimental group (n phr) participants in an experiment who receive experimental treatment\nimplications (n) conclusions suggested by the results of an academic study\nintervention (n) action taken to deal with a problem\nresearch subjects (n) all the participants in an experiment"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U05-classroom:material:RW-M04","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe6f4cbb449b97886663a21a67f5bf87541baed5d1319a1a1c71ea378c796dd2.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Most of us would like to be more creative, but we assume there is little we can do about it. Is creativity indeed something that only some of us are born with? Perhaps, but current thinking suggests we should not be satisfied with our inborn talents. Psychology professor K. Anders Ericsson claims that with enough practice, any of us can become experts, in ice skating, piano or anything else. However, he is quick to add that this requires a specific kind of practice and lots of it – about 10,000 hours. To develop expertise, simple repetition is not enough; what Ericsson calls 'deliberate practice', is required: that is, pushing beyond one's comfort zone¹ and setting goals that are above one's current level of performance. The more deliberate practice, the better the performance. In his 2016 book, Peak: Secrets from the New Science of Expertise, Ericsson says he has spent 30 years looking 'for kinds of limits that would actually constrain some individuals from being successful ...'. He says he has yet to find those limits and he doesn't believe they exist. Not everyone agrees,","sourcePage":120},{"body":"however. A 2014 study concluded that practice explains only about 25% of the difference between top performers and performers who were just 'very good'. The rest was due to natural ability. Still, 25% is not insignificant.","sourcePage":120},{"body":"2 Ericsson has looked primarily at artistic and athletic expertise, but can these findings apply to creativity? Is it a skill, like ice skating or playing the piano? Can we learn to be more creative? Most experts agree that even if most people cannot hope to become creative geniuses, they can learn to become more creative through practice. Psychologists contend that there are actually two levels of creativity, which they refer to as 'Big C' and 'small c'. Big C creativity applies to breakthrough ideas, ones that may change the course of a field or even history. It's unlikely that any amount of practice can lead ordinary thinkers to Big C creativity. Small c, however, is a different story. Small c creativity refers to everyday creative problem solving, like creating a new recipe or improving a process, which psychologists subdivide further into convergent and divergent thinking. Convergent thinking involves examining all the facts and arriving at a single solution. In contrast, divergent thinking involves coming up with many possible solutions – for example, thinking of many different","sourcePage":120},{"body":"uses for a brick or a paperclip. What most people think of as creativity generally involves divergent thinking. And divergent thinking can be taught, practised and learned.\n3 Even with practice, divergent thinking alone cannot make one creative, however. Scott Barry Kaufman, a cognitive psychologist, says that most creative people share one personality trait: openness to new experience. Since this trait and these processes have been identified, less creative people can try to emulate them. Creativity experts advise that we be open to many different and possibly contradictory ideas, that we take time to let our own ideas form and develop, allowing new connections to become apparent. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.","sourcePage":120},{"body":"4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.","sourcePage":120},{"body":"¹comfort zone (n phr) a familiar place or situation in which you feel at ease","sourcePage":120}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U05-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":120,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe6f4cbb449b97886663a21a67f5bf87541baed5d1319a1a1c71ea378c796dd2.png","width":772,"height":1040}],"source":120,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Most of us would like to be more creative, but we assume there is little we can do about it. Is creativity indeed something that only some of us are born with? Perhaps, but current thinking suggests we should not be satisfied with our inborn talents. Psychology professor K. Anders Ericsson claims that with enough practice, any of us can become experts, in ice skating, piano or anything else. However, he is quick to add that this requires a specific kind of practice and lots of it – about 10,000 hours. To develop expertise, simple repetition is not enough; what Ericsson calls 'deliberate practice', is required: that is, pushing beyond one's comfort zone¹ and setting goals that are above one's current level of performance. The more deliberate practice, the better the performance. In his 2016 book, Peak: Secrets from the New Science of Expertise, Ericsson says he has spent 30 years looking 'for kinds of limits that would actually constrain some individuals from being successful ...'. He says he has yet to find those limits and he doesn't believe they exist. Not everyone agrees,","sourcePage":120},{"body":"however. A 2014 study concluded that practice explains only about 25% of the difference between top performers and performers who were just 'very good'. The rest was due to natural ability. Still, 25% is not insignificant.","sourcePage":120},{"body":"2 Ericsson has looked primarily at artistic and athletic expertise, but can these findings apply to creativity? Is it a skill, like ice skating or playing the piano? Can we learn to be more creative? Most experts agree that even if most people cannot hope to become creative geniuses, they can learn to become more creative through practice. Psychologists contend that there are actually two levels of creativity, which they refer to as 'Big C' and 'small c'. Big C creativity applies to breakthrough ideas, ones that may change the course of a field or even history. It's unlikely that any amount of practice can lead ordinary thinkers to Big C creativity. Small c, however, is a different story. Small c creativity refers to everyday creative problem solving, like creating a new recipe or improving a process, which psychologists subdivide further into convergent and divergent thinking. Convergent thinking involves examining all the facts and arriving at a single solution. In contrast, divergent thinking involves coming up with many possible solutions – for example, thinking of many different","sourcePage":120},{"body":"uses for a brick or a paperclip. What most people think of as creativity generally involves divergent thinking. And divergent thinking can be taught, practised and learned.\n3 Even with practice, divergent thinking alone cannot make one creative, however. Scott Barry Kaufman, a cognitive psychologist, says that most creative people share one personality trait: openness to new experience. Since this trait and these processes have been identified, less creative people can try to emulate them. Creativity experts advise that we be open to many different and possibly contradictory ideas, that we take time to let our own ideas form and develop, allowing new connections to become apparent. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.","sourcePage":120},{"body":"4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.","sourcePage":120},{"body":"¹comfort zone (n phr) a familiar place or situation in which you feel at ease","sourcePage":120}],"text":"1 Most of us would like to be more creative, but we assume there is little we can do about it. Is creativity indeed something that only some of us are born with? Perhaps, but current thinking suggests we should not be satisfied with our inborn talents. Psychology professor K. Anders Ericsson claims that with enough practice, any of us can become experts, in ice skating, piano or anything else. However, he is quick to add that this requires a specific kind of practice and lots of it – about 10,000 hours. To develop expertise, simple repetition is not enough; what Ericsson calls 'deliberate practice', is required: that is, pushing beyond one's comfort zone¹ and setting goals that are above one's current level of performance. The more deliberate practice, the better the performance. In his 2016 book, Peak: Secrets from the New Science of Expertise, Ericsson says he has spent 30 years looking 'for kinds of limits that would actually constrain some individuals from being successful ...'. He says he has yet to find those limits and he doesn't believe they exist. Not everyone agrees,\nhowever. A 2014 study concluded that practice explains only about 25% of the difference between top performers and performers who were just 'very good'. The rest was due to natural ability. Still, 25% is not insignificant.\n2 Ericsson has looked primarily at artistic and athletic expertise, but can these findings apply to creativity? Is it a skill, like ice skating or playing the piano? Can we learn to be more creative? Most experts agree that even if most people cannot hope to become creative geniuses, they can learn to become more creative through practice. Psychologists contend that there are actually two levels of creativity, which they refer to as 'Big C' and 'small c'. Big C creativity applies to breakthrough ideas, ones that may change the course of a field or even history. It's unlikely that any amount of practice can lead ordinary thinkers to Big C creativity. Small c, however, is a different story. Small c creativity refers to everyday creative problem solving, like creating a new recipe or improving a process, which psychologists subdivide further into convergent and divergent thinking. Convergent thinking involves examining all the facts and arriving at a single solution. In contrast, divergent thinking involves coming up with many possible solutions – for example, thinking of many different\nuses for a brick or a paperclip. What most people think of as creativity generally involves divergent thinking. And divergent thinking can be taught, practised and learned.\n3 Even with practice, divergent thinking alone cannot make one creative, however. Scott Barry Kaufman, a cognitive psychologist, says that most creative people share one personality trait: openness to new experience. Since this trait and these processes have been identified, less creative people can try to emulate them. Creativity experts advise that we be open to many different and possibly contradictory ideas, that we take time to let our own ideas form and develop, allowing new connections to become apparent. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.\n4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.\n¹comfort zone (n phr) a familiar place or situation in which you feel at ease","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a1cb0c0ebf2dde8b749b9b51e74c3a5184c22bab10392ff8948041e909193ae.mp3"},"original":{"id":"B05-RW-U05-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U05","book":5,"track":"RW","unit":5,"title":"READING 2","kind":"material","pages":[120],"sourceImages":[{"page":120,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fe6f4cbb449b97886663a21a67f5bf87541baed5d1319a1a1c71ea378c796dd2.png","viewEvidenceReported":true}],"text":"1 Most of us would like to be more creative, but we assume there is little we can do about it. Is creativity indeed something that only some of us are born with? Perhaps, but current thinking suggests we should not be satisfied with our inborn talents. Psychology professor K. Anders Ericsson claims that with enough practice, any of us can become experts, in ice skating, piano or anything else. However, he is quick to add that this requires a specific kind of practice and lots of it – about 10,000 hours. To develop expertise, simple repetition is not enough; what Ericsson calls 'deliberate practice', is required: that is, pushing beyond one's comfort zone¹ and setting goals that are above one's current level of performance. The more deliberate practice, the better the performance. In his 2016 book, Peak: Secrets from the New Science of Expertise, Ericsson says he has spent 30 years looking 'for kinds of limits that would actually constrain some individuals from being successful ...'. He says he has yet to find those limits and he doesn't believe they exist. Not everyone agrees, however. A 2014 study concluded that practice explains only about 25% of the difference between top performers and performers who were just 'very good'. The rest was due to natural ability. Still, 25% is not insignificant.\n\n2 Ericsson has looked primarily at artistic and athletic expertise, but can these findings apply to creativity? Is it a skill, like ice skating or playing the piano? Can we learn to be more creative? Most experts agree that even if most people cannot hope to become creative geniuses, they can learn to become more creative through practice. Psychologists contend that there are actually two levels of creativity, which they refer to as 'Big C' and 'small c'. Big C creativity applies to breakthrough ideas, ones that may change the course of a field or even history. It's unlikely that any amount of practice can lead ordinary thinkers to Big C creativity. Small c, however, is a different story. Small c creativity refers to everyday creative problem solving, like creating a new recipe or improving a process, which psychologists subdivide further into convergent and divergent thinking. Convergent thinking involves examining all the facts and arriving at a single solution. In contrast, divergent thinking involves coming up with many possible solutions – for example, thinking of many different uses for a brick or a paperclip. What most people think of as creativity generally involves divergent thinking. And divergent thinking can be taught, practised and learned.\n\n3 Even with practice, divergent thinking alone cannot make one creative, however. Scott Barry Kaufman, a cognitive psychologist, says that most creative people share one personality trait: openness to new experience. Since this trait and these processes have been identified, less creative people can try to emulate them. Creativity experts advise that we be open to many different and possibly contradictory ideas, that we take time to let our own ideas form and develop, allowing new connections to become apparent. Normally, we tend to reproduce what we already know because conformity is comfortable, and new ideas – in other words, creative ones – move us into unfamiliar territory.\n\n4 This unfamiliar territory involves risks - risk of failure and risk of criticism - as well as a willingness to carry on in the face of failure. Creative thinkers accept that not all their ideas will work. In general, creative artists, inventors and scientists come up with a huge number of ideas, knowing that many of them will not succeed. Ernest Hemingway wrote 47 different endings for his novel A Farewell to Arms before he found one that worked. Thomas Edison came up with dozens of inventions that failed and over a thousand versions of his lightbulb before he found success.\n\n5 Moving outside of our comfort zone¹, engaging in deliberate practice and tolerating contradictory ideas, risk and failure are all things we can learn to do better. It is unlikely that doing so will transform any of us into creative geniuses, but it does have the potential to increase our level of creativity.\n\n¹comfort zone (n phr) a familiar place or situation in which you feel at ease","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8629"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a1cb0c0ebf2dde8b749b9b51e74c3a5184c22bab10392ff8948041e909193ae.mp3","continueOnPage":true}},{"id":"B05-RW-U05-classroom:review-1","book":5,"unit":5,"track":"RW","topic":"PSYCHOLOGY","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28a96389df5705d523e16e0286706495d8116b051a89753e2ba6b65a3d7a697c.png"],"layout":"list","in    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

function wireMaterials(doc,c,decks){

 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);

  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);

function vocabularyPlacement(c,page){

  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };

async function display(i,p=0){

 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}

 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);
}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;

 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];

 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
function inspectOriginalButton(button){

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};

 },
 async runReuse(){

 },
 async runLessonFlow(){

 },

  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},

};
