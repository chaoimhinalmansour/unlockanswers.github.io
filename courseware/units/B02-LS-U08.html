"prompt":"This video is about space and ...","options":["how we can travel to space every year.","how sending things into space can help us."],"type":"choice/closed"},{"id":"b3164.i02","label":"2","prompt":"Weather satellites ...","options":["can see large areas of the Earth to look for dangerous weather.","can't see the weather at night."],"type":"choice/closed"},{"id":"b3164.i03","label":"3","prompt":"Space research is important because ...","options":["Earth has too many people, so we need people to live on Mars.","if we understand space, our future lives may be better."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3164.i01","label":"1","prompt":"This video is about space and ...","options":["how we can travel to space every year.","how sending things into space can help us."],"type":"choice/closed"},{"kind":"item","id":"b3164.i02","label":"2","prompt":"Weather satellites ...","options":["can see large areas of the Earth to look for dangerous weather.","can't see the weather at night."],"type":"choice/closed"},{"kind":"item","id":"b3164.i03","label":"3","prompt":"Space research is important because ...","options":["Earth has too many people, so we need people to live on Mars.","if we understand space, our future lives may be better."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/717bda4a3364315d30d1f529-L2LS-U08.mp4","captions":[{"start":0,"end":5,"text":"People started exploring space in the 1950s."},{"start":6.4,"end":10.44,"text":"Now, thousands of objects travel into space every year."},{"start":12.06,"end":14.38,"text":"But have you ever asked yourself why?"},{"start":15.74,"end":19.52,"text":"Sending things into space is very expensive."},{"start":21.16,"end":22.02,"text":"So,"},{"start":22.48,"end":24.76,"text":"how does space actually help us?"},{"start":26.2,"end":28.36,"text":"Well, we can understand the weather."},{"start":30.36,"end":31.64,"text":"This is a hurricane."},{"start":32.38,"end":33.16,"text":"From space,"},{"start":33.54,"end":36.28,"text":"we can see the whole hurricane, even at night,"},{"start":36.68,"end":39.52,"text":"by using images sent from a satellite's instruments."},{"start":41.7,"end":45.1,"text":"Some weather satellites travel at three km per second,"},{"start":45.54,"end":47.68,"text":"36 ,000 km above the Earth."},{"start":48.44,"end":53.14,"text":"This means they always stay in exactly the same place\nabove the Earth."},{"start":53.14,"end":57.12,"text":"And they can see how the weather is changing over a\nwhole continent."},{"start":59.46,"end":61.48,"text":"This wouldn't be possible on Earth."},{"start":63.44,"end":63.84,"text":"So,"},{"start":64.18,"end":71.34,"text":"the view from space helps us understand the hurricane\nand to know what it's going to do next."},{"start":73.3,"end":77.94,"text":"This means that people can be ready for dangerous\nweather and stay safe."},{"start":79.4,"end":83.62,"text":"Many people use GPS technology for driving."},{"start":85.72,"end":88.56,"text":"GPS works because a satellite has a clock,"},{"start":89.03999999999999,"end":92.58,"text":"which shares information about its location and time."},{"start":94.56,"end":95.78,"text":"Cars have sensors,"},{"start":96.14,"end":101.94,"text":"which compare the information from the satellite with\ninformation about their own location and time."},{"start":103.5,"end":111.36,"text":"This shows their exact distance from the satellite and\nexactly where they are, so drivers can plan their\njourneys."},{"start":112.97999999999999,"end":116.74000000000001,"text":"Some things were made for space and are now used on\nEarth, too."},{"start":117.16,"end":121.28,"text":"These solar panels make electricity on the\nInternational Space Station."},{"start":123.22,"end":128.14,"text":"And now, solar panels are cheap and make clean\nelectricity all over the world."},{"start":128.32,"end":130.06,"text":"And it's because of space research."},{"start":131.18,"end":135.8,"text":"Some people think that space could even be a place to\nlive."},{"start":137.66,"end":140.92000000000002,"text":"With more and more people on our crowded Earth,"},{"start":142.12,"end":149.86,"text":"US scientists are looking for life on Mars and studying\nits weather and its rocks."},{"start":151.84,"end":154.7,"text":"This will show if people can go to Mars."},{"start":156.42000000000002,"end":158.24,"text":"First, to do research."},{"start":160.07999999999998,"end":162.02,"text":"And possibly to stay there."},{"start":163.96,"end":165.56,"text":"We don't know if that will happen,"},{"start":165.86,"end":167.36,"text":"but we do know one thing."},{"start":167.92000000000002,"end":172,"text":"Understanding space will be very important for our\nlives in the future."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"lb la 36","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f758293dbb1771465a5b9eb37377e1435f9a4ea46f6e5e9e1df25dc59b9c26ee.pdf","pdfPage":59,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-LS-U08-question:b3165","book":2,"unit":8,"track":"LS","topic":"THE UNIVERSE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Circle the correct answer. Then compare your answers with a partner.","pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a1babbaf79db8ec8fb4c2a371830a0bd80508b9d1bfa814802c8b9942c275082.png"],"provided":"","items":[{"id":"b3165.i01","label":"1","prompt":"Hu nary to help you. Which words are new for you?","pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/829cbd1618aabbcc5c9596d7172d8b65bb0efb3e3834d780dd14cd88f69e6db7.png"],"provided":"## Space Junk: This week's podcast\n\nThere's a lot to explore in space, out beyond our moon and off to the stars far away. But to reach space and make long journeys, we have a lot to learn. One way to learn about space is to send satellites from Earth. Satellites can take photos of the surface of other planets, like Mars or Venus, to show us the land and if there is water. These satellites move on a path in space around the Earth. Other research is done by scientists in spacecraft such as the International Space Station (ISS). But when things break or stop working in space, they're often just left there. This debris is called 'space junk'. Space junk can cause lots of problems for both scientists in space and researchers on Earth, so they want to find ways to clear it. Be sure to listen to this week's podcast, 'Space Junk', to learn more about this problem and what people are doing about it.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## Space Junk: This week's podcast"},{"kind":"text","text":"There's a lot to explore in space, out beyond our moon and off to the stars far away. But to reach space and make long journeys, we have a lot to learn. One way to learn about space is to send satellites from Earth. Satellites can take photos of the surface of other planets, like Mars or Venus, to show us the land and if there is water. These satellites move on a path in space around the Earth. Other research is done by scientists in spacecraft such as the International Space Station (ISS). But when things break or stop working in space, they're often just left there. This debris is called 'space junk'. Space junk can cause lots of problems for both scientists in space and researchers on Earth, so they want to find ways to clear it. Be sure to listen to this week's podcast, 'Space Junk', to learn more about this problem and what people"},{"kind":"text","text":"are doing about it."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"explore (v) to travel around a  place to find out what is\nthere\nbeyond  (prep) on the other side of something\njourney  (n) a long trip from one place  to another\nsatellite (n) an object that  is sent into  space around the\nEarth to  receive and send information\nsurface  (n) the top or outside  part of something\nplanet  (n) a large,  round object in space that moves\naround the sun or another star\nspacecraft  (n) a vehicle  that can travel into space","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f758293dbb1771465a5b9eb37377e1435f9a4ea46f6e5e9e1df25dc59b9c26ee.pdf","pdfPage":60,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-LS-U08-question:b3179","book":2,"unit":8,"track":"LS","topic":"THE UNIVERSE","lesson":1,"order":14,"module":"LISTENING 1","ex":"6","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Complete the questions with the correct form of the words in bold from Exercise 5. Then work with a partner and answer the questions.","pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9f458b288a8dcb013ad35184d69277d02c28278ecbe95abb4f4f4f74fe113f0a.png"],"provided":"","items":[{"id":"b3179.i01","label":"1","prompt":"Do you want to travel in a ____ to see the Earth from space? Why / Why not?","options":[],"type":"gap/open"},{"id":"b3179.i02","label":"2","prompt":"Do you think humans will ever make a ____ t  Use a dictionary to help you. Which words have similar meanings? Which words are new for you?","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/288ea944494a819617f52a4013cd71205175d34d22fb00bec1c3a8c7280a402f.png"],"provided":"What are some of the impacts of space exploration? One is that space exploration needs spaceports, just like aeroplane travel needs airports. Private companies look at many places to build on so they can choose the best option. But there are issues with building new spaceports. People don't want large spaceports near them. They worry about the effects of noise and light on people and animals living nearby. They think accidents at the spaceports also might be a problem. One solution might be to build small spaceports to send very small rockets into space. Another alternative is to just use the spaceports we already have because they can fly more rockets than they do now.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"What are some of the impacts of space exploration? One is that space exploration needs spaceports, just like aeroplane travel needs airports. Private companies look at many places to build on so they can choose the best option. But there are issues with building new spaceports. People don't want large spaceports near them. They worry about the effects of noise and light on people and animals living nearby. They think accidents at the spaceports also might be a problem. One solution might be to build small spaceports to send very small rockets into space. Another alternative is to just use the spaceports we already have because they can fly more rockets than they do now."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"impact (n) the  effect that a  person,  event or situation  has\non someone or something\noption (n) a choice","refer ook":2,"unit":8,"topic":"THE UNIVERSE","track":"LS","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[168],"sourcePages":[168],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a29720c8cc9c13022ddcef3aecfc91a460ea85598f829af3f6e208d4ccdd4ee4.png"],"sourceHashes":["a29720c8cc9c13022ddcef3aecfc91a460ea85598f829af3f6e208d4ccdd4ee4"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Speaking task","text":"Discuss how to get children interested in space exploration."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about space research."},{"label":"Listening skill","text":"Understand meaning from context."},{"label":"Critical thinking","text":"Find the best solution to a problem."},{"label":"Grammar","text":"Use the second conditional."},{"label":"Speaking skills","text":"Take turns in a discussion; show levels of agreement."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":168,"alt":""}}]}},{"id":"B02-LS-U08-classroom:resource:b3162","book":2,"unit":8,"track":"LS","topic":"THE UNIVERSE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[170],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4292985bb537d11f8b4a6770d0247de2b1b24ff67aa354183c85666b3e4a8323.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"explore","pos":"(v)","definition":"to go around a new place to find out what is there","example":"Scientists want to explore other planets.","wordAudio":"explore","cardWord":false},{"term":"instrument","pos":"(n)","definition":"a tool that is used for doing something","example":"The doctor used a small instrument to examine my ear.","wordAudio":"instrument","cardWord":false},{"term":"object","pos":"(n)","definition":"a thing that you can see or touch","example":"She picked up a small metal object from the floor.","wordAudio":"object","cardWord":false},{"term":"research","pos":"(n)","definition":"detailed study of a subject in order to discover new information","example":"Her research examines how children learn to read.","wordAudio":"research","cardWord":false},{"term":"GPS","pos":"(abbreviation)","definition":"Global Positioning System: used to show where something is on a map, drivers often use it to find places","example":"The driver used GPS to find the station.","wordAudio":"GPS","cardWord":false}]]}},{"id":"B02-LS-U08-classroom:video","book":2,"unit":8,"track":"LS","topic":"THE UNIVERSE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[170],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4292985bb537d11f8b4a6770d0247de2b1b24ff67aa354183c85666b3e4a8323.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/717bda4a3364315d30d1f529-L2LS-U08.mp4","captions":[{"start":0,"end":5,"text":"People started exploring space in the 1950s."},{"start":6.4,"end":10.44,"text":"Now, thousands of objects travel into space every year."},{"start":12.06,"end":14.38,"text":"But have you ever asked yourself why?"},{"start":15.74,"end":19.52,"text":"Sending things into space is very expensive."},{"start":21.16,"end":22.02,"text":"So,"},{"start":22.48,"end":24.76,"text":"how does space actually help us?"},{"start":26.2,"end":28.36,"text":"Well, we can understand the weather."},{"start":30.36,"end":31.64,"text":"This is a hurricane."},{"start":32.38,"end":33.16,"text":"From space,"},{"start":33.54,"end":36.28,"text":"we can see the whole hurricane, even at night,"},{"start":36.68,"end":39.52,"text":"by using images sent from a satellite's instruments."},{"start":41.7,"end":45.1,"text":"Some weather satellites travel at three km per second,"},{"start":45.54,"end":47.68,"text":"36 ,000 km above the Earth."},{"start":48.44,"end":53.14,"text":"This means they always stay in exactly the same place\nabove the Earth."},{"start":53.14,"end":57.12,"text":"And they can see how the weather is changing over a\nwhole continent."},{"start":59.46,"end":61.48,"text":"This wouldn't be possible on Earth."},{"start":63.44,"end":63.84,"text":"So,"},{"start":64.18,"end":71.34,"text":"the view from space helps us understand the hurricane\nand to know what it's going to do next."},{"start":73.3,"end":77.94,"text":"This means that people can be ready for dangerous\nweather and stay safe."},{"start":79.4,"end":83.62,"text":"Many people use GPS technology for driving."},{"start":85.72,"end":88.56,"text":"GPS works because a satellite has a clock,"},{"start":89.03999999999999,"end":92.58,"text":"which shares information about its location and time."},{"start":94.56,"end":95.78,"text":"Cars have sensors,"},{"start":96.14,"end":101.94,"text":"which compare the information from the satellite with\ninformation about their own location and time."},{"start":103.5,"end":111.36,"text":"This shows their exact distance from the satellite and\nexactly where they are, so drivers can plan their\njourneys."},{"start":112.97999999999999,"end":116.74000000000001,"text":"Some things were made for space and are now used on\nEarth, too."},{"start":117.16,"end":121.28,"text":"These solar panels make electricity on the\nInternational Space Station."},{"start":123.22,"end":128.14,"text":"And now, solar panels are cheap and make clean\nelectricity all over the world."},{"start":128.32,"end":130.06,"text":"And it's because of space research."},{"start":131.18,"end":135.8,"text":"Some people think that space could even be a place to\nlive."},{"start":137.66,"end":140.92000000000002,"text":"With more and more people on our crowded Earth,"},{"start":142.12,"end":149.86,"text":"US scientists are looking for life on Mars and studying\nits weather and its rocks."},{"start":151.84,"end":154.7,"text":"This will show if people can go to Mars."},{"start":156.42000000000002,"end":158.24,"text":"First, to do research."},{"start":160.07999999999998,"end":162.02,"text":"And possibly to stay there."},{"start":163.96,"end":165.56,"text":"We don't know if that will happen,"},{"start":165.86,"end":167.36,"text":"but we do know one thing."},{"start":167.92000000000002,"end":172,"text":"Understanding space will be very important for our\nlives in the future."}],"launchInline":true}},{"id":"B02-LS-U08-classroom:resource:b3178","book":2,"unit":8,"track":"LS","topic":"THE UNIVERSE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/829cbd1618aabbcc5c9596d7172d8b65bb0efb3e3834d780dd14cd88f69e6db7.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"5","pages":[[{"term":"clear","pos":"(v)","definition":"to take away objects and create more space","example":"Please clear the table so we can use it for our project.","wordAudio":"clear","cardWord":false},{"term":"debris","pos":"(n)","definition":"broken pieces of something","example":"Debris from the broken satellite remained in sp function measure(doc){

 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });

 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};

});

if(saved)results=JSON.parse(saved.textContent);

if(reuse)comparisonResults=JSON.parse(reuse.textContent);
 const school=document.getElementById("saved-lesson-results");
 if(school)lessonResults=JSON.parse(school.textContent);
const scopes=new Map();
for(const c of primary){
 const key=c.track+c.lesson;
 const group=scopes.get(key)??{track:c.track,lesson:c.lesson,total:0};
 group.total++;scopes.set(key,group);
}
for(const [key,group] of scopes){
 document.getElementById("lesson-filter").add(new Option((group.track==="RW"?"读写":"听说")+"第 "+group.lesson+" 节，"+group.total+" 题",key));
}
for(const entry of document.querySelectorAll(".summary [data-ref], #digital-examples option[value]:not([value=\"\"])")){
 entry.hidden=!classroom.byId.has(entry.dataset.ref??entry.value);
}

for(const book of new Set([...classroom.openings,...classroom.glossaries].map(c=>c.book)))openingBook.add(new Option("Book "+book,String(book)));
sequenceView.querySelector('[value="openings"]').hidden=!classroom.openings.length;
sequenceView.querySelector('[value="glossaries"]').hidden=!classroom.glossaries.length;
const startView=new URLSearchParams(location.search).get("view");
if(classroom.openings.length&&startView==="openings")sequenceView.value="openings";
if(classroom.glossaries.length&&startView==="glossaries")sequenceView.value="glossaries";
const selectedLesson=new URLSearchParams(location.search).get("lesson");
if(/^[12]$/.test(selectedLesson??""))document.getElementById("lesson-filter").value=primary[0].track+selectedLesson;
updateSequenceHeading();
summaries();display(navigationOrder()[0]??0);
