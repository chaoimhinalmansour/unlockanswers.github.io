s not an easy life though,"},{"start":85.56,"end":87.86,"text":"the work is hard and tiring."},{"start":90.12,"end":92.52000000000001,"text":"Vince works 12 hours a day,"},{"start":93,"end":95.06,"text":"whether it is hot or cold,"},{"start":95.66,"end":98.47999999999999,"text":"raining or even snowing."},{"start":100.47999999999999,"end":104.18,"text":"Most of the pieces of gold Vince finds are very small."},{"start":104.18,"end":106.32,"text":"On a good day,"},{"start":106.66,"end":110.24000000000001,"text":"he can find about 200 pounds worth of gold."},{"start":111.18,"end":113.62,"text":"But he is not usually that lucky."},{"start":114.6,"end":117.9,"text":"Some days he finds just a few pounds worth,"},{"start":118.36,"end":120.34,"text":"or even nothing at all."},{"start":122.1,"end":124.04,"text":"When Vince worked in an office,"},{"start":124.58,"end":127.72,"text":"he earned around 50 ,000 pounds a year."},{"start":127.72,"end":132.4,"text":"Now he only earns about 12 ,000 pounds,"},{"start":133.22,"end":135.42,"text":"only enough for the things he needs."},{"start":136.64,"end":139.02,"text":"But Vince doesn't do it for the money."},{"start":142.28,"end":145.76,"text":"Being a gold prospector is his dream job."},{"start":148.12,"end":152.32,"text":"He says he wishes more people would follow their\ndreams."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F; Vince’s job is finding gold. 2 T 3 T 4 F; Looking\nfor gold is not easy. 5 T 6 T","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U07-question:b3919","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH eople. Paragraph: ____","options":[],"type":"gap/closed"},{"id":"b3932.i04","label":"d","prompt":"Ben became ill and lost his eyes. Paragraph: ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3932.i01","label":"a","prompt":"Ben learnt to 'see' again. Paragraph: ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b3932.i02","label":"b","prompt":"Ben was an ordinary boy, but he could do something amazing. Paragraph: ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b3932.i03","label":"c","prompt":"Ben became a hero for many people. Paragraph: ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b3932.i04","label":"d","prompt":"Ben became ill and lost his eyes. Paragraph: ____","options":[],"type":"gap/closed"}]],"courseMaterials":[{"id":"B02-RW-U07-classroom:material:RW-M03","title":"READING 1","text":"bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  \n2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  \n3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.\n4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled\n[IMAGE_3]","screens":["bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  ","2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when e that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  \n2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  \n3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.\n4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled\n[IMAGE_3]","screens":["bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  ","2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  ","3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.","4 Scientists and doctors were amazed b k":"RW","topic":"PEOPLE","lesson":2,"order":24,"module":"READING 2","ex":"1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read some more blog posts about incredible people. Read the sentences (1–8). Write the correct form of the bold words next to the definitions (a–h).","pages":[154],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/75a6419fc38226122a68f9b3f68e4094059eb0a12fc8acf055056de3a31660c6.png"],"provided":"1 My mum thinks I'm too young to look after my little sister, so a babysitter comes to my house every day.\n2 The tournament was a success because all the games were exciting. There were 48 teams in total.\n3 Aisha runs at least 16 kilometres every morning to train for the upcoming race.\n4 Two million people came to the city centre to protest against high income tax.\n5 People say Terence Tao is one of the most intelligent people in the world. He got a PhD at the age of 20 and became a Maths professor at the age of 24.\n6 Eugene was brave when he ran into a burning house to save an elderly woman. He could have died, but he did it anyway.\n7 Many people in the company went on strike because of low pay and problems with taking holidays.\n8 William graduated from university and then decided to follow his dream of opening a restaurant.","items":[{"id":"b3946.i01","label":"a","prompt":"____ (n) something that you really want to do, be or have in the future","options":["look after","tournament","train","protest","intelligent","brave","strike","dream"],"type":"choice/closed"},{"id":"b3946.i02","label":"b","prompt":"____ (phr v) to care for somebody or something by keeping them healthy or in a good condition","options":["look after","tournament","train","protest","intelligent","brave","strike","dream"],"type":"choice/closed"},{"id":"b3946.i03","label":"c","prompt":"____ (adj) not showing fear of dangerous or diffi {"kind":"item","id":"b3946.i07","label":"g","prompt":"____ (v) to show you disagree with something by shouting and carrying signs","options":["look after","tournament","train","protest","intelligent","brave","strike","dream"],"type":"choice/closed"},{"kind":"item","id":"b3946.i08","label":"h","prompt":"____ (v) to begin a period of refusing to work because of an argument with an employer","options":["look after","tournament","train","protest","intelligent","brave","strike","dream"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a dream b look after c brave d tournament\ne intelligent f train g protest h go on strike","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":59,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U07-question:b3947","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":2,"order":25,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read about famous role models. Before you read, discuss the questions below in pairs or a group.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b3b5fbce845147ae9a3c02b4760cc77382580de838971a6f1e093acee228dba8.png"],"provided":"","items":[{"id":"b3947.i01","label":"1","prompt":"Look at the photos of the people in the text on page 156. What do you know about them?","options":[],"type":"discuss/open"},{"id":"b3947.i02","label":"2","prompt":"Twitter (now X) is described as 'an intelligent way to communicate'. What do you think this means?","options":[],"type":"discuss/open"},{"id":"b3947.i03","label":"3","prompt":"In the text, the author describes Greta Thunberg as brave. Why, do you think, is this the case?","options":[],"type":"discuss/open"},{"id":"b3947.i04","label":"4","prompt":"Do you have a role model, i.e., somebody you try to behave like because you admire them? Who are they? Why do you admire them?","options":[],"type":"discuss/open"},{"id":"b3947.i05","label":"5","prompt":"What are some of your dreams for your future?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3947.i01","label":"1","prompt":"Look at the photos of the people in the text on page 156. What do you know about them?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3947.i02","label":"2","prompt":"Twitter (now X) is described as 'an intelligent way to communicate'. What do you think this means?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3947.i03","label":"3","prompt":"In the text, the author describes Greta Thunberg as brave. Why, do you think, is this the case?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3947.i04","label":"4","prompt":"Do you have a role model, i.e., somebody you try to behave like because you admire them? Who are they? Why do you admire them?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3947.i05","label":"5","prompt":"What are some of your dreams for your future?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1080e41b19a0131087231c9488370b1919723395ba8ae7efd6d5e3db37eb6b73.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U07-question:b3949","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":2,"order":26,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work in groups of four. Each student reads a different profile from the text. Take notes on your text. Write down key information.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b3b5fbce845147ae9a3c02b4760cc77382580de838971a6f1e093acee228dba8.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B02-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\nAhmed Aziz\n[IMAGE_1]\n5\nSay something...\nMARY EVANS\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for everyone and she always listens to me if I have a problem. She gives me advice and she is always right. I have a nephew who is sick and has to go to the hospital a lot. My mum often sleeps at the hospital with him. I really respect her because she always looks after my family and makes sure that we have everything we need.\nMark Evans\n[IMAGE_7]\n24\nSay something...\nENGLAND WOMEN'S NATIONAL FOOTBALL TEAM\n3 My role models are the England women's national football team, the Lionesses. In 2022 they won the European Women's Championship. The team of eleven young women were trained by Sarina Wiegman, and she helped them win the Championship. It was difficult for them because England had not won a major tournament since 1966. But in the end, they were the best team. They worked hard every day for their dream, so I really admire them.\nLi Chan\n[IMAGE_12]\n1\nSay something...\nGRETA THUNBERG\n4 Greta Thunberg is a brave young woman from Sweden. In 2018, at the age of 15, she protested outside the Swedish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\nJane Kloster\n[IMAGE_17]\n11\nSay something...","screens":["JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\nAhmed Aziz\n[IMAGE_1]\n5\nSay something...","MARY EVANS\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for ev edish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\nJane Kloster\n[IMAGE_17]\n11\nSay something...","screens":["JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\nAhmed Aziz\n[IMAGE_1]\n5\nSay something...","MARY EVANS\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for everyone and she always listens to me if I have a problem. She gives me advice and she is always right. I have a nephew who is sick and has to go to the hospital a lot. My mum often sleeps at the hospital with him. I really respect her because she always looks after my family and makes sure that we have everything we need.\nMark Evans\n[IMAGE_7]\n24\nSay something...","ENGLAND WOMEN'S NATIONAL FOOTBALL TEAM\n3 My role models are the England women's national football team, the Lionesses. In 2022 they won the European Women's Championship. The team of eleven young women were trained by Sarina Wiegman, and she helped them win the Championship. It was difficult for them because England had not won a major tournament since 1966. But in the end, they were the best team. They worked hard every day for their dream, so I really admire them.\nLi Chan\n[IMAGE_12]\n1\nSay something...","GRETA THUNBERG\n4 Greta Thunberg is a brave young woman from Sweden. In 2018, at the age of 15, she protested outside the Swedish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\nJane Kloster\n[IMAGE_17]\n11\nSay something..."],"sources":[{"page":156,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b47df7569a06682c8b7d8c5ed8bbfd8322f53e78e83ff70d6506fe244a1db5f.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_07e102b66f8fdc17.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1080e41b19a0131087231c9488370b1919723395ba8ae7efd6d5e3db37eb6b73.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U07-question:b3973","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKI rdWord":false},{"term":"shovel","pos":"(n)","definition":"a thing for moving stones, snow, etc.","example":"He used a shovel to clear the snow from the path.","wordAudio":"shovel","cardWord":false},{"term":"£20/$100, etc. worth of something","pos":"(phr)","definition":"the amount of something that you can buy or sell for £20/$100, etc.","example":"She bought twenty pounds' worth of vegetables.","wordAudio":"£20/$100, etc. worth of something","cardWord":false},{"term":"dream job","pos":"(n phr)","definition":"the perfect job. the job that you want more than any other","example":"For Leila, working with animals would be a dream job.","wordAudio":"dream job","cardWord":false}]]}},{"id":"B02-RW-U07-classroom:video","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1c59a9fdce90a4398d920608785f0cc57b06c914f0997f3dec103b18d5ab6842.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/18021dbb7106f6602d7e0177-L2RW-U07.mp4","captions":[{"start":0,"end":5.54,"text":"Vince Thurkettle is looking for gold in the Little Ouse\nRiver in the East of England."},{"start":5.98,"end":9.56,"text":"Finding gold is not just a hobby for Vince, it's his\njob."},{"start":10,"end":11.94,"text":"After 12 hours hard work,"},{"start":12.24,"end":15.98,"text":"he's found a piece and it's almost pure gold."},{"start":17.9,"end":23.24,"text":"Vince became a gold prospector after he met another\nprospector one day."},{"start":23.5,"end":27.96,"text":"The man told him all about where and how to find gold."},{"start":27.96,"end":35.02,"text":"Vince decided to leave his safe but boring office job\nand start looking for gold."},{"start":36.22,"end":40.4,"text":"His new job has taken him to every part of the world,"},{"start":40.88,"end":42.64,"text":"including Alaska,"},{"start":44.68,"end":45.48,"text":"Australia"},{"start":49.28,"end":50.86,"text":"and Finland."},{"start":52.14,"end":57.52,"text":"All he needed to get started was a shovel and a gold\npan,"},{"start":58.12,"end":61.06,"text":"which is just a metal or plastic dish."},{"start":61.42,"end":66.74,"text":"He uses this pan to carefully wash the stones from the\nbottom of the river."},{"start":67.12,"end":72.12,"text":"Gold is very heavy, so it always goes to the bottom of\nthe river."},{"start":72.4,"end":74.53999999999999,"text":"And because gold is so heavy,"},{"start":74.98,"end":77.48,"text":"it doesn't move very far down river."},{"start":77.48,"end":82.72,"text":"So where Vince finds one piece of gold, there is\nusually more nearby."},{"start":83.2,"end":85.24,"text":"It's not an easy life though,"},{"start":85.56,"end":87.86,"text":"the work is hard and tiring."},{"start":90.12,"end":92.52000000000001,"text":"Vince works 12 hours a day,"},{"start":93,"end":95.06,"text":"whether it is hot or cold,"},{"start":95.66,"end":98.47999999999999,"text":"raining or even snowing."},{"start":100.47999999999999,"end":104.18,"text":"Most of the pieces of gold Vince finds are very small."},{"start":104.18,"end":106.32,"text":"On a good day,"},{"start":106.66,"end":110.24000000000001,"text":"he can find about 200 pounds worth of gold."},{"start":111.18,"end":113.62,"text":"But he is not usually that lucky."},{"start":114.6,"end":117.9,"text":"Some days he finds just a few pounds worth,"},{"start":118.36,"end":120.34,"text":"or even nothing at all."},{"start":122.1,"end":124.04,"text":"When Vince worked in an office,"},{"start":124.58,"end":127.72,"text":"he earned around 50 ,000 pounds a year."},{"start":127.72,"end":132.4,"text":"Now he only earns about 12 ,000 pounds,"},{"start":133.22,"end":135.42,"text":"only enough for the things he needs."},{"start":136.64,"end":139.02,"text":"But Vince doesn't do it for the money."},{"start":142.28,"end":145.76,"text":"Being a gold prospector is his dream job."},{"start":148.12,"end":152.32,"text":"He says he wishes more people would follow their\ndreams."}],"launchInline":true}},{"id":"B02-RW-U07-classroom:resource:b3925","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/914f2fb3e64d137ff33349796339259ab2910d301ce2c2c315832eb3c7efe560.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["UNDERSTANDING KEY VOCABULARY\nblind (adj) not able to see\nincredible (adj) impossible or very difficult to believe; amazing\ninspire (v) to make other people feel that they want to do something","operation (n) the process when doctors cut your body to repair it or to remove something\nrespect (v) to like or to have a very good opinion of somebody because of their knowledge, achievements, etc.\ntalent (n) a natural ability to do something well"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U07-classroom:material:RW-M03","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/af0893e0dfda2d7ce94cdfb9bf0800b08a3fa797e6425045c15591bdc4ca0d21.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  ","sourcePage":151},{"body":"2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  ","sourcePage":151},{"body":"3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.","sourcePage":151},{"body":"4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled\n[IMAGE_3]","sourcePage":151}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U07-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"bout me","pages":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/af0893e0dfda2d7ce94cdfb9bf0800b08a3fa797e6425045c15591bdc4ca0d21.png","width":772,"height":1040}],"source":151,"embeddedIn":null,"photo":null,"clearPages":[{"body":"bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  ","sourcePage":151},{"body":"2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  ","sourcePage":151},{"body":"3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.","sourcePage":151},{"body":"4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled\n[IMAGE_3]","sourcePage":151}],"text":"bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]\n## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  \n2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  \n3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.\n4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled\n[IMAGE_3]","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_a13a54da9ef68796.mp3"},"original":{"id":"B02-RW-U07-material:RW-M03","entry":"material:RW-M03","unitId":"B02-RW-U07","book":2,"track":"RW","unit":7,"title":"READING 1","kind":"material","pages":[151],"sourceImages":[{"page":151,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/af0893e0dfda2d7ce94cdfb9bf0800b08a3fa797e6425045c15591bdc4ca0d21.png","viewEvidenceReported":true}],"text":"bout me\n\n[IMAGE_1]\n\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n\n[IMAGE_2]\n\n## /2023//Ben Underwood\n\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.  \n2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.  \n3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.\n\n4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled\n\n[IMAGE_3]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3930"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_a13a54da9ef68796.mp3","continueOnPage":true}},{"id":"B02-RW-U07-classroom:material:RW-M04","book":2,"unit":7,"track":"RW","topic":"PEOPLE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[156],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b47df7569a06682c8b7d8c5ed8bbfd8322f53e78e83ff70d6506fe244a1db5f.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\nAhmed Aziz\n[IMAGE_1]\n5\nSay something...","sourcePage":156},{"body":"MARY EVANS\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for everyone and she always listens to me if I have a problem. She gives me advice and she is always right. I have a nephew who is sick and has to go to the hospital a lot. My mum often sleeps at the hospital with him. I really respect her because she always looks after my family and makes sure that we have everything we need.\nMark Evans\n[IMAGE_7]\n24\nSay something...","sourcePage":156},{"body":"ENGLAND WOMEN'S NATIONAL FOOTBALL TEAM\n3 My role models are the England women's national football team, the Lionesses. In 2022 they won the European Women's Championship. The team of eleven young women were trained by Sarina Wiegman, and she helped them win the Championship. It was difficult for them because England had not won a major tournament since 1966. But in the end, they were the best team. They worked hard every day for their dream, so I really admire them.\nLi Chan\n[IMAGE_12]\n1\nSay something...","sourcePage":156},{"body":"GRETA THUNBERG\n4 Greta Thunberg is a brave young woman from Sweden. In 2018, at the age of 15, she protested outside the Swedish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\nJane Kloster\n[IMAGE_17]\n11\nSay something...","sourcePage":156}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U07-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"JACK DORSEY","pages":[{"page":156,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b47df7569a06682c8b7d8c5ed8bbfd8322f53e78e83ff70d6506fe244a1db5f.png","width":772,"height":1040}],"source":156,"embeddedIn":null,"photo":null,"clearPages":[{"body":"JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\nAhmed Aziz\n[IMAGE_1]\n5\nSay something...","sourcePage":156},{"body":"MARY EVANS\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for everyone and she always listens to me if I have a problem. She gives me advice and she is always right. I have a nephew who is sick and has to go to the hospital a lot. My mum often sleeps at the hospital with him. I really respect her because she always looks after my family and makes sure that we have everything we need.\nMark Evans\n[IMAGE_7]\n24\nSay something...","sourcePage":156},{"body":"ENGLAND WOMEN'S NATIONAL FOOTBALL TEAM\n3 My role models are the England women's national football team, the Lionesses. In 2022 they won the European Women's Championship. The team of eleven young women were trained by Sarina Wiegman, and she helped them win the Championship. It was difficult for them because England had not won a major tournament since 1966. But in the end, they were the best team. They worked hard every day for their dream, so I really admire them.\nLi Chan\n[IMAGE_12]\n1\nSay something...","sourcePage":156},{"body":"GRETA THUNBERG\n4 Greta Thunberg is a brave young woman from Sweden. In 2018, at the age of 15, she protested outside the Swedish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\nJane Kloster\n[IMAGE_17]\n11\nSay something...","sourcePage":156}],"text":"JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\nAhmed Aziz\n[IMAGE_1]\n5\nSay something...\nMARY EVANS\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for everyone and she always listens to me if I have a problem. She gives me advice and she is always right. I have a nephew who is sick and has to go to the hospital a lot. My mum often sleeps at the hospital with him. I really respect her because she always looks after my family and makes sure that we have everything we need.\nMark Evans\n[IMAGE_7]\n24\nSay something...\nENGLAND WOMEN'S NATIONAL FOOTBALL TEAM\n3 My role models are the England women's national football team, the Lionesses. In 2022 they won the European Women's Championship. The team of eleven young women were trained by Sarina Wiegman, and she helped them win the Championship. It was difficult for them because England had not won a major tournament since 1966. But in the end, they were the best team. They worked hard every day for their dream, so I really admire them.\nLi Chan\n[IMAGE_12]\n1\nSay something...\nGRETA THUNBERG\n4 Greta Thunberg is a brave young woman from Sweden. In 2018, at the age of 15, she protested outside the Swedish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\nJane Kloster\n[IMAGE_17]\n11\nSay something...","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_07e102b66f8fdc17.mp3"},"original":{"id":"B02-RW-U07-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U07","book":2,"track":"RW","unit":7,"title":"READING 2","kind":"material","pages":[156],"sourceImages":[{"page":156,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b47df7569a06682c8b7d8c5ed8bbfd8322f53e78e83ff70d6506fe244a1db5f.png","viewEvidenceReported":true}],"text":"JACK DORSEY\n\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business man. He works hard and is very kind. In 2016 he gave almost one third of his shares in Twitter to his employees. I respect him because he changed the way people use social media all over the world.\n\nAhmed Aziz\n\n[IMAGE_1]\n\n5\n\nSay something...\nMARY EVANS\n\n2 My mum, Mary Evans, is my role model. I have a very big family, with two brothers and three sisters. My mum worked very hard every day to look after us, and she was very busy. She always makes time for everyone and she always listens to me if I have a problem. She gives me advice and she is always right. I have a nephew who is sick and has to go to the hospital a lot. My mum often sleeps at the hospital with him. I really respect her because she always looks after my family and makes sure that we have everything we need.\n\nMark Evans\n\n[IMAGE_7]\n\n24\n\nSay something...\nENGLAND WOMEN'S NATIONAL FOOTBALL TEAM\n\n3 My role models are the England women's national football team, the Lionesses. In 2022 they won the European Women's Championship. The team of eleven young women were trained by Sarina Wiegman, and she helped them win the Championship. It was difficult for them because England had not won a major tournament since 1966. But in the end, they were the best team. They worked hard every day for their dream, so I really admire them.\n\nLi Chan\n\n[IMAGE_12]\n\n1\n\nSay something...\nGRETA THUNBERG\n\n4 Greta Thunberg is a brave young woman from Sweden. In 2018, at the age of 15, she protested outside the Swedish parliament for climate change. She has given speeches about climate change around the world in countries like the United States, France, Spain and the United Kingdom. In 2019, 4 million people went on strike for climate change after listening to her speeches. In 2019 she was on the cover of Time magazine. Greta is a good role model because she is brave, she never gives up and she tells the truth no matter what.\n\nJane Kloster\ rue}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B02-RW-U07-classroom:material:RW-M03":[{"body":"bout me\n[IMAGE_1]\nMy name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!\n[IMAGE_2]","sourcePage":151,"blocks":[{"kind":"text","text":"bout me"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"My name is Juliet Selby. I write about people that I admire. I write about a different person every week. Read about the real-life superheroes here!"},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"## /2023//Ben Underwood\n1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'.","sourcePage":151,"blocks":[{"kind":"text","text":"## /2023//Ben Underwood"},{"kind":"text","text":"1 Ben Underwood was a normal teenage boy. He loved playing basketball, riding his bike, listening to music with his friends and playing video games. But in one way, Ben was different from most other teenagers – he was blind. However, Ben had a special talent. He didn't have eyes, but he could still 'see'."}]},{"body":"2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his","sourcePage":151,"blocks":[{"kind":"text","text":"2 Ben was born on 26 January 1992. For the first two years of his life, Ben was a happy and healthy baby. He had a normal life, living with his mother and two older brothers in California. However, when Ben was two years old, his life changed. In 1994, he was taken to the hospital because he had problems with his eyes. The doctors looked at his"}]},{"body":"eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind.","sourcePage":151,"blocks":[{"kind":"text","text":"eyes and told his mother the bad news – Ben had cancer $^{1}$ . After a few months, he had an operation to remove the cancer. The operation was successful and Ben was fine. However, the doctors had to remove his eyes and Ben became blind."}]},{"body":"3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth","sourcePage":151,"blocks":[{"kind":"text","text":"3 After his operation, Ben developed an incredible talent like a superhero. When he was three, he learnt how to 'see' buildings with his ears. He listened very carefully and he could hear noises bounce off buildings. The noises told him where the buildings were. Then, when Ben was seven, he learnt to 'click'. He made clicking noises with his mouth"}]},{"body":"and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark.","sourcePage":151,"blocks":[{"kind":"text","text":"and listened for the noises that bounced back from things. In this way, Ben could 'see' where he was and what was around him. This is the same way dolphins see things underwater and bats see in the dark."}]},{"body":"4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during","sourcePage":151,"blocks":[{"kind":"text","text":"4 Scientists and doctors were amazed by Ben's talent. There are only a few blind people in the world who can see like Ben. People respected him because of this. He became famous. He was on TV and he travelled to different countries and talked to people about his life. Sadly, when Ben was 16, his cancer came back. He died soon after. However, during"}]},{"body":"Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral.\n¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled","sourcePage":151,"blocks":[{"kind":"text","text":"Ben's life, he taught people that anything is possible. Many people admired him because he inspired them and helped them feel strong. When he died in 2009, over 2,000 people went to his funeral."},{"kind":"text","text":"¹cancer (n) a serious disease that makes people very sick, because cells in the body grow in ways that are not normal or controlled"}]},{"body":"[IMAGE_3]","sourcePage":151,"blocks":[{"kind":"text","text":"[IMAGE_3]"}]}],"B02-RW-U07-classroom:material:RW-M04":[{"body":"JACK DORSEY\n1 I really admire Jack Dorsey, the former CEO of Twitter (now X). He invented a new kind of social networking site. Twitter was an intelligent way to communicate but it was also easy to use. Twitter became very popular with everyone including students, politicians and teachers. Jack Dorsey is a good role model because he is an excellent business","sourcePage":156,"blocks":[{"kind":"text","text":"JACK DORSEY"},{"kind":"text","text":"1
