hinese culture, long noodles are lucky. Long noodles mean you will have a long life.\n[IMAGE_3]\n## Mother's Day\n3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their mother to a restaurant for lunch or dinner.\n[IMAGE_4]\n## New Year's Eve\n4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home.\n## Coming of Age Day\n5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony.\n¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something\n[IMAGE_5]","screens":["## Piñatas\n1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground.\n[IMAGE_1]\n[IMAGE_2]\n## Noodles\n2 In China, p LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[38],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/863b713d83071ed3ee02ad1e9c4a5bf36cf602905886776f75bee71983cf3c89.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"regret","pos":"(v)","definition":"to feel sorry about a situation, especially something that you did not do","example":"I regret missing her concert.","wordAudio":"regret","cardWord":false},{"term":"media coverage","pos":"(n)","definition":"when a newspaper, television programme, etc. shows a particular thing happening","example":"The race received a lot of media coverage.","wordAudio":"media coverage","cardWord":false},{"term":"torch","pos":"(n)","definition":"a long stick with fire at the top of it, used as a light","example":"The guide lit a torch to see inside the cave.","wordAudio":"torch","cardWord":false},{"term":"procession","pos":"(n)","definition":"a long line of people, and sometimes cars and trucks, which moves forward slowly along the street, for example during a festival","example":"A procession of dancers moved slowly down the street.","wordAudio":"procession","cardWord":false},{"term":"unique","pos":"(adj)","definition":"different from everybody and everything else","example":"Each painting in the exhibition is unique.","wordAudio":"unique","cardWord":false}]]}},{"id":"B02-RW-U02-classroom:video","book":2,"unit":2,"track":"RW","topic":"FESTIVALS AND CELEBRATIONS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94f4b1481e7e763fb3af6cc628afd2608f9f0710b3bbfe4732d8036e2360d5cf.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/575f4f49b1b7b1d7db82ec38-L2RW-U02.mp4","captions":[{"start":0,"end":4.68,"text":"One, two, three, four, five."},{"start":6.74,"end":12.08,"text":"Yet again London said goodbye to the year in\nspectacular fashion."},{"start":17.42,"end":22.88,"text":"Twelve thousand fireworks lit up the perfectly clear\nLondon sky."},{"start":28.8,"end":31.02,"text":"Thousands of people lined the River Thames."},{"start":34.1,"end":37.16,"text":"Many had waited hours for their front row view."},{"start":38,"end":39.18,"text":"Very, very great."},{"start":39.48,"end":39.92,"text":"Amazing."},{"start":40.32,"end":40.68,"text":"Awesome."},{"start":40.92,"end":45.28,"text":"I come from Buenos Aires, Argentina and wow, it was\nreally worth it."},{"start":45.44,"end":46.76,"text":"I don't regret it at all."},{"start":47.62,"end":51.4,"text":"We waited here for three hours but it's really worth\nit."},{"start":51.66,"end":52.32,"text":"I like it."},{"start":52.36,"end":53.98,"text":"We all like it."},{"start":54.3,"end":62.98,"text":"New Year's Eve with the London Eye as the backdrop\nstill continues to draw media coverage from around the\nworld and of course the huge crowds."},{"start":63.16,"end":69.03999999999999,"text":"But it's not just the capital as cities around the UK\nbring in the New Year in style."},{"start":70.22,"end":76.06,"text":"It's party time again and this is how it shapes up in a\nline."},{"start":78.08,"end":86.28,"text":"Eight thousand people snaked along Edinburgh's Prince's\nStreet in torch lit procession as the city's three day\nHogmanay Festival kicked off."},{"start":86.64,"end":94.6,"text":"Edinburgh's spectacular peaks at New Year's midnight\nhour when five minutes of fireworks are laid on for a\ncrowd of 75 ,000 people."},{"start":94.96000000000001,"end":97.5,"text":"This was the warm up of the night before."},{"start":98.62,"end":101.25999999999999,"text":"Edinburgh's Hogmanay is always special."},{"start":101.44,"end":103.44,"text":"It's a unique Scottish celebration."},{"start":103.64,"end":109.4,"text":"It's the only three day New Year's celebration festival\nof New Year in the world."},{"start":110.34,"end":115.14,"text":"They are the pyrotechnics that punctuate the end of the\nold year and start of the new."},{"start":115.56,"end":116.97999999999999,"text":"A time for looking backwards,"},{"start":117.3,"end":119.75999999999999,"text":"looking forwards and for looking up."},{"start":127.5,"end":128.26,"text":"Thank you."}],"launchInline":true}},{"id":"B02-RW-U02-classroom:material:RW-M03","book":2,"unit":2,"track":"RW","topic":"FESTIVALS AND CELEBRATIONS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[41],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38b79b690f0dfa891407e29e3aeaf5269a1b03d0d2cb31ed07b726cb0d1e0f78.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## Piñatas\n1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground.\n[IMAGE_1]\n[IMAGE_2]\n## Noodles\n2 In China, people celebrate weddings with an eight-course meal, because the word eight in Chinese sounds like the word for good luck. The last dish of the meal is always noodles. The noodles are long and thin. You have to eat them in one piece – you can't cut them. In Chinese culture, long noodles are lucky. Long noodles mean you will have a long life.\n[IMAGE_3]\n## Mother's Day","sourcePage":41},{"body":"3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their mother to a restaurant for lunch or dinner.\n[IMAGE_4]\n## New Year's Eve\n4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home.\n## Coming of Age Day","sourcePage":41},{"body":"5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony.\n¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something\n[IMAGE_5]","sourcePage":41}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U02-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Piñatas","pages":[{"page":41,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38b79b690f0dfa891407e29e3aeaf5269a1b03d0d2cb31ed07b726cb0d1e0f78.png","width":772,"height":1040}],"source":41,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## Piñatas\n1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground.\n[IMAGE_1]\n[IMAGE_2]\n## Noodles\n2 In China, people celebrate weddings with an eight-course meal, because the word eight in Chinese sounds like the word for good luck. The last dish of the meal is always noodles. The noodles are long and thin. You have to eat them in one piece – you can't cut them. In Chinese culture, long noodles are lucky. Long noodles mean you will have a long life.\n[IMAGE_3]\n## Mother's Day","sourcePage":41},{"body":"3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their mother to a restaurant for lunch or dinner.\n[IMAGE_4]\n## New Year's Eve\n4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home.\n## Coming of Age Day","sourcePage":41},{"body":"5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony.\n¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something\n[IMAGE_5]","sourcePage":41}],"text":"## Piñatas\n1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground.\n[IMAGE_1]\n[IMAGE_2]\n## Noodles\n2 In China, people celebrate weddings with an eight-course meal, because the word eight in Chinese sounds like the word for good luck. The last dish of the meal is always noodles. The noodles are long and thin. You have to eat them in one piece – you can't cut them. In Chinese culture, long noodles are lucky. Long noodles mean you will have a long life.\n[IMAGE_3]\n## Mother's Day\n3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their mother to a restaurant for lunch or dinner.\n[IMAGE_4]\n## New Year's Eve\n4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home.\n## Coming of Age Day\n5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony.\n¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something\n[IMAGE_5]","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7fe3e7ea6da39fe9.mp3"},"original":{"id":"B02-RW-U02-material:RW-M03","entry":"material:RW-M03","unitId":"B02-RW-U02","book":2,"track":"RW","unit":2,"title":"READING 1","kind":"material","pages":[41],"sourceImages":[{"page":41,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38b79b690f0dfa891407e29e3aeaf5269a1b03d0d2cb31ed07b726cb0d1e0f78.png","viewEvidenceReported":true}],"text":"## Piñatas\n1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground.\n\n[IMAGE_1]\n\n[IMAGE_2]\n\n## Noodles\n2 In China, people celebrate weddings with an eight-course meal, because the word eight in Chinese sounds like the word for good luck. The last dish of the meal is always noodles. The noodles are long and thin. You have to eat them in one piece – you can't cut them. In Chinese culture, long noodles are lucky. Long noodles mean you will have a long life.\n\n[IMAGE_3]\n\n## Mother's Day\n3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their mother to a restaurant for lunch or dinner.\n\n[IMAGE_4]\n\n## New Year's Eve\n4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home.\n\n## Coming of Age Day\n5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony.\n\n¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something\n\n[IMAGE_5]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3393"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7fe3e7ea6da39fe9.mp3","continueOnPage":true}},{"id":"B02-RW-U02-classroom:resource:b3406","book":2,"unit":2,"track":"RW","topic":"FESTIVALS AND CELEBRATIONS","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c2d8c598a5173bfc297608ba039b110dce096d7febd138ff2814fd1c0a0bea5.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["UNDERSTANDING KEY VOCABULARY\nactivities (n) things people do for fun\nhighlight (n) most enjoyable part\nhistory (n) something that has been done or experienced repeatedly over a long period","popular (adj) liked by many people\ntake part (phr v) do an activity with other people\nvisitors (n) people who go to see a person or place"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U02-classroom:material:RW-M04","book":2,"unit":2,"track":"RW","topic":"FESTIVALS AND CELEBRATIONS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[44],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d8accb1ee566ebf1a7d9e74d016a249b2cc92d78fb4b3f559eb4136c7704a323.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# MUSCAT NIGHTS\n1 One of the most important festivals in Oman is Muscat Nights. The festival lasts for about one month and takes place in February every year. During the festival, many activities are available for people to take part in.\n2 Large numbers of people, including local Omanis and visitors to Oman, go to the different events. The events are a celebration of both Omani and international history and traditions. The events happen in different places across the country. Many businesses show their products for people to look at and buy.\n3 Muscat Nights also includes the very popular six-day Tour of Oman cycle race. Professional cyclists from around the world take part in the race. The race is 1,000 kilometres long, and it takes the cyclists up the beautiful Jabal Al Akhdar – the Green Mountain.","sourcePage":44},{"body":"4 Other highlights of Muscat Nights include the chance to experience different food and music. For example, you can taste traditional types of food at the Oman Food Festival. The Muscat Art Festival also offers Arabic music, concerts and plays, and other entertainment for the whole family. The Festival of Lights is one of the most popular events at Muscat Nights.\n5 Muscat Nights is an international event, with people visiting from countries as far away as Brazil and Cuba. Visitors also arrive from Italy, India, Russia, South Korea, Spain, Tunisia and Türkiye, as well as many other countries. They enjoy the amazing clothes, food and music. Some people just enjoy the mix of different cultures.","sourcePage":44}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U02-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"MUSCAT NIGHTS","pages":[{"page":44,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d8accb1ee566ebf1a7d9e74d016a249b2cc92d78fb4b3f559eb4136c7704a323.png","width":772,"height":1040}],"source":44,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# MUSCAT NIGHTS\n1 One of the most important festivals in Oman is Muscat Nights. The festival lasts for about one month and takes place in February every year. During the festival, many activities are available for people to take part in.\n2 Large numbers of people, including local Omanis and visitors to Oman, go to the different events. The events are a celebration of both Omani and international history and traditions. The events happen in different places across the country. Many businesses show their products for people to look at and buy.\n3 Muscat Nights also includes the very popular six-day Tour of Oman cycle race. Professional cyclists from around the world take part in the race. The race is 1,000 kilometres long, and it takes the cyclists up the beautiful Jabal Al Akhdar – the Green Mountain.","sourcePage":44},{"body":"4 Other highlights of Muscat Nights include the chance to experience different food and music. For example, you can taste traditional types of food at the Oman Food Festival. The Muscat Art Festival also offers Arabic music, concerts and plays, and other entertainment for the whole family. The Festival of Lights is one of the most popular events at Muscat Nights.\n5 Muscat Nights is an international event, with people visiting from countries as far away as Brazil and Cuba. Visitors also arrive from Italy, India, Russia, South Korea, Spain, Tunisia and Türkiye, as well as many other countries. They enjoy the amazing clothes, food and music. Some people just enjoy the mix of different cultures.","sourcePage":44}],"text":"# MUSCAT NIGHTS\n1 One of the most important festivals in Oman is Muscat Nights. The festival lasts for about one month and takes place in February every year. During the festival, many activities are available for people to take part in.\n2 Large numbers of people, including local Omanis and visitors to Oman, go to the different events. The events are a celebration of both Omani and international history and traditions. The events happen in different places across the country. Many businesses show their products for people to look at and buy.\n3 Muscat Nights also includes the very popular six-day Tour of Oman cycle race. Professional cyclists from around the world take part in the race. The race is 1,000 kilometres long, and it takes the cyclists up the beautiful Jabal Al Akhdar – the Green Mountain.\n4 Other highlights of Muscat Nights include the chance to experience different food and music. For example, you can taste traditional types of food at the Oman Food Festival. The Muscat Art Festival also offers Arabic music, concerts and plays, and other entertainment for the whole family. The Festival of Lights is one of the most popular events at Muscat Nights.\n5 Muscat Nights is an international event, with people visiting from countries as far away as Brazil and Cuba. Visitors also arrive from Italy, India, Russia, South Korea, Spain, Tunisia and Türkiye, as well as many other countries. They enjoy the amazing clothes, food and music. Some people just enjoy the mix of different cultures.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_88e42fe186792f3a.mp3"},"original":{"id":"B02-RW-U02-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U02","book":2,"track":"RW","unit":2,"title":"READING 2","kind":"material","pages":[44],"sourceImages":[{"page":44,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d8accb1ee566ebf1a7d9e74d016a249b2cc92d78fb4b3f559eb4136c7704a323.png","viewEvidenceReported":true}],"text":"# MUSCAT NIGHTS\n\n1 One of the most important festivals in Oman is Muscat Nights. The festival lasts for about one month and takes place in February every year. During the festival, many activities are available for people to take part in.\n2 Large numbers of people, including local Omanis and visitors to Oman, go to the different events. The events are a celebration of both Omani and international history and traditions. The events happen in different places across the country. Many businesses show their products for people to look at and buy.\n3 Muscat Nights also includes the very popular six-day Tour of Oman cycle race. Professional cyclists from around the world take part in the race. The race is 1,000 kilometres long, and it takes the cyclists up the beautiful Jabal Al Akhdar – the Green Mountain.\n\n4 Other highlights of Muscat Nights include the chance to experience different food and music. For example, you can taste traditional types of food at the Oman Food Festival. The Muscat Art Festival also offers Arabic music, concerts and plays, and other entertainment for the whole family. The Festival of Lights is one of the most popular events at Muscat Nights.\n5 Muscat Nights is an international event, with people visiting from countries as far away as Brazil and Cuba. Visitors also arrive from Italy, India, Russia, South Korea, Spain, Tunisia and Türkiye, as well as many other countries. They enjoy the amazing clothes, food and music. Some people just enjoy the mix of different cultures.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3413"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_88e42fe186792f3a.mp3","continueOnPage":true}},{"id":"B02-RW-U02-classroom:review-1","book":2,"unit":2,"track":"RW","topic":"FESTIVALS AND CELEBRATIONS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[57],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a458b1c2d3020057714230206b6bd652e0fef035476912db31e432152569cda4.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B02-RW-U02-B-002","form":"celebrate","page":57},{"id":"B02-RW-U02-B-003","form":"culture","page":57},{"id":"B02-RW-U02-B-004","form":"fireworks","page":57},{"id":"B02-RW-U02-B-005","form":"gift","page":57},{"id":"B02-RW-U02-B-008","form":"lucky","page":57},{"id":"B02-RW-U02-B-009","form":"popular","page":57},{"id":"B02-RW-U02-B-010","form":"take part","page":57},{"id":"B02-RW-U02-B-011","form":"traditional","page":57}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U02-classroom:review-2","book":2,"unit":2,"track":"RW","topic":"FESTIV nswer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U02-classroom:material:RW-M03":[{"body":"## Piñatas\n1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground.\n[IMAGE_1]","sourcePage":41,"blocks":[{"kind":"text","text":"## Piñatas"},{"kind":"text","text":"1 In Mexico, people often have piñatas at their parties. Parents put chocolates and other sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It breaks and the sweets fall out onto the ground."},{"kind":"text","text":"[IMAGE_1]"}]},{"body":"[IMAGE_2]\n## Noodles","sourcePage":41,"blocks":[{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"## Noodles"}]},{"body":"2 In China, people celebrate weddings with an eight-course meal, because the word eight in Chinese sounds like the word for good luck. The last dish of the meal is always noodles. The noodles are long and thin. You have to eat them in one piece – you can't cut them. In Chinese culture, long noodles are lucky. Long noodles mean you will have a long\nlife.","sourcePage":41,"blocks":[{"kind":"text","text":"2 In China, people celebrate weddings with an eight-course meal, because the word eight in Chinese sounds like the word for good luck. The last dish of the meal is always noodles. The noodles are long and thin. You have to eat them in one piece – you can't cut them. In Chinese culture, long noodles are lucky. Long noodles mean you will have a long"},{"kind":"text","text":"life."}]},{"body":"[IMAGE_3]\n## Mother's Day","sourcePage":41,"blocks":[{"kind":"text","text":"[IMAGE_3]"},{"kind":"text","text":"## Mother's Day"}]},{"body":"3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their\nmother to a restaurant for lunch or dinner.","sourcePage":41,"blocks":[{"kind":"text","text":"3 Many people around the world honour their mothers on Mother's Day. In the UK, Mother's Day is celebrated in March or April. Sons and daughters like to give their mother a day to rest, so they might surprise her by cleaning the house or cooking a nice meal for her. They also give her gifts such as flowers or jewellery. Many families take their"},{"kind":"text","text":"mother to a restaurant for lunch or dinner."}]},{"body":"[IMAGE_4]\n## New Year's Eve","sourcePage":41,"blocks":[{"kind":"text","text":"[IMAGE_4]"},{"kind":"text","text":"## New Year's Eve"}]},{"body":"4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home.\n## Coming of Age Day","sourcePage":41,"blocks":[{"kind":"text","text":"4 London celebrates New Year's Eve in a big way. Thousands of people go to the River Thames, and then, when it is dark outside, fireworks light up the sky and Big Ben, the bell in London's famous clock tower, chimes¹ at midnight. The next day, people eat a big meal with family and friends, go for a walk or just relax at home."},{"kind":"text","text":"## Coming of Age Day"}]},{"body":"5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities","sourcePage":41,"blocks":[{"kind":"text","text":"5 In Japan, people celebrate Coming of Age Day, or Seijin no Hi, on the second Monday in January. On this holiday, Japan congratulates people who have turned or will turn 20 years old between 2 April of the past year and 1 April of the current year. In Japanese culture, this is the age when teenagers become adults and take on ² the responsibilities"}]},{"body":"of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony.","sourcePage":41,"blocks":[{"kind":"text","text":"of being an adult. Young women usually wear a traditional furisode kimono, while young men often wear Western-style suits, and they attend a ceremony ³ in their area. They receive small presents and celebrate with their friends after the ceremony."}]},{"body":"¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something\n[IMAGE_5]","sourcePage":41,"blocks":[{"kind":"text","text":"¹ chimes (v) makes a clear ringing sound ² take on (phr v) accept responsibility for something ³ ceremony (n) a formal event that people go to, often for a holiday or to celebrate somebody or something"},{"kind":"text","text":"[IMAGE_5]"}]}],"B02-RW-U02-classroom:material:RW-M04":[{"body":"# MUSCAT NIGHTS\n1 One of the most important festivals in Oman is Muscat Nights. The festival lasts for about one month and takes place in February every year. During the festival, many activities are available for people to take part in.","sourcePage":44,"blocks":[{"kind":"text","text":"# MUSCAT NIGHTS"},{"kind":"text","text":"1 One of the most important festivals in Oman is Muscat Nights. The festival lasts for about one month and takes place in February every year. During the festival, many activities are available for people to take part in."}]},{"body":"2 Large numbers of people, including local Omanis and visitors to Oman, go to the different events. The events are a celebration of both Omani and international history and traditions. The events happen in different places across the country. Many businesses show their products for people to look at and buy.","sourcePage":44,"blocks":[{"kind":"text","text":"2 Large numbers of people, including local Omanis and visitors to Oman, go to the different events. The events are a celebration of both Omani and international history and traditions. The events happen in different places across the country. Many businesses show their products for people to look at and buy."}]},{"body":"3 Muscat Nights also includes the very popular six-day Tour of Oman cycle race. Professional cyclists from around the world take part in the race. The race is 1,000 kilometres long, and it takes the cyclists up the beautiful Jabal Al Akhdar – the Green Mountain.","sourcePage":44,"blocks":[{"kind":"text","text":"3 Muscat Nights also includes the very popular six-day Tour of Oman cycle race. Professional cyclists from around the world take part in the race. The race is 1,000 kilometres long, and it takes the cyclists up the beautiful Jabal Al Akhdar – the Green Mountain."}]},{"body":"4 Other highlights of Muscat Nights include the chance to experience different food and music. For example, you can taste traditional types of food at the Oman Food Festival. The Muscat Art Festival also offers Arabic music, concerts and plays, and other entertainment for the whole family. The Festival of Lights is one of the most popular events at\nMuscat Nights.","sourcePage":44,"blocks":[{"kind":"text","text":"4 Other highlights of Muscat Nights include the chance to experience different food and music. For example, you can taste traditional types of food at the Oman Food Festival. The Muscat Art Festival also offers Arabic music, concerts and plays, and other entertainment for the whole family. The Festival of Lights is one of the most popular events at"},{"kind":"text","text":"Muscat Nights."}]},{"body":"5 Muscat Nights is an international event, with people visiting from countries as far away as Brazil and Cuba. Visitors also arrive from Italy, India, Russia, South Korea, Spain, Tunisia and Türkiye, as well as many other countries. They enjoy the amazing clothes, food and music. Some people just enjoy the mix of different cultures.","sourcePage":44,"blocks":[{"kind":"text","text":"5 Muscat Nights is an international event, with people visiting from countries as far away as Brazil and Cuba. Visitors also arrive from Italy, India, Russia, South Korea, Spain, Tunisia and Türkiye, as well as many other countries. They enjoy the amazing clothes, food and music. Some people just enjoy the mix of different cultures."}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05- lion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U02":{"aspect":1.7777778,"cues":[[0,4.68,"One, two, three, four, five.","一二三四五门。"],[6.74,12.08,"Yet again London said goodbye to the year in spectacular fashion.","伦敦再次以壮观的方式告别了这一年。"],[17.42,22.88,"Twelve thousand fireworks lit up the perfectly clear London sky.","一万二千个烟花点燃了伦敦晴朗的天空"],[28.8,31.02,"Thousands of people lined the River Thames.","成千上万的人排着泰晤士河"],[34.1,37.16,"Many had waited hours for their front row view.","许多人等了好几个小时才看到他们的前排景色。"],[38,39.18,"Very, very great.","非常，非常伟大的。"],[39.48,39.92,"Amazing.","厉害"],[40.32,40.68,"Awesome.","厉害"],[40.92,45.28,"I come from Buenos Aires, Argentina and wow, it was really worth it.","我来自布宜诺斯艾利斯，阿根廷，哇，这真的很值得。"],[45.44,46.76,"I don't regret it at all.","我一点也不后悔"],[47.62,51.4,"We waited here for three hours but it's really worth it.","我们在这里等了三个小时但真的很值得"],[51.66,52.32,"I like it.","我喜欢"],[52.36,53.98,"We all like it.","我们都喜欢这样"],[54.3,62.98,"New Year's Eve with the London Eye as the backdrop still continues to draw media coverage from around the world and of course the huge crowds.","以\"伦敦之眼\"为背景的\"除夕夜\"继续吸引来自世界各地的媒体报道，当然还有广大的群众。"],[63.16,69.03999999999999,"But it's not just the capital as cities around the UK bring in the New Year in style.","但随着英国周边城市以风格带入新年，这不仅仅是首都。"],[70.22,76.06,"It's party time again and this is how it shapes up in a line.","派对又开始了，这就是它如何成形的线。"],[78.08,86.28,"Eight thousand people snaked along Edinburgh's Prince's Street in torch lit procession as the city's three day Hogmanay Festival kicked off.","八千人沿着爱丁堡的王子街在火炬点燃的游行中被蛇咬，因为这座城市的三天Hogmanay节被踢走。"],[86.64,94.6,"Edinburgh's spectacular peaks at New Year's midnight hour when five minutes of fireworks are laid on for a crowd of 75 ,000 people.","爱丁堡在元旦午夜时段的壮观高峰，为七万五千人的人群铺设了五分钟的烟花。"],[94.96000000000001,97.5,"This was the warm up of the night before.","这是前一晚的热身。"],[98.62,101.25999999999999,"Edinburgh's Hogmanay is always special.","爱丁堡的Hogmanay总是特别的。"],[101.44,103.44,"It's a unique Scottish celebration.","这是一个独特的苏格兰庆典。"],[103.64,109.4,"It's the only three day New Year's celebration festival of New Year in the world.","这是世界上唯一一个三天的新年庆祝节日。"],[110.34,115.14,"They are the pyrotechnics that punctuate the end of the old year and start of the new.","它们是烟火弹出旧年末和新年的开始。"],[115.56,116.97999999999999,"A time for looking backwards,","回头看的时候"],[117.3,119.75999999999999,"looking forwards and for looking up.","向前看向上看向上看"],[127.5,128.26,"Thank you.","谢谢。"]],"englishRows":2,"chineseRows":1},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}

   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

function wireMaterials(doc,c,decks){

  const pages=decks[selected].pages, material=pages[subpage];

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();

 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
