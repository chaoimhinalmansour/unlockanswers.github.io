],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B05-RW-U01":{"aspect":1.9085487,"cues":[[0.82,5.36,"The history of perfume is as long as that of human civilization.","香水的历史与人类文明的历史一样悠久。"],[6.46,8.64,"In this cellar in Versailles, France,","在法国凡尔赛的地窖里"],[8.96,14.38,"they're preserving the scents of the past and the present to share with new generations.","他们保存着过去和现在的气味与新一代分享"],[16.98,23.1,"The Osmotec is an international repository for thousands of perfumes, many of which are","奥斯莫特克是数千种香水的国际储存地，其中许多是"],[23.1,23.36,"no","无"],[23.36,24.86,"longer available to buy.","更适合购买。"],[24.86,34.52,"The founders believe that the global evolution of perfumes contains influential masterpieces, just like any other form of human creativity.","创始人认为香水的全球演化包含有影响力的杰作，就像任何其他人类创造力的形式一样。"],[35.3,39.48,"They're determined that these should not be lost to the passage of time.","他们确定，这些不应该随着时间的流逝而丢失。"],[42.02,44.56,"Here we have the Chypre de Cotty,","我们这里有Chypre de Cotty，"],[44.98,45.48,"a landmark.","一个地标。"],[46.36,49.52,"It was created in 1917 by François Cotty.","它由弗朗索瓦·科蒂创建于1917年。"],[49.52,54.84,"More than four ,000 scents are stored in this cellar at a constant temperature.","超过4000种气味以恒温储存在这个地窖中。"],[55.46,57.34,"The Osmotec is somewhere unique,","奥斯莫特克是独一无二的地方"],[57.9,62.48,"and all the perfumes that the public can discover here represent very rare moments.","和所有公众可以发现的香水代表非常罕见的时刻。"],[63.08,64.26,"They're marvels.","他们是奇迹。"],[65.74,71.02,"Each perfume is sealed in an opaque bottle under a protective layer of argon gas.","每种香水被密封在一个不透明的瓶子中，置于一个保护层的rg气下。"],[71.6,75.96000000000001,"Many of the perfumes held here are recreated from historical recipes.","这里所持有的许多香水是从历史食谱中再现出来的。"],[76.88,81.64,"The oldest dates back thousands of years to the times of the Roman Empire.","最古老的可以追溯到数千年的罗马帝国时期。"],[84.2,90.3,"Constructing a perfume is about natural and synthetic odors, playing with different types of smells.","构造一种香水是关于天然和合成的气味，玩弄不同种类的气味。"],[90.92,97.36,"First, you have to learn to memorize these odors so that later, with some imagination and a certain artistic tendency,","首先，你必须学会记住这些气味以便以后，用一些想象力和某种艺术倾向，"],[97.8,99.02000000000001,"you can compose a perfume.","你可以做一个香水。"],[100.75999999999999,105.14,"A fine scent begins with fine ingredients.","精细的气味从精细的成分开始。"],[105.62,107.74000000000001,"As one of the world's oldest industries,","作为世界上最古老的产业之一，"],[108.3,115.02000000000001,"there are many agricultural communities founded on supplying perfume manufacturers with raw materials.","有许多农业社区建立在向香水制造商提供原材料的基础上。"],[115.96000000000001,118.7,"But if new generations do not get involved,","但如果新一代人不参与进来"],[119.18,119.97999999999999,"these communities'","这些社区"],[120.6,121.88,"traditions may be lost.","传统可能会丧失。"],[122.86,127.14,"In grass in France and in taif in Saudi Arabia,","在法国的草地和沙特阿拉伯的塔伊夫，"],[127.68,133.16,"they're hoping that UNESCO intangible cultural heritage status will protect their ways of life.","他们希望联合国教科文组织非物质文化遗产的地位能够保护他们的生活方式。"],[134.06,140.22,"Taif roses produce a unique rose oil, which is in high demand for use in luxury perfumes.","Taif玫瑰生产一种独特的玫瑰油，对奢侈香水的使用需求很高。"],[141.3,145.57999999999998,"Families in taif have farmed roses for more than 240 years.","泰夫的家庭种植玫瑰超过240年。"],[146.42000000000002,151.44,"The taif rose is adapted to the specific soil and weather conditions here.","泰夫玫瑰适应了这里特定的土壤和天气条件。"],[151.88,155.4,"Attempts to grow it elsewhere have been unsuccessful.","试图在其他地方种植这种植物的努力没有成功。"],[156.46,158.64,"From planting to extracting the oil,","从种植到提取石油，"],[159.12,162.57999999999998,"every step of the process requires skill and knowledge.","这一过程的每一步都需要技能和知识。"],[164.18,167.54,"This has traditionally been taught by elders over many years.","这传统上是长者多年来传授的。"],[169.06,178.82,"In grass, a volcanic landscape and the Mediterranean climate provide the perfect conditions for growing a variety of flowers used in perfumes.","在草丛中，火山景观和地中海气候为种植香水中所使用的各种花卉提供了完美的条件。"],[179.6,183.32,"But traditional skills were in danger of being forgotten.","但是，传统技能有被遗忘的危险。"],[184.12,189.34,"For example, how to create new plants by cutting pieces from the older bushes,","例如，如何通过从较老的灌木丛中切片来创造新植物，"],[189.72,192.2,"which grow so well in these specific fields.","它们在这些特定领域发展得很好。"],[193.5,200.84,"Today, a wide variety of skills relating to roles in the perfume industry in grass are listed with UNESCO.","今天，教科文组织列举了与香水工业在草中的角色有关的各种技能。"],[201.78,206.98,"This means that the French government will take an active role in ensuring their future.","这意味着法国政府将在确保他们的未来方面发挥积极作用。"],[206.98,215.32,"Efforts to preserve the practices in these regions may not succeed if climate change continues to worsen.","如果气候变化继续恶化，维持这些区域做法的努力就不会成功。"],[216.04,225.38,"All perfume growing regions rely on their climate for successful harvests, but they are experiencing increasingly unpredictable seasonal weather.","所有种植香水的地区都依靠气候来成功收获，但它们正经历越来越不可预测的季节性天气。"],[226.36,234.72,"Conservation on a global scale will be needed if their unique products are to be available to future generations of perfumers.","如果要向后代的香水商提供其独特的产品，就需要在全球范围内进行养护。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B05-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2bca4b38a5788ec6ada449ac84df843375dac881fc02b042173e99ae3b588622.pdf","size":27488549}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33}," async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;

 current=i;part=p;

function outside(el,bounds){

 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
