oice/closed"},{"id":"b8201.i02","label":"b","prompt":"Some perfume recipes are too old to be recreated.","options":[],"type":"choice/closed"},{"id":"b8201.i03","label":"c","prompt":"Young people may not want to work in the perfume industry.","options":[],"type":"choice/closed"},{"id":"b8201.i04","label":"d","prompt":"Some raw materials can only grow in specific regions.","options":[],"type":"choice/closed"},{"id":"b8201.i05","label":"e","prompt":"Knowledge of traditional skills may be lost to younger generations.","options":[],"type":"choice/closed"}],"layout":"list","references":[{"id":"B05-RW-U01-question:b8197","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[16]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8201.i01","label":"a","prompt":"Watch the video and check your predictions from Exercise 2. Then circle the sentences that best express the problems the perfume industry faces.","options":["Young people no longer want to buy perfume.","Some perfume recipes are too old to be recreated.","Young people may not want to work in the perfume industry.","Some raw materials can only grow in specific regions.","Knowledge of traditional skills may be lost to younger generations."],"type":"choice/closed"},{"kind":"item","id":"b8201.i02","label":"b","prompt":"Some perfume recipes are too old to be recreated.","options":[],"type":"choice/closed"},{"kind":"item","id":"b8201.i03","label":"c","prompt":"Young people may not want to work in the perfume industry.","options":[],"type":"choice/closed"}],[{"kind":"item","id":"b8201.i04","label":"d","prompt":"Some raw materials can only grow in specific regions.","options":[],"type":"choice/closed"},{"kind":"item","id":"b8201.i05","label":"e","prompt":"Knowledge of traditional skills may be lost to younger generations.","options":[],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/442ce4955fdea6b9157c6ddc-L5RW-U01.mp4","captions":[{"start":0.82,"end":5.36,"text":"The history of perfume is as long as that of human\ncivilization."},{"start":6.46,"end":8.64,"text":"In this cellar in Versailles, France,"},{"start":8.96,"end":14.38,"text":"they're preserving the scents of the past and the\npresent to share with new generations."},{"start":16.98,"end":23.1,"text":"The Osmotec is an international repository for\nthousands of perfumes, many of which are"},{"start":23.1,"end":23.36,"text":"no"},{"start":23.36,"end":24.86,"text":"longer available to buy."},{"start":24.86,"end":34.52,"text":"The founders believe that the global evolution of\nperfumes contains influential masterpieces, just like\nany other form of human creativity."},{"start":35.3,"end":39.48,"text":"They're determined that these should not be lost to the\npassage of time."},{"start":42.02,"end":44.56,"text":"Here we have the Chypre de Cotty,"},{"start":44.98,"end":45.48,"text":"a landmark."},{"start":46.36,"end":49.52,"text":"It was created in 1917 by François Cotty."},{"start":49.52,"end":54.84,"text":"More than four ,000 scents are stored in this cellar at\na constant temperature."},{"start":55.46,"end":57.34,"text":"The Osmotec is somewhere unique,"},{"start":57.9,"end":62.48,"text":"and all the perfumes that the public can discover here\nrepresent very rare moments."},{"start":63.08,"end":64.26,"text":"They're marvels."},{"start":65.74,"end":71.02,"text":"Each perfume is sealed in an opaque bottle under a\nprotective layer of argon gas."},{"start":71.6,"end":75.96000000000001,"text":"Many of the perfumes held here are recreated from\nhistorical recipes."},{"start":76.88,"end":81.64,"text":"The oldest dates back thousands of years to the times\nof the Roman Empire."},{"start":84.2,"end":90.3,"text":"Constructing a perfume is about natural and synthetic\nodors, playing with different types of smells."},{"start":90.92,"end":97.36,"text":"First, you have to learn to memorize these odors so\nthat later, with some imagination and a certain\nartistic tendency,"},{"start":97.8,"end":99.02000000000001,"text":"you can compose a perfume."},{"start":100.75999999999999,"end":105.14,"text":"A fine scent begins with fine ingredients."},{"start":105.62,"end":107.74000000000001,"text":"As one of the world's oldest industries,"},{"start":108.3,"end":115.02000000000001,"text":"there are many agricultural communities founded on\nsupplying perfume manufacturers with raw materials."},{"start":115.96000000000001,"end":118.7,"text":"But if new generations do not get involved,"},{"start":119.18,"end":119.97999999999999,"text":"these communities'"},{"start":120.6,"end":121.88,"text":"traditions may be lost."},{"start":122.86,"end":127.14,"text":"In grass in France and in taif in Saudi Arabia,"},{"start":127.68,"end":133.16,"text":"they're hoping that UNESCO intangible cultural heritage\nstatus will protect their ways of life."},{"start":134.06,"end":140.22,"text":"Taif roses produce a unique rose oil, which is in high\ndemand for use in luxury perfumes."},{"start":141.3,"end":145.57999999999998,"text":"Families in taif have farmed roses for more than 240\nyears."},{"start":146.42000000000002,"end":151.44,"text":"The taif rose is adapted to the specific soil and\nweather conditions here."},{"start":151.88,"end":155.4,"text":"Attempts to grow it elsewhere have been unsuccessful."},{"start":156.46,"end":158.64,"text":"From planting to extracting the oil,"},{"start":159.12,"end":162.57999999999998,"text":"every step of the process requires skill and knowledge."},{"start":164.18,"end":167.54,"text":"This has traditionally been taught by elders over many\nyears."},{"start":169.06,"end":178.82,"text":"In grass, a volcanic landscape and the Mediterranean\nclimate provide the perfect conditions for growing a\nvariety of flowers used in perfumes."},{"start":179.6,"end":183.32,"text":"But traditional skills were in danger of being\nforgotten."},{"start":184.12,"end":189.34,"text":"For example, how to create new plants by cutting pieces\nfrom the older bushes,"},{"start":189.72,"end":192.2,"text":"which grow so well in these specific fields."},{"start":193.5,"end":200.84,"text":"Today, a wide variety of skills relating to roles in\nthe perfume industry in grass are listed with UNESCO."},{"start":201.78,"end":206.98,"text":"This means that the French government will take an\nactive role in ensuring their future."},{"start":206.98,"end":215.32,"text":"Efforts to preserve the practices in these regions may\nnot succeed if climate change continues to worsen."},{"start":216.04,"end":225.38,"text":"All perfume growing regions rely on their climate for\nsuccessful harvests, but they are experiencing\nincreasingly unpredictable seasonal weather."},{"start":226.36,"end":234.72,"text":"Conservation on a global scale will be needed if their\nunique products are to be available to future\ngenerations of perfumers."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"c, d, e","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":23,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8202","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video again. Circle the correct answers.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b9085ccc0f001c415df24816bf63af80b35477aa6a56608fe7df89b1e2f2278.png"],"provided":"","items":[{"id":"b8202.i01","label":"1","prompt":"More than 4,000 perfum tural communities founded on\nsupplying perfume manufacturers with raw materials."},{"start":115.96000000000001,"end":118.7,"text":"But if new generations do not get involved,"},{"start":119.18,"end":119.97999999999999,"text":"these communities'"},{"start":120.6,"end":121.88,"text":"traditions may be lost."},{"start":122.86,"end":127.14,"text":"In grass in France and in taif in Saudi Arabia,"},{"start":127.68,"end":133.16,"text":"they're hoping that UNESCO intangible cultural heritage\nstatus will protect their ways of life."},{"start":134.06,"end":140.22,"text":"Taif roses produce a unique rose oil, which is in high\ndemand for use in luxury perfumes."},{"start":141.3,"end":145.57999999999998,"text":"Families in taif have farmed roses for more than 240\nyears."},{"start":146.42000000000002,"end":151.44,"text":"The taif rose is adapted to the specific soil and\nweather conditions here."},{"start":151.88,"end":155.4,"text":"Attempts to grow it elsewhere have been unsuccessful."},{"start":156.46,"end":158.64,"text":"From planting to extracting the oil,"},{"start":159.12,"end":162.57999999999998,"text":"every step of the process requires skill and knowledge."},{"start":164.18,"end":167.54,"text":"This has traditionally been taught by elders over many\nyears."},{"start":169.06,"end":178.82,"text":"In grass, a volcanic landscape and the Mediterranean\nclimate provide the perfect conditions for growing a\nvariety of flowers used in perfumes."},{"start":179.6,"end":183.32,"text":"But traditional skills were in danger of being\nforgotten."},{"start":184.12,"end":189.34,"text":"For example, how to create new plants by cutting pieces\nfrom the older bushes,"},{"start":189.72,"end":192.2,"text":"which grow so well in these specific fields."},{"start":193.5,"end":200.84,"text":"Today, a wide variety of skills relating to roles in\nthe perfume industry in grass are listed with UNESCO."},{"start":201.78,"end":206.98,"text":"This means that the French government will take an\nactive role in ensuring their future."},{"start":206.98,"end":215.32,"text":"Efforts to preserve the practices in these regions may\nnot succeed if climate change continues to worsen."},{"start":216.04,"end":225.38,"text":"All perfume growing regions rely on their climate for\nsuccessful harvests, but they are experiencing\nincreasingly unpredictable seasonal weather."},{"start":226.36,"end":234.72,"text":"Conservation on a global scale will be needed if their\nunique products are to be available to future\ngenerations of perfumers."}]}],"courseAnswer":{"kind":"model-excerpt","text":"He might be referring to historical moments\nthroughout time. The video mentions that\nsome perfumes are made with historical\nrecipes, some of which are as old as the\nRoman Empire. Another scent mentioned\nwas made in 1917. These both represent\nhistorical eras, which makes their existence\nmuch more significant.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":23,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8205","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b9085ccc0f001c415df24816bf63af80b35477aa6a56608fe7df89b1e2f2278.png"],"provided":"1 The narrator compares perfume evolution to 'influential masterpieces'. Are the two comparable? Why / Why not?\n2 What other traditional skills might be protected by UNESCO?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The narrator compares perfume evolution to 'influential masterpieces'. Are the two comparable? Why / Why not?"},{"kind":"text","text":"2 What other traditional skills might be protected by UNESCO?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I agree that the two are\ncomparable. As we learned from the\nvideo, manufacturing perfume requires\nhighly skilled knowledge. The skills are\npassed down to younger generations\nfrom elders so the skills are something\nthat not many people possess. The\nperfumes are comparable to influential\nmasterpieces because they both\nrequired highly specialized skills to\ncreate them.\nNo, I do not agree that the two are\ncomparable. A perfume recipe or\nscent simply does not have the same\nhistorical impact as a painting or\nmusical composition.\n2 I once read that the style of making\npizza in Naples, Italy is on the UNESCO\nIntangible Cultural Heritage lists. Other\nskills that may be listed include playing\ntraditional musical instruments, dancing\nin traditional styles and making things by\nhand, such as wooden canoes or painted\nsilk fabrics.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":23,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/ think your grandchildren will be able to access them? Your great-grandchildren? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b8208.i02","label":"2","prompt":"Look at the title of the article on page 20. What does the word digital mean there? Give some examples of digital devices that you use. What are some digital devices that are no longer widely used – perhaps devices that your parents used?","options":[],"type":"discuss/open"},{"id":"b8208.i03","label":"3","prompt":"The Dark Ages is the term used to refer to Europe from about the fifth to the tenth century. We have very few records from this time, so it is difficult to find out about how people lived then. How do you think digital could be related to the Dark Ages? What do you think the title means?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U01-question:b8207","kind":"student-work","title":"READING 1 Ex 1","pages":[18]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Think about items in the table in Exercise 1. How long do you think these records will last? Do you think your grandchildren will be able to access them? Your great-grandchildren? Why / Why not?"},{"kind":"text","text":"2 Look at the title of the article on page 20. What does the word digital mean there? Give some examples of digital devices that you use. What are some digital devices that are no longer widely used – perhaps devices that your parents used?"},{"kind":"text","text":"3 The Dark Ages is the term used to refer to Europe from about the fifth to the tenth century. We have very few records from this time, so it is difficult to find out about how people lived then. How do you think digital could be related to the Dark Ages? What do you think the title means?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I believe many of these could last\na long time. Advancements in digital\nstorage and cloud technology mean\nthat they can be stored securely for\ndecades – as long as they are regularly\nbacked up and updated to newer\nformats. Physical items like receipts\nand old bank statements may degrade\nwithout careful preservation though.\nNo, I don’t think many of these will last\nfor generations. Digital formats can\nbecome obsolete, and files may be lost\nover time if they aren’t properly backed\nup or migrated to new technologies.\nThey could also be lost due to hardware\nfailure or forgotten passwords.\n2 In this context, digital refers to\ntechnology that stores, processes, or\ntransmits information electronically. I\nuse digital devices like a smartphone,\na laptop and a smartwatch. In the\npast, people used digital cameras\nto take photos and MP3 players to\nlisten to music but these are not as\ncommon anymore.\n3 Similar to how much was lost during\nthe historical Dark Ages, it could mean\nthat we are at risk of losing valuable\ninformation over time. It might be\nsuggesting that we are not adequately\nprotecting today’s digital information\nfor the future, and that current\ndigital records could be lost to future\ngenerations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8209","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the sentences. Write the correct form of the words in bold (1–8) next to their definitions below (a–h).","pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/edb7dbb22924e4c71ec979c7dd76915d6b357fa7b6f27a7d7779f239e2df9a79.png"],"provided":"1 The internet is not working so I have been unable to retrieve the files I uploaded yesterday.\n2 Many employees have still not adopted the practice of saving their work regularly.\n3 The company has been in business for almost 200 years. Its longevity is a result of the quality of its products and service.\n4 You need to use the same document format as the rest of us. The one you are using is not compatible.\n5 Your computer files are vulnerable if you do not protect them by using a strong password.\n6 We are working on two different possible scenarios: one, if our business grows slowly, and the other, if success comes more quickly.\n7 Problems with security prompted software designers to make major changes to the new version of the program.\n8 The cupboard was filled with boxes of memorabilia from my childhood and the early years of my parents' marriage.","items":[{"id":"b8209.i01","label":"a","prompt":"____ (adj) not well protected; able to be harmed","options":["retrieve","practice","longevity","compatible","vulnerable","scenarios","prompted","memorabilia"],"type":"choice/closed"},{"id":"b8209.i02","label":"b","prompt":"____ (n) something that is usually or regularly done","options":["retrieve","practice","longevity","compatible","vulnerable","scenarios","prompted","memorabilia"],"type":"choice/closed"},{"id":"b8209.i03","label":"c","prompt":"____ (v) to make someone decide to do something","options":["retrieve","practice","longevity","compatible","vulner ,"id":"b8209.i08","label":"h","prompt":"____ (adj) able to work successfully with something else","options":["retrieve","practice","longevity","compatible","vulnerable","scenarios","prompted","memorabilia"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a vulnerable b practice c prompt d longevity\ne scenario f retrieve g memorabilia h compatible","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8213","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article. Complete the tasks.","pages":[21],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/95b2aca61709d4603fb9bc7cc7812a6aa482d5759e65e6e0e3a1f8d2ffede032.png"],"provided":"","items":[{"id":"b8213.i01","label":"1","prompt":"Which sentence best captures the writer's central claim?","options":["Digital technology is not keeping up with the need to save records.","It would be easier to keep records if we made a physical copy of everything.","We are not preserving our digital records, so our history may be lost.","As our capacity to store records increases, we have to throw more things away."],"type":"choice/closed"},{"id":"b8213.i02","label":"2","prompt":"Underline the sentence in the article that expresses this claim.","options":[],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8213.i01","label":"1","prompt":"Which sentence best captures the writer's central claim?","options":["Digital technology is not keeping up with the need to save records.","It would be easier to keep records if we made a physical copy of everything.","We are not preserving our digital records, so our history may be lost.","As our capacity to store records increases, we have to throw more things away."],"type":"choice/closed"},{"kind":"item","id":"b8213.i02","label":"2","prompt":"Underline the sentence in the article that expresses this claim.","options":[],"type":"choice/open"}]],"courseMaterials":[{"id":"B05-RW-U01-classroom:material:RW-M03","title":"READING 1","text":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.\n2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.\n3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.\n4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?\n5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.\n6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","screens":["1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.","2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.","3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear t is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages."],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U01-material:B05-RW-U01:p20:DigitalDarkAges","title":"第20页文章 Are We Living in the Digital Dark Ages?","pages":[20],"text":"","screens":[],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9dfef8cb9e58f866b9ed6b03573cbd91278f204971f7af6b149d49637e1226c.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 c 2 If current practice continues, future generations\nmay not have access to the digital record of our lives and\nour world.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8214","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"order":12,"module":"READING 1","ex":"5","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Re re generations may not have access to the digital record of our lives and our world. ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8214.i03","label":"2b","prompt":"Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8214.i04","label":"2c","prompt":"Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date. ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8214.i05","label":"2d","prompt":"Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8214.i06","label":"2e","prompt":"It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages. ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U01-classroom:material:RW-M03","title":"READING 1","text":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.\n2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.\n3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.\n4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?\n5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.\n6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","screens":["1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.","2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.","3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.","4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?","5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.","6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages."],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U01-material:B05-RW-U01:p20:DigitalDarkAges","title":"第20页文章 Are We Living in the Digital Dark Ages?","pages":[20],"text":"","screens":[],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9dfef8cb9e58f866b9ed6b03573cbd91278f204971f7af6b149d49637e1226c.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 A box of memorabilia, including floppy disks and VHS\ntapes, is found in the atti ptions":[],"type":"choice/closed"},{"kind":"item","id":"b8215.i02","label":"2","prompt":"The devices necessary to read our records will not be available.","options":[],"type":"choice/closed"},{"kind":"item","id":"b8215.i03","label":"3","prompt":"Software used to create applications goes out of date quickly.","options":[],"type":"choice/closed"},{"kind":"item","id":"b8215.i04","label":"4","prompt":"We may not have access to the cloud in the future.","options":[],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U01-classroom:material:RW-M03","title":"READING 1","text":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.\n2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.\n3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.\n4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?\n5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.\n6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and wha hrow away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","screens":["1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.","2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.","3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began nment documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages."],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U01-material:B05-RW-U01:p20:DigitalDarkAges","title":"第20页文章 Are We Living in the Digital Dark Ages?","pages":[20],"text":"","screens":[],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9dfef8cb9e58f866b9ed6b03573cbd91278f204971f7af6b149d49637e1226c.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 We don’t have a lot of information about\nthe Dark Ages (a period in European\nhistory from AD 476 to around AD\n1000), so we don’t fully understand what\nhappened during that time. Our time\ncould become like that to the people of\nthe future.\n2 A bit is the smallest unit of data on a\ncomputer. Rot means to decay. So bit\nrot might mean the permanent loss of\ndigitally held information.\n3 Interactive apps and websites go out of\ndate very quickly.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent at is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.","4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?","5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.","6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages."],"sources":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9dfef8cb9e58f866b9ed6b03573cbd91278f204971f7af6b149d49637e1226c.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Dear Future Relative,\nI’ve saved a few items from my life, hoping\nthey’ll give you a glimpse into my world.\nFirst, I’ve kept a handwritten diary filled\nwith my thoughts and daily experiences—\nan authentic record of my emotions\nand the era I lived in. I also included my\nfavourite book, which had a significant\nimpact on how I see the world. There’s\nan old smartphone too, symbolizing how\ntechnology shaped our lives. Lastly, a family\nphoto album, capturing the moments of\nour lives. I hope these objects connect you\nto the past and enrich your future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw. urred in your lifetime to a partner. Use time expressions.","pages":[27],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d89d7d1c76cfcf96cdd20d4025c5cdacad0cb44345199c4b4d72e41763b6f670.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I’ve seen my neighbourhood change a lot\nin my lifetime. Over the past five years, a\nlot of new restaurants have opened. At one\ntime, I had to travel to distant parts of the\ncity to find great food, but not anymore.\nMore people know about our local parks,\ntoo, because they are more crowded than\nthey used to be. It also seems like the cost\nof housing went up in a flash. Suddenly it\ngot very expensive to live here.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8249","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"COMPOUND ADJECTIVES"},"instruction":"Match the words in column A to words in ers of complaint, the city cancelled the upcoming ____ of the old building.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed"},{"id":"b8227.i05","label":"5","prompt":"Despite the recent ____, the historic home maintained an old-fashioned quality.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed"},{"id":"b8227.i06","label":"6","prompt":"Although the city has become quite ____ , there are still affordable houses to be found in some areas.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed"},{"id":"b8227.i07","label":"7","prompt":"What he loved most about his ____ neighborhood were the cafés and restaurants, where locals ate and socialized on a regular basis.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed"},{"id":"b8227.i08","label":"8","prompt":"The years have brought about ____ changes to the city. It will never be the same as it once was.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8227.i01","label":"1","prompt":"The ____ houses all looked the same so it was difficult to find the one we were looking for.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":4}},{"kind":"item","id":"b8227.i02","label":"2","prompt":"The old printing factory is now a trendy, successful hotel, and a good example of ____ reuse and recycling.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":3}}],[{"kind":"item","id":"b8227.i03","label":"3","prompt":"When the architect designed the building, she ____ solar energy instead of natural gas as the main power source.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":7}},{"kind":"item","id":"b8227.i04","label":"4","prompt":"Having received countless letters of complaint, the city cancelled the upcoming ____ of the old building.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":0}}],[{"kind":"item","id":"b8227.i05","label":"5","prompt":"Despite the recent ____, the historic home maintained an old-fashioned quality.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":6}},{"kind":"item","id":"b8227.i06","label":"6","prompt":"Although the city has become quite ____ , there are still affordable houses to be found in some areas.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":2}}],[{"kind":"item","id":"b8227.i07","label":"7","prompt":"What he loved most about his ____ neighborhood were the cafés and restaurants, where locals ate and socialized on a regular basis.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":1}},{"kind":"item","id":"b8227.i08","label":"8","prompt":"The years have brought about ____ changes to the city. It will never be the same as it once was.","options":["demolition","vibrant","affluent","adaptive","anonymous","irreversible","renovation","opted for"],"type":"choice/closed","answer":{"label":"8","mode":"choice","option":5}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 anonymous 2 adaptive 3 opted for\n4 demolition 5 renovation 6 affluent 7 vibrant\n8 irreversible","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":25,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8231","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":25,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the article. Then complete the tasks. 2 Highlight the sentences in the article that express the main ideas you circled.","pages":[25],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7411d3255e105eab53bd52018f1ddb8e87b4a0166f347bcdd56fbf57ce1daf97.png"],"provided":"1 Circle the statements that express the main ideas.","items":[{"id":"b8231.i01","label":"a","prompt":"If new buildings continue to replace old buildings, our heritage will be harmed.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8231.i02","label":"b","prompt":"Dubai has successfully preserved many of their historic buildings.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8231.i03","label":"c","prompt":"Preserving historic buildings is a wise economic choice.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8231.i04","label":"d","prompt":"For some buildings, historic preservation is less expensive than demolition.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"id":"b8231.i05","label":"e","prompt":"Environmentally safe procedures must be used at all new building sites.","options":["Main idea","Not a main idea"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Circle the statements that express the main ideas."},{"kind":"item","id":"b8231.i01","label":"a","prompt":"If new buildings continue to replace old buildings, our heritage will be harmed.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8231.i02","label":"b","prompt":"Dubai has successfully preserved many of their historic buildings.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8231.i03","label":"c","prompt":"Preserving historic buildings is a wise economic choice.","options":["Main idea","Not a main idea"],"type":"choice/closed"}],[{"kind":"item","id":"b8231.i04","label":"d","prompt":"For some buildings, historic preservation is less expensive than demolition.","options":["Main idea","Not a main idea"],"type":"choice/closed"},{"kind":"item","id":"b8231.i05","label":"e","prompt":"Environmentally safe procedures must be used at all new building sites.","options":["Main idea","Not a main idea"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U01-classroom:material:RW-M04","title":"READING 2","text":"# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.\n2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.\n3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.\n4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.\n5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.\n6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","screens":["# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.","2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.","3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.","4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.","5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.","6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered."],"sources":[{"page":24,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U01-material:B05-RW-U01:p24:PreservingHeritage","title":"第24页 Preserving our heritage 文章","pages":[24],"text":"","screens":[],"sources":[{"page":24,"src":"https://raw.githubusercontent.com/  $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.\n3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.\n4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's econ ditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.\n3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.\n4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.\n5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the b
