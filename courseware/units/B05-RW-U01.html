ct, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.\n6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","screens":["# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.","2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.","3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.","4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.","5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.","6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered."],"sources":[{"page":24,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U01-material:B05-RW-U01:p24:PreservingHeritage","title":"第24页 Preserving our heritage 文章","pages":[24],"text":"","screens":[],"sources":[{"page":24,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3356997114d54decfab4dfebe89fcc1fdad407ef01ee424d6400e6ab1145a0ae.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Group A: Preserving old buildings is\ncrucial for maintaining cultural identity and\nunderstanding our heritage. When historical\nstructures are demolished, we lose the\nphysical connections to our past and the\nopportunity to experience the architecture\nand craftsmanship of previous generations.\nWithout these physical reminders and\nmemorabilia, it is more difficult to fully\nunderstand and appreciate the cultural and\nhistorical context of our heritage. Keeping old\nbuildings helps ensure that future generations\ncan connect with and learn from their history.\nGroup B: Tearing down old buildings to\nmake way for new ones can be beneficial\nfor progress and modernization. It can\nprovide updated infrastructure that meets\ncurrent needs. Cultural identity can still\nbe preserved through other means,\nsuch as education, digital archives, and\ncommunity traditions, even if historical\nbuildings are removed. Understanding our\nheritage doesn’t solely depend on physical\nmemorabilia. Heritage can be preserved\nand interpreted in other ways, for example\noral histories and cultural practices.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8255","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read these facts about preservation and new construction. Which support preservation (P) and which support new construction (NC)?","pages":[30,31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1a05f92d7fcd051c2b7c9ce3c139a152e32fc8f8ccf24e434a0df00ff45fb2c8.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea0f2e43395923804b28c4e0a381e53ec2e0b013a520926beeadcc107733d7d9.png"],"provided":"","items":[{"id":"b8255.i01","label":"1","prompt":"More than 400 million tons of materials get delivered to new construction sites in the UK each year. Of these, 60 million tons are wasted. ____","options":[],"type":"choice/open"},{"id":"b8255.i02","label":"2","prompt":"Renovating old buildings often releases toxic materials that can be dangerous to future occupants. Removing these materials is expensive – more than £15,000 per 100 square metres. ____","options":[],"type":"choice/open"},{"id":"b8255.i03","label":"3","prompt":"Some research studies estimate that a new, energy-efficient building can make up for the environmental impact of tearing down an old building in as little as ten years. ____","options":[],"type":"choice/open"},{"id":"b8255.i04","label":"4","prompt":"Heritage tourism sites, like the old city in Fez, Morocco, bring in millions of tourists and millions of dollars every year. ____","options":[],"type":"choice/open"},{"id":"b8255.i05","label":"5","prompt":"A recent study suggests that it takes 35 to 50 years for a new building to save the amount of energy that is used when an existing building is torn down and a new one is built. ____","options":[],"type":"choice/open"},{"id":"b8255.i06","label":"6","prompt":"Traditionally, many local families lived in villas, which allowed several generations to live together. With the move towards apartments, there is less space and fewer opportunities for extended families to live together under one roof. ____","options":[],"type":"choice/open"},{"id":"b8255.i07","label":"7","prompt":"A study in the USA demonstrated that an average of 14.6 jobs were created per million dollars spent on renovation, compared with 11.2 jobs per million dollars spent on new construction. ____","options":[],"type":"choice/open"},{"id":"b8257.i01","label":"8","prompt":"When restoring old buildings, there are often surprises which can cause a project to take twice as long as new construction projects, resulting in increased costs. ____","options":[],"type":"gap/open"},{"id":"b8257.i02","label":"9","prompt":"On a cost per square metre basis, renovation is usually slightly more expensive than new construction. ____","options":[],"type":"gap/open"},{"id":"b8257.i03","label":"10","prompt":"New construction near the waterfront will allow 2,000 families to move from residences without electricity or running water to modem housing. ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8255.i01","label":"1","prompt":"More than 400 million tons of materials get delivered to new construction sites in the UK each year. Of these, 60 million tons are wasted. ____","options":[],"type":"choice/open","answer":{"label":"1","mode":"gap","answer":"P"}},{"kind":"item","id":"b8255.i02","label":"2","prompt":"Renovating old buildings often releases toxic materials that can be dangerous to future occupants. Removing these materials is expensive – more than £15,000 per 100 square metres. ____","options":[],"type":"choice/open","answer":{"label":"2","mode":"gap","answer":"NC"}},{"kind":"item","id":"b8255.i03","label":"3","prompt":"Some research studies estimate that a new, energy-efficient building can make up for the environmental impact of tearing down an old building in as little as ten years. ____","options":[],"type":"choice/open","answer":{"label":"3","mode":"gap","answer":"NC"}},{"kind":"item","id":"b8255.i04","label":"4","prompt":"Heritage tourism sites, like the old city in Fez, Morocco, bring in millions of tourists and millions of dollars every year. ____","options":[],"type":"choice/open","answer":{"label":"4","mode":"gap","answer":"P"}}],[{"kind":"item","id":"b8255.i05","label":"5","prompt":"A recent study suggests that it takes 35 to 50 years for a new building to save the amount of energy that is used when an existing building is torn down and a new one is built. ____","options":[],"type":"choice/open","answer":{"label":"5","mode":"gap","answer":"P"}},{"kind":"item","id":"b8255.i06","label":"6","prompt":"Traditionally, many local families lived in villas, which allowed several generations to live together. With the move towards apartments, there is less space and fewer opportunities for extended families to live together under one roof. ____","options":[],"type":"choice/open","answer":{"label":"6","mode":"gap","answer":"P"}},{"kind":"item","id":"b8255.i07","label":"7","prompt":"A study in the USA demonstrated that an average of 14.6 jobs were created per million dollars spent on renovation, compared with 11.2 jobs per million dollars spent on new construction. ____","options":[],"type":"choice/open","answer":{"label":"7","mode":"gap","answer":"P"}}],[{"kind":"item","id":"b8257.i01","label":"8","prompt":"When restoring old buildings, there are often surprises which can cause a project to take twice as long as new construction projects, resulting in increased costs. ____","options":[],"type":"gap/open","answer":{"label":"8","mode":"gap","answer":"NC"}},{"kind":"item","id":"b8257.i02","label":"9","prompt":"On a cost per square metre basis, renovation is usually slightly more expensive than new construction. ____","options":[],"type":"gap/open","answer":{"label":"9","mode":"gap","answer":"NC"}},{"kind":"item","id":"b8257.i03","label":"10","prompt":"New construction near the waterfront will allow 2,000 families to move from residences without electricity or running water to modem housing. ____","options":[],"type":"gap/open","answer":{"label":"10","mode":"gap","answer":"NC"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 P 2 NC 3 NC 4 P 5 P 6 P 7 P 8 NC 9 NC\n10 NC","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8258","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in a small group. Look at the facts from Exercise 1 and discuss the following questions.","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea0f2e43395923804b28c4e0a381e53ec2e0b013a520926beeadcc107733d7d9.png"],"provided":"","items":[{"id":"b8258.i01","label":"1","prompt":"How do the facts support preservation or new construction?","options":[],"type":"discuss/open"},{"id":"b8258.i02","label":"2","prompt":"What kind of reader would find each fact interesting or persuasive? Why?","options":[],"type":"discuss/open"},{"id":"b8258.i03","label":"3","prompt":"Which facts are the most relevant for buildings in your city or country? Why?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U01-question:b8255","kind":"material-reference","title":"CRITICAL THINKING Ex 1","pages":[30,31]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8258.i01","label":"1","prompt":"How do the facts support preservation or new construction?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8258.i02","label":"2","prompt":"What kind of reader would find each fact interesting or persuasive? Why?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8258.i03","label":"3","prompt":"Which facts are the most relevant for buildings in your city or country? Why?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-RW-U01-publisher-sheet:b8255","title":"CRITICAL THINKING Ex 1 原题面","pages":[30,31],"text":"","screens":[],"sources":[{"page":30,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1a05f92d7fcd051c2b7c9ce3c139a152e32fc8f8ccf24e434a0df00ff45fb2c8.png"},{"page":31,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea0f2e43395923804b28c4e0a381e53ec2e0b013a520926beeadcc107733d7d9.png"}],"kind":"task_sheet","sourceBlockIds":["b8255","b8257"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 New construction is supported by\nconcerns like the release of toxic\nmaterials during renovations, the\nslightly lower cost, the potential for\nmore energy-efficient buildings and the\nbenefits of modern housing.\nPreservation offers cultural and\neconomic advantages, in the value\nof heritage tourism, the creation of\njobs and the importance of multi-\ngenerational living.\n2 Readers interested in sustainability and\nenvironmental impact would find facts\nabout material waste energy efficiency,\nand the long-term environmental cost of\nnew buildings persuasive.\nThose focused on economic and\nsocial factors would be drawn to facts\nhighlighting job creation through\nrenovation, the financial benefits of\nheritage tourism and the need for\nmodern housing infrastructure.\n3 In my city there is a need to develop a\nmore modern housing infrastructure.\nHowever, as it is a historic city with many\nold buildings, there is a value in heritage\ntourism, to preserve cultural landmarks\nwhile also supporting the local economy.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8259","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Choose the neighbourhood or area that you would like to research and write about. Try to choose an area you know well. Will you recommend that the buildings be demolished to make way for new construction or that the built environment be preserved? Research facts that support your argument.","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea0f2e43395923804b28c4e0a381e53ec2e0b013a520926beeadcc107733d7d9.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I am going to write about the centre of\nHanoi in Vietnam. I lived there for two\nyears. It has an ‘old quarter’ with many\nhistoric buildings but there is a lot of new\nconstruction happening in the city. I will\nargue that the area should be renovated\nand preserved. It is a popular area for\ntourism and is important to the cultural\nheritage of the city.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8260","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Look at the facts you have researched and answer the questions.","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea0f2e43395923804b28c4e0a381e53ec2e0b013a520926beeadcc107733d7d9.png"],"provided":"","items":[{"id":"b8260.i01","label":"1","prompt":"Who will the reader be?","options":[],"type":"qa/open"},{"id":"b8260.i02","label":"2","prompt":"What kinds of facts and information would your reader find interesting? Which are the most interesting?","options":[],"type":"qa/open"},{"id":"b8260.i03","label":"3","prompt":"Are the facts relevant to your argument? Which are the most relevant?","options":[],"type":"qa/open"},{"id":"b8260.i04","label":"4","prompt":"Have you included information that may appeal to your reader's emotions?","options":[],"type":"qa/open"},{"id":"b8260.i05","label":"5","prompt":"Have you included any statements by experts?","options":[],"type":"qa/open"},{"id":"b8260.i06","label":"6","prompt":"Are any of the facts in Exercise 1 relevant to your argument? Which could you use in your essay?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B05-RW-U01-question:b8259","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[31]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8260.i01","label":"1","prompt":"Who will the reader be?","options":[],"type":"qa/open"},{"kind":"item","id":"b8260.i02","label":"2","prompt":"What kinds of facts and information would your reader find interesting? Which are the most interesting?","options":[],"type":"qa/open"},{"kind":"item","id":"b8260.i03","label":"3","prompt":"Are the facts relevant to your argument? Which are the most relevant?","options":[],"type":"qa/open"},{"kind":"item","id":"b8260.i04","label":"4","prompt":"Have you included information that may appeal to your reader's emotions?","options":[],"type":"qa/open"},{"kind":"item","id":"b8260.i05","label":"5","prompt":"Have you included any statements by experts?","options":[],"type":"qa/open"},{"kind":"item","id":"b8260.i06","label":"6","prompt":"Are any of the facts in Exercise 1 relevant to your argument? Which could you use in your essay?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B05-RW-U01-publisher-sheet:b8255","title":"CRITICAL THINKING Ex 1 原题面","pages":[30,31],"text":"","screens":[],"sources":[{"page":30,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1a05f92d7fcd051c2b7c9ce3c139a152e32fc8f8ccf24e434a0df00ff45fb2c8.png"},{"page":31,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea0f2e43395923804b28c4e0a381e53ec2e0b013a520926beeadcc107733d7d9.png"}],"kind":"task_sheet","sourceBlockIds":["b8255","b8257"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The reader will be someone who is\ninterested in travel and architecture.\n2 They will find facts about the geography\nand history of the area interesting.\n3 Facts about the size and nature of the\narea will be relevant, and about the type\nof new development that is happening\nin the area too.\n4 I have included emotional appeal.\n5 I have included statements by experts.\n6 Facts about heritage tourism and\nenvironmental impact will be relevant\nand could be used in the essay.\nGRAMMAR FOR WRITING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8263","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":35,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR W 9e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8267","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Each paragraph is missing a sentence. Read the sentences (a–f) and write the correct letters in the paragraphs (1–4) they belong in. You will have two sentences left over.","pages":[33,34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5e209fb64752936ddc48a262e5e43ca501714b13ef1bd45a7fb65670a8ef7c0a.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c16eed00e9d55033597c8cf8db7d50be4554aa0cfc2d1b683fa9a3020f32f734.png"],"provided":"a Farmers' markets are becoming increasingly popular in UK cities.\nb Homeowners cannot make major changes that affect the appearance of their home or the surrounding gardens and trees without planning permission.\nc Stonehenge is visited by thousands of people on the longest and shortest days of the year, which often causes significant damage to the site.\nd One of their top priorities is to make sure that, now and in future generations, people can continue to visit these invaluable cultural landmarks.\ne Because their homes are protected, owners are willing to invest in them.\nf Extensive resources exist to help residents implement energy-efficient, money-saving techniques in their homes.\n\n1 The creation of historic conservation areas generally increases property values. ____ Owners do not have to worry about future changes in the character and quality of their neighbourhood. As a result, these areas tend to attract wealthier families who can afford to pay for the unique character that historic conservation areas provide.\n2 People are often unaware that there are financial advantages to living in a historic conservation area. Local authorities may offer grants for repairs and renovations. ____ Funding may also be available from other organizations, such as charities with an interest in preserving our architectural heritage.\n3 ____ In the past twenty years, their number has increased from just one or two to over five hundred. Their popularity has been driven by the public's desire for locally grown food and also by an increasing awareness of the impact on the environment of food that comes from far away. Experts predict that the demand for locally grown food will continue to increase.","items":[{"id":"b8267.i01","label":"1","prompt":"The creation of historic conservation areas generally increases property values. ____ Owners do not have to worry about future changes in the character and quality of their neighbourhood. As a result, these areas tend to attract wealthier families who can afford to pay for the unique character that historic conservation areas provide.","options":["Farmers' markets are becoming increasingly popular in UK cities.","Homeowners cannot make major changes that affect the appearance of their home or the surrounding gardens and trees without planning permission.","Stonehenge is visited by thousands of people on the longest and shortest days of the year, which often causes significant damage to the site.","One of their top priorities is to make sure that, now and in future generations, people can continue to visit these invaluable cultural landmarks.","Because their homes are protected, owners are willing to invest in them.","Extensive resources exist to help residents implement energy-efficient, money-saving techniques in their homes."],"type":"choice/closed"},{"id":"b8267.i02","label":"2","prompt":"People are often unaware that there are financial advantages to living in a historic conservation area. Local authorities may offer grants for repairs and renovations. ____ Funding may also be available from other organizations, such as charities with an interest in preserving our architectural heritage.","options":["Farmers' markets are becoming increasingly popular in UK cities.","Homeowners cannot make major changes that affect the appearance of their home or the surrounding gardens and trees without planning permission.","Stonehenge is visited by thousands of people on the longest and shortest days of the year, which often causes significant damage to the site.","One of their top priorities is to make sure that, now and in future generations, people can continue to visit these invaluable cultural landmarks.","Because their homes are protected, owners are willing to invest in them.","Extensive resources exist to help residents implement energy-efficient, money-saving techniques in their homes."],"type":"choice/closed"},{"id":"b8267.i03","label":"3","prompt":"____ In the past twenty years, their number has increased from just one or two to over five hundred. Their popularity has been driven by the public's desire for locally grown food and also by an increasing awareness of the impact on the environment of food that comes from far away. Experts predict that the demand for locally grown food will continue to increase.","options":["Farmers' markets are becoming increasingly popular in UK cities.","Homeowners cannot make major changes that affect the appearance of their home or the surrounding gardens and trees without planning permission.","Stonehenge is visited by thousands of people on the longest and shortest days of the year, which often causes significant damage to the site.","One of their top priorities is to make sure that, now and in future generations, people can continue to visit these invaluable cultural landmarks.","Because their homes are protected, owners are willing to invest in them.","Extensive resources exist to help residents implement energy-efficient, money-saving techniques in their homes."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a Farmers' markets are becoming increasingly popular in UK cities."},{"kind":"text","text":"b Homeowners cannot make major changes that affect the appearance of their home or the surrounding gardens and trees without planning permission."},{"kind":"text","text":"c Stonehenge is visited by thousands of people on the longest and shortest days of the year, which often causes significant damage to the site."},{"kind":"text","text":"d One of their top priorities is to make sure that, now and in future generations, people can continue to visit these invaluable cultural landmarks."},{"kind":"text","text":"e Because their homes are protected, owners are willing to invest in them."}],[{"kind":"text","text":"f Extensive resources exist to help residents implement energy-efficient, money-saving techniques in their homes."},{"kind":"text","text":"1 The creation of historic conservation areas generally increases property values. ____ Owners do not have to worry about future changes in the character and quality of their neighbourhood. As a result, these areas tend to attract wealthier families who can afford to pay for the unique character that historic conservation areas provide."},{"kind":"text","text":"2 People are often unaware that there are financial advantages to living in a historic conservation area. Local authorities may offer grants for repairs and renovations. ____ Funding may also be available from other organizations, such as charities with an interest in preserving our architectural heritage."}],[{"kind":"text","text":"3 ____ In the past twenty years, their number has increased from just one or two to over five hundred. Their popularity has been driven by the public's desire for locally grown food and also by an increasing awareness of the impact on the environment of food that comes from far away. Experts predict that the demand for locally grown food will continue to increase."}]],"courseMaterials":[{"id":"B05-RW-U01-publisher-continuation:p034:b8267:paragraph4","title":"ACADEMIC WRITING SKILLS Ex 1 第4段跨页续项","pages":[34],"text":"English Heritage (the English Heritage Trust) is a charity that manages historic buildings, such as palaces, stately homes and castles. ____ It also protects ancient sites such as Stonehenge. More than 5,000 years of history are preserved by the charity. Donations and entrance fees fund the conservation work done by the charity across the country.","screens":["English Heritage (the English Heritage Trust) is a charity that manages historic buildings, such as palaces, stately homes and castles. ____ It also protects ancient sites such as Stonehenge. More than 5,000 years of history are preserved by the charity. Donations and entrance fees fund the conservation work done by the charity across the country."],"sources":[{"page":34,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c16eed00e9d55033597c8cf8db7d50be4554aa0cfc2d1b683fa9a3020f32f734.png"}],"kind":"publisher_task_continuation","sourceBlockIds":["b8267"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 e 2 f 3 a 4 d","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8269","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":38,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Write your opinion about the situations below. Use impersonal statements. Then compare your opinion with a partner's.","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c16eed00e9d55033597c8cf8db7d50be4554aa0cfc2d1b683fa9a3020f32f734.png"],"provided":"","items":[{"id":"b8269.i01","label":"1","prompt":"The city wants to build a state-of-the-art hospital in a residential neighbourhood. The new hospital will create a lot of jobs, but it will also cause extra traffic and noise for the residents.","options":[],"type":"gap/open"},{"id":"b8269.i02","label":"2","prompt":"The historic district on the waterfront was restored but it was very expensive. Opponents say the money should have been spent on other causes, like helping people in need.","options":[],"type":"gap/open"},{"id":"b8269.i03","label":"3","prompt":"The mayor's idea to build several new apartment buildings was met with protest. Even though the city needs more housing, residents say the buildings are anonymous and will cause the city to lose its character.","options":[],"type":"gap/open"},{"id":"b8269.i04","label":"4","prompt":"A new convention centre would be an incredible benefit for this city and its citizens, as it would provide both jobs and revenue. However, it will require the demolition of a dozen historic buildings.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8269.i01","label":"1","prompt":"The city wants to build a state-of-the-art hospital in a residential neighbourhood. The new hospital will create a lot of jobs, but it will also cause extra traffic and noise for the residents.","options":[],"type":"gap/open"},{"kind":"item","id":"b8269.i02","label":"2","prompt":"The historic district on the waterfront was restored but it was very expensive. Opponents say the money should have been spent on other causes, like helping people in need.","options":[],"type":"gap/open"},{"kind":"item","id":"b8269.i03","label":"3","prompt":"The mayor's idea to build several new apartment buildings was met with protest. Even though the city needs more housing, residents say the buildings are anonymous and will cause the city to lose its character.","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8269.i04","label":"4","prompt":"A new convention centre would be an incredible benefit for this city and its citizens, as it would provide both jobs and revenue. However, it will require the demolition of a dozen historic buildings.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The city absolutely must build the\nhospital. There’s nothing more\nimportant than the safety and health of\nour citizens.\n2 The historic district was badly in need of\nrenovation and it’s a good thing it was\nrestored. The buildings were old and\ncreated a safety hazard.\n3 Anonymous apartment buildings\nare a terrible idea. Tourists come to\nour city because it is charming and\nhistoric. They’ll stop coming if the city\nloses its character, and we will lose\nnecessary revenue.\n4 It is vital that we prevent the demolition\nof our historic buildings. Surely there’s\nanother place to build a convention\ncentre that would not take away from\nthe heritage of our city.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8272","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":39,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Discuss the questions with a partner. Then make notes about the area you have chosen to write about. This information will be used in your introductory paragraph.","pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e18b8219d8694dcde94f7954b6325ecbc1f7032ec031f03303760312a7d38f1e.png"],"provided":"1 Where is the area or neighbourhood you have chosen located?\n2 What is the historical significance of the area?\n3 Describe the physical condition of the buildings or houses.","items":[{"id":"b8272.i01","label":"1","prompt":"Where is the area or neighbourhood you have chosen located?","options":[],"type":"discuss/open"},{"id":"b8272.i02","label":"2","prompt":"What is the historical significance of the area?","options":[],"type":"discuss/open"},{"id":"b8272.i03","label":"3","prompt":"Describe the physical condition of the buildings or houses.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U01-question:b8259","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[31]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Where is the area or neighbourhood you have chosen located?"},{"kind":"text","text":"2 What is the historical significance of the area?"},{"kind":"text","text":"3 Describe the physical condition of the buildings or houses."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Hanoi city centre, Vietnam\n2 It contains many narrow, streets and old\nbuildings that characterised the city for\nhundreds of years.\n3 Many of the buildings are run down but\nthey are actively used as residences\nor businesses.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8273","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":40,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Write three reasons why the buildings should be renovated and three reasons why they should be torn down. Decide your position. Write a statement of your position. This will be your thesis statement.","pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e18b8219d8694dcde94f7954b6325ecbc1f7032ec031f03303760312a7d38f1e.png"],"provided":"renovated ____\ntorn down ____\nthesis statement ____","items":[{"id":"b8273.i01","label":"renovated","prompt":"renovated ____","options":[],"type":"gap/open"},{"id":"b8273.i02","label":"torn down","prompt":"torn down ____","options":[],"type":"gap/open"},{"id":"b8273.i03","label":"thesis statement","prompt":"thesis statement ____","options":[],"type"  their cultural identity.\nbody paragraph 2 experts in urban development agree\nthat heritage sites like the bring in\nsignificant revenue through tourism.\nheritage tourism sites such as Fez in Morocco\ngenerate millions of dollars annually, benefiting\nboth local economies and residents.\nbody paragraph 3 preserving historic areas has been\nshown to create more jobs than\nnew construction.\nstudies indicate that renovation projects\ngenerate 14.6 jobs per million dollars spent,\ncompared to 11.2 jobs for new buildings.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8275","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":42,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Consider the alternatives and consequences of your position. Complete the following sentences.","pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e18b8219d8694dcde94f7954b6325ecbc1f7032ec031f03303760312a7d38f1e.png"],"provided":"If the buildings are torn down, ____\nIf the buildings are renovated, ____","items":[{"id":"b8275.i01","label":"1","prompt":"If the buildings are torn down, ____","options":[],"type":"gap/open"},{"id":"b8275.i02","label":"2","prompt":"If the buildings are renovated, ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"If the buildings are torn down, ____"},{"kind":"text","text":"If the buildings are renovated, ____"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"If the buildings are torn down, it will be an\nirreversible loss to the culture of the city.\nIf the buildings are renovated, the area will\nretain its vibrant character.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8276","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":43,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Consider the position you have taken in your essay. Why is it the best option? Why is it important? Write a sentence, using at least one new vocabulary word. This is how you will end your essay.","pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e18b8219d8694dcde94f7954b6325ecbc1f7032ec031f03303760312a7d38f1e.png"],"provided":"","items":[{"id":"b8276.i01","label":"1","prompt":"Write a concluding sentence explaining why your position is the best option and why it is important, using at least one new vocabulary word.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8276.i01","label":"1","prompt":"Write a concluding sentence explaining why your position is the best option and why it is important, using at least one new vocabulary word.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"It’s not just about the renovation of\nbuildings, but about preserving a\nsense of belonging and history for\nfuture generations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U01-question:b8278","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"order":44,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 400–450 words.","pages":[36],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e50195533f5f3d04a0b430813948d6f4f5d6d77e2528979217820fd7a62f14a.png"],"provided":"","items":[{"id":"b8278.i01","label":"6","prompt":"Write your essay. Use your essay plan to help you structure your ideas. Write 400–450 words.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U01-question:b8272","kind":"student-work","title":"WRITING TASK Ex 1","pages":[35]},{"id":"B05-RW-U01-question:b8273","kind":"student-work","title":"WRITING TASK Ex 2","pages":[35]},{"id":"B05-RW-U01-question:b8274","kind":"student-work","title":"WRITING TASK Ex 3","pages":[35]},{"id":"B05-RW-U01-question:b8275","kind":"student-work","title":"WRITING TASK Ex 4","pages":[35]},{"id":"B05-RW-U01-question:b8276","kind":"student-work","title":"WRITING TASK Ex 5","pages":[35]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The Hanoi Old Quarter, with its narrow\nstreets and traditional architecture, is a\nsignificant cultural landmark in Vietnam\nand should be preserved. Preserving\nthis area offers numerous benefits, both\nculturally and economically. It will not\nonly safeguard a vital piece of Vietnam’s\nhistory but also promote a thriving heritage\ntourism industry.\nThe Old Quarter’s traditional architecture\nand lively markets provide an authentic\nglimpse into the past, something that,\nonce destroyed, cannot be recreated. If\nfuture generations lose this connection\nto their heritage, they will miss out on an\nirreplaceable part of their cultural identity.\nExperts in urban development agree that\nheritage sites like the Old Quarter bring\nin significant revenue through tourism.\nIn fact, heritage tourism sites such as Fez\nin Morocco generate millions of dollars\nannually, benefiting both local economies\nand residents. If Hanoi continues to attract\nmillions of tourists, the local businesses will\nthrive, creating jobs and ensuring that the\ncity remains a major cultural destination.\nThis kind of economic growth could be lost\nif the area is redeveloped.\nMoreover, preserving historic areas has\nbeen shown to create more jobs than\nnew construction. Studies indicate that\nrenovation projects generate 14.6 jobs\nper million dollars spent, compared\nto 11.2 jobs for new buildings. These\nfacts highlight the practical benefits of\npreservation beyond the emotional appeal\nof saving cultural landmarks.\nHowever, it’s more than just economic.\nThere’s something deeply emotional about\nwalking through streets that have been\nthe heart of a city for centuries. When we\npreserve the Old Quarter, we maintain a\nliving connection to the past that touches\nthe soul. If we destroy it, we will never get\nit back. It’s not just about the renovation\nof buildings, but about preserving a\nsense of belonging and history for\nfuture generations.\nUNIT 2\nUNLOCK YOUR\nKNOWLEDGE\npage 39\n1 Two of my favourite brands are Kate\nSpade and Starbucks. I love accessories\nby Kate Spade, especially the handbags,\nwhich come in bright, unique colours.\nThe company logo of a spade is\nalso appealing because it is simple.\nStarbucks appeals to me because the\ncoffee is consistently good, no matter\nwhere in the world I drink it.\n2 If clothes or accessories feature a logo,\nI am less likely to buy them, especially\nif the logo is large. I find logos on\nclothes to be distracting and sometimes\neven ugly.\nI am more likely to buy clothes or\naccessories if they feature a logo. Some\nlogos are very colourful and attractive,\nso they make a T-shirt or handbag, for\nexample, more appealing.\n3 Slogans make more of an impact on\nconsumers. When a slogan is used\nin an advertisement, especially if it is\nmade into a song, consumers will never\nforget it.\nLogos are more impactful. While both\nslogans and logos may be featured\non clothes, logos look much more\nattractive than just words. And, unlike\nwords, consumers do not need to\nknow any particular language to\nappreciate pictorial logos. They can be\nuniversally understood.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":28,"title":"教师书"},{"sou
