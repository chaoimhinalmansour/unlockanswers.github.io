ment."},{"label":"Grammar","text":"Use first and second conditionals."},{"label":"Academic writing skills","text":"Write structured and unified paragraphs; write impersonal statements."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":14,"alt":""}}]}},{"id":"B05-RW-U01-classroom:resource:b8198","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4f2f3520fa62b875f1ffcf8730c97db4068ae6e2ea8c81cef392d06ded7d185b.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"repository","pos":"(n)","definition":"a place where things are stored","example":"The library serves as a repository for local records.","wordAudio":"repository","cardWord":false},{"term":"founder","pos":"(n)","definition":"someone who establishes an organization","example":"The founder of the company began by selling bicycles from home.","wordAudio":"founder","cardWord":false},{"term":"masterpiece","pos":"(n)","definition":"a work of art, such as a painting, movie or book","example":"The gallery described the painting as the artist's masterpiece.","wordAudio":"masterpiece","cardWord":false},{"term":"the passage of time","pos":"(phr)","definition":"the process of time going past","example":"The tree's growth rings show the passage of time.","wordAudio":"the passage of time","cardWord":false},{"term":"seal","pos":"(v)","definition":"to close a container so that nothing can enter or leave it","example":"Seal the container before you put it in the fridge.","wordAudio":"seal","cardWord":false},{"term":"elders","pos":"(n)","definition":"older people, especially those with respected positions in society","example":"The village elders met to discuss the plan.","wordAudio":"elders","cardWord":false}]]}},{"id":"B05-RW-U01-classroom:video","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b9085ccc0f001c415df24816bf63af80b35477aa6a56608fe7df89b1e2f2278.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/442ce4955fdea6b9157c6ddc-L5RW-U01.mp4","captions":[{"start":0.82,"end":5.36,"text":"The history of perfume is as long as that of human\ncivilization."},{"start":6.46,"end":8.64,"text":"In this cellar in Versailles, France,"},{"start":8.96,"end":14.38,"text":"they're preserving the scents of the past and the\npresent to share with new generations."},{"start":16.98,"end":23.1,"text":"The Osmotec is an international repository for\nthousands of perfumes, many of which are"},{"start":23.1,"end":23.36,"text":"no"},{"start":23.36,"end":24.86,"text":"longer available to buy."},{"start":24.86,"end":34.52,"text":"The founders believe that the global evolution of\nperfumes contains influential masterpieces, just like\nany other form of human creativity."},{"start":35.3,"end":39.48,"text":"They're determined that these should not be lost to the\npassage of time."},{"start":42.02,"end":44.56,"text":"Here we have the Chypre de Cotty,"},{"start":44.98,"end":45.48,"text":"a landmark."},{"start":46.36,"end":49.52,"text":"It was created in 1917 by François Cotty."},{"start":49.52,"end":54.84,"text":"More than four ,000 scents are stored in this cellar at\na constant temperature."},{"start":55.46,"end":57.34,"text":"The Osmotec is somewhere unique,"},{"start":57.9,"end":62.48,"text":"and all the perfumes that the public can discover here\nrepresent very rare moments."},{"start":63.08,"end":64.26,"text":"They're marvels."},{"start":65.74,"end":71.02,"text":"Each perfume is sealed in an opaque bottle under a\nprotective layer of argon gas."},{"start":71.6,"end":75.96000000000001,"text":"Many of the perfumes held here are recreated from\nhistorical recipes."},{"start":76.88,"end":81.64,"text":"The oldest dates back thousands of years to the times\nof the Roman Empire."},{"start":84.2,"end":90.3,"text":"Constructing a perfume is about natural and synthetic\nodors, playing with different types of smells."},{"start":90.92,"end":97.36,"text":"First, you have to learn to memorize these odors so\nthat later, with some imagination and a certain\nartistic tendency,"},{"start":97.8,"end":99.02000000000001,"text":"you can compose a perfume."},{"start":100.75999999999999,"end":105.14,"text":"A fine scent begins with fine ingredients."},{"start":105.62,"end":107.74000000000001,"text":"As one of the world's oldest industries,"},{"start":108.3,"end":115.02000000000001,"text":"there are many agricultural communities founded on\nsupplying perfume manufacturers with raw materials."},{"start":115.96000000000001,"end":118.7,"text":"But if new generations do not get involved,"},{"start":119.18,"end":119.97999999999999,"text":"these communities'"},{"start":120.6,"end":121.88,"text":"traditions may be lost."},{"start":122.86,"end":127.14,"text":"In grass in France and in taif in Saudi Arabia,"},{"start":127.68,"end":133.16,"text":"they're hoping that UNESCO intangible cultural heritage\nstatus will protect their ways of life."},{"start":134.06,"end":140.22,"text":"Taif roses produce a unique rose oil, which is in high\ndemand for use in luxury perfumes."},{"start":141.3,"end":145.57999999999998,"text":"Families in taif have farmed roses for more than 240\nyears."},{"start":146.42000000000002,"end":151.44,"text":"The taif rose is adapted to the specific soil and\nweather conditions here."},{"start":151.88,"end":155.4,"text":"Attempts to grow it elsewhere have been unsuccessful."},{"start":156.46,"end":158.64,"text":"From planting to extracting the oil,"},{"start":159.12,"end":162.57999999999998,"text":"every step of the process requires skill and knowledge."},{"start":164.18,"end":167.54,"text":"This has traditionally been taught by elders over many\nyears."},{"start":169.06,"end":178.82,"text":"In grass, a volcanic landscape and the Mediterranean\nclimate provide the perfect conditions for growing a\nvariety of flowers used in perfumes."},{"start":179.6,"end":183.32,"text":"But traditional skills were in danger of being\nforgotten."},{"start":184.12,"end":189.34,"text":"For example, how to create new plants by cutting pieces\nfrom the older bushes,"},{"start":189.72,"end":192.2,"text":"which grow so well in these specific fields."},{"start":193.5,"end":200.84,"text":"Today, a wide variety of skills relating to roles in\nthe perfume industry in grass are listed with UNESCO."},{"start":201.78,"end":206.98,"text":"This means that the French government will take an\nactive role in ensuring their future."},{"start":206.98,"end":215.32,"text":"Efforts to preserve the practices in these regions may\nnot succeed if climate change continues to worsen."},{"start":216.04,"end":225.38,"text":"All perfume growing regions rely on their climate for\nsuccessful harvests, but they are experiencing\nincreasingly unpredictable seasonal weather."},{"start":226.36,"end":234.72,"text":"Conservation on a global scale will be needed if their\nunique products are to be available to future\ngenerations of perfumers."}],"launchInline":true}},{"id":"B05-RW-U01-classroom:material:RW-M03","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[20],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.","sourcePage":20},{"body":"2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.","sourcePage":20},{"body":"3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.","sourcePage":20},{"body":"4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?","sourcePage":20},{"body":"5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.","sourcePage":20},{"body":"6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","sourcePage":20}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U01-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":20,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png","width":772,"height":1040}],"source":20,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.","sourcePage":20},{"body":"2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.","sourcePage":20},{"body":"3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.","sourcePage":20},{"body":"4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?","sourcePage":20},{"body":"5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.","sourcePage":20},{"body":"6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","sourcePage":20}],"text":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.\n2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.\n3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.\n4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?\n5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.\n6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9dfef8cb9e58f866b9ed6b03573cbd91278f204971f7af6b149d49637e1226c.mp3"},"original":{"id":"B05-RW-U01-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U01","book":5,"track":"RW","unit":1,"title":"READING 1","kind":"material","pages":[20],"sourceImages":[{"page":20,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d9b9b772e7831d2e713c2fac6b493509cbf3ce5badca6d7ccb41131ce1d52f9.png","viewEvidenceReported":true}],"text":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with the date 1998, your great-grandfather's name, and the words 'all overseas bank accounts'.\n2 If these stories were really to happen, the people who found these items would be very excited – at least at first. Their excitement would be quickly followed by frustration because it would be difficult for them to retrieve the information on the disks and tapes. Even if the records were still in good condition, it would be hard to find a device that could read them. Compare these discoveries to one that might have occurred around the turn of the twentieth century: a box of old letters and photographs on a high shelf at the back of a cupboard. The information these items contain would be immediately accessible because you would only need your eyes.\n3 Computers and digital technology have vastly expanded our capacity to store all kinds of information, but how long will our access to this stored information last? In fact, the people who found the disks and tapes in our scenarios would be lucky because disks and tapes are physically real. Although those technologies are long out of date, it's information on the web that is much more vulnerable; it is completely digital and can disappear in a flash. This is a problem that began to worry technology experts in the early twenty-first century. They became concerned that, without better ways of preserving information, future generations might look back on our times as the 'digital dark ages'. If current practice continues, future generations may not have access to the digital record of our lives and our world.\n4 Vint Cerf, a vice president at Google, argues that this could happen if we do not quickly take steps to address the issue. He uses the term 'bit rot' to describe how our digital records may slowly but surely become inaccessible. In our scenarios, for example, it is not the longevity of the records themselves that is the concern; it is that we may no longer have compatible devices, such as video cassette and CD players, to access them. Most software and apps that were used to create documents and websites ten or twenty years ago are already out of date, and in another sixty years they may not even be available. The problem is particularly challenging with interactive apps and websites. We can read letters from long ago, but will we be able to read an X feed or access a Snapchat exchange a hundred years from now?\n5 This problem has prompted technology experts like computer scientist Mahadev Satyanarayanan of Carnegie Mellon University to take action. He has found a way to store everything that is needed to interpret a record – the record itself, as well as the original operating system and the application it used – all together in the cloud. Using his state-of-the-art approach, Satyanarayanan has been able to recover and preserve digital records that might otherwise have been lost forever.\n6 Both Cerf and Satyanarayanan stress the importance of deliberate preservation. In the past, you could throw your old photos into a box without having to decide what to save and what to throw away. With digital records, however, you need to make an active decision about what to keep. Satyanarayanan says it is likely that important records – government documents, big news stories, etc. – will be transferred to new forms of storage technology as they emerge. It is the records of everyday life, the ones we do not yet know the value of, that may disappear into the digital dark ages.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8211"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f9dfef8cb9e58f866b9ed6b03573cbd91278f204971f7af6b149d49637e1226c.mp3","continueOnPage":true}},{"id":"B05-RW-U01-classroom:resource:b8226","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/608d306305d1089f8e6a40f6cff1e798f191b762291317e0b195ac5532b412e0.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["demolition (n) destruction\nvibrant (adj) lively and energetic\naffluent (adj) rich\nadaptive (adj) having the ability to change when conditions change","anonymous (adj) having no unusual or interesting features\nirreversible (adj) impossible to change back\nrenovation (n) the repair of a building to bring it into good condition\nopted for (v) chose"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U01-classroom:material:RW-M04","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[24],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.","sourcePage":24},{"body":"2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.","sourcePage":24},{"body":"3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.","sourcePage":24},{"body":"4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.","sourcePage":24},{"body":"5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.","sourcePage":24},{"body":"6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","sourcePage":24}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U01-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Preserving our heritage¹","pages":[{"page":24,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png","width":772,"height":1040}],"source":24,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.","sourcePage":24},{"body":"2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.","sourcePage":24},{"body":"3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.","sourcePage":24},{"body":"4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.","sourcePage":24},{"body":"5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.","sourcePage":24},{"body":"6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","sourcePage":24}],"text":"# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.\n2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.\n3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.\n4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.\n5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.\n6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3356997114d54decfab4dfebe89fcc1fdad407ef01ee424d6400e6ab1145a0ae.mp3"},"original":{"id":"B05-RW-U01-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U01","book":5,"track":"RW","unit":1,"title":"READING 2","kind":"material","pages":[24],"sourceImages":[{"page":24,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png","viewEvidenceReported":true}],"text":"# Preserving our heritage¹\n\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.\n\n2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.\n\n3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.\n\n4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.\n\n5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.\n\n6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8228"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3356997114d54decfab4dfebe89fcc1fdad407ef01ee424d6400e6ab1145a0ae.mp3","continueOnPage":true}},{"id":"B05-RW-U01-classroom:review-1","book":5,"unit":1,"track":"RW","topic":"CONSERVATION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[37],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/17bc243509d50d48fc9fc1f5f7e2b40639b86c779f75edc30b98a5c53f850b46.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-RW-U01-B-004","form":"compatible","page":37},{"id":"B05-RW-U01-B-006","form":"energy-efficient","page":37},{"id":"B05-RW-U01-B-007","form":"fast-growing","page":37},{"id":"B05-RW-U01-B-009","form":"longevity","page":37},{"id":"B05-RW-U01-B-010","form":"long-term","page":37},{"id":"B05-RW-U01-B-011","f nswer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U01-classroom:material:RW-M03":[{"body":"1 Imagine these scenarios: (1) 2040: A box of memorabilia, including floppy disks and VHS tapes', is found in the attic of an old house with a label that says, 'Records and early videos of Bill Gates (1975–1985)'. (2) 2050: You find an envelope labelled 'bank records' in your grandmother's desk. Inside the envelope, there is an old CD marked with -RW-U01-question:b8213":{"rows":{"b8213.i01":{"mode":"choice","option":2},"b8213.i02":{"mode":"line","answer":"If current practice continues, future generations may not have access to the digital record of our lives and our world."}},"basis":"教材第 21 页与教师书 PDF 第 24 页。作者观点与原文主张对应。","itemPatches":{"b8213.i02":{"options":[]}},"rewriteKey":""},"B05-RW-U01-question:b8231":{"rows":{"b8231.i01":{"mode":"mark","selected":true},"b8231.i03":{"mode":"mark","selected":true},"b8231.i04":{"mode":"mark","selected":true}},"basis":"教材第 25 页与教师书 PDF 第 25 页。按教师书在 Preserving our heritage 的原文窗标明三条主旨的对应依据。先点核对，再打开材料即可查看。","materials":[{"id":"B05-RW-U01-classroom:material:RW-M04","title":"READING 2","text":"# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.\n2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.\n3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.\n4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.\n5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.\n6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered.","screens":["# Preserving our heritage¹\n1 Everywhere I look, there are new buildings under construction. The neighbourhoods that I knew as a boy, filled with beautiful old buildings, have mostly disappeared, and in their place, anonymous, modem, high-rise buildings have appeared. If we continue in this way, nothing will remain of our heritage; soon I will no longer recognize my city. What is left of the city's traditional buildings and neighbourhoods must be preserved and it is imperative that this process begins now.","2 Historic preservation has become popular all over the world in recent years, but many countries around the world have opted for demolition and new construction over preservation. There is good reason for this; as the population has become more affluent, residents want all the conveniences of modern living. However, the built environment $^{2}$ should be more than shiny new buildings with air conditioning and washing machines; it should also reflect the beauty of our culture and heritage. How can our children understand and maintain their cultural identity if we erase so much of the physical evidence of it? Will they recognize a barjeel, the wind towers that once provided natural air conditioning for buildings all over the region? Will they understand the significance of mashrabiyas, the delicately carved wooden windows that provide a screen against the outside world? Not if they have all disappeared.","3 The arguments for preserving historic buildings are not simply about an emotional attachment to the past. There are also good economic arguments in favour of preservation. The renovation and preservation of historic districts can become an economic engine, drawing tourists and small businesses to the area. There are several good examples of this in the Middle East. In Dubai, the historic Al Bastikiya district draws thousands of tourists every year from all over the world. It also attracts local residents, eager to learn about their city's past. In Bahrain, the hundred-year-old Beit al Jasra was at one time the summer home of a sheikh³. It has been beautifully restored and is now a centre for traditional crafts, such as rug weaving and basket making. International visitors are not only interested in shopping centres; they also want to learn about our culture and traditions like these.","4 Al Bastikiya and Beit al Jasra are successful tourist attractions with exhibits, galleries and boutiques. Renovated for this purpose, they are not intended to be functioning communities for local residents. However, it is also possible to preserve old buildings and adapt them for reuse by the local community. In Bahrain, buildings in a historic district of the city of Muharraq have been restored, and today they are part of a vibrant neighbourhood of homes, small shops and businesses contributing to the nation's economy.","5 Some opponents of historic preservation have argued that it is too expensive, but many recent projects all over the world have demonstrated that this is not necessarily the case. In fact, renovation of an existing structure for adaptive reuse can cost about £40 per square metre less than even the most basic new construction, while preserving the beauty of the original building. And, although it is often claimed that old buildings have a more significant environmental footprint $^{4}$ than new construction because they aren't very energy efficient, architects and environmental experts maintain that the greenest building is the one that is already built. New construction almost always has a more serious environmental impact because it requires the use of all-new materials that must be transported, often over long distances, instead of recycled materials that are already on site. We recycle so many other things. We can and should recycle buildings, too.","6 Historic preservation is an option that opens many possibilities; demolition, in contrast, is irreversible. Once these treasures are lost, they are lost forever, an important link in our heritage that can never be recovered."],"sources":[{"page":24,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png","width":772,"height":1040}],"kind":"reading","markScreens":[[{"start":268,"end":331,"underline":true}],[],[{"start":108,"end":173,"underline":true},{"start":174,"end":309,"underline":true}],[],[{"start":190,"end":327,"underline":true}],[]]},{"id":"B05-RW-U01-material:B05-RW-U01:p24:PreservingHeritage","title":"第24页 Preserving our heritage 文章","pages":[24],"text":"","screens":[],"sources":[{"page":24,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3f43551886ae2ba183caf9628c2b4e6731c057ebdf2ebfba2efd34d31c96fb0c.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]}],"itemPatches":{"b8231.i01":{"options":[]},"b8231.i03":{"options":[]},"b8231.i04":{"options":[]}},"rewriteKey":""},"B05-RW-U01-question:b8249":{"rows":{},"basis":"教材第 28 页与教师书 PDF 第 26 页。保留三列原顺序，A 与 B 的搭配显示在 A 词旁，完整形容词写回 C 列名词前。","displayPages":[[{"kind":"table","rows":[[{"text":"Column
