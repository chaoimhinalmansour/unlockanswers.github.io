evice in the second photo. Does this seem unusual to you? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think the video will discuss astronomy.\nThere are pictures of the earth from\nspace and some technology which I\nthink might be related to telescopes.\n2 This might be a part of a device for a\nspace telescope.\n3 This is a telescope on Earth. It is quite\nlarge so this is isn’t the kind of thing that\nyou would normally find in a school.\n4 The students in the picture seem quite\nyoung but they might go to a specialist\nscience and technology university.\nStudents are often involved in high-level\nresearch and development projects.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[{"page":38,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f56f776bf16274da750f85c8f4672f5b40da483fb422d7c30dbbe7f6306bbae9.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5855","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Write T (true) or F (false) next to the statements below. Then compare your answers with a partner.","pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f6eadc96491f9d2bad49efc23625e4699b5823781a772a37945d5d636b3a183.png"],"provided":"","items":[{"id":"b5855.i01","label":"1","prompt":"The students at the Simon Langton School conduct experiments similar to those of professional scientists.","options":["T (true)","F (false)"],"type":"choice/closed"},{"id":"b5855.i02","label":"2","prompt":"The Simon Langton School Science curriculum closely follows the government's recommendations.","options":["T (true)","F (false)"],"type":"choice/closed"},{"id":"b5855.i03","label":"3","prompt":"The students' work is designed to help them to pass their exams.","options":["T (true)","F (false)"],"type":"choice/closed"},{"id":"b5855.i04","label":"4","prompt":"Langton students are conducting advanced research in physics and health science.","options":["T (true)","F (false)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5855.i01","label":"1","prompt":"The students at the Simon Langton School conduct experiments similar to those of professional scientists.","options":["T (true)","F (false)"],"type":"choice/closed"},{"kind":"item","id":"b5855.i02","label":"2","prompt":"The Simon Langton School Science curriculum closely follows the government's recommendations.","options":["T (true)","F (false)"],"type":"choice/closed"},{"kind":"item","id":"b5855.i03","label":"3","prompt":"The students' work is designed to help them to pass their exams.","options":["T (true)","F (false)"],"type":"choice/closed"}],[{"kind":"item","id":"b5855.i04","label":"4","prompt":"Langton students are conducting advanced research in physics and health science.","options":["T (true)","F (false)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/144dac23dd2c0f1958a6f013-L4LS-U02.mp4","captions":[{"start":0,"end":6.48,"text":"In the south -east corner of England, near the famous\ncity of Canterbury, is the Simon Langton School."},{"start":7.12,"end":8.02,"text":"It is certainly"},{"start":8.02,"end":8.56,"text":"no"},{"start":8.56,"end":9.76,"text":"ordinary school."},{"start":10.76,"end":18.64,"text":"The research conducted by science students at the\nschool ranks up there with work done by scientists at\nNASA and at CERN,"},{"start":18.98,"end":22.8,"text":"the International Atomic Physics Research Facility in\nSwitzerland."},{"start":23.7,"end":36.12,"text":"For more than ten years now, the school has ignored the\nofficial government science curriculum and engaged\nstudents in real research projects that have drawn the\nattention of the scientific world."},{"start":37.24,"end":40.76,"text":"Fifty per cent of the school's students go on to STEM\nsubjects,"},{"start":41.16,"end":45.54,"text":"that's science, technology, engineering and maths, at\nuniversity."},{"start":46.36,"end":50.66,"text":"Probably their most well -known effort is a physics and\nastronomy project."},{"start":51.42,"end":53.98,"text":"Following a visit to CERN in 2007,"},{"start":54.56,"end":58.54,"text":"Langton students designed a device that could detect\nradiation in space."},{"start":59.22,"end":61.54,"text":"One of the students describes the project."},{"start":61.82,"end":65.48,"text":"Our data is very relevant to NASA because cosmic rays'"},{"start":66,"end":76.28,"text":"effects on electronics and technology can cause\ncorruption of data and things in satellites, but also\nthere's aspects to do with astronaut safety."},{"start":76.58,"end":87.52,"text":"Dr Becky Parker, head of physics at Langton, thinks\nthat the study of space can inspire young students and\nget them excited about a wide range of scientific\nresearch."},{"start":88.02,"end":92.75999999999999,"text":"She told us that the students are doing fundamental\nresearch while they're at school."},{"start":93.14,"end":96.2,"text":"Instead of students just learning to pass the exam,"},{"start":96.6,"end":99.53999999999999,"text":"she believes that they should be contributing to\nscience,"},{"start":99.96000000000001,"end":102.47999999999999,"text":"doing science and living science."},{"start":103.1,"end":105.9,"text":"This is a new approach to science education."},{"start":106.97999999999999,"end":110.3,"text":"And Langton science students are not just studying\nphysics,"},{"start":110.84,"end":114.88,"text":"they are also doing ground -breaking research in the\nhealth sciences,"},{"start":115.36,"end":122.2,"text":"with one project looking at the structure of a protein\nthat plays a role in the degenerative nerve disease MS."},{"start":123.1,"end":127.58,"text":"They may be the only school with a licence to modify\nthe human genome,"},{"start":127.94,"end":130.04,"text":"the complete set of human DNA."},{"start":131.24,"end":134.9,"text":"The students are aware of how unusual this experience\nis."},{"start":134.9,"end":143.72,"text":"You look at new drugs and they're always manufactured\nby pharmaceutical companies and you look at new\nproducts and they're always done by big corporations,\nbut this is just a school."},{"start":143.92000000000002,"end":146.16,"text":"Tom Zeisen of the Wellcome Trust,"},{"start":146.48,"end":148.56,"text":"which helps fund some of these projects,"},{"start":149.1,"end":152.22,"text":"describes the Langton science curriculum in this way."},{"start":152.57999999999998,"end":156.98,"text":"I think that Langton is inspiring for what they're\ndoing because they're absolutely phenomenal."},{"start":157.12,"end":164.44,"text":"They're doing not just real experiments, but they're\ndoing real experiments into things that nobody knows\nthe answer to and that's"},{"start":165.04,"end":166.32,"text":"fairly unheard of in schools."},{"start":166.42000000000002,"end":168.36,"text":"I've never heard of another school doing something like\nthat."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 T 2 F; The school ignores the official government\nscience curriculum.\n3 F; Instead of just learning to pass the exam, the students\ncontribute to do and live science.\n4 T","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":29,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5856","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again and match the speakers (1–4) to the ideas below (a–d).","pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f6eadc96491f9d2bad49efc23625e4699b5823781a772a37945d5d636b3a183.png"],"provided":"","items":[{"id":"b5856.i01","label":"1","prompt":"Tom Stevenson, former student at the Simon Langton School","options":["Experience, and not exams, is a better way to learn science.","The curriculum at Langton is the only one of its kind.","The work I did at school can help protect astronauts.","It's a chance for us to work on these real-world problems."],"type":"choice/closed"},{"id":"b5856.i02","label":"2","prompt":"Becky Parker, Head of Physics at the Simon Langton School","options":["Experience, and not exams, is a better way to learn science.","The curriculum at Langton is the only one of its kind.","The work I di t":"Tom Zeisen of the Wellcome Trust,"},{"start":146.48,"end":148.56,"text":"which helps fund some of these projects,"},{"start":149.1,"end":152.22,"text":"describes the Langton science curriculum in this way."},{"start":152.57999999999998,"end":156.98,"text":"I think that Langton is inspiring for what they're\ndoing because they're absolutely phenomenal."},{"start":157.12,"end":164.44,"text":"They're doing not just real experiments, but they're\ndoing real experiments into things that nobody knows\nthe answer to and that's"},{"start":165.04,"end":166.32,"text":"fairly unheard of in schools."},{"start":166.42000000000002,"end":168.36,"text":"I've never heard of another school doing something like\nthat."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 c 2 a 3 d 4 b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":29,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5858","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner and answer the questions.","pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f6eadc96491f9d2bad49efc23625e4699b5823781a772a37945d5d636b3a183.png"],"provided":"","items":[{"id":"b5858.i01","label":"1","prompt":"Is the Science curriculum in your country similar to the Simon Langton School curriculum? Describe similarities and differences.","options":[],"type":"discuss/open"},{"id":"b5858.i02","label":"2","prompt":"If you could choose, would you like to study a curriculum like Langton's? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5858.i01","label":"1","prompt":"Is the Science curriculum in your country similar to the Simon Langton School curriculum? Describe similarities and differences.","options":[],"type":"discuss/open"},{"kind":"item","id":"b5858.i02","label":"2","prompt":"If you could choose, would you like to study a curriculum like Langton's? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I’m not sure of all the details of the\nSimon Langton School’s curriculum, but\nin my country, we also study subjects\nlike biology, chemistry, and physics. One\ndifference might be the focus — Simon\nLangton might have more advanced\nor specialized programs, especially in\nresearch, while here, science is usually\ntaught more generally.\n2 Yes, I think I would like to study a\ncurriculum like Langton’s if it offers more\nhands-on research and advanced topics.\nIt would be exciting to get involved in\nscience projects early on. However, it\nmight be more challenging, so I’d need\nto be ready for that. / No, I wouldn’t\nlike to study a curriculum like Langton’s\nbecause it seems more intense and\nresearch-focused, and I prefer a more\nbalanced approach with less pressure.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70 ","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5878","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"order":15,"module":"LISTENING 1","ex":"9","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner and discuss the questions.","pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/988ce6cbb3c5303b20e172690656809adc2f1050a25ab007340b80a26c3cb124.png"],"provided":"1 Do your views on participating in societies and activities at university differ from Lara's. Why / Why not?\n2 Which advice from Lara do you think was most useful? What other advice would you add?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Do your views on participating in societies and activities at university differ from Lara's. Why / Why not?"},{"kind":"text","text":"2 Which advice from Lara do you think was most useful? What other advice would you add?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Personally, I think going to university\nisn’t just about studying and doing\nexams. It’s a chance to try out new\nexperiences, meet new people and\nacquire new skills. Doing extra activities\nand joining clubs is an important part of\nthat.  / I agree with Lara. It’s important to\nmake the most of your time at university,\nand to remember the main reason you’re\nthere – to get a useful qualification.\n2 I think the advice about researching a\nuniversity’s mission statement was useful.\nIt’s not something I’d thought about\nbefore, but I think most institutions do\nhave them. I would also add something\nabout the importance of speaking to\nother people, older than you, who have\nalready been through the experience of\napplying to university. They can tell you\nwhat they did right, and what they wish\nthey’d known at the time.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5879","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"order":16,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Imagine that a friend or relative is considering applying for university in one of the countries mentioned in Listening 1. Write your friend/relative a short email summarizing your advice on how to do this effectively. Use advice that Lara gave, as well as your own ideas. Write around 200 words.","pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/988ce6cbb3c5303b20e172690656809adc2f1050a25ab007340b80a26c3cb124.png"],"provided":"","items":[{"id":"b5879.i01","label":"1","prompt":"Write a short email of around 200 words summarizing advice on applying for university effectively, using advice from Lara and your own ideas.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5879.i01","label":"1","prompt":"Write a short email of around 200 words summarizing advice on applying for university effectively, using advice from Lara and your own ideas.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Hi Sara,\nI’ve just heard an interesting podcast about\napplying to universities. I know that you’re\nthinking of studying in the UK one day, so\nmaybe some of this will be useful to you.\nFirstly, you won’t be alone in the UK!\nHundreds of thousands of international\nstudents go to British universities every\nyear. Have you done any research into the\nUCAS system? This is a centralized system,\nwhere you can apply for up to five degree\ncourses at the same time.\nIf I were you, I’d check out which\nuniversities do the degree course you’re\ninterested in. Then, maybe make a list of\nyour top five university choices. Make sure\nthey’re in places that you wouldn’t mind\nliving in (I know you like big cities!). Then,\nwhen you’ve got particular universities in\nmind, you might want to check whether or\nnot they have a mission statement. That\nway, you can make your application fit\nthose universities’ core values.\nHave you got a teacher in mind who you\ncan ask to give you a reference? It might\nbe worth thinking about a teacher who\nknows you well enough to give you a really\ngood one.\nLet me know if you want me to send you\nthe link to the podcast!\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5882","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Complete the sentences with the future continuous form of the verb in brackets. Use will or be going to as noted.","pages":[44],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a2c470fd2d53f743c6f6af2ccbfb2bf1236f1d4d66004d240eacaeb49ba632c6.png"],"provided":"","items":[{"id":"b5882.i01","label":"1","prompt":"I believe more women ____ Engineering in the coming years. (will / study)","options":[],"type":"gap/open"},{"id":"b5882.i02","label":"2","prompt":"I ____ some volunteering work in the summer to help with my university application. (be going to / do)","options":[],"type":"gap/open"},{"id":"b5882.i03","label":"3","prompt":"____ the careers fair next week? (will / you / visit)","options":[],"type":"gap/open"},{"id":"b5882.i04","label":"4","prompt":"Zahra ____ an academic writing course before she moves to Canada. (will / take)","options":[],"type":"gap/open"},{"id":"b5882.i05","label":"5","prompt":"If you ____ a university open day, you must inform your class teachers in advance. (be going to / attend)","options":[],"type":"gap/open"},{"id":"b5882.i06","label":"6","prompt":"____ a university this year? (Martin / be going to / choose)","options":[],"type":"gap/open"},{"id":"b5882.i07","label":"7","prompt":"John is starting an internship at a local firm soon. He ____ from Monday to Friday (be going to / work)","options":[],"type":"gap/open"}],"layout" "item","id":"b5893.i06","label":"6","prompt":"Most jobs with high salaries involve making very ____, demanding decisions on a daily basis.","options":[],"type":"gap/closed"},{"kind":"item","id":"b5893.i07","label":"7","prompt":"There is no such thing nowadays as a ____ job, a job that would last for several years or even an entire lifetime.","options":[],"type":"gap/closed"},{"kind":"item","id":"b5893.i08","label":"8","prompt":"I'd prefer to learn something ____, like how to do or make something, rather than something theoretical like philosophy.","options":[],"type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5894","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":23,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a conversation between Adam, a student who is interested in a career in medicine, and a medical student. Before you listen, read Adam's notes and discuss the questions with a partner. Give reasons for your answers.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/626d3b74d41d97c9dc62c6ffed6565b6b707a8cdf191ea7f042f140529aa261d.png"],"provided":"## Medical Jobs\nEmergency medical technician (EMT)\nWorks independently on an ambulance. Helps people in emergency situations, assessing a patient's condition and performing emergency medical procedures before they get to hospital. Must be self-confident. Requires excellent driving skills.\nAccident and Emergency (A&E) nurse\nWorks in the Accident and Emergency, or A&E, department of a hospital, dealing with patients as they arrive. Must have a high-level understanding of the human body and medicines and be able to assess patients quickly and correctly.\n## Which job do you think ...","items":[{"id":"b5894.i01","label":"1","prompt":"requires closer work with hospital staff?","options":[],"type":"discuss/open"},{"id":"b5894.i02","label":"2","prompt":"is more complex, requiring more technical knowledge?","options":[],"type":"discuss/open"},{"id":"b5894.i03","label":"3","prompt":"requires you to be sure of yourself and your abilities?","options":[],"type":"discuss/open"},{"id":"b5894.i04","label":"4","prompt":"requires more training?","options":[],"type":"discuss/open"},{"id":"b5894.i05","label":"5","prompt":"is more rewarding?","options":[],"type":"discuss/open"},{"id":"b5894.i06","label":"6","prompt":"is more secure?","options":[],"type":"discuss/open"},{"id":"b5894.i07","label":"7","prompt":"requires you to have more practical skills?","options":[],"type":"discuss/open"},{"id":"b5894.i08","label":"8","prompt":"is more physically demanding?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## Medical Jobs"},{"kind":"text","text":"Emergency medical technician (EMT)"},{"kind":"text","text":"Works independently on an ambulance. Helps people in emergency situations, assessing a patient's condition and performing emergency medical procedures before they get to hospital. Must be self-confident. Requires excellent driving skills."},{"kind":"text","text":"Accident and Emergency (A&E) nurse"},{"kind":"text","text":"Works in the Accident and Emergency, or A&E, department of a hospital, dealing with patients as they arrive. Must have a high-level understanding of the human body and medicines and be able to assess patients quickly and correctly."}],[{"kind":"text","text":"## Which job do you think ..."},{"kind":"item","id":"b5894.i01","label":"1","prompt":"requires closer work with hospital staff?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5894.i02","label":"2","prompt":"is more complex, requiring more technical knowledge?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5894.i03","label":"3","prompt":"requires you to be sure of yourself and your abilities?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5894.i04","label":"4","prompt":"requires more training?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5894.i05","label":"5","prompt":"is more rewarding?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5894.i06","label":"6","prompt":"is more secure?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b5894.i07","label":"7","prompt":"requires you to have more practical skills?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5894.i08","label":"8","prompt":"is more physically demanding?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The A&E Nurse – this person spends all\ntheir time in the hospital.\n2 The A&E Nurse – this person needs a\nhigh-level understanding of the human\nbody and medicines.\n3 Both jobs are possible answers. Both\nhave to react quickly to patients, in\npossible emergencies, but the EMT has\nto be able to work independently.\n4 The A&E Nurse – this person needs a\nhigh-level understanding of the human\nbody and medicines.\n5 Both jobs are possible answers. Both\ninvolve helping people urgently, and\nhopefully saving lives.\n6 Possibly the A&E Nurse. This person\nneeds more training, so would be harder\nto replace.\n7 The EMT. This person needs to be\nable to drive, as well as to directly\nhelp people.\n8 The EMT. This person needs to be\nable to drive and move around in\ndifferent locations, as well as perform\nmedical procedures.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5897","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":24,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"2.4 Listen to the conversation between Adam and the medical student. Write notes about the pros and cons for each job. Then compare your notes with a partner.","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b811be736c39fe29c7c28f5cf4f89fdd445a67c914f89371be172fdb8311f54.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>emergency medical technician (EMT)\u003c/td>\u003ctd>A&amp;E (Accident and Emergen ","lesson":2,"order":29,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use your notes from Listening 1 and Listening 2 to discuss the questions.","pages":[49],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/67a54decddf3b2075d3516c95bc8106b8c1a994002945570cbf94fb33199b020.png"],"provided":"1 How will/did you make your final decision about which course to study?\n2 How important is it to study a course that directly prepares you for the career you want to have when you finish? Why?\n3 What kind of career do you think you would like to have in the future? Who or what could help you reach this goal?","items":[{"id":"b5906.i01","label":"1","prompt":"How will/did you make your final decision about which course to study?","options":[],"type":"discuss/open"},{"id":"b5906.i02","label":"2","prompt":"How important is it to study a course that directly prepares you for the career you want to have when you finish? Why?","options":[],"type":"discuss/open"},{"id":"b5906.i03","label":"3","prompt":"What kind of career do you think you would like to have in the future? Who or what could help you reach this goal?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U02-question:b5868","kind":"student-work","title":"LISTENING 1 Ex 5","pages":[42]},{"id":"B04-LS-U02-question:b5897","kind":"student-work","title":"LISTENING 2 Ex 3","pages":[48]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 How will/did you make your final decision about which course to study?"},{"kind":"text","text":"2 How important is it to study a course that directly prepares you for the career you want to have when you finish? Why?"},{"kind":"text","text":"3 What kind of career do you think you would like to have in the future? Who or what could help you reach this goal?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I made my decision based on the type\nof course I wanted to do. The university\nI attended was the one with the best\nreputation for the subject, and also\nhad some well-known teachers. / I\nthink my final decision will be based\non which course offers the best career\nopportunities and the best value for\nmoney. Location is also important\nbecause I want to stay close to my family.\n2 It depends on what career you want. If\nyou want to go into medicine or law,\nthen obviously it’s important to study\nsomething directly related to that. If\nyou are still unsure about the career you\nwant, as many young people are, then\njust doing a course that teaches you\nresearch skills or critical-thinking skills\ncan also be useful.\n3 I would like to go into journalism. There\nare some good journalism schools in my\ncountry, and I would like to attend one.\nBut getting practical experience would\nalso be useful, which is why I’m hoping to\nwork as an intern on a local newspaper.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5911","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":30,"module":"CRITICAL THINKI  Hong Kong.\n\nA committee of current students and academics evaluates the applications, interviews candidates and decides who will receive the scholarship.\n\nRequirements:\n- Applicants must be accepted to a course of study at a Hong Kong university.\n- Applicants should show that their work after finishing the course will contribute to society.\n- Applicants must apply in writing to the Mah Foundation.\n- If chosen, applicants must participate in an interview by phone or video.\n\nThe final selection is made based on a student's grades and test scores, the quality of the written application and the student's financial need.\n\n____ a must be studying a course that contributes to society\n____ b must include a good written application\n____ c must have a good interview\n____ d must have good grades and test scores\n____ e must be in financial need","items":[{"id":"b5914.i01","label":"a","prompt":"must be studying a course that contributes to society","options":[],"type":"discuss/open"},{"id":"b5914.i02","label":"b","prompt":"must include a good written application","options":[],"type":"discuss/open"},{"id":"b5914.i03","label":"c","prompt":"must have a good interview","options":[],"type":"discuss/open"},{"id":"b5914.i04","label":"d","prompt":"must have good grades and test scores","options":[],"type":"discuss/open"},{"id":"b5914.i05","label":"e","prompt":"must be in financial need","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Scholarships"},{"kind":"text","text":"Information"},{"kind":"text","text":"Application forms"},{"kind":"text","text":"Application process"},{"kind":"text","text":"FAQs"},{"kind":"text","text":"Jobs"},{"kind":"text","text":"Contact us"}],[{"kind":"text","text":"The Mah Scholarship was started by Hong Kong billionaire Mah-Tak Hung, the successful businessperson behind the Mah Foundation. The Mah Scholarship pays the fees and expenses each year for one student, of any nationality, who wants to study in Hong Kong."},{"kind":"text","text":"A committee of current students and academics evaluates the applications, interviews candidates and decides who will receive the scholarship."},{"kind":"text","text":"Requirements:"},{"kind":"text","text":"- Applicants must be accepted to a course of study at a Hong Kong university."},{"kind":"text","text":"- Applicants should show that their work after finishing the course will contribute to society."}],[{"kind":"text","text":"- Applicants must apply in writing to the Mah Foundation."},{"kind":"text","text":"- If chosen, applicants must participate in an interview by phone or video."},{"kind":"text","text":"The final selection is made based on a student's grades and test scores, the quality of the written application and the student's financial need."},{"kind":"text","text":"____ a must be studying a course that contributes to society"},{"kind":"text","text":"____ b must include a good written application"},{"kind":"text","text":"____ c must have a good interview"}],[{"kind":"text","text":"____ d must have good grades and test scores"},{"kind":"text","text":"____ e must be in financial need"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":32,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5915","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"4","co osed"},{"kind":"item","id":"b5924.i09","label":"9","prompt":"____ I take your point, and I'd probably go even further.","options":["A (agreeing)","D (disagreeing)"],"type":"choice/closed"}],[{"kind":"item","id":"b5924.i10","label":"10","prompt":"____ There's no way anybody could really think that.","options":["A (agreeing)","D (disagreeing)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 D 2 A 3 A 4 D 5 D 6 D 7 A 8 D 9 A 10 D\nSentences 5 and 10 are too direct. Suggested changes:\n5 I’m not sure you’re completely right about that.\n10 I wonder if most people would agree with that.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":33,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5925","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":38,"module":"PREPARATION FOR SPEAKING","ex":"4","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"AGREEING AND DISAGREEING RESPECTFULLY"},"instruction":"Work with a partner. Read the questions and think about possible answers. Then discuss the questions together. Share your opinions and make suggestions, remembering to agree or disagree respectfully.","pages":[54],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/05cfeded996bdac933a815a2ddb2db17a7305cdcf0a50a881c1b54dfe113dad7.png"],"provided":"","items":[{"id":"b5925.i01","label":"1","prompt":"Which will be the most important world languages in the future, and which ones should we be learning?","options":[],"type":"discuss/open"},{"id":"b5925.i02","label":"2","prompt":"What are the most useful skills to learn at college, besides the subject you are studying?","options":[],"type":"discuss/open"},{"id":"b5925.i03","label":"3","prompt":"What are the most important professions in society?","options":[],"type":"discuss/open"},{"id":"b5925.i04","label":"4","prompt":"What does being a good teacher involve, and can anybody become one?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5925.i01","label":"1","prompt":"Which will be the most important world languages in the future, and which ones should we be learning?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5925.i02","label":"2","prompt":"What are the most useful skills to learn at college, besides the subject you are studying?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5925.i03","label":"3","prompt":"What are the most important professions in society?","options":[],"type":"discuss/open"},{"kind":"item","id":"b5925.i04","label":"4","prompt":"What does being a good teacher involve, and can anybody become one?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Chinese, Spanish, Arabic and English are\nall likely to be important in the future.\nIt’s likely that English will remain an\nimportant language which people of all\nnationalities can use to communicate\nwith each other.\n2 Other skills may include developing\nthe skill of critical thinking, learning\nto present information effectively,\nlearning to argue convincingly, how\nto collect data and different ways of\nanalyzing data. Learning to work in\nteams and value and respect other\npeople’s opinions is also important.\n3 Teachers, care workers and medical staff\nare important, if not always highly paid,\nprofessions.\n4 Being a good teacher involves being\nable to motivate, encourage and\nprepare students. Knowing a subject\nwell is often not enough. It’s also\nimportant to know how to get that\ninformation across to students in a way\nthey can understand.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5928","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":39,"module":"PREPARATION FOR SPEAKING","ex":"5","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"COMPROMISING AND FINALIZING A DECISION"},"instruction":"Choose the best options to complete the sentences.","pages":[55],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/638db1fe074c6a71ae1a4ef3dc2a0f350479874443057cfafde43d9eeff4f5fb.png"],"provided":"","items":[{"id":"b5928.i01","label":"1","prompt":"That sounds perfectly ____ to me.","options":["reasonable","well"],"type":"choice/closed"},{"id":"b5928.i02","label":"2","prompt":"OK, I don't think I can argue ____ you there.","options":["against","over"],"type":"choice/closed"},{"id":"b5928.i03","label":"3","prompt":"I take your point, even though I'm not sure I ____ agree with you.","options":["totally","mainly"],"type":"choice/closed"},{"id":"b5928.i04","label":"4","prompt":"I think we'll have to ____ to disagree about that.","options":["agree","ar ection on page 52. Plan five sentences that you might be able to use during a discussion to express your ideas about which candidate should receive the scholarship. Think of language you can use to give opinions or make suggestions.","pages":[56],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2187c93d030584e1dc9eb960a393ec6743410044ed37f638eec455e75abc785b.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U02-question:b5916","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[52]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U02-publisher-page:p052","title":"原题或核对备注所引第52页","pages":[52],"text":"","screens":[],"sources":[{"page":52,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/40c0054346f192d3fe3c4b029f3219d6084dc174f65c5ed9dc79c61416f05fb3.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A: Might I suggest that Yasmin is the best\nchoice for the scholarship because she\nhas the greatest financial need and she\nplans to study a subject which will make an\nimportant contribution to society.\nB: I’m not sure about that. Have you\nconsidered looking at the financial needs of\nthe other candidates?\nC: Why don’t we rank the candidates by\ntheir interview scores?\nA: I think we’ll have to agree to disagree on\nthe importance of interview scores.\nB: That sounds perfectly reasonable to\nme, but I’d probably go even further and\nsay that interview scores are the least\nimportant factor.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAda \nsay that the most important factor\nis the candidate’s test average?\n(expressing disagreement and offering\nanother opinion)\n2 Have you considered looking at\nThomas’s skills? (asking someone to\nthink about a different idea)\n3 I think we’ll have to agree to disagree\nthere. (expressing that there is no\ncompromise to be found)\n4 I think we’ve reached an agreement\nthat Thomas is the best candidate.\n(expressing that there is something that\neveryone can agree with)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U02-question:b5937","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"order":45,"module":"SPEAKING TASK","ex":"3","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Refer to the Task checklist below and prepare for your discussion.","pages":[56],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2187c93d030584e1dc9eb960a393ec6743410044ed37f638eec455e75abc785b.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Give your opinion on criteria and priorities.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compromise with your group.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Come to an agreement with your group.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Respectfully disagree and make suggestions.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"TASK CHECKLIST","header":false,"colspan":1,"rowspan":1}, ule":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[36],"sourcePages":[36],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5268102cf2d2712c8d527d11ff49a23fd6948b2c534776014e8f4df910aa1d80.png"],"sourceHashes":["5268102cf2d2712c8d527d11ff49a23fd6948b2c534776014e8f4df910aa1d80"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Speaking task","text":"Decide which candidate should receive a scholarship."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about a school where students work on real science."},{"label":"Listening skills","text":"Listen for advice and suggestions; make inferences."},{"label":"Critical thinking","text":"Prioritize criteria; use priorities to evaluate options."},{"label":"Grammar","text":"Use the future continuous; state preferences with would."},{"label":"Speaking skills","text":"Give an opinion and make suggestions; agree and disagree respectfully."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":36,"alt":""}}]}},{"id":"B04-LS-U02-classroom:resource:b5852","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[38],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f56f776bf16274da750f85c8f4672f5b40da483fb422d7c30dbbe7f6306bbae9.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"absolutely phenomenal","pos":"(adj phr)","definition":"completely amazing","example":"Her performance in the final was absolutely phenomenal.","wordAudio":"absolutely phenomenal","cardWord":false},{"term":"corruption of data","pos":"(n phr)","definition":"damage to or loss of information","example":"The power cut caused corruption of data on the server.","wordAudio":"corruption of data","cardWord":false},{"term":"ground-breaking","pos":"(adj)","definition":"based on completely new ideas","example":"The team announced a ground-breaking method for storing energy.","wordAudio":"ground-breaking","cardWord":false},{"term":"radiation","pos":"(n)","definition":"a form of energy that comes from a nuclear reaction and can be dangerous in large amounts","example":"The walls are designed to protect workers from radiation.","wordAudio":"radiation","cardWord":false},{"term":"research facility","pos":"(n phr)","definition":"a place where scientists work to make discoveries","example":"Scientists test the new materials at a research facility.","wordAudio":"research facility","cardWord":false}]]}},{"id":"B04-LS-U02-classroom:video","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f6eadc96491f9d2bad49efc23625e4699b5823781a772a37945d5d636b3a183.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/144dac23dd2c0f1958a6f013-L4LS-U02.mp4","captions":[{"start":0,"end":6.48,"text":"In the south -east corner of England, near the famous\ncity of Canterbury, is the Simon Langton School."},{"start":7.12,"end":8.02,"text":"It is certainly"},{"start":8.02,"end":8.56,"text":"no"},{"start":8.56,"end":9.76,"text":"ordinary school."},{"start":10.76,"end":18.64,"text":"The research conducted by science students at the\nschool ranks up there with work done by scientists at\nNASA and at CERN,"},{"start":18.98,"end":22.8,"text":"the International Atomic Physics Research Facility in\nSwitzerland."},{"start":23.7,"end":36.12,"text":"For more than ten years now, the school has ignored the\nofficial government science curriculum and engaged\nstudents in real research projects that have drawn the\nattention of the scientific world."},{"start":37.24,"end":40.76,"text":"Fifty per cent of the school's students go on to STEM\nsubjects,"},{"start":41.16,"end":45.54,"text":"that's science, technology, engineering and maths, at\nuniversity."},{"start":46.36,"end":50.66,"text":"Probably their most well -known effort is a physics and\nastronomy project."},{"start":51.42,"end":53.98,"text":"Following a visit to CERN in 2007,"},{"start":54.56,"end":58.54,"text":"Langton students designed a device that could detect\nradiation in space."},{"start":59.22,"end":61.54,"text":"One of the students describes the project."},{"start":61.82,"end":65.48,"text":"Our data is very relevant to NASA because cosmic rays'"},{"start":66,"end":76.28,"text":"effects on electronics and technology can cause\ncorruption of data and things in satellites, but also\nthere's aspects to do with astronaut safety."},{"start":76.58,"end":87.52,"text":"Dr Becky Parker, head of physics at Langton, thinks\nthat the study of space can inspire young students and\nget them excited about a wide range of scientific\nresearch."},{"start":88.02,"end":92.75999999999999,"text":"She told us that the students are doing fundamental\nresearch while they're at school."},{"start":93.14,"end":96.2,"text":"Instead of students just learning to pass the exam,"},{"start":96.6,"end":99.53999999999999,"text":"she believes that they should be contributing to\nscience,"},{"start":99.96000000000001,"end":102.47999999999999,"text":"doing science and living science."},{"start":103.1,"end":105.9,"text":"This is a new approach to science education."},{"start":106.97999999999999,"end":110.3,"text":"And Langton science students are not just studying\nphysics,"},{"start":110.84,"end":114.88,"text":"they are also doing ground -breaking research in the\nhealth sciences,"},{"start":115.36,"end":122.2,"text":"with one project looking at the structure of a protein\nthat plays a role in the degenerative nerve disease MS."},{"start":123.1,"end":127.58,"text":"They may be the only school with a licence to modify\nthe human genome,"},{"start":127.94,"end":130.04,"text":"the complete set of human DNA."},{"start":131.24,"end":134.9,"text":"The students are aware of how unusual this experience\nis."},{"start":134.9,"end":143.72,"text":"You look at new drugs and they're always manufactured\nby pharmaceutical companies and you look at new\nproducts and they're always done by big corporations,\nbut this is just a school."},{"start":143.92000000000002,"end":146.16,"text":"Tom Zeisen of the Wellcome Trust,"},{"start":146.48,"end":148.56,"text":"which helps fund some of these projects,"},{"start":149.1,"end":152.22,"text":"describes the Langton science curriculum in this way."},{"start":152.57999999999998,"end":156.98,"text":"I think that Langton is inspiring for what they're\ndoing because they're absolutely phenomenal."},{"start":157.12,"end":164.44,"text":"They're doing not just real experiments, but they're\ndoing real experiments into things that nobody knows\nthe answer to and that's"},{"start":165.04,"end":166.32,"text":"fairly unheard of in schools."},{"start":166.42000000000002,"end":168.36,"text":"I've never heard of another school doing something like\nthat."}],"launchInline":true}},{"id":"B04-LS-U02-classroom:resource:b5891","book":4,"unit":2,"track":"LS","topic":"EDUCATION","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LI l – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evidence: nurse in a big hospital","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Po
