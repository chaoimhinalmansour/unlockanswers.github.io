89e097094dd043/content/77f0a8960c92fa1343a5aa9a22739b2108e9fa2829712ea1f10a5ad593b789e8.png"],"sourceHashes":["77f0a8960c92fa1343a5aa9a22739b2108e9fa2829712ea1f10a5ad593b789e8"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write an explanatory essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about China's plans to revive the Silk Road trade routes."},{"label":"Reading skills","text":"Make predictions from a text type; recognize topic sentences."},{"label":"Critical thinking","text":"Evaluate supporting examples; use tables and diagrams."},{"label":"Grammar","text":"Use noun phrases; use time phrases."},{"label":"Academic writing skill","text":"Use correct essay structure; write an effective thesis statement."}],"photo":{"box":[965,500,2071,3553],"nativeWidth":3040,"sourcePage":14,"alt":""}}]}},{"id":"B04-RW-U01-classroom:resource:b6585","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46bd5ead66d1be0a5ed49e4ba196ed1167d1f51ab55ac12e0686b2fa4d10d556.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"the Silk Road","pos":"(n)","definition":"an ancient trade route mainly across land from China, across central Asia to the Eastern Mediterranean and Europe","example":"Traders carried silk and other goods along the Silk Road.","wordAudio":"the Silk Road","cardWord":false},{"term":"dry port","pos":"(n)","definition":"a transport centre where goods are loaded and unloaded, but which is not near water","example":"Containers are transferred from lorries to trains at the dry port.","wordAudio":"dry port","cardWord":false},{"term":"logistics hub","pos":"(n)","definition":"a centre where goods are received, stored, and then sent out to different places","example":"From the logistics hub, parcels are sent to shops across the region.","wordAudio":"logistics hub","cardWord":false},{"term":"infrastructure","pos":"(n)","definition":"the basic systems and services, such as transport and power, that a country uses to work effectively","example":"Good roads and a reliable power supply are part of the country's infrastructure.","wordAudio":"infrastructure","cardWord":false},{"term":"think tank","pos":"(n)","definition":"a group of experts who work together to study a problem and suggest solutions","example":"A think tank published ideas for improving public transport.","wordAudio":"think tank","cardWord":false},{"term":"domestic","pos":"(adj)","definition":"related to issues inside a country","example":"The new rules apply to domestic trade.","wordAudio":"domestic","cardWord":false}]]}},{"id":"B04-RW-U01-classroom:video","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d49677db87e41924a776af3bdcfff188804eb48baf2c3364a9da86f50f34787.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/0b5ed67d57ce1a658a54ccc1-L4RW-U01.mp4","captions":[{"start":3.2,"end":9,"text":"We're up in the mountains near the border with\nKazakhstan on China's far western frontier."},{"start":11.5,"end":16.98,"text":"The area we're travelling through is pretty remote,\nclose to the furthest point from an ocean on the\nplanet."},{"start":18.54,"end":20.74,"text":"This is the land of the old Silk Road,"},{"start":21.34,"end":27.84,"text":"where caravans of merchants trekked more than a\nthousand years ago at the height of China's imperial\npast."},{"start":29.08,"end":39.78,"text":"It's now at the heart of the country's plan to rebuild\nthose ancient trading routes over land and by sea in\none of the most expensive development projects ever\nattempted."},{"start":43.34,"end":46.98,"text":"This is a good place to come to understand the scale of\nthose ambitions."},{"start":47.7,"end":50.34,"text":"Five years ago there was almost nothing here."},{"start":50.68,"end":53.3,"text":"All of this has been built from scratch."},{"start":55.7,"end":58.44,"text":"Including this brand new dry port,"},{"start":59.04,"end":61.88,"text":"intended as a key logistics hub for road and rail,"},{"start":62.9,"end":65.14,"text":"alongside a vast new free trade zone."},{"start":68.72,"end":71.16,"text":"Mr Guo has big dreams for this project."},{"start":71.16,"end":75.16,"text":"He tells me Horgos could be the new Shenzhen or\nShanghai."},{"start":88.62,"end":93.06,"text":"This is the build it and they will come approach to\ninfrastructure and trade."},{"start":94.82,"end":101.92,"text":"Build the roads and rail links out into the region's\ndeveloping countries and the trade will follow, so the\ntheory goes."},{"start":103.94,"end":115.94,"text":"This huge cargo train is lumbering past us now on its\nway from China to Europe and this is very much the\nimage of the modern Silk Road the Chinese government\nwants to project."},{"start":116.4,"end":120.12,"text":"But there's more going on here than just investment in\ninfrastructure."},{"start":120.38,"end":124.34,"text":"This project is as much about politics as it is about\neconomics."},{"start":125.26,"end":137.14,"text":"Ethan Kramer -Fludd studies the project for an economic\nthink tank and sees it as being driven primarily by\nChina's domestic economic objectives and its broader\ngeopolitical goals."},{"start":137.78,"end":142.32,"text":"This is absolutely first and foremost a soft power\ninitiative."},{"start":142.86,"end":162.07999999999998,"text":"Clearly China has the leadership in Beijing envisions\nthe One Belt One Road project as being a significant,\nmaybe the number one most significant part of Xi\nJinping's so -called China dream and vision of\nsupporting the emergence of China onto the global stage\nas the next great superpower."}],"launchInline":true}},{"id":"B04-RW-U01-classroom:material:RW-M03","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab450daf2a2779a75e67f167aee6fab48fb3423a77d1aae9547fe12a15b92197.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.","sourcePage":19},{"body":"3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.","sourcePage":19},{"body":"4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.","sourcePage":19},{"body":"5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","sourcePage":19}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U01-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"IKEA'S GLOBAL SUCCESS","pages":[{"page":19,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab450daf2a2779a75e67f167aee6fab48fb3423a77d1aae9547fe12a15b92197.png","width":3040,"height":4096}],"source":19,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.","sourcePage":19},{"body":"3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.","sourcePage":19},{"body":"4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.","sourcePage":19},{"body":"5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","sourcePage":19}],"text":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.\n3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.\n4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.\n5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/686131fd5d776c5e47873fc446645c67a8814ebfe60725ee8042937b5bc5a2e7.mp3"},"original":{"id":"B04-RW-U01-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U01","book":4,"track":"RW","unit":1,"title":"READING 1","kind":"material","pages":[19],"sourceImages":[{"page":19,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab450daf2a2779a75e67f167aee6fab48fb3423a77d1aae9547fe12a15b92197.png","viewEvidenceReported":true}],"text":"## IKEA'S GLOBAL SUCCESS\n\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.\n3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.\n4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.\n5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6597"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/686131fd5d776c5e47873fc446645c67a8814ebfe60725ee8042937b5bc5a2e7.mp3","continueOnPage":true}},{"id":"B04-RW-U01-classroom:resource:b6608","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[21],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f2a1c387c6f79699d132438a69339fc8a2ea1aa867028cc4bbe7992e237d1abb.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["UNDERSTANDING KEY VOCABULARY\nconsumption (n) the amount of something that someone uses, eats or drinks\nconvenience (n) the state of being suitable for your purposes causing no difficulty\nensure (v) to make certain that something is done or happens\nexperiment (v) to try a new way of doing something","increase (v) to become larger or greater\ninfluence (n) the power to have an effect on people or things, or someone or something that is able to do this\nrelatively (adv) quite good, bad, etc. in comparison with other similar things or with what you expect\nspecialty (n) a product that a place is especially known for"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U01-classroom:material:RW-M04","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.","sourcePage":23},{"body":"2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory","sourcePage":23},{"body":"3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.","sourcePage":23},{"body":"4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.","sourcePage":23},{"body":"5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","sourcePage":23}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U01-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png","width":3040,"height":4096}],"source":23,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.","sourcePage":23},{"body":"2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory","sourcePage":23},{"body":"3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.","sourcePage":23},{"body":"4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.","sourcePage":23},{"body":"5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","sourcePage":23}],"text":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.\n2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory\n3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.\n4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.\n5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bcbf81502f6ff6b38066710e5a54d0f70834034d93d3b76b0472cf7684c06003.mp3"},"original":{"id":"B04-RW-U01-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U01","book":4,"track":"RW","unit":1,"title":"READING 2","kind":"material","pages":[23],"sourceImages":[{"page":23,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png","viewEvidenceReported":true}],"text":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.\n2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory\n3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.\n4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.\n5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6617"],"module":"RW-M04","section":null,"usageStatus":"教 usercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4852ed517036ed076cbe472ea4b02aeb3bc26191ecceb50ced7b66d72b031747.mp3"},"B04-RW-U01-W-9764308d2":{"example":"Chefs can see the influence of other countries in local cooking.","mark":"influence","clip":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0b429158328e47e37529e9e0b1e6719dbff758dd8d879e31b816e1757fda1584.mp3"},"B04-RW-U01-W-8cd56185d":{"example":"The smaller bowl is relatively cheap.","mark":"relatively","clip":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/701ece42dab64b6092bc372b3a3c59e3a6a403feba5d146269a471a425706007.mp3"}},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{"B01-LS-U05-question:b1192":{"rows":{"b1192.i01":{"mode":"choice","option":2},"b1192.i02":{"mode":"choice","option":3},"b1192.i03":{"mode":"choice","option":1},"b1192.i04":{"mode":"choice","option":0}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B02-RW-U05-question:b3751":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"It is easy to get to my house. First, walk (1) __ the High Street. Go (2) __ the bank and (3) __ the bridge. Then walk (4) __ the park and (5) __ the next bridge. Go (6) __ the tunnel – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B04-RW-U01-question:b6609":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"textFills":[{"part":0,"block":0,"values":["convenience","ensure","influence"],"text":"Many shoppers have switched to ordering groceries online because of its (1) __. Now they don't leave their homes to buy food. Others, however, prefer to see the food before they buy it to (2) __ that the food is fresh. Recently, the popularity of cooking programmes on television has had a big (3) __ on the ingredients that people use. People want to cook with foods they see on TV."},{"part":0,"block":1,"values":["consumption","increase"],"text":"People sometimes reduce their (4) __ of certain foods when those foods become more expensive. For example, if bad weather affects the supply of some fruits or vegetables, it can cause their prices to (5) __."},{"part":1,"block":0,"values":["relatively","experiment","speciality"],"text":"People who travel a lot tend to be (6) __ familiar with international food compared to people who don't. Some travellers like to eat familiar food, but others prefer to (7) __ with unfamiliar dishes. In Iceland, we tried a bread that is baked in the ground near a hot spring. It's a local (8) __."}],"tableEdits":[]},"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U01-classroom:material:RW-M03":[{"body":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.","sourcePage":19,"blocks":[{"kind":"text","text":"## IKEA'S GLOBAL SUCCESS"},{"kind":"text","text":"1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine."}]},{"body":"2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand","sourcePage":19,"blocks":[{"kind":"text","text":"2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand"}]},{"body":"out: their dedication to research, their affordable prices and their eco-friendly³ reputation.","sourcePage":19,"blocks":[{"kind":"text","text":"out: their dedication to research, their affordable prices and their eco-friendly³ reputation."}]},{"body":"3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a\nspecial kimchi⁴ refrigerator.","sourcePage":19,"blocks":[{"kind":"text","text":"3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a"},{"kind":"text","text":"special kimchi⁴ refrigerator."}]},{"body":"4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in","sourcePage":19,"blocks":[{"kind":"text","text":"4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in"}]},{"body":"different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.","sourcePage":19,"blocks":[{"kind":"text","text":"different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low."}]},{"body":"5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some","sourcePage":19,"blocks":[{"kind":"text","text":"5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some"}]},{"body":"markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.","sourcePage":19,"blocks":[{"kind":"text","text":"markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store."},{"kind":"text","text":"6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production."}]},{"body":"¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","sourcePage":19,"blocks":[{"kind":"text","text":"¹ appliances (n) devices, usually electrical, that are used in the home"},{"kind":"text","text":"² household (adj) related to people homes"},{"kind":"text","text":"³ eco-friendly (adj) designed to do the least possible damage to the environment"},{"kind":"text","text":"⁴ kimchi (n) a traditional Korean vegetable dish"}]}],"B04-RW-U01-classroom:material:RW-M04":[{"body":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization","sourcePage":23,"blocks":[{"kind":"text","text":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization"}]},{"body":"has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other","sourcePage":23,"blocks":[{"ki
