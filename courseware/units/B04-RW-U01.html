way from China to Europe and this is very much the\nimage of the modern Silk Road the Chinese government\nwants to project."},{"start":116.4,"end":120.12,"text":"But there's more going on here than just investment in\ninfrastructure."},{"start":120.38,"end":124.34,"text":"This project is as much about politics as it is about\neconomics."},{"start":125.26,"end":137.14,"text":"Ethan Kramer -Fludd studies the project for an economic\nthink tank and sees it as being driven primarily by\nChina's domestic economic objectives and its broader\ngeopolitical goals."},{"start":137.78,"end":142.32,"text":"This is absolutely first and foremost a soft power\ninitiative."},{"start":142.86,"end":162.07999999999998,"text":"Clearly China has the leadership in Beijing envisions\nthe One Belt One Road project as being a significant,\nmaybe the number one most significant part of Xi\nJinping's so -called China dream and vision of\nsupporting the emergence of China onto the global stage\nas the next great superpower."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"Main idea: Sentence 2","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":23,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6588","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Write T (true) or F (false) next to the statements below. Correct the false statements.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d49677db87e41924a776af3bdcfff188804eb48baf2c3364a9da86f50f34787.p this way.\n3  If you project a particular quality, that quality is what\nmost people notice about you.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":23,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6591","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner and answer the questions.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d49677db87e41924a776af3bdcfff188804eb48baf2c3364a9da86f50f34787.png"],"provided":"","items":[{"id":"b6591.i01","label":"1","prompt":"Will international trade increase in the future? Why? / Why not?","options":[],"type":"discuss/open"},{"id":"b6591.i02","label":"2","prompt":"What recent large infrastructure projects (a new airport, a new stadium, etc.) have there been in your country?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6591.i01","label":"1","prompt":"Will international trade increase in the future? Why? / Why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6591.i02","label":"2","prompt":"What recent large infrastructure projects (a new airport, a new stadium, etc.) have there been in your country?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think that international trade will\nincrease in the future because of\nongoing globalization, advancements\nin technology, and the growing\ninterdependence of economies.\nThese factors make it easier and more\nefficient for countries to trade goods\nand services.\nI think that international trade might not\nincrease in the future, this is because\nof things like trade wars, countries\nwanting to protect their own economies\nand environmental problems like\nclimate change.\n2 There have been many large\ninfrastructure projects in my country\nrecently. A new airport was built near\nthe capital city last year. There have also\nbeen a lot of new road building projects\nin the south of the country. There is also\na plan for a new high-speed railway to\nconnect the major cities in the north and\nsouth of the country.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":23,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":1,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":2,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6593","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the sentences and write the words in bold next to the definitions.","pages":[18],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/86ced43a6a8748e77d464cbac47eeea0d7331c5b7b5870ecf272d95dc9a039ce.png" ies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.\n3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.\n4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.\n5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, hich use less space\nand paper and are easier to transport. 4 Multinational\ncompanies which specialize in household goods and\nautomobile production.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6600","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"order":12,"module":"READING 1","ex":"5","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the blog again. Write T (true), F (false), or DNS (does not say) next to the statements. Correct the false statements.","pages":[20],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/af930a948461107184c8898cfa29ea5639133a82230e2d62387d11068ef810d5.png"],"provided":"","items":[{"id":"b6600.i01","label":"1","prompt":"IKEA's founder is from Sweden.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6600.i02","label":"2","prompt":"The author identifies three main characteristics of the chain which has made it globally successful.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6600.i03","label":"3","prompt":"IKEA executives have only recently wanted to understand new markets.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6600.i04","label":"4","prompt":"IKEA has stores in China.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6600.i05","label":"5","prompt":"Some IKEA products use recycled glass.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b6600.i06","label":"6","prompt":"IKEA has plans to sell electric bicycles in all their markets.","options":["True","False"],"type":"choice_gap/clo  how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.\n4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.\n5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","screens":["## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 S ,"prompt":"Paragraph 3 summary: ____","options":[],"type":"gap/open"},{"id":"b6614.i04","label":"4","prompt":"Paragraph 4 summary: ____","options":[],"type":"gap/open"},{"id":"b6614.i05","label":"5","prompt":"Paragraph 5 summary: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1  "},{"kind":"text","text":"2  "},{"kind":"text","text":"3 ____"},{"kind":"text","text":"4 ____"},{"kind":"text","text":"5 ____"},{"kind":"item","id":"b6614.i01","label":"1","prompt":"Paragraph 1 summary:","options":[],"type":"gap/open"},{"kind":"item","id":"b6614.i02","label":"2","prompt":"Paragraph 2 summary:","options":[],"type":"gap/open"}],[{"kind":"item","id":"b6614.i03","label":"3","prompt":"Paragraph 3 summary: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6614.i04","label":"4","prompt":"Paragraph 4 summary: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6614.i05","label":"5","prompt":"Paragraph 5 summary: ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U01-classroom:material:RW-M04","title":"READING 2","text":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.\n2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory\n3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.\n4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.\n5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","screens":["Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.","2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made b oreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.\n4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.\n5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","screens":["Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalizat r; decreased\n³ cuisine (n) style of cooking"],"sources":[{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bcbf81502f6ff6b38066710e5a54d0f70834034d93d3b76b0472cf7684c06003.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Globalization has had many advantages on\nour eating habits. These days we have much\nmore variety to choose from when we want\nto cook a meal or go out to a restaurant.\nMost towns and cities have a variety of\nforeign food restaurants to choose from.\nFor example, I often enjoy going to a local\nItalian restaurant. Furthermore, globalization\nhas meant that convenience foods are more\nreadily available. This is really useful as by\nthe time I finish work, I often don’t have\ntime to prepare everything myself.\nHowever, globalization also has its\ndisadvantages. Having the same chain\nrestaurant in every town or city, globally,\ncan mean that local cultures can lose their\nidentity. For instance, it is sometimes\ndisappointing to see a McDonald’s sign,\nwhen you have travelled to another country\nto taste the cuisine there. Convenience\nfood can also be very unhealthy, if eaten\noften. For example, many countries have\nreported increased levels of obesity, due to\nthe growing popularity of fast-food chains.\nGLOBALIZATION\nVOCABULARY","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswer alian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to","one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.","mass-produced (adj) made in large amounts, using machinery in a factory","3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas","such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.","4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.","5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.","² diminished (v) made smaller; decreased","³ cuisine (n) style of cooking"],"sources":[{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png"}],"kind":"material","sourceBlockIds":["b6617"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Until recently, pasta would have been\nmade by people in their local area.\nFamilies would also have made the\nsauces to eat with the pasta at home.\n2 Only pizza and pasta were available in\nthe local town.\n3 Frozen or take-out meals, mass-\nproduced dried pasta, and ready-made\npasta sauces have become very popular.\nFast food chains are seen as\nmore convenient.\n4 People worry about the destruction of\nlocal and national specialties. The ‘Slow\nFood’ movement was started in Italy to\nencourage people to eat locally\nsourced food.\n5 The popularity of foreign food,\ninternational chain restaurants\nand convenient food are results of\nglobalization, and this has changed the\nway Italians eat.","references": pe":"gap/open"},{"id":"b6640.i04","label":"4","prompt":"Supporting example 3:","options":[],"type":"gap/open"},{"id":"b6640.i05","label":"5","prompt":"Concluding sentence:","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-RW-U01-question:b6637","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[26]}],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Topic:","header":false,"colspan":1,"rowspan":1}],[{"text":"Supporting example 1:","header":false,"colspan":1,"rowspan":1}],[{"text":"Supporting example 2:","header":false,"colspan":1,"rowspan":1}],[{"text":"Supporting example 3:","header":false,"colspan":1,"rowspan":1}],[{"text":"Concluding sentence:","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Supporting example 1: Most people buy\ntheir clothes from internationally known\nglobal fashion brands.\nSupporting example 2: Clothes are mass\nproduced according to global supply chains\nand exported around the world.\nSupporting example 3: International\ncelebrities and social media influencers\npromote certain fashion brands and help\ncertain clothing trends become popular.\nConcluding sentence: Globalization has\naffected how clothes are designed and\nmade, how they are advertised. Clothes\nare cheaper but not made locally anymore.\nGRAMMAR FOR WRITING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c ecialty is my favourite.","options":["noun + prepositional phrase","adjective + noun","noun + noun","noun phrase + relative clause"],"type":"choice/closed"},{"kind":"item","id":"b6643.i02","label":"2","prompt":"World cuisine is sold here.","options":["noun + prepositional phrase","adjective + noun","noun + noun","noun phrase + relative clause"],"type":"choice/closed"}],[{"kind":"item","id":"b6643.i03","label":"3","prompt":"Globalization is a change which is unstoppable.","options":["noun + prepositional phrase","adjective + noun","noun + noun","noun phrase + relative clause"],"type":"choice/closed"},{"kind":"item","id":"b6643.i04","label":"4","prompt":"Production in this town is increasing.","options":["noun + prepositional phrase","adjective + noun","noun + noun","noun phrase + relative clause"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B04-RW-U01-resource:b6642","title":"NOUN PHRASES","pages":[27],"text":"NOUN PHRASES\n\nA noun phrase is a group of words in a sentence that together behave as a noun. Noun phrases can be made by combining nouns with:\n\n- other nouns: foreign suppliers\n- relative clauses: a product which is sold locally\n- prepositional phrases: manufacturing in Sweden\n- adjectives: the dominant market\n\nIn academic writing, many noun phrases are created by joining two nouns with of. These common phrases with of are used to talk about quantity: a range of","screens":["NOUN PHRASES","A noun phrase is a group of words in a sentence that together behave as a noun. Noun phrases can be made by combining nouns with:","- other nouns: foreign suppliers","- relative clauses: a product which is sold locally","- prepositional phrases: manufacturing in Sweden","- adjectives: the dominant market","In academic writing, many noun phrases are created by joining two nouns with of. These common phrases with of are used to talk about quantity: a range of"],"sources":[{"page":27,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.gith resent column","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U01-resource:b6647","title":"TIME PHRASES","pages":[28],"text":"In academic writing, it is helpful to use different phrases to describe the time in which something happened. You can also use these phrases to clarify whether events occurred in the past or are happening now. Sometimes you need to be specific. Other times, you can be more general.\n\nVery specific: Ingvar Kamprad started the company in 1943.\n\nMore general: In recent years, foreign food has become more popular in Italy.\n\nHowever, it is important you use the correct tense with these time phrases.\n\nFor a specific time in the past you need to use the past simple.","screens":["In academic writing, it is helpful to use different phrases to describe the time in which something happened. You can also use these phrases to clarify whether events occurred in the past or are happening now. Sometimes you need to be specific. Other times, you can be more general.","Very specific: Ingvar Kamprad started the company in 1943.","More general: In recent years, foreign food has become more popular in Italy.","However, it is important you use the correct tense with these time phrases.","For a specific time in the past you need to use the past simple."],"sources":[{"page":28,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/74119e8af250f56437a5e44f7848eb9ac1adfd13b7a5c009b116603d43a6d500.png"}],"kind":"resource","sourceBlockIds":["b6647"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"general past time: formerly, historically, in recent years, in\nthe past, several years ago\nspecific past time: around 50 years ago, in the 1950s, in\nthe eighteenth century\npresent: at the present time, currently, nowadays,\npresently, these days","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6649","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":36,"module":"GRAMMAR FOR WRITING","ex":"2","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"TIME PHRASES"},"instruction":"Complete the following student essay with the correct time phrases. In some cases, more than one answer is possible.","pages":[29],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2017ee3650e0f743d7ace54a69a0c080d2a497e6d5a30a5bb826d0c285294545.png"],"provided":"a) ____, more and more people are being adventurous with their food choices. b) ____, people have been experimenting with new foods, and this is partly due to globalization. c) ____ people are travelling more and have the opportunity to taste authentic food from other countries. d) ____, however, this was certainly not the case and the majority of people just ate the local food.","items":[{"id":"b6649.i01","label":"a","prompt":"____, more and more people are being adventurous with their food choices.","options":[],"type":"gap/open"},{"id":"b6649.i02","label":"b","prompt":"____, people have been experimenting with new foods, and this is partly due to globalization.","options":[],"type":"gap/open"},{"id":"b6649.i03","label":"c","prompt":"____ people are travelling more and have the opportunity to taste authentic food from other countries.","options":[],"type":"gap/open"},{"id":"b6649.i04","label":"d","prompt":"____, however, this was certainly not the case and the majority of people just ate the local food.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a) ____, more and more people are being adventurous with their food choices. b) ____, people have been experimenting with new foods, and this is partly due to globalization. c) ____ people are travelling more and have the opportunity to taste authentic food from other countries. d) ____, however, this was certainly not the case and the majority of people just ate the local food."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a Nowadays / Presently / These days / Currently / At the\npresent time\nb In recent years\nc Nowadays / Presently / These days / Currently / At the\npresent time\nd Formerly / Historically / In the past / Around 50 years\nago / In the 1950s / In the eighteenth century\nACADEMIC WRITING SKILLS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6652","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the example essay below. Structure the essay by putting the paragraphs in the correct order. Use the guidance from page 29 to help you. Discuss with a partner. Which parts of each paragraph helped you structure the essay correctly?","pages":[30],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b6d40789cfa7dd8bdeb3069543bd5800e995cf0a5211ed36e4be21e12073c89e.png"],"provided":"Is globalization a positive or negative development? Discuss.\n\n## Paragraph A\n\nHowever, there are also drawbacks. The increased movement of people across borders means that diseases can spread more quickly than before. Also, our economies are more linked, which means that when one country experiences a financial crisis, it can impact many others. Finally, large international corporations can create unfair competition for local businesses.\n\n## Paragraph B\n\nWhen did globalization begin? Historians might suggest that it was when Christopher Columbus made his voyages to the Americas in the 1490s. For most of us, however, we tend to think of it as a more modern phenomenon connected with the rise of the worldwide web. In any case, when it comes to the question of whether globalization is beneficial or not, it is complicated. A review of some of the features of globalization suggests that it has had both pros and cons.\n\n## Paragraph C\n\nClearly there are advantages and disadvantages to globalization. How to balance this is a debate that has been going on for some time. One thing seems clear, however: we citizens are more connected than ever before. We can probably predict that this will not change.\n\n## Paragraph D\n\nThe international spread of information, technology, products and ideas has enriched our lives in many ways. When something new is invented far away, we can get it at home. Governments can share ideas with each other to keep us all safer. Also, we can enjoy each others' cultures more than ever before by experiencing new food and different types of entertainment.\n\nOrder the paragraphs by putting the letters in the correct order","items":[{"id":"b6652.i01","label":"1","prompt":"1 ____","options":[],"type":"discuss/closed"},{"id":"b6652.i02","label":"2","prompt":"2 ____","options":[],"type":"discuss/closed"},{"id":"b6652.i03","label":"3","prompt":"3 ____","options":[],"type":"discuss/closed"},{"id":"b6652.i04","label":"4","prompt":"4 ____","options":[],"type":"discuss/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Is globalization a positive or negative development? Discuss."},{"kind":"text","text":"## Paragraph A"},{"kind":"text","text":"However, there are also drawbacks. The increased movement of people across borders means that diseases can spread more quickly than before. Also, our economies are more linked, which means that when one country experiences a financial crisis, it can impact many others. Finally, large international corporations can create unfair competition for local businesses."},{"kind":"text","text":"## Paragraph B"}],[{"kind":"text","text":"When did globalization begin? Historians might suggest that it was when Christopher Columbus made his voyages to the Americas in the 1490s. For most of us, however, we tend to think of it as a more modern phenomenon connected with the rise of the worldwide web. In any case, when it comes to the question of whether globalization is beneficial or not, it is complicated. A review of some of the features of globalization suggests that it has had both pros and cons."},{"kind":"text","text":"## Paragraph C"},{"kind":"text","text":"Clearly there are advantages and disadvantages to globalization. How to balance this is a debate that has been going on for some time. One thing seems clear, however: we citizens are more connected than ever before. We can probably predict that this will not change."},{"kind":"text","text":"## Paragraph D"}],[{"kind":"text","text":"The international spread of information, technology, products and ideas has enriched our lives in many ways. When something new is invented far away, we can get it at home. Governments can share ideas with each other to keep us all safer. Also, we can enjoy each others' cultures more than ever before by experiencing new food and different types of entertainment."},{"kind":"text","text":"Order the paragraphs by putting the letters in the correct order"},{"kind":"item","id":"b6652.i02","label":"2","prompt":"2 ____","options":[],"type":"discuss/closed"},{"kind":"item","id":"b6652.i03","label":"3","prompt":"3 ____","options":[],"type":"discuss/closed"}]],"courseMaterials":[{"id":"B04-RW-U01-publisher-page:p029","title":"原题或核对备注所引第29页","pages":[29],"text":"","screens":[],"sources":[{"page":29,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2017ee3650e0f743d7ace54a69a0c080d2a497e6d5a30a5bb826d0c285294545.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B04-RW-U01-resource:b6651","title":"ESSAY STRUCTURE","pages":[29],"text":"ESSAY STRUCTURE\n\nAlthough there are different types of academic essays, the overall structure and principles tend to be the same. Academic essays start with an introductory paragraph, followed by body paragraphs and end with a concluding paragraph.\n\nIntroductory paragraph\n\nA strong introductory paragraph is very important when writing an academic essay, as it the first impression the reader gets of your work. A good introduction presents the topic of your essay and explains what the essay is about / your opinion (this is called a thesis statement). As the introductory paragraph sets the tone for the rest of the essay it is important that particular attention is given to accuracy, particularly in relation to spelling and grammar.\n\nSome academic essays start with a hook – an interesting fact or statement, a surprising statistic, a quotation or question to get the reader's attention.\n\nBody paragraphs\n\nThese develop the main ideas outlined in the introduction and include relevant evidence and supporting information.\n\nConcluding paragraph\n\nThe last paragraph presents a restatement of the thesis of the essay and ends with the conclusions, recommendations or predictions of the writer.","screens":["ESSAY STRUCTURE","Although there are different types of academic essays, the overall structure and principles tend to be the same. Academic essays start with an introductory paragraph, followed by body paragraphs and end with a concluding paragraph.","Introductory paragraph","A strong introductory paragraph is very important when writing an academic essay, as it the first impression the reader gets of your work. A good introduction presents the topic of your essay and explains what the essay is about / your opinion (this is called a thesis statement). As the introductory paragraph sets the tone for the rest of the essay it is important that particular attention is given to accuracy, particularly in relation to spelling and grammar.","Some academic essays start with a hook – an interesting fact or statement, a surprising statistic, a quotation or question to get the reader's attention.","Body paragraphs","These develop the main ideas outlined in the introduction and include relevant evidence and supporting information.","Concluding paragraph","The last paragraph presents a restatement of the thesis of the essay and ends with the conclusions, recommendations or predictions of the writer."],"sources":[{"page":29,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2017ee3650e0f743d7ace54a69a0c080d2a497e6d5a30a5bb826d0c285294545.png"}],"kind":"resource","sourceBlockIds":["b6651"]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":27,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6656","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":38,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING AN EFFECTIVE THESIS STATEMENT IN THE INTRODUCTION"},"instruction":"Below are some examples of thesis statements. From each statement the reader should be able to understand what the essay question was. Discuss with a partner what you think the question was for each of these statements.","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1293a9b318e87a4b30bbe6a196b1f416ebb215d8e51691f681b8197b7c04088.png"],"provided":"","items":[{"id":"b6656.i01","label":"a","prompt":"Chain stores can have a negative impact on the local high street. This essay will discuss the problems they can cause and offer some solutions.","options":[],"type":"discuss/open"},{"id":"b6656.i02","label":"b","prompt":"Around the world, obesity is becoming an increasing problem. This is because eating habits have changed due to fast food and globalization.","options":[],"type":"discuss/open"},{"id":"b6656.i03","label":"c","prompt":"Globalization has had both a positive and negative effect on my local area. In the following essay both sides of the argument will be discussed.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6656.i01","label":"a","prompt":"Chain stores can have a negative impact on the local high street. This essay will discuss the problems they can cause and offer some solutions.","options":[],"type":"discuss/open"},{"kind":"item","id":"b6656.i02","label":"b","prompt":"Around the world, obesity is becoming an increasing problem. This is because eating habits have changed due to fast food and globalization.","options":[],"type":"discuss/open"},{"kind":"item","id":"b6656.i03","label":"c","prompt":"Globalization has had both a positive and negative effect on my local area. In the following essay both sides of the argument will be discussed.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"a What effect have chain stores had on\nour local towns and cities? What issues\nhave they caused and what can the\ngovernment do to help the situation?\nb Why is obesity becoming an\nissue globally?\nc Has globalization had a positive or\nnegative impact on your local area?\nDiscuss both sides of the argument.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6657","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":39,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING AN EFFECTIVE THESIS STATEMENT IN THE INTRODUCTION"},"instruction":"Now look at the essay questions below and write a thesis statement for each.","pages":[31],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1293a9b318e87a4b30bbe6a196b1f416ebb215d8e51691f681b8197b7c04088.png"],"provided":"","items":[{"id":"b6657.i01","label":"a","prompt":"Globalization is a threat to the local culture of individual countries. To what extent do you agree?","options":[],"type":"gap/open"},{"id":"b6657.i02","label":"b","prompt":"Globalization has meant that many students now choose to study abroad. What are the positive and negative effects of this trend?","options":[],"type":"gap/open"},{"id":"b6657.i03","label":"c","prompt":"How do you think globalization will have changed in fifty years? Will its effects have increased or decreased around the world?","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6657.i01","label":"a","prompt":"Globalization is a threat to the local culture of individual countries. To what extent do you agree?","options":[],"type":"gap/open"},{"kind":"item","id":"b6657.i02","label":"b","prompt":"Globalization has meant that many students now choose to study abroad. What are the positive and negative effects of this trend?","options":[],"type":"gap/open"},{"kind":"item","id":"b6657.i03","label":"c","prompt":"How do you think globalization will have changed in fifty years? Will its effects have increased or decreased around the world?","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U01-resource:b6655","title":"WRITING AN EFFECTIVE THESIS STATEMENT IN THE INTRODUCTION","pages":[31],"text":"A thesis statement in an academic essay is usually found at the very end of the introductory paragraph. It explains what the entire essay will be about, and it expresses a writer's point of view. With a good thesis statement, readers can guess what the rest of the essay might look like.\n\nA thesis statement should sound like an opinion. It should not sound like a fact, a question, a description of what the essay will contain, or a general idea which everyone agrees on.\n\nEssay topic\nThe effects of globalization\n\nPossible thesis statement\nGlobalization has brought us both advantages and disadvantages, but the benefits have been far greater than the drawbacks.\n\nFrom this thesis statement the reader can understand what the writer will discuss (advantages and disadvantages of globalization) and what the writer's overall opinion is (the benefits of globalization have been far greater than the drawbacks).\n\nRemember to use formal language in your thesis statement:\n\nThis essay will discuss not I will talk about ...","screens":["A thesis statement in an academic essay is usually found at the very end of the introductory paragraph. It explains what the entire essay will be about, and it expresses a writer's point of view. With a good thesis statement, readers can guess what the rest of the essay might look like.","A thesis statement should sound like an opinion. It should not sound like a fact, a question, a description of what the essay will contain, or a general idea which everyone agrees on.","Essay topic","The effects of globalization","Possible thesis statement","Globalization has brought us both advantages and disadvantages, but the benefits have been far greater than the drawbacks.","From this thesis statement the reader can understand what the writer will discuss (advantages and disadvantages of globalization) and what the writer's overall opinion is (the benefits of globalization have been far greater than the drawbacks).","Remember to use formal language in your thesis statement:","This essay will discuss not I will talk about ..."],"sources":[{"page":31,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b1293a9b318e87a4b30bbe6a196b1f416ebb215d8e51691f681b8197b7c04088.png"}],"kind":"resource","sourceBlockIds":["b6655"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"a Globalization is only a threat to local\ncultures to a certain extent. There are\nmany things individual countries can do\nto preserve their local traditions.\nb These days it is very common for\nstudents to study abroad, and this\nexperience can have both positive and\nnegative sides. The following essay\nwill discuss both the advantages and\ndisadvantages of this trend.\nc Globalization has increased significantly\nover the last fifty years and so it is fair to\npredict that this trend will only continue.\nThe following essay will outline how\neach aspect of globalization is likely to\ndevelop further.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":2,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6661","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":40,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"STRUCTURE & PLAN"},"instruction":"Look at page 29 again to remind yourself of how to structure an academic essay.","pages":[32],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a11f17b32e75e01ff2f055db9fc999477b0c951e3b47b7dde02792d961c81619.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U01-publisher-page:p029","title":"原题或核对备注所引第29页","pages":[29],"text":"","screens":[],"sources":[{"page":29,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2017ee3650e0f743d7ace54a69a0c080d2a497e6d5a30a5bb826d0c285294545.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B04-RW-U01-resource:b6651","title":"ESSAY STRUCTURE","pages":[29],"text":"ESSAY STRUCTURE\n\nAlthough there are different types of academic essays, the overall structure and principles tend to be the same. Academic essays start with an introductory paragraph, followed by body paragraphs and end with a concluding paragraph.\n\nIntroductory paragraph\n\nA strong introductory paragraph is very important when writing an academic essay, as it the first impression the reader gets of your work. A good introduction presents the topic of your essay and explains what the essay is about / your opinion (this is called a thesis statement). As the introductory paragraph sets the tone for the rest of the essay it is important that particular attention is given to accuracy, particularly in relation to spelling and grammar.\n\nSome academic essays start with a hook – an interesting fact or statement, a surprising statistic, a quotation or question to get the reader's attention.\n\nBody paragraphs\n\nThese develop the main ideas outlined in the introduction and include relevant evidence and supporting information.\n\nConcluding paragraph\n\nThe last paragraph presents a restatement of the thesis of the essay and ends with the conclusions, recommendations or predictions of the writer.","screens":["ESSAY STRUCTURE","Although there are different types of academic essays, the overall structure and principles tend to be the same. Academic essays start with an introductory paragraph, followed by body paragraphs and end with a concluding paragraph.","Introductory paragraph","A strong introductory paragraph is very important when writing an academic essay, as it the first impression the reader gets of your work. A good introduction presents the topic of your essay and explains what the essay is about / your opinion (this is called a thesis statement). As the introductory paragraph sets the tone for the rest of the essay it is important that particular attention is given to accuracy, particularly in relation to spelling and grammar.","Some academic essays start with a hook – an interesting fact or statement, a surprising statistic, a quotation or question to get the reader's attention.","Body paragraphs","These develop the main ideas outlined in the introduction and include relevant evidence and supporting information.","Concluding paragraph","The last paragraph presents a restatement of the thesis of the essay and ends with the conclusions, recommendations or predictions of the writer."],"sources":[{"page":29,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2017ee3650e0f743d7ace54a69a0c080d2a497e6d5a30a5bb826d0c285294545.png"}],"kind":"resource","sourceBlockIds":["b6651"]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6662","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":41,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"STRUCTURE & PLAN"},"instruction":"Now look at Reading 2 and underline the following:","pages":[32],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a11f17b32e75e01ff2f055db9fc999477b0c951e3b47b7dde02792d961c81619.png"],"provided":"Introduction\na a statement which introduces the topic\nb the hook\nc the thesis statement\n\nMain :"h","prompt":"a restatement of the thesis (Conclusion)","options":["a statement which introduces the topic","the hook","the thesis statement","supporting argument + one detail (paragraph 2)","supporting argument + one detail (paragraph 3)","supporting argument + one detail (paragraph 4)","the summary statement","a restatement of the thesis","a final thought / prediction"],"type":"choice/closed"}],[{"kind":"item","id":"b6662.i09","label":"i","prompt":"a final thought / prediction (Conclusion)","options":["a statement which introduces the topic","the hook","the thesis statement","supporting argument + one detail (paragraph 2)","supporting argument + one detail (paragraph 3)","supporting argument + one detail (paragraph 4)","the summary statement","a restatement of the thesis","a final thought / prediction"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a Globalization is causing a lot of change in international\nculture, from the TV shows we watch to the clothes we\nwear.\nb In a recent survey taken in Japan, Brazil and Canada,\n72% of people said that globalization had improved their\neating habits.\nc Furthermore, Italy has seen changes in its own eating\nhabits due to influence from other countries. This\ninfluence, which is a result of the broader trend of\nglobalization, has had both advantages and disadvantages.\nd People no longer spend so much time preparing their\nmeals. – statement\nIndeed, frozen or take-out Italian meals have become\nvery popular in Italy. – supporting argument + detail\ne Now, they can eat at restaurants with foreign cuisine\nand buy foreign food in shops. – statement\nIndian, Chinese and Japanese food have all become\nespecially popular. – supporting detail\nf A third major change in Italy’s food culture has been the\nrise of large restaurant chains. – statement\nThese chains are often foreign, and their numbers have\nincreased enormously in recent years. – supporting detail\ng In summary, globalization has had a significant effect on\nthe way that Italians eat.\nh Its influence can be seen as both positive and negative.\ni On the other hand, the great popularity of Italian food\nworldwide will ensure this great cuisine never disappears.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":28,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6663","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":42,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"STRUCTURE & PLAN"},"instruction":"Before you start to write, it is important to write some notes about what you are going to include in each paragraph. Use the table below to help you.","pages":[33],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/64ee6e833493069a18252a5a6be9a3b932ea1ba48fa58e73d6cb216f75d05f2c.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>Remember to include\u003c/td>\u003ctd>Notes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 1Introduction\u003c/td>\u003ctd>a statement to introduce the topica hook (optional)a thesis statement\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 2Body paragraphs\u003c/td>\u003ctd>your supporting argument with examples / details\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 3Body paragraphs\u003c/td>\u003ctd>your supporting argument with examples / details\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 4Body paragraphs\u003c/td>\u003ctd>your supporting argument with examples / details\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 5Conclusion\u003c/td>\u003ctd>a summary statementa restatement of the thesisa final thought,recommendation or prediction\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b6663.i01","label":"1","prompt":"Paragraph 1 (Introduction) Notes","options":[],"type":"gap/open"},{"id":"b6663.i02","label":"2","prompt":"Paragraph 2 (Body paragraphs) Notes","options":[],"type":"gap/open"},{"id":"b6663.i03","label":"3","prompt":"Paragraph 3 (Body paragraphs) Notes","options":[],"type":"gap/open"},{"id":"b6663.i04","label":"4","prompt":"Paragraph 4 (Body paragraphs) Notes","options":[],"type":"gap/open"},{"id":"b6663.i05","label":"5","prompt":"Paragraph 5 (Conclusion) Notes","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Remember to include","header":false,"colspan":1,"rowspan":1},{"text":"Notes","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 1Introduction","header":false,"colspan":1,"rowspan":1},{"text":"a statement to introduce the topica hook (optional)a thesis statement","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 2Body paragraphs","header":false,"colspan":1,"rowspan":1},{"text":"your supporting argument with examples / details","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 3Body paragraphs","header":false,"colspan":1,"rowspan":1},{"text":"your supporting argument with examples / details","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 4Body paragraphs","header":false,"colspan":1,"rowspan":1},{"text":"your supporting argument with examples / details","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 5Conclusion","header":false,"colspan":1,"rowspan":1},{"text":"a summary statementa restatement of the thesisa final thought,recommendation or prediction","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b6663.i01","label":"1","prompt":"Paragraph 1 (Introduction) Notes","options":[],"type":"gap/open"}],[{"kind":"item","id":"b6663.i02","label":"2","prompt":"Paragraph 2 (Body paragraphs) Notes","options":[],"type":"gap/open"},{"kind":"item","id":"b6663.i03","label":"3","prompt":"Paragraph 3 (Body paragraphs) Notes","options":[],"type":"gap/open"},{"kind":"item","id":"b6663.i04","label":"4","prompt":"Paragraph 4 (Body paragraphs) Notes","options":[],"type":"gap/open"},{"kind":"item","id":"b6663.i05","label":"5","prompt":"Paragraph 5 (Conclusion) Notes","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Remember to include Notes\nParagraph 1\nIntroduction\na statement to introduce the topic\na hook (optional)\na thesis statement\nGlobalization has changed my country significantly.\nIt has changed it in several ways: food, clothes, shops\nand entertainment.\nThe following essay will discuss the impact globalization has\nhad – both negative and positive.\nParagraph 2\nBody paragraphs\nyour supporting argument with\nexamples / details\nClothes:\nWe are influenced by the clothes we see on TV. Many people\nwear jeans and t-shirts.\nParagraph 3\nBody paragraphs\nyour supporting argument with\nexamples / details\nFood:\nFast food restaurants have become popular but there are also\nother choices.\nParagraph 4\nBody paragraphs\nyour supporting argument with\nexamples / details\nShops:\nThere is more variety and I can buy my favourite brands in my\nlocal town.\nParagraph 5\nConclusion\na summary statement\na restatement of the thesis\na final thought, recommendation\nor prediction\nGlobalization has had a great impact on my country.\nIt has had both a positive and negative influence.\nHowever, the advantages outweigh the disadvantages.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6664","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":43,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"STRUCTURE & PLAN"},"instruction":"Refer to the Task checklist on page 34 as you prepare your essay.","pages":[33],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/64ee6e833493069a18252a5a6be9a3b932ea1ba48fa58e73d6cb216f75d05f2c.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U01-publisher-page:p034","title":"原题或核对备注所引第34页","pages":[34],"text":"","screens":[],"sources":[{"page":34,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a517bf8a5678694f19deafa68382c24446014d92568c7b8908def8af277119ac.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B04-RW-U01-publisher-sheet:b6668","title":"WRITING TASK Ex 6 原题面","pages":[34],"text":"\u003ctable>\u003ctr>\u003ctd>TASK CHECK s":[]},{"id":"B04-RW-U01-question:b6666","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":44,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write the first draft of your essay. Use your essay plan to structure your essay.","pages":[33],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/64ee6e833493069a18252a5a6be9a3b932ea1ba48fa58e73d6cb216f75d05f2c.png"],"provided":"Include an introductory paragraph, a thesis statement, three body paragraphs with supporting ideas and a concluding paragraph with a final thought, recommendation or prediction. Write 350–400 words.","items":[{"id":"b6666.i01","label":"1","prompt":"Write the first draft of your essay (350–400 words).","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-RW-U01-question:b6663","kind":"student-work","title":"WRITING TASK Ex 3","pages":[33]}],"materials":[],"coursePages":[[{"kind":"text","text":"Include an introductory paragraph, a thesis statement, three body paragraphs with supporting ideas and a concluding paragraph with a final thought, recommendation or prediction. Write 350–400 words."},{"kind":"item","id":"b6666.i01","label":"1","prompt":"Write the first draft of your essay (350–400 words).","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Globalization has changed my country\nsignificantly, impacting various aspects of\ndaily life. As global connections have grown\nstronger, the influence of other cultures\nand economies has become more evident.\nThe impact has been both positive and\nnegative, but overall, the benefits seem to\noutweigh the drawbacks.\nOne of the most noticeable changes is in\nthe way people dress. Television and social\nmedia have exposed us to fashion trends\nfrom around the world. As a result, many\npeople in my country now wear clothing\nstyles that were once considered foreign.\nThis has allowed us to embrace more\ninternational styles but it has also led to a\ndecline in traditional clothing, which is worn\nless frequently by younger generations.\nGlobalization has also transformed our\neating habits. The spread of international\ncuisine has introduced us to a wider\nvariety of food options. Fast food chains\nhave become increasingly popular but,\nin addition to fast food, people can now\nenjoy dishes from different cultures. This\nhas enriched our culinary experiences.\nHowever, the rise of fast food has\ncontributed to health issues, such as\nobesity, that were less common in\nthe past.\nThe influence of globalization can also be\nseen in the variety of products that are\navailable. International brands are easily\naccessible in local stores. This has made\nit easier for people to buy their favourite\nproducts without traveling abroad.\nHowever, the dominance of global brands\nhas made it difficult for local businesses to\ncompete, leading to a decline in traditional\nmarkets and shops.\nIn conclusion, globalization has had a\nsignificant impact on my country, bringing\nboth positive and negative changes.\nWhile it has influenced our clothing,\nfood, and shopping habits, the benefits,\nsuch as increased variety and access\nto global brands, often outweigh\nthe disadvantages.\nUNIT 2\nUNLOCK YOUR\nKNOWLEDGE\npage 37\n1 These are older people. I don’t think\nthey are at university. They might be\nlearning something connected to\ntheir work.\n2 I like the way students are encouraged\nto express their opinions from an early\nage, but I think in the state school\nsystem there are too many pupils\nper class.\n3 I think that the school syllabus needs\nto be modernized. For example, as\nwell as maths, students should learn\nhow to manage their finances from a\nyoung age. There also needs to be\nmore investment in technology for\nall schools.\n4 Most people in my country leave school\nat 18 years old, but you can leave at\n16. If you leave at 16, you can go to a\ntechnical school where you study other\nsubjects, like mechanics. If you leave at\n18, you have to take exams before you\ncan graduate. If you pass these exams,\nthen you can go to study at university.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[{"page":33,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/64ee6e833493069a18252a5a6be9a3b932ea1ba48fa58e73d6cb216f75d05f2c.png","width":3040,"height":4096}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U01-question:b6668","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"order":45,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Use the Task checklist to review your essay for content and structure.","pages":[34],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a517bf8a5678694f19deafa68382c24446014d92568c7b8908def8af277119ac.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u
