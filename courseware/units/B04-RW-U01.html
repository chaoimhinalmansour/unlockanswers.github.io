89e097094dd043/content/77f0a8960c92fa1343a5aa9a22739b2108e9fa2829712ea1f10a5ad593b789e8.png"],"sourceHashes":["77f0a8960c92fa1343a5aa9a22739b2108e9fa2829712ea1f10a5ad593b789e8"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write an explanatory essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about China's plans to revive the Silk Road trade routes."},{"label":"Reading skills","text":"Make predictions from a text type; recognize topic sentences."},{"label":"Critical thinking","text":"Evaluate supporting examples; use tables and diagrams."},{"label":"Grammar","text":"Use noun phrases; use time phrases."},{"label":"Academic writing skill","text":"Use correct essay structure; write an effective thesis statement."}],"photo":{"box":[965,500,2071,3553],"nativeWidth":3040,"sourcePage":14,"alt":""}}]}},{"id":"B04-RW-U01-classroom:resource:b6585","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46bd5ead66d1be0a5ed49e4ba196ed1167d1f51ab55ac12e0686b2fa4d10d556.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"the Silk Road","pos":"(n)","definition":"an ancient trade route mainly across land from China, across central Asia to the Eastern Mediterranean and Europe","example":"Traders carried silk and other goods along the Silk Road.","wordAudio":"the Silk Road","cardWord":false},{"term":"dry port","pos":"(n)","definition":"a transport centre where goods are loaded and unloaded, but which is not near water","example":"Containers are transferred from lorries to trains at the dry port.","wordAudio":"dry port","cardWord":false},{"term":"logistics hub","pos":"(n)","definition":"a centre where goods are received, stored, and then sent out to different places","example":"From the logistics hub, parcels are sent to shops across the region.","wordAudio":"logistics hub","cardWord":false},{"term":"infrastructure","pos":"(n)","definition":"the basic systems and services, such as transport and power, that a country uses to work effectively","example":"Good roads and a reliable power supply are part of the country's infrastructure.","wordAudio":"infrastructure","cardWord":false},{"term":"think tank","pos":"(n)","definition":"a group of experts who work together to study a problem and suggest solutions","example":"A think tank published ideas for improving public transport.","wordAudio":"think tank","cardWord":false},{"term":"domestic","pos":"(adj)","definition":"related to issues inside a country","example":"The new rules apply to domestic trade.","wordAudio":"domestic","cardWord":false}]]}},{"id":"B04-RW-U01-classroom:video","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d49677db87e41924a776af3bdcfff188804eb48baf2c3364a9da86f50f34787.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/0b5ed67d57ce1a658a54ccc1-L4RW-U01.mp4","captions":[{"start":3.2,"end":9,"text":"We're up in the mountains near the border with\nKazakhstan on China's far western frontier."},{"start":11.5,"end":16.98,"text":"The area we're travelling through is pretty remote,\nclose to the furthest point from an ocean on the\nplanet."},{"start":18.54,"end":20.74,"text":"This is the land of the old Silk Road,"},{"start":21.34,"end":27.84,"text":"where caravans of merchants trekked more than a\nthousand years ago at the height of China's imperial\npast."},{"start":29.08,"end":39.78,"text":"It's now at the heart of the country's plan to rebuild\nthose ancient trading routes over land and by sea in\none of the most expensive development projects ever\nattempted."},{"start":43.34,"end":46.98,"text":"This is a good place to come to understand the scale of\nthose ambitions."},{"start":47.7,"end":50.34,"text":"Five years ago there was almost nothing here."},{"start":50.68,"end":53.3,"text":"All of this has been built from scratch."},{"start":55.7,"end":58.44,"text":"Including this brand new dry port,"},{"start":59.04,"end":61.88,"text":"intended as a key logistics hub for road and rail,"},{"start":62.9,"end":65.14,"text":"alongside a vast new free trade zone."},{"start":68.72,"end":71.16,"text":"Mr Guo has big dreams for this project."},{"start":71.16,"end":75.16,"text":"He tells me Horgos could be the new Shenzhen or\nShanghai."},{"start":88.62,"end":93.06,"text":"This is the build it and they will come approach to\ninfrastructure and trade."},{"start":94.82,"end":101.92,"text":"Build the roads and rail links out into the region's\ndeveloping countries and the trade will follow, so the\ntheory goes."},{"start":103.94,"end":115.94,"text":"This huge cargo train is lumbering past us now on its\nway from China to Europe and this is very much the\nimage of the modern Silk Road the Chinese government\nwants to project."},{"start":116.4,"end":120.12,"text":"But there's more going on here than just investment in\ninfrastructure."},{"start":120.38,"end":124.34,"text":"This project is as much about politics as it is about\neconomics."},{"start":125.26,"end":137.14,"text":"Ethan Kramer -Fludd studies the project for an economic\nthink tank and sees it as being driven primarily by\nChina's domestic economic objectives and its broader\ngeopolitical goals."},{"start":137.78,"end":142.32,"text":"This is absolutely first and foremost a soft power\ninitiative."},{"start":142.86,"end":162.07999999999998,"text":"Clearly China has the leadership in Beijing envisions\nthe One Belt One Road project as being a significant,\nmaybe the number one most significant part of Xi\nJinping's so -called China dream and vision of\nsupporting the emergence of China onto the global stage\nas the next great superpower."}],"launchInline":true}},{"id":"B04-RW-U01-classroom:material:RW-M03","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab450daf2a2779a75e67f167aee6fab48fb3423a77d1aae9547fe12a15b92197.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.","sourcePage":19},{"body":"3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.","sourcePage":19},{"body":"4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.","sourcePage":19},{"body":"5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","sourcePage":19}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U01-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"IKEA'S GLOBAL SUCCESS","pages":[{"page":19,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab450daf2a2779a75e67f167aee6fab48fb3423a77d1aae9547fe12a15b92197.png","width":3040,"height":4096}],"source":19,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.","sourcePage":19},{"body":"3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.","sourcePage":19},{"body":"4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.","sourcePage":19},{"body":"5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","sourcePage":19}],"text":"## IKEA'S GLOBAL SUCCESS\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.\n3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.\n4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.\n5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/686131fd5d776c5e47873fc446645c67a8814ebfe60725ee8042937b5bc5a2e7.mp3"},"original":{"id":"B04-RW-U01-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U01","book":4,"track":"RW","unit":1,"title":"READING 1","kind":"material","pages":[19],"sourceImages":[{"page":19,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ab450daf2a2779a75e67f167aee6fab48fb3423a77d1aae9547fe12a15b92197.png","viewEvidenceReported":true}],"text":"## IKEA'S GLOBAL SUCCESS\n\n1 In this entry to my blog series about successful multinational companies, I will check out the furniture chain IKEA. IKEA has been the world's dominant furniture chain since 2008, according to Forbes magazine.\n2 Swedish entrepreneur Ingvar Kamprad was only 17 years old when he started the company in 1943. These days, the chain has about 460 stores selling appliances¹, furniture and other household² items in over 61 countries around the world. So how have they managed to become such a global hit? Well, to me it seems that three features of the chain stand out: their dedication to research, their affordable prices and their eco-friendly³ reputation.\n3 The executives at IKEA have long understood the need to research other markets in order to succeed globally. The company is constantly conducting research on how people use their furniture and what they are looking for. They recently conducted research in eight cities worldwide. This is how they learned, for example, that Korean customers want a special kimchi⁴ refrigerator.\n4 But in order to sell at discount prices, they need to make and sell a lot of the same thing to keep costs low. This way, they can get low prices from suppliers, and charge super-low prices to their customers. As a result, they can keep their prices economical even during periods of inflation. This is why they will show the same products in different ways in their stores, depending on the local culture. A British bedroom display might have a British flag bedspread on it, whereas one in Tokyo may have a traditional mat on the floor. In China, IKEA's fastest-growing market, domestic manufacturers make most of the products they sell in order to keep transport costs low.\n5 A final selling point for many customers is the image of the company. They sell their furniture in flat boxes which use less space and paper and are easier to transport. A company representative recently said that they are working on creating new products out of materials we currently throw away, such as recycled plastic and foil. In some markets, they plan to market an electric bicycle, and in Seoul, they recently planted a tree to celebrate the opening of a new store.\n6 Next week, I'll look at other multinational companies which specialize in household goods and automobile production.\n\n¹ appliances (n) devices, usually electrical, that are used in the home\n² household (adj) related to people homes\n³ eco-friendly (adj) designed to do the least possible damage to the environment\n⁴ kimchi (n) a traditional Korean vegetable dish","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6597"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/686131fd5d776c5e47873fc446645c67a8814ebfe60725ee8042937b5bc5a2e7.mp3","continueOnPage":true}},{"id":"B04-RW-U01-classroom:resource:b6608","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[21],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f2a1c387c6f79699d132438a69339fc8a2ea1aa867028cc4bbe7992e237d1abb.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["UNDERSTANDING KEY VOCABULARY\nconsumption (n) the amount of something that someone uses, eats or drinks\nconvenience (n) the state of being suitable for your purposes causing no difficulty\nensure (v) to make certain that something is done or happens\nexperiment (v) to try a new way of doing something","increase (v) to become larger or greater\ninfluence (n) the power to have an effect on people or things, or someone or something that is able to do this\nrelatively (adv) quite good, bad, etc. in comparison with other similar things or with what you expect\nspecialty (n) a product that a place is especially known for"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U01-classroom:material:RW-M04","book":4,"unit":1,"track":"RW","topic":"GLOBALIZATION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.","sourcePage":23},{"body":"2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory","sourcePage":23},{"body":"3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.","sourcePage":23},{"body":"4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.","sourcePage":23},{"body":"5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","sourcePage":23}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U01-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png","width":3040,"height":4096}],"source":23,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.","sourcePage":23},{"body":"2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory","sourcePage":23},{"body":"3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.","sourcePage":23},{"body":"4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.","sourcePage":23},{"body":"5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","sourcePage":23}],"text":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.\n2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory\n3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.\n4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.\n5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bcbf81502f6ff6b38066710e5a54d0f70834034d93d3b76b0472cf7684c06003.mp3"},"original":{"id":"B04-RW-U01-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U01","book":4,"track":"RW","unit":1,"title":"READING 2","kind":"material","pages":[23],"sourceImages":[{"page":23,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52674567bcb0e2e786add3b9561b3aaff8678a45ebb2a003f846feeaeadbf141.png","viewEvidenceReported":true}],"text":"Globalization is causing a lot of change in international culture, from the TV shows we watch to the clothes we wear. One major area which has been affected by globalization is food culture. In a recent survey taken in Japan, Brazil and Canada, 72% of people said that globalization had improved their eating habits. It seems clear that globalization has significantly affected food consumption in most parts of the world, but one country whose food has a long history of being ‘globalized’ is Italy. If you walk down any main street in any major world city, you will find at least one Italian restaurant. Furthermore, Italy has seen changes in its own eating habits due to influence from other countries. This influence, which is a result of the broader trend of globalization, has had both advantages and disadvantages.\n2 In Italy, changing trends have affected the preparation of food. Italian families have always taken a lot of pride in preparing food. Until recently, pasta – a basic Italian food – would have been made by people in their local area. Families would also have made the sauces to eat with the pasta at home. People no longer spend so much time preparing their meals. Indeed, frozen or take-out Italian meals have become very popular in Italy. Furthermore, dried pasta is now mass-produced ¹ and is sold relatively cheaply in supermarkets. Ready-made pasta sauces are also increasingly popular – sales have doubled in the last five years, according to one manufacturer. This has added to the convenience of making meals, but has diminished ² a cultural tradition.\nmass-produced (adj) made in large amounts, using machinery in a factory\n3 Italians' food tastes have changed because of globalization. People are travelling more, being exposed to other cultures more, and reading about and seeing foreign ingredients and recipes on the internet and social media. Immigrants to Italy bring their food traditions with them. It used to be that people's opportunities to experiment with foreign food were very limited, since only pizza and pasta were available in the local town square. Now they can eat at restaurants with foreign cuisine ³ and buy foreign food in shops. Indian, Chinese and Japanese food have all become especially popular. While this trend is more common in urban areas such as Rome, Milan and Venice, many smaller towns are also experiencing similar changes. Many Italians would say that this has been a positive change, but others worry that they are losing their sense of nationality as foreign food becomes more common.\n4 A third major change in Italy's food culture has been the rise of large restaurant chains. These chains are often foreign, and their numbers have increased enormously in recent years. Many people like the convenience of fast food. Some Italians, however, feel that this has resulted in the destruction of local and national specialties. In 1986, a famous fast-food chain opened a restaurant in a historic Rome neighbourhood. Many unhappy people responded by joining the 'Slow Food' movement. This movement encourages people to eat healthy, locally sourced food.\n5 In summary, globalization has had a significant effect on the way that Italians eat. Its influence can be seen as both positive and negative. Convenience foods have replaced many of the traditional home-cooked meals, and the availability of foreign foods and international chains has greatly increased. Italians no longer have to rely on food which is produced locally. While some people welcome this extra choice, others fear the damage it may cause to Italian traditions, culture and local businesses. On the other hand, the great popularity of Italian food worldwide will ensure this great cuisine never disappears.\n² diminished (v) made smaller; decreased\n³ cuisine (n) style of cooking","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6617"],"module":"RW-M04","section":null,"usageStatus":"教 function wireMaterials(doc,c,decks){

 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");

 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

}

   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");

   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+

async function display(i,p=0){

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");

 toggle.click();

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
