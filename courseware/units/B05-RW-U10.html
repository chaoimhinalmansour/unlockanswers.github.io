c09a54590e437e18d33b7d25c3651b3.png"],"sourceHashes":["645303652205cd197b90ed4e40018e47ac09a54590e437e18d33b7d25c3651b3"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a pros and cons essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about the Miriwoong language."},{"label":"Reading skill","text":"Use background knowledge to annotate a text."},{"label":"Critical thinking","text":"Evaluate and synthesize arguments."},{"label":"Grammar","text":"Highlight supporting examples; hedge predictions."},{"label":"Academic writing skills","text":"Avoid overgeneralizations; refute counter-arguments."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":230,"alt":""}}]}},{"id":"B05-RW-U10-classroom:resource:b9287","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[232],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/130fdee6bcc605d8e230830a01f17065068c4e7df0d7f0e44d5c3d3e88d0463c.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"woven into","pos":"(phr v)","definition":"a part of something","example":"Stories about the river are woven into the life of the village.","wordAudio":"woven into","cardWord":false},{"term":"indigenous","pos":"(adj)","definition":"having always lived or existed in a place","example":"The exhibition includes artwork by indigenous communities.","wordAudio":"indigenous","cardWord":false},{"term":"ancestral","pos":"(adj)","definition":"relating to members of your family from the past","example":"He returned to his ancestral home for the first time.","wordAudio":"ancestral","cardWord":false}]]}},{"id":"B05-RW-U10-classroom:video","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[232],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/130fdee6bcc605d8e230830a01f17065068c4e7df0d7f0e44d5c3d3e88d0463c.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/66c2be53bbcf1826e7d422f5-L5RW-U010.mp4","captions":[{"start":3.82,"end":6.34,"text":"This is Mirrawong country,"},{"start":6.76,"end":11.88,"text":"a land of vast open skies that straddles modern day\nstate boundaries."},{"start":12.76,"end":19.74,"text":"The Mirrawong people have been here for tens of\nthousands of years, but in recent decades their\nlanguage has come under threat."},{"start":20.58,"end":23.82,"text":"So we can see right across the Mirrawong land?"},{"start":24.98,"end":30.42,"text":"David and Agnes are two of just a handful of surviving\nfluent speakers."},{"start":30.78,"end":33.8,"text":"To them, Mirrawong is woven into this landscape."},{"start":34.42,"end":35.58,"text":"There's language all around you."},{"start":35.74,"end":37.86,"text":"Everything we see has language."},{"start":38.34,"end":40.44,"text":"Everything that moves has language."},{"start":40.94,"end":44.08,"text":"Modern things come, we just have to give it a name in\nMirrawong."},{"start":44.4,"end":47.9,"text":"Like when the first car arrived in our country,"},{"start":48.78,"end":50.5,"text":"Mirrawong people gave it a name, Gwurri."},{"start":51.68,"end":55.92,"text":"And that actually came from the sound that it made,\nGwurr, you know?"},{"start":56.74,"end":58.16,"text":"Before European settlement,"},{"start":58.66,"end":61.96,"text":"Australia was home to around 300 indigenous languages."},{"start":62.5,"end":62.68,"text":"Now,"},{"start":63.1,"end":66.48,"text":"only a dozen are left with more than a thousand\nspeakers."},{"start":67.16,"end":72.84,"text":"Languages are normally handed down from one generation\nto the next, but in Australia, in indigenous\ncommunities,"},{"start":73.4,"end":81.52,"text":"that link was broken decades ago when Aboriginal\nchildren were taken from their families and put under\nthe care of European settlers."},{"start":81.76,"end":83.34,"text":"You are fun,"},{"start":83.94,"end":85.3,"text":"you are fun."},{"start":85.32,"end":88.92,"text":"And so to revive Mirrawong, they need a new generation."},{"start":89.48,"end":96.18,"text":"Every week, 400 pupils at local schools have lessons,\nregardless of whether they have Aboriginal heritage."},{"start":97.24000000000001,"end":100.7,"text":"My favourite word in Mirrawong is Jwinian,"},{"start":101.1,"end":102.47999999999999,"text":"and that means crocodile."},{"start":102.7,"end":106.16,"text":"My favourite Mirrawong word is Gai Gai, which means\ngrandma."},{"start":106.69,"end":110.74000000000001,"text":"My favourite word in Mirrawong is Wido Wijap."},{"start":112.36,"end":114.1,"text":"It means swimming."},{"start":115.96000000000001,"end":118.88,"text":"A lot of money has been put into trying to save\nMirrawong,"},{"start":119.4,"end":123.62,"text":"but the team of linguists working here say the impact\nis far -reaching."},{"start":124.2,"end":129.86,"text":"There is research that says indigenous people learning\ntheir ancestral language"},{"start":130.4,"end":133.74,"text":"are more likely to be successful in life,"},{"start":134.46,"end":138.98,"text":"which means they are more likely to get a job, they are\nmore likely to attend school."},{"start":139.36,"end":146.24,"text":"They are also less likely to struggle with substance\nabuse, they are less likely to commit serious crimes."},{"start":147.86,"end":148.76,"text":"There is"},{"start":148.76,"end":149.12,"text":"no"},{"start":149.12,"end":151.72,"text":"certainty that all this effort will pay off,"},{"start":152.02,"end":159.04,"text":"but here they're trying everything to make sure\nMirrawong is a living, breathing language for decades\nto come."},{"start":159.04,"end":160.86,"text":"Howell Griffith, Beepsy News,"},{"start":161.32,"end":161.9,"text":"in Cunanura."}],"launchInline":true}},{"id":"B05-RW-U10-classroom:resource:b9299","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[234],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4ed98084c12587e7bf0b4b1a712d9e8307d5ca77efd80bf03d4263cfca4e9562.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["be derived from (phr v) to come from a particular origin\ncommodity (n) product you can buy or sell\ncommonly (adv) frequently, usually\nconquer (v) to take control of a country or people, or defeat by war","dialect (n) a local, usually spoken, form of a language\nincorporate (v) to include something as part of something else\nit follows that (phr) used to say if one thing is true, then another thing is true\nterminology (n) words and phrases used for a particular subject"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U10-classroom:material:RW-M03","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[235],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26ef27abd352c1498806da84a8430b09d2809b61615b5eef630b7c3b1759e0e2.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.","sourcePage":235},{"body":"2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.","sourcePage":235},{"body":"3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.","sourcePage":235},{"body":"4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","sourcePage":235},{"body":"5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.","sourcePage":235},{"body":"6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.","sourcePage":235},{"body":"8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","sourcePage":235}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U10-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":235,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26ef27abd352c1498806da84a8430b09d2809b61615b5eef630b7c3b1759e0e2.png","width":772,"height":1040}],"source":235,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another languag e and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.","sourcePage":235},{"body":"4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","sourcePage":235},{"body":"5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.","sourcePage":235},{"body":"6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.","sourcePage":235},{"body":"8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","sourcePage":235}],"text":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.\n2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.\n3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","media":{"type":"audio","title":"Reading 1","sr variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9304"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f46860d88cc8e62e3335978ec926765859f95dc0a32ca58f4a24143f4c85305.mp3","continueOnPage":true}},{"id":"B05-RW-U10-classroom:material:RW-M04","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[240],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.","sourcePage":240},{"body":"2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.","sourcePage":240},{"body":"3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.","sourcePage":240},{"body":"4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.","sourcePage":240},{"body":"5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","sourcePage":240},{"body":"6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","sourcePage":240}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U10-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE","pages":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"source":240,"embeddedIn":null,"photo":null,"clearPages":[{"body":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.","sourcePage":240},{"body":"2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.","sourcePage":240},{"body":"3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.","sourcePage":240},{"body":"4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.","sourcePage":240},{"body":"5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","sourcePage":240},{"body":"6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","sourcePage":240}],"text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.\n4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.\n5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.\n6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc3977b82343fe53bc2fe28453f82cf48e0db24e7b75cbc30adcfb32a0ecf153.mp3"},"original":{"id":"B05-RW-U10-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U10","book":5,"track":"RW","unit":10,"title":"READING 2","kind":"material","pages":[240],"sourceImages":[{"page":240,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","viewEvidenceReported":true}],"text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.\n4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.\n5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.\n6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9323"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735 5.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U10-classroom:material:RW-M03":[{"body":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that\nare used in modern English.","sourcePage":235,"blocks":[{"kind":"text","text":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that"},{"kind":"text","text":"are used in modern English."}]},{"body":"2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their","sourcePage":235,"blocks":[{"kind":"text","text":"2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their"}]},{"body":"meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of","sourcePage":235,"blocks":[{"kind":"text","text":"meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of"}]},{"body":"London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.","sourcePage":235,"blocks":[{"kind":"text","text":"London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business."}]},{"body":"3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French","sourcePage":235,"blocks":[{"kind":"text","text":"3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French"}]},{"body":"entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords","sourcePage":235,"blocks":[{"kind":"text","text":"entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords"}]},{"body":"that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it\ncame to mean 'a one storey house'.","sourcePage":235,"blocks":[{"kind":"text","text":"that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it"},{"kind":"text","text":"came to mean 'a one storey house'."}]},{"body":"4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon","sourcePage":235,"blocks":[{"kind":"text","text":"4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon"}]},{"body":"in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","sourcePage":235,"blocks":[{"kind":"text","text":"in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union."}]},{"body":"5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought","sourcePage":235,"blocks":[{"kind":"text","text":"5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought"}]},{"body":"to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.","sourcePage":235,"blocks":[{"kind":"text","text":"to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish."}]},{"body":"6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and","sourcePage":235,"blocks":[{"kind":"text","text":"6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and"}]},{"body":"many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.","sourcePage":235,"blocks":[{"kind":"text","text":"many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus."}]},{"body":"7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte","sourcePage":235,"blocks":[{"kind":"text","text":"7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte"}]},{"body":"and espresso and Cantonese chow, wok and dim sum, to name just a few.","sourcePage":235,"blocks":[{"kind":"text","text":"and espresso and Cantonese chow, wok and dim sum, to name just a few."}]},{"body":"8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away","sourcePage":235,"blocks":[{"kind":"text","text":"8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers."},{"kind":"text","text":"colony: an area controlled by a more powerful country that is far away"}]},{"body":"lingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","sourcePage":235,"blocks":[{"kind":"text","text":"lingua franca: a language used for communication by groups who don't speak the same language"},{"kind":"text","text":"linguistic: related to language"}]}],"B05-RW-U10-classroom:material:RW-M04":[{"body":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE","sourcePage":240,"blocks":[{"kind":"text","text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE"}]},{"body":"1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English","sourcePage":240,"blocks":[{"kind":"text","text":"1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English"}]},{"body":"words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.","sourcePage":240,"blocks":[{"kind":"text","text":"words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance."}]},{"body":"2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In","sourcePage":240,"blocks":[{"kind":"text","text":"2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In"}]},{"body":"France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again","sourcePage":240,"blocks":[{"kind":"text","text":"France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again"}]},{"body":"in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.","sourcePage":240,"blocks":[{"kind":"text","text":"in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages."}]},{"body":"3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise","sourcePage":240,"blocks":[{"kind":"text","text":"3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise"}]},{"body":"that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.","sourcePage":240,"blocks":[{"kind":"text","text":"that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities."}]},{"body":"4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the","sourcePage":240,"blocks":[{"kind":"text","text":"4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the"}]},{"body":"French Academy 18 months to come words reflects important cultural phenomena and historical events;","sourcePage":240,"blocks":[{"kind":"text","text":"into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events;"}]},{"body":"erasing them would distort the language and its cultural heritage.","sourcePage":240,"blocks":[{"kind":"text","text":"erasing them would distort the language and its cultural heritage."}]},{"body":"6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not","sourcePage":240,"blocks":[{"kind":"text","text":"6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not"}]},{"body":"diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","sourcePage":240,"blocks":[{"kind":"text","text":"diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.",
