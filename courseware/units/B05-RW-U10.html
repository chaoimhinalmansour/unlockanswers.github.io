re-media-20261122/66c2be53bbcf1826e7d422f5-L5RW-U010.mp4","captions":[{"start":3.82,"end":6.34,"text":"This is Mirrawong country,"},{"start":6.76,"end":11.88,"text":"a land of vast open skies that straddles modern day\nstate boundaries."},{"start":12.76,"end":19.74,"text":"The Mirrawong people have been here for tens of\nthousands of years, but in recent decades their\nlanguage has come under threat."},{"start":20.58,"end":23.82,"text":"So we can see right across the Mirrawong land?"},{"start":24.98,"end":30.42,"text":"David and Agnes are two of just a handful of surviving\nfluent speakers."},{"start":30.78,"end":33.8,"text":"To them, Mirrawong is woven into this landscape."},{"start":34.42,"end":35.58,"text":"There's language all around you."},{"start":35.74,"end":37.86,"text":"Everything we see has language."},{"start":38.34,"end":40.44,"text":"Everything that moves has language."},{"start":40.94,"end":44.08,"text":"Modern things come, we just have to give it a name in\nMirrawong."},{"start":44.4,"end":47.9,"text":"Like when the first car arrived in our country,"},{"start":48.78,"end":50.5,"text":"Mirrawong people gave it a name, Gwurri."},{"start":51.68,"end":55.92,"text":"And that actually came from the sound that it made,\nGwurr, you know?"},{"start":56.74,"end":58.16,"text":"Before European settlement,"},{"start":58.66,"end":61.96,"text":"Australia was home to around 300 indigenous languages."},{"start":62.5,"end":62.68,"text":"Now,"},{"start":63.1,"end":66.48,"text":"only a dozen are left with more than a thousand\nspeakers."},{"start":67.16,"end":72.84,"text":"Languages are normally handed down from one generation\nto the next, but in Australia, in indigenous\ncommunities,"},{"start":73.4,"end":81.52,"text":"that link was broken decades ago when Aboriginal\nchildren were taken from their families and put under\nthe care of European settlers."},{"start":81.76,"end":83.34,"text":"You are fun,"},{"start":83.94,"end":85.3,"text":"you are fun."},{"start":85.32,"end":88.92,"text":"And so to revive Mirrawong, they need a new generation."},{"start":89.48,"end":96.18,"text":"Every week, 400 pupils at local schools have lessons,\nregardless of whether they have Aboriginal heritage."},{"start":97.24000000000001,"end":100.7,"text":"My favourite word in Mirrawong is Jwinian,"},{"start":101.1,"end":102.47999999999999,"text":"and that means crocodile."},{"start":102.7,"end":106.16,"text":"My favourite Mirrawong word is Gai Gai, which means\ngrandma."},{"start":106.69,"end":110.74000000000001,"text":"My favourite word in Mirrawong is Wido Wijap."},{"start":112.36,"end":114.1,"text":"It means swimming."},{"start":115.96000000000001,"end":118.88,"text":"A lot of money has been put into trying to save\nMirrawong,"},{"start":119.4,"end":123.62,"text":"but the team of linguists working here say the impact\nis far -reaching."},{"start":124.2,"end":129.86,"text":"There is research that says indigenous people learning\ntheir ancestral language"},{"start":130.4,"end":133.74,"text":"are more likely to be successful in life,"},{"start":134.46,"end":138.98,"text":"which means they are more likely to get a job, they are\nmore likely to attend school."},{"start":139.36,"end":146.24,"text":"They are also less likely to struggle with substance\nabuse, they are less likely to commit serious crimes."},{"start":147.86,"end":148.76,"text":"There is"},{"start":148.76,"end":149.12,"text":"no"},{"start":149.12,"end":151.72,"text":"certainty that all this effort will pay off,"},{"start":152.02,"end":159.04,"text":"but here they're trying everything to make sure\nMirrawong is a living, breathing language for decades\nto come."},{"start":159.04,"end":160.86,"text":"Howell Griffith, Beepsy News,"},{"start":161.32,"end":161.9,"text":"in Cunanura."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 It has come under threat.\n2  Language is normally handed down from one\ngeneration to the next. But in Australia, in indigenous\ncommunities, that link was broken decades ago when\nAboriginal children were taken from their families and\nput under the care of European settlers.\n3  They are teaching it to all school children, promoting\nit on the radio and investing money into reviving\nthe language.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":70,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9292","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video again and complete the sentences below with no more than three words or a number from the video script.","pages":[233],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1689e675822c515563a17638ea745821c49b7f4daeb531480e575f3f6c8bd756.png"],"provided":"Watch the video again and complete the sentences below with no more than three words or a number from the video script.","items":[{"id":"b9292.i01","label":"1","prompt":"Miriwoong country is a place of __________.","options":[],"type":"gap/open"},{"id":"b9292.i02","label":"2","prompt":"The Miriwoong people have existed for __________ of years.","options":[],"type":"gap/open"},{"id":"b9292.i03","label":"3","prompt":"Before the Europeans __________ in Australia there were __________ indigenous languages.","options":[],"type":"gap/open"},{"id":"b9292.i04","label":"4","prompt":"Currently, there are only __________ indigenous languages left.","options":[],"type":"gap/open"},{"id":"b9292.i05","label":"5","prompt":"Every week __________ pupils are given lessons in Miriwoong, regardless of whether they have __ d school, are\nmore likely to get jobs, and less likely to\ncommit serious crimes or struggles with\nsubstance abuse.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":71,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9295","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[233],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1689e675822c515563a17638ea745821c49b7f4daeb531480e575f3f6c8bd756.png"],"provided":"Work with a partner. Discuss the questions.","items":[{"id":"b9295.i01","label":"1","prompt":"What can be done to preserve endangered languages?","options":[],"type":"discuss/open"},{"id":"b9295.i02","label":"2","prompt":"Do you think all endangered languages should be preserved? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b9295.i03","label":"3","prompt":"Do you think that your language is 'woven into' your culture?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9295.i01","label":"1","prompt":"What can be done to preserve endangered languages?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9295.i02","label":"2","prompt":"Do you think all endangered languages should be preserved? Why / Why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b9295.i03","label":"3","prompt":"Do you think that your language is 'woven into' your culture?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Governments around the world should\npromote the benefits of learning\nendangered languages.\n2 Yes, I think that all endangered\nlanguages should be preserved.\nLanguage is an important part of a\nculture and if we lose languages, key\naspects of cultural identity will also\nbe lost.\nNo, I think that everyone should speak\nthe same language and that way\nhumanity will be more connected.\n4 Yes, I think language and dialect is a key\npart of the area I grew up in. My accent\nmakes me feel part of a community.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":71,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9300","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"order":8,"module":"REA ub.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":71,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9306","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the introduction to the textbook. Complete the outline with information from Reading 1. Write the main ideas (I–II) and (a–e).","pages":[236],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/533041a79aa72c46335a54a9987aa586ade9a9f3853bfbcddc0c91ee35fc65c5.png"],"provided":"Read the introduction to the textbook. Complete the outline with information from Reading 1. Write the main ideas (I–II) and (a–e).","items":[{"id":"b9306.i01","label":"1","prompt":"I. Loanwords def. __________ e.g. café, kindergarten, safari","options":[],"type":"gap/open"},{"id":"b9306.i02","label":"2","prompt":"II. __________ keep spell. and meaning, e.g. __________ ; __________, e.g. sugar ; __________, e.g. ketchup, tycoon","options":[],"type":"gap/open"},{"id":"b9306.i03","label":"3","prompt":"III. Sources of loanwords a) __________ liberty, justice, government from __________ ; chimpanzee, mamba from __________ ; __________, __________ from Hindi","options":[],"type":"gap/open"},{"id":"b9306.i04","label":"4","prompt":"b) __________ guerrilla — during __________ ; __________ and __________ during WWII ; cosmonaut and sputnik during __________","options":[],"type":"gap/open"},{"id":"b9306.i05","label":"5","prompt":"c) __________ __________ sold by Arab traders ; chocolate, tomato from __________","options":[],"type":"gap/open"},{"id":"b9306.i06","label":"6","prompt":"d) __________ scien., tech., __________ and legal terminology from __________","options":[],"type":"gap/open"},{"id":"b9306.i07","label":"7","prompt":"e) __________ unprecedented level of linguistic and cultural exchange e.g. __________ ; Italian latte, espresso. Cantonese chow, wok, dim sum","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9306.i01","label":"1","prompt":"I. Loanwords def. __________ e.g. café, kindergarten, safari","options":[],"type":"gap/open"},{"kind":"item","id":"b9306.i02","label":"2","prompt":"II. __________ keep spell. and meaning, e.g. __________ ; __________, e.g. sugar ; __________, e.g. ketchup, tycoon","options":[],"type":"gap/open"},{"kind":"item","id":"b9306.i03","label":"3","prompt":"III. Sources of loanwords a) __________ liberty, justice, government from __________ ; chimpanzee, mamba from __________ ; __________, __________ from Hindi","options":[],"type":"gap/open"},{"kind":"item","id":"b9306.i04","label":"4","prompt":"b) __________ guerrilla — during __________ ; __________ and __________ during WWII ; cosmonaut and sputnik during __________","options":[],"type":"gap/open"},{"kind":"item","id":"b9306.i05","label":"5","prompt":"c) __________ __________ sold by Arab traders ; chocolate, tomato from __________","options":[],"type":"gap/open"}],[{"kind":"item","id":"b9306.i06","label":"6","prompt":"d) __________ scien., tech., __________ and legal terminology from __________","options":[],"type":"gap/open"},{"kind":"item","id":"b9306.i07","label":"7","prompt":"e) __________ unprecedented level of linguistic and cultural exchange e.g. __________ ; Italian latte, espresso. Cantonese chow, wok, dim sum","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U10-classroom:material:RW-M03","title":"READING 1","text":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.\n2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.\n3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","screens":["1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.","2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.","3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.","4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across es of loanwords that are used in modern English.\n2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.\n3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi ry, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.\n3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by gr  loanwords that are used in modern English.\n2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.\n3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","screens":["1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.","2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.","3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.","4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.","6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.","8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language"],"sources":[{"page":235,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26ef27abd352c1498806da84a8430b09d2809b61615b5eef630b7c3b1759e0e2.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f46860d88cc8e62e3335978ec926765859f95dc0a32ca58f4a24143f4c85305.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"There are many advantages of sharing\nloanwords with various languages,\nespecially in the areas of travel and\ntechnology. For example, if I travel to Italy,\nI can order a latte or espresso without\ntoo much trouble because the words are\nthe same in my language. And, while the\nreason I travel is to have new experiences\nand learn about various cultures, it can be\ncomforting to know that some words are\nuniversal. In terms of technology, sharing\nwords is an advantage simply because\nit saves a lot of time. There are so many\ntechnology-related words, such as email\nand selfie, that are used in international\nsituations that it would be much more\ncomplicated to have to learn translations\nof those words in various languages. Once\nclear disadvantage to loanwords is the\nconcern that they will make languages\ndull. Each language is special in its own\nway because of the many different words\nand phrases that people to use to describe\nthings, express themselves, etc. If too many\nloanwords are shared, that may decrease\nthe distinctiveness of each language.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":71,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"cou rt of the Germanic language family.","options":[],"type":"gap/open"},{"id":"b9334.i03","label":"3","prompt":"Malay is a language that is spoken in several countries, for example Malaysia, Indonesia and Singapore.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9334.i01","label":"1","prompt":"Some of the world's oldest languages for instance Greek, Tamil and Farsi, are still widely spoken today.","options":[],"type":"gap/open"},{"kind":"item","id":"b9334.i02","label":"2","prompt":"Languages, such as Swedish, English and Dutch, are part of the Germanic language family.","options":[],"type":"gap/open"},{"kind":"item","id":"b9334.i03","label":"3","prompt":"Malay is a language that is spoken in several countries, for example Malaysia, Indonesia and Singapore.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  incorrect; Some of the world’s oldest languages, for\ninstance, Greek, Tamil and Farsi, are still widely\nspoken today.\n2  incorrect; Languages such as Swedish, English and Dutch\nare part of the Germanic language family.\n3  incorrect; Malay is a language that is spoken in several\ncountries, for example, Malaysia, Indonesia\nand Singapore.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":72,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9335","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Add the parenthetical phrase to the sentence. Use a linking expression and correct punctuation :"Work with a small group. Read the sentences. Write A if you agree with the sentence and D if you disagree. Explain your answers.","pages":[238],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b77fdc4061d2cd7a874ebae5c980ee73ac9762bea96eadefdee627b0675d0e0.png"],"provided":"Work with a small group. Read the sentences. Write A if you agree with the sentence and D if you disagree. Explain your answers.","items":[{"id":"b9319.i01","label":"1","prompt":"I know a lot of English words because of technology and social media.","options":["A","D"],"type":"choice/open"},{"id":"b9319.i02","label":"2","prompt":"Incorporating English words into another language leads to a dilution of that language.","options":["A","D"],"type":"choice/open"},{"id":"b9319.i03","label":"3","prompt":"Preventing technology related English words from entering a language may result in disadvantages for job seekers.","options":["A","D"],"type":"choice/open"},{"id":"b9319.i04","label":"4","prompt":"My language has translations for words like selfie.","options":["A","D"],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9319.i01","label":"1","prompt":"I know a lot of English words because of technology and social media.","options":["A","D"],"type":"choice/open"},{"kind":"item","id":"b9319.i02","label":"2","prompt":"Incorporating English words into another language leads to a dilution of that language.","options":["A","D"],"type":"choice/open"},{"kind":"item","id":"b9319.i03","label":"3","prompt":"Preventing technology related English words from entering a language may result in disadvantages for job seekers.","options":["A","D"],"type":"choice/open"}],[{"kind":"item","id":"b9319.i04","label":"4","prompt":"My language has translations for words like selfie.","options":["A","D"],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 A; I know a lot of English words from\nusing the internet and social media.\nSome of those words include troll,\nstreaming, trending, viral, and hacker.\n2 D; Incorporating new words into other\nlanguages enriches that language. Not\nevery language has a word to express\nevery emotion or concept, so sometimes\nwe need to borrow words from other\nlanguages to express ourselves better.\n3 A; These words are so universally used\nand understood that there is no need to\ntranslate them into another language.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":72,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":26,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9321","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":24,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay on page 240. Circle the main ideas below.","pages":[239],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb2e11c5259ad87751371f346d6b883bfe5871942d9f032f746041241682a57.png"],"provided":"Read the essay on page 240. Circle the main ideas below.","items":[{"id":"b9321.i01","label":"1","prompt":"Circle the main ideas below.","options":["There are personal and professional benefits that come with speaking more than one language.","French equivalents exist for all technology related English words.","The global spread of loanwords will continue, as will the ongoing battle to prevent them.","English loanwords are entering languages too rapidly for purists to keep up with.","Adhering to linguistic purism leads to several advantages for students.","Some people believe that using English loanwords has a negative impact on their language and culture.","English loanwords can be challenging to pronounce in the new language they become a part of."],"type":"select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9321.i01","label":"1","prompt":"Circle the main ideas below.","options":["There are personal and professional benefits that come with speaking more than one language.","French equivalents exist for all technology related English words.","The global spread of loanwords will continue, as will the ongoing battle to prevent them.","English loanwords are entering languages too rapidly for purists to keep up with.","Adhering to linguistic purism leads to several advantages for students.","Some people believe that using English loanwords has a negative impact on their language and culture.","English loanwords can be challenging to pronounce in the new language they become a part of."],"type":"select/open"}]],"courseMaterials":[{"id":"B05-RW-U10-classroom:material:RW-M04","title":"READING 2","text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.\n4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.\n5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.\n6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","screens":["LINGUISTIC PURISM AND ENGL  cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations."],"sources":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U10-publisher-page:p240","title":"原题或核对备注所引第240页","pages":[240],"text":"","screens":[],"sources":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc3977b82343fe53bc2fe28453f82cf48e0db24e7b75cbc30adcfb32a0ecf153.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"a, c, d, f","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":72,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9322","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":25,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay again. Put a tick in the box next to the correct answers.","pages as CAPTCHA and selfie still don't have accepted French equivalents.","5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations."],"sources":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"kind":"reading"},{"id":"B05-RW-U10-publisher-sheet:b9321","title":"READING 2 Ex 3 原题面","pages":[239],"text":"Read the essay on page 240. Circle the main ideas below.","screens":["Read the essay on page 240. Circle the main ideas below."],"sources":[{"page":239,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb2e11c  cultural exchange (para 6)"],"type":"gap_select/open"}],[{"kind":"item","id":"b9325.i02","label":"2","prompt":"a time period when people are taking and using ideas, words and practices from other cultures more quickly and freely than before","options":["cultural dilution (para 1)","emotional appeal (para 1)","throwing up barriers (para 3)","highly sought after (para 3)","an era of accelerated linguistic and cultural exchange (para 6)"],"type":"gap_select/open"},{"kind":"item","id":"b9325.i03","label":"3","prompt":"the process of making culture less strong and pure","options":["cultural dilution (para 1)","emotional appeal (para 1)","throwing up barriers (para 3)","highly sought after (para 3)","an era of accelerated linguistic and cultural exchange (para 6)"],"type":"gap_select/open"}],[{"kind":"item","id":"b9325.i04","label":"4","prompt":"very desirable","options":["cultural dilution (para 1)","emotional appeal (para 1)","throwing up barriers (para 3)","highly sought after (para 3)","an era of accelerated linguistic and cultural exchange (para 6)"],"type":"gap_select/open"},{"kind":"item","id":"b9325.i05","label":"5","prompt":"a quality that makes people feel good or right","options":["cultural dilution (para 1)","emotional appeal (para 1)","throwing up barriers (para 3)","highly sought after (para 3)","an era of accelerated linguistic and cultural exchange (para 6)"],"type":"gap_select/open"}]],"courseMaterials":[{"id":"B05-RW-U10-classroom:material:RW-M04","title":"READING 2","text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.\n4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.\n5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.\n6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","screens":["LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last deca sts will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations."],"sources":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc3977b82343fe53bc2fe28453f82cf48e0db24e7b75cbc30adcfb32a0ecf153.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 throwing up barriers\n2 an era of accelerated linguistic and cultural exchange\n3 cultural dilution\n4 highly sought after\n5 emotional appeal","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":72,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9326","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":27,"module":"READING 2","ex":"6","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work with a partner. Discuss what you think the quotes from Reading 2 mean and whether you agree or disagree with them.","pages":[241],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/db1a18447f251f007f8ced36ce4f84215d4e5af75aa3b17a6e1b721c0e14130d.png"],"provided":"Work
