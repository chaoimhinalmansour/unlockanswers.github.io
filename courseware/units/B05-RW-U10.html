a1b374af019096d2ec11.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[{"page":251,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9372","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":48,"module":"WRITING TASK","ex":"8","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words.","items":[],"layout":"list","references":[{"id":"B05-RW-U10-question:b9363","kind":"student-work","title":"WRITING TASK Ex 1","pages":[250]},{"id":"B05-RW-U10-question:b9365","kind":"student-work","title":"WRITING TASK Ex 2","pages":[251]},{"id":"B05-RW-U10-question:b9366","kind":"student-work","title":"WRITING TASK Ex 3","pages":[251]},{"id":"B05-RW-U10-question:b9367","kind":"student-work","title":"WRITING TASK Ex 4","pages":[251]},{"id":"B05-RW-U10-question:b9368","kind":"student-work","title":"WRITING TASK Ex 5","pages":[251]},{"id":"B05-RW-U10-question:b9369","kind":"student-work","title":"WRITING TASK Ex 6","pages":[251]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"English-medium universities have been\nspreading globally, gaining popularity since\nthe early 2000s. This trend likely coincides\nwith the growth of the internet and\nglobalization. While an English-medium\neducation offers significant benefits, it also\ncomes with challenges.\nOne major advantage is the development\nof English skills. Students at English-\nmedium universities practice reading,\nwriting, listening, and speaking in English\nthroughout their studies. However, research\nshows only a slight improvement in English\nproficiency compared to intensive language\ncourses. A 10-week English course outside\nthe university might yield similar results in\nlanguage development.\nAnother benefit is enhanced employability.\nGraduates who speak multiple languages\nare attractive to employers, especially\ninternational companies. For instance, in a\nscenario where two candidates have equal\nqualifications, the one with additional\nlanguage skills, like English, is more likely\nto be hired, especially if the job involves\ntravel or working with diverse teams.\nHowever, English-medium education\ncan hinder students’ understanding of\ntheir subjects, especially if they are not\nyet fluent in English. Complex academic\ntexts may be difficult to grasp, leading\nto poor comprehension and improper\nuse of resources in assignments. On the\nother hand, skilled instructors who enforce\nEnglish-only rules can make the learning\nprocess smoother for students.\nIn conclusion, while English-medium\nuniversities offer valuable language\nand career benefits, students may face\nchallenges in comprehension and fluency.\nNonetheless, their continued global growth\nsuggests these institutions will remain\nrelevant in the future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574 c09a54590e437e18d33b7d25c3651b3.png"],"sourceHashes":["645303652205cd197b90ed4e40018e47ac09a54590e437e18d33b7d25c3651b3"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a pros and cons essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about the Miriwoong language."},{"label":"Reading skill","text":"Use background knowledge to annotate a text."},{"label":"Critical thinking","text":"Evaluate and synthesize arguments."},{"label":"Grammar","text":"Highlight supporting examples; hedge predictions."},{"label":"Academic writing skills","text":"Avoid overgeneralizations; refute counter-arguments."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":230,"alt":""}}]}},{"id":"B05-RW-U10-classroom:resource:b9287","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[232],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/130fdee6bcc605d8e230830a01f17065068c4e7df0d7f0e44d5c3d3e88d0463c.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"woven into","pos":"(phr v)","definition":"a part of something","example":"Stories about the river are woven into the life of the village.","wordAudio":"woven into","cardWord":false},{"term":"indigenous","pos":"(adj)","definition":"having always lived or existed in a place","example":"The exhibition includes artwork by indigenous communities.","wordAudio":"indigenous","cardWord":false},{"term":"ancestral","pos":"(adj)","definition":"relating to members of your family from the past","example":"He returned to his ancestral home for the first time.","wordAudio":"ancestral","cardWord":false}]]}},{"id":"B05-RW-U10-classroom:video","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[232],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/130fdee6bcc605d8e230830a01f17065068c4e7df0d7f0e44d5c3d3e88d0463c.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/66c2be53bbcf1826e7d422f5-L5RW-U010.mp4","captions":[{"start":3.82,"end":6.34,"text":"This is Mirrawong country,"},{"start":6.76,"end":11.88,"text":"a land of vast open skies that straddles modern day\nstate boundaries."},{"start":12.76,"end":19.74,"text":"The Mirrawong people have been here for tens of\nthousands of years, but in recent decades their\nlanguage has come under threat."},{"start":20.58,"end":23.82,"text":"So we can see right across the Mirrawong land?"},{"start":24.98,"end":30.42,"text":"David and Agnes are two of just a handful of surviving\nfluent speakers."},{"start":30.78,"end":33.8,"text":"To them, Mirrawong is woven into this landscape."},{"start":34.42,"end":35.58,"text":"There's language all around you."},{"start":35.74,"end":37.86,"text":"Everything we see has language."},{"start":38.34,"end":40.44,"text":"Everything that moves has language."},{"start":40.94,"end":44.08,"text":"Modern things come, we just have to give it a name in\nMirrawong."},{"start":44.4,"end":47.9,"text":"Like when the first car arrived in our country,"},{"start":48.78,"end":50.5,"text":"Mirrawong people gave it a name, Gwurri."},{"start":51.68,"end":55.92,"text":"And that actually came from the sound that it made,\nGwurr, you know?"},{"start":56.74,"end":58.16,"text":"Before European settlement,"},{"start":58.66,"end":61.96,"text":"Australia was home to around 300 indigenous languages."},{"start":62.5,"end":62.68,"text":"Now,"},{"start":63.1,"end":66.48,"text":"only a dozen are left with more than a thousand\nspeakers."},{"start":67.16,"end":72.84,"text":"Languages are normally handed down from one generation\nto the next, but in Australia, in indigenous\ncommunities,"},{"start":73.4,"end":81.52,"text":"that link was broken decades ago when Aboriginal\nchildren were taken from their families and put under\nthe care of European settlers."},{"start":81.76,"end":83.34,"text":"You are fun,"},{"start":83.94,"end":85.3,"text":"you are fun."},{"start":85.32,"end":88.92,"text":"And so to revive Mirrawong, they need a new generation."},{"start":89.48,"end":96.18,"text":"Every week, 400 pupils at local schools have lessons,\nregardless of whether they have Aboriginal heritage."},{"start":97.24000000000001,"end":100.7,"text":"My favourite word in Mirrawong is Jwinian,"},{"start":101.1,"end":102.47999999999999,"text":"and that means crocodile."},{"start":102.7,"end":106.16,"text":"My favourite Mirrawong word is Gai Gai, which means\ngrandma."},{"start":106.69,"end":110.74000000000001,"text":"My favourite word in Mirrawong is Wido Wijap."},{"start":112.36,"end":114.1,"text":"It means swimming."},{"start":115.96000000000001,"end":118.88,"text":"A lot of money has been put into trying to save\nMirrawong,"},{"start":119.4,"end":123.62,"text":"but the team of linguists working here say the impact\nis far -reaching."},{"start":124.2,"end":129.86,"text":"There is research that says indigenous people learning\ntheir ancestral language"},{"start":130.4,"end":133.74,"text":"are more likely to be successful in life,"},{"start":134.46,"end":138.98,"text":"which means they are more likely to get a job, they are\nmore likely to attend school."},{"start":139.36,"end":146.24,"text":"They are also less likely to struggle with substance\nabuse, they are less likely to commit serious crimes."},{"start":147.86,"end":148.76,"text":"There is"},{"start":148.76,"end":149.12,"text":"no"},{"start":149.12,"end":151.72,"text":"certainty that all this effort will pay off,"},{"start":152.02,"end":159.04,"text":"but here they're trying everything to make sure\nMirrawong is a living, breathing language for decades\nto come."},{"start":159.04,"end":160.86,"text":"Howell Griffith, Beepsy News,"},{"start":161.32,"end":161.9,"text":"in Cunanura."}],"launchInline":true}},{"id":"B05-RW-U10-classroom:resource:b9299","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[234],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4ed98084c12587e7bf0b4b1a712d9e8307d5ca77efd80bf03d4263cfca4e9562.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["be derived from (phr v) to come from a particular origin\ncommodity (n) product you can buy or sell\ncommonly (adv) frequently, usually\nconquer (v) to take control of a country or people, or defeat by war","dialect (n) a local, usually spoken, form of a language\nincorporate (v) to include something as part of something else\nit follows that (phr) used to say if one thing is true, then another thing is true\nterminology (n) words and phrases used for a particular subject"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U10-classroom:material:RW-M03","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[235],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26ef27abd352c1498806da84a8430b09d2809b61615b5eef630b7c3b1759e0e2.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.","sourcePage":235},{"body":"2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.","sourcePage":235},{"body":"3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.","sourcePage":235},{"body":"4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","sourcePage":235},{"body":"5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.","sourcePage":235},{"body":"6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.","sourcePage":235},{"body":"8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","sourcePage":235}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U10-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":235,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26ef27abd352c1498806da84a8430b09d2809b61615b5eef630b7c3b1759e0e2.png","width":772,"height":1040}],"source":235,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another languag e and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.","sourcePage":235},{"body":"4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.","sourcePage":235},{"body":"5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.","sourcePage":235},{"body":"6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.","sourcePage":235},{"body":"8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","sourcePage":235}],"text":"1 Language and its words are never static; they travel across countries and continents. Words that travel – that are incorporated into another language – are known as loanwords, and there is probably no language in the world that does not include them. Café from French, kindergarten from German and safari from Arabic are examples of loanwords that are used in modern English.\n2 Words from another language can be incorporated into the new language in different ways. Some loanwords – for instance, café – retain their original spelling and meaning. Other words like sugar, which is derived from the Arabic sukkar, keep their root meaning but change in their pronunciation or spelling. In some cases, loanwords change their meaning when they are adopted. For example, the word ketchup comes from Cantonese, a Chinese dialect. It entered the English language in the seventeenth century, when samples of the sauce were brought to the UK from Asia by sailors. Mushroom ketchup, not tomato ketchup as we know it today, soon became a favourite condiment on the dining tables of London. In a more extreme change of meaning, the Japanese term tycoon was used in the nineteenth century by English travellers to address the Japanese shogun. Nowadays, it is used in English to talk about somebody powerful in business.\n3 Loanwords can enter a language for a variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","media":{"type":"audio","title":"Reading 1","sr variety of reasons. Geographical and political domination have traditionally been the biggest contributing factors. Loanwords go primarily in one direction; the language of the dominant group transfers to the language of the group that has been conquered. For example, a great number of loanwords from French entered English during a period of French domination. These include English words for beef, mutton, liberty, justice and government. In general, members of the dominant group use words from the conquered group only if they encounter things or places for which they have no word, as occurred in the British colonies. English incorporated loanwords that reflected these unfamiliar environments. Certain names of animals, such as chimpanzee and mamba, are derived from African languages. Jungle was adapted from a Hindi word, jangal. Bungalow is derived from a Hindi word meaning 'belonging to Bengal' and was used in the seventeenth century to describe a certain type of house in Bengal. Later, it came to mean 'a one storey house'.\n4 Other loanwords in English are related to important historical events. For example, guerrilla, Spanish for 'little war', entered English in the nineteenth century during a period of struggle between the Spanish and Napoleon's troops. The German word blitzkrieg, meaning 'sudden war', and kamikaze from Japanese, became part of the English lexicon in the 1930s and 40s, during World War II. The words cosmonaut and sputnik came from Russian and entered English during the twentieth century 'Space Race' between the United States and the Soviet Union.\n5 Commerce and intercultural exchange are another common source of loanwords; even before the age of globalization, many commodities entered English through international trade and travel. For instance, saffron, cotton and coffee have Arabic roots; they were sold by Arab traders across Europe and Asia. Fruits like lemon and orange were also brought to Europe by Arab merchants, and the Arabic roots of these words are evident not only in English, but in Spanish, French and German. The origin of chocolate and tomato can be traced to the Nahuatl, the language of pre-Colombian inhabitants of Mexico. Both words entered English by way of Spanish.\n6 Scientific and academic exchange has been yet another influential source of loanwords. A considerable number of academic words in English have Latin origins. The reason for this is that, for centuries, Latin was the lingua franca of science and law. In modern English, much of our scientific and technical vocabulary, our medical terminology and many legal terms come from these roots. For example, school and scholar are derived from the Latin word schola; dental and dentist have their origins in the Latin for tooth, densus.\n7 In modern times, globalization, immigration and the rise of low-cost intercontinental travel have led to an unprecedented level of linguistic and cultural exchange. Several Japanese words, such as sushi, tsunami, tempura and anime, are now commonly used in English. We have also witnessed a surge of foreign food names in English – Italian latte and espresso and Cantonese chow, wok and dim sum, to name just a few.\n8 Languages change constantly, in part as a reflection of cultural and socio-political events; it follows that the study of loanwords in English can reveal a great deal about the cultural history of its speakers.\ncolony: an area controlled by a more powerful country that is far away\nlingua franca: a language used for communication by groups who don't speak the same language\nlinguistic: related to language","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9304"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f46860d88cc8e62e3335978ec926765859f95dc0a32ca58f4a24143f4c85305.mp3","continueOnPage":true}},{"id":"B05-RW-U10-classroom:material:RW-M04","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[240],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.","sourcePage":240},{"body":"2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.","sourcePage":240},{"body":"3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.","sourcePage":240},{"body":"4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.","sourcePage":240},{"body":"5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","sourcePage":240},{"body":"6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","sourcePage":240}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U10-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE","pages":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"source":240,"embeddedIn":null,"photo":null,"clearPages":[{"body":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.","sourcePage":240},{"body":"2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.","sourcePage":240},{"body":"3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.","sourcePage":240},{"body":"4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.","sourcePage":240},{"body":"5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","sourcePage":240},{"body":"6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","sourcePage":240}],"text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.\n4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.\n5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.\n6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc3977b82343fe53bc2fe28453f82cf48e0db24e7b75cbc30adcfb32a0ecf153.mp3"},"original":{"id":"B05-RW-U10-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U10","book":5,"track":"RW","unit":10,"title":"READING 2","kind":"material","pages":[240],"sourceImages":[{"page":240,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","viewEvidenceReported":true}],"text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.\n4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.\n5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.\n6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b9323"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735 function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}

  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

function itemHTML(x,letterChoices=false){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;

 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
