ve processes and to have a direct impact on an individual's multitasking and decision-making abilities.","4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.","5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations."],"sources":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc3977b82343fe53bc2fe28453f82cf48e0db24e7b75cbc30adcfb32a0ecf153.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Linguistic purism might have emotional\nappeal because people are often proud\nof their language and their culture. For\nthe most part, preserving one’s language\nand culture feels like the right thing to\ndo. However, the desire for purism does\ncome with several problems.\nI understand the appeal of linguistic\npurism. Languages and cultures are\nunique and people should be proud of\ntheirs. However, I agree that the desire\nfor purism comes with problems. For\nexample, language tends to evolve\nnaturally, so trying to enforce purism\nmay be a losing battle. Loanwords are\ngoing to enter a language whether\npeople want them to or not.\nI think it is important to enforce linguistic\npurism. People are generally proud of\ntheir language and culture and they\nwant to know that it is being protected.\nEven though it may be difficult, or even\nimpossible, to prevent all loanwords\nfrom entering a language, it would be\nuseful if even a few were prevented\nfrom entering.\n2 Loanwords are not simply the intrusion\nof new words into a language. Rather,\nthey reflect the dynamic nature of all\nlanguages. Denying their existence\nmay cause a language to become dull\nor static and that in turn could impact\ncultural heritage.\nI agree. I think it is important to embrace\nthe dynamic nature of a language. This\nis what keeps them alive and interesting.\nI disagree. I don’t think denying the\nexistence of loanwords will make a\nlanguage dull. A language can be\ndynamic on its own, without loanwords.\nSpeakers of any language can invent\nnew words, ensuring that the language\ncontinues to evolve and to reflect a\nparticular culture.\n3 The use of social media is spreading, as\nare innovations in the fields of science\nand technology. This global spread will\nlead to more language change, which\nin turn will lead to greater acceptance\nof loanwords.\nI believe that the spread of technology\nand social media, acceptance of\nloanwords is inevitable.\nI disagree. Social media is no longer the\ndomain of the English language. People\nfrom around the world use it, often in a\nlanguage other than English. Because\nthe initial novelty has worn off, people\nwill feel more comfortable engaging\nin social media and technology in their\nown language, rather than always having\nto use English.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":72,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9328","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":28,"module":"READING 2","ex":"7","context":{"moduleLabel":"READING 2","phaseTitle":"DISCUSSION"},"instruction":"Ask 2–3 classmates the questions below and write their answers in the table. Then share the answers with a small group.","pages":[241],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/db1a18447f251f007f8ced36ce4f84215d4e5af75aa3b17a6e1b721c0e14130d.png"],"provided":"Ask 2–3 classmates the questions below and write their answers in the table. Then share the answers with a small group.","items":[{"id":"b9328.i01","label":"1","prompt":"Which English words did you learn from Reading 1 were originally loanwords?","options":[],"type":"gap/open"},{"id":"b9328.i02","label":"2","prompt":"What is your opinion about the incorporation of loanwords into your language?","options":[],"type":"gap/open"},{"id":"b9328.i03","label":"3","prompt":"Are there words in your language that are untranslatable to English? Which words?","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9328.i01","label":"1","prompt":"Which English words did you learn from Reading 1 were originally loanwords?","options":[],"type":"gap/open"},{"kind":"item","id":"b9328.i02","label":"2","prompt":"What is your opinion about the incorporation of loanwords into your language?","options":[],"type":"gap/open"},{"kind":"item","id":"b9328.i03","label":"3","prompt":"Are there words in your language that are untranslatable to English? Which words?","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U10-classroom:material:RW-M04","title":"READING 2","text":"LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.\n2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.\n3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's mu hes them. We should see a more liberal attitude towards language change in coming generations.","screens":["LINGUISTIC PURISM AND ENGLISH AS A GLOBAL LANGUAGE\n1 In the last decade, we have witnessed a surge of English words from technology and social media being adopted by other languages all over the world. This linguistic phenomenon has split public opinion in some countries with respect to whether they should use the English words or create local equivalents. Opponents of the incorporation of English words into their language argue that accepting English terminology may lead to cultural dilution and a loss of linguistic and cultural identity; they want to preserve their languages in a pure form, keeping them free of foreign influences. Although this linguistic purism may have emotional appeal, there are several problems with this stance.","2 One issue with linguistic purism is that – in a highly competitive global economy – it has the potential to limit young people's opportunities. In many countries – for example, Spain, France and Indonesia – linguistic purism is endorsed by national academies. These institutions oppose the use of English words like computer, email and download. In France, the use of French equivalents in public documents is actively enforced by the French Academy. There are numerous other examples of non-English terms that are promoted by these academies instead of internationally recognized English words. Because of this, students in these countries have the added burden of learning this terminology again in English. Using the English words is seen as not supporting the local language and culture. This kind of negative attitude towards using foreign words may discourage young people from studying other languages.","3 Yet, to cope in the modern world, these young people need to speak a global language, so throwing up barriers to language learning puts them at a disadvantage. Being able to navigate the web and social networking sites and interact with co-workers in multiple languages will be of great benefit to them as they enter the workforce. It's no surprise that multilingual employees are so highly sought after by companies and institutions worldwide. The benefits of multilingualism go beyond economic advantages, however. Knowing two or more languages has also been shown to improve cognitive processes and to have a direct impact on an individual's multitasking and decision-making abilities.","4 Not only is the attempt to prevent English words from entering a language misguided, it is also futile. On social media networks, English words, in an unstoppable flow, are pushing their way into other languages. In science and technology, innovations spread across many fields at a speed that linguistic purists cannot hope to match. It took the French Academy 18 months to come up with a French equivalent for the term cloud computing – in the meantime, French scientists and IT experts had already begun using the technology and the accompanying English term. It is likely that many will continue to do so. A similar phenomenon can be seen in popular culture. For example, at the time of writing, words such as CAPTCHA and selfie still don't have accepted French equivalents.","5 Language is dynamic; it is constantly changing, adding new words to fill existing gaps, and losing others that are no longer needed. New loanwords usually change once they enter a language, adapting to the new language's rules. Loanwords often change their pronunciation (for example, wi-fi in French) or their spelling when they are incorporated into a new language. They also take on the suffixes and prefixes of the new language. In short, they become an essential part of their new language. As a result, most speakers are unaware that many of the words that they use every day have foreign origins. The existence of loanwords reflects important cultural phenomena and historical events; erasing them would distort the language and its cultural heritage.","6 With billions of people currently using social media around the world, we are entering an era of accelerated linguistic and cultural exchange. No doubt linguistic purists will continue to battle against English loanwords, but thankfully, this is not a universal stance. Indeed, people all over the world understand that accepting new words does not diminish their language and culture; rather, the process enriches them. We should see a more liberal attitude towards language change in coming generations."],"sources":[{"page":240,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de627eacf6842a5e2a11801f76fc954495e337f23421787d011250bf734b60d6.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc3977b82343fe53bc2fe28453f82cf48e0db24e7b75cbc30adcfb32a0ecf153.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Until I read Reading 1, I did not know\nthat the English words ketchup, tycoon,\nbeef, chimpanzee, jungle, coffee\nand tomato were borrowed from\nother languages.\n2 I am in favour of languages\nincorporating loanwords. It makes\nlanguages more interesting and\nexpressive. In addition, there is no\nstopping the spread of loanwords.\nBecause of the internet, smartphones\nand social media, there are already so\nmany English words that are globally\nused. There is no government or\nlinguistic movement that could entirely\nprevent their use; they are already\ntoo widespread.\nI dislike the incorporation of loanwords\ninto my language. If I’m having a\nconversation with someone in my\nlanguage and that person uses\nloanwords, I find it distracting and\nawkward. I think my language is very\nbeautiful and I think other languages\ncan be beautiful, too. But when they\nare mixed together, that takes away the\nbeauty. It merely creates distraction.\n3 In Japanese, the words emoji (which\nmeans picture + character), itadakimasu\n(which is somewhat equivalent to bon\nappétit) and kogarashi (which refers to\na particularly cold winter wind) are all\nuntranslatable to English.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":72,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9343","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"WRITING"},"instruction":"Read the opinions about English medium university instruction. Decide if each person is for or against English medium instruction. Underline the reasons each person gives for their views.","pages":[245],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0ca9326be5ac8ba546d2288f9d50c986b53e76baa0229aa2c9e9d71cc749e9be.png"],"provided":"Read the opinions about English medium university instruction. Decide if each person is for or against English medium instruction. Underline the reasons each person gives for their views.","items":[{"id":"b9343.i01","label":"1","prompt":"Zhang Liu, China: 'Going to an English medium university really gave me the edge against the competition. I got an offer from an international bank at a great salary right after I graduated. The fact that I am fluent in English and Chinese was a really important asset that I could offer. From this job, I can move anywhere. My English proficiency gives me mobility in the job market that I would never have without it.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"},{"id":"b9343.i02","label":"2","prompt":"Anonymous student: 'Studying in English is a great idea in theory, but the problem is that most students at my university don't know English well enough to understand the material in their classes. Some of them are completely lost. They don't want to ask questions because they are afraid to use their English. I know some students who don't even bother to go to class anymore. The professors know we are struggling so they try to make the material easier, but that really lowers the standard of our education. And some of our professors – they don't speak English that well either, so they just read their lectures. It's so boring. It would be better to study in our native language.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"},{"id":"b9343.i03","label":"3","prompt":"Haruto, a postgraduate student from Tokyo: 'As an engineering student, I prefer to read my courses in English than in Japanese. It makes my life much easier and helps me communicate with other students when I travel to other universities on exchange schemes or to conferences. I don't struggle with the terminology; it removes the language barrier. Also, the vast majority of cutting-edge research is published in English.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"},{"id":"b9343.i04","label":"4","prompt":"Dr Uzun, president of a private Turkish university: 'By offering all instruction in English, we can attract the best students and professors from all over the world. They all benefit from interacting with one another in English. We can provide the very best education, with up-to-date materials and cutting-edge technology. And, because studying in English is so popular, we can charge substantial tuition. Students will pay for the best educational experience.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"},{"id":"b9343.i05","label":"5","prompt":"Sonia, university student: 'The introduction of English medium instruction to our universities has created a two-tiered education system. The top level is for students who have gone to bilingual schools or whose families could pay for extra English lessons. They are the only ones who can pass the English entrance exams. So, the people who have had an advantage all their lives continue to have an advantage at university. The second tier is for students who didn't study in English. Their English is not good enough to pass the university entrance exam. Some are denied admission. Others have to spend an extra year studying English before they can start their studies and even then, they often struggle in their classes. It seems very unfair.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"},{"id":"b9343.i06","label":"6","prompt":"Dr Khan, a lecturer in Culture and Communication: 'I was quite pleased when we switched to English as our medium of instruction. I don't think it's a real issue for most of our students; it's part of a global shift. In the last few decades, we have observed an increase in multilingualism around the world. Most students speak two or three languages when they start university anyway. Due to increased migration and travel, many people have to learn additional languages throughout their lives. This trend has a  I don't struggle with the terminology; it removes the language barrier. Also, the vast majority of cutting-edge research is published in English.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"}],[{"kind":"item","id":"b9343.i04","label":"4","prompt":"Dr Uzun, president of a private Turkish university: 'By offering all instruction in English, we can attract the best students and professors from all over the world. They all benefit from interacting with one another in English. We can provide the very best education, with up-to-date materials and cutting-edge technology. And, because studying in English is so popular, we can charge substantial tuition. Students will pay for the best educational experience.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"}],[{"kind":"item","id":"b9343.i05","label":"5","prompt":"Sonia, university student: 'The introduction of English medium instruction to our universities has created a two-tiered education system. The top level is for students who have gone to bilingual schools or whose families could pay for extra English lessons. They are the only ones who can pass the English entrance exams. So, the people who have had an advantage all their lives continue to have an advantage at university. The second tier is for students who didn't study in English. Their English is not good enough to pass the university entrance exam. Some are denied admission. Others have to spend an extra year studying English before they can start their studies and even then, they often struggle in their classes. It seems very unfair.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"}],[{"kind":"item","id":"b9343.i06","label":"6","prompt":"Dr Khan, a lecturer in Culture and Communication: 'I was quite pleased when we switched to English as our medium of instruction. I don't think it's a real issue for most of our students; it's part of a global shift. In the last few decades, we have observed an increase in multilingualism around the world. Most students speak two or three languages when they start university anyway. Due to increased migration and travel, many people have to learn additional languages throughout their lives. This trend has a very positive impact on intercultural exchange and cultural relations.'","options":["for English medium instruction","against English medium instruction"],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Zhang Liu, China: For: Going to an English-medium\nuniversity really gave me the edge against the\ncompetition. / My English proficiency gives me mobility in\nthe job market that I would never have without it.\nAnonymous student: Against: the problem is that\nmost students at my university don’t know English well\nenough to understand the material in their classes. / The\nprofessors know we are struggling so they try to make\nthe material easier, but that really lowers the standard\nof our education. / And some of our professors – they\ndon’t speak English that well either, so they just read their\nlectures. It’s so boring.\nHaruto, a postgraduate student from Tokyo: For: It\nmakes my life much easier and helps me communicate\nwith other students. / the vast majority of cutting-edge\nresearch is published in English.\nDr Uzun, President of a private Turkish university: For:\nwe can attract the best students and professors from all\nover the world / up-to-date materials and cutting-edge\ntechnology / we can charge substantial tuition\nSonia, university student: Against: has created a two-\ntiered (unfair) educational system\nDr Khan, a lecturer in Culture and Communication:\nFor: I don’t think it’s a real issue for most of our students;\nit’s part of a global shift. / This trend has a very positive\nimpact on intercultural exchange and cultural relations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":73,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9344","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"WRITING"},"instruction":"Work with a partner. List all the arguments for and against English medium instruction (EMI) from Exercise 1 in the first column of the table. Decide whether you agree or disagree with each argument. Compare your answers with another pair.","pages":[246],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/393abdbe65b7a36b19ddd93dfa72dda228f3a538865b325a255c6b4838ebfbf3.png"],"provided":"Work with a partner. List all the arguments for and against English medium instruction (EMI) from Exercise 1 in the first column of the table. Decide whether you agree or disagree with each argument. Compare your answers with another pair.","items":[{"id":"b9344.i01","label":"1","prompt":"For: competitive edge in the job market","options":[],"type":"gap/open"},{"id":"b9344.i02","label":"2","prompt":"argument","options":[],"type":"gap/open"},{"id":"b9344.i03","label":"3","prompt":"argument","options":[],"type":"gap/open"},{"id":"b9344.i04","label":"4","prompt":"argument","options":[],"type":"gap/open"},{"id":"b9344.i05","label":"5","prompt":"argument","options":[],"type":"gap/open"},{"id":"b9344.i06","label":"6","prompt":"argument","options":[],"type":"gap/open"},{"id":"b9344.i07","label":"7","prompt":"argument","options":[],"type":"gap/open"},{"id":"b9344.i08","label":"8","prompt":"argument","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U10-question:b9343","kind":"student-work","title":"CRITICAL THINKING Ex 1","pages":[245]}],"materials":[],"coursePages":[[{"kind":"item","id":"b9344.i01","label":"1","prompt":"For: competitive edge in the job market","options":[],"type":"gap/open"},{"kind":"item","id":"b9344.i02","label":"2","prompt":"argument","options":[],"type":"gap/open"},{"kind":"item","id":"b9344.i03","label":"3","prompt":"argument","options":[],"type":"gap/open"},{"kind":"item","id":"b9344.i04","label":"4","prompt":"argument","options":[],"type":"gap/open"},{"kind":"item","id":"b9344.i05","label":"5","prompt":"argument","options":[],"type":"gap/open"},{"kind":"item","id":"b9344.i06","label":"6","prompt":"argument","options":[],"type":"gap/open"},{"kind":"item","id":"b9344.i07","label":"7","prompt":"argument","options":[],"type":"gap/open"}],[{"kind":"item","id":"b9344.i08","label":"8","prompt":"argument","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"•  English enables better communication and\ncollaboration among students, especially during\nexchanges and conferences.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":73,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9345","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"WRITING"},"instruction":"Tick the boxes of the two strongest arguments.","pages":[246],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/393abdbe65b7a36b19ddd93dfa72dda228f3a538865b325a255c6b4838ebfbf3.png"],"provided":"In the last column, tick the boxes of the two strongest arguments. It doesn't matter whether you agree or disagree with the overall position of the arguments. Explain to your partner why you think they are the strongest.","items":[],"layout":"list","references":[{"id":"B05-RW-U10-question:b9344","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[246]}],"materials":[],"coursePages":[[{"kind":"text","text":"In the last column, tick the boxes of the two strongest arguments. It doesn't matter whether you agree or disagree with the overall position of the arguments. Explain to your partner why you think they are the strongest."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I think that the strongest argument for\nEMI is the issue of job market advantage.\nProficiency in English enhances\nemployability and offers greater job\nmobility. This highlights the practical\nbenefits of English instruction, emphasizing\nits importance in a globalized job market.\nThe strongest argument against EMI is that\nEnglish instruction can create a two-tiered\nsystem, favouring those with better prior\nEnglish education and disadvantaging\nothers. This argument addresses a\nsignificant social issue, pointing out how\nlanguage instruction can perpetuate\ninequality and limit access to education for\nsome students.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":74,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9346","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"WRITING"},"instruction":"Choose a country to research and write about – either your own country or one you know well. Think about the merits of EMI at universities in your chosen country. Based on the table in Exercise 2, do you support or oppose it?","pages":[246],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/393abdbe65b7a36b19ddd93dfa72dda228f3a538865b325a255c6b4838ebfbf3.png"],"provided":"Choose a country to research and write about – either your own country or one you know well. Think about the merits of EMI at universities in your chosen country. Based on the table in Exercise 2, do you support or oppose it?","items":[],"layout":"list","references":[{"id":"B05-RW-U10-question:b9344","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[246]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I am generally opposed to it. I think that\nuniversity students should receive separate\nEnglish language lessons as part of their\nstudies. I don’t think that they should be\ninstructed in their chosen field in English.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":74,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9347","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"WRITING"},"instruction":"Conduct some research on EMI in the country you are going to write about. This could be from academic research or by interviewing people. Make a list of all of the arguments, both for and against EMI.","pages":[246],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/393abdbe65b7a36b19ddd93dfa72dda228f3a538865b325a255c6b4838ebfbf3.png"],"provided":"Conduct some research on EMI in the country you are going to write about. This could be from academic research or by interviewing people. Make a list of all of the arguments, both for and against EMI.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Additional benefits for EMI are:\nImproved cultural understanding: it\npromotes exposure to diverse perspectives\nand cultures through a shared language.\nStandardized terminology: it provides a\nconsistent framework for technical and\nacademic vocabulary.\nAdditional arguments against english\nmedium instruction:\nIncreased stress for non-fluent students:\nlanguage barriers can lead to anxiety and\nlower academic performance.\nDrawbacks of EMI:\nThe need for additional study: some might\nneed to spend extra time learning English\nbefore they can begin their course.\nDivision between those with stronger and\nweaker language skills: Some students\nwho struggle with English will have more\nproblems participating in class, increasing\nstress and difficulty for them.\nQuality of language spoken by teachers: The\nprofessors themselves have a poor level of\nEnglish which means that the overall quality\nof the course will be lower.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":74,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9348","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"6","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"WRITING"},"instruction":"Discuss your findings with other students.","pages":[246],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/393abdbe65b7a36b19ddd93dfa72dda228f3a538865b325a255c6b4838ebfbf3.png"],"provided":"When you have finished your research, discuss your findings with other students.","items":[{"id":"b9348.i01","label":"1","prompt":"Having conducted research, do you still have the same opinion? If you have changed your mind, look at the arguments you agreed and disagreed with in the table in Exercise 2 and change anything you now don't agree with.","options":[],"type":"discuss/open"},{"id":"b9348.i02","label":"2","prompt":"Make a note of the arguments for and against EMI that you agree with. Write down any evidence that you found that supports each of the arguments you agreed with.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-RW-U10-question:b9347","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[246]}],"materials":[],"coursePages":[[{"kind":"text","text":"When you have finished your research, discuss your findings with other students."},{"kind":"item","id":"b9348.i01","label":"1","prompt":"Having conducted research, do you still have the same opinion? If you have changed your mind, look at the arguments you agreed and disagreed with in the table in Exercise 2 and change anything you now don't agree with.","options":[],"type":"discuss/open"},{"kind":"item","id":"b9348.i02","label":"2","prompt":"Make a note of the arguments for and against EMI that you agree with. Write down any evidence that you found that supports each of the arguments you agreed with.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 My opinion has changed. I think that the\nbenefits to EMI outweigh the negatives.\n2 For: Graduates have a competitive\nedge in the job market and it enables\nbetter communication and collaboration\namong students, for exchanges and\nconferences.\nMost research is published in English\nwhich provides a consistent framework\nfor technical and academic vocabulary.\nIt demonstrates a global shift towards\nmultilingualism, promoting intercultural\nexchange and promotes exposure\nto diverse perspectives and cultures\nthrough a shared language.\nAgainst: Some need to spend additional\ntime learning English before they\ncan start their studies. Those who\nstruggle with English are not as able to\nparticipate in class which can increase\nstress for non-fluent students.\nThis creates a two-tiered system\nwhich favours those with better prior\nEnglish education.\nProfessors may also have poor English\nskills and efforts to simplify material for\nnon-fluent students can lower the quality\nof education for all.\nGRAMMAR FOR WRITING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":74,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9351","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":35,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Read the paragraph. Underline the definite predictions and circle the modest predictions.","pages":[247],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0570d5df5ca39ed4a01ff55652ecd7a89fe236ac6489c2838b2be615b348053d.png"],"provided":"Read the paragraph. Underline the definite predictions and circle the modest predictions.\nTechnology will continue to impact the way people learn languages in the future. However, the one thing that is unlikely to change is that being multilingual will always be beneficial. The use of language learning apps will grow and more learning may well take place on handheld devices, namely smartphones and tablets. It follows that, with increased access to lessons, the number of language learners should skyrocket. Even though translation apps have the potential to decrease the necessity of learning a language, people will continue to pursue languages. After all, the most enriching human interactions occur without the use of technology.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Technology will continue to impact the way people learn languages in the future. However, the one thing that is unlikely to change is that being multilingual will always be beneficial. The use of language learning apps will grow and more learning may well take place on handheld devices, namely smartphones and tablets. It follows that, with increased access to lessons, the number of language learners should skyrocket. Even though translation apps have the potential to decrease the necessity of learning a language, people will continue to pursue languages. After all, the most enriching human interactions occur without the use of technology."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"definite predictions:\nTechnology will continue to impact the way people\nlearn languages.\nbeing multilingual will always be beneficial\nThe use of language learning apps will grow\npeople will continue to pursue languages\nmodest predictions:\nthe one thing that is unlikely to change\nmore learning may well take place on handheld devices\nthe number of language learners should skyrocket\ntranslation apps have the potential to decrease the\nnecessity of learning a language","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":74,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9352","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":36,"module":"GRAMMAR FOR WRITING","ex":"2","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Work with a partner. Rewrite the paragraph. Make the definite predictions modest and the modest predictions definite. Use hedging expressions from the Explanation box.","pages":[247],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0570d5df5ca39ed4a01ff55652ecd7a89fe236ac6489c2838b2be615b348053d.png"],"provided":"Work with a partner. Rewrite the paragraph. Make the definite predictions modest and the modest predictions definite. Use hedging expressions from the Explanation box.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U10-publisher-sheet:b9351","title":"GRAMMAR FOR WRITING Ex 1 原题面","pages":[247],"text":"Read the paragraph. Underline the definite predictions and circle the modest predictions.\nTechnology will continue to impact the way people learn languages in the future. However, the one thing that is unlikely to change is that being multilingual will always be beneficial. The use of language learning apps will grow and more learning may well take place on handheld devices, namely smartphones and tablets. It follows that, with increased access to lessons, the number of language learners should skyrocket. Even though translation apps have the potential to decrease the necessity of learning a language, people will continue to pursue languages. After all, the most enriching human interactions occur without the use of technology.","screens":["Read the paragraph. Underline the definite predictions and circle the modest predictions.","Technology will continue to impact the way people learn languages in the future. However, the one thing that is unlikely to change is that being multilingual will always be beneficial. The use of language learning apps will grow and more learning may well take place on handheld devices, namely smartphones and tablets. It follows that, with increased access to lessons, the number of language learners should skyrocket. Even though translation apps have the potential to decrease the necessity of learning a language, people will continue to pursue languages. After all, the most enriching human interactions occur without the use of technology."],"sources":[{"page":247,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0570d5df5ca39ed4a01ff55652ecd7a89fe236ac6489c2838b2be615b348053d.png"}],"kind":"task_sheet","sourceBlockIds":["b9351"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Technology is likely to continue to impact\nthe way people learn languages in the\nfuture. However, the one thing that will not\nchange is that being multilingual should\nalways be beneficial. The use of language\nlearning apps is highly likely to grow and\nmore learning will take place on handheld\ndevices, namely smartphones and tablets.\nIt follows that, with increased access to\nlessons, the number of language learners\nwill skyrocket. Even though translation apps\nwill decrease the necessity of learning a\nlanguage, people might continue to pursue\nlanguages. After all, the most enriching","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":74,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":27,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9355","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Work with a partner. Take turns restating the sentences with language that avoids overgeneralizations.","pages":[248],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc65a1dc00de9aa44a57065ab245758a7fe49bbd034eab8383f5f6a90e31476b.png"],"provided":"Work with a partner. Take turns restating the sentences with language that avoids overgeneralizations.","items":[{"id":"b9355.i01","label":"1","prompt":"Business terminology is the same in different languages.","options":[],"type":"gap/open"},{"id":"b9355.i02","label":"2","prompt":"People learn a language more quickly if they live in a country where the language is spoken.","options":[],"type":"gap/open"},{"id":"b9355.i03","label":"3","prompt":"Nobody is 100% fluent in multiple languages.","options":[],"type":"gap/open"},{"id":"b9355.i04","label":"4","prompt":"Experts claim that motivation is the most important factor in language learning.","options":[],"type":"gap/open"},{"id":"b9355.i05","label":"5","prompt":"Online language schools offer opportunities for students to interact.","options":[],"type":"gap/open"},{"id":"b9355.i06","label":"6","prompt":"Parents want their children to begin learning English at a young age.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9355.i01","label":"1","prompt":"Business terminology is the same in different languages.","options":[],"type":"gap/open"},{"kind":"item","id":"b9355.i02","label":"2","prompt":"People learn a language more quickly if they live in a country where the language is spoken.","options":[],"type":"gap/open"},{"kind":"item","id":"b9355.i03","label":"3","prompt":"Nobody is 100% fluent in multiple languages.","options":[],"type":"gap/open"},{"kind":"item","id":"b9355.i04","label":"4","prompt":"Experts claim that motivation is the most important factor in language learning.","options":[],"type":"gap/open"},{"kind":"item","id":"b9355.i05","label":"5","prompt":"Online language schools offer opportunities for students to interact.","options":[],"type":"gap/open"},{"kind":"item","id":"b9355.i06","label":"6","prompt":"Parents want their children to begin learning English at a young age.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 A lot of business terminology is the\nsame in different languages.\n2 Some people learn a language more\nquickly if they live in the country where\nthe language is spoken.\n3 Not a lot of people are 100% fluent in\nmultiple languages.\n4 A number of experts claim that\nmotivation is the most important factor\nin language learning.\n5 Many online language schools offer\nopportunities for students to interact.\n6 The vast majority of parents want their\nchildren to begin learning English at a\nyoung age.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9356","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":38,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Write two sentences about the challenges many people encounter when learning a new language. Use expressions from the box above to avoid overgeneralizations. Share your sentences with a partner.","pages":[248],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc65a1dc00de9aa44a57065ab245758a7fe49bbd034eab8383f5f6a90e31476b.png"],"provided":"Write two sentences about the challenges many people encounter when learning a new language. Use expressions from the box above to avoid overgeneralizations. Share your sentences with a partner.","items":[{"id":"b9356.i01","label":"1","prompt":"1","options":[],"type":"gap/open"},{"id":"b9356.i02","label":"2","prompt":"2","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9356.i01","label":"1","prompt":"1","options":[],"type":"gap/open"},{"kind":"item","id":"b9356.i02","label":"2","prompt":"2","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The vast majority of students struggle\nwith learning the slang and idioms of the\nlanguage they are learning.\n2 A significant number of people have a\nhard time learning how to write formally\nin a new language.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9358","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":39,"module":"ACADEMIC WRITING SKILLS","ex":"3","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Fill in the blanks with an expression that acknowledges the existence and/or validity of the arguments below.","pages":[249],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b9f44359dca95c880ab400897ef4d69c313e52c365418cb401d2216b7d647ab.png"],"provided":"Fill in the blanks with an expression that acknowledges the existence and/or validity of the arguments below. More than one answer may be correct. Share your answers with a partner.","items":[{"id":"b9358.i01","label":"1","prompt":"Students should focus on their core classes; learning a language is merely a distraction. __________ language learning is a distraction. In fact, being multilingual leads to an increase in multitasking and decision-making skills, both of which are advantages to students.","options":[],"type":"gap/open"},{"id":"b9358.i02","label":"2","prompt":"Attempting to learn a language beyond childhood is futile. __________ childhood is the ideal time to learn a language, research has proven that adults can achieve fluency in a language, too.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Fill in the blanks with an expression that acknowledges the existence and/or validity of the arguments below. More than one answer may be correct. Share your answers with a partner."},{"kind":"item","id":"b9358.i01","label":"1","prompt":"Students should focus on their core classes; learning a language is merely a distraction. __________ language learning is a distraction. In fact, being multilingual leads to an increase in multitasking and decision-making skills, both of which are advantages to students.","options":[],"type":"gap/open"},{"kind":"item","id":"b9358.i02","label":"2","prompt":"Attempting to learn a language beyond childhood is futile. __________ childhood is the ideal time to learn a language, research has proven that adults can achieve fluency in a language, too.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It has been argued that language\nlearning is a distraction.\n2 Although it has been argued that\nattempting to learn a language beyond\nchildhood is futile, research has proven\nthat adults can achieve fluency in a\nlanguage, too.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9359","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Refute the statement below. Compare your sentence with a partner.","pages":[249],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b9f44359dca95c880ab400897ef4d69c313e52c365418cb401d2216b7d647ab.png"],"provided":"Refute the statement below. Compare your sentence with a partner.","items":[{"id":"b9359.i01","label":"1","prompt":"Teachers should enforce an English-only rule in all of their English-language classes.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b9359.i01","label":"1","prompt":"Teachers should enforce an English-only rule in all of their English-language classes.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"While an English-only rule may be\nuseful during some lessons, there are\nproblems with enforcing the rule in all\nEnglish-language classes. Some students\nmay benefit from having difficult rules\nor concepts explained to them in their\nfirst language.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9363","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":41,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"In a pros and cons essay you must present a balanced view. Review your notes from Critical thinking, page 246. Work with a partner to choose the three strongest arguments related to EMI in your country. Write each of them as a topic sentence in the boxes.","pages":[250],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c7acd43667996ef2fade13be705e953010bd0efaed3addead7a9ca55472cf559.png"],"provided":"In a pros and cons essay you must present a balanced view. Review your notes from Critical thinking, page 246. Work with a partner to choose the three strongest arguments related to EMI in your country. Write each of them as a topic sentence in the boxes.\nWrite each of the three strongest arguments as a topic sentence.","items":[{"id":"b9363.i01","label":"1","prompt":"Argument 1 / Topic sentence / Possible counter-arguments / Supporting details","options":[],"type":"gap/open"},{"id":"b9363.i02","label":"2","prompt":"Argument 2 / Topic sentence / Possible counter-arguments / Supporting details","options":[],"type":"gap/open"},{"id":"b9364.i01","label":"1","prompt":"Argument 3 / Topic sentence / Possible counter-arguments / Supporting details","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U10-question:b9348","kind":"student-work","title":"CRITICAL THINKING Ex 6","pages":[246]},{"id":"B05-RW-U10-question:b9344","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[246]}],"materials":[],"coursePages":[[{"kind":"text","text":"Write each of the three strongest arguments as a topic sentence."},{"kind":"item","id":"b9363.i01","label":"1","prompt":"Argument 1 / Topic sentence / Possible counter-arguments / Supporting details","options":[],"type":"gap/open"},{"kind":"item","id":"b9363.i02","label":"2","prompt":"Argument 2 / Topic sentence / Possible counter-arguments / Supporting details","options":[],"type":"gap/open"},{"kind":"item","id":"b9364.i01","label":"1","prompt":"Argument 3 / Topic sentence / Possible counter-arguments / Supporting details","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U10-publisher-page:p246","title":"原题或核对备注所引第246页","pages":[246],"text":"","screens":[],"sources":[{"page":246,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/393abdbe65b7a36b19ddd93dfa72dda228f3a538865b325a255c6b4838ebfbf3.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Argument 1: English-medium university\nstudents graduate with highly developed\nEnglish skills.\n2 Argument 2: Graduates of English-\nmedium universities are likely to\nhave more job opportunities than\nother graduates.\n3 Argument 3: English-medium\nuniversities often prevent students from\nfully understanding the subject matter.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9365","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":42,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Note your supporting details in the boxes above. Include examples where they are appropriate. Discuss with a partner to make sure details are clear and examples are appropriate.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Note your supporting details in the boxes above. Include examples where they are appropriate. Discuss with a partner to make sure details are clear and examples are appropriate.","items":[],"layout":"list","references":[{"id":"B05-RW-U10-question:b9363","kind":"student-work","title":"WRITING TASK Ex 1","pages":[250]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Supporting details 1: Students have\nnumerous opportunities to practise and\nuse English throughout their college\ncareer. And, because all classes take\nplace in English, students will acquire\nsecond-language skills in reading,\nwriting, listening and speaking.\n2 Supporting details 2: Potential\nemployees who speak more than one\nlanguage are attractive to employers,\nespecially employers at international\ncompanies. Example: If there are two\njob candidates with equal qualifications,\na person who speaks a second language\nwill most likely be hired over the person\nwho doesn’t, especially if travel and/\nor interaction with speakers of other\nlanguages are part of the job.\n3 Supporting details 3: Some students\nbegin their English-medium education\nbefore they are fluent in English.\nThis lack of fluency is a disadvantage\nbecause English materials may be\ndifficult to absorb. Example: If a student\nhas to read a challenging research\npaper and then use that as a source\nin an essay, they will struggle to fully\ncomprehend the information in the\nresearch paper. As a result, they will\nnot be able to appropriately use it as\na source, which will negatively affect\nthe essay.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9366","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":43,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Discuss each argument with a partner and ask your partner to discuss possible counter-arguments. You may not need to include counter-arguments for every claim, only if there are relevant counter-arguments to that view.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Discuss each argument with a partner and ask your partner to discuss possible counter-arguments. You may not need to include counter-arguments for every claim, only if there are relevant counter-arguments to that view.","items":[],"layout":"list","references":[{"id":"B05-RW-U10-question:b9363","kind":"student-work","title":"WRITING TASK Ex 1","pages":[250]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Counter-argument 1: Attending an\nEnglish-medium university does not\nnecessarily lead to higher language\nproficiency. Studies have found that\nstudents who study at English-medium\nuniversities show only a slight increase\nin their English proficiency level. It is\nargued that the same level of proficiency\ncan be achieved by taking a 10-week\nintensive English course outside of the\nuniversity setting.\n2 No relevant counter-argument\n3 Counter-argument 3: If teachers are\nskilled, and if they implement and\nenforce an English-only rule in the\nclassroom, students will find learning\ntheir subject matter in English to be\nmore accessible.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9367","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":44,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Write one or two sentences presenting some background to the issue from the writing task box in your own words. This will help form your introduction.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Write one or two sentences presenting some background to the issue from the writing task box in your own words. This will help form your introduction.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"English-medium universities have been\nspreading across the globe and my country\nis no exception. They became especially\npopular in the early 2000s. This most likely\ncoincides with the spread of the internet\nand the acceleration of globalization.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9368","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":45,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Discuss your position on EMI with a partner. Then state your position in support of or against EMI in your country in a thesis statement. This does not need to be a strong statement if you don't have a strong view. You may have mixed feelings about the issue. If so, you can include some hedging in your thesis statement.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Discuss your position on EMI with a partner. Then state your position in support of or against EMI in your country in a thesis statement. This does not need to be a strong statement if you don't have a strong view. You may have mixed feelings about the issue. If so, you can include some hedging in your thesis statement.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"An English-medium education is likely to be\nhighly beneficial to students, though there\nare some disadvantages to keep in mind.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":28,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":29,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9369","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":46,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Write one or two key sentences for your conclusion. Evaluate the situation or make a tentative prediction about the future.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Write one or two key sentences for your conclusion. Evaluate the situation or make a tentative prediction about the future.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Whether we like it or not, the growth of\nEnglish-medium universities will continue\nfor the foreseeable future. This has the\npotential to greatly benefit students, who\nwill enter the workforce with not only\nthe content expertise they need, but the\nlanguage proficiency as well.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad721 a1b374af019096d2ec11.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[{"page":251,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U10-question:b9372","book":5,"unit":10,"track":"RW","topic":"LANGUAGE","lesson":2,"order":48,"module":"WRITING TASK","ex":"8","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words.","pages":[251],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cce07aada52d949a8ffb386dedc7ac8197c476edd7ef67820f78aef7bc402b64.png"],"provided":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words.","items":[],"layout":"list","references":[{"id":"B05-RW-U10-question:b9363","kind":"student-work","title":"WRITING TASK Ex 1","pages":[250]},{"id":"B05-RW-U10-question:b9365","kind":"student-work","title":"WRITING TASK Ex 2","pages":[251]},{"id":"B05-RW-U10-question:b9366","kind":"student-work","title":"WRITING TASK Ex 3","pages":[251]},{"id":"B05-RW-U10-question:b9367","kind":"student-work","title":"WRITING TASK Ex 4","pages":[251]},{"id":"B05-RW-U10-question:b9368","kind":"student-work","title":"WRITING TASK Ex 5","pages":[251]},{"id":"B05-RW-U10-question:b9369","kind":"student-work","title":"WRITING TASK Ex 6","pages":[251]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"English-medium universities have been\nspreading globally, gaining popularity since\nthe early 2000s. This trend likely coincides\nwith the growth of the internet and\nglobalization. While an English-medium\neducation offers significant benefits, it also\ncomes with challenges.\nOne major advantage is the development\nof English skills. Students at English-\nmedium universities practice reading,\nwriting, listening, and speaking in English\nthroughout their studies. However, research\nshows only a slight improvement in English\nproficiency compared to intensive language\ncourses. A 10-week English course outside\nthe university might yield similar results in\nlanguage development.\nAnother benefit is enhanced employability.\nGraduates who speak multiple languages\nare attractive to employers, especially\ninternational companies. For instance, in a\nscenario where two candidates have equal\nqualifications, the one with additional\nlanguage skills, like English, is more likely\nto be hired, especially if the job involves\ntravel or working with diverse teams.\nHowever, English-medium education\ncan hinder students’ understanding of\ntheir subjects, especially if they are not\nyet fluent in English. Complex academic\ntexts may be difficult to grasp, leading\nto poor comprehension and improper\nuse of resources in assignments. On the\nother hand, skilled instructors who enforce\nEnglish-only rules can make the learning\nprocess smoother for students.\nIn conclusion, while English-medium\nuniversities offer valuable language\nand career benefits, students may face\nchallenges in comprehension and fluency.\nNonetheless, their continued global growth\nsuggests these institutions will remain\nrelevant in the future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":75,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574
