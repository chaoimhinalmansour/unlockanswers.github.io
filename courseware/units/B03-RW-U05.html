ructure an essay (introductory, body and concluding paragraphs)."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":102,"alt":""}}]}},{"id":"B03-RW-U05-classroom:resource:b4944","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/617c693c487e0c7e0fcfa62d3c60e1b2120984bb8990432feeae363ea0b1f032.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"health conscious","pos":"(adj)","definition":"having an active interest in one's health","example":"He is health conscious and checks the amount of sugar in his food.","wordAudio":"health conscious","cardWord":false},{"term":"limit","pos":"(v)","definition":"to control something so that it does not go above a certain level","example":"The school tries to limit the amount of food it wastes.","wordAudio":"limit","cardWord":false},{"term":"molecule","pos":"(n)","definition":"the smallest unit of a substance","example":"A molecule of water contains hydrogen and oxygen.","wordAudio":"molecule","cardWord":false},{"term":"risk","pos":"(n)","definition":"the possibility that something bad will happen","example":"Wet floors increase the risk of a fall.","wordAudio":"risk","cardWord":false},{"term":"dementia","pos":"(n)","definition":"a mental illness suffered especially by old people","example":"The group supports families of people with dementia.","wordAudio":"dementia","cardWord":false},{"term":"filtered","pos":"(adj)","definition":"with the solid parts of a liquid taken out","example":"The café uses filtered water for its coffee.","wordAudio":"filtered","cardWord":false}]]}},{"id":"B03-RW-U05-classroom:video","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3b25d23b8777e659370d09c02b20806abfe09ae37c184b811ba1fb44e57a521d.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/dbff4d541c9928ef8d3809c5-L3RW-U05.mp4","captions":[{"start":1.08,"end":1.84,"text":"Coffee."},{"start":4.02,"end":6.74,"text":"It's one of the world's favorite drinks."},{"start":7.6,"end":10.48,"text":"First farmed in Yemen 500 years ago,"},{"start":11.88,"end":16.06,"text":"coffee is now an important part of many cultures around\nthe globe."},{"start":18.06,"end":21.96,"text":"We drink around two billion cups of the stuff every\nday."},{"start":23.08,"end":24.62,"text":"But until recently,"},{"start":25,"end":28.5,"text":"health -conscious people tried to limit how much coffee\nthey drank."},{"start":29.52,"end":36.54,"text":"Scientific research in the 1980s and 90s suggested\ncoffee could cause serious health problems."},{"start":37.88,"end":38.34,"text":"Happily,"},{"start":38.72,"end":41.5,"text":"scientists today have shown that that research was\nwrong."},{"start":41.78,"end":45.48,"text":"In fact, they now say that coffee is good for our\nhealth."},{"start":46.42,"end":48.92,"text":"It can even help people live longer."},{"start":50.16,"end":50.44,"text":"So,"},{"start":50.86,"end":53.54,"text":"what's in your coffee that's so good for you?"},{"start":54.36,"end":57.06,"text":"Coffee contains a lot of antioxidants."},{"start":58.06,"end":64.06,"text":"These useful molecules help our bodies deal with\ndangerous molecules called free radicals."},{"start":67.1,"end":69.2,"text":"Free radicals can come from pollution."},{"start":70.42,"end":73.36,"text":"But our bodies also produce them as we get older."},{"start":74.9,"end":78.76,"text":"Recent studies show that coffee may reduce the risk of\nheart problems,"},{"start":79.1,"end":81.92,"text":"some cancers, and other serious diseases."},{"start":82.96000000000001,"end":87.5,"text":"The large amounts of antioxidants it contains could be\nthe reason."},{"start":88.52,"end":91.6,"text":"One of the antioxidants in coffee is caffeine,"},{"start":92.3,"end":94.62,"text":"which is well known for giving us energy."},{"start":95.97999999999999,"end":99,"text":"This makes coffee a favorite with some athletes."},{"start":103.84,"end":113.08,"text":"Drinking one or two cups 40 to 60 minutes before a\nworkout can help us exercise for longer, which can help\nus get fitter."},{"start":113.52000000000001,"end":114.78,"text":"And that's not all."},{"start":116.7,"end":119.92,"text":"It actually helps burn more fat from our bodies."},{"start":122.74,"end":126.32,"text":"Caffeine also has a positive effect on our brains."},{"start":128.4,"end":132.52,"text":"It wakes us up, helps us think faster and remember\nmore."},{"start":133.94,"end":137.66,"text":"Research now suggests that it might even help prevent\ndementia."},{"start":138.9,"end":142.26,"text":"For a healthy drink, filtered coffee is best."},{"start":144.28,"end":147.06,"text":"And it's important not to have too much."},{"start":149.1,"end":152.86,"text":"Up to five cups of coffee a day is the recommended\namount."},{"start":153.26,"end":156.26,"text":"Or at least that's what science says at the moment."},{"start":158.32,"end":162.96,"text":"Who knows what we may discover about the world's\nfavorite drink in the future?"}],"launchInline":true}},{"id":"B03-RW-U05-classroom:material:RW-M03","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[107,109],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c5e5556809d7ecfee3e9b8af386ef7f2e14d6e98a3f3313b0ac2092423583d8.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47a9f35a9c95130086a7c992ae4a9e34c69eb52a896053fa10e755aa981edcda.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.","sourcePage":107},{"body":"2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.","sourcePage":107},{"body":"3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.","sourcePage":107},{"body":"4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  ","sourcePage":107},{"body":"5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]","sourcePage":107},{"body":"[IMAGE_1]","sourcePage":109}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U05-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":107,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c5e5556809d7ecfee3e9b8af386ef7f2e14d6e98a3f3313b0ac2092423583d8.png","width":772,"height":1040},{"page":109,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47a9f35a9c95130086a7c992ae4a9e34c69eb52a896053fa10e755aa981edcda.png","width":772,"height":1040}],"source":107,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.","sourcePage":107},{"body":"2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.","sourcePage":107},{"body":"3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.","sourcePage":107},{"body":"4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  ","sourcePage":107},{"body":"5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]","sourcePage":107},{"body":"[IMAGE_1]","sourcePage":109}],"text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.\n2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.\n3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.\n4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  \n5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]\n[IMAGE_1]","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_37e834aa38c05336.mp3"},"original":{"id":"B03-RW-U05-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U05","book":3,"track":"RW","unit":5,"title":"READING 1","kind":"material","pages":[107,109],"sourceImages":[{"page":107,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c5e5556809d7ecfee3e9b8af386ef7f2e14d6e98a3f3313b0ac2092423583d8.png","viewEvidenceReported":true},{"page":109,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47a9f35a9c95130086a7c992ae4a9e34c69eb52a896053fa10e755aa981edcda.png","viewEvidenceReported":true}],"text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.\n\n2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.\n\n3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.\n\n4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  \n5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n\n[IMAGE_1]\n[IMAGE_1]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b4954","b4970"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_37e834aa38c05336.mp3","continueOnPage":true}},{"id":"B03-RW-U05-classroom:material:RW-M04","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[110,111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6c5e9518e662c12b98988a9c056be5bdf014eb2e46d3a26e34f22b5c9f95c8a2.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.","sourcePage":110},{"body":"On the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","sourcePage":111}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U05-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":110,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png","width":772,"height":1040},{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6c5e9518e662c12b98988a9c056be5bdf014eb2e46d3a26e34f22b5c9f95c8a2.png","width":772,"height":1040}],"source":110,"embeddedIn":null,"photo":null,"clearPages":[{"body":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.","sourcePage":110},{"body":"On the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","sourcePage":111}],"text":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.\nOn the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2437fdee63bf7e2a.mp3"},"original":{"id":"B03-RW-U05-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U05","book":3,"track":"RW","unit":5,"title":"READING 2","kind":"material","pages":[110,111],"sourceImages":[{"page":110,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png","viewEvidenceReported":true},{"page":111,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6c5e9518e662c12b98988a9c056be5bdf014eb2e46d3a26e34f22b5c9f95c8a2.png","viewEvidenceReported":true}],"text":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.\nOn the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b4974","b4975"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2437fdee63bf7e2a.mp3","continueOnPage":true}},{"id":"B03-RW-U05-classroom:review-1","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ce1e25c0351935556aee2e3fb04b8e73cc49fa51e7b6a31b866dff0ec838b87e.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-RW-U05-B-001","form":"active","page":123},{"id":"B03-RW-U05-B-002","form":"advertising campaign","page":123},{"id":"B03-RW-U05-B-003","form":"balanced diet","page":123},{"id":"B03-RW-U05-B-004","form":"calories","page":123},{"id":"B03-RW-U05-B-005","form":"campaign","page":123},{"id":"B03-RW-U05-B-006","form":"educational programme","page":123},{"id":"B03-RW-U05-B-007","form":"healthy lifestyle","page":123},{"id":"B03-RW-U05-B-008","form":"heart disease","page":123},{"id":"B03-RW-U05-B-009","form":"junk food","page":123},{"id":"B03-RW-U05-B-010","form":"life expectancy","page":123},{"id":"B03-RW-U05-B-011","form":"moderate","page":123},{"id":"B03-RW-U05-B-013","form":"obesity","page":123},{"id":"B03-RW-U05-B-014","form":"physical activity","page":123},{"id":"B03-RW-U05-B-016","form":"recognize","page":123},{"id":"B03-RW-U05-B-017","form":"regular exercise","page":123},{"id":"B03-RW-U05-B-018","form":"self-esteem","page":123},{"id":"B03-RW-U05-B-019","form":"serious","page":123},{"id":"B03-RW-U05-B-020","form":"serious illness","page":123},{"id":"B03-RW-U05-B-021","form":"suffer" function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){

function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};

  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));

function taskTable(table,feedback){

 }).join("")+'</tr>').join("");

function splitPanels(groups){

function materialSplit(decks,task,feedback){

function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");

}

 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
