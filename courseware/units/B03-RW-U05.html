se,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{"B03-RW-U05-question:b4957":{"basis":"已核对教材原题和教师资料。","rows":{},"textFills":[{"part":0,"block":0,"text":"a But I can't afford gym membership! ____","values":["3"]},{"part":0,"block":1,"text":"b Exercise regularly to stay healthy. ____","values":["1"]},{"part":0,"block":2,"text":"c But I don't have time! ____","values":["5"]},{"part":0,"block":3,"text":"d Get out of your chair! ____","values":["2"]},{"part":0,"block":4,"text":"e Exercise can be free. ____","values":["4"]}]}},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B03-RW-U05-classroom:material:RW-M03":[{"body":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who","sourcePage":107,"blocks":[{"kind":"text","text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who"}]},{"body":"exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.","sourcePage":107,"blocks":[{"kind":"text","text":"exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality."}]},{"body":"2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort","sourcePage":107,"blocks":[{"kind":"text","text":"2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort"}]},{"body":"to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.","sourcePage":107,"blocks":[{"kind":"text","text":"to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week."}]},{"body":"3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton","sourcePage":107,"blocks":[{"kind":"text","text":"3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton"}]},{"body":"at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.","sourcePage":107,"blocks":[{"kind":"text","text":"at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too."}]},{"body":"4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of","sourcePage":107,"blocks":[{"kind":"text","text":"4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of"}]},{"body":"running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!","sourcePage":107,"blocks":[{"kind":"text","text":"running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!"}]},{"body":"5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or","sourcePage":107,"blocks":[{"kind":"text","text":"5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or"}]},{"body":"three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time\n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently","sourcePage":107,"blocks":[{"kind":"text","text":"three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier."},{"kind":"text","text":"$^{1}$ chronic disease (n) an illness that lasts a long time"},{"kind":"text","text":"$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently"}]},{"body":"$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged\n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]","sourcePage":107,"blocks":[{"kind":"text","text":"$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged"},{"kind":"text","text":"$^{4}$ life expectancy (n) the number of years that a person can expect to live"},{"kind":"text","text":"[IMAGE_1]"}]},{"body":"[IMAGE_1]","sourcePage":109,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]}],"B03-RW-U05-classroom:material:RW-M04":[{"body":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around","sourcePage":110,"blocks":[{"kind":"text","text":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around"}]},{"body":"2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish,","sourcePage":110,"blocks":[{"kind":"text","text":"2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish,"}]},{"body":"eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all\nknow, exercise burns calories.","sourcePage":110,"blocks":[{"kind":"text","text":"eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all"},{"kind":"text","text":"know, exercise burns calories."}]},{"body":"On the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant","sourcePage":111,"blocks":[{"kind":"text","text":"On the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant"}]},{"body":"chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make","sourcePage":111,"blocks":[{"kind":"text","text":"chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make"}]},{"body":"junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","sourcePage":111,"blocks":[{"kind":"text","text":"junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction de":"choice","option":0,"note":"The writer describes successful anti-smoking campaigns."},"b4982.i04":{"mode":"choice","option":1,"note":"Each person should also make time for exercise."},"b4982.i05":{"mode":"choice","option":1,"note":"Individuals and governments must both take action."}},"basis":"教材第 112 页与教师书 PDF 第 46 页。判断与支撑句从同篇阅读按五项定位。","rewriteKey":""},"B03-RW-U05-question:b4991":{"rows":{},"basis":"教材第 113 页与教师书 PDF 第 46 页。根据完整段落逐个定位词库八个动词的名词形式。","replaceBlocks":[{"part":0,"block":2,"blocks":[{"kind":"text","text":"The first step in a campaign against childhood obesity is the recognition that this is a real problem. With the encouragement of teachers and parents, students' participation in sports and exercise programmes will increase. We also need to support the promotion of educational campaigns to teach children about healthy eating. Governments have an important role to play, too. For example, they can impose a ban on the sale of junk food in schools and on advertisements aimed at children. If we follow these steps, we will soon see a reduction in the rate of obesity among children and teenagers.","answer":{"mode":"text-marks","parts":[{"start":62,"end":73,"underline":true},{"start":112,"end":125,"underline":true},{"start":161,"end":174,"underline":true},{"start":252,"end":261,"underline":true},{"start":407,"end":410,"underline":true},{"start":418,"end":422,"underline":true},{"start":454,"end":468,"underline":true},{"start":533,"end":542,"underline":true}]}}]}],"rewriteKey":""},"B03-RW-U05-question:b4992":{"rows":{"b4992.review1":{"mode":"gap","answer":"ban"}},"basis":"教材第 113 页与教师书 PDF 第 46 页。名词和动词形式均为 ban。","displayPages":[[{"kind":"item","label":"1","id":"b4992.review1","prompt":"____","type":"review/closed","options":[]}]],"itemPatches":{"b4992.review1":{"options":[]}},"rewriteKey":""},"B03-RW-U05-question:b4996":{"rows":{},"basis":"教材第 114 页与教师书 PDF 第 46 页。第一行保留 life expectancy 示例。","tableEdits":[{"part":0,"block":0,"row":2,"cell":1,"answer":"healthy lifestyle"},{"part":0,"block":0,"row":3,"cell":1,"answer":"educational programmes"},{"part":0,"block":0,"row":4,"cell":1,"answer":"heart disease"},{"part":0,"block":0,"row":5,"cell":1,"answer":"physical activity"},{"part":0,"block":0,"row":6,"cell":1,"answer":"advertising campaigns"},{"part":1,"block":0,"row":0,"cell":1,"answer":"serious illness"},{"part":1,"block":0,"row":1,"cell":1,"answer":"balanced diet"},{"part":1,"block":0,"row":2,"cell":1,"answer":"regular exercise"},{"part":1,"block":0,"row":3,"cell":1,"answer":"junk food"}],"rewriteKey":""},"B03-RW-U05-question:b5016":{"rows":{"b5016.i01":{"mode":"indexed-mark","parts":[{"start":93,"end":96}],"note":"C"},"b5016.i02":{"mode":"indexed-mark","parts":[{"start":93,"end":101}],"note":"C"},"b5016.i03":{"mode":"indexed-mark","parts":[{"start":93,"end":100}],"note":"F"},"b5016.i04":{"mode":"indexed-mark","parts":[{"start":93,"end":110}],"note":"F"}},"basis":"教材第 119 页与教师书 PDF 第 48 页。","itemPatches":{"b5016.i01":{"options":[]},"b5016.i02":{"options":[]},"b5016.i03":{"options":[]},"b5016.i04":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B03-RW-U05":{"aspect":1.9472617,"cues":[[1.08,1.84,"Coffee.","来杯咖啡吧"],[4.02,6.74,"It's one of the world's favorite drinks.","是世界最爱的饮料之一。"],[7.6,10.48,"First farmed in Yemen 500 years ago,","500年前第一次在也门耕作"],[11.88,16.06,"coffee is now an important part of many cultures around the globe.","咖啡现在是全球许多文化的重要组成部分。"],[18.06,21.96,"We drink around two billion cups of the stuff every day.","我们每天喝20亿杯左右的东西。"],[23.08,24.62,"But until recently,","不过直到最近"],[25,28.5,"health -conscious people tried to limit how much coffee they drank.","健康 - 人们试图限制他们喝多少咖啡。"],[29.52,36.54,"Scientific research in the 1980s and 90s suggested coffee could cause serious health problems.","20世纪80年代和90年代的科学研究建议咖啡可能会造成严重的健康问题。"],[37.88,38.34,"Happily,","高兴的是，"],[38.72,41.5,"scientists today have shown that that research was wrong.","今天的科学家已经表明，这种研究是错误的。"],[41.78,45.48,"In fact, they now say that coffee is good for our health.","事实上，他们说咖啡对我们的健康有好处。"],[46.42,48.92,"It can even help people live longer.","它甚至可以帮助人们活得更久。"],[50.16,50.44,"So,","这么说吧"],[50.86,53.54,"what's in your coffee that's so good for you?","你的咖啡里有什么对你这么好？"],[54.36,57.06,"Coffee contains a lot of antioxidants.","咖啡中含有大量的抗氧化剂。"],[58.06,64.06,"These useful molecules help our bodies deal with dangerous molecules called free radicals.","这些有用的分子帮助我们的身体处理危险分子，叫做自由基。"],[67.1,69.2,"Free radicals can come from pollution.","自由激进分子可能来自污染。"],[70.42,73.36,"But our bodies also produce them as we get older.","但我们的身体也会随着年龄的增长而产生它们。"],[74.9,78.76,"Recent studies show that coffee may reduce the risk of heart problems,","最近的研究表明，咖啡可以减少心脏病的风险，"],[79.1,81.92,"some cancers, and other serious diseases.","一些癌症和其他严重疾病。"],[82.96000000000001,87.5,"The large amounts of antioxidants it contains could be the reason.","它包含的大量抗氧化剂可能是原因。"],[88.52,91.6,"One of the antioxidants in coffee is caffeine,","咖啡中的抗氧化剂之一是咖啡因，"],[92.3,94.62,"which is well known for giving us energy.","以给我们能量而闻名"],[95.97999999999999,99,"This makes coffee a favorite with some athletes.","这使得咖啡成为一些运动员的最爱。"],[103.84,113.08,"Drinking one or two cups 40 to 60 minutes before a workout can help us exercise for longer, which can help us get fitter.","在锻炼前喝一两杯40到60分钟，可以帮助我们锻炼更长的时间，这可以帮助我们更适合。"],[113.52000000000001,114.78,"And that's not all.","且道不尽。"],[116.7,119.92,"It actually helps burn more fat from our bodies.","它实际上帮助燃烧更多的脂肪从我们的身体。"],[122.74,126.32,"Caffeine also has a positive effect on our brains.","咖啡因也对我们的大脑产生了积极的影响。"],[128.4,132.52,"It wakes us up, helps us think faster and remember more.","它唤醒了我们，帮助我们思考得更快，回忆得更多。"],[133.94,137.66,"Research now suggests that it might even help prevent dementia.","现在的研究表明，它甚至可以帮助预防痴呆症。"],[138.9,142.26,"For a healthy drink, filtered coffee is best.","为了健康饮用，过滤咖啡是最好的。"],[144.28,147.06,"And it's important not to have too much.","并且重要的是不要吃太多。"],[149.1,152.86,"Up to five cups of coffee a day is the recommended amount.","每天最多五杯咖啡是建议量。"],[153.26,156.26,"Or at least that's what science says at the moment.","或者至少科学现在是这样说的。"],[158.32,162.96,"Who knows what we may discover about the world's favorite drink in the future?","谁知道我们将来会发现什么世界上最爱的饮料？"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B03-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ce88f8101cc014447ec8cb0a7de285b0425b76aab1cad9c70db1e6530b855c27.pdf","size":25089866}},"pa    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);

   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
