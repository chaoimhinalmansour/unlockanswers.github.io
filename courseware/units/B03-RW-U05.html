":25,"end":28.5,"text":"health -conscious people tried to limit how much coffee\nthey drank."},{"start":29.52,"end":36.54,"text":"Scientific research in the 1980s and 90s suggested\ncoffee could cause serious health problems."},{"start":37.88,"end":38.34,"text":"Happily,"},{"start":38.72,"end":41.5,"text":"scientists today have shown that that research was\nwrong."},{"start":41.78,"end":45.48,"text":"In fact, they now say that coffee is good for our\nhealth."},{"start":46.42,"end":48.92,"text":"It can even help people live longer."},{"start":50.16,"end":50.44,"text":"So,"},{"start":50.86,"end":53.54,"text":"what's in your coffee that's so good for you?"},{"start":54.36,"end":57.06,"text":"Coffee contains a lot of antioxidants."},{"start":58.06,"end":64.06,"text":"These useful molecules help our bodies deal with\ndangerous molecules called free radicals."},{"start":67.1,"end":69.2,"text":"Free radicals can come from pollution."},{"start":70.42,"end":73.36,"text":"But our bodies also produce them as we get older."},{"start":74.9,"end":78.76,"text":"Recent studies show that coffee may reduce the risk of\nheart problems,"},{"start":79.1,"end":81.92,"text":"some cancers, and other serious diseases."},{"start":82.96000000000001,"end":87.5,"text":"The large amounts of antioxidants it contains could be\nthe reason."},{"start":88.52,"end":91.6,"text":"One of the antioxidants in coffee is caffeine,"},{"start":92.3,"end":94.62,"text":"which is well known for giving us energy."},{"start":95.97999999999999,"end":99,"text":"This makes coffee a favorite with some athletes."},{"start":103.84,"end":113.08,"text":"Drinking one or two cups 40 to 60 minutes before a\nworkout can help us exercise for longer, which can help\nus get fitter."},{"start":113.52000000000001,"end":114.78,"text":"And that's not all."},{"start":116.7,"end":119.92,"text":"It actually helps burn more fat from our bodies."},{"start":122.74,"end":126.32,"text":"Caffeine also has a positive effect on our brains."},{"start":128.4,"end":132.52,"text":"It wakes us up, helps us think faster and remember\nmore."},{"start":133.94,"end":137.66,"text":"Research now suggests that it might even help prevent\ndementia."},{"start":138.9,"end":142.26,"text":"For a healthy drink, filtered coffee is best."},{"start":144.28,"end":147.06,"text":"And it's important not to have too much."},{"start":149.1,"end":152.86,"text":"Up to five cups of coffee a day is the recommended\namount."},{"start":153.26,"end":156.26,"text":"Or at least that's what science says at the moment."},{"start":158.32,"end":162.96,"text":"Who knows what we may discover about the world's\nfavorite drink in the future?"}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 popular 2 health 3 opposite 4 diseases 5 energy","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":44,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4948","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Choose the correct answers.","pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3b25d23b8777e659370d09c02b20806abfe09ae37c184b811ba1fb44e57a521d.png"],"provided":"","items":[{"id":"b4948.i01","label":"1","prompt":"People started growing coffee more than ____ years ago.","options":["500","1000","1500"],"type":"choice/closed"},{"id":"b4948.i02","label":"2","prompt":"Scientists believe that coffee may help protect our bodies from ____ disease.","options":["heart","lung","bone"],"type":"choice/closed"},{"id":"b494 ","label":"g","prompt":"____ (adj) not too much and not too little","options":["serious","self-esteem","active","calories","moderate","recognize","suffer"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a active b suffer c serious d self-esteem\ne calories f recognize g moderate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4953","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"order":8,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Write the names of the types of activity shown in the photos.","pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d13a837d47e70eece456c0f1bb5b2b847ef09d665df9feb76c88203742a518e.png"],"provided":"","items":[{"id":"b4953.i01","label":"1","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a ice skating b tennis c housework / cleaning\nd doing yoga e dancing f jogging / running\ng swimming h cycling","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4956","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"order":9,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Skim the magazine article and circle the best title.","pages":[108],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3485710b83a91cdbda7d81adbca27b51cfecf9557ae8a384b4f4636175b62ff.png"],"provided":"a Get some exercise and lose weight at the same time!\nb Walking to improve your health and mood.\nc Keep fit! It's easier than you might think.","items":[{"id":"b4956.i01","label":"3","prompt":"The best title for the magazine article is","options":["Get some exercise and lose weight at the same time!","Walking to improve your health and mood.","Keep fit! It's easier than you might think."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a Get some exercise and lose weight at the same time!"},{"kind":"text","text":"b Walking to improve your health and mood."},{"kind":"text","text":"c Keep fit! It's easier than you might think."},{"kind":"item","id":"b4956.i01","label":"3","prompt":"The best title for the magazine article is","options":["Get some exercise and lose weight at the same time!","Walking to improve your health and mood.","Keep fit! It's easier than you might think."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B03-RW-U05-classroom:material:RW-M03","title":"READING 1","text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.\n2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.\n3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.\n4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  \n5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]\n[IMAGE_1]","screens":["1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.","2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.","3 Exercise can be expe :"READING 1","text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.\n2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.\n3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.\n4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family toget bs in the box and underline their noun forms in the paragraph.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0de23548cbb7b3c50c9627f5cdb0a571b272c2265c855c8873ade34aa79e764a.png"],"provided":"advertise ban encourage participate\npromote recognize reduce sell\n\nThe first step in a campaign against childhood obesity is the recognition that this is a real problem. With the encouragement of teachers and parents, students' participation in sports and exercise programmes will increase. We also need to support the promotion of educational campaigns to teach children about healthy eating. Governments have an important role to play, too. For example, they can impose a ban on the sale of junk food in schools and on advertisements aimed at children. If we follow these steps, we will soon see a reduction in the rate of obesity among children and teenagers.","items":[{"id":"b4991.i01","label":"1","prompt":"The first step in a campaign against childhood obesity is the recognition that this is a real problem.","options":[],"type":"select/closed"},{"id":"b4991.i02","label":"2","prompt":"With the encouragement of teachers and parents, students' participation in sports and exercise programmes will increase.","options":[],"type":"select/closed"},{"id":"b4991.i03","label":"3","prompt":"We also need to support the promotion of educational campaigns to teach children about healthy eating.","options":[],"type":"select/closed"},{"id":"b4991.i04","label":"4","prompt":"For example, they can impose a ban on the sale of junk food in schools and on advertisements aimed at children.","options":[],"type":"select/closed"},{"id":"b4991.i05","label":"5","prompt":"If we follow these steps, we will soon see a reduction in the rate of obesity among children and teenagers.","options":[],"type":"select/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"advertise ban encourage participate"},{"kind":"text","text":"promote recognize reduce sell"},{"kind":"text","text":"The first step in a campaign against childhood obesity is the recognition that this is a real problem. With the encouragement of teachers and parents, students' participation in sports and exercise programmes will increase. We also need to support the promotion of educational campaigns to teach children about healthy eating. Governments have an important role to play, too. For example, they can impose a ban on the sale of junk food in schools and on advertisements aimed at children. If we follow these steps, we will soon see a reduction in the rate of obesity among children and teenagers."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"The first step in a campaign against childhood obesity\nis the recognition that this a real problem. With the\nencouragement of teachers and parents, students’\nparticipation in sports and exercise programmes will\nincrease. And we need to support the promotion of\neducational campaigns to teach children about healthy\neating. Governments also have an important role to play.\nFor example, they can impose a ban on the sale of junk\nfood in schools and on advertisements aimed at children.\nIf we follow these steps, we will soon see a reduction in\nthe rate of obesity among children and teenagers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4992","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"order":16,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Which word has the same noun and verb form?","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0de23548cbb7b3c50c9627f5cdb0a571b272c2265c855c8873ade34aa79e764a.png"],"provided":"____","items":[{"id":"b4992.i01","label":"1","prompt":"Which word has the same noun and verb form?","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"ban","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4995","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"HEALTH AND FITNESS COLLOCATIONS"},"instruction":"Look at the paragraph and underline ten collocations (noun + noun or adjective + noun) related to health and fitness. The first one has been done for you as an example.","pages":[114],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/699cc8a9378d9478acf6105dfb07ab97182dd9bb94f331c3c3fb94d0f3af9dc8.png"],"provided":"Obesity can reduce life expectancy and lead to serious illness such as heart disease and diabetes. To address this problem, some governments run educational programmes and advertising campaigns. These educate people about the dangers of junk food and the importance of a healthy lifestyle, including a balanced diet. They also promote the benefits of regular exercise, such as walking, cycling, playing team sports or other forms of physical activity.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Obesity can reduce life expectancy and lead to serious illness such as heart disease and diabetes. To address this problem, some governments run educational programmes and advertising campaigns. These educate people about the dangers of junk food and the importance of a healthy lifestyle, including a balanced diet. They also promote the benefits of regular exercise, such as walking, cycling, playing team sports or other forms of physical activity."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Obesity can reduce life expectancy and lead to serious\nillness such as heart disease and diabetes. To address this\nproblem, some governments run educational programmes\nand advertising campaigns. These educate people about\nthe dangers of junk food and the importance of a healthy\nlifestyle, including a balanced diet. They also promote\nthe benefits of regular exercise, such as walking, cycling,\nplaying team sports or other forms of physical activity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4996","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"order":18,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"HEALTH AND FITNESS COLLOCATIONS"},"instruction":"Now complete the table by writing the correct collocation next to the definition.","pages":[114],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f  laws designed to help reduce the obesity problem.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"World Health Organization warns about the increase in obesity"},{"kind":"text","text":"Obesity has become a major problem in many parts of the world. According to the World Health Organization (WHO), in 2016 about 13% of adults, both male and female, were obese. Moreover, the percentage of obese people increased by 300% between 1975 and 2016. Obesity can cause major health problems like heart disease, diabetes, stroke and breathing problems. Tackling obesity is a big task. Whose responsibility should it be? Although some people say it is up to individuals to manage their own weight, others believe governments should take the lead by making laws designed to help reduce the obesity problem."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4971","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":2,"order":20,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Work in small groups. Read the introduction to the news report again. Discuss the questions.","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png"],"provided":"","items":[{"id":"b4971.i01","label":"1","prompt":"Whose responsibility is it to tackle the problem of obesity: the individual's or the government's?","options":[],"type":"discuss/open"},{"id":"b4971.i02","label":"2","prompt":"Do you follow a balanced diet? How many portions of fruit and vegetables do you eat every day?","options":[],"type":"discuss/open"},{"id":"b4971.i03","label":"3","prompt":"Should children learn in school how to understand the nutritional content of the food they eat?","options":[],"type":"discuss/open"},{"id":"b4971.i04","label":"4","prompt":"What can be done to prevent people from eating junk food?","options":[],"type":"discuss/open"},{"id":"b4971.i05","label":"5","prompt":"Are there any health campaigns where you live to deal with the problem of obesity in society?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4971.i01","label":"1","prompt":"Whose responsibility is it to tackle the problem of obesity: the individual's or the government's?","options":[],"type":"discuss/open"},{"kind":"item","id":"b4971.i02","label":"2","prompt":"Do you follow a balanced diet? How many portions of fruit and vegetables do you eat every day?","options":[],"type":"discuss/open"},{"kind":"item","id":"b4971.i03","label":"3","prompt":"Should children learn in school how to understand the nutritional content of the food they eat?","options":[],"type":"discuss/open"},{"kind":"item","id":"b4971.i04","label":"4","prompt":"What can be done to prevent people from eating junk food?","options":[],"type":"discuss/open"},{"kind":"item","id":"b4971.i05","label":"5","prompt":"Are there any health campaigns where you live to deal with the problem of obesity in society?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U05-question:b4973","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":2,"order":21,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"You will now read two body paragraphs from the news report about the problem of obesity. Work in pairs, A and B.","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png"],"provided":"Student A: Read Paragraph 2 aloud for Student B.\nStudent B: Take notes on Paragraph 2. Write down main ideas and details, using headings and bullet points. Ask Student A to spell or repeat any words that you don't understand.\nChange roles. Student B reads Paragraph 3 and Student A takes notes.","items":[{"id":"b4973.i01","label":"1","prompt":"Take notes on Paragraph 2. Write down main ideas and details, using headings and bullet points.","options":[],"type":"gap/open"},{"id":"b4973.i02","label":"2","prompt":"Take notes on Paragraph 3. Write down main ideas and details, using headings and bullet points.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Student A: Read Paragraph 2 aloud for Student B."},{"kind":"text","text":"Student B: Take notes on Paragraph 2. Write down main ideas and details, using headings and bullet points. Ask Student A to spell or repeat any words that you don't understand."},{"kind":"text","text":"Change roles. Student B reads Paragraph 3 and Student A takes notes."},{"kind":"item","id":"b4973.i02","label":"2","prompt":"Take notes on Paragraph 3. Write down main ideas and details, using headings and bullet points.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B03-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.\nOn the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet."," ructure an essay (introductory, body and concluding paragraphs)."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":102,"alt":""}}]}},{"id":"B03-RW-U05-classroom:resource:b4944","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/617c693c487e0c7e0fcfa62d3c60e1b2120984bb8990432feeae363ea0b1f032.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"health conscious","pos":"(adj)","definition":"having an active interest in one's health","example":"He is health conscious and checks the amount of sugar in his food.","wordAudio":"health conscious","cardWord":false},{"term":"limit","pos":"(v)","definition":"to control something so that it does not go above a certain level","example":"The school tries to limit the amount of food it wastes.","wordAudio":"limit","cardWord":false},{"term":"molecule","pos":"(n)","definition":"the smallest unit of a substance","example":"A molecule of water contains hydrogen and oxygen.","wordAudio":"molecule","cardWord":false},{"term":"risk","pos":"(n)","definition":"the possibility that something bad will happen","example":"Wet floors increase the risk of a fall.","wordAudio":"risk","cardWord":false},{"term":"dementia","pos":"(n)","definition":"a mental illness suffered especially by old people","example":"The group supports families of people with dementia.","wordAudio":"dementia","cardWord":false},{"term":"filtered","pos":"(adj)","definition":"with the solid parts of a liquid taken out","example":"The café uses filtered water for its coffee.","wordAudio":"filtered","cardWord":false}]]}},{"id":"B03-RW-U05-classroom:video","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3b25d23b8777e659370d09c02b20806abfe09ae37c184b811ba1fb44e57a521d.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/dbff4d541c9928ef8d3809c5-L3RW-U05.mp4","captions":[{"start":1.08,"end":1.84,"text":"Coffee."},{"start":4.02,"end":6.74,"text":"It's one of the world's favorite drinks."},{"start":7.6,"end":10.48,"text":"First farmed in Yemen 500 years ago,"},{"start":11.88,"end":16.06,"text":"coffee is now an important part of many cultures around\nthe globe."},{"start":18.06,"end":21.96,"text":"We drink around two billion cups of the stuff every\nday."},{"start":23.08,"end":24.62,"text":"But until recently,"},{"start":25,"end":28.5,"text":"health -conscious people tried to limit how much coffee\nthey drank."},{"start":29.52,"end":36.54,"text":"Scientific research in the 1980s and 90s suggested\ncoffee could cause serious health problems."},{"start":37.88,"end":38.34,"text":"Happily,"},{"start":38.72,"end":41.5,"text":"scientists today have shown that that research was\nwrong."},{"start":41.78,"end":45.48,"text":"In fact, they now say that coffee is good for our\nhealth."},{"start":46.42,"end":48.92,"text":"It can even help people live longer."},{"start":50.16,"end":50.44,"text":"So,"},{"start":50.86,"end":53.54,"text":"what's in your coffee that's so good for you?"},{"start":54.36,"end":57.06,"text":"Coffee contains a lot of antioxidants."},{"start":58.06,"end":64.06,"text":"These useful molecules help our bodies deal with\ndangerous molecules called free radicals."},{"start":67.1,"end":69.2,"text":"Free radicals can come from pollution."},{"start":70.42,"end":73.36,"text":"But our bodies also produce them as we get older."},{"start":74.9,"end":78.76,"text":"Recent studies show that coffee may reduce the risk of\nheart problems,"},{"start":79.1,"end":81.92,"text":"some cancers, and other serious diseases."},{"start":82.96000000000001,"end":87.5,"text":"The large amounts of antioxidants it contains could be\nthe reason."},{"start":88.52,"end":91.6,"text":"One of the antioxidants in coffee is caffeine,"},{"start":92.3,"end":94.62,"text":"which is well known for giving us energy."},{"start":95.97999999999999,"end":99,"text":"This makes coffee a favorite with some athletes."},{"start":103.84,"end":113.08,"text":"Drinking one or two cups 40 to 60 minutes before a\nworkout can help us exercise for longer, which can help\nus get fitter."},{"start":113.52000000000001,"end":114.78,"text":"And that's not all."},{"start":116.7,"end":119.92,"text":"It actually helps burn more fat from our bodies."},{"start":122.74,"end":126.32,"text":"Caffeine also has a positive effect on our brains."},{"start":128.4,"end":132.52,"text":"It wakes us up, helps us think faster and remember\nmore."},{"start":133.94,"end":137.66,"text":"Research now suggests that it might even help prevent\ndementia."},{"start":138.9,"end":142.26,"text":"For a healthy drink, filtered coffee is best."},{"start":144.28,"end":147.06,"text":"And it's important not to have too much."},{"start":149.1,"end":152.86,"text":"Up to five cups of coffee a day is the recommended\namount."},{"start":153.26,"end":156.26,"text":"Or at least that's what science says at the moment."},{"start":158.32,"end":162.96,"text":"Who knows what we may discover about the world's\nfavorite drink in the future?"}],"launchInline":true}},{"id":"B03-RW-U05-classroom:material:RW-M03","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[107,109],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c5e5556809d7ecfee3e9b8af386ef7f2e14d6e98a3f3313b0ac2092423583d8.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47a9f35a9c95130086a7c992ae4a9e34c69eb52a896053fa10e755aa981edcda.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.","sourcePage":107},{"body":"2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.","sourcePage":107},{"body":"3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.","sourcePage":107},{"body":"4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  ","sourcePage":107},{"body":"5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]","sourcePage":107},{"body":"[IMAGE_1]","sourcePage":109}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U05-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":107,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c5e5556809d7ecfee3e9b8af386ef7f2e14d6e98a3f3313b0ac2092423583d8.png","width":772,"height":1040},{"page":109,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47a9f35a9c95130086a7c992ae4a9e34c69eb52a896053fa10e755aa981edcda.png","width":772,"height":1040}],"source":107,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.","sourcePage":107},{"body":"2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.","sourcePage":107},{"body":"3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.","sourcePage":107},{"body":"4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  ","sourcePage":107},{"body":"5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]","sourcePage":107},{"body":"[IMAGE_1]","sourcePage":109}],"text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.\n2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.\n3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.\n4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  \n5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n[IMAGE_1]\n[IMAGE_1]","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_37e834aa38c05336.mp3"},"original":{"id":"B03-RW-U05-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U05","book":3,"track":"RW","unit":5,"title":"READING 1","kind":"material","pages":[107,109],"sourceImages":[{"page":107,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0c5e5556809d7ecfee3e9b8af386ef7f2e14d6e98a3f3313b0ac2092423583d8.png","viewEvidenceReported":true},{"page":109,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47a9f35a9c95130086a7c992ae4a9e34c69eb52a896053fa10e755aa981edcda.png","viewEvidenceReported":true}],"text":"1 How much physical activity do you do in a week? Are you getting enough exercise? Regular activity benefits your health in many ways. For example, people who exercise regularly are less likely to suffer from many chronic diseases $^{1}$ , such as heart disease, type 2 diabetes $^{2}$ , stroke $^{3}$ and some cancers. Experts say adults who exercise for just 150 minutes a week can reduce their risk of serious illness by 50%. In addition, regular exercise increases life expectancy $^{4}$ and reduces the risk of early death by 30%. It also improves your mood, self-esteem and sleep quality.\n\n2 Today, most adults are much less active than in the past because our jobs are far less physical than the work our grandparents used to do. In fact, many of us spend seven hours or more just sitting in a chair each day. This lack of regular physical activity means that people burn fewer calories than in the past, so we need to make an extra effort to use up excess energy. According to experts, adults need to do two and a half hours of moderate exercise per week. This could be fast walking or cycling on a flat road. In addition, it is important to do exercises to strengthen muscles two or three times a week.\n\n3 Exercise can be expensive, but it doesn't have to be. Team sports, such as football or basketball, can be cheap because all the players share the cost of the field or court. Joining a recreational sports league is usually an inexpensive way of getting exercise and can be very social, too. Local leisure centres usually offer squash and badminton at low rates if you book a court at off-peak times, and you may be able to get a reduced-price gym membership, too.\n\n4 If you don't want to spend any money at all, try one of the following activities. Go for a run; the only equipment you need is a pair of running shoes. If you take the bus, try getting off one stop early and walking the extra distance. Go to the park. Try getting a group of friends or family together for a game of football, or play the kinds of running games you haven't played since you were a child. This is a great way to involve the whole family and also help you keep fit. Alternatively, if you want to stay at home, gardening or doing housework are great ways to keep fit, and you can enjoy the benefit of a nice garden and a tidy house, too!  \n5 Although adults should do two and a half hours of exercise a week, you don't have to do it all at one time. Split the time into ten-minute chunks! If you do ten minutes before work, ten minutes during your lunch break and ten minutes after work, five days a week, you've achieved the target! You could also go swimming during your lunch hour two or three times a week and you've done it! In brief, there are many easy ways of keeping fit. If we all recognize the value of doing this, we will live longer and be healthier.\n\n$^{1}$ chronic disease (n) an illness that lasts a long time  \n$^{2}$ diabetes (n) a disease in which the body is not able to use sugar efficiently  \n$^{3}$ stroke (n) a medical condition in which blood cannot reach the brain and the brain becomes damaged  \n$^{4}$ life expectancy (n) the number of years that a person can expect to live\n\n[IMAGE_1]\n[IMAGE_1]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b4954","b4970"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_37e834aa38c05336.mp3","continueOnPage":true}},{"id":"B03-RW-U05-classroom:material:RW-M04","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[110,111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6c5e9518e662c12b98988a9c056be5bdf014eb2e46d3a26e34f22b5c9f95c8a2.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.","sourcePage":110},{"body":"On the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","sourcePage":111}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U05-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":110,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png","width":772,"height":1040},{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6c5e9518e662c12b98988a9c056be5bdf014eb2e46d3a26e34f22b5c9f95c8a2.png","width":772,"height":1040}],"source":110,"embeddedIn":null,"photo":null,"clearPages":[{"body":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.","sourcePage":110},{"body":"On the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","sourcePage":111}],"text":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.\nOn the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2437fdee63bf7e2a.mp3"},"original":{"id":"B03-RW-U05-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U05","book":3,"track":"RW","unit":5,"title":"READING 2","kind":"material","pages":[110,111],"sourceImages":[{"page":110,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dfe66bf0a05f0bce67eec68640b08c316085f6a8945a42c41e9d68e9a8e96315.png","viewEvidenceReported":true},{"page":111,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6c5e9518e662c12b98988a9c056be5bdf014eb2e46d3a26e34f22b5c9f95c8a2.png","viewEvidenceReported":true}],"text":"On the one hand, many people insist that individuals are the ones who need to take the major responsibility for controlling their own weight. Supporters of this position have explained how we can do this. First, we can control the size of the portions we eat. An average man needs around 2,500 calories per day, while an average woman requires around 2,000. Moreover, we should learn how to eat a balanced diet consisting of a variety of foods in order to maintain a healthy weight. In many Western countries, for example, a typical healthy diet might include approximately 50% fruit and vegetables; 30% carbohydrates, such as bread, rice, potatoes and pasta; 15% proteins, for example, meat, fish, eggs and beans; and around 5% dairy products (e.g., milk and cheese). Next, we all need to read the nutritional information on food packaging. This would help us to control our intake of unhealthy ingredients like sugar and saturated fats and make intelligent food choices. And finally, each of us should make time to exercise because, as we all know, exercise burns calories.\nOn the other hand, some people insist that individual efforts to control obesity often end in failure. They argue that governments should take the lead in fighting obesity. They propose a number of measures. First, many countries already have laws requiring nutritional information on packaged foods. Supporters of this law think large restaurant chains should also list calorie counts, as well as the amount of cholesterol, on their menus. This information can help customers choose low-calorie, nutritious food even when they are not cooking at home. Next, many people support a tax on foods which are high in fat and sugar, such as pizza, crisps, chocolate and sweets. Such a tax would make junk food too expensive for people to buy in large quantities. Finally, many people strongly believe that governments should support educational campaigns to encourage people to eat a low-calorie, balanced diet.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b4974","b4975"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2437fdee63bf7e2a.mp3","continueOnPage":true}},{"id":"B03-RW-U05-classroom:review-1","book":3,"unit":5,"track":"RW","topic":"HEALTH AND FITNESS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ce1e25c0351935556aee2e3fb04b8e73cc49fa51e7b6a31b866dff0ec838b87e.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-RW-U05-B-001","form":"active","page":123},{"id":"B03-RW-U05-B-002","form":"advertising campaign","page":123},{"id":"B03-RW-U05-B-003","form":"balanced diet","page":123},{"id":"B03-RW-U05-B-004","form":"calories","page":123},{"id":"B03-RW-U05-B-005","form":"campaign","page":123},{"id":"B03-RW-U05-B-006","form":"educational programme","page":123},{"id":"B03-RW-U05-B-007","form":"healthy lifestyle","page":123},{"id":"B03-RW-U05-B-008","form":"heart disease","page":123},{"id":"B03-RW-U05-B-009","form":"junk food","page":123},{"id":"B03-RW-U05-B-010","form":"life expectancy","page":123},{"id":"B03-RW-U05-B-011","form":"moderate","page":123},{"id":"B03-RW-U05-B-013","form":"obesity","page":123},{"id":"B03-RW-U05-B-014","form":"physical activity","page":123},{"id":"B03-RW-U05-B-016","form":"recognize","page":123},{"id":"B03-RW-U05-B-017","form":"regular exercise","page":123},{"id":"B03-RW-U05-B-018","form":"self-esteem","page":123},{"id":"B03-RW-U05-B-019","form":"serious","page":123},{"id":"B03-RW-U05-B-020","form":"serious illness","page":123},{"id":"B03-RW-U05-B-021","form":"suffer"
