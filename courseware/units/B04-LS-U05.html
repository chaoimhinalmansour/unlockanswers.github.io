f cities around the world.","options":["T (true)","F (false)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/b5e021e186d4f75c141fac08-L4LS-U05.mp4","captions":[{"start":1.32,"end":4.26,"text":"New York City may have made them famous,"},{"start":4.9,"end":8.22,"text":"but skyscrapers were born in Chicago, Illinois."},{"start":13.14,"end":23.96,"text":"A terrible fire in 1871 made it possible for architects\nto experiment with new building techniques that would\nallow them to make buildings taller than ever before."},{"start":26.62,"end":31.96,"text":"These stately brownstone buildings are some of the\nworld's first skyscrapers."},{"start":34.32,"end":35.1,"text":"Louis Sullivan,"},{"start":35.56,"end":37.78,"text":"known as the father of the skyscraper,"},{"start":38.2,"end":39.66,"text":"lived and worked in Chicago."},{"start":43,"end":46.42,"text":"This is his auditorium building on Michigan Avenue,"},{"start":47.62,"end":49.2,"text":"completed in 1889."},{"start":50.58,"end":57.34,"text":"Sullivan believed that the new social and economic\nstrength of the United States required a new\narchitecture."},{"start":61.64,"end":68.28,"text":"And his idea that tall buildings represent power is\nstill popular 125 years later."},{"start":69.7,"end":75.88,"text":"Sullivan described the skyscraper as the perfect symbol\nof the proud spirit of the American man."},{"start":76.62,"end":80.02,"text":"But it was really the symbol of the proud American\nbusinessman."},{"start":82.98,"end":84.1,"text":"By 1920,"},{"start":84.5,"end":88.4,"text":"there were over 300 ,000 corporations in the United\nStates,"},{"start":88.92,"end":92.74000000000001,"text":"serving 100 million consumers in an enormous single\nmarket."},{"start":94.08,"end":98.82,"text":"It was the biggest, most powerful economy the world had\never seen."},{"start":105.46000000000001,"end":106.14,"text":"Above all,"},{"start":106.53999999999999,"end":109.52000000000001,"text":"skyscrapers represented American corporate success."},{"start":110.1,"end":112.58,"text":"They changed the appearance of American cities."},{"start":113.3,"end":117.46000000000001,"text":"The skylines of New York and Chicago looked like bar\ncharts or graphs,"},{"start":117.8,"end":121.9,"text":"with the tallest buildings representing the richest,\nmost powerful companies."},{"start":122.74,"end":126.56,"text":"And the same is still true in cities around the world\ntoday,"},{"start":127.02,"end":128.36,"text":"from Dubai to Shanghai,"},{"start":128.98,"end":130.76,"text":"from Seoul to Kuala Lumpur."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F (Skyscrapers originated in Chicago.) 2 T\n3 F (The first skyscraper was completed in 1889.) 4  T 5  T","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":45,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6166","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Complete the notes.","pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c067e14dc1ebffa5af7a497e8546c10635cf8aa9f289977c4e12f15ef456e510.png"],"provided":"Architects began to experiment with new buildings after\n\n(1)\n\nWhere Louis Sullivan lived and worked: (2).\n\nWhere Auditorium Building is located: (3)\n\nIn 1920, 100 million consumers were served by (4)____.\n\nTall buildings repre esents the\ncountry’s rich culture. To me, it represents\nnational pride and the importance of\npreserving cultural identity.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6170","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":7,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a conversation between two property developers. Before you listen, read the sentences and write the correct form of the words in bold next to the definitions (a–h).","pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b4679f90b51f2af24c18699dbedeae22d1dfb8a8d5d7449b721a3fbce9486e7.png"],"provided":"1 I prefer contemporary buildings to old ones built several years ago. I certainly prefer living in them.\n2 There are a few buildings in my town that have the potential to be nicer than they currently are. One is a potential arts centre.\n3 I would like to transform the design of my current home so that it looks completely different.\n4 Where I live, companies have obtained old fact s the statements in Exercise 1. Say whether or not you agree with them and give reasons.","pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b4679f90b51f2af24c18699dbedeae22d1dfb8a8d5d7449b721a3fbce9486e7.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U05-question:b6170","kind":"material-reference","title":"LISTENING 1 Ex 1","pages":[106]}],"materials":[],"coursePages":[[{"kind":"text","text":"I prefer contemporary buildings to old ones built several years ago."},{"kind":"text","text":"There are a few buildings in my town that have the potential to be nicer than they currently are."},{"kind":"text","text":"I would like to transform the design of my current home so that it looks completely different."},{"kind":"text","text":"Where I live, companies have obtained old factory or industrial buildings and turned them into luxury apartments."},{"kind":"text","text":"The buildings near where I live have some beautiful architectural features, like statues on the roof and Greek-style columns."}],[{"kind":"text","text":"There are some buildings in my area which are in such a bad condition that they look like they are going to collapse."},{"kind":"text","text":"I anticipate that property will rise in value in the next ten years."}]],"courseMaterials":[{"id":"B04-LS-U05-publisher-sheet:b6170","title":"LISTENING 1 Ex 1 原题面","pages":[106],"text":"1 I prefer contemporary buildings to old ones built several years ago. I certainly prefer living in them.\n2 There are a few buildings in my town that have the potential to be nicer than they currently are. One is a potential arts centre.\n3 I would like to transform the design of my current home so that it looks completely different.\n4 Where I live, companies have obtained old factory or industrial buildings and turned them into luxury apartments.\n5 The buildings near where I live have some beautiful a ces":[{"page":106,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b4679f90b51f2af24c18699dbedeae22d1dfb8a8d5d7449b721a3fbce9486e7.png"}],"kind":"task_sheet","sourceBlockIds":["b6170"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I prefer contemporary buildings,\nas they have been built to modern\nstandards. Older buildings may be less\nenergy efficient, for example, or need\nto be repaired frequently. / No, I prefer\nolder buildings. They are usually more\ninteresting to look at, and are important\nreminders of the past.\n2 There is an old cinema near me that\nclosed down a few years ago. It has the\npotential to be used as a cinema again\nor it could be a theatre. I don’t know\nwhy the city council doesn’t allow it. /\nMy town is very new; in fact, some of the\nbuildings are still being completed, so I\ndon’t think there is the potential for this\nat the moment, although there is one\narea that could be a potential skatepark.\n3 I would like to do this, although as I am\nrenting my apartment, it isn’t possible.\nIt would be great if I could knock down\nthe wall between my living room and\nthe kitchen to make one big area, for\nexample. / I wouldn’t like to do this. My\napartment has a brand-new design and I\nam very happy with it.\n4 The area I live in used to have some\nold factories. I don’t know which\ncompany obtained them, but one was\nturned into a school. A few others are\nnow nice-looking apartment buildings.\n/ Where I live, it’s more common for\ncompanies to construct completely new\nbuildings rather than use or redesign\nexisting ones.\n5 This is true. Some of them have beautiful\nstatues on the roof, if you look closely! /\nThis isn’t really true. The buildings in my\narea were built at a time when people\nweren’t interested in making things look\ninteresting or beautiful.\n6 All the buildings in my area are very\nnew and have been built very well.\nSo no, this is not true. / Unfortunately,\nthis is true of my area. I wish the local\nauthorities would do something, as\nsome of the buildings are in very bad\ncondition and could be replaced with\nsomething more useful.\n7 This is likely to be true, as this is what\nhappened over the last decade. / I don’t\nknow whether this is true or not. It might\nbe more likely that they stay roughly the\nsame value as now.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":12,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6172","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":9,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Think of a part of your town or city (or a city you know in your country) that has been transformed in recent years. Work with a partner and describe it.","pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4b4679f90b51f2af24c18699dbedeae22d1dfb8a8d5d7449b721a3fbce9486e7.png"],"provided":"1 Explain what the area used to be like.\n2 Describe the changes and whether or not you like them.\n3 Say whether any of its old features have remained.","items":[{"id":"b6172.i01","label":"1","prompt":"Explain what the area used to be like.","options":[],"type":"discuss/open"},{"id":"b6172.i02","label":"2","prompt":"Describe the changes and whether or not you like them.","options":[],"type":"discuss/open"},{"id":"b6172.i03","label":"3","prompt":"Say whether any of its old features have remained.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Explain what the area used to be like."},{"kind":"text","text":"2 Describe the changes and whether or not you like them."},{"kind":"text","text":"3 Say whether any of its old features have remained."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"There’s one part of my city which used to\nbe one of the largest ports in the country. It\nused to be full of industry and ships. When\nthat industry declined, many factories and\nbusinesses closed down, and the whole\narea was forgotten about. Many buildings\nwere left empty, and their condition got\nreally bad. However, in recent years, a lot\nof money has been spent on transforming\nthe area. New apartment buildings have\nbeen built, which I think is great, along\nwith new transport links into the centre of\nthe city. A new shopping mall and even an\nopera house have been constructed there.\nIt’s become a great place to live and visit.\nA few of the old, historical buildings have\nremained, so the past hasn’t been entirely\nforgotten. One old port building has been\nturned into a museum, which people can\nvisit and learn about the area’s history. It’s\nfascinating to go there and see photos of\nhow the area used to look.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":46,"title":"教师书"},{"source":"https://r pt":"What should happen to the old warehouse building, according to each developer?","options":[],"type":"qa/open"},{"id":"b6176.i05","label":"5","prompt":"What could the warehouse offer, according to one developer?","options":[],"type":"qa/open"}],"layout":"list","references":[{"id":"B04-LS-U05-question:b6175","kind":"student-work","title":"LISTENING 1 Ex 5","pages":[107]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6176.i01","label":"1","prompt":"At the beginning of the conversation, did both developers agree about the building development in Westside?","options":[],"type":"qa/open"},{"kind":"item","id":"b6176.i02","label":"2","prompt":"What is happening in Westside at the moment?","options":[],"type":"qa/open"},{"kind":"item","id":"b6176.i03","label":"3","prompt":"What has happened over the last 20 years?","options":[],"type":"qa/open"},{"kind":"item","id":"b6176.i04","label":"4","prompt":"What should happen to the old warehouse building, according to each developer?","options":[],"type":"qa/open"},{"kind":"item","id":"b6176.i05","label":"5","prompt":"What could the warehouse offer, according to one developer?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 No, at the beginning of the\nconversation, only one developer\nthought a building development in\nWestside was a good idea.\n2 There is a lot of development going on\nin Westside. Rents are low.\n3 There has not been much investment\nin the area in the past 20 years. The\narea has become ugly and the existing\nbuilding hasn’t been used at all.\n4 One developer thinks the best idea is to\nknock down the warehouse and replace it\nwith a more modern building. The other\nsuggests that it should be renovated,\nkeeping some of its existing features.\n5 The building could offer floor space for\nsome shops, and some space could be\nadded on the top floor for flats and offices.","references":[{"source":"https://raw.githubusercontent.com/ ISCUSSION"},"instruction":"Work with a partner. Give your opinions from Exercise 13. Show where your opinions are different by emphasizing key words.","pages":[109],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a820410d330548d537545aecbcb2acb3269b7561fdb8866c22aa22acd04e39a.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U05-question:b6186","kind":"student-work","title":"LISTENING 1 Ex 13","pages":[109]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6188","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":21,"module":"LISTENING 1","ex":"15","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Write a short essay to follow the introduction below. Complete the introduction with your own opinion. Then write three extra paragraphs of 40–60 words each.","pages":[109],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a820410d330548d537545aecbcb2acb3269b7561fdb8866c22aa22acd04e39a.png"],"provided":"There are many cities around the world which have historical areas which were once important and beautiful. Many contain buildings which are badly in need of renovation. In this essay, I will discuss whether or not historical areas should be protected or transformed, before concluding that ____\n\n- Paragraph 2: State arguments supporting idea 1 in Exercise 13.\n- Paragraph 3: State arguments supporting idea 2 in Exercise 13.\n- Paragraph 4: Give your own view about which idea is best.","items":[{"id":"b6188.i01","label":"Introduction","prompt":"In this essay, I will discuss whether or not historical areas should be protected or transformed, before concluding that ____","options":[],"type":"discuss/open"},{"id":"b6188.i02","label":"Paragraph 2","prompt":"State arguments supporting idea 1 in Exercise 13.","options":[],"type":"discuss/open"},{"id":"b6188.i03","label":"Paragraph 3","prompt":"State arguments supporting idea 2 in Exercise 13.","options":[],"type":"discuss/open"},{"id":"b6188.i04","label":"Paragraph 4","prompt":"Give your own view about which idea is best.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"There are many cities around the world which have historical areas which were once important and beautiful. Many contain buildings which are badly in need of renovation. In this essay, I will discuss whether or not historical areas should be protected or transformed, before concluding that ____"},{"kind":"text","text":"- Paragraph 2: State arguments supporting idea 1 in Exercise 13."},{"kind":"text","text":"- Paragraph 3: State arguments supporting idea 2 in Exercise 13."},{"kind":"text","text":"- Paragraph 4: Give your own view about which idea is best."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"There are many cities around the world\nwhich have historical areas which were\nonce important and beautiful. Many\ncontain buildings which are badly in need\nof development. In this essay, I will discuss\nwhether or not historical areas should\nbe transformed or protected, before\nconcluding that we should, in fact, try to\npreserve historical areas where possible.\nMany people argue that it is better\nto spend money on creating modern\nbuildings, and not try to recreate the\npast. In most cases, the buildings in\nhistorical parts of cities were created for a\nspecific purpose. These might have been\nconnected to industry or the different\nbusiness needs of the past. These needs\nare often no longer relevant.\nHowever, other people argue that we should\nprotect old buildings and make sure that\nfuture generations can enjoy them. They are\nan important part of our history. They make\nour cities more interesting and beautiful to\nlive in, and they can also attract tourists.\nIn conclusion, my view is that we should\npreserve the historical parts of our cities,\ndespite the cost. There is a need for\nmodern, practical buildings, but these can\nbe created elsewhere, in places where\nthere is no historical background. Historical\nbuildings are an important part of our\nshared culture, and once these are lost,\nthere is no way of getting them back.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6191","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Complete the predictions by inserting the adverbs in brackets.","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/622d90cd00398d83e0229983d83eb52ece36790953b7b2bd10624f6cd27ddc4e.png"],"provided":"","items":[{"id":"b6191.i01","label":"1","prompt":"There are lots of big skyscrapers in the world. There are going to be even bigger ones in the future. (definitely)","options":[],"type":"gap/open"},{"id":"b6191.i02","label":"2","prompt":"My city isn't going to change much in the next few years. (probably)","options":[],"type":"gap/open"},{"id":"b6191.i03","label":"3","prompt":"I will move to a new apartment or house soon. (probably)","options":[],"type":"gap/open"},{"id":"b6191.i04","label":"4","prompt":"Many improvements are being made in my part of town. House prices will go up. (maybe)","options":[],"type":"gap/open"},{"id":"b6191.i05","label":"5","prompt":"There won't be any new shopping centres in my town in the next few years. (certainly)","options":[],"type":"gap/open"},{"id":"b6191.i06","label":"6","prompt":"In the past, buildings were very decorative. This style of building will come back again one day. (perhaps)","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6191.i01","label":"1","prompt":"There are lots of big skyscrapers in the world. There are going to be even bigger ones in the future. (definitely)","options":[],"type":"gap/open"},{"kind":"item","id":"b6191.i02","label":"2","prompt":"My city isn't going to change much in the next few years. (probably)","options":[],"type":"gap/open"},{"kind":"item","id":"b6191.i03","label":"3","prompt":"I will move to a new apartment or house soon. (probably)","options":[],"type":"gap/open"},{"kind":"item","id":"b6191.i04","label":"4","prompt":"Many improvements are being made in my part of town. House prices will go up. (maybe)","options":[],"type":"gap/open"},{"kind":"item","id":"b6191.i05","label":"5","prompt":"There won't be any new shopping centres in my town in the next few years. (certainly)","options":[],"type":"gap/open"},{"kind":"item","id":"b6191.i06","label":"6","prompt":"In the past, buildings were very decorative. This style of building will come back again one day. (perhaps)","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 There are lots of big skyscrapers in the world. There are\ndefinitely going to be even bigger ones in the future.\n2 My city probably isn’t going to change much in the\nnext few years. / My city is probably not going to change\nmuch in the next few years.\n3 I will probably move to a new apartment or house soon.\n4 Many improvements are being made in my part of\ntown. Maybe house prices will go up.\n5 There certainly won’t be any new shopping centres in\nmy town in the next few years.\n6 In the past, buildings were very decorative. Perhaps this\nstyle of building will come back again one day.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6192","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Which predictions in Exercise 1 do you agree with? How would you use adverbs to change the ones you disagree with?","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/622d90cd00398d83e0229983d83eb52ece36790953b7b2bd10624f6cd27ddc4e.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U05-question:b6191","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[110]}],"materials":[],"coursePages":[[{"kind":"text","text":"There are lots of big skyscrapers in the world. There are going to be even bigger ones in the future. (definitely)"},{"kind":"text","text":"My city isn't going to change much in the next few years. (probably)"},{"kind":"text","text":"I will move to a new apartment or house soon. (probably)"},{"kind":"text","text":"Many improvements are being made in my part of town. House prices will go up. (maybe)"},{"kind":"text","text":"There won't be any new shopping centres in my town in the next few years. (certainly)"},{"kind":"text","text":"In the past, buildings were very decorative. This style of building will come back again one day. (perhaps)"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 There are lots of big skyscrapers in the\nworld. There are probably going to be\neven bigger ones in the future. / There\ndefinitely aren’t going to be even bigger\nones in the future.\n2 My city is definitely going to change in\nthe next few years. / My city definitely\nisn’t going to change much in the next\nfew years.\n3 I probably won’t move to a new\napartment or house soon. / I will\ndefinitely move to a new apartment or\nhouse soon.\n4 A new metro line is planned for my area.\nHouse prices will definitely go up after\nit is finished. / No improvements have\nbeen made to my part of town for a long\ntime. House prices might go up, but\nthey probably won’t go up a lot.\n5 Maybe there will be some new shopping\ncentres in my town in the next few years.\n/ There probably won’t be any new\nshopping centres in my town in the next\nfew years.\n6 In the past, buildings were very\ndecorative. This style of building\nprobably won’t come back again. / This\nstyle of building will definitely come\nback again one day.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6193","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":24,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Think about the topics below. Write predictions using will, be going to and adverbs to show certainty. Then work with a partner and ask for each other's predictions.","pages":[111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1e5e5bd10758003d1b3cb24aa34a378f05726c49db8309964d2fca2d87d04bd3.png"],"provided":"What kind of buildings will people live in 20 years from now?\nI think houses and apartments are probably going to get smaller ...","items":[{"id":"b6193.i01","label":"1","prompt":"the buildings people will live in, 20 years from now","options":[],"type":"discuss/open"},{"id":"b6193.i02","label":"2","prompt":"the chances of you buying property","options":[],"type":"discuss/open"},{"id":"b6193.i03","label":"3","prompt":"the future of your classroom building","options":[],"type":"discuss/open"},{"id":"b6193.i04","label":"4","prompt":"the buildings in this town or city, ten years from now","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"What kind of buildings will people live in 20 years from now?"},{"kind":"text","text":"I think houses and apartments are probably going to get smaller ..."},{"kind":"item","id":"b6193.i01","label":"1","prompt":"the buildings people will live in, 20 years from now","options":[],"type":"discuss/open"},{"kind":"item","id":"b6193.i02","label":"2","prompt":"the chances of you buying property","options":[],"type":"discuss/open"},{"kind":"item","id":"b6193.i03","label":"3","prompt":"the future of your classroom building","options":[],"type":"discuss/open"},{"kind":"item","id":"b6193.i04","label":"4","prompt":"the buildings in this town or city, ten years from now","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 What kind of buildings will people live in\n20 years from now?\nI think houses and apartments are\nprobably going to get smaller. That’s\nbeen the general trend over the last few\nyears. I think more people will live in\nhigh-rise buildings, closer together with\nother people.\n2 Do you think you will buy any property?\nPerhaps I’ll buy a small apartment in the\nnext few years. It’s going to be difficult,\nthough, because property prices are\nrising all the time.\n3 Do you think our classroom building will\nbe around much longer?\nI think it is definitely going to be here\nin a few years’ time. It’s an old building,\nbut it’s in good condition, so there’s no\nreason for it to disappear.\n4 How do you think the buildings in this city\nwill be different ten years from now?\nI think there will probably be more houses.\nThe city is expanding all the time, and\nmore people want to move here. There is\ndefinitely going to be a new train station,\ntoo. I heard in the news that there are\nplans to build a new one in the centre.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6195","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":25,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Read the paragraph and write the verbs in bold next to the correct definitions (1–8).","pages":[111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1e5e5bd10758003d1b3cb24aa34a378f05726c49db8309964d2fca2d87d04bd3.png"],"provided":"Architecture and transformation\n\nArchitects need to anticipate the impact that their work will have on the people who use or live in a building. And it's true that most of us, whether or not we realize it, appreciate good architecture. For example, if the design of a building includes a lot of large windows, the people working inside will maintain a connection with nature because they can see the sky.\n\nOne problem that architects often face is what to do with old buildings which people decided to abandon in the past. These are sometimes acquired by property developers, and architects can try to renovate them, keeping the existing historical features. Or they can try to convert the properties into shops, flats and offices. Developing an old building can contribute to the improvement of a whole neighbourhood, but suitable sites can be difficult to identify as cities expand.","items":[{"id":"b6195.i01","label":"1","prompt":"____ (v) to be one of the reasons why something happens","options":[],"type":"gap/closed"},{"id":"b6195.i02","label":"2","prompt":"____ (v) to repair and improve something (especially a building)","options":[],"type":"gap/closed"},{"id":"b6195.i03","label":"3","prompt":"____ (v) to continue to have, or keep in existence","options":[],"type":"gap/closed"},{"id":"b6195.i04","label":"4","prompt":"____ (v) to increase, or cause to increase, in size, number or importance","options":[],"type":"gap/closed"},{"id":"b6195.i05","label":"5","prompt":"____ (v) to buy or get something","options":[],"type":"gap/closed"},{"id":"b6195.i06","label":"6","prompt":"____ (v) to leave something forever","options":[],"type":"gap/closed"},{"id":"b6195.i07","label":"7","prompt":"____ (v) to change something from one thing to another","options":[],"type":"gap/closed"},{"id":"b6195.i08","label":"8","prompt":"____ (v) to recognize how good or useful something is","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Architecture and transformation"},{"kind":"text","text":"Architects need to anticipate the impact that their work will have on the people who use or live in a building. And it's true that most of us, whether or not we realize it, appreciate good architecture. For example, if the design of a building includes a lot of large windows, the people working inside will maintain a connection with nature because they can see the sky."},{"kind":"text","text":"One problem that architects often face is what to do with old buildings which people decided to abandon in the past. These are sometimes acquired by property developers, and architects can try to renovate them, keeping the existing historical features. Or they can try to convert the properties into shops, flats and offices. Developing an old building can contribute to the improvement of a whole neighbourhood, but suitable sites can be difficult to identify as cities expand."}],[{"kind":"item","id":"b6195.i01","label":"1","prompt":"____ (v) to be one of the reasons why something happens","options":[],"type":"gap/closed","answer":{"label":"1","mode":"gap","answer":"contribute"}},{"kind":"item","id":"b6195.i02","label":"2","prompt":"____ (v) to repair and improve something (especially a building)","options":[],"type":"gap/closed","answer":{"label":"2","mode":"gap","answer":"renovate"}},{"kind":"item","id":"b6195.i03","label":"3","prompt":"____ (v) to continue to have, or keep in existence","options":[],"type":"gap/closed","answer":{"label":"3","mode":"gap","answer":"maintain"}},{"kind":"item","id":"b6195.i04","label":"4","prompt":"____ (v) to increase, or cause to increase, in size, number or importance","options":[],"type":"gap/closed","answer":{"label":"4","mode":"gap","answer":"expand"}},{"kind":"item","id":"b6195.i05","label":"5","prompt":"____ (v) to buy or get something","options":[],"type":"gap/closed","answer":{"label":"5","mode":"gap","answer":"acquire"}},{"kind":"item","id":"b6195.i06","label":"6","prompt":"____ (v) to leave something forever","options":[],"type":"gap/closed","answer":{"label":"6","mode":"gap","answer":"abandon"}},{"kind":"item","id":"b6195.i07","label":"7","prompt":"____ (v) to change something from one thing to another","options":[],"type":"gap/closed","answer":{"label":"7","mode":"gap","answer":"convert"}}],[{"kind":"item","id":"b6195.i08","label":"8","prompt":"____ (v) to recognize how good or useful something is","options":[],"type":"gap/closed","answer":{"label":"8","mode":"gap","answer":"appreciate"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 contribute 2 renovate 3 maintain 4 expand\n5 acquire 6 abandon 7 convert 8 appreciate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6196","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"order":26,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Complete the questions with the correct form of seven verbs from Exercise 4. Then discuss the questions with a partner.","pages":[112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4f4aa45370af2be4f6d48eaf48c70c78906d25bd69f5a33f29489ffb5ec784d0.png"],"provided":"","items":[{"id":"b6196.i01","label":"1","prompt":"Is your capital city ____ at the moment?","options":[],"type":"discuss/open"},{"id":"b6196.i02","label":"2","prompt":"Which style of architecture do you ____ most?","options":[],"type":"discuss/open"},{"id":"b6196.i03","label":"3","prompt":"What kinds of thing have ____ to the improvement of your town or city in recent years?","options":[],"type":"discuss/open"},{"id":"b6196.i04","label":"4","prompt":"Is there any part of your home that is old, which you would ____ to make it look better?","options":[],"type":"discuss/open"},{"id":"b6196.i05","label":"5","prompt":"Can you think of an old building in your country that has been ____ from one type of building into another?","options":[],"type":"discuss/open"},{"id":"b6196.i06","label":"6","prompt":"Do you know anybody who has ____ property from a relative, rather than buying it themselves?","options":[],"type":"discuss/open"},{"id":"b6196.i07","label":"7","prompt":"What are some of the reasons why people might ____ a building and not use it again?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U05-question:b6195","kind":"material-reference","title":"LANGUAGE DEVELOPMENT Ex 4","pages":[111]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6196.i01","label":"1","prompt":"Is your capital city ____ at the moment?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6196.i02","label":"2","prompt":"Which style of architecture do you ____ most?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6196.i03","label":"3","prompt":"What kinds of thing have ____ to the improvement of your town or city in recent years?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6196.i04","label":"4","prompt":"Is there any part of your home that is old, which you would ____ to make it look better?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6196.i05","label":"5","prompt":"Can you think of an old building in your country that has been ____ from one type of building into another?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6196.i06","label":"6","prompt":"Do you know anybody who has ____ property from a relative, rather than buying it themselves?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b6196.i07","label":"7","prompt":"What are some of the reasons why people might ____ a building and not use it again?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B04-LS-U05-publisher-sheet:b6195","title":"LANGUAGE DEVELOPMENT Ex 4 原题面","pages":[111],"text":"Architecture and transformation\n\nArchitects need to anticipate the impact that their work will have on the people who use or live in a building. And it's true that most of us, whether or not we realize it, appreciate good architecture. For example, if the design of a building includes a lot of large windows, the people working inside will maintain a connection with nature because they can see the sky.\n\nOne problem that architects often face is what to do with old buildings which people decided to abandon in the past. These are sometimes acquired by property developers, and architects can try to renovate them, keeping the existing historical features. Or they can try to convert the properties into shops, flats and offices. Developing an old building can contribute to the improvement of a whole neighbourhood, but suitable sites can be difficult to identify as cities expand.","screens":["Architecture and transformation","Architects need to anticipate the impact that their work will have on the people who use or live in a building. And it's true that most of us, whether or not we realize it, appreciate good architecture. For example, if the design of a building includes a lot of large windows, the people working inside will maintain a connection with nature because they can see the sky.","One problem that architects often face is what to do with old buildings which people decided to abandon in the past. These are sometimes acquired by property developers, and architects can try to renovate them, keeping the existing historical features. Or they can try to convert the properties into shops, flats and offices. Developing an old building can contribute to the improvement of a whole neighbourhood, but suitable sites can be difficult to identify as cities expand."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1e5e5bd10758003d1b3cb24aa34a378f05726c49db8309964d2fca2d87d04bd3.png"}],"kind":"task_sheet","sourceBlockIds":["b6195"]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6199","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":2,"order":27,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a meeting about a housing development. Before you listen, read the things people might have said (1–7). Then read the definitions below and choose the correct options.","pages":[112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4f4aa45370af2be4f6d48eaf48c70c78906d25bd69f5a33f29489ffb5ec784d0.png"],"provided":"","items":[{"id":"b6199.i01","label":"1","prompt":"There's a problem. We're concerned / sympathetic about the size of the windows.","options":["concerned","sympathetic"],"type":"choice/closed"},{"id":"b6199.i02","label":"2","prompt":"I'm afraid we don't think the safety plans for this building are adequate / concerned.","options":["adequate","concerned"],"type":"choice/closed"},{"id":"b6199.i03","label":"3","prompt":"Let's think about the current building style. The existing / sympathetic style needs to be changed completely.","options":["existing","sympathetic"],"type":"choice/closed"},{"id":"b6199.i04","label":"4","prompt":"We need something that is appropriate / controversial for the local area, that people will like.","options":["appropriate","controversial"],"type":"choice/closed"},{"id":"b6199.i05","label":"5","prompt":"The style of building that you have described isn't very ambitious / sympathetic to the other buildings in the neighbourhood.","options":["ambitious","sympathetic"],"type":"choice/closed"},{"id":"b6199.i06","label":"6","prompt":"Unfortunately, a building of that size could be adequate / controversial.","options":["adequate","controversial"],"type":"choice/closed"},{"id":"b6199.i07","label":"7","prompt":"We like the plan, but it's very ambitious / adequate and our budget is limited.","options":["ambitious","adequate"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6199.i01","label":"1","prompt":"There's a problem. We're concerned / sympathetic about the size of the windows.","options":["concerned","sympathetic"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":0}},{"kind":"item","id":"b6199.i02","label":"2","prompt":"I'm afraid we don't think the safety plans for this building are adequate / concerned.","options":["adequate","concerned"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":0}},{"kind":"item","id":"b6199.i03","label":"3","prompt":"Let's think about the current building style. The existing / sympathetic style needs to be changed completely.","options":["existing","sympathetic"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":0}}],[{"kind":"item","id":"b6199.i04","label":"4","prompt":"We need something that is appropriate / controversial for the local area, that people will like.","options":["appropriate","controversial"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":0}},{"kind":"item","id":"b6199.i05","label":"5","prompt":"The style of building that you have described isn't very ambitious / sympathetic to the other buildings in the neighbourhood.","options":["ambitious","sympathetic"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":1}},{"kind":"item","id":"b6199.i06","label":"6","prompt":"Unfortunately, a building of that size could be adequate / controversial.","options":["adequate","controversial"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":1}}],[{"kind":"item","id":"b6199.i07","label":"7","prompt":"We like the plan, but it's very ambitious / adequate and our budget is limited.","options":["ambitious","adequate"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":0}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 concerned 2 adequate 3 existing 4 appropriate\n5 sympathetic 6 controversial 7 ambitious","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6200","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":2,"order":28,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"With a partner, think of reasons why the people said the things in Exercise 1.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/be16a0ab7dc2d91f5ce0ba8094c016250d9c694cc87d74ba3f33cad9a575e02d.png"],"provided":"We're concerned about the size of the windows. They look very small and they probably won't let in enough sunlight.","items":[],"layout":"list","references":[{"id":"B04-LS-U05-question:b6199","kind":"material-reference","title":"LISTENING 2 Ex 1","pages":[112]}],"materials":[],"coursePages":[[{"kind":"text","text":"We're concerned about the size of the windows. They look very small and they probably won't let in enough sunlight."}]],"courseMaterials":[{"id":"B04-LS-U05-publisher-sheet:b6199","title":"LISTENING 2 Ex 1 原题面","pages":[112],"text":"","screens":[],"sources":[{"page":112,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4f4aa45370af2be4f6d48eaf48c70c78906d25bd69f5a33f29489ffb5ec784d0.png"}],"kind":"task_sheet","sourceBlockIds":["b6199"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 The building is in danger of collapsing,\nso the plans need to be more thorough.\n3 The style is very old-fashioned and\nneeds to be something more modern.\n4 It’s a completely different style to\neverything else nearby. We know that\npeople are proud of the historical\ncharacter of the area, so we need to use\na similar style.\n5 All the other buildings are made of an\nattractive red brick, whereas your idea is\nfor a concrete and glass building.\n6 It’s far too big, and will probably\nblock the sunlight or views that other\nhouses have.\n7 The developers won’t be able to finish it\non time or within the budget.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":13,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6201","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":2,"order":29,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Think of a place in your town or city where there is new housing. Discuss these questions.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/be16a0ab7dc2d91f5ce0ba8094c016250d9c694cc87d74ba3f33cad9a575e02d.png"],"provided":"1 Why do you think developers chose this area?\n2 What style of housing is it?\n3 Have any problems been caused by placing the housing there?","items":[{"id":"b6201.i01","label":"1","prompt":"Why do you think developers chose this area?","options":[],"type":"discuss/open"},{"id":"b6201.i02","label":"2","prompt":"What style of housing is it?","options":[],"type":"discuss/open"},{"id":"b6201.i03","label":"3","prompt":"Have any problems been caused by placing the housing there?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Why do you think developers chose this area?"},{"kind":"text","text":"2 What style of housing is it?"},{"kind":"text","text":"3 Have any problems been caused by placing the housing there?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"There is a large area near where I live\nwhere there are hundreds of new houses.\nIt used to be farmland, but it was empty\nand quite near some main roads. It’s not\nfar from the centre of town. The housing is\na mixture of terraced and semi-detached\nhouses and some small blocks of flats. One\nof the problems is that these new houses\naren’t really near any public transport links.\nThat means the people who live here need\nto use their cars to get anywhere. This\nhas created extra pressure on the roads,\nand there are now frequent traffic jams in\nmy area.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6202","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":2,"order":30,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read these potential problems for a housing development plan. Make notes on your possible solutions. Then discuss your ideas with a partner.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/be16a0ab7dc2d91f5ce0ba8094c016250d9c694cc87d74ba3f33cad9a575e02d.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>potential problems\u003c/td>\u003ctd>your possible solutions\u003c/td>\u003ctd>the developers' solutions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 It looks like the new building will be tall, blocking the daylight for existing homes.\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 The modern design of the development won't fit in with the traditional buildings in the area.\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 The developers plan to build on some woodland, which will mean cutting down trees. Many of the existing residents are furious about this.\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b6202.i01","label":"1","prompt":"It looks like the new building will be tall, blocking the daylight for existing homes. — your possible solutions","options":[],"type":"discuss/open"},{"id":"b6202.i02","label":"2","prompt":"The modern design of the development won't fit in with the traditional buildings in the area. — your possible solutions","options":[],"type":"discuss/open"},{"id":"b6202.i03","label":"3","prompt":"The developers plan to build on some woodland, which will mean cutting down trees. Many of the existing residents are furious about this. — your possible solutions","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"potential problems","header":false,"colspan":1,"rowspan":1},{"text":"your possible solutions","header":false,"colspan":1,"rowspan":1},{"text":"the developers' solutions","header":false,"colspan":1,"rowspan":1}],[{"text":"1 It looks like the new building will be tall, blocking the daylight for existing homes.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"2 The modern design of the development won't fit in with the traditional buildings in the area.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"3 The developers plan to build on some woodland, which will mean cutting down trees. Many of the existing residents are furious about this.","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b6202.i01","label":"1","prompt":"It looks like the new building will be tall, blocking the daylight for existing homes. — your possible solutions","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b6202.i02","label":"2","prompt":"The modern design of the development won't fit in with the traditional buildings in the area. — your possible solutions","options":[],"type":"discuss/open"},{"kind":"item","id":"b6202.i03","label":"3","prompt":"The developers plan to build on some woodland, which will mean cutting down trees. Many of the existing residents are furious about this. — your possible solutions","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Consider two smaller buildings.\n2 Make some changes to the design so it\nis more sympathetic to the traditional\nbuildings. Look at ways of combining\nold and new design features.\n3 Hold a meeting for the existing\nresidents, explaining the benefits the\nnew housing will bring to the area. Ask\nfor suggestions on how the plan can be\nadapted to suit everyone.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U05-question:b6203","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":2,"order":31,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Present your ideas to another pair. Did you identify the same solutions or different ones? Whose solutions are better?","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/be16a0ab7dc2d91f5ce0ba8094c016250d9c694cc87d74ba3f33cad9a575e02d.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A lot of our solutions were similar but some\nof their ideas were better. We didn’t think of\ncombining old design features with new ones\nto make the development more sympathetic\nto the style of the existing buildings.\nHowever, we did think about asking for\nresidents’ suggestions on how the plan could\nbe adapted to make it more appropriate,\nwhich we think is a better solution.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":14,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":15,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":fals lly buildings in a city","example":"The new tower has changed the city's skyline.","wordAudio":"skyline","cardWord":false},{"term":"stately","pos":"(adj)","definition":"formal in style and appearance","example":"We walked through the stately entrance of the old museum.","wordAudio":"stately","cardWord":false}]]}},{"id":"B04-LS-U05-classroom:video","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c067e14dc1ebffa5af7a497e8546c10635cf8aa9f289977c4e12f15ef456e510.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/b5e021e186d4f75c141fac08-L4LS-U05.mp4","captions":[{"start":1.32,"end":4.26,"text":"New York City may have made them famous,"},{"start":4.9,"end":8.22,"text":"but skyscrapers were born in Chicago, Illinois."},{"start":13.14,"end":23.96,"text":"A terrible fire in 1871 made it possible for architects\nto experiment with new building techniques that would\nallow them to make buildings taller than ever before."},{"start":26.62,"end":31.96,"text":"These stately brownstone buildings are some of the\nworld's first skyscrapers."},{"start":34.32,"end":35.1,"text":"Louis Sullivan,"},{"start":35.56,"end":37.78,"text":"known as the father of the skyscraper,"},{"start":38.2,"end":39.66,"text":"lived and worked in Chicago."},{"start":43,"end":46.42,"text":"This is his auditorium building on Michigan Avenue,"},{"start":47.62,"end":49.2,"text":"completed in 1889."},{"start":50.58,"end":57.34,"text":"Sullivan believed that the new social and economic\nstrength of the United States required a new\narchitecture."},{"start":61.64,"end":68.28,"text":"And his idea that tall buildings represent power is\nstill popular 125 years later."},{"start":69.7,"end":75.88,"text":"Sullivan described the skyscraper as the perfect symbol\nof the proud spirit of the American man."},{"start":76.62,"end":80.02,"text":"But it was really the symbol of the proud American\nbusinessman."},{"start":82.98,"end":84.1,"text":"By 1920,"},{"start":84.5,"end":88.4,"text":"there were over 300 ,000 corporations in the United\nStates,"},{"start":88.92,"end":92.74000000000001,"text":"serving 100 million consumers in an enormous single\nmarket."},{"start":94.08,"end":98.82,"text":"It was the biggest, most powerful economy the world had\never seen."},{"start":105.46000000000001,"end":106.14,"text":"Above all,"},{"start":106.53999999999999,"end":109.52000000000001,"text":"skyscrapers represented American corporate success."},{"start":110.1,"end":112.58,"text":"They changed the appearance of American cities."},{"start":113.3,"end":117.46000000000001,"text":"The skylines of New York and Chicago looked like bar\ncharts or graphs,"},{"start":117.8,"end":121.9,"text":"with the tallest buildings representing the richest,\nmost powerful companies."},{"start":122.74,"end":126.56,"text":"And the same is still true in cities around the world\ntoday,"},{"start":127.02,"end":128.36,"text":"from Dubai to Shanghai,"},{"start":128.98,"end":130.76,"text":"from Seoul to Kuala Lumpur."}],"launchInline":true}},{"id":"B04-LS-U05-classroom:review-1","book":4,"unit":5,"track":"LS","topic":"ARCHITECTURE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/693b0a173fee73af9e05e155e16431174ebe69564066b4fbb3d4d13258f170a1.png"],"layout":"list","
