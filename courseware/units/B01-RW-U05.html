],"type":"gap/closed"},{"kind":"item","id":"b2096.i03","label":"3","prompt":"The email to Erik is about a job as a ____.","options":[],"type":"gap/closed"},{"kind":"item","id":"b2096.i04","label":"4","prompt":"The pay for Erik's job is ____ per month.","options":[],"type":"gap/closed"},{"kind":"item","id":"b2096.i05","label":"5","prompt":"Daria must teach grades ____ to ____.","options":[],"type":"gap/closed"}]],"courseMaterials":[{"id":"B01-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"A\nTo: a_evgin@cup.org\nFrom: k_t_b1001@cup.org\nSubject: Interesting job for you!\nHi, Ahmad!\nI've found a great job for you. It's for a full-time fitness instructor¹. The job is at David Allen's Irish Gym in Manchester.\nYou have to get up early in the morning. There are 12 students in each group. You have to be very friendly and good at sports. The pay is very good – they pay £28 an hour. You don't have to work on Fridays.\nI think you'll like this job. Here's the link²: www.ukjobs.co.uk/Fitness-instructor\nTalk to you soon!\nKarel\nB\nTo: erik1221@cup.org\nFrom: ingrid_soljberg@cup.org\nSubject: IT'S MUM - LOOK AT THIS JOB!\nErik,\nI've found a great job for you. It's in Oslo and I know you want to live there. Here's the link: www.itcompany42.org/jobs I know this company.\nThe job is for a software³ engineer. They pay £4,150 per month!\nYou must have studied Computer Science at university, and you have to have two years' experience. It also says that you must know some Norwegian. You don't have to speak Norwegian a lot, so it's OK for you.\nLet me know what you think!\nLove,\nMum\nC\nTo: daria_122@cup.org\nFrom: olly_murgatroyd@cup.org\nSubject: Do you want a job in a great country?\nDear Daria,\nI hope you're well. I have a great job for you. I think you'll like it. It's in South Korea! I know you love Korean food.\nThe job is in Suncheon. It's a small city in the south of the country.\nThe job is at a high school. You have to teach English and French to grades  middle section into three parts:\n1 the job and where it is\n2 the kind of person BBcare Vets wants\n3 the hours and pay of the job","pages":[121],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3b336cc3fde8f4331e257fc248ba5827b933be3e8bd1e3c495935dc79e2a89.png"],"provided":"Hi Mona\n\nI hope you're well. I have a great job for you.\n\nIt's for a vet nurse at BBcare Vets. It's in Byron Bay, a small town near Brisbane in Australia. I know you like small towns and I know you like living near the sea. Byron Bay is a really great place for you.\n\nYou must have a diploma in vet nursing, and you have to have two years' experience. You also have to be good with small animals. BBcare Vets is small, and they help people's pets. You don't have to work with large animals like horses or cows. The job is full-time, and you have to work on Saturday mornings. The pay is A$65,000 per year.\n\nHere's the link: www.discoverjobs4you.com\n\nTalk soon\n\nClara","items":[{"id":"b2139.i01","label":"1","prompt":"the job and where it is","options":[],"type":"qa/open"},{"id":"b2139.i02","label":"2","prompt":"the kind of person BBcare Vets wants","options":[],"type":"qa/open"},{"id":"b2139.i03","label":"3","prompt":"the hours and pay of the job","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Hi Mona"},{"kind":"text","text":"I hope you're well. I have a great job for you."},{"kind":"text","text":"It's for a vet nurse at BBcare Vets. It's in Byron Bay, a small town near Brisbane in Australia. I know you like small towns and I know you like living near the sea. Byron Bay is a really great place for you."},{"kind":"text","text":"You must have a diploma in vet nursing, and you have to have two years' experience. You also have to be good with small animals. BBcare Vets is small, and they help people's pets. You don't have to work with large animals like horses or cows. The job is full-time, and you have to work on Saturday mornings. The pay is A$65,000 per year."}],[{"kind":"text","text":"Here's the link: www.discoverjobs4you.com"},{"kind":"text","text":"Talk soon"},{"kind":"text","text":"Clara"},{"kind":"item","id":"b2139.i01","label":"1","prompt":"the job and where it is","options":[],"type":"qa/open"},{"kind":"item","id":"b2139.i02","label":"2","prompt":"the kind of person BBcare Vets wants","options":[],"type":"qa/open"},{"kind":"item","id":"b2139.i03","label":"3","prompt":"the hours and pay of the job","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  It’s for a vet nurse at BBcare Vets. It’s in Byron Bay, a\nsmall town near Brisbane in Australia.\n2  You must have a diploma in vet nursing, and you have\nto have two years’ experience. You also have to be\ngood with small animals.\n3  The job is full time, and you have to work on Saturday\nmornings. The pay is A$65,000 per year.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":48,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U05-question:b2141","book":1,"unit":5,"track":"RW","topic":"JOBS","lesson":2,"order":43,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Use the information from your table to write an email to your partner about the job. To help you, use the structure and example phrases below. Also, look at the example from Exercise 3 and the Task checklist on page 122.","pages":[121],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3b336cc3fde8f4331e257fc248ba5827b933be3e8bd1e3c495935dc79e2a89.png"],"provided":"Structure\n\u003ctable>\u003ctr>\u003ctd>Greeting\u003c/td>\u003ctd>Hi ... (your partner's name)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write about the job and where it is\u003c/td>\u003ctd>It's (job) at (company/organization name) ...It's in .... near ... I know you like ...\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write about what you have to have for the job\u003c/td>\u003ctd>You must have ...You have to be + (adj) ...\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write information about the job\u003c/td>\u003ctd>(company/organization) is big / small / interesting / exciting.They make / help / have / grow / teach ...The job is full-time / part-time / three days a week / ...You have to / don't have to work at the weekend / evenings ...The pay is ...\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Link\u003c/td>\u003ctd>Heres' the link: www.discoverjobs4you.com\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Closing\u003c/td>\u003ctd>Talk soon / Good luck! /\u003c/td>\u003c/tr>\u003ctr>\u003ctd>your name\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[],"layout":"list","references":[{"id":"B01-RW-U05-question:b2136","kind":"student-work","title":"WRITING TASK Ex 1","pages":[120]},{"id":"B01-RW-U05-question:b2137","kind":"student-work","title":"WRITING TASK Ex 2","pages":[120]},{"id":"B01-RW-U05-question:b2139","kind":"material-reference","title":"WRITING TASK Ex 3","pages":[121]}],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Greeting","header":false,"colspan":1,"rowspan":1},{"text":"Hi ... (your partner's name)","header":false,"colspan":1,"rowspan":1}],[{"text":"Write about the job and where it is","header":false,"colspan":1,"rowspan":1},{"text":"It's (job) at (company/organization name) ...It's in .... near ... I know you like ...","header":false,"colspan":1,"rowspan":1}],[{"text":"Write about what you have to have for the job","header":false,"colspan":1,"rowspan":1},{"text":"You must have ...You have to be + (adj) ...","header":false,"colspan":1,"rowspan":1}],[{"text":"Write information about the job","header":false,"colspan":1,"rowspan":1},{"text":"(company/organization) is big / small / interesting / exciting.They make / help / have / grow / teach ...The job is full-time / part-time / three days a week / ...You have to / don't have to work at the weekend / evenings ...The pay is ...","header":false,"colspan":1,"rowspan":1}],[{"text":"Link","header":false,"colspan":1,"rowspan":1},{"text":"Heres' the link: www.discoverjobs4you.com","header":false,"colspan":1,"rowspan":1}],[{"text":"Closing","header":false,"colspan":1,"rowspan":1},{"text":"Talk soon / Good luck! /","header":false,"colspan":1,"rowspan":1}],[{"text":"your name","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[{"id":"B01-RW-U05-publisher-page:p122","title":"原题或核对备注所引第122页","pages":[122],"text":"","screens":[],"sources":[{"page":122,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/20084d029317ed5de9f24a700f1310c482dd0c538ea52267696b61a84569fe83.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B01-RW-U05-publisher-sheet:b2139","title":"WRITING TASK Ex 3 原题面","pages":[121],"text":"Hi Mona\n\nI hope you're well. I have a great job for you.\n\nIt's for a vet nurse at BBcare Vets. It's in Byron Bay, a small town near Brisbane in Australia. I know you like small towns and I know you like living near the sea. Byron Bay is a really great place for you.\n\nYou must have a diploma in vet nursing, and you have to have two years' experience. You also have to be good with small animals. BBcare Vets is small, and they help people's pets. You don't have to work with large animals like horses or cows. The job is full-time, and you have to work on Saturday mornings. The pay is A$65,000 per year.\n\nHere's the link: www.discoverjobs4you.com\n .mp4","captions":[{"start":1.52,"end":7.38,"text":"This is the Bingham Copper Mine in Utah in the western\nUnited States."},{"start":11.4,"end":14.4,"text":"It's the largest mine of its kind in the world,"},{"start":14.76,"end":17.34,"text":"and it gets bigger all the time."},{"start":21.28,"end":26.26,"text":"Today, it's two and a half miles wide and almost one\nmile deep."},{"start":31.32,"end":35.1,"text":"Matt Lengerich is the operations manager of the mine."},{"start":36.06,"end":42.3,"text":"It produces enough copper each year to make wires for\nevery home in the USA and Mexico."},{"start":43.32,"end":44.94,"text":"We use copper everywhere,"},{"start":45.48,"end":46.2,"text":"in our homes,"},{"start":46.74,"end":47.22,"text":"cell phones,"},{"start":47.54,"end":50.32,"text":"and cars, and some of it comes from here."},{"start":51.04,"end":54.24,"text":"But the rocks contain only a small amount of copper,"},{"start":54.7,"end":58.78,"text":"so Matt's workers have to dig up a lot of rocks to get\nenough copper."},{"start":60.3,"end":63.02,"text":"That's why Bingham Mine is so big."},{"start":65.66,"end":69.4,"text":"Matt's workers use these giant trucks to dig up the\ncopper."},{"start":70.48,"end":76.48,"text":"Sometimes, the copper is so deep that they have to dig\nfor seven years to reach it."},{"start":80.14,"end":82.24,"text":"Everything about the mine is big."},{"start":82.53999999999999,"end":88.12,"text":"These giant trucks are heavier than a jumbo jet and\nwork 24 hours a day."},{"start":91.42,"end":95.34,"text":"Drivers use these giant trucks to move the rocks and\ncopper."},{"start":102.08,"end":105.2,"text":"But they also use something stronger."},{"start":124.42,"end":128.32,"text":"The Bingham Mine is more than 100 years old,"},{"start":130.88,"end":133.84,"text":"and it's larger than any other mine of its kind."}],"launchInline":true}},{"id":"B01-RW-U05-classroom:material:RW-M03","book":1,"unit":5,"track":"RW","topic":"JOBS","lesson":1,"module":"R b1001@cup.org\nSubject: Interesting job for you!\nHi, Ahmad!\nI've found a great job for you. It's for a full-time fitness instructor¹. The job is at David Allen's Irish Gym in Manchester.\nYou have to get up early in the morning. There are 12 students in each group. You have to be very friendly and good at sports. The pay is very good – they pay £28 an hour. You don't have to work on Fridays.\nI think you'll like this job. Here's the link²: www.ukjobs.co.uk/Fitness-instructor\nTalk to you soon!\nKarel\nB\nTo: erik1221@cup.org\nFrom: ingrid_soljberg@cup.org\nSubject: IT'S MUM - LOOK AT THIS JOB!\nErik,\nI've found a great job for you. It's in Oslo and I know you want to live there. Here's the link: www.itcompany42.org/jobs I know this company.\nThe job is for a software³ engineer. They pay £4,150 per month!\nYou must have studied Computer Science at university, and you have to have two years' experience. It also says that you must know some Norwegian. You don't have to speak Norwegian a lot, so it's OK for you.\nLet me know what you think!\nLove,\nMum\nC\nTo: daria_122@cup.org\nFrom: olly_murgatroyd@cup.org\nSubject: Do you want a job in a great country?\nDear Daria,\nI hope you're well. I have a great job for you. I think you'll like it. It's in South Korea! I know you love Korean food.\nThe job is in Suncheon. It's a small city in the south of the country.\nThe job is at a high school. You have to teach English and French to grades 10 to 12.\nYou speak English and French (and Russian!).\nYou don't have to speak Korean, so this is a great job for you. You have to work many hours every day. But you are a very serious teacher. I know you work hard.\nHere's the link: www.skoreajobs.com/Education/HS/Languages\nGood luck!\nOliver\n¹ instructor (n) somebody who teaches\n² link (n) a word or phrase on a website which takes you to another website\n³ software (n) programs which you use to make a computer do different things","media":{"type":"audio","title":"Reading 2","src" l. I have a great job for you. I think you'll like it. It's in South Korea! I know you love Korean food.\n\nThe job is in Suncheon. It's a small city in the south of the country.\n\nThe job is at a high school. You have to teach English and French to grades 10 to 12.\n\nYou speak English and French (and Russian!).\n\nYou don't have to speak Korean, so this is a great job for you. You have to work many hours every day. But you are a very serious teacher. I know you work hard.\n\nHere's the link: www.skoreajobs.com/Education/HS/Languages\n\nGood luck!\n\nOliver\n\n¹ instructor (n) somebody who teaches\n² link (n) a word or phrase on a website which takes you to another website\n³ software (n) programs which you use to make a computer do different things","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2094"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e4cfcd7fad35178d709b8cc48823a7d2ee2a48f5d954b6135c1b314d76fe8383.mp3","continueOnPage":true}},{"id":"B01-RW-U05-classroom:review-1","book":1,"unit":5,"track":"RW","topic":"JOBS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/12659826db41e0d00a2fef40a1de9357b0ebdad9756fe34ad863e201241472e6.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B01-RW-U05-B-001","form":"app developer","page":123},{"id":"B01-RW-U05-B-002","form":"company","page":123},{"id":"B01-RW-U05-B-003","form":"doctor","page":123},{"id":"B01-RW-U05-B-004","form":"engineer","page":123},{"id":"B01-RW-U05-B-005","form":"farmer","page":123},{"id":"B01-RW-U05-B-006","for is an app development company. We make fun games for everyone.\nWe are looking for an app developer to work on English language game apps.","sourcePage":107,"blocks":[{"kind":"text","text":"GAMESY APPS"},{"kind":"text","text":"Gamesy Apps is an app development company. We make fun games for everyone."},{"kind":"text","text":"We are looking for an app developer to work on English language game apps."}]},{"body":"You must know many different programming languages and different platforms⁴ (Android, iOS). You must speak English and a little Arabic.\nPay: USD 5,000 per month\nHours: Full time","sourcePage":107,"blocks":[{"kind":"text","text":"You must know many different programming languages and different platforms⁴ (Android, iOS). You must speak English and a little Arabic."},{"kind":"text","text":"Pay: USD 5,000 per month"},{"kind":"text","text":"Hours: Full time"}]},{"body":"¹ location (n) a place\n² experience (n) what you know from doing your job\n³ private (adj) belongs to one person or group\n⁴ platform (n) the type of computer system or smartphone you use","sourcePage":107,"blocks":[{"kind":"text","text":"¹ location (n) a place"},{"kind":"text","text":"² experience (n) what you know from doing your job"},{"kind":"text","text":"³ private (adj) belongs to one person or group"},{"kind":"text","text":"⁴ platform (n) the type of computer system or smartphone you use"}]}],"B01-RW-U05-classroom:material:RW-M04":[{"body":"A\nTo: a_evgin@cup.org\nFrom: k_t_b1001@cup.org\nSubject: Interesting job for you!\nHi, Ahmad!","sourcePage":110,"blocks":[{"kind":"text","text":"A"},{"kind":"text","text":"To: a_evgin@cup.org"},{"kind":"text","text":"From: k_t_b1001@cup.org"},{"kind":"text","text":"Subject: Interesting job for you!"},{"kind":"text","text":"Hi, Ahmad!"}]},{"body":"I've found a great job for you. It's for a full-time fitness instructor¹. The job is at David Allen's Irish Gym in Manchester.\nYou have to get up early in the morning. There are 12 students in each group. You have to be very friendly and good at sports. The pay is very good – they pay £28 an hour. You don't have to work on Fridays.","sourcePage":110,"blocks":[{"kind":"text","text":"I've found a great job for you. It's for a full-time fitness instructor¹. The job is at David Allen's Irish Gym in Manchester."},{"kind":"text","text":"You have to get up early in the morning. There are 12 students in each group. You have to be very friendly and good at sports. The pay is very good – they pay £28 an hour. You don't have to work on Fridays."}]},{"body":"I think you'll like this job. Here's the link²: www.ukjobs.co.uk/Fitness-instructor\nTalk to you soon!\nKarel\nB\nTo: erik1221@cup.org\nFrom: ingrid_soljberg@cup.org","sourcePage":110,"blocks":[{"kind":"text","text":"I think you'll like this job. Here's the link²: www.ukjobs.co.uk/Fitness-instructor"},{"kind":"text","text":"Talk to you soon!"},{"kind":"text","text":"Karel"},{"kind":"text","text":"B"},{"kind":"text","text":"To: erik1221@cup.org"},{"kind":"text","text":"From: ingrid_soljberg@cup.org"}]},{"body":"Subject: IT'S MUM - LOOK AT THIS JOB!\nErik,\nI've found a great job for you. It's in Oslo and I know you want to live there. Here's the link: www.itcompany42.org/jobs I know this company.\nThe job is for a software³ engineer. They pay £4,150 per month!","sourcePage":110,"blocks":[{"kind":"text","text":"Subject: IT'S MUM - LOOK AT THIS JOB!"},{"kind":"text","text":"Erik,"},{"kind":"text","text":"I've found a great job for you. It's in Oslo and I know you want to live there. Here's the link: www.itcompany42.org/jobs I know this company."},{"kind":"text","text":"The job is for a software³ engineer. They pay £4,150 per month!"}]},{"body":"You must have studied Computer Science at university, and you have to have two years' experience. It also says that you must know some Norwegian. You don't have to speak Norwegian a lot, so it's OK for you.\nLet me know what you think!\nLove,\nMum","sourcePage":110,"blocks":[{"kind":"text","text":"You must have studied Computer Science at university, and you have to have two years' experience. It also says that you must know some Norwegian. You don't have to speak Norwegian a lot, so it's OK for you."},{"kind":"text","text":"Let me know what you think!"},{"kind":"text","text":"Love,"},{"kind":"text","text":"Mum"}]},{"body":"C\nTo: daria_122@cup.org\nFrom: olly_murgatroyd@cup.org\nSubject: Do you want a job in a great country?\nDear Daria,","sourcePage":110,"blocks":[{"kind":"text","text":"C"},{"kind":"text","text":"To: daria_122@cup.org"},{"kind":"text","text":"From: olly_murgatroyd@cup.org"},{"kind":"text","text":"Subject: Do you want a job in a great country?"},{"kind":"text","text":"Dear Daria,"}]},{"body":"I hope you're well. I have a great job for you. I think you'll like it. It's in South Korea! I know you love Korean food.\nThe job is in Suncheon. It's a small city in the south of the country.\nThe job is at a high school. You have to teach English and French to grades 10 to 12.\nYou speak English and French (and Russian!).","sourcePage":110,"blocks":[{"kind":"text","text":"I hope you're well. I have a great job for you. I think you'll like it. It's in South Korea! I know you love Korean food."},{"kind":"text","text":"The job is in Suncheon. It's a small city in the south of the country."},{"kind":"text","text":"The job is at a high school. You have to teach English and French to grades 10 to 12."},{"kind":"text","text":"You speak English and French (and Russian!)."}]},{"body":"You don't have to speak Korean, so this is a great job for you. You have to work many hours every day. But you are a very serious teacher. I know you work hard.\nHere's the link: www.skoreajobs.com/Education/HS/Languages\nGood luck!\nOliver","sourcePage":110,"blocks":[{"kind":"text","text":"You don't have to speak Korean, so this is a great job for you. You have to work many hours every day. But you are a very serious teacher. I know you work hard."},{"kind":"text","text":"Here's the link: www.skoreajobs.com/Education/HS/Languages"},{"kind":"text","text":"Good luck!"},{"kind":"text","text":"Oliver"}]},{"body":"¹ instructor (n) somebody who teaches","sourcePage":110,"blocks":[{"kind":"text","text":"¹ instructor (n) somebody who teaches"}]},{"body":"² link (n) a word or phrase on a website which takes you to another website\n³ software (n) programs which you use to make a computer do different things","sourcePage":110,"blocks":[{"kind":"text","text":"² link (n) a word or phrase on a website which takes you to another website"},{"kind":"text","text":"³ software (n) programs which you use to make a computer do different things"}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方 uy 文章对应条目信息核对。 教材原页 Ex 5 共四项。","rewriteKey":""},"B02-RW-U05-question:b3765":{"rows":{"b3765.i01":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":23}]},"b3765.i02":{"mode":"indexed-mark","parts":[{"start":0,"end":2,"underline":true},{"start":3,"end":8}]},"b3765.i03":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":21}]}},"basis":"教材第 118 页与教师书 PDF 第 50 页。选择完整主语和限定动词。","itemPatches":{"b3765.i01":{"options":[]},"b3765.i02":{"options":[]},"b3765.i03":{"options":[]}},"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-RW-U05":{"aspect":1.9085487,"cues":[[1.52,7.38,"This is the Bingham Copper Mine in Utah in the western United States.","这是美国西部犹他州的宾汉铜矿。"],[11.4,14.4,"It's the largest mine of its kind in the world,","这是世界上最大的同类矿山，"],[14.76,17.34,"and it gets bigger all the time.","它会变大所有的时间。"],[21.28,26.26,"Today, it's two and a half miles wide and almost one mile deep.","今天，它的宽度为2.5英里，深近1英里。"],[31.32,35.1,"Matt Lengerich is the operations manager of the mine.","马特·伦格里希(Matt Lengerich)是该矿的业务经理。"],[36.06,42.3,"It produces enough copper each year to make wires for every home in the USA and Mexico.","它每年的铜产量足以为美国和墨西哥的每个家庭制造电线。"],[43.32,44.94,"We use copper everywhere,","我们到处都用铜"],[45.48,46.2,"in our homes,","在我们的家中，"],[46.74,47.22,"cell phones,","手机，"],[47.54,50.32,"and cars, and some of it comes from here.","和汽车，和一些它来自这里。"],[51.04,54.24,"But the rocks contain only a small amount of copper,","但岩石中只有少量的青铜器"],[54.7,58.78,"so Matt's workers have to dig up a lot of rocks to get enough copper.","所以马特的工人必须挖出很多石头才能得到足够的铜。"],[60.3,63.02,"That's why Bingham Mine is so big.","故宾汉弥勒大。"],[65.66,69.4,"Matt's workers use these giant trucks to dig up the copper.","马特的工人利用这些巨型卡车挖掘铜器。"],[70.48,76.48,"Sometimes, the copper is so deep that they have to dig for seven years to reach it.","有时，铜器很深，必须挖七年才能到达。"],[80.14,82.24,"Everything about the mine is big.","矿井的一切都很大。"],[82.53999999999999,88.12,"These giant trucks are heavier than a jumbo jet and work 24 hours a day.","这些巨型卡车比大型喷气机更重，每天24小时工作。"],[91.42,95.34,"Drivers use these giant trucks to move the rocks and copper.","司机使用这些巨型卡车来移动岩石和铜。"],[102.08,105.2,"But they also use something stronger.","但他们也使用了更强壮的东西。"],[124.42,128.32,"The Bingham Mine is more than 100 years old,","宾汉姆矿区已有100多年历史了"],[130.88,133.84,"and it's larger than any other mine of its kind.","它比其他同类的矿井都大"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from e perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B01-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/43bc79d96c1ab4c1c65fd30680983178026a8a97dcc42e2a052e66e91158d0e8.pdf","size":28669491},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.gi   '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';
}
function materialSplit(decks,task,feedback){
 const tabs=decks.map((deck,i)=>'<button type="button" data-deck="'+i+'" aria-pressed="'+(i===0)+'">'+esc(deck.label)+'</button>').join("");
 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+
  '<button type="button" data-material-next>下段</button></div></section>'+
  '<section class="panel v-block material-task" data-fixed-task aria-label="课堂任务">'+task+'</section></div>';
}
function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

  (printedReading?'教材第 '+printedReading+' 页':c.pages.length?'教材第 '+esc(c.pages.join("、"))+' 页':"")+classroomStage.count(p,binding.chunks.length)+'</div>'+audio+'</header>'+

function resultFor(c){return (c.comparison?comparisonResults:c.flow?lessonResults:results)[c.id];}
function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){
 const host=document.getElementById("preview-size"),scale=Math.min(host.parentElement.clientWidth/1280,maxProjectionScale);
 host.style.width=1280*scale+"px";host.style.height=720*scale+"px";frame.style.transform="scale("+scale+")";
}
function inClassroomOrder(){
 return Boolean(V.lessonFlow&&sequenceView.value==="school");
}
function inOpenings(){
 return sequenceView.value==="openings";
}
function inGlossaries(){
 return sequenceView.value==="glossaries";
}
function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
 return entry+gaps;
}
function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';
  document.getElementById("flow-coverage").textContent="当前显示教材 Ex 的实页验证。";
 }
}

function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}

 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);
 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;

 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';
 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");
 if(r?.inlineCheckTest)document.getElementById("metrics").append(" 原位核对检查 "+r.inlineCheckTest.points+" 处。");
 if(r?.screenChecks?.length)document.getElementById("metrics").append(" 已核对原页、前题和题面位置。");

 document.getElementById("references").innerHTML=c.references.length?c.references.map(x=>'<button class="ref-button" '+(x.sourceOnly?'data-reference-page="'+x.pages[0]+'"':'data-ref="'+esc(x.id)+'"')+'>'+esc(x.title)+'，教材第 '+x.pages.join("、")+' 页</button>').join(""):'<p>本题记录中没有显式学生作答引用。</p>';
 document.getElementById("materials").innerHTML=c.materials.map(m=>'<details><summary>'+esc(m.title)+'，教材第 '+esc((m.pages||[]).join("、"))+' 页</summary><div class="resource-text">'+esc(m.text||"此条目通过教材原页核对。")+'</div></details>').join("")+(c.supportText&&!c.materialDecks?'<details><summary>'+esc(c.supportTitle)+'</summary><div class="resource-text">'+esc(c.supportText)+'</div></details>':"");
 if(c.materialDecks)document.getElementById("materials").innerHTML=classroom.materialDecks(c).map(deck=>'<details><summary>'+esc(deck.label)+'</summary><div class="resource-text">'+deck.pages.map(card=>esc([card.title,card.subtitle,card.lead,card.body.replace(/\*\*/g,""),...(card.notes??[])].filter(Boolean).join("\n"))).join("\n\n")+'</div></details>').join("");
 document.getElementById("materials").insertAdjacentHTML("afterbegin",vocabularyPlacement(c,part));
 document.getElementById("provided-record").innerHTML='<details><summary>完整给定内容和小题记录</summary><div class="resource-text">'+esc(c.provided)+'\n'+esc(c.items.map(x=>x.label+" "+x.prompt+(x.options?.length?"\n"+x.options.join("\n"):"")).join("\n\n"))+'</div></details>';
 const feedback=c.feedback;
 document.getElementById("feedback-record").innerHTML=feedback?
  '<p><strong>'+esc(V.answerCheck.modeLabels[feedback.mode])+'</strong>，'+feedback.rows.length+' 项。</p><p>'+esc(feedback.source)+'。</p>'+

 document.getElementById("record-id").textContent=c.id;

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){
 const i=classroom.indexById.get(id);
 if(i===undefined)return;
 history.push({i:current,p:part,...(vocabulary?{vocabulary:id}:{})});
 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);
}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});
 return true;
}
function closeSource(){
 const modal=document.getElementById("source-modal");
 if(modal.hidden)return;
 modal.hidden=true;
 if(sourceTrigger?.isConnected)sourceTrigger.focus({preventScroll:true});
 sourceTrigger=null;
}
function showSource(){
 const source=sourceEntries[sourcePart];
 if(!source)return;
 document.getElementById("source-label").textContent="Book "+source.book+" "+(source.track==="RW"?"读写":"听说")+"，教材第 "+source.page+" 页";
 const image=document.getElementById("source-image");
 const status=document.getElementById("source-hd-status");
 const originalKey=source.originalKey??("B"+String(source.book).padStart(2,"0")+"-"+source.track+"/"+source.page);
 displayCourseOriginalImage(image,originalKey,status);
 const pdf=document.getElementById("source-pdf");
 pdf.hidden=!source.pdf;
 if(source.pdf)pdf.href=source.pdf;
 document.getElementById("source-prev").disabled=sourcePart===0;
 document.getElementById("source-next").disabled=sourcePart===sourceEntries.length-1;
}
function summaries(){
 const counts={直接适用:0,预设变体适用:0,不适用:0};
 for(const r of Object.values(results))counts[r.verdict]++;
 document.getElementById("stat-direct").textContent=counts.直接适用;
 document.getElementById("stat-variant").textContent=counts.预设变体适用;
 document.getElementById("stat-fail").textContent=counts.不适用;
}
function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const checked=[];
 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
function inspectOriginalButton(button){
 const owner=classroom.byId.get(button.dataset.originalCase);
 const expected=classroom.source(owner,button.dataset.originalPage);
 if(!expected)return false;
 button.click();
 const matched=!document.getElementById("source-modal").hidden&&
  document.getElementById("source-image").getAttribute("src")===expected.image&&
  document.getElementById("source-label").textContent.endsWith("教材第 "+expected.page+" 页")&&
  (!expected.pdf||document.getElementById("source-pdf").getAttribute("href")===expected.pdf);
