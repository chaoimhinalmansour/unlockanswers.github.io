"colspan":1,"rowspan":1},{"text":"Your notes","header":false,"colspan":1,"rowspan":1}],[{"text":"Body paragraph 2: (similarities)Try to include at least 3 points(about 100 words)","header":false,"colspan":1,"rowspan":1},{"text":"Although the subjects are very different, they do share some core principles...","header":false,"colspan":1,"rowspan":1}],[{"text":"Concluding paragraph: (re-instate your opinion) (about 50-100 words)","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-RW-U02":{"aspect":1.9472617,"cues":[[1.88,4.72,"At the School for Grannies in India,","在印度的奶奶学校，"],[5.38,10.48,"the women can fulfill a lifelong ambition to learn to read and write.","妇女可以实现终生的学习阅读和写作的抱负。"],[14.34,16.36,"I never went to school as a child.","我从小没上过学"],[17.88,21.44,"It feels great to come now and study with my friends.","现在和我的朋友一起学习感觉真好"],[24.04,25.66,"The school may be unusual,","学校可能很不寻常，"],[26.04,28.22,"but adult illiteracy isn't.","但成人文盲不是。"],[29.1,37.18,"The actor Idris Elba works with the global literacy campaign Project Literacy, which aims to ensure that","演员伊德里斯·埃尔巴与全球扫盲运动 \" 扫盲项目 \" 合作，旨在确保"],[37.18,37.46,"no","无"],[37.46,40.34,"child is born at risk of poor literacy.","儿童出生时面临识字能力差的风险。"],[41.3,44,"So that ideology is about talking to adults.","所以，这个意识形态是和成年人说话。"],[44.28,47.3,"Most people think illiteracy is young people, isn't it?","大多数人认为文盲是年轻人，不是吗？"],[47.3,53.62,"It's adults who live their life doing this, and now are too afraid to even say and mention this and I can't read.","这是成年人的生活做这个，现在太害怕甚至说和提到这个，我不能阅读。"],[53.62,61.64,"Globally, there are around 750 million adults who cannot read a simple sentence, nor write their name.","在全球范围内，约有7.5亿成年人不能阅读一个简单的句子，也不能写出他们的名字。"],[62.66,65.72,"Fifty percent of these adults live in South Asia.","50%的成年人生活在南亚。"],[67.24,67.74,"However,","不过，"],[68.03999999999999,69.78,"the issue affects most regions.","这个问题影响到大多数区域。"],[70.98,71.82,"For example,","举例来说，"],[72.22,77.02,"70 million adults in the United States have very low levels of literacy.","美国有7000万成年人的识字率非常低。"],[78.06,84.56,"Illiteracy often causes individuals to be disadvantaged and feel excluded from society.","文盲往往使个人处于不利地位，感到被排除在社会之外。"],[85.52,89.22,"When we used to go to the bank, we had to give thumbprints.","我们以前去银行的时候，只好用拇指印。"],[89.58,92.2,"It was embarrassing and there was a stigma attached.","这令人尴尬，并带有耻辱感。"],[92.6,95.62,"Now I feel proud and happy because I can sign my name.","现在，我感到骄傲和高兴，因为我可以签下我的名字。"],[97.5,103.1,"Many adults who cannot read will try to hide their illiteracy from their family and friends.","许多不识字的成年人会试图掩盖其家人和朋友的文盲。"],[103.9,109.06,"There's a lady called Wanda from New Jersey and she couldn't read or write.","有个叫万达的女士来自新泽西州，她不会读书或写作。"],[109.06,115.6,"She got two young kids and what she would do when the kids would ask her to sort of read a story time, bedtime story,","她有两个年幼的孩子当孩子们要她读故事时间睡觉时间的故事时她会怎么做"],[116,120.72,"she would look at the pictures in a book and just make up the words.","她会看书里的照片然后编成词"],[121.38,125.08,"But she communicated to her children the love of reading books even though she couldn't do it.","但她向孩子传达了读书的爱好，尽管她做不到。"],[125.48,130.78,"These are success stories, but statistically for children of parents who cannot read,","这些是成功的故事，但从统计学上讲，对于父母不识字的孩子来说，"],[131.16,132.96,"the outlook is less positive.","前景并不乐观。"],[133.74,139.3,"These children have below average literacy levels themselves and higher numbers drop out of school.","这些儿童本身的识字率低于平均水平，辍学率较高。"],[139.66,140.84,"Some turn to crime.","有的转向犯罪。"],[141.5,145.54,"Learning to read and write at any age is one way to end the cycle.","在任何年龄学习读写是结束循环的一种方式。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33},"B01-LS/36":{"pdf":34},"B01-LS/37":{"pdf":35},"B01-LS/38":{"pdf":36},"B01-LS/39":{"pdf":37},"B01-LS/40":{"pdf":38},"B01-LS/41":{"pdf":39},"B01-LS/42":{"pdf":40},"B01-LS/43":{"pdf":41},"B01-LS/44":{"pdf":42},"B01-LS/45":{"pdf":4 let current=0,part=0,sourcePart=0,sourceEntries=[],sourceTrigger=null,results={},comparisonResults={},lessonResults={},history=[];

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+
 (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;

function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){

 ).join("")+'</section>').join("")+'</div>';
}
function materialSplit(decks,task,feedback){

 ).join("")).join("");

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";

 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

}

 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){

  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }

function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';

function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){
 const i=classroom.indexById.get(id);
 if(i===undefined)return;
 history.push({i:current,p:part,...(vocabulary?{vocabulary:id}:{})});
 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);

function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){

 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);

 showSource();

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const checked=[];
 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}
function inspectOriginalButton(button){
 const owner=classroom.byId.get(button.dataset.originalCase);
 const expected=classroom.source(owner,button.dataset.originalPage);
 if(!expected)return false;
 button.click();
 const matched=!document.getElementById("source-modal").hidden&&
  document.getElementById("source-image").getAttribute("src")===expected.image&&
  document.getElementById("source-label").textContent.endsWith("教材第 "+expected.page+" 页")&&
  (!expected.pdf||document.getElementById("source-pdf").getAttribute("href")===expected.pdf);
 closeSource();
 return matched;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
document.addEventListener("click",e=>{
 const selected=e.target.closest("[data-case]");if(selected){display(Number(selected.dataset.case));return;}
 const source=e.target.closest("[data-reference-page]");if(source){original(cases[current],Number(source.dataset.referencePage),source);return;}
 const ref=e.target.closest("[data-ref]");if(ref)jumpTo(ref.dataset.ref);
});
document.getElementById("lesson-filter").addEventListener("change",changeSequence);
for(const control of [sequenceView,openingBook,openingTrack])control.addEventListener("change",changeSequence);
document.getElementById("status-filter").addEventListener("change",nav);
document.getElementById("feedback-filter").addEventListener("change",nav);
document.getElementById("digital-examples").addEventListener("change",event=>{
 jumpTo(event.target.value);
 event.target.value="";
});
document.getElementById("previous").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);
document.getElementById("open-source").onclick=event=>original(cases[current],cases[current].pages[0],event.currentTarget);
document.getElementById("return-task").onclick=returnToTask;
document.getElementById("source-close").onclick=closeSource;
document.getElementById("source-prev").onclick=()=>{sourcePart--;showSource()};
document.getElementById("source-next").onclick=()=>{sourcePart++;showSource()};
window.addEventListener("resize",resize);
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeSource()});
const saved=document.getElementById("saved-results");
if(saved)results=JSON.parse(saved.textContent);
const reuse=document.getElementById("saved-reuse-results");
if(reuse)comparisonResults=JSON.parse(reuse.textContent);
 const school=document.getElementById("saved-lesson-results");
 if(school)lessonResults=JSON.parse(school.textContent);
const scopes=new Map();
for(const c of primary){
 const key=c.track+c.lesson;
 const group=scopes.get(key)??{track:c.track,lesson:c.lesson,total:0};
 group.total++;scopes.set(key,group);
}
for(const [key,group] of scopes){
 document.getElementById("lesson-filter").add(new Option((group.track==="RW"?"读写":"听说")+"第 "+group.lesson+" 节，"+group.total+" 题",key));
}
for(const entry of document.querySelectorAll(".summary [data-ref], #digital-examples option[value]:not([value=\"\"])")){
 entry.hidden=!classroom.byId.has(entry.dataset.ref??entry.value);
}
document.getElementById("stat-total").textContent=primary.length;
for(const book of new Set([...classroom.openings,...classroom.glossaries].map(c=>c.book)))openingBook.add(new Option("Book "+book,String(book)));
sequenceView.querySelector('[value="openings"]').hidden=!classroom.openings.length;
sequenceView.querySelector('[value="glossaries"]').hidden=!classroom.glossaries.length;
const startView=new URLSearchParams(location.search).get("view");
if(classroom.openings.length&&startView==="openings")sequenceView.value="openings";
if(classroom.glossaries.length&&startView==="glossaries")sequenceView.value="glossaries";
const selectedLesson=new URLSearchParams(location.search).get("lesson");
if(/^[12]$/.test(selectedLesson??""))document.getElementById("lesson-filter").value=primary[0].track+selectedLesson;
updateSequenceHeading();
summaries();display(navigationOrder()[0]??0);
</script></body></html>
