s with the global literacy\ncampaign Project Literacy, which aims to ensure that"},{"start":37.18,"end":37.46,"text":"no"},{"start":37.46,"end":40.34,"text":"child is born at risk of poor literacy."},{"start":41.3,"end":44,"text":"So that ideology is about talking to adults."},{"start":44.28,"end":47.3,"text":"Most people think illiteracy is young people, isn't it?"},{"start":47.3,"end":53.62,"text":"It's adults who live their life doing this, and now are\ntoo afraid to even say and mention this and I can't\nread."},{"start":53.62,"end":61.64,"text":"Globally, there are around 750 million adults who\ncannot read a simple sentence, nor write their name."},{"start":62.66,"end":65.72,"text":"Fifty percent of these adults live in South Asia."},{"start":67.24,"end":67.74,"text":"However,"},{"start":68.03999999999999,"end":69.78,"text":"the issue affects most regions."},{"start":70.98,"end":71.82,"text":"For example,"},{"start":72.22,"end":77.02,"text":"70 million adults in the United States have very low\nlevels of literacy."},{"start":78.06,"end":84.56,"text":"Illiteracy often causes individuals to be disadvantaged\nand feel excluded from society."},{"start":85.52,"end":89.22,"text":"When we used to go to the bank, we had to give\nthumbprints."},{"start":89.58,"end":92.2,"text":"It was embarrassing and there was a stigma attached."},{"start":92.6,"end":95.62,"text":"Now I feel proud and happy because I can sign my name."},{"start":97.5,"end":103.1,"text":"Many adults who cannot read will try to hide their\nilliteracy from their family and friends."},{"start":103.9,"end":109.06,"text":"There's a lady called Wanda from New Jersey and she\ncouldn't read or write."},{"start":109.06,"end":115.6,"text":"She got two young kids and what she would do when the\nkids would ask her to sort of read a story time,\nbedtime story,"},{"start":116,"end":120.72,"text":"she would look at the pictures in a book and just make\nup the words."},{"start":121.38,"end":125.08,"text":"But she communicated to her children the love of\nreading books even though she couldn't do it."},{"start":125.48,"end":130.78,"text":"These are success stories, but statistically for\nchildren of parents who cannot read,"},{"start":131.16,"end":132.96,"text":"the outlook is less positive."},{"start":133.74,"end":139.3,"text":"These children have below average literacy levels\nthemselves and higher numbers drop out of school."},{"start":139.66,"end":140.84,"text":"Some turn to crime."},{"start":141.5,"end":145.54,"text":"Learning to read and write at any age is one way to end\nthe cycle."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 The aim is to ensure that no child is born at risk of poor\nliteracy.\n2 He talks about adults because, although most people\nthink that illiteracy is just a problem that concerns young\npeople, it isn’t; it concerns adults who are too afraid to\nsay that they can’t read.\n3 The impact is usually not positive. They usually have\nbelow average literacy skills themselves, drop out of\nschools in higher numbers or turn to crime.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":29,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6689","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Which of the summaries below best describes the main message in the video?","pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/05cdf367ec6a55224ff2c19a1b2b91a6042ce872933b62c6baa90f79bd31ae9a.png"],"provided":"","items":[{"id":" ld invest more money\nin education and make sure that there\nis free and accessible schooling for all,\nespecially in rural and underdeveloped\nareas. They could also launch adult\nliteracy programs to help those who\nmissed out on education.\n2 In my country, the government could\nfocus on improving the quality of\neducation in public schools and\nexpanding literacy programs in\ndisadvantaged communities. They\ncould promote awareness about the\nimportance of education and provide\nmore resources for adult learners.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6695","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read an essay with the title A Traditional Degree Versus a Degree Apprenticeship. Look at the photos. Which photo shows a traditional degree course and which a degree apprenticeship? What do you think is the main difference between the two types of course?","pages":[40],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dd ":[],"type":"discuss/open"},{"kind":"item","id":"b6700.i07","label":"7","prompt":"Which subject or area of work would you like to explore ____?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B04-RW-U02-publisher-sheet:b6699","title":"READING 1 Ex 3 原题面","pages":[41],"text":"employability (n) pursue (v) community (n) peer (n) deadline (n) regard (v) in-depth (adj) aspect (n)","screens":["employability (n) pursue (v) community (n) peer (n) deadline (n) regard (v) in-depth (adj) aspect (n)"],"sources":[{"page":41,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7625133a5efbc0149a0fe61640534a2e9d8247e7dc24cc9988425b496d84543a.png"}],"kind":"task_sheet","sourceBlockIds":["b6699"]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6704","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"order":12,"module":"READING 1","ex":"5","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the essay. Which option (1–3) best expresses the main idea?","pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0fd8da214aae54d9addf742a74fb4ea7bfe9f59a398d764645cce24ed3fa6c25.png"],"provided":"","items":[{"id":"b6704.i01","label":"1","prompt":"Which option best expresses the main idea of the essay?","options":["A traditional university degree is the most popular choice among school leavers but with the introduction of the degree apprenticeship in 2015 that may change in the future.","The two courses are delivered in very different ways with degree apprentices receiving 'on-the-job' training rather than being fully immersed in the 'traditional' student life.","A degree apprenticeship may improve a graduate's ability to find a job because he/she can gain important workplace experience and learn key skills, such as effective time management."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6704.i01","label":"1","prompt":"Which option best expresses the main idea of the essay?","options":["A traditional university degree is the most popular choice among school leavers but with the introduction of the degree apprenticeship in 2015 that may change in the future.","The two courses are delivered in very different ways with degree apprentices receiving 'on-the-job' training rather than being fully immersed in the 'traditional' student life.","A degree apprenticeship may improve a graduate's ability to find a job because he/she can gain important workplace experience and learn key skills, such as effective time management."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B04-RW-U02-classroom:material:RW-M03","title":"READING 1","text":"UNIVERSITY COURSES:\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP\nTraditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these\ndifferences before choosing which option to pursue.\n2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.\n3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.\n4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","screens":["UNIVERSITY COURSES:\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP","Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these","differences before choosing which option to pursue.","2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.","3 Research suggests that on t, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.","4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route."],"sources":[{"page":42,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3faae0ac09c9a6fd72af3617986035d009ad985cd29e631e584c4b9985c6f87b.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e38de55e7fb70bde2126ebc4d5a4b12a2dd7e2109201aece8fe4c64c40b2ed78.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"I think for a degree apprenticeship you\nneed to be good at working with others\nand flexible.\nFor a traditional degree you need to be self-\ndisciplined and able to meet deadlines.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/conte 41036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":31,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6722","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":2,"order":25,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Write the correct paragraph number (1–4) next to the description.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/973772666975e161764d8cc9b1878d9ebc88351183b8f602fcd3f0d8566dfcc4.png"],"provided":"","items":[{"id":"b6722.i01","label":"1","prompt":"Similarities between the two methods ____","options":[],"type":"gap/open"},{"id":"b6722.i02","label":"2","prompt":"General summary and conclusions ____","options":[],"type":"gap/open"},{"id":"b6722.i03","label":"3","prompt":"Differences between the methods ____","options":[],"type":"gap/open"},{"id":"b6722.i04","label":"4","prompt":"The history and background of the topic ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6722.i01","label":"1","prompt":"Similarities between the two methods ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6722.i02","label":"2","prompt":"General summary and conclusions ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6722.i03","label":"3","prompt":"Differences between the methods ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6722.i04","label":"4","prompt":"The history and background of the topic ____","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U02-classroom:material:RW-M04","title":"READING 2","text":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.\n2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard\nfor teachers to understand their students' specific learning needs.\n3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.\n4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","screens":["Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer span":1}]]},{"kind":"item","id":"b6723.i01","label":"1","prompt":"Distance learning advantages row 2","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i02","label":"2","prompt":"Distance learning advantages row 3","options":[],"type":"gap/open"}],[{"kind":"item","id":"b6723.i03","label":"3","prompt":"Distance learning advantages row 4","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i04","label":"4","prompt":"Distance learning disadvantages row 1","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i05","label":"5","prompt":"Distance learning disadvantages row 2","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i06","label":"6","prompt":"Distance learning disadvantages row 3","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i07","label":"7","prompt":"Distance learning disadvantages row 4","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i08","label":"8","prompt":"Face-to-face learning advantages row 1","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i09","label":"9","prompt":"Face-to-face learning advantages row 2","options":[],"type":"gap/open"}],[{"kind":"item","id":"b6723.i10","label":"10","prompt":"Face-to-face learning advantages row 3","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i11","label":"11","prompt":"Face-to-face learning advantages row 4","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i12","label":"12","prompt":"Face-to-face learning disadvantages row 1","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i13","label":"13","prompt":"Face-to-face learning disadvantages row 2","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i14","label":"14","prompt":"Face-to-face learning disadvantages row 3","options":[],"type":"gap/open"},{"kind":"item","id":"b6723.i15","label":"15","prompt":"Face-to-face learning disadvantages row 4","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B04-RW-U02-classroom:material:RW-M04","title":"READING 2","text":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.\n2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard\nfor teachers to understand their students' specific learning needs.\n3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.\n4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","screens":["Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning ha textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.","4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course."],"sources":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01e455a074aa7479dbacdbfddc0a4d9e711ed9854a3ffc29423e34410997d4af.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f349a55722d103c093b89457b45027e8adfca205e6ef48be23e65451f5579c9.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Distance learning\nAdvantages: not limited by geography, can\ntake place at any time, flexible, students\nwork at their own pace\nDisadvantages: heavily dependent on\ntechnology, needs discipline, the teacher\nmay not meet the student, the teacher may\nstruggle to identify student needs\nFace-to-face learning\nAdvantages: teacher and student can\ndevelop a personal relationship, only\nrequires a computer\nDisadvantages: must take place in real time\nand in one location","references":[{"source":"https://raw lly, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.\n4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","screens":["Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.","2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard","for teachers to understand their students' specific learning needs.","3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.","4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course."],"sources":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01e455a074aa7479dbacdbfddc0a4d9e711ed9854a3ffc29423e34410997d4af.png","width":3040,"height":4096}],"kind":"reading"},{"id":"B04-RW-U02-material:RW-M03","title":"READING 1","pages":[42],"text":"UNIVERSITY COURSES:\n\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP\n\nTraditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these differences before choosing which option to pursue.\n\n2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.\n\n3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.\n\n4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","screens":["UNIVERSITY COURSES:","A TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP","Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates","to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these differences before choosing which option to pursue.","2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or","societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.","3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer","the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.","4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more","school leavers choose this option over the traditional route."],"sources":[{"page":42,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3faae0ac09c9a6fd72af3617986035d009ad985cd29e631e584c4b9985c6f87b.png"}],"kind":"material","sourceBlockIds":["b6702"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f349a55722d103c093b89457b45027e8adfca205e6ef48be23e65451f5579c9.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I have done a course online. It was\ngood because I could choose when I\nwanted my lessons and I didn’t have to\ntravel. However, I wouldn’t want to do a\nlong course this way because I missed\nthe interaction with my teacher\nand classmates.\n2 I prefer face-to-face classes because I\nlike the social interaction.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735  100 words)","options":[],"type":"gap/open"},{"id":"b6760.i03","label":"Body paragraph 2","prompt":"Body paragraph 2: (similarities) Try to include at least 3 points (about 100 words)","options":[],"type":"gap/open"},{"id":"b6760.i04","label":"4","prompt":"Concluding paragraph: (re-instate your opinion) (about 50-100 words)","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-RW-U02-question:b6738","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[49]}],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Your notes","header":false,"colspan":1,"rowspan":1}],[{"text":"Introductory paragraph:(background information, thesis statement)(about 50-100 words)","header":false,"colspan":1,"rowspan":1},{"text":"Maths and languages are two important subjects which many people choose to study at university.While Maths is....","header":false,"colspan":1,"rowspan":1}],[{"text":"Body paragraph 1: (differences)Try to include at least 3 points(about 100 words)","header":false,"colspan":1,"rowspan":1},{"text":"When comparing the two subjects, the most obvious difference....","header":false,"colspan":1,"rowspan":1}],[{"text":"Body paragraph 2: (similarities)Try to include at least 3 points(about 100 words)","header":false,"colspan":1,"rowspan":1},{"text":"Although the subjects are very different, they do share some core principles...","header":false,"colspan":1,"rowspan":1}],[{"text":"Concluding paragraph: (re-instate your opinion) (about 50-100 words)","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Introductory\nparagraph:\nMaths and language\nseem like very\ndifferent subjects but\nthere are similarities\nbetween them\nBody paragraph 1:\n(differences)\nCreativity vs. rigidity,\nflexibility vs. specific\nmethods, logic\nvs. emotion\nBody paragraph 2:\n(similarities)\nPattern recognition,\nincremental learning,\nproblem solving\nConcluding\nparagraph:\nSummarize,\nemphasise common\nshared elements","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[{"page":55,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/461e96555669e217e4ce01e099e4aca89260a8b78e02f1f44a563f552c6e2030.png","width":3040,"height":4096}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6761","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":2,"order":41,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Remember you can use an adverb clause with while or whereas to show contrast for your thesis statement. Look at the thesis statements below, taken from Reading 1 and 2, and underline the adverb clause in each:","pages":[55],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/461e96555669e217e4ce01e099e4aca89260a8b78e02f1f44a563f552c6e2030.png"],"provided":"Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience ... – Reading 1\nWhile it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? – Reading 2","items":[{"id":"b6761.i01","label":"1","prompt":"Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience ... – Reading 1","options":[],"type":"select/open"},{"id":"b6761.i02","label":"2","prompt":"While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? – Reading 2","options":[],"type":"select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience ... – Reading 1"},{"kind":"text","text":"While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? – Reading 2"}]],"courseMaterials":[{"id":"B04-RW-U02-material:RW-M03","title":"READING 1","pages":[42],"text":"UNIVERSITY COURSES:\n\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP\n\nTraditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these differences before choosing which option to pursue.\n\n2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.\n\n3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.\n\n4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","screens":["UNIVERSITY COURSES:","A TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP","Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates","to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these differences before choosing which option to pursue.","2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or","societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.","3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer","the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.","4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more","school leavers choose this option over the traditional route."],"sources":[{"page":42,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3faae0ac09c9a6fd72af3617986035d009ad985cd29e631e584c4b9985c6f87b.png"}],"kind":"material","sourceBlockIds":["b6702"]},{"id":"B04-RW-U02-material:RW-M04","title":"READING 2","pages":[45],"text":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.\n2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard for teachers to understand their students' specific learning needs.\n3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.\n4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","screens":["Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online","degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.","2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able","to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard for teachers to understand their students' specific learning needs.","3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way.","For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.","4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course."],"sources":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01e455a074aa7479dbacdbfddc0a4d9e711ed9854a3ffc29423e34410997d4af.png"}],"kind":"material","sourceBlockIds":["b6720"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Whilst both degrees have the same qualification\nlevel, they differ significantly in terms of the student\nexperience … – Reading 1\nWhile it is now possible to obtain a large variety of online\ndegrees, which is the best type of education to pursue? –","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":33,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6762","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":2,"order":42,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Now write your own thesis statement.","pages":[55],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/461e96555669e217e4ce01e099e4aca89260a8b78e02f1f44a563f552c6e2030.png"],"provided":"","items":[{"id":"b6762.i01","label":"1","prompt":"Write your own thesis statement.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6762.i01","label":"1","prompt":"Write your own thesis statement.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"While Maths and languages may initially\nappear to be very different subjects,\nthere are numerous similarities between\nthem. These similarities include both what\nstudents learn, how they learn and what is\nrequired of them to be successful.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6763","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":2,"order":43,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Refer to the Task checklist on page 56 as you plan your essay.","pages":[55],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/461e96555669e217e4ce01e099e4aca89260a8b78e02f1f44a563f552c6e2030.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Did you give background information and a thesis statement in your introduction?"},{"kind":"text","text":"Do you have one body paragraph about the differences and another body paragraph about the similarities?"},{"kind":"text","text":"Did you use examples to strengthen your arguments in the body paragraphs?"},{"kind":"text","text":"Did you restate the thesis statement and give your opinion in the conclusion?"}],[{"kind":"text","text":"Did you write at least 3 differences and 3 similarities?"},{"kind":"text","text":"Did you check the word count?"}]],"courseMaterials":[{"id":"B04-RW-U02-publisher-page:p056","title":"原题或核对备注所引第56页","pages":[56],"text":"","screens":[],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a84c08391014934b81efe1b5c8f66f3ba68c3a1fa90b131ca773dbed90e1baf7.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B04-RW-U02-material:Task checklist p56","title":"第56页 Task checklist","pages":[56],"text":"","screens":[],"sources":[{"page":56,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a84c08391014934b81efe1b5c8f66f3ba68c3a1fa90b131ca773dbed90e1baf7.png"}],"kind":"task_checklist","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[{"page":55,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/461e96555669e217e4ce01e099e4aca89260a8b78e02f1f44a563f552c6e2030.png","width":3040,"height":4096}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U02-question:b6765","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":2,"order":44,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay using the outline.","pages":[56],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a84c08391014934b81efe1b5c8f66f3ba68c3a1fa90b131ca773dbed90e1baf7.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-RW-U02-question:b6760","kind":"student-work","title":"WRITING TASK Ex 1","pages":[55]}],"materials":[],"coursePages":[[{"kind":"text","text":"Write about 350–400 words."}]],"courseMaterials":[{"id":"B04-RW-U02-publisher-sheet:b6763","title":"WRITING TASK Ex 4 原题面","pages":[55],"text":"","screens":[],"sources":[{"page":55,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/461e96555669e217e4ce01e099e4aca89260a8b78e02f1f44a563f552c6e2030.png"}],"kind":"task_sheet","sourceBlockIds":["b6763"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"While Maths and languages may appear\nto be very different subjects, there are\nsimilarities between them. At first glance,\nMaths and languages seem to belong\nto completely different worlds. Maths is\nassociated with numbers and logic, while\nlanguages are linked to words and culture.\nHowever, both subjects share significant\nsimilarities in how they are learned and\nwhat students need to do to be successful.\nOne major similarity is the importance of\npattern recognition. In Maths, students\nneed to recognize patterns in numbers,\nequations, and shapes to solve problems.\nIn language learning, students must\nrecognize patterns in grammar and\nsentence structure. In Maths, students\ntypically start with basic concepts such\nas addition and subtraction, gradually\nmoving on to more complex topics. In\nlanguage learning, the process is similar.\nStudents begin with basic vocabulary and\nsimple sentences before advancing to\nmore complex grammar and expressions.\nProblem-solving skills are another aspect\nthat these subjects share. In Maths, solving\nequations is an activity that requires logical\nthinking and the ability to apply learned\ntechniques. In language learning, students\nuse problem-solving to understand new\nvocabulary or express complex ideas.\nIn contrast to these similarities, there are\nalso clear differences. One key difference\nis the role of creativity. Language learning\noften allows for more creativity and\nflexibility. There are many ways to express\nan idea or emotion in a language, and\npersonal style plays a big role. On the\nother hand, Maths is more rigid. There is\nusually one correct answer to a problem,\nand the methods to reach that answer\nare specific. In conclusion, while studying\nMaths and learning a language might seem\nvery different, they share many common\nelements. Both require pattern recognition,\ngradual learning, and problem-solving skills,\nalthough they differ in the level of creativity\nand flexibility they allow. Understanding\nthese similarities and differences can help\nstudents approach both subjects with\ngreater confidence and success.\nUNIT 3\nUNLOCK YOUR\nKNOWLEDGE\npage 59\n1 I have only heard of acupuncture, my\nfriend had it to help her with her\nback pain.\n2 No, I haven’t. But I would consider trying\nit, if it was recommended by the doctor.\n3 Some people prefer to use medicines\nwhich are more natural and help them\nfeel in control.\n4 Yes, we drink hot water and lemon juice\nwith honey for sore throats. We make\nginger tea for stomach ache.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":33,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},
