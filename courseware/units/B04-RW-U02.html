udent."},"themePhoto":{"box":[965,500,2071,3553],"nativeWidth":3040,"sourcePage":36,"alt":"本单元教材配图","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ebe3060004f323ce60a72d4cbde8fefe5dbc9f56b8e3b2a0ed9084bca017ce39.png"}}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U02-classroom:resource:b6678","book":4,"unit":2,"topic":"EDUCATION","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[36],"sourcePages":[36],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ebe3060004f323ce60a72d4cbde8fefe5dbc9f56b8e3b2a0ed9084bca017ce39.png"],"sourceHashes":["ebe3060004f323ce60a72d4cbde8fefe5dbc9f56b8e3b2a0ed9084bca017ce39"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a comparison and contrast essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about global literacy campaigns."},{"label":"Reading skill","text":"Make inferences."},{"label":"Critical thinking","text":"Analyze similarities and differences; use a Venn diagram to plan a comparison-contrast essay."},{"label":"Grammar","text":"Use transitions to show comparison and contrast; use adverb clauses of contrast."},{"label":"Academic writing skill","text":"Avoid run-on sentences and comma splices; write a comparison and contrast essay."}],"photo":{"box":[965,500,2071,3553],"nativeWidth":3040,"sourcePage":36,"alt":""}}]}},{"id":"B04-RW-U02-classroom:resource:b6685","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[38],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/336380f30b53c71e26cbca28c9dabc369ed3cbc1e59d8501796b0e429d8a9f59.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"illiteracy","pos":"(n)","definition":"a lack of the ability to read and write","example":"The adult reading classes aim to reduce illiteracy.","wordAudio":"illiteracy","cardWord":false},{"term":"disadvantaged","pos":"(adj)","definition":"not having the standard of living conditions, education, etc. that most people have","example":"The programme gives disadvantaged students access to computers.","wordAudio":"disadvantaged","cardWord":false},{"term":"drop out","pos":"(phr v)","definition":"to not do something that you were going to do (e.g. not finish a course)","example":"He almost decided to drop out of the course.","wordAudio":"drop out","cardWord":false},{"term":"stigma","pos":"(n)","definition":"a strong feeling of disapproval that most people in a society have about something, especially when this is unfair","example":"The group works to reduce the stigma around mental illness.","wordAudio":"stigma","cardWord":false},{"term":"turn to sth","pos":"(phr v)","definition":"to start to do something bad, especially when unhappy","example":"Some people turn to gambling when they are under a lot of stress.","wordAudio":"turn to sth","cardWord":false}]]}},{"id":"B04-RW-U02-classroom:video","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[38],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/336380f30b53c71e26cbca28c9dabc369ed3cbc1e59d8501796b0e429d8a9f59.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/4c3d64400f29cf01ff9b0b59-L4RW-U02.mp4","captions":[{"start":1.88,"end":4.72,"text":"At the School for Grannies in India,"},{"start":5.38,"end":10.48,"text":"the women can fulfill a lifelong ambition to learn to\nread and write."},{"start":14.34,"end":16.36,"text":"I never went to school as a child."},{"start":17.88,"end":21.44,"text":"It feels great to come now and study with my friends."},{"start":24.04,"end":25.66,"text":"The school may be unusual,"},{"start":26.04,"end":28.22,"text":"but adult illiteracy isn't."},{"start":29.1,"end":37.18,"text":"The actor Idris Elba works with the global literacy\ncampaign Project Literacy, which aims to ensure that"},{"start":37.18,"end":37.46,"text":"no"},{"start":37.46,"end":40.34,"text":"child is born at risk of poor literacy."},{"start":41.3,"end":44,"text":"So that ideology is about talking to adults."},{"start":44.28,"end":47.3,"text":"Most people think illiteracy is young people, isn't it?"},{"start":47.3,"end":53.62,"text":"It's adults who live their life doing this, and now are\ntoo afraid to even say and mention this and I can't\nread."},{"start":53.62,"end":61.64,"text":"Globally, there are around 750 million adults who\ncannot read a simple sentence, nor write their name."},{"start":62.66,"end":65.72,"text":"Fifty percent of these adults live in South Asia."},{"start":67.24,"end":67.74,"text":"However,"},{"start":68.03999999999999,"end":69.78,"text":"the issue affects most regions."},{"start":70.98,"end":71.82,"text":"For example,"},{"start":72.22,"end":77.02,"text":"70 million adults in the United States have very low\nlevels of literacy."},{"start":78.06,"end":84.56,"text":"Illiteracy often causes individuals to be disadvantaged\nand feel excluded from society."},{"start":85.52,"end":89.22,"text":"When we used to go to the bank, we had to give\nthumbprints."},{"start":89.58,"end":92.2,"text":"It was embarrassing and there was a stigma attached."},{"start":92.6,"end":95.62,"text":"Now I feel proud and happy because I can sign my name."},{"start":97.5,"end":103.1,"text":"Many adults who cannot read will try to hide their\nilliteracy from their family and friends."},{"start":103.9,"end":109.06,"text":"There's a lady called Wanda from New Jersey and she\ncouldn't read or write."},{"start":109.06,"end":115.6,"text":"She got two young kids and what she would do when the\nkids would ask her to sort of read a story time,\nbedtime story,"},{"start":116,"end":120.72,"text":"she would look at the pictures in a book and just make\nup the words."},{"start":121.38,"end":125.08,"text":"But she communicated to her children the love of\nreading books even though she couldn't do it."},{"start":125.48,"end":130.78,"text":"These are success stories, but statistically for\nchildren of parents who cannot read,"},{"start":131.16,"end":132.96,"text":"the outlook is less positive."},{"start":133.74,"end":139.3,"text":"These children have below average literacy levels\nthemselves and higher numbers drop out of school."},{"start":139.66,"end":140.84,"text":"Some turn to crime."},{"start":141.5,"end":145.54,"text":"Learning to read and write at any age is one way to end\nthe cycle."}],"launchInline":true}},{"id":"B04-RW-U02-classroom:material:RW-M03","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[42],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3faae0ac09c9a6fd72af3617986035d009ad985cd29e631e584c4b9985c6f87b.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"UNIVERSITY COURSES:\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP","sourcePage":42},{"body":"Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these","sourcePage":42},{"body":"differences before choosing which option to pursue.","sourcePage":42},{"body":"2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.","sourcePage":42},{"body":"3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.","sourcePage":42},{"body":"4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","sourcePage":42}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U02-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"UNIVERSITY COURSES:","pages":[{"page":42,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3faae0ac09c9a6fd72af3617986035d009ad985cd29e631e584c4b9985c6f87b.png","width":3040,"height":4096}],"source":42,"embeddedIn":null,"photo":null,"clearPages":[{"body":"UNIVERSITY COURSES:\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP","sourcePage":42},{"body":"Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these","sourcePage":42},{"body":"differences before choosing which option to pursue.","sourcePage":42},{"body":"2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.","sourcePage":42},{"body":"3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.","sourcePage":42},{"body":"4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","sourcePage":42}],"text":"UNIVERSITY COURSES:\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP\nTraditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these\ndifferences before choosing which option to pursue.\n2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.\n3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.\n4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e38de55e7fb70bde2126ebc4d5a4b12a2dd7e2109201aece8fe4c64c40b2ed78.mp3"},"original":{"id":"B04-RW-U02-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U02","book":4,"track":"RW","unit":2,"title":"READING 1","kind":"material","pages":[42],"sourceImages":[{"page":42,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3faae0ac09c9a6fd72af3617986035d009ad985cd29e631e584c4b9985c6f87b.png","viewEvidenceReported":true}],"text":"UNIVERSITY COURSES:\n\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP\n\nTraditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at 28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience. Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential for school-leavers to carefully consider these differences before choosing which option to pursue.\n\n2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but may also feel excluded from the student community.\n\n3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.\n\n4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the traditional route.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6702"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e38de55e7fb70bde2126ebc4d5a4b12a2dd7e2109201aece8fe4c64c40b2ed78.mp3","continueOnPage":true}},{"id":"B04-RW-U02-classroom:material:RW-M04","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[45],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01e455a074aa7479dbacdbfddc0a4d9e711ed9854a3ffc29423e34410997d4af.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.","sourcePage":45},{"body":"2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard","sourcePage":45},{"body":"for teachers to understand their students' specific learning needs.","sourcePage":45},{"body":"3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.","sourcePage":45},{"body":"4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","sourcePage":45}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U02-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":45,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01e455a074aa7479dbacdbfddc0a4d9e711ed9854a3ffc29423e34410997d4af.png","width":3040,"height":4096}],"source":45,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.","sourcePage":45},{"body":"2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard","sourcePage":45},{"body":"for teachers to understand their students' specific learning needs.","sourcePage":45},{"body":"3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.","sourcePage":45},{"body":"4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","sourcePage":45}],"text":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.\n2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard\nfor teachers to understand their students' specific learning needs.\n3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.\n4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f349a55722d103c093b89457b45027e8adfca205e6ef48be23e65451f5579c9.mp3"},"original":{"id":"B04-RW-U02-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U02","book":4,"track":"RW","unit":2,"title":"READING 2","kind":"material","pages":[45],"sourceImages":[{"page":45,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/01e455a074aa7479dbacdbfddc0a4d9e711ed9854a3ffc29423e34410997d4af.png","viewEvidenceReported":true}],"text":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.\n2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or never actually meet the student. This may make it hard for teachers to understand their students' specific learning needs.\n3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.\n4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the advantages and disadvantages of each method before deciding to take a course.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6720"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f349a55722d103c093b89457b45027e8adfca205e6ef48be23e65451f5579c9.mp3","continueOnPage":true}},{"id":"B04-RW-U02-classroom:review-1","book":4,"unit":2,"track":"RW","topic":"EDUCATION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[57]," l":"a","textEn":"Certain students prefer studying online while, others lack motivation."},{"optionLabel":"b","textEn":"While certain students prefer studying online, others lack motivation."}],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":1}}]]}},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U02-classroom:material:RW-M03":[{"body":"UNIVERSITY COURSES:\nA TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP","sourcePage":42,"blocks":[{"kind":"text","text":"UNIVERSITY COURSES:"},{"kind":"text","text":"A TRADITIONAL DEGREE VS A DEGREE APPRENTICESHIP"}]},{"body":"Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at","sourcePage":42,"blocks":[{"kind":"text","text":"Traditional university degrees have been valued for hundreds of years. A university education allows graduates to make better choices by increasing job opportunities for a broad range of careers. Research shows that men with a university education can earn salaries of around 8% more than their peers and for graduate women the gap is even bigger at"}]},{"body":"28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience.","sourcePage":42,"blocks":[{"kind":"text","text":"28%. It is not surprising, therefore, that university is the most popular higher education option with nearly eight hundred thousand school-leavers starting a degree course in 2023. However, even though a traditional degree is extremely beneficial, it can still be extremely challenging for graduates to find a job due to a lack of work experience."}]},{"body":"Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential","sourcePage":42,"blocks":[{"kind":"text","text":"Degree apprenticeships, which were introduced in the UK in 2015, are realistic alternatives to gaining a degree qualification, particularly with school-leavers who want to 'earn as they learn'. Whilst both degrees have the same qualification level, they differ significantly in terms of the student experience and employability, and it is essential"}]},{"body":"for school-leavers to carefully consider these","sourcePage":42,"blocks":[{"kind":"text","text":"for school-leavers to carefully consider these"}]},{"body":"differences before choosing which option to pursue.","sourcePage":42,"blocks":[{"kind":"text","text":"differences before choosing which option to pursue."}]},{"body":"2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending","sourcePage":42,"blocks":[{"kind":"text","text":"2 Student life will be different for an apprentice compared to other forms of higher education. Although degree apprentices will experience certain aspects of campus life, they will not share the traditional experience of students who are studying at university full-time. For example, rather than spend around 30 hours per week on campus attending"}]},{"body":"lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in","sourcePage":42,"blocks":[{"kind":"text","text":"lectures and seminars and completing assignments in their own time, apprentices spend this time 'on the job' learning workplace skills with just 20% set aside for university. Of course, this means they also have less free time to take part in 'extra-curricular activities, like joining clubs or societies. Holiday time is also markedly different in"}]},{"body":"that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but","sourcePage":42,"blocks":[{"kind":"text","text":"that full-time students get over three months holiday annually at the end of term or semester. Conversely, apprentices, as they are employees as well as students, receive just four or five weeks. Therefore, whilst apprentices gain real-life work experience while earning a wage, they not only have to balance working and studying at the same time but"}]},{"body":"may also feel excluded from the student community.","sourcePage":42,"blocks":[{"kind":"text","text":"may also feel excluded from the student community."}]},{"body":"3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders","sourcePage":42,"blocks":[{"kind":"text","text":"3 Research suggests that one of the main advantages graduate apprentices have over their peers is that they learn key workplace skills. During their apprenticeship students will attend meetings and meet deadlines. They will build valuable relationships with colleagues at many different levels and may even communicate with external ² stakeholders"}]},{"body":"like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university","sourcePage":42,"blocks":[{"kind":"text","text":"like customers. These ³ soft skills', for example, teamwork and time-management, will help graduate apprentices achieve success throughout their working lives. However, degree apprenticeships tend to be vocational, and whilst they are not limited to trades or engineering, they do not currently offer the enormous choice of traditional university"}]},{"body":"degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer.","sourcePage":42,"blocks":[{"kind":"text","text":"degrees. In addition, although apprentices can quit, if they choose not to continue in their chosen industry, they may find they have limited qualifications to transfer to another employer."}]},{"body":"4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree","sourcePage":42,"blocks":[{"kind":"text","text":"4 To conclude, traditional degrees and degree apprenticeships are both excellent choices for school-leavers and are well regarded by employers, but they differ in significant ways. Degree apprenticeships do not give students the same ‘traditional’ student experience nor the wide range of career choices which the open nature of a traditional degree"}]},{"body":"provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the\ntraditional route.","sourcePage":42,"blocks":[{"kind":"text","text":"provides. On the other hand, degree apprenticeships provide in-depth workplace experience and commercial skills whilst allowing students to earn a salary as they study. As the number of UK employers offering degree apprenticeship continues to rise, it will be interesting to see whether more and more school leavers choose this option over the"},{"kind":"text","text":"traditional route."}]}],"B04-RW-U02-classroom:material:RW-M04":[{"body":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is","sourcePage":45,"blocks":[{"kind":"text","text":"Although many people think it is a modern phenomenon, distance learning has been around for at least 200 years in one form or another. Historical examples of long-distance learning include students being sent a series of weekly lessons by mail. The technological advances of the past 20 or so years, however, have meant that this form of education is"}]},{"body":"now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A","sourcePage":45,"blocks":[{"kind":"text","text":"now a credible alternative to face-to-face learning. Indeed, 1996 saw the establishment of the world's first 'virtual university' in the United States, showing how far distance learning has come in a relatively short space of time. While it is now possible to obtain a large variety of online degrees, which is the best type of education to pursue? A"}]},{"body":"closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities.","sourcePage":45,"blocks":[{"kind":"text","text":"closer examination of this topic reveals that distance and traditional educational instruction have significant differences but also some similarities."}]},{"body":"2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the","sourcePage":45,"blocks":[{"kind":"text","text":"2 When comparing the two systems, the most obvious difference lies in the way that instruction is delivered. Distance learning is heavily dependent on technology, particularly the internet. In a face-to-face course, students may only require a computer for the purpose of writing an essay. In comparison, when learning remotely, technology is the"}]},{"body":"principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also","sourcePage":45,"blocks":[{"kind":"text","text":"principal means of communication. Face-to-face instruction must take place in real time and in one location. Conversely, distance learning can happen at any time and in any location, since the learning is not restricted by geography. The flexibility this provides means that students may be better able to learn at their own pace, but it may also"}]},{"body":"mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or","sourcePage":45,"blocks":[{"kind":"text","text":"mean that learners have to be well organized and self-disciplined. In other words, they must be more highly motivated in order to do well in distance-learning courses. Finally, with face-to-face learning, the teacher and student have the opportunity to develop a personal relationship. In a virtual classroom, by contrast, the teacher may seldom or"}]},{"body":"never actually meet the student. This may make it hard","sourcePage":45,"blocks":[{"kind":"text","text":"never actually meet the student. This may make it hard"}]},{"body":"for teachers to understand their students' specific learning needs.","sourcePage":45,"blocks":[{"kind":"text","text":"for teachers to understand their students' specific learning needs."}]},{"body":"3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be","sourcePage":45,"blocks":[{"kind":"text","text":"3 Although the nature of the teacher-student relationship may differ in the two methods, they do share the same core principles. Just as a teacher is the 'knower' in a classroom, he or she is the one responsible for helping students understand the key sections of an online course. The teacher needs to decide how to best present the material to be"}]},{"body":"learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may","sourcePage":45,"blocks":[{"kind":"text","text":"learned and in which sequence the topics should be introduced. He or she must also create the assignments for the course and help the students know what resources (textbooks, websites and so on) will best support their learning. Additionally, a teacher needs to provide student feedback in some way. For example, a language teacher in a classroom may"}]},{"body":"be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used.","sourcePage":45,"blocks":[{"kind":"text","text":"be able to correct a student's grammar or pronunciation in the moment, whereas a distance-learning teacher may need to provide written or recorded feedback to be delivered later. In any case, all the usual elements of the teacher's role are necessary, no matter what kind of instruction is being used."}]},{"body":"4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the","sourcePage":45,"blocks":[{"kind":"text","text":"4 It is difficult to state whether one form of learning is better than another, since they are geared towards different learning situations. They are certainly different experiences. Nevertheless, there are strong similarities between the two systems, which can both produce positive results. A student who has the choice should consider the"}]},{"body":"advantages and disadvantages of each method before deciding to take a course.","s
