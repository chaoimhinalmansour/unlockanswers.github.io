252.i02","label":"b","prompt":"Dolphins and egrets live together in the marshes of South Carolina.","options":[],"type":"gap/closed"},{"kind":"item","id":"b5252.i03","label":"c","prompt":"The dolphins' fishing is the only way some egrets get food. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b5252.i04","label":"d","prompt":"The egrets watch the dolphins in the water carefully. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b5252.i05","label":"e","prompt":"The dolphins push the fish onto land. ____","options":[],"type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/382a813399ed8ee5e70c8cd0-L3RW-U01.mp4","captions":[{"start":2.72,"end":7.98,"text":"The marshes of South Carolina are the location of an\ninteresting fish tail."},{"start":11.6,"end":16.06,"text":"There, these dolphins and egrets work together in a\nvery special way."},{"start":22.56,"end":25.8,"text":"These egrets are experts on the dolphins behavior."},{"start":46.78,"end":54.52,"text":"The moment a dolphin comes to the surface of the water\nand checks the nearest mud bank, the birds get ready\nfor action."},{"start":58.32,"end":59.5,"text":"Then it happens."},{"start":60.06,"end":62.74,"text":"The dolphins push the fish onto the shore."},{"start":71.94,"end":75.5,"text":"When the fish are out of the water, the dolphins start\neating."},{"start":76.86,"end":79.58,"text":"But the egrets also join them for dinner."},{"start":106.78,"end":110.7,"text":"This is the only place in the world where you can see\nthis kind of behavior."},{"start":139.57999999999998,"end":144.44,"text":"Strangely, the dolphins always use their right sides to\npush the fish to the shore."},{"start":148.72,"end":153.5,"text":"The young dolphins learn this fishing technique from\ntheir parents, and so do the young egrets."},{"start":154.4,"end":157.66,"text":"Many of the birds now depend on the dolphins for their\nfood."},{"start":158.76,"end":161.16,"text":"They never even fish for themselves."},{"start":164.12,"end":171.48,"text":"These egrets and dolphins demonstrate the ability of\ndifferent animal species to work together in order to\nsurvive."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 4 b 1 c 5 d 2 e 3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":23,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5253","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Write T (true), F (false) or DNS (does not say) next to the statements below. Then correct the false statements.","pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26617ab2e7abcc9a0814fba1a7a0271ceaad7b43561618a0a0a6378d520dd787.png"],"provided":"","items":[{"id":"b5253.i01","label":"1","prompt":"The egrets are experts on the dolphins' behaviour.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b5253.i02","label":"2","prompt":"The dolphins push the egrets onto the shore.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b5253.i03","label":"3","prompt":"When the fish are in the water, the dolphins start eating.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b5253.i04","label":"4","prompt":"The dolphins always use their left sides to push the fish.","options":["True","False"],"type":"choice_gap/closed"},{"id":"b5253.i05","label":"5","prompt":"Some of the b ou know.","pages":[18],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/83ac13cea6f156e1b6ec0e6acb896df6597beeac68cee59356170be6459c2a6f.png"],"provided":"","items":[{"id":"b5259.i01","label":"1","prompt":"What is the difference between an 'endangered' and an 'extinct' species?","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5259.i01","label":"1","prompt":"What is the difference between an 'endangered' and an 'extinct' species?","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B03-RW-U01-publisher-page:p019","title":"原题或核对备注所引第19页","pages":[19],"text":"","screens":[],"sources":[{"page":19,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e6144a16d00116ad2a53eee83bd3cfb02fc3966e64732fa238fe57192c71576.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":1,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5260","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"order":9,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the essay. Then, complete the table on page 19 with the names of any other endangered animals mentioned in the essay.","pages":[18],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/83ac13cea6f156e1b6ec0e6acb896df6597beeac68cee59356170be6459c2a6f.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B03-RW-U01-publisher-page:p019","title":"原题或核对备注所引第19页","pages":[19],"text":"","screens":[],"sources":[{"page":19,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e6144a16d00116ad2a53eee83bd3cfb02fc3966e64732fa238fe57192c71576.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Arabian oryx, some seal species, tigers, crocodiles, whales,\ntuna, sharks","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5265","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"order":10,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the essay again and write the paragraph number next to the main ideas.","pages":[20],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bdeceecf11338d267c230f50aec1fb8cdd59f6de364850789168d95736ec0cca.png"],"provided":"","items":[{"id":"b5265.i01","label":"a","prompt":"How hunting and overfishing endanger animals ____","options":[],"type":"gap/closed"},{"id":"b5265.i02","label":"b","prompt":"The definition of endangered and extinct species ____","options":[],"type":"gap/closed"},{"id":"b5265.i03","label":"c","prompt":"How governments and citizens can protect animals ____","options":[],"type":"gap/closed"},{"id":"b5265.i04","label":"d","prompt":"How humans destroy and pollute animal habitats ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5265.i01","label":"a","prompt":"How hunting and overfishing endanger animals ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b5265.i02","label":"b","prompt":"The definition of endangered and extinct species ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b5265.i03","label":"c","prompt":"How governments and citizens can protect animals ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b5265.i04","label":"d","prompt":"How humans destroy and pollute animal habitats ____","options":[],"type":"gap/closed"}]],"courseMaterials":[{"id":"B03-RW-U01-classroom:material:RW-M03","title":"READING 1","text":"# ENDANGERED SPECIES\n[IMAGE_1]\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.\n2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.\n3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.\n4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too.","screens":["# ENDANGERED SPECIES\n[IMAGE_1]\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.","2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.","3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.","4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too."],"sources":[{"page":19,"src":"https://raw.githu  them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.\n2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.\n3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.\n4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too.","screens":["# ENDANGERED SPECIES\n[IMAGE_1]\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.","2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.","3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.","4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too."],"sources":[{"page":19,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e6144a16d00116ad2a53eee83bd3cfb02fc3966e64732fa238fe57192c71576.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_0b5b23d090a98a5f.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":1,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5293","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"order":15,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Read sentences 1–6 and choose the correct definition of the words in bold.","pages":[ rce":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":24,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":1,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5282","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"order":20,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Read the fact file again. Complete the student summary with the correct numbers.","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png"],"provided":"The red squirrel has a typical head-and-body length of approximately (1) ____ to (2) ____ cm, a tail length of (3) ____ to (4) ____ cm and a body weight of (5) ____ to (6) ____ grams. The grey squirrel is larger than the red squirrel. The head and body measure between (7) ____ and (8) ____ cm, and the tail is between (9) ____ and (10) ____ cm long. Adult grey squirrels are also heavier, weighing between (11) ____ and (12) ____ grams. This size allows them to store more fat and helps them to survive hard winters, which can be fatal to their smaller cousins.","items":[{"id":"b5282.i01","label":"1","prompt":"The red squirrel has a typical head-and-body length of approximately (1) ____ to (2) ____ cm","options":[],"type":"gap/closed"},{"id":"b5282.i02","label":"2","prompt":"The red squirrel has a typical head-and-body length of approximately (1) ____ to (2) ____ cm","options":[],"ty als":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 19 2 23 3 15 4 20 5 250 6 340 7 23 8 30\n9 19 10 25 11 400 12 600","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":24,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5284","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"order":21,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work in groups of four students, A, B, C and D. Read the text according to your letter. In your notebook, take notes about the main ideas and details in your text. Check the meaning of any words you don't know.","pages":[22],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png"],"provided":"Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\n\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]\nThen, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","items":[{"id":"b5284.i01","label":"Student A","prompt":"Take notes about the main ideas and details in Student A's text. Check the meaning of any words you don't know.","options":[],"type":"qa/open"},{"id":"b5284.i02","label":"Student B","prompt":"Take notes about the main ideas and details in Student B's text. Check the meaning of any words you don't know.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Student A"},{"kind":"text","text":"Invasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK."},{"kind":"text","text":"Student B"},{"kind":"text","text":"Red squirrels used to be a common sight in British forests and countryside."}],[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed."},{"kind":"item","id":"b5284.i01","label":"Student A","prompt":"Take notes about the main ideas and details in Student A's text. Check the meaning of any words you don't know.","options":[],"type":"qa/open"},{"kind":"item","id":"b5284.i02","label":"Student B","prompt":"Take notes about the main ideas and details in Student B's text. Check the meaning of any words you don't know.","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B03-RW-U01-classroom:material:RW-M04","title":"READING 2","text":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]\n[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>\nStudent A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]\nThen, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.\nThree more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.\nIn conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","screens":["Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]","[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>","Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]","Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.","In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals."],"sources":[{"page":21,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","width":772,"height":1040},{"page":22,"src":"https://raw.githubusercon oes not seem to affect grey squirrels, but it is fatal to reds.","In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals."],"sources":[{"page":21,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","width":772,"height":1040},{"page":22,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png","width":772,"height":1040},{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_c7e6818264df7e3b.mp3"}],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5289","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"order":23,"module":"READING 2","ex":"6","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work in your group from Exercise 4. Look at questions 2–5 in Exercise 1 again and check your answers. Say which paragraph the answers are found in.","pages":[23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B03-RW-U01-question:b5276","kind":"student-work","title":"READING 2 Ex 1","pages":[21]},{"id":"B03-RW-U01-question:b5277","kind":"student-work","title":"READING 2 Ex 2","pages":[21]},{"id":"B03-RW-U01-question:b5284","kind":"material-reference","title":"READING 2 Ex 4","pages":[22]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B03-RW-U01-classroom:material:RW-M04","title":"READING 2","text":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]\n[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>\nStudent A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]\nThen, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.\nThree more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.\nIn conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","screens":["Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]","[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>","Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]","Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.","In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals."],"sources":[{"page":21,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","width":772,"height":1040},{"page":22,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png","width":772,"height":1040},{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_c7e6818264df7e3b.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"2 Grey squirrels are seen as a pest because of the damage\nthey do to plants and houses. (B)\n3 The grey squirrel was introduced to the UK from North\nAmerica. The red squirrel is native to the UK. (B)\n4 Grey squirrels can survive best in difficult conditions. (C)\n5 Grey squirrels are more likely to survive a disease\nor virus. (C)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":25,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5290","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"order":24,"module":"READING 2","ex":"7","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work in your group from Exercise 4. Use you d>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>\nStudent A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]\nThen, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.\nThree more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.\nIn conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","screens":["Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]","[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>","Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]","Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.","In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals."],"sources":[{"page":21,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","width":772,"height":1040},{"page":22,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png","width":772,"height":1040},{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_c7e6818264df7e3b.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":25,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":1,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5300","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"order":26,"module":"CRITICAL THINKING","ex": 5bc717dc610ee4.png"}],"kind":"publisher_reference_surface","sourceBlockIds":[]},{"id":"B03-RW-U01-publisher-sheet:b5303","title":"CRITICAL THINKING Ex 4 原题面","pages":[27],"text":"## Whale shark\n\nAnimal class: Chondrichthyes (fish)\n\nHabitat: Oceans\n\nLength: 5.5–10 m\n\nWeight: 18 tonnes\n\nColour: White stomach, grey-blue back and sides with light spots\n\nDiet: Plankton, krill, other very small animals\n\nConservation status: Endangered (will probably become extinct)\n\nBehaviour towards humans: No recorded attacks\n\n## Tiger shark\n\nAnimal class: Chondrichthyes (fish)\n\nHabitat: Oceans\n\nLength: 3.0–4.2 m\n\nWeight: 0.86 tonnes\n\nColour: White stomach, grey-brown back and sides\n\nDiet: Tuna, dolphins, turtles\n\nConservation status: Not currently at risk of extinction\n\nBehaviour towards humans: Many reports of attacks on humans","screens":["## Whale shark","Animal class: Chondrichthyes (fish)","Habitat: Oceans","Length: 5.5–10 m","Weight: 18 tonnes","Colour: White stomach, grey-blue back and sides with light spots","Diet: Plankton, krill, other very small animals","Conservation status: Endangered (will probably become extinct)","Behaviour towards humans: No recorded attacks","## Tiger shark","Animal class: Chondrichthyes (fish)","Habitat: Oceans","Length: 3.0–4.2 m","Weight: 0.86 tonnes","Colour: White stomach, grey-brown back and sides","Diet: Tuna, dolphins, turtles","Conservation status: Not currently at risk of extinction","Behaviour towards humans: Many reports of attacks on humans"],"sources":[{"page":27,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/31bae0ced84f398df8df250e210336c2180ba2955afd695eb75bc717dc610ee4.png"}],"kind":"task_sheet","sourceBlockIds":["b5303"]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd0 "2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"In the following two texts, the topic sentences are missing. Read each text and the three possible topic sentences (a–c) below it. Circle the letter of two possible topic sentences for each text.","pages":[32],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c20e51d736e339ca98cfdb609c6168d3287dc103f575d45814ea7d009bbc3e54.png"],"provided":"","items":[{"id":"b5322.i01","label":"1","prompt":"Both bear species are native to North America and are common in both the United States and Canada. Neither the black bear nor the grizzly bear is an endangered species. Despite their names, the species are also similar in colour. 'Black' bears can be black, brown, red and even white. In the same way, grizzlies can range in colour from black to blonde. Finally, the two bear species are similar in behaviour. They are intelligent, curious and gentle unless humans enter their area or try to hurt their babies. Then both bears can become dangerous.","options":[{"optionLabel":"a","optionEn":"Bears are one of the biggest attractions in the national parks of North America."},{"optionLabel":"b","optionEn":"The American black bear and the grizzly, or brown, bear are similar in many ways."},{"optionLabel":"c","optionEn":"The American black bear and the grizzly, or brown, bear are similar in habitat, colour and behaviour."}],"type":"choice/open"},{"id":"b5322.i02","label":"2","prompt":"African elephants are much larger than Asian elephants and have much larger ears to protect them from the hot African sun. African elephants also have more wrinkled skin than their Asian cousins. Although the two species have tusks – large, curved teeth – only male Asian elephants have them, whereas both male and female African elephants do. However, despite these differences, the African and Asian species are similar in several important ways. First, both species are very social. They live in groups which are usually led by the oldest female. Second, elephants are naturally gentle animals. Neither African nor Asian elephants are dangerous to humans in normal circumstances.","options":[{"optionLabel":"a","optionEn":"African and Asian elephants are different in appearance, but they are similar socially."},{"optionLabel":"b","optionEn":"African and Asian elephants have both differences and similarities."},{"optionLabel":"c","optionEn":"African and Asian elephants are very similar in appearance."}],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5322.i01","label":"1","prompt":"Both bear species are native to North America and are common in both the United States and Canada. Neither the black bear nor the grizzly bear is an endangered species. Despite their names, the species are also similar in colour. 'Black' bears can be black, brown, red and even white. In the same way, grizzlies can range in colour from black to blonde. Finally, the two bear species are similar in behaviour. They are intelligent, curious and gentle unless humans enter their area or try to hurt their babies. Then both bears can become dangerous.","options":[{"optionLabel":"a","optionEn":"Bears are one of the biggest attractions in the national parks of North America."},{"optionLabel":"b","optionEn":"The American black bear and the grizzly, or brown, bear are similar in many ways."},{"optionLabel":"c","optionEn":"The American black bear and the grizzly, or brown, bear are similar in habitat, colour and behaviour."}],"type":"choice/open"}],[{"kind":"item","id":"b5322.i02","label":"2","prompt":"African elephants are much larger than Asian elephants and have much larger ears to protect them from the hot African sun. African elephants also have more wrinkled skin than their Asian cousins. Although the two species have tusks – large, curved teeth – only male Asian elephants have them, whereas both male and female African elephants do. However, despite these differences, the African and Asian species are similar in several important ways. First, both species are very social. They live in groups which are usually led by the oldest female. Second, elephants are naturally gentle animals. Neither African nor Asian elephants are dangerous to humans in normal circumstances.","options":[{"optionLabel":"a","optionEn":"African and Asian elephants are different in appearance, but they are similar socially."},{"optionLabel":"b","optionEn":"African and Asian elephants have both differences and similarities."},{"optionLabel":"c","optionEn":"African and Asian elephants are very similar in appearance."}],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 b, c 2 a, b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":27,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U01-question:b5325","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"order":39,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Review your notes in the Venn diagram you created in Exercise 5 in the Critical thinking section.","pages":[33],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/67c548ae37fc9d71804e8e88c97ea928c8f427466ccc66ee92644e9f130cb856.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B03-RW-U01-question:b5304","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[28]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"
