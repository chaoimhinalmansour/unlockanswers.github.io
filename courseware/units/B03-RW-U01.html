"id":"B03-RW-U01-classroom:resource:b5250","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[16],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ea7141d7d28193a97f0f410889b831ca4796e6033e33002f03ea74cfeae5a825.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"marsh","pos":"(n)","definition":"an area of soft, wet land","example":"We saw several kinds of birds in the marsh.","wordAudio":"marsh","cardWord":false},{"term":"egret","pos":"(n)","definition":"a large white bird with long legs which lives near water","example":"An egret stood in the shallow water.","wordAudio":"egret","cardWord":false},{"term":"surface","pos":"(n)","definition":"the top part or layer of something","example":"A leaf floated on the surface of the water.","wordAudio":"surface","cardWord":false},{"term":"mud bank","pos":"(n)","definition":"sloping raised land made of wet earth, especially along the sides of a river","example":"The birds rested on a mud bank beside the river.","wordAudio":"mud bank","cardWord":false},{"term":"shore","pos":"(n)","definition":"the land beside an ocean, a lake or a river","example":"We pulled the boat onto the shore.","wordAudio":"shore","cardWord":false},{"term":"depend on","pos":"(phr v)","definition":"to need the help of someone or something in order to exist or continue as before","example":"The plants depend on rain to grow.","wordAudio":"depend on","cardWord":false}]]}},{"id":"B03-RW-U01-classroom:video","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[17],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26617ab2e7abcc9a0814fba1a7a0271ceaad7b43561618a0a0a6378d520dd787.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/382a813399ed8ee5e70c8cd0-L3RW-U01.mp4","captions":[{"start":2.72,"end":7.98,"text":"The marshes of South Carolina are the location of an\ninteresting fish tail."},{"start":11.6,"end":16.06,"text":"There, these dolphins and egrets work together in a\nvery special way."},{"start":22.56,"end":25.8,"text":"These egrets are experts on the dolphins behavior."},{"start":46.78,"end":54.52,"text":"The moment a dolphin comes to the surface of the water\nand checks the nearest mud bank, the birds get ready\nfor action."},{"start":58.32,"end":59.5,"text":"Then it happens."},{"start":60.06,"end":62.74,"text":"The dolphins push the fish onto the shore."},{"start":71.94,"end":75.5,"text":"When the fish are out of the water, the dolphins start\neating."},{"start":76.86,"end":79.58,"text":"But the egrets also join them for dinner."},{"start":106.78,"end":110.7,"text":"This is the only place in the world where you can see\nthis kind of behavior."},{"start":139.57999999999998,"end":144.44,"text":"Strangely, the dolphins always use their right sides to\npush the fish to the shore."},{"start":148.72,"end":153.5,"text":"The young dolphins learn this fishing technique from\ntheir parents, and so do the young egrets."},{"start":154.4,"end":157.66,"text":"Many of the birds now depend on the dolphins for their\nfood."},{"start":158.76,"end":161.16,"text":"They never even fish for themselves."},{"start":164.12,"end":171.48,"text":"These egrets and dolphins demonstrate the ability of\ndifferent animal species to work together in order to\nsurvive."}],"launchInline":true}},{"id":"B03-RW-U01-classroom:resource:b5257","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[18],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/83ac13cea6f156e1b6ec0e6acb896df6597beeac68cee59356170be6459c2a6f.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["chemical (n) a man-made or natural solid, liquid or gas made by changing atoms\ndestroy (v) to damage something very badly; to cause it to not exist\ndue to (prep) because of; as a result of\nendangered (adj) (of plants and animals) that may disappear soon","natural (adj) as found in nature; not made or caused by people\npollute (v) to make the air, water or land dirty and unhealthy\nprotect (v) to keep something or someone safe from damage or injury\nspecies (n) a group of plants or animals which are the same in some way"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U01-classroom:material:RW-M03","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[19],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e6144a16d00116ad2a53eee83bd3cfb02fc3966e64732fa238fe57192c71576.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# ENDANGERED SPECIES\n[IMAGE_1]\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.","sourcePage":19},{"body":"2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.","sourcePage":19},{"body":"3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.","sourcePage":19},{"body":"4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too.","sourcePage":19}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U01-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"ENDANGERED SPECIES","pages":[{"page":19,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e6144a16d00116ad2a53eee83bd3cfb02fc3966e64732fa238fe57192c71576.png","width":772,"height":1040}],"source":19,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# ENDANGERED SPECIES\n[IMAGE_1]\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.","sourcePage":19},{"body":"2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.","sourcePage":19},{"body":"3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.","sourcePage":19},{"body":"4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too.","sourcePage":19}],"text":"# ENDANGERED SPECIES\n[IMAGE_1]\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.\n2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.\n3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.\n4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too.","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_0b5b23d090a98a5f.mp3"},"original":{"id":"B03-RW-U01-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U01","book":3,"track":"RW","unit":1,"title":"READING 1","kind":"material","pages":[19],"sourceImages":[{"page":19,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e6144a16d00116ad2a53eee83bd3cfb02fc3966e64732fa238fe57192c71576.png","viewEvidenceReported":true}],"text":"# ENDANGERED SPECIES\n\n[IMAGE_1]\n\n1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.\n\n2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.\n\n3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n\n[IMAGE_2]\n\nbecause of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.\n\n4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps, we will protect our planet so that our children and their children can enjoy it, too.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5261"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_0b5b23d090a98a5f.mp3","continueOnPage":true}},{"id":"B03-RW-U01-classroom:material:RW-M04","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[21,22,23],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]","sourcePage":21},{"body":"[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>","sourcePage":22},{"body":"Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]","sourcePage":22},{"body":"Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","sourcePage":22},{"body":"Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.","sourcePage":23},{"body":"In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","sourcePage":23}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U01-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Red and grey squirrel fact file: similarities and differences","pages":[{"page":21,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","width":772,"height":1040},{"page":22,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png","width":772,"height":1040},{"page":23,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png","width":772,"height":1040}],"source":21,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]","sourcePage":21},{"body":"[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>","sourcePage":22},{"body":"Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]","sourcePage":22},{"body":"Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","sourcePage":22},{"body":"Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.","sourcePage":23},{"body":"In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","sourcePage":23}],"text":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]\n[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>\nStudent A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]\nThen, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.\nThree more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.\nIn conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_c7e6818264df7e3b.mp3"},"original":{"id":"B03-RW-U01-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U01","book":3,"track":"RW","unit":1,"title":"READING 2","kind":"material","pages":[21,22,23],"sourceImages":[{"page":21,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7b526f94b1b7a0496e763299a7ebef967ca83b4bc2e0bf9ced2c8e7189df55b1.png","viewEvidenceReported":true},{"page":22,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8b4a36271f341979ff6d7a9e87f1f7dd5d14f90f9129505f05de7f7003780894.png","viewEvidenceReported":true},{"page":23,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/709c84236eec7106ddf755856a9c7317eaf42f7d2e740074da01c195e67f707d.png","viewEvidenceReported":true}],"text":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm\n\nAt first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n\n[IMAGE_1]\n[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel\n\u003ctable>\u003ctr>\u003ctd>head-and-body length\u003c/td>\u003ctd>19–23 cm\u003c/td>\u003ctd>23–30 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tail length\u003c/td>\u003ctd>15–20 cm\u003c/td>\u003ctd>19–25 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>body weight\u003c/td>\u003ctd>250–340 grams\u003c/td>\u003ctd>400–600 grams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>native to\u003c/td>\u003ctd>Europe and Asia\u003c/td>\u003ctd>North America\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation status\u003c/td>\u003ctd>near threatened in England and Wales(population decreasing)\u003c/td>\u003ctd>common (population increasing)\u003c/td>\u003c/tr>\u003c/table>\nStudent A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\n\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.\n[IMAGE_1]\nThen, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.\nThree more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.\nIn conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they are not an endangered species. Considering the evidence, saving the red squirrel may be a waste of British government money. Government conservation funding should instead be spent on other endangered animals.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5279","b5280","b5284-material","b5286","b5287"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_c7e6818264df7e3b.mp3","continueOnPage":true}},{"id":"B03-RW-U01-classroom:review-1","book":3,"unit":1,"track":"RW","topic":"ANIMALS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[35],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c5d4ee3c25ed7a74fc76520a414c8c2886e635bbd7ed820877678b3277447187.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B03-RW-U01-B-001","form":"affect","page":35},{"id":"B03-RW-U01-B-002","form":"chemical","page":35},{"id":"B03-RW-U01-B-003","form":"common","page":35},{"id":"B03-RW-U01-B-004","form":"cooperate","page":35},{"id":"B03-RW-U01-B-006","fo !","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B03-RW-U01-question:b5282":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"The red squirrel has a typical head-and-body length of approximately (1) __ to (2) __ cm, a tail length of (3) __ to (4) __ cm and a body weight of (5) __ to (6) __ grams. The grey squirrel is larger than the red squirrel. The head and body measure between (7) __ and (8) __ cm, and the tail is between (9) __ and (10) __ cm long. Adult grey squirrels are also heavier, weighing between (11) __ and (12) __ grams. This size allows them to store more fat and helps them to survive hard winters, which can be fatal to their smaller cousins.","values":["19","23","15","20","250","340","23","30","19","25","400","600"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B03-RW-U01-classroom:material:RW-M03":[{"body":"# ENDANGERED SPECIES\n[IMAGE_1]","sourcePage":19,"blocks":[{"kind":"text","text":"# ENDANGERED SPECIES"},{"kind":"text","text":"[IMAGE_1]"}]},{"body":"1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become","sourcePage":19,"blocks":[{"kind":"text","text":"1 An endangered species is a group of animals or plants which could soon become extinct. Extinction happens when the last animal of the species has died out and there will be no more. Many species are nearly extinct and could disappear from the Earth very soon if we don't do anything to save them. There are many reasons why species become"}]},{"body":"endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing.","sourcePage":19,"blocks":[{"kind":"text","text":"endangered, but most harm to species is due to human activities such as habitat destruction, hunting and overfishing."}]},{"body":"2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed","sourcePage":19,"blocks":[{"kind":"text","text":"2 Habitat destruction is the main reason why animals become endangered. This happens in two ways. First, when humans move into a new area, they cut down trees to build houses and farms. This destroys the animals' habitat – the natural environment where plants or animals usually live – and leaves them without food. Animal habitats are also destroyed"}]},{"body":"because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area.","sourcePage":19,"blocks":[{"kind":"text","text":"because of pollution. Dirty water from factories, which contains chemicals, ends up in rivers, and poisons used on farmland may even kill animals which live in the area."}]},{"body":"3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are","sourcePage":19,"blocks":[{"kind":"text","text":"3 Endangered species are also the result of hunting and fishing. Animals such as the Arabian oryx are nearly extinct because of the high price of their meat. Other animals are killed for their fur, bones or skin – or just for sport. For example, some seal species are now almost extinct because they are killed for their fur to make coats. Tigers are"}]},{"body":"shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species\n[IMAGE_2]","sourcePage":19,"blocks":[{"kind":"text","text":"shot to make medicine and tea from their bones, and crocodiles are caught to make bags and shoes. Large sea creatures like whales, tuna and sharks have all become endangered species"},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"because of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi.","sourcePage":19,"blocks":[{"kind":"text","text":"because of overfishing – too many are caught to make special dishes that people like to eat, such as shark's fin soup or sushi."}]},{"body":"4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur","sourcePage":19,"blocks":[{"kind":"text","text":"4 What steps can individuals and governments take to protect more animal and plant species from becoming endangered? We should try not to pollute natural areas, and farmers or companies who destroy animal habitats should face a financial penalty. The public can help out by refusing to buy products made from animals' body parts, such as seal fur"}]},{"body":"coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps,","sourcePage":19,"blocks":[{"kind":"text","text":"coats or crocodile bags. Governments can help, too, by making it against the law to hunt, fish or trade in endangered species. They can also provide funding for animal sanctuaries and zoos. These protect animals from extinction by breeding more endangered animals, which can later be released into the wild. If we all cooperate by taking these steps,"}]},{"body":"we will protect our planet so that our children and their children can enjoy it, too.","sourcePage":19,"blocks":[{"kind":"text","text":"we will protect our planet so that our children and their children can enjoy it, too."}]}],"B03-RW-U01-classroom:material:RW-M04":[{"body":"Red and grey squirrel fact file: similarities and differences\nPosted 10 May 12:35 pm","sourcePage":21,"blocks":[{"kind":"text","text":"Red and grey squirrel fact file: similarities and differences"},{"kind":"text","text":"Posted 10 May 12:35 pm"}]},{"body":"At first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight.\n[IMAGE_1]","sourcePage":21,"blocks":[{"kind":"text","text":"At first sight, the two species of squirrel are similar. They both have a long tail, which helps them balance when jumping from tree to tree, and the same large eyes, small ears and powerful back legs. In contrast, the two types of squirrel are different in body size and weight."},{"kind":"text","text":"[IMAGE_1]"}]},{"body":"[IMAGE_1] red squirrel\n[IMAGE_2] grey squirrel","sourcePage":22,"blocks":[{"kind":"text","text":"[IMAGE_1] red squirrel"},{"kind":"text","text":"[IMAGE_2] grey squirrel"}]},{"body":"head-and-body length 19–23 cm 23–30 cm tail length 15–20 cm 19–25 cm body weight 250–340 grams 400–600 grams native to Europe and Asia North America","sourcePage":22,"blocks":[{"kind":"table","rows":[[{"text":"head-and-body length","header":false},{"text":"19–23 cm","header":false},{"text":"23–30 cm","header":false}],[{"text":"tail length","header":false},{"text":"15–20 cm","header":false},{"text":"19–25 cm","header":false}],[{"text":"body weight","header":false},{"text":"250–340 grams","header":false},{"text":"400–600 grams","header":false}],[{"text":"native to","header":false},{"text":"Europe and Asia","header":false},{"text":"North America","header":false}]]}]},{"body":"head-and-body length 19–23 cm 23–30 cm conservation status near threatened in England and Wales(population decreasing) common (population increasing)","sourcePage":22,"blocks":[{"kind":"table","rows":[[{"text":"head-and-body length","header":false},{"text":"19–23 cm","header":false},{"text":"23–30 cm","header":false}],[{"text":"conservation status","header":false},{"text":"near threatened in England and Wales(population decreasing)","header":false},{"text":"common (population increasing)","header":false}]]}]},{"body":"Student A\nInvasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because","sourcePage":22,"blocks":[{"kind":"text","text":"Student A"},{"kind":"text","text":"Invasive species are plants and animals which arrive in an area where they are not native, usually due to human activity. For example, a species of shellfish might attach itself to the outside of a ship travelling between countries and enter a new environment in this way. Invasive species are often able to grow quickly in their new homes because"}]},{"body":"they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK.\nStudent B\nRed squirrels used to be a common sight in British forests and countryside.","sourcePage":22,"blocks":[{"kind":"text","text":"they have no natural enemies. As a result, they may replace or damage native plants and animals which live in the same environment. One example is the case of grey and red squirrels in the UK."},{"kind":"text","text":"Student B"},{"kind":"text","text":"Red squirrels used to be a common sight in British forests and countryside."}]},{"body":"[IMAGE_1]","sourcePage":22,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to","sourcePage":22,"blocks":[{"kind":"text","text":"Then, in the 1870s, the grey squirrel was introduced from North America because rich people thought the squirrels looked fashionable in the gardens of their large homes. Today, only about 140,000 red squirrels remain, mostly in Scotland. In contrast, grey squirrels are now extremely common and seen as major pests due to the damage they cause to"}]},{"body":"plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed.","sourcePage":22,"blocks":[{"kind":"text","text":"plants and houses. While red squirrels are protected, grey squirrels can be legally trapped and destroyed."}]},{"body":"Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more","sourcePage":23,"blocks":[{"kind":"text","text":"Three more differences explain why red squirrels have lost out in the competition with grey squirrels. First, red squirrels live high up in the trees, whereas grey squirrels spend most of their time on the ground. This means that any loss of forest habitat greatly affects the red squirrel population. Another reason is that grey squirrels are more"}]},{"body":"intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds.","sourcePage":23,"blocks":[{"kind":"text","text":"intelligent and can adapt to new situations more easily than red squirrels. For example, they can survive in an urban environment because of their ability to use food provided by humans. A third problem for the red squirrel is disease. Both squirrels carry parapoxvirus. The virus does not seem to affect grey squirrels, but it is fatal to reds."}]},{"body":"In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where","sourcePage":23,"blocks":[{"kind":"text","text":"In conclusion, there does not seem to be much that scientists can do to help red squirrels survive in Britain. Some politicians support destroying populations of grey squirrels, but many British people would contend that this is cruel. Red squirrels have been successfully reintroduced from other countries and they could be protected in places where"}]},{"body":"there are no grey squirrels, such as the Isle of Wight. However, some people question whether Britain should protect red squirrels at all. Worldwide, they a ht billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B03-RW-U01":{"aspect":1.9085487,"cues":[[2.72,7.98,"The marshes of South Carolina are the location of an interesting fish tail.","南卡罗来纳州的沼泽地上演着一个有趣的捕鱼故事。"],[11.6,16.06,"There, these dolphins and egrets work together in a very special way.","在那里，这些海豚和白鹭以一种非常特别的方式合作。"],[22.56,25.8,"These egrets are experts on the dolphins behavior.","这些白鹭很了解海豚的行为。"],[46.78,54.52,"The moment a dolphin comes to the surface of the water and checks the nearest mud bank, the birds get ready for action.","一头海豚来到水面检查最近的泥滩鸟儿就准备好行动"],[58.32,59.5,"Then it happens.","接着，事情发生了。"],[60.06,62.74,"The dolphins push the fish onto the shore.","海豚将鱼推上岸。"],[71.94,75.5,"When the fish are out of the water, the dolphins start eating.","鱼出水后，海豚开始进食。"],[76.86,79.58,"But the egrets also join them for dinner.","不过，白鹭也加入它们一起进食。"],[106.78,110.7,"This is the only place in the world where you can see this kind of behavior.","这是世界上唯一一个你能看到这种行为的地方。"],[139.57999999999998,144.44,"Strangely, the dolphins always use their right sides to push the fish to the shore.","奇怪的是，海豚们总是利用自己的右侧把鱼推到岸边。"],[148.72,153.5,"The young dolphins learn this fishing technique from their parents, and so do the young egrets.","幼年海豚会向父母学习这种捕鱼技巧，幼年白鹭也是如此。"],[154.4,157.66,"Many of the birds now depend on the dolphins for their food.","许多鸟类现在依靠海豚来觅食。"],[158.76,161.16,"They never even fish for themselves.","他们甚至不为自己捕鱼。"],[164.12,171.48,"These egrets and dolphins demonstrate the ability of different animal species to work together in order to survive.","这些白鹭和海豚展示了不同动物物种为了生存而合作的能力。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243},"B03-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ce88f8101cc014447ec8cb0a7de285b0425b76aab1cad9c70db1e6530b855c27.pdf","size":25089866}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33},"B01-LS/36":{"pdf":34},"B01-LS/37":{"pdf":35},"B01-LS/38":{"pdf":36},"B01-LS/39":{"pdf":37},"B01-LS/40":{"pdf":38},"B01-LS/41":{"pdf":39},"B01-LS/42":{"pdf":40},"B01-LS/43":{"pdf":41},"B01-LS/44":{"pdf":42},"B01-LS/    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
