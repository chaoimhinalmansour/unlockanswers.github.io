ntext":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a90591daf8c68933f1cca27936c83863fe8c00390ce85656a828a4979a99a2e5.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"polar ice cap","pos":"(n)","definition":"a thick layer of ice near the North or South Pole which permanently covers an area of land","example":"A satellite took a picture of the polar ice cap.","wordAudio":"polar ice cap","cardWord":false},{"term":"distribution","pos":"(n)","definition":"the way something is divided and shared in a group or area","example":"The charity organised the distribution of food to several villages.","wordAudio":"distribution","cardWord":false},{"term":"transform","pos":"(v)","definition":"to change something completely, often to improve it","example":"A new coat of paint can transform a room.","wordAudio":"transform","cardWord":false},{"term":"reservoir","pos":"(n)","definition":"a natural or artificial lake for storing and supplying water","example":"The reservoir stores water for the town.","wordAudio":"reservoir","cardWord":false}]]}},{"id":"B04-RW-U04-classroom:video","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a90591daf8c68933f1cca27936c83863fe8c00390ce85656a828a4979a99a2e5.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/381742f0fbbd19a72c41371a-L4RW-U04.mp4","captions":[{"start":0.94,"end":7.82,"text":"We call our Earth the blue planet because about 70 % of\nthe Earth's surface is covered in water."},{"start":8.32,"end":10.98,"text":"But most of that is in the oceans and seas."},{"start":12.02,"end":13.4,"text":"Just two .five"},{"start":13.4,"end":14.6,"text":"% is freshwater,"},{"start":15.24,"end":18.8,"text":"and only one % of that is available for human use."},{"start":19.28,"end":24.02,"text":"The rest is locked up in mountain passes and the\nEarth's polar ice caps."},{"start":28.74,"end":31.9,"text":"But there's another fact we need to understand about\nwater."},{"start":32.72,"end":33.04,"text":"Well, there's"},{"start":33.04,"end":33.24,"text":"no"},{"start":33.24,"end":36.82,"text":"more water on the planet than there was when life first\nappeared on Earth."},{"start":37.26,"end":38.76,"text":"It changes its distribution."},{"start":38.88,"end":42.88,"text":"There's more water in different parts of the world than\nthere were hundreds or thousands of years ago."},{"start":43.2,"end":46.22,"text":"But it's still exactly the same amount of water that's\nbeen here always."},{"start":51.04,"end":57.32,"text":"We use over half of all the available freshwater in the\nworld to serve our needs."},{"start":59.12,"end":61.28,"text":"To transform deserts into fields,"},{"start":61.92,"end":63.86,"text":"to produce energy from rivers,"},{"start":64.38,"end":68.06,"text":"and to build cities in some of the driest regions on\nthe planet."},{"start":70.1,"end":71.94,"text":"But despite our creativity,"},{"start":72.46000000000001,"end":76.24,"text":"there are many who have difficulty getting enough of\nthis basic resource."},{"start":77.02,"end":81.32,"text":"More than a billion people on the planet already lack\naccess to safe, clean drinking water."},{"start":81.74,"end":85.74,"text":"And we know things are going to get more difficult as\nthe population continues to grow."},{"start":86.06,"end":91.02,"text":"Within the next 20 years, as much as half of the\nworld's population will live in areas of water stress."},{"start":93.16,"end":96.78,"text":"Many water shortages are the result of poor\ninfrastructure,"},{"start":97.42,"end":97.88,"text":"politics,"},{"start":98.52000000000001,"end":98.86,"text":"poverty,"},{"start":99.22,"end":101.53999999999999,"text":"or simply living in a dry part of the world."},{"start":101.7,"end":105.3,"text":"But more and more, they are due to increasing\npopulations."},{"start":124.02,"end":128.34,"text":"Mexico City, for example, benefits from heavy annual\nrainfall."},{"start":130.58,"end":136.38,"text":"But its water system is stressed from supplying water\nto its 20 million inhabitants."},{"start":140.57999999999998,"end":146.48,"text":"The issue is the combination of leaks in the system and\nthe fact that backup reservoirs are running dry."},{"start":154.96,"end":156.44,"text":"In Mexico City,"},{"start":156.82,"end":160.94,"text":"shops that sell water for people's daily needs are\nbecoming more and more common."},{"start":162.44,"end":167.64,"text":"But the water we use at home is only a small percentage\nof the total amount of water we consume."},{"start":168.72,"end":172.12,"text":"That's because of the huge amounts used by farms and\nfactories."},{"start":173.84,"end":176.98,"text":"We may know where the water out of our tap comes from,"},{"start":177.3,"end":184.4,"text":"but we very seldom know where the water that went into\nour can of cola or into the shirt that we're wearing on\nour back,"},{"start":184.82,"end":194.8,"text":"where those goods were produced and how much water it\nrequired, and what the consequences were for the\nnatural systems in those areas and for the local\ncommunities that are dependent upon that same water."},{"start":194.8,"end":204.34,"text":"So, for example, the cup of coffee that you may have in\nthe morning requires on the order of 120 liters just to\nproduce the coffee and bring it to your table."},{"start":205.2,"end":206.28,"text":"A hamburger,"},{"start":206.7,"end":208.26,"text":"eight ,000 liters of water."},{"start":209.18,"end":214.74,"text":"To produce enough water to grow the cotton in my shirt\nis three ,000 liters as well."},{"start":217.88,"end":224.96,"text":"The influence of humans on the world's freshwater\nsystems is so significant that it can be seen from\nspace."},{"start":226.57999999999998,"end":229.68,"text":"The Aral Sea, the freshwater lake in Central Asia,"},{"start":230.18,"end":233.46,"text":"once covered more than 25 ,000 square miles."},{"start":234.04,"end":235.82,"text":"But in the last 40 years,"},{"start":236.26,"end":238.56,"text":"it has lost 90 % of its water,"},{"start":238.98,"end":241.7,"text":"with most of it going to support cotton farms."},{"start":244.74,"end":245.68,"text":"Lake Chad,"},{"start":246.1,"end":248.3,"text":"on the southern side of the Sahara Desert,"},{"start":248.8,"end":252.84,"text":"is now one -tenth of its normal size due to drought and\noveruse."},{"start":253.3,"end":256.4,"text":"Yet 30 million people still depend on it."}],"launchInline":true}},{"id":"B04-RW-U04-classroom:material:RW-M03","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[86],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44e80a1639113859da88bb10cd03433a950172eaaf19e3de3720aa974bea6c7f.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'","sourcePage":86},{"body":"'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'","sourcePage":86},{"body":"'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'","sourcePage":86},{"body":"'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n7 'Is there any more that can be done, or are we as prepared as we can be?'","sourcePage":86},{"body":"'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'\n¹ illuminating (adj) giving you new information about a subject\n² bulkhead (n) an underwater wall","sourcePage":86}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U04-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Disaster mitigation","pages":[{"page":86,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44e80a1639113859da88bb10cd03433a950172eaaf19e3de3720aa974bea6c7f.png","width":3040,"height":4096}],"source":86,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'","sourcePage":86},{"body":"'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'","sourcePage":86},{"body":"'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'","sourcePage":86},{"body":"'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n7 'Is there any more that can be done, or are we as prepared as we can be?'","sourcePage":86},{"body":"'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'\n¹ illuminating (adj) giving you new information about a subject\n² bulkhead (n) an underwater wall","sourcePage":86}],"text":"## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'\n'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'\n'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'\n'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n7 'Is there any more that can be done, or are we as prepared as we can be?'\n'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'\n¹ illuminating (adj) giving you new information about a subject\n² bulkhead (n) an underwater wall","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44f9466e71b2f80278d36a4f753da87f77abcb557284ea11667c8d208078001a.mp3"},"original":{"id":"B04-RW-U04-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U04","book":4,"track":"RW","unit":4,"title":"READING 1","kind":"material","pages":[86],"sourceImages":[{"page":86,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44e80a1639113859da88bb10cd03433a950172eaaf19e3de3720aa974bea6c7f.png","viewEvidenceReported":true}],"text":"## Disaster mitigation\n\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n\n2 'Dan, could you tell us what disaster mitigation means?'\n\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n\n3 'What do you mean by risk reduction?'\n\n'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n\n4 'What types of risk analysis do you do?'\n\n'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'\n\n'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n\n7 'Is there any more that can be done, or are we as prepared as we can be?'\n\n'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'\n\n¹ illuminating (adj) giving you new information about a subject\n\n² bulkhead (n) an underwater wall","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6894"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44f9466e71b2f80278d36a4f753da87f77abcb557284ea11667c8d208078001a.mp3","continueOnPage":true}},{"id":"B04-RW-U04-classroom:material:RW-M04","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[90],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f31dff461e3bea1ddb1ab1c7f731733a051e8766337eb099a240f630f924f8f4.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"GOING GREEN IN DENMARK\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).","sourcePage":90},{"body":"2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.","sourcePage":90},{"body":"3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen and natural gas vehicles.","sourcePage":90},{"body":"4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.","sourcePage":90},{"body":"5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.","sourcePage":90},{"body":"6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.","sourcePage":90},{"body":"7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to follow suit with some of its green initiatives.\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste","sourcePage":90}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U04-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"GOING GREEN IN DENMARK","pages":[{"page":90,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f31dff461e3bea1ddb1ab1c7f731733a051e8766337eb099a240f630f924f8f4.png","width":3040,"height":4096}],"source":90,"embeddedIn":null,"photo":null,"clearPages":[{"body":"GOING GREEN IN DENMARK\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).","sourcePage":90},{"body":"2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.","sourcePage":90},{"body":"3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen and natural gas vehicles.","sourcePage":90},{"body":"4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.","sourcePage":90},{"body":"5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.","sourcePage":90},{"body":"6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.","sourcePage":90},{"body":"7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to follow suit with some of its green initiatives.\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste","sourcePage":90}],"text":"GOING GREEN IN DENMARK\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).\n2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.\n3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen and natural gas vehicles.\n4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.\n5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.\n6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.\n7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to follow suit with some of its green initiatives.\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6a3127b22838f57f4d6184fc53524247bba13e4b4123c2f8d61c5c906b3e1a0.mp3"},"original":{"id":"B04-RW-U04-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U04","book":4,"track":"RW","unit":4,"title":"READING 2","kind":"material","pages":[90],"sourceImages":[{"page":90,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f31dff461e3bea1ddb1ab1c7f731733a051e8766337eb099a240f630f924f8f4.png","viewEvidenceReported":true}],"text":"GOING GREEN IN DENMARK\n\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).\n\n2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.\n\n3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen and natural gas vehicles.\n\n4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\n\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.\n\n5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.\n\n6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.\n\n7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to follow suit with some of its green initiatives.\n\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6910"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6a3127b22838f57f4d6184fc53524247bba13e4b4123c2f8d61c5c906b3e1a0.mp3","continueOnPage":true}},{"id":"B04-RW-U04-classroom:review-1","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[101],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0acf6ef7bf8289458cb87639376f21ff02b2a880c59c9e26319fb67273b41add.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B04-RW-U04-B-001","form":"criticize","page":101},{"id":"B04-RW-U04-B-002","form":"crucial","page":101},{"id":"B04-RW-U04-B-003","form":"devastating","page":101},{"id":"B04-RW-U04-B-004","form":"disaster","page":101},{"id":"B04-RW-U04-B-005","form":"emission","page":101},{"id":"B04-RW-U04-B-006","form":"extreme","page":101},{"id":"B04-RW-U04-B-008","form":"identify","page":101},{"id":"B04-RW-U04-B-009","form":"issue","page":101},{"id":"B04-RW-U04-B-010","form":"large-scale","page":101},{"id":"B04-RW-U04-B-012","form":"maintenance","page":101},{"id":"B04-RW-U04-B-013","form":"major","page":101},{"id":"B04-RW-U04-B-014","form":"measure","page":101},{"id":"B04-RW-U04-B-015","form":"policy","page":101},{"id":"B04-RW-U04-B-016","form":"reduction","page":101},{"id":"B04-RW-U04-B-018","form":"severe","page":101}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U04-classroom:review-2","book":4,"unit":4,"track":"RW","topic":"THE }}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U04-classroom:material:RW-M03":[{"body":"## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.","sourcePage":86,"blocks":[{"kind":"text","text":"## Disaster mitigation"},{"kind":"text","text":"1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency."}]},{"body":"2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'","sourcePage":86,"blocks":[{"kind":"text","text":"2 'Dan, could you tell us what disaster mitigation means?'"},{"kind":"text","text":"'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'"}]},{"body":"3 'What do you mean by risk reduction?'","sourcePage":86,"blocks":[{"kind":"text","text":"3 'What do you mean by risk reduction?'"}]},{"body":"'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However,","sourcePage":86,"blocks":[{"kind":"text","text":"'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However,"}]},{"body":"even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'","sourcePage":86,"blocks":[{"kind":"text","text":"even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'"},{"kind":"text","text":"4 'What types of risk analysis do you do?'"}]},{"body":"'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams","sourcePage":86,"blocks":[{"kind":"text","text":"'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams"}]},{"body":"because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'","sourcePage":86,"blocks":[{"kind":"text","text":"because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'"},{"kind":"text","text":"5 'Do you think countries are better prepared now for natural disasters than they were in the past?'"}]},{"body":"'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK,","sourcePage":86,"blocks":[{"kind":"text","text":"'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK,"}]},{"body":"another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'","sourcePage":86,"blocks":[{"kind":"text","text":"another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'"},{"kind":"text","text":"6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'"},{"kind":"text","text":"'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'"}]},{"body":"7 'Is there any more that can be done, or are we as prepared as we can be?'","sourcePage":86,"blocks":[{"kind":"text","text":"7 'Is there any more that can be done, or are we as prepared as we can be?'"}]},{"body":"'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'","sourcePage":86,"blocks":[{"kind":"text","text":"'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'"}]},{"body":"¹ illuminating (adj) giving you new information about a subject\n² bulkhead (n) an underwater wall","sourcePage":86,"blocks":[{"kind":"text","text":"¹ illuminating (adj) giving you new information about a subject"},{"kind":"text","text":"² bulkhead (n) an underwater wall"}]}],"B04-RW-U04-classroom:material:RW-M04":[{"body":"GOING GREEN IN DENMARK\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of","sourcePage":90,"blocks":[{"kind":"text","text":"GOING GREEN IN DENMARK"},{"kind":"text","text":"In today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of"}]},{"body":"countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).","sourcePage":90,"blocks":[{"kind":"text","text":"countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI)."}]},{"body":"2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green","sourcePage":90,"blocks":[{"kind":"text","text":"2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green"}]},{"body":"initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.","sourcePage":90,"blocks":[{"kind":"text","text":"initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling."}]},{"body":"3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than","sourcePage":90,"blocks":[{"kind":"text","text":"3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than"}]},{"body":"cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen\nand natural gas vehicles.","sourcePage":90,"blocks":[{"kind":"text","text":"cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen"},{"kind":"text","text":"and natural gas vehicles."}]},{"body":"4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and\ngeothermal² power.","sourcePage":90,"blocks":[{"kind":"text","text":"4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and"},{"kind":"text","text":"geothermal² power."}]},{"body":"Wind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind","sourcePage":90,"blocks":[{"kind":"text","text":"Wind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind"}]},{"body":"energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.","sourcePage":90,"blocks":[{"kind":"text","text":"energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households."}]},{"body":"5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this","sourcePage":90,"blocks":[{"kind":"text","text":"5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this"}]},{"body":"is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.","sourcePage":90,"blocks":[{"kind":"text","text":"is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably."}]},{"body":"6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes","sourcePage":90,"blocks":[{"kind":"text","text":"6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes"}]},{"body":"have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.","sourcePage":90,"blocks":[{"kind":"text","text":"have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste."}]},{"body":"7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other","sourcePage":90,"blocks":[{"kind":"text","text":"7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other"}]},{"body":"countries not to follow suit with some of its green initiatives.\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste","sourcePage":90,"blocks":[{"kind":"text","text":"countries not to follow suit with some of its green initiatives."},{"kind":"text","text":"¹agenda (n) important subjects that have to be dealt with"},{"kind":"text","text":"²geothermal (adj) of or connected with the heat inside the earth"},{"kind":"text","text":"³sanitation (n) a system of protecting people's health by removing dirt and waste"}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{
