n a billion people.","options":["True","False"],"type":"choice_gap/closed"}],[{"kind":"item","id":"b6883.i04","label":"4","prompt":"Water shortages are the result of people living in deserts.","options":["True","False"],"type":"choice_gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/381742f0fbbd19a72c41371a-L4RW-U04.mp4","captions":[{"start":0.94,"end":7.82,"text":"We call our Earth the blue planet because about 70 % of\nthe Earth's surface is covered in water."},{"start":8.32,"end":10.98,"text":"But most of that is in the oceans and seas."},{"start":12.02,"end":13.4,"text":"Just two .five"},{"start":13.4,"end":14.6,"text":"% is freshwater,"},{"start":15.24,"end":18.8,"text":"and only one % of that is available for human use."},{"start":19.28,"end":24.02,"text":"The rest is locked up in mountain passes and the\nEarth's polar ice caps."},{"start":28.74,"end":31.9,"text":"But there's another fact we need to understand about\nwater."},{"start":32.72,"end":33.04,"text":"Well, there's"},{"start":33.04,"end":33.24,"text":"no"},{"start":33.24,"end":36.82,"text":"more water on the planet than there was when life first\nappeared on Earth."},{"start":37.26,"end":38.76,"text":"It changes its distribution."},{"start":38.88,"end":42.88,"text":"There's more water in different parts of the world than\nthere were hundreds or thousands of years ago."},{"start":43.2,"end":46.22,"text":"But it's still exactly the same amount of water that's\nbeen here always."},{"start":51.04,"end":57.32,"text":"We use over half of all the available freshwater in the\nworld to serve our needs."},{"start":59.12,"end":61.28,"text":"To transform deserts into fields,"},{"start":61.92,"end":63.86,"text":"to produce energy from rivers,"},{"start":64.38,"end":68.06,"text":"and to build cities in some of the driest regions on\nthe planet."},{"start":70.1,"end":71.94,"text":"But despite our creativity,"},{"start":72.46000000000001,"end":76.24,"text":"there are many who have difficulty getting enough of\nthis basic resource."},{"start":77.02,"end":81.32,"text":"More than a billion people on the planet already lack\naccess to safe, clean drinking water."},{"start":81.74,"end":85.74,"text":"And we know things are going to get more difficult as\nthe population continues to grow."},{"start":86.06,"end":91.02,"text":"Within the next 20 years, as much as half of the\nworld's population will live in areas of water stress."},{"start":93.16,"end":96.78,"text":"Many water shortages are the result of poor\ninfrastructure,"},{"start":97.42,"end":97.88,"text":"politics,"},{"start":98.52000000000001,"end":98.86,"text":"poverty,"},{"start":99.22,"end":101.53999999999999,"text":"or simply living in a dry part of the world."},{"start":101.7,"end":105.3,"text":"But more and more, they are due to increasing\npopulations."},{"start":124.02,"end":128.34,"text":"Mexico City, for example, benefits from heavy annual\nrainfall."},{"start":130.58,"end":136.38,"text":"But its water system is stressed from supplying water\nto its 20 million inhabitants."},{"start":140.57999999999998,"end":146.48,"text":"The issue is the combination of leaks in the system and\nthe fact that backup reservoirs are running dry."},{"start":154.96,"end":156.44,"text":"In Mexico City,"},{"start":156.82,"end":160.94,"text":"shops that sell water for people's daily needs are\nbecoming more and more common."},{"start":162.44,"end":167.64,"text":"But the water we use at home is only a small percentage\nof the total amount of water we consume."},{"start":168.72,"end":172.12,"text":"That's because of the huge amounts used by farms and\nfactories."},{"start":173.84,"end":176.98,"text":"We may know where the water out of our tap comes from,"},{"start":177.3,"end":184.4,"text":"but we very seldom know where the water that went into\nour can of cola or into the shirt that we're wearing on\nour back,"},{"start":184.82,"end":194.8,"text":"where those goods were produced and how much water it\nrequired, and what the consequences were for the\nnatural systems in those areas and for the local\ncommunities that are dependent upon that same water."},{"start":194.8,"end":204.34,"text":"So, for example, the cup of coffee that you may have in\nthe morning requires on the order of 120 liters just to\nproduce the coffee and bring it to your table."},{"start":205.2,"end":206.28,"text":"A hamburger,"},{"start":206.7,"end":208.26,"text":"eight ,000 liters of water."},{"start":209.18,"end":214.74,"text":"To produce enough water to grow the cotton in my shirt\nis three ,000 liters as well."},{"start":217.88,"end":224.96,"text":"The influence of humans on the world's freshwater\nsystems is so significant that it can be seen from\nspace."},{"start":226.57999999999998,"end":229.68,"text":"The Aral Sea, the freshwater lake in Central Asia,"},{"start":230.18,"end":233.46,"text":"once covered more than 25 ,000 square miles."},{"start":234.04,"end":235.82,"text":"But in the last 40 years,"},{"start":236.26,"end":238.56,"text":"it has lost 90 % of its water,"},{"start":238.98,"end":241.7,"text":"with most of it going to support cotton farms."},{"start":244.74,"end":245.68,"text":"Lake Chad,"},{"start":246.1,"end":248.3,"text":"on the southern side of the Sahara Desert,"},{"start":248.8,"end":252.84,"text":"is now one -tenth of its normal size due to drought and\noveruse."},{"start":253.3,"end":256.4,"text":"Yet 30 million people still depend on it."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F; Only 1% of the fresh water is available for human\nuse. 2 T 3 T 4 F; Water shortages are the result of\nincreasing population, poor infrastructure, politics,\npoverty or living in a dry part of the world.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content U04.mp4","captions":[{"start":0.94,"end":7.82,"text":"We call our Earth the blue planet because about 70 % of\nthe Earth's surface is covered in water."},{"start":8.32,"end":10.98,"text":"But most of that is in the oceans and seas."},{"start":12.02,"end":13.4,"text":"Just two .five"},{"start":13.4,"end":14.6,"text":"% is freshwater,"},{"start":15.24,"end":18.8,"text":"and only one % of that is available for human use."},{"start":19.28,"end":24.02,"text":"The rest is locked up in mountain passes and the\nEarth's polar ice caps."},{"start":28.74,"end":31.9,"text":"But there's another fact we need to understand about\nwater."},{"start":32.72,"end":33.04,"text":"Well, there's"},{"start":33.04,"end":33.24,"text":"no"},{"start":33.24,"end":36.82,"text":"more water on the planet than there was when life first\nappeared on Earth."},{"start":37.26,"end":38.76,"text":"It changes its distribution."},{"start":38.88,"end":42.88,"text":"There's more water in different parts of the world than\nthere were hundreds or thousands of years ago."},{"start":43.2,"end":46.22,"text":"But it's still exactly the same amount of water that's\nbeen here always."},{"start":51.04,"end":57.32,"text":"We use over half of all the available freshwater in the\nworld to serve our needs."},{"start":59.12,"end":61.28,"text":"To transform deserts into fields,"},{"start":61.92,"end":63.86,"text":"to produce energy from rivers,"},{"start":64.38,"end":68.06,"text":"and to build cities in some of the driest regions on\nthe planet."},{"start":70.1,"end":71.94,"text":"But despite our creativity,"},{"start":72.46000000000001,"end":76.24,"text":"there are many who have difficulty getting enough of\nthis basic resource."},{"start":77.02,"end":81.32,"text":"More than a billion people on the planet already lack\naccess to safe, clean drinking water."},{"start":81.74,"end":85.74,"text":"And we know things are going to get more difficult as\nthe population continues to grow."},{"start":86.06,"end":91.02,"text":"Within the next 20 years, as much as half of the\nworld's population will live in areas of water stress."},{"start":93.16,"end":96.78,"text":"Many water shortages are the result of poor\ninfrastructure,"},{"start":97.42,"end":97.88,"text":"politics,"},{"start":98.52000000000001,"end":98.86,"text":"poverty,"},{"start":99.22,"end":101.53999999999999,"text":"or simply living in a dry part of the world."},{"start":101.7,"end":105.3,"text":"But more and more, they are due to increasing\npopulations."},{"start":124.02,"end":128.34,"text":"Mexico City, for example, benefits from heavy annual\nrainfall."},{"start":130.58,"end":136.38,"text":"But its water system is stressed from supplying water\nto its 20 million inhabitants."},{"start":140.57999999999998,"end":146.48,"text":"The issue is the combination of leaks in the system and\nthe fact that backup reservoirs are running dry."},{"start":154.96,"end":156.44,"text":"In Mexico City,"},{"start":156.82,"end":160.94,"text":"shops that sell water for people's daily needs are\nbecoming more and more common."},{"start":162.44,"end":167.64,"text":"But the water we use at home is only a small percentage\nof the total amount of water we consume."},{"start":168.72,"end":172.12,"text":"That's because of the huge amounts used by farms and\nfactories."},{"start":173.84,"end":176.98,"text":"We may know where the water out of our tap comes from,"},{"start":177.3,"end":184.4,"text":"but we very seldom know where the water that went into\nour can of cola or into the shirt that we're wearing on\nour back,"},{"start":184.82,"end":194.8,"text":"where those goods were produced and how much water it\nrequired, and what the consequences were for the\nnatural systems in those areas and for the local\ncommunities that are dependent upon that same water."},{"start":194.8,"end":204.34,"text":"So, for example, the cup of coffee that you may have in\nthe morning requires on the order of 120 liters just to\nproduce the coffee and bring it to your table."},{"start":205.2,"end":206.28,"text":"A hamburger,"},{"start":206.7,"end":208.26,"text":"eight ,000 liters of water."},{"start":209.18,"end":214.74,"text":"To produce enough water to grow the cotton in my shirt\nis three ,000 liters as well."},{"start":217.88,"end":224.96,"text":"The influence of humans on the world's freshwater\nsystems is so significant that it can be seen from\nspace."},{"start":226.57999999999998,"end":229.68,"text":"The Aral Sea, the freshwater lake in Central Asia,"},{"start":230.18,"end":233.46,"text":"once covered more than 25 ,000 square miles."},{"start":234.04,"end":235.82,"text":"But in the last 40 years,"},{"start":236.26,"end":238.56,"text":"it has lost 90 % of its water,"},{"start":238.98,"end":241.7,"text":"with most of it going to support cotton farms."},{"start":244.74,"end":245.68,"text":"Lake Chad,"},{"start":246.1,"end":248.3,"text":"on the southern side of the Sahara Desert,"},{"start":248.8,"end":252.84,"text":"is now one -tenth of its normal size due to drought and\noveruse."},{"start":253.3,"end":256.4,"text":"Yet 30 million people still depend on it."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 I think most of the water in the world is\nin the seas and oceans and that is salt\nwater so humans can’t drink it.\n2 People can stop wasting water. For\nexample, they can take shower instead\nof having a bath. And rainwater can be\ncollected to preserve it.\n3 If people understand how important\nwater is and how little there is to share\nbetween everyone, they might not be\nso wasteful.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":39,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c :"1","prompt":"Dan Smith works for an international organization.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6896.i02","label":"2","prompt":"Risk reduction and risk analysis are both important parts of disaster mitigation.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6896.i03","label":"3","prompt":"Large-scale projects are always effective for risk reduction.","options":["True","False"],"type":"choice_gap/closed"}],[{"kind":"item","id":"b6896.i04","label":"4","prompt":"Planning for natural disasters has improved in recent years.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6896.i05","label":"5","prompt":"The New York City subway tunnel redesign cost $20 million.","options":["True","False"],"type":"choice_gap/closed"},{"kind":"item","id":"b6896.i06","label":"6","prompt":"Low-technology solutions can protect against flooding, too.","options":["True","False"],"type":"choice_gap/closed"}]],"courseMaterials":[{"id":"B04-RW-U04-classroom:material:RW-M03","title":"READING 1","text":"## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'\n'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'\n'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'\n'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n7 'Is there any more that can be done, or are we as prepared as we can be?'\n'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'\n¹ illuminating (adj) giving you new information about a subject\n² bulkhead (n) an underwater wall","screens":["## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'","'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'","'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do  tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'\n'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n4 'What types of risk analysis do you do?'\n'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'\n'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n7 'Is there any more that can be done, or are we as prepared as we can be?'\n'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'\n¹ illuminating (adj) giving you new information about a subject\n² bulkhead (n) an underwater wall","screens":["## Disaster mitigation\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n2 'Dan, could you tell us what disaster mitigation means?'\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n3 'What do you mean by risk reduction?'","'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't 7dca5238ae99d03af72277a7d6aaa31ad5ffe413020889821f462ee00ee7f76.png"],"provided":"Remember that when you write a newspaper article your language needs to be formal and the passive tense is often used.","items":[{"id":"b6927.i01","label":"Report","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Remember that when you write a newspaper article your language needs to be formal and the passive tense is often used."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Today a major disaster was declared in\nGreece. An uncontrollable fire spread\nthrough highly populated tourist resorts,\nleaving destruction everywhere. Many\npeople were forced to abandon their\ncomfortable hotels and escape to the sea\nfor safety. The cause of this devastating\nincident is currently unknown. Some\nexperts believe it was arson, while others\nbelieve it was the extreme temperatures\nwhich caused these wildfires.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6906","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":19,"module":"READING 2","ex":"1","context":{"modu label":"1","prompt":"What ____ does your country currently have in place to fuel electric cars?","options":["emission","drought","sustainability","initiatives","awareness campaign","innovation","infrastructure","pioneers","greenhouse gases"],"type":"choice/closed"}],[{"kind":"item","id":"b6906.i02","label":"2","prompt":"Which countries do you think are ____ when it comes to being environmentally friendly?","options":["emission","drought","sustainability","initiatives","awareness campaign","innovation","infrastructure","pioneers","greenhouse gases"],"type":"choice/closed"},{"kind":"item","id":"b6906.i03","label":"3","prompt":"What can companies do to improve environmental ____?","options":["emission","drought","sustainability","initiatives","awareness campaign","innovation","infrastructure","pioneers","greenhouse gases"],"type":"choice/closed"}],[{"kind":"item","id":"b6906.i04","label":"4","prompt":"How can we all reduce harmful carbon ____?","options":["emission","drought","sustainability","initiatives","awareness campaign","innovation","infrastructure","pioneers","greenhouse gases"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 infrastructure 2 pioneers 3 sustainability 4\nemissions 5 initiatives 6 drought 7 awareness\ncampaigns 8 innovations 9 greenhouse gases","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6907","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":20,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Check your answers to Exercise 1 with a partner. Then discuss your answers to the questions.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3a2832f2b9374b2857ef3fedbd16219fffd8883d98b4305a2752c1871ad3a070.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-RW-U04-question:b6906","kind":"student-work","title":"READING 2 Ex 1","pages":[88]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Nowadays there are quite a few places\nwhere you can charge electric cars.\nSome of the bigger supermarkets have\nthem but it is still not very common yet.\n2 I think that some northern European\ncountries are environmentally friendly.\n3 Companies can improve their packaging\nto make it more sustainable and make\nproducts locally, not transport them over\nlong distances.\n4 We can all find ways to reduce our\nimpact, use less water, travel less in cars,\nand buy fewer unnecessary things.\n5 The government in my country is\nfocusing on recycling and increasing the\nuse of sustainable energy.\n6 Sometimes in a very hot summer there\ncan be restrictions on water use but we\nhave never had a very severe drought.\n7 I think the most important thing we\nneed to do is to reduce plastic waste.\nSo an awareness campaign on that, plus\nincentives for businesses to switch to\nreusable alternatives would be good.\n8 One of the biggest recent innovations\nis the growing development and\npopularity of electric vehicles.\n9 I think that the weather has changed\nover recent years. We used to get snow\nmore regularly than we do now. The\nsummer temperatures have been higher\nrecently too.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6908","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":21,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Look at the pictures showing a map of Denmark and its capital city, Copenhagen. Discuss the questions below with a partner.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3a2832f2b9374b2857ef3fedbd16219fffd8883d98b4305a2752c1871ad3a070.png"],"provided":"","items":[{"id":"b6908.i01","label":"1","prompt":"What surrounds Denmark? Because of its location what type of industry/energy do you think Denmark has?","options":[],"type":"discuss/open"},{"id":"b6908.i02","label":"2","prompt":"What types of renewable energy might they have?","options":[],"type":"discuss/open"},{"id":"b6908.i03","label":"3","prompt":"What form of transport can you see? Why do you think it is popular?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6908.i01","label":"1","prompt":"What surrounds Denmark? Because of its location what type of industry/energy do you think Denmark has?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6908.i02","label":"2","prompt":"What types of renewable energy might they have?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6908.i03","label":"3","prompt":"What form of transport can you see? Why do you think it is popular?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Denmark is surrounded by the sea\nso I think there would be a large\nfishing industry.\n2 The sea would also mean they can use\nenergy from the sea such as from wind\nor waves.\n3 The second photo shows people cycling.\nI think it is popular because it is safe to\ncycle there, as I cannot see many cars.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3a2832f2b9374b2857ef3fedbd16219fffd8883d98b4305a2752c1871ad3a070.png","width":3040,"height":4096}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6909","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":22,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Work with a partner. Discuss the questions.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3a2832f2b9374b2857ef3fedbd16219fffd8883d98b4305a2752c1871ad3a070.png"],"provided":"","items":[{"id":"b6909.i01","label":"1","prompt":"What type of initiatives do you think Denmark have invested in to make it one of the most environmentally friendly countries in the world?","options":[],"type":"discuss/open"},{"id":"b6909.i02","label":"2","prompt":"What do you think the phrase 'going green' means?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6909.i01","label":"1","prompt":"What type of initiatives do you think Denmark have invested in to make it one of the most environmentally friendly countries in the world?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6909.i02","label":"2","prompt":"What do you think the phrase 'going green' means?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Initiatives to limit the amount of waste\nthey produce, or the use of natural forms\nof energy and to not use cars so much.\n2 ‘Going green’ means to become more\nenvironmentally friendly.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6912","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":23,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the article quickly for the main ideas. Underline the key points in each paragraph (the first paragraph has been done for you). Compare your answers with a partner.","pages":[91],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/98e129a6fd285a30dec581229092e3da3dbc7ac22ecbbbe0179d0d6ece3eb10b.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"GOING GREEN IN DENMARK\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).\n2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.\n3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen and natural gas vehicles.\n4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.\n5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.\n6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.\n7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to follow suit with some of its green initiatives.\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste","screens":["GOING GREEN IN DENMARK\nIn today's world being environmentally friendly should be high on the agenda¹ for all countries. Every time a natural disaster such as flooding occurs, we are reminded of just what a fragile state our environment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).","2 ing cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.\n5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.\n6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.\n7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using i ronment is in. Whilst many nations are indeed making great efforts to prevent the negative impacts of climate change there is a small group of countries which are really leading the way in terms of 'green' initiatives. Countries such as: Switzerland, Japan, Thailand and Denmark. In this article, we will consider Denmark's remarkable commitment to protecting the environment, as in 2022 it was ranked first in the Environmental Performance Index (EPI).\n2 Historically, Denmark is a country based on agriculture and fishing, and therefore its connection to nature has always been strong. Perhaps this is the reason why the Danes have become pioneers at promoting sustainability and have made protecting the environment an integral part of their culture. The country has a long history of green initiatives. Through decades of sustained effort, the Danes have invested in: green transportation, renewable energy, water management and waste recycling.\n3 One key way in which Denmark strives to protect the environment is by investing in and promoting cleaner modes of transport. Vehicles contribute significantly to CO₂ emissions and therefore this is a key area in which countries need to invest. Danes have therefore fostered a cycling culture and in Copenhagen it is said there are more bikes than cars. Denmark has provided its citizens with a complex network of green cycle routes, thus encouraging people to use their bikes instead of their cars. Vehicles are still prominent in Denmark, but cars which are of low or zero emission, are common. This is supported by the fact that there is a fuelling infrastructure in place for electric, hydrogen and natural gas vehicles.\n4 Another key feature of Danish culture is their commitment to the use of renewable energy sources. By using cleaner forms of energy Denmark aims to reduce carbon emissions, and decrease the emission of greenhouse gases. In fact, Denmark aims to be free of fossil fuels by 2050 and rely solely on renewable energy sources such as wind, solar and geothermal² power.\nWind power has a particularly prominent place in Danish culture, and this began after the oil crisis in 1973, when investment in wind turbines became a necessity. Since then, the use of these turbines has become common, and the government has plans to construct one of the world's first energy islands. This initiative would utilize the abundant wind energy resources in the North and Baltic Seas. It is projected that these offshore wind turbines will have the capacity to power at least 5 million households.\n5 Water management is another key global environmental challenge the world faces. Droughts are becoming more prevalent, and more people than ever are struggling to get access to clean drinking water and sanitation³. However, this is certainly not the case in Denmark, which provides some of the cleanest tap water in the world. The way in which this is achieved is also environmentally friendly, as drinking water comes entirely from groundwater, which is carefully protected and managed sustainably.\n6 The final area to be considered is Denmark's management of waste. Danes take the amount of waste they produce very seriously. For example, the levels of recycling in Denmark are very high and consumers can use vending machines to return their bottles and cans in exchange for money. Reducing the amount of food waste is also another area the Danes have heavily invested in. Food waste supermarkets, food waste cooking schools and food waste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.\n7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to aste awareness campaigns are just some of the initiatives which have helped to foster a culture which prioritizes a reduction in food waste.","7 Whilst no country can be regarded as the winner in the fight against climate change, it is important to recognize those nations who are using innovation to rethink the way we do things, in order to protect and preserve our environment for future generations. Denmark is without doubt one of those pioneers and it would be neglectful of other countries not to follow suit with some of its green initiatives.\n¹agenda (n) important subjects that have to be dealt with\n²geothermal (adj) of or connected with the heat inside the earth\n³sanitation (n) a system of protecting people's health by removing dirt and waste"],"sources":[{"page":90,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f31dff461e3bea1ddb1ab1c7f731733a051e8766337eb099a240f630f924f8f4.png","width":3040,"height":4096}],"kind":"reading"},{"id":"B04-RW-U04-material:RW-M03","title":"READING 1","pages":[86],"text":"## Disaster mitigation\n\n1 The world has always had to face water-based natural disasters such as tsunamis and hurricanes. In an illuminating $^{1}$ interview, Water Management Monthly talks to Dan Smith, who works in disaster mitigation for a government agency.\n\n2 'Dan, could you tell us what disaster mitigation means?'\n\n'Disaster mitigation means attempting to minimize the impact of natural disasters both before and after they happen. My department and I work in two specific areas to try and do this: risk reduction and risk analysis. Both are crucial in disaster mitigation.'\n\n3 'What do you mean by risk reduction?'\n\n'Risk reduction means many things. It is not just referring to big engineering projects like dams. Often, small community projects can be the most effective means of risk reduction. The main way floods can be prevented is by the construction and maintenance of earth-wall defences, called levees. These block the progress of rising water. However, even the best levees can't protect against the devastating power of a tsunami. In this case, early-warning systems are lifesavers. They can let people know as early as possible if there is likely to be flooding.'\n\n4 'What types of risk analysis do you do?'\n\n'Firstly, risk analysis concerns flood mapping, where we identify the parts of the country which are at most risk from flooding. Secondly, there is mitigation planning, which helps local communities plan for when disaster strikes. Thirdly, we make sure that the country's dams all work properly and are safe. Although many people criticize dams because of their environmental impact, they also have many benefits such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. In terms of a cost-benefit analysis, we are definitely ahead.'\n\n5 'Do you think countries are better prepared now for natural disasters than they were in the past?'\n\n'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'\n\n6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'\n\n'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'\n\n7 'Is there any more that can be done, or are we as prepared as we can be?'\n\n'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding st-benefit analysis, we are definitely ahead.'","5 'Do you think countries are better prepared now for natural disasters than they were in the past?'","'Definitely. We are constantly developing new flood-prevention solutions. Some examples of these kinds of measures include the construction of sea walls and bulkheads², which protect the coasts, and the redesign of power stations and subway tunnels in the New York City area after the devastating damage caused by Hurricane Sandy in 2012. In the UK, another good example is the Thames Barrier, a huge engineering project designed to prevent London from flooding.'","6 'Aren't programmes like that very expensive? What lower-cost alternatives are there?'","'Flood prevention does not have to be expensive. Sandbags, for example, can be a highly effective way of stopping flood water.'","7 'Is there any more that can be done, or are we as prepared as we can be?'","'There's always more that could be done. But remember that the government can only be responsible for flood prevention up to a certain point. People have to become aware of the dangers of flooding themselves. This is crucial. Expensive early-warning systems are a waste of money if people pay no attention to them.'","¹ illuminating (adj) giving you new information about a subject","² bulkhead (n) an underwater wall"],"sources":[{"page":86,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44e80a1639113859da88bb10cd03433a950172eaaf19e3de3720aa974bea6c7f.png"}],"kind":"material","sourceBlockIds":["b6894"]}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6a3127b22838f57f4d6184fc53524247bba13e4b4123c2f8d61c5c906b3e1a0.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I think it is more challenging for\nbigger countries, because naturally they\nuse more resources. However, I think all\ncountries should put systems in place to\nhelp the environment, regardless of size.\n2 The use of renewable energy is starting\nto become more popular, for example\nmore people are putting solar panels on\ntheir roofs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6920","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":27,"module":"READING 2","ex":"9","context":{"moduleLabel":"READING 2","phaseTitle":"DISCUSSION"},"instruction":"Write about one of the following: transport, energy sources, waste management or water management. Write one paragraph for each of the questions below.","pages":[92],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c222ecc1bf264eb433b2876d15f0a3d71016216c2a7033096e774926a885f471.png"],"provided":"","items":[{"id":"b6920.i01","label":"1","prompt":"What does your country currently do to be environmentally friendly in this area?","options":[],"type":"gap/open"},{"id":"b6920.i02","label":"2","prompt":"What more could they do?","options":[],"type":"gap/open"}],"layout":"list","references":[],"material ple are starting to\nrecycle as much as possible. We have\ndifferent coloured bins provided by the\nlocal council which help us to separate\nour glass, cardboard, and food waste.\nIt is also more common now for people\nto buy second-hand clothes or to take\ntheir old clothes to the local charity\nshops or somewhere to recycle them.\n2 I think more could still be done in terms\nof recycling. I like the Danish idea of\nreceiving money in exchange for their\nbottles and cans. Also, I think there is\nstill a lot of food waste in this country.\nMore could be done to educate people\non how to recycle or reuse things they\nalready have and to only buy what is\nneeded.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U04-question:b6930","book":4,"unit":4,"track":"RW","topic":"THE ENVIRONMENT","lesson":2,"order":28,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read the two case studies. Match strategies (1–9) to case studies (A–B). Each strategy may be applied to one or both case studies.","pages":[94,95],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.i
