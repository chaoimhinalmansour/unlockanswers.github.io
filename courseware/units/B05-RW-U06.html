"technical writer","header":false,"colspan":1,"rowspan":1},{"text":"79,360","header":false,"colspan":1,"rowspan":1}],[{"text":"85","header":false,"colspan":1,"rowspan":1},{"text":"Civil engineer","header":false,"colspan":1,"rowspan":1},{"text":"88,450","header":false,"colspan":1,"rowspan":1}],[{"text":"96","header":false,"colspan":1,"rowspan":1},{"text":"cartographer","header":false,"colspan":1,"rowspan":1},{"text":"71,230","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"table","rows":[[{"text":"98","header":false,"colspan":1,"rowspan":1},{"text":"architect","header":false,"colspan":1,"rowspan":1},{"text":"81,230","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b8751.i01","label":"1","prompt":"Look at Figure 1 below. Based on what you have learned in this unit, explain the wide range of median salaries for the jobs in the table. Which information surprises you most?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b8751.i02","label":"2","prompt":"The highest-ranked job is also the highest paid, but this relationship is not consistent throughout the list. Explain what other components in the measure could be responsible for the ranking, with reference to two examples.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The jobs with the highest salaries are in\nthe fields of STEM and healthcare. They\nare the jobs that come with the most\nresponsibility which also require a lot\nof technical skill and expertise, so this\ndoes not surprise me. The lowest salary\nis for veterinary technician though, which\ndoes surprise me. The other jobs at the\nbottom of the pay scale are those which\nmight require additional training but do\nnot require Master’s or higher degrees\nsuch as sports coach.\n2 The highest paid jobs such as\ninformation systems manager and lawyer\nall rank in the top ten. Salary may play\na large part in the ranking for these\njobs. The lowest ranked jobs have a\nmid-range salary for the scale, such as\narchitect, cartographer, technical writer\nand civil engineer. These jobs may rank\nlow because the work environment is\nnot seen to be supportive. There may be\nother significant factors that affect the\nranking such as lacking job security and\ngood management.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:native-B5-RW-U6-p149-ex3","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"You have read about the skills gap and the value of higher education, primarily as they apply to western countries. Investigate these issues in your own country or region, focusing on the questions below. Keep a record of your sources.","pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38c4bb304e556401372f8f2ded618aec58a26f0cd18333b3960d59e5e37072be.png"],"provided":"","items":[{"id":"native-B5-RW-U6-p149-ex3.i1","label":"1","prompt":"Which kinds of jobs are most in demand?","options":[],"type":"qa/open"},{"id":"native-B5-RW-U6-p149-ex3.i2","label":"2","prompt":"Which kinds of jobs are easiest for employers to fill? Which are most difficult?","options":[],"type":"qa/open"},{"id":"native-B5-RW-U6-p149-ex3.i3","label":"3","prompt":"Is there a skills gap? If so, explain the gap.","options":[],"type":"qa/open"},{"id":"native-B5-RW-U6-p149-ex3.i4","label":"4","prompt":"If there is a skills gap, what kind of training would address this gap?","options":[],"type":"qa/open"},{"id":"native-B5-RW-U6-p149-ex3.i5","label":"5","prompt":"What are the job prospects for university graduates? Do most of them get jobs in their fields?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"native-B5-RW-U6-p149-ex3.i1","label":"1","prompt":"Which kinds of jobs are most in demand?","options":[],"type":"qa/open"},{"kind":"item","id":"native-B5-RW-U6-p149-ex3.i2","label":"2","prompt":"Which kinds of jobs are easiest for employers to fill? Which are most difficult?","options":[],"type":"qa/open"},{"kind":"item","id":"native-B5-RW-U6-p149-ex3.i3","label":"3","prompt":"Is there a skills gap? If so, explain the gap.","options":[],"type":"qa/open"},{"kind":"item","id":"native-B5-RW-U6-p149-ex3.i4","label":"4","prompt":"If there is a skills gap, what kind of training would address this gap?","options":[],"type":"qa/open"},{"kind":"item","id":"native-B5-RW-U6-p149-ex3.i5","label":"5","prompt":"What are the job prospects for university graduates? Do most of them get jobs in their fields?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Jobs in technology, healthcare, and\nengineering are most in demand, as\nwell as skilled trades like electricians\nand plumbers.\n2 Low-skill jobs like retail or basic service\nroles are easier to fill, while high-skill\njobs in IT, engineering, and healthcare\nare more difficult.\n3 Yes, there is a skills gap, especially in\ndigital skills, technical expertise, and\nengineering-related fields because\nthe demand for highly specialized\nskills, particularly digital and technical\nexpertise, exceeds the supply of\nqualified workers.\n4 Training in coding, data science, and\ntechnical vocational skills would help\naddress this gap.\n5 Job prospects for university graduates\nvary; many find jobs, but not all secure\npositions in their specific fields of study.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8755","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Gather some statistics on employment in your country or region. Keep a record of your sources.","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8a2c0efb95dda0d986f2165c5a497cb4c3575589d6ab62edce65f38ddf4308a7.png"],"provided":"","items":[{"id":"b8755.i01","label":"1","prompt":"What is the average participation rate in the labour market? Has this changed in recent years?","options":[],"type":"qa/open"},{"id":"b8755.i02","label":"2","prompt":"What percentage of young people go to university?","options":[],"type":"qa/open"},{"id":"b8755.i03","label":"3","prompt":"What is the unemployment rate? If possible, find out if there are different rates for people with different levels of education. Has this rate changed?","options":[],"type":"qa/open"},{"id":"b8755.i04","label":"4","prompt":"What are average salaries for university graduates? For those without a university education? Have these figures changed?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8755.i01","label":"1","prompt":"What is the average participation rate in the labour market? Has this changed in recent years?","options":[],"type":"qa/open"},{"kind":"item","id":"b8755.i02","label":"2","prompt":"What percentage of young people go to university?","options":[],"type":"qa/open"},{"kind":"item","id":"b8755.i03","label":"3","prompt":"What is the unemployment rate? If possible, find out if there are different rates for people with different levels of education. Has this rate changed?","options":[],"type":"qa/open"},{"kind":"item","id":"b8755.i04","label":"4","prompt":"What are average salaries for university graduates? For those without a university education? Have these figures changed?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The average labour force participation\nrate in my country is around 66%, with\na slight increase in recent years as more\npeople enter the workforce.\n2 Around 30-40% of young people in my\ncountry pursue higher education, but\nthere is some difference between urban\nand rural areas.\n3 The unemployment rate is approximately\n5%. Unemployment is lower for\nindividuals with higher education, while\nthose with only secondary education\ntend to face higher unemployment\n4 Average salaries for university graduates\nare about €1,000-1,500 per month,\nwhereas those without higher education\nearn closer to €500-800 per month.\nSalaries have been increasing slightly\ndue to economic growth","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8756","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Imagine you are a careers adviser and some students have asked you to advise them about which job they should do in the future. Choose one of the top five jobs, and identify the key reasons why they should choose this job. Compare your advice with a partner's and discuss how the two sets of advice differ and why.","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8a2c0efb95dda0d986f2165c5a497cb4c3575589d6ab62edce65f38ddf4308a7.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I recommend that you pursue a career in\nnursing. Being a nurse is a rewarding career\nthat lets young people help others. It offers\nstrong job security, and is always in demand\nworldwide. It also provides opportunities\nto specialize and grow professionally,\nwhile allowing flexible work schedules\nand the chance to work in different\nhealthcare settings.\nGRAMMAR FOR WRITING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8759","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":33,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Work with a partner. Choose a graph type from the word box and write it below the correct graph (A–D).","pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/693b4d017c85a0be90fa97a731ebf9c15b4d368bbec29bb20f0a5cb00b70df12.png"],"provided":"bar graph histogram line graph pie chart\nA\nWhich of the following do you feel best defines the US skills gap?\nLack of soft skills (i.e. communication, critical thinking, creativity, collaboration)\nLack of technical skills\n- Lack of strong leadership df","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8777","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":47,"module":"WRITING TASK","ex":"7","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Refer to the Task checklist on page 156 as you prepare your essay.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/78da4b9525da166c99d1be919833398f8d5a72c1ce7585280fa95d18295e5002.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U06-publisher-page:p156","title":"原题或核对备注所引第156页","pages":[156],"text":"","screens":[],"sources":[{"page":156,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7385acc7abb4c912bec02830095500be098d2f4fde452b5eebe505d8766370cc.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8779","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":48,"module":"WRITING TASK","ex":"8","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your essay. Use your essay plan to help you structure your ideas. Write 450–500 words.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/78da4b9525da166c99d1be919833398f8d5a72c1ce7585280fa95d18295e5002.png"],"provided":"","items":[{"id":"b8779.i01","label":"1","prompt":"Essay (450–500 words): ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U06-question:b8776","kind":"student-work","title":"WRITING TASK Ex 6","pages":[155]}],"materials":[],"coursePages":[[{"kind":"item","id":"b8779.i01","label":"1","prompt":"Essay (450–500 words): ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The job of information security analyst\nis one of the best careers to pursue now\nand in the near future. With an attractive\nsalary, strong job market, and manageable\neducation requirements, pursuing this field\nis a wise choice.\nInformation security analysts enjoy high\nearning potential, even at entry level.\nAccording to a table created by the US\nBureau of Labor Statistics, the median\nannual salary for these professionals is\napproximately $112,000, which places\nthem among the higher-earning roles in the\ntechnology sector. This competitive salary\nmakes the career especially appealing to\nthose looking for both financial stability\nand growth.\nIn addition to the strong salary, the\ndemand for information security analysts\nis booming. Employment in this field is\nexpected to grow by 32% through 2032,\nmuch faster than the average for other\noccupations. With an average of 16,800\nnew job openings annually in the U.S.,\nthe opportunities for new graduates and\nprofessionals seeking career shifts are\nextensive. This sustained growth is driven\nby increasing cybersecurity threats, as\norganizations of all sizes require specialists\nto protect their data and networks.\nAnother benefit is that although a\nbachelor’s degree is typically required for\nentry-level positions, other similarly well-\npaying fields often require more advanced\ndegrees. This makes information security\nan accessible option for those who want\na high-paying job without the need for\nfurther education.\nInformation security analysts are also\nqualified for a wide range of roles across\ndifferent sectors. Their duties can vary\nsignificantly from one job to another,\noffering flexibility and options for\nspecialization. This variety contributes to\nhigher job satisfaction, as professionals can\ntailor their careers to their interests. Anyone\npursuing this career can expect long-term\nbenefits and stability in a growing field.\nUNIT 7\nUNLOCK YOUR\nKNOWLEDGE\npage 159\n1 I see signs of air pollution on a fairly\nregular basis. There are certain days\nthat are hazier than others and the\nhaze is usually an odd colour, making\nit obvious that the cause is some type\nof pollution. Also, I live in a city, so\nthere are some days when the traffic is\nvery bad. On those days, I can see the\npollution caused by cars hanging in the\nair around me.\n2 If pollution prevents people from going\noutdoors or from enjoying outdoor\nactivities, that can impact their quality\nof life. Pollution can also lead to health\nconsequences, such as sore throats\nor even worse. If a person’s health is\nimpacted by pollution, that will lower\ntheir quality of life quite a bit.\n3 Illnesses such as cholera can be\ntransmitted by bacteria in drinking water.\nAir pollution may cause lung infections;\nit also increases the likelihood of certain\ntypes of cancer.\n4 Because climate change has so many\nnegative consequences, I believe it is\nthe worst public health crisis the world\nis facing. Climate change can lead to\ndrought, which may result in people\nnot having access to enough food and\nwater. That results in malnutrition and\nstarvation. Climate change also makes\nair pollution worse, which causes many\nserious illnesses and diseases.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368 ,"pages":[[{"term":"costly","pos":"(adv)","definition":"expensive","example":"Replacing all the windows would be costly.","wordAudio":"costly","cardWord":false},{"term":"trade","pos":"(n)","definition":"a particular business or industry","example":"She trained as an apprentice in the carpentry trade.","wordAudio":"trade","cardWord":false},{"term":"vocational","pos":"(adj)","definition":"providing skills and education that prepare you for a job","example":"The college offers vocational courses in construction.","wordAudio":"vocational","cardWord":false},{"term":"dual","pos":"(adj)","definition":"something with two parts","example":"The device serves a dual purpose as a clock and a radio.","wordAudio":"dual","cardWord":false},{"term":"labour market","pos":"(phr)","definition":"the supply of people in a particular country who are able and willing to work","example":"The report examines changes in the local labour market.","wordAudio":"labour market","cardWord":false}]]}},{"id":"B05-RW-U06-classroom:video","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d7c1dd504331e6fbdff178808f89cae0c1eb38faab4416366d2604750a3e715.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/42f13412ccb470c62c3d3333-L5RW-U06.mp4","captions":[{"start":0,"end":6.16,"text":"The traditional path to a professional career involves\nyears in classrooms."},{"start":6.72,"end":9.76,"text":"After long hours of studying and writing essays,"},{"start":10.16,"end":18.6,"text":"it's quite possible to leave university having paid\ncostly tuition fees and without any work experience in\nyour chosen field."},{"start":19.68,"end":24.02,"text":"The word apprenticeship is often associated with\nskilled trades,"},{"start":24.48,"end":29.28,"text":"but apprenticeships can offer an alternative route to a\ngraduate career too."},{"start":30.04,"end":31.9,"text":"With some apprenticeship programs,"},{"start":32.32,"end":40.3,"text":"you can enter a company and begin your career whilst\nearning degree level or even higher qualifications\nalong the way."},{"start":41.32,"end":42.08,"text":"In Germany,"},{"start":42.46,"end":45.46,"text":"almost every profession has an apprenticeship route."},{"start":45.96,"end":50.56,"text":"You could become qualified and experienced in fields\nsuch as physiotherapy,"},{"start":51.08,"end":51.98,"text":"human resources,"},{"start":52.52,"end":54.28,"text":"engineering or IT."},{"start":54.98,"end":56.12,"text":"To get started,"},{"start":56.58,"end":62.44,"text":"you apply to an employer as an apprentice and only then\njoin a program of study."},{"start":63.2,"end":67.02,"text":"Your time will be split between studying and working at\nthe company."},{"start":67.92,"end":71.78,"text":"Exactly how your time is split depends on the specific\napprenticeship."},{"start":72.86,"end":80.78,"text":"The company will pay you a salary and pay any tuition\nfees and you could get many other employee benefits\ntoo."},{"start":82.02,"end":86.02,"text":"There are two main types of apprenticeships in Germany."},{"start":86.76,"end":89.32,"text":"One is called a vocational apprenticeship."},{"start":90.22,"end":97.3,"text":"Here you'll study at a vocational school and after\naround three years gain a vocational qualification,"},{"start":97.78,"end":99.68,"text":"which can be at degree level."},{"start":100.5,"end":103.46000000000001,"text":"The other is called a dual studies apprenticeship."},{"start":104.24000000000001,"end":108.72,"text":"Here you'll study at a university and after three years\nor more,"},{"start":109.06,"end":113.32,"text":"gain both an academic degree and a vocational\nqualification."},{"start":114.64,"end":119.72,"text":"Germany's vocational training system is designed to\nmeet the needs of the labour market,"},{"start":120.2,"end":124.48,"text":"so an apprenticeship almost certainly leads to a\npermanent job."},{"start":125.18,"end":126.08,"text":"In the UK,"},{"start":126.66,"end":131.3,"text":"degree apprenticeships are being used not only to fill\ngaps in the labour market,"},{"start":131.68,"end":134.8,"text":"but also to expand sectors of the economy."},{"start":135.74,"end":144.52,"text":"Ambitions to grow the UK's space industry have led to\nthe introduction of a degree apprenticeship as a space\nsystems engineer."},{"start":145.68,"end":151.7,"text":"With an apprenticeship at the Airbus company and a\ndegree program delivered by Space Park Leicester,"},{"start":152.04,"end":159.9,"text":"students begin on a career which could involve\ndesigning and building spacecraft, development and\ntesting of satellites,"},{"start":160.68,"end":163.86,"text":"or operating and maintaining ground support systems."},{"start":164.98,"end":166.98,"text":"In both Germany and the UK,"},{"start":167.56,"end":172.4,"text":"degree apprenticeships are open to international\nstudents and people of any age."},{"start":173.2,"end":174.98,"text":"Anybody in the world can apply,"},{"start":175.46,"end":177.57999999999998,"text":"provided they meet the entry requirements."},{"start":178.82,"end":183.98,"text":"Companies support these programs because they can help\nparticipants develop exactly the"},{"start":184.6,"end":186,"text":"for a future with them."},{"start":186.86,"end":194.4,"text":"They have the chance to shape and win the loyalty of\njob candidates they believe will help them reach for\nthe stars."}],"launchInline":true}},{"id":"B05-RW-U06-classroom:resource:b8710","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"module":"Vocabulary for Ex 4","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[139],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f47e63af8ef834a4effb9f96879ab3b0a621a46381f12a7e1d99ca1f430eaf3d.png"],"layout":"list","instruction":"Vocabulary for Ex 4","flow":{"kind":"resource","pages":["assertive (adj) forceful; bold and confident\ncomprise (v) to have things or people as parts or members; to consist of\nexpertise (n) a high level of knowledge or skill\nlabour (n) workers, especially people who do practical work with their hands","mismatch (n) an occasion when people or things are put together that do not work well together\npersistent (adj) (of a problem) lasting for a long time, difficult to resolve\npose (v) to cause\nprospective (adj) wanted or expected to do a particular thing in the future"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U06-classroom:material:RW-M03","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[140,141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0d9bfd7ccecb120f1d0e0d1b7a58fbc9146a95ad8ffe9659e0bf3222d5108d80.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8fcdadc8449a936d83992be370057598dd811ff2a6890d7dd2dcd6e3b3ef029.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.","sourcePage":140},{"body":"2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap","sourcePage":140},{"body":"3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should","sourcePage":140},{"body":"instead find alternative solutions.\n## Closing the skills gap\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.","sourcePage":140},{"body":"Technical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.","sourcePage":141},{"body":"The skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","sourcePage":141}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U06-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"THE SKILLS GAP","pages":[{"page":140,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0d9bfd7ccecb120f1d0e0d1b7a58fbc9146a95ad8ffe9659e0bf3222d5108d80.png","width":772,"height":1040},{"page":141,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8fcdadc8449a936d83992be370057598dd811ff2a6890d7dd2dcd6e3b3ef029.png","width":772,"height":1040}],"source":140,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.","sourcePage":140},{"body":"2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap","sourcePage":140},{"body":"3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should","sourcePage":140},{"body":"instead find alternative solutions.\n## Closing the skills gap\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.","sourcePage":140},{"body":"Technical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.","sourcePage":141},{"body":"The skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","sourcePage":141}],"text":"## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.\n2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap\n3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should\ninstead find alternative solutions.\n## Closing the skills gap\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.\nTechnical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.\nThe skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2911d636159ca18d6ea3fca69f52cbbd3834165342f0ea5a3490b3aaecadd751.mp3"},"original":{"id":"B05-RW-U06-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U06","book":5,"track":"RW","unit":6,"title":"READING 1","kind":"material","pages":[140,141],"sourceImages":[{"page":140,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0d9bfd7ccecb120f1d0e0d1b7a58fbc9146a95ad8ffe9659e0bf3222d5108d80.png","viewEvidenceReported":true},{"page":141,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8fcdadc8449a936d83992be370057598dd811ff2a6890d7dd2dcd6e3b3ef029.png","viewEvidenceReported":true}],"text":"## THE SKILLS GAP\n\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.\n\n2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n\n## Causes of the skills gap\n\n3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should instead find alternative solutions.\n\n## Closing the skills gap\n\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.\nTechnical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\n\nFigure 2.\n\nThe skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8712","b8713"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2911d636159ca18d6ea3fca69f52cbbd3834165342f0ea5a3490b3aaecadd751.mp3","continueOnPage":true}},{"id":"B05-RW-U06-classroom:material:RW-M04","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2da7d2b30c7cde83fa07903fb9d39675cd847d927bdc09335c30578d5606f584.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education","sourcePage":145},{"body":"2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.","sourcePage":145},{"body":"3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees","sourcePage":145},{"body":"4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.","sourcePage":145},{"body":"5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","sourcePage":145}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"What is the value of a university education?","pages":[{"page":145,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2da7d2b30c7cde83fa07903fb9d39675cd847d927bdc09335c30578d5606f584.png","width":772,"height":1040}],"source":145,"embeddedIn":null,"photo":null,"clearPages":[{"body":"What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education","sourcePage":145},{"body":"2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.","sourcePage":145},{"body":"3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees","sourcePage":145},{"body":"4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.","sourcePage":145},{"body":"5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","sourcePage":145}],"text":"What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education\n2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.\n3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees\n4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.\n5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a9ae8826e80a1b5c9e99808b717e9331f4ae7235655fcfb8e99ff68cc56156b.mp3"},"original":{"id":"B05-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U06","book":5,"track":"RW","unit":6,"title":"READING 2","kind":"material","pages":[145],"sourceImages":[{"page":145,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2da7d2b30c7cde83fa07903fb9d39675cd847d927bdc09335c30578d5606f584.png","viewEvidenceReported":true}],"text":"What is the value of a university education?\n\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\n\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n\n## The impact of a university education\n\n2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\n\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\n\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.\n\n3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n\n## Income variance between degrees\n\n4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.\n5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8733"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a9ae8826e80a1b5c9e99808b717e9331f4ae7235655fcfb8e99ff68cc56156b.mp3","continueOnPage":true}},{"id":"B05-RW-U06-classroom:review-1","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[157],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8f8cfe9dc01d58049f0a2ebf0e245a8c910b28c2929421075f843e4e92688427.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-RW-U06-B-003","form":"assertive","page":157},{"id":"B05-RW-U06-B-005","form":"comprise","page":157},{"id":"B05-RW-U06-B-007","form":"earning power","page":157},{"id":"B05-RW-U06-B-008","form":"entry level","page":157},{"id":"B05-RW-U06-B-009","form":"expertise","page":157},{"id":"B05-RW-U06-B-012","form":"job market","page":157},{"id":"B05-RW-U06-B-013","form":"labour","page":157},{"id":"B05-RW-U06-B-014","form":"labour force","page":157},{"id":"B05-RW-U06-B-015","form":"mismatch","page":157},{"id":"B05-RW-U06-B-017","form":"persistent","page":157},{"id":"B05-RW-U06-B-018","form":"placement rate","page":157},{"id":"B05-RW-U06-B-019","form":"pose","page":157},{"id":"B05-RW-U06-B-020","form":"prospective","page":157},{"id":"B05-RW-U06-B-021","form":"training scheme","page":157}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U06-classroom:review-2","book":5,"unit":6,"track":"RW","topic":"CAREERS
