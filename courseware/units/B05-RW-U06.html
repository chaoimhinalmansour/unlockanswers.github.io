uestion:b8698","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Number the sentences in the order they are mentioned.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d7c1dd504331e6fbdff178808f89cae0c1eb38faab4416366d2604750a3e715.png"],"provided":"","items":[{"id":"b8698.i01","label":"1","prompt":"Apprenticeships are common in Germany. ____","options":[],"type":"gap/closed"},{"id":"b8698.i02","label":"2","prompt":"A traditional career path can be expensive, time consuming and impractical. ____","options":[],"type":"gap/closed"},{"id":"b8698.i03","label":"3","prompt":"Companies benefit from hiring apprentices. ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8698.i01","label":"1","prompt":"Apprenticeships are common in Germany. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b8698.i02","label":"2","prompt":"A traditional career path can be expensive, time consuming and impractical. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b8698.i03","label":"3","prompt":"Companies benefit from hiring apprentices. ____","options":[],"type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/42f13412ccb470c62c3d3333-L5RW-U06.mp4","captions":[{"start":0,"end":6.16,"text":"The traditional path to a professional career involves\nyears in classrooms."},{"start":6.72,"end":9.76,"text":"After long hours of studying and writing essays,"},{"start":10.16,"end":18.6,"text":"it's quite possible to leave university having paid\ncostly tuition fees and without any work experience in\nyour chosen field."},{"start":19.68,"end":24.02,"text":"The word apprenticeship is often associated with\nskilled trades,"},{"start":24.48,"end":29.28,"text":"but apprenticeships can offer an alternative route to a\ngraduate career too."},{"start":30.04,"end":31.9,"text":"With some apprenticeship programs,"},{"start":32.32,"end":40.3,"text":"you can enter a company and begin your career whilst\nearning degree level or even higher qualifications\nalong the way."},{"start":41.32,"end":42.08,"text":"In Germany,"},{"start":42.46,"end":45.46,"text":"almost every profession has an apprenticeship route."},{"start":45.96,"end":50.56,"text":"You could become qualified and experienced in fields\nsuch as physiotherapy,"},{"start":51.08,"end":51.98,"text":"human resources,"},{"start":52.52,"end":54.28,"text":"engineering or IT."},{"start":54.98,"end":56.12,"text":"To get started,"},{"start":56.58,"end":62.44,"text":"you apply to an employer as an apprentice and only then\njoin a program of study."},{"start":63.2,"end":67.02,"text":"Your time will be split between studying and working at\nthe company."},{"start":67.92,"end":71.78,"text":"Exactly how your time is split depends on the specific\napprenticeship."},{"start":72.86,"end":80.78,"text":"The company will pay you a salary and pay any tuition\nfees and you could get many other employee benefits\ntoo."},{"start":82.02,"end":86.02,"text":"There are two main types of apprenticeships in Germany."},{"start":86.76,"end":89.32,"text":"One is called a vocational apprenticeship."},{"start":90.22,"end":97.3,"text":"Here you'll study at a vocational school and after\naround three years gain a vocational qualification,"},{"start":97.78,"end":99.68,"text":"which can be at degree level."},{"start":100.5,"end":103.46000000000001,"text":"The other is called a dual studies apprenticeship."},{"start":104.24000000000001,"end":108.72,"text":"Here you'll study at a university and after three years\nor more,"},{"start":109.06,"end":113.32,"text":"gain both an academic degree and a vocational\nqualification."},{"start":114.64,"end":119.72,"text":"Germany's vocational training system is designed to\nmeet the needs of the labour market,"},{"start":120.2,"end":124.48,"text":"so an apprenticeship almost certainly leads to a\npermanent job."},{"start":125.18,"end":126.08,"text":"In the UK,"},{"start":126.66,"end":131.3,"text":"degree apprenticeships are being used not only to fill\ngaps in the labour market,"},{"start":131.68,"end":134.8,"text":"but also to expand sectors of the economy."},{"start":135.74,"end":144.52,"text":"Ambitions to grow the UK's space industry have led to\nthe introduction of a degree apprenticeship as a space\nsystems engineer."},{"start":145.68,"end":151.7,"text":"With an apprenticeship at the Airbus company and a\ndegree program delivered by Space Park Leicester,"},{"start":152.04,"end":159.9,"text":"students begin on a career which could involve\ndesigning and building spacecraft, development and\ntesting of satellites,"},{"start":160.68,"end":163.86,"text":"or operating and maintaining ground support systems."},{"start":164.98,"end":166.98,"text":"In both Germany and the UK,"},{"start":167.56,"end":172.4,"text":"degree apprenticeships are open to international\nstudents and people of any age."},{"start":173.2,"end":174.98,"text":"Anybody in the world can apply,"},{"start":175.46,"end":177.57999999999998,"text":"provided they meet the entry requirements."},{"start":178.82,"end":183.98,"text":"Companies support these programs because they can help\nparticipants develop exactly the"},{"start":184.6,"end":186,"text":"for a future with them."},{"start":186.86,"end":194.4,"text":"They have the chance to shape and win the loyalty of\njob candidates they believe will help them reach for\nthe stars."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 2 2 1 3 3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c7 :71.78,"text":"Exactly how your time is split depends on the specific\napprenticeship."},{"start":72.86,"end":80.78,"text":"The company will pay you a salary and pay any tuition\nfees and you could get many other employee benefits\ntoo."},{"start":82.02,"end":86.02,"text":"There are two main types of apprenticeships in Germany."},{"start":86.76,"end":89.32,"text":"One is called a vocational apprenticeship."},{"start":90.22,"end":97.3,"text":"Here you'll study at a vocational school and after\naround three years gain a vocational qualification,"},{"start":97.78,"end":99.68,"text":"which can be at degree level."},{"start":100.5,"end":103.46000000000001,"text":"The other is called a dual studies apprenticeship."},{"start":104.24000000000001,"end":108.72,"text":"Here you'll study at a university and after three years\nor more,"},{"start":109.06,"end":113.32,"text":"gain both an academic degree and a vocational\nqualification."},{"start":114.64,"end":119.72,"text":"Germany's vocational training system is designed to\nmeet the needs of the labour market,"},{"start":120.2,"end":124.48,"text":"so an apprenticeship almost certainly leads to a\npermanent job."},{"start":125.18,"end":126.08,"text":"In the UK,"},{"start":126.66,"end":131.3,"text":"degree apprenticeships are being used not only to fill\ngaps in the labour market,"},{"start":131.68,"end":134.8,"text":"but also to expand sectors of the economy."},{"start":135.74,"end":144.52,"text":"Ambitions to grow the UK's space industry have led to\nthe introduction of a degree apprenticeship as a space\nsystems engineer."},{"start":145.68,"end":151.7,"text":"With an apprenticeship at the Airbus company and a\ndegree program delivered by Space Park Leicester,"},{"start":152.04,"end":159.9,"text":"students begin on a career which could involve\ndesigning and building spacecraft, development and\ntesting of satellites,"},{"start":160.68,"end":163.86,"text":"or operating and maintaining ground support systems."},{"start":164.98,"end":166.98,"text":"In both Germany and the UK,"},{"start":167.56,"end":172.4,"text":"degree apprenticeships are open to international\nstudents and people of any age."},{"start":173.2,"end":174.98,"text":"Anybody in the world can apply,"},{"start":175.46,"end":177.57999999999998,"text":"provided they meet the entry requirements."},{"start":178.82,"end":183.98,"text":"Companies support these programs because they can help\nparticipants develop exactly the"},{"start":184.6,"end":186,"text":"for a future with them."},{"start":186.86,"end":194.4,"text":"They have the chance to shape and win the loyalty of\njob candidates they believe will help them reach for\nthe stars."}]}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":50,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8702","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the question.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1d7c1dd504331e6fbdff178808f89cae0c1eb38faab4416366d2604750a3e715.png"],"provided":"Is a traditional education or an apprenticeship more appealing to you? Explain your answer.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Is a traditional education or an apprenticeship more appealing to you? Explain your answer."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"An apprenticeship is more appealing to\nme. At university, I feel I would spend\na lot of time and money taking courses\ntoward a degree that may or may not\nresult in a career. On the other hand, an\napprenticeship is almost certain to end in\na job. I am interested in learning practical,\nmarketable skills that I can use as soon as\npossible. I am more likely to learn those\nskills during an apprenticeship.\nFor me, university is more appealing. It is a\ngood way to ease into adulthood instead\nof entering the labour force directly out of\nsecondary school. A university campus is\nalso a more attractive learning environment\nthan an office building, factory or lab.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":50,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8707","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":8,"module":"READING 1","ex":"1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read an article about the demand for workers with appropriate skills. Work with a partner. Look at the graph and discuss the questions below.","pages":[138],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/11c80dc2113e6badee0d4e5a61e1ace2300daca877f192137d7714fe8b1bc496.png"],"provided":"Fastest Growing Occupations\nGrowth rate, 2022-32\nSource: US Bureau of Labor Statistics","items":[{"id":"b8707.i01","label":"1","prompt":"Put the jobs into 4–5 categories that make sense to you (e.g. computer science). Which category has the fastest growing jobs?","options":[],"type":"discuss/open"},{"id":"b8707.i02","label":"2","prompt":"What sorts of skills and knowledge are required for the categories you selected in question 1?","options":[],"type":"discuss/open"},{"id":"b8707.i03","label":"3","prompt":"Why, do you think, are these occupational areas predicted to be the fastest growing in the near future?","options":[],"type":"discuss/open"},{"id":"b8707.i04","label":"4","prompt":"What implications might this prediction have for school curriculum development?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Fastest Growing Occupations"},{"kind":"text","text":"Growth rate, 2022-32"},{"kind":"text","text":"Source: US Bureau of Labor Statistics"},{"kind":"item","id":"b8707.i01","label":"1","prompt":"Put the jobs into 4–5 categories that make sense to you (e.g. computer science). Which category has the fastest growing jobs?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8707.i02","label":"2","prompt":"What sorts of skills and knowledge are required for the categories you selected in question 1?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b8707.i03","label":"3","prompt":"Why, do you think, are these occupational areas predicted to be the fastest growing in the near future?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8707.i04","label":"4","prompt":"What implications might this prediction have for school curriculum development?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 STEM jobs: data scientists, statisticians,\ninformation security analysts, software\ndevelopers, actuaries, computer\nand information research scientists,\noperations research analysts\nhealthcare: nurse practitioners,\nmedical and health services managers,\nepidemiologists, physician assistants,\nphysical therapist assistants,\noccupational therapy assistants, home\nhealth and personal care aides\nservice industry: taxi drivers, personal\ncare and service workers\nenvironmental jobs: wind turbine service\ntechnicians, solar photovoltaic installers\nanimal care jobs: veterinary\ntechnologists and technicians, veterinary\nassistants and laboratory animal\ncaretakers\nSTEM jobs and healthcare both have\nthe same number (7) of the fastest\ngrowing jobs.\n2 STEM jobs: maths, data analysis,\ncomputer science, research, critical\nthinking, problem solving, statistics\nhealthcare: biological and physical\nsciences, maths, statistics, public policy,\npublic health, compassion, listening,\ncommunication, patience, empathy\nservice industry: willingness to help\nothers, listening, communication,\npatience, efficiency\nenvironmental jobs: specialized\nknowledge of equipment and\ninstallation, ability to read building\nplans, knowledge of clean energy\nanimal care jobs: animal anatomy,\nmaths, animal nutrition, love of animals,\npatience, compassion\n3 The growth of STEM jobs is a direct\nreflection of the growth in technology.\nAs technology evolves, more employees\nare needed to manage and maintain it.\nHealthcare is another field that is always\nevolving owing to the constant search\nfor treatments and cures for illnesses\nand diseases. It is usually considered\na stable career field to pursue. Jobs in\nthe service industry may be growing\nbecause more people are traveling\naround the world than ever before.\nEnvironmental jobs are increasing as\nnations around the world try to reduce\ntheir use of fossil fuels and rely more\non clean energy. Animal care jobs may\nbe growing because helping animals\nis often very satisfying and rewarding.\nSome people may wish to apply their\ncompassion to animals instead of\nhumans, who can sometimes be more\ncomplicated to deal with.\n4 Schools should teach students skills\nrelated to STEM and healthcare from\nan early age. For example, elementary\nschools should create engaging\nopportunities for students to learn and\nenjoy science, maths and technology.\nAs students advance in their schooling,\nthere should be many opportunities\nto continue learning these skills, both\nformally and informally.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8708","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":9,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Now look at Figures 1 and 2 in the article on pages 140–141 and answer the questions about each graph.","pages":[139],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f47e63af8ef834a4effb9f96879ab3b0a621a46381f12a7e1d99ca1f430eaf3d.png"],"provided":"","items":[{"id":"b8708.i01","label":"1","prompt":"What does the horizontal axis (the x-axis) in Figure 1 measure?","options":[],"type":"qa/open"},{"id":"b8708.i02","label":"2","prompt":"What does the vertical axis (the y-axis) in Figure 1 measure?","options":[],"type":"qa/open"},{"id":"b8708.i03","label":"3","prompt":"What do the blue and grey bars in Figure 2 measure?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8708.i01","label":"1","prompt":"What does the horizontal axis (the x-axis) in Figure 1 measure?","options":[],"type":"qa/open"},{"kind":"item","id":"b8708.i02","label":"2","prompt":"What does the vertical axis (the y-axis) in Figure 1 measure?","options":[],"type":"qa/open"},{"kind":"item","id":"b8708.i03","label":"3","prompt":"What do the blue and grey bars in Figure 2 measure?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B05-RW-U06-publisher-page:p141","title":"原题或核对备注所引第141页","pages":[141],"text":"","screens":[],"sources":[{"page":141,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8fcdadc8449a936d83992be370057598dd811ff2a6890d7dd2dcd6e3b3ef029.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 time: 2013–2023\n2  the percentage of companies that had difficulty\nfilling positions\n3  The blue bars measure the number of job openings\nin various STEM fields; the grey bars measure the\nnumber of recent graduates in those fields.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8709","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Based on the information in the graphs in the article, answer the questions.","pages":[139],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f47e63af8ef834a4effb9f96879ab3b0a621a46381f12a7e1d99ca1f430eaf3d.png"],"provided":"","items":[{"id":"b8709.i01","label":"1","prompt":"What problem does the first column of Figure 2 illustrate?","options":[],"type":"qa/open"},{"id":"b8709.i02","label":"2","prompt":"How does the information in Figure 2 explain the problems that the employers in Figure 1 are experiencing?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8709.i01","label":"1","prompt":"What problem does the first column of Figure 2 illustrate?","options":[],"type":"qa/open"},{"kind":"item","id":"b8709.i02","label":"2","prompt":"How does the information in Figure 2 explain the problems that the employers in Figure 1 are experiencing?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 There are not enough graduates to\nfill the number of computing jobs that\ncompanies have open.\n2 Figure 1 shows that companies are\nfinding it increasingly difficult to fill\nvacancies. Figure 2 shows that there are\nnot enough computing graduates for\nthe jobs available in that field. This may\npartly explain why companies cannot fill\nthe positions.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8711","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the definitions. Use the correct form of the words in bold to complete the sentences below.","pages":[139],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f47e63af8ef834a4effb9f96879ab3b0a621a46381f12a7e1d99ca1f430eaf3d.png"],"provided":"","items":[{"id":"b8711.i01","label":"1","prompt":"Professors at this technical institute are known for their ____ in robotics and high-tech electronics.","options":[],"type":"gap/closed"},{"id":"b8711.i02","label":"2","prompt":"This situation ____ a real problem for our company because we can't find skilled applicants to fill our positions.","options":[],"type":"gap/closed"},{"id":"b8711.i03","label":"3","prompt":"There is an unfortunate ____ between the organization's goals and its actions.","options":[],"type":"gap/closed"},{"id":"b8711.i04","label":"4","prompt":"Experts are studying the youngest sector in the labour force, which ____ workers between the ages of 18 and 24.","options":[],"type":"gap/closed"},{"id":"b8711.i05","label":"5","prompt":"You have to be more ____ if you want people to listen.","options":[],"type":"gap/closed"},{"id":"b8711.i06","label":"6","prompt":"Our ____ costs were way too high, so we moved our operation to Vietnam, where workers' salaries are lower.","options":[],"type":"gap/closed"},{"id":"b8711.i07","label":"7","prompt":"The staff in the admissions office regularly meet with ____ students to answer their questions and give campus tours.","options":[],"type":"gap/closed"},{"id":"b8711.i08","label":"8","prompt":"For the last five years, there has been a ____ shortage of job applicants with skills in a wide range of technical areas.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8711.i01","label":"1","prompt":"Professors at this technical institute are known for their ____ in robotics and high-tech electronics.","options":[],"type":"gap/closed","answer":{"label":"1","mode":"gap","answer":"expertise"}},{"kind":"item","id":"b8711.i02","label":"2","prompt":"This situation ____ a real problem for our company because we can't find skilled applicants to fill our positions.","options":[],"type":"gap/closed","answer":{"label":"2","mode":"gap","answer":"poses"}},{"kind":"item","id":"b8711.i03","label":"3","prompt":"There is an unfortunate ____ between the organization's goals and its actions.","options":[],"type":"gap/closed","answer":{"label":"3","mode":"gap","answer":"mismatch"}},{"kind":"item","id":"b8711.i04","label":"4","prompt":"Experts are studying the youngest sector in the labour force, which ____ workers between the ages of 18 and 24.","options":[],"type":"gap/closed","answer":{"label":"4","mode":"gap","answer":"comprises"}},{"kind":"item","id":"b8711.i05","label":"5","prompt":"You have to be more ____ if you want people to listen.","options":[],"type":"gap/closed","answer":{"label":"5","mode":"gap","answer":"assertive"}}],[{"kind":"item","id":"b8711.i06","label":"6","prompt":"Our ____ costs were way too high, so we moved our operation to Vietnam, where workers' salaries are lower.","options":[],"type":"gap/closed","answer":{"label":"6","mode":"gap","answer":"labour"}},{"kind":"item","id":"b8711.i07","label":"7","prompt":"The staff in the admissions office regularly meet with ____ students to answer their questions and give campus tours.","options":[],"type":"gap/closed","answer":{"label":"7","mode":"gap","answer":"prospective"}},{"kind":"item","id":"b8711.i08","label":"8","prompt":"For the last five years, there has been a ____ shortage of job applicants with skills in a wide range of technical areas.","options":[],"type":"gap/closed","answer":{"label":"8","mode":"gap","answer":"persistent"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 expertise 2 poses 3 mismatch 4 comprises\n5 assertive 6 labour 7 prospective 8 persistent","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8715","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":12,"module":"READING 1","ex":"5","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article. Then match the main ideas (a–f) with each paragraph (1–6).","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8fcdadc8449a936d83992be370057598dd811ff2a6890d7dd2dcd6e3b3ef029.png"],"provided":"","items":[{"id":"b8715.i01","label":"a","prompt":"Schools that provide training in IT can help fill the skills gap. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"id":"b8715.i02","label":"b","prompt":"Employees in the skilled trades and with STEM training are in the greatest demand. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"id":"b8715.i03","label":"c","prompt":"There is no single solution to the skills gap. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"id":"b8715.i04","label":"d","prompt":"Current job applicants do not have the skills that employers are looking for. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"id":"b8715.i05","label":"e","prompt":"Businesses need to participate more in preparing future employees. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"id":"b8715.i06","label":"f","prompt":"Universities do not always offer an education with a clear career path. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8715.i01","label":"a","prompt":"Schools that provide training in IT can help fill the skills gap. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"kind":"item","id":"b8715.i02","label":"b","prompt":"Employees in the skilled trades and with STEM training are in the greatest demand. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"}],[{"kind":"item","id":"b8715.i03","label":"c","prompt":"There is no single solution to the skills gap. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"kind":"item","id":"b8715.i04","label":"d","prompt":"Current job applicants do not have the skills that employers are looking for. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"}],[{"kind":"item","id":"b8715.i05","label":"e","prompt":"Businesses need to participate more in preparing future employees. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"},{"kind":"item","id":"b8715.i06","label":"f","prompt":"Universities do not always offer an education with a clear career path. ____","options":["1","2","3","4","5","6"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B05-RW-U06-classroom:material:RW-M03","title":"READING 1","text":"## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.\n2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap\n3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should\ninstead find alternative solutions.\n## Closing the skills gap\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.\nTechnical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.\nThe skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","screens":["## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.","2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap","3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education  training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap\n3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should\ninstead find alternative solutions.\n## Closing the skills gap\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.\nTechnical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.\nThe skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","screens":["## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.","2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT) iding them toward training they may\nneed to be successful.\n2 Universities could invite employers from\nvarious fields that are in demand to\nspeak to students. The speakers could\ninform students exactly what skills the\njob requires and what their day-to-day\ntasks might be. University students are\nmore willing to pursue careers they are\ninformed about.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8723","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":1,"order":17,"module":"READING 1","ex":"10","context":{"moduleLabel":"READING 1","phaseTitle":"DISCUSSION"},"instruction":"Write an email to a business you know about. Suggest ways they can hire employees that fulfil their company's needs. Ideas may include:","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2fcdc76ae6f0305dbde10b013a4b9b5b50b46b4c52379797da04d6b903f3d4b9.png"],"provided":"- offering an internship\n- establishing a training scheme for new employees\n- informing schools and universities what skills prospective employees should learn","items":[{"id":"b8723.i01","label":"1","prompt":"Write an email to a business you know about, suggesting ways they can hire employees that fulfil their company's needs.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- offering an internship"},{"kind":"text","text":"- establishing a training scheme for new employees"},{"kind":"text","text":"- informing schools and universities what skills prospective employees should learn"},{"kind":"item","id":"b8723.i01","label":"1","prompt":"Write an email to a business you know about, suggesting ways they can hire employees that fulfil their company's needs.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U06-classroom:material:RW-M03","title":"READING 1","text":"## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.\n2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education (for example, a training course to develop the required skill), but often they do not require a university education. In the United States, almost half of the labour force works in these kinds of jobs.\n## Causes of the skills gap\n3 Why have we been unable to bridge this gap and prepare workers for the jobs of the future, or even the jobs of today? The answer lies in both the job market and the education system in many western countries. The job market is changing more quickly than ever before. Many of the jobs that companies need to fill today did not exist when current job applicants were in school, making it difficult for curriculums to keep up with the demands of the market. Nevertheless, numerous business leaders argue that schools are not doing enough to provide the technical training that many jobs demand. For example, only a quarter of all schools in the United States teach computer science. Most schools and universities continue to offer the same type of education that they have provided in the past. As a result, lots of students graduate with degrees that do not prepare them for the jobs that are available. Given this mismatch between the education system and the job market, several labour experts say we cannot and perhaps should not depend on traditional schooling to close the skills gap and should\ninstead find alternative solutions.\n## Closing the skills gap\n4 Both industry and academic experts argue that businesses themselves need to take a more assertive role in the preparation of the labour force they require. Businesses have the best information about what skills their employees will need, so it makes sense for them to participate in training prospective employees. First, they need to communicate better with schools and universities about the skills they require. Second, they should establish relationships with future employees earlier, perhaps through partnership schemes that begin training future employees while they are still students. Finally, businesses may need to develop and provide their own in-house training.\nTechnical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.\nThe skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them.","screens":["## THE SKILLS GAP\n1 All over the world, business leaders and government officials complain about the ‘skills gap’. Businesses have plenty of job openings, but they cannot find enough qualified applicants to fill the positions because workers’ skills do not match those needed by employers. Figure 1 shows the results of an annual survey of about 39,000 companies worldwide.","2 For the most part, the employees that employers in western countries are seeking fall into two categories. The first category includes professionals in STEM fields (Science/Technology/Engineering/Mathematics) that require advanced training and expertise, especially in Information Technology (IT). The second category is much larger, comprising workers in the ‘skilled trades’. Workers in the skilled trades have expertise in, for example, manufacturing, computers, electronics and construction. There are simply not enough workers with training in these areas to meet the growing demand. These jobs require more than a secondary education ly, businesses may need to develop and provide their own in-house training.","Technical skills, particularly computer science skills, are in high demand, but developing these skills is not necessarily best accomplished by means of a traditional university education. There are a wide range of schools, courses and training schemes that have opened in response to the demand for computer science professionals, some in brick-and-mortar classrooms and others online – technical colleges for the digital age. The top computer science schools are expensive, but some boast a 99% placement rate for their graduates, many of whom find positions that pay $100,000 a year or more. The first column in Figure 2 displays the number of new computing jobs compared to the number of recent graduates in that field.\nFigure 2.","The skills gap is both persistent and expensive. One business expert estimates that a company loses $14,000 when a position remains open for three months. The skills gap is the result of many factors, and there is no single solution to the problems it poses. It is likely that a combination of approaches will be needed before the supply of qualified workers will be able to meet demand for them."],"sources":[{"page":140,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0d9bfd7ccecb120f1d0e0d1b7a58fbc9146a95ad8ffe9659e0bf3222d5108d80.png","width":772,"height":1040},{"page":141,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8fcdadc8449a936d83992be370057598dd811ff2a6890d7dd2dcd6e3b3ef029.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2911d636159ca18d6ea3fca69f52cbbd3834165342f0ea5a3490b3aaecadd751.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"To: Maxine Warofsky, CEO, Tartine\nPublishing Company\nDear Ms Warofsky,\nI am currently a university student and I\nhave recently learned about the skills gap\nthat exists in many fields. As you know, this\nproblem occurs when companies have a\nlot of job openings but not enough skilled\ncandidates to fill them.\nI would like to suggest a way that you\nmight resolve this problem. I researched\nyour company and found that you do not\noffer an internship for secondary-school\nor university students. You could offer an\ninternship with the understanding that, if\nappropriate, the intern would ultimately\nbe offered a job at your company. In my\nopinion, this would be very helpful in\nmaking sure the people you hire are perfect\nfor the job.\nPerhaps you could start this process by\nvisiting various secondary schools and\nuniversities and identifying potential\nfuture employees. While these students\nare still attending school, you could begin\nguiding and mentoring them towards a\ncareer with your company. That might\ninvolve, for example, informing them of\ndifferent classes they might take that would\nhelp fulfil the needs of your business. At\nthe same time, they could work at your\ncompany for a couple days per month\nas interns. When they graduate and are\nready to begin working, they would be well\nprepared and you could officially hire them.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c ime and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education\n2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.\n3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees\n4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.\n5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","screens":["What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide high ":"b","prompt":"is worth the investment.","options":[],"type":"choice/open"}]],"courseMaterials":[{"id":"B05-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education\n2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.\n3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees\n4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.\n5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","screens":["What is the value of a university education?\n1 A university education is a sign ers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed."],"sources":[{"page":145,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2da7d2b30c7cde83fa07903fb9d39675cd847d927bdc09335c30578d5606f584.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a9ae8826e80a1b5c9e99808b717e9331f4ae7235655fcfb8e99ff68cc56156b.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 People who have higher levels of\neducation have more experience with\ndoing research. As a result, they may\nresearch how to live the healthiest lives\nthey possibly can. Because they have\nthat knowledge, they will make better\nchoices and live healthier lifestyles.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8737","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":27,"module":"READING 2","ex":"8","context":{"moduleLabel":"READING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner or in small groups. Use ideas from Reading 1 and Reading 2 to answer the following questions.","pages":[146],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/49d74732fbae54e45518303394a6d297ba84e930c4b09cb7dea034bdf42c221b.png"],"provided":"1 Other than those already mentioned, which career fields do you think will experience a skills gap in the future? Explain your answer.\n2 Do you think encouraging students to get a university degree will help close the skills gap? Why / Why not?","items":[{"id":"b8737.i01","label":"1","prompt":"Other than those already mentioned, which career fields do you think will experience a skills gap in the future? Explain your answer.","options":[],"type":"discuss/open"},{"id":"b8737.i02","label":"2","prompt":"Do you think encouraging students to get a university degree will help close the skills gap? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Other than those already mentioned, which career fields do you think will experience a skills gap in the future? Explain your answer."},{"kind":"text","text":"2 Do you think encouraging students to get a university degree will help close the skills gap? Why / Why not?"}]],"courseMaterials":[{"id":"B05-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education\n2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.\n3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees\n4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.\n5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed.","screens":["What is the value of a university education?\n1 A university education is a significant investment, so it makes sense to consider carefully whether it is worth the time and money. In good economic times and bad, and in spite of its rising cost, the answer is 'yes'. According to UNESCO, around the world the number of people getting a university education is rising steadily (see Figure 1).\nFigure 1. Worldwide higher education enrolment by global region, actual from 2000 to 2015 and projected to 2040. Source: Calderon, UNESCO\n## The impact of a university education","2 A university education has a broad and positive impact. People with a degree are by far the most likely to enter and remain in the labour force. In OECD countries, average participation in the labour force for those without secondary school qualifications is about 60%. For those with secondary school qualifications, the figure is close to 80%, and for graduates, it is about 87%. Graduates also earn more than those with only secondary school qualifications. In the United States, individuals leaving education with only secondary school qualifications earned on average $30,000 per year in 2022, whereas those with a degree made about $52,000. Over a lifetime, that difference adds up\nDollars\nFigure 2. Median annual earnings of full-time, year-round workers ages 25–34, by educational attainment: 2021\nSource: U.S. Department of Commerce\nFigure 2 provides a dramatic illustration of the impact of a degree on income in the United States.","3 The consequences of getting – or not getting – a university education extend beyond income. There is a strong association between education and health. Chronic diseases, such as heart disease and diabetes, pose the greatest threats to public health in developed countries today. These diseases are caused, at least partly, by lifestyle choices, such as poor diet or smoking. In general, people with higher levels of education make healthier lifestyle choices and have greater access to high-quality healthcare.\n## Income variance between degrees","4 It is evident that a university degree provides an economic advantage, but not all degrees have the same earning power. Most analyses suggest that degrees in STEM fields (Science, Technology, Engineering and Math) have the greatest potential impact on future income. In the United States, a graduate with, for example, a Chemical Engineering degree can expect to earn over $100,000 annually, whereas a graduate with a Literature or Art degree may be lucky to get $56,000 for an entry-level position. Marc Andreessen, the founder of the internet company Netscape, once declared that somebody who studies a non-technical field like literature will probably end up ‘working in a shoe store’.","5 Yet, technical knowledge alone may not be sufficient for success. Steve Jobs, one of the founders of Apple, famously asserted that it was technology married with the arts '... that yields the results that make our hearts sing'. Other major employers in the technology field agree. Industry leaders say employees from arts backgrounds are good at managing ambiguity, unlike engineers, who tend to see situations in black and white. Arts graduates can see a problem from multiple perspectives. It is interesting to note that the income disparity between arts and STEM graduates gradually diminishes as they continue in their careers. In fact, arts degrees are quite common among the world's most highly paid workers. About one-third of the directors of Fortune 500 companies' have an arts background. Students, parents, politicians and industry leaders may argue over which are the most valuable degrees, but the value of a university degree in general cannot be disputed."],"sources":[{"page":145,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2da7d2b30c7cde83fa07903fb9d39675cd847d927bdc09335c30578d5606f584.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a9ae8826e80a1b5c9e99808b717e9331f4ae7235655fcfb8e99ff68cc56156b.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 The constant advances in technology,\ncombined with the fact that many jobs\nrequire technological knowledge, means\nthat many career fields will experience\na skills gap in the future. Examples\nof those fields include healthcare,\neducation and manufacturing.\n2 I think encouraging students to get a\nuniversity degree will help with closing\nthe skills gap somewhat; however, much\nmore is needed beyond that. Students\nneed not only to obtain degrees but\nto obtain them in the industries where\nthere are skills gaps. They need to be\nguided in the right direction toward\nstudying in fields, such as the STEM\nfields, where the skills gap is the widest.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8750","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":28,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Read the information about an annual 100 Best Jobs report and look at the pie chart below. Complete the tasks.","pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bf48ed0fdf1ce2411c65b847b39104d22afa37e3ffc6531b38e6bf00d1d146f2.png"],"provided":"Figure 5 shows how the author of the report measured job quality.\nFigure 5. What factors contribute to job satisfaction?\n*based on interviews with current job holders","items":[{"id":"b8750.i01","label":"1","prompt":"Suggest why the author chose a pie chart to display this information.","options":[],"type":"qa/open"},{"id":"b8750.i02","label":"2","prompt":"Explain the meaning of each section of the pie chart in your own words.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Figure 5 shows how the author of the report measured job quality."},{"kind":"text","text":"Figure 5. What factors contribute to job satisfaction?"},{"kind":"text","text":"*based on interviews with current job holders"},{"kind":"item","id":"b8750.i01","label":"1","prompt":"Suggest why the author chose a pie chart to display this information.","options":[],"type":"qa/open"},{"kind":"item","id":"b8750.i02","label":"2","prompt":"Explain the meaning of each section of the pie chart in your own words.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Because the diagram needs to show\nhow different aspects of the measure\ncompare to one another.\n2 A supportive work environment is a\nworkplace where employees feel valued\nand encouraged, with access to help\nwhen needed.\nOpen and honest management is when\nleaders communicate transparently\nand share important information\nwith employees.\nA good work–life balance means\nensuring employees have enough\ntime for personal life alongside\nwork responsibilities.\nA competitive salary means offering pay\nthat matches or exceeds the industry\nstandard for similar roles.\nFlexible working arrangements allow\nemployees to adjust their work hours or\nlocation to suit their personal needs.\nTraining and personal development\nopportunities means providing chances\nfor employees to learn new skills and\nimprove their abilities.\nOpportunities for career progression\ncreate paths for employees to advance\nto higher positions within the company.\nJob security means that employees feel\nconfident they will keep their jobs without\nrisk of being fired or made redundant.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[{"page":148,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bf48ed0fdf1ce2411c65b847b39104d22afa37e3ffc6531b38e6bf00d1d146f2.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U06-question:b8751","book":5,"unit":6,"track":"RW","topic":"CAREERS","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Complete the tasks.","pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38c4bb304e556401372f8f2ded618aec58a26f0cd18333b3960d59e5e37072be.png"],"provided":"Figure 1. The 100 best jobs in the US, with median salary\n\u003ctable>\u003ctr>\u003ctd>Rank\u003c/td>\u003ctd>Job Title\u003c/td>\u003ctd>Median salary in USD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>cardiologist\u003c/td>\u003ctd>375,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Airline pilot\u003c/td>\u003ctd>225,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>lawyer\u003c/td>\u003ctd>195,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>information systems manager\u003c/td>\u003ctd>180,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>17\u003c/td>\u003ctd>nurse\u003c/td>\u003ctd>130,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25\u003c/td>\u003ctd>Air traffic controller\u003c/td>\u003ctd>139,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>38\u003c/td>\u003ctd>Veterinary technician\u003c/td>\u003ctd>38,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>sports coach\u003c/td>\u003ctd>45,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>57\u003c/td>\u003ctd>marketing specialist\u003c/td>\u003ctd>62,800\u003c/td>\u003c/tr>\u003ctr>\u003ctd>64\u003c/td>\u003ctd>pharmacist\u003c/td>\u003ctd>131,650\u003c/td>\u003c/tr>\u003ctr>\u003ctd>80\u003c/td>\u003ctd>technical writer\u003c/td>\u003ctd>79,360\u003c/td>\u003c/tr>\u003ctr>\u003ctd>85\u003c/td>\u003ctd>Civil engineer\u003c/td>\u003ctd>88,450\u003c/td>\u003c/tr>\u003ctr>\u003ctd>96\u003c/td>\u003ctd>cartographer\u003c/td>\u003ctd>71,230\u003c/td>\u003c/tr>\u003ctr>\u003ctd>98\u003c/td>\u003ctd>architect\u003c/td>\u003ctd>81,230\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b8751.i01","label":"1","prompt":"Look at Figure 1 below. Based on what you have learned in this unit, explain the wide range of median salaries for the jobs in the table. Which information surprises you most?","options":[],"type":"discuss/open"},{"id":"b8751.i02","label":"2","prompt":"The highest-ranked job is also the highest paid, but this relationship is not consistent throughout the list. Explain what other components in the measure could be responsible for the ranking, with reference to two examples.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Figure 1. The 100 best jobs in the US, with median salary"}],[{"kind":"table","rows":[[{"text":"Rank","header":false,"colspan":1,"rowspan":1},{"t
