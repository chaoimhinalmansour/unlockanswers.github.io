ersuasive essay."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about government grants for energy-efficient homes."},{"label":"Reading skill","text":"Skim a text."},{"label":"Critical thinking","text":"Create a persuasive argument."},{"label":"Grammar","text":"Use correct register in academic writing."},{"label":"Academic writing skill","text":"Order information; prioritize arguments."}],"photo":{"box":[965,500,2071,3553],"nativeWidth":3040,"sourcePage":102,"alt":""}}]}},{"id":"B04-RW-U05-classroom:resource:b6973","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/058ee8ffee80687ea931ac2980ca29cdcb420e8f9ffbd146f86cb8c6c0396b41.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"insulation","pos":"(n)","definition":"covering that prevents heat, sound, or electricity from escaping","example":"We added insulation to keep the house warmer.","wordAudio":"insulation","cardWord":false},{"term":"intense lobbying","pos":"(n phr)","definition":"a powerful effort to convince the government to do something","example":"The decision followed intense lobbying by several industry groups.","wordAudio":"intense lobbying","cardWord":false},{"term":"be a rarity","pos":"(v)","definition":"to be very unusual","example":"Seeing ice on the lake in summer would be a rarity.","wordAudio":"be a rarity","cardWord":false},{"term":"the norm","pos":"(n)","definition":"the usual way that things happen","example":"Online booking has become the norm at this theatre.","wordAudio":"the norm","cardWord":false},{"term":"scrap","pos":"(v)","definition":"to not continue with a plan","example":"The council decided to scrap its plan for a new car park.","wordAudio":"scrap","cardWord":false},{"term":"set something back","pos":"(phr v)","definition":"to delay an event or process","example":"A delay in delivery could set the project back by a week.","wordAudio":"set something back","cardWord":false}]]}},{"id":"B04-RW-U05-classroom:video","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[104],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/058ee8ffee80687ea931ac2980ca29cdcb420e8f9ffbd146f86cb8c6c0396b41.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/6f3016685f50781abdb2098a-L4RW-U05.mp4","captions":[{"start":1.32,"end":3.96,"text":"Britain's got some of the chilliest buildings in\nEurope."},{"start":4.54,"end":9.78,"text":"One pound in every four we spend on heating is wasted\ndue to things like poor insulation."},{"start":10.8,"end":18.92,"text":"Today the government announced it would extend grants\nfor insulation work like this for warmer, cheaper\nhousing for people who can least afford it."},{"start":19.42,"end":27.76,"text":"Emissions from homes have started to go up now and\nthat's a huge problem given the scale of the challenge\nto reduce our emissions by 80 % by 2050."},{"start":28.64,"end":33.14,"text":"So at the current rate of improving the energy\nefficiency of our homes,"},{"start":33.48,"end":37.66,"text":"we've calculated it will take us over 100 years to cut\nemissions from our homes."},{"start":38.3,"end":44.92,"text":"So this is the sort of thing campaigners welcome but\nworry whether the government will deliver on with good\nreason."},{"start":46.4,"end":50,"text":"Cygnus Homes in Cambridgeshire build to the passive\nhouse standard,"},{"start":50.5,"end":55.82,"text":"engineered and insulated in such a way that just by\nliving in the house it achieves a comfortable\ntemperature,"},{"start":56.2,"end":57.74,"text":"no extra heating required."},{"start":58.16,"end":66.52,"text":"The energy bill for this house is about 75 % less than\nthe national average and it can be built in less time\nby fewer workers than a traditional home."},{"start":67.06,"end":75.03999999999999,"text":"It shows that the construction industry can deliver the\nlow carbon houses that Britain desperately needs in\nvery little time."},{"start":75.34,"end":76.94,"text":"So why aren't we building them?"},{"start":77.28,"end":84.98,"text":"Well because a couple of years ago in response to\nintense lobbying the government dropped something\ncalled the zero carbon homes standard."},{"start":85.92,"end":86.52,"text":"As a result,"},{"start":86.94,"end":92.84,"text":"housing developments of very efficient new homes like\nthis one in Essex are the rarity rather than the norm,"},{"start":93.32,"end":99.92,"text":"even though innovative architects and developers say\nthey can deliver them at a similar cost to more\nwasteful traditional homes."},{"start":100.2,"end":104.24000000000001,"text":"So the decision to scrap the zero carbon homes target,\ndid that set everyone back?"},{"start":105.08,"end":105.5,"text":"Undoubtedly,"},{"start":105.94,"end":106.28,"text":"yeah."},{"start":107.14,"end":111.97999999999999,"text":"The industry had a clear target which was meant to be\nzero carbon homes at 2016."},{"start":112.53999999999999,"end":115.24000000000001,"text":"That was scrapped and then there was a lot of\nconfusion."},{"start":115.44,"end":116.66,"text":"There still is a lot of confusion."},{"start":117.28,"end":118.84,"text":"And now there's an opportunity to put that back though,\nright?"},{"start":119.03999999999999,"end":120.78,"text":"Yeah, we need a clear target,"},{"start":121.7,"end":128.38,"text":"simple policy to set house builders and developers a\nstandard for zero carbon homes or low carbon homes,"},{"start":128.86,"end":130.14,"text":"whatever it just needs to be a standard."},{"start":130.38,"end":133.58,"text":"And you're saying something like this shows that it can\nbe done, it's within our grasp, it's not impossible."},{"start":133.58,"end":134.18,"text":"Exactly."},{"start":135.22,"end":140.1,"text":"Today's strategy includes most of the things needed to\ndeliver a truly greener economy."},{"start":140.66,"end":141.64,"text":"But say critics,"},{"start":142.1,"end":149.7,"text":"this government mustn't repeat the mistakes of others\nby giving up on green measures that long term benefit\nconsumers and the environment."}],"launchInline":true}},{"id":"B04-RW-U05-classroom:resource:b6983","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":1,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1aaee70440030c4d7e8990e66cf763aec6f0b2b607527e298a31a131db77d2aa.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["conservation (n) durable (adj) efficiency (n) compromise (n) relevant (adj) second-hand (adj) sector (n)"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-RW-U05-classroom:material:RW-M03","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[108],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90473c88e4b686bcb7c39dbc791c20f60df5d481be145ac97ff335cbd28a9860.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.","sourcePage":108},{"body":"2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.","sourcePage":108},{"body":"3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.","sourcePage":108},{"body":"4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in and has a low impact on the environment. Solar panels provide electricity for lighting and electrical equipment. Water is supplied directly from a nearby river and is also collected from the roof for use in the garden, avoiding the need to waste clean water. Low-impact houses like this one are green because they use second-hand materials and do not rely on fossil fuels, but instead use renewable energy sources such as solar or wind power.","sourcePage":108},{"body":"5 Critics of these kinds of eco-buildings say that while they may be good for the environment, there are practical problems with their affordability. They are often too costly to become a large-volume method of construction. There are further concerns over their long-term efficiency. Not much energy can be realistically generated by solar panels in places which do not have large amounts of sunlight, and not every location has access to a natural water source. However, overall, green buildings are worth it. Yet, in order to finance environmentally friendly construction and produce an affordable building, compromises have to be made. These may be that the building will have to be smaller or made of less durable materials and with technology which uses more energy. Perhaps these compromises are easier to make for schools, where ideas about conservation are useful for education, or for businesses where ecologically aware features are a useful marketing tool, rather than for private homes.","sourcePage":108},{"body":"6 The argument for constructing green buildings is clear. According to the United Nations, material resource use in the construction sector is expected to reach nearly 90 billion tonnes very soon, and may more than double by 2050. Without greater resource efficiency, sustainable development goals will not be reached. We need to be wise about how we use these resources for the good of the planet. However, it remains to be seen whether we are able to accept the financial and practical compromises of producing and living in environmentally friendly buildings.","sourcePage":108}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U05-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"We need more green buildings","pages":[{"page":108,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90473c88e4b686bcb7c39dbc791c20f60df5d481be145ac97ff335cbd28a9860.png","width":3040,"height":4096}],"source":108,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.","sourcePage":108},{"body":"2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.","sourcePage":108},{"body":"3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.","sourcePage":108},{"body":"4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in and has a low impact on the environment. Solar panels provide electricity for lighting and electrical equipment. Water is supplied directly from a nearby river and is also collected from the roof for use in the garden, avoiding the need to waste clean water. Low-impact houses like this one are green because they use second-hand materials and do not rely on fossil fuels, but instead use renewable energy sources such as solar or wind power.","sourcePage":108},{"body":"5 Critics of these kinds of eco-buildings say that while they may be good for the environment, there are practical problems with their affordability. They are often too costly to become a large-volume method of construction. There are further concerns over their long-term efficiency. Not much energy can be realistically generated by solar panels in places which do not have large amounts of sunlight, and not every location has access to a natural water source. However, overall, green buildings are worth it. Yet, in order to finance environmentally friendly construction and produce an affordable building, compromises have to be made. These may be that the building will have to be smaller or made of less durable materials and with technology which uses more energy. Perhaps these compromises are easier to make for schools, where ideas about conservation are useful for education, or for businesses where ecologically aware features are a useful marketing tool, rather than for private homes.","sourcePage":108},{"body":"6 The argument for constructing green buildings is clear. According to the United Nations, material resource use in the construction sector is expected to reach nearly 90 billion tonnes very soon, and may more than double by 2050. Without greater resource efficiency, sustainable development goals will not be reached. We need to be wise about how we use these resources for the good of the planet. However, it remains to be seen whether we are able to accept the financial and practical compromises of producing and living in environmentally friendly buildings.","sourcePage":108}],"text":"## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.\n2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.\n3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.\n4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in and has a low impact on the environment. Solar panels provide electricity for lighting and electrical equipment. Water is supplied directly from a nearby river and is also collected from the roof for use in the garden, avoiding the need to waste clean water. Low-impact houses like this one are green because they use second-hand materials and do not rely on fossil fuels, but instead use renewable energy sources such as solar or wind power.\n5 Critics of these kinds of eco-buildings say that while they may be good for the environment, there are practical problems with their affordability. They are often too costly to become a large-volume method of construction. There are further concerns over their long-term efficiency. Not much energy can be realistically generated by solar panels in places which do not have large amounts of sunlight, and not every location has access to a natural water source. However, overall, green buildings are worth it. Yet, in order to finance environmentally friendly construction and produce an affordable building, compromises have to be made. These may be that the building will have to be smaller or made of less durable materials and with technology which uses more energy. Perhaps these compromises are easier to make for schools, where ideas about conservation are useful for education, or for businesses where ecologically aware features are a useful marketing tool, rather than for private homes.\n6 The argument for constructing green buildings is clear. According to the United Nations, material resource use in the construction sector is expected to reach nearly 90 billion tonnes very soon, and may more than double by 2050. Without greater resource efficiency, sustainable development goals will not be reached. We need to be wise about how we use these resources for the good of the planet. However, it remains to be seen whether we are able to accept the financial and practical compromises of producing and living in environmentally friendly buildings.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a083e90c56ab75c59660e4590cbe07e798eed4b4eb0576f367db3c7197657f6.mp3"},"original":{"id":"B04-RW-U05-material:RW-M03","entry":"material:RW-M03","unitId":"B04-RW-U05","book":4,"track":"RW","unit":5,"title":"READING 1","kind":"material","pages":[108],"sourceImages":[{"page":108,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/90473c88e4b686bcb7c39dbc791c20f60df5d481be145ac97ff335cbd28a9860.png","viewEvidenceReported":true}],"text":"## We need more green buildings\n\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.\n\n2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.\n\n3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.\n\n4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in and has a low impact on the environment. Solar panels provide electricity for lighting and electrical equipment. Water is supplied directly from a nearby river and is also collected from the roof for use in the garden, avoiding the need to waste clean water. Low-impact houses like this one are green because they use second-hand materials and do not rely on fossil fuels, but instead use renewable energy sources such as solar or wind power.\n\n5 Critics of these kinds of eco-buildings say that while they may be good for the environment, there are practical problems with their affordability. They are often too costly to become a large-volume method of construction. There are further concerns over their long-term efficiency. Not much energy can be realistically generated by solar panels in places which do not have large amounts of sunlight, and not every location has access to a natural water source. However, overall, green buildings are worth it. Yet, in order to finance environmentally friendly construction and produce an affordable building, compromises have to be made. These may be that the building will have to be smaller or made of less durable materials and with technology which uses more energy. Perhaps these compromises are easier to make for schools, where ideas about conservation are useful for education, or for businesses where ecologically aware features are a useful marketing tool, rather than for private homes.\n\n6 The argument for constructing green buildings is clear. According to the United Nations, material resource use in the construction sector is expected to reach nearly 90 billion tonnes very soon, and may more than double by 2050. Without greater resource efficiency, sustainable development goals will not be reached. We need to be wise about how we use these resources for the good of the planet. However, it remains to be seen whether we are able to accept the financial and practical compromises of producing and living in environmentally friendly buildings.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b6990"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a083e90c56ab75c59660e4590cbe07e798eed4b4eb0576f367db3c7197657f6.mp3","continueOnPage":true}},{"id":"B04-RW-U05-classroom:material:RW-M04","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[111],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.","sourcePage":111},{"body":"2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.","sourcePage":111},{"body":"3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.","sourcePage":111},{"body":"4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","sourcePage":111},{"body":"5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","sourcePage":111}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B04-RW-U05-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","width":3040,"height":4096}],"source":111,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.","sourcePage":111},{"body":"2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.","sourcePage":111},{"body":"3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.","sourcePage":111},{"body":"4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","sourcePage":111},{"body":"5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","sourcePage":111}],"text":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.\n2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.\n3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.\n4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.\n5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c90703dd1b00ce8aa79ccd7f4aa584de90cdeddb7d7fbc778c9e68423e8658e.mp3"},"original":{"id":"B04-RW-U05-material:RW-M04","entry":"material:RW-M04","unitId":"B04-RW-U05","book":4,"track":"RW","unit":5,"title":"READING 2","kind":"material","pages":[111],"sourceImages":[{"page":111,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","viewEvidenceReported":true}],"text":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.\n\n2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.\n\n3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.\n\n4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.\n\n5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b7003"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c90703dd1b00ce8aa79ccd7f4aa584de90cdeddb7d7fbc778c9e68423e8658e.mp3","continueOnPage":true}},{"id":"B04-RW-U05-classroom:review-1","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4c31155398b764e255f6f141212623456c976932f6768de3dec0a968d4087670.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B04-RW-U05-B-001","form":"amenities","page":123},{"id":"B04-RW-U05-B-002","form":"architectural","page":123},{"id":"B04-RW-U05-B-003","form":"architecturally","page":123},{"id":"B04-RW-U05-B-004","form":"architecture","page":123},{"id":"B04-RW-U05-B-006","form":"compromise","page":123},{"id":"B04-RW-U05-B-007","form":"conservation","page":123},{"id":"B04-RW-U05-B-009","form":"depress","page":123},{"id":"B04-RW-U05-B-010","form":"depressing","page":123},{"id":"B04-RW-U05-B-011","form":"depressingly","page":123},{"id":"B04-RW-U05-B-012","form":"depression","page":123},{"id":"B04-RW-U05-B-013","form":"durable","page":123},{"id":"B04-RW-U05-B-014","form":"efficiency","page":123},{"id":"B04-RW-U05-B-015","form":"efficient","page":123},{"id":"B04-RW-U05-B-016","form":"environmental","page":123}],[{"id":"B04-RW-U05-B-017","form":"environmentally","page":123},{"id":"B04-RW-U05-B-018","form":"function","page":123},{"id":"B04-RW-U05-B-019","form":"green belt","page":123},{"id":"B04-RW-U05-B-020","form":"iconic","page":123},{"id":"B04-RW-U05-B-022","form":"outskirts","page":1 tect's work inspiring.","mark":"inspiring","clip":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/475e9096ac2e10be36268a2bfaf50b07b9f809f9cc2fe222db32e067f80f3f2f.mp3"},"B04-RW-U05-W-fffdc1089":{"example":"A welcoming public square can reflect well on the city.","mark":"reflect well on","clip":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/04c36ac8d10b8dd5ab6b06c4085fb0b42efaee515b326986b7039e8f7b613994.mp3"}},{},{},{},{},{},{},{},{},{},{},{"B01-LS-U05-question:b1192":{"rows":{"b1192.i01":{"mode":"choice","option":2},"b1192.i02":{"mode":"choice","option":3},"b1192.i03":{"mode":"choice","option":1},"b1192.i04":{"mode":"choice","option":0}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B04-RW-U05-question:b6987":{"rows":{"b6987.i01":{"mode":"choice","option":3}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B02-RW-U05-question:b3751":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"It is easy to get to my house. First, walk (1) __ the High Street. Go (2) __ the bank and (3) __ the bridge. Then walk (4) __ the park and (5) __ the next bridge. Go (6) __ the tunnel – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B04-RW-U05-question:b6977":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"(1) __ of the money that people in Britain spend on heating is wasted because their homes do not have enough (2) __. The government wants to change that, aiming for an 80% (3) __ in emissions. Builders already know how to build (4) __ homes. They can build homes that maintain a comfortable (5) __ without using much energy. Nevertheless, the emissions rate in Britain is (6) __. Earlier, there was a (7) __ standard for building homes, but after an intense lobbying effort, it was (8) __. Today, with no clear standard, builders are (9) __ about what kind of homes they should build.","values":["Twenty-five percent / A quarter","insulation","reduction/decrease","energy-efficient / zero carbon","temperature","rising/increasing","‘zero-carbon home standard’","scrapped/dropped","confused/uncertain"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B04-RW-U05-question:b7036":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"textFills":[{"part":0,"block":2,"values":["In spite of this","this profession / it"],"text":"(1)__, many people choose to go into (2)__. While some subjects are more quantitative, such as engineering, and others are more creative, such as art, architecture involves both."},{"part":0,"block":3,"values":["This combination","it / this profession","For this reason"],"text":"(3)__ may be what attracts people to (4)__ as a career. Architects are in charge of creating the designs of all of the buildings we see every day. (5)__, they play an important role in our communities."}],"tableEdits":[]},"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B04-RW-U05-classroom:material:RW-M03":[{"body":"## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher","sourcePage":108,"blocks":[{"kind":"text","text":"## We need more green buildings"},{"kind":"text","text":"In recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher"}]},{"body":"construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.","sourcePage":108,"blocks":[{"kind":"text","text":"construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear."}]},{"body":"2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity","sourcePage":108,"blocks":[{"kind":"text","text":"2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity"}]},{"body":"produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.","sourcePage":108,"blocks":[{"kind":"text","text":"produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children."}]},{"body":"3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor env 03":{"mode":"choice","option":3},"b3721.i04":{"mode":"choice","option":0},"b3721.i05":{"mode":"choice","option":2}},"basis":"教材第 109 页与教师书 PDF 第 47 页。将阅读五段与 a 至 e 的运动名称核对。","rewriteKey":""},"B02-RW-U05-question:b3725":{"rows":{"b3725.i01":{"mode":"choice","option":0},"b3725.i02":{"mode":"choice","option":1},"b3725.i03":{"mode":"choice","option":1}},"basis":"教材第 110 页与教师书 PDF 第 47 页。按阅读对象、网页来源和文章体裁复核。","rewriteKey":""},"B02-RW-U05-question:b3741":{"rows":{"b3741.i01":{"mode":"choice","option":1},"b3741.i02":{"mode":"choice","option":1},"b3741.i03":{"mode":"choice","option":1},"b3741.i04":{"mode":"choice","option":0}},"basis":"教材第 113 页与教师书 PDF 第 48 页。按 Tough Guy 文章对应条目信息核对。 教材原页 Ex 5 共四项。","rewriteKey":""},"B02-RW-U05-question:b3765":{"rows":{"b3765.i01":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":23}]},"b3765.i02":{"mode":"indexed-mark","parts":[{"start":0,"end":2,"underline":true},{"start":3,"end":8}]},"b3765.i03":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":21}]}},"basis":"教材第 118 页与教师书 PDF 第 50 页。选择完整主语和限定动词。","itemPatches":{"b3765.i01":{"options":[]},"b3765.i02":{"options":[]},"b3765.i03":{"options":[]}},"rewriteKey":""},"B04-RW-U05-question:b7005":{"rows":{},"basis":"实页复验发现同组选项被重复列在每个小题后。按原教材保留题干、编号和字母对应，完整选项通过材料窗调出，原答位揭示配对字母。","displayPages":[[{"id":"b7005.i01","label":"1","prompt":"Beautiful, well-constructed buildings are a symbol of a civilized society. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"b"}},{"id":"b7005.i02","label":"2","prompt":"People say that living or working in an ugly place creates a depressing and uninspiring environment. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"a"}},{"id":"b7005.i03","label":"3","prompt":"Many people believe that architects have a wider responsibility to society than just designing functional buildings. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"e"}},{"id":"b7005.i04","label":"4","prompt":"It seems that even these two celebrated designs have problems with functionality. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"d"}},{"id":"b7005.i05","label":"5","prompt":"Each type of building has a different function, and, therefore, it has a different form. ____","options":[],"type":"choice/closed","kind":"item","answer":{"mode":"gap","answer":"c"}}]],"materials":[{"id":"B04-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.\n2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.\n3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.\n4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.\n5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","screens":["1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.","2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.","3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.","4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","width":3040,"height":4096}],"kind":"reading"},{"id":"B04-RW-U05-question:b7005:review-options","title":"Options","screens":["a Unattractive buildings can make people feel unhappy and bored.","b Attractive, safe buildings represent a cultured society.","c Every construction has a different purpose, and is therefore designed according to different criteria.","d These famous buildings may have won awards, but they still do not always fulfil users' needs.","e People who design buildings have a duty to the general public."],"sources":[]}],"rewriteKey":""},"B04-RW-U05-question:b7032":{"rows":{},"basis":"教材第 117 页与教师书 PDF 第 47 页。按两个原段落中的划线短语逐处显示正式表达。","replaceBlocks":[{"part":0,"block":1,"blocks":[{"kind":"text","text":"Choosing the right place to live can be super difficult!! Living somewhere in the city centre can cost an arm and a leg and it can be really really small. But, the good thing about living in the centre is that you can get to all the nearby places, like shops and restaurants. This means it is probably easier for you to hang out w
