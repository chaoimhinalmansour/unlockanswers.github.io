chilliest buildings in\nEurope."},{"start":4.54,"end":9.78,"text":"One pound in every four we spend on heating is wasted\ndue to things like poor insulation."},{"start":10.8,"end":18.92,"text":"Today the government announced it would extend grants\nfor insulation work like this for warmer, cheaper\nhousing for people who can least afford it."},{"start":19.42,"end":27.76,"text":"Emissions from homes have started to go up now and\nthat's a huge problem given the scale of the challenge\nto reduce our emissions by 80 % by 2050."},{"start":28.64,"end":33.14,"text":"So at the current rate of improving the energy\nefficiency of our homes,"},{"start":33.48,"end":37.66,"text":"we've calculated it will take us over 100 years to cut\nemissions from our homes."},{"start":38.3,"end":44.92,"text":"So this is the sort of thing campaigners welcome but\nworry whether the government will deliver on with good\nreason."},{"start":46.4,"end":50,"text":"Cygnus Homes in Cambridgeshire build to the passive\nhouse standard,"},{"start":50.5,"end":55.82,"text":"engineered and insulated in such a way that just by\nliving in the house it achieves a comfortable\ntemperature,"},{"start":56.2,"end":57.74,"text":"no extra heating required."},{"start":58.16,"end":66.52,"text":"The energy bill for this house is about 75 % less than\nthe national average and it can be built in less time\nby fewer workers than a traditional home."},{"start":67.06,"end":75.03999999999999,"text":"It shows that the construction industry can deliver the\nlow carbon houses that Britain desperately needs in\nvery little time."},{"start":75.34,"end":76.94,"text":"So why aren't we building them?"},{"start":77.28,"end":84.98,"text":"Well because a couple of years ago in response to\nintense lobbying the government dropped something\ncalled the zero carbon homes standard."},{"start":85.92,"end":86.52,"text":"As a result,"},{"start":86.94,"end":92.84,"text":"housing developments of very efficient new homes like\nthis one in Essex are the rarity rather than the norm,"},{"start":93.32,"end":99.92,"text":"even though innovative architects and developers say\nthey can deliver them at a similar cost to more\nwasteful traditional homes."},{"start":100.2,"end":104.24000000000001,"text":"So the decision to scrap the zero carbon homes target,\ndid that set everyone back?"},{"start":105.08,"end":105.5,"text":"Undoubtedly,"},{"start":105.94,"end":106.28,"text":"yeah."},{"start":107.14,"end":111.97999999999999,"text":"The industry had a clear target which was meant to be\nzero carbon homes at 2016."},{"start":112.53999999999999,"end":115.24000000000001,"text":"That was scrapped and then there was a lot of\nconfusion."},{"start":115.44,"end":116.66,"text":"There still is a lot of confusion."},{"start":117.28,"end":118.84,"text":"And now there's an opportunity to put that back though,\nright?"},{"start":119.03999999999999,"end":120.78,"text":"Yeah, we need a clear target,"},{"start":121.7,"end":128.38,"text":"simple policy to set house builders and developers a\nstandard for zero carbon homes or low carbon homes,"},{"start":128.86,"end":130.14,"text":"whatever it just needs to be a standard."},{"start":130.38,"end":133.58,"text":"And you're saying something like this shows that it can\nbe done, it's within our grasp, it's not impossible."},{"start":133.58,"end":134.18,"text":"Exactly."},{"start":135.22,"end":140.1,"text":"Today's strategy includes most of the things needed to\ndeliver a truly greener economy."},{"start":140.66,"end":141.64,"text":"But say critics,"},{"start":142.1,"end":149.7,"text":"this government mustn't repeat the mistakes of others\nby giving up on green measures that long term benefit\nconsumers and the environment."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 T 2 T 3 F; Builders already know how to construct\nenergy-efficient homes. 4 T","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097  roof ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":1}},{"kind":"item","id":"b6992.i02","label":"2","prompt":"a local water source ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":1}},{"kind":"item","id":"b6992.i03","label":"3","prompt":"recycled cans and bottles ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":0}}],[{"kind":"item","id":"b6992.i04","label":"4","prompt":"gas heating ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":2}},{"kind":"item","id":"b6992.i05","label":"5","prompt":"a wooden construction ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":1}},{"kind":"item","id":"b6992.i06","label":"6","prompt":"straw walls ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"6","mode":"choice","option":1}}],[{"kind":"item","id":"b6992.i07","label":"7","prompt":"recycled tyres ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"7","mode":"choice","option":0}},{"kind":"item","id":"b6992.i08","label":"8","prompt":"natural insulation ____","options":["RC","HH","N"],"type":"choice/closed","answer":{"label":"8","mode":"choice","option":1}}]],"courseMaterials":[{"id":"B04-RW-U05-classroom:material:RW-M03","title":"READING 1","text":"## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.\n2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.\n3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.\n4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in and has a low impact on the environment. Solar panels provide electricity for lighting and electrical equipment. Water is supplied directly from a nearby river and is also collected from the roof for use in the garden, avoiding the need to waste clean water. Low-impact houses like this one are green because they use second-hand materials and do not rely on fossil fuels, but instead use renewable energy sources such as solar or wind power.\n5 Critics of these kinds of eco-buildings say that while they may be good for the environment, there are practical problems with their affordability. They are often too costly to become a large-volume method of construction. There are further concerns over their long-term efficiency. Not much energy can be realistically generated by solar panels in places which do not have large amounts of sunlight, and not every location has access to a natural water source. However, overall, green buildings are worth it. Yet, in order to finance environmentally friendly construction and produce an affordable building, compromises have to be made. These may be that the building will have to be smaller or made of less durable materials and with technology which uses more energy. Perhaps these compromises are easier to make for schools, where ideas about conservation are useful for education, or for businesses where ecologically aware features are a useful marketing tool, rather than for private homes.\n6 The argument for constructing green buildings is clear. According to the United Nations, material resource use in the construction sector is expected to reach nearly 90 billion tonnes very soon, and may more than double by 2050. Without greater resource efficiency, sustainable development goals will not be reached. We need to be wise about how we use these resources for the good of the planet. However, it remains to be seen whether we are able to accept the financial and practical compromises of producing and living in environmentally friendly buildings.","screens":["## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.","2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bo e effective educational aids for the students who attend them?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B04-RW-U05-classroom:material:RW-M03","title":"READING 1","text":"## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.\n2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.\n3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.\n4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in and has a low impact on the environment. Solar panels provide electricity for lighting and electrical equipment. Water is supplied directly from a nearby river and is also collected from the roof for use in the garden, avoiding the need to waste clean water. Low-impact houses like this one are green because they use second-hand materials and do not rely on fossil fuels, but instead use renewable energy sources such as solar or wind power.\n5 Critics of these kinds of eco-buildings say that while they may be good for the environment, there are practical problems with their affordability. They are often too costly to become a large-volume method of construction. There are further concerns over their long-term efficiency. Not much energy can be realistically generated by solar panels in places which do not have large amounts of sunlight, and not every location has access to a natural water source. However, overall, green buildings are worth it. Yet, in order to finance environmentally friendly construction and produce an affordable building, compromises have to be made. These may be that the building will have to be smaller or made of less durable materials and with technology which uses more energy. Perhaps these compromises are easier to make for schools, where ideas about conservation are useful for education, or for businesses where ecologically aware features are a useful marketing tool, rather than for private homes.\n6 The argument for constructing green buildings is clear. According to the United Nations, material resource use in the construction sector is expected to reach nearly 90 billion tonnes very soon, and may more than double by 2050. Without greater resource efficiency, sustainable development goals will not be reached. We need to be wise about how we use these resources for the good of the planet. However, it remains to be seen whether we are able to accept the financial and practical compromises of producing and living in environmentally friendly buildings.","screens":["## We need more green buildings\nIn recent years, there has been a general trend for new buildings to be more environmentally friendly, or more 'green'. Such a building is sometimes called an eco-building. These buildings use energy and water efficiently, which reduces waste and pollution. However, installing features like solar panels and water-recycling systems involves higher construction costs than in a traditional building. Despite these extra costs, green buildings are good for the planet and their benefits are clear.","2 In New Mexico, in the US, there are homes called Earthship houses, constructed from recycled bottles, tyres, aluminium cans and other garbage. Often the cans, bottles and tyres are filled with soil and then the outsides are covered with natural mud. These homes are designed to use solar power – the energy from the sun – rather than electricity produced from fossil fuels'. These recycled-construction designs are just as relevant for other types of buildings. In both Uruguay and Sierra Leone, for example, there are recycled-construction schools for local children.","3 In the UAE, the Zulekha Hospital in Sharjah was the first Middle Eastern building to be awarded 'platinum certification' by the Green Building Council. They received this by meeting various green requirements, including sustainability, water and energy efficiency and indoor environmental quality. The hospital executives researched ways to make the hospital green during the construction phase of the building, and numerous features were put into the design to make it sustainable and show their commitment to the environment.","4 Another example of an eco-building is a private residence in Wales known as the 'Hobbit House'. Its frame is made of wood and the walls are made of straw, which provides excellent insulation. The roof consists of mud planted with grass, which keeps heat in a "instruction":"Read the following sentences and decide whether you agree or disagree with each of these statements. Write your answers and then discuss them with a partner. Remember to give reasons for your answers.","pages":[115],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/92e80b48b7c77fee2835392cc427a34077671c8d7e5b2f5c54c7f7a94c1ca525.png"],"provided":"1 I would love to live or work in a skyscraper.\nI strongly disagree with this statement, I don't think I would like it, as I hate heights. It just wouldn't be my ideal working environment.\n2 Living in the outskirts of a city is far better than living in the very centre.\n3 I would prefer to be an architect rather than a structural engineer.\n4 When choosing an area to live in, the amenities it has are very important.\n5 Having areas known as 'green belts' is a good idea.\n6 There is nothing wrong with urban sprawl, we need the space to build more houses.\n7 Living in the suburbs is better than living in the city centre.","items":[{"id":"b7020.i01","label":"1","prompt":"I would love to live or work in a skyscraper.","options":[],"type":"discuss/open"},{"id":"b7020.i02","label":"2","prompt":"Living in the outskirts of a city is far better than living in the very centre.","options":[],"type":"discuss/open"},{"id":"b7020.i03","label":"3","prompt":"I would prefer to be an architect rather than a structural engineer.","options":[],"type":"discuss/open"},{"id":"b7020.i04","label":"4","prompt":"When choosing an area to live in, the amenities it has are very important.","options":[],"type":"discuss/open"},{"id":"b7020.i05","label":"5","prompt":"Having areas known as 'green belts' is a good idea.","options":[],"type":"discuss/open"},{"id":"b7020.i06","label":"6","prompt":"There is nothing wrong with urban sprawl, we need the space to build more houses.","options":[],"type":"discuss/open"},{"id":"b7020.i07","label":"7","prompt":"Living in the suburbs is better than living in the city centre.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 I would love to live or work in a skyscraper."},{"kind":"text","text":"I strongly disagree with this statement, I don't think I would like it, as I hate heights. It just wouldn't be my ideal working environment."},{"kind":"text","text":"2 Living in the outskirts of a city is far better than living in the very centre."},{"kind":"text","text":"3 I would prefer to be an architect rather than a structural engineer."},{"kind":"text","text":"4 When choosing an area to live in, the amenities it has are very important."},{"kind":"text","text":"5 Having areas known as 'green belts' is a good idea."}],[{"kind":"text","text":"6 There is nothing wrong with urban sprawl, we need the space to build more houses."},{"kind":"text","text":"7 Living in the suburbs is better than living in the city centre."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 I agree with this. You get the benefit of\nbeing close to a city and the amenities\nthere but you also have more space, and\nless noise on the outskirts.\n3 I agree, I would prefer to be an architect\nbecause it feels like a more creative job\nthan a structural engineer.\n4 I strongly agree with this. I don’t want\nto live far away from shops, restaurants,\nmedical centres, cinemas and all the\nother facilities that I use in my life.\n5 I think this is a good idea. It protects\nour natural environment and stops\nurban sprawl.\n6 I agree. City centres can be very busy\nand noisy with lots of traffic. In the\nsuburbs it is more peaceful and the\nhouses are often bigger.\n7 I don’t like living in the suburbs. It\ncan be a bit boring. I prefer the lively\natmosphere of the city centre.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b6999","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":23,"module":"READING 2","ex":"1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"You are going to read an essay on form and function in building design. In pairs discuss the meaning of the words in bold and then answer the questions. Use a dictionary to help you.","pages":[110],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bec4d2af8995a25460969e4458414d73c8be0084b8b609826177bb83f6584614.png"],"provided":"","items":[{"id":"b6999.i01","label":"1","prompt":"Which is more important for a building: its beauty or its function?","options":[],"type":"discuss/open"},{"id":"b6999.i02","label":"2","prompt":"Some people believe that the building you are in can affect your mood. Which environments make you happy and which do you find depressing?","options":[],"type":"discuss/open"},{"id":"b6999.i03","label":"3","prompt":"Have you even seen a building or a piece of architecture which you thought was inspiring?","options":[],"type":"discuss/open"},{"id":"b6999.i04","label":"4","prompt":"Do you think that our homes reflect our personality? In what ways?","options":[],"type":"discuss/open"},{"id":"b6999.i05","label":"5","prompt":"Do you know of any towns or cities which have a reputation for striking architecture?","options":[],"type":"discuss/open"},{"id":"b6999.i06","label":"6","prompt":"Do you think beautiful and well-constructed buildings are a symbol of a civilized society?","options":[],"type":"discuss/open"},{"id":"b6999.i07","label":"7","prompt":"Have you ever visited a place which demonstrates a wide variety of architectural styles?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6999.i01","label":"1","prompt":"Which is more important for a building: its beauty or its function?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6999.i02","label":"2","prompt":"Some people believe that the building you are in can affect your mood. Which environments make you happy and which do you find depressing?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6999.i03","label":"3","prompt":"Have you even seen a building or a piece of architecture which you thought was inspiring?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6999.i04","label":"4","prompt":"Do you think that our homes reflect our personality? In what ways?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6999.i05","label":"5","prompt":"Do you know of any towns or cities which have a reputation for striking architecture?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6999.i06","label":"6","prompt":"Do you think beautiful and well-constructed buildings are a symbol of a civilized society?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b6999.i07","label":"7","prompt":"Have you ever visited a place which demonstrates a wide variety of architectural styles?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Function is the most important thing but\nI don’t want to live in an ugly house.\n2 I like being in places where there are\nopen spaces and trees or plants. I think\nbuildings made with lots of concrete\nare depressing.\n3 There are lots of old castles in my\ncountry and other historic buildings\nwhich I think are inspiring.\n4 People often decorate their homes in\nways which reflect their personality. For\nexample, some people like calm\nspaces and others have very colourful\nbright homes.\n5 I know that Barcelona in Spain is quite\nfamous for its architecture.\n6 I think that all cultures have different\nbuilding styles that reflect something\nabout their history and people.\n7 I have been to London and seen\nsome very historic buildings together\nwith very modern styles but I think this is\ntrue of many cities across the world.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":45,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[{"page":110,"original":"Do you think that way your house looks is more important than how practical it is?","text":"原字面保留；教学问法可使用Do you think the way your house looks...，不把修订句冒充原印句。"},{"page":110}],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7000","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":24,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle tiful or one which is functional?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"The writer thinks that both are equally important.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[{"page":110,"original":"Do you think that way your house looks is more important than how practical it is?","text":"原字面保留；教学问法可使用Do you think the way your house looks...，不把修订句冒充原印句。"},{"page":110}],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7005","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":26,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Match the original sentences (1–5) from the text to the correct paraphrases (a–e).","pages":[112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47f94a12800cb0c52f12c2868ec593508afb9820ff4a1c2e3e81c1ce08409503.png"],"provided":"Original sentences\n1 Beautiful, well-constructed buildings are a symbol of a civilized society.\n2 People say that living or working in an ugly place creates a depressing and uninspiring environment.\n3 Many people believe that architects have a wider responsibility to society than just designing functional buildings.\n4 It seems that even these two celebrated designs have problems with functionality.\n5 Each type of building has a different function, and, therefore, it has a different form.\n\nParaphrases\n____ a Unattractive buildings can make people feel unhappy and bored.\n____ b Attractive, safe buildings represent a cultured society.\n____ c Every construction has a different purpose, and is therefore designed according to different criteria.\n____ d These famous buildings may have won awards, but they still do not always fulfil users' needs.\n____ e People who design buildings have a duty to the general public.","items":[{"id":"b7005.i01","label":"1","prompt":"Beautiful, well-constructed buildings are a symbol of a civilized society.","options":["Unattractive buildings can make people feel unhappy and bored.","Attractive, safe buildings represent a cultured society.","Every construction has a different purpose, and is therefore designed according to different criteria.","These famous buildings may have won awards, but they still do not always fulfil users' needs.","People who design buildings have a duty to the general public."],"type":"choice/closed"},{"id":"b7005.i02","label":"2","prompt":"People say that living or working in an ugly place creates a depressing and uninspiring environment.","options":["Unattractive buildings can make people feel unhappy and bored.","Attractive, safe buildings represent a cultured society.","Every construction has a different purpose, and is therefore designed according to different criteria.","These famous buildings may have won awards, but they still do not always fulfil users' needs.","People who design buildings have a duty to the general public."],"type":"choice/closed"},{"id":"b7005.i03","label":"3","prompt":"Many people believe that architects have a wider responsibility to society than just designing functional buildings.","options":["Unattractive buildings can make people feel unhappy and bored.","Attractive, safe buildings represent a cultured society.","Every construction has a different purpose, and is therefore designed according to different criteria.","These famous buildings may have won awards, but they still do not always fulfil users' needs.","People who design buildings have a duty to the general public."],"type":"choice/closed"},{"id":"b7005.i04","label":"4","prompt":"It seems that even these two celebrated designs have problems with functionality.","options":["Unattractive buildings can make people feel unhappy and bored.","Attractive, safe buildings represent a cultured society.","Every construction has a different purpose, and is therefore designed according to different criteria.","These famous buildings may have won awards, but they still do not always fulfil users' needs.","People who design buildings have a duty to the general public."],"type":"choice/closed"},{"id":"b7005.i05","label":"5","prompt":"Each type of building has a different function, and, therefore, it has a different form.","options":["Unattractive buildings can make people feel unhappy and bored.","Attractive, safe buildings represent a cultured society.","Every construction has a different purpose, and is therefore designed according to different criteria.","These famous buildings may have won awards, but they still do not always fulfil users' needs.","People who design buildings have a duty to the general public."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Beautiful, well-constructed buildings are a symbol of a civilized society."},{"kind":"text","text":"2 People say that living or working in an ugly place creates a depressing and uninspiring environment."},{"kind":"text","text":"3 Many people believe that architects have a wider responsibility to society than just designing functional buildings."},{"kind":"text","text":"4 It seems that even these two celebrated designs have problems with functionality."},{"kind":"text","text":"5 Each type of building has a different function, and, therefore, it has a different form."},{"kind":"text","text":"____ a Unattractive buildings can make people feel unhappy and bored."}],[{"kind":"text","text":"____ b Attractive, safe buildings represent a cultured society."},{"kind":"text","text":"____ c Every construction has a different purpose, and is therefore designed according to different criteria."},{"kind":"text","text":"____ d These famous buildings may have won awards, but they still do not always fulfil users' needs."},{"kind":"text","text":"____ e People who design buildings have a duty to the general public."}]],"courseMaterials":[{"id":"B04-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.\n2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.\n3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.\n4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.\n5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","screens":["1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspirin lass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c90703dd1b00ce8aa79ccd7f4aa584de90cdeddb7d7fbc778c9e68423e8658e.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 b 2 a 3 e 4 d 5 c","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7006","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":27,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay again and then write a summary of each paragraph. To help you do this, underline the key points in each paragraph and then paraphrase the sentences. An example has been done for you:","pages":[112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmanso he building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture.","screens":["1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.","2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.","3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.","4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c90703dd1b00ce8aa79ccd7f4aa584de90cdeddb7d7fbc778c9e68423e8658e.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Paragraph 2 The most important factor\nwhen designing a building is its practical\nuse. You need to think of the needs of\nthose who will be using the building.\nBuildings have different functions and this\naffects their form.\nParagraph 3 The way a building looks\nis also important because it can have an\nimpact on our mood. Attractive buildings\nreflect positively on the owner and on\nsociety as a whole and make people\nhappier. Ugly buildings create negative\nresponses, which can be responsible for a\ndepressing and unproductive environment.\nParagraph 4 Combining form and function\nshould be possible, but sometimes it is\nchallenging. Some things that are beautiful\nare not practical and can cause complaints\nabout their functionality.\nParagraph 5 Focusing on one aspect can\neither make buildings impractical or ugly.\nCombining good form and function makes\ngreat architecture.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7008","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":28,"module":"READING 2","ex":"6","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Work with a partner. Answer the questions.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/907e328b6cbb124063e5697326617a9d025ad5dd9c3d3b256dc7e132a10cdfbc.png"],"provided":"","items":[{"id":"b7008.i01","label":"1","prompt":"How could a well-constructed building reflect well on the reputation of the owner?","options":[],"type":"qa/open"},{"id":"b7008.i02","label":"2","prompt":"Does the author think the way a building looks is more important than its function?","options":[],"type":"qa/open"},{"id":"b7008.i03","label":"3","prompt":"The author describes Farnworth House as 'less is more'. From this description, what do you imagine this building to look like inside?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7008.i01","label":"1","prompt":"How could a well-constructed building reflect well on the reputation of the owner?","options":[],"type":"qa/open"},{"kind":"item","id":"b7008.i02","label":"2","prompt":"Does the author think the way a building looks is more important than its function?","options":[],"type":"qa/open"},{"kind":"item","id":"b7008.i03","label":"3","prompt":"The author describes Farnworth House as 'less is more'. From this description, what do you imagine this building to look like inside?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B04-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.\n2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.\n3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.\n4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.\n5 If architects focus only on function, buildings may be col iring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.","4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c90703dd1b00ce8aa79ccd7f4aa584de90cdeddb7d7fbc778c9e68423e8658e.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 It could have a p eens":["1 At the start of the twentieth century, Louis Sullivan, one of the creators of modern architecture, said that 'form follows function'. The term 'functionalism' is used to describe the idea behind architecture which primarily focuses on the purpose of a building. However, many people disagree with this and feel that beauty is a more important factor in architectural design. In the modern world, it seems that most architects try to combine both ideas, aiming to create buildings which are both functional and inspiring in their beauty.","2 The reason for creating a building in the first place – its use – is clearly very important. When building an airport terminal, for example, you need to think of the needs of passengers as well as planes. Passengers want to get to their plane as quickly as they can, and planes need to be parked in a way which maximizes their ease of use. As such, many airport terminals have a circular shape with satellite areas. Residential homes need to have enough space for a family, art galleries need wall space to show pictures and factories need to produce goods as efficiently as possible. Each type of building has a different function, and, therefore, it has a different form.","3 On the other hand, many people believe that architects have a wider responsibility to society than just designing functional buildings. Beautiful, well-constructed buildings are a symbol of a civilized society and they reflect well on a business or the reputation of the owner. Ugly public buildings, however, can project a negative image of the organization. People say that living or working in an ugly place creates a depressing and uninspiring environment. In contrast, an attractive building can make people feel happier and increase their motivation to work.","4 In theory, there seems to be no reason why architecture cannot be both functional and beautiful. Yet in practice, this can cause problems. The Modern International style of the 1920s and 1930s, an example of which is the Guggenheim Museum in New York, was supposed to combine beauty with function. Many consider the museum's white spiral ramp beautiful, but there have been complaints that it is impractical, as it is difficult to stand back to view the art. Also, the ramp is so narrow that it can become overcrowded. The Farnsworth House by Ludwig Mies van der Rohe is another icon of beautiful design which demonstrates the idea that 'less is more'. However, critics have attacked it for a lack of privacy because of the huge glass windows. It also has a leaky flat roof and has been repeatedly flooded. It seems that even these two celebrated designs have problems with functionality.","5 If architects focus only on function, buildings may be cold, ugly and uninteresting. There is no doubt that a building with a beautiful form is something we can all appreciate. On the other hand, if they focus only on making it look beautiful, the building may be completely impractical. Therefore, blending these two ideas is necessary to create the perfect piece of architecture."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5caeade81da4b151c1f67010b99c9db4b7a9b822e371a38b33de29cfeac19f11.png","width":3040,"height":4096}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c90703dd1b00ce8aa79ccd7f4aa584de90cdeddb7d7fbc778c9e68423e8658e.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"The most interesting building I have visited\nwas Hearst Castle in California. The castle\nwas built as a home in the mid-nineteenth\ncentury by the publishing tycoon William\nRandolph Hearst. The home is now a\nmuseum and open for the public to view.\nI like it because the castle uses many\ndifferent architectural styles, and it is very\ngrand; William Hearst used to entertain\nmany of the Hollywood actors there. For\nthis reason, I think equal attention was paid\nto form and function. Hearst wanted his\nhome to look very impressive, but he also\nwanted his guests to be comfortable.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":46,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7024","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Look at Reading 2 again. Using the information there, plus your own ideas, write down in the T-chart the advantages of focusing on either the beauty or the function of a building.","pages":[116],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44104994b3520f17715d7d1f0c15e260b974c7514a6e14e37eaaa58819ab275a.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>Advantages of focusing on beauty\u003c/td>\u003ctd>Advantages of focusing on function\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Beautiful buildings can put us in a good mood.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tab b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7026","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"In each column, which idea is the most persuasive? Which idea is the least persuasive?","pages":[116],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44104994b3520f17715d7d1f0c15e260b974c7514a6e14e37eaaa58819ab275a.png"],"provided":"","items":[{"id":"b7026.i01","label":"Beauty column","prompt":"In the 'Advantages of focusing on beauty' column, which idea is the most persuasive? Which idea is the least persuasive?","options":[],"type":"qa/open"},{"id":"b7026.i02","label":"Function column","prompt":"In the 'Advantages of focusing on function' column, which idea is the most persuasive? Which idea is the least persuasive?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7026.i01","label":"Beauty column","prompt":"In the 'Advantages of focusing on beauty' column, which idea is the most persuasive? Which idea is the least persuasive?","options":[],"type":"qa/open"},{"kind":"item","id":"b7026.i02","label":"Function column","prompt":"In the 'Advantages of focusing on function' column, which idea is the most persuasive? Which idea is the least persuasive?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I think the idea that beautiful buildings are\na symbol of a civilized society is the least\npersuasive and that they can create a more\npositive and motivated workforce is the\nmost persuasive.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7028","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Now look at the Writing task. With a partner, discuss the advantages of focusing on location and the advantages of focusing on size when planning a new building. Write notes in the T-chart below.","pages":[116],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/44104994b3520f17715d7d1f0c15e260b974c7514a6e14e37eaaa58819ab275a.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>Advantages of focusing on location\u003c/td>\u003ctd>Advantages of focusing on size\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7028.i01","label":"Location column","prompt":"Advantages of focusing on location","options":[],"type":"discuss/open"},{"id":"b7028.i02","label":"Size column","prompt":"Advantages of focusing on size","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Advantages of focusing on location","header":false,"colspan":1,"rowspan":1},{"text":"Advantages of focusing on size","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Advantages of focusing on location:\nA good location ensures easy access for\nanyone using the building.\nBeing close to essential services,\ntransportation, and amenities can reduce\ncosts and increase efficiency.\nA good location can increase the\nproperty’s value over time, making it a\ngood investment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":47,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":9,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7029","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Highlight the ideas in your T-chart that you think are the most persuasive.","pages":[117],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c083abfd87e610f3a999c410c33b7ac953f8d54a9011fcbec50de06a799e94d.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7032","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":35,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Make the text below more formal by replacing the words in bold with the academic words and phrases from the box.","pages":[117],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c083abfd87e610f3a999c410c33b7ac953f8d54a9011fcbec50de06a799e94d.png"],"provided":"challenging in accommodation be very costly local amenities compact. However, advantages of are able to access socialize with friends colleagues alternatively on the outskirts can afford more spacious the disadvantage convenient. In conclusion, your priorities\n\nChoosing the right place to live can be super difficult!! Living somewhere in the city centre can cost an arm and a leg and it can be really really small. But, the good thing about living in the centre is that you can get to all the nearby places, like shops and restaurants. This means it is probably easier for you to hang out with your mates and people you work with.\n\nOn the flip side, if you choose to live out of the centre, you probably have enough money to live in a place which is bigger. The bad thing about this though, is that it may not be easy to get to the things you want easily. At the end of the day, it all depends on what you think is important!","items":[{"id":"b7032.i01","label":"1","prompt":"Choosing the right place to live can be super difficult!!","options":["challenging","in accommodation", e with friends colleagues","alternatively","on the outskirts","can afford more spacious","the disadvantage","convenient","In conclusion, your priorities"],"type":"choice/closed"},{"id":"b7032.i06","label":"6","prompt":"The bad thing about this though, is that it may not be easy to get to the things you want easily.","options":["challenging","in accommodation","be very costly","local amenities","compact","However","advantages of","are able to access","socialize with friends colleagues","alternatively","on the outskirts","can afford more spacious","the disadvantage","convenient","In conclusion, your priorities"],"type":"choice/closed"},{"id":"b7032.i07","label":"7","prompt":"At the end of the day, it all depends on what you think is important!","options":["challenging","in accommodation","be very costly","local amenities","compact","However","advantages of","are able to access","socialize with friends colleagues","alternatively","on the outskirts","can afford more spacious","the disadvantage","convenient","In conclusion, your priorities"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"challenging in accommodation be very costly local amenities compact. However, advantages of are able to access socialize with friends colleagues alternatively on the outskirts can afford more spacious the disadvantage convenient. In conclusion, your priorities"},{"kind":"text","text":"Choosing the right place to live can be super difficult!! Living somewhere in the city centre can cost an arm and a leg and it can be really really small. But, the good thing about living in the centre is that you can get to all the nearby places, like shops and restaurants. This means it is probably easier for you to hang out with your mates and people you work with."},{"kind":"text","text":"On the flip side, if you choose to live out of the centre, you probably have enough money to live in a place which is bigger. The bad thing about this though, is that it may not be easy to get to the things you want easily. At the end of the day, it all depends on what you think is important!"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Choosing the right place to live can be challenging.\nLiving in accommodation in the city centre can be very\ncostly and it can be compact. However, the advantages\nof living in the centre is that you access all the local\namenities. This means it is probably easier for you to\nsocialize with friends and colleagues.\nAlternatively, if you choose to live on the outskirts,\nyou probably can afford to live in a place which is more\nspacious. The disadvantage about this though, is that it\nmay not be convenient.\nIn conclusion, it all depends on your priorities.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":47,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7033","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":36,"module":"GRAMMAR FOR WRITING","ex":"2","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Rewrite the informal sentences below to make them sound more formal. Compare your answers with a partner. Were they similar?","pages":[118],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5f80eff96874dca29c4e16989fb26f9b91011aa2dc0c8ea939dd73ac57d3908c.png"],"provided":"Compare your answers with a partner. Were they similar?","items":[{"id":"b7033.i01","label":"1","prompt":"Doing up the house was a real uphill struggle.","options":[],"type":"gap/open"},{"id":"b7033.i02","label":"2","prompt":"The way the cause this ____ streamlines the design and building process and therefore reduces errors and waste.","options":[],"type":"gap/open"},{"id":"b7037.i05","label":"5","prompt":"Furthermore, ____ is the key focus of smart homes:","options":[],"type":"gap/open"},{"id":"b7037.i06","label":"6","prompt":"____ and systems that enhance convenience.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"efficiency new concepts new technological development our impact on the environment properties equipped with various technologies raw materials"},{"kind":"text","text":"Predicting architectural styles of the future is challenging, however, some trends are indeed emerging. These (1) include: sustainable architecture, 3D technology and smart homes. Housing which considers (2) is high on the agenda, as we are rapidly exhausting the earth's natural resources. These (3) can also be preserved by the development of 3D technology in the construction industry. This is because this (4) streamlines the design and building process and therefore reduces errors and waste. Furthermore, (5) is the key focus of smart homes: (6) and systems that enhance convenience."},{"kind":"item","id":"b7037.i01","label":"1","prompt":"These ____ include: sustainable architecture, 3D technology and smart homes.","options":[],"type":"gap/open","answer":{"label":"1","mode":"gap","answer":"new concepts"}}],[{"kind":"item","id":"b7037.i02","label":"2","prompt":"Housing which considers ____ is high on the agenda, as we are rapidly exhausting the earth's natural resources.","options":[],"type":"gap/open","answer":{"label":"2","mode":"gap","answer":"efficiency"}},{"kind":"item","id":"b7037.i03","label":"3","prompt":"These ____ can also be preserved by the development of 3D technology in the construction industry.","options":[],"type":"gap/open","answer":{"label":"3","mode":"gap","answer":"raw materials"}},{"kind":"item","id":"b7037.i04","label":"4","prom uburbs and the environment is quieter and less congested.","Living in the suburbs is better because you can live more comfortably."],"type":"choice/closed"},{"id":"b7040.i03","label":"3","prompt":"Older architectural styles are more attractive than modern ones.","options":["Older architectural styles are more interesting to look at.","Older architectural styles often carry a sense of history, and they showcase fine craftsmanship."],"type":"choice/closed"},{"id":"b7040.i04","label":"4","prompt":"Ideally, we need homes which are convenient for travelling to work.","options":["This can save us valuable time and avoids the stress of being caught in heavy traffic.","It can be quicker to get to work."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7040.i01","label":"1","prompt":"Small homes can be crowded.","options":["This lack of space can cause family tensions.","Larger houses mean everyone has more space"],"type":"choice/closed"},{"kind":"item","id":"b7040.i02","label":"2","prompt":"Living in the suburbs is better than living in the city centre.","options":["It is usually cheaper to live in the suburbs and the environment is quieter and less congested.","Living in the suburbs is better because you can live more comfortably."],"type":"choice/closed"},{"kind":"item","id":"b7040.i03","label":"3","prompt":"Older architectural styles are more attractive than modern ones.","options":["Older architectural styles are more interesting to look at.","Older architectural styles often carry a sense of history, and they showcase fine craftsmanship."],"type":"choice/closed"}],[{"kind":"item","id":"b7040.i04","label":"4","prompt":"Ideally, we need homes which are convenient for travelling to work.","options":["This can save us valuable time and avoids the stress of being caught in heavy traffic.","It can be quicker to get to work."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 a 2 a 3 b 4 a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":48,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7041","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"4","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING A PERSUASIVE ARGUMENT"},"instruction":"Work in pairs. Imagine you are estate agents, and you are tasked with selling the two properties in the photos below. Student A should write a persuasive paragraph selling Property A and Student B should write a persuasive paragraph selling property B. Make sure you order information and write arguments using specific facts or information.","pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc429a23cd556abb5b57336df2813ec1a1a04cab92b9fe38976be99bd2858c21.png"],"provided":"","items":[{"id":"b7041.i01","label":"Property A","prompt":"Write a persuasive paragraph selling Property A.","options":[],"type":"gap/open"},{"id":"b7041.i02","label":"Property B","prompt":"Write a persuasive paragraph selling Property B.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7041.i01","label":"Property A","prompt":"Write a persuasive paragraph selling Property A.","options":[],"type":"gap/open"},{"kind":"item","id":"b7041.i02","label":"Property B","prompt":"Write a persuasive paragraph selling Property B.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A\nThis attractive property is located in the\nheart of the city. It is perfect for those who\nwant to be close to everything. It is ideal\nfor a single person or a couple looking for\na convenient and stylish home. With easy\naccess to shops, restaurants, and public\ntransport, this is a great opportunity to live\nin the city centre.\nB\nThis spacious suburban property is\nideal for families. Located in a peaceful\nneighborhood, this home includes a\nbeautiful garden, ideal for outdoor\nactivities and enjoying nature. With\ngood schools, parks, and local amenities\nnearby, this home provides the perfect\nbalance of suburban living while still being\nconveniently close to the city.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db4b5a108e0dd416b1d448fb7598d99a56216c52a1977b9d78230aa7214c0c0.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7042","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":41,"module":"ACADEMIC WRITING SKILLS","ex":"5","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"WRITING A PERSUASIVE ARGUMENT"},"instruction":"Compare your paragraphs. Which one is the more persuasive? Why?","pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cc429a23cd556abb5b57336df2813ec1a1a04cab92b9fe38976be99bd2858c21.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-RW-U05-question:b7041","kind":"student-work","title":"ACADEMIC WRITING SKILLS Ex 4","pages":[120]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-RW-U05-question:b7044","book":4,"unit":5,"track":"RW","topic":"ARCHITECTURE","lesson":2,"order":42,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITING TASK"},"instruction":"You are going to write a persuasive essay. Look back at your notes in Critical thinking. Discuss your ideas with a partner and then complete the plan below.","pages":[121],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/35d88a9eabd028dd39b08126635e7f58acc785ef9591a766412e4e78710d8b30.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>Paragraph 1: IntroductionIntroduce the topic / state your opinion / thesis statement\u003c/td>\u003ctd>Choosing where to live can be difficult and there are many factors to consider. This essay will argue that size is more important when choosing were to live.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 2:Persuasive Argument 1\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 3:Persuasive Argument 2\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragraph 4:Conclusion\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7044.i01","label":"Paragraph 2","prompt":"Persuasive Argument 1","options":[],"type":"discuss/open"},{"id":"b7044.i02","label":"Paragraph 3","prompt":"Persuasive Argument 2","options":[],"type":"discuss/open"},{"id":"b7044.i03","label":"Paragraph 4","prompt":"Conclusion","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-RW-U05-question:b7028","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[116]}],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Paragraph 1: IntroductionIntroduce the topic / state your opinion / thesis statement","header":false,"colspan":1,"rowspan":1},{"text":"Choosing where to live can be difficult and there are many factors to consider. This essay will argue that size is more important when choosing were to live.","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 2:Persuasive Argument 1","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 3:Persuasive Argument 2","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"Paragraph 4:Conclusion","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Paragraph 2 Having more space means\nyou have enough rooms\nfor everyone. This is more\ncomfortable. There is\nalso room for the things\nyou own and this is more\norganized. There might\nbe more outdoor space\ntoo which is beneficial.\nParagraph 3 Having more space is\nmore flexible. It also\nmeans that you can\nadapt to changes in\nthe future, for example,\nmore children. This saves\nmoney on moving to a\nnew house and a bigger\nhouse will be worth more\nin the future which is\nanother benefit.\nParagraph 4 Location can be important\nbut having a large\nhouse is even more\nessential and has more\nlong-term benefits.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df8fec665ca104adb2d0ca958a541036e353855b4de2848d0f31ee78594b07bd.pdf","pdfPage":48,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1db
