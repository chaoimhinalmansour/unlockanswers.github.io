ented the nori,"},{"start":32.16,"end":35.26,"text":"a simple bamboo platform with an engine on the back."},{"start":36.32,"end":39.16,"text":"It moves people and goods quickly and easily."},{"start":40.36,"end":46.8,"text":"A nori can travel on these old train tracks at speeds\nof around 40 kilometers per hour."},{"start":47.64,"end":48.14,"text":"Today,"},{"start":48.56,"end":53.68,"text":"the chance to ride on the bamboo railway brings\ntourists to this area."},{"start":56.12,"end":59.4,"text":"But trains are returning to Cambodia's tracks."},{"start":60.32,"end":64.47,"text":"This is the moment when Cambodia's first new passenger\ntrain set off."},{"start":65.82,"end":71.16,"text":"For more than 15 years, the Cambodian government has\nbeen slowly restoring the rail network,"},{"start":72,"end":74.74,"text":"and connecting Cambodia to other countries in the\nregion."},{"start":75.76,"end":80.94,"text":"The government saved money by getting old train tracks\nfor free from Malaysia and Thailand."},{"start":81.86,"end":85.72,"text":"They also bought secondhand trains from all around the\nworld."},{"start":86.92,"end":89.56,"text":"Today, trains can travel from Sinokville,"},{"start":90.1,"end":93.1,"text":"an international port in the south, to the capital\ncity,"},{"start":93.44,"end":94.14,"text":"Phnom Penh,"},{"start":94.53999999999999,"end":97.02000000000001,"text":"and all the way from Phnom Penh to Thailand."},{"start":98.25999999999999,"end":100.82,"text":"But does this mean the end of the bamboo railway?"},{"start":101.8,"end":103.88,"text":"Some parts of it have already closed."},{"start":104.53999999999999,"end":106.47999999999999,"text":"And in the Battambang villages,"},{"start":107.16,"end":110.34,"text":"money from tourism to the bamboo railway is important."},{"start":111.02000000000001,"end":115.2,"text":"People here hope there will be space for both the noris\nand the trains."},{"start":115.97999999999999,"end":120.44,"text":"They hope this little piece of Cambodia's\ntransportation history can stay."},{"start":121.46,"end":126.2,"text":"The people of Battambang also have the chance to be\npart of a much larger network."},{"start":127.16,"end":131.68,"text":"There are plans for high -speed rail, connecting\nCambodia with Thailand,"},{"start":132.02,"end":132.58,"text":"Vietnam,"},{"start":133,"end":133.44,"text":"China,"},{"start":133.76,"end":134.5,"text":"and from there,"},{"start":134.82,"end":135.56,"text":"the world."},{"start":135.56,"end":144.18,"text":"Trains traveling at 160 km per hour could soon\ntransform the economy in this part of the world."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 DNS 2 T 3 F; The government is buying second-hand\ntrains to restore the train network 4 T 5 F; There are\nplans to have high speed trains that travel more than\n160 km/hour connect Cambodia to other countries.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":33,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U03-question:b5447","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Work with a partner. Answer the questions.","pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5c19bf783dba142a95c49a5c5e2d95bf59d10ab3e264fdb8600c1b77338264a.png"],"provided":"","items":[{"id":"b5447.i01","label":"1","prompt":"Why did local people invent the norry?","options":[],"type":"qa/open"},{"id":"b5447.i02","label":"2","prompt":"Who uses the norry?","options":[],"type":"qa/open"},{"id":"b5447.i03","label":"3"," "},{"kind":"item","id":"b5457.i02","label":"2","prompt":"What three solutions does it describe?","options":[],"type":"qa/open"},{"kind":"item","id":"b5457.i03","label":"3","prompt":"What groups do these transport solutions serve?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B03-RW-U03-classroom:material:RW-M03","title":"READING 1","text":"URBAN TRANSPORT:\nPROBLEMS AND SOLUTIONS\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and move around cars that are stopped in traffic. Motorcycle owners can earn money by taking passengers to their destinations. In 2010, a new company began to offer motorcycle rides as an online service using an app. Now Jakarta residents can use their phones to call a motorcycle. It's cheap, safe, reliable and most importantly – fast.\n3 Congestion is not the only transport problem in big cities, however. Building roads is expensive. Building a public transport system is even more expensive. As a result, communities on the outskirts of major cities often have few roads. The challenge is even greater when these communities are high up in the mountains. Without public transport, it is difficult for residents to reach the city centre. They don't have access to jobs, education or healthcare.\n4 A good way to connect mountain communities to the city centre is a cable car system, which operates high above traffic. Because they use electricity, cable cars are cleaner than cars and buses that use petrol. They are also less expensive to build than buses or trains. The cars don't go very fast – only about 20 km per hour – but that is often faster than the traffic on the roads below.\n5 For people who live in mountain communities with few roads, cable cars make a big difference. One teacher in Bogotá, Colombia reported that it used to take him more than two hours to get to work, often arriving at the school after his students! With the cable car, he can be there in 40 minutes. Cable cars can also bring unexpected changes. Although they are built for residents, tourists love cable cars. In cities like Medellin, Colombia and La Paz, Bolivia, they are bringing tourists to areas of the city that were too far away, or in some cases, considered too dangerous for visitors. Now tourists visit these areas, where they spend money in shops and restaurants.\n6 Finally, the best way to get around a city with bad traffic is often walking. But walking in a city on a mountain is hard work. Another creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists.","screens":["URBAN TRANSPORT:\nPROBLEMS AND SOLUTIONS\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and nother creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists."],"sources":[{"page":64,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2dedd71165ce20e0c067b408e3be602c48788cb24d5a18bf34c40aa9d3918db1.png","width":772,"height":1040}],"kind":"reading"},{"id":"B03-RW-U03-publisher-page:p064","title":"原题或核对备注所引第64页","pages":[64],"text":"","screens":[],"sources":[{"page":64,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2dedd71165ce20e0c067b408e3be602c48788cb24d5a18bf34c40aa9d3918db1.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ccf2abc25213cfa8.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 traffic congestion; access\n2 motorcycle rideshare app; cable cars; outdoor escalators\n3 commuters; residents of mountain communities/\nresidents of communities with little access to the centre;\ntourists","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":34,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U03-question:b5459","book":3,"unit":3,"track" y, or in some cases, considered too dangerous for visitors. Now tourists visit these areas, where they spend money in shops and restaurants.\n6 Finally, the best way to get around a city with bad traffic is often walking. But walking in a city on a mountain is hard work. Another creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists.","screens":["URBAN TRANSPORT:\nPROBLEMS AND SOLUTIONS\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and move around cars that are stopped in traffic. Motorcycle owners can earn money by taking passengers to their destinations. In 2010, a new company began to offer motorcycle rides as an online service using an app. Now Jakarta residents can use their phones to call a motorcycle. It's cheap, safe, reliable and most importantly – fast.","3 Congestion is not the only transport problem in big cities, however. Building roads is expensive. Building a public transport system is even more expensive. As a result, communities on the outskirts of major cities often have few roads. The challenge is even greater when these comm mhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a89a6ee8a3014dde5504e643376c9cd6ac4ae56cd1d6b802a9fbce72736a99a3.png"],"provided":"","items":[{"id":"b5473.i01","label":"3","prompt":"Choose the best title for the essay.","options":["The effects of traffic congestion in cities","Solving the problem of traffic congestion","Urban traffic congestion is increasing","Bicycles can solve urban traffic congestion"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5473.i01","label":"3","prompt":"Choose the best title for the essay.","options":["The effects of traffic congestion in cities","Solving the problem of traffic congestion","Urban traffic congestion is increasing","Bicycles can solve urban traffic congestion"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B03-RW-U03-classroom:material:RW-M04","title":"READING 2","text":"[IMAGE_1]\n1 Traffic congestion is a serious problem in cities worldwide. There are simply too many vehicles competing for too little space. The company TomTom, which does research on traffic in cities worldwide, estimated that in 2015 the average commuter wasted 100 hours during the evening rush hour alone. In addition to wasting people's time, traffic jams have many other negative effects. Therefore, governments everywhere are working hard to find solutions to this problem.\n2 Traffic jams have negative effects on drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.\n3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions involve engineering. This means building more roads with wider lanes so that more cars can travel at the same time, as well as constructing tunnels and bridges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.\n4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.\n6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol\n$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]","screens":["[IMAGE_1]\n1 Traffic congestion is a serious problem in cities worldwide. There are simply too many vehicles competing for too little space. The company TomTom, which does research on traffic in cities worldwide, estimated that in 2015 the average commuter wasted 100 hours during the evening rush hour alone. In addition to wasting people's time, traffic jams have many other negative effects. Therefore, governments everywhere are working hard to find solutions to this problem.","2 Traffic jams have negative effects on drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.","3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions n emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.\n3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions involve engineering. This means building more roads with wider lanes so that more cars can travel at the same time, as well as constructing tunnels and bridges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.\n4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.\n6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol\n$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]","screens":["[IMAGE_1]\n1 Traffic congestion is a serious problem in cities worldwide. There are simply too many vehicles competing for too little space. The company TomTom, which does research on traffic in cities worldwide, estimated that in 2015 the average commuter wasted 100 hours during the evening rush hour alone. In addition to wasting people's time, traffic jams have many other negative effects. Therefore, governments everywhere are working hard to find solutions to this problem.","2 Traffic jams have negative effects on drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.","3 Because n drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.\n3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions involve engineering. This means building more roads with wider lanes so that more cars can travel at the same time, as well as constructing tunnels and bridges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.\n4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.\n6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol\n$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]","screens":["[IMAGE_1]\n1 Traffic congestion is a serious problem in cities worldwide. There are simply too many vehicles competing for too little space. The company TomTom, which does research on traffic in cities worldwide, estimated that in 2015 the average commuter wasted 100 hours during the evening rush hour alone. In addition to wasting people's time, traffic jams have many other negative effects. Therefore, governments everywhere are working hard to find solutions to this problem.","2 Traffic jams have negative effects on drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.","3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions involve engineering. This means building more roads with wider lanes so that more cars can travel at the same time, as well as constructing tunnels and bridges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.","4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.","6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol","$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]"],"sources":[{"page":67,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8f0757636b99f356fca6aed08c1bf3184c2c1ea8ad2ba92e6c26c746ef7250d.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_17fcd3c9595ec95f.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U03-question:b5495","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICA .i05","label":"5","prompt":"The traffic on the bridge is lighter. The city builds a cable car system.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  If we move the offices and schools next to the houses,\nit will be very expensive. / It will be very expensive if\nwe move the offices and schools next to the houses.\n2  If drivers have to pay to use the bridge, traffic\ncongestion will decrease. / Traffic congestion will\ndecrease if drivers have to pay to use the bridge.\n3  Fewer cars will use the roads if we increase the price of\nfuel. / If we increase the price of fuel, fewer cars will\nuse the roads.\n4  If we change the office hours, cars won’t all use the\nroad at the same time. / Cars won’t all use the road at\nthe same time if we change the office hours.\n5  Traffic on the bridge will be lighter if the city builds a\ncable car system. / If the city builds a cable car system,\ntraffic on the bridge will be lighter.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U03-question:b5505","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":2,"order":36,"module":"GRAMMAR FOR WRITING","ex":"2","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Join the sentences using if ... not or unless. Remember to use a negative verb in the consequence clause.","pages":[75],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d43ae593602dee086c7b4d18ba2d137771c261c44cd81be3a60aa93c43d60cb0.png"],"provided":"","items":[{"id":"b5505.i01","label":"1","prompt":"The traffic will improve. We build more roads. (if not)","options":[],"type":"gap/open"},{"id":"b5505.i02","label":"2","prompt":"Pollution will be reduced. We use cleaner transport. (unless)","options":[],"type":"gap/open"},{"id":"b5505.i03","label":"3","prompt":"We provide a solution. People will get to work on time. (if not)","options":[],"type":"gap/open"},{"id":"b5505.i04","label":"4","prompt":"We will solve the traffic problem. We build houses closer to the business areas. (unless)","options":[],"type":"gap/open"},{"id":"b5505.i05","label":"5","prompt":"The city invests in public transport. There will be less congestion. (if not)","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5505.i01","label":"1","prompt":"The traffic will improve. We build more roads. (if not)","options":[],"type":"gap/open"},{"kind":"item","id":"b5505.i02","label":"2","prompt":"Pollution will be reduced. We use cleaner transport. (unless)","options":[],"type":"gap/open"},{"kind":"item","id":"b5505.i03","label":"3","prompt":"We provide a solution. People will get to work on time. (if not)","options":[],"type":"gap/open"},{"kind":"item","id":"b5505.i04","label":"4","prompt":"We will solve the traffic problem. We build houses closer to the business areas. (unless)","options":[],"type":"gap/open"},{"kind":"item","id":"b5505.i05","label":"5","prompt":"The city invests in public transport. There will be less congestion. (if not)","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"2  Pollution won’t be reduced unless we use cleaner\ntransport. / Unless we use cleaner transport, pollution\nwon’t be reduced.\n3  If we don’t provide a solution, people won’t get to\nwork on time. / People won’t get to work on time if we\ndon’t provide a solution.\n4  We won’t solve the traffic problem unless we build\nhouses closer to the business areas. / Unless we build\nhouses closer to the business areas, we won’t solve the\ntraffic problem.\n5  If the city doesn’t invest in public transport, there won’t\nbe less congestion. / There won’t be less congestion if\nthe city doesn’t invest in public transport,","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U03-question:b5508","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":2,"order":37,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the paragraphs. Then, circle the best concluding sentence (a–c) for each one.","pages":[76],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1c8b7d4e7271517ee9afd52de672eb9256e4c54c1fe3a0fc0c0dcb608bf431ee.png"],"provided":"Paragraph 1\nCycling to work has both advantages and disadvantages. The most important advantage is that it saves me time because I don't have to wait in traffic or spend time searching for a parking space. Cycling is great exercise and it feels good. Also, cycling helps the environment because it does not create any pollution. However, there are two things I dislike about cycling. One is that it can be dangerous if drivers can't see you. Also, some drivers are very rude.\na In other words, some drivers think they own the road and cyclists have no place on it.\nb Still, I think the advantages of cycling outweigh the disadvantages, and I will continue to use my bicycle to get around in good weather.\nc Because of these disadvantages, I may sell my bicycle and take the bus.\n\nParagraph 2\nIn some cities, such as Seattle and Istanbul, people commute to work by ferry. A ferry carries people, and sometimes cars, over water between two or more places. Sometimes a ferry is the only way to get around because there are no roads or bridges. However, even if a road exists, many people prefer to travel by ferry because it saves time. Ferry passengers don't have to sit in traffic, and they can read or work on their computers. Another benefit is that ferries help the environment by keeping hundreds of cars and lorries off the roads.","items":[{"id":"b5508.i01","label":"Paragraph 1","prompt":"Choose the best concluding sentence for Paragraph 1.","options":["In other words, some drivers think they own the road and cyclists have no place on it.","Still, I think the advantages of cycling outweigh the disadvantages, and I will continue to use my bicycle to get around in good weather.","Because of these disadvantages, I may sell my bicycle and take the bus."],"type":"choice/closed"},{"id":"b5508.i02","label":"Paragraph 2","prompt":"Choose the best concluding sentence for Paragraph 2.","options":["In other words, some drivers think they own the road and cyclists have no place on it.","Still, I think the advantages of cycling outweigh the disadvantages, and I will continue to use my bicycle to get around in good weather.","Because of these disadvantages, I may sell my bicycle and take the bus."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Paragraph 1"},{"kind":"text","text":"Cycling to work has both advantages and disadvantages. The most important advantage is that it saves me time because I don't have to wait in traffic or spend time searching for a parking space. Cycling is great exercise and it feels good. Also, cycling helps the environment because it does not create any pollution. However, there are two things I dislike about cycling. One is that it can be dangerous if drivers can't see you. Also, some drivers are very rude."},{"kind":"text","text":"a In other words, some drivers think they own the road and cyclists have no place on it."},{"kind":"text","text":"b Still, I think the advantages of cycling outweigh the disadvantages, and I will continue to use my bicycle to get around in good weather."}],[{"kind":"text","text":"c Because of these disadvantages, I may sell my bicycle and take the bus."},{"kind":"text","text":"Paragraph 2"},{"kind":"text","text":"In some cities, such as Seattle and Istanbul, people commute to work by ferry. A ferry carries people, and sometimes cars, over water between two or more places. Sometimes a ferry is the only way to get around because there are no roads or bridges. However, even if a road exists, many people prefer to travel by ferry because it saves time. Ferry passengers don't have to sit in traffic, and they can read or work on their computers. Another benefit is that ferries help the environment by keeping hundreds of cars and lorries off the roads."}],[{"kind":"item","id":"b5508.i01","label":"Paragraph 1","prompt":"Choose the best concluding sentence for Paragraph 1.","options":["In other words, some drivers think they own the road and cyclists have no place on it.","Still, I think the advantages of cycling outweigh the disadvantages, and I will continue to use my bicycle to get around in good weather.","Because of these disadvantages, I may sell my bicycle and take the bus."],"type":"choice/closed"}],[{"kind":"item","id":"b5508.i02","label":"Paragraph 2","prompt":"Choose the best concluding sentence for Paragraph 2.","options":["In other words, some drivers think they own the road and cyclists have no place on it.","Still, I think the advantages of cycling outweigh the disadvantages, and I will continue to use my bicycle to get around in good weather.","Because of these disadvantages, I may sell my bicycle and take the bus."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"Paragraph 1: b; Paragraph 2: a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":37,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U03-question:b5511","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":2,"order":38,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Look at the table you created in Exercise 3 in the Critical thinking section and complete the outline.","pages":[77],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/14eb2c70f6485cb50301bcd78c31eaf7153ca7fbc861dc20747170d8a498d114.png"],"provided":"Solution 1: ____\nAdvantages: ____\nDisadvantages: ____\nSolution 2: ____\nAdvantages: ____\nDisadvantages: ____","items":[{"id":"b5511.i01","label":"Solution 1","prompt":"Solution 1: ____","options":[],"type":"gap/open"},{"id":"b5511.i02","label":"Advantages 1","prompt":"Advantages: ____","options":[],"type":"gap/open"},{"id":"b5511.i03","label":"Disadvantages 1","prompt":"Disadvantages: ____","options":[],"type":"gap/open"},{"id":"b5511.i04","label":"Solution 2","prompt":"Solution 2: ____","options":[],"type":"gap/open"},{"id":"b5511.i05","label":"Advantages 2","prompt":"Advantages: ____","options":[],"type":"gap/open"},{"id":"b5511.i06","label":"Disadvantages 2","prompt":"Disadvantages: ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B03-RW-U03-question:b5497","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[73]}],"materials":[],"coursePages":[[{"kind":"text","text":"Solution 1: ____"},{"kind":"text","text":"Advantages: ____"},{"kind":"text","text":"Disadvantages: ____"},{"kind":"text","text":"Solution  their children at school. After a long period of study, we have proposed two possible solutions to the traffic problems in Riverton. Both solutions have advantages and disadvantages.\nConclusion: In conclusion, of the many solutions which we have considered, these two had the most advantages. Although these plans are not perfect, there is no doubt that they will help reduce the traffic congestion in Riverton. This will have benefits both for people's health and for the environment. The people of Riverton should consider both these solutions.\nSolving Riverton's traffic congestion problem\nIntroduction: Riverton's unusual geography causes it to have bad traffic congestion. People have to travel from their homes on one side of the river and desert to their offices and schools on the other. Unfortunately, there is only one main road running through the city centre and just one bridge which connects the residential and business areas. Moreover, the only public transport is a bus which uses the same road. There is also a junction near the housing area where the traffic builds up during the two rush hours, when people commute to work or drop off their children at school. After a long period of study, we have proposed two possible solutions to the traffic problems in Riverton. Both solutions have advantages and disadvantages.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Solving Riverton's traffic congestion problem"},{"kind":"text","text":"Introduction: Riverton's unusual geography causes it to have bad traffic congestion. People have to travel from their homes on one side of the river and desert to their offices and schools on the other. Unfortunately, there is only one main road running through the city centre and just one bridge which connects the residential and business areas. Moreover, the only public transport is a bus which uses the same road. There is also a junction near the housing area where the traffic builds up during the two rush hours, when people commute to work or drop off their children at school. After a long period of study, we have proposed two possible solutions to the traffic problems in Riverton. Both solutions have advantages and disadvantages."}],[{"kind":"text","text":"Conclusion: In conclusion, of the many solutions which we have considered, these two had the most advantages. Although these plans are not perfect, there is no doubt that they will help reduce the traffic congestion in Riverton. This will have benefits both for people's health and for the environment. The people of Riverton should consider both these solutions."},{"kind":"text","text":"Solving Riverton's traffic congestion problem"}],[{"kind":"text","text":"Introduction: Riverton's unusual geography causes it to have bad traffic congestion. People have to travel from their homes on one side of the river and desert to their offices and schools on the other. Unfortunately, there is only one main road running through the city centre and just one bridge which connects the residential and business areas. Moreover, the only public transport is a bus which uses the same road. There is also a junction near the housing area where the traffic builds up during the two rush hours, when people commute to work or drop off their children at school. After a long period of study, we have proposed two possible solutions to the traffic problems in Riverton. Both solutions have advantages and disadvantages."}]],"courseMaterials":[{"id":"B03-RW-U03-publisher-sheet:b5511","title":"WRITING TASK Ex 1 原题面","pages":[77],"text":"Solution 1: ____\nAdvantages: ____\nDisadvantages: ____\nSolution 2: ____\nAdvantages: ____\nDisadvantages: ____","screens":["Solution 1: ____","Advantages: ____","Disadvantages: ____","Solution 2: ____","Advantages: ____","Disadvantages: ____"],"sources":[{"page":77,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/ text":"Make suggestions; use the first conditional; use if ... not and unless."},{"label":"Academic writing skill","text":"Write a concluding sentence."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":58,"alt":""}}]}},{"id":"B03-RW-U03-classroom:resource:b5443","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[60],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/997776fe8ee5fb2cd5e33f656f79dfa17beb3a578fbe8f250e862a7024fcf058.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"tracks","pos":"(n)","definition":"metal bars that trains travel on","example":"Keep away from the railway tracks.","wordAudio":"tracks","cardWord":false},{"term":"network","pos":"(n)","definition":"system of connected, similar parts","example":"A network of buses connects the villages.","wordAudio":"network","cardWord":false},{"term":"investment","pos":"(n)","definition":"the act of putting money into something to achieve a result","example":"The city needs more investment in public transport.","wordAudio":"investment","cardWord":false},{"term":"platform","pos":"(n)","definition":"a long, raised area where people get off and on trains","example":"We waited on the platform for the train.","wordAudio":"platform","cardWord":false},{"term":"restore","pos":"(v)","definition":"to return something to an earlier good condition","example":"Volunteers helped restore the old station.","wordAudio":"restore","cardWord":false}]]}},{"id":"B03-RW-U03-classroom:video","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5c19bf783dba142a95c49a5c5e2d95bf59d10ab3e264fdb8600c1b77338264a.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/62e5e2899f0d23bd65572f62-L3RW-U03.mp4","captions":[{"start":0,"end":4.5,"text":"There's something coming down the tracks, but it's not\na train."},{"start":5.22,"end":7.78,"text":"This is Cambodia's Bamboo Railway,"},{"start":8.5,"end":11.92,"text":"and the vehicle speeding by is called a nori."},{"start":12.74,"end":13.7,"text":"For many years,"},{"start":14.02,"end":17.08,"text":"there were hardly any trains on Cambodia's rail\nnetwork."},{"start":17.82,"end":20.46,"text":"After years of war and little investment,"},{"start":20.84,"end":22.82,"text":"the train tracks were in bad condition."},{"start":24.2,"end":26.64,"text":"Here in the northern area of Battambang,"},{"start":27.3,"end":28.62,"text":"trains couldn't run at all."},{"start":29.37,"end":31.66,"text":"That's why local people invented the nori,"},{"start":32.16,"end":35.26,"text":"a simple bamboo platform with an engine on the back."},{"start":36.32,"end":39.16,"text":"It moves people and goods quickly and easily."},{"start":40.36,"end":46.8,"text":"A nori can travel on these old train tracks at speeds\nof around 40 kilometers per hour."},{"start":47.64,"end":48.14,"text":"Today,"},{"start":48.56,"end":53.68,"text":"the chance to ride on the bamboo railway brings\ntourists to this area."},{"start":56.12,"end":59.4,"text":"But trains are returning to Cambodia's tracks."},{"start":60.32,"end":64.47,"text":"This is the moment when Cambodia's first new passenger\ntrain set off."},{"start":65.82,"end":71.16,"text":"For more than 15 years, the Cambodian government has\nbeen slowly restoring the rail network,"},{"start":72,"end":74.74,"text":"and connecting Cambodia to other countries in the\nregion."},{"start":75.76,"end":80.94,"text":"The government saved money by getting old train tracks\nfor free from Malaysia and Thailand."},{"start":81.86,"end":85.72,"text":"They also bought secondhand trains from all around the\nworld."},{"start":86.92,"end":89.56,"text":"Today, trains can travel from Sinokville,"},{"start":90.1,"end":93.1,"text":"an international port in the south, to the capital\ncity,"},{"start":93.44,"end":94.14,"text":"Phnom Penh,"},{"start":94.53999999999999,"end":97.02000000000001,"text":"and all the way from Phnom Penh to Thailand."},{"start":98.25999999999999,"end":100.82,"text":"But does this mean the end of the bamboo railway?"},{"start":101.8,"end":103.88,"text":"Some parts of it have already closed."},{"start":104.53999999999999,"end":106.47999999999999,"text":"And in the Battambang villages,"},{"start":107.16,"end":110.34,"text":"money from tourism to the bamboo railway is important."},{"start":111.02000000000001,"end":115.2,"text":"People here hope there will be space for both the noris\nand the trains."},{"start":115.97999999999999,"end":120.44,"text":"They hope this little piece of Cambodia's\ntransportation history can stay."},{"start":121.46,"end":126.2,"text":"The people of Battambang also have the chance to be\npart of a much larger network."},{"start":127.16,"end":131.68,"text":"There are plans for high -speed rail, connecting\nCambodia with Thailand,"},{"start":132.02,"end":132.58,"text":"Vietnam,"},{"start":133,"end":133.44,"text":"China,"},{"start":133.76,"end":134.5,"text":"and from there,"},{"start":134.82,"end":135.56,"text":"the world."},{"start":135.56,"end":144.18,"text":"Trains traveling at 160 km per hour could soon\ntransform the economy in this part of the world."}],"launchInline":true}},{"id":"B03-RW-U03-classroom:material:RW-M03","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[64],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2dedd71165ce20e0c067b408e3be602c48788cb24d5a18bf34c40aa9d3918db1.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"URBAN TRANSPORT:\nPROBLEMS AND SOLUTIONS\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and move around cars that are stopped in traffic. Motorcycle owners can earn money by taking passengers to their destinations. In 2010, a new company began to offer motorcycle rides as an online service using an app. Now Jakarta residents can use their phones to call a motorcycle. It's cheap, safe, reliable and most importantly – fast.","sourcePage":64},{"body":"3 Congestion is not the only transport problem in big cities, however. Building roads is expensive. Building a public transport system is even more expensive. As a result, communities on the outskirts of major cities often have few roads. The challenge is even greater when these communities are high up in the mountains. Without public transport, it is difficult for residents to reach the city centre. They don't have access to jobs, education or healthcare.\n4 A good way to connect mountain communities to the city centre is a cable car system, which operates high above traffic. Because they use electricity, cable cars are cleaner than cars and buses that use petrol. They are also less expensive to build than buses or trains. The cars don't go very fast – only about 20 km per hour – but that is often faster than the traffic on the roads below.","sourcePage":64},{"body":"5 For people who live in mountain communities with few roads, cable cars make a big difference. One teacher in Bogotá, Colombia reported that it used to take him more than two hours to get to work, often arriving at the school after his students! With the cable car, he can be there in 40 minutes. Cable cars can also bring unexpected changes. Although they are built for residents, tourists love cable cars. In cities like Medellin, Colombia and La Paz, Bolivia, they are bringing tourists to areas of the city that were too far away, or in some cases, considered too dangerous for visitors. Now tourists visit these areas, where they spend money in shops and restaurants.","sourcePage":64},{"body":"6 Finally, the best way to get around a city with bad traffic is often walking. But walking in a city on a mountain is hard work. Another creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists.","sourcePage":64}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U03-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"URBAN TRANSPORT:","pages":[{"page":64,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2dedd71165ce20e0c067b408e3be602c48788cb24d5a18bf34c40aa9d3918db1.png","width":772,"height":1040}],"source":64,"embeddedIn":null,"photo":null,"clearPages":[{"body":"URBAN TRANSPORT:\nPROBLEMS AND SOLUTIONS\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and move around cars that are stopped in traffic. Motorcycle owners can earn money by taking passengers to their destinations. In 2010, a new company began to offer motorcycle rides as an online service using an app. Now Jakarta residents can use their phones to call a motorcycle. It's cheap, safe, reliable and most importantly – fast.","sourcePage":64},{"body":"3 Congestion is not the only transport problem in big cities, however. Building roads is expensive. Building a public transport system is even more expensive. As a result, communities on the outskirts of major cities often have few roads. The challenge is even greater when these communities are high up in the mountains. Without public transport, it is difficult for residents to reach the city centre. They don't have access to jobs, education or healthcare.\n4 A good way to connect mountain communities to the city centre is a cable car system, which operates high above traffic. Because they use electricity, cable cars are cleaner than cars and buses that use petrol. They are also less expensive to build than buses or trains. The cars don't go very fast – only about 20 km per hour – but that is often faster than the traffic on the roads below.","sourcePage":64},{"body":"5 For people who live in mountain communities with few roads, cable cars make a big difference. One teacher in Bogotá, Colombia reported that it used to take him more than two hours to get to work, often arriving at the school after his students! With the cable car, he can be there in 40 minutes. Cable cars can also bring unexpected changes. Although they are built for residents, tourists love cable cars. In cities like Medellin, Colombia and La Paz, Bolivia, they are bringing tourists to areas of the city that were too far away, or in some cases, considered too dangerous for visitors. Now tourists visit these areas, where they spend money in shops and restaurants.","sourcePage":64},{"body":"6 Finally, the best way to get around a city with bad traffic is often walking. But walking in a city on a mountain is hard work. Another creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists.","sourcePage":64}],"text":"URBAN TRANSPORT:\nPROBLEMS AND SOLUTIONS\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and move around cars that are stopped in traffic. Motorcycle owners can earn money by taking passengers to their destinations. In 2010, a new company began to offer motorcycle rides as an online service using an app. Now Jakarta residents can use their phones to call a motorcycle. It's cheap, safe, reliable and most importantly – fast.\n3 Congestion is not the only transport problem in big cities, however. Building roads is expensive. Building a public transport system is even more expensive. As a result, communities on the outskirts of major cities often have few roads. The challenge is even greater when these communities are high up in the mountains. Without public transport, it is difficult for residents to reach the city centre. They don't have access to jobs, education or healthcare.\n4 A good way to connect mountain communities to the city centre is a cable car system, which operates high above traffic. Because they use electricity, cable cars are cleaner than cars and buses that use petrol. They are also less expensive to build than buses or trains. The cars don't go very fast – only about 20 km per hour – but that is often faster than the traffic on the roads below.\n5 For people who live in mountain communities with few roads, cable cars make a big difference. One teacher in Bogotá, Colombia reported that it used to take him more than two hours to get to work, often arriving at the school after his students! With the cable car, he can be there in 40 minutes. Cable cars can also bring unexpected changes. Although they are built for residents, tourists love cable cars. In cities like Medellin, Colombia and La Paz, Bolivia, they are bringing tourists to areas of the city that were too far away, or in some cases, considered too dangerous for visitors. Now tourists visit these areas, where they spend money in shops and restaurants.\n6 Finally, the best way to get around a city with bad traffic is often walking. But walking in a city on a mountain is hard work. Another creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists.","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ccf2abc25213cfa8.mp3"},"original":{"id":"B03-RW-U03-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U03","book":3,"track":"RW","unit":3,"title":"READING 1","kind":"material","pages":[64],"sourceImages":[{"page":64,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2dedd71165ce20e0c067b408e3be602c48788cb24d5a18bf34c40aa9d3918db1.png","viewEvidenceReported":true}],"text":"URBAN TRANSPORT:\n\nPROBLEMS AND SOLUTIONS\n\n1 Getting around today's cities can be a challenge. Many modern cities have terrible traffic congestion. It can take hours to cross the city because there are simply too many cars. Governments and businesses around the world are finding creative ways to solve these problems.\n2 In cities like Jakarta, Indonesia, commuters may spend four hours in their cars every day. The solution? Add modern technology to the familiar motorcycle. Because they are small, motorcycles can fit into small spaces and move around cars that are stopped in traffic. Motorcycle owners can earn money by taking passengers to their destinations. In 2010, a new company began to offer motorcycle rides as an online service using an app. Now Jakarta residents can use their phones to call a motorcycle. It's cheap, safe, reliable and most importantly – fast.\n3 Congestion is not the only transport problem in big cities, however. Building roads is expensive. Building a public transport system is even more expensive. As a result, communities on the outskirts of major cities often have few roads. The challenge is even greater when these communities are high up in the mountains. Without public transport, it is difficult for residents to reach the city centre. They don't have access to jobs, education or healthcare.\n4 A good way to connect mountain communities to the city centre is a cable car system, which operates high above traffic. Because they use electricity, cable cars are cleaner than cars and buses that use petrol. They are also less expensive to build than buses or trains. The cars don't go very fast – only about 20 km per hour – but that is often faster than the traffic on the roads below.\n5 For people who live in mountain communities with few roads, cable cars make a big difference. One teacher in Bogotá, Colombia reported that it used to take him more than two hours to get to work, often arriving at the school after his students! With the cable car, he can be there in 40 minutes. Cable cars can also bring unexpected changes. Although they are built for residents, tourists love cable cars. In cities like Medellin, Colombia and La Paz, Bolivia, they are bringing tourists to areas of the city that were too far away, or in some cases, considered too dangerous for visitors. Now tourists visit these areas, where they spend money in shops and restaurants.\n6 Finally, the best way to get around a city with bad traffic is often walking. But walking in a city on a mountain is hard work. Another creative solution is the outdoor escalator. In Medellin, residents once had to climb uphill for a half an hour (= 28 stories!) to their homes. Today, the escalator ride takes just six minutes. The world's longest outdoor elevator is in Hong Kong. It is 800 m and serves almost 80,000 people every day, including many tourists.\n7 Traffic congestion will continue to be a problem in big cities. However, creative solutions like these can help people get around cities more easily. They can also reduce pollution and traffic and attract tourists.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5458"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ccf2abc25213cfa8.mp3","continueOnPage":true}},{"id":"B03-RW-U03-classroom:resource:b5468","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[66],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/52cf5ae8d80f39763243d9b72ca9b031a14d08d6718647c6a2654adc5f54e3d4.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["cycle (v) to travel by bicycle\nemergency (n) an unexpected situation which requires immediate action\nengineering (n) the activity of designing and building things like bridges, roads, machines, etc.\nfuel (n) a substance like gas or coal which produces energy when it is burned","government (n) the group of people that controls a country or city and makes decisions about laws, taxes, education, etc.\npractical (adj) useful; suitable for the situation it is being used for\nvehicle (n) any machine which travels on roads, such as cars, buses, etc."]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U03-classroom:material:RW-M04","book":3,"unit":3,"track":"RW","topic":"TRANSPORT","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[67],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8f0757636b99f356fca6aed08c1bf3184c2c1ea8ad2ba92e6c26c746ef7250d.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"[IMAGE_1]\n1 Traffic congestion is a serious problem in cities worldwide. There are simply too many vehicles competing for too little space. The company TomTom, which does research on traffic in cities worldwide, estimated that in 2015 the average commuter wasted 100 hours during the evening rush hour alone. In addition to wasting people's time, traffic jams have many other negative effects. Therefore, governments everywhere are working hard to find solutions to this problem.","sourcePage":67},{"body":"2 Traffic jams have negative effects on drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.","sourcePage":67},{"body":"3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions involve engineering. This means building more roads with wider lanes so that more cars can travel at the same time, as well as constructing tunnels and bridges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.","sourcePage":67},{"body":"4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.","sourcePage":67},{"body":"6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol","sourcePage":67},{"body":"$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]","sourcePage":67}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U03-classroom:material:R dges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.","sourcePage":67},{"body":"4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.","sourcePage":67},{"body":"6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol","sourcePage":67},{"body":"$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]","sourcePage":67}],"text":"[IMAGE_1]\n1 Traffic congestion is a serious problem in cities worldwide. There are simply too many vehicles competing for too little space. The company TomTom, which does research on traffic in cities worldwide, estimated that in 2015 the average commuter wasted 100 hours during the evening rush hour alone. In addition to wasting people's time, traffic jams have many other negative effects. Therefore, governments everywhere are working hard to find solutions to this problem.\n2 Traffic jams have negative effects on drivers, cities and the environment. To begin with, they cause stress to drivers, which may lead to health problems or road rage $^{1}$ . Traffic jams can also lead to economic losses because products cannot be delivered on time, and employees arrive late for work or meetings. Another negative effect is that emergency services can become caught in traffic and are, therefore, unable to get to an emergency in time. Finally, traffic congestion negatively affects the environment. Traffic congestion wastes fuel, which in turn produces more carbon dioxide through car exhaust $^{2}$ and contributes to the greenhouse effect. Taken together, all these effects have a serious negative impact on the quality of people's lives.\n3 Because of these serious effects, it is important for cities and governments everywhere to take steps to reduce road congestion. The most obvious solutions involve engineering. This means building more roads with wider lanes so that more cars can travel at the same time, as well as constructing tunnels and bridges to guide drivers around congested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.\n4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.\n6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol\n$^{3}$ late shifts (n) work hours that are late in the day or at night\n[IMAGE_2]","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_17fcd3c9595ec95f.mp3"},"original":{"id":"B03-RW-U03-materia ngested areas. However, the costs for engineering solutions are extremely high. Another problem is that more roads may actually result in more traffic. In short, engineering solutions have both advantages and disadvantages.\n4 Other, more creative, solutions to the congestion problem are to increase the tax on fuel or to make people pay to travel in the centre of a city or on a motorway. If governments increase the cost of driving, people will think more carefully about using their cars. However, taxing fuel and roads may mean that some people cannot afford to drive their cars, and they may have to give up their jobs. Also, governments may not want to increase the fuel tax too much if the tax is unpopular with voters.\n5 A more popular solution, therefore, would be to promote other forms of transport, like ferries, cycling and underground trains. One suggestion is to encourage people to cycle more. Although cycling has obvious health benefits and does not pollute the air, it is not practical in every climate and can prove dangerous in heavy traffic.\n6 Another possibility is to persuade people to use buses, although they are inconvenient for some people. A related option is a park-and-ride system which allows people to drive to the outskirts of cities, park, and then take a bus to the city centre. This allows some flexibility for car drivers and reduces congestion in the centre of the city. A disadvantage for people who work late shifts $^{3}$ is that many buses do not run at night.\n7 Overall, cities are using a variety of methods to tackle the problem of traffic congestion. Most of the methods have advantages as well as disadvantages. We should encourage alternative forms of transport because they reduce the amount of traffic on the roads and also have a positive effect on the environment.\n\n$^{1}$ road rage (n) violence committed by angry drivers in traffic\n$^{2}$ exhaust (n) smoke that comes out of a car as a result of burning petrol\n$^{3}$ late shifts (n) wo
