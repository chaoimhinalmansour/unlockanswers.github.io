:[],"type":"choice/closed"},{"kind":"item","id":"b3593.i04","label":"4","prompt":"Waterspouts can be more than 3,000 metres tall.","options":[],"type":"choice/closed"},{"kind":"item","id":"b3593.i05","label":"5","prompt":"Waterspouts die in about ten minutes.","options":[],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/596b2e1e2dbd90f5dcef7400-L2RW-U04.mp4","captions":[{"start":0,"end":4.4,"text":"The weather doesn't often surprise us."},{"start":5.42,"end":9.78,"text":"But sometimes the sky does some unusual things."},{"start":12.56,"end":16.42,"text":"Get ready to see some of the world's strangest weather."},{"start":18.76,"end":21.34,"text":"Do you see that circle around the sun?"},{"start":23.32,"end":25,"text":"That's a sun halo."},{"start":26.54,"end":28.96,"text":"Sun halos are like rainbows."},{"start":30.62,"end":33.98,"text":"In rainbows, the sun's light shines through rain."},{"start":35.98,"end":39.98,"text":"In sun halos, the light shines through ice crystals."},{"start":42.24,"end":44.86,"text":"Sun halos are more common in cold places."},{"start":46.82,"end":48.72,"text":"But you can see them anywhere."},{"start":50.78,"end":54.1,"text":"Just remember not to look directly at the sun."},{"start":55.82,"end":59.82,"text":"Sun halos can mean that a storm is coming soon."},{"start":61.4,"end":63.52,"text":"And here comes one now."},{"start":65.6,"end":67.96,"text":"This is a supercell storm."},{"start":69.8,"end":72.9,"text":"Supercell storms form when warm, wet air rises."},{"start":74.02,"end":76.44,"text":"Winds push and pull the wet air."},{"start":78.24,"end":80.44,"text":"Then it begins to rotate."},{"start":82.46000000000001,"end":85.38,"text":"Supercell storms happen all over the world."},{"start":86.24,"end":89.7,"text":"But they're most common in the central United States."},{"start":91.72,"end":95.56,"text":"There, about 30 % become tornadoes."},{"start":96.68,"end":97.4,"text":"Over water,"},{"start":97.8,"end":100.24000000000001,"text":"rotating air can cause waterspouts."},{"start":102.2,"end":104.8,"text":"You might think this is a tower of water."},{"start":105.92,"end":109.62,"text":"But waterspouts are a mix of air and water."},{"start":110.66,"end":113.62,"text":"They form between clouds and the ocean."},{"start":115.14,"end":117.6,"text":"Waterspouts are common in warm waters."},{"start":118.96000000000001,"end":124.86,"text":"Some waterspouts can be more than one ,500 meters tall\nwith very strong winds."},{"start":126.18,"end":129.08,"text":"Most waterspouts die in about five minutes."},{"start":130.42,"end":133.06,"text":"But some can be dangerous to ships,"},{"start":133.4,"end":133.8,"text":"planes,"},{"start":134.14,"end":134.92,"text":"and swimmers."},{"start":137.07999999999998,"end":139.4,"text":"Wet air doesn't only cause storms."},{"start":140.44,"end":143.07999999999998,"text":"It can make some amazing shapes."},{"start":144.26,"end":146.36,"text":"This is a lenticular cloud."},{"start":148.12,"end":152.04,"text":"They form when winds push wet air over high mountains."},{"start":155.68,"end":157.44,"text":"As the air gets colder,"},{"start":158.5,"end":161.24,"text":"lenticular clouds form like a cap."},{"start":162.06,"end":164.32,"text":"Lenticular clouds look strange."},{"start":164.74,"end":168,"text":"But they're not the strangest thing you can see in the\nsky."},{"start":171.48,"end":174.16,"text":"You're looking at the Northern Lights."},{"start":175.56,"end":180.02,"text":"These lights appear when energy from the sun enters the\nEarth's atmosphere."},{"start":181.4,"end":185.46,"text":"The best places to see the Northern Lights are close to\nthe North Pole."},{"start":186.88,"end":188.24,"text":"In countries like Canada,"},{"start":188.86,"end":189.14,"text":"Norway,"},{"start":189.6,"end":190.3,"text" end a lot of time indoors during the monsoon, but life does not stop.","The monsoon storms can leave people in the dark."],"type":"choice/closed"}],[{"kind":"item","id":"b3605.i05","label":"6","prompt":"Paragraph 6","options":["Summer monsoons are not a new phenomenon, but experts are worried.","Heavy monsoon rains can cause landslides.","Some people in the town of Mawsynram, in Meghalaya, prepare for the rain by covering their homes with dried grass.","People can spend a lot of time indoors during the monsoon, but life does not stop.","The monsoon storms can leave people in the dark."],"type":"choice/closed"}]],"courseMaterials":[{"id":"B02-RW-U04-classroom:material:RW-M03","title":"READING 1","text":"## Living in the\n[IMAGE_1]\n## wettest\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.\nThey do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n## place on Earth\n4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.\n6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","screens":["## Living in the\n[IMAGE_1]\n## wettest\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot .png"],"provided":"Read the article on page 89 and check your answers to Exercise 1. ## WHILE READING","items":[],"layout":"list","references":[{"id":"B02-RW-U04-question:b3618","kind":"student-work","title":"READING 2 Ex 1","pages":[87]}],"materials":[],"coursePages":[[{"kind":"text","text":"Read the article on page 89 and check your answers to Exercise 1. ## WHILE READING"}]],"courseMaterials":[{"id":"B02-RW-U04-publisher-page:p089","title":"原题或核对备注所引第89页","pages":[89],"text":"","screens":[],"sources":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U04-question:b3625","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":2,"order":24,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the article again. Write the paragraph number (1–8) next to the best title (a–e). You do not need to use all the paragraph numbers.","pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d444d011bbc9e9f7e79dafe83d00c62c8cd75357c3b24dbd942381ae9bc2ccd2.png"],"provided":"","items":[{"id":"b3625.i01","label":"1","prompt":"Stay out of the sun","options":[],"type":"gap/open"},{"id":"b3625.i02","label":"2","prompt":"Drink water","options":[],"type":"gap/open"},{"id":"b3625.i03","label":"3","prompt":"Stay cool during the day and warm at night","options":[],"type":"gap/open"},{"id":"b3625.i04","label":"4","prompt":"Don’t eat too much","options":[],"type":"gap/open"},{"id":"b3625.i05","label":"5","prompt":"Stay with your car","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3625.i01","label":"1","prompt":"Stay out of the sun","options":[],"type":"gap/open"},{"kind":"item","id":"b3625.i02","label":"2","prompt":"Drink water","options":[],"type":"gap/open"},{"kind":"item","id":"b3625.i03","label":"3","prompt":"Stay cool during the day and warm at night","options":[],"type":"gap/open"},{"kind":"item","id":"b3625.i04","label":"4","prompt":"Don’t eat too much","options":[],"type":"gap/open"},{"kind":"item","id":"b3625.i05","label":"5","prompt":"Stay with your car","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B02-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.\n4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.\n7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","screens":["# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.","4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.","7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention"],"sources":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_fe74950e306c8aee.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 8 b 6 c 4 d 7 e 5","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":42,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U04-question:b3626","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":2,"order":25,"module":"READING 2","ex":"5","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Match the sentence halves. Use the graph on page 89 and information in paragraph 2 to help you.","pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d444d011bbc9e9f7e79dafe83d00c62c8cd75357c3b24dbd942381ae9bc2ccd2.png"],"provided":"\u003ctable>\u003ctr>\u003cth>1–4\u003c/th>\u003cth>a–d\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 The coldest time is\u003cbr>2 The average amount of rain in a year\u003cbr>3 The temperature is 33°C\u003cbr>4 The coldest temperature at night\u003c/td>\u003ctd>a between 2 pm and 4 pm.\u003cbr>b is −1°C.\u003cbr>c is 70 mm.\u003cbr>d at four o’clock in the morning.\u003c/td>\u003c/tr>\u003c/table>","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"1–4","header":true,"colspan":1,"rowspan":1},{"text":"a–d","header":true,"colspan":1,"rowspan":1}],[{"text":"1 The coldest time is\u003cbr>2 The average amount of rain in a year\u003cbr>3 The temperature is 33°C\u003cbr>4 The coldest temperature at night","header":false,"colspan":1,"rowspan":1},{"text":"a between 2 pm and 4 pm.\u003cbr>b is −1°C.\u003cbr>c is 70 mm.\u003cbr>d at four o’clock in the morning.","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[{"id":"B02-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.\n4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.\n7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","screens":["# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult plac s a very difficult place to survive. Marco Rivera, our survival expert, has some tips.","4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.","7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention"],"sources":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png","width":772,"height":1040}],"kind":"reading"},{"id":"B02-RW-U04-material:RW-M03","title":"READING 1","pages":[85],"text":"## Living in the\n\n[IMAGE_1]\n\n## wettest\n\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.\n\nThey do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\n\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n\n## place on Earth\n\n4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.\n\n6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","screens":["## Living in the","[IMAGE_1]","## wettest","1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.","They do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher s AGE_1]\n\n## wettest\n\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.\n\nThey do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\n\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n\n## place on Earth\n\n4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.\n\n6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","screens":["## Living in the","[IMAGE_1]","## wettest","1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.","They do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.","Thunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.","## place on Earth","4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.","5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.","6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.","¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries","² landslide (n) a movement of rocks and soil down a hill","³ extreme (adj) the most unusual or most serious possible"],"sources":[{"page":85,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a1f5e578b13c616e8e76d361f62fa6b6f561918e32a9aea3bc73787a0924334.png"}],"kind":"material","sourceBlockIds":["b3602"]},{"id":"B02-RW-U04-material:RW-M04","title":"READING 2","pages":[89],"text":"# Surviving $^{1}$ the sea of sand\n\n## How to stay alive in the Sahara Desert\n\n## Euan Barr\n\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.\n\n4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.\n\n7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n\n[IMAGE_1]\n\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","screens":["# Surviving $^{1}$ the sea of sand","## How to stay alive in the Sahara Desert","## Euan Barr","1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.","2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.","3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.","4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.","5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.","6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.","7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.","8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.","[IMAGE_1]","$^{1}$ surviving (v) staying alive in dangerous situations  ","$^{2}$ signal (v) make a sign or wave to get somebody's attention"],"sources":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png"}],"kind":"material","sourceBlockIds":["b3635"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"adjective comparative superlative\ncold colder the coldest\nwet wetter the wettest\ndry drier the driest\nextreme more/less\nextreme\nthe most/least\nextreme\nlarge larger the largest\nbig bigger the biggest\ndangerous more/less\ndangerous\nthe most/least\ndangerous\neasy easier the easiest","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574af nlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/56d322018eede08d9a4aad7522ee19404ba4d10c93d6cffb459f6aa3632bf3c8.png"],"sourceHashes":["56d322018eede08d9a4aad7522ee19404ba4d10c93d6cffb459f6aa3632bf3c8"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a paragraph describing data from graphs."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about unusual weather."},{"label":"Reading skills","text":"Read for detail; use your knowledge to predict content."},{"label":"Critical thinking","text":"Analyze graphs."},{"label":"Grammar","text":"Use comparative and superlative adjectives."},{"label":"Academic writing skills","text":"Write topic sentences for descriptive paragraphs; write supporting sentences; give examples with like, such as, for example."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":80,"alt":""}}]}},{"id":"B02-RW-U04-classroom:resource:b3590","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/38e2303e9c2d27f8beeedb36093d9ccef202327bd804739af135dac7b88abcfc.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"crystal","pos":"(n)","definition":"a piece of something, for example salt or ice, that is solid with a regular shape","example":"A small ice crystal formed on the window.","wordAudio":"crystal","cardWord":false},{"term":"common","pos":"(adj)","definition":"found often in many places","example":"Storms are common in this area.","wordAudio":"common","cardWord":false},{"term":"form","pos":"(v)","definition":"to begin to exist","example":"Clouds form when warm air rises and cools.","wordAudio":"form","cardWord":false},{"term":"rise","pos":"(v)","definition":"to move upwards","example":"Warm air rises.","wordAudio":"rise","cardWord":false},{"term":"rotate","pos":"(v)","definition":"to turn in a circle","example":"The wheels rotate when the machine starts.","wordAudio":"rotate","cardWord":false},{"term":"atmosphere","pos":"(n)","definition":"the mixture of gases around the Earth","example":"The atmosphere around the Earth contains different gases.","wordAudio":"atmosphere","cardWord":false}]]}},{"id":"B02-RW-U04-classroom:video","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/696e5e7a5362a5fdcff7ee6cb250dbf8a596ed92e4350e0cbe8a9280569e6b92.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/596b2e1e2dbd90f5dcef7400-L2RW-U04.mp4","captions":[{"start":0,"end":4.4,"text":"The weather doesn't often surprise us."},{"start":5.42,"end":9.78,"text":"But sometimes the sky does some unusual things."},{"start":12.56,"end":16.42,"text":"Get ready to see some of the world's strangest weather."},{"start":18.76,"end":21.34,"text":"Do you see that circle around the sun?"},{"start":23.32,"end":25,"text":"That's a sun halo."},{"start":26.54,"end":28.96,"text":"Sun halos are like rainbows."},{"start":30.62,"end":33.98,"text":"In rainbows, the sun's light shines through rain."},{"start":35.98,"end":39.98,"text":"In sun halos, the light shines through ice crystals."},{"start":42.24,"end":44.86,"text":"Sun halos are more common in cold places."},{"start":46.82,"end":48.72,"text":"But you can see them anywhere."},{"start":50.78,"end":54.1,"text":"Just remember not to look directly at the sun."},{"start":55.82,"end":59.82,"text":"Sun halos can mean that a storm is coming soon."},{"start":61.4,"end":63.52,"text":"And here comes one now."},{"start":65.6,"end":67.96,"text":"This is a supercell storm."},{"start":69.8,"end":72.9,"text":"Supercell storms form when warm, wet air rises."},{"start":74.02,"end":76.44,"text":"Winds push and pull the wet air."},{"start":78.24,"end":80.44,"text":"Then it begins to rotate."},{"start":82.46000000000001,"end":85.38,"text":"Supercell storms happen all over the world."},{"start":86.24,"end":89.7,"text":"But they're most common in the central United States."},{"start":91.72,"end":95.56,"text":"There, about 30 % become tornadoes."},{"start":96.68,"end":97.4,"text":"Over water,"},{"start":97.8,"end":100.24000000000001,"text":"rotating air can cause waterspouts."},{"start":102.2,"end":104.8,"text":"You might think this is a tower of water."},{"start":105.92,"end":109.62,"text":"But waterspouts are a mix of air and water."},{"start":110.66,"end":113.62,"text":"They form between clouds and the ocean."},{"start":115.14,"end":117.6,"text":"Waterspouts are common in warm waters."},{"start":118.96000000000001,"end":124.86,"text":"Some waterspouts can be more than one ,500 meters tall\nwith very strong winds."},{"start":126.18,"end":129.08,"text":"Most waterspouts die in about five minutes."},{"start":130.42,"end":133.06,"text":"But some can be dangerous to ships,"},{"start":133.4,"end":133.8,"text":"planes,"},{"start":134.14,"end":134.92,"text":"and swimmers."},{"start":137.07999999999998,"end":139.4,"text":"Wet air doesn't only cause storms."},{"start":140.44,"end":143.07999999999998,"text":"It can make some amazing shapes."},{"start":144.26,"end":146.36,"text":"This is a lenticular cloud."},{"start":148.12,"end":152.04,"text":"They form when winds push wet air over high mountains."},{"start":155.68,"end":157.44,"text":"As the air gets colder,"},{"start":158.5,"end":161.24,"text":"lenticular clouds form like a cap."},{"start":162.06,"end":164.32,"text":"Lenticular clouds look strange."},{"start":164.74,"end":168,"text":"But they're not the strangest thing you can see in the\nsky."},{"start":171.48,"end":174.16,"text":"You're looking at the Northern Lights."},{"start":175.56,"end":180.02,"text":"These lights appear when energy from the sun enters the\nEarth's atmosphere."},{"start":181.4,"end":185.46,"text":"The best places to see the Northern Lights are close to\nthe North Pole."},{"start":186.88,"end":188.24,"text":"In countries like Canada,"},{"start":188.86,"end":189.14,"text":"Norway,"},{"start":189.6,"end":190.3,"text":"and Iceland."}],"launchInline":true}},{"id":"B02-RW-U04-classroom:material:RW-M03","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[85],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a1f5e578b13c616e8e76d361f62fa6b6f561918e32a9aea3bc73787a0924334.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## Living in the\n[IMAGE_1]\n## wettest\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.","sourcePage":85},{"body":"They do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n## place on Earth","sourcePage":85},{"body":"4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.","sourcePage":85},{"body":"6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","sourcePage":85}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U04-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Living in the","pages":[{"page":85,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a1f5e578b13c616e8e76d361f62fa6b6f561918e32a9aea3bc73787a0924334.png","width":772,"height":1040}],"source":85,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## Living in the\n[IMAGE_1]\n## wettest\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.","sourcePage":85},{"body":"They do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n## place on Earth","sourcePage":85},{"body":"4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.","sourcePage":85},{"body":"6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","sourcePage":85}],"text":"## Living in the\n[IMAGE_1]\n## wettest\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.\nThey do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n## place on Earth\n4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.\n6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_e0392ecab36b7ddc.mp3"},"original":{"id":"B02-RW-U04-material:RW-M03","entry":"material:RW-M03","unitId":"B02-RW-U04","book":2,"track":"RW","unit":4,"title":"READING 1","kind":"material","pages":[85],"sourceImages":[{"page":85,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6a1f5e578b13c616e8e76d361f62fa6b6f561918e32a9aea3bc73787a0924334.png","viewEvidenceReported":true}],"text":"## Living in the\n\n[IMAGE_1]\n\n## wettest\n\n1 Every year the people living in the state of Meghalaya, in north-east India, spend many months preparing for heavy rain. The rains, called the summer monsoon¹, can last for days or weeks without stopping. The Guinness Book of World Records says that Meghalaya, which means 'abode of clouds', is one of the wettest places on Earth. It gets almost 12,000 millimetres (about 470 inches) of rain each year. Compare this to the Sahara Desert, the world's largest hot desert, which gets between 100 and 250 millimetres (4–10 inches). Summer monsoons usually last from April until October. They can change the lives of a fifth of the world's population.\n\nThey do this so that the noise from the rain falling on their roof, windows and walls is not as loud. Although rain may not get into the home, the walls inside can feel a bit wet because the fog from outside comes into the house. Sometimes, the rain is so loud that the schools have to close because the children cannot hear what the teacher says in the lesson.\n\nThunder and lightning can damage electricity cables and stop the power supply. Homes and businesses can be without electricity for many days. If people do not have electricity, they cannot turn on their lights or cook their food. It also means it is very dark inside because, even during the day, the sun is behind the clouds. In addition, because there is often no sun for weeks, clothes do not dry very well and can have a strange, bad smell.\n\n## place on Earth\n\n4 Landslides² are dangerous because they can badly damage buildings or even whole villages. They can also damage roads and stop access to water. This means there is not enough clean water for people to drink. In 2021, there was a landslide in Mumbai, India. It fell on people's homes as they were sleeping, and several people died.\n\n5 They still go to work and shops open. In Mawsynram, people make things called knups, using bamboo and grass. Knups are like umbrellas, but they are a bit bigger and shaped like a tortoise. One knup takes about an hour to make. A knup can keep somebody dry from their head to their knees. Some people who work in their homes use the monsoon as a business opportunity. For example, they make knups for the six-month monsoon season and sell them to visitors.\n\n6 Research suggests that climate change caused by human activity, such as industry and agriculture, will make a difference. In India, for example, the monsoon season is likely to get wetter and more dangerous because extreme³ rainfall events will happen more often.\n\n¹ monsoon (n) a season when there is heavy rain, mostly in Asian countries\n² landslide (n) a movement of rocks and soil down a hill\n³ extreme (adj) the most unusual or most serious possible","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3602"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_e0392ecab36b7ddc.mp3","continueOnPage":true}},{"id":"B02-RW-U04-classroom:material:RW-M04","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.","sourcePage":89},{"body":"4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.","sourcePage":89},{"body":"7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","sourcePage":89}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U04-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Surviving $^{1}$ the sea of sand","pages":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png","width":772,"height":1040}],"source":89,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.","sourcePage":89},{"body":"4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.","sourcePage":89},{"body":"7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","sourcePage":89}],"text":"# Surviving $^{1}$ the sea of sand\n## How to stay alive in the Sahara Desert\n## Euan Barr\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.\n4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.\n7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n[IMAGE_1]\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_fe74950e306c8aee.mp3"},"original":{"id":"B02-RW-U04-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U04","book":2,"track":"RW","unit":4,"title":"READING 2","kind":"material","pages":[89],"sourceImages":[{"page":89,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/76b578b2e0bb52ad1bfe28fb551adfb68d583206010a1209b111bf356b774c74.png","viewEvidenceReported":true}],"text":"# Surviving $^{1}$ the sea of sand\n\n## How to stay alive in the Sahara Desert\n\n## Euan Barr\n\n1 Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert, the largest hot desert in the world. It covers 11 countries in North Africa and is over 9 million square kilometres. That's more than $25\\%$ of Africa.\n\n2 In the Sahara, temperatures are very different during the day and at night. It is much hotter during the day than at night. During the day, the hottest time is between 2 pm and 4 pm, when temperatures rise to 33 °C. But it is very cold at night – the coldest time is at 4 am, when temperatures fall to -1 °C. Though not the driest place in the world, the Sahara is very dry. The average precipitation in a year is only 70 millimetres.\n\n3 Because of the extreme temperatures in the desert, it is a very difficult place to survive. Marco Rivera, our survival expert, has some tips.\n\n4 Take warm clothes and a blanket. You will need a hat, long trousers and a woollen jumper to keep you warm at night. During the day, cover your body, head and face. Clothes protect you from the sun and keep water in your body. You will also need a warm blanket at night. It can get cold very quickly. When the temperature drops, it can be a shock and make you feel even colder.\n\n5 A car is easier to see than a person walking in the desert. You can also use the mirrors from your car to signal $^{2}$ to planes and other cars. You can use your car tyres to make a fire. A fire is easy to see. It will help people find you and it will keep you warm at night.\n\n6 Try to drink some water at least once every hour. You need your water to last as long as possible. Drink only what you need. When you talk, you lose water from your body. Keep your mouth closed and do not talk.\n\n7 If you eat, you will get thirsty and drink all of your water more quickly. You can eat a little, but only to stop you from feeling very hungry. Eat very small amounts of food and eat very slowly. You can live for three weeks with no food, but you can only live for three days without water.\n\n8 It is very important to stay out of the sun during the day. Make a hole under your car and lie there. This will keep you cool and help you sleep. Find a warm place to sleep at night. A spot near a tree or a rock will be the warmest. But be careful before you decide where to sleep. Dangerous animals like snakes and scorpions also like to sleep in these places. Look carefully for animals before you lie down.\n\n[IMAGE_1]\n\n$^{1}$ surviving (v) staying alive in dangerous situations  \n$^{2}$ signal (v) make a sign or wave to get somebody's attention","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3635"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_fe74950e306c8aee.mp3","continueOnPage":true}},{"id":"B02-RW-U04-classroom:review-1","book":2,"unit":4,"track":"RW","topic":"WEATHER AND CLIMATE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[101],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36b45cabfc60552ab43425734bdf65d99c1c21ce77c05d62d6853c050d864c22.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B02-RW-U04-B-001","form":"almost","page":101},{"id":"B02-RW-U04-B-002","form":"careful","page":101},{"id":"B02-RW-U04-B-003","form":"cover","page":101},{"id":"B02-RW-U04-B-004","form":"dangerous","page":101},{"id":"B02-RW-U04-B-006","form":"decrease","page":101},{"id":"B02-RW-U04-B-007","form":"drop","page":101},{"id":"B02-RW-U04-B-008","form":"fall","page":101},{"id":"B02-RW-U04-B-009","form":"huge","page":101},{"id":"B02-RW-U04-B-010","form":"increase","page":101},{"id":"B02-RW-U04-B-011","form":"last","page":101},{"id":"B02-RW-U04-B-012","form":"lightning","page":101},{"id":"B02-RW-U04-B-013","form":"maximum","page":101},{"id":"B
