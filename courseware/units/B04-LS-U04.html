es might be colder or hotter\nthan usual, and seasons may be shorter\nor longer. Sources of food (plants or\nother animals) might be disappearing.\n3 Endangered animal species include\nthe giant panda, the tiger, and the\norangutan. Sea turtles, polar bears and\npenguins are also greatly affected by\nclimate change.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6062","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":3,"module":"WATCH AND LISTEN","ex":"2","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"You are going to watch a video about the effects of climate change on wildlife. Before you watch, look at the photos from the video. Discuss the questions with your partner.","pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ed1e08be179f3dda1b0a0e1ba85250e8b5df2bcdf55a499fa40a07f16e0b8a08.png"],"provided":"","items":[{"id":"b6062.i01","label":"1","prompt":"What types of animal do you see, and what are their natural habitats?","options":[],"type":"discuss/open"},{"id":"b6062.i02","label":"2","prompt":"How do you think the natural habitats of these particular animals might be changing?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6062.i01","label":"1","prompt":"What types of animal do you see, and what are their natural habitats?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6062.i02","label":"2","prompt":"How do you think the natural habitats of these particular animals might b d":"bears foxes parrots salmon\n## How some plants and animals are adapting to climate change\n(1)____: body parts are changing\n(2)____ and (3)____: breeding with different animals of the same species\n(4)____: moving to a different location where temperatures are different\n(5)____: travelling at a different time of year","items":[{"id":"b6065.i01","label":"1","prompt":"(1)____: body parts are changing","options":["bears","foxes","parrots","salmon"],"type":"choice/closed"},{"id":"b6065.i02","label":"2","prompt":"(2)____ and (3)____: breeding with different animals of the same species","options":["bears","foxes","parrots","salmon"],"type":"choice/closed"},{"id":"b6065.i03","label":"3","prompt":"(2)____ and (3)____: breeding with different animals of the same species","options":["bears","foxes","parrots","salmon"],"type":"choice/closed"},{"id":"b6065.i04","label":"4","prompt":"(4)____: moving to a different location where temperatures are different","options":["bears","foxes","parrots","salmon"],"type":"choice/closed"},{"id":"b6065.i05","label":"5","prompt":"(5)____: travelling at a different time of year","options":["bears","foxes","parrots","salmon"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"bears foxes parrots salmon"},{"kind":"text","text":"## How some plants and animals are adapting to climate change"},{"kind":"text","text":"(1)____: body parts are changing"},{"kind":"text","text":"(2)____ and (3)____: breeding with different animals of the same species"},{"kind":"text","text":"(4)____: moving to a different location where temperatures are different"},{"kind":"text","text":"(5)____: travelling at a different time of year"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/618dae74ea75a7b1cc78629e-L4LS-U04.mp4","captions":[{"start":6.42,"end":14.86,"text":"Climate change is disrupting the life cycles of\nmillions of plants and animals."},{"start":16.04,"end":25.26,"text":"Researchers have warned that up to 27 % of all plant\nand animal species could disappear before the end of\nthe century."},{"start":26.54,"end":30.34,"text":"But some animals are adapting to our changing planet."},{"start":31.58,"end":34.5,"text":"Many animals migrate with the changing seasons."},{"start":36.34,"end":37.74,"text":"As temperatures rise,"},{"start":38.12,"end":43.06,"text":"one species of salmon is now migrating two weeks\nearlier than it used to."},{"start":43.78,"end":50.8,"text":"The Alaskan waters where these pink salmon breed are\nnow one degree warmer than they were 40 years ago."},{"start":51.12,"end":53.34,"text":"But the number of salmon hasn't dropped."},{"start":54.08,"end":60.5,"text":"Scientists believe that this change in behavior is\nhelping the species to survive climate change."},{"start":62.28,"end":63.26,"text":"Away from the water,"},{"start":63.8,"end":67.74,"text":"scientists have found the bodies of some species are\nalso adapting."},{"start":68.7,"end":80.22,"text":"The average beak sizes of some parrots in Australia and\nthe medium ground finch in the Galapagos Islands have\ngrown by as much as ten % since 1871."},{"start":80.22,"end":85.46000000000001,"text":"Small beaked birds don't do well in drier, hotter\nsummers,"},{"start":86.14,"end":91.06,"text":"but larger beaks improve these birds' ability to stay\ncool in the heat."},{"start":92.52000000000001,"end":97.06,"text":"A different way to adapt is by cross -breeding with\nanother species."},{"start":98.06,"end":100.06,"text":"In the deserts of North Africa,"},{"start":100.47999999999999,"end":106.7,"text":"the fennec fox shares parts of its territories with the\nrupel's fox and the red fox."},{"start":107.78,"end":111.02000000000001,"text":"Historically, cross -breeding between these species\noccurred,"},{"start":111.5,"end":116.22,"text":"which improved the chances of survival for the rupels\nand the red fox."},{"start":117.12,"end":122.64,"text":"From the fennec fox, they gained a better ability to\nretain water in this dry region."},{"start":124.88,"end":125.44,"text":"Today,"},{"start":126.02,"end":129.96,"text":"climate change is bringing different species together\nfor the first time."},{"start":130.7,"end":138.06,"text":"Due to the declining amount of ice, polar bears have\nbeen forced to spend more time in the summer on land,"},{"start":138.46,"end":142.76,"text":"while grizzly bears move northward to seek out the\ncooler climate."},{"start":144,"end":149.42000000000002,"text":"Their cross -breeding has resulted in a variation known\nas growler or pisley bears."},{"start":150.62,"end":154.36,"text":"Sharing each other's genes may help these bears to\nsurvive."},{"start":154.36,"end":162.52,"text":"Only time will allow us to see which species can\nrespond fast enough to survive climate change."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Parrots 2 Bears / Foxes 3 foxes / bears\n4 Bears 5 Salmon","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":39,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6066","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"Watch again and make notes on why this information is important. Then compare your answers with a partner.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/235ae591d231369391bdfa73733397abdc390d17883b1a5f553e  dynamic and always changing. Around 10,000 years ago, half the planet was covered with ice. Now, however, it's only 10% ...","items":[],"layout":"list","references":[{"id":"B04-LS-U04-question:b6080","kind":"student-work","title":"LISTENING 1 Ex 5","pages":[86]}],"materials":[],"coursePages":[[{"kind":"text","text":"The Earth is dynamic and always changing. Around 10,000 years ago, half the planet was covered with ice. Now, however, it's only 10% ..."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"The natural environment is always at risk\nfrom natural forces. For example, in 1991, a\nvolcano in the Philippines erupted, destroying\n800 km2 of land. Rivers were flooded because\nof the ash from the volcano.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6083","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":13,"module":"LISTENING 1","ex":"7","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"4.2 Listen to three extracts from the lecture. Choose the statement (a–c) that best matches the lecturer's opinion in each one.","pages":[87],"sourceImages":["https://raw.githubusercontent ts. [/ /] Much like the foxes of London, [/ /]\nraccoons living in the city are known to eat rubbish out\nof bins, [/ /] steal food from people’s homes [/ /] and\noccasionally bite people.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":40,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6089","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":16,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"instruction":"Practise saying the paragraphs in Exercises 8 and 9 with a partner. Listen again","pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/91e6dd14fd103bf9b589e132f48d44d5e522826d52ae5329114f639357a59563.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U04-question:b6086","kind":"material-reference","title":"LISTENING 1 Ex 8","pages":[87]},{"id":"B04-LS-U04-question:b6088","kind":"material-reference","title":"LISTENING 1 Ex 9","pages":[88]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U04-publisher-sheet:b6088","title":"LISTENING 1 Ex 9 原题面","pages":[88],"text":"One other animal that is as at home in the city as in the countryside is the raccoon. In fact, raccoons are so at home in the city that the number of city raccoons has increased. Raccoons have different diets depending on their environment. Common foods include fruit, plants, nuts and rodents. Much like the foxes of London, raccoons living in the city are known to eat rubbish out of bins, steal food from people's homes and occasionally bite people.","screens":["One other animal that is as at home in the city as in the countryside is the raccoon. In fact, raccoons are so at home in the city that the number of city raccoons has increased. Raccoons have different diets depending on their environment. Common foods include fruit, plants, nuts and rodents. Much like the foxes of London, raccoons living in the city are known to eat rubbish out of bins, steal food from people's homes and occasionally bite people."],"sources":[{"page":88,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/91e6dd14fd103bf9b589e132f48d44d5e522826d52ae5329114f639357a59563.png"}],"kind":"task_sheet","sourceBlockIds":["b6088"]},{"id":"B04-LS-U04-publisher-sheet:b6086","title":"LISTENING 1 Ex 8 原题面","pages":[87],"text":"In some places, //habitats haven't been destroyed, //but they have been broken into parts, // for example // separated by roads. // This is called fragmentation. // If animals are used to moving around throughout the year // and a road is built through the middle of their habitat, // fragmentation can cause serious problems.","screens":["In some places, //habitats haven't been destroyed, //but they have been broken into parts, // for example // separated by roads. // This is called fragmentation. // If animals are used to moving around throughout the year // and a road is built through the middle of their habitat, // fragmentation can cause serious problems."],"sources":[{"page":87,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/71c162ecb3e67b94cbaf04b4fd008f98dee3d6b84d005343c801bf7b194312be.png"}],"kind":"task_sheet","sourceBlockIds":["b6086"]}],"courseMedia":[{"type":"audio","title":"Track 4.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b45946f45de66a3b03f598eff0e6443a42b01fe1ad722ca2a62d89b59ec7ba1.mp3"}],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[{"page":88,"text":"保留原抽取字段，verifiedInstruction按原页给出；去掉多余再听动作。"}],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6091","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":17,"module":"LISTENING 1","ex":"11","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Discuss the questions.","pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/91e6dd14fd103bf9b589e132f48d44d5e522826d52ae5329114f639357a59563.png"],"provided":"","items":[{"id":"b6091.i01","label":"1","prompt":"From what you remember from the lecture, what is 'ecotourism'?","options":[],"type":"discuss/open"},{"id":"b6091.i02","label":"2","prompt":"Have you ever been, or would you like to go, on an ecotourism holiday? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b6091.i03","label":"3","prompt":"What place in your country could be an ecotourism destination?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6091.i01","label":"1","prompt":"From what you remember from the lecture, what is 'ecotourism'?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6091.i02","label":"2","prompt":"Have you ever been, or would you like to go, on an ecotourism holiday? Why / Why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6091.i03","label":"3","prompt":"What place in your country could be an ecotourism destination?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Ecotourism allows people to go on\nholiday to natural, unspoilt areas where\nthey learn about the local environment\nand help to preserve it.\n2 I’ve never done anything that could be\ndescribed as ecotourism. I wouldn’t like\nto, because I think that places always\nbecome spoiled or damaged when\ntourists start to visit them, however\nhard they try not to. / I’d like to go on\nan ecotourism holiday. I’d like to do\nsomething to actively help the place, like\nrepairing paths or recording wildlife.\n3 There is an interesting island off the\ncoast in my country where there are lots\nof birds, butterflies and rare flowers.\nOnly a few people know about it, but it’s\nan amazing place to experience nature.\nIf it became an ecotourism destination, it\nwould be easy to manage the number of\nvisitors to the island each day.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6092","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":18,"module":"LISTENING 1","ex":"12","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Write a paragraph describing an ecotourism destination (or a possible destination) in your country. Write around 200 words. Mention these things:","pages":[88],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/91e6dd14fd103bf9b589e132f48d44d5e522826d52ae5329114f639357a59563.png"],"provided":"• what wildlife can be seen there\n• what people can learn about nature\n• how visiting this place can help preserve it\n• what negative impact tourism might have on the local environment","items":[{"id":"b6092.i01","label":"1","prompt":"Write a paragraph describing an ecotourism destination (or a possible destination) in your country (around 200 words), mentioning the four points listed.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"• what wildlife can be seen there"},{"kind":"text","text":"• what people can learn about nature"},{"kind":"text","text":"• how visiting this place can help preserve it"},{"kind":"text","text":"• what negative impact tourism might have on the local environment"},{"kind":"item","id":"b6092.i01","label":"1","prompt":"Write a paragraph describing an ecotourism destination (or a possible destination) in your country (around 200 words), mentioning the four points listed.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"There is a very small area of ancient\nrainforest in the centre of my country. It’s\nonly the size of about 500 football pitches,\nbut a lot of wildlife can be seen there,\nincluding unusual species of bird, bats\nand other small mammals. But the most\ninteresting thing about it is its plant life.\nExtremely rare species of plant can be\nfound there, that only grow in a few other\nplaces around the world. One thing people\ncan immediately learn is how much damage\nwe have done to our environment. Only a\nthousand years ago, most of my country\nwas covered in rainforest like this. Now,\nonly tiny pockets still exist. Visiting this\nplace can remind people of what we’ve\nlost, and how – if we’re very careful – we\ncan perhaps one day encourage these\nancient forests to start growing back. One\nof the problems with encouraging people\nto visit this area is that they don’t always\nwalk on the official paths. This means that\nrare and sensitive plant life is sometimes","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6096","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"MULTI-WORD PREPOSITIONS"},"instruction":"Work with a partner. Match the multi-word prepositions in bold in the sentences (1–5) to the reasons for using them below (a–e). Then match the prepositions to the synonyms in the box. There is one preposition for which there is no match, and one for which there are two synonyms.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/14883297b21d71a85415af4a06871aa9746483503ff15f273b5005a62c10bbce.png"],"provided":"along with as well as due to except for instead of\na making an exception\nb giving a source\nc making another choice\nd adding another piece of information\ne giving a reason","items":[{"id":"b6096.i01","label":"1","prompt":"We couldn'  some information you've recently heard or read about the environment. Give a source.","options":[],"type":"discuss/open"},{"id":"b6098.i04","label":"4","prompt":"Talk about some ideas for protecting the environment that you think will work. Include an exception.","options":[],"type":"discuss/open"},{"id":"b6098.i05","label":"5","prompt":"Talk about how you thought about going on an ecotourism holiday, but didn't. Say why you made another choice.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U04-question:b6096","kind":"material-reference","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[89]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Talk about something you didn't want to do recently, related to the environment. Say why, then give an additional reason."},{"kind":"text","text":"I drove to school today. I didn't want to, as I usually cycle, but the weather was bad. As well as that, I wasn't feeling well."},{"kind":"text","text":"2 Talk about a time when you enjoyed nature. Give a reason why."},{"kind":"text","text":"3 Talk about some information you've recently heard or read about the environment. Give a source."},{"kind":"text","text":"4 Talk about some ideas for protecting the environment that you think will work. Include an exception."}],[{"kind":"text","text":"5 Talk about how you thought about going on an ecotourism holiday, but didn't. Say why you made another choice."}]],"courseMaterials":[{"id":"B04-LS-U04-publisher-sheet:b6096","title":"LANGUAGE DEVELOPMENT Ex 1 原题面","pages":[89],"text":"along with as well as due to except for instead of\na making an exception\nb giving a source\nc making another choice\nd adding another piece of information\ne giving a reason","screens":["along with as well as due to except for instead of","a making an exception","b giving a source","c making another choice","d adding another piece of information","e giving a reason"],"sources":[{"page":89,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/14883297b21d71a85415af4a06871aa9746483503ff15f273b5005a62c10bbce.png"}],"kind":"task_sheet","sourceBlockIds":["b6096"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 I had a nice walk in the forest recently\nand really enjoyed it due to all the birds\nI saw and heard.\n3 According to an article I saw online, for\neach person on Earth, there are 422 trees!\n4 I think using less electricity and taking\npublic transport are good ways of\nprotecting the environment, apart from\nfor short journeys, where you can walk\nor cycle.\n5 I was going to book an ecotourism\nholiday to Costa Rica, but instead of\nthat, I decided to visit my friend in\nGreece because it’s easier and cheaper\nto get there.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6101","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"PAST PERFECT"},"instruction":"Work with a partner. Complete this extract from a student's essay on Rachel Carson with either the past simple or past perfect form of the verbs in brackets. Think about what the main events are, and what the background information before those main events is.","pages":[91],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e04f2b50157b90627d0222ddf554c6362829a8d11be795821120af4462a2be43.png"],"provided":"Before she (1)____ (write) her influential book Silent Spring in 1962, Rachel Carson (2)____ (spend) years working for the US government at environmental agencies like the US Bureau of Fisheries and the US Fish and Wildlife Service. During her time there, she (3)____ (do) her own personal research and writing. By 1955, Carson (4)____ (already / publish) several books on environmental research when she (5)____ (begin) to do research full time. One subject that she was particularly interested in was the effects of pesticides¹ on the environment and on human health. During World War II, the government (6)____ (use) the pesticide DDT to protect people against diseases caused by pests. After the war, farmers (7)____ (spray) large amounts of DDT into the air to protect their crops. Carson (8)____ (hear) that the chemical was making people ill with cancer and was causing animals to die, so she (9)____ (decide) to do scientific research on the subject and publish it as a book, to warn people about the risks. After Carson (10)____ (release) Silent Spring, the pesticide industry (11)____ (attack) her for her research. However, the US government (12)____ (respond) by banning the use of DDT in the United States. Soon her book was translated into several languages and was published around the world.\n\n¹ pesticides (n) chemicals used to kill pests like insects and small animals.","items":[{"id":"b6101.i01","label":"1","prompt":"Before she (1)____ (write) her influential book Silent Spring in 1962","options":[],"type":"gap/closed"},{"id":"b6101.i02","label":"2","prompt":"Rachel Carson (2)____ (spend) years working for the US government at environmental agencies like the US Bureau of Fisheries and the US Fish and Wildlife Service.","options":[],"type":"gap/closed"},{"id":"b6101.i03","label":"3","prompt":"During her time there, she (3)____ (do) her own personal research and writing.","options":[],"type":"gap/closed"},{"id":"b6101.i04","label":"4","prompt":"By 1955, Carson (4)____ (already / publish) several books on environmental research","options":[],"type":"gap/closed"},{"id":"b6101.i05","label":"5","prompt":"when she (5)____ (begin) to do research full time.","options":[],"type":"gap/closed"},{"id":"b6101.i06","label":"6","prompt":"During World War II, the government (6)____ (use) the pesticide DDT to protect people against diseases caused by pests.","options":[],"type":"gap/closed"},{"id":"b6101.i07","label":"7","prompt":"After the war, farmers (7)____ (spray) large amounts of DDT into the air to protect their crops.","options":[],"type":"gap/closed"},{"id":"b6101.i08","label":"8","prompt":"Carson (8)____ (hear) that the chemical was making people ill with cancer and was causing animals to die","options":[],"type":"gap/closed"},{"id":"b6101.i09","label":"9","prompt":"so she (9)____ (decide) to do scientific research on the subject and publish it as a book, to warn people about the risks.","options":[],"type":"gap/closed"},{"id":"b6101.i10","label":"10","prompt":"After Carson (10)____ (release) Silent Spring","options":[],"type":"gap/closed"},{"id":"b6101.i11","label":"11","prompt":"the pesticide industry (11)____ (attack) her for her research.","options":[],"type":"gap/closed"},{"id":"b6101.i12","label":"12","prompt":"However, the US government (12)____ (respond) by banning the use of DDT in the United States.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Before she (1)____ (write) her influential book Silent Spring in 1962, Rachel Carson (2)____ (spend) years working for the US government at environmental agencies like the US Bureau of Fisheries and the US Fish and Wildlife Service. During her time there, she (3)____ (do) her own personal research and writing. By 1955, Carson (4)____ (already / publish) several books on environmental research when she (5)____ (begin) to do research full time. One subject that she was particularly interested in was the effects of pesticides¹ on the environment and on human health. During World War II, the government (6)____ (use) the pesticide DDT to protect people against diseases caused by pests. After the war, farmers (7)____ (spray) large amounts of DDT into the air to protect their crops. Carson (8)____ (hear) that the chemical was making people ill"}],[{"kind":"text","text":"with cancer and was causing animals to die, so she (9)____ (decide) to do scientific research on the subject and publish it as a book, to warn people about the risks. After Carson (10)____ (release) Silent Spring, the pesticide industry (11)____ (attack) her for her research. However, the US government (12)____ (respond) by banning the use of DDT in the United States. Soon her book was translated into several languages and was published around the world."},{"kind":"text","text":"¹ pesticides (n) chemicals used to kill pests like insects and small animals."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6102","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"PAST PERFECT"},"instruction":"4.5 Listen and check.","pages":[91],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e04f2b50157b90627d0222ddf554c6362829a8d11be795821120af4462a2be43.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 4.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8ab86eaa148c63d71dcdfe9c36d43c31225b01bd12efd41b9f1cb0108b164fde.mp3"}],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6103","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":24,"module":"LANGUAGE DEVELOPMENT","ex":"6","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"PAST PERFECT"},"instruction":"Work with a partner. Read the information and discuss which past simple verbs should be changed to the past perfect, then correct the text. In some cases, either tense can be used.","pages":[91],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e04f2b50157b90627d0222ddf554c6362829a8d11be795821120af4462a2be43.png"],"provided":"My friend lives in Sicily in Italy, and has lived there for about ten years. She never experienced had never experienced an erupting volcano before last year. She told me that the volcano near her city burst into action on a Sunday night. People knew this was going to happen, so all flights were stopped.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"My friend lives in Sicily in Italy, and has lived there for about ten years. She never experienced had never experienced an erupting volcano before last year. She told me that the volcano near her city burst into action on a Sunday night. People knew this was going to happen, so all flights were stopped."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"My friend lives in Sicily in Italy, and has lived there for\nabout ten years. She had never experienced an erupting\nvolcano before last year. She told me that the volcano\nnear her city (had) burst into action on a Sunday night.\nPeople had known this was going to happen, so all flights\nwere stopped. Nobody (had) asked people in the city\nto evacuate, though. On the Monday morning, people\nwoke up / had woken up to find the streets and all the\ncars covered in a grey ash. It was ash that had come from\nthe volcano. Everything looked so strange! Soon, the\nlocal mayor decided to ban people from using bikes or\nmotorbikes, and instructed people to drive their cars no\nfaster than 30 kilometres an hour. This was because the\nroads had become extremely slippery because of the ash.\nBefore the ban, there had been quite a few accidents.\nLuckily, however, that was probably the most serious\nconsequence of the eruption.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6106","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":25,"module":"LANGUAGE DEVELOPMENT","ex":"7","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS TO DESCRIBE ENVIRONMENTAL CHANGE"},"instruction":"Read the definitions. Complete the sentences with the correct form of the verbs in bold.","pages":[92],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/67cc5dfa366df6f84bef63e00e777608f22dfcebbb3a82e796a1bed0c78d3968.png"],"provided":"","items":[{"id":"b6106.i01","label":"1","prompt":"Most extinct species could have ____ if people had taken more care to protect them.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"id":"b6106.i02","label":"2","prompt":"The number of wild animals in my country has ____ sharply over the last 30 years.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"id":"b6106.i03","label":"3","prompt":"Natural resources can easily be ____ from endangered habitats without destroying them.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"id":"b6106.i04","label":"4","prompt":"People have ____ the environment in my country quite negatively, for example by destroying forests.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"id":"b6106.i05","label":"5","prompt":"Changes to the environment won't negatively ____ people.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"id":"b6106.i06","label":"6","prompt":"I don't think we are ____ all our skill and knowledge to fighting climate change.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"id":"b6106.i07","label":"7","prompt":"Humans are destroying places which have ____ large numbers of wildlife species for centuries.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6106.i01","label":"1","prompt":"Most extinct species could have ____ if people had taken more care to protect them.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"kind":"item","id":"b6106.i02","label":"2","prompt":"The number of wild animals in my country has ____ sharply over the last 30 years.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"}],[{"kind":"item","id":"b6106.i03","label":"3","prompt":"Natural resources can easily be ____ from endangered habitats without destroying them.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"kind":"item","id":"b6106.i04","label":"4","prompt":"People have ____ the environment in my country quite negatively, for example by destroying forests.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"}],[{"kind":"item","id":"b6106.i05","label":"5","prompt":"Changes to the environment won't negatively ____ people.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"},{"kind":"item","id":"b6106.i06","label":"6","prompt":"I don't think we are ____ all our skill and knowledge to fighting climate change.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"}],[{"kind":"item","id":"b6106.i07","label":"7","prompt":"Humans are destroying places which have ____ large numbers of wildlife species for centuries.","options":["affect","apply","decline","extract","impact","support","survive"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 survived 2 declined 3 extracted 4 impacted/\naffected 5 affect/impact 6 applying 7 supported","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6107","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":26,"module":"LANGUAGE DEVELOPMENT","ex":"8","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS TO DESCRIBE ENVIRONMENTAL CHANGE"},"instruction":"Work with a partner. Say which sentences in Exercise 7 you agree with, and give reasons.","pages":[92],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/67cc5dfa366df6f84bef63e00e777608f22dfcebbb3a82e796a1bed0c78d3968.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U04-question:b6106","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 7","pages":[92]}],"materials":[],"coursePages":[[{"kind":"text","text":"Most extinct species could have ____ if people had taken more care to protect them."},{"kind":"text","text":"The number of wild animals in my country has ____ sharply over the last 30 years."},{"kind":"text","text":"Natural resources can easily be ____ from endangered habitats without destroying them."},{"kind":"text","text":"People have ____ the environment in my country quite negatively, for example by destroying forests."},{"kind":"text","text":"Changes to the environment won’t negatively ____ people."},{"kind":"text","text":"I don’t think we are ____ all our skill and knowledge to fighting climate change."}],[{"kind":"text","text":"Humans are destroying places which have ____ large numbers of wildlife species for centuries."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think this is true, as most animals\nbecame extinct because people hunted\nthem. / This is unlikely to be true,\nbecause a lot of animals became extinct\nbefore humans were even around.\n2 I think this is true. I’ve noticed that there\nare fewer birds, maybe because there\naren’t so many insects as there used to\nbe. / I think the number of birds is the\nsame as it always has been, although it\nprobably isn’t increasing. So I don’t think\nthings are that bad.\n3 I think it’s impossible to extract resources\nsuch as coal or oil without completely\ndestroying an area. / It depends on what\nthe resource is. It might, for example,\nbe possible to take energy from rivers\nwithout causing a lot of damage.\n4 Over the centuries, this is definitely\ntrue. My country used to have a lot of\nforests, and now it has hardly any. / I\nthink my country has done a good job\nof protecting its environment and I hope\nthis continues.\n5 People are less likely to be affected\nthan animals, but there’s no way we can\ncompletely hide from environmental\ndamage. / I don’t think environmental\nchange affects people nearly as badly as\nit affects animals.\n6 Climate change is the most serious\nproblem we face, and we should apply\nevery solution that we possibly can to deal\nwith it. / I think that scientists are applying\nall possible solutions to dealing with\nclimate change. It’s governments that have\nto take action about these solutions.\n7 This is true, as rainforests hold huge\nnumbers of animals and plants, and\nthese are being destroyed at an\nalarming rate. / I think this is less true\nthan in the past because we are doing\nmore to protect natural habitats.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":41,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6110","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":27,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner and discuss the questions.","pages":[93],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f224af3d5f9cabbcaf80eee9b00c15445ef42c163cd9f61182b2e1e03264149.png"],"provided":"","items":[{"id":"b6110.i01","label":"1","prompt":"What is a desert?","options":[],"type":"discuss/open"},{"id":"b6110.i02","label":"2","prompt":"Are there any desert areas in your country? If so, where are they?","options":[],"type":"discuss/open"},{"id":"b6110.i03","label":"3","prompt":"What kinds of plants or animals do you find in the desert?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6110.i01","label":"1","prompt":"What is a desert?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6110.i02","label":"2","prompt":"Are there any desert areas in your country? If so, where are they?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6110.i03","label":"3","prompt":"What kinds of plants or animals do you find in the desert?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 A desert is a large area that gets hardly\nany rain, and so very little grows there. Not\nmany people can survive in such places.\n2 There aren’t any deserts in my country,\nbecause there is quite a lot of rainfall. /\nMost of my country is desert, except\nsome areas near the coast and rivers.\n3 Desert plants include types of cactus,\nwhich can store water for a long\ntime. Desert animals are usually small\nmammals that come out at night, along\nwith lots of reptile or insect species that\nlive underground during the day. There\nare also larger animals such as camels\nthat are able to survive for long periods\nwithout water.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6111","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":28,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a talk about desert habitats. Before you listen, read the sentences (1–7). Work with a partner and discuss the meaning of the words in bold. Then write each word next to its definition (a–g) below.","pages":[93],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f224af3d5f9cabbcaf80eee9b00c15445ef42c163cd9f61182b2e1e03264149.png"],"provided":"1 Antarctica is the world's largest desert. It's larger than the Sahara and has very harsh winters with extremely cold temperatures.\n2 Alaska is the last great wilderness. There is still so much land that has not been used or built on, and has remained in its natural state.\n3 Researchers collected minerals to find out more about what is in the soil.\n4 Diamond is the hardest naturally occurring substance on Earth.\n5 The electrical company installed copper wires in the new building.\n6 Many countries use natural gas found below the Earth's surface to heat their homes.\n7 The government has banned coal mining in certain areas where it could be extremely dangerous to the environment.","items":[{"id":"b6111.i01","label":"a","prompt":"____: (n) the industry or activity of removing valuable substances from the earth","options":["harsh","wilderness","minerals","diamond","copper","natural gas","mining"],"type":"choice/closed"},{"id":"b6111.i02","label":"b","prompt":"____: (n) fuel for heating or cooking that is found underground","options":["harsh","wilderness","minerals","diamond","copper","natural gas","mining"],"type":"choice/closed"},{"id":"b6111.i03","label":"c","prompt":"____: (n) valuable or useful chemical substances that are formed naturally in the ground","options":["harsh","wilderness","minerals","diamond","copper","natural gas","mining"],"type":"choice/closed"},{"id":"b6111.i04","label":"d","prompt":"____: (n) a transparent, extremely hard precious stone that is used in jewellery, and in industry for cutting hard things","options":["harsh","wilderness","minerals","diamond","copper","natural gas","mining"],"type":"choice/closed"},{"id":"b6111.i05","label":"e","prompt":"____: (adj) severe and unpleasant","options":["harsh","wilderness","minerals","diamond","copper","natural gas","mining"],"type":"choice/closed"},{"id":"b6111.i06","label":"f","prompt":"____: (n) a place that is in a completely natural state without houses, industry, roads, etc.","options": nt/0f224af3d5f9cabbcaf80eee9b00c15445ef42c163cd9f61182b2e1e03264149.png"],"provided":"I've seen a very large diamond in a museum – it looked amazing!","items":[],"layout":"list","references":[{"id":"B04-LS-U04-question:b6111","kind":"material-reference","title":"LISTENING 2 Ex 2","pages":[93]}],"materials":[],"coursePages":[[{"kind":"text","text":"I've seen a very large diamond in a museum – it looked amazing!"}]],"courseMaterials":[{"id":"B04-LS-U04-publisher-sheet:b6111","title":"LISTENING 2 Ex 2 原题面","pages":[93],"text":"1 Antarctica is the world's largest desert. It's larger than the Sahara and has very harsh winters with extremely cold temperatures.\n2 Alaska is the last great wilderness. There is still so much land that has not been used or built on, and has remained in its natural state.\n3 Researchers collected minerals to find out more about what is in the soil.\n4 Diamond is the hardest naturally occurring substance on Earth.\n5 The electrical company installed copper wires in the new building.\n6 Many countries use natural gas found below the Earth's surface to heat their homes.\n7 The government has banned coal mining in certain areas where it could be extremely dangerous to the environment.","screens":["1 Antarctica is the world's largest desert. It's larger than the Sahara and has very harsh winters with extremely cold temperatures.","2 Alaska is the last great wilderness. There is still so much land that has not been used or built on, and has remained in its natural state.","3 Researchers collected minerals to find out more about what is in the soil.","4 Diamond is the hardest naturally occurring substance on Earth.","5 The electrical company installed copper wires in the new building.","6 Many countries use natural gas found below the Earth's surface to heat their homes.","7 The government has banned coal mining in certain areas where it could be extremely dangerous to the environment."],"sources":[{"page":93,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0f224af3d5f9cabbcaf80eee9b00c15445ef42c163cd9f61182b2e1e03264149.png"}],"kind":"task_sheet","sourceBlockIds":["b6111"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I’ve seen a very large diamond in a\nmuseum – it looked amazing! And I flew\nover a large area of wilderness once, when\nmy flight went over part of Canada. I’ve\nexperienced some harsh winters in my life.\nMy home is heated by natural gas, and\ncopper wire is used in all sorts of things\nI use on a daily basis. But I’ve got no\nexperience of mining or minerals.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":11,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":12,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6114","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":30,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"4.6 Read the email, including the five main questions. Listen to the talk and make brief notes on each question. Compare your notes with a partner. Did you note similar things?","pages":[94],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b9df9f26be041b9edc4e5ae744a44a3114e7fb0dacf4bc7ab689c5203fedc20e.png"],"provided":"To: All students\n\nAbout: Today's talk\n\nMy talk today will be about deserts, with a special focus on their decline and destruction. I'll be covering these main questions.\n\n1 How do humans survive in deserts?\n2 What benefits do deserts provide to humans?\n3 What is a typical desert environment?\n4 What will happen if deserts are destroyed?\n5 How can we prevent that happening?\nI hope you can join me.\n\n1 ____\n2 ____\n3 ____\n4 ____\n5 ____","items":[{"id":"b6114.i01","label":"1","prompt":"How do humans survive in deserts? ____","options":[],"type":"gap/open"},{"id":"b6114.i02","label":"2","prompt":"What benefits do deserts provide to humans? ____","options":[],"type":"gap/open"},{"id":"b6114.i03","label":"3","prompt":"What is a typical desert environment? ____","options":[],"type":"gap/open"},{"id":"b6114.i04","label":"4","prompt":"What will happen if deserts are destroyed? ____","options":[],"type":"gap/open"},{"id":"b6114.i05","label":"5","prompt":"How can we prevent that happening? ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"To: All students"},{"kind":"text","text":"About: Today's talk"},{"kind":"text","text":"My talk today will be about deserts, with a special focus on their decline and destruction. I'll be covering these main questions."},{"kind":"text","text":"1 How do humans survive in deserts?"},{"kind":"text","text":"2 What benefits do deserts provide to humans?"},{"kind":"text","text":"3 What is a typical desert environment?"}],[{"kind":"text","text":"4 What will happen if deserts are destroyed?"},{"kind":"text","text":"5 How can we prevent that happening?"},{"kind":"text","text":"I hope you can join me."},{"kind":"text","text":"1 ____"},{"kind":"text","text":"2 ____"},{"kind":"text","text":"3 ____"},{"kind":"text","text":"5 ____"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 4.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b006f961c737dc25f65b2509234ccdbc054f761679259e448690609b89fc57f.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Use plants and animals for food, medicine, clothing\n(Topnaar in southwest Africa); transport, food, clothing\n(Bedouins in North Africa); grow basic foods\n2 Source of minerals (diamonds, copper, gold), oil, natural\ngas; agricultural products\n3 Hot ground temperature, very little rain\n4 More dust and dirt will be in the air, plants will die, the\nsoil will be saltier\n5 Manage desert resources more carefully; apply\ntechnological solutions","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":42,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6115","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":31,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"4.6 Listen again. One fact is wrong in each sentence. Correct the errors.","pages":[94],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b9df9f26be041b9edc4e5ae744a44a3114e7fb0dacf4bc7ab689c5203fedc20e.png"],"provided":"1 The Earth's deserts cover 37.5 million square kilometres. ____\n2 The Topnaar people in southeast Africa are able to use local plants to make medicine. ____\n3 Copper made in Egypt is given as an example of something that's internationally well known. ____\n4 Desert surface temperatures in summer can go up to 180°C. ____\n5 Saudi Arabia's deserts are home to over 6,200 types of plant. ____\n6 Only 13% of the world's deserts will be wilderness untouched by human activity in 2050. ____\n7 One solution for preventing damage to deserts will be not allowing camels to be raised there. ____\n8 Scientists in Saudi Arabia are currently using wind energy to produce fresh water in deserts. ____","items":[{"id":"b6115.i01","label":"1","prompt":"The Earth’s deserts cover 37.5 million square kilometres. ____","options":[],"type":"choice/closed"},{"id":"b6115.i02","label":"2","prompt":"The Topnaar people in southeast Africa are able to use local plants to make medicine. ____","options":[],"type":"choice/closed"},{"id":"b6115.i03","label":"3","prompt":"Copper made in Egypt is given as an example of something that's internationally well known. ____","options":[],"type":"choice/closed"},{"id":"b6115.i04","label":"4","prompt":"Desert surface temperatures in summer can go up to 180°C. ____","options":[],"type":"choice/closed"},{"id":"b6115.i05","label":"5","prompt":"Saudi Arabia's deserts are home to over 6,200 types of plant. ____","options":[],"type":"choice/closed"},{"id":"b6115.i06","label":"6","prompt":"Only 13% of the world's deserts will be wilderness untouched by human activity in 2050. ____","options":[],"type":"choice/closed"},{"id":"b6115.i07","label":"7","prompt":"One solution for preventing damage to deserts will be not allowing camels to be raised there. ____","options":[],"type":"choice/closed"},{"id":"b6115.i08","label":"8","prompt":"Scientists in Saudi Arabia are currently using wind energy to produce fresh water in deserts. ____","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The Earth's deserts cover 37.5 million square kilometres. ____"},{"kind":"text","text":"2 The Topnaar people in southeast Africa are able to use local plants to make medicine. ____"},{"kind":"text","text":"3 Copper made in Egypt is given as an example of something that's internationally well known. ____"},{"kind":"text","text":"4 Desert surface temperatures in summer can go up to 180°C. ____"},{"kind":"text","text":"5 Saudi Arabia's deserts are home to over 6,200 types of plant. ____"},{"kind":"text","text":"6 Only 13% of the world's deserts will be wilderness untouched by human activity in 2050. ____"}],[{"kind":"text","text":"7 One solution for preventing damage to deserts will be not allowing camels to be raised there. ____"},{"kind":"text","text":"8 Scientists in Saudi Arabia are currently using wind energy to produce fresh water in deserts. ____"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 4.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2b006f961c737dc25f65b2509234ccdbc054f761679259e448690609b89fc57f.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 The Earth’s deserts cover 33.7 million square kilometres.\n2 The Topnaar people in southwest Africa are able to use\nlocal plants to make medicine.\n3 Cotton made in Egypt is given as an example of\nsomething that’s internationally well known.\n4 Desert surface temperatures in summer can go\nup to 80°C.\n5 Saudi Arabia’s deserts are home to over 2,200 types\nof plant.\n6 Only 31% of the world’s deserts will be wilderness\nuntouched by human activity in 2050.\n7 One solution for preventing damage to deserts will be\nnot allowing cattle to be raised there.\n8 Scientists in Saudi Arabia are currently using solar\nenergy to produce fresh water in deserts.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":42,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6116","book":4,"unit":4," le":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Think about the three purposes from Exercise 7. Read the three details below and decide which purpose each one has. Compare your answers with a partner.","pages":[95],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ffe7eae57ec1b0d47c8f9e2f60015bd65b10b068df8f4d3d267255b17cfd9a41.png"],"provided":"1 Tribes such as the Topnaar, in southwest Africa, are known for their ability to survive in deserts due to their use of local plants and animals for food, medicine and clothing.\n2 According to a blog called A Smarter Planet, scientists in Saudi Arabia are already using solar energy to produce fresh water in the desert.\n3 Data from the United Nations shows that every year nearly 2% of healthy desert disappears.","items":[{"id":"b6119.i01","label":"1","prompt":"Tribes such as the Topnaar, in southwest Africa, are known for their ability to survive in deserts due to their use of local plants and animals for food, medicine and clothing.","options":[],"type":"choice/open"},{"id":"b6119.i02","label":"2","prompt":"According to a blog called A Smarter Planet, scientists in Saudi Arabia are already using solar energy to produce fresh water in the desert.","options":[],"type":"choice/open"},{"id":"b6119.i03","label":"3","prompt":"Data from the United Nations shows that every year nearly 2% of healthy desert disappears.","options":[],"type":"choice/open"}],"layout":"list","references":[{"id":"B04-LS-U04-question:b6118","kind":"student-work","title":"LISTENING 2 Ex 7","pages":[95]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Tribes such as the Topnaar, in southwest Africa, are known for their ability to survive in deserts due to their use of local plants and animals for food, medicine and clothing."},{"kind":"text","text":"2 According to a blog called A Smarter Planet, scientists in Saudi Arabia are already using solar energy to produce fresh water in the desert."},{"kind":"text","text":"3 Data from the United Nations shows that every year nearly 2% of healthy desert disappears."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 giving background information\n2 offering a solution\n3 explaining a problem","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":42,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U04-question:b6121","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":35,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use your notes from Listening 1 and Listening 2 to discuss the questions.","pages":[95],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ffe7eae57ec1b0d47c8f9e2f60015bd65b10b068df8f4d3d267255b17cfd9a41.png"],"provided":"","items":[{"id":"b6121.i01","label":"1","prompt":"What natural habitats exist in your country?","options":[],"type":"discuss/open"},{"id":"b6121.i02","label":"2","prompt":"What human activities take place in those habitats, and what is the impact?","options":[],"type":"discuss/open"},{"id":"b6121.i03","label":"3","prompt":"What is being done to conserve the environment in your country?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6121.i01","label":"1","prompt":"What natural habitats exist in your country?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6121.i02","label":"2","prompt":"What human activities take place in those habitats, and what is the impact?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6121.i03","label":"3","prompt":"What is being done to conserve the environment in your country?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 In my country, there are some high\nmountains in the south, and in the north\nit’s very flat with quite a lot of lakes and\na long coastline. In the middle of my\ncountry, it’s hilly with a lot of forests.\nAbout 30% of my country is covered\nby forest.\n2 The mountains are a very popular\nholiday destination, so the small roads\nand villages there can get extremely\ncrowded. But it’s also a place where\nthere are many farms which have been\nthere for centuries. These farms produce\na lot of food for the rest of the country.\nIn the flat areas, there are several\nlarge cities and towns with factories.\nThese factories have created a lot of\npollution in the past, although they are\ncleaner now.\n3 The government is spending more on\ndeveloping high-speed rail networks,\nso that people are less likely to use\nplanes or cars for long-distance travel.\nIt’s also developing a network of bike\npaths. To cut down the amount of air\npollution, my country is slowly closing\ndown coal power stations and replacing\nthem with renewable forms of energy,\nlike solar power. There is also a lot\nhappening with wind power. It’s become\nmy country’s second-largest source of\nelectricity, thanks to wind farms near the\ncoast. I think the government is hoping\nto expand this to build offshore farms.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":42,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afd  on now to the typical desert environment, ... (starting a new section)","options":[],"type":"discuss/open"},{"id":"b6133.i04","label":"4","prompt":"A good example of this is Egyptian cotton. (giving an example)","options":[],"type":"discuss/open"},{"id":"b6133.i05","label":"5","prompt":"That's all I have to say on that point. (finishing a section)","options":[],"type":"discuss/open"},{"id":"b6133.i06","label":"6","prompt":"Let's begin by looking at some background information from the United Nations Environment Programme. (introducing the topic)","options":[],"type":"discuss/open"},{"id":"b6133.i07","label":"7","prompt":"To summarize, deserts are not only important to the people who live in them. (summarizing and concluding)","options":[],"type":"discuss/open"},{"id":"b6133.i08","label":"8","prompt":"The topic of my talk is the decline and destruction of the world's deserts. (giving an overview)","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 But what does this mean for the rest of the world? (querying and analyzing)"},{"kind":"text","text":"This comes after some kind of description of a situation or event. Next will come a discussion of the consequences of that situation or event for other countries."},{"kind":"text","text":"2 To put it another way, we will all be affected. (paraphrasing and clarifying)"},{"kind":"text","text":"3 Moving on now to the typical desert environment, ... (starting a new section)"},{"kind":"text","text":"4 A good example of this is Egyptian cotton. (giving an example)"},{"kind":"text","text":"5 That's all I have to say on that point. (finishing a section)"}],[{"kind":"text","text":"6 Let's begin by looking at some background information from the United Nations Environment Programme. (introducing the topic)"},{"kind":"text","text":"7 To summarize, deserts are not only important to the people who live in them. (summarizing and concluding)"},{"kind":"text","text": on":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Speaking task","text":"Give a problem and solution presentation."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about the effects of climate change on wildlife."},{"label":"Listening skills","text":"Distinguish main ideas from details; take notes on main ideas and details."},{"label":"Critical thinking","text":"Organize information in a presentation."},{"label":"Grammar","text":"Use multi-word prepositions; use the past perfect."},{"label":"Speaking skills","text":"Give background information and explain a problem; use signposting language in a presentation."}],"photo":{"box":[105,50,418,718],"nativeWidth":772,"sourcePage":81,"alt":"A person planting a seedling in a woodland"}}]}},{"id":"B04-LS-U04-classroom:resource:b6063","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ed1e08be179f3dda1b0a0e1ba85250e8b5df2bcdf55a499fa40a07f16e0b8a08.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"beak","pos":"(n)","definition":"the hard, pointed part of a bird's mouth","example":"The bird held a seed in its beak.","wordAudio":"beak","cardWord":false},{"term":"crossbreed","pos":"(v)","definition":"to breed (produce babies) with an animal of a different species to produce a new type of animal","example":"Some farmers crossbreed cattle to produce animals with different traits.","wordAudio":"crossbreed","cardWord":false},{"term":"genes","pos":"(n)","definition":"parts of an animal's DNA that are passed on from parents to children and that control physical development","example":"Children inherit genes from both parents.","wordAudio":"genes","cardWord":false},{"term":"historically","pos":"(adv)","definition":"in the past","example":"Historically, this town relied on fishing.","wordAudio":"historically","cardWord":false},{"term":"migrate","pos":"(v)","definition":"to travel to a different place (especially when the season changes)","example":"Many birds migrate to warmer areas in winter.","wordAudio":"migrate","cardWord":false},{"term":"retain","pos":"(v)","definition":"to keep or continue to have","example":"The insulated bottle can retain heat for several hours.","wordAudio":"retain","cardWord":false}]]}},{"id":"B04-LS-U04-classroom:video","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/235ae591d231369391bdfa73733397abdc390d17883b1a5f553e35939fd4d0f5.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/618dae74ea75a7b1cc78629e-L4LS-U04.mp4","captions":[{"start":6.42,"end":14.86,"text":"Climate change is disrupting the life cycles of\nmillions of plants and animals."},{"start":16.04,"end":25.26,"text":"Researchers have warned that up to 27 % of all plant\nand animal species could disappear before the end of\nthe century."},{"start":26.54,"end":30.34,"text":"But some animals are adapting to our changing planet."},{"start":31.58,"end":34.5,"text":"Many animals migrate with the changing seasons."},{"start":36.34,"end":37.74,"text":"As temperatures rise,"},{"start":38.12,"end":43.06,"text":"one species of salmon is now migrating two weeks\nearlier than it used to."},{"start":43.78,"end":50.8,"text":"The Alaskan waters where these pink salmon breed are\nnow one degree warmer than they were 40 years ago."},{"start":51.12,"end":53.34,"text":"But the number of salmon hasn't dropped."},{"start":54.08,"end":60.5,"text":"Scientists believe that this change in behavior is\nhelping the species to survive climate change."},{"start":62.28,"end":63.26,"text":"Away from the water,"},{"start":63.8,"end":67.74,"text":"scientists have found the bodies of some species are\nalso adapting."},{"start":68.7,"end":80.22,"text":"The average beak sizes of some parrots in Australia and\nthe medium ground finch in the Galapagos Islands have\ngrown by as much as ten % since 1871."},{"start":80.22,"end":85.46000000000001,"text":"Small beaked birds don't do well in drier, hotter\nsummers,"},{"start":86.14,"end":91.06,"text":"but larger beaks improve these birds' ability to stay\ncool in the heat."},{"start":92.52000000000001,"end":97.06,"text":"A different way to adapt is by cross -breeding with\nanother species."},{"start":98.06,"end":100.06,"text":"In the deserts of North Africa,"},{"start":100.47999999999999,"end":106.7,"text":"the fennec fox shares parts of its territories with the\nrupel's fox and the red fox."},{"start":107.78,"end":111.02000000000001,"text":"Historically, cross -breeding between these species\noccurred,"},{"start":111.5,"end":116.22,"text":"which improved the chances of survival for the rupels\nand the red fox."},{"start":117.12,"end":122.64,"text":"From the fennec fox, they gained a better ability to\nretain water in this dry region."},{"start":124.88,"end":125.44,"text":"Today,"},{"start":126.02,"end":129.96,"text":"climate change is bringing different species together\nfor the first time."},{"start":130.7,"end":138.06,"text":"Due to the declining amount of ice, polar bears have\nbeen forced to spend more time in the summer on land,"},{"start":138.46,"end":142.76,"text":"while grizzly bears move northward to seek out the\ncooler climate."},{"start":144,"end":149.42000000000002,"text":"Their cross -breeding has resulted in a variation known\nas growler or pisley bears."},{"start":150.62,"end":154.36,"text":"Sharing each other's genes may help these bears to\nsurvive."},{"start":154.36,"end":162.52,"text":"Only time will allow us to see which species can\nrespond fast enough to survive climate change."}],"launchInline":true}},{"id":"B04-LS-U04-classroom:resource:b6072","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[84],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/104696ee6e5b99d9a3e1971df8b90493c8b6b9e33e1493ea514b605e08f6b30c.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["adapt (v) to adjust to different conditions\ncoastal (adj) on or related to land by the sea or ocean\nconservation (n) the protection of natural resources, animals, etc.\nexploit (v) to use something in a way that helps you","habitat (n) the natural surroundings where a plant or animal lives\nimpact (n) the strong effect something has on a situation or person\nmodify (v) to change something, usually to improve it\nwaste (n) unwanted substances or material"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-LS-U04-classroom:resource:b6105","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"Vocabulary for Ex 7","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS TO DESCRIBE ENVIRONMENTAL CHANGE"},"pages":[92],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/67cc5dfa366df6f84bef63e00e777608f22dfcebbb3a8 function wireMaterials(doc,c,decks){

 let selected=0, subpage=0;

  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;

function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{

 const matchGrid=doc.querySelector(".flow-match-pictures");

 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
