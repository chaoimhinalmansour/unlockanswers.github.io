on":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Speaking task","text":"Give a problem and solution presentation."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about the effects of climate change on wildlife."},{"label":"Listening skills","text":"Distinguish main ideas from details; take notes on main ideas and details."},{"label":"Critical thinking","text":"Organize information in a presentation."},{"label":"Grammar","text":"Use multi-word prepositions; use the past perfect."},{"label":"Speaking skills","text":"Give background information and explain a problem; use signposting language in a presentation."}],"photo":{"box":[105,50,418,718],"nativeWidth":772,"sourcePage":81,"alt":"A person planting a seedling in a woodland"}}]}},{"id":"B04-LS-U04-classroom:resource:b6063","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ed1e08be179f3dda1b0a0e1ba85250e8b5df2bcdf55a499fa40a07f16e0b8a08.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"beak","pos":"(n)","definition":"the hard, pointed part of a bird's mouth","example":"The bird held a seed in its beak.","wordAudio":"beak","cardWord":false},{"term":"crossbreed","pos":"(v)","definition":"to breed (produce babies) with an animal of a different species to produce a new type of animal","example":"Some farmers crossbreed cattle to produce animals with different traits.","wordAudio":"crossbreed","cardWord":false},{"term":"genes","pos":"(n)","definition":"parts of an animal's DNA that are passed on from parents to children and that control physical development","example":"Children inherit genes from both parents.","wordAudio":"genes","cardWord":false},{"term":"historically","pos":"(adv)","definition":"in the past","example":"Historically, this town relied on fishing.","wordAudio":"historically","cardWord":false},{"term":"migrate","pos":"(v)","definition":"to travel to a different place (especially when the season changes)","example":"Many birds migrate to warmer areas in winter.","wordAudio":"migrate","cardWord":false},{"term":"retain","pos":"(v)","definition":"to keep or continue to have","example":"The insulated bottle can retain heat for several hours.","wordAudio":"retain","cardWord":false}]]}},{"id":"B04-LS-U04-classroom:video","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/235ae591d231369391bdfa73733397abdc390d17883b1a5f553e35939fd4d0f5.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/618dae74ea75a7b1cc78629e-L4LS-U04.mp4","captions":[{"start":6.42,"end":14.86,"text":"Climate change is disrupting the life cycles of\nmillions of plants and animals."},{"start":16.04,"end":25.26,"text":"Researchers have warned that up to 27 % of all plant\nand animal species could disappear before the end of\nthe century."},{"start":26.54,"end":30.34,"text":"But some animals are adapting to our changing planet."},{"start":31.58,"end":34.5,"text":"Many animals migrate with the changing seasons."},{"start":36.34,"end":37.74,"text":"As temperatures rise,"},{"start":38.12,"end":43.06,"text":"one species of salmon is now migrating two weeks\nearlier than it used to."},{"start":43.78,"end":50.8,"text":"The Alaskan waters where these pink salmon breed are\nnow one degree warmer than they were 40 years ago."},{"start":51.12,"end":53.34,"text":"But the number of salmon hasn't dropped."},{"start":54.08,"end":60.5,"text":"Scientists believe that this change in behavior is\nhelping the species to survive climate change."},{"start":62.28,"end":63.26,"text":"Away from the water,"},{"start":63.8,"end":67.74,"text":"scientists have found the bodies of some species are\nalso adapting."},{"start":68.7,"end":80.22,"text":"The average beak sizes of some parrots in Australia and\nthe medium ground finch in the Galapagos Islands have\ngrown by as much as ten % since 1871."},{"start":80.22,"end":85.46000000000001,"text":"Small beaked birds don't do well in drier, hotter\nsummers,"},{"start":86.14,"end":91.06,"text":"but larger beaks improve these birds' ability to stay\ncool in the heat."},{"start":92.52000000000001,"end":97.06,"text":"A different way to adapt is by cross -breeding with\nanother species."},{"start":98.06,"end":100.06,"text":"In the deserts of North Africa,"},{"start":100.47999999999999,"end":106.7,"text":"the fennec fox shares parts of its territories with the\nrupel's fox and the red fox."},{"start":107.78,"end":111.02000000000001,"text":"Historically, cross -breeding between these species\noccurred,"},{"start":111.5,"end":116.22,"text":"which improved the chances of survival for the rupels\nand the red fox."},{"start":117.12,"end":122.64,"text":"From the fennec fox, they gained a better ability to\nretain water in this dry region."},{"start":124.88,"end":125.44,"text":"Today,"},{"start":126.02,"end":129.96,"text":"climate change is bringing different species together\nfor the first time."},{"start":130.7,"end":138.06,"text":"Due to the declining amount of ice, polar bears have\nbeen forced to spend more time in the summer on land,"},{"start":138.46,"end":142.76,"text":"while grizzly bears move northward to seek out the\ncooler climate."},{"start":144,"end":149.42000000000002,"text":"Their cross -breeding has resulted in a variation known\nas growler or pisley bears."},{"start":150.62,"end":154.36,"text":"Sharing each other's genes may help these bears to\nsurvive."},{"start":154.36,"end":162.52,"text":"Only time will allow us to see which species can\nrespond fast enough to survive climate change."}],"launchInline":true}},{"id":"B04-LS-U04-classroom:resource:b6072","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[84],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/104696ee6e5b99d9a3e1971df8b90493c8b6b9e33e1493ea514b605e08f6b30c.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["adapt (v) to adjust to different conditions\ncoastal (adj) on or related to land by the sea or ocean\nconservation (n) the protection of natural resources, animals, etc.\nexploit (v) to use something in a way that helps you","habitat (n) the natural surroundings where a plant or animal lives\nimpact (n) the strong effect something has on a situation or person\nmodify (v) to change something, usually to improve it\nwaste (n) unwanted substances or material"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B04-LS-U04-classroom:resource:b6105","book":4,"unit":4,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"module":"Vocabulary for Ex 7","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"VERBS TO DESCRIBE ENVIRONMENTAL CHANGE"},"pages":[92],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/67cc5dfa366df6f84bef63e00e777608f22dfcebbb3a8 ptions":["Natural causes result in some environmental change.","Natural causes result in most environmental change.","Human causes result in most environmental change."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":0}},{"id":"b6083.i02","label":"2","prompt":"","options":["The destruction of animal habitats is always a bad thing.","The destruction of animal habitats is not necessarily negative.","The destruction of animal habitats is inevitable."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":1}},{"id":"b6083.i03","label":"3","prompt":"","options":["It's common to think that humans only negatively affect the environment.","It's wrong to think that humans only negatively affect the environment.","It's correct to think that humans only negatively affect the environment."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":0}}]]}},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evidence: nurse in a big hospital","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colsp hoice","option":1},"b3741.i04":{"mode":"choice","option":0}},"basis":"教材第 113 页与教师书 PDF 第 48 页。按 Tough Guy 文章对应条目信息核对。 教材原页 Ex 5 共四项。","rewriteKey":""},"B02-RW-U05-question:b3765":{"rows":{"b3765.i01":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":23}]},"b3765.i02":{"mode":"indexed-mark","parts":[{"start":0,"end":2,"underline":true},{"start":3,"end":8}]},"b3765.i03":{"mode":"indexed-mark","parts":[{"start":0,"end":18,"underline":true},{"start":19,"end":21}]}},"basis":"教材第 118 页与教师书 PDF 第 50 页。选择完整主语和限定动词。","itemPatches":{"b3765.i01":{"options":[]},"b3765.i02":{"options":[]},"b3765.i03":{"options":[]}},"rewriteKey":""},"B04-LS-U04-question:b6073":{"rows":{"b6073.i01":{"mode":"gap","answer":"conservation"},"b6073.i02":{"mode":"gap","answer":"habitat"},"b6073.i03":{"mode":"gap","answer":"waste"},"b6073.i04":{"mode":"gap","answer":"coastal"},"b6073.i05":{"mode":"gap","answer":"adapt"},"b6073.i06":{"mode":"gap","answer":"exploit"},"b6073.i07":{"mode":"gap","answer":"impact"},"b6073.i08":{"mode":"gap","answer":"modify"}},"basis":"教材第 84 页与教师书 PDF 第 40 页。","itemPatches":{"b6073.i01":{"options":[]},"b6073.i02":{"options":[]},"b6073.i03":{"options":[]},"b6073.i04":{"options":[]},"b6073.i05":{"options":[]},"b6073.i06":{"options":[]},"b6073.i07":{"options":[]},"b6073.i08":{"options":[]}},"rewriteKey":""},"B04-LS-U04-question:b6076":{"rows":{},"basis":"教材第 85 页与教师书 PDF 第 40 页。十条细节填回三个主旨列，保留原细节和主旨。","displayPages":[[{"kind":"text","text":"a In Australia, Europe, Japan and North America, foxes live in urban areas, even in big cities such as London."},{"kind":"text","text":"b Part of this environmental change is due to natural, rather than human, causes."},{"kind":"text","text":"c It destroyed around 800 square kilometres of farmland and a huge area of forest."},{"kind":"text","text":"d One other animal that is as at home in the city as in the countryside is the raccoon."},{"kind":"text","text":"e In 1991, a volcano in the Philippines erupted and killed many people and animals."},{"kind":"text","text":"f In Africa and Asia, monkeys live in cities alongside people and exploit the human environment by stealing food or eating things that humans have thrown away."}],[{"kind":"text","text":"g Today this is around 10%, as the Earth has been warming since that time."},{"kind":"text","text":"h In Singapore, the 1,500 wild monkeys that live in and around the city have become a tourist attraction."},{"kind":"text","text":"i Just 10,000 years ago, about half of the planet was covered in ice."},{"kind":"text","text":"j It also caused severe floods when rivers were blocked with volcanic ash."}],[{"kind":"table","rows":[[{"text":"Planet Earth is dynamic and always changing.","header":false,"colspan":1,"rowspan":1},{"text":"Natural forces can destroy the environment.","header":false,"colspan":1,"rowspan":1},{"text":"Habitat destruction hasn&#x27;t been bad news for all animals.","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"tableEdits":[{"part":2,"block":0,"row":1,"cell":0,"answer":"g, i"},{"part":2,"block":0,"row":1,"cell":1,"answer":"b, c, e, j"},{"part":2,"block":0,"row":1,"cell":2,"answer":"f, h, a, d"}],"rewriteKey":""},"B04-LS-U04-question:b6096":{"rows":{"b6096.i01":{"mode":"line","answer":"e. due to"},"b6096.i02":{"mode":"line","answer":"b. No synonym in the box."},"b6096.i03":{"mode":"line","answer":"c. instead of"},"b6096.i04":{"mode":"line","answer":"a. except for"},"b6096.i05":{"mode":"line","answer":"d. along with / as well as"}},"basis":"教材第 89 页与教师书 PDF 第 41 页。分别核对功能配对字母和同义表达。","itemPatches":{"b6096.i01":{"options":[]},"b6096.i02":{"options":[]},"b6096.i03":{"options":[]},"b6096.i04":{"options":[]},"b6096.i05":{"options":[]}},"rewriteKey":""},"B04-LS-U04-question:b6101":{"rows":{},"basis":"教材第 91 页与教师书 PDF 第 41 页。用段落时间关系判断一般过去时和过去完成时。","replaceBlocks":[{"part":0,"block":0,"blocks":[{"kind":"text","text":"Before she (1)____ (write) her influential book Silent Spring in 1962, Rachel Carson (2)____ (spend) years working for the US government at environmental agencies like the US Bureau of Fisheries and the US Fish and Wildlife Service. During her time there, she (3)____ (do) her own personal research and writing. By 1955, Carson (4)____ (already / publish) several books on environmental research when she (5)____ (begin) to do research full time. One subject that she was particularly interested in was the effects of pesticides¹ on the environment and on human health. During World War II, the government (6)____ (use) the pesticide DDT to protect people against diseases caused by pests. After the war, farmers (7)____ (spray) large amounts of DDT into the air to protect their crops. Carson (8)____ (hear) that the chemical was making people ill","answer":{"mode":"blanks","values":["wrote","had spent","did","had already published","began","had used / used","sprayed","had heard"]}}]},{"part":1,"block":0,"blocks":[{"kind":"text","text":"with cancer and was causing animals to die, so she (9)____ (decide) to do scientific research on the subject and publish it as a book, to warn people about the risks. After Carson (10)____ (release) Silent Spring, the pesticide industry (11)____ (attack) her for her research. However, the US government (12)____ (respond) by banning the use of DDT in the United States. Soon her book was translated into several languages and was published around the world.","answer":{"mode":"blanks","values":["decided","had released / released","attacked","responded"]}}]}],"rewriteKey":""},"B04-LS-U04-question:b6106":{"rows":{"b6106.i01":{"mode":"gap","answer":"survived"},"b6106.i02":{"mode":"gap","answer":"declined"},"b6106.i03":{"mode":"gap","answer":"extracted"},"b6106.i04":{"mode":"gap","answer":"impacted / affected"},"b6106.i05":{"mode":"gap","answer":"affect / impact"},"b6106.i06":{"mode":"gap","answe  Arabia"]}}]}],"rewriteKey":""},"B04-LS-U04-question:b6125":{"rows":{},"basis":"教材第 96 页与教师书 PDF 第 43 页。补齐提纲全部八个原位并保留例子。","displayPages":[[{"kind":"text","text":"Topic: Decline and destruction of deserts"},{"kind":"text","text":"Introduction (background information): (1) ____"},{"kind":"text","text":"I Main idea: (2) ____"},{"kind":"text","text":"A Detail: (3) ____"},{"kind":"text","text":"Examples: Topnaar and Bedouins"},{"kind":"text","text":"B Detail: (4) ____"}],[{"kind":"text","text":"II Main idea: (5) ____"},{"kind":"text","text":"A Detail: (6) ____"},{"kind":"text","text":"Example: acacia tree"},{"kind":"text","text":"B Detail: (7) ____"},{"kind":"text","text":"Example: Arabian oryx"},{"kind":"text","text":"Solutions: Manage desert resources carefully instead of abusing them; apply new technological solutions; (8) ____ to provide cleaner energy in existing desert cities."}]],"replaceBlocks":[{"part":0,"block":1,"blocks":[{"kind":"text","text":"Introduction (background information): (1) ____","answer":{"mode":"blanks","values":["desert environment and wildlife"]}}]},{"part":0,"block":2,"blocks":[{"kind":"text","text":"I Main idea: (2) ____","answer":{"mode":"blanks","values":["human survival"]}}]},{"part":0,"block":3,"blocks":[{"kind":"text","text":"A Detail: (3) ____","answer":{"mode":"blanks","values":["people in deserts"]}}]},{"part":0,"block":5,"blocks":[{"kind":"text","text":"B Detail: (4) ____","answer":{"mode":"blanks","values":["people in cities"]}}]},{"part":1,"block":0,"blocks":[{"kind":"text","text":"II Main idea: (5) ____","answer":{"mode":"blanks","values":["plant and animal survival"]}}]},{"part":1,"block":1,"blocks":[{"kind":"text","text":"A Detail: (6) ____","answer":{"mode":"blanks","values":["desert plants"]}}]},{"part":1,"block":3,"blocks":[{"kind":"text","text":"B Detail: (7) ____","answer":{"mode":"blanks","values":["desert animals"]}}]},{"part":1,"block":5,"blocks":[{"kind":"text","text":"Solutions: Manage desert resources carefully instead of abusing them; apply new technological solutions; (8) ____ to provide cleaner energy in existing desert cities.","answer":{"mode":"blanks","values":["use wind and solar energy"]}}]}],"rewriteKey":""}},{"B01-LS-U05":{"aspect":1.7777778,"cues":[[0,3.88,"There are more than eight billion people in the world,","世界上有80多亿人，"],[4.44,7.3,"and those people need electricity.","这些人需要电力。"],[8.86,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B04-LS-U04":{"aspect":1.9472617,"cues":[[6.42,14.86,"Climate change is disrupting the life cycles of millions of plants and animals.","气候变化正在扰乱数百万植物和动物的生命周期。"],[16.04,25.26,"Researchers have warned that up to 27 % of all plant and animal species could disappear before the end of the century.","研究人员警告说，在本世纪末之前，多达27%的动植物物种可能会消失。"],[26.54,30.34,"But some animals are adapting to our changing planet.","但有些动物正在适应我们变化中的星球。"],[31.58,34.5,"Many animals migrate with the changing seasons.","许多动物随着季节的变化而迁徙。"],[36.34,37.74,"As temperatures rise,","随着气温上升，"],[38.12,43.06,"one species of salmon is now migrating two weeks earlier than it used to.","有一种鲑鱼的迁徙时间比以前早两周。"],[43.78,50.8,"The Alaskan waters where these pink salmon breed are now one degree warmer than they were 40 years ago.","在阿拉斯加的水域，这些粉红色的鲑鱼品种现在比40年前暖和了1度。"],[51.12,53.34,"But the number of salmon hasn't dropped.","但鲑鱼的数量并没有下降。"],[54.08,60.5,"Scientists believe that this change in behavior is helping the species to survive climate change.","科学家认为，这种行为变化有助于该物种在气候变化中生存。"],[62.28,63.26,"Away from the water,","远离水，"],[63.8,67.74,"scientists have found the bodies of some species are also adapting.","科学家发现，一些物种的身体也在适应变化。"],[68.7,80.22,"The average beak sizes of some parrots in Australia and the medium ground finch in the Galapagos Islands have grown by as much as ten % since 1871.","自1871年以来，澳大利亚某些鹦鹉和加拉帕戈斯群岛中地雀的平均喙部尺寸最多增大了10%。"],[80.22,85.46000000000001,"Small beaked birds don't do well in drier, hotter summers,","小喙鸟在更干燥，更炎热的夏天表现不好，"],[86.14,91.06,"but larger beaks improve these birds' ability to stay cool in the heat.","但较大的喙能提高这些鸟在高温中保持凉爽的能力。"],[92.52000000000001,97.06,"A different way to adapt is by cross -breeding with another species.","另一种适应方法是与另一个物种交叉繁殖。"],[98.06,100.06,"In the deserts of North Africa,","在北非的沙漠中，"],[100.47999999999999,106.7,"the fennec fox shares parts of its territories with the rupel's fox and the red fox.","耳廓狐与吕佩尔狐和赤狐共享部分领地。"],[107.78,111.02000000000001,"Historically, cross -breeding between these species occurred,","历史上，这些物种之间的交叉繁殖发生，"],[111.5,116.22,"which improved the chances of survival for the rupels and the red fox.","这提高了吕佩尔狐和赤狐的生存机会。"],[117.12,122.64,"From the fennec fox, they gained a better ability to retain water in this dry region.","它们从耳廓狐身上获得了在干旱地区更好地保水的能力。"],[124.88,125.44,"Today,","今天，我们。.."],[126.02,129.96,"climate change is bringing different species together for the first time.","气候变化使不同物种第一次聚集在一起。"],[130.7,138.06,"Due to the declining amount of ice, polar bears have been forced to spend more time in the summer on land,","由于冰的数量不断减少，北极熊被迫在夏季在陆地上花费更多的时间，"],[138.46,142.76,"while grizzly bears move northward to seek out the cooler climate.","而灰熊则向北移动寻找更凉爽的气候"],[144,149.42000000000002,"Their cross -breeding has resulted in a variation known as growler or pisley bears.","它们的杂交产生了一种被称为北极灰熊或灰北极熊的变种。"],[150.62,154.36,"Sharing each other's genes may help these bears to survive.","分享彼此的基因可能有助于这些熊的生存。"],[154.36,162 async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;

 current=i;part=p;

function outside(el,bounds){

 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
