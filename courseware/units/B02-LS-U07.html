nd souvenirs to sell."},{"start":45.94,"end":48.42,"text":"The people of Kiwaiu make good money this way."},{"start":48.76,"end":52.28,"text":"They send most of their ornaments to Nairobi, the\ncapital of Kenya."},{"start":52.28,"end":56.42,"text":"These are then exported to stores around the world or\nsold on the Internet."},{"start":58.72,"end":61.54,"text":"Some people here didn't have houses before, but now\nthey do."},{"start":62.04,"end":65.38,"text":"Some people didn't have animals for food, but now they\ndo."},{"start":67.16,"end":69.08,"text":"Now we can buy a lot of things."},{"start":69.56,"end":72.62,"text":"Some of us couldn't send our children to school, but\nnow we can."},{"start":72.92,"end":74.76,"text":"That's the most important thing for me."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 are not 2 daily 3 art 4 make 5 most","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f758293dbb1771465a5b9eb37377e1435f9a4ea46f6e5e9e1df25dc59b9c26ee.pdf","pdfPage":54,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-LS-U07-question:b3068","book":2,"unit":7,"track":"LS","topic":"PEOPLE","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Work with a partner. Match the questions (1–8) to the answers (a–h).","pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0a8308c7bd6b5a5b150cab166461f50b869b6313b2c5d0d42c21f6e21015c7f7.png"],"provided":"","items":[{"id":"b3068.i01","label":"1","prompt":"Who goes to the beach to pick up rubbish?","options":["flip-flops","some of their children","houses","artists and craftsmen","Kiwayu women","money","on the intemet","their villages tic cups tyres"},{"kind":"item","id":"b3072.i01","label":"bottle tops","prompt":"What could you make from bottle tops?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3072.i02","label":"boxes","prompt":"What could you make from boxes?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3072.i03","label":"drink cans","prompt":"What could you make from drink cans?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3072.i04","label":"glass bottles","prompt":"What could you make from glass bottles?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3072.i05","label":"paper bags","prompt":"What could you make from paper bags?","options":[],"type":"discuss/open"}],[{"kind":"item","id":"b3072.i06","label":"plastic bags","prompt":"What could you make from plastic bags?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3072.i07","label":"plastic cups","prompt":"What could you make from plastic cups?","options":[],"type":"discuss/open"},{"kind":"item","id":"b3072.i08","label":"tyres","prompt":"What could you make from tyres?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"See Model Answer Booklet plO for example answers.\npage147\n1-3 See Model Answer  Booklet  plO for example  answers.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f758293dbb1771465a5b9eb37377e1435f9a4ea46f6e5e9e1df25dc59b9c26ee.pdf","pdfPage":54,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-LS-U07-question:b3075","book":2,"unit":7,"track":"LS","topic":"PEOPLE","lesson":1,"order":9,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a student presentation about creative people and the things they make. Work with a partner. Read the paragraph below and discuss the meaning of the words in bold. Use a dictionary to help you. Which words are new for you?","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b3af5c3230766ba63d1e831e202568e3bb427e23e31c202ba9082c939d1ebd7d.png"],"provided":"## Designers\nWhat does a designer do? The job of a designer is to make products and inventions look good and work well. First, they think about the purpose of the item they want to make. Sometimes they use computer programs to make designs. Some designers like to make simple things, with a neat and clean look – not complicated things with many parts and uses. A simple item might have only one use. For example, the use of a chair is for sitting. Usually, a good design isn't just one person's achievement. Designers need to show their work to others and listen to the points they make so they can improve it. By working together, designers can make good products that people want to use.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## Designers"},{"kind":"text","text":"What does a designer do? The job of a designer is to make products and inventions look good and work well. First, they think about the purpose of the item they want to make. Sometimes they use computer programs to make designs. Some designers like to make simple things, with a neat and clean look – not complicated things with many parts and uses. A simple item might have only one use. For example, the use of a chair is for sitting. Usually, a good design isn't just one person's achievement. Designers need to show their work to others and listen to the points they make so they can improve it. By working together, designers can make good products that people want to use."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"invention  (n) some ","prompt":"When we think about the (6) ____ of a smart light bulb, it looks a lot like a regular one, too.","options":["products","inventions","purpose","designs","simple","complicated","use","design","achievement","points"],"type":"gap/closed"}],[{"kind":"item","id":"b3076.i07","label":"7","prompt":"They say what the good (7) ____ of the invention are and they may get a prize for their (8) ____.","options":["products","inventions","purpose","designs","simple","complicated","use","design","achievement","points"],"type":"gap/closed"}],[{"kind":"item","id":"b3076.i08","label":"8","prompt":"They say what the good (7) ____ of the invention are and they may get a prize for their (8) ____.","options":["products","inventions","purpose","designs","simple","complicated","use","design","achievement","points"],"type":"gap/closed"}]],"courseMaterials":[{"id":"B02-LS-U07-publisher-sheet:b3075","title":"LISTENING 1 Ex 1 原题面","pages":[150],"text":"## Designers\nWhat does a designer do? The job of a designer is to make products and inventions look good and work well. First, they think about the purpose of the item they want to make. Sometimes they use computer programs to make designs. Some designers like to make simple things, with a neat and clean look – not complicated things with many parts and uses. A simple item might have only one use. For example, the use of a chair is for sitting. Usually, a good design isn't just one person's achievement. Designers need to show their work to others and listen to the points they make so they can improve it. By working together, designers can make good products that people want to use.","screens":["## Designers","What does a designer do? The job of a designer is to make products and inventions look good and work well. First, they think about the purpose of the item they want to make. Sometimes they use computer programs to make designs. Some designers like to make simple things, with a neat and clean look – not complicated things with many parts and uses. A simple item might have only one use. For example, the use of a chair is for sitting. Usually, a good design isn't just one person's achievement. Designers need to show their work to others and listen to the points they make so they can improve it. By working together, designers can make good","products that people want to use."],"sources":[{"page":150,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b3af5c3230766ba63d1e831e202568e3bb427e23e31c202ba9082c939d1ebd7d.png"}],"kind":"task_sheet","sourceBlockIds":["b3075"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 inventions  2 simple 3 use/ purpose\n4 complicated 5 purpose/  use  6 design\n7 points 8 achievement","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f758293dbb1771465a5b9eb37377e1435f9a4ea46f6e5e9e1df25dc59b9c26ee.pdf","pdfPage":55,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-LS-U07-question:b3077","book":2,"unit":7,"track":"LS","topic":"PEOPLE","lesson":1,"order":11,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner and answer the questions.","pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10f987b002a5decf52cd48b6491a48b63f281ccb25d3c0cb10a1b03eda45c456.png"],"provided":"1 Who are some inventors and designers that you know of?\nWhat were their inventions or designs?\nOne inventor that I know of is Sir Tim Berners-Lee. He invented the World Wide Web to share information between scientists.\n2 How did their inventions or designs change lives?\nThe World Wide Web changed our lives because now it is not just for scientists – we can all send messages and information to each other very quickly over the internet.\n3 Some people improve other people's inventions. Do you think they are really inventors? Why / Why not?\nI think they are really inventors if they change a design or invent new parts. For example, Thomas Edison improved the light bulb so we can use it every day.","items":[{"id":"b3077.i01","label":"1","prompt":"Who are some inventors and designers that you know of? What were their inventions or designs?","options":[],"type":"discuss/open"},{"id":"b3077.i02","label":"2","prompt":"How did their inventions or designs change lives?","options":[],"type":"discuss/open"},{"id":"b3077.i03","label":"3","prompt":"Some people improve other people's inventions. Do you think they are really inventors? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Who are some inventors and designers that you know of?"},{"kind":"text","text":"What were their inventions or designs?"},{"kind":"text","text":"One inventor that I know of is Sir Tim Berners-Lee. He invented the World Wide Web to share information between scientists."},{"kind":"text","text":"2 How did their inventions or designs change lives?"},{"kind":"text","text":"The World Wide Web changed our lives because now it is not just for scientists – we can all send messages and information to each other very quickly over the internet."}],[{"kind":"text","text":"3 Some people improve other people's inventions. Do you think they are really inventors? Why / Why not?"},{"kind":"text","text":"I think they are really inventors if they change a design or invent new parts. For example, Thomas Edison improved the light bulb so we can use it every day."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afd tain village is small and isolated.","wordAudio":"isolated","cardWord":false},{"term":"trash","pos":"(US n)","definition":"the things you throw away because you do not want them. rubbish","example":"Put the empty cup in the trash.","wordAudio":"trash","cardWord":false},{"term":"wash up","pos":"(phr v)","definition":"to move naturally from the water to the beach","example":"After the storm, plastic bottles began to wash up on the beach.","wordAudio":"wash up","cardWord":false},{"term":"flip-flop","pos":"(n)","definition":"a kind of open shoe that people often wear at the beach","example":"I lost a flip-flop while walking on the beach.","wordAudio":"flip-flop","cardWord":false},{"term":"ornament","pos":"(n)","definition":"an object that decorates a home or garden","example":"They placed a small stone ornament in the garden.","wordAudio":"ornament","cardWord":false}]]}},{"id":"B02-LS-U07-classroom:video","book":2,"unit":7,"track":"LS","topic":"PEOPLE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5d162b4ce60e5ae03d8f8d430f1004651293623cb7be1ed2375a611ed35ff663.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c4324bd293d1024543620ed6-L2LS-U07.mp4","captions":[{"start":1.32,"end":5.26,"text":"Kiwaiu Island is located off the coast of Kenya in the\nIndian Ocean."},{"start":6.56,"end":9,"text":"There aren't many tourists on these beautiful beaches."},{"start":10.6,"end":14.18,"text":"The people who live here seem very isolated from the\nrest of the world,"},{"start":14.5,"end":18.92,"text":"but they are actually connected to the rest of the\nworld in a surprising way."},{"start":20.38,"end":25.28,"text":"Plastic and other trash from around the Indian Ocean\nwashes up onto the beach daily."},{"start":25.86,"end":30.44,"text":"So every day, the women of Kiwaiu go to the beach to\npick up trash."},{"start":31.22,"end":31.54,"text":"Why?"},{"start":32.2,"end":33.44,"text":"To earn a living."},{"start":34.14,"end":36.86,"text":"They collect flip -flops and bring them to their\nvillages."},{"start":39.08,"end":39.46,"text":"There,"},{"start":39.78,"end":44.56,"text":"artists and craftsmen turn the trash into colorful\nornaments and souvenirs to sell."},{"start":45.94,"end":48.42,"text":"The people of Kiwaiu make good money this way."},{"start":48.76,"end":52.28,"text":"They send most of their ornaments to Nairobi, the\ncapital of Kenya."},{"start":52.28,"end":56.42,"text":"These are then exported to stores around the world or\nsold on the Internet."},{"start":58.72,"end":61.54,"text":"Some people here didn't have houses before, but now\nthey do."},{"start":62.04,"end":65.38,"text":"Some people didn't have animals for food, but now they\ndo."},{"start":67.16,"end":69.08,"text":"Now we can buy a lot of things."},{"start":69.56,"end":72.62,"text":"Some of us couldn't send our children to school, but\nnow we can."},{"start":72.92,"end":74.76,"text":"That's the most important thing for me."}],"launchInline":true}},{"id":"B02-LS-U07-classroom:review-1","book":2,"unit":7,"track":"LS","topic":"PEOPLE","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[167],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cb6a929043179e83246a95b0bf643df0f72e29517a5b4e59c23300360945cd73.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B02-LS-U07-B-001","f  if(/<table/i.test(s)){

   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");

 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){

  case "dual":{

  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';

function vocabularyPlacement(c,page){

  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}

 const pdf=document.getElementById("source-pdf");

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){

 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){

 const tabs=[...doc.querySelectorAll("[data-deck]")];

 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
