a Savile Row tailor\ninvolves at least 50 hours of work."},{"start":19.74,"end":26.1,"text":"The suits made on Savile Row were traditionally for\nmen, but women have always worked there too."},{"start":26.1,"end":27,"text":"However,"},{"start":27.34,"end":28.32,"text":"until now,"},{"start":28.64,"end":33.82,"text":"no woman has made it to the top on Savile Row and become a\nmaster tailor."},{"start":36.8,"end":41.06,"text":"Catherine Sargent is the first female master tailor on\nSavile Row."},{"start":41.68,"end":45.8,"text":"Her new shop sells handmade suits for both men and\nwomen."},{"start":46.26,"end":53.24,"text":"OK, so, Catherine, how significant is it that you are\nthe first woman to have her name above the door of a\nshop on Savile Row?"},{"start":53.54,"end":59.22,"text":"I just think it's a sign of the times, really, that\nthere's far more women in the industry now."},{"start":59.96,"end":64.28,"text":"Just behind the scenes, there have always been women\npresent within the work rooms in Savile Row,"},{"start":64.64,"end":74.56,"text":"but now there's more women rising to client -facing\nroles and more prominent positions within the trade,\nsuch as myself as a business owner and as a head\ncutter."},{"start":75.92,"end":83.96000000000001,"text":"There's more women coming through as apprentices, and\nactually over 65 % of the newly qualified tailors last\nyear were women."},{"start":83.96000000000001,"end":87.42,"text":"Coming back to Savile Row is like a return home for\nyou?"},{"start":87.94,"end":88.38,"text":"Absolutely."},{"start":88.6,"end":90.46000000000001,"text":"I grew up in this community."},{"start":91.24,"end":93.64,"text":"I started here as a young graduate from college"},{"start":94.68,"end":99.42,"text":"and trained at number one Savile Row and was there for\n15 years."},{"start":100.44,"end":101.92,"text":"As I say, we all know each other."},{"start":101.94,"end":103.28,"text":"It's a very small network."},{"start":103.5,"end":108.1,"text":"I've been very encouraged and welcomed by the Savile\nRow Bespoke Association."},{"start":108.7,"end":110.2,"text":"It's almost like coming home."},{"start":110.36,"end":111.2,"text":"I'm one of them."},{"start":111.2,"end":116.74000000000001,"text":"We all work in the same way, with the same values and\nprinciples about our work."},{"start":118.24000000000001,"end":120.64,"text":"It's a great thing and it means a lot to me."},{"start":120.96,"end":129.36,"text":"Not knowing much about the industry, I was surprised\nthat there wasn't a female name on this street already,\nthis very famous street already that's known worldwide."},{"start":129.74,"end":135,"text":"Are you hoping that what happened today will see more\nfemale tailors coming here?"},{"start":135.14,"end":135.66,"text":"Absolutely."},{"start":136.8,"end":144.48,"text":"It's a mix of all sorts of different tailoring houses,\nsome of the oldest ones have been here since the early\n1800s."},{"start":144.48,"end":150.02,"text":"It's nice to be a new modern tailoring house with my\nname above the door."},{"start":150.24,"end":154.52,"text":"I think there will definitely be more women in the\nfuture potentially opening business here."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1  It is famous for selling high-quality, handmade men’s suits.\n2  She is a tailor. She is the first female Master Tailor on\nSavile Row. / She is the first woman to have her name\nabove the door on Savile Row.\n3  More women are becoming tailors; more women are\ngetting more important jobs.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":55,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U07-question:b5151","book":3,"unit":7,"track":"RW","topic":"FASHION","les ncers online? Tell your partner about them.","options":[],"type":"discuss/open"},{"kind":"item","id":"b5158.i03","label":"3","prompt":"Do you ever buy used clothing? Why / Why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U07-question:b5163","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":1,"order":10,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article on pages 151–152. Match the headings (a–d) below to the paragraphs (1–4).","pages":[152],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/105958451b20d41cb3951329e04a1de4f7958dd21fecb2f7d1ae39dc56085392.png"],"provided":"","items":[{"id":"b5163.i01","label":"1","prompt":"Paragraph 1","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"},{"id":"b5163.i02","label":"2","prompt":"Paragraph 2","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"},{"id":"b5163.i03","label":"3","prompt":"Paragraph 3","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"},{"id":"b5163.i04","label":"4","prompt":"Paragraph 4","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5163.i01","label":"1","prompt":"Paragraph 1","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"},{"kind":"item","id":"b5163.i02","label":"2","prompt":"Paragraph 2","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"}],[{"kind":"item","id":"b5163.i03","label":"3","prompt":"Paragraph 3","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"},{"kind":"item","id":"b5163.i04","label":"4","prompt":"Paragraph 4","options":["Is thrifting hurting poor communities?","Thrifting – a popular but controversial activity","Is thrifting a sustainable option?","Who are the new thrifters?"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B03-RW-U07-classroom:material:RW-M03","title":"READING 1","text":"[IMAGE_1]\n1 In January 2023, 19-year-old Jacklyn Wells posted the results of her latest shopping trip on TikTok, where she has more than 400,000 followers. Two months later, more than six million people had viewed her post, and quite a few of them were very angry. Why were so many people interested in her shopping trip? And why were some of them upset about it? Wells is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n[IMAGE_2]\n2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n[IMAGE_3]\n[IMAGE_4]\n3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n[IMAGE_5]\n4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n[IMAGE_1]\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n[IMAGE_2]","screens":["[IMAGE_1]\n1 In January 2023, 19-year-old Jacklyn Wells posted the results of her latest shopping trip on TikTok, where she has more than 400,000 followers. Two months later, more than six million people had viewed her post, and quite a few of them were very angry. Why were so many people interested in her shopping trip? And why were some of them upset about it? Wells is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n[IMAGE_2]","2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n[IMAGE_3]\n[IMAGE_4]","3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n[IMAGE_5]","4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n[IMAGE_1]\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n[IMAGE_2]"],"sources":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cdb68541824da66723641b1953a4d0d51c536df8af39733cba2915526473ba36.png","width":772,"height":1040},{"page":152,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c73510 ls is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n[IMAGE_2]","2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n[IMAGE_3]\n[IMAGE_4]","3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n[IMAGE_5]","4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n[IMAGE_1]\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n[IMAGE_2]"],"sources":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cdb68541824da66723641b1953a4d0d51c536df8af39733cba2915526473ba36.png","width":772,"height":1040},{"page":152,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/105958451b20d41cb3951329e04a1de4f7958dd21fecb2f7d1ae39dc56085392.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_78ce7aa0bfc645a5.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":10,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U07-question:b5191","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":1 our/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/19b379ad7e2ee826e8652e1376312bbddaf4bbcdc332b6f465858832ecdc762d.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U07-question:b5176","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":2,"order":17,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREVIEWING"},"instruction":"Close your books. Listen to your teacher read an introduction to an essay about offshore production. In your notebook, write down the key words and phrases you hear.","pages":[154],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/19b379ad7e2ee826e8652e1376312bbddaf4bbcdc332b6f465858832ecdc762d.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B03-RW-U07-classroom:material:RW-M04","title":"READING 2","text":"OFFSHORE PRODUCTION\n[IMAGE_1]\n1 The world's consumption of fashion is huge. To give just one example, the European Union imported more than €29 billion worth of clothing in 2020. As consumption has risen, prices have fallen. Today, a hand-finished shirt may cost as little as five euros. To make clothes at these low prices, companies have to keep costs down. One way they do this is by using offshore production. Large multinational companies outsource their production to developing countries like Egypt or Cambodia, where workers are paid much less than in developed countries. Supporters of outsourcing claim that it helps local economies, but I believe it is harmful for two main reasons.\n2 Some experts, like the economist David Schneider, say that outsourcing benefits local economies by providing jobs at higher wages than local workers can make by working in agriculture. Supporters also point out that people in developing countries often line up to take jobs in multinational factories. While this is true, these workers, many of them women and children, often work 14 hours a day and earn less than €100 a month. One study of 15 countries found that textile workers earned less than 40% of the money they needed to live on each month. In some countries, this figure is even lower. Also, most workers are paid by the piece. This means they might earn only a few cents for making a dress which sells for hundreds of euros in Europe. Such low wages are wrong and unfair. As Priya Kapoor, a human rights researcher in Delhi, says, 'Garment workers in countries like India and Bangladesh can't afford to pay their basic needs like food and healthcare. We need to establish a fair wage for the work they do.'\n3 Supporters of outsourcing also claim that overseas factories have become safer and more ethical in recent years. Some factories in China now provide centres for their workers, for instance. But working conditions in many offshore factories remain uncomfortable and unsafe. Worker protection laws, like those in developed nations, often don't exist or are not followed. As a result, workers are exposed to chemicals, dust and unsafe levels of noise from sewing machines. I saw this myself when I visited a clothing factory in Bangladesh in 2020. The noise was so loud that I had to cover my ears. Moreover, factory buildings are often unsafe, and horrible accidents happen. For example, the whole world was shocked in 2012 when a fire broke out at a garment factory in Dhaka, Bangladesh, killing 117 people and injuring 200.\n4 In conclusion, although supporters of outsourcing provide a number of convincing arguments, in my opinion these do not justify the low wages and dangerous conditions found in many overseas factories. If multinationals are going to continue to benefit from low production costs by using overseas suppliers, I believe they should contribute a much larger share of their massive profits to correcting these stance. But working conditions in many offshore factories remain uncomfortable and unsafe. Worker protection laws, like those in developed nations, often don't exist or are not followed. As a result, workers are exposed to chemicals, dust and unsafe levels of noise from sewing machines. I saw this myself when I visited a clothing factory in Bangladesh in 2020. The noise was so loud that I had to cover my ears. Moreover, factory buildings are often unsafe, and horrible accidents happen. For example, the whole world was shocked in 2012 when a fire broke out at a garment factory in Dhaka, Bangladesh, killing 117 people and injuring 200.","4 In conclusion, although supporters of outsourcing provide a number of convincing arguments, in my opinion these do not justify the low wages and dangerous conditions found in many overseas factories. If multinationals are going to continue to benefit from low production costs by using overseas suppliers, I believe they should contribute a much larger share of their massive profits to correcting these problems and improving social conditions in the countries where they are located."],"sources":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4bdcd2a98105293bc929bce9926151817742a79b0c67fac51604d057f37f8201.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7401b6f3eb4703a4.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3 ,"except for","in addition to","in spite of"],"type":"gap/open"},{"kind":"item","id":"b5206.i04","label":"4","prompt":"China, ______ the USA and India, is a world-leading exporter of cotton.","options":["along with","except for","in addition to","in spite of"],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 In addition to 2 In spite of 3 except for\n4 along with\nè Are your answers true for all students in your class?\nè How can you adapt your teaching or the material\nto meet your students’ needs?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U07-question:b5209","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":2,"order":33,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the thesis statement for an essay about the negative effects of the fashion industry on young people's body image. Read the possible topic sentences (a–c) and choose the one that best supports the thesis statement.","pages":[162],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a0a8aecde886b6324d694ea9ac7d052675c3d7ce0f7033c8ee8993896c290d6.png"],"provided":"Thesis statement: The fashion industry is important to the economy. However, many would argue that it has a negative influence on young people's body image and can cause serious issues, such as depression and eating problems.","items":[{"id":"b5209.i01","label":"1","prompt":"Choose the topic sentence that best supports the thesis statement.","options":["The fashion industry's unrealistic expectation of the human body can cause young people to become depressed about how they look.","Pressure from parents to do well in school or get a job can also cause young people to become depressed.","Rates of depression are especially high among young adults between the ages of 18 and 30."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Thesis statement: The fashion industry is important to the economy. However, many would argue that it has a negative influence on young people's body image and can cause serious issues, such as depression and eating problems."},{"kind":"item","id":"b5209.i01","label":"1","prompt":"Choose the topic sentence that best supports the thesis statement.","options":["The fashion industry's unrealistic expectation of the human body can cause young people to become depressed about how they look.","Pressure from parents to do well in school or get a job can also cause young people to become depressed.","Rates of depression are especially high among young adults between the ages of 18 and 30."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":59,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U07-question:b5210","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":2,"order":34,"module":"ACADEMIC WRITING SKILLS","ex":"2","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read the body paragraph of a student's essay below. Then, circle the topic sentence, where the writer states his or her argument.","pages":[163],"sourceIma ]},{"id":"B03-RW-U07-question:b5220","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"8","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"COHESION"},"instruction":"Read the summary of some of the ideas in Reading 2. Complete the paragraph using the words in the box to make it cohesive.","pages":[165],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a538d6e29872163588cf49ed9ef2c2f62552a7212447c2ab108f25e74bd51236.png"],"provided":"In addition Meanwhile ones that them these they This\n\nThe speed of change in the fashion world means that we buy more clothes than we need. Retailers create a constant demand for new clothes by selling (1) ____ cheaply and changing items every week. To make space for new clothes, customers throw away the old (2) ____ as soon as (3) ____ are out of style. (4) ____ way of shopping leads to a higher demand for cotton, and (5) ____ means more intensive agriculture and damage to the environment. (6) ____, many of (7) ____ cheap clothes are sewn in sweatshops in countries where workers earn less than a euro a day. (8) ____, clothing companies keep nearly all the profits.","items":[{"id":"b5220.i01","label":"1","prompt":"The speed of change in the fashion world means that we buy more clothes than we need. Retailers create a constant demand for new clothes by selling (1) ______ cheaply and changing items every week. To make space for new clothes, customers throw away the old (2) ______ as soon as (3) ______ are out of style. (4) ______ way of shopping leads to a higher demand for cotton, and (5) ______ means more intensive agriculture and damage to the environment. (6) ______, many of (7) ______ cheap clothes are sewn in sweatshops in countries where workers earn less than a euro a day. (8) ______, clothing companies keep nearly all the profits.","options":["In addition","Mean provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"tailor","pos":"(n)","definition":"a person whose job it is to make or mend clothes, especially men's clothes","example":"The tailor shortened the sleeves of my jacket.","wordAudio":"tailor","cardWord":false},{"term":"master tailor","pos":"(n)","definition":"the head tailor of a company who teaches other, less experienced tailors","example":"The master tailor teaches the team to cut cloth by hand.","wordAudio":"master tailor","cardWord":false},{"term":"prominent position","pos":"(n phr)","definition":"important job","example":"She holds a prominent position at the company.","wordAudio":"prominent position","cardWord":false},{"term":"apprentice","pos":"(n)","definition":"a person who is learning a job by working for someone who already has skills and experience","example":"The apprentice learnt how to measure a customer for a suit.","wordAudio":"apprentice","cardWord":false},{"term":"values","pos":"(n pl)","definition":"what you believe is the right and wrong way to do things. what you believe is important in life","example":"Her values include honesty and respect for others.","wordAudio":"values","cardWord":false},{"term":"principles","pos":"(n pl)","definition":"what you believe is the right and wrong way to do things. what you believe is important in life","example":"He follows the same principles in his work and at home.","wordAudio":"principles","cardWord":false}]]}},{"id":"B03-RW-U07-classroom:video","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0452ac072df6e105ef69e2a57241cc443c331b66c5b3ccb47d23c7fe1d22c67b.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/8ed83f4b2f986ff5417a8855-L3RW-U07.mp4","captions":[{"start":0,"end":0.9,"text":"Savile Row,"},{"start":1.32,"end":3.82,"text":"in the expensive area of Mayfair, London,"},{"start":4.14,"end":8.94,"text":"is a street which is famous around the world for its\ntop -quality men's suits."},{"start":13.2,"end":19.18,"text":"A two -piece suit made by hand by a Savile Row tailor\ninvolves at least 50 hours of work."},{"start":19.74,"end":26.1,"text":"The suits made on Savile Row were traditionally for\nmen, but women have always worked there too."},{"start":26.1,"end":27,"text":"However,"},{"start":27.34,"end":28.32,"text":"until now,"},{"start":28.64,"end":33.82,"text":"no woman has made it to the top on Savile Row and become a\nmaster tailor."},{"start":36.8,"end":41.06,"text":"Catherine Sargent is the first female master tailor on\nSavile Row."},{"start":41.68,"end":45.8,"text":"Her new shop sells handmade suits for both men and\nwomen."},{"start":46.26,"end":53.24,"text":"OK, so, Catherine, how significant is it that you are\nthe first woman to have her name above the door of a\nshop on Savile Row?"},{"start":53.54,"end":59.22,"text":"I just think it's a sign of the times, really, that\nthere's far more women in the industry now."},{"start":59.96,"end":64.28,"text":"Just behind the scenes, there have always been women\npresent within the work rooms in Savile Row,"},{"start":64.64,"end":74.56,"text":"but now there's more women rising to client -facing\nroles and more prominent positions within the trade,\nsuch as myself as a business owner and as a head\ncutter."},{"start":75.92,"end":83.96000000000001,"text":"There's more women coming through as apprentices, and\nactually over 65 % of the newly qualified tailors last\nyear were women."},{"start":83.96000000000001,"end":87.42,"text":"Coming back to Savile Row is like a return home for\nyou?"},{"start":87.94,"end":88.38,"text":"Absolutely."},{"start":88.6,"end":90.46000000000001,"text":"I grew up in this community."},{"start":91.24,"end":93.64,"text":"I started here as a young graduate from college"},{"start":94.68,"end":99.42,"text":"and trained at number one Savile Row and was there for\n15 years."},{"start":100.44,"end":101.92,"text":"As I say, we all know each other."},{"start":101.94,"end":103.28,"text":"It's a very small network."},{"start":103.5,"end":108.1,"text":"I've been very encouraged and welcomed by the Savile\nRow Bespoke Association."},{"start":108.7,"end":110.2,"text":"It's almost like coming home."},{"start":110.36,"end":111.2,"text":"I'm one of them."},{"start":111.2,"end":116.74000000000001,"text":"We all work in the same way, with the same values and\nprinciples about our work."},{"start":118.24000000000001,"end":120.64,"text":"It's a great thing and it means a lot to me."},{"start":120.96,"end":129.36,"text":"Not knowing much about the industry, I was surprised\nthat there wasn't a female name on this street already,\nthis very famous street already that's known worldwide."},{"start":129.74,"end":135,"text":"Are you hoping that what happened today will see more\nfemale tailors coming here?"},{"start":135.14,"end":135.66,"text":"Absolutely."},{"start":136.8,"end":144.48,"text":"It's a mix of all sorts of different tailoring houses,\nsome of the oldest ones have been here since the early\n1800s."},{"start":144.48,"end":150.02,"text":"It's nice to be a new modern tailoring house with my\nname above the door."},{"start":150.24,"end":154.52,"text":"I think there will definitely be more women in the\nfuture potentially opening business here."}],"launchInline":true}},{"id":"B03-RW-U07-classroom:resource:b5156","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae6fb0c5bf47659da2ba20d5160d249f37a2b104915393fd8fe834a408cce1bd.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["brand (n) a product made by a company that has a specific name\nconsumer (n) a person who buys things\ncontroversial (adj) causing disagreement or discussion\nhesitate (v) to stop briefly before doing or saying something","manufacture (v) to produce a large number of things with machines\nmarket (n) the business for a particular product\nvolume (n) number; amount"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U07-classroom:material:RW-M03","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[151,152],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cdb68541824da66723641b1953a4d0d51c536df8af39733cba2915526473ba36.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/105958451b20d41cb3951329e04a1de4f7958dd21fecb2f7d1ae39dc56085392.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"[IMAGE_1]\n1 In January 2023, 19-year-old Jacklyn Wells posted the results of her latest shopping trip on TikTok, where she has more than 400,000 followers. Two months later, more than six million people had viewed her post, and quite a few of them were very angry. Why were so many people interested in her shopping trip? And why were some of them upset about it? Wells is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n[IMAGE_2]","sourcePage":151},{"body":"2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n[IMAGE_3]\n[IMAGE_4]","sourcePage":151},{"body":"3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n[IMAGE_5]","sourcePage":151},{"body":"4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n[IMAGE_1]\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n[IMAGE_2]","sourcePage":152}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U07-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"[IMAGE_1]","pages":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cdb68541824da66723641b1953a4d0d51c536df8af39733cba2915526473ba36.png","width":772,"height":1040},{"page":152,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/105958451b20d41cb3951329e04a1de4f7958dd21fecb2f7d1ae39dc56085392.png","width":772,"height":1040}],"source":151,"embeddedIn":null,"photo":null,"clearPages":[{"body":"[IMAGE_1]\n1 In January 2023, 19-year-old Jacklyn Wells posted the results of her latest shopping trip on TikTok, where she has more than 400,000 followers. Two months later, more than six million people had viewed her post, and quite a few of them were very angry. Why were so many people interested in her shopping trip? And why were some of them upset about it? Wells is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n[IMAGE_2]","sourcePage":151},{"body":"2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n[IMAGE_3]\n[IMAGE_4]","sourcePage":151},{"body":"3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n[IMAGE_5]","sourcePage":151},{"body":"4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n[IMAGE_1]\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n[IMAGE_2]","sourcePage":152}],"text":"[IMAGE_1]\n1 In January 2023, 19-year-old Jacklyn Wells posted the results of her latest shopping trip on TikTok, where she has more than 400,000 followers. Two months later, more than six million people had viewed her post, and quite a few of them were very angry. Why were so many people interested in her shopping trip? And why were some of them upset about it? Wells is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n[IMAGE_2]\n2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n[IMAGE_3]\n[IMAGE_4]\n3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n[IMAGE_5]\n4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n[IMAGE_1]\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n[IMAGE_2]","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_78ce7aa0bfc645a5.mp3"},"original":{"id":"B03-RW-U07-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U07","book":3,"track":"RW","unit":7,"title":"READING 1","kind":"material","pages":[151,152],"sourceImages":[{"page":151,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cdb68541824da66723641b1953a4d0d51c536df8af39733cba2915526473ba36.png","viewEvidenceReported":true},{"page":152,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/105958451b20d41cb3951329e04a1de4f7958dd21fecb2f7d1ae39dc56085392.png","viewEvidenceReported":true}],"text":"[IMAGE_1]\n\n1 In January 2023, 19-year-old Jacklyn Wells posted the results of her latest shopping trip on TikTok, where she has more than 400,000 followers. Two months later, more than six million people had viewed her post, and quite a few of them were very angry. Why were so many people interested in her shopping trip? And why were some of them upset about it? Wells is a thrifter and a reseller, and both have become controversial. Thrifting means shopping in stores that sell second-hand (already used) clothing and other items. In general, this clothing is inexpensive. Resellers buy second-hand clothes and then sell them online on sites such as Depop and Poshmark, usually at a much higher price.\n\n[IMAGE_2]\n\n2 Buying second-hand clothing has not always been in fashion. Used-clothing stores first appeared in the 19th century, and they were mostly for poor people. People who had to shop in these stores often felt ashamed. Recently however, internet influencers like Wells have made thrifting very popular, and this trend is expected to continue. The global second-hand clothing market is growing three times faster than the general clothing market. It is expected to reach $300 billion per year by 2026, and about half of those sales will be online (See Figure 1). Today, many thrifters are not poor, and they don't need to buy second-hand clothing. For them, thrifting is a hobby, and sometimes, a business. They enjoy the challenge of finding unusual and attractive items at low prices. Then they share the results online with their followers, and, like Wells, they often resell.\n\n[IMAGE_3]\n\n[IMAGE_4]\n\n3 Some people are upset about this trend. They say that new thrifters are taking items away from people who don't have enough money to buy new clothes. In addition, the popularity of thrifting has led to higher prices for everyone. Although it is true that new thrifters often buy the most expensive brands of clothing, this probably makes very little difference in the market. The volume of second-hand clothing is so high that only about 20% is sold online or in shops. The rest is shipped to developing countries or thrown away.\n\n[IMAGE_5]\n4 Many consumers also choose second-hand clothes instead of new because they believe it is a more sustainable option. Giving old clothes a second life saves resources compared to manufacturing new clothes. Thrifting can be a good sustainability strategy. However, it is no longer a good strategy when it becomes a reason to waste. A shopper may hesitate before spending $200 on a new jacket, but it's much easier to buy five second-hand jackets at the same price. As a result, thrifting may encourage people to buy much more than they need, especially if they think they are helping the planet!\n\n[IMAGE_1]\n\n5 Both economic and sustainability experts say the best strategy is to buy only what you need, new or second-hand. Before you go shopping, first look in your wardrobe. The best option is to wear what you already own.\n\n[IMAGE_2]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5160","b5161"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_78ce7aa0bfc645a5.mp3","continueOnPage":true}},{"id":"B03-RW-U07-classroom:material:RW-M04","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREVIEWING"},"pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4bdcd2a98105293bc929bce9926151817742a79b0c67fac51604d057f37f8201.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"OFFSHORE PRODUCTION\n[IMAGE_1]\n1 The world's consumption of fashion is huge. To give just one example, the European Union imported more than €29 billion worth of clothing in 2020. As consumption has risen, prices have fallen. Today, a hand-finished shirt may cost as little as five euros. To make clothes at these low prices, companies have to keep costs down. One way they do this is by using offshore production. Large multinational companies outsource their production to developing countries like Egypt or Cambodia, where workers are paid much less than in developed countries. Supporters of outsourcing claim that it helps local economies, but I believe it is harmful for two main reasons.","sourcePage":155},{"body":"2 Some experts, like the economist David Schneider, say that outsourcing benefits local economies by providing jobs at higher wages than local workers can make by working in agriculture. Supporters also point out that people in developing countries often line up to take jobs in multinational factories. While this is true, these workers, many of them women and children, often work 14 hours a day and earn less than €100 a month. One study of 15 countries found that textile workers earned less than 40% of the money they needed to live on each month. In some countries, this figure is even lower. Also, most workers are paid by the piece. This means they might earn only a few cents for making a dress which sells for hundreds of euros in Europe. Such low wages are wrong and unfair. As Priya Kapoor, a human rights researcher in Delhi, says, 'Garment workers in countries like India and Bangladesh can't afford to pay their basic needs like food and healthcare. We need to establish a fair wage for the work they do.'","sourcePage":155},{"body":"3 Supporters of outsourcing also claim that overseas factories have become safer and more ethical in recent years. Some factories in China now provide centres for their workers, for instance. But working conditions in many offshore factories remain uncomfortable and unsafe. Worker protection laws, like those in developed nations, often don't exist or are not followed. As a result, workers are exposed to chemicals, dust and unsafe levels of noise from sewing machines. I saw this myself when I visited a clothing factory in Bangladesh in 2020. The noise was so loud that I had to cover my ears. Moreover, factory buildings are often unsafe, and horrible accidents happen. For example, the whole world was shocked in 2012 when a fire broke out at a garment factory in Dhaka, Bangladesh, killing 117 people and injuring 200.","sourcePage":155},{"body":"4 In conclusion, although supporters of outsourcing provide a number of convincing arguments, in my opinion these do not justify the low wages and dangerous conditions found in many overseas factories. If multinationals are going to continue to benefit from low production costs by using overseas suppliers, I believe they should contribute a much larger share of their massive profits to correcting these problems and improving social conditions in the countries where they are located.","sourcePage":155}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U07-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"OFFSHORE PRODUCTION","pages":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4bdcd2a98105293bc929bce9926151817742a79b0c67fac51604d057f37f8201.png","width":772,"height":1040}],"source":155,"embeddedIn":null,"photo":null,"clearPages":[{"body":"OFFSHORE PRODUCTION\n[IMAGE_1]\n1 The world's consumption of fashion is huge. To give just one example, the European Union imported more than €29 billion worth of clothing in 2020. As consumption has risen, prices have fallen. Today, a hand-finished shirt may cost as little as five euros. To make clothes at these low prices, companies have to keep costs down. One way they do this is by using offshore production. Large multinational companies outsource their production to developing countries like Egypt or Cambodia, where workers are paid much less than in developed countries. Supporters of outsourcing claim that it helps local economies, but I believe it is harmful for two main reasons.","sourcePage":155},{"body":"2 Some experts, like the economist David Schneider, say that outsourcing benefits local economies by providing jobs at higher wages than local workers can make by working in agriculture. Supporters also point out that people in developing countries often line up to take jobs in multinational factories. While this is true, these workers, many of them women and children, often work 14 hours a day and earn less than €100 a month. One study of 15 countries found that textile workers earned less than 40% of the money they needed to live on each month. In some countries, this figure is even lower. Also, most workers are paid by the piece. This means they might earn only a few cents for making a dress which sells for hundreds of euros in Europe. Such low wages are wrong and unfair. As Priya Kapoor, a human rights researcher in Delhi, says, 'Garment workers in countries like India and Bangladesh can't afford to pay their basic needs like food and healthcare. We need to establish a fair wage for the work they do.'","sourcePage":155},{"body":"3 Supporters of outsourcing also claim that overseas factories have become safer and more ethical in recent years. Some factories in China now provide centres for their workers, for instance. But working conditions in many offshore factories remain uncomfortable and unsafe. Worker protection laws, like those in developed nations, often don't exist or are not followed. As a result, workers are exposed to chemicals, dust and unsafe levels of noise from sewing machines. I saw this myself when I visited a clothing factory in Bangladesh in 2020. The noise was so loud that I had to cover my ears. Moreover, factory buildings are often unsafe, and horrible accidents happen. For example, the whole world was shocked in 2012 when a fire broke out at a garment factory in Dhaka, Bangladesh, killing 117 people and injuring 200.","sourcePage":155},{"body":"4 In conclusion, although supporters of outsourcing provide a number of convincing arguments, in my opinion these do not justify the low wages and dangerous conditions found in many overseas factories. If multinationals are going to continue to benefit from low production costs by using overseas suppliers, I believe they should contribute a much larger share of their massive profits to correcting these problems and improving social conditions in the countries where they are located.","sourcePage":155}],"text":"OFFSHORE PRODUCTION\n[IMAGE_1]\n1 The world's consumption of fashion is huge. To give just one example, the European Union imported more than €29 billion worth of clothing in 2020. As consumption has risen, prices have fallen. Today, a hand-finished shirt may cost as little as five euros. To make clothes at these low prices, companies have to keep costs down. One way they do this is by using offshore production. Large multinational companies outsource their production to developing countries like Egypt or Cambodia, where workers are paid much less than in developed countries. Supporters of outsourcing claim that it helps local economies, but I believe it is harmful for two main reasons.\n2 Some experts, like the economist David Schneider, say that outsourcing benefits local economies by providing jobs at higher wages than local workers can make by working in agriculture. Supporters also point out that people in developing countries often line up to take jobs in multinational factories. While this is true, these workers, many of them women and children, often work 14 hours a day and earn less than €100 a month. One study of 15 countries found that textile workers earned less than 40% of the money they needed to live on each month. In some countries, this figure is even lower. Also, most workers are paid by the piece. This means they might earn only a few cents for making a dress which sells for hundreds of euros in Europe. Such low wages are wrong and unfair. As Priya Kapoor, a human rights researcher in Delhi, says, 'Garment workers in countries like India and Bangladesh can't afford to pay their basic needs like food and healthcare. We need to establish a fair wage for the work they do.'\n3 Supporters of outsourcing also claim that overseas factories have become safer and more ethical in recent years. Some factories in China now provide centres for their workers, for instance. But working conditions in many offshore factories remain uncomfortable and unsafe. Worker protection laws, like those in developed nations, often don't exist or are not followed. As a result, workers are exposed to chemicals, dust and unsafe levels of noise from sewing machines. I saw this myself when I visited a clothing factory in Bangladesh in 2020. The noise was so loud that I had to cover my ears. Moreover, factory buildings are often unsafe, and horrible accidents happen. For example, the whole world was shocked in 2012 when a fire broke out at a garment factory in Dhaka, Bangladesh, killing 117 people and injuring 200.\n4 In conclusion, although supporters of outsourcing provide a number of convincing arguments, in my opinion these do not justify the low wages and dangerous conditions found in many overseas factories. If multinationals are going to continue to benefit from low production costs by using overseas suppliers, I believe they should contribute a much larger share of their massive profits to correcting these problems and improving social conditions in the countries where they are located.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7401b6f3eb4703a4.mp3"},"original":{"id":"B03-RW-U07-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U07","book":3,"track":"RW","unit":7,"title":"READING 2","kind":"material","pages":[155],"sourceImages":[{"page":155,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4bdcd2a98105293bc929bce9926151817742a79b0c67fac51604d057f37f8201.png","viewEvidenceReported":true}],"text":"OFFSHORE PRODUCTION\n\n[IMAGE_1]\n\n1 The world's consumption of fashion is huge. To give just one example, the European Union imported more than €29 billion worth of clothing in 2020. As consumption has risen, prices have fallen. Today, a hand-finished shirt may cost as little as five euros. To make clothes at these low prices, companies have to keep costs down. One way they do this is by using offshore production. Large multinational companies outsource their production to developing countries like Egypt or Cambodia, where workers are paid much less than in developed countries. Supporters of outsourcing claim that it helps local economies, but I believe it is harmful for two main reasons.\n\n2 Some experts, like the economist David Schneider, say that outsourcing benefits local economies by providing jobs at higher wages than local workers can make by working in agriculture. Supporters also point out that people in developing countries often line up to take jobs in multinational factories. While this is true, these workers, many of them women and children, often work 14 hours a day and earn less than €100 a month. One study of 15 countries found that textile workers earned less than 40% of the money they needed to live on each month. In some countries, this figure is even lower. Also, most workers are paid by the piece. This means they might earn only a few cents for making a dress which sells for hundreds of euros in Europe. Such low wages are wrong and unfair. As Priya Kapoor, a human rights researcher in Delhi, says, 'Garment workers in countries like India and Bangladesh can't afford to pay their basic needs like food and healthcare. We need to establish a fair wage for the work they do.'\n\n3 Supporters of outsourcing also claim that overseas factories have become safer and more ethical in recent years. Some factories in China now provide centres for their workers, for instance. But working conditions in many offshore factories remain uncomfortable and unsafe. Worker protection laws, like those in developed nations, often don't exist or are not followed. As a result, workers are exposed to chemicals, dust and unsafe levels of noise from sewing machines. I saw this myself when I visited a clothing factory in Bangladesh in 2020. The noise was so loud that I had to cover my ears. Moreover, factory buildings are often unsafe, and horrible accidents happen. For example, the whole world was shocked in 2012 when a fire broke out at a garment factory in Dhaka, Bangladesh, killing 117 people and injuring 200.\n\n4 In conclusion, although supporters of outsourcing provide a number of convincing arguments, in my opinion these do not justify the low wages and dangerous conditions found in many overseas factories. If multinationals are going to continue to benefit from low production costs by using overseas suppliers, I believe they should contribute a much larger share of their massive profits to correcting these problems and improving social conditions in the countries where they are located.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5179"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_7401b6f3eb4703a4.mp3","continueOnPage":true}},{"id":"B03-RW-U07-classroom:review-1","book":3,"unit":7,"track":"RW","topic":"FASHION","lesson":1,"mo
