nd":35.18,"text":"But why are the buildings blue?"},{"start":36.94,"end":40.84,"text":"Well, the answer is probably mosquitoes."},{"start":42.32,"end":44.22,"text":"People don't like mosquitoes."},{"start":45.92,"end":50.06,"text":"And some people think that mosquitoes don't like blue\nthings."},{"start":50.06,"end":52.7,"text":"So when a house is blue,"},{"start":53.16,"end":54.78,"text":"mosquitoes don't come."},{"start":56.34,"end":59.22,"text":"Another colorful place is Burano, in Italy."},{"start":60.46,"end":62.92,"text":"The buildings here are red, blue,"},{"start":63.42,"end":63.9,"text":"green,"},{"start":64.32,"end":64.92,"text":"and yellow."},{"start":66.74,"end":69.5,"text":"But why is Burano so colorful?"},{"start":71.56,"end":72.1,"text":"Well,"},{"start":72.48,"end":74.12,"text":"the village is on an island."},{"start":75.53999999999999,"end":77.08,"text":"In bad weather,"},{"start":77.46000000000001,"end":79.1,"text":"it's difficult to see."},{"start":80.84,"end":84.03999999999999,"text":"But colorful buildings are easy to see."},{"start":85.56,"end":93.18,"text":"And so perhaps the color of the buildings helped people\nin boats see the island and get home safe."},{"start":95.25999999999999,"end":96.36,"text":"In Lake Inli,"},{"start":96.7,"end":97.44,"text":"in Myanmar,"},{"start":97.94,"end":99.62,"text":"the main job is fishing."},{"start":99.62,"end":103.14,"text":"And so the people live near the fish."},{"start":104.94,"end":105.3,"text":"Here,"},{"start":105.64,"end":107.46000000000001,"text":"the houses are on the lake."},{"start":109.22,"end":111.32,"text":"Under the houses, there's water."},{"start":111.6,"end":112.62,"text":"And in the water,"},{"start":113.86,"end":114.58,"text":"there's food."},{"start":115.5,"end":117.2,"text":"But it's not all water."},{"start":118.06,"end":123.24,"text":"These small green islands on Lake Inli are gardens for\nvegetables."},{"start":124.74,"end":125.96,"text":"Of course,"},{"start":126.46,"end":129.88,"text":"people don't only build homes to be near to their food."},{"start":131.24,"end":132.54,"text":"This is Iceland,"},{"start":133.14,"end":135.46,"text":"with its beautiful mountains and rivers."},{"start":137.07999999999998,"end":139.56,"text":"In Iceland, there aren't many trees."},{"start":141.22,"end":144.52,"text":"And so the old houses have grass on the roofs."},{"start":146.64,"end":148.34,"text":"Iceland is a cold country,"},{"start":148.92000000000002,"end":151.8,"text":"but a grass roof can make a warm home."},{"start":153.06,"end":155.8,"text":"So what about warmer countries?"},{"start":157.7,"end":161.1,"text":"Here in Turkey are the hills of Cappadocia."},{"start":162.57999999999998,"end":164.72,"text":"But these are not just hills."},{"start":165.5,"end":166.76,"text":"They're also houses."},{"start":168.8,"end":169.94,"text":"Inside the hills,"},{"start":170.36,"end":174.86,"text":"people cut the rock and made safe places to live."},{"start":175.94,"end":177.78,"text":"And on hot days,"},{"start":178.3,"end":179.92000000000002,"text":"the rooms aren't too hot."},{"start":181.8,"end":183.38,"text":"All around the world,"},{"start":183.78,"end":187.02,"text":"people live in many different types of houses."},{"start":189.1,"end":190.88,"text":"Some houses are close together."},{"start":192.96,"end":194.38,"text":"Some are on the water."},{"start":196.4,"end":198.22,"text":"Some are high in the sky."},{"start":200.12,"end":202.84,"text":"What are the houses like in your country?"}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"la 3c 46 Se","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":48,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1310","book":1,"unit":6,"track":"LS ace for a new café. Compare your answer with a different group. Do you agree? Why / Why not?","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/77ba5b5f1397d837db4c1b57303b1feaecab6d23020e0f9fabcc28923a57b524.png"],"provided":"We agree with the other group. The best place for the café is ...\nWe disagree with the other group because ...","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"We agree with the other group. The best place for the café is ..."},{"kind":"text","text":"We disagree with the other group because ..."}]],"courseMaterials":[{"id":"B01-LS-U06-publisher-sheet:b1370","title":"CRITICAL THINKING Ex 4 原题面","pages":[141],"text":"\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>positive things\u003c/td>\u003ctd>negative things\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a near one of the busy main roads\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>b in the town\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>c on the beach\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>d on Green Town Island\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","screens":["\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>positive things\u003c/td>\u003ctd>negative things\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a near one of the busy main roads\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>b in the town\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>c on the beach\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>d on Green Town Island\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>"],"sources":[{"page":141,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/77ba5b5f1397d837db4c1b57303b1feaecab6d23020e0f9fabcc28923a57b524.png"}],"kind":"task_sheet","sourceBlockIds":["b1370"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"See Model Answer  Booklet p/0  for example  answers.\nUNLC; CK TEACHER DEVELOPMENT\nBE REFLECTIVE\nThink about  the following  questions:\n-+ Evaluate your own lesson. What were the\nstrengths  and weaknesses? What went well and what\ndid not  go so well? If you taught the lesson again,\nwhat would you do differently?\n-+ Think again about the Be confident section. How\nwould you  have answered this  question? What other\npositive or negative comments do you think were\nfound in the survey?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1373","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"order":40,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"REASONS, OPINIONS AND AGREEMENT"},"instruction":"6.6 Listen to and read three parts of Listening 2. Notice the underlined phrases. Why do the speakers use them?","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"],"provided":"1\nDale: OK, so we need a place for our new office. What about here?\nHakan: Where?\nDale: The city centre. What do you think?\nHakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.\nDale: Oh? Why not?\nHakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.\n2\nDale: What about here?\nHakan: The park?\nDale: Yes. It's quiet, and it's not far from a big road. What do you think?\nHakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?\nDale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.\n3\nHakan: Now what about the design? I think we should have a modem design with big windows. What about you?\nDale: Yes, I agree. Big windows are good.","items":[{"id":"b1373.i01","label":"1","prompt":"Why do the speakers use the underlined phrases?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1"},{"kind":"text","text":"Dale: OK, so we need a place for our new office. What about here?"},{"kind":"text","text":"Hakan: Where?"},{"kind":"text","text":"Dale: The city centre. What do you think?"},{"kind":"text","text":"Hakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there."},{"kind":"text","text":"Dale: Oh? Why not?"}],[{"kind":"text","text":"Hakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places."},{"kind":"text","text":"Dale: What about here?"},{"kind":"text","text":"Hakan: The park?"},{"kind":"text","text":"Dale: Yes. It's quiet, and it's not far from a big road. What do you think?"},{"kind":"text","text":"Hakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?"}],[{"kind":"text","text":"Dale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap."},{"kind":"text","text":"3"},{"kind":"text","text":"Hakan: Now what about the design? I think we should have a modem design with big windows. What about you?"},{"kind":"text","text":"Dale: Yes, I agree. Big windows are good."},{"kind":"item","id":"b1373.i01","label":"1","prompt":"Why do the speakers use the underlined phrases?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36627175a5d784c578995109dff040b719eb1a74a6fbfdfff73c3cf9b5b0fd93.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"People use the underlined phrases to give reasons, give\nopinions, ask for opinions or to agree or disagree.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1374","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"order":41,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"REASONS, OPINIONS AND AGREEMENT"},"instruction":"Work with a partner. Take turns to say an underlined phrase from Exercise 1. Your partner writes it in the correct place in the table.","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>give a reason\u003c/td>\u003ctd>give an opinion\u003c/td>\u003ctd>ask for an opinion\u003c/td>\u003ctd>agree or disagree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>What about here?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b1374.i01","label":"g ion is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.\n3\nHakan: Now what about the design? I think we should have a modem design with big windows. What about you?\nDale: Yes, I agree. Big windows are good.","screens":["1","Dale: OK, so we need a place for our new office. What about here?","Hakan: Where?","Dale: The city centre. What do you think?","Hakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.","Dale: Oh? Why not?","Hakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.","2","Dale: What about here?","Hakan: The park?","Dale: Yes. It's quiet, and it's not far from a big road. What do you think?","Hakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?","Dale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.","3","Hakan: Now what about the design? I think we should have a modem design with big windows. What about you?","Dale: Yes, I agree. Big windows are good."],"sources":[{"page":142,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"}],"kind":"task_sheet","sourceBlockIds":["b1373"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"give a reason:\nIt's near some good roads.\nBecause  the buildings  in the centre  are very old.\nIt's quiet and it's not  far from a big road.\nIt's good for travel.\nThe buildings  near the train station aren't  cheap.\ngive an opinion:\nIt's a good place.\nI don't think we should go there.\nIt's pretty far from the centre.\nThe train station is good.\nI think we should go with the park.\nI think we should  ha age","sourceBlockIds":[]},{"id":"B01-LS-U06-publisher-sheet:b1373","title":"PREPARATION FOR SPEAKING Ex 1 原题面","pages":[142],"text":"1\nDale: OK, so we need a place for our new office. What about here?\nHakan: Where?\nDale: The city centre. What do you think?\nHakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.\nDale: Oh? Why not?\nHakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.\n2\nDale: What about here?\nHakan: The park?\nDale: Yes. It's quiet, and it's not far from a big road. What do you think?\nHakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?\nDale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.\n3\nHakan: Now what about the design? I think we should have a modem design with big windows. What about you?\nDale: Yes, I agree. Big windows are good.","screens":["1","Dale: OK, so we need a place for our new office. What about here?","Hakan: Where?","Dale: The city centre. What do you think?","Hakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.","Dale: Oh? Why not?","Hakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.","2","Dale: What about here?","Hakan: The park?","Dale: Yes. It's quiet, and it's not far from a big road. What do you think?","Hakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?","Dale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.","3","Hakan: Now what about the design? I think we should have a modem design with big windows. What about you?","Dale: Yes, I agree. Big windows are good."],"sources":[{"page":142,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"}],"kind":"task_sheet","sourceBlockIds":["b1373"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 give a reason 2 Because 3 good for\n4 give an opinion 5 think 6 should  7 should\n8 ask for an opinion  9 about  10 Why\n11 agree or disagree 12 sure","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":52,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1394","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"order":51,"module":"SPEAKING TASK","ex":"2","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Work with a partner. You are going to open a new café in Green Town. Look back at your notes in the tables in the Critical thinking section (pages 140–141). Discuss what kind of café you want to open and where it should be. Use the words on pages 134 and 136 and the expressions in Exercise 1 to help you.","pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9ec7a20232abcbd0b14902cfb8f4b86a98c387255349533de39164f3439062c8.png"],"provided":"I think it should be near the beach.\nI don't think it should be near a busy road.\nI think it should be a quiet, traditional café.\nThe walls should be blue and ...\nThe tables should be wooden ...\nThe chairs should be ...","items":[],"layout":"list","references":[{"id":"B01-LS-U06-question:b1367","kind":"student-work","title":"CRITICAL THINKING Ex ":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"grass","pos":"(n)","definition":"a plant with thin, green leaves that grows close to the ground in gardens and fields","example":"We sat on the grass to eat our lunch.","wordAudio":"grass","cardWord":false},{"term":"hill","pos":"(n)","definition":"a small mountain","example":"They walked to the top of the hill.","wordAudio":"hill","cardWord":false},{"term":"island","pos":"(n)","definition":"a piece of land that has water all around it","example":"We took a boat to the island.","wordAudio":"island","cardWord":false},{"term":"rock","pos":"(n)","definition":"a very hard part of the ground","example":"A large rock was blocking the path.","wordAudio":"rock","cardWord":true},{"term":"village","pos":"(n)","definition":"a small town, usually in the countryside","example":"My grandfather lives in a small village.","wordAudio":"village","cardWord":false},{"term":"warm","pos":"(adj)","definition":"not cold, but not very hot","example":"It is warm enough to eat outside today.","wordAudio":"warm","cardWord":false}]]}},{"id":"B01-LS-U06-classroom:video","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"UNDERSTANDING MAIN IDEAS"},"pages":[128],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/feae4af704644c1db0224c81d3d82f1415e5e8e977fc67ae5b30e65d519f9295.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c510f9cc5f7ccd801325914b-L1LS-U06.mp4","captions":[{"start":0,"end":2.7,"text":"All around the world,"},{"start":3.9,"end":5.8,"text":"people's homes look different."},{"start":6.88,"end":8.52,"text":"Very different, in fact."},{"start":9.74,"end":11.06,"text":"So why is that?"},{"start":11.72,"end":12.16,"text":"Well,"},{"start":12.78,"end":16.38,"text":"let's look at some buildings from five different\ncountries."},{"start":18.28,"end":19.44,"text":"This is Jodhpur,"},{"start":19.78,"end":20.5,"text":"in India."},{"start":22.46,"end":24.8,"text":"Jodhpur is called the Blue City."},{"start":26.24,"end":28.28,"text":"There are blue houses,"},{"start":28.68,"end":29.46,"text":"blue shops,"},{"start":29.92,"end":31.4,"text":"and blue streets here."},{"start":32.7,"end":35.18,"text":"But why are the buildings blue?"},{"start":36.94,"end":40.84,"text":"Well, the answer is probably mosquitoes."},{"start":42.32,"end":44.22,"text":"People don't like mosquitoes."},{"start":45.92,"end":50.06,"text":"And some people think that mosquitoes don't like blue\nthings."},{"start":50.06,"end":52.7,"text":"So when a house is blue,"},{"start":53.16,"end":54.78,"text":"mosquitoes don't come."},{"start":56.34,"end":59.22,"text":"Another colorful place is Burano, in Italy."},{"start":60.46,"end":62.92,"text":"The buildings here are red, blue,"},{"start":63.42,"end":63.9,"text":"green,"},{"start":64.32,"end":64.92,"text":"and yellow."},{"start":66.74,"end":69.5,"text":"But why is Burano so colorful?"},{"start":71.56,"end":72.1,"text":"Well,"},{"start":72.48,"end":74.12,"text":"the village is on an island."},{"start":75.53999999999999,"end":77.08,"text":"In bad weather,"},{"start":77.46000000000001,"end":79.1,"text":"it's difficult to see."},{"start":80.84,"end":84.03999999999999,"text":"But colorful buildings are easy to see."},{"start":85.56,"end":93.18,"text":"And so perhaps the color of the buildings helped people\nin boats see the island and get home safe."},{"start":95.25999999999999,"end":96.36,"text":"In Lake Inli,"},{"start":96.7,"end":97.44,"text":"in Myanmar,"},{"start":97.94,"end":99.62,"text":"the main job is fishing."},{"start":99.62,"end":103.14,"text":"And so the people live near the fish."},{"start":104.94,"end":105.3,"text":"Here,"},{"start":105.64,"end":107.46000000000001,"text":"the houses are on the lake."},{"start":109.22,"end":111.32,"text":"Under the houses, there's water."},{"start":111.6,"end":112.62,"text":"And in the water,"},{"start":113.86,"end":114.58,"text":"there's food."},{"start":115.5,"end":117.2,"text":"But it's not all water."},{"start":118.06,"end":123.24,"text":"These small green islands on Lake Inli are gardens for\nvegetables."},{"start":124.74,"end":125.96,"text":"Of course,"},{"start":126.46,"end":129.88,"text":"people don't only build homes to be near to their food."},{"start":131.24,"end":132.54,"text":"This is Iceland,"},{"start":133.14,"end":135.46,"text":"with its beautiful mountains and rivers."},{"start":137.07999999999998,"end":139.56,"text":"In Iceland, there aren't many trees."},{"start":141.22,"end":144.52,"text":"And so the old houses have grass on the roofs."},{"start":146.64,"end":148.34,"text":"Iceland is a cold country,"},{"start":148.92000000000002,"end":151.8,"text":"but a grass roof can make a warm home."},{"start":153.06,"end":155.8,"text":"So what about warmer countries?"},{"start":157.7,"end":161.1,"text":"Here in Turkey are the hills of Cappadocia."},{"start":162.57999999999998,"end":164.72,"text":"But these are not just hills."},{"start":165.5,"end":166.76,"text":"They're also houses."},{"start":168.8,"end":169.94,"text":"Inside the hills,"},{"start":170.36,"end":174.86,"text":"people cut the rock and made safe places to live."},{"start":175.94,"end":177.78,"text":"And on hot days,"},{"start":178.3,"end":179.92000000000002,"text":"the rooms aren't too hot."},{"start":181.8,"end":183.38,"text":"All around the world,"},{"start":183.78,"end":187.02,"text":"people live in many different types of houses."},{"start":189.1,"end":190.88,"text":"Some houses are close together."},{"start":192.96,"end":194.38,"text":"Some are on the water."},{"start":196.4,"end":198.22,"text":"Some are high in the sky."},{"start":200.12,"end":202.84,"text":"What are the houses like in your country?"}],"launchInline":true}},{"id":"B01-LS-U06-classroom:resource:b1325","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"pages":[131],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26374fa0682b046b2dae492c0bad288b51082f09ee166aafbc239f6fe455fc43.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"5","pages":[[{"term":"architect","pos":"(n)","definition":"somebody who designs buildings","example":"The architect designed a house with large windows.","wordAudio":"architect","cardWord":false},{"term":"design","pos":"(n)","definition":"the way something is planned and made","example":"The design of the library lets in plenty of light.","wordAudio":"design","cardWord":false},{"term":"psychologist","pos":"(n)","definition":"somebody who knows about people's thoughts and feelings","example":"The psychologist helped the children talk about their feelings.","wordAudio":"psychologist","cardWord":false},{"term":"traditional","pos":"(adj)","definition":"doing things the way that people did them in the past","example":"They still make bread in the traditional way.","wordAudio":"traditional","cardWord":false}]]}},{"id":"B01-LS-U06-classroom:resource:b1352","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c98 function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){
 return '<div class="v-item'+(x.label.length>4?' text-label':'')+'"><span class="num">'+esc(x.label)+'</span><div><p>'+esc(x.prompt)+'</p>'+
 (x.options?.length?'<ol class="v-options"'+(letterChoices?' type="a"':"")+'>'+x.options.map(y=>'<li>'+esc(y)+'</li>').join("")+'</ol>':"")+'</div></div>';
}
function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));
 const items=table?[]:sourceItems;
 const provided=c.layout==="reading"&&c.paragraphText?c.paragraphText:c.provided;
 const size=c.feedback?.pageSize??(plan?.showAll?Math.max(1,items.length):plan?.kind==="definitions"?3:c.layout==="grid"?6:equalOptions?3:sourceItems.some(x=>x.options?.length>2)?2:4);
 const chunks=items.length?Array.from({length:Math.ceil(items.length/size)},(_,i)=>items.slice(i*size,(i+1)*size)):[[]];
 return {table,equalOptions,bank:equalOptions?sourceItems[0].options:[],chunks,provided,decks};
}
function taskTable(table,feedback){
 const rows=table.rows.map((row,i)=>'<tr>'+row.map((value,j)=>{
  const tag=table.headers&&i===0?'th':'td';
  return '<'+tag+(tag==='th'?' scope="col"':'')+'>'+inlineTableCell(value,i,j,feedback,table.bank)+'</'+tag+'>';
 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';
}
function splitPanels(groups){

  '<section class="v-context '+esc(block.role)+'-copy"><h3>'+esc(block.title)+'</h3>'+markup(block.text)+'</section>'
 ).join("")+'</section>').join("")+'</div>';

function materialSplit(decks,task,feedback){

 const cards=decks.map((deck,i)=>deck.pages.map((card,p)=>
  materialCardHTML(card,feedback,' data-deck-card="'+i+'" data-card="'+p+'" data-source-page="'+card.sourcePage+
   '"'+(card.id?' data-reading-section="'+esc(card.id)+'"':'')+(i===0&&p===0?'':' hidden'))
 ).join("")).join("");
 return '<div class="split material-split"><section class="panel material-panel" aria-label="课堂材料">'+
  '<div class="material-controls"><div class="material-tabs" role="group" aria-label="切换材料">'+tabs+
  '</div><button type="button" class="material-source"></button></div><div class="material-cards">'+cards+'</div>'+
  '<div class="material-pager"><button type="button" data-material-prev>上段</button><span data-material-count aria-live="polite"></span>'+

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){

 }

 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }

function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){

function inClassroomOrder(){

}
function inGlossaries(){

function selectedUnitPages(){

  (openingTrack.value==="all"||c.track===openingTrack.value));

function selectedLessons(){

function exerciseVisible(c){

function flowSteps(lesson){

function navigationOrder(){

function neighbor(amount){

function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';

function nav(){

  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");

   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||

function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);

 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;

 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";

 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");

function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();

 const inset=property=>Number.parseFloat(css.getPropertyValue(property));

 const isGlossary=c.flow?.kind==="glossary";

 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";

  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;

 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);

  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
