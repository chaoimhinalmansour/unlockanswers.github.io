gs are all one colour.","people make their homes inside hills."],"type":"choice/closed"}],[{"kind":"item","id":"b1309.i03","label":"3","prompt":"At Lake Inle,","options":["there are a lot of colourful houses.","people put green grass on the top of their homes.","people build their homes over water.","the buildings are all one colour.","people make their homes inside hills."],"type":"choice/closed"},{"kind":"item","id":"b1309.i04","label":"4","prompt":"In Iceland,","options":["there are a lot of colourful houses.","people put green grass on the top of their homes.","people build their homes over water.","the buildings are all one colour.","people make their homes inside hills."],"type":"choice/closed"}],[{"kind":"item","id":"b1309.i05","label":"5","prompt":"In Cappadocia,","options":["there are a lot of colourful houses.","people put green grass on the top of their homes.","people build their homes over water.","the buildings are all one colour.","people make their homes inside hills."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c510f9cc5f7ccd801325914b-L1LS-U06.mp4","captions":[{"start":0,"end":2.7,"text":"All around the world,"},{"start":3.9,"end":5.8,"text":"people's homes look different."},{"start":6.88,"end":8.52,"text":"Very different, in fact."},{"start":9.74,"end":11.06,"text":"So why is that?"},{"start":11.72,"end":12.16,"text":"Well,"},{"start":12.78,"end":16.38,"text":"let's look at some buildings from five different\ncountries."},{"start":18.28,"end":19.44,"text":"This is Jodhpur,"},{"start":19.78,"end":20.5,"text":"in India."},{"start":22.46,"end":24.8,"text":"Jodhpur is called the Blue City."},{"start":26.24,"end":28.28,"text":"There are blue houses,"},{"start":28.68,"end":29.46,"text":"blue shops,"},{"start":29.92,"end":31.4,"text":"and blue streets here."},{"start":32.7,"end":35.18,"text":"But why are the buildings blue?"},{"start":36.94,"end":40.84,"text":"Well, the answer is probably mosquitoes."},{"start":42.32,"end":44.22,"text":"People don't like mosquitoes."},{"start":45.92,"end":50.06,"text":"And some people think that mosquitoes don't like blue\nthings."},{"start":50.06,"end":52.7,"text":"So when a house is blue,"},{"start":53.16,"end":54.78,"text":"mosquitoes don't come."},{"start":56.34,"end":59.22,"text":"Another colorful place is Burano, in Italy."},{"start":60.46,"end":62.92,"text":"The buildings here are red, blue,"},{"start":63.42,"end":63.9,"text":"green,"},{"start":64.32,"end":64.92,"text":"and yellow."},{"start":66.74,"end":69.5,"text":"But why is Burano so colorful?"},{"start":71.56,"end":72.1,"text":"Well,"},{"start":72.48,"end":74.12,"text":"the village is on an island."},{"start":75.53999999999999,"end":77.08,"text":"In bad weather,"},{"start":77.46000000000001,"end":79.1,"text":"it's difficult to see."},{"start":80.84,"end":84.03999999999999,"text":"But colorful buildings are easy to see."},{"start":85.56,"end":93.18,"text":"And so perhaps the color of the buildings helped people\nin boats see the island and get home safe."},{"start":95.25999999999999,"end":96.36,"text":"In Lake Inli,"},{"start":96.7,"end":97.44,"text":"in Myanmar,"},{"start":97.94,"end":99.62,"text":"the main job is fishing."},{"start":99.62,"end":103.14,"text":"And so the people live near the fish."},{"start":104.94,"end":105.3,"text":"Here,"},{"start":105.64,"end":107.46000000000001,"text":"the houses are on the lake."},{"start":109.22,"end":111.32,"text":"Under the houses, there's water."},{"start":111.6,"end":112.62,"text":"And in the water,"},{"start":113.86,"end":114.58,"text":"there's food."},{"start":115.5,"end":117.2,"text":"But it's not all water."},{"start":118.06,"end":123.24,"text":"These small green islands on Lake Inli are gardens for\nvegetables."},{"start":124.74,"end":125.96,"text":"Of course,"},{"start":126.46,"end":129.88,"text":"people don't only build homes to be near to their food."},{"start":131.24,"end":132.54,"text":"This is Iceland,"},{"start":133.14,"end":135.46,"text":"with its beautiful mountains and rivers."},{"start":137.07999999999998,"end":139.56,"text":"In Iceland, there aren't many trees."},{"start":141.22,"end":144.52,"text":"And so the old houses have grass on the roofs."},{"start":146.64,"end":148.34,"text":"Iceland is a cold country,"},{"start":148.92000000000002,"end":151.8,"text":"but a grass roof can make a warm home."},{"start":153.06,"end":155.8,"text":"So what about warmer countries?"},{"start":157.7,"end":161.1,"text":"Here in Turkey are the hills of Cappadocia."},{"start":162.57999999999998,"end":164.72,"text":"But these are not just hills."},{"start":165.5,"end":166.76,"text":"They're also houses."},{"start":168.8,"end":169.94,"text":"Inside the hills,"},{"start":170.36,"end":174.86,"text":"people cut the rock and made safe places to live."},{"start":175.94,"end":177.78,"text":"And on hot days,"},{"start":178.3,"end":179.92000000000002,"text":"the rooms aren't too hot."},{"start":181.8,"end":183.38,"text":"All around the world,"},{"start":183.78,"end":187.02,"text":"people live in many different types of houses."},{"start":189.1,"end":190.88,"text":"Some houses are close together."},{"start":192.96,"end":194.38,"text":"Some are on the water."},{"start":196.4,"end":198.22,"text":"Some are high in the sky."},{"start":200.12,"end":202.84,"text":"What are the houses like in your country?"}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"la 3c 46 Se","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":48,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1310","book":1,"unit":6,"track":"LS ace for a new café. Compare your answer with a different group. Do you agree? Why / Why not?","pages":[141],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/77ba5b5f1397d837db4c1b57303b1feaecab6d23020e0f9fabcc28923a57b524.png"],"provided":"We agree with the other group. The best place for the café is ...\nWe disagree with the other group because ...","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"We agree with the other group. The best place for the café is ..."},{"kind":"text","text":"We disagree with the other group because ..."}]],"courseMaterials":[{"id":"B01-LS-U06-publisher-sheet:b1370","title":"CRITICAL THINKING Ex 4 原题面","pages":[141],"text":"\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>positive things\u003c/td>\u003ctd>negative things\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a near one of the busy main roads\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>b in the town\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>c on the beach\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>d on Green Town Island\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","screens":["\u003ctable>\u003ctr>\u003ctd>\u003c/td>\u003ctd>positive things\u003c/td>\u003ctd>negative things\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a near one of the busy main roads\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>b in the town\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>c on the beach\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>d on Green Town Island\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>"],"sources":[{"page":141,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/77ba5b5f1397d837db4c1b57303b1feaecab6d23020e0f9fabcc28923a57b524.png"}],"kind":"task_sheet","sourceBlockIds":["b1370"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"See Model Answer  Booklet p/0  for example  answers.\nUNLC; CK TEACHER DEVELOPMENT\nBE REFLECTIVE\nThink about  the following  questions:\n-+ Evaluate your own lesson. What were the\nstrengths  and weaknesses? What went well and what\ndid not  go so well? If you taught the lesson again,\nwhat would you do differently?\n-+ Think again about the Be confident section. How\nwould you  have answered this  question? What other\npositive or negative comments do you think were\nfound in the survey?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1373","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"order":40,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"REASONS, OPINIONS AND AGREEMENT"},"instruction":"6.6 Listen to and read three parts of Listening 2. Notice the underlined phrases. Why do the speakers use them?","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"],"provided":"1\nDale: OK, so we need a place for our new office. What about here?\nHakan: Where?\nDale: The city centre. What do you think?\nHakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.\nDale: Oh? Why not?\nHakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.\n2\nDale: What about here?\nHakan: The park?\nDale: Yes. It's quiet, and it's not far from a big road. What do you think?\nHakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?\nDale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.\n3\nHakan: Now what about the design? I think we should have a modem design with big windows. What about you?\nDale: Yes, I agree. Big windows are good.","items":[{"id":"b1373.i01","label":"1","prompt":"Why do the speakers use the underlined phrases?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1"},{"kind":"text","text":"Dale: OK, so we need a place for our new office. What about here?"},{"kind":"text","text":"Hakan: Where?"},{"kind":"text","text":"Dale: The city centre. What do you think?"},{"kind":"text","text":"Hakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there."},{"kind":"text","text":"Dale: Oh? Why not?"}],[{"kind":"text","text":"Hakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places."},{"kind":"text","text":"Dale: What about here?"},{"kind":"text","text":"Hakan: The park?"},{"kind":"text","text":"Dale: Yes. It's quiet, and it's not far from a big road. What do you think?"},{"kind":"text","text":"Hakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?"}],[{"kind":"text","text":"Dale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap."},{"kind":"text","text":"3"},{"kind":"text","text":"Hakan: Now what about the design? I think we should have a modem design with big windows. What about you?"},{"kind":"text","text":"Dale: Yes, I agree. Big windows are good."},{"kind":"item","id":"b1373.i01","label":"1","prompt":"Why do the speakers use the underlined phrases?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/36627175a5d784c578995109dff040b719eb1a74a6fbfdfff73c3cf9b5b0fd93.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"People use the underlined phrases to give reasons, give\nopinions, ask for opinions or to agree or disagree.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":51,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1374","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"order":41,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"REASONS, OPINIONS AND AGREEMENT"},"instruction":"Work with a partner. Take turns to say an underlined phrase from Exercise 1. Your partner writes it in the correct place in the table.","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>give a reason\u003c/td>\u003ctd>give an opinion\u003c/td>\u003ctd>ask for an opinion\u003c/td>\u003ctd>agree or disagree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>What about here?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b1374.i01","label":"g ion is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.\n3\nHakan: Now what about the design? I think we should have a modem design with big windows. What about you?\nDale: Yes, I agree. Big windows are good.","screens":["1","Dale: OK, so we need a place for our new office. What about here?","Hakan: Where?","Dale: The city centre. What do you think?","Hakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.","Dale: Oh? Why not?","Hakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.","2","Dale: What about here?","Hakan: The park?","Dale: Yes. It's quiet, and it's not far from a big road. What do you think?","Hakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?","Dale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.","3","Hakan: Now what about the design? I think we should have a modem design with big windows. What about you?","Dale: Yes, I agree. Big windows are good."],"sources":[{"page":142,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"}],"kind":"task_sheet","sourceBlockIds":["b1373"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"give a reason:\nIt's near some good roads.\nBecause  the buildings  in the centre  are very old.\nIt's quiet and it's not  far from a big road.\nIt's good for travel.\nThe buildings  near the train station aren't  cheap.\ngive an opinion:\nIt's a good place.\nI don't think we should go there.\nIt's pretty far from the centre.\nThe train station is good.\nI think we should go with the park.\nI think we should  ha age","sourceBlockIds":[]},{"id":"B01-LS-U06-publisher-sheet:b1373","title":"PREPARATION FOR SPEAKING Ex 1 原题面","pages":[142],"text":"1\nDale: OK, so we need a place for our new office. What about here?\nHakan: Where?\nDale: The city centre. What do you think?\nHakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.\nDale: Oh? Why not?\nHakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.\n2\nDale: What about here?\nHakan: The park?\nDale: Yes. It's quiet, and it's not far from a big road. What do you think?\nHakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?\nDale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.\n3\nHakan: Now what about the design? I think we should have a modem design with big windows. What about you?\nDale: Yes, I agree. Big windows are good.","screens":["1","Dale: OK, so we need a place for our new office. What about here?","Hakan: Where?","Dale: The city centre. What do you think?","Hakan: Well, it's a good place. It's near some good roads. But ... I don't think we should go there.","Dale: Oh? Why not?","Hakan: Because the buildings in the centre are very old. They are cold in winter and hot in summer, and they're very noisy. They're uncomfortable places.","2","Dale: What about here?","Hakan: The park?","Dale: Yes. It's quiet, and it's not far from a big road. What do you think?","Hakan: Hmm, I'm not sure. It's pretty far from the centre. What about here? Near the train station?","Dale: The train station is good. It's good for travel ... but I think we should go with the park. The buildings near the train station aren't cheap.","3","Hakan: Now what about the design? I think we should have a modem design with big windows. What about you?","Dale: Yes, I agree. Big windows are good."],"sources":[{"page":142,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb97ad769045341c8052c97ff4e1a9dc5f2fb1bd1aceb2b81c13c4a33fbb6477.png"}],"kind":"task_sheet","sourceBlockIds":["b1373"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 give a reason 2 Because 3 good for\n4 give an opinion 5 think 6 should  7 should\n8 ask for an opinion  9 about  10 Why\n11 agree or disagree 12 sure","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/70db428217932a716b6da486183dfd746030bfa9875694c3a287f7b24f9e5787.pdf","pdfPage":52,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-LS-U06-question:b1394","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"order":51,"module":"SPEAKING TASK","ex":"2","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Work with a partner. You are going to open a new café in Green Town. Look back at your notes in the tables in the Critical thinking section (pages 140–141). Discuss what kind of café you want to open and where it should be. Use the words on pages 134 and 136 and the expressions in Exercise 1 to help you.","pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9ec7a20232abcbd0b14902cfb8f4b86a98c387255349533de39164f3439062c8.png"],"provided":"I think it should be near the beach.\nI don't think it should be near a busy road.\nI think it should be a quiet, traditional café.\nThe walls should be blue and ...\nThe tables should be wooden ...\nThe chairs should be ...","items":[],"layout":"list","references":[{"id":"B01-LS-U06-question:b1367","kind":"student-work","title":"CRITICAL THINKING Ex ":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"grass","pos":"(n)","definition":"a plant with thin, green leaves that grows close to the ground in gardens and fields","example":"We sat on the grass to eat our lunch.","wordAudio":"grass","cardWord":false},{"term":"hill","pos":"(n)","definition":"a small mountain","example":"They walked to the top of the hill.","wordAudio":"hill","cardWord":false},{"term":"island","pos":"(n)","definition":"a piece of land that has water all around it","example":"We took a boat to the island.","wordAudio":"island","cardWord":false},{"term":"rock","pos":"(n)","definition":"a very hard part of the ground","example":"A large rock was blocking the path.","wordAudio":"rock","cardWord":true},{"term":"village","pos":"(n)","definition":"a small town, usually in the countryside","example":"My grandfather lives in a small village.","wordAudio":"village","cardWord":false},{"term":"warm","pos":"(adj)","definition":"not cold, but not very hot","example":"It is warm enough to eat outside today.","wordAudio":"warm","cardWord":false}]]}},{"id":"B01-LS-U06-classroom:video","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"UNDERSTANDING MAIN IDEAS"},"pages":[128],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/feae4af704644c1db0224c81d3d82f1415e5e8e977fc67ae5b30e65d519f9295.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c510f9cc5f7ccd801325914b-L1LS-U06.mp4","captions":[{"start":0,"end":2.7,"text":"All around the world,"},{"start":3.9,"end":5.8,"text":"people's homes look different."},{"start":6.88,"end":8.52,"text":"Very different, in fact."},{"start":9.74,"end":11.06,"text":"So why is that?"},{"start":11.72,"end":12.16,"text":"Well,"},{"start":12.78,"end":16.38,"text":"let's look at some buildings from five different\ncountries."},{"start":18.28,"end":19.44,"text":"This is Jodhpur,"},{"start":19.78,"end":20.5,"text":"in India."},{"start":22.46,"end":24.8,"text":"Jodhpur is called the Blue City."},{"start":26.24,"end":28.28,"text":"There are blue houses,"},{"start":28.68,"end":29.46,"text":"blue shops,"},{"start":29.92,"end":31.4,"text":"and blue streets here."},{"start":32.7,"end":35.18,"text":"But why are the buildings blue?"},{"start":36.94,"end":40.84,"text":"Well, the answer is probably mosquitoes."},{"start":42.32,"end":44.22,"text":"People don't like mosquitoes."},{"start":45.92,"end":50.06,"text":"And some people think that mosquitoes don't like blue\nthings."},{"start":50.06,"end":52.7,"text":"So when a house is blue,"},{"start":53.16,"end":54.78,"text":"mosquitoes don't come."},{"start":56.34,"end":59.22,"text":"Another colorful place is Burano, in Italy."},{"start":60.46,"end":62.92,"text":"The buildings here are red, blue,"},{"start":63.42,"end":63.9,"text":"green,"},{"start":64.32,"end":64.92,"text":"and yellow."},{"start":66.74,"end":69.5,"text":"But why is Burano so colorful?"},{"start":71.56,"end":72.1,"text":"Well,"},{"start":72.48,"end":74.12,"text":"the village is on an island."},{"start":75.53999999999999,"end":77.08,"text":"In bad weather,"},{"start":77.46000000000001,"end":79.1,"text":"it's difficult to see."},{"start":80.84,"end":84.03999999999999,"text":"But colorful buildings are easy to see."},{"start":85.56,"end":93.18,"text":"And so perhaps the color of the buildings helped people\nin boats see the island and get home safe."},{"start":95.25999999999999,"end":96.36,"text":"In Lake Inli,"},{"start":96.7,"end":97.44,"text":"in Myanmar,"},{"start":97.94,"end":99.62,"text":"the main job is fishing."},{"start":99.62,"end":103.14,"text":"And so the people live near the fish."},{"start":104.94,"end":105.3,"text":"Here,"},{"start":105.64,"end":107.46000000000001,"text":"the houses are on the lake."},{"start":109.22,"end":111.32,"text":"Under the houses, there's water."},{"start":111.6,"end":112.62,"text":"And in the water,"},{"start":113.86,"end":114.58,"text":"there's food."},{"start":115.5,"end":117.2,"text":"But it's not all water."},{"start":118.06,"end":123.24,"text":"These small green islands on Lake Inli are gardens for\nvegetables."},{"start":124.74,"end":125.96,"text":"Of course,"},{"start":126.46,"end":129.88,"text":"people don't only build homes to be near to their food."},{"start":131.24,"end":132.54,"text":"This is Iceland,"},{"start":133.14,"end":135.46,"text":"with its beautiful mountains and rivers."},{"start":137.07999999999998,"end":139.56,"text":"In Iceland, there aren't many trees."},{"start":141.22,"end":144.52,"text":"And so the old houses have grass on the roofs."},{"start":146.64,"end":148.34,"text":"Iceland is a cold country,"},{"start":148.92000000000002,"end":151.8,"text":"but a grass roof can make a warm home."},{"start":153.06,"end":155.8,"text":"So what about warmer countries?"},{"start":157.7,"end":161.1,"text":"Here in Turkey are the hills of Cappadocia."},{"start":162.57999999999998,"end":164.72,"text":"But these are not just hills."},{"start":165.5,"end":166.76,"text":"They're also houses."},{"start":168.8,"end":169.94,"text":"Inside the hills,"},{"start":170.36,"end":174.86,"text":"people cut the rock and made safe places to live."},{"start":175.94,"end":177.78,"text":"And on hot days,"},{"start":178.3,"end":179.92000000000002,"text":"the rooms aren't too hot."},{"start":181.8,"end":183.38,"text":"All around the world,"},{"start":183.78,"end":187.02,"text":"people live in many different types of houses."},{"start":189.1,"end":190.88,"text":"Some houses are close together."},{"start":192.96,"end":194.38,"text":"Some are on the water."},{"start":196.4,"end":198.22,"text":"Some are high in the sky."},{"start":200.12,"end":202.84,"text":"What are the houses like in your country?"}],"launchInline":true}},{"id":"B01-LS-U06-classroom:resource:b1325","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"pages":[131],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/26374fa0682b046b2dae492c0bad288b51082f09ee166aafbc239f6fe455fc43.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"5","pages":[[{"term":"architect","pos":"(n)","definition":"somebody who designs buildings","example":"The architect designed a house with large windows.","wordAudio":"architect","cardWord":false},{"term":"design","pos":"(n)","definition":"the way something is planned and made","example":"The design of the library lets in plenty of light.","wordAudio":"design","cardWord":false},{"term":"psychologist","pos":"(n)","definition":"somebody who knows about people's thoughts and feelings","example":"The psychologist helped the children talk about their feelings.","wordAudio":"psychologist","cardWord":false},{"term":"traditional","pos":"(adj)","definition":"doing things the way that people did them in the past","example":"They still make bread in the traditional way.","wordAudio":"traditional","cardWord":false}]]}},{"id":"B01-LS-U06-classroom:resource:b1352","book":1,"unit":6,"track":"LS","topic":"HOMES AND BUILDINGS","lesson":2,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c98 ,[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a hospital","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: 2Evidence: nurse in a big hospital","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"Points: Evidence:","header":false,"colspan":1,"rowspan":1} 房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-LS-U06":{"aspect":1.9085487,"cues":[[0,2.7,"All around the world,","世界各地，"],[3.9,5.8,"people's homes look different.","人们的家看起来不一样"],[6.88,8.52,"Very different, in fact.","其实很不一样"],[9.74,11.06,"So why is that?","那为什么呢？"],[11.72,12.16,"Well,","这个嘛"],[12.78,16.38,"let's look at some buildings from five different countries.","让我们看看来自五个不同国家的一些建筑。"],[18.28,19.44,"This is Jodhpur,","这是乔德普尔，"],[19.78,20.5,"in India.","在印度。 在印度。 (英语)."],[22.46,24.8,"Jodhpur is called the Blue City.","乔德普尔被称为\"蓝色城市\"."],[26.24,28.28,"There are blue houses,","有蓝色的房子，"],[28.68,29.46,"blue shops,","蓝色的商店，"],[29.92,31.4,"and blue streets here.","这里还有蓝色的街道"],[32.7,35.18,"But why are the buildings blue?","但为什么建筑物是蓝色的？"],[36.94,40.84,"Well, the answer is probably mosquitoes.","那么，答案可能是蚊子。"],[42.32,44.22,"People don't like mosquitoes.","众生不爱蚊子。"],[45.92,50.06,"And some people think that mosquitoes don't like blue things.","而有些人认为蚊子不喜欢蓝色的东西。"],[50.06,52.7,"So when a house is blue,","所以当一个房子是蓝色的，"],[53.16,54.78,"mosquitoes don't come.","蚊子不来。"],[56.34,59.22,"Another colorful place is Burano, in Italy.","另一个多彩的地方是意大利的布拉诺。"],[60.46,62.92,"The buildings here are red, blue,","这里的建筑是红色的，蓝色的，"],[63.42,63.9,"green,","绿色"],[64.32,64.92,"and yellow.","和黄色。"],[66.74,69.5,"But why is Burano so colorful?","但为何布拉诺如此多彩？"],[71.56,72.1,"Well,","这个嘛"],[72.48,74.12,"the village is on an island.","村落就在一个岛上"],[75.53999999999999,77.08,"In bad weather,","在恶劣的天气中"],[77.46000000000001,79.1,"it's difficult to see.","很难看出来"],[80.84,84.03999999999999,"But colorful buildings are easy to see.","但多彩的建筑是容易看见的。"],[85.56,93.18,"And so perhaps the color of the buildings helped people in boats see the island and get home safe.","也许建筑物的颜色能帮助人们在船上看到小岛，安全地回家。"],[95.25999999999999,96.36,"In Lake Inli,","在英利湖，"],[96.7,97.44,"in Myanmar,","在缅甸，"],[97.94,99.62,"the main job is fishing.","主要工作是捕鱼。"],[99.62,103.14,"And so the people live near the fish.","故众生住鱼附近。"],[104.94,105.3,"Here,","在这里，"],[105.64,107.46000000000001,"the houses are on the lake.","房子在湖边"],[109.22,111.32,"Under the houses, there's water.","屋下有 water水。"],[111.6,112.62,"And in the water,","和在水中，"],[113.86,114.58,"there's food.","还有食物。"],[115.5,117.2,"But it's not all water.","却不尽是水。"],[118.06,123.24,"These small green islands on Lake Inli are gardens for vegetables.","英利湖上的这些小绿岛是蔬菜的花园。"],[124.74,125.96,"Of course,","当然"],[126.46,129.88,"people don't only build homes to be near to their food.","人们不只为接近食物而建造家园。"],[131.24,132.54,"This is Iceland,","这是冰岛，"],[133.14,135.46,"with its beautiful mountains and rivers.","带着美丽的山川，"],[137.07999999999998,139.56,"In Iceland, there aren't many trees.","在冰岛，树不多。"],[141.22,144.52,"And so the old houses have grass on the roofs.","故旧舍有草于天台。"],[146.64,148.34,"Iceland is a cold country,","冰岛是一个寒冷的国家，"],[148.92000000000002,151.8,"but a grass roof can make a warm home.","但草屋顶可以做一个温暖的家。"],[153.06,155.8,"So what about warmer countries?","那温暖的国家呢？"],[157.7,161.1,"Here in Turkey are the hills of Cappadocia.","在土耳其这里是卡帕多西亚的山丘。"],[162.57999999999998,164.72,"But these are not just hills.","但这些不只是丘陵。"],[165.5,166.76,"They're also houses.","他们也是房子。"],[168.8,169.94,"Inside the hills,","在丘陵里，"],[170.36,174.86,"people cut the rock and made safe places to live.","人们把石头切开并创造安全的地方生活。"],[175.94,177.78,"And on hot days,","在炎热的日子，"],[178.3,179.92000000000002,"the rooms aren't too hot.","房间不热。"],[181.8,183.38,"All around the world,","世界各地，"],[183.78,187.02,"people live in many different types of houses.","人们生活在许多不同种类的房屋中。"],[189.1,190.88,"Some houses are close together.","有些房子很贴近"],[192.96,194.38,"Some are on the water.","有的在水边。"],[196.4,198.22,"Some are high in the sky.","有些是高在天上。"],[200.12,202.84,"What are the houses like in your country?","你们国家的房子怎么样？"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW    if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
