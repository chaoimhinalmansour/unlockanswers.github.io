"text":"Make concessions and refute counter-arguments."},{"label":"Academic writing skill","text":"Anticipate counter-arguments."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":182,"alt":""}}]}},{"id":"B05-RW-U08-classroom:resource:b8898","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[184],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0743afbcd7916ab843750aa460410021e645d86232298786b8f8276ea89d9f69.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"elite","pos":"(adj)","definition":"belonging to the most skilful or best-trained group of people who do a particular job in a society","example":"An elite team of climbers took part in the rescue.","wordAudio":"elite","cardWord":false},{"term":"hone","pos":"(v)","definition":"to make a skill, technique, etc. perfect by practising","example":"She entered local competitions to hone her skills.","wordAudio":"hone","cardWord":false},{"term":"personnel","pos":"(n)","definition":"the people who are employed in a company or organization","example":"Only trained personnel may enter the control room.","wordAudio":"personnel","cardWord":false},{"term":"squadron","pos":"(n)","definition":"a unit of people who work together in the air force","example":"The air force squadron carried out a training flight.","wordAudio":"squadron","cardWord":false},{"term":"pulling G","pos":"(v phr)","definition":"being affected by a strong force on the body due to the combination a rapid increase in speed and the constant force of gravity","example":"The pilot was pulling G as the aircraft turned sharply.","wordAudio":"pulling G","cardWord":false},{"term":"inflate","pos":"(v)","definition":"to make something increase in size by filling it with air","example":"Use the pump to inflate the tyres.","wordAudio":"inflate","cardWord":false}]]}},{"id":"B05-RW-U08-classroom:video","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[185],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9d1afbc552892a96e366a68632ea86911ee50d93e2e9e4eb937ec723c286c5f7.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/44330b080a0b7f3cdbfe8f67-L5RW-U08.mp4","captions":[{"start":0,"end":2.18,"text":"At the Royal Air Force Base in Scanton,"},{"start":2.5,"end":2.74,"text":"UK,"},{"start":3.16,"end":6.14,"text":"these are the unique Hawk jets of the Red Arrows,"},{"start":6.68,"end":8.7,"text":"an elite team of RAF pilots,"},{"start":9.04,"end":10.94,"text":"engineers and vital support staff."},{"start":11.98,"end":19,"text":"It takes over 120 people to bring together the Red\nArrows' spectacular aerobatic displays."},{"start":20.08,"end":24.92,"text":"Our report catches up with the team during their\npreparations for the summer months."},{"start":29,"end":36.94,"text":"In the skies above Lincolnshire, the Red Arrows soar\nand swoop, honing the precision moves they've become so\nfamous for."},{"start":37.34,"end":38.48,"text":"The man out front,"},{"start":38.92,"end":39.48,"text":"Red One."},{"start":41.62,"end":49.86,"text":"It's an absolute dream job to get and to sit in the\nfront of such a capable team, not just the pilots but\nall of the personnel that work on the Red Arrows,"},{"start":50.34,"end":53.34,"text":"highly trained, highly skilled and really motivated to\ndo a good job."},{"start":53.96,"end":57.56,"text":"Now the nine aircraft he leads are being given a\nmakeover."},{"start":58.02,"end":61.54,"text":"This is the first time the new look tail fin has been\nseen,"},{"start":61.9,"end":67.46,"text":"the first permanent change to the design since the Red\nArrows were formed in 1964,"},{"start":67.92,"end":70.92,"text":"but it'll be months before being displayed to the\npublic."},{"start":73.7,"end":77.22,"text":"It's now during the winter months that the hard work is\ndone,"},{"start":77.56,"end":84.06,"text":"with up to five training assaults flown each day to\nmake sure that every single performance is perfect come\nthe summer."},{"start":84.52,"end":88.12,"text":"When it's as windy as this, it's even tougher for the\npilots."},{"start":90.56,"end":93.5,"text":"It is also the time for vital engineering work."},{"start":94.03999999999999,"end":101.25999999999999,"text":"Corporal Drew Paxton is one of the exclusive circus\nengineers picked to travel to displays in the seat\nbehind the pilot."},{"start":101.8,"end":109.72,"text":"The engineers as a whole on the squadron are the\nlifeline, the lifeblood of the squadron and if we don't\nhave them then we can't do anything."},{"start":110.42,"end":116.58,"text":"Everything must be checked meticulously, including the\npotentially life saving kit worn by the pilots."},{"start":117.97999999999999,"end":120.7,"text":"The G trousers, once I start pulling G will start to\ninflate."},{"start":121.12,"end":123.22,"text":"My muscles and my legs have to tense against them."},{"start":123.58,"end":124.94,"text":"Now when they tense against it,"},{"start":125.46,"end":127.52,"text":"the blood doesn't pool on my legs and it will stay in\nmy torso,"},{"start":127.84,"end":131.6,"text":"so now that makes it easier for me to work to keep the\nblood pumping to my head."},{"start":131.9,"end":133.8,"text":"But there will always be danger."},{"start":134.42,"end":135.2,"text":"In 2011,"},{"start":135.52,"end":139,"text":"two pilots from the aerobatic team died in separate\nincidents."},{"start":139.42000000000002,"end":141.2,"text":"Getting everything right is crucial."},{"start":141.8,"end":144.22,"text":"It means a debrief after every flight."},{"start":145.86,"end":150.74,"text":"It costs £nine million a year to keep the fast jets\nflying,"},{"start":151.16,"end":152.68,"text":"too high a cost for some."},{"start":153.3,"end":157.57999999999998,"text":"But this summer they'll perform 80 times, ambassadors\nfor Britain,"},{"start":157.92000000000002,"end":162.46,"text":"as they speed towards a further 50 years of unmatched\naerobatics."}],"launchInline":true}},{"id":"B05-RW-U08-classroom:resource:b8908","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[186],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9ebdcf5663c8d14a58fb1f2ddbad7c21a1c3961795e66071da1566c61378c747.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["accomplish (v) to do something successfully\namass (v) to collect a large amount of something\ncoordinate (v) to make separate things or people work well together\ndetract from (phr v) to make something worse","differentiate (v) to show or find the difference between one thing and others\nenhance (v) to improve the quality of something\nisolate (v) to separate something from other connected things\npeak (v) to reach the highest or strongest point of value or skill"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U08-classroom:material:RW-M03","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[187,188],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/043cf3a7da0d6d3d0ebf25268e3d2a284abc5f4666bfd892986c115d78178c43.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.","sourcePage":187},{"body":"2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.","sourcePage":187},{"body":"3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.","sourcePage":187},{"body":"Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014","sourcePage":188},{"body":"5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.","sourcePage":188},{"body":"6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.","sourcePage":188},{"body":"7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","sourcePage":188}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U08-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"The Value of Talent","pages":[{"page":187,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png","width":772,"height":1040},{"page":188,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/043cf3a7da0d6d3d0ebf25268e3d2a284abc5f4666bfd892986c115d78178c43.png","width":772,"height":1040}],"source":187,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.","sourcePage":187},{"body":"2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.","sourcePage":187},{"body":"3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.","sourcePage":187},{"body":"Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014","sourcePage":188},{"body":"5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.","sourcePage":188},{"body":"6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.","sourcePage":188},{"body":"7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","sourcePage":188}],"text":"## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.\n2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.\n3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.\nPerformance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014\n5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.\n6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.\n7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62976204807aceefeb8b4741f0f15bebd75f727bf60936f9b6a54fa385765b10.mp3"},"original":{"id":"B05-RW-U08-material:RW-M03","entry":"material:RW-M03","unitId":"B05-RW-U08","book":5,"track":"RW","unit":8,"title":"READING 1","kind":"material","pages":[187,188],"sourceImages":[{"page":187,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png","viewEvidenceReported":true},{"page":188,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/043cf3a7da0d6d3d0ebf25268e3d2a284abc5f4666bfd892986c115d78178c43.png","viewEvidenceReported":true}],"text":"## The Value of Talent\n\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.\n\n2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.\n\n3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.\nPerformance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\n\nFigure 1. Team performance as a function of top talent on the team: World Cup football\n\nFigure 2. Team performance as a function of top talent on the team: professional baseball\n\nSource: Swaab et al., 2014\n\n5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.\n6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.\n7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8914","b8915"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62976204807aceefeb8b4741f0f15bebd75f727bf60936f9b6a54fa385765b10.mp3","continueOnPage":true}},{"id":"B05-RW-U08-classroom:resource:b8926","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[190],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e995a29e41a4e9497ae9134b160e3016184e82f175853136c768b446433a6964.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["a (phr v) develops as the result of something\nb (v) is the cause of or a strong influence on something\nc (adj) basic; being the thing on which other things depend"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U08-classroom:resource:b8928","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"module":"Vocabulary for Ex 2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[191],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6692718c2cde9e3df6584403b9f5fedc8d0f8b8ff505603aef6ad3c28bb96acc.png"],"layout":"list","instruction":"Vocabulary for Ex 2","flow":{"kind":"resource","pages":["d (v) saying what you think about something\ne (n) things that prevent somebody from giving full attention to something else\nf (n) the ability to understand how other people feel\ng (n) a movement of the body to express an idea or feeling\nh (adv) only; limited to a specific thing, person or group"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-RW-U08-classroom:material:RW-M04","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[192],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d493bae5b9e64d62c132ac3cd188728a8d26c962433362bc6d976e7d3b9dc1ce.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?","sourcePage":192},{"body":"2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.","sourcePage":192},{"body":"3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.","sourcePage":192},{"body":"4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.","sourcePage":192},{"body":"5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.","sourcePage":192},{"body":"6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","sourcePage":192}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B05-RW-U08-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":192,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d493bae5b9e64d62c132ac3cd188728a8d26c962433362bc6d976e7d3b9dc1ce.png","width":772,"height":1040}],"source":192,"embeddedIn":null,"photo":null,"clearPages":[{"body":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?","sourcePage":192},{"body":"2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.","sourcePage":192},{"body":"3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.","sourcePage":192},{"body":"4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.","sourcePage":192},{"body":"5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.","sourcePage":192},{"body":"6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","sourcePage":192}],"text":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?\n2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.\n3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.\n4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.\n5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.\n6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96de3688fa9f5fcefa24efe5bf5e3a438cfa2656e511ddfab63b9638bda29350.mp3"},"original":{"id":"B05-RW-U08-material:RW-M04","entry":"material:RW-M04","unitId":"B05-RW-U08","book":5,"track":"RW","unit":8,"title":"READING 2","kind":"material","pages":[192],"sourceImages":[{"page":192,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d493bae5b9e64d62c132ac3cd188728a8d26c962433362bc6d976e7d3b9dc1ce.png","viewEvidenceReported":true}],"text":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?\n2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.\n3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.\n4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.\n5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.\n6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b8933"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96de3688fa9f5fcefa24efe5bf5e3a438cfa2656e511ddfab63b9638bda29350.mp3","continueOnPage":true}},{"id":"B05-RW-U08-classroom:review-1","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[205],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ae6d6577e105e6ec7c32fa216a7e8fc7de618a1b1491aa128d9f538ec0741b6b.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B05-RW-U08-B-001","form":"accomplish","page":205},{"id":"B05-RW-U08-B-003","form":"amass","page":205},{"id":"B05-RW-U08-B-004","form":"apparently","page":205},{"id":"B05-RW-U08-B-005","form":"coordinate","page":205},{"id":"B05-RW-U08-B-006","form":"detract from","page":205},{"id":"B05-RW-U08-B-007","form":"differentiate","page":205},{"id":"B05-RW-U08-B-009","form":"enhance","page":205},{"id":"B05-RW-U08-B-011","form":"fairly","page":205},{"id":"B05-RW-U08-B-012","form":"for the most part","page":205},{"id":"B05-RW-U08-B-013","form 师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]},"B05-RW-U08-question:b8934":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"tableEdits":[{"part":0,"block":0,"row":1,"cell":3,"mark":true},{"part":0,"block":0,"row":2,"cell":3,"mark":true},{"part":0,"block":0,"row":3,"cell":1,"mark":true},{"part":0,"block":0,"row":4,"cell":1,"mark":true},{"part":0,"block":0,"row":5,"cell":2,"mark":true},{"part":0,"block":0,"row":6,"cell":2,"mark":true}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B05-RW-U08-classroom:material:RW-M03":[{"body":"## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as","sourcePage":187,"blocks":[{"kind":"text","text":"## The Value of Talent"},{"kind":"text","text":"Much of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as"}]},{"body":"saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.","sourcePage":187,"blocks":[{"kind":"text","text":"saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team."}]},{"body":"2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he","sourcePage":187,"blocks":[{"kind":"text","text":"2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he"}]},{"body":"found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.","sourcePage":187,"blocks":[{"kind":"text","text":"found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production."}]},{"body":"3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.","sourcePage":187,"blocks":[{"kind":"text","text":"3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent."}]},{"body":"4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a\npoint.","sourcePage":187,"blocks":[{"kind":"text","text":"4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a"},{"kind":"text","text":"point."}]},{"body":"Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football","sourcePage":188,"blocks":[{"kind":"text","text":"Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2)."},{"kind":"text","text":"Figure 1. Team performance as a function of top talent on the team: World Cup football"}]},{"body":"Figure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014","sourcePage":188,"blocks":[{"kind":"text","text":"Figure 2. Team performance as a function of top talent on the team: professional baseball"},{"kind":"text","text":"Source: Swaab et al., 2014"}]},{"body":"5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual","sourcePage":188,"blocks":[{"kind":"text","text":"5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual"}]},{"body":"players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team\nperformance.","sourcePage":188,"blocks":[{"kind":"text","text":"players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team"},{"kind":"text","text":"performance."}]},{"body":"6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate,","sourcePage":188,"blocks":[{"kind":"text","text":"6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate,"}]},{"body":"detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.","sourcePage":188,"blocks":[{"kind":"text","text":"detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship."}]},{"body":"7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of","sourcePage":188,"blocks":[{"kind":"text","text":"7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of"}]},{"body":"tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.","sourcePage":188,"blocks":[{"kind":"text","text":"tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force."}]},{"body":"8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","sourcePage":188,"blocks":[{"kind":"text","text":"8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well."}]}],"B05-RW-U08-classroom:material:RW-M04":[{"body":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is","sourcePage":192,"blocks":[{"kind":"text","text":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is"}]},{"body":"not the sum of the intelligence of the individuals in it. So what is the secret to their success?","sourcePage":192,"blocks":[{"kind":"text","text":"not the sum of the intelligence of the individuals in it. So what is the secret to their success?"}]},{"body":"2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups","sourcePage":192,"blocks":[{"kind":"text","text":"2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are
