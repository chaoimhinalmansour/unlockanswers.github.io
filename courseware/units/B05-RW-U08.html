ATCHING"},"instruction":"Watch the video. Number the main ideas (a–e) in the order you hear them.","pages":[185],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9d1afbc552892a96e366a68632ea86911ee50d93e2e9e4eb937ec723c286c5f7.png"],"provided":"","items":[{"id":"b8901.i01","label":"a","prompt":"During the winter the engineers do important tasks. ____","options":[],"type":"gap/closed"},{"id":"b8901.i02","label":"b","prompt":"Keeping the Red Arrows flying is very expensive. ____","options":[],"type":"gap/closed"},{"id":"b8901.i03","label":"c","prompt":"Red One is the team leader. ____","options":[],"type":"gap/closed"},{"id":"b8901.i04","label":"d","prompt":"There are over 120 personnel in the Red Arrows team. ____","options":[],"type":"gap/closed"},{"id":"b8901.i05","label":"e","prompt":"The pilots' jobs are very dangerous. ____","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8901.i01","label":"a","prompt":"During the winter the engineers do important tasks. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b8901.i02","label":"b","prompt":"Keeping the Red Arrows flying is very expensive. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b8901.i03","label":"c","prompt":"Red One is the team leader. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b8901.i04","label":"d","prompt":"There are over 120 personnel in the Red Arrows team. ____","options":[],"type":"gap/closed"},{"kind":"item","id":"b8901.i05","label":"e","prompt":"The pilots' jobs are very dangerous. ____","options":[],"type":"gap/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/44330b080a0b7f3cdbfe8f67-L5RW-U08.mp4","captions":[{"start":0,"end":2.18,"text":"At the Royal Air Force Base in Scanton,"},{"start":2.5,"end":2.74,"text":"UK,"},{"start":3.16,"end":6.14,"text":"these are the unique Hawk jets of the Red Arrows,"},{"start":6.68,"end":8.7,"text":"an elite team of RAF pilots,"},{"start":9.04,"end":10.94,"text":"engineers and vital support staff."},{"start":11.98,"end":19,"text":"It takes over 120 people to bring together the Red\nArrows' spectacular aerobatic displays."},{"start":20.08,"end":24.92,"text":"Our report catches up with the team during their\npreparations for the summer months."},{"start":29,"end":36.94,"text":"In the skies above Lincolnshire, the Red Arrows soar\nand swoop, honing the precision moves they've become so\nfamous for."},{"start":37.34,"end":38.48,"text":"The man out front,"},{"start":38.92,"end":39.48,"text":"Red One."},{"start":41.62,"end":49.86,"text":"It's an absolute dream job to get and to sit in the\nfront of such a capable team, not just the pilots but\nall of the personnel that work on the Red Arrows,"},{"start":50.34,"end":53.34,"text":"highly trained, highly skilled and really motivated to\ndo a good job."},{"start":53.96,"end":57.56,"text":"Now the nine aircraft he leads are being given a\nmakeover."},{"start":58.02,"end":61.54,"text":"This is the first time the new look tail fin has been\nseen,"},{"start":61.9,"end":67.46,"text":"the first permanent change to the design since the Red\nArrows were formed in 1964,"},{"start":67.92,"end":70.92,"text":"but it'll be months before being displayed to the\npublic."},{"start":73.7,"end":77.22,"text":"It's now during the winter months that the hard work is\ndone,"},{"start":77.56,"end":84.06,"text":"with up to five training assaults flown each day to\nmake sure that every single performance is perfect come\nthe summer."},{"start":84.52,"end":88.12,"text":"When it's as windy as this, it's even tougher for the\npilots."},{"start":90.56,"end":93.5,"text":"It is also the time for vital engineering work."},{"start":94.03999999999999,"end":101.25999999999999,"text":"Corporal Drew Paxton is one of the exclusive circus\nengineers picked to travel to displays in the seat\nbehind the pilot."},{"start":101.8,"end":109.72,"text":"The engineers as a whole on the squadron are the\nlifeline, the lifeblood of the squadron and if we don't\nhave them then we can't do anything."},{"start":110.42,"end":116.58,"text":"Everything must be checked meticulously, including the\npotentially life saving kit worn by the pilots."},{"start":117.97999999999999,"end":120.7,"text":"The G trousers, once I start pulling G will start to\ninflate."},{"start":121.12,"end":123.22,"text":"My muscles and my legs have to tense against them."},{"start":123.58,"end":124.94,"text":"Now when they tense against it,"},{"start":125.46,"end":127.52,"text":"the blood doesn't pool on my legs and it will stay in\nmy torso,"},{"start":127.84,"end":131.6,"text":"so now that makes it easier for me to work to keep the\nblood pumping to my head."},{"start":131.9,"end":133.8,"text":"But there will always be danger."},{"start":134.42,"end":135.2,"text":"In 2011,"},{"start":135.52,"end":139,"text":"two pilots from the aerobatic team died in separate\nincidents."},{"start":139.42000000000002,"end":141.2,"text":"Getting everything right is crucial."},{"start":141.8,"end":144.22,"text":"It means a debrief after every flight."},{"start":145.86,"end":150.74,"text":"It costs £nine million a year to keep the fast jets\nflying,"},{"start":151.16,"end":152.68,"text":"too high a cost for some."},{"start":153.3,"end":157.57999999999998,"text":"But this summer they'll perform 80 times, ambassadors\nfor Britain,"},{"start":157.92000000000002,"end":162.46,"text":"as they speed towards a further 50 years of unmatched\naerobatics."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 3 b 5 c 2 d 1 e 4","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909f , communication, and\ntrusting others to achieve shared\ngoals. They also demonstrate how\ndiscipline, resilience, and adapting to\nchallenges are crucial for success in any\ncollaborative effort.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8909","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"order":10,"module":"READING 1","ex":"2","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"instruction":"Read the definitions. Use the correct form of the words in bold to complete the sentences below.","pages":[186],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9ebdcf5663c8d14a58fb1f2ddbad7c21a1c3961795e66071da1566c61378c747.png"],"provided":"","items":[{"id":"b8909.i01","label":"1","prompt":"The exercise room and excellent cafeteria ____ the company's image amongst new graduates.","options":[],"type":"gap/closed"},{"id":"b8909.i02","label":"2","prompt":"We cannot work independently. We will need to ____ our efforts if we want this project to be a success.","options":[],"type":"gap/closed"},{"id":"b8909.i03","label":"3","prompt":"The unemployment rate ____ in 2010 and has been falling since then.","options":[],"type":"gap/closed"},{"id":"b8909.i04","label":"4","prompt":"We have ____ a lot in the last five years, but we still have more work to do in order to reach our goals.","options":[],"type":"gap/closed"},{"id":"b8909.i05","label":"5","prompt":"The team has ____ an impressive number of trophies and medals.","options":[],"type":"gap/closed"},{"id":"b8909.i06","label":"6","prompt":"We need to find a way to ____ our products from all the other similar products on the market.","options":[],"type":"gap/closed"},{"id":"b8909.i07","label":"7","prompt":"The player's disruptive behaviour ____ the fans' enjoyment of yesterday's game.","options":[],"type":"gap/closed"},{"id":"b8909.i08","label":"8","prompt":"Analysts have been able to ____ the most important factors in a team's success.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8909.i01","label":"1","prompt":"The exercise room and excellent cafeteria ____ the company's image amongst new graduates.","options":[],"type":"gap/closed","answer":{"label":"1","mode":"gap","answer":"enhance / enhanced"}},{"kind":"item","id":"b8909.i02","label":"2","prompt":"We cannot work independently. We will need to ____ our efforts if we want this project to be a success.","options":[],"type":"gap/closed","answer":{"label":"2","mode":"gap","answer":"coordinate"}},{"kind":"item","id":"b8909.i03","label":"3","prompt":"The unemployment rate ____ in 2010 and has been falling since then.","options":[],"type":"gap/closed","answer":{"label":"3","mode":"gap","answer":"peaked"}},{"kind":"item","id":"b8909.i04","label":"4","prompt":"We have ____ a lot in the last five years, but we still have more work to do in order to reach our goals.","options":[],"type":"gap/closed","answer":{"label":"4","mode":"gap","answer":"accomplished"}},{"kind":"item","id":"b8909.i05","label":"5","prompt":"The team has ____ an impressive number of trophies and medals.","options":[],"type":"gap/closed","answer":{"label":"5","mode":"gap","answer":"amassed"}}],[{"kind":"item","id":"b8909.i06","label":"6","prompt":"We need to find a way to ____ our products from all the other similar products on the market.","options":[],"type":"gap/closed","answer":{"label":"6","mode":"gap","answer":"differentiate"}},{"kind":"item","id":"b8909.i07","label":"7","prompt":"The player's disruptive behaviour ____ the fans' enjoyment of yesterday's game.","options":[],"type":"gap/closed","answer":{"label":"7","mode":"gap","answer":"detracted from"}},{"kind":"item","id":"b8909.i08","label":"8","prompt":"Analysts have been able to ____ the most important factors in a team's success.","options":[],"type":"gap/closed","answer":{"label":"8","mode":"gap","answer":"isolate"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 enhance / enhanced 2 coordinate 3 peaked\n4 accomplished 5 amassed 6 differentiate\n7 detracted from 8 isolate","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8911","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"order":11,"module":"READING 1","ex":"3","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the article. Underline the sentences that you think express the main ideas.","pages":[187],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U08-classroom:material:RW-M03","title":"READING 1","text":"## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.\n2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.\n3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.\nPerformance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014\n5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.\n6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.\n7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","screens":["## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.","2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.","3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.","Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014","5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.","6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.","7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well."],"sources":[{"page":187,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png","width":772,"height":1040},{"page":188,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/043cf3a7da0d6d3d0ebf25268e3d2a284abc5f4666bfd892986c115d78178c43.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62976204807aceefeb8b4741f0f15bebd75f727bf60936f9b6a54fa385765b10.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Much of the work in today’s world is\naccomplished in teams: in business, in\nscientific research, in government, on film\nsets and, of course, in sports.\nAnimal scientist William Muir wondered\nif he could build such an A-team –\nwith chickens.\nOf course, chickens are not a team, but\nthis kind of group interaction and its\neffect on production piqued the interest\nof researchers who study teams and\nteamwork.\nIn looking for an explanation for the\ndifferent results for different sports, the\nresearchers isolated one important factor –\nthe extent to which a good performance by\na team requires its members to coordinate\ntheir actions.\nAssembling the ideal team – for sport,\nbusiness, science, or entertainment – is\nmore complicated than simply hiring the\nbest talent.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8912","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"order":12,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Complete the summary of the article. Then compare your ideas with a partner.","pages":[187],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png"],"provided":"Some sports teams are a lot like chickens. Too many high-level individual performers (1) ____ from the (2) ____ of the group. This is most likely to happen in sports such as football and (3 value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.\n2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.\n3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.\nPerformance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014\n5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.\n6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.\n7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few g  team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.","2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.","3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.","Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014","5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.","6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.","7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well."],"sources":[{"page":187,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png","width":772,"height":1040},{"page":188,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/043cf3a7da0d6d3d0ebf25268e3d2a284abc5f4666bfd892986c115d78178c43.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62976204807aceefeb8b4741f0f15bebd75f727bf60936f9b6a54fa385765b10.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 A-team: this refers to the best possible\nteam or group of people you could have\nworking together. It is not limited to\nsports.\n2 pecking order: this could relate to the\nfact that some members of the team are\nbetter than others and, therefore, have\nmore power in the group.\n3 tug-of-war: there are two teams on\neither side of a rope. Both teams tug, or\npull, on the rope with the goal of pulling\nthe other team over a line. The team\nthat pulls the hardest wins. The term\ncould be used in other contexts when\ntrying to explain how two groups or\nteams are fighting over the same thing.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd5 tainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well.","screens":["## The Value of Talent\nMuch of the work in today's world is accomplished in teams: in business, in scientific research, in government, on film sets and, of course, in sports. Most people believe that the best way to build a great team is to assemble a group of the best, most talented individuals. Meta's Mark Zuckerberg, commenting on the value of talent, is quoted as saying that one great engineer is worth a hundred average ones. And Zuckerberg is certainly somebody who knows how to build an A-team.","2 Animal scientist William Muir wondered if he could build such an A-team – with chickens. He looked for the most prolific egg producers and bred them for six generations. This was his test group. For comparison, he did the same thing with a selection of average egg producers. This was his control group. To his surprise, six generations later, he found that the egg production of the test group was lower than that of the control group. He discovered that the super-producers in the test group used an enormous amount of energy constantly re-establishing a pecking order – competing for the top spot. As a result, they had little energy left for egg production.","3 Of course, chickens are not a team, but this kind of group interaction and its effect on production piqued the interest of researchers who study teams and teamwork. The owners of sports teams spend millions of dollars to attract top talent. Companies spend millions to hire top business people. They want to know if their money is well spent.\n4 A recent series of studies examined the role of talent in the sports world. They focused on three different sports: World Cup football, professional basketball and professional baseball. The results were mixed. For football and basketball, the studies revealed that adding talented players to a team is indeed a good strategy, but only up to a point.","Performance peaked when about $70\\%$ of the players were considered top talent; above that level, the team's performance began to decline. Interestingly, this trend was not evident in baseball, where additional individual talent continued to enhance the team's performance (Figures 1 and 2).\nFigure 1. Team performance as a function of top talent on the team: World Cup football\nFigure 2. Team performance as a function of top talent on the team: professional baseball\nSource: Swaab et al., 2014","5 In looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.","6 One explanation for this phenomenon is not so far from the pecking order situation among chickens. If a basketball star is pursuing his own personal goals – for example, trying to amass a high personal point total – he may be less generous as a team player. He may take a shot himself when it would be better to pass the ball to a teammate, detracting from the team's overall performance. Young children learning to play team sports are often told, 'There is no I in TEAM.' Stars apparently do not follow this basic principle of sportsmanship.","7 Another possibility is that when there is a lot of talent on a team, some players may begin to make less effort. This is referred to as the Ringelmann effect. Maximilien Ringelmann, a French agricultural engineer, conducted an experiment in 1913 in which he asked two, three, four and up to twenty-eight people to participate in a game of tug-of-war. He measured how much force each person used to pull the rope. He found that whenever he added a person to the team, everyone else pulled with less force.\n8 Assembling the ideal team – for sports, business, science, or entertainment – is more complicated than simply hiring the best talent. An A-team may require a balance – not just A players, but a few generous B players as well."],"sources":[{"page":187,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1afde6321fbd292a8e579aa34a57c27395322eeb5967266f7b255f9f491b76ce.png","width":772,"height":1040},{"page":188,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/043cf3a7da0d6d3d0ebf25268e3d2a284abc5f4666bfd892986c115d78178c43.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/62976204807aceefeb8b4741f0f15bebd75f727bf60936f9b6a54fa385765b10.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"To: Imani Bibb, founder\nDear Ms Bibb,\nI am interested in applying for a job at your\ncompany. Your ad specifically mentions\nthat you are looking for employees who\nexcel at working on a team. I believe I\nwork exceptionally well on teams and that I\nwould be a perfect fit for your new business.\nI know that most goals cannot be\naccomplished alone. On the contrary,\ncolleagues have to stay in frequent contact\nwith each other, coordinating their actions\nwhenever possible. My colleagues should\nnever wonder what I am working on or\nwhen I will finish my task, and vice versa. I\nstrongly believe that task interdependence\nis essential to the performance of a team.\nIn addition, while talented individuals are\nnecessary for the success of any business,\nmore than talent is required. Talented\nemployees cannot isolate themselves in\nthe belief that theirs is the only work that\nmatters. Everyone should do the best\nwork they can, but with the understanding\nthat sometimes they should take the\nlead and other times they should follow.\nThis is the necessary balance that a well-\noperating team should strive for. I am\ncommitted to being a team player. For\nthat reason, I believe I would make an\nexcellent employee.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8945","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":1,"order":17,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Read the sentences. Write B if the sentence is a bold claim and H if it is a hedged claim.","pages":[195],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/73a960c08f19559fc39d5b2e9956b082e4b253567f243bb34eddf7ddb50d7134.png"],"pro ADING 2","phaseTitle":"PREPARING TO READ"},"instruction":"What factors do you think are necessary for successful group interaction and why?","pages":[190],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e995a29e41a4e9497ae9134b160e3016184e82f175853136c768b446433a6964.png"],"provided":"","items":[{"id":"b8925.i01","label":"1","prompt":"What factors do you think are necessary for successful group interaction and why?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Successful groups need balanced input,\nnot just one person talking.\n2 Different personalities can help but\naren’t essential; it’s more important that\nmembers work well together.\n3 Being open to differing opinions fosters\nhealthy discussion and collaboration.\nOther important factors include clear\ncommunication, mutual respect, and a\nshared goal.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8927","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":22,"module": tions":[],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8930.i01","label":"1","prompt":"Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it.","options":[],"type":"choice/open"},{"kind":"item","id":"b8930.i02","label":"2","prompt":"In the Google study, researchers amassed thousands of data points on hundreds of groups to find patterns.","options":[],"type":"choice/open"},{"kind":"item","id":"b8930.i03","label":"3","prompt":"Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project.","options":[],"type":"choice/open"}]],"courseMaterials":[{"id":"B05-RW-U08-classroom:material:RW-M04","title":"READING 2","text":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?\n2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.\n3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.\n4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.\n5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.\n6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","screens":["For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?","2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.","3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.","4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.","5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager  2","text":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?\n2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.\n3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.\n4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.\n5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.\n6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","screens":["For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?","2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.","3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.","4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.","5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.","6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance."],"sources":[{"page":192,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d493bae5b9e64d62c132ac3cd188728a8d26c962433362bc6d976e7d3b9dc1ce.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96de3688fa9f5fcefa24efe5bf5e3a438cfa2656e511ddfab63b9638bda29350.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 both 2 both 3 Google 4 Google 5 MIT 6 MIT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8935","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":26,"module":"READING 2","ex":"6","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Scan the article to find the terms. Write the term next to the correct meaning.","pages":[193],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/dcae50a60e6942e0f95daaf02fd3981e1269ae7151bed991c0caa63653e6879d.png"],"provided":"group intelligence psychological safety\n\na ____ the feeling of being able to express your ideas within a group without fear of a negative response\nb ____ the ability of a group to make good decisions and/or perform well on tasks","items":[{"id":"b8935.i01","label":"a","prompt":"____ the feeling of being able to
