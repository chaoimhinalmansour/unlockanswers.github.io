oom:material:RW-M04","title":"READING 2","text":"For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?\n2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.\n3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.\n4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.\n5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.\n6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance.","screens":["For years, psychologists have known how to measure the intelligence of individuals, yet only recently have they begun to investigate the issue of group intelligence. This notion stems from the observation that some groups seem to work well across tasks, even tasks that are not very similar. Early investigations suggest that group intelligence is not the sum of the intelligence of the individuals in it. So what is the secret to their success?","2 Researchers at Google and the Massachusetts Institute of Technology have both tackled this question and they believe they finally have a handle on what makes some teams successful. In the Google study, researchers amassed thousands of data points on hundreds of groups and combed through them to find patterns. Are the members of effective groups friends outside of work? Do groups whose members have similar personalities or backgrounds work together best? Does gender make a difference? They floated many theories, but despite their best efforts, found no patterns to support them. In fact, who was in the group apparently did not seem to make a difference; instead, the difference between more and less effective groups seemed to lie in the interaction among the members.","3 The MIT group had already been gathering data on group interaction using digital 'badges' that participants in the study agreed to wear. These badges provided a wealth of information, including how long people spoke and to whom, what kinds of gestures they made, where they were looking during interaction, and their facial expressions. As in the Google study, this research group concluded that the key to an effective team is how members interact.","4 Among the findings, the most consistent and significant is that, in effective groups, members spoke for a roughly equal amount of time – not at every meeting or interaction, but across the course of a project. A second consistent finding was that members displayed empathy, an understanding of how it might feel to walk in somebody else's shoes. This social sensitivity is measured by a relatively new test, called 'Reading the Mind in the Eyes'. The test assesses individual differences in two key factors, social awareness and emotion recognition, by asking individuals to guess emotions based on only a picture of a person's eyes. A high level of these two features create what one of the researchers in the Google study calls psychological safety; members of the group feel comfortable voicing their opinions and making suggestions without fear of a negative response from other members of the group, and they believe that others will listen to them and value what they say. When these conditions are present, the group as a whole tends to be effective.","5 There were additional findings that support these general ones. For example, in effective groups, members face one another directly when they speak and they use energetic and enthusiastic gestures. They also communicate directly with one another, not just through the leader or manager of the group. In fact, the MIT study found that side conversations between individual members during meetings, far from being a distraction, actually increased the group's productivity. All the findings underline the importance of having face-to-face meetings instead of phone calls or teleconferences or communicating by email. The positive behaviours uncovered in these studies occur primarily or exclusively in face-to-face interaction. The MIT team estimates that 35% of a team's performance can be explained just by the number of their face-to-face exchanges.","6 One might argue that most of these findings are obvious, and it goes without saying that good managers have probably always understood these principles. Our social and professional lives, however, are not always structured in ways that facilitate the kind of interaction that apparently underlies effective group performance. Understanding group intelligence can help businesses and other organizations make the fundamental changes necessary to improve group performance."],"sources":[{"page":192,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d493bae5b9e64d62c132ac3cd188728a8d26c962433362bc6d976e7d3b9dc1ce.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/96de3688fa9f5fcefa24efe5bf5e3a438cfa2656e511ddfab63b9638bda29350.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"The following four people would make up a\ngood team:\nA person who gives good interpersonal\nadvice. Studies have shown that sensitivity\nis a key trait for collaboration. If a person\npossesses this trait, they will be socially and\nemotionally aware, which are two things\nthat team members will appreciate and\nrespond to.\nA person who is often mentioned in\nacademic journals because of their\nexpertise. While good teamwork is\nfundamental to success, individual talent\nwill greatly enhance the quality of the work.\nA person who supports new ideas but\ndoesn’t have that many of their own. The\nideal team requires a balance of leaders\nand followers. This person would be a vital\nsource of support and would help push the\nideas of others forward.\nA person who encourages other colleagues\nto voice their opinions during meetings.\nPsychological safety is important. Group\nmembers must feel like they can speak\nfreely, with confidence that their opinions\nwill be heard and valued.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8952","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":29,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read the report opposite. Answer the questions.","pages":[196,197],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7eebe65969fc39c763b899a6a6e46a43598c1e3081524b09610cb6801a117e43.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d727c31236668208c3e06e339eebabaf7a4dcfc96ed459a67bb4c16bc677a5c8.png"],"provided":"# Executive summary\n\nThe high staff turnover and absence rate at the company is likely to be the result of low employee satisfaction. Many employees experience high levels of stress and feel they have little investment in the company. Several recommendations are offered that may increase employee satisfaction and motivation.\n\n## Introduction\n\nRecently, the company has experienced considerable staff turnover. Just last month, six employees left the company. In addition, there has been a high absence rate, with most employees calling in sick at least once a month. This has negative implications for the bottom line; profits were down 4% in the first two quarters of this year.\n\n## Workplace satisfaction\n\nThe following steps were taken to uncover the source of these developments: (1) interviews with departing employees, (2) a survey of current employees and (3) in-depth research on employee satisfaction.\n\n## Interviews with former employees\n\nFormer employees found their jobs too stressful. Five of them agreed to be interviewed about their reasons for leaving the company. Two reported leaving for economic reasons; they received job offers from competitors at a higher salary. However, all five reported a high level of stress in their jobs. They felt they could not take time off at weekends; they answered texts and emails until late at night. Several said they had not taken a holiday in more than a year. They mentioned that members of their families complained about how little time they spent at home. Two people reported that the stress had affected their health.\n\n## Survey of current employees\n\nThe survey results of 52 current employees revealed low job satisfaction. Employees are happy with their salaries, but they are not happy with how decisions are made in the company. Many said they do not feel free to voice their opinions and that their managers rarely ask for their input or listen to their suggestions. Several mentioned the poor communication from senior management. As a result of dissatisfaction in these areas, many said they are no longer motivated to do their best. Thirty percent said they take days off even when they are not ill. More than 20% said they would leave the company if they received another job offer.\n\n## Employee satisfaction\n\nExperts on workplace issues suggest that problems like these have several sources. Surprisingly, most are not related to money.\n\n- Appreciation: Employees want to know that their work – and their opinions – are valued.  \n- Good relationships and communication: In an effective office, employees get along with one another and with their bosses. They communicate regularly, especially when there are problems, and they solve them together.  \n- Career development: Employees are more likely to stay at a company if they feel there is room for them to grow and that the company supports their career development.  \n- Work–life balance: No matter how much employees love their jobs, they can't work all the time. It is important for them to get away from the office to spend time with family or friends. They will return to the office more relaxed and motivated to work hard.\n\n## Recommendations\n\n- Find ways to reward employees when they perform well.  \n- Establish a clear career path for high-performing employees.  \n- Improve lines of communication.  \n- Have more face-to-face meetings.  \n- Establish a space where employees can meet and relax.  \n- Establish a ‘no-communication’ policy after certain hours and at weekends so employees can relax when they are away from the office.  \n- Allow employees to take days off for important personal events.","items":[{"id":"b8952.i01","label":"1","prompt":"What is the purpose of the report?","options":[],"type":"qa/open"},{"id":"b8952.i02","label":"2","prompt":"Who is the audience?","options":[],"type":"qa/open"},{"id":"b8952.i03","label":"3","prompt":"What format and features does the report have?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"# Executive summary"},{"kind":"text","text":"The high staff turnover and absence rate at the company is likely to be the result of low employee satisfaction. Many employees experience high levels of stress and feel they have little investment in the company. Several recommendations are offered that may increase employee satisfaction and motivation."},{"kind":"text","text":"## Introduction"},{"kind":"text","text":"Recently, the company has experienced considerable staff turnover. Just last month, six employees left the company. In addition, there has been a high absence rate, with most employees calling in sick at least once a month. This has negative implications for the bottom line; profits were down 4% in the first two quarters of this year."}],[{"kind":"text","text":"## Workplace satisfaction"},{"kind":"text","text":"The following steps were taken to uncover the source of these developments: (1) interviews with departing employees, (2) a survey of current employees and (3) in-depth research on employee satisfaction."},{"kind":"text","text":"## Interviews with former employees"}],[{"kind":"text","text":"Former employees found their jobs too stressful. Five of them agreed to be interviewed about their reasons for leaving the company. Two reported leaving for economic reasons; they received job offers from competitors at a higher salary. However, all five reported a high level of stress in their jobs. They felt they could not take time off at weekends; they answered texts and emails until late at night. Several said they had not taken a holiday in more than a year. They mentioned that members of their families complained about how little time they spent at home. Two people reported that the stress had affected their health."},{"kind":"text","text":"## Survey of current employees"}],[{"kind":"text","text":"The survey results of 52 current employees revealed low job satisfaction. Employees are happy with their salaries, but they are not happy with how decisions are made in the company. Many said they do not feel free to voice their opinions and that their managers rarely ask for their input or listen to their suggestions. Several mentioned the poor communication from senior management. As a result of dissatisfaction in these areas, many said they are no longer motivated to do their best. Thirty percent said they take days off even when they are not ill. More than 20% said they would leave the company if they received another job offer."},{"kind":"text","text":"## Employee satisfaction"},{"kind":"text","text":"Experts on workplace issues suggest that problems like these have several sources. Surprisingly, most are not related to money."}],[{"kind":"text","text":"- Appreciation: Employees want to know that their work – and their opinions – are valued.  "},{"kind":"text","text":"- Good relationships and communication: In an effective office, employees get along with one another and with their bosses. They communicate regularly, especially when there are problems, and they solve them together.  "},{"kind":"text","text":"- Career development: Employees are more likely to stay at a company if they feel there is room for them to grow and that the company supports their career development.  "},{"kind":"text","text":"- Work–life balance: No matter how much employees love their jobs, they can't work all the time. It is important for them to get away from the office to spend time with family or friends. They will return to the office more relaxed and motivated to work hard."}],[{"kind":"text","text":"## Recommendations"},{"kind":"text","text":"- Find ways to reward employees when they perform well.  "},{"kind":"text","text":"- Establish a clear career path for high-performing employees.  "},{"kind":"text","text":"- Improve lines of communication.  "},{"kind":"text","text":"- Have more face-to-face meetings.  "},{"kind":"text","text":"- Establish a space where employees can meet and relax.  "}],[{"kind":"text","text":"- Establish a ‘no-communication’ policy after certain hours and at weekends so employees can relax when they are away from the office.  "},{"kind":"text","text":"- Allow employees to take days off for important personal events."},{"kind":"item","id":"b8952.i01","label":"1","prompt":"What is the purpose of the report?","options":[],"type":"qa/open"},{"kind":"item","id":"b8952.i02","label":"2","prompt":"Who is the audience?","options":[],"type":"qa/open"},{"kind":"item","id":"b8952.i03","label":"3","prompt":"What format and features does the report have?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  to decrease staff turnover and increase employee\nsatisfaction in the company\n2  company management\n3  Executive summary: a statement summarizing the\ncontent of the report; introduction describing\nspecific problem and giving facts and figures; outline\nof methodology of inquiry into causes of workplace\ndissatisfaction; summary of results of each type of\ninvestigation undertaken; list of recommendations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":63,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8954","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":30,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in a small group. What new information did you learn from the report regarding maintaining effective work teams? Make some notes to use for your own report.","pages":[198],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c3c058b87febef6c4a3e471962819303e4e390619ecdc78cdca0d2abb82075bc.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"• High staff turnover and absence rates\nare linked to low employee satisfaction\nand stress.\n• Stress and work-life imbalance are major\nfactors causing dissatisfaction, with\nemployees unable to disconnect from\nwork during weekends and after hours.\n• Lack of communication and input in\ndecision-making is a significant cause of\nlow job motivation.\n• Career development and appreciation\nare essential for retaining employees.\n• Some ways of solving the issues can\nbe: rewarding performance, improving\ncommunication, offering career growth\nopportunities, and enforcing a no-\ncommunication policy after hours for\nwork-life balance.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8955","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":31,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"You will write a report making recommendations to a company called Cybergogo. Read the description of the company. Then work in small groups and discuss the questions below. Make notes.","pages":[198],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c3c058b87febef6c4a3e471962819303e4e390619ecdc78cdca0d2abb82075bc.png"],"provided":"Cybergogo is high-tech company that analyzes data and develops mathematical models.\n- It is a relatively new company – it began as a start-up $^{1}$ three years ago.\n- The head of the company is very assertive, has strong opinions and tends to make decisions based on them.\n- Almost all the employees are young – under 35 – and have degrees from elite universities. Most of them expect to run their own start-ups soon.\n- There is no central office. All employees work at home, from coffee shops or while they are travelling anywhere in the world. Most of their communication is digital.\n- The company is bidding for a big job for a major international food service company. They have to prepare a proposal in the next six months.\n- The last time Cybergogo bid for a similar job, they did not get the contract, in part because they did not complete the proposal on time.\n- One reason for their failure was a lack of agreement on how to complete the project. Two people left the company soon after. One of them was the Chief Technology Officer.\n- The new Chief Technology Officer started at the company just two months ago. He has not met most of the staff yet.\n\n$^{1}$ start-up (n) a small business that has just been started","items":[{"id":"b8955.i01","label":"1","prompt":"What is Cybergogo's primary goal – In other words, how do they hope your report will help them?","options":[],"type":"discuss/open"},{"id":"b8955.i02","label":"2","prompt":"What are some intermediate goals – that is, things the company needs to accomplish in order to reach that goal?","options":[],"type":"discuss/open"},{"id":"b8955.i03","label":"3","prompt":"What are the top two or three challenges you think the organization faces?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Cybergogo is high-tech company that analyzes data and develops mathematical models."},{"kind":"text","text":"- It is a relatively new company – it began as a start-up $^{1}$ three years ago."},{"kind":"text","text":"- The head of the company is very assertive, has strong opinions and tends to make decisions based on them."},{"kind":"text","text":"- Almost all the employees are young – under 35 – and have degrees from elite universities. Most of them expect to run their own start-ups soon."},{"kind":"text","text":"- There is no central office. All employees work at home, from coffee shops or while they are travelling anywhere in the world. Most of their communication is digital."}],[{"kind":"text","text":"- The company is bidding for a big job for a major international food service company. They have to prepare a proposal in the next six months."},{"kind":"text","text":"- The last time Cybergogo bid for a similar job, they did not get the contract, in part because they did not complete the proposal on time."},{"kind":"text","text":"- One reason for their failure was a lack of agreement on how to complete the project. Two people left the company soon after. One of them was the Chief Technology Officer."},{"kind":"text","text":"- The new Chief Technology Officer started at the company just two months ago. He has not met most of the staff yet."},{"kind":"text","text":"$^{1}$ start-up (n) a small business that has just been started"}],[{"kind":"item","id":"b8955.i01","label":"1","prompt":"What is Cybergogo's primary goal – In other words, how do they hope your report will help them?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8955.i02","label":"2","prompt":"What are some intermediate goals – that is, things the company needs to accomplish in order to reach that goal?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8955.i03","label":"3","prompt":"What are the top two or three challenges you think the organization faces?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  to win business from a major international food service\ncompany\n2  to decrease staff turnover, lower employee stress and\nincrease employee satisfaction\n3  See Model Answer Booklet p21 for an example answer.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8956","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":32,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Consider the goals and challenges of the company and answer the questions.","pages":[199],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/43469f83e57f655c0bfb2ca05c748db167713901cfe674fdec4e936056778e37.png"],"provided":"","items":[{"id":"b8956.i01","label":"1","prompt":"What are your recommendations around the way Cybergogo's employees work?","options":[],"type":"qa/open"},{"id":"b8956.i02","label":"2","prompt":"What evidence for these recommendations will you include in your report?","options":[],"type":"qa/open"},{"id":"b8956.i03","label":"3","prompt":"What are your recommendations for any changes in communication policy at the company?","options":[],"type":"qa/open"},{"id":"b8956.i04","label":"4","prompt":"What evidence for these recommendations will you include in your report?","options":[],"type":"qa/open"},{"id":"b8956.i05","label":"5","prompt":"What are your recommendations for any changes in recruitment at the company?","options":[],"type":"qa/open"},{"id":"b8956.i06","label":"6","prompt":"What evidence for these recommendations will you include in your report?","options":[],"type":"qa/open"},{"id":"b8956.i07","label":"7","prompt":"Do you have any other recommendations?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8956.i01","label":"1","prompt":"What are your recommendations around the way Cybergogo's employees work?","options":[],"type":"qa/open"},{"kind":"item","id":"b8956.i02","label":"2","prompt":"What evidence for these recommendations will you include in your report?","options":[],"type":"qa/open"},{"kind":"item","id":"b8956.i03","label":"3","prompt":"What are your recommendations for any changes in communication policy at the company?","options":[],"type":"qa/open"},{"kind":"item","id":"b8956.i04","label":"4","prompt":"What evidence for these recommendations will you include in your report?","options":[],"type":"qa/open"},{"kind":"item","id":"b8956.i05","label":"5","prompt":"What are your recommendations for any changes in recruitment at the company?","options":[],"type":"qa/open"},{"kind":"item","id":"b8956.i06","label":"6","prompt":"What evidence for these recommendations will you include in your report?","options":[],"type":"qa/open"},{"kind":"item","id":"b8956.i07","label":"7","prompt":"Do you have any other recommendations?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Introduce clear project management\ntools and regular virtual meetings to\nimprove collaboration and ensure timely\nproject completion.\n2 The previous failed bid resulted from\na lack of agreement and missed\ndeadlines, which could be addressed\nwith better coordination and structured\ncommunication.\n3 Establish regular team check-ins,\nmandatory video calls for key decisions,\nand clear guidelines for communication\nduring projects to improve clarity and\nteam alignment.\n4 Digital-only communication has led to\nmiscommunication and project delays,\nas seen in the last failed bid, and the\nnew CTO hasn’t yet met most of the\nteam, creating further disconnect.\n5 Focus on hiring individuals with strong\nteamwork and communication skills, in\naddition to technical expertise, to ensure\nsmoother collaboration across the\nremote team.\n6 High turnover and staff departures\nsuggest the need for better alignment\nin recruitment, ensuring new hires are a\nbetter cultural and team fit.\n7 Create a mentorship program to foster\ncollaboration and professional growth\namong younger employees, while also\noffering clearer career development\nopportunities to reduce turnover.\nGRAMMAR FOR WRITING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8962","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":33,"module":"GRAMMAR FOR WRITING","ex":"1","context":{"moduleLabel":"GRAMMAR FOR WRITING","phaseTitle":"GRAMMAR FOR WRITING"},"instruction":"Work with a partner. Read the claim below and circle the better counter-argument and refutation.","pages":[201],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d30c7f4f51ec57f6da43d9086e3c3e78de5285892640f10d7b678cf2d6375dc2.png"],"provided":"Claim: Companies should allow their employees to work remotely.\n\nCounter-argument:\n\na Working at home cuts down on commuting time and cost for employees.\nb Working at home can cause employees to work too many hours and feel isolated.\n\nRefutation:\n\na Employees should be willing to accept a reduced salary if they want to work at home.\nb Working remotely has been proven to increase work–life balance for employees.","items":[{"id":"b8962.i01","label":"Counter-argument","prompt":"Select the better counter-argument to the claim that companies should allow their employees to work remotely.","options":[{"optionLabel":"a","textEn":"Working at home cuts down on commuting time and cost for employees."},{"optionLabel":"b","textEn":"Working at home can cause employees to work too many hours and feel isolated."}],"type":"choice/closed"},{"id":"b8962.i02","label":"Refutation","prompt":"Select the better refutation to the counter-argument about working remotely.","options":[{"optionLabel":"a","textEn":"Employees should be willing to accept a reduced salary if they want to work at home."},{"optionLabel":"b","textEn":"Working remotely has been proven to increase work–life balance for employees."}],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Claim: Companies should allow their employees to work remotely."},{"kind":"text","text":"a Working at home cuts down on commuting time and cost for employees."},{"kind":"text","text":"b Working at home can cause employees to work too many hours and feel isolated."},{"kind":"text","text":"a Employees should be willing to accept a reduced salary if they want to work at home."},{"kind":"text","text":"b Working remotely has been proven to increase work–life balance for employees."}],[{"kind":"item","id":"b8962.i01","label":"Counter-argument","prompt":"Select the better counter-argument to the claim that companies should allow their employees to work remotely.","options":[{"optionLabel":"a","textEn":"Working at home cuts down on commuting time and cost for employees."},{"optionLabel":"b","textEn":"Working at home can cause employees to work too many hours and feel isolated."}],"type":"choice/closed"},{"kind":" reference","title":"GRAMMAR FOR WRITING Ex 1","pages":[201]}],"materials":[],"coursePages":[[{"kind":"text","text":"Include:"},{"kind":"text","text":"- hedged language throughout"},{"kind":"text","text":"- a logical connector that links the concession with your claim"},{"kind":"text","text":"- a linking word to contrast the concession with the refutation"},{"kind":"item","id":"b8963.i01","label":"Concession","prompt":"Write a concession for the claim that companies should allow their employees to work remotely.","options":[],"type":"gap/open"},{"kind":"item","id":"b8963.i02","label":"Refutation","prompt":"Write a refutation that contrasts with your concession.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B05-RW-U08-publisher-sheet:b8962","title":"GRAMMAR FOR WRITING Ex 1 原题面","pages":[201],"text":"Claim: Companies should allow their employees to work remotely.\n\nCounter-argument:\n\na Working at home cuts down on commuting time and cost for employees.\nb Working at home can cause employees to work too many hours and feel isolated.\n\nRefutation:\n\na Employees should be willing to accept a reduced salary if they want to work at home.\nb Working remotely has been proven to increase work–life balance for employees.","screens":["Claim: Companies should allow their employees to work remotely.","Counter-argument:","a Working at home cuts down on commuting time and cost for employees.","b Working at home can cause employees to work too many hours and feel isolated.","Refutation:","a Employees should be willing to accept a reduced salary if they want to work at home.","b Working remotely has been proven to increase work–life balance for employees."],"sources":[{"page":201,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d30c7f4f51ec57f6da43d9086e3c3e78de5285892640f10d7b678cf2d6375dc2.png"}],"kind":"task_sheet","sourceBlockIds":["b8962"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Nowadays it is generally agreed that\ncompanies should allow their employees\nto work remotely. Some may argue that\nworking at home can cause employees to\nwork too many hours and feel isolated.\nHowever, there is evidence which shows\nthat working remotely actually increases\nwork-life balance for employees.\nACADEMIC WRITING\nSKILLS","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":63,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8964","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":35,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Work with a partner. Write the letter of the language feature in the box below (a–f) before the correct phrases and sentences in bold in the paragraph (1–6).","pages":[202],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7853f3be93aa6d05256a14e2e91191606a1e912c1d8b528cb1d9bd632cb48052.png"],"provided":"a claim\nb counter-argument\nc refutation\nd hedged language\ne logical connector that links concession with claim\nf linking word to contrast concession with refutation\n\n(1) ____ Teenagers generally need more sleep; therefore, the school day should start later for middle and high school students. According to one study, the earliest teenagers should be required to report for school is 8:30 am, which is approximately 30 minutes later than the current average start time. (2) ____\n\nThere is evidence that most adolescents do not get enough sleep. Starting later would increase the likelihood of sleeping 8–10 hours per night, which is the recommended duration for healthier sleep patterns. (3) ____ Although there are clear benefits, (4) ____ there is some concern that shifting the start time would be disruptive for schools and families.\n\nOpponents claim that if middle and high schools start later, the schedules for after-school activities and sports would have to be adjusted too. The schedules of working parents would also be impacted, especially single parents and parents with less workplace flexibility. (5) ____ Nevertheless, (6) ____ the benefits experienced by adolescent students who start their classes later are likely to outweigh the inconveniences. In one study that focused on final grades in a biology class, those who started their day an hour later slept 34 minutes more per night on average. Their final grades in the class were 4.5% higher than students who took the class earlier. For this reason, middle and high schools should consider beginning their school days later.","items":[{"id":"b8964.i01","label":"1","prompt":"Teenagers generally need more sleep; therefore, the school day should start later for middle and high school students.","options":["claim","counter-argument","refutation","hedged language","logical connector that links concession with claim","linking word to contrast concession with refutation"],"type":"choice/closed"},{"id":"b8964.i02","label":"2","prompt":"According to one study, the earliest teenagers should be required to report for school is 8:30 am, which is approximately 30 minute ool students. According to one study, the earliest teenagers should be required to report for school is 8:30 am, which is approximately 30 minutes later than the current average start time. (2) ____"},{"kind":"text","text":"There is evidence that most adolescents do not get enough sleep. Starting later would increase the likelihood of sleeping 8–10 hours per night, which is the recommended duration for healthier sleep patterns. (3) ____ Although there are clear benefits, (4) ____ there is some concern that shifting the start time would be disruptive for schools and families."}],[{"kind":"text","text":"Opponents claim that if middle and high schools start later, the schedules for after-school activities and sports would have to be adjusted too. The schedules of working parents would also be impacted, especially single parents and parents with less workplace flexibility. (5) ____ Nevertheless, (6) ____ the benefits experienced by adolescent students who start their classes later are likely to outweigh the inconveniences. In one study that focused on final grades in a biology class, those who started their day an hour later slept 34 minutes more per night on average. Their final grades in the class were 4.5% higher than students who took the class earlier. For this reason, middle and high schools should consider beginning their school days later."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"ambiguous-heading","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c7351 ies.\n\nOpponents claim that if middle and high schools start later, the schedules for after-school activities and sports would have to be adjusted too. The schedules of working parents would also be impacted, especially single parents and parents with less workplace flexibility. (5) ____ Nevertheless, (6) ____ the benefits experienced by adolescent students who start their classes later are likely to outweigh the inconveniences. In one study that focused on final grades in a biology class, those who started their day an hour later slept 34 minutes more per night on average. Their final grades in the class were 4.5% higher than students who took the class earlier. For this reason, middle and high schools should consider beginning their school days later.","screens":["a claim","b counter-argument","c refutation","d hedged language","e logical connector that links concession with claim","f linking word to contrast concession with refutation","(1) ____ Teenagers generally need more sleep; therefore, the school day should start later for middle and high school students. According to one study, the earliest teenagers should be required to report for school is 8:30 am, which is approximately 30 minutes later than the current average start time. (2) ____","There is evidence that most adolescents do not get enough sleep. Starting later would increase the likelihood of sleeping 8–10 hours per night, which is the recommended duration for healthier sleep patterns. (3) ____ Although there are clear benefits, (4) ____ there is some concern that shifting the start time would be disruptive for schools and families.","Opponents claim that if middle and high schools start later, the schedules for after-school activities and sports would have to be adjusted too. The schedules of working parents would also be impacted, especially single parents and parents with less workplace flexibility. (5) ____ Nevertheless, (6) ____ the benefits experienced by adolescent students who start their classes later are likely to outweigh the inconveniences. In one study that focused on final grades in a biology class, those who started their day an hour later slept 34 minutes more per night on average. Their final grades in the class were 4.5% higher than students who took the","class earlier. For this reason, middle and high schools should consider beginning their school days later."],"sources":[{"page":202,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7853f3be93aa6d05256a14e2e91191606a1e912c1d8b528cb1d9bd632cb48052.png"}],"kind":"task_sheet","sourceBlockIds":["b8964"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"counter-argument: Teenagers will graduate\nfrom high school soon. They will go to\nuniversity or college, or perhaps get a job.\nThat means they should get accustomed\nto waking up early while they are in\nhigh school.\nrefutation: Research has shown that adults\noften do not get enough sleep either. If\nmiddle and high school students develop\nhealthy sleep habits while they are young,\nmaybe that will carry over into adulthood\nand they will not suffer from lack of sleep\nas adults.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8968","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":37,"module":"WRITING TASK","ex":"1","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Work with a small group. Reread the description of Cybergogo on page 198. Discuss the three main issues the company has.","pages":[202],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7853f3be93aa6d05256a14e2e91191606a1e912c1d8b528cb1d9bd632cb48052.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-RW-U08-publisher-page:p198","title":"原题或核对备注所引第198页","pages":[198],"text":"","screens":[],"sources":[{"page":198,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c3c058b87febef6c4a3e471962819303e4e390619ecdc78cdca0d2abb82075bc.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"ambiguous-heading","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8969","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":38,"module":"WRITING TASK","ex":"2","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Use the issues you discussed in Exercise 1 to complete the table below. Each issue should be in a separate paragraph, beginning with a topic sentence that states the issue clearly. Each issue should be supported by evidence of why it is a problem. On your own, note down supporting details from Reading 1 and Reading 2 to support your topic sentences.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>body paragraph\u003c/td>\u003ctd>topic sentence\u003c/td>\u003ctd>evidence / why this is a problem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b8969.i01","label":"1","prompt":"","options":[],"type":"gap/open"},{"id":"b8969.i02","label":"2","prompt":"","options":[],"type":"gap/open"},{"id":"b8969.i03","label":"3","prompt":"","options":[],"type":"gap/open"},{"id":"b8969.i04","label":"4","prompt":"","options":[],"type":"gap/open"},{"id":"b8969.i05","label":"5","prompt":"","options":[],"type":"gap/open"},{"id":"b8969.i06","label":"6","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U08-question:b8968","kind":"student-work","title":"WRITING TASK Ex 1","pages":[202]}],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"body paragraph","header":false,"colspan":1,"rowspan":1},{"text":"topic sentence","header":false,"colspan":1,"rowspan":1},{"text":"evidence / why this is a problem","header":false,"colspan":1,"rowspan":1}],[{"text":"1","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"2","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"3","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"body\nparagraph\ntopic sentence evidence / why this is a problem\n1 Because the head of the company is assertive and\nopinionated, the employees may not feel comfortable\nvoicing their opinions.\nR2: For teamwork to be effective, each person should be\nencouraged to voice their opinion. They have to believe\nthat what they say is valuable to the overall team. This is\nknown as ‘psychological safety’.\n2 While each high-achieving employee appears to be very\ngood at what they do, the team may not be collaborating at\nthe highest capacity.\nR1: The performance of each individual member of a team\ndoes not guarantee the highest level of group intelligence.\nCollaboration requires constant coordination and task\ninterdependence.\n3 Teamwork is likely to suffer if there is no face-to-face\ncommunication.\nR2: Interaction style is important. Effective team members\nlook at each other when speaking and use enthusiastic\ngestures. This cannot happen when the team works\nremotely 100% of the time.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8970","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":39,"module":"WRITING TASK","ex":"3","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Work with a partner. Share the table you completed in Exercise 2 and discuss any possible counter-arguments to your claims.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-RW-U08-question:b8969","kind":"student-work","title":"WRITING TASK Ex 2","pages":[203]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Possible counter-argument to body\nparagraph 3: Evidence shows that working\nremotely leads to better work–life balance and\na healthier lifestyle overall. Remote workers\nsave time on their daily commute to the\noffice, leaving them with more time to relax\nand spend with family and friends. Working\nat home also allows the time and resources\nneeded to prepare and eat healthier snacks\nand meals throughout the day.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8971","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":40,"module":"WRITING TASK","ex":"4","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"List your recommendations. You should have at least one recommendation for each of the issues you have described. Share your recommendations with a partner and make sure they address each problem.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png"],"provided":"","items":[{"id":"b8971.i01","label":"Recommendation 1","prompt":"","options":[],"type":"gap/open"},{"id":"b8971.i02","label":"Recommendation 2","prompt":"","options":[],"type":"gap/open"},{"id":"b8971.i03","label":"Recommendation 3","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"• Encourage the head of the company\nto listen and act on the opinions of\nall employees.\n• Consider cross-training employees\nso that everyone is at least somewhat\nfamiliar with every other role each\nemployee performs. Designate days for\npeople to switch roles and ask for help\nfrom their colleagues when needed.\n• Create situations where there is more\nface-to-face interaction; for example,\nrequire an all-staff in-person meeting\nseveral times per year.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8972","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":41,"module":"WRITING TASK","ex":"5","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Make notes for your executive summary. State the problems you are trying to solve, the causes of the problems and one recommendation in very general terms (e.g. work on team-building).","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png"],"provided":"problem: ____\ncause: ____\nrecommendation: ____","items":[{"id":"b8972.i01","label":"problem","prompt":"problem: ____","options":[],"type":"gap/open"},{"id":"b8972.i02","label":"cause","prompt":"cause: ____","options":[],"type":"gap/open"},{"id":"b8972.i03","label":"recommendation","prompt":"recommendation: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8972.i01","label":"problem","prompt":"problem: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8972.i02","label":"cause","prompt":"cause: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b8972.i03","label":"recommendation","prompt":"recommendation: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"problem: The main issue at Cybergogo\nappears to be the lack of collaboration\namong all employees, beginning at the top.\ncause: There seem to be three main causes:\nthe employees may not feel that their\nopinions are valued, the employees may\nnot be working toward a common goal and\nthere is little to no face-to-face interaction.\nrecommendation: Provide opportunities for\nhigher levels of collaboration throughout\nthe company.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8973","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":42,"module":"WRITING TASK","ex":"6","context":{"moduleLabel":"WRITING TASK","phaseTitle":"PLAN"},"instruction":"Refer to the Task checklist on page 204 as you prepare your report.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Are the audience for your report and the purpose of your report clear to the reader?"},{"kind":"text","text":"Have you addressed the organization's goals?"},{"kind":"text","text":"Have you made a general claim about the organization's problem and what it needs to do?"},{"kind":"text","text":"Have you addressed the challenges that the organization faces?"},{"kind":"text","text":"Have you provided support for what you believe are the causes of these problems?"},{"kind":"text","text":"Have you acknowledged and countered any alternative points of view?"},{"kind":"text","text":"Have you made specific recommendations to the organization?"}],[{"kind":"text","text":"Have you used bullet points in your recommendations?"},{"kind":"text","text":"Does your report include an executive summary?"}]],"courseMaterials":[{"id":"B05-RW-U08-publisher-page:p204","title":"原题或核对备注所引第204页","pages":[204],"text":"","screens":[],"sources":[{"page":204,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c8eaaff78a9b044ddf84dc17df1e0cb2b0eacc7c49a3a91f7dae36abc373764.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8975","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":43,"module":"WRITING TASK","ex":"7","context":{"moduleLabel":"WRITING TASK","phaseTitle":"WRITE A FIRST DRAFT"},"instruction":"Write your report. Use your plan to help you structure your ideas. Write 450-500 words.","pages":[203],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png"],"provided":"","items":[{"id":"b8975.i01","label":"Report","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B05-RW-U08-question:b8969","kind":"student-work","title":"WRITING TASK Ex 2","pages":[203]},{"id":"B05-RW-U08-question:b8971","kind":"student-work","title":"WRITING TASK Ex 4","pages":[203]},{"id":"B05-RW-U08-question:b8972","kind":"student-work","title":"WRITING TASK Ex 5","pages":[203]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Executive Summary – Introduction:\nThis report is intended for the leadership\nteam at Cybergogo, and aims to address\nchallenges impacting collaboration\nand performance.\nOrganizational Goals: Cybergogo, a\nhigh-tech data analysis firm, seeks to\nenhance teamwork and successfully\nsecure a significant contract with a major\ninternational food service company.\nAddressing internal collaboration issues is\ncrucial to achieving these goals.\nProblem Statement: Cybergogo faces\na significant problem with collaboration\namong employees, driven by a decision-\nmaking approach that does not encourage\ninput from team members. This has led to\na lack of cohesion, contributing to previous\nfailures in contract bids.\nChallenges: The company must\ncontend with:\n• An assertive leadership style that\ndiscourages employee feedback.\n• A workforce that operates more\neffectively as individuals rather than as a\ncohesive team.\n• Minimal face-to-face interaction,\nhindering relationship-building and\ncommunication.\nCauses: The challenges can be attributed\nto three main factors: Employees may not\nfeel their opinions are valued, there is a lack\nof alignment on common goals and limited\nface-to-face interaction is preventing\neffective collaboration. Some may argue\nthat remote work enhances productivity\nand work-life balance. While this is true,\nit does not compensate for the essential\ninterpersonal interactions required for\nhigh-functioning teams.\nRecommendations: To improve\ncollaboration and position Cybergogo\nfor success, the following actions\nare recommended:\n• Create opportunities for higher levels of\ncollaboration across the company.\n• Encourage leadership to actively seek\nand incorporate employee feedback in\ndecision-making processes.\n• Implement cross-training programs\nto familiarize employees with each\nother’s roles, promoting sensitivity and\ncooperation.\n• Schedule regular all-staff meetings\nto strengthen team dynamics and\nfoster relationships.\nBy addressing these areas, Cybergogo can\ncreate a more collaborative environment,\nsignificantly improving the chances of\nsecuring the upcoming contract and\nenhancing overall performance.\nUNIT 9\nUNLOCK YOUR\nKNOWLEDGE\npage 207\n1 Language translation tools have got\na lot more accurate. In addition, the\ncameras in smartphones are always\nimproving and now they are incredibly\npowerful. Finally, artificial intelligence\nhas made some recent breakthroughs,\nfor example, with apps that can write\nentire articles on their own.\n2 A disadvantage of modern technology\nis how smartphones have changed\nthe way people communicate. For\nexample, it has become difficult to\nhave a simple phone conversation\nbecause some people prefer to text or\ndo video calls. In my opinion, it is easier\nto communicate on the phone than by\ntext message. Social media is another\ndisadvantage. It seems to be causing\nmore harm than good, especially for\nyoung people who may be influenced by\nthe perfect-looking lifestyles that some\nsocial media users curate.\n3 Teachers can use simple technology\nsuch as PowerPoint to provide\ninteresting visuals for students to look at\nduring a lecture. And students can use\ncomputers or tablets in the classroom\nto access digital libraries, tour museums\nvirtually or chat with students across the\nglobe to learn about different cultures.\n4 The modern technology I wouldn’t want\nto do without is the GPS navigation tool\non my smartphone. I love to travel but\nI am not very good at finding my way\naround new cities. My GPS navigation\ntool takes me almost anywhere I want to\ngo without any trouble at all.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41178fe5901c368909ff1df00f44ac1a7101c6d815250c6f0f2632e758d780fd.pdf","pdfPage":64,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a238d477ec9f20340cad7219211d90671895778d1d383bd575f37d4fbab2313.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[{"page":203,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eb579c5d3c1738188232d223b54dc12555d237b1c67ece19d0df61cd3158ea9e.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-RW-U08-question:b8977","book":5,"unit":8,"track":"RW","topic":"COLLABORATION","lesson":2,"order":44,"module":"WRITING TASK","ex":"8","context":{"moduleLabel":"WRITING TASK","phaseTitle":"REVISE"},"instruction":"Use the Task checklist to review your report for content and structure.","pages":[204],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c8eaaff78a9b044ddf84dc17df1e0cb2b0eacc7c49a3a91f7dae36abc373764.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>TASK CHECKLIST\u003c/td>\u003ctd
