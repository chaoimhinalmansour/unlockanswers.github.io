vironmentally-friendly\nat the moment. There is a lot of\npollution from vehicles and factories,\nbut the government is taking steps to\naddress this.\n3 There are some factories in parts of my\ncity which produce pollution. These\ncould be improved to become cleaner.\nCleaner types of energy, such as solar\npower, could be used more to power\nthings like street lights. People could\nbe better educated about how much\nenergy they use.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6258","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":1,"order":3,"module":"WATCH AND LISTEN","ex":"2","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"instruction":"You are going to watch a video about two cities. Before you watch, look at the photos from the video. Discuss the questions with your partner.","pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0ba94d6c2c99394696e9a0008b9db605d3267869d86c83c3fd01ccfeb07417d6.png"],"provided":"","items":[{"id":"b6258.i01","label":"1","prompt":"How can these things help a city, or people living in cities, become more environmentally-friendly?","options":[],"type":"discuss/open"},{"id":"b6258.i02","label":"2","prompt":"How easy would it be to add these things to an existing city?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6258.i01","label":"1","prompt":"How can these things help a city, or people living in cities, become more environmentally-friendly?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6258.i02","label":"2","prompt":"How easy would it be to add these things to an existing city?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The first photo shows an example\nof nature existing amongst modern\narchitecture. The building has been\ndesigned with trees in mind. This\ncontinues to provide some green\nspace, even in a very built-up area. It\nalso helps to keep an area cooler. The\nsecond shows someone using smart\ntechnology to control the temperature\nin their home. This allows people to\nsee exactly how much energy they\nuse and make changes if they want to\nuse less. The third and fourth photos\nshow renewable forms of energy (solar\nand wind) being used, which are often\ncleaner than forms of energy that burn\nfossil fuels.\n2 It would probably be difficult to add\nlarge things, like wind turbines, to\nexisting cities. However, solar panels\ncould be added to rooftops of existing\nbuildings. Trees could be planted\nin any existing spaces on roads or\nbetween buildings. Changing people’s\nhomes so that they are smart homes\nmight be expensive and would require\nhomeowners to spend money, which\nthey might not be keen or able to do.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":51,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":15,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"}]},"courseVisuals":[{"page":126,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0ba94d6c2c99394696e9a0008b9db605d3267869d86c83c3fd01ccfeb07417d6.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6262","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video about two cities. Take notes on the questions. Then discuss your answers with a partner.","pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0ba94d6c2c99394696e9a0008b9db605d3267869d86c83c3fd01ccfeb07417d6.png"],"provided":"","items":[{"id":"b6262.i01","label":"1","prompt":"Are the cities new or old?","options":[],"type":"discuss/open"},{"id":"b6262.i02","label":"2","prompt":"What form of energy do both cities use? How is it produced?","options":[],"type":"discuss/open"},{"id":"b6262.i03","label":"3","prompt":"In terms of energy use, what do the buildings in the two cities have in common?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6262.i01","label":"1","prompt":"Are the cities new or old?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6262.i02","label":"2","prompt":"What form of energy do both cities use? How is it produced?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6262.i03","label":"3","prompt":"In terms of energy use, what do the buildings in the two cities have in common?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/7261f9779b7910bf6f3bd463-L4LS-U06.mp4","captions":[{"start":0.78,"end":6.74,"text":"There are now many cities and towns around the world\nthat have been designed to be sustainable,"},{"start":7.3,"end":11.02,"text":"powered by environmentally friendly renewable energy\nsources."},{"start":12.72,"end":16.72,"text":"In the United Arab Emirates, close to the city of Abu\nDhabi,"},{"start":17.18,"end":25.18,"text":"Mastar city was created with the aim of becoming the\nworld's first zero -carbon, zero -waste, car -free\ncity."},{"start":26.14,"end":35.78,"text":"Solar panels can be found both on the roofs of its\nbuildings and covering an area of 220 ,000 square\nmeters just outside."},{"start":36.56,"end":38.82,"text":"These provide the majority of its energy."},{"start":40.78,"end":42.96,"text":"Construction began here in 2008."},{"start":43.8,"end":49.26,"text":"Its urban planning takes inspiration from the design\nprinciples of traditional Arab communities."},{"start":50.14,"end":55.92,"text":"Since there's little space between buildings, the\nstreets and paths are always protected from the sun."},{"start":56.74,"end":60.38,"text":"There's also a wind tower pulling down air from above,"},{"start":60.84,"end":66.08,"text":"which helps make Mastar city several degrees cooler\nthan in the desert that it lies within."},{"start":67.14,"end":76.68,"text":"All this helps to reduce the need for air conditioning\nand ensure the buildings consume at least 40 % less\nenergy than is standard in the construction industry."},{"start":78.8,"end":86.16,"text":"Another innovative development sits approximately eight\n,000 kilometers to the east of Mastar city."},{"start":86.9,"end":90.98,"text":"92 % of Japan's population lives in urban areas,"},{"start":91.62,"end":94.97999999999999,"text":"one of which is Fujisawa Smart Sustainable Town."},{"start":96.56,"end":97.82,"text":"Like Mastar city,"},{"start":98.4,"end":104.88,"text":"Fujisawa Smart Town was designed to produce and to rely\nentirely on its own energy supply."},{"start":106.06,"end":109.78,"text":"In 2012, the first residents moved in."},{"start":110.16,"end":115.38,"text":"Every single home is equipped with solar panels and\nsmart monitoring systems."},{"start":116.74000000000001,"end":119.86,"text":"Residents track their energy consumption not only at\nhome,"},{"start":120.28,"end":122.56,"text":"but also on a community -wide level."},{"start":123.84,"end":127.46,"text":"The apps they use to do this not only display their\nenergy use,"},{"start":127.96,"end":131.22,"text":"but also suggest ways they might be able to reduce it."},{"start":132.94,"end":143.02,"text":"Fujisawa's residents say that seeing the exact amount\nof energy they consume has a big impact and encourages\nthem to waste as little energy as possible."},{"start":144.12,"end":145.84,"text":"As we move into the future,"},{"start":146.38,"end":150.72,"text":"we can be hopeful that more and more towns and cities\nwill be smart,"},{"start":151.14,"end":152.6,"text":"sustainable, and self -sufficient,"},{"start":152.98,"end":155.12,"text":"producing all the clean energy they need."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 They are both new. Construction began\nin Masdar City in 2008. People moved\ninto Fujisawa in 2012.\n2 They use renewable solar energy. It is\nproduced by using solar panels, which\nare installed on the roofs of buildings\nand people’s homes.\n3 They are designed to be self-sufficient\nand use as little energy as poss 735105a953f4d8574afdae6c989e097094dd043/content/3762f70d010f0183686036516b260a6a6e8d70c7e2dace5f29f67ca8c1e8f68b.png"],"provided":"1 Do you think more people should move out of big cities and live in places like El Hierro?\n2 Do you think it's good to rely on renewable sources of energy, such as the wind, the sun and the sea?\n\nExample conversation:\nQ: Do you think more people should move out of big cities and live in places like El Hierro?\nA: Well, I've never lived on an island before. I've only lived in big cities. The city I live in now is really big.\nQ: So, you haven't lived on an island before. Do you think you'd like to in the future?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Do you think more people should move out of big cities and live in places like El Hierro?"},{"kind":"text","text":"2 Do you think it's good to rely on renewable sources of energy, such as the wind, the sun and the sea?"},{"kind":"text","text":"Example conversation:"},{"kind":"text","text":"Q: Do you think more people should move out of big cities and live in places like El Hierro?"},{"kind":"text","text":"A: Well, I've never lived on an island before. I've only lived in big cities. The city I live in now is really big."},{"kind":"text","text":"Q: So, you haven't lived on an island before. Do you think you'd like to in the future?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 A: Do you think more people should\nmove out of big cities and live in places\nlike El Hierro?\nB: Yes, I’d love to live somewhere like\nthat. I went to an island once on holiday\nand I had a really nice time there. It\nwas good to be by the sea, far from the\nstress of city life.\nA: So you enjoyed being by the sea. Do\nyou think it would be a good idea for\nmore people to live on remote islands?\n2 A: Do you think it’s good to rely on\nrenewable sources of energy, such as the\nwind, the sun and the sea?\nB: I think it’s great that people are\nmoving away from using fossil fuels, as\nthese aren’t sustainable and cause lot of\npollution.\nA: Yes, it’s undeniable that our use of\nfossil fuels can’t continue. But are energy\nsources like solar and wind power\nthe answer?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6286","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":1,"order":18,"module":"LISTENING 1","ex":"11","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"instruction":"6.4 Listen to the same question spoken with four different emotions. Then practise saying them with a partner.","pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/586022e42f7efbef935244b875404dc77e88cfa6c2170e3e7305ecd7de4223fd.png"],"provided":"You don't like it here, then?\n1 bored\n2 sarcastic\n3 surprised\n4 encouraging","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"You don't like it here, then?"},{"kind":"text","text":"1 bored"},{"kind":"text","text":"2 sarcastic"},{"kind":"text","text":"3 surprised"},{"kind":"t ould they be avoided?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Is your country, or any part of your country, energy independent? Do you think it could ever be?"},{"kind":"text","text":"2 What problem does Sofia Martinez mention on El Hierro? What other problems can you imagine, and how could they be avoided?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 My country is a long way from being\nenergy independent. We get some\nof our energy from the wind, but only\nabout 15%. We produce some of our\nown natural gas, but we import another\n60% of it from other countries. The\nonly way for my country to become\ntotally independent would be if the\ngovernment invested a lot more money\nin different forms of energy, whether\nthat’s nuclear energy or using the\npower of the waves. / The northern part\nof my country is energy independent\nbecause it’s very hot and windy, so\nthere are wind and solar farms to\ngenerate electricity for the towns and\ncities there. However, the southern part\nof the country is cooler and flatter, so\nhas to rely on electricity generated by\nburning fossil fuels. I don’t think this\npart of the country can ever be energy\nindependent.\n2 In the interview, Sofia mentions that the\ndesalination plan isn’t working properly.\nThat means that parts have to be\nimported from the mainland, which takes\ntime, and people need to be careful\nabout how much water they use. Other\nproblems could include the possibility\nof the water pumps breaking, or there\nbeing no wind, or not enough wind, for\nan extremely long time.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6291","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":1,"order":22,"module":"LISTENING 1","ex":"15","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Read what Sofia Martinez says below. Imagine you have the job of writing a 150-word announcement to the people of El Hierro.","pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/586022e42f7efbef935244b875404dc77e88cfa6c2170e3e7305ecd7de4223fd.png"],"provided":"A machine at the plant isn't working properly and the replacement parts haven't arrived yet. If they don't come soon, we may have to ask people to use less water for a few days.\n- Explain the situation.\n- Advise people to use less water, and explain how they can do this.\n- Tell people why it is important that they save water.\n- Make it clear when the situation will end, so people don't start worrying.\nIn recent days, we have become aware of a problem with one of the machines in our desalination plant. We are working quickly to replace the faulty parts and have good supplies of fresh water in our reservoir. However, ...","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"A machine at the plant isn't working properly and the replacement parts haven't arrived yet. If they don't come soon, we may have to ask people to use less water for a few days."},{"kind":"text","text":"- Explain the situation."},{"kind":"text","text":"- Advise people to use less water, and explain how they can do this."},{"kind":"text","text":"- Tell people why it is important that they save water."},{"kind":"text","text":"- Make it clear when the situation will end, so people don't start worrying."}],[{"kind":"text","text":"In recent days, we have become aware of a problem with one of the machines in our desalination plant. We are working quickly to replace the faulty parts and have good supplies of fresh water in our reservoir. However, ..."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"We have become aware of a problem with\na machine in our desalination plant. We\nare working quickly to replace the faulty\nparts and have good supplies of fresh\nwater in our reservoir. However, until the\nreplacement parts arrive, we will have to be\nmore careful about how much water\nwe use.\nUntil further announcement, please aim to\nuse less water than usual. This may mean\nshowering instead of taking a bath, having\nshorter showers, and not watering your\ngarden. It is important that everyone on the\nisland has the water they need for drinking,\nwashing and cooking, which is why we are\nasking everyone to do this.\nThis situation is not expected to last\nmore than four days, as we expect the\nreplacement parts to arrive and be\ninstalled by the end of the week. Until\nthen, we would like to thank you for your\nunderstanding and cooperation.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6294","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Discuss the kind of transition word or phrase (a–c) that needs to go in the gaps in the sentences below.","pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bd28d198cad12576cebaff970f662744641fe5b96e1c237bca25ca08e1debcac.png"],"provided":"a introducing a result\nb giving extra information\nc comparing and contrasting","items":[{"id":"b6294.i01","label":"1","prompt":"In the city, everybody hurries everywhere. You are surrounded by traffic, and you never feel like you can really relax. ____, my career was in banking, which is a particularly stressful job.","options":["introducing a result","giving extra information","comparing and contrasting"],"type":"choice/closed"},{"id":"b6294.i02","label":"2","prompt":"Living on an island must be a wonderful experience. ____, it could be tough at times if the island is a remote one.","options":["introducing a result","giving extra information","comparing and contrasting"],"type":"choice/closed"},{"id":"b6294.i03","label":"3","prompt":"The problem is that the wind doesn't blow all the time, ____ the power source isn't consistent.","options":["introducing a result","giving extra information","comparing and contrasting"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text"  write the correct form next to the definitions.","pages":[136],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7c8a2dd1a95ae858006b687f94e378a2e14cf9fdabb8e5f2934ca34519b45afe.png"],"provided":"With the steady decline in supplies of coal and oil, exploring the potential of alternative energy sources has increased in recent decades. Implementing an alternative-energy generation system to power an entire town is a huge challenge. A single energy source, such as solar or wind power, rarely has the capacity to do this. Engineers and designers therefore need to establish effective ways of providing a consistent power supply from a variety of sources. Each element of the system must take advantage of a natural resource when it is available. Wind turbines need sufficient wind to produce electricity, so when the wind slows or stops, another part of the system needs to be able to perform the same task.","items":[{"id":"b6304.i01","label":"1","prompt":"____ (n) the production of energy in a particular form","options":[],"type":"discuss/closed"},{"id":"b6304.i02","label":"2","prompt":"____ (v) to do something useful, important or difficult","options":[],"type":"discuss/closed"},{"id":"b6304.i03","label":"3","prompt":"____ (v) to start a system that is intended to last a long time","options":[],"type":"discuss/closed"},{"id":"b6304.i04","label":"4","prompt":"____ (n) the origin or place something comes from","options":[],"type":"discuss/closed"},{"id":"b6304.i05","label":"5","prompt":"____ (n) something requiring great effort to do successfully","options":[],"type":"discuss/closed"},{"id":"b6304.i06","label":"6","prompt":"____ (adj) as much as is needed for a particular purpose","options":[],"type":"discuss/closed"},{"id":"b6304.i07","label":"7","prompt":"____ (v) to make changes that somebody has officially decided should happen","options":[],"type":"discuss/closed"},{"id":"b6304.i0 ces":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6309.i01","label":"1","prompt":"The easiest and best way to reduce energy ____ in offices is to stop using air conditioning.","options":[],"type":"gap/open","answer":{"label":"1","mode":"gap","answer":"consumption"}},{"kind":"item","id":"b6309.i02","label":"2","prompt":"The number-one reason why offices aren't environmentally-friendly is because of the ____ of paper they use and throw away. Imagine how many trees are used for all that paper!","options":[],"type":"gap/open","answer":{"label":"2","mode":"gap","answer":"volume"}},{"kind":"item","id":"b6309.i03","label":"3","prompt":"The main ____ of an office is to provide a pleasant environment for people to work in. That's why they should be as comfortable as possible.","options":[],"type":"gap/open","answer":{"label":"3","mode":"gap","answer":"function"}},{"kind":"item","id":"b6309.i04","label":"4","prompt":"There are obvious ____ on how many hours a day people can work. So, there is absolutely no reason to keep office lights on all night.","options":[],"type":"gap/open","answer":{"label":"4","mode":"gap","answer":"limitations"}}],[{"kind":"item","id":"b6309.i05","label":"5","prompt":"One of the ____ of working in an office is the lack of privacy. Each worker should be given their own private space.","options":[],"type":"gap/open","answer":{"label":"5","mode":"gap","answer":"drawbacks"}},{"kind":"item","id":"b6309.i06","label":"6","prompt":"A good way to make offices more energy-____ is to ask employees to work from home, using their own computers, electricity and internet connections.","options":[],"type":"gap/open","answer":{"label":"6","mode":"gap","answer":"efficient"}},{"kind":"item","id":"b6309.i07","label":"7","prompt":"Companies should spend money on the ____ costs of an office building (making sure it's safe, etc.), but relatively little on making it look attractive or comfortable.","options":[],"type":"gap/open","answer":{"label":"7","mode":"gap","answer":"maintenance"}},{"kind":"item","id":"b6309.i08","label":"8","prompt":"Workers appreciate ____ designs or ideas in offices, such as sofas, relaxation areas, games rooms, etc.","options":[],"type":"gap/open","answer":{"label":"8","mode":"gap","answer":"experimental"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 consumption 2 volume 3 function 4 limitations\n5 drawbacks 6 efficient 7 maintenance\n8 experimental","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6310","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":32,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Say which opinions in Exercise 2 you agree with. Give reasons why you don't agree with the other opinions.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/423253b077eaa85a12d5a12db2b4ccf40b88e983ed570a4a51e9ef113ba5fd20.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U06-question:b6309","kind":"material-reference","title":"LISTENING 2 Ex 2","pages":[137]}],"materials":[],"coursePages":[[{"kind":"text","text":"The easiest and best way to reduce energy ____ in offices is to stop using air conditioning."},{"kind":"text","text":"The number-one reason why offices aren't environmentally-friendly is because of the ____ of paper they use and throw away. Imagine how many trees are used for all that paper!"},{"kind":"text","text":"The main ____ of an office is to provide a pleasant environment for people to work in. That's why they should be as comfortable as possible."},{"kind":"text","text":"There are obvious ____ on how many hours a day people can work. So, there is absolutely no reason to keep office lights on all night."},{"kind":"text","text":"One of the ____ of working in an office is the lack of privacy. Each worker should be given their own private space."}],[{"kind":"text","text":"A good way to make offices more energy-____ is to ask employees to work from home, using their own computers, electricity and internet connections."},{"kind":"text","text":"Companies should spend money on the ____ costs of an office building (making sure it's safe, etc.), but relatively little on making it look attractive or comfortable."},{"kind":"text","text":"Workers appreciate ____ designs or ideas in offices, such as sofas, relaxation areas, games rooms, etc."}]],"courseMaterials":[{"id":"B04-LS-U06-publisher-sheet:b6309","title":"LISTENING 2 Ex 2 原题面","pages":[137],"text":"","screens":[],"sources":[{"page":137,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/423253b077eaa85a12d5a12db2b4ccf40b88e983ed570a4a51e9ef113ba5fd20.png"}],"kind":"task_sheet","sourceBlockIds":["b6309"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I disagree. Air conditioning keeps\npeople cool (or warm) and helps them\nto work comfortably. People need to be\ncomfortable in order to be productive.\nThe best way to reduce energy\nconsumption is to use modern, efficient\ndevices which use less energy.\n2 I’m not sure this is as true as it used to\nbe. Most companies use electronic files\nrather than pieces of paper nowadays,\nand I’m sure that most of the paper that\nis used is recycled.\n3 I would argue that the main function of\nan office is to provide a productive\nand safe place for people to do their\njobs in.\n4 The main reason office buildings keep\ntheir lights on is because there are at\nleast a few people continuing to work\nin them (e.g. security guards, cleaners,\nmaintenance staff). Also, if tall buildings\ndidn’t keep their lights on, they might\nbe dangerous to aircraft.\n5 This might seem like a good idea, but\nit would mean most people would be\ngiven tiny, cage-like offices to work in.\nThis might end up making people feel\nmore depressed and disconnected from\ntheir colleagues.\n6 It’s likely that workers would feel very\nangry if they had to pay additional\nbills just in order to work. Many might\nnot be happy to continue working for\nthe company.\n7 The best offices are those which\nare not only safe and clean, but\nwhich provide a pleasant working\nenvironment that people enjoy coming\nto each day.\n8 Some workers might appreciate this,\nbut the majority just want to come\nto work, do their job and then go\nhome again. They don’t need or want\nto feel like they are in some kind of\nleisure centre.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6315","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":33,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"6.7 b55.png"],"provided":"Work with a partner. Do you think the proposed solutions in Exercise 4 are good ones? Why / Why not?","items":[],"layout":"list","references":[{"id":"B04-LS-U06-question:b6315","kind":"student-work","title":"LISTENING 2 Ex 4","pages":[138]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I think the smaller-scale ideas are good,\nbecause they could be easily implemented.\nThe larger-scale ideas would take a long\ntime to implement and would probably\ncost a lot of money, so it would take a\nlong time for any savings to be realized.\n/ I think the large-scale ideas are great\nand very ambitious. In the long term, they\ncould save a lot of money. The smaller-\nscale ideas are interesting, but probably\nwouldn’t save a huge amount of money.\nAlso, they would depend on individual\nemployees remembering to do things like\nswitching off their screens, and staff might\nbe uncomfortable because of the lack of\nair conditioning.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":16,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:native-B4-LS-U6-p138-ex6","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":35,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"6.7 Listen again. Make notes in the table below about the benefits and the drawbacks of the ideas they discuss.","pages":[138],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1886ef1866d89ae909a80938b13b1a3713941eef74190f6d09fc000dcc2ffb55.png"],"provided":"\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>benefits\u003c/th>\u003cth>drawbacks\u003c/th>\u003c/tr>\u003ctr>\u003ctd>installing solar panels on the roof / creating a solar energy system for heating water\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>changing to low-energy lightbulbs\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>turning off computer screens when not at a desk\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"","header":true,"colspan":1,"rowspan":1},{"text":"benefits","header":true,"colspan":1,"rowspan":1},{"text":"drawbacks","header":true,"colspan":1,"rowspan":1}],[{"text":"installing solar panels on the roof / creating a solar energy system for heating water","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"changing to low-energy lightbulbs","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"turning off computer screens when not at a desk","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.7","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b33cba188ce62a2c0b63904420aaf2f8d14caf87f0859cd5ade4eeb7456a9b92.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"benefits drawbacks\ninstalling solar panels\non the roof / creating\na solar energy system\nfor heating water\nLow operating cost once installed\nEnvironmentally friendly way to\ngenerate electricity\nGood publicity – could market the\ncompany as a green business\nExpensive to buy and install, doesn’t produce a lot of power – will end\nup costing rather than saving money in the first few years\nTechnically complex and expensive to install\nWould need to pay for an engineer in case of repairs\nTechnical limitations of what could be installed on the roof\nLocal government may not allow it – may need permission\nchanging to low-\nenergy lightbulbs\nNot expensive to install; pay for\nthemselves quickly\nCost of the bulbs is expensive\nturning off computer\nscreens when not at\na desk\nThis would cost nothing\nto implement\nThis would rely on staff remembering what to do","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6318","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":36,"module  company wouldn't do anything unsafe or illegal.","options":["challenging a point","asking a question","reassuring","adding information","expressing reservations"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 b 2 d 3 a 4 e 5 c","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6320","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":37,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Take turns making the points below, using the persuasive technique in brackets. When you listen to your partner, do they sound persuasive and confident?","pages":[140],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6105d3ef2ccab5fd48c6a1f9017021bf02d1aa7f105849c5db34f654cefc36f.png"],"provided":"1 You think your company should save money. One way is by asking employees to switch off all the lights when they leave a room. (Make your point and add information.)\nI don't think it's fair to ask our employees to be responsible for saving energy. Perhaps we can install automatic lights that switch off if there is nobody in a room. You also have to understand that employees already work hard enough. Giving them extra tasks could annoy them.\n2 You want to put forward your idea of getting employees to switch off their monitors and computers when they're not using them. (Ask a question.)\n3 Respond to your partner's idea about getting employees to switch off their monitors and computers when they're not using them. (Challenge their point.)\n4 You think installing solar panels is a good idea. You are not worried about the lack of sunshine in your city. (Be reassuring.)\n5 You also think installing solar panels is worth thinking about. You are concerned about the lack of sunshine in winter. (Express reservations.)","items":[{"id":"b6320.i01","label":"1","prompt":"You think your company should save money. One way is by asking employees to switch off all the lights when they leave a room. (Make your point and add information.)","options":[],"type":"discuss/open"},{"id":"b6320.i02","label":"2","prompt":"You want to put forward your idea of getting employees to switch off their monitors and computers when they're not using them. (Ask a question.)","options":[],"type":"discuss/open"},{"id":"b6320.i03","label":"3","prompt":"Respond to your partner's idea about getting employees to switch off their monitors and computers when they're not using them. (Challenge their point.)","options":[],"type":"discuss/open"},{"id":"b6320.i04","label":"4","prompt":"You think installing solar panels is a good idea. You are not worried about the lack of sunshine in your city. (Be reassuring.)","options":[],"type":"discuss/open"},{"id":"b6320.i05","label":"5","prompt":"You also think installing solar panels is worth thinking about. You are concerned about the lack of sunshine in winter. (Express reservations.)","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 You think your company should save money. One way is by asking employees to switch off all the lights when they leave a room. (Make your point and add information.)"},{"kind":"text","text":"I don't think it's fair to ask our employees to be responsible for saving energy. Perhaps we can install automatic lights that switch off if there is nobody in a room. You also have to understand that employees already work hard enough. Giving them extra tasks could annoy them."},{"kind":"text","text":"2 You want to put forward your idea of getting employees to switch off their monitors and computers when they're not using them. (Ask a question.)"},{"kind":"text","text":"3 Respond to your partner's idea about getting employees to switch off their monitors and computers when they're not using them. (Challenge their point.)"}],[{"kind":"text","text":"4 You think installing solar panels is a good idea. You are not worried about the lack of sunshine in your city. (Be reassuring.)"},{"kind":"text","text":"5 You also think installing solar panels is worth thinking about. You are concerned about the lack of sunshine in winter. (Express reservations.)"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 Have you thought about the idea of\ngetting employees to switch off their\nmonitors and computers when they’re\nnot using them?\n3 I see what you mean, but consider the\nfact that most people would forget,\nunless they are strictly told they can’t\nleave their computers or screens on. I\ndon’t think we want to create that kind\nof atmosphere in the office.\n4 Solar panels are a great idea. But I\ndon’t think we need to worry about a\nlack of sunshine in this city. I’m sure\nthat modern solar panels can generate\nelectricity even on cloudy days.\n5 I also believe that solar panels can be very\neffective. However, I’m not convinced that\nwe get enough sunshine here in the winter\nto make a solar-power system effective.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6322","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":38,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use your notes from Listening 1 and Listening 2 to discuss the following questions.","pages":[140],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d6105d3ef2ccab5fd48c6a1f9017021bf02d1aa7f105849c5db34f654cefc36f.png"],"provided":"","items":[{"id":"b6322.i01","label":"1","prompt":"Small changes such as switching off lights and screens are an easy way to save energy, but rely on others to be effective. How could you implement this in an office?","options":[],"type":"discuss/open"},{"id":"b6322.i02","label":"2","prompt":"Would it be possible to make your town, city or home more energy efficient, like El Hierro or the office you heard about in Listening 2? If so, what ideas would be appropriate? If not, why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U06-question:b6315","kind":"student-work","title":"LISTENING 2 Ex 4","pages":[138]},{"id":"B04-LS-U06-question:b6276","kind":"student-work","title":"LISTENING 1 Ex 6","pages":[130]},{"id":"B04-LS-U06-question:b6277","kind":"student-work","title":"LISTENING 1 Ex 7","pages":[130]},{"id":"B04-LS-U06-question:native-B4-LS-U6-p138-ex6","kind":"student-work","title":"LISTENING 2 Ex 6","pages":[138]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6322.i01","label":"1","prompt":"Small changes such as switching off lights and screens are an easy way to save energy, but rely on others to be effective. How could you implement this in an office?","options":[],"type":"discuss/open"},{"kind":"item","id":"b6322.i02","label":"2","prompt":"Would it be possible to make your town, city or home more energy efficient, like El Hierro or the office you heard about in Listening 2? If so, what ideas would be appropriate? If not, why not?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 By making employees feel that\nthey are all part of a responsible,\nenvironmentally-friendly company;\nby rewarding employees by using\nany money saved to buy better office\nequipment or even increase salaries.\n2 I live in a city, where it would be a very\ngood idea to make sure more office\nbuildings are sustainable. Perhaps\nthere could be laws which say that any\nnew buildings need to be as energy-\nindependent as possible. Or local\ngovernments could give companies\nor even homes some money to install\nthings like solar panels. / I live in a small\ntown which could make small steps to\nbecoming energy-independent. We\nhave hills and a river here, and perhaps\nwe could introduce a similar system to\nthe one used in El Hierro.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":53,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"c rseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6333","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":45,"module":"PREPARATION FOR SPEAKING","ex":"3","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"DISCUSSION"},"instruction":"6.8 Listen and complete the gaps with the words you hear. Then work with a partner and practise saying the conversation.","pages":[142],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/355c1d9a3c2ca12a38050854727245f3f452f1e123bbe9ad155dc90fe04e611d.png"],"provided":"A: (1) ____: we agree that we want to reduce energy consumption, and we want to consider an alternative energy source. (2) ____ about a solar energy system?\nB: I'm more concerned about our water usage.\nA: (3) ____ discussing right now.","items":[{"id":"b6333.i01","label":"(1)","prompt":"A: (1) ____: we agree that we want to reduce energy consumption, and we want to consider an alternative energy source.","options":[],"type":"gap/closed"},{"id":"b6333.i02","label":"(2)","prompt":"(2) ____ about a solar energy system?","options":[],"type":"gap/closed"},{"id":"b6333.i03","label":"(3)","prompt":"A: (3) ____ discussing right now.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"A: (1) ____: we agree that we want to reduce energy consumption, and we want to consider an alternative energy source. (2) ____ about a solar energy system?"},{"kind":"text","text":"B: I'm more concerned about our water usage."},{"kind":"text","text":"A: (3) ____ discussing right now."}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 6.8","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94555f46f04a6c69fa07a540ff3e16ff921df8e0290a414be8e35acfff9a9437.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 To summarize the key points\n2 Does anyone have anything to say\n3 Sorry, but that’s not really what we’re","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":55,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6337","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":46,"module":"PREPARATION FOR SPEAKING","ex":"4","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Take turns talking about the topics below (1–4). After a while, somebody should interrupt you. Deal with the interruption using a polite phrase from the Skills box.","pages":[143],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/669213b7507738e8591442e3e463f280e59f07d1e63230240f6e34477779a2a5.png"],"provided":"1 how much electricity you think you use each day\n2 your opinion of electric cars\n3 your opinion or experience of working in an office\n4 what forms of energy we will use in 20 years' time","items":[{"id":"b6337.i01","label":"1","prompt":"how much electricity you think you use each day","options":[],"type":"discuss/open"},{"id":"b6337.i02","label":"2","prompt":"your opinion of electric cars","options":[],"type":"discuss/open"},{"id":"b6337.i03","label":"3","prompt":"your opinion or experience of working in an office","options":[],"type":"discuss/open"},{"id":"b6337.i04","label":"4","prompt":"what forms of energy we will use in 20 years' time","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 how much electricity you think you use each day"},{"kind":"text","text":"2 your opinion of electric cars"},{"kind":"text","text":"3 your opinion or experience of working in an office"},{"kind":"text","text":"4 what forms of energy we will use in 20 years' time"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1\nA: I think I use a lot of electricity each day\nbecause I have lots of devices which I need\nto charge, such as my phone, my tablet, my\nlaptop. But the thing that I …\nB: What about air conditioning? You’re\nalways complaining that it’s too hot.\nA: Yes, I was just getting to that. I probably\nuse it far more than I really need to and\nit does use up a lot of electricity. And the\nother thing, of course, …\n2\nA: I don’t think electric cars are as great as\nmost people think they are, because …\nB: But you have an electric car!\nC: Sorry, but would you mind waiting until\nEsma has finished?\n3\nA: I’ve spent a lot of time in offices, and I\nthink the biggest advantage is that it makes\nit possible for colleagues to work together,\nall in the same space. This is far better\nthan …\nB: Don’t you think there are any drawbacks?\nA: Excuse me, but I’d just like to finish\nthis point.\n4\nA: I’d like to think that we’ll be using\ncleaner forms of energy in 20 years’ time.\nThe main reason for this is that  …\nB: What do you mean by ‘cleaner’? Because\n‘cleaner’ doesn’t always mean ‘better’.\nA: Could you please wait until I’ve finished\nspeaking?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":55,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6341","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":47,"module":"PREPARATION FOR SPEAKING","ex":"5","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"6.9 Listen to the sentences. How does the speaker sound? Write A (argumentative) or N (neutral).","pages":[143],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/669213b7507738e8591442e3e463f280e59f07d1e63230240f6e34477779a2a5.png"],"provided":"","items":[{"id":"b6341.i01","label":"1","prompt":"Sorry, but could you hold that thought until Abdul has finished, please?","options":["A (argumentative)","N (neutral)"],"type":"choice/closed"},{"id":"b6341.i02","label":"2","prompt":"Sorry, but could you hold that thought until Abdul has finished, please?","options":["A (argumentative)","N (neutral)"],"type":"choice/closed"},{"id":"b6341.i03","label":"3","prompt":"So are you saying you're against using solar power?","options":["A (argumentative)","N (neutral)"],"type":"choice/closed"},{"id":"b6341.i04","label":"4","prompt":"Could I just clarify something here? Are we talking about solar power or wind power?","options":["A (argumentative)","N (neutral)"],"type":"choice/closed"},{"id":"b6341.i05","label":"5","prompt":"Do you mean this is completely new technology?","options":["A (argumentative)","N (neutral)"],"type":"choice/closed"},{"id":"b6341.i06","label":"6","prompt":"Could I just clarify something here? Could we even use a solar power system on the roof of the building?","options":["A (argumentative)","N (neutral)"],"type":"choice/closed"}],"layout":"list", c":"ENERGY","lesson":2,"order":48,"module":"PREPARATION FOR SPEAKING","ex":"6","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"Work with a partner. Take turns saying the sentences in Exercise 5. Try to use a neutral tone. Does your partner agree that you sound neutral?","pages":[143],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/669213b7507738e8591442e3e463f280e59f07d1e63230240f6e34477779a2a5.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U06-question:b6341","kind":"student-work","title":"PREPARATION FOR SPEAKING Ex 5","pages":[143]}],"materials":[],"coursePages":[[{"kind":"text","text":"Sorry, but could you hold that thought until Abdul has finished, please?"},{"kind":"text","text":"So are you saying you're against using solar power?"},{"kind":"text","text":"Could I just clarify something here? Are we talking about solar power or wind power?"},{"kind":"text","text":"Do you mean this is completely new technology?"},{"kind":"text","text":"Could I just clarify something here? Could we even use a solar power system on the roof of the building?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6346","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":49,"module":"SPEAKING TASK","ex":"1","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"In your group, quickly summarize the main problems with energy consumption in your place of work/study. Review the table in the Critical thinking section, Exercise 3 on page 141.","pages":[144],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8b597d45c647541e4b93104a91823f392bb6607bedf7ff70547c7626ae12347.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U06-question:b6326","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[141]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U06-publisher-page:p141","title":"原题或核对备注所引第141页","pages":[141],"text":"","screens":[],"sources":[{"page":141,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/343ab7f96494c139bb1ef7b4685ccc32a45f24648508f2aca9660a1583f07312.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A: We really need to address the heating\nand air conditioning. It’s running even when\nrooms are empty.\nB: Yes, and don’t forget how much energy\nis wasted with computers and equipment\nleft on standby overnight.\nC: Plus, our building’s insulation is terrible.\nWe’re losing heat in the winter and\noverheating in summer, which isn’t helping.\nA: Agreed, fixing those three things would\nmake a big difference in cutting energy use.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":55,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6347","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":50,"module":"SPEAKING TASK","ex":"2","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Each member of the group picks two or three ideas to raise in the discussion. Work on your own and make notes on the techniques you can use to put forward an opinion or suggestion. Refer to the Skills box on page 139.","pages":[144],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8b597d45c647541e4b93104a91823f392bb6607bedf7ff70547c7626ae12347.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U06-publisher-page:p139","title":"原题或核对备注所引第139页","pages":[139],"text":"","screens":[],"sources":[{"page":139,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/df1a48c20b48ca55558bc96b244d8e940b571ef8bc2b07b6b3a17f34f87f358e.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Lights are left on in the office. We should\nencourage employees to switch them off\nwhen they aren’t using them.\n• Challenging a point: The fact is that\nmost of our energy consumption does\nnot come from using lights.\n• Asking a question: If we really want\nto save energy, why don’t we ask\nemployees to switch lights off when they\nleave the office?\n• Reassuring: I can assure you that this\nwould save us a huge amount of money.\n• Adding information: I don’t think it’s fair\nto ask our employees to be responsible\nfor how we can save energy. Perhaps we\ncan install automatic lights that switch\noff if there is no one in a room. You also\nhave to understand that employees\nalready work hard enough. Giving them\nextra tasks could annoy them.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":55,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":17,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U06-question:b6348","book":4,"unit":6,"track":"LS","topic":"ENERGY","lesson":2,"order":51,"module":"SPEAKING TASK","ex":"3","context":{"moduleLabel":"SPEAKING TASK","phaseTitle":"PREPARE"},"instruction":"Decide who is going to be the chair. This person should make notes on language to use for asking for input, summarizing and keeping the discussion moving. Everybody else should make notes on language for dealing with interruptions.","pages":[144],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8b597d45c647541e4b93104a91823f392bb6607bedf7ff70547c7626ae12347.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U06-publisher-sheet:b6347","title":"SPEAKING TASK Ex 2 原题面","pages":[144],"text":"","screens":[],"sources":[{"page":144,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e8b597d45c647541e4b93104a91823f392bb6607bedf7ff70547c7626ae12347.png"}],"kind":"task_sheet","sourceBlockIds":["b6347"]}],"courseMedia":[],"courseAnswer":{"kind":"grou "start":56.74,"end":60.38,"text":"There's also a wind tower pulling down air from above,"},{"start":60.84,"end":66.08,"text":"which helps make Mastar city several degrees cooler\nthan in the desert that it lies within."},{"start":67.14,"end":76.68,"text":"All this helps to reduce the need for air conditioning\nand ensure the buildings consume at least 40 % less\nenergy than is standard in the construction industry."},{"start":78.8,"end":86.16,"text":"Another innovative development sits approximately eight\n,000 kilometers to the east of Mastar city."},{"start":86.9,"end":90.98,"text":"92 % of Japan's population lives in urban areas,"},{"start":91.62,"end":94.97999999999999,"text":"one of which is Fujisawa Smart Sustainable Town."},{"start":96.56,"end":97.82,"text":"Like Mastar city,"},{"start":98.4,"end":104.88,"text":"Fujisawa Smart Town was designed to produce and to rely\nentirely on its own energy supply."},{"start":106.06,"end":109.78,"text":"In 2012, the first residents moved in."},{"start":110.16,"end":115.38,"text":"Every single home is equipped with solar panels and\nsmart monitoring systems."},{"start":116.74000000000001,"end":119.86,"text":"Residents track their energy consumption not only at\nhome,"},{"start":120.28,"end":122.56,"text":"but also on a community -wide level."},{"start":123.84,"end":127.46,"text":"The apps they use to do this not only display their\nenergy use,"},{"start":127.96,"end":131.22,"text":"but also suggest ways they might be able to reduce it."},{"start":132.94,"end":143.02,"text":"Fujisawa's residents say that seeing the exact amount\nof energy they consume has a big impact and encourages\nthem to waste as little energy as possible."},{"start":144.12,"end":145.84,"text":"As we move into the future,"},{"start":146.38,"end":150.72,"text":"we can be hopeful that more and more towns and cities\nwill be smart,"},{"start":151.14,"end":152.6,"text":"sustainable, and self -sufficient,"},{"start":152.98,"end":155.12,"text":"producing all function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}

   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}

  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
