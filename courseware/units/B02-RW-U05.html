","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/83dd722a6d213351adbfff90-L2RW-U05.mp4","captions":[{"start":1.18,"end":5.58,"text":"This is the Blaukrins Bridge in South Africa."},{"start":10.96,"end":16,"text":"At 216 metres high, it is one of the highest bungee\njumps in the world."},{"start":16.38,"end":23.48,"text":"More Keat made history here by becoming the world's\noldest bungee jumper at the age of 96."},{"start":24.32,"end":27.64,"text":"Bungee jumping looks dangerous, and it can be."},{"start":28.24,"end":30.74,"text":"Although ropes don't often break,"},{"start":31.12,"end":32.86,"text":"jumpers are sometimes injured."},{"start":34,"end":35.38,"text":"After the jumper falls,"},{"start":35.96,"end":39.6,"text":"the bungee rope suddenly pulls their body back and up."},{"start":40.4,"end":42.1,"text":"This can damage the eyes,"},{"start":42.54,"end":43.48,"text":"the back of the neck,"},{"start":43.84,"end":45.5,"text":"and can even kill you."},{"start":46.1,"end":47.6,"text":"For a man of Moore's age,"},{"start":48.04,"end":51.42,"text":"the chances of being injured must certainly increase."},{"start":52.1,"end":55.16,"text":"But this wasn't Moore's first bungee jump."},{"start":56.02,"end":58.12,"text":"In fact, he had done it twice before."},{"start":58.42,"end":61.1,"text":"His first jump was when he was 88."},{"start":61.6,"end":64.46,"text":"Then he did it again at 93."},{"start":72.98,"end":75.2,"text":"So didn't Moore get scared?"},{"start":78.36,"end":80.3,"text":"Yes, of course I'm scared."},{"start":81.82,"end":82.8,"text":"But you don't mind?"},{"start":83.96000000000001,"end":84.62,"text":"About the fear?"},{"start":85.06,"end":86.3,"text":"No, I like it."},{"start":91.9,"end":94.1,"text":"five, four, three, two,"},{"start":94.5,"end":95.24000000000001,"text":"one, bungee!"},{"start":98.46000000000001,"end":102.2,"text":"Moore did not know he was going to break a world record\nwhen he jumped."},{"start":102.74000000000001,"end":106.84,"text":"He said he did it for the challenge and the experience."},{"start":108.68,"end":111.68,"text":"It's very frightening, very exciting, very thrilling."},{"start":112.7,"end":114.03999999999999,"text":"And when you jump, of course,"},{"start":114.75999999999999,"end":116.7,"text":"it's the roar,"},{"start":117.1,"end":118.46000000000001,"text":"the wind in your ears,"},{"start":118.84,"end":120.46,"text":"it's deafening."},{"start":121.16,"end":124.48,"text":"The wind was blowing pretty hard, gusting,"},{"start":125.26,"end":126.58,"text":"and you jerk,"},{"start":127.42,"end":133.22,"text":"and the rope, the cable would shake like that, and it\nreally shook you up."},{"start":133.22,"end":136.9,"text":"Hanging there and shaking you, and he's shaking you."},{"start":137.26,"end":139.22,"text":"That was a different experience."},{"start":140.46,"end":141.56,"text":"After his jump,"},{"start":142.12,"end":147.04,"text":"doctors checked the 96 -year -old and found him in\nperfect health."},{"start":148.7,"end":150.84,"text":"What about when you're so scared and you're on the\nedge?"},{"start":150.92000000000002,"end":151.82,"text":"What do you think about?"},{"start":152.54,"end":153.52,"text":"No, you don't think."},{"start":156.06,"end":159.98,"text":"You just do it."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 oldest 2 dangerous 3 three","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":46,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U05-question:b3706","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":" oe wrestling","Caber toss","Coney Island Polar Bear Plunge"],"type":"choice/closed"},{"kind":"item","id":"b3721.i02","label":"Paragraph 3","prompt":"Paragraph 3","options":["Fireball football","Dragon boat racing","Toe wrestling","Caber toss","Coney Island Polar Bear Plunge"],"type":"choice/closed"}],[{"kind":"item","id":"b3721.i03","label":"Paragraph 4","prompt":"Paragraph 4","options":["Fireball football","Dragon boat racing","Toe wrestling","Caber toss","Coney Island Polar Bear Plunge"],"type":"choice/closed"},{"kind":"item","id":"b3721.i04","label":"Paragraph 5","prompt":"Paragraph 5","options":["Fireball football","Dragon boat racing","Toe wrestling","Caber toss","Coney Island Polar Bear Plunge"],"type":"choice/closed"}],[{"kind":"item","id":"b3721.i05","label":"Paragraph 6","prompt":"Paragraph 6","options":["Fireball football","Dragon boat racing","Toe wrestling","Caber toss","Coney Island Polar Bear Plunge"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B02-RW-U05-classroom:material:RW-M03","title":"READING 1","text":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n3\nEvery year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6\nIn England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","screens":["[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n3","Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"],"sources":[{"page":108,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc5e09cb6dbdaa5bb9d68304b7468d1b3312f858b66df9218f97462aa9b5c808.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_fd97f00863036b1c.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"a Paragraph 5 b Paragraph 3 c Paragraph 6\nd Paragraph 4 e Paragraph 2","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":47,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferen . The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6\nIn England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","screens":["[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n3","Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players :"It is popular with people from ____.","options":["the UK","all over the world"],"type":"choice/closed"},{"id":"b3741.i04","label":"4","prompt":"Every year people ____.","options":["get hurt","go home early"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3741.i01","label":"1","prompt":"Tough Guy is ____ competition.","options":["an easy","a difficult"],"type":"choice/closed"},{"kind":"item","id":"b3741.i02","label":"2","prompt":"It takes place when the weather is ____.","options":["hot","cold"],"type":"choice/closed"},{"kind":"item","id":"b3741.i03","label":"3","prompt":"It is popular with people from ____.","options":["the UK","all over the world"],"type":"choice/closed"}],[{"kind":"item","id":"b3741.i04","label":"4","prompt":"Every year people ____.","options":["get hurt","go home early"],"type":"choice/closed"}]],"courseMaterials":[{"id":"B02-RW-U05-classroom:material:RW-M04","title":"READING 2","text":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.\nIt looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----\nFrom: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers\n[IMAGE_1]\n# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?\nThe competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course\nThe diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","screens":["To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.\nIt looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----\nFrom: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers\n[IMAGE_1]","# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course","The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f63c0c9986c29e63614da5ac4d356ce78aad065e5f8df7867ce0c6437f6273ad.png","width":772,"height":1040},{"page":112,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99742da70e08d0721dbbaddd169e70fc418a0e1d1c3137fd2d1a1580f085f3ce.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2eee55d68d2335b8.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 a difficult 2 cold 3 all over the world 4 get hurt\n6 different","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":48,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U05-question:b3742","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":2,"order":26,"module":"READING 2","ex":"6","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the text again. Underline any details that you think are important in each paragraph. Compare your answers with a partner.","pages":[113],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/93eec500d94844797a8e9fb09637d4cf16ef370c8d757b333a108dbeab203bb1.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"What is Tough Guy?"},{"kind":"text","text":"Why do people take part?"},{"kind":"text","text":"The cours ake part?","The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course","The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."],"sources":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f63c0c9986c29e63614da5ac4d356ce78aad065e5f8df7867ce0c6437f6273ad.png","width":772,"height":1040},{"page":112,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99742da70e08d0721dbbaddd169e70fc418a0e1d1c3137fd2d1a1580f085f3ce.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2eee55d68d2335b8.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d857  enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----\nFrom: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers\n[IMAGE_1]\n# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?\nThe competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course\nThe diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platfo ,"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0b7791772a3292673ffb22056d0a92ff5fad39d4b1047cd464271645d12aca93.png"],"provided":"Write a process paragraph to describe how to do the high jump.\n\nThe high jump is an Olympic sport that is practised in many countries. Athletes competed in over 30 venues during the 2012 London Olympic Games. First, the high jumper runs towards the bar. It is important to run very fast. The high jump is a very important sport in some countries. Next, the high jumper jumps. I was on the track-and-field team at school. The high jumper must jump from the right foot and keep their arms close to their sides. Then, the high jumper twists their body so that their back is to the bar. They must lift their head and feet and keep them high above the bar. The high jump is a really interesting sport. After that, the high jumper lands. They must be careful to land safely on the mat. Mutaz Essa Barshim from Qatar and Gianmarco Tamberi from Italy both won the men's gold medal at the Tokyo 2020 Olympics. They jumped 2.37 metres. It was the first time two people had shared a gold medal in athletics since 1912. Finally, the high jumper stands up, takes a bow and leaves the mat.","items":[{"id":"b3775.i01","label":"1","prompt":"The high jump is an Olympic sport that is practised in many countries.","options":[],"type":"select/open"},{"id":"b3775.i02","label":"2","prompt":"Athletes competed in over 30 venues during the 2012 London Olympic Games.","options":[],"type":"select/open"},{"id":"b3775.i03","label":"3","prompt":"First, the high jumper runs towards the bar.","options":[],"type":"select/open"},{"id":"b3775.i04","label":"4","prompt":"It is important to run very fast.","options":[],"type":"select/open"},{"id":"b3775.i05","label":"5","prompt":"The high jump is a very important sport in some countries.","options":[],"type":"select/open"},{"id":"b3775.i06","lab portant to run very fast. The high jump is a very important sport in some countries. Next, the high jumper jumps. I was on the track-and-field team at school. The high jumper must jump from the right foot and keep their arms close to their sides. Then, the high jumper twists their body so that their back is to the bar. They must lift their head and feet and keep them high above the bar. The high jump is a really interesting sport. After that, the high jumper lands. They must be careful to land safely on the mat. Mutaz Essa Barshim from Qatar and Gianmarco Tamberi from Italy both won the men's gold medal at the Tokyo 2020 Olympics. They jumped"}],[{"kind":"text","text":"2.37 metres. It was the first time two people had shared a gold medal in athletics since 1912. Finally, the high jumper stands up, takes a bow and leaves the mat."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":50,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U05-question:b3776","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":2,"order":40,"module":"ACADEMIC WRITING SKILLS","ex":"6","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"REMOVING UNRELATED INFORMATION"},"instruction":"Compare and discuss your answers with a partner.","pages":[120],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0b7791772a3292673ffb22056d0a92ff5fad39d4b1047cd464271645d12aca93.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source" cause somebody or something to do this","example":"The car began to jerk as the engine failed.","wordAudio":"jerk","cardWord":false},{"term":"shake","pos":"(v)","definition":"to move quickly from side to side or up and down","example":"Shake the bottle before you open it.","wordAudio":"shake","cardWord":false}]]}},{"id":"B02-RW-U05-classroom:video","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[105],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5c54473a0aee056989abde2bdc13d49197f74f86a09ecb1fae3d4c5fff0590cc.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/83dd722a6d213351adbfff90-L2RW-U05.mp4","captions":[{"start":1.18,"end":5.58,"text":"This is the Blaukrins Bridge in South Africa."},{"start":10.96,"end":16,"text":"At 216 metres high, it is one of the highest bungee\njumps in the world."},{"start":16.38,"end":23.48,"text":"More Keat made history here by becoming the world's\noldest bungee jumper at the age of 96."},{"start":24.32,"end":27.64,"text":"Bungee jumping looks dangerous, and it can be."},{"start":28.24,"end":30.74,"text":"Although ropes don't often break,"},{"start":31.12,"end":32.86,"text":"jumpers are sometimes injured."},{"start":34,"end":35.38,"text":"After the jumper falls,"},{"start":35.96,"end":39.6,"text":"the bungee rope suddenly pulls their body back and up."},{"start":40.4,"end":42.1,"text":"This can damage the eyes,"},{"start":42.54,"end":43.48,"text":"the back of the neck,"},{"start":43.84,"end":45.5,"text":"and can even kill you."},{"start":46.1,"end":47.6,"text":"For a man of Moore's age,"},{"start":48.04,"end":51.42,"text":"the chances of being injured must certainly increase."},{"start":52.1,"end":55.16,"text":"But this wasn't Moore's first bungee jump."},{"start":56.02,"end":58.12,"text":"In fact, he had done it twice before."},{"start":58.42,"end":61.1,"text":"His first jump was when he was 88."},{"start":61.6,"end":64.46,"text":"Then he did it again at 93."},{"start":72.98,"end":75.2,"text":"So didn't Moore get scared?"},{"start":78.36,"end":80.3,"text":"Yes, of course I'm scared."},{"start":81.82,"end":82.8,"text":"But you don't mind?"},{"start":83.96000000000001,"end":84.62,"text":"About the fear?"},{"start":85.06,"end":86.3,"text":"No, I like it."},{"start":91.9,"end":94.1,"text":"five, four, three, two,"},{"start":94.5,"end":95.24000000000001,"text":"one, bungee!"},{"start":98.46000000000001,"end":102.2,"text":"Moore did not know he was going to break a world record\nwhen he jumped."},{"start":102.74000000000001,"end":106.84,"text":"He said he did it for the challenge and the experience."},{"start":108.68,"end":111.68,"text":"It's very frightening, very exciting, very thrilling."},{"start":112.7,"end":114.03999999999999,"text":"And when you jump, of course,"},{"start":114.75999999999999,"end":116.7,"text":"it's the roar,"},{"start":117.1,"end":118.46000000000001,"text":"the wind in your ears,"},{"start":118.84,"end":120.46,"text":"it's deafening."},{"start":121.16,"end":124.48,"text":"The wind was blowing pretty hard, gusting,"},{"start":125.26,"end":126.58,"text":"and you jerk,"},{"start":127.42,"end":133.22,"text":"and the rope, the cable would shake like that, and it\nreally shook you up."},{"start":133.22,"end":136.9,"text":"Hanging there and shaking you, and he's shaking you."},{"start":137.26,"end":139.22,"text":"That was a different experience."},{"start":140.46,"end":141.56,"text":"After his jump,"},{"start":142.12,"end":147.04,"text":"doctors checked the 96 -year -old and found him in\nperfect health."},{"start":148.7,"end":150.84,"text":"What about when you're so scared and you're on the\nedge?"},{"start":150.92000000000002,"end":151.82,"text":"What do you think about?"},{"start":152.54,"end":153.52,"text":"No, you don't think."},{"start":156.06,"end":159.98,"text":"You just do it."}],"launchInline":true}},{"id":"B02-RW-U05-classroom:resource:b3712","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[106],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f8071622f84d88c3d16ff5254c2759108e920d1ee880a1a93119b7d796dd07fd.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["ancient (adj) from a long time ago; very old\ncompete (v) to take part in a race or competition; to try to be more successful than somebody else\ncompetition (n) an organized event in which people try to win a prize by being the best\nstrange (adj) not familiar; difficult to understand; different","swimming (n) a sport where people move through water by moving their body\ntake place (phr v) to happen\nthrow (v) to send something through the air, pushing it out of your hand"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U05-classroom:material:RW-M03","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[108],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc5e09cb6dbdaa5bb9d68304b7468d1b3312f858b66df9218f97462aa9b5c808.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n3","sourcePage":108},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U05-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"[IMAGE_1]","pages":[{"page":108,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc5e09cb6dbdaa5bb9d68304b7468d1b3312f858b66df9218f97462aa9b5c808.png","width":772,"height":1040}],"source":108,"embeddedIn":null,"photo":null,"clearPages":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n3","sourcePage":108},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108}],"text":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n3\nEvery year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6\nIn England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_fd97f00863036b1c.mp3"},"original":{"id":"B02-RW-U05-material:RW-M03","entry":"material:RW-M03","unitId":"B02-RW-U05","book":2,"track":"RW","unit":5,"title":"READING 1","kind":"material","pages":[108],"sourceImages":[{"page":108,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc5e09cb6dbdaa5bb9d68304b7468d1b3312f858b66df9218f97462aa9b5c808.png","viewEvidenceReported":true}],"text":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.\n\n2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health. The club started in 1903.\n\n3\nEvery year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n\n4\nIn this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n\n5\nStudents in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n\n6\nIn England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n\n[IMAGE_2]\n$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3719"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_fd97f00863036b1c.mp3","continueOnPage":true}},{"id":"B02-RW-U05-classroom:material:RW-M04","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[111,112],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f63c0c9986c29e63614da5ac4d356ce78aad065e5f8df7867ce0c6437f6273ad.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99742da70e08d0721dbbaddd169e70fc418a0e1d1c3137fd2d1a1580f085f3ce.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.\nIt looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----\nFrom: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers\n[IMAGE_1]","sourcePage":111},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U05-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"To: Steve","pages":[{"page":111,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f63c0c9986c29e63614da5ac4d356ce78aad065e5f8df7867ce0c6437f6273ad.png","width":772,"height":1040},{"page":112,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99742da70e08d0721dbbaddd169e70fc418a0e1d1c3137fd2d1a1580f085f3ce.png","width":772,"height":1040}],"source":111,"embeddedIn":null,"photo":null,"clearPages":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.\nIt looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----\nFrom: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers\n[IMAGE_1]","sourcePage":111},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112}],"text":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.\nIt looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----\nFrom: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers\n[IMAGE_1]\n# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?\nThe competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]\nTo run across a field of nettles can hurt a lot.\n## 3 The course\nThe diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2eee55d68d2335b8.mp3"},"original":{"id":"B02-RW-U05-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U05","book":2,"track":"RW","unit":5,"title":"READING 2","kind":"material","pages":[111,112],"sourceImages":[{"page":111,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f63c0c9986c29e63614da5ac4d356ce78aad065e5f8df7867ce0c6437f6273ad.png","viewEvidenceReported":true},{"page":112,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/99742da70e08d0721dbbaddd169e70fc418a0e1d1c3137fd2d1a1580f085f3ce.png","viewEvidenceReported":true}],"text":"To: Steve\n\nFrom: 12th October 2023\n\nSubject: Tough Guy competition course\n\nHi,\n\nI've just got this message from the Tough Guy competition. See the diagram of the course.\n\nIt looks challenging!\n\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\n\nBest,\n\nPeter\n\n---- Forwarded message ----\n\nFrom: Tough Guy Competition\n\nDate: 8th October\n\nSubject: the course of the next Tough Guy competition\n\n## Dear Participant,\n\nWe're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\n\nWe look forward to seeing you there in January.\n\nKind regards,\n\nThe Organizers\n\n[IMAGE_1]\n# TOUGH GUY:\n\nrace to the limit\n\n[IMAGE_1]\n\n## 1 What is Tough Guy?\n\nEvery January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n\n## 2 Why do people take part?\n\nThe competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n\n[IMAGE_2]\n\n[IMAGE_3]\n\nTo run across a field of nettles can hurt a lot.\n\n## 3 The course\n\nThe diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3735","b3738"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_2eee55d68d2335b8.mp3","continueOnPage":true}},{"id":"B02-RW-U05-classroom:review-1","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b7368cf9d71d82092f88864f1d6a8a41e58948ea63a61d389bbc5d4bb579081b.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B02-RW-U05-B-002","form":"ancient","page":123},{"id":"B02-RW-U05-B-005","form":"compete","page":123},{"id":"B02-RW-U05-B-006","form":"competition","page":123},{"id":"B02-RW-U05-B-010","form":"strange","page":123},{"id":"B02-RW-U05-B-011","form":"swimming","page":123},{"id":"B02-RW-U05-B-012","form":"take place","page":123},{"id":"B02-RW-U05-B-013","form":"throw","page":123}]]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U05-classroom:review-2","book":2,"unit":5,"track":"RW","topic":"SPORTS AND COMPETITION","lesson":2,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[123],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d function measure(doc){

 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
