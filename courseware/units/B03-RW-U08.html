 economy,"},{"start":21.78,"end":26.16,"text":"they are signs of how well, or how badly, the economy\nis doing."},{"start":27.1,"end":29.64,"text":"They are economic indicators."},{"start":31.78,"end":36.64,"text":"When restaurants have a lot of waste, it often means\nthat people are eating out more."},{"start":37.72,"end":42.04,"text":"That suggests times are good and customers have money\nto spend."},{"start":44.5,"end":46.78,"text":"When there are more mosquitoes in the suburbs,"},{"start":47.14,"end":50.9,"text":"it could mean many people are not taking care of their\nswimming pools."},{"start":52.78,"end":56.5,"text":"And that might mean they have lost their homes to the\nbanks."},{"start":57.36,"end":59.9,"text":"This happened in the United States in 2007."},{"start":62.14,"end":65.9,"text":"Some of the more traditional economic indicators\ninclude GDP,"},{"start":67.64,"end":68.38,"text":"inflation,"},{"start":69.98,"end":71.17,"text":"and unemployment numbers."},{"start":73.2,"end":77.3,"text":"But economic analysts also look at more unusual\nindicators."},{"start":78.2,"end":81.38,"text":"One of these is the cardboard box index."},{"start":83.4,"end":86.88,"text":"Companies pack their products, from televisions to\nchocolates,"},{"start":87.24,"end":88.68,"text":"in cardboard boxes."},{"start":90.24,"end":94.8,"text":"When these companies expect sales to be high, they\norder more boxes."},{"start":96.68,"end":100.28,"text":"So analysts look at the number of boxes being made"},{"start":101.08,"end":104.6,"text":"and predict how much money we are going to spend."},{"start":105.64,"end":108.96000000000001,"text":"Another indicator is necktie sales."},{"start":109.97999999999999,"end":115.02000000000001,"text":"Analysts say that when men are worried about losing\ntheir jobs, they start buying more ties."},{"start":116,"end":119.5,"text":"They want to show their bosses they are serious and\nhardworking."},{"start":120.68,"end":127.6,"text":"The number of ties sold in the UK increased by ten to\n20 percent during the financial crisis of 2008."},{"start":128.82,"end":130.1,"text":"More new,"},{"start":130.4,"end":134.72,"text":"tall buildings would seem to be a sign of good economic\nhealth, right?"},{"start":136.24,"end":137.2,"text":"Not always."},{"start":137.74,"end":138.38,"text":"In fact,"},{"start":138.7,"end":140.74,"text":"some analysts say it's the opposite."},{"start":141.9,"end":147.8,"text":"In the past 100 years, many of the world's most famous\nskyscrapers started going up."},{"start":148.64,"end":150.86,"text":"As the economy started going down."},{"start":159.22,"end":161.72,"text":"The Patronus Towers."},{"start":163.42000000000002,"end":164.64,"text":"The Burj Khalifa."},{"start":166.76,"end":174.26,"text":"Some analysts believe we often start building taller\nand taller skyscrapers near the end of a good economic\nperiod."},{"start":175.76,"end":179.1,"text":"None of these indicators are very reliable on their\nown."},{"start":180.02,"end":181.9,"text":"But this one could be."},{"start":184.94,"end":188.32,"text":"The OECD has developed an AI tool,"},{"start":189.26,"end":191.1,"text":"which studies our Internet searches."},{"start":192.82,"end":195.34,"text":"It looks at searches about shopping, jobs,"},{"start":195.68,"end":197.26,"text":"housing and much more."},{"start":204,"end":208.46,"text":"Then it uses the information to predict economic\nchanges."},{"start":210.1,"end":216.2,"text":"Indicators which forecast the future health of the\neconomy are the most useful to analysts."},{"start":217.78,"end":222.42000000000002,"text":"They can also help politicians and business owners to\nmake better decisions,"},{"start":223.6,"end":228.62,"text":"plan for difficult times and avoid the worst\nsituations."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 cardboard 2 skyscrapers 3 reliable 4 searches\n5 future","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers 01","label":"a","prompt":"____ (n) the percentage amount that you pay when you borrow money, or receive when you lend money, for a period of time","options":[],"type":"choice/closed"},{"id":"b5636.i02","label":"b","prompt":"____ (n) profit on money you have invested","options":[],"type":"choice/closed"},{"id":"b5636.i03","label":"c","prompt":"____ (n) parts of a publicly-owned business which can be bought and sold as investments","options":[],"type":"choice/closed"},{"id":"b5636.i04","label":"d","prompt":"____ (v) to put money in a bank, business, etc. to make a profit","options":[],"type":"choice/closed"},{"id":"b5636.i05","label":"e","prompt":"____ (n) how much money something could be sold for","options":[],"type":"choice/closed"},{"id":"b5636.i06","label":"f","prompt":"____ (v) to have enough money to buy something","options":[],"type":"choice/closed"},{"id":"b5636.i07","label":"g","prompt":"____ (n) something such as stocks or property which you buy in order to make a profit","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 I would like to buy a home but I can't afford it. I have not saved enough money."},{"kind":"text","text":"2 At my bank, the interest rate on a loan to buy a car is about 4.5%."},{"kind":"text","text":"3 Since Apple Computer company stocks and shares went on sale in 1976, their value has increased by more than 28,000%."},{"kind":"text","text":"4 Real estate, that is land or buildings, is an excellent investment in large cities like Los Angeles or Tokyo."},{"kind":"text","text":"5 My father invests carefully. He buys assets, like buildings and cars, that increase slowly over time."}],[{"kind":"text","text":"6 After a natural disaster, such as a tsunami or fire, the homes and businesses in an area usually go down in value."},{"kind":"text","text":"7 If you buy gold, you can probably expect to get a high rate of return on your investment."},{"kind":"item","id":"b5636.i0 nd classic cars are both popular investments.\n[IMAGE_1]\n[IMAGE_2]\n2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than have it sitting in a bank.\n3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!\n[IMAGE_3]\n[IMAGE_4]\n4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but remember, there are no guarantees.\n¹fluctuate (v) to keep changing, especially in level or amount","screens":["1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments.\n[IMAGE_1]\n[IMAGE_2]","2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than have it sitting in a bank.","3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond swers.","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/963714bfb58da8852f8ee17ecd452eadc9386e75ceeb848fdc380f8e3b41617f.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B03-RW-U08-question:b5654","kind":"student-work","title":"READING 2 Ex 2","pages":[176]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Many people are actually poorer than they were 10 or\n20 years ago. 2 housing","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U08-question:b5657","book":3,"unit":8,"track":"RW","topic":"ECONOMICS","lesson":2,"order":21,"module":"READING 2","ex":"4","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read and annotate the article opposite. Look at page 85 for what to annotate.","pages":[176],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/963714bfb58da8852f8ee17ecd452eadc9386e75ceeb848fdc380f8e3b41617f.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"You should try different techniques and choose the ones which work best for you."}]],"courseMaterials":[{"id":"B03-RW-U08-classroom:material:RW-M04","title":"READING 2","text":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?\n2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food.\n3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healthcare. In many cities worldwide, there is a serious shortage of houses and apartments to buy or rent. Healthcare costs also continue to rise as medicine and hospital care have become more expensive. Most recently, there have also been significant increases in food prices.\nFigure 1\nU.S. Median Household Income\n[IMAGE_13]\nFigure 2\n[IMAGE_12]\n4 However, expenditures are only half the picture. The other half is the money people earn, their income. In the United States, in general, incomes have also gone up (see Figure 1). Yet not all incomes are increasing at the same rate. For many people, they have not increased as much as expenditures. This means that their 'buying power' has decreased. Figure 2 shows this increase in inequality. It shows change in income by group, from the bottom 20% to the top 20%. The top line shows the highest 5%. It is clear that the incomes of the higher income groups are rising the fastest. The incomes of the lower groups are rising more slowly. It is not surprising that they do not have a higher standard of living than their parents.\n5 In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream.","screens":["1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?","2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food.\n3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healt 8.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ebef445c8f84352e5b8c1f7200a164370160c5d5b52bbe030b4072e9b6790777.png"],"provided":"## Thesis statement\n\n... many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?\nIn conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream.","items":[{"id":"b5698.i01","label":"1","prompt":"Underline the sentence in the concluding paragraph which restates the thesis.","options":[],"type":"choice/closed"},{"id":"b5698.i02","label":"2","prompt":"Circle the transition phrase in the concluding paragraph.","options":[],"type":"choice/closed"},{"id":"b5698.i03","label":"3","prompt":"Put a box around the final comments in the concluding paragraph. Which of the following does the writer include? Choose more than one.","options":["an opinion","a prediction about the future","a recommendation","the implications of the data in the graph"],"type":"choice/multi_choice"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"... many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?"},{"kind":"text","text":"In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impa "Watch and listen","text":"Watch and understand a video about economic indicators."},{"label":"Reading skill","text":"Skim for general ideas."},{"label":"Critical thinking","text":"Understand and interpret line graphs."},{"label":"Grammar","text":"Describe graphs using noun and verb phrases; use prepositions and conjunctions to add data; use approximations."},{"label":"Academic writing skills","text":"Write a description of a graph that shows change; write a concluding paragraph."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":168,"alt":""}}]}},{"id":"B03-RW-U08-classroom:resource:b5627","book":3,"unit":8,"track":"RW","topic":"ECONOMICS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[170],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/a0f6639f3ae2820360d9f9131106b3b053b68d2581665789d2639f23090d0f09.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"suburbs","pos":"(n)","definition":"the area outside of a town or city","example":"They moved from the city centre to the suburbs.","wordAudio":"suburbs","cardWord":false},{"term":"economy","pos":"(n)","definition":"the system by which a country produces and uses goods and money","example":"The local economy depends on farming and tourism.","wordAudio":"economy","cardWord":false},{"term":"GDP","pos":"(n)","definition":"the total value of the goods and services that a country produces every year","example":"The report compares the GDP of several countries.","wordAudio":"GDP","cardWord":false},{"term":"inflation","pos":"(n)","definition":"how fast prices are increasing","example":"Because of inflation, the same basket of food costs more this year.","wordAudio":"inflation","cardWord":false},{"term":"cardboard","pos":"(n)","definition":"thick, stiff paper that is used to make boxes","example":"We packed the books in a cardboard box.","wordAudio":"cardboard","cardWord":false}]]}},{"id":"B03-RW-U08-classroom:video","book":3,"unit":8,"track":"RW","topic":"ECONOMICS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bc81781e2b117f6620534a238bd1a438bf1bbbcc5d0f2fcd9bcbad79eb89ab7b.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/2c0f7a1543ae9fe075e44671-L3RW-U08.mp4","captions":[{"start":0.98,"end":4.42,"text":"Big piles of waste from restaurants."},{"start":8.52,"end":10.82,"text":"Large numbers of mosquitoes in the suburbs."},{"start":12.36,"end":15.74,"text":"To most people, these situations are just annoying."},{"start":17.44,"end":21.26,"text":"But to economic analysts, people who study the economy,"},{"start":21.78,"end":26.16,"text":"they are signs of how well, or how badly, the economy\nis doing."},{"start":27.1,"end":29.64,"text":"They are economic indicators."},{"start":31.78,"end":36.64,"text":"When restaurants have a lot of waste, it often means\nthat people are eating out more."},{"start":37.72,"end":42.04,"text":"That suggests times are good and customers have money\nto spend."},{"start":44.5,"end":46.78,"text":"When there are more mosquitoes in the suburbs,"},{"start":47.14,"end":50.9,"text":"it could mean many people are not taking care of their\nswimming pools."},{"start":52.78,"end":56.5,"text":"And that might mean they have lost their homes to the\nbanks."},{"start":57.36,"end":59.9,"text":"This happened in the United States in 2007."},{"start":62.14,"end":65.9,"text":"Some of the more traditional economic indicators\ninclude GDP,"},{"start":67.64,"end":68.38,"text":"inflation,"},{"start":69.98,"end":71.17,"text":"and unemployment numbers."},{"start":73.2,"end":77.3,"text":"But economic analysts also look at more unusual\nindicators."},{"start":78.2,"end":81.38,"text":"One of these is the cardboard box index."},{"start":83.4,"end":86.88,"text":"Companies pack their products, from televisions to\nchocolates,"},{"start":87.24,"end":88.68,"text":"in cardboard boxes."},{"start":90.24,"end":94.8,"text":"When these companies expect sales to be high, they\norder more boxes."},{"start":96.68,"end":100.28,"text":"So analysts look at the number of boxes being made"},{"start":101.08,"end":104.6,"text":"and predict how much money we are going to spend."},{"start":105.64,"end":108.96000000000001,"text":"Another indicator is necktie sales."},{"start":109.97999999999999,"end":115.02000000000001,"text":"Analysts say that when men are worried about losing\ntheir jobs, they start buying more ties."},{"start":116,"end":119.5,"text":"They want to show their bosses they are serious and\nhardworking."},{"start":120.68,"end":127.6,"text":"The number of ties sold in the UK increased by ten to\n20 percent during the financial crisis of 2008."},{"start":128.82,"end":130.1,"text":"More new,"},{"start":130.4,"end":134.72,"text":"tall buildings would seem to be a sign of good economic\nhealth, right?"},{"start":136.24,"end":137.2,"text":"Not always."},{"start":137.74,"end":138.38,"text":"In fact,"},{"start":138.7,"end":140.74,"text":"some analysts say it's the opposite."},{"start":141.9,"end":147.8,"text":"In the past 100 years, many of the world's most famous\nskyscrapers started going up."},{"start":148.64,"end":150.86,"text":"As the economy started going down."},{"start":159.22,"end":161.72,"text":"The Patronus Towers."},{"start":163.42000000000002,"end":164.64,"text":"The Burj Khalifa."},{"start":166.76,"end":174.26,"text":"Some analysts believe we often start building taller\nand taller skyscrapers near the end of a good economic\nperiod."},{"start":175.76,"end":179.1,"text":"None of these indicators are very reliable on their\nown."},{"start":180.02,"end":181.9,"text":"But this one could be."},{"start":184.94,"end":188.32,"text":"The OECD has developed an AI tool,"},{"start":189.26,"end":191.1,"text":"which studies our Internet searches."},{"start":192.82,"end":195.34,"text":"It looks at searches about shopping, jobs,"},{"start":195.68,"end":197.26,"text":"housing and much more."},{"start":204,"end":208.46,"text":"Then it uses the information to predict economic\nchanges."},{"start":210.1,"end":216.2,"text":"Indicators which forecast the future health of the\neconomy are the most useful to analysts."},{"start":217.78,"end":222.42000000000002,"text":"They can also help politicians and business owners to\nmake better decisions,"},{"start":223.6,"end":228.62,"text":"plan for difficult times and avoid the worst\nsituations."}],"launchInline":true}},{"id":"B03-RW-U08-classroom:material:RW-M03","book":3,"unit":8,"track":"RW","topic":"ECONOMICS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c655990f0b6968bf7c380a19da121d996e91ac1a6d02bd636036231c8bf8f6e0.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments.\n[IMAGE_1]\n[IMAGE_2]","sourcePage":173},{"body":"2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than have it sitting in a bank.","sourcePage":173},{"body":"3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!\n[IMAGE_3]\n[IMAGE_4]","sourcePage":173},{"body":"4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but remember, there are no guarantees.\n¹fluctuate (v) to keep changing, especially in level or amount","sourcePage":173}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U08-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"READING 1","pages":[{"page":173,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c655990f0b6968bf7c380a19da121d996e91ac1a6d02bd636036231c8bf8f6e0.png","width":772,"height":1040}],"source":173,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments.\n[IMAGE_1]\n[IMAGE_2]","sourcePage":173},{"body":"2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than have it sitting in a bank.","sourcePage":173},{"body":"3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!\n[IMAGE_3]\n[IMAGE_4]","sourcePage":173},{"body":"4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but remember, there are no guarantees.\n¹fluctuate (v) to keep changing, especially in level or amount","sourcePage":173}],"text":"1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments.\n[IMAGE_1]\n[IMAGE_2]\n2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than have it sitting in a bank.\n3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!\n[IMAGE_3]\n[IMAGE_4]\n4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but remember, there are no guarantees.\n¹fluctuate (v) to keep changing, especially in level or amount","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ae0b0565008796a3.mp3"},"original":{"id":"B03-RW-U08-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U08","book":3,"track":"RW","unit":8,"title":"READING 1","kind":"material","pages":[173],"sourceImages":[{"page":173,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c655990f0b6968bf7c380a19da121d996e91ac1a6d02bd636036231c8bf8f6e0.png","viewEvidenceReported":true}],"text":"1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments.\n\n[IMAGE_1]\n\n[IMAGE_2]\n\n2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than have it sitting in a bank.\n\n3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!\n\n[IMAGE_3]\n\n[IMAGE_4]\n\n4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but remember, there are no guarantees.\n\n¹fluctuate (v) to keep changing, especially in level or amount","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5638"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ae0b0565008796a3.mp3","continueOnPage":true}},{"id":"B03-RW-U08-classroom:resource:b5669","book":3,"unit":8,"track":"RW","topic":"ECONOMICS","lesson":1,"module":"Vocabulary for Ex 3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"NOUNS FOR ECONOMIC TRENDS"},"pages":[179],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/387ec4aae8674a596b33da02f013bc7bd7f065b3874cb28d489c0995665ddcec.png"],"layout":"list","instruction":"Vocabulary for Ex 3","flow":{"kind":"resource","pages":["demand (n) the need for something to be sold or supplied\nmarket (n) the total number of people who might want to buy something\nmedian (adj) having a value that is exactly in the middle of a set of values arranged from largest to smallest\npurchase (n) something that you buy","revenue (n) the income that a company or government receives\nsupply (n) an amount or quantity of something available to use\ntrend (n) the general direction of changes or developments"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U08-classroom:material:RW-M04","book":3,"unit":8,"track":"RW","topic":"ECONOMICS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[177],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff6c3e272ae5f09187bd539b91d55dafeb7ff5038022c2968f9cbbdb95845954.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?","sourcePage":177},{"body":"2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food.\n3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healthcare. In many cities worldwide, there is a serious shortage of houses and apartments to buy or rent. Healthcare costs also continue to rise as medicine and hospital care have become more expensive. Most recently, there have also been significant increases in food prices.\nFigure 1","sourcePage":177},{"body":"U.S. Median Household Income\n[IMAGE_13]\nFigure 2\n[IMAGE_12]\n4 However, expenditures are only half the picture. The other half is the money people earn, their income. In the United States, in general, incomes have also gone up (see Figure 1). Yet not all incomes are increasing at the same rate. For many people, they have not increased as much as expenditures. This means that their 'buying power' has decreased. Figure 2 shows this increase in inequality. It shows change in income by group, from the bottom 20% to the top 20%. The top line shows the highest 5%. It is clear that the incomes of the higher income groups are rising the fastest. The incomes of the lower groups are rising more slowly. It is not surprising that they do not have a higher standard of living than their parents.","sourcePage":177},{"body":"5 In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream.","sourcePage":177}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U08-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":177,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff6c3e272ae5f09187bd539b91d55dafeb7ff5038022c2968f9cbbdb95845954.png","width":772,"height":1040}],"source":177,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?","sourcePage":177},{"body":"2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food.\n3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healthcare. In many cities worldwide, there is a serious shortage of houses and apartments to buy or rent. Healthcare costs also continue to rise as medicine and hospital care have become more expensive. Most recently, there have also been significant increases in food prices.\nFigure 1","sourcePage":177},{"body":"U.S. Median Household Income\n[IMAGE_13]\nFigure 2\n[IMAGE_12]\n4 However, expenditures are only half the picture. The other half is the money people earn, their income. In the United States, in general, incomes have also gone up (see Figure 1). Yet not all incomes are increasing at the same rate. For many people, they have not increased as much as expenditures. This means that their 'buying power' has decreased. Figure 2 shows this increase in inequality. It shows change in income by group, from the bottom 20% to the top 20%. The top line shows the highest 5%. It is clear that the incomes of the higher income groups are rising the fastest. The incomes of the lower groups are rising more slowly. It is not surprising that they do not have a higher standard of living than their parents.","sourcePage":177},{"body":"5 In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream.","sourcePage":177}],"text":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?\n2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food.\n3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healthcare. In many cities worldwide, there is a serious shortage of houses and apartments to buy or rent. Healthcare costs also continue to rise as medicine and hospital care have become more expensive. Most recently, there have also been significant increases in food prices.\nFigure 1\nU.S. Median Household Income\n[IMAGE_13]\nFigure 2\n[IMAGE_12]\n4 However, expenditures are only half the picture. The other half is the money people earn, their income. In the United States, in general, incomes have also gone up (see Figure 1). Yet not all incomes are increasing at the same rate. For many people, they have not increased as much as expenditures. This means that their 'buying power' has decreased. Figure 2 shows this increase in inequality. It shows change in income by group, from the bottom 20% to the top 20%. The top line shows the highest 5%. It is clear that the incomes of the higher income groups are rising the fastest. The incomes of the lower groups are rising more slowly. It is not surprising that they do not have a higher standard of living than their parents.\n5 In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_961cad02c552a022.mp3"},"original":{"id":"B03-RW-U08-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U08","book":3,"track":"RW","unit":8,"title":"READING 2","kind":"material","pages":[177],"sourceImages":[{"page":177,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ff6c3e272ae5f09187bd539b91d55dafeb7ff5038022c2968f9cbbdb95845954.png","viewEvidenceReported":true}],"text":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer tha on":1},"b5693.i02":{"mode":"choice","option":3},"b5693.i03":{"mode":"choice","option":4}},"overrideRows":true,"replaceBlocks":[],"textFills":[]},"B03-RW-U08-question:b5659":{"basis":"已核对教材原题和教师资料。","rows":{},"displayPages":[[{"id":"b5659.i01","label":"1","prompt":"","options":["Rapid economic growth in Japan slowed down in the 1980s.","Japan's rapid economic growth was the result of the Second World War."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":0}},{"id":"b5659.i02","label":"2","prompt":"","options":["Between 2000 and 2015, Americans spent more on transport than they did on food.","Many Americans now spend about a third of their income on housing."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":1}},{"id":"b5659.i03","label":"3","prompt":"","options":["Median household income in the US has increased steadily since 1985.","Median household income in the US has doubled since 2010."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":1}},{"id":"b5659.i04","label":"4","prompt":"","options":["US median household income for the lowest income group has decreased since 1970.","US median household income has increased the fastest at the highest income level."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":1}},{"id":"b5659.i05","label":"5","prompt":"","options":["Income inequality is increasing in the United States.","The buying power of all income groups has been increasing since 1970."],"type":"choice/closed","kind":"item","answer":{"mode":"choice","option":0}}]]}},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B03-RW-U08-classroom:material:RW-M03":[{"body":"1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a","sourcePage":173,"blocks":[{"kind":"text","text":"1 Many people put their money in a bank because it is safe. However, the interest rate at most banks is quite low. As a result, some people choose to invest their money in stocks and shares instead because they hope their money will grow faster that way. Yet, investing in stocks can be risky. If the value of the stocks goes down, you could lose a"}]},{"body":"lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments.\n[IMAGE_1]\n[IMAGE_2]","sourcePage":173,"blocks":[{"kind":"text","text":"lot of money. Many experts say you should invest only what you can afford to lose. So, what are some alternative investments for people who can afford to take big risks? Gold and classic cars are both popular investments."},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in","sourcePage":173,"blocks":[{"kind":"text","text":"2 Over time, gold has been a very good investment, though the price has fluctuated¹ in recent years, as the graph shows. Between 2017 and 2020, for example, the price rose from $1,200 an ounce to a peak of $1,900 an ounce. Then, by the end of 2022, it had fallen to $1,800. By 2023, it rose again to $1,900. If you are thinking about investing in"}]},{"body":"gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than\nhave it sitting in a bank.","sourcePage":173,"blocks":[{"kind":"text","text":"gold, you may want to consider one famous investor's advice. Warren Buffet, one of the richest men in the world, dislikes gold as an investment. He points out that historically, the stock market has brought in significantly higher returns than gold. He also says it is better for society if you use your money for something productive, rather than"},{"kind":"text","text":"have it sitting in a bank."}]},{"body":"3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like","sourcePage":173,"blocks":[{"kind":"text","text":"3 While gold and stocks are both investment options in the long term, some people prefer investments that they can use and enjoy now. For these people, classic cars are one way to have fun and make lots of money. In fact, over the last 30 or 40 years, the value of some classic cars has risen far more than that of gold or other investments like"}]},{"body":"houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither","sourcePage":173,"blocks":[{"kind":"text","text":"houses. As an example, a 1972 Ferrari Dino 246 GT cost around $13,000 in 1980 but was worth as much as $370,000 in 2023. A man in Tennessee bought the Aston Martin DB5 which was used in two of the James Bond films. This car cost just $7,000 in 1980 but sold in 2010 for an incredible $4.1 million! That is an incredible 20,000% increase! But neither"}]},{"body":"of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!\n[IMAGE_3]\n[IMAGE_4]","sourcePage":173,"blocks":[{"kind":"text","text":"of these cars compares to what is perhaps the best investment ever: A 1955 Mercedes-Benz 300SL cost about $36,000 in 1980 but is worth about $143 million now!"},{"kind":"text","text":"[IMAGE_3]"},{"kind":"text","text":"[IMAGE_4]"}]},{"body":"4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but\nremember, there are no guarantees.","sourcePage":173,"blocks":[{"kind":"text","text":"4 In sum, the prospect of making lots of money through investing is very exciting, but one must never forget that investing is a risky business. Gold prices rise, but they also fall. The classic car market also fluctuates and it is expensive to keep these cars in excellent condition. If you are clever and lucky, you may make a big profit – but"},{"kind":"text","text":"remember, there are no guarantees."}]},{"body":"¹fluctuate (v) to keep changing, especially in level or amount","sourcePage":173,"blocks":[{"kind":"text","text":"¹fluctuate (v) to keep changing, especially in level or amount"}]}],"B03-RW-U08-classroom:material:RW-M04":[{"body":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to","sourcePage":177,"blocks":[{"kind":"text","text":"1 In almost every country and every culture, parents work hard to try to give their children a better life than they had. For decades following the Second World War, this dream became a reality in many countries around the world. Possibly the best example is the Japanese 'economic miracle'. Thanks to a high rate of economic growth from the 1960s to"}]},{"body":"the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?","sourcePage":177,"blocks":[{"kind":"text","text":"the 1980s, it developed into one of the world's strongest economies. Yet in Japan, as in other developed countries, many people today are not able to enjoy a higher, or even the same standard of living as their parents did. What has happened? Why do many people feel poorer than they were 10 or 20 years ago?"}]},{"body":"2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on","sourcePage":177,"blocks":[{"kind":"text","text":"2 The answer is complicated, and every country tells a different story. The world's largest economy, the United States, provides a good example. One key factor which influences the standard of living is expenditure, which is the money you spend on the things that you need. From 2000 until 2015, Americans spent approximately 20% of their incomes on"}]},{"body":"housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food.","sourcePage":177,"blocks":[{"kind":"text","text":"housing, about 10% on food, about 8% on transport, and around 3% each on entertainment and health, but these costs have been rising steadily. They now must spend about 34% on housing and 13% on food."}]},{"body":"3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healthcare. In many cities worldwide, there is a serious shortage of houses and apartments to buy or rent. Healthcare costs also continue to rise as medicine and hospital care have become more expensive. Most recently, there have also\nbeen significant increases in food prices.","sourcePage":177,"blocks":[{"kind":"text","text":"3 In the United States, as in many other countries, the expenditures that are rising the fastest are housing and healthcare. In many cities worldwide, there is a serious shortage of houses and apartments to buy or rent. Healthcare costs also continue to rise as medicine and hospital care have become more expensive. Most recently, there have also"},{"kind":"text","text":"been significant increases in food prices."}]},{"body":"Figure 1","sourcePage":177,"blocks":[{"kind":"text","text":"Figure 1"}]},{"body":"U.S. Median Household Income\n[IMAGE_13]\nFigure 2\n[IMAGE_12]","sourcePage":177,"blocks":[{"kind":"text","text":"U.S. Median Household Income"},{"kind":"text","text":"[IMAGE_13]"},{"kind":"text","text":"Figure 2"},{"kind":"text","text":"[IMAGE_12]"}]},{"body":"4 However, expenditures are only half the picture. The other half is the money people earn, their income. In the United States, in general, incomes have also gone up (see Figure 1). Yet not all incomes are increasing at the same rate. For many people, they have not increased as much as expenditures. This means that their 'buying power' has","sourcePage":177,"blocks":[{"kind":"text","text":"4 However, expenditures are only half the picture. The other half is the money people earn, their income. In the United States, in general, incomes have also gone up (see Figure 1). Yet not all incomes are increasing at the same rate. For many people, they have not increased as much as expenditures. This means that their 'buying power' has"}]},{"body":"decreased. Figure 2 shows this increase in inequality. It shows change in income by group, from the bottom 20% to the top 20%. The top line shows the highest 5%. It is clear that the incomes of the higher income groups are rising the fastest. The incomes of the lower groups are rising more slowly. It is not surprising that they do not have a higher\nstandard of living than their parents.","sourcePage":177,"blocks":[{"kind":"text","text":"decreased. Figure 2 shows this increase in inequality. It shows change in income by group, from the bottom 20% to the top 20%. The top line shows the highest 5%. It is clear that the incomes of the higher income groups are rising the fastest. The incomes of the lower groups are rising more slowly. It is not surprising that they do not have a higher"},{"kind":"text","text":"standard of living than their parents."}]},{"body":"5 In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it","sourcePage":177,"blocks":[{"kind":"text","text":"5 In conclusion, the impact of economic forces is not the same for everyone. In the United States, rising prices have had the greatest impact on the people with lower incomes. They must pay more for necessities like food, healthcare and especially housing, and as a result, they have less money for education, investment and savings. This makes it"}]},{"body":"harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream.","sourcePage":177,"blocks":[{"kind":"text","text":"harder for the next generation to move up the economic ladder. For them, the dream of a better life than their parents is still only a dream."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer"
