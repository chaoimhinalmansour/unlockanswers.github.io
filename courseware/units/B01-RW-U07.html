bdab2225a076161a2fa9cf5dffa895474172a800cbd247bd3a272017369.png"],"provided":"This video is about","items":[{"id":"b2250.i01","label":"1","prompt":"This video is about","options":["a famous dessert chef from Lyon. He always wins a competition to make desserts.","the history of desserts and pastries in France. It shows a famous competition to make desserts."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"This video is about"},{"kind":"item","id":"b2250.i01","label":"1","prompt":"This video is about","options":["a famous dessert chef from Lyon. He always wins a competition to make desserts.","the history of desserts and pastries in France. It shows a famous competition to make desserts."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/614715eac9747eb954b116f4-L1RW-U07.mp4","captions":[{"start":0.78,"end":6.46,"text":"Walk down any shopping street in France and you will\nsee a patisserie,"},{"start":7.42,"end":13.26,"text":"a small shop where you can buy pastries and other\ndesserts."},{"start":17.12,"end":19.01,"text":"They look too good to eat."},{"start":22.16,"end":25.06,"text":"Dessert making became an art here in France."},{"start":25.06,"end":34.56,"text":"More than 250 years ago, the kings and queens of France\nasked their chefs to make special desserts for their\ntables."},{"start":37.08,"end":40.16,"text":"Their sweet pastries became part of French culture"},{"start":42.26,"end":48.32,"text":"and the French became famous for their delicious and\nbeautiful desserts."},{"start":50.24,"end":51,"text":"Today,"},{"start":51.38,"end":54.82,"text":"the art of making pastries is popular in many\ncountries."},{"start":57,"end":62.32,"text":"The best pastry chefs from around the world meet here\nin Lyon every two years."},{"start":67.9,"end":71.18,"text":"They come for the Pastry World Cup."},{"start":75.7,"end":77.98,"text":"It's a team competition."},{"start":78.86,"end":82.4,"text":"Each country's team includes three pastry chefs."},{"start":84.48,"end":85.72,"text":"One for chocolate,"},{"start":88.06,"end":90.1,"text":"one for ice and ice cream,"},{"start":91.88,"end":93.9,"text":"and one for sugar."},{"start":95.7,"end":98.97999999999999,"text":"Fans from each country come to the competition too."},{"start":100.75999999999999,"end":104.46000000000001,"text":"The teams have to make three large sculptures."},{"start":106.72,"end":107.74000000000001,"text":"One of chocolate,"},{"start":110.84,"end":111.75999999999999,"text":"one of ice,"},{"start":113.84,"end":115,"text":"and one of sugar."},{"start":116.97999999999999,"end":120.08,"text":"They also make four different kinds of dessert."},{"start":120.72,"end":124.78,"text":"They make all of these in ten hours over two days."},{"start":127.5,"end":130.18,"text":"The competition has many rules."},{"start":132.32,"end":134.56,"text":"The teams must work with an idea,"},{"start":135.08,"end":135.98,"text":"for example,"},{"start":136.34,"end":138,"text":"animals or weather."},{"start":139.62,"end":142.88,"text":"This year, the idea is climate change."},{"start":145.02,"end":149,"text":"The size and number of each dessert are very important\ntoo."},{"start":151.5,"end":154.2,"text":"Each team puts their work on one small table."},{"start":154.2,"end":157.24,"text":"The desserts must look good together."},{"start":158.36,"end":161.94,"text":"There is one judge from each of the countries in the\ncompetition."},{"start":164.98,"end":167.28,"text":"They eat the desserts and look at everything."},{"start":168.96,"end":171.06,"text":"They want to see new ideas"},{"start":171.98,"end":174.66,"text":"and eat delicious, beautiful,"},{"start":174.96,"end":176.28,"text":"perfect pastries."},{"start":178.12,"end":181,"text":"The first prize goes to the Japanese team."},{"start":185.1,"end":188.3,"text":"The competition began in 1989,"},{"start":189.78,"end":191.36,"text":"and France often wins."},{"start":193.26,"end":194.28,"text":"But this time,"},{"start":194.8,"end":196.04,"text":"France comes second."},{"start":199.78,"end":203.86,"text":"The Japanese team wins with their design called wind\nand lightness."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":55,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U07-question:b2251","book":1,"unit":7,"track":"RW","topic":"FOOD AND CULTURE","lesson":1,"order":6,"module":"WATCH AND LISTEN","ex":"5","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again and answer the questions.","pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/65617bdab2225a076161a2fa9cf5dffa895474172a800cbd247bd3a272017369.png"],"provided":"","items":[{"id":"b2251.i01","label":"1","prompt":"What two things do French patisseries sell? ____","options":[],"type":"qa/open"},{"id":"b2251.i02","label":"2","prompt":"French desserts are delicious. What's another reason they're famous? ____","options":[],"type":"qa/open"},{"id":"b2251.i03","label":"3","prompt":"Where do chefs come from for the Lyon competition? ____","options":[],"type":"qa/open"},{"id":"b2251.i04","label":"4","prompt":"How many days do teams have to make their desserts? ____","options":[],"type":"qa/open"},{"id":"b2251.i05","label":"5","prompt":"What do judges want to see in a competition dessert? ____","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials "id":"b2260.i03","label":"c","prompt":"____ There are different kinds of tea made from tea leaves.","options":[],"type":"gap/open"},{"kind":"item","id":"b2260.i04","label":"d","prompt":"____ In Kuala Lumpur, pulled tea is special.","options":[],"type":"gap/open"},{"kind":"item","id":"b2260.i05","label":"e","prompt":"____ Tea is very popular.","options":[],"type":"gap/open"}]],"courseMaterials":[{"id":"B01-RW-U07-classroom:material:RW-M03","title":"READING 1","text":"# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.\n4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.\n7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","screens":["# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.","4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.","7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]"],"sources":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3fa94929db11467375e724a0196f6dd20d77b7e910f11facf094b2ce4e5497.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d5d8fce1984f643ccc1858ddf64c1d36afc6ba3eba22bfbd414fa69e03529410.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 5–7 b 3 c 2 d 4 e 1","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":56,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U07-question:b2261","book":1,"unit":7,"track":"RW","topic":"FOOD AND CULTURE","lesson":1,"order":12,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the text again. Write T (true) or F (false) next to the statements. Correct the false statements.","pages":[152],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/50811b2520b258320b78c8c21749884ceb3e6689b4574517b9c1392bb40 ea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.\n4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.\n7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","screens":["# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 ou and tastes good with roti canai – a kind of bread.\n4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.\n7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","screens":["# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.","4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.","7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]"],"sources":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3fa94929db11467375e724a0196f6dd20d77b7e910f11facf094b2ce4e5497.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d5d8fce1984f643ccc1858ddf64c1d36afc6ba3eba22bfbd414fa69e03529410.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github ntries.\n## ali.the.foodie\nMy mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!\n## melbournestudentguide\nAustralian cuisine\n298 Likes\nComments\nIf you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great fish and many other .\n#crocodilecurry #eatcroccodilemeat\n#delicious #tryaustraliancuisine\n## jasons_cooking\nWhat? I'm not sure it's for me 😊. How do you cook it?\n## fishhh.55\nI want to try it.\nHow do you cook it?\n## melbournestudentguide\nCambodian cuisine\n401 Likes\nComments\nAt a Cambodian restaurant, there are many types of . Cambodians like fish with rice. Cambodian are served with a lot of vegetables. They are very popular in Cambodian cuisine. One famous is amok trey. Cambodians prepare amok trey with fish, nuts, coconut milk and egg. There are many tasty , but this is one of the best.\n#amoktrey #cambodianfood #fish #rice\n#tasty #trycambodiancuisine\n#cambodianfood #bestfoodinmelbourne\n#worldcuisines\n## arun_266\nI make it with coconut milk and nuts. It's delicious 😊.","screens":["## melbournestudentguide\nArab cuisine\n322 Likes\nComments\nAt an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant.\nIn addition to the many flavourful meat , you can get many delicious vegetable /c735105a953f4d8574afdae6c989e097094dd043/content/b259fc9283c0520573c7519b41c39421a7f945a430ea6c580b0c194381bf3de3.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"pastry","pos":"(n)","definition":"a small sweet baked cake","example":"I bought a sweet pastry at the bakery.","wordAudio":"pastry","cardWord":false},{"term":"dessert","pos":"(n)","definition":"sweet food that is eaten after the main part of a meal","example":"We had fruit for dessert.","wordAudio":"dessert","cardWord":false},{"term":"chef","pos":"(n)","definition":"somebody who is the main cook in a restaurant","example":"The chef made a soup with fresh vegetables.","wordAudio":"chef","cardWord":false},{"term":"delicious","pos":"(adj)","definition":"food that smells or tastes extremely good","example":"The bread smelled delicious as it came out of the oven.","wordAudio":"delicious","cardWord":false},{"term":"competition","pos":"(n)","definition":"an organized event in which people try to win a prize by being the best","example":"She won first prize in the swimming competition.","wordAudio":"competition","cardWord":false},{"term":"fan","pos":"(n)","definition":"somebody who admires and supports a famous person or sport","example":"I have been a football fan since I was six.","wordAudio":"fan","cardWord":false},{"term":"sculpture","pos":"(n)","definition":"a piece of art that is usually made from wood or stone","example":"The artist made a sculpture out of wood.","wordAudio":"sculpture","cardWord":false},{"term":"judge","pos":"(n)","definition":"somebody who decides which person or thing wins a competition","example":"The judge chose the best painting in the competition.","wordAudio":"judge","cardWord":false}]]}},{"id":"B01-RW-U07-classroom:video","book":1,"unit":7,"track":"RW","topic":"FOOD AND CULTURE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/65617bdab2225a076161a2fa9cf5dffa895474172a800cbd247bd3a272017369.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/614715eac9747eb954b116f4-L1RW-U07.mp4","captions":[{"start":0.78,"end":6.46,"text":"Walk down any shopping street in France and you will\nsee a patisserie,"},{"start":7.42,"end":13.26,"text":"a small shop where you can buy pastries and other\ndesserts."},{"start":17.12,"end":19.01,"text":"They look too good to eat."},{"start":22.16,"end":25.06,"text":"Dessert making became an art here in France."},{"start":25.06,"end":34.56,"text":"More than 250 years ago, the kings and queens of France\nasked their chefs to make special desserts for their\ntables."},{"start":37.08,"end":40.16,"text":"Their sweet pastries became part of French culture"},{"start":42.26,"end":48.32,"text":"and the French became famous for their delicious and\nbeautiful desserts."},{"start":50.24,"end":51,"text":"Today,"},{"start":51.38,"end":54.82,"text":"the art of making pastries is popular in many\ncountries."},{"start":57,"end":62.32,"text":"The best pastry chefs from around the world meet here\nin Lyon every two years."},{"start":67.9,"end":71.18,"text":"They come for the Pastry World Cup."},{"start":75.7,"end":77.98,"text":"It's a team competition."},{"start":78.86,"end":82.4,"text":"Each country's team includes three pastry chefs."},{"start":84.48,"end":85.72,"text":"One for chocolate,"},{"start":88.06,"end":90.1,"text":"one for ice and ice cream,"},{"start":91.88,"end":93.9,"text":"and one for sugar."},{"start":95.7,"end":98.97999999999999,"text":"Fans from each country come to the competition too."},{"start":100.75999999999999,"end":104.46000000000001,"text":"The teams have to make three large sculptures."},{"start":106.72,"end":107.74000000000001,"text":"One of chocolate,"},{"start":110.84,"end":111.75999999999999,"text":"one of ice,"},{"start":113.84,"end":115,"text":"and one of sugar."},{"start":116.97999999999999,"end":120.08,"text":"They also make four different kinds of dessert."},{"start":120.72,"end":124.78,"text":"They make all of these in ten hours over two days."},{"start":127.5,"end":130.18,"text":"The competition has many rules."},{"start":132.32,"end":134.56,"text":"The teams must work with an idea,"},{"start":135.08,"end":135.98,"text":"for example,"},{"start":136.34,"end":138,"text":"animals or weather."},{"start":139.62,"end":142.88,"text":"This year, the idea is climate change."},{"start":145.02,"end":149,"text":"The size and number of each dessert are very important\ntoo."},{"start":151.5,"end":154.2,"text":"Each team puts their work on one small table."},{"start":154.2,"end":157.24,"text":"The desserts must look good together."},{"start":158.36,"end":161.94,"text":"There is one judge from each of the countries in the\ncompetition."},{"start":164.98,"end":167.28,"text":"They eat the desserts and look at everything."},{"start":168.96,"end":171.06,"text":"They want to see new ideas"},{"start":171.98,"end":174.66,"text":"and eat delicious, beautiful,"},{"start":174.96,"end":176.28,"text":"perfect pastries."},{"start":178.12,"end":181,"text":"The first prize goes to the Japanese team."},{"start":185.1,"end":188.3,"text":"The competition began in 1989,"},{"start":189.78,"end":191.36,"text":"and France often wins."},{"start":193.26,"end":194.28,"text":"But this time,"},{"start":194.8,"end":196.04,"text":"France comes second."},{"start":199.78,"end":203.86,"text":"The Japanese team wins with their design called wind\nand lightness."}],"launchInline":true}},{"id":"B01-RW-U07-classroom:material:RW-M03","book":1,"unit":7,"track":"RW","topic":"FOOD AND CULTURE","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3fa94929db11467375e724a0196f6dd20d77b7e910f11facf094b2ce4e5497.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.","sourcePage":151},{"body":"4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.","sourcePage":151},{"body":"7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","sourcePage":151}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U07-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Tea: a world history","pages":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3fa94929db11467375e724a0196f6dd20d77b7e910f11facf094b2ce4e5497.png","width":772,"height":1040}],"source":151,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.","sourcePage":151},{"body":"4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.","sourcePage":151},{"body":"7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","sourcePage":151}],"text":"# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.\n4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.\n7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","media":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d5d8fce1984f643ccc1858ddf64c1d36afc6ba3eba22bfbd414fa69e03529410.mp3"},"original":{"id":"B01-RW-U07-material:RW-M03","entry":"material:RW-M03","unitId":"B01-RW-U07","book":1,"track":"RW","unit":7,"title":"Tea: a world history","kind":"material","pages":[151],"sourceImages":[{"page":151,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2d3fa94929db11467375e724a0196f6dd20d77b7e910f11facf094b2ce4e5497.png","viewEvidenceReported":true}],"text":"# Tea: a world history\n\n## INTRODUCTION: THE WORLD IN A TEACUP\n\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?\n2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.\n3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.\n\n4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.\n5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n\n[IMAGE_1]\na tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n\n[IMAGE_3]\n\n6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.\n7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n\n[IMAGE_4]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2258"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d5d8fce1984f643ccc1858ddf64c1d36afc6ba3eba22bfbd414fa69e03529410.mp3","continueOnPage":true}},{"id":"B01-RW-U07-classroom:material:RW-M04","book":1,"unit":7,"track":"RW","topic":"FOOD AND CULTURE","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9f0dd2964044af58093ad596af576eede0b51d5c57a995b74478ba8d8c922bc9.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"## melbournestudentguide\nArab cuisine\n322 Likes\nComments\nAt an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant.\nIn addition to the many flavourful meat , you can get many delicious vegetable .\n#kabsa #tryarabcuisine\n#arabfoodinmelbourne\n## nancy_loves_food\nIt looks delicious!\nI ♥ food from Arab countries.\n## ali.the.foodie\nMy mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!\n## melbournestudentguide\nAustralian cuisine\n298 Likes\nComments","sourcePage":155},{"body":"If you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great fish and many other .\n#crocodilecurry #eatcroccodilemeat\n#delicious #tryaustraliancuisine\n## jasons_cooking\nWhat? I'm not sure it's for me 😊. How do you cook it?\n## fishhh.55\nI want to try it.\nHow do you cook it?\n## melbournestudentguide\nCambodian cuisine\n401 Likes\nComments\nAt a Cambodian restaurant, there are many types of . Cambodians like fish with rice. Cambodian are served with a lot of vegetables. They are very popular in Cambodian cuisine. One famous is amok trey. Cambodians prepare amok trey with fish, nuts, coconut milk and egg. There are many tasty , but this is one of the best.","sourcePage":155},{"body":"#amoktrey #cambodianfood #fish #rice\n#tasty #trycambodiancuisine\n#cambodianfood #bestfoodinmelbourne\n#worldcuisines\n## arun_266\nI make it with coconut milk and nuts. It's delicious 😊.","sourcePage":155}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U07-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"melbournestudentguide","pages":[{"page":155,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9f0dd2964044af58093ad596af576eede0b51d5c57a995b74478ba8d8c922bc9.png","width":772,"height":1040}],"source":155,"embeddedIn":null,"photo":null,"clearPages":[{"body":"## melbournestudentguide\nArab cuisine\n322 Likes\nComments\nAt an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant.\nIn addition to the many flavourful meat , you can get many delicious vegetable .\n#kabsa #tryarabcuisine\n#arabfoodinmelbourne\n## nancy_loves_food\nIt looks delicious!\nI ♥ food from Arab countries.\n## ali.the.foodie\nMy mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!\n## melbournestudentguide\nAustralian cuisine\n298 Likes\nComments","sourcePage":155},{"body":"If you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great fish and many other .\n#crocodilecurry #eatcroccodilemeat\n#delicious #tryaustraliancuisine\n## jasons_cooking\nWhat? I'm not sure it's for me 😊. How do you cook it?\n## fishhh.55\nI want to try it.\nHow do you cook it?\n## melbournestudentguide\nCambodian cuisine\n401 Likes\nComments\nAt a Cambodian restaurant, there are many types of . Cambodians like fish with rice. Cambodian are served with a lot of vegetables. They are very popular in Cambodian cuisine. One famous is amok trey. Cambodians prepare amok trey with fish, nuts, coconut milk and egg. There are many tasty , but this is one of the best.","sourcePage":155},{"body":"#amoktrey #cambodianfood #fish #rice\n#tasty #trycambodiancuisine\n#cambodianfood #bestfoodinmelbourne\n#worldcuisines\n## arun_266\nI make it with coconut milk and nuts. It's delicious 😊.","sourcePage":155}],"text":"## melbournestudentguide\nArab cuisine\n322 Likes\nComments\nAt an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant.\nIn addition to the many flavourful meat , you can get many delicious vegetable .\n#kabsa #tryarabcuisine\n#arabfoodinmelbourne\n## nancy_loves_food\nIt looks delicious!\nI ♥ food from Arab countries.\n## ali.the.foodie\nMy mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!\n## melbournestudentguide\nAustralian cuisine\n298 Likes\nComments\nIf you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great fish and many other .\n#crocodilecurry #eatcroccodilemeat\n#delicious #tryaustraliancuisine\n## jasons_cooking\nWhat? I'm not sure it's for me 😊. How do you cook it?\n## fishhh.55\nI want to try it.\nHow do you cook it?\n## melbournestudentguide\nCambodian cuisine\n401 Likes\nComments\nAt a Cambodian restaurant, there are many types of . Cambodians like fish with rice. Cambodian are served with a lot of vegetables. They are very popular in Cambodian cuisine. One famous is amok trey. Cambodians prepare amok trey with fish, nuts, coconut milk and egg. There are many tasty , but this is one of the best.\n#amoktrey #cambodianfood #fish #rice\n#tasty #trycambodiancuisine\n#cambodianfood #bestfoodinmelbourne\n#worldcuisines\n## arun_266\nI make it with coconut milk and nuts. It's delicious 😊.","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ececbc7064c31cd34c4ec407bdd3a20bed4f48ade16e8907247856fb159d9449.mp3"},"original":{"id":"B01-RW-U07-material:RW-M04","entry":"material:RW-M04","unitId":"B01-RW-U07","book":1,"track":"RW","unit":7,"title":"melbournestudentguide","kind":"material","pages":[155],"sourceImages":[{"page":155,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9f0dd2964044af58093ad596af576eede0b51d5c57a995b74478ba8d8c922bc9.png","viewEvidenceReported":true}],"text":"## melbournestudentguide\n\nArab cuisine\n\n322 Likes\nComments\n\nAt an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant.\n\nIn addition to the many flavourful meat , you can get many delicious vegetable .\n\n#kabsa #tryarabcuisine\n#arabfoodinmelbourne\n\n## nancy_loves_food\n\nIt looks delicious!\n\nI ♥ food from Arab countries.\n\n## ali.the.foodie\n\nMy mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!\n\n## melbournestudentguide\n\nAustralian cuisine\n\n298 Likes\nComments\n\nIf you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great fish and many other .\n\n#crocodilecurry #eatcroccodilemeat\n#delicious #tryaustraliancuisine\n\n## jasons_c n":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B01-RW-U07-classroom:material:RW-M03":[{"body":"# Tea: a world history\n## INTRODUCTION: THE WORLD IN A TEACUP\n1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?","sourcePage":151,"blocks":[{"kind":"text","text":"# Tea: a world history"},{"kind":"text","text":"## INTRODUCTION: THE WORLD IN A TEACUP"},{"kind":"text","text":"1 Tea is tasty and good for you. It is also one of the most popular drinks around the world. But what is tea? And why is it so popular?"}]},{"body":"2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour.","sourcePage":151,"blocks":[{"kind":"text","text":"2 All tea comes from tea leaves, but tea is not always the same. There are many kinds of tea. You can drink black tea, green tea, white tea or fruit tea. Each type of tea has a different taste and a different colour."}]},{"body":"3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread.","sourcePage":151,"blocks":[{"kind":"text","text":"3 The history of tea begins in Asia. In China, Korea and Japan, tea is still very important today. In Japan, it can take many hours to prepare and drink tea with your guests. In Malaysia, a popular drink at breakfast is teh tarik ('pulled tea'). Malaysians say it is good for you and tastes good with roti canai – a kind of bread."}]},{"body":"4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times.","sourcePage":151,"blocks":[{"kind":"text","text":"4 Tourists in Kuala Lumpur like watching the tea sellers make 'pulled tea'. The tea sellers pour hot water on black tea. After five minutes, they add sugar and milk. Then they 'pull' the tea – they pour the tea from one cup to another many times."}]},{"body":"5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar.\n[IMAGE_1]","sourcePage":151,"blocks":[{"kind":"text","text":"5 In many countries you must have a special kettle $^{1}$ to make tea. People in different countries also like to add different things to their tea. For example, people in Türkiye use a çaydanlık to make black tea. A çaydanlık has two kettles: one for water and one for the tea. Many Turkish people drink tea in a glass with some sugar."},{"kind":"text","text":"[IMAGE_1]"}]},{"body":"a tea seller prepares tea in Kuala Lumpur\n[IMAGE_2]\na Turkish çaydanlık set\n[IMAGE_3]","sourcePage":151,"blocks":[{"kind":"text","text":"a tea seller prepares tea in Kuala Lumpur"},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"a Turkish çaydanlık set"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey.","sourcePage":151,"blocks":[{"kind":"text","text":"6 Karak is a tea that is popular in Arab countries. It is made with cardamon, ginger, milk and sugar. In the United Kingdom, people usually add some milk and sugar. They eat biscuits with their tea. In the United States, tea is popular with honey."}]},{"body":"7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour.\n[IMAGE_4]","sourcePage":151,"blocks":[{"kind":"text","text":"7 In Japan, there is a special ceremony $^{3}$ for drinking tea. Japanese people have a tea ceremony when people come to visit. They use green tea and they like drinking the tea in a special room. The room is often near a garden. There is usually some sweet food to eat. The ceremony takes more than an hour."},{"kind":"text","text":"[IMAGE_4]"}]}],"B01-RW-U07-classroom:material:RW-M04":[{"body":"## melbournestudentguide\nArab cuisine\n322 Likes\nComments","sourcePage":155,"blocks":[{"kind":"text","text":"## melbournestudentguide"},{"kind":"text","text":"Arab cuisine"},{"kind":"text","text":"322 Likes"},{"kind":"text","text":"Comments"}]},{"body":"At an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It","sourcePage":155,"blocks":[{"kind":"text","text":"At an Arab restaurant, you can find delicious meat . Two popular are shawarma and kabsa. Shawarma is a savoury meat . The meat is served in pita bread with vegetables. Kabsa is a popular meal in many Arab countries and it is very popular in Saudi Arabia. Kabsa is a with rice, meat and vegetables. There are many different ways to prepare kabsa. It"}]},{"body":"can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant.\nIn addition to the many flavourful meat , you can get many delicious vegetable .\n#kabsa #tryarabcuisine\n#arabfoodinmelbourne","sourcePage":155,"blocks":[{"kind":"text","text":"can be served with onions, chillies and other spices. If you like meat , you will enjoy your meal at an Arab restaurant."},{"kind":"text","text":"In addition to the many flavourful meat , you can get many delicious vegetable ."},{"kind":"text","text":"#kabsa #tryarabcuisine"},{"kind":"text","text":"#arabfoodinmelbourne"}]},{"body":"## nancy_loves_food\nIt looks delicious!\nI ♥ food from Arab countries.\n## ali.the.foodie\nMy mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!","sourcePage":155,"blocks":[{"kind":"text","text":"## nancy_loves_food"},{"kind":"text","text":"It looks delicious!"},{"kind":"text","text":"I ♥ food from Arab countries."},{"kind":"text","text":"## ali.the.foodie"},{"kind":"text","text":"My mom is from Lebanon. She makes the best kabsa, but she puts too many chillies 🍒 and onions 👍 in it so my friends can't eat it 😂!"}]},{"body":"## melbournestudentguide\nAustralian cuisine\n298 Likes\nComments","sourcePage":155,"blocks":[{"kind":"text","text":"## melbournestudentguide"},{"kind":"text","text":"Australian cuisine"},{"kind":"text","text":"298 Likes"},{"kind":"text","text":"Comments"}]},{"body":"If you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great\nfish and many other .","sourcePage":155,"blocks":[{"kind":"text","text":"If you are in Australia, you must try a crocodile or kangaroo ! Many Australian restaurants serve crocodile curry. Crocodile meat is tasty and very good for you. (It is better that you eat crocodile than a crocodile eats you!) Kangaroo meat is also good for you. Kangaroo burgers are served on a type of bread. Australian restaurants also serve great"},{"kind":"text","text":"fish and many other ."}]},{"body":"#crocodilecurry #eatcroccodilemeat\n#delicious #tryaustraliancuisine\n## jasons_cooking\nWhat? I'm not sure it's for me 😊. How do you cook it?\n## fishhh.55\nI want to try it.","sourcePage":155,"blocks":[{"kind":"text","text":"#crocodilecurry #eatcroccodilemeat"},{"kind":"text","text":"#delicious #tryaustraliancuisine"},{"kind":"text","text":"## jasons_cooking"},{"kind":"text","text":"What? I'm not sure it's for me 😊. How do you cook it?"},{"kind":"text","text":"## fishhh.55"},{"kind":"text","text":"I want to try it."}]},{"body":"How do you cook it?\n## melbournestudentguide\nCambodian cuisine\n401 Likes\nComments","sourcePage":155,"blocks":[{"kind":"text","text":"How do you cook it?"},{"kind":"text","text":"## melbournestudentguide"},{"kind":"text","text":"Cambodian cuisine"},{"kind":"text","text":"401 Likes"},{"kind":"text","text":"Comments"}]},{"body":"At a Cambodian restaurant, there are many types of . Cambodians like fish with rice. Cambodian are served with a lot of vegetables. They are very popular in Cambodian cuisine. One famous is amok trey. Cambodians prepare amok trey with fish, nuts, coconut milk and egg. There are many tasty , but this is one of the best.","sourcePage":155,"blocks":[{"kind":"text","text":"At a Cambodian restaurant, there are many types of . Cambodians like fish with rice. Cambodian are served with a lot of vegetables. They are very popular in Cambodian cuisine. One famous is amok trey. Cambodians prepare amok trey with fish, nuts, coconut milk and egg. There are many tasty , but this is one of the best."}]},{"body":"#amoktrey #cambodianfood #fish #rice\n#tasty #trycambodiancuisine\n#cambodianfood #bestfoodinmelbourne\n#worldcuisines\n## arun_266\nI make it with coconut milk and nuts. It's delicious 😊.","sourcePage":155,"blocks":[{"kind":"text","text":"#amoktrey #cambodianfood #fish #rice"},{"kind":"text","text":"#tasty #trycambodiancuisine"},{"kind":"text","text":"#cambodianfood #bestfoodinmelbourne"},{"kind":"text","text":"#worldcuisines"},{"kind":"text","text":"## arun_266"},{"kind":"text","text":"I make it with coconut milk and nuts. It's delicious 😊."}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}]},{"B01-LS-U05-question:b1215":{"rows":{},"basis":"按本题教师书改错键回看前题的原始错误陈述。保留原句，在其下方揭示改正句。","displayPages":[[{"kind":"item","id":"b1215.review2","label":"2","prompt":"She is at university now.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She wants to go to university next year."}},{"kind":"item","id":"b1215.review3","label":"3","prompt":"Beatrice knows the best subject to study.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't know what subject to study."}},{"kind":"item","id":"b1215.review6","label":"6","prompt":"Beatrice decides what to do at the end of the conversation.","options":[],"type":"choice/closed","answer":{"mode":"status","answer":"F","correction":"She doesn't decide what to do, but she gets some advice from the careers adviser."}}]],"rewriteKey":""},"B01-LS-U05-question:b1262":{"rows":{},"basis":"实页回读原表格和任务指令。保留全部表格、印刷示范和学生作答位置，合并提取时重复生成的单独答题行。","displayPages":[[{"kind":"table","rows":[[{"text":"criteria","header":false,"colspan":1,"rowspan":1},{"text":"Inesh","header":false,"colspan":1,"rowspan":1},{"text":"Morena","header":false,"colspan":1,"rowspan":1},{"text":"Darren","header":false,"colspan":1,"rowspan":1}],[{"text":"has experience in a
