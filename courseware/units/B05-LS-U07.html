":"Watch the video. Work with a partner and discuss whether your ideas in Exercise 2 were mentioned. Having watched the video, do you still think your facts and opinions are correct?","pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/354447d1664989e40fa31e8811dbd60b350e578e00c520fb398b9625c01c184a.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U07-question:b7994","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[148]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/8827a0fd60c6028ff3b5afcc-L5LS-U07.mp4","captions":[{"start":0,"end":2.78,"text":"In the 1930s,"},{"start":3.08,"end":5.64,"text":"food production began to change dramatically."},{"start":6.38,"end":8.42,"text":"The mechanization of manufacturing,"},{"start":8.84,"end":11.6,"text":"combined with the introduction of additives,"},{"start":12.08,"end":14.24,"text":"meant that food could be stored for longer."},{"start":15.26,"end":18.32,"text":"The era of processed food had truly begun."},{"start":19.46,"end":25.1,"text":"Today, the majority of all food we buy and cook is\nprocessed to some degree."},{"start":25.1,"end":26.7,"text":"For example,"},{"start":27.34,"end":28.66,"text":"ingredients such as flour,"},{"start":29.22,"end":29.88,"text":"olive oil,"},{"start":30.2,"end":31.84,"text":"and canned tomatoes are"},{"start":31.84,"end":32.14,"text":"no"},{"start":32.14,"end":33.9,"text":"longer in their raw,"},{"start":34.32,"end":35.42,"text":"natural states."},{"start":36.4,"end":38.26,"text":"But since the start of the century,"},{"start":38.58,"end":43.04,"text":"we have seen the rise of ultra -processed food, or UPF."},{"start":43.8,"end":46,"text":"UPF is designed to be cheap,"},{"start":46.44,"end":46.9,"text":"convenient,"},{"start":47.3,"end":48.66,"text":"and often ready to eat."},{"start":48.66,"end":57.02,"text":"Little remains in its whole original form after the\nmanufacturing process changes the nature of the\ningredients,"},{"start":57.42,"end":60.26,"text":"with additives being used to improve texture,"},{"start":60.64,"end":62.02,"text":"appearance, and flavor."},{"start":63.12,"end":70.16,"text":"UPF is high in salt, fat, and added sugar, and lacks\nessential vitamins and dietary fiber."},{"start":70.16,"end":78.44,"text":"Studies have shown that eating it raises the risk of\nhealth problems like high blood pressure and heart\nconditions."},{"start":79.84,"end":81.62,"text":"So how can people avoid it?"},{"start":82.24,"end":86.4,"text":"Is it simply a case of not buying anything known to be\nunhealthy,"},{"start":86.92,"end":88.64,"text":"such as microwave -ready meals?"},{"start":90.44,"end":91.12,"text":"Unfortunately,"},{"start":91.46000000000001,"end":92.64,"text":"it isn't that simple."},{"start":93.42,"end":94.06,"text":"In fact,"},{"start":94.38,"end":98.24000000000001,"text":"there are even issues with products sold as healthy\nalternatives."},{"start":98.24000000000001,"end":104.3,"text":"Many companies today manufacture food solely from plant\n-based ingredients."},{"start":105.08,"end":105.53999999999999,"text":"However,"},{"start":105.86,"end":110.4,"text":"reproducing the texture and appearance of a burger, for\nexample, or cheese,"},{"start":110.88,"end":114.18,"text":"can only be achieved through ultra -processing\ntechniques."},{"start":115.8,"end":122.8,"text":"And since plant -based foods contain high levels of\nadditives and saturated fat, as found in coconut oil,"},{"start":123.22,"end":126.36,"text":"they frequently come into the ultra -processed\ncategory."},{"start":127.4,"end":136.16,"text":"Preserving and processing food to give it a longer life\nor to improve its taste is nothing new, nor is it\nnecessarily harmful."},{"start":137.06,"end":145.72,"text":"But while modern manufacturers continue to make long\n-lasting food that appeals to a wide range of\nlifestyles and budgets,"},{"start":146.42000000000002,"end":153.46,"text":"further research is needed to better understand how\nultra -processed foods and drinks affect our bodies."},{"start":154.38,"end":155.14,"text":"Overall,"},{"start":155.8,"end":158.14,"text":"fresh food, if affordable and available,"},{"start":158.48,"end":159.88,"text":"is the ideal option."}]}],"courseAnswer":{"kind":"model-excerpt","text":"The film suggested that the industrialization\nof food began in the 1930s, so I think we\ncan infer from that that UPF didn’t exist\nbefore that, as I expected. It also said that\n‘the majority’ of food eaten is processed,\nso it is likely that consumption has been\nincreasing over time.\nNeither of the opinions I suggested were\nexplicitly confirmed or contradicted.\nHowever, the film seems to take a negative\nview of UPF, and so it is likely the narrator\nwould agree with the views I suggested.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":54,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8000","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","l :[],"courseAnswer":{"kind":"model-excerpt","text":"1 T Cooked chicken breast contains 32g\nof protein per 100g. Grilled salmon\ncontains 25g of protein per 100g.\nFoods other than meat and fish contain\nmuch less, for example bread contains\n8g of protein per 100g.\n2 F Approximately one third of all crops\ngrown on the planet is fed to animals.\n3 F The recommendation is for anyone who\neats over 90g of red and processed meat\nper day to reduce consumption to 70g.\n4 T Globally, meat production has\nquadrupled in the last sixty years.\n5 F although this is controversial.\n6 T Cows are responsible for large\namounts of methane, a greenhouse gas\nresponsible for global warming.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":55,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8007","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":9,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work in small groups and discuss the questions.","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3dfbba4c45a91e6e8f5f3fbb48d0800f58c83cedc0b5afefc062f2342801768f.png"],"provided":"","items":[{"id":"b8007.i01","label":"1","prompt":"What reasons are there for having concerns about eating meat?","options":[],"type":"discuss/open"},{"id":"b8007.i02","label":"2","prompt":"What are your own views on the question of eating meat, and to what extent is your behaviour consistent with your views?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8007.i01","label":"1","prompt":"What reasons are there for having concerns about eating meat?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8007.i02","label":"2","prompt":"What are your own views on the question of eating meat, and to what extent is your behaviour consistent with your views?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 People may object to the cruelty of\nkilling an animal, which they may\nbelieve to be wrong for religious or\nethical reasons. They may also be\nconcerned about the impact of meat on\nhuman health, given the high amounts\nof fat and antibiotics found in meat, and\nthe link between meat consumption\nand diseases such as bowel cancer.\nPeople may also be concerned about\nthe environmental impact of meat\nproduction, from land and water use\nto greenhouse gas emissions from\nlivestock, especially cows.\n2 I have great sympathy with the views of\nvegans and others who oppose eating\nmeat, but I am afraid that because I like\nmeat, I eat it despite my misgivings. /\nI have no concerns about eating meat,\nI think it’s healthier than processed\nalternatives to meat. I only buy meat\nwhich is produced locally so I think it’s\nbetter for the environment than some\nvegan products which are shipped from\nthe other side of the world. / In my\nculture it is common not to eat meat\nor other animal products for religious\nreasons. I have a very healthy diet\nand my grandparents, who ate the\nsame way, lived long, healthy lives.\nHowever the younger generations\neat meat and other animal products,\nwhich has an effect on their health and\nthe environment.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":55,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8008","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":10,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. When you think about the future of meat, how likely and how desirable do you think scenarios 1–6 are? Write the number in the appropriate place on the matrix.","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3dfbba4c45a91e6e8f5f3fbb48d0800f58c83cedc0b5afefc062f2342801768f.png"],"provided":"1 higher taxes on meat to reduce consumption\n2 new plant-based meat alternatives\n3 greater popularity of cultivated¹ meat\n4 government campaigns to encourage veganism\n5 improved welfare for animals on farms\n6 more efficient farming so animals reach full size more quickly\n¹ cultivated meat = meat grown in a lab from a few animal cells","items":[],"layout  trade, especially sales\nof live animals (US National Library of Medicine)\nmay reduce zoonotic disease among humans\nenvironmental\nimpact\nlivestock farming has a devastating environmental effect\n(deforestation, water pollution, greenhouse gases &\nhabitat loss)\nUniversity of California Davis suggest cultivated meat may\nuse more energy than beef farming.\ntraditional farming (especially cows) cause up to 14%\nof global carbon emissions (UN Food and\nAgricultural Organization)\ncultivated meat may actually not be any better for the\nenvironment than traditional meat.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":55,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8019","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":17,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"instruction":"7.3 Listen to the sentences and write the contrasting information.","pages":[153],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/debc0fd1fc86ea3b67188331e260c6fcf940f1bb7206dd0afab90789c63c7b0f.png"],"provided":"1 how long a farm animal takes to grow: month e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":55,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8021","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":19,"module":"LISTENING 1","ex":"12","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Remember the questions the lecturer ended the talk with and discuss your answers, using your notes and your own ideas.","pages":[154],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/24be4cc672ac3991857d0e7938f453066bc78bbd4f5abd42c64f2a4c991a4694.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"If more meat from labs means less meat\nfrom fields, would this then free up large\nareas of land which are no longer needed\nfor livestock farming, and what uses could\nor should this land be put to?\n– My hope is that any land which is freed\nup could be used for the restoration of\nwildlife habitats. Another benefit of this\ncould be that zoonotic diseases become\nless common.\nWhat standards of hygiene, food quality\nand so on would need to be in place, to\nensure that cultivated meat is a force for\ngood in the future?\n– I would hope that, especially while the\nindustry is still growing, all lab-grown\nmeat is subjected to very rigorous\nchecks to ensure that it is safe for human\nconsumption. I think we also need to\nensure that cultivated meat offers the\nsame nutritional benefits as traditional\nmeat and that people have equal access\nto it.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d857  problems such as obesity.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8024.i01","label":"1","prompt":"I'm thinking about becoming a vegan. Several of my friends are thinking of going vegan as well.","options":[],"type":"gap/open"},{"kind":"item","id":"b8024.i02","label":"2","prompt":"Humans used to have to hunt for food. But these days, there's no need to hunt.","options":[],"type":"gap/open"},{"kind":"item","id":"b8024.i03","label":"3","prompt":"Many junk foods like chocolate bars are highly processed. Many foods traditionally seen as being healthy, such as cereals and yoghurts, are highly processed too.","options":[],"type":"gap/open"},{"kind":"item","id":"b8024.i04","label":"4","prompt":"I support increasing taxes on sugary foods and drinks, because measures like this have the potential to reduce the incidence of diet-based health problems such as obesity.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"2 Humans used to have to hunt for food. But these days,\nthere’s no such need.\n3 Many junk foods like chocolate bars are highly\nprocessed, and so are many foods traditionally seen as\nbeing healthy, such as cereals and yoghurts.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":55,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8025","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":21,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Discuss the extent to which the sentences in Exercise 1 reflect your own views and behaviour.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057aa9e9f42a0d958af97db05d17bea7374a66752b30d405140826d474766013.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U07-question:b8024","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 1","pages":[154]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I like the idea of being vegan or\nvegetarian. I think I would be happy\nto eat other foodstuffs as long as they\nwere interesting and tasty. However,\nas I’m not much of a cook, I know I\nwouldn’t be happy with what I was\neating, so wouldn’t stick to it! I have\none friend who is vegan but most of\nmy other friends are not interested in\ngiving up meat. Although they always\ntry to make sure there is a vegan option\navailable for her.\n2 This very much depends on where you\nlive. Of course it is true in cities, but in\nrural communities, I think hunting stills\nplays a role. Not all animals are farmed,\nsuch as rabbits and some types of birds,\nand in some cases the numbers of these\nare very high and need to be managed.\n3 I think there are a lot of processed\nyoghurts and cereals but not all of them\nare highly processed, you can find\nsimple versions of these products that\ndon’t have many additives.\n4 I’m not convinced by this, as I think\nsugary foods are so cheap that even if\nthere was a sugar tax, they would still\nbe affordable.\n5 I have to confess that I don’t always\nget five portions of fresh fruit or veg\neach day. I hadn’t heard about this\nrecommendation before. I think it\nprobably varies between countries. / I\nprobably eat more than five portions a\nday as the typical diet in my country is\nrich in fruit and vegetables. That said,\nthis is changing and I think many people\nthat I know probably eat a lot less\nthan this.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8026","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Think of one human behaviour which affects or is affected by health (e.g. sleep patterns, diet, life expectancy, etc.). Then write three new sentences about the topic with so or such to show cohesion.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057aa9e9f42a0d958af97db05d17bea7374a66752b30d405140826d474766013.png"],"provided":"","items":[{"id":"b8026.i01","label":"1","prompt":"","options":[],"type":"gap/open"},{"id":"b8026.i02","label":"2","prompt":"","options":[],"type":"gap/open"},{"id":"b8026.i03","label":"3","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"You may think you can manage by sleeping\nfor just five hours a night, but doing so may\nhave all sorts of negative impacts on your\nphysical and mental health.\nI’ve heard that there’s no such thing as\ngetting ‘too much sleep’, but I’d like to\nknow if experts really think so.\nPeople of all ages sometimes experience\npoor sleep; unfortunately, such problems\ntend to become more common as we\nget older.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8030","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"ADJECTIVES OF STRONG DISAPPROVAL"},"instruction":"Choose the correct adjective to complete each sentence.","pages":[155],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/057aa9e9f42a0d958af97db05d17bea7374a66752b30d405140826d474766013.png"],"provided":"","items":[{"id":"b8030.i01","label":"1","prompt":"We were ____ at the amount of taxpayers' money politicians were permitted to spend on travel.","options":["shocked","shocking"],"type":"choice/closed"},{"id":"b8030.i02","label":"2","prompt":"The rooms were dirty and the servi ","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I’m appalled by the atrocious increase\nin misinformation being spread about\nclimate change; it’s a direct threat to\npublic understanding and global action.\n2 The lack of accountability in recent\ndata breaches is truly deplorable –\nit’s shocking that basic cybersecurity\nmeasures continue to be ignored.\n3 It’s outrageous that essential mental\nhealth services remain so underfunded,\nespecially during a time when the\ndemand and need for support\nhave escalated.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":56,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8033","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":25,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a moderated community meeting about water quality. Work with a partner. Answer the questions.","pages":[156],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c72b97d1e2df9666877474fbfdd4f4d4b1f8f7761a195252f7 with cognitive impairments,\nlearning disabilities, behavioural\nproblems’\nKirk: ‘The people Mrs Johnson spoke\nto at the council really did believe\nthe water was safe. Since then, we’ve\nupdated the procedures for testing\nwater quality.’\n4 I support increasing taxes on sugary foods and drinks,\nbecause such measures have the potential to reduce\nthe incidence of diet-based health problems such\nas obesity.\n5 Everybody is advised to eat at least five portions\nof fruit and vegetables each day. But such\nrecommendations are not always followed.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":56,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8045","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":31,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Review your notes in Exercise 6. Discuss the questions with a partner.","pages":[159],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4deb5788fc0e3e6a024daf0342e4601f6ad200bc8a985adfcc2ad5e327df8cc0.png"],"provided":"1 Which kinds of appeals were typical for the different speakers?\n2 Why do you think they chose that type of appeal?\n3 Were any strong emotional words used? What were they? Why do you think the speaker used them?\n4 Which types of appeals do you think were most effective?","items":[{"id":"b8045.i01","label":"1","prompt":"Which kinds of appeals were typical for the different speakers?","options":[],"type":"discuss/open"},{"id":"b8045.i02","label":"2","prompt":"Why do you think they chose that type of appeal?","options":[],"type":"discuss/open"},{"id":"b8045.i03","label":"3","prompt":"Were any strong emotional words used? What were they? Why do you think the speaker used them?","options":[],"type":"discuss/open"},{"id":"b8045.i04","label":"4","prompt":"Which types of appeals do you think were most effective?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U07-question:b8043","kind":"student-work","title":"LISTENING 2 Ex 6","pages":[159]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Which kinds of appeals were typical for the different speakers?"},{"kind":"text","text":"2 Why do you think they chose that type of appeal?"},{"kind":"text","text":"3 Were any strong emotional words used? What were they? Why do you think the speaker used them?"},{"kind":"text","text":"4 Which types of appeals do you think were most effective?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  The doctors (Hardwick and Khan) tended to appeal for\ntrust and appeal to logic as well as appeal to emotion.\nThe politician (Kirk) and city resident (Johnson) tended\nto appeal to emotion.\n2  The technical experts had experience and facts and\nfigures to rely on. The townsperson wanted to be heard\nand taken seriously. The politician wanted to assure\neveryone of the town’s commitment to its residents.\n3  deplorable, appalling, incredibly, heartbreaking, deeply,\nterrible, panicked, outraged, appalled, highly, serious,\ndramatic, shocking, criminal\n4 See Model Answer Booklet p21 for an example answer.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8047","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":32,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Use ideas from the video, Listening 1 and Listening 2 to answer the questions.","pages":[159],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4deb5788fc0e3e6a024daf0342e4601f6ad200bc8a985adfcc2ad5e327df8cc0.png"],"provided":"1 Do you think a situation like the one in Swansbeck could happen in your city? Why / Why not?\n2 It could be argued that having chemicals in our food and in our water are an inevitable result of scientific progress and that we should simply accept it. What would your response be?","items":[{"id":"b8047.i01","label":"1","prompt":"Do you think a situation like the one in Swansbeck could happen in your city? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b8047.i02","label":"2","prompt":"It could be argued that having chemicals in our food and in our water are an inevitable result of scientific progress and that we should simply accept it. What would your response be?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Do you think a situation like the one in Swansbeck could happen in your city? Why / Why not?"},{"kind":"text","text":"2 It could be argued that having chemicals in our food and in our water are an inevitable result of scientific progress and that we should simply accept it. What would your response be?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, my home town is very industrial,\nand contamination of rivers is very\ncommon. / No, it wouldn’t happen now.\nThere was an incident some years ago\nwhere a clothing factory polluted the\nwater supply. The government acted\nquickly and tightened the law in this area\nin response.\n2 In the past, people weren’t aware of\nthe harm caused by pollution, and so\nit is arguably understandable that they\naccepted pollution as a part of life. But\nthese days, we have so much compelling\nevidence about the damage caused\nby pollution to people, to food and to\nwildlife that there is simply no excuse\nfor complacency./ Unfortunately, I think\nthe damage has already been done.\nPlastics and chemicals are now part of\nour environment and we just have to do\nthe best we can to protect ourselves,\nsuch as taking precautions with regards\nto the types of products we consume.\nHowever, we should remain positive\nabout the fact that we have cured or\ncan now treat many diseases that were\ntransferred through food in the past.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8048","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":33,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Plan and write a 250-word essay: Should businesses be held responsible for the impact they have on people's health? Why / Why not? Use so and such.","pages":[159],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4deb5788fc0e3e6a024daf0342e4601f6ad200bc8a985adfcc2ad5e327df8cc0.png"],"provided":"Introduction: State if you are arguing that businesses should or shouldn't be held responsible.\n\nMain paragraphs: Give reasons in support of your position. You could consider effects of: products sold by companies, company practices on employees, environmental impact, etc.\n\nConclusion: Restate your position and summarize your main argument in support of it.","items":[{"id":"b8048.i01","label":"Essay","prompt":"Should businesses be held responsible for the impact they have on people's health? Why / Why not? Use so and such.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Introduction: State if you are arguing that businesses should or shouldn't be held responsible."},{"kind":"text","text":"Main paragraphs: Give reasons in support of your position. You could consider effects of: products sold by companies, company practices on employees, environmental impact, etc."},{"kind":"text","text":"Conclusion: Restate your position and summarize your main argument in support of it."},{"kind":"item","id":"b8048.i01","label":"Essay","prompt":"Should businesses be held responsible for the impact they have on people's health? Why / Why not? Use so and such.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"This essay will argue that businesses\nshould certainly be held responsible for\nthe impact they have on people’s health\ndue to the significant role they play in\nshaping society. This responsibility stems\nfrom the influence that businesses hold\nover various aspects of individuals’ lives,\nincluding access to products, services,\nand the work environment.\nFirstly, businesses hold a substantial share\nof responsibility in shaping consumer\nbehaviour through the products they\noffer. The food and beverage industry,\nfor instance, significantly contributes to\npeople’s health. Companies must be held\nresponsible for the nutritional content","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":21,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8053","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":34,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Study the facts and figures and read the article about a country on page 161. Then work in small groups and answer the questions.","pages":[160],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eff2c21d5f18fcc12dea440d5f517ff91db6c6132eca424d482c7dd1215004aa.png"],"provided":"","items":[{"id":"b8053.i01","label":"1","prompt":"How favourable is the market for fast-food restaurants? What approximate level of growth between 2008 and 2023 is shown in Figure 1?","options":[],"type":"discuss/open"},{"id":"b8053.i02","label":"2","prompt":"What kinds of economic and societal changes may have occurred during this period?","options":[],"type":"discuss/open"},{"id":"b8053.i03","label":"3","prompt":"How might the increase in fast-food consumption have affected the population's diet? Their health?","options":[],"type":"discuss/open"},{"id":"b8053.i04","label":"4","prompt":"What do the diseases in Figure 2 have in common?","options":[],"type":"discuss/open"},{"id":"b8053.i05","label":"5","prompt":"Did the rate of obesity for adults rise or fall between 2008 and 2023? For children? What might the difference between the two figures mean for the future health of the population?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8053.i01","label":"1","prompt":"How favourable is the market for fast-food restaurants? What approximate level of growth between 2008 and 2023 is shown in Figure 1?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8053.i02","label":"2","prompt":"What kinds of economic and societal changes may have occurred during this period?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8053.i03","label":"3","prompt":"How might the increase in fast-food consumption have affected the population's diet? Their health?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8053.i04","label":"4","prompt":"What do the diseases in Figure 2 have in common?","options":[],"type":"discuss/open"},{"kind":"item","id":"b8053.i05","label":"5","prompt":"Did the rate of obesity for adults rise or fall between 2008 and 2023? For children? What might the difference between the two figures mean for the future health of the population?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B05-LS-U07-publisher-page:p161","title":"原题或核对备注所引第161页","pages":[161],"text":"","screens":[],"sources":[{"page":161,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/308ed2796c620bb4a5c7e69e2ba45d8d4c5420d5c09f752f1976ebebdeb26978.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The market is very favourable. The\ngrowth rate in fast-food locations has\nbeen around 68% in 15 years. It is a\ngood business opportunity.\n2 The country might have become more\nprosperous and open to Western culture\nand businesses. People may have higher\nincomes and now be able to afford to\nspend more on takeaway food.\n3 Fast food is replacing parts of the\ntraditional, healthier diet and this may\nbe leading to obesity, resulting in\nincreases in the health problems seen in\nFigure 2, and therefore may actually be\nkilling people.\n4 They are all ‘lifestyle’ diseases,\nassociated with a less healthy diet and\nsedentary habits.\n5 The rate of obesity rose for adults and\nchildren. This suggests that the increase\nin obesity is accelerating. This means\nthat more and more deaths due to the\nhealth problems caused by obesity are\nlikely to be seen in the future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8054","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":35,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"7.7 Listen to part of a radio programme from the country in Exercise 1. Take notes on the reason(s) each caller took part in the radio programme. Compare your notes with a partner.","pages":[160],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eff2c21d5f18fcc12dea440d5f517ff91db6c6132eca424d482c7dd1215004aa.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U07-question:b8053","kind":"material-reference","title":"CRITICAL THINKING Ex 1","pages":[160]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U07-publisher-sheet:b8053","title":"CRITICAL THINKING Ex 1 原题面","pages":[160],"text":"","screens":[],"sources":[{"page":160,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eff2c21d5f18fcc12dea440d5f517ff91db6c6132eca424d482c7dd1215004aa.png"}],"kind":"task_sheet","sourceBlockIds":["b8053"]}],"courseMedia":[{"type":"audio","title":"Track 7.7","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ec4e6ecc011e8fbbbc3434ae7322824030943fa8b712cd5f4aeb8ff75cf7b873.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Zara: concerned about her son’s health and\nthe impact of fast food on young people;\nworried FryKing’s presence will promote\nunhealthy eating and possibly lead her to\nremove her son from the tutoring centre.\nHamid: owns an electronics store in\nthe complex, struggling due to online\ncompetition; believes FryKing will bring\nmore foot traffic and boost his business.\nNadia: family owns an insurance office\nabove the proposed FryKing location;\nworried about the smell of fried food\naffecting the office environment and\ndeterring clients; shares Zara’s concerns\nabout the health impacts of fast food and\nprefers a healthier alternative.\nManager: manages the complex and\nis responsible for keeping it profitable;\nacknowledges both the potential business\nbenefits of FryKing and community\nconcerns; proposes a meeting to\ngather everyone’s input and make an\ninformed decision.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8058","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":36,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Using information from the radio programme, the text and the graphs, complete the table for how each group would be affected by FryKing, a fast-food restaurant, opening at a local commercial complex.","pages":[162],"sourceIm s":[],"type":"gap/open"},{"kind":"item","id":"b8058.i02","label":"2","prompt":"manager/owner of the complex: What do they want the outcome to be?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i03","label":"3","prompt":"business owners near the location: What concerns might they have?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i04","label":"4","prompt":"business owners near the location: What do they want the outcome to be?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i05","label":"5","prompt":"owner of FryKing: What concerns might they have?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i06","label":"6","prompt":"owner of FryKing: What do they want the outcome to be?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i07","label":"7","prompt":"children: What concerns might they have?","options":[],"type":"gap/open"}],[{"kind":"item","id":"b8058.i08","label":"8","prompt":"children: What do they want the outcome to be?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i09","label":"9","prompt":"high-school students: What concerns might they have?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i10","label":"10","prompt":"high-school students: What do they want the outcome to be?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i11","label":"11","prompt":"local parents: What concerns might they have?","options":[],"type":"gap/open"},{"kind":"item","id":"b8058.i12","label":"12","prompt":"local parents: What do they want the outcome to be?","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"What concerns\nmight they\nhave?\nWhat do they\nwant the\noutcome\nto be?\nmanager /\nowner\nof the\ncomplex\nIt could lift\nbusiness\noverall, but\nif there is a\nbacklash from\nthe public,\nit will have\na negative\nimpact.\nAn increase\nin business\nthroughout the\ncomplex.\nThere won’t be\nany trouble.\nbusiness\nowners\nnear the\nlocation\nThere could\nbe some bad\nsmells, but\nthey hope\nthat more\ncustomers\nwill come.\nThey would\nlike FryKing to\ncome to the\ncomplex. More\npeople will\ncome to the\ncomplex and\nperhaps bring\nnew business\nto their stores.\nowner of\nFryKing\nThey hope to\nmake a big\nprofit, and\nthat there is\nno negative\npublicity.\nThey hope\nto come into\nthe complex\nwithout\nproblems.\nchildren They are likely\nto eat more\nfast food. It\ncould have a\nnegative effect\non their health.\nHowever, if\nthey like fast\nfood, they may\nnot be too\nworried about\ntheir health,\nas they are\nchildren.\nThey hope\nFryKing will\ncome.\nstudents They will be\nable to go\nthere with their\nfriends. They\nare likely to eat\nmore fast food.\nIt could have a\nnegative effect\non their health.\nThey hope\nFryKing will\ncome.\nlocal\nparents\nThey may be\nconcerned\nabout their\nchildren’s\nhealth. Their\nchildren will\nhang out there\nand eat more\nfast food.\nOpinion will\nprobably be\ndivided. Some\nmay be against\nFryKing.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8060","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Your classroom will become the meeting room at a local commercial complex. Work as a class. Assign roles for your meeting. Make sure there are roughly equal numbers of people 'for' and 'against' the FryKing.","pages":[162],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b865828b3a7a1175732e4202d24c5fb469ffe88f67f26eef0ea1d5f513fb3c81.png"],"provided":"- the complex manager\n- a parent of a student at the tutoring centre\n- an owner of a business that might benefit from FryKing's presence\n- an owner whose business might be hurt by FryKing's presence\n- the owner of the tutoring centre\n- a student who goes to the tutoring centre\n- a parent who brings her child to the play area in the complex\n- a local doctor","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- the complex manager"},{"kind":"text","text":"- a parent of a student at the tutoring centre"},{"kind":"text","text":"- an owner of a business that might benefit from FryKing's presence"},{"kind":"text","text":"- an owner whose business might be hurt by FryKing's presence"},{"kind":"text","text":"- the owner of the tutoring centre"},{"kind":"text","text":"- a student who goes to the tutoring centre"},{"kind":"text","text":"- a parent who brings her child to the play area in the complex"}],[{"kind":"text","text":"- a local doctor"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953 fected. Use your imagination to provide details about the person you are representing. Consider using adjectives of strong emotion."},{"kind":"text","text":"omplex manager:"}],[{"kind":"text","text":"- Consider how you will respond to both sides. Think about how you could resolve their differences by offering a compromise."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8062","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"6","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Prepare your talking points for the meeting.","pages":[163],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de960c0988390e7b82870cd90533bb43855819080e2270a73f6932d82f175ad3.png"],"provided":"- Rewrite your position statement in note form so you do not have to read it.\n- Consider the motivation of other participants. Which of them do you think might challenge or object to your position? How would you reply to them?\n- Consider what kinds of appeals will be the most effective forms of persuasion. Will you appeal for trust, to emotion or to logic?\n- Make notes on what you want to happen and how you will respond to opposing suggestions and compromises.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Rewrite your position statement in note form so you do not have to read it."},{"kind":"text","text":"- Consider the motivation of other participants. Which of them do you think might challenge or object to your position? How would you reply to them?"},{"kind":"text","text":"- Consider what kinds of appeals will be the most effective forms of persuasion. Will you appeal for trust, to emotion or to logic?"},{"kind":"text","text":"- Make notes on what you want to happen and how you will respond to opposing suggestions and compromises."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Position: Opposed to FryKing’s opening\ndue to health risks and office disruption.\nPrimary concerns: Fried food odors will\ndisrupt my office, making it uncomfortable\nfor clients. Increased fast-food availability\nrisks higher rates of heart disease, diabetes,\nespecially among children. Prevent FryKing\nfrom opening; suggest a health club or\ncommunity fitness space instead.\nPotential opposition: Likely to argue\nFryKing brings more foot traffic, helping\nbusiness. (A health club would also attract\nvisitors interested in fitness, and wouldn’t\ncompromise air quality or increase\nunhealthy food options.)\nAcknowledge fast food’s appeal but remind\nthem of health risks. Suggest healthier\nrestaurant options that they’d still enjoy.\nEmphasize the long-term health impact on\nchildren and the high cost of medical issues\nrelated to fast-food diets.\nPersuasive appeals:\nTrust: A caring community member with\nconcerns for overall well-being.\nEmotion: Examples of family, childhood,\nand memories of healthier meals.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":22,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8065","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":40,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner. Rewrite the sentences below with more inclusive language.","pages":[164],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cab3c45ddcee573c321816cff8ba0d3bd939f8e6e94987dc52e91356425a68c8.png"],"provided":"","items":[{"id":"b8065.i01","label":"Like all of you, I'm concerned that the testing procedures are unsuitable","prompt":"So what I'd like to know is this: what can we do to get the laboratory to improve them?","options":[],"type":"qa/open"},{"id":"b8065.i02","label":"2","prompt":"Why hasn't there been any public discussion of these important issues?","options":[],"type":"qa/open"},{"id":"b8065.i03","label":"3","prompt":"The food at fast-food restaurants is not part of a healthy diet, so people should stop going to them so often.","options":[],"type":"qa/open"},{"id":"b8065.i04","label":"4","prompt":"I don't think it is a good idea to have these kinds of businesses near children's schools.","options":[],"type":"qa/open"},{"id":"b8065.i05","label":"5","prompt":"This factory is a threat to public health and should close down.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b8065.i01","label":"Like all of you, I'm concerned that the testing procedures are unsuitable","prompt":"So what I'd like to know is this: what can we do to get the laboratory to improve them?","options":[],"type":"qa/open"},{"kind":"item","id":"b8065.i02","label":"2","prompt":"Why hasn't there been any public discussion of these important issues?","options":[],"type":"qa/open"},{"kind":"item","id":"b8065.i03","label":"3","prompt":"The food at fast-food restaurants is not part of a healthy diet, so people should stop going to them so often.","options":[],"type":"qa/open"},{"kind":"item","id":"b8065.i04","label":"4","prompt":"I don't think it is a good idea to have these kinds of businesses near children's schools.","options":[],"type":"qa/open"},{"kind":"item","id":"b8065.i05","label":"5","prompt":"This factory is a threat to public health and should close down.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 Do you want to know why there has\nnot been any public discussion of these\nimportant issues? I do.\n3 We are all aware that the food at fast\nfood restaurants is not part of a healthy\ndiet, so we should stop going to them\nso often.\n4 We shouldn’t allow these kinds of\nbusinesses near our children’s schools.\n5 I’m sure we all agree that the factory is a\nthreat to public health and should\nclose down.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8066","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":41,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Review the statement that you prepared in Critical thinking, Exercise 5 on page 163. Rewrite it to make it more inclusive. Then write one more sentence that contains inclusive language and add it to your statement.","pages":[164],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/cab3c45ddcee573c321816cff8ba0d3bd939f8e6e94987dc52e91356425a68c8.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U07-question:b8061","kind":"student-work","title":"CRITICAL THINKING Ex 5","pages":[163]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B05-LS-U07-publisher-page:p163","title":"原题或核对备注所引第163页","pages":[163],"text":"","screens":[],"sources":[{"page":163,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/de960c0988390e7b82870cd90533bb43855819080e2270a73f6932d82f175ad3.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"I’m Nadia, and our family runs an insurance\noffice directly above where FryKing wants\nto open. We’re all part of this community,\nand I know many of us are concerned about\nhow the smell of fried food could affect\nour workspaces and our clients’ comfort.\nBeyond that, aren’t we all worried about\nthe health of our community, especially our\nkids? Growing up, we all remember eating\nhome-cooked, healthy meals, but now,\nfast food is everywhere, and it’s leading\nto serious health issues, like heart disease\nand diabetes. Instead of bringing in more\nunhealthy habits, let’s think about adding a\nhealth club that could promote fitness and\nwellness for all of us in the complex.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":23,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":24,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U07-question:b8070","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":2,"order":42,"module":"PREPARATION FOR SPEAKING","ex":"3","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"7.8 Listen to the excerpts from Listening 2. Write the missing words you hear. Why do you think these words are emphasized?","pages":[165],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c9cea71413ea7c092f7db25fbfe0663238dd2b022c13738bb6fd332a05e8991e.png"],"provided":"","items":[{"id":"b8070.i01","label":"1","prompt":"Lead is ____ toxic – to the nervous system, to the reproductive system, but most of all, it a derstand a video about ultra-processed food."},{"label":"Listening skills","text":"Take unstructured notes as you listen; identify persuasive appeals."},{"label":"Critical thinking","text":"Understand motivation."},{"label":"Grammar","text":"Establish cohesion with so and such."},{"label":"Speaking skill","text":"Use inclusive language."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":146,"alt":""}}]}},{"id":"B05-LS-U07-classroom:resource:b7995","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/354447d1664989e40fa31e8811dbd60b350e578e00c520fb398b9625c01c184a.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"mechanization","pos":"(n)","definition":"the process of introducing machines to do a job which used to be done by hand","example":"Mechanization changed the way farmers harvest crops.","wordAudio":"mechanization","cardWord":false},{"term":"additive","pos":"(n)","definition":"a substance which is added to food in a factory, e.g. to change its appearance or make it last longer","example":"The label lists an additive that helps preserve the food.","wordAudio":"additive","cardWord":false},{"term":"processed","pos":"(adj)","definition":"having had chemical or industrial treatment, e.g. to change its appearance or make it last longer","example":"The factory uses processed ingredients in some of its meals.","wordAudio":"processed","cardWord":false},{"term":"dietary fibre","pos":"(n)","definition":"a substance in food which helps digestion","example":"Whole grains are a good source of dietary fibre.","wordAudio":"dietary fibre","cardWord":false},{"term":"texture","pos":"(n)","definition":"what something feels like when it is touched, e.g. soft, etc.","example":"The fabric has a soft texture.","wordAudio":"texture","cardWord":false},{"term":"affordable","pos":"(adj)","definition":"not too expensive","example":"We found an affordable place to stay near the station.","wordAudio":"affordable","cardWord":false}]]}},{"id":"B05-LS-U07-classroom:video","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[148],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/354447d1664989e40fa31e8811dbd60b350e578e00c520fb398b9625c01c184a.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/8827a0fd60c6028ff3b5afcc-L5LS-U07.mp4","captions":[{"start":0,"end":2.78,"text":"In the 1930s,"},{"start":3.08,"end":5.64,"text":"food production began to change dramatically."},{"start":6.38,"end":8.42,"text":"The mechanization of manufacturing,"},{"start":8.84,"end":11.6,"text":"combined with the introduction of additives,"},{"start":12.08,"end":14.24,"text":"meant that food could be stored for longer."},{"start":15.26,"end":18.32,"text":"The era of processed food had truly begun."},{"start":19.46,"end":25.1,"text":"Today, the majority of all food we buy and cook is\nprocessed to some degree."},{"start":25.1,"end":26.7,"text":"For example,"},{"start":27.34,"end":28.66,"text":"ingredients such as flour,"},{"start":29.22,"end":29.88,"text":"olive oil,"},{"start":30.2,"end":31.84,"text":"and canned tomatoes are"},{"start":31.84,"end":32.14,"text":"no"},{"start":32.14,"end":33.9,"text":"longer in their raw,"},{"start":34.32,"end":35.42,"text":"natural states."},{"start":36.4,"end":38.26,"text":"But since the start of the century,"},{"start":38.58,"end":43.04,"text":"we have seen the rise of ultra -processed food, or UPF."},{"start":43.8,"end":46,"text":"UPF is designed to be cheap,"},{"start":46.44,"end":46.9,"text":"convenient,"},{"start":47.3,"end":48.66,"text":"and often ready to eat."},{"start":48.66,"end":57.02,"text":"Little remains in its whole original form after the\nmanufacturing process changes the nature of the\ningredients,"},{"start":57.42,"end":60.26,"text":"with additives being used to improve texture,"},{"start":60.64,"end":62.02,"text":"appearance, and flavor."},{"start":63.12,"end":70.16,"text":"UPF is high in salt, fat, and added sugar, and lacks\nessential vitamins and dietary fiber."},{"start":70.16,"end":78.44,"text":"Studies have shown that eating it raises the risk of\nhealth problems like high blood pressure and heart\nconditions."},{"start":79.84,"end":81.62,"text":"So how can people avoid it?"},{"start":82.24,"end":86.4,"text":"Is it simply a case of not buying anything known to be\nunhealthy,"},{"start":86.92,"end":88.64,"text":"such as microwave -ready meals?"},{"start":90.44,"end":91.12,"text":"Unfortunately,"},{"start":91.46000000000001,"end":92.64,"text":"it isn't that simple."},{"start":93.42,"end":94.06,"text":"In fact,"},{"start":94.38,"end":98.24000000000001,"text":"there are even issues with products sold as healthy\nalternatives."},{"start":98.24000000000001,"end":104.3,"text":"Many companies today manufacture food solely from plant\n-based ingredients."},{"start":105.08,"end":105.53999999999999,"text":"However,"},{"start":105.86,"end":110.4,"text":"reproducing the texture and appearance of a burger, for\nexample, or cheese,"},{"start":110.88,"end":114.18,"text":"can only be achieved through ultra -processing\ntechniques."},{"start":115.8,"end":122.8,"text":"And since plant -based foods contain high levels of\nadditives and saturated fat, as found in coconut oil,"},{"start":123.22,"end":126.36,"text":"they frequently come into the ultra -processed\ncategory."},{"start":127.4,"end":136.16,"text":"Preserving and processing food to give it a longer life\nor to improve its taste is nothing new, nor is it\nnecessarily harmful."},{"start":137.06,"end":145.72,"text":"But while modern manufacturers continue to make long\n-lasting food that appeals to a wide range of\nlifestyles and budgets,"},{"start":146.42000000000002,"end":153.46,"text":"further research is needed to better understand how\nultra -processed foods and drinks affect our bodies."},{"start":154.38,"end":155.14,"text":"Overall,"},{"start":155.8,"end":158.14,"text":"fresh food, if affordable and available,"},{"start":158.48,"end":159.88,"text":"is the ideal option."}],"launchInline":true}},{"id":"B05-LS-U07-classroom:resource:b8009","book":5,"unit":7,"track":"LS","topic":"HEALTH SCIENCES","lesson":1,"module":"Vocabulary for Ex 4","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3bb8ae462534645b2b726cb8a0f9fde22488a8dab21d2970e99805fca644d58d.png"],"layout":"list","instruction":"Vocabulary for Ex 4","flow":{"kind":"resource","pages":["correlation (n) a connection between two or more things\neconomy of scale (n) the benefit of having a lower cost when more of something is produced\ninfectious (adj) able to be passed from one person or animal to another, spreading infection or disease\nhygiene (n) keeping yourself and your environment clean","incidence (n) the rate at which something happens\nlivestock (n) farm animals\nobesity (n) being extremely fat in an unhealthy way\nhumane (adj) kind towards those who are suffering"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B05-LS-U07-classr function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){

function bind(c){

  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));

function taskTable(table,feedback){

 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];

 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}

 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';

  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+

   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");

   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+

 };

async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}

function outside(el,bounds){

}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
