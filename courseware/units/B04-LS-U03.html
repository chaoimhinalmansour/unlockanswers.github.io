":"b5961.i02","label":"2","prompt":"Telemedicine happens in special places like hospitals or clinics.","options":["T (true)","F (false)"],"type":"choice/closed"},{"kind":"item","id":"b5961.i03","label":"3","prompt":"Fewer than half the people in a Saudi study trusted the health information they found online.","options":["T (true)","F (false)"],"type":"choice/closed"}],[{"kind":"item","id":"b5961.i04","label":"4","prompt":"A 'cyberchondriac' is somebody who can't stop looking for health information online.","options":["T (true)","F (false)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/3ecd92f8bc6f7191449253ef-L4LS-U03.mp4","captions":[{"start":1.48,"end":5.52,"text":"Communications technology has transformed the way we\nseek medical help."},{"start":6.2,"end":6.48,"text":"We are"},{"start":6.48,"end":6.68,"text":"no"},{"start":6.68,"end":10.52,"text":"longer required to visit a surgery for a consultation\nwith a doctor,"},{"start":11.12,"end":15,"text":"as their advice can often be provided over the phone or\nonline."},{"start":17.38,"end":25.4,"text":"Telemedicine is an expanding market that is expected to\nshow a worldwide annual growth rate of eight .57%."},{"start":25.4,"end":28.04,"text":"It has some great benefits for patients."},{"start":28.96,"end":33.32,"text":"Online consultations take place in the comfort of your\nhome or workplace."},{"start":34.36,"end":38.34,"text":"That means that medical advice is more accessible for\nmany people,"},{"start":38.7,"end":40.86,"text":"including those with mobility issues."},{"start":41.9,"end":46.06,"text":"It also reduces the risk of patient -to -patient\ninfection in doctors'"},{"start":46.4,"end":46.94,"text":"waiting rooms."},{"start":47.98,"end":48.48,"text":"However,"},{"start":48.82,"end":51.2,"text":"without examining a patient in person,"},{"start":51.64,"end":53.72,"text":"doctors could miss important symptoms."},{"start":53.72,"end":58.36,"text":"So telemedicine may be less effective in some\nscenarios."},{"start":59.72,"end":63.4,"text":"Telemedicine isn't the only way to get health\ninformation online."},{"start":64.34,"end":64.66,"text":"Today,"},{"start":65.04,"end":69.4,"text":"many of us use web content to diagnose our own health\nproblems."},{"start":70.56,"end":72.62,"text":"There are obvious advantages to this."},{"start":73.36,"end":78.88,"text":"The information is immediately available and can reveal\nthat a doctor's appointment is not needed."},{"start":79.8,"end":82.58,"text":"In one study in Saudi Arabia,"},{"start":83.5,"end":87.72,"text":"92 % of participants said they used the internet to\ncheck symptoms."},{"start":88.7,"end":89.08,"text":"However,"},{"start":89.52,"end":94.24000000000001,"text":"only 65 % of them actually believed online health\ninformation to be reliable."},{"start":95.3,"end":99.02000000000001,"text":"The remaining 35 % said they didn't trust what they\nread."},{"start":100.1,"end":101.08,"text":"The fact is,"},{"start":101.5,"end":104.8,"text":"checking symptoms online can lead to a misdiagnosis."},{"start":104.8,"end":107.74000000000001,"text":"It may lead you to dismiss an illness,"},{"start":108.06,"end":109.9,"text":"wrongly, as something temporary,"},{"start":110.62,"end":114.4,"text":"or to believe it to be more serious than is actually\nthe case."},{"start":118.3,"end":125.06,"text":"The term cyberchondriac describes someone who\ncompulsively searches the internet for medical\ninformation."},{"start":126.8,"end":130.28,"text":"Cyberchondriacs often imagine they have the symptoms\nthey read about."},{"start":130.28,"end":136.04,"text":"They become extremely anxious, and this stress can\ncause them to become physically ill."},{"start":137.34,"end":140.16,"text":"However much you value finding your own health\ninformation,"},{"start":140.86,"end":146 ,"text":"It may lead you to dismiss an illness,"},{"start":108.06,"end":109.9,"text":"wrongly, as something temporary,"},{"start":110.62,"end":114.4,"text":"or to believe it to be more serious than is actually\nthe case."},{"start":118.3,"end":125.06,"text":"The term cyberchondriac describes someone who\ncompulsively searches the internet for medical\ninformation."},{"start":126.8,"end":130.28,"text":"Cyberchondriacs often imagine they have the symptoms\nthey read about."},{"start":130.28,"end":136.04,"text":"They become extremely anxious, and this stress can\ncause them to become physically ill."},{"start":137.34,"end":140.16,"text":"However much you value finding your own health\ninformation,"},{"start":140.86,"end":146.22,"text":"the best medical advice ultimately comes directly from\na qualified medical professional."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 This is probably true, since it is an\nexpanding market with an annual\nworldwide growth of 8.57%.\n2 This is probably not accurate. Doctors\nneed to examine patients in person for\ncertain illnesses.\n3 This is probably not accurate, because\na large majority of people in one survey\nin Saudi Arabia (92%) look for health\ninformation online, even if many of those\nthought that the information they found\nwas unreliable.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5967","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner and answer the questions.","pages":[61],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/47826b040d87b9a48c5b42d6d888c84259c57d5b41f488b8c147ba71c4a6b46e.png"],"provided":"1 How would you feel about talking to a doctor online, compared to face-to-face?\n2 Do you think that medical information online is generally reliable?","items":[{"id":"b5967.i01","label":"1","prompt":"How would you feel about talking to a doctor online, compared to face-to-face?","options":[],"type":"discuss/open"},{"id":"b5967.i02","label":"2","prompt":"Do you think that medical information online is generally reliable?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 How would you feel about talking to a doctor online, compared to face-to-face?"},{"kind":"text","text":"2 Do you think that medical information online is generally reliable?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I’m much more comfortable talking\nwith doctors face-to-face, as they can\nexamine me properly and I don’t have\nto waste time trying to explain things\nthat they can’t really see. / I’d be happy\nto talk to a doctor online, as it means I\ndon’t have to travel or spend time in a\nwaiting room. It might even mean I get\nto spend more time with a doctor and\nget an appointment sooner.\n2 I wouldn’t trust web content for anything\nvery serious. I also don’t think it can ever\nreally replace a medical professional’s\nadvice. / I think it’s fine to use the\ninternet to get an idea of what might\nbe wrong with you or how to treat a\nsimple illness. Most of the time, medical\nwebsites are written by professionals or\nare run by professional organizations.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":34,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5971","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":8,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a seminar about a way of helping people. Before you listen, read the sentences and write the words in bold next to the definitions.","pages":[62],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ebdc1f7e8fcfa8cd2cbbb20e434b7759e82fc9c4d4e514ef70758b356aa20e81.png"],"provided":"1 I always feel sad and tired in the winter. I don't know what the best therapy would be.\n2 I've got a sore throat. What's the best treatment for that?\n3 I fell off my bike yesterday and I've got a small wound on my leg. My friend wants me to go cycling with her tomorrow.\n4 Do you know where most accidents occur, and should I avoid those places?\n5 My friend wants to meet me today, but he's got a cold and I don't want to be infected.\n6 I don't think I have a good balance of things in my life. For example, I spend more time working than with friends.\n7 I'm thinking of installing a new fitness app on my phone, but I know it will collect a lot of my health data.\n8 I hurt my shoulder recently when I was playing tennis, and it still hurts. It's taking me a long time to recover.","items":[{"id":"b5971.i01","label":"a","prompt":"____ (v) to happen","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i02","label":"b","prompt":"____ (v) to become completely well again after an illness or injury","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i03","label":"c","prompt":"____ (n) a damaged area of the body","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i04","label":"d","prompt":"____ (adj) having an illness as a result of organisms such as bacteria or viruses entering the body","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i05","label":"e","prompt":"____ (n) a course of action that helps somebody feel happier or better over time","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i06","label":"f","prompt":"____ (n) information, especially facts or numbers","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i07","label":"g","prompt":"____ (n) something that you do to try to cure an illness or injury, especially something suggested by a doctor","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"id":"b5971.i08","label":"h","prompt":"____ (n) a state where things are equal and feel natural","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 I always feel sad and tired in the winter. I don't know what the best therapy would be."},{"kind":"text","text":"2 I've got a sore throat. What's the best treatment for that?"},{"kind":"text","text":"3 I fell off my bike yesterday and I've got a small wound on my leg. My friend wants me to go cycling with her tomorrow."},{"kind":"text","text":"4 Do you know where most accidents occur, and should I avoid those places?"},{"kind":"text","text":"5 My friend wants to meet me today, but he's got a cold and I don't want to be infected."},{"kind":"text","text":"6 I don't think I have a good balance of things in my life. For example, I spend more time working than with friends."}],[{"kind":"text","text":"7 I'm thinking of installing a new fitness app on my phone, but I know it will collect a lot of my health data."},{"kind":"text","text":"8 I hurt my shoulder recently when I was playing tennis, and it still hurts. It's taking me a long time to recover."},{"kind":"item","id":"b5971.i01","label":"a","prompt":"____ (v) to happen","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"}],[{"kind":"item","id":"b5971.i02","label":"b","prompt":"____ (v) to become completely well again after an illness or injury","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"kind":"item","id":"b5971.i03","label":"c","prompt":"____ (n) a damaged area of the body","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"}],[{"kind":"item","id":"b5971.i04","label":"d","prompt":"____ (adj) having an illness as a result of organisms such as bacteria or viruses entering the body","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"kind":"item","id":"b5971.i05","label":"e","prompt":"____ (n) a course of action that helps somebody feel happier or better over time","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"}],[{"kind":"item","id":"b5971.i06","label":"f","prompt":"____ (n) information, especially facts or numbers","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"},{"kind":"item","id":"b5971.i07","label":"g","prompt":"____ (n) something that you do to try to cure an illness or injury, especially something suggested by a doctor","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"}],[{"kind":"item","id":"b5971.i08","label":"h","prompt":"____ (n) a state where things are equal and feel natural","options":["therapy","treatment","wound","occur","infected","balance","data","recover"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a occur b recover c wound d infected\ne therapy f data g treatment h balance","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5972","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":9,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Take turns saying a sentence from Exercise 1 and giving a response.","pages":[62],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ebdc1f7e8fcfa8cd2cbbb20e434b7759e82fc9c4d4e514ef70758b356aa20e81.png"],"provided":"Q: I always feel sad and tired in the winter. I don't know what the best therapy would be.\nA: Having a holiday somewhere sunny is probably the best, although maybe not the cheapest, option!","items":[],"layout":"list","references":[{"id":"B04-LS-U03-question:b5971","kind":"material-reference","title":"LISTENING 1 Ex 1","pages":[62]}],"materials":[],"coursePages":[[{"kind":"text","text":"Q: I always feel sad and tired in the winter. I don't know what the best therapy would be."},{"kind":"text","text":"A: Having a holiday somewhere sunny is probably the best, although maybe not the cheapest, option!"}]],"courseMaterials":[{"id":"B04-LS-U03-publisher-sheet:b5971","title":"LISTENING 1 Ex 1 原题面","pages":[62],"text":"1 I always feel sad and tired in the winter. I don't know what the best therapy would be.\n2 I've got a sore throat. What's the best treatment for that?\n3 I fell off my bike yesterday and I've got a small wound on my leg. My friend wants me to go cycling with her tomorrow.\n4 Do you know where most accidents occur, and should I avoid those places?\n5 My friend wants to meet me today, but he's got a cold and I don't want to be infected.\n6 I don't think I have a good balance of things in my life. For example, I spend more time working than with friends.\n7 I'm thinking of installing a new fitness app on my phone, but I know it will collect a lot of my health data.\n8 I hurt my shoulder recently when I was playing tennis, and it still hurts. It's taking me a long time to recover.","screens":["1 I always feel sad and tired in the winter. I don't know what the best therapy would be.","2 I've got a sore throat. What's the best treatment for that?","3 I fell off my bike yesterday and I've got a small wound on my leg. My friend wants me to go cycling with her tomorrow.","4 Do you know where most accidents occur, and should I avoid those places?","5 My friend wants to meet me today, but he's got a cold and I don't want to be infected.","6 I don't think I have a good balance of things in my life. For example, I spend more time working than with friends.","7 I'm thinking of installing a new fitness app on my phone, but I know it will collect a lot of my health data.","8 I hurt my shoulder recently when I was playing tennis, and it still hurts. It's taking me a long time to recover."],"sources":[{"page":62,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ebdc1f7e8fcfa8cd2cbbb20e434b7759e82fc9c4d4e514ef70758b356aa20e81.png"}],"kind":"task_sheet","sourceBlockIds":["b5971"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 I think having a hot drink with some\nlemon juice and honey in it might help.\n3 If I were you, I’d tell your friend that you\nneed to rest.\n4 Apparently, most accidents occur in\nthe home, but I don’t think you can\navoid that!\n5 You should stay away from your friend\nuntil he’s better, but you could phone\nhim for a chat instead.\n6 Maybe you should try working a bit less\nand asking your boss for some time\noff, so you can spend more time doing\nthings you enjoy.\n7 You should check the data settings\ncarefully when you install the app so\nthat you limit the amount of information\nyou share.\n8 If it still hurts after a few more days, I’d\ngo and see a doctor. You might have\ndone something serious!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5973","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":10,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the text. Then answer the questions below.","pages":[63],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/963ccb093d719edb24a6a38e88ca3b103d5def9e1ea23b96916f09cf90b2b318.png"],"provided":"## Hirudotherapy\n\nLeeches have been used in medicine for thousands of years, from Ancient Egypt and Greece to India and medieval Europe. Doctors used to think these small creatures could take away poisons from the blood. They were wrong about this, although leeches are surprisingly effective in other forms of treatment today.","items":[{"id":"b5973.i01","label":"1","prompt":"What do you think a leech is?","options":[],"type":"qa/open"},{"id":"b5973.i02","label":"2","prompt":"Why do you think doctors thought they could remove poisons?","options":[],"type":"qa/open"},{"id":"b5973.i03","label":"3","prompt":"What forms of treatment do you think they are useful for today?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"## Hirudotherapy"},{"kind":"text","text":"Leeches have been used in medicine for thousands of years, from Ancient Egypt and Greece to India and medieval Europe. Doctors used to think these small creatures could take away poisons from the blood. They were wrong about this, although leeches are surprisingly effective in other forms of treatment today."},{"kind":"item","id":"b5973.i01","label":"1","prompt":"What do you think a leech is?","options":[],"type":"qa/open"},{"kind":"item","id":"b5973.i02","label":"2","prompt":"Why do you think doctors thought they could remove poisons?","options":[],"type":"qa/open"},{"kind":"item","id":"b5973.i03","label":"3","prompt":"What forms of treatment do you think they are useful for today?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 It’s a small animal like a snail without a\nshell. It lives in water.\n2 Perhaps doctors thought that because\nleeches were ugly, they fed on poison,\ntaking it from the blood.\n3 They might be used when someone has\nan illness where blood doesn’t flow well\naround the body.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5975","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":11,"module":"LISTENING 1","ex":"4","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"3.1 Listen to the seminar and check your answers to Exercise 3.","pages":[63],"sourceImages":["https: 96fbc.png"],"provided":"1 Do you think people are more open to exploring different types of therapy now than they were 20 years ago? Why / Why not?\n2 How would you respond if a doctor suggested an unusual treatment to you? What would you need to know, and what questions would you ask?","items":[{"id":"b5987.i01","label":"1","prompt":"Do you think people are more open to exploring different types of therapy now than they were 20 years ago? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b5987.i02","label":"2","prompt":"How would you respond if a doctor suggested an unusual treatment to you? What would you need to know, and what questions would you ask?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Do you think people are more open to exploring different types of therapy now than they were 20 years ago? Why / Why not?"},{"kind":"text","text":"2 How would you respond if a doctor suggested an unusual treatment to you? What would you need to know, and what questions would you ask?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I think people are more open to\nexploring different types of therapy,\nbecause people today have access to\nmore knowledge thanks to the internet,\nand are able to get advice from a\nlarger range of sources. I also think that\npeople are now more aware that there\nis rarely one form of therapy that can\nsuit everyone, and treatment needs to\nbe tailored to each individual patient.\n/ I don’t think people are more open\nto exploring different types of therapy\nnow. There haven’t been that many new\ntherapies for people to consider, and\ntraditional medicine has proved to be\nvery effective, whereas many so-called\nalternative therapies have been shown\nto be ineffective.\n2 I would trust my doctor to suggest the\nbest possible treatment, and the one\nmost likely to work. However, if the\ntreatment was unusual, I would ask about\nhow effective it is compared to other\ntreatments. I might also ask about other\npatients who have had this treatment,\nhow it worked for them and how they","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":7,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5988","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":18,"module":"LISTENING 1","ex":"11","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Your doctor has suggested hirudotherapy for a medical issue you have, but you are not convinced about this treatment. Write a 150-200 word email to another doctor asking for a second opinion.","pages":[65],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ba305c06f1f37d19517d99b5773ab31bc171c9d23f2860856a7ab2abc9296fbc.png"],"provided":"- Explain the treatment to the doctor (don't go into detail about your medical issue), in case the doctor isn't aware of what it involves.\n- Say why you have concerns about the treatment.\n- Ask the doctor any questions you have, to help you make up your mind about the treatment.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Explain the treatment to the doctor (don't go into detail about your medical issue), in case the doctor isn't aware of what it involves."},{"kind":"text","text":"- Say why you have concerns about the treatment."},{"kind":"text","text":"- Ask the doctor any questions you have, to help you make up your mind about the treatment."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Dear Doctor Badri,\nI hope this email finds you well. I am\nwriting to ask your opinion about a form of\ntreatment, known as hirudotherapy, for my\nillness. In case, like me, you were not aware\nof this treatment, it involves the use of\nleeches to help improve the flow of blood.\nMy current doctor has told me that\nhirudotherapy is very effective, with a high\nsuccess rate. However, I find the thought\nof placing animals on my body to be\nquite unpleasant. It also appears to be a\nhighly unusual form therapy that seems\nmore like something from the Middle\nAges than a treatment a modern doctor\nwould recommend.\nI hope you don’t mind me asking for your\nview. Do you think that there is any need for\nme to worry? Or are there any other forms of\ntreatment that you think would be equally,\nif not more, successful? Most of all, is using\nleeches as a medical tool clean and healthy?\nMany thanks,","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5989","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":19,"module":"LISTENING 1","ex":"12","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Compare your emails. Did you have similar questions and concerns?","pages":[65],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ba305c06f1f37d19517d99b5773ab31bc171c9d23f2860856a7ab2abc9296fbc.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"We both have concerns that this kind of\ntreatment is going to feel very unpleasant.\nWill you feel anything while the leeches are\non you? Does it hurt when they bite you?\nAre the leeches clean, or do they carry any\nkind of disease? Aren’t there any other forms\nof treatment available, using machines for\nexample? / We had very different questions\nand concerns. I was worried that the\ntreatment might be painful and ultimately\nunsuccessful, whereas my partner was more\nconcerned that the leeches might fall off!\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5992","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. For each sentence, try to explain what the word in bold means, using the information in the rest of the sentence. Compare your answers with the class.","pages":[66],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3d4b0f3e5c7a6f8d450f2d01e848f2545de8d30249d30cb034ce77b523dc3fa7.png"],"provided":"","items":[{"id":"b5992.i01","label":"1","prompt":"Doctors from the organization Doctors Without Borders provide aid where it is really needed. For example, many of the doctors work in developing countries.","options":[],"type":"qa/open"},{"id":"b5992.i02","label":"2","prompt":"Maha had a bad infection, so her doctor gave her antibiotics to take. Within a few days, the infection had gone.","options":[],"type":"qa/open"},{"id":"b5992.i03","label":"3","prompt":"Most doctors agree that having a healthy diet and taking regular exercise is the best prevention for many diseases. People who do that have fewer medical problems.","options":[],"type":"qa/open"},{"id":"b5992.i04","label":"4","prompt":"Doctors are recommending that older people in particular should have a vaccine this autumn, to stop them being badly affected by the flu later in the winter.","options":[],"type":"qa/open"},{"id":"b5992.i05","label":"5","prompt":"Some doctors have a personal touch; they prefer to treat the person, not just the disease.","options":[],"type":"qa/open"},{"id":"b5992.i06","label":"6","prompt" iquids – blood being one of them, and if there was too much or too little of one liquid, you'd get ill. It sounds a strange theory now. However, if doctors (1) ____ (not think) this, they (2) ____ (might / not / develop) the idea of using cures to control what happened in the body. For example, they (3) ____ (would / not / continue) to carry out experiments with plants if they (4) ____ (not realize) that certain herbs had the ability to lower a temperature or make headaches better.","items":[{"id":"b5995.i01","label":"1","prompt":"if doctors ____ (not think) this","options":[],"type":"gap/open"},{"id":"b5995.i02","label":"2","prompt":"they ____ (might / not / develop) the idea of using cures to control what happened in the body","options":[],"type":"gap/open"},{"id":"b5995.i03","label":"3","prompt":"they ____ (would / not / continue) to carry out experiments with plants","options":[],"type":"gap/open"},{"id":"b5995.i04","label":"4","prompt":"if they ____ (not realize) that certain herbs had the ability to lower a temperature or make headaches better","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Reporter: Today I'm talking to Dr Kayoko Niikura, an expert on the history of medicine. It's fascinating what people in ancient times thought about health. Is it true that most doctors thought illnesses were caused by a lack of balance in the body?"},{"kind":"text","text":"Dr Niikura: Well, many doctors certainly believed the body was made up of four important liquids – blood being one of them, and if there was too much or too little of one liquid, you'd get ill. It sounds a strange theory now. However, if doctors (1) ____ (not think) this, they (2) ____ (might / not / develop) the idea of using cures to control what happened in the body. For example, they (3) ____ (would / not / continue) to carry out experiments with plants if they (4) ____ (not realize) that certain herbs had the ability to lower a temperature or make headaches better."},{"kind":"item","id":"b5995.i01","label":"1","prompt":"if doctors ____ (not think) this","options":[],"type":"gap/open"}],[{"kind":"item","id":"b5995.i02","label":"2","prompt":"they ____ (might / not / develop) the idea of using cures to control what happened in the body","options":[],"type":"gap/open"},{"kind":"item","id":"b5995.i03","label":"3","prompt":"they ____ (would / not / continue) to carry out experiments with plants","options":[],"type":"gap/open"},{"kind":"item","id":"b5995.i04","label":"4","prompt":"if they ____ (not realize) that certain herbs had the ability to lower a temperature or make headaches better","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 hadn’t thought 2 might not have developed\n3 wouldn’t have continued 4 hadn’t realized\n5 would have kept on 6 had discovered\n7 had done 8 wouldn’t have infected\n9 had followed 10 would have saved","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":35,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5996","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"3","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Think of two things you did in the past, and two things you didn't do. Work with a partner and say the possible results if things had happened differently.","pages":[68],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/79a512f7c00d45a1c035aa082070060bebbd7ac0bdbc60bbef454538bb4f7946.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"If I hadn’t started learning English, I might\nhave chosen to study French.\nI would have forgotten that it was my\nfriend’s birthday if I hadn’t looked at the\ncalendar app on my phone.\nIf I had gone to a different university, I\nwouldn’t have met my husband.\nI’d have chosen a completely different\ncareer if I hadn’t had Mr Matthews as my\nScience teacher at school.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b5999","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Imagine your ideal job. Work with a partner. Take turns asking yes/no questions using the second conditional to find out each other's jobs.","pages":[68],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/79a512f7c00d45a1c035aa082070060bebbd7ac0bdbc60bbef454538bb4f7946.png"],"provided":"Would you like to be famous?\nIf you were a nurse, would that make you happy?\nCOL\nNo, that wouldn't make me happy. If I could do anything with my life, I'd prefer to help others.\nYes, but that's not the exact job I was thinking of!","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Would you like to be famous?"},{"kind":"text","text":"If you were a nurse, would that make you happy?"},{"kind":"text","text":"COL"},{"kind":"text","text":"No, that wouldn't make me happy. If I could do anything with my life, I'd prefer to help others."},{"kind":"text","text":"Yes, but that's not the exact job I was thinking of!"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"A: Would you like to do something\ncreative?\nB: Yes, I would.\nA: Would it be your dream to be a singer or\na musician?\nB: No. If I were a singer, it wouldn’t make\nme happy.\nA: If you were involved in making clothes,\nwould that be an interesting career for you?\nB: Yes. If I could have any job, I would love\nto be a fashion designer.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b6003","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":2,"order":24,"module": haoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b6010","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":2,"order":28,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"3.6 Listen to the rest of the debate. Make notes on the solutions that Dr Sandra Smith and Mark Li suggest.","pages":[70],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/aea436c8a723435f673865935cee03b3f7faa0ac5593bce7fcb201db37f7e55b.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>Dr Sandra Smith\u003c/td>\u003ctd>Mark Li\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b6010.i01","label":"Dr Sandra Smith","prompt":"Solutions suggested by Dr Sandra Smith:","options":[],"type":"gap/open"},{"id":"b6010.i02","label":"Mark Li","prompt":"Solutions suggested by Mark Li:","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"Dr Sandra Smith","header":false,"colspan":1,"rowspan":1},{"text":"Mark Li","header":false,"colspan":1,"rowspan":1}],[{"text":"","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b6010.i01","label":"Dr Sandra Smith","prompt":"Solutions suggested by Dr Sandra Smith:","options":[],"type":"gap/open"},{"kind":"item","id":"b6010.i02","label":"Mark Li","prompt":"Solutions suggested by Mark Li:","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 3.6","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/161c20ca75aade5236bfb9d490e7fd22f82adac26cf0831e20132c6d35772bd9.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"Dr Sandra Smith Mark Li\n• develop\nnew types of\nantibiotics and\nmore of them\n• give more\nmoney to\nuniversities\nand private\ncompanies to\ndo research\n• countries\nshould work\ntogether to\nmake new\nantibiotics\nlegal\n• encourage\npeople to stop\nusing them so\noften and only on\ndoctor’s advice\n• stop making it\npossible to walk\ninto pharmacies\nand buy them\n• encourage\npeople to eat\nless meat\n• keep animals in\nbetter conditions\n• give people\nbetter access to\nclean water","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question: ow how tough it is from my own experience.","options":["offering additional information","returning to an earlier reference","repeating the other person's point and saying it is correct","giving a personal example","using logic"],"type":"choice/closed"},{"kind":"item","id":"b6015.i02","label":"2","prompt":"I certainly agree that we must act now.","options":["offering additional information","returning to an earlier reference","repeating the other person's point and saying it is correct","giving a personal example","using logic"],"type":"choice/closed"}],[{"kind":"item","id":"b6015.i03","label":"3","prompt":"Let me make another point, related to the work I've been doing in recent years.","options":["offering additional information","returning to an earlier reference","repeating the other person's point and saying it is correct","giving a personal example","using logic"],"type":"choice/closed"},{"kind":"item","id":"b6015.i04","label":"4","prompt":"Of course. That should be obvious.","options":["offering additional information","returning to an earlier reference","repeating the other person's point and saying it is correct","giving a personal example","using logic"],"type":"choice/closed"}],[{"kind":"item","id":"b6015.i05","label":"5","prompt":"I would just repeat my suggestion that we depend on antibiotics as little as possible.","options":["offering additional information","returning to an earlier reference","repeating the other person's point and saying it is correct","giving a personal example","using logic"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 d 2 c 3 a 4 e 5 b","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":36,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b6017","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":2,"order":32,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use information from Listening 1 and Listening 2 to discuss the following questions.","pages":[71],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/50ea8c9f8b7fd35b4693165033886f6ef493c94394c592598ce1e3f5639c08d1.png"],"provided":"1 Do you think scientists are doing enough to find new ways of treating medical problems?\n2 Should we focus more on curing illnesses or preventing them from happening in the first place?\n3 Some people think that medical advances can sometimes go too far, and be bad for us. How far do you agree? Try to give some examples.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Do you think scientists are doing enough to find new ways of treating medical problems?"},{"kind":"text","text":"2 Should we focus more on curing illnesses or preventing them from happening in the first place?"},{"kind":"text","text":"3 Some people think that medical advances can sometimes go too far, and be bad for us. How far do you agree? Try to give some examples."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, I’m confident that scientists are\ndoing everything they can to treat\nmedical problems, including exploring\nunusual ways, such as using leeches.\n/ Unfortunately, as with the example\nof antibiotics, scientists often create\nas many problems as they try to solve.\nPerhaps if they thought more about\nthe long-term effects of their ideas, we\nwould have fewer problems.\n2 It’s often said that preventing illness is\nbetter than curing it, and I would agree.\nFor example, it would be better to\nencourage people to eat more healthily\nand to exercise so that they don’t get sick\nin the first place, rather than spend time\nand money treating illnesses that could\nhave been prevented. / There are some\nillnesses that cannot be prevented, no\nmatter how hard you try. People are always\ngoing to get ill, and it’s important that\nwhen they do, there are cures available.\n3 The way we have used antibiotics\nseems to have gone too far. Soon, it\nmight be possible that there won’t be\nany medicine strong enough to treat\nserious infections, because germs\nand bacteria have developed to fight\nagainst our medicines. / The situation\nwith antibiotics is certainly a warning\nthat we need to constantly fight against\ndiseases. But the idea that medical\nadvances are bad for us is totally\nwrong. People are living longer and\nhealthier lives now than at any time in\nhuman history, and that’s all thanks to\ndevelopments in medical science.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":36,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":8,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":9,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b6021","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":2,"order":33,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Read the information about Dr Sandra Smith and Mark Li, who debated the use of antibiotics in Listening 2, and discuss the questions on the next page. How much do you think the differences in background and motivation between Dr Smith and Mark Li affect their work? In what ways?","pages":[72,73],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/687bdd7c855711c7117d5a5c7a9191caacce66066c07553fd4df05931236d0d3.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8bd08b92111604abcc931fb7c84f91587c786d95ca7e1dcfa5a85b06f6a95242.png"],"provided":"Dr Sandra Smith is a medical doctor who researches new antibiotics at a national university. Some of her research has been paid for by drug companies.\n\nMark Li has a Master's degree in Environmental Studies. He is not an expert in medicine, but has spent most of his career trying to help people in developing countries. He is part of an organization that believes that companies should not make medicines for profit.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Dr Sandra Smith is a medical doctor who researches new antibiotics at a national university. Some of her research has been paid for by drug companies."},{"kind":"text","text":"Mark Li has a Master's degree in Environmental Studies. He is not an expert in medicine, but has spent most of his career trying to help people in developing countries. He is part of an organization that believes that companies should not make medicines for profit."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":3 y."},{"kind":"text","text":"We need a lot more equipment, and for that, we need better financial support."},{"kind":"text","text":"If we had more people working on this problem, we could achieve something."},{"kind":"text","text":"The real problem is the lifestyle that many of us have."},{"kind":"text","text":"There need to be stricter laws regarding the availability of certain drugs."},{"kind":"text","text":"We need to start listening to scientists more."}]],"courseMaterials":[{"id":"B04-LS-U03-publisher-page:p207","title":"原题或核对备注所引第207页","pages":[207],"text":"","screens":[],"sources":[{"page":207,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0d408b29e324012fb28a4666daa0a5707ce5e074636be6a43cf890d385aac265.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":37,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":10,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U03-question:b6028","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work with a partner. Discuss what Mark Li and Dr Sandra Smith might think of the topics below. Would they have the same opinions on any of the topics? Give reasons for your answers.","pages":[73],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8bd08b92111604abcc931fb7c84f91587c786d95ca7e1dcfa5a85b06f6a95242.png"],"provided":"1 improving conditions for animals to benefit humans\n2 treating diseases with food rather than medicine\n3 drug companies advertising their products on television\n4 doing exercise to promote health\n5 giving a child medicine to reduce a fever or other symptoms of illness\n6 free healthcare for everybody","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 improving conditions for animals to benefit humans"},{"kind":"text","text":"2 treating diseases with food rather than medicine"},{"kind":"text","text":"3 drug companies advertising their products on television"},{"kind":"text","text":"4 doing exercise to promote health"},{"kind":"text","text":"5 giving a child medicine to reduce a fever or other symptoms of illness"},{"kind":"text","text":"6 free healthcare for everybody"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 ML: If we look after nature, it will look\nafter us.\nSS: Humans and animals need to be\nstudied differently.\n2 ML: This is what people have always\ndone and it works.\nSS: Medicine is much more effective\nthan food.\n3 ML: They’re just trying to make you think\nyou’re ill and sell you a cure.\nSS: It’s a valuable way for people to\nlearn about how to treat illnesses.\n4 Both: Exercise has been proved to have\npositive health benefits.\n5 ML: The fever is the body’s way of\ndealing with the illness, you don’t need\nto give the child medicine.\nSS: Medicine such as paracetamol or\nibuprofen will relieve the symptoms and\nhelp the child feel better.\n6 ML: Everyone should have the right to\nfree – or at least affordable – healthcare.\nSS: This might seem like a good idea,\nbut free healthcare is never really free.\nSomeone has to pay for all the medical\nstaff, equipment and new research.","refere ercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/833bac4914a41ac2192ebae4ed19746ded430f41602e8073bf51648dd6f463d2.png"],"provided":"","items":[{"id":"b6038.i01","label":"1","prompt":"Fast food and sugary drinks should not be advertised on TV.","options":[],"type":"discuss/open"},{"id":"b6038.i02","label":"2","prompt":"Children should be taught more about good health in schools.","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U03-question:b6035","kind":"material-reference","title":"PREPARATION FOR SPEAKING Ex 1","pages":[76]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6038.i01","label":"1","prompt":"Fast food and sugary drinks should not be advertised on TV.","options":[],"type":"discuss/open"},{"kind":"item","id":"b6038.i02","label":"2","prompt":"Children should be taught more about good health in schools.","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B04-LS-U03-publisher-sheet:b6035","title":"PREPARATION FOR SPEAKING Ex 1 原题面","pages":[76],"text":"","screens":[],"sources":[{"page":76,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/280035bd0e8352a6ae8a8d36ced3d4ed3b34e6381ed473179b24724cf16e590a.png"}],"kind":"task_sheet","sourceBlockIds":["b6035"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 In my experience, I’ve often been tempted\nto buy unhealthy food, simply because\nof advertising. This was especially true\nwhen I was young. But let me ask you\nthis. Would people really just forget\nabout fast food and sugary drinks if they\nweren’t constantly reminded of it on TV?\n2 Obviously, we should teach children\nabout what it means to be healthy, and\nwhat they should do to keep fit. This is\nnot in any way a waste of their time in\nclass – what they learn will be useful for\nthem for the rest of their lives.","references":[{"source":"https:/ they highlighted the\nimmediate human impact, emphasizing\nthat healthcare access can save lives,\nespecially in underprivileged communities\nwhere people need it the most.\nUNIT 4\nUNLOCK YOUR\nKNOWLEDGE\npage 81\n1 They are in a forest. They look like they\nmight be camping. Or maybe they are\nstudying the wildlife, perhaps because\nthey want to preserve it.\n2 I would love a job, even if it’s just as a\nvolunteer, doing something to protect\nnature. I think everyone should do\nas much as they can to look after the\nworld around us. / Although I think it’s\nimportant to conserve the environment,\nI am not qualified enough to do\nanything meaningful.\n3 I think the media talks about the\nenvironment too much. We always hear\nbad news about the environment, and\nsometimes it makes me feel like there\nis nothing I can do about it. / I think\nthe media talks too little about the\nenvironment. It’s one of the biggest\nissues we face, and often the news\nseems to ignore it.\n4 I think everyone has an impact, even\nif it’s a very small one. I try to make\nenvironmentally-friendly choices, because\nI think it’s the right thing to do. / I don’t\nthink I have any particular impact. If I was\na billionaire or a president, then I could\nmake big changes and influence lots of\nother people’s behaviour. But it doesn’t\nreally matter what I do – I’m just an\nordinary person!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":10,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/ c":"MEDICINE","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[60],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94bd8224753b921df24e31b5e4c856796397b55082f8a24eb80502f752d2f1e8.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"compulsively","pos":"(adv)","definition":"doing something too much, and in a way that you can't stop","example":"He checked his phone compulsively, even during meals.","wordAudio":"compulsively","cardWord":false},{"term":"consultation","pos":"(n)","definition":"a meeting with a doctor to get advice about an illness","example":"She booked a consultation to discuss the pain in her knee.","wordAudio":"consultation","cardWord":false},{"term":"dismiss","pos":"(v)","definition":"to decide something is not important and not worth thinking about","example":"We should listen to the residents' concerns instead of dismissing them.","wordAudio":"dismiss","cardWord":false},{"term":"misdiagnosis","pos":"(n)","definition":"a decision that a person has a particular illness when in fact they have a different one","example":"A second opinion helped correct the original misdiagnosis.","wordAudio":"misdiagnosis","cardWord":false},{"term":"mobility","pos":"(adj)","definition":"the ability to move easily","example":"Practising the movements gradually improved her mobility.","wordAudio":"mobility","cardWord":false},{"term":"scenario","pos":"(n)","definition":"a possible situation in the future","example":"We need a plan for the scenario in which the power goes out.","wordAudio":"scenario","cardWord":false}]]}},{"id":"B04-LS-U03-classroom:video","book":4,"unit":3,"track":"LS","topic":"MEDICINE","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[60],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/94bd8224753b921df24e31b5e4c856796397b55082f8a24eb80502f752d2f1e8.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/3ecd92f8bc6f7191449253ef-L4LS-U03.mp4","captions":[{"start":1.48,"end":5.52,"text":"Communications technology has transformed the way we\nseek medical help."},{"start":6.2,"end":6.48,"text":"We are"},{"start":6.48,"end":6.68,"text":"no"},{"start":6.68,"end":10.52,"text":"longer required to visit a surgery for a consultation\nwith a doctor,"},{"start":11.12,"end":15,"text":"as their advice can often be provided over the phone or\nonline."},{"start":17.38,"end":25.4,"text":"Telemedicine is an expanding market that is expected to\nshow a worldwide annual growth rate of eight .57%."},{"start":25.4,"end":28.04,"text":"It has some great benefits for patients."},{"start":28.96,"end":33.32,"text":"Online consultations take place in the comfort of your\nhome or workplace."},{"start":34.36,"end":38.34,"text":"That means that medical advice is more accessible for\nmany people,"},{"start":38.7,"end":40.86,"text":"including those with mobility issues."},{"start":41.9,"end":46.06,"text":"It also reduces the risk of patient -to -patient\ninfection in doctors'"},{"start":46.4,"end":46.94,"text":"waiting rooms."},{"start":47.98,"end":48.48,"text":"However,"},{"start":48.82,"end":51.2,"text":"without examining a patient in person,"},{"start":51.64,"end":53.72,"text":"doctors could miss important symptoms."},{"start":53.72,"end":58.36,"text":"So telemedicine may be less effective in some\nscenarios."},{"start":59.72,"end":63.4,"text":"Telemedicine isn't the only way to get health\ninformation online."},{"start":64.34,"end":64.66,"text":"Today,"},{"start":65.04,"end":69.4,"text":"many of us use web content to diagnose our own health\nproblems."},{"start":70.56,"end":72.62,"text":"There are obvious advantages to this."},{"start":73.36,"end":78.88,"text":"The information is immediately available and can reveal\nthat a doctor's appointment is not needed."},{"start":79.8,"end":82.58,"text":"In one study in Saudi Arabia,"},{"start":83.5,"end":87.72,"text":"92 % of participants said they used the internet to\ncheck symptoms."},{"start":88.7,"end":89.08,"text":"However,"},{"start":89.52,"end":94.24000000000001,"text":"only 65 % of them actually believed online health\ninformation to be reliable."},{"start":95.3,"end":99.02000000000001,"text":"The remaining 35 % said they didn't trust what they\nread."},{"start":100.1,"end":101.08,"text":"The fact is,"},{"start":101.5,"end":104.8,"text":"checking symptoms online can lead to a misdiagnosis."},{"start":104.8,"end":107.74000000000001,"text":"It may lead you to dismiss an illness,"},{"start":108.06,"end":109.9,"text":"wrongly, as something temporary,"},{"start":110.62,"end":114.4,"text":"or to believe it to be more serious than is actually\nthe case."},{"start":118.3,"end":125.06,"text":"The term cyberchondriac describes someone who\ncompulsively searches the internet for medical\ninformation."},{"start":126.8,"end":130.28,"text":"Cyberchondriacs often imagine they have the symptoms\nthey read about."},{"start":130.28,"end":136.04,"text":"They become extremely anxious, and this stress can\ncause them to become physically ill."},{"start":137.34,"end":140.16,"text":"However much you value finding your own health\ninformation,"},{"start":140.86,"end":146.22,"text":"the best medical advice ultimately comes directly from\na qualified medical professional."}],"launchInline":true}},{"id":"B04-LS-U03-classroom:resource:b6002","book":4," async function display(i,p=0){

  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;

  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};

function outside(el,bounds){

}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
