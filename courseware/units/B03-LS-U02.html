:"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U02-question:b4284","book":3,"unit":2,"track":"LS","topic":"THE ENVIRONMENT","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Look again at the statements in Exercise 3. Do you agree or disagree with them? Discuss your opinions.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0444b19b005c45145c879a7c8be5b0bdba6363a8e3008c2da6568aa996b30603.png"],"provided":"I do worry that there could be a risk of a food crisis, but ...\n\nEven if we stop using fossil fuels, there might not be enough time to reverse the effects of climate change ...","items":[],"layout":"list","references":[{"id":"B03-LS-U02-question:b4283","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 3","pages":[46]}],"materials":[],"coursePages":[[{"kind":"text","text":"I do worry that there could be a risk of a food crisis, but ..."},{"kind":"text","text":"Even if we stop using fossil fuels, there might not be enough time to reverse the effects of climate change ..."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9bd592b7ca24f6285fd439fa52530cfef819f35bab4766cf614bff86575b0c6b.pdf","pdfPage":3,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U02-question:b4286","book":3,"unit":2,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":23,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"LISTENING 2"},"instruction":"Read the blog post about wind power. Then discuss the meaning of the words in bold with a partner. Use a dictionary to check your answers.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61e3f8bac9fee2f7bc9afb81810c5f04e1ae5d0b163cee376e7f372e4f5f2309.png"],"provided":"UNDERSTANDING KEY VOCABULARY\n\nThe benefits and risks of wind power\n\nMany people think wind power has a lot of benefits. First, it's very clean and it doesn't pollute the environment. Also, there are very few risks connected to wind power. Unlike coal mines and nuclear power plants, it is unlikely to cause accidents and it never leads to disasters. Most importantly, this source of energy is affordable. It's much cheaper than fossil fuels. However, not everybody thinks that wind power is a good idea.\n\nOpponents of wind power argue that the wind turbines can have a negative effect on the environment, and that turbines take up a lot of space. Opponents also say that the wind turbines aren't a long-term source of energy because, unlike nuclear power plants, the turbines need to be replaced after 10–15 years.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"UNDERSTANDING KEY VOCABULARY"},{"kind":"text","text":"The benefits and risks of wind power"},{"kind":"text","text":"Many people think wind power has a lot of benefits. First, it's very clean and it doesn't pollute the environment. Also, there are very few risks connected to wind power. Unlike coal mines and nuclear power plants, it is unlikely to cause accidents and it never leads to disasters. Most importantly, this source of energy is affordable. It's much cheaper than fossil fuels. However, not everybody thinks that wind power is a good idea."}],[{"kind":"text","text":"Opponents of wind power argue that the wind turbines can have a negative effect on the environment, and that turbines take up a lot of space. Opponents also say that the wind turbines aren't a long-term source of energy because, unlike nuclear power plants, the turbines need to be replaced after 10–15 years."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"benefit (n) - advantage\ndisaster (n) - a terrible accident which causes a\nlot of damage","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":31,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U02-question:b4287","book":3,"unit":2,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":24,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Discuss the questions below in a small group.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/61e3f8bac9fee2f7bc9afb81810c5f04e1ae5d0b163cee376e7f372e4f5f2309.png"],"provided":"USING YOUR KNOWLEDGE","items":[{"id":"b4287.i01","label":"1","prompt":"What advantages of wind power are mentioned in the blog post? Do you agree with them? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b4287.i02","label":"2","prompt":"What disadvantages of wind power are mentioned? Do you agree with them? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b4287.i03","label":"3","prompt":"What environmentally friendly sources of energy do you know about? Which ones are used in your country?","options":[],"type":"discuss/open"},{ NG","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Circle the correct answer. Think about the purpose of the words to help you.","pages":[53],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5ea5961581ae61f323df6a254c254c59333c04580f5dde8b4f3c499b7dedde65.png"],"provided":"","items":[{"id":"b4307.i01","label":"1","prompt":"In my opinion, nuclear energy is safe. Also / Though, it's cheap and clean.","options":["Also","Though"],"type":"choice/closed"},{"id":"b4307.i02","label":"2","prompt":"Solar energy is an unlimited source of energy. On the other hand / On top of that, it's safe and environmentally friendly.","options":["On the other hand","On top of that"],"type":"choice/closed"},{"id":"b4307.i03","label":"3","prompt":"Wind turbines produce clean energy and create many jobs plus / and yet many people are still unhappy to see them close to their homes.","options":["plus","and yet"],"type":"choice/closed"},{"id":"b4307.i04","label":"4","prompt":"There are many reasons why we should build a solar power plant. In addition / First of all, solar energy is affordable and safe.","options":["In addition","First of all"],"type":"choice/closed"},{"id":"b4307.i05","label":"5","prompt":"I think that nuclear power plants look ugly and destroy the landscape. In addition / Finally, they don't always provide jobs for local people.","options":["In addition","Finally"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b4307.i01","label":"1","prompt":"In my opinion, nuclear energy is safe. Also / Though, it's cheap and clean.","options":["Also","Though"],"type":"choice/closed","answer":{"label":"1","mode":"choice","option":0}},{"kind":"item","id":"b4307.i02","label":"2","prompt":"Solar energy is an unlimited source of energy. On the other hand / On top of that, it's safe and environmentally friendly.","options":["On the other hand","On top of that"],"type":"choice/closed","answer":{"label":"2","mode":"choice","option":1}},{"kind":"item","id":"b4307.i03","label":"3","prompt":"Wind turbines produce clean energy and create many jobs plus / and yet many people are still unhappy to see them close to their homes.","options":["plus","and yet"],"type":"choice/closed","answer":{"label":"3","mode":"choice","option":1}}],[{"kind":"item","id":"b4307.i04","label":"4","prompt":"There are many reasons why we should build a solar power plant. In addition / First of all, solar energy is affordable and safe.","options":["In addition","First of all"],"type":"choice/closed","answer":{"label":"4","mode":"choice","option":1}},{"kind":"item","id":"b4307.i05","label":"5","prompt":"I think that nuclear power plants look ugly and destroy the landscape. In addition / Finally, they don't always provide jobs for local people.","options":["In addition","Finally"],"type":"choice/closed","answer":{"label":"5","mode":"choice","option":0}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Also 2 On top of that 3 and yet 4 First of all\n5 In addition","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d3104b6d3853e0a9af504ae04d78c5af3cf3ec78e5bd4b12d08073b666548a50.pdf","pdfPage":33,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-LS-U02-question:b4308","book":3,"unit":2,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"order":37,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Read extracts from a discussion about building a new nuclear power plant near a city. Complete the extracts with words and phrases from the box.","pages":[54],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/86b1c46b718b2deffe1f7a3ea5b598bed378735c31c0a5cceb849f7eaccbe8f8.png"],"provided":"addition begin comparison first of all and yet overall second the other hand\n\nA: I would like to say that I completely disagree with the idea of building a nuclear power plant so close to the city. To (1) ____ begin ____ with, I understand that modern nuclear power plants are safer than they used to be and that the plant would be far from our homes. (2) ____ I worry about my children. If there is a nuclear disaster, our children will be exposed to radiation.\n\nB: I have to agree with this. I worry about the nuclear waste. There are two big questions here. (3) ____, how can we make sure that it doesn't leak into our water supply or soil? (4) ____, where are we going to get rid of the nuclear waste? I don't think the government should go ahead with this project. Instead, we could build a solar power plant. It would be cleaner. So, (5) ____, I think that solar energy would be the best option.\n\nC: I don't think it's completely true that solar panels are better than nuclear energy. Solar power is very expensive to set up and then what? In (6) ____, a nuclear power plant would be cheaper in the long term. And it would create more jobs.\n\nD: I agree that our city needs more jobs. In (7) ____, we need cheap, affordable energy. On the one hand, it's clear that a nuclear power plant will solve both these problems. On (8) ____, I worry about the plant being so close to our homes. I suggest that we build it as far from the city as possible.","items":[{"id":"b4308.i01","label":"1","prompt":"To ____ begin ____ with, I understand that modern nuclear power plants are safer than they used to be and that the plant would be far from our homes.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i02","label":"2","prompt":"____ I worry about my children. If there is a nuclear disaster, our children will be exposed to radiation.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i03","label":"3","prompt":"____, how can we make sure that it doesn't leak into our water supply or soil?","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i04","label":"4","prompt":"____, where are we going to get rid of the nuclear waste?","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i05","label":"5","prompt":"So, ____, I think that solar energy would be the best option.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i06","label":"6","prompt":"In ____, a nuclear power plant would be cheaper in the long term.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i07","label":"7","prompt":"In ____, we need cheap, affordable energy.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"id":"b4308.i08","label":"8","prompt":"On ____, I worry about the plant being so close to our homes.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"addition begin comparison first of all and yet overall second the other hand"},{"kind":"text","text":"A: I would like to say that I completely disagree with the idea of building a nuclear power plant so close to the city. To (1) ____ begin ____ with, I understand that modern nuclear power plants are safer than they used to be and that the plant would be far from our homes. (2) ____ I worry about my children. If there is a nuclear disaster, our children will be exposed to radiation."},{"kind":"text","text":"B: I have to agree with this. I worry about the nuclear waste. There are two big questions here. (3) ____, how can we make sure that it doesn't leak into our water supply or soil? (4) ____, where are we going to get rid of the nuclear waste? I don't think the government should go ahead with this project. Instead, we could build a solar power plant. It would be cleaner. So, (5) ____, I think that solar energy would be the best option."}],[{"kind":"text","text":"C: I don't think it's completely true that solar panels are better than nuclear energy. Solar power is very expensive to set up and then what? In (6) ____, a nuclear power plant would be cheaper in the long term. And it would create more jobs."},{"kind":"text","text":"D: I agree that our city needs more jobs. In (7) ____, we need cheap, affordable energy. On the one hand, it's clear that a nuclear power plant will solve both these problems. On (8) ____, I worry about the plant being so close to our homes. I suggest that we build it as far from the city as possible."}],[{"kind":"item","id":"b4308.i01","label":"1","prompt":"To ____ begin ____ with, I understand that modern nuclear power plants are safer than they used to be and that the plant would be far from our homes.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"},{"kind":"item","id":"b4308.i05","label":"5","prompt":"So, ____, I think that solar energy would be the best option.","options":["addition","begin","comparison","first of all","and yet","overall","second","the other hand"],"type":"choice/closed"}],[{"kind":"item","id":"b4308.i06","label":"6","prompt":"In ____, a nuclear power plant would be cheaper i om/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/12c9949286daa58245ec160476f5f390a5a7bcbffa7c3ea6806ec58371836a73.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/141cf426bff9d18cc64fa6b5ad87938ea8b0f318d16d4e37115adbca120d406b.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/92530c7ced8a4c81131ec6ce-L3LS-U02.mp4","captions":[{"start":9.78,"end":16.06,"text":"We humans use a lot of energy and some traditional\nenergy sources are running out."},{"start":17.12,"end":19.86,"text":"Where can we find alternative energy sources?"},{"start":21.68,"end":25.24,"text":"These days one popular source is wind."},{"start":32.74,"end":38.22,"text":"In 2013 an enormous offshore wind farm opened here in\nthe open sea."},{"start":38.86,"end":45.3,"text":"It's called the London Array and it's located about 12\nmiles from the southeast coast of England."},{"start":51.14,"end":55.5,"text":"How was it possible to build this giant wind farm in\nthe water?"},{"start":56.52,"end":58.26,"text":"This was the answer."},{"start":66.32,"end":71.88,"text":"Discovery is a special ship that can rise completely\nout of the water on giant legs."},{"start":72.6,"end":76.26,"text":"It made a safe building area in the middle of the sea\npossible."},{"start":77.3,"end":81.6,"text":"And it could hold all the parts to build each wind\nturbine."},{"start":89.96000000000001,"end":93.74000000000001,"text":"These huge pieces of the turbine look like airplane\nwings."},{"start":94.38,"end":99.22,"text":"They were designed to get as much energy as possible\neven from light winds."},{"start":112.28,"end":116.08,"text":"But as you can imagine they were difficult to assemble,"},{"start":116.56,"end":118.7,"text":"especially in windy weather."},{"start":131.7,"end":135.2,"text":"It took a team effort."},{"start":140.52,"end":144.2,"text":"Everything had to line up perfectly."},{"start":157.86,"end":159.26,"text":"Success"},{"start":163.74,"end":168.34,"text":"Each one of these wind turbines is almost 400 feet\nacross."},{"start":169,"end":172.72,"text":"That's 120 meters, about as big as the London Eye."},{"start":174.57999999999998,"end":177.52,"text":"And they built 175 of them."},{"start":179.92000000000002,"end":183.62,"text":"Every turbine can provide power for three ,000 homes."},{"start":183.62,"end":187.12,"text":"So now, because of the London Array Wind Farm,"},{"start":187.74,"end":191.24,"text":"over half a million homes in England have clean\nelectricity."}],"launchInline":true}},{"id":"B03-LS-U02-classroom:resource:b4289","book":3,"unit":2,"track":"LS","topic":"THE ENVIRONMENT","lesson":2,"module":"GLOSSARY","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b8aadbc86125abe1e92764c8f8e3abf6eec26c523682b11bac7f377ee2939f32.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"3","pages":[[{"term":"sustainable","pos":"(adj)","definition":"causing little or no damage to the environment, and therefore able to continue for a long time","example":"Growing food locally can be part of a sustainable food system.","wordAudio":"sustainable","cardWord":false},{"term":"low-income","pos":"(adj)","definition":"not having or making much money","example":"The scheme helps low-income families pay their heating bills.","wordAudio":"low-income","cardWord":false}]]}},{"id":"B03-LS-U02-classroom:review async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;

 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);

 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){

 classroomStage.connect(doc);
 updateReview();nav();resize();
}

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){

 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){

 const tabs=[...doc.querySelectorAll("[data-deck]")];

  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
