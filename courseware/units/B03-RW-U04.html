,"type":"choice/closed"},{"kind":"item","id":"b5534.i03","label":"3","prompt":"making a speech","options":[],"type":"choice/closed"}],[{"kind":"item","id":"b5534.i04","label":"4","prompt":"taking part in a ceremony","options":[],"type":"choice/closed"},{"kind":"item","id":"b5534.i05","label":"5","prompt":"learning something new","options":[],"type":"choice/closed"},{"kind":"item","id":"b5534.i06","label":"6","prompt":"eating particular foods","options":[],"type":"choice/closed"},{"kind":"item","id":"b5534.i07","label":"7","prompt":"taking photos","options":[],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"The activities which appear in the video: are giving\npresents, wearing traditional clothes, taking photos and\ntaking part in a ceremony.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":38,"title":"教师书"}]},"courseVisuals":[{"page":82,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e7e1673391e474741e747669d432457fc3e49b24b00f27d6d74be3ce3646245.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U04-question:b5538","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video and check your ideas in Exercise 2. Then work in pairs and discuss the question.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d30d574a1d4df2055b9bcc4cb0ff6f05c72cceb7b0cf0be745487be89412fffd.png"],"provided":"What are the differences between the modem and the traditional celebrations of coming-of-age day in South Korea?","items":[],"layout":"list","references":[{"id":"B03-RW-U04-question:b5534","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[82]}],"materials":[],"coursePages":[[{"kind":"text","text":"What are the differences between the modem and the traditional celebrations of coming-of-age day in South Korea?"}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c3af2b924e4dd637bda25aef-L3RW-U04.mp4","captions":[{"start":0,"end":3.58,"text":"In South Korea, as in many cultures around the world,"},{"start":4.04,"end":6.02,"text":"a coming -of -age day is celebrated."},{"start":7.26,"end":10.64,"text":"A celebration of the age at which a person becomes an\nadult."},{"start":12.28,"end":16.24,"text":"And gains all the rights and responsibilities that go\nalong with that."},{"start":16.88,"end":18,"text":"In South Korea,"},{"start":18.32,"end":21.82,"text":"coming -of -age day is celebrated on the same day for\neverybody."},{"start":22.38,"end":30.08,"text":"It is held on the third Monday in May for all 19 -year\n-olds who will become 20 -year -olds in the coming\nyear."},{"start":31.66,"end":33.66,"text":"In modern day South Korea,"},{"start":33.98,"end":37.12,"text":"many celebrate the day by giving gifts of flowers."},{"start":37.92,"end":41.64,"text":"Parents or friends often give 20 roses,"},{"start":42.02,"end":44.74,"text":"one for each year of the person's life."},{"start":46.3,"end":48.56,"text":"Perfume is another popular gift,"},{"start":49.2,"end":52.56,"text":"as it is not common for children to wear perfume."},{"start":53.6,"end":54.76,"text":"For South Koreans,"},{"start":55.58,"end":57.34,"text":"perfume has a special meaning."},{"start":57.98,"end":63.78,"text":"Giving perfume helps the new adult to become a person\nthat people remember."},{"start":65.54,"end":72.34,"text":"The modern coming -of -age day comes from a ceremony\nwhich dates back over one ,000 years."},{"start":73.1,"end":74.86,"text":"The hair -changing ceremony."},{"start":75.4,"end":76.44,"text":"For many years,"},{"start":76.9,"end":79.3,"text":"the old ceremony was not very common."},{"start":80.03999999999999,"end":80.98,"text":"But these days,"},{"start":81.42,"end":88.32,"text":"it is again possible to take part in the traditional\nceremony in many cities in South Korea."},{"start":90.06,"end":92.82,"text":"Young women do their hair in a shino,"},{"start":93.62,"end":94.68,"text":"with a binyar,"},{"start":95.14,"end":96.25999999999999,"text":"a jade hairpin."},{"start":97.52000000000001,"end":98.36,"text":"On their heads,"},{"start":98.68,"end":100.12,"text":"they wear a jokduri,"},{"start":100.68,"end":103.16,"text":"a kind of silk and wooden crown,"},{"start":103.82,"end":106.06,"text":"covered with colorful decorations,"},{"start":106.72,"end":108.5,"text":"including enamel ornaments."},{"start":109.52000000000001,"end":111.08,"text":"During the ceremony,"},{"start":111.68,"end":114.1,"text":"young men tie their hair under a net,"},{"start":114.46000000000001,"end":115.25999999999999,"text":"in a top knot."},{"start":116.36,"end":120.34,"text":"Later, they will put on a hat made of bamboo and\nhorsehair,"},{"start":120.8,"end":121.84,"text":"called a gat."},{"start":122.72,"end":129.56,"text":"The young people also learn how to put on the brightly\ncolored traditional formal clothing known as hanbok."},{"start":130.74,"end":131.28,"text":"In fact,"},{"start":131.62,"end":135.4,"text":"there are three different kinds of clothing ritual\nthroughout the day."},{"start":136.14,"end":144.72,"text":"This is an important day in every young Korean's life,\nas it is the day when they are independent for the\nfirst time,"},{"start":145.18,"end":147.26,"text":"able to make decisions for themselves,"},{"start":147.88,"end":149.42000000000002,"text":"drive and marry."},{"start":153.8,"end":156.07999999999998,"text":"The young adults bow to their parents."},{"start":156.76,"end":163.7,"text":"The parents bow in return and speak to their child of\nhow proud they are of them as they become adults."},{"start":166.98,"end":169.98,"text":"For those who take part in the traditional ceremony,"},{"start":170.7,"end":173.07999999999998,"text":"it is a day they will never want to forget."}]}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":38,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U04-question:b5539","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Complete the sentences about the coming-of-age day celebration in South Korea.","pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d30d574a1d4df2055b9bcc4cb0ff6f05c72cceb7b0cf0be745487be89412fffd.png"],"provided":"","items":[{"id":"b5539.i01","label":"1","prompt":"South Korean 19-year-olds celebrate becoming adults on the same ______.","options":[],"type":"gap/closed"},{"id":"b5539.i02","label":"2","prompt":"The gift of perfume has a special ______.","options":[],"type":"gap/closed"},{"id":"b5539.i03","label":"3"," ages":[[]],"courseMaterials":[{"id":"B03-RW-U04-classroom:material:RW-M03","title":"READING 1","text":"# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL\n2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN\n5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\nAUDI ARABIA\n7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.\n9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n[IMAGE_2]","screens":["# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL","2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN","5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so ors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL\n2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN\n5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\nAUDI ARABIA\n7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.\n9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n[IMAGE_2]","screens":["# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion doll re Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL\n2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN\n5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\nAUDI ARABIA\n7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.\n9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n[IMAGE_2]","screens":["# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a now some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL","2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN","5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using ssues":[]},{"id":"B03-RW-U04-question:b5563","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":2,"order":22,"module":"READING 2","ex":"2","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"instruction":"Work with a partner. Preview the article on page 91 and answer the questions.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e0b73f3979dd2ec19b3ec1a6c7e43542f2a285695b1c129c22aef0f82f2c5c7.png"],"provided":"","items":[{"id":"b5563.i01","label":"1","prompt":"Read the title. Look up any words you don't know. In your own words, explain what you think the title means. What will the article be about?","options":[],"type":"qa/open"},{"id":"b5563.i02","label":"2","prompt":"What is happening in the photos? How do you think they are related to the title?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b5563.i01","label":"1","prompt":"Read the title. Look up any words you don't know. In your own words, explain what you think the title means. What will the article be about?","options":[],"type":"qa/open"},{"kind":"item","id":"b5563.i02","label":"2","prompt":"What is happening in the photos? How do you think they are related to the title?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B03-RW-U04-publisher-page:p091","title":"原题或核对备注所引第91页","pages":[91],"text":"","screens":[],"sources":[{"page":91,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41784b3e4487d7a32e26b6213dda61bca84fa8622c7b0d8bac7d8e899f5288e0.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":40,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fbb85591a2032d28ee92c2eb2d0fb5c74a3e3535964ac126e81e1bb0e7976c12.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U04-question:b5565","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":2,"order":23,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the article and annotate it. Look at page 85 for what to write.","pages":[89],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7e0b73f3979dd2ec19b3ec1a6c7e43542f2a285695b1c129c22aef0f82f2c5c7.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B03-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?\n2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.\n3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\nYet today, most of the divers are in their 60s, 70s or 80s.\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n[IMAGE_13]\n4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.\n5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]","screens":["# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?","2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which arning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]"],"sources":[{"page":91,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41784b3e4487d7a32e26b6213dda61bca84fa8622c7b0d8bac7d8e899f5288e0.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_b982961134d09cea.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":40,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U04-question:b5568","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":2,"order":26,"module":"READING 2","ex":"6","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the essay again. Write T (true), F (false), or DNS (does not say) next to the statements below. Correct the false statements.","pages":[90],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/964f16a018e00059ce6f8764122809019932aeb38a84e3a768bdc710081220f3.png"],"provided":"","items":[{"id":"b5568.i01","label":"1","prompt":"The Great Barrier Reef is an example of intangible cultural heritage.","options" "options":[],"type":"discuss/open"},{"kind":"item","id":"b5572.i03","label":"3","prompt":"Think of a cultural practice in your country. What can the government do to protect it? Why is it important to protect it?","options":[],"type":"discuss/open"}]],"courseMaterials":[{"id":"B03-RW-U04-classroom:material:RW-M04","title":"READING 2","text":"# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?\n2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.\n3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\nYet today, most of the divers are in their 60s, 70s or 80s.\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n[IMAGE_13]\n4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.\n5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]","screens":["# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?","2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.","3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\nYet today, most of the divers are in their 60s, 70s or 80s.\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n[IMAGE_13]","4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.","5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]"],"sources":[{"page":91,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41784b3e4487d7a32e26b6213dda61bca84fa8622c7b0d8bac7d8e899f5288e0.p a partner. Compare your paraphrases. Can you make any improvements?","pages":[96],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ad69f1f9add4f56ab15c2821a83ee7541cee4cc0c0c235eafa7b2deb3b71eb99.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f34d1c0c80a291bb1ca36aa01b87b2c10313c5569fc5540f67b0fe9d5fd47999.pdf","pdfPage":42,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B03-RW-U04-question:b5599","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":2,"order":34,"module":"ACADEMIC WRITING SKILLS","ex":"1","context":{"moduleLabel":"ACADEMIC WRITING SKILLS","phaseTitle":"ACADEMIC WRITING SKILLS"},"instruction":"Read Reading 1 on page 86 again. Then, read a student's summary and response below. Answer the questions which follow on page 98. Answer the questions about the summary paragraph.","pages":[97,98],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0842bc72c7c51712a98fbaca394a00606948bcda913af409bbfcc68eeeaeec73.png","https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7067039e4174968df1dfd65170f76216a360ddbef7d26fa19ee581af2d11ab0f.png"],"provided":"## Summary and response\n\nIn the article 'Customs around the world', Schmidt (2018) says it is important for travellers to learn about the customs of other countries in order to prevent cultural misunderstandings in the places they are visiting. Schmidt focuses on three countries – Brazil, Japan and Saudi Arabia – and describes some customs visitors should know about. According to the author, Brazilians are informal people. They touch a lot and punctuality is not expected on most occasions. Japanese culture is exactly the opposite. People don't touch in public, and there are rules for how to exchange business cards, how to dress, what kind of gifts to give and when to arrive at a meeting or someone's home. Saudi culture is also formal. For example, women and men are not allowed to touch each other in public. The author stresses the importance of personal relationships and warns us that it is important to spend time asking about a host's family or health, before starting to talk about business matters.\n\nI definitely agree with Schmidt's main point: it is easy to make a mistake if you don't know about other people's customs. To give an example from my own experience, I was travelling in India when I was invited to dinner at a friend's home. I had never been to an Indian home, so I decided to do some reading about a proper gift to bring. One of the things I learnt is that a guest should not bring white flowers, because white is associated with death. Reading this information before the event prevented me from making an embarrassing mistake. In short, these examples remind us that travellers must study the customs of a new country before visiting it.","items":[{"id":"b5600.i01","label":"1","prompt":"Which sentence restates the main idea in Reading 1 on page 86?","options":[],"type":"qa/open"},{"id":"b5600.i02","label":"2","prompt":"Compare the main idea sentence in Reading 1 and the main idea sentence of the summary paragraph. Which paraphrasing strategies from the box on page 95 did the summary writer use?","options":[],"type":"qa/open"},{"id":"b5600.i03","label":"3","prompt":"What other information from Reading 1 did the writer include in the summary paragraph?","options":[],"type":"qa/open"},{"id":"b5600.i04","label":"4","prompt":"Which examples from Reading 1 did the writer include in the summary? Do you think this is too much, too little or the right amount of detail?","options":[],"type":"qa/open"},{"id":"b5600.i05","label":"5","prompt":"How many references to the author are there in the summary paragraph? Underline them.","options":[],"type":"qa/open"},{"id":"b5600.i06","label":"6","prompt":"Where does the writer give her opinion? Underline the sentence.","options":[],"type":"qa/open"},{"id":"b5600.i07","label":"7","prompt":"How does the writer support her opinion?","options":[],"type":"qa/open"},{"id":"b5600.i08","label":"8","prompt":"How does the writer conclude the essay? What transition does she use?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"In the article 'Customs around the world', Schmidt (2018) says it is important for travellers to learn about the customs of other countries in order to prevent cultural misunderstandings in the places they are visiting. Schmidt focuses on three countries – Brazil, Japan and Saudi Arabia – and describes some customs visitors should know about. According to the author, Brazilians are informal people. They touch a lot and punctuality is not expected on most occasions. Japanese culture is exactly the opposite. People don't touch in public, and there are rules for how to exchange business cards, how to dress, what kind of gifts to give and when to arrive at a meeting or someone's home. Saudi culture is also formal. For example, women and men are not allowed to touch each other in public. The author stresses the importance of personal"},{"kind":"text","text":"relationships and warns us that it is important to spend time asking about a host's family or health, before starting to talk about business matters."}],[{"kind":"text","text":"I definitely agree with Schmidt's main point: it is easy to make a mistake if you don't know about other people's customs. To give an example from my own experience, I was travelling in India when I was invited to dinner at a friend's home. I had never been to an Indian home, so I decided to do some reading about a proper gift to bring. One of the things I learnt is that a guest should not bring white flowers, because white is associated with death. Reading this information before the event prevented me from making an embarrassing mistake. In short, these examples remind us that travellers must study the customs of a new country before visiting it."},{"kind":"item","id":"b5600.i01","label":"1","prompt":"Which sentence restates the main idea in Reading 1 on page 86?","options":[],"type":"qa/open"},{"kind":"item","id":"b5600.i02","label":"2","prompt":"Compare the main idea sentence in Reading 1 and the main idea sentence of the summary paragraph. Which paraphrasing strategies from the box on page 95 did the summary writer use?","options":[],"type":"qa/open"}],[{"kind":"item","id":"b5600.i03","label":"3","prompt":"What other information from Reading 1 did the writer include in the summary paragraph?","options":[],"type":"qa/open"},{"kind":"item","id":"b5600.i04","label":"4","prompt":"Which examples from Reading 1 did the writer include in the summary? Do you think this is too much, too little or the right amount of detail?","options":[],"type":"qa/open"},{"kind":"item","id":"b5600.i05","label":"5","prompt":"How many references to the author are there in the summary paragraph? Underline them.","options":[],"type":"qa/open"},{"kind":"item","id":"b5600.i06","label":"6","prompt":"Where does the writer give her opinion? Underline the sentence.","options":[],"type":"qa/open"},{"kind":"item","id":"b5600.i07","label":"7","prompt":"How does the writer support her opinion?","options":[],"type":"qa/open"},{"kind":"item","id":"b5600.i08","label":"8","prompt":"How does the writer conclude the essay? What transition does she use?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B03-RW-U04-publisher-page:p086","title":"原题或核对备注所引第86页",
