protection.","anchor":{"kind":"line"}}]}},{"id":"B03-RW-U04-classroom:resource:b5529","book":3,"unit":4,"topic":"CUSTOMS AND TRADITIONS","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[80],"sourcePages":[80],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e23be2b353b8146144eab19a1fd529bc01e6fcf7ab058ff239b6dc1bf58259df.png"],"sourceHashes":["e23be2b353b8146144eab19a1fd529bc01e6fcf7ab058ff239b6dc1bf58259df"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a summary paragraph and a response paragraph."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about the Coming of Age Day in South Korea."},{"label":"Reading skills","text":"Annotate a text; preview a text."},{"label":"Critical thinking","text":"Respond to an author's ideas."},{"label":"Grammar","text":"Avoid absolute statements; use adverbs of frequency to avoid absolute statements; paraphrase."},{"label":"Academic writing skill","text":"Write a summary and a personal response."}],"photo":{"box":[281,248,455,781],"nativeWidth":772,"sourcePage":80,"alt":""}}]}},{"id":"B03-RW-U04-classroom:resource:b5535","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[82],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3e7e1673391e474741e747669d432457fc3e49b24b00f27d6d74be3ce3646245.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"rights","pos":"(n pl)","definition":"things the law allows you to do","example":"Workers have the same legal rights whether they are young or old.","wordAudio":"rights","cardWord":false},{"term":"responsibility","pos":"(n)","definition":"something that you must look after, deal with, pay for, etc.","example":"It is my responsibility to check that the door is locked.","wordAudio":"responsibility","cardWord":false},{"term":"date back","pos":"(phr v)","definition":"to have existed for a particular length of time, or since a particular time","example":"These records date back to the nineteenth century.","wordAudio":"date back","cardWord":false},{"term":"formal","pos":"(adj)","definition":"(of language, clothes and behaviour) suitable for serious or important occasions","example":"We wore formal clothes to the awards ceremony.","wordAudio":"formal","cardWord":false},{"term":"ritual","pos":"(n)","definition":"a set of particular actions, and sometimes words, which are part of a ceremony belonging to a particular culture","example":"Lighting a candle is part of the ritual.","wordAudio":"ritual","cardWord":false}]]}},{"id":"B03-RW-U04-classroom:video","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[83],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d30d574a1d4df2055b9bcc4cb0ff6f05c72cceb7b0cf0be745487be89412fffd.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/c3af2b924e4dd637bda25aef-L3RW-U04.mp4","captions":[{"start":0,"end":3.58,"text":"In South Korea, as in many cultures around the world,"},{"start":4.04,"end":6.02,"text":"a coming -of -age day is celebrated."},{"start":7.26,"end":10.64,"text":"A celebration of the age at which a person becomes an\nadult."},{"start":12.28,"end":16.24,"text":"And gains all the rights and responsibilities that go\nalong with that."},{"start":16.88,"end":18,"text":"In South Korea,"},{"start":18.32,"end":21.82,"text":"coming -of -age day is celebrated on the same day for\neverybody."},{"start":22.38,"end":30.08,"text":"It is held on the third Monday in May for all 19 -year\n-olds who will become 20 -year -olds in the coming\nyear."},{"start":31.66,"end":33.66,"text":"In modern day South Korea,"},{"start":33.98,"end":37.12,"text":"many celebrate the day by giving gifts of flowers."},{"start":37.92,"end":41.64,"text":"Parents or friends often give 20 roses,"},{"start":42.02,"end":44.74,"text":"one for each year of the person's life."},{"start":46.3,"end":48.56,"text":"Perfume is another popular gift,"},{"start":49.2,"end":52.56,"text":"as it is not common for children to wear perfume."},{"start":53.6,"end":54.76,"text":"For South Koreans,"},{"start":55.58,"end":57.34,"text":"perfume has a special meaning."},{"start":57.98,"end":63.78,"text":"Giving perfume helps the new adult to become a person\nthat people remember."},{"start":65.54,"end":72.34,"text":"The modern coming -of -age day comes from a ceremony\nwhich dates back over one ,000 years."},{"start":73.1,"end":74.86,"text":"The hair -changing ceremony."},{"start":75.4,"end":76.44,"text":"For many years,"},{"start":76.9,"end":79.3,"text":"the old ceremony was not very common."},{"start":80.03999999999999,"end":80.98,"text":"But these days,"},{"start":81.42,"end":88.32,"text":"it is again possible to take part in the traditional\nceremony in many cities in South Korea."},{"start":90.06,"end":92.82,"text":"Young women do their hair in a shino,"},{"start":93.62,"end":94.68,"text":"with a binyar,"},{"start":95.14,"end":96.25999999999999,"text":"a jade hairpin."},{"start":97.52000000000001,"end":98.36,"text":"On their heads,"},{"start":98.68,"end":100.12,"text":"they wear a jokduri,"},{"start":100.68,"end":103.16,"text":"a kind of silk and wooden crown,"},{"start":103.82,"end":106.06,"text":"covered with colorful decorations,"},{"start":106.72,"end":108.5,"text":"including enamel ornaments."},{"start":109.52000000000001,"end":111.08,"text":"During the ceremony,"},{"start":111.68,"end":114.1,"text":"young men tie their hair under a net,"},{"start":114.46000000000001,"end":115.25999999999999,"text":"in a top knot."},{"start":116.36,"end":120.34,"text":"Later, they will put on a hat made of bamboo and\nhorsehair,"},{"start":120.8,"end":121.84,"text":"called a gat."},{"start":122.72,"end":129.56,"text":"The young people also learn how to put on the brightly\ncolored traditional formal clothing known as hanbok."},{"start":130.74,"end":131.28,"text":"In fact,"},{"start":131.62,"end":135.4,"text":"there are three different kinds of clothing ritual\nthroughout the day."},{"start":136.14,"end":144.72,"text":"This is an important day in every young Korean's life,\nas it is the day when they are independent for the\nfirst time,"},{"start":145.18,"end":147.26,"text":"able to make decisions for themselves,"},{"start":147.88,"end":149.42000000000002,"text":"drive and marry."},{"start":153.8,"end":156.07999999999998,"text":"The young adults bow to their parents."},{"start":156.76,"end":163.7,"text":"The parents bow in return and speak to their child of\nhow proud they are of them as they become adults."},{"start":166.98,"end":169.98,"text":"For those who take part in the traditional ceremony,"},{"start":170.7,"end":173.07999999999998,"text":"it is a day they will never want to forget."}],"launchInline":true}},{"id":"B03-RW-U04-classroom:resource:b5544","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":1,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 1","phaseTitle":"PREPARING TO READ"},"pages":[84],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1944ba7aef0d0460a4387f3a9436126678d1c1cb44c739bb87f94c8294664251.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["appearance (n) the way someone or something looks\nculture (n) the way of life, especially customs and beliefs, of a group of people\nexchange (v) to give something to someone and receive something that they give you\nexpect (v) to think that something will or should happen","formal (adj) (of clothes, behaviour or language) serious or very polite\ngreet (v) to welcome someone with particular words or actions\nrelationship (n) the way two people or groups feel and behave towards each other"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B03-RW-U04-classroom:material:RW-M03","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[86],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/59d2024571ee298a087c9553e99142ce45ff511df1895088ecd90fce2cc277b3.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL","sourcePage":86},{"body":"2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN","sourcePage":86},{"body":"5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\nAUDI ARABIA","sourcePage":86},{"body":"7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.","sourcePage":86},{"body":"9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n[IMAGE_2]","sourcePage":86}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U04-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"CUSTOMS AROUND THE WORLD","pages":[{"page":86,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/59d2024571ee298a087c9553e99142ce45ff511df1895088ecd90fce2cc277b3.png","width":772,"height":1040}],"source":86,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL","sourcePage":86},{"body":"2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN","sourcePage":86},{"body":"5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\nAUDI ARABIA","sourcePage":86},{"body":"7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.","sourcePage":86},{"body":"9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n[IMAGE_2]","sourcePage":86}],"text":"# CUSTOMS AROUND THE WORLD\nY ANDY SCHMIDT\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n[IMAGE_1]\nWhy learn about cultures before travel —\n- know what to expect  \n- avoid misunderstandings\nRAZIL\n2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\nAPAN\n5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\nAUDI ARABIA\n7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.\n9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n[IMAGE_2]","media":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_4f4cd9cbf244d67a.mp3"},"original":{"id":"B03-RW-U04-material:RW-M03","entry":"material:RW-M03","unitId":"B03-RW-U04","book":3,"track":"RW","unit":4,"title":"READING 1","kind":"material","pages":[86],"sourceImages":[{"page":86,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/59d2024571ee298a087c9553e99142ce45ff511df1895088ecd90fce2cc277b3.png","viewEvidenceReported":true}],"text":"# CUSTOMS AROUND THE WORLD\n\nY ANDY SCHMIDT\n\n1 In recent decades, foreign travel has become a multi-billion dollar industry. International travel has many benefits, but visitors can run into trouble if they don't know some basic 'rules' about the cultures they're visiting. It is very important for travellers to take the time to learn about the cultures they plan to visit so that they know what to expect and how to avoid cultural misunderstandings. That is why we are presenting this 'Customs around the world' series, where we will look at three different cultures every month to help you become a well-informed traveller. This month's exciting destinations are Brazil, Japan and Saudi Arabia.\n\n[IMAGE_1]\n\nWhy learn about cultures before travel —\n\n- know what to expect  \n- avoid misunderstandings\n\nRAZIL\n\n2 In general, Brazilian culture is informal. Most Brazilians are very friendly people, so it is important to say hello and goodbye to the people you meet. Normally women kiss men and each other on the cheek, but men usually just shake hands. Brazilians typically stand very close to each other and touch each other's arms, elbows and back regularly while speaking. Even if this is unusual in your culture, try not to move away if this happens.\nIf you go to a business meeting, you are not expected to take a gift. In fact, an expensive gift can be seen as suspicious¹.\n\n3 On the other hand, if you are invited to someone's house, you should take a gift – for example, flowers or chocolate. However, avoid anything purple or black, as these colours are related to death.\n\n4 If you are invited to dinner, arrive at least 30 minutes late, but always dress well, because a person's appearance can be very important to Brazilians.\n\nAPAN\n\n5 The Japanese are quite different from the Brazilians. They tend to be quite formal, so don't stand too close. Kissing or touching in public is not common. When you meet Japanese people socially, they may shake your hand. However, bowing, bending forwards to show respect, is the traditional greeting.\n6 In a business meeting, the Japanese often like to know what your position is in your company before they talk to you. You should hand over a business card using both hands, and when you receive a business card, you should immediately read it carefully. It is important to be punctual². You should arrive early and dress formally. Gifts are often exchanged, but the recipient may refuse the gift at least once before accepting it. You should remember to do the same if you receive a gift. When you present your gift, you should say that it is a token of your appreciation³.\n\nAUDI ARABIA\n\n7 Saudi Arabia is a very traditional country. In business situations you should know that hierarchy⁴ is important to Saudis. Therefore, it is important to greet the oldest or the most senior person first. Men may shake hands with men, and women with women, always using the right hand. Men and women do not touch or shake hands in public.\n8 Personal relationships are very important in Saudi Arabia. In a business meeting, do not start with business matters immediately. Instead, start by asking about people's family or health. Arrive on time for business meetings, but do not be surprised if others are late. Punctuality is less important in Saudi Arabia than it is in Japan or the US. Business dress is formal. Men should wear dark suits and ties and women should wear modest clothes.\n9 Gifts are not expected at business meetings until those involved have formed a strong relationship. If you are invited to a Saudi home or office, acceptable gifts are good-quality chocolate, coffee or dates. Be careful not to admire the things the host owns, because he or she will feel obliged to give an item to you as a gift.\n\n¹ suspicious (adj) causing a feeling of distrust or that something is wrong\n² punctual (adj) on time\n³ token of your appreciation (n) an inexpensive gift meant to express thanks or gratitude\n⁴ hierarchy (n) status; a system for organizing people according to their importance\n\n[IMAGE_2]","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b5552"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_4f4cd9cbf244d67a.mp3","continueOnPage":true}},{"id":"B03-RW-U04-classroom:material:RW-M04","book":3,"unit":4,"track":"RW","topic":"CUSTOMS AND TRADITIONS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[91],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41784b3e4487d7a32e26b6213dda61bca84fa8622c7b0d8bac7d8e899f5288e0.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?","sourcePage":91},{"body":"2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.","sourcePage":91},{"body":"3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\nYet today, most of the divers are in their 60s, 70s or 80s.\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n[IMAGE_13]","sourcePage":91},{"body":"4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.","sourcePage":91},{"body":"5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]","sourcePage":91}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B03-RW-U04-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Protecting our","pages":[{"page":91,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41784b3e4487d7a32e26b6213dda61bca84fa8622c7b0d8bac7d8e899f5288e0.png","width":772,"height":1040}],"source":91,"embeddedIn":null,"photo":null,"clearPages":[{"body":"# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?","sourcePage":91},{"body":"2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.","sourcePage":91},{"body":"3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\nYet today, most of the divers are in their 60s, 70s or 80s.\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n[IMAGE_13]","sourcePage":91},{"body":"4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.","sourcePage":91},{"body":"5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]","sourcePage":91}],"text":"# Protecting our\n# intangible¹ cultural heritage²\nby Linda Barker\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?\n2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.\n3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\nYet today, most of the divers are in their 60s, 70s or 80s.\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n[IMAGE_13]\n4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.\n5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n¹intangible (adj) something which exists although you cannot touch it\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n[IMAGE_12]","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_b982961134d09cea.mp3"},"original":{"id":"B03-RW-U04-material:RW-M04","entry":"material:RW-M04","unitId":"B03-RW-U04","book":3,"track":"RW","unit":4,"title":"READING 2","kind":"material","pages":[91],"sourceImages":[{"page":91,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/41784b3e4487d7a32e26b6213dda61bca84fa8622c7b0d8bac7d8e899f5288e0.png","viewEvidenceReported":true}],"text":"# Protecting our\n# intangible¹ cultural heritage²\n\nby Linda Barker\n\n1 In today's ever-changing global landscape, most of us recognize the importance of preserving our own unique cultural heritage. But what do we save? A magnificent building which is under threat? A historical part of a city? An important work of art? All of these are significant, but what about our songs, stories, ceremonies and traditional practices? These intangible aspects of our culture can be just as meaningful as anything we build or create. Shouldn't they also be preserved for future generations to experience and enjoy?\n\n2 The answer, according to UNESCO (United Nations Educational, Scientific and Cultural Organization), is yes. That is why in 2008 it published its first Intangible Cultural Heritage (ICH) list. You may already know of UNESCO's famous list of World Heritage Sites, consisting of places selected for special protection because of their value to the world, such as the Pyramids of Giza in Egypt or the Great Barrier Reef in Australia. However, the ICH list is different. Its purpose is to record living customs and traditions which are endangered by globalization. These include languages and spoken traditions (such as storytelling and poetry), performing arts, traditional crafts and local knowledge and beliefs.\n\n3 Today, there are more than 600 customs and traditions on the ICH list. Two recent entries show us just how rich and varied are the practices selected for protection. The culture of the Jeju Haenyeo, the women divers of Jeju Island in South Korea, was added to the list in 2016.\n\nThese amazing women dive ten metres under the sea to get food – without the use of breathing equipment. They do this for up to seven hours a day, 90 days of the year, holding their breath for about one minute every dive. Knowledge about diving practices is passed down from generation to generation within families.\n\nYet today, most of the divers are in their 60s, 70s or 80s.\n\nAs they have become older, younger women have not stepped in to take their place, meaning the practice is in danger of disappearing.\n\n[IMAGE_13]\n\n4 Another cultural practice added to the ICH list in 2021 is falconry. This is the ancient custom of hunting with trained birds of prey, such as falcons and hawks. Regarded as both an art form and a sport, it requires years of training and discipline. Falconry is practised around the world from France to Mongolia to the United Arab Emirates, which is home to the world's first falcon hospital and each year hosts a falcon 'beauty contest'. Sadly, falconry is now threatened by the growth of cities and the loss of natural habitats. There are fears that the practice may disappear unless efforts to preserve it are successful.\n\n5 Both Jeju Haenyeo and falconry illustrate the tremendous range of cultural practices which the ICH list was created to preserve. And yet, while most of us would agree that UNESCO's efforts are valuable, I find myself questioning the fairness and usefulness of the ICH list. Why are some customs and practices included while others are not? Who decides this? Does inclusion on the list make a difference in the long term? In this age of rapid globalization, when fewer young people are interested in learning about the customs of their ancestors, it may already be too late to preserve much of our diverse and precious cultural heritage. But for the benefit of future generations, I believe we must never stop trying.\n\n¹intangible (adj) something which exists although you cannot touch it\n\n²heritage (n) traditions, languages or buildings belonging to the culture of a particular society which were created in the past and still have importance\n\n[I function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }
 return s.split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>").join("");
}
function itemHTML(x,letterChoices=false){

function bind(c){

 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};

  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));

function taskTable(table,feedback){

 }).join("")+'</tr>').join("");
 return '<div class="table-area task-table'+(table.questionColumn?' question-column':'')+(table.openBody?' open-board':'')+'"><table class="board">'+rows+'</table></div>';

function wireMaterials(doc,c,decks){

 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);

 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});

}

function measure(doc){

 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");

  if(outside(panel,box))return true;

  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);

 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};
