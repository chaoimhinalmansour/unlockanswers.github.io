re several new cycle\nlanes have been introduced and which\nseem to be very popular, especially at\ncommuting times. / This is not the case\nwhere I live. Cycling has never been a\npopular form of transport because the\nroads are very busy and people don’t\nthink it is safe.\n2 I don’t agree – I think bikes are ideal\nfor both leisure purposes and for\ncommuting. / I think this is true. Cycling\ncan be inconvenient because often\nyou need to change clothes or have a\nshower after cycling, and it is not always\npossible to do this at work or university.\n3 E-bikes are likely to occupy a larger and\nlarger market share. But because of the\nhigher cost, I don’t think they’ll ever\nmake traditional bikes obsolete. / Yes,\nbecause electric bikes make it easier\nto travel quickly and with less effort,\nmaking them a more attractive\nalternative to cars than traditional bikes.\n4 I doubt whether this is true, as I think\nspeed, size and weight are likely to be\nmore important to the average customer\nthan appearance. / Although I don’t\nthink it is the only factor, I think people\nare often heavily influenced by how\nsomething looks. They might choose a\nbike that looks more impressive over a\nbike that has better specifications but\nwhich is less attractive.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7460","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":3,"module":"WATCH AND LISTEN","ex":"2","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Number the main ideas in the order you hear them.","pages":[38],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/91f0894247ee0474857d442327231a7c253a1ebc0a3eadcbf53785caa2e08bf7.png"],"provided":"____ A Japanese designer has started making luxury bicycles instead of boats.\n____ Hermès have launched two designer bicycles.\n____ Hermès' designer bikes are extremely popular.\n____ People are using bicycles to show how much money they have.\n____ Shops in Paris sell a variety of expensive cycling products.","items":[{"id":"b7460.i01","label":"1","prompt":"____ A Japanese designer has started making luxury bicycles instead of boats.","options":[],"type":"gap/closed"},{"id":"b7460.i02","label":"2","prompt":"____ Hermès have launched two designer bicycles.","options":[],"type":"gap/closed"},{"id":"b7460.i03","label":"3","prompt":"____ Hermès' designer bikes are extremely popular.","options":[],"type":"gap/closed"},{"id":"b7460.i04","label":"4","prompt":"____ People are using bicycles to show how much money they have.","options":[],"type":"gap/closed"},{"id":"b7460.i05","label":"5","prompt":"____ Shops in Paris sell a variety of expensive cycling products.","options":[],"type":"gap/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"____ A Japanese designer has started making luxury bicycles instead of boats."},{"kind":"text","text":"____ Hermès have launched two designer bicycles."},{"kind":"text","text":"____ Hermès' designer bikes are extremely popular."},{"kind":"text","text":"____ People are using bicycles to show how much money they have."},{"kind":"text","text":"____ Shops in Paris sell a variety of expensive cycling products."}]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/36866d5a1f52803022fdb4ad-L5LS-U02.mp4","captions":[{"start":1.72,"end":9.28,"text":"Pedal chic is in the air and luxury brand Hermes is one\nof the latest to turn cycling into a fashion statement."},{"start":9.92,"end":15.18,"text":"Eight months ago, Hermes launched Le Flaneur and more\nrecently, Le Flaneur Sportif."},{"start":15.88,"end":17.46,"text":"With a carbon fibre frame,"},{"start":17.88,"end":20.22,"text":"a silent chain and classic style,"},{"start":20.72,"end":23.86,"text":"this bike costs a cool eight ,000 euros."},{"start":24.38,"end":27.18,"text":"And Hermes is struggling to keep up with demand."},{"start":30.06,"end":33.18,"text":"Today we're in line with the objectives we'd set."},{"start":33.6,"end":37.48,"text":"There was a real gap in the market that now with our\nproduction in full swing,"},{"start":37.84,"end":39.6,"text":"we're really trying to meet."},{"start":41.4,"end":41.96,"text":"In Tokyo,"},{"start":42.4,"end":45.24,"text":"designer bikes can sell for 15 ,000 euros."},{"start":46.24,"end":53.1,"text":"Juan Locorazo -san is using his experience in yacht\nmanufacturing to create beautiful bicycles made from\nmahogany."},{"start":57.56,"end":63.3,"text":"My ancestors taught me how to manufacture boats and now\nI'm using that knowledge to make bikes."},{"start":64.32,"end":68.64,"text":"I think it's the first time that the whole world\nrecognises Japanese talent in this area."},{"start":69.2,"end":73.88,"text":"That's why even if it doesn't make me much money, I\nhave to keep doing it."},{"start":76.1,"end":77.36,"text":"Back in Paris,"},{"start":77.9,"end":80.98,"text":"bicycle sellers are finding another way of boosting\nsales."},{"start":81.38,"end":85.84,"text":"By personalising the accessories that every posh\npeddler needs,"},{"start":86.2,"end":89.64,"text":"from leather saddlebags to hand -painted bells."},{"start":91.7,"end":96.6,"text":"What we can find are these pretty bells painted by hand\nin Japan,"},{"start":97.3,"end":98.94,"text":"these little leather purses,"},{"start":99.3,"end":100.68,"text":"these key rings in leather,"},{"start":101.3,"end":104.25999999999999,"text":"a nice collection of lead cyclists painted by hand,"},{"start":104.7,"end":106.53999999999999,"text":"like when we were children."},{"start":107.42,"end":109.06,"text":"Now, like a car,"},{"start":109.42,"end":111.36,"text":"a watch or a pair of shoes,"},{"start":111.78,"end":117.25999999999999,"text":"the humble bicycle is evolving into a showcase for\nwealth and social status."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"3, 1, 2, 5, 4","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":28,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7462","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again. Complete the sentences.","pages":[39],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/4d7fa5f50015e0f4049ae34181a6dd14af619d1631f9c90f4eb1f3e870c8f703.png"],"provided":"","items":[{"id":"b7462.i01","label":"1","prompt":"Hermès started making designer bicycles because there was a ____.","options":[],"type":"gap/closed"},{"id":"b7462.i02","label":"2","prompt":"The Japane / I don’t see it\nas owning a status symbol but rather\nhaving an item which I can keep in\ngood condition and only use for special\noccasions. For example, I would like a\nluxury watch which I would only wear\nto events like weddings, important\nmeetings or parties.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":28,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7468","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":7,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a presentation on current and future uses for 3-D printing. Before you listen, work with a partner. Discuss which of the items in the photos you think were produced by a 3-D printer. Then discuss the questions below.","pages":[40],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/bd3c7deb6228cbd057c5811a7403a5e857f445017e695c0ef6f19dbea59c8b10.png"],"provided":"","items":[{"id":"b7468.i01","label":"1","prompt":"All these items were made with a 3-D printer. Does that surprise you? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b7468.i02","label":"2","prompt":"What kind of objects cannot be created with a 3-D printer today?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7468.i01","label":"1","prompt":"All these items were made with a 3-D printer. Does that surprise you? Why / Why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7468.i02","label":"2","prompt":"What kind of objects cannot be created with a 3-D printer today?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 That doesn’t particularly surprise me, as\nI already knew that 3D printing can\nproduce a huge range of products. / Yes,\nit does. I knew that 3D printing could be\nused to make some objects, but I have\nnever seen anything as complex as a\nbody part.\n2 As far as I know, a 3D printer would\nbe unable to produce a whole mobile\nphone, although it could make individual\ncomponents of the phone. But as the\ntechnology is changing so rapidly,\nthis may become possible in the very\nnear future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":3,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7470","book":5,"unit":2,"track":"LS","topic":"DESIGN"," ars, etc."},{"kind":"item","id":"b7480.i01","label":"1b","prompt":"1 Methods of printing replacement body parts are in development. b ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7480.i02","label":"1c","prompt":"1 Methods of printing replacement body parts are in development. c ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7480.i03","label":"2","prompt":"2 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7480.i04","label":"2a","prompt":"2 a ____","options":[],"type":"gap/open"},{"kind":"item","id":"b7480.i05","label":"2b","prompt":"2 b ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b7480.i06","label":"2c","prompt":"2 c ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 2.1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6566db61093b5ff3c15eeec2e48463bfd8c892ad83c1fbfa81b1e57351ad9158.mp3"}],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":29,"title":"合组答案来源"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7481","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":15,"module":"LISTENING 1","ex":"9","context":{"moduleLabel":"LISTENING 1","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Complete the tasks.","pages":[43],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/83b89dacbe3e4b3fa442063d39df04af8640fb69eb1c8c983ad79abb77f4d769.png"],"provided":"1 Use your notes from Exercise 8 to recap the talk on 3-D printing. Include only the main points and important details. Present it aloud to your partner.\n2 As you listen to your partner's presentation, write down any important details that your partner included that you missed. Add them to your notes.\n3 Whose recap do you think was more accurate and complete? Does the order of main points make a difference? Were the details presented with the relevant main points?","items":[],"layout":"list","references":[{"id":"B05-LS-U02-question:b7480","kind":"student-work","title":"LISTENING 1 Ex 8","pages":[43]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Use your notes from Exercise 8 to recap the talk on 3-D printing. Include only the main points and important details. Present it aloud to your partner."},{"kind":"text","text":"2 As you listen to your partner's presentation, write down any important details that your partner included that you missed. Add them to your notes."},{"kind":"text","text":"3 Whose recap do you think was more accurate and complete? Does the order of main points make a difference? Were the details presented with the relevant main points?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 There are various applications of\n3D printing to consider, starting with\nhealthcare. It is now possible to create\nreplacement body parts, such as ears\nand bone. Because the process can use\nthe patient’s own cells, the chances of\nrejection by the body of a replacement\npart are relatively low.\nThe fashion industry is also using\ninnovations in 3D printing. These give\ndesigners greater creative freedom, for\nexample to customize their designs.\nCustomers could also benefit too,\nfor example they would be able to\ndownload a design they like and print it\nat home. However, one downside is that\nthe material used for clothing is a stiff\nplastic and not particularly comfortable.\nAnother disadvantage is that the price is\nstill very high.\nHaving said that, 3D printing can\nmake production more affordable, for\nexample when only a single item is\nneeded. When items can be produced\nby anyone with a printer, the traditional\nmodels of assembly and supply would\nbe drastically disrupted. The speaker\ngave the example of a person who was\nable to print an aeroplane component,\nwhich previously would have consisted\nof many different parts, each produced\nin a different factory.\nAs 3D printing makes it easier to\nproduce an individual component, it\nmay be that this makes repairing things\nmore economical than is currently the\ncase, which has environmental benefits.\nHowever, it could simply lead to more\njunk being produced simply because it\nis easier to do. There is also the risk of\nmisuse of the technology, for example,\nby criminals replacing bank machine\ncomponents, or for the manufacture\nof weapons.\n2 and 3 To be honest, I think that my\npartner’s summary and mine were equally\naccurate and complete. Although we had\nrecorded the points in the same order,\nI don’t think it would have mattered if we\nhad used a slightly different order. Yes,\nwe both recorded the same details in\nsupport of the same main points.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7484","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":16,"module":"LISTENING 1","ex":"10","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PRONUNCIATION FOR LISTENING"},"instruction":"Underline the stressed syllables in the words below.","pages":[44],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f10f2b1e989f3682073aac5007312ca74b6ad9e4307cd56fac8877f5040cb43f.png"],"provided":"","items":[{"id":"b7484.i01","label":"1a","prompt":"tech-no-lo-gy","options":[],"type":"select/closed"},{"id":"b7484.i02","label":"1b","prompt":"pro-cess","options":[],"type":"select/closed"},{"id":"b7484.i03","label":"1c","prompt":"ob-ject (n)","options":[],"type":"select/closed"},{"id":"b7484.i04","label":"2a","prompt":"com-pu-ter","options":[],"type":"select/closed"},{"id":"b7484.i05","label":"2b","prompt":"soft-ware","options":[],"type":"select/closed"},{"id":"b7484.i06","label":"2c","prompt":"sce-nar-i-os","options":[],"type":"select/closed"},{"id":"b7484.i07","label":"3a","prompt":"dra-ma-tic","options":[],"type":"select/closed"},{"id":"b7484.i08","label":"3b","prompt":"bi-o-med-i-cal","options":[],"type":"select/closed"},{"id":"b7484.i09","label":"3c","prompt":"re-search (n)","options":[],"type":"select/closed"},{"id":"b7484.i10","label":"4a","prompt":"at-tracts","options":[],"type":"select/closed"},{"id":"b7484.i11","label":"4b","prompt":"pos-si-bil-i-ty","options":[],"type":"select/closed"},{"id":"b7484.i12","label":"4c","prompt":"cus-tom-iz-ing","options":[],"type":"select/closed"},{"id":"b7484.i13","label":"5a","prompt":"pro-duc-tion","options":[],"type":"select/closed"},{"id":"b7484.i14","label":"5b","prompt":"fa-cil-i-ties","options":[],"type":"select/ ral times. What do you think the long-term consequences might be for the clothing industry? For example, what would happen if all clothing could be printed at home?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7487.i02","label":"2","prompt":"Use your imagination to think of an application for 3-D printing that was not discussed by the speaker. Share your ideas with another pair of students or the class.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 If all clothing could be printed at home,\nthe clothing industry would likely\nshrink, with fewer traditional stores and\nfactories. Brands might shift to selling\ndigital designs instead of physical\nproducts. People would also have more\ncustomization options, but it could lead\nto more waste and fast-fashion cycles\nunless sustainable materials are used.\n2 3D printing could be used for homes\nto create building parts or decorative\nitems. It might be possible one day\nto have 3D printed food. In education\nit could be used to create models or\nartefacts for hands-on learning. It could\nbe used in art to create sculptures.\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":29,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7491","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":19,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Underline the cause in each sentence. Then complete the sentences with a suitable effect.","pages":[45],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/49b05ff106f21bd3d159b3a25df4d3da4fdeb5c7171e7095aadc389fd0c04b2a.png"],"provided":"","items":[{"id":"b7491.i01","label":"1","prompt":"By making the rucksack designs available in lots of bright colours, the company made its products very popular with young children.","options":[],"type":"gap_select/open"},{"id":"b7491.i02","label":"2","prompt":"By constantly designing new products, marketers ____.","options":[],"type":"gap_select/open"},{"id":"b7491.i03","label":"3","prompt":"By replacing the aluminium frame in the bicycles, the manufacturers ____.","options":[],"type":"gap_select/open"},{"id":"b7491.i04","label":"4","prompt":"By working overnight, the team ____.","options":[],"type":"gap_select/open"},{"id":"b7491.i05","label":"5","prompt":"By using AI in the design process, the chief engineer ____.","options":[],"type":"gap_select/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7491.i01","label":"1","prompt":"By making the rucksack designs available in lots of bright colours, the company made its products very popular with young children.","options":[],"type":"gap_select/open"},{"kind":"item","id":"b7491.i02","label":"2","prompt":"By constantly designing new products, marketers ____.","options":[],"type":"gap_select/open"},{"kind":"item","id":"b7491.i03","label":"3","prompt":"By replacing the aluminium frame in the bicycles, the manufacturers ____.","options":[],"type":"gap_select/open"},{"kind":"item","id":"b7491.i04","label":"4","prompt":"By working overnight, the team ____.","options":[],"type":"gap_select/open"},{"kind":"item","id":"b7491.i05","label":"5","prompt":"By using AI in the design process, the chief engineer ____.","options":[],"type":"gap_select/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 By constantly designing new products,\nmarketers ensure customers buy new\nproducts on a regular basis.\n3 By replacing the aluminium frame in the\nbicycles, the manufacturers made them\n10% lighter.\n4 By working overnight, the team\ncompleted the project on time.\n5 By using AI in the design process, the\nchief engineer gave the car a more\nattractive appearance.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7492","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":20,"module":"LANGUAGE DEVELOPMENT","ex":"2","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Rewrite each sentence with an -ing phrase for the effect.","pages":[45],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e ],"courseAnswer":{"kind":"model-excerpt","text":"1 By moving the bed to the wall, I made\nmy room seem much larger.\n2 By combining our tiny office rooms,\nthe architect will create one large\nopen-plan office.\n3 By using a printer to make the\ncomponent, she used less plastic,\nlowering the cost by 20%.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7494","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"4","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work with a partner. Develop these ideas, adding either a cause, an effect, or both. Then compare your answers with another pair.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/64f583bad2b5b5f1746063c9ecc6f4df08a6b01d7bebb837ec8c16f2838cf0f3.png"],"provided":"1 we added photographs to our student website\nBy adding new photographs to our student website, we made it much more user-friendly, increasing visitor numbers by up to 15%.","items":[{"id":"b7494.i01","label":"1","prompt":"we added photographs to our student website","options":[],"type":"discuss/open"},{"id":"b7494.i02","label":"2","prompt":"the company responded to my complaint","options":[],"type":"discuss/open"},{"id":"b7494.i03","label":"3","prompt":"I improved my speaking skills","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U02-question:b7493","kind":"student-work","title":"LANGUAGE DEVELOPMENT Ex 3","pages":[46]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 we added photographs to our student website"},{"kind":"text","text":"By adding new photographs to our student website, we made it much more user-friendly, increasing visitor numbers by up to 15%."},{"kind":"item","id":"b7494.i02","label":"2","prompt":"the company responded to my complaint","options":[],"type":"discuss/open"},{"kind":"item","id":"b7494.i03","label":"3","prompt":"I improved my speaking skills","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"2 The company responded to my\ncomplaint by offering me compensation.\n3 By staying with a local family, I improved\nmy speaking skills.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7497","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":1,"order":23,"module":"LANGUAGE DEVELOPMENT","ex":"5","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"DEGREE EXPRESSIONS"},"instruction":"Complete the questions using degree expressions with too or enough. Use your own ideas. Then answer the questions with a partner.","pages":[46],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/64f583bad2b5b5f1746063c9ecc6f4df08a6b01d7bebb837ec8c16f2838cf0f3.png"],"provided":"","items":[{"id":"b7497.i01","label":"1","prompt":"What do you do when your phone is too old ...?","options":[],"type":"gap/open"},{"id":"b7497.i02","label":"2","prompt":"Do you ever struggle to read something because the font ...?","options":[],"type":"gap/open"},{"id":"b7497.i03","label":"3","prompt":"Have you ever tried to play a video game that was too ...?","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7497.i01","label":"1","prompt":"What do you do when your phone is too old ...?","options":[],"type":"gap/open"},{"kind":"item","id":"b7497.i02","label":"2","prompt":"Do you ever struggle to read something because the font ...?","options":[],"type":"gap/open"},{"kind":"item","id":"b7497.i03","label":"3","prompt":"Have you ever tried to play a video game that was too ...?","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 What do you do when your phone is too\nold to receive updates?\nWhen that happens, I reluctantly buy a\nreplacement and recycle the old one.\n2 Do you ever struggle to read something\nbecause the font isn’t large enough for\nyou to see it clearly?\nTo be honest, no, because my eyesight\nis pretty good. But when I’m older, I\nguess I probably will start to struggle\na bit.\n3 Have you ever tried to play a video\ngame that was too complicated for you\nto properly understand the rules?\nNot personally, but there is a game\nI play which I know some people find\ncomplicated, because there are too\nmany characters, and it can be hard to\nremember who they all are.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7500","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":24,"module":"LISTENING 2","ex":"1","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Read the questions. Write the words in bold next to their definitions below.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"1 Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?\n2 Apart from innovation in product design, what has been the main reason for Apple's success?\n3 Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?\n4 Why might manufacturers try to circumvent the environmental standards they are supposed to meet?\n5 Have you ever had to devise a creative solution to a problem?\n6 If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?\n7 What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?\n8 If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?\na ____ (v) to feel angry because you have been forced to accept something that you do not like\nb ____ (v) to say or send out something official\nc ____ (n) the development of new products, or ideas\nd ____ (v) to find a way of avoiding something, especially a law or rule\ne ____ (v) to create a plan using intelligence and creativity\nf ____ (n) a strong negative reaction\ng ____ (adj) limited, set and fixed\nh ____ (n) something that prevents progress","items":[{"id":"b7500.i01","label":"a","prompt":"____ (v) to feel angry because you have been forced to accept something that you do not like","options":["backlash","innovation","resent","circumvent","devise","issue","obstacle","finite"],"type":"choice/closed"},{"id":"b7500.i02","label":"b","prompt":"____ (v) to say or send out something official","options":["backlash","innovation","resent","circumvent","devise","issue","obstacle","finite"],"type":"choice/closed"},{"id":"b7500.i03","label":"c","prompt":"____ (n) the development of new products, or ideas","options":["backlash","innovation","resent","circumvent","devise","issue","obstacle","finite"],"type":"choice/closed"},{"id":"b7500.i04","label":"d","prompt":"____ (v) to find a way of avoiding something, especially a law or rule","options":["backlash","innovation","resent","circumvent","devise","issue","obstacle","finite"],"type":"choice/closed"},{"id":"b7500.i05","label":"e","prompt":"____ (v) to create a plan using intelligence and creativity","options":["backlash","innovation","resent","c mething official"}],[{"kind":"text","text":"c ____ (n) the development of new products, or ideas"},{"kind":"text","text":"d ____ (v) to find a way of avoiding something, especially a law or rule"},{"kind":"text","text":"e ____ (v) to create a plan using intelligence and creativity"},{"kind":"text","text":"f ____ (n) a strong negative reaction"},{"kind":"text","text":"g ____ (adj) limited, set and fixed"},{"kind":"text","text":"h ____ (n) something that prevents progress"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a resent b issue c innovation d circumvent\ne devise f backlash g finite h obstacle","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7501","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":25,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss the questions in Exercise 1.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U02-question:b7500","kind":"material-reference","title":"LISTENING 2 Ex 1","pages":[47]}],"materials":[],"coursePages":[[{"kind":"text","text":"Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?"},{"kind":"text","text":"Apart from innovation in product design, what has been the main reason for Apple’s success?"},{"kind":"text","text":"Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?"},{"kind":"text","text":"Why might manufacturers try to circumvent the environmental standards they are supposed to meet?"},{"kind":"text","text":"Have you ever had to devise a creative solution to a problem?"}],[{"kind":"text","text":"If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?"},{"kind":"text","text":"What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?"},{"kind":"text","text":"If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?"}]],"courseMaterials":[{"id":"B05-LS-U02-publisher-sheet:b7500","title":"LISTENING 2 Ex 1 原题面","pages":[47],"text":"1 Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?\n2 Apart from innovation in product design, what has been the main reason for Apple's success?\n3 Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?\n4 Why might manufacturers try to circumvent the environmental standards they are supposed to meet?\n5 Have you ever had to devise a creative solution to a problem?\n6 If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?\n7 What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?\n8 If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?\na ____ (v) to feel angry because you have been forced to accept something that you do not like\nb ____ (v) to say or send out something official\nc ____ (n) the development of new products, or ideas\nd ____ (v) to find a way of avoiding something, especially a law or rule\ne ____ (v) to create a plan using intelligence and creativity\nf ____ (n) a strong negative reaction\ng ____ (adj) limited, set and fixed\nh ____ (n) something that prevents progress","screens":["1 Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?","2 Apart from innovation in product design, what has been the main reason for Apple's success?","3 Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?","4 Why might manufacturers try to circumvent the environmental standards they are supposed to meet?","5 Have you ever had to devise a creative solution to a problem?","6 If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?","7 What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?","8 If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?","a ____ (v) to feel angry because you have been forced to accept something that you do not like","b ____ (v) to say or send out something official","c ____ (n) the development of new products, or ideas","d ____ (v) to find a way of avoiding something, especially a law or rule","e ____ (v) to create a plan using intelligence and creativity","f ____ (n) a strong negative reaction","g ____ (adj) limited, set and fixed","h ____ (n) something that prevents progress"],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"}],"kind":"task_sheet","sourceBlockIds":["b7500"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 When Coca Cola changed the taste of\ntheir drink in 1985, the company faced\na huge backlash from customers who\ndidn’t like the new flavour.\n2 Another major reason is Apple’s clever\nmarketing and advertising.\n3 Some may resent this, but I suspect\nmost people would just accept it as a\nfact of life.\n4 Many manufacturers circumvent\nenvironmental requirements in order\nto save money. I think there should be\ntougher checks to ensure that standards\nare being fully met.\n5 Yes, when I worked in a cafe, I had to\ndevise a new staff shift rota, which was\nactually more difficult than it sounds. /\nMy classmate came up with a very\ngood idea to solve a problem with our\nengineering project. He wrote a piece of\ncode which saved us a lot of time!\n6 I would include guidelines about\nrecycling as much of every old device as\npossible. I would also require companies\nto contact local schools and charities to\nsee if they could use the equipment.\n7 The drive towards profitability has to\nbe the main obstacle. / Training staff to\nfollow new sustainable practices is an\nexpensive and time consuming obstacle.\n8 With a limited budget, a new logo\nwould probably be a more suitable\nchoice because this would probably\nbe cheaper to design. / Any amount of\nmoney spent on improving a website\nis worth it if it can make it easier for\ncustomers to find products.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7502","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":26,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a presentation about planned obsolescence. Before you listen, work with a partner to write a definition of planned obsolescence. Use a dictionary to help you.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"","items":[{"id":"b7502.i01","label":"1","prompt":"Write a definition of planned obsolescence.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7502.i01","label":"1","prompt":"Write a definition of planned obsolescence.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7503","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":27,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"2.4 Listen to an extract and check your definition.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afd al equipment, games consoles,\nfridges, printers, etc.\n2 It can become incompatible with new\nsoftware, or a component such as a\nbattery can degrade to the point where\nit becomes useless.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7505","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":29,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work in small groups. Look at the photo and discuss the extent to which you agree with the statements below.","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png"],"provided":"1 The photo shows an aspect of the computer hardware industry which manufacturers would prefer us not to see.\n2 It's shameful that electronic devices are made to last such a short time, as this wastes money and has a terrible environmental impact.\n3 Recycling computer parts in low-income countries enables new devices to be manufactured sustainably.","items":[{"id":"b7505.i01","label":"1","prompt":"The photo shows an aspect of the computer hardware industry which manufacturers would prefer us not to see.","options":[],"type":"discuss/open"},{"id":"b7505.i02","label":"2","prompt":"It's shameful that electronic devices are made to last such a short time, as this wastes money and has a terrible environmental impact.","options":[],"type":"discuss/open"},{"id":"b7505.i03","label":"3","prompt":"Recycling computer parts in low-income countries enables new devices to be manufactured sustainably.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The photo shows an aspect of the computer hardware industry which manufacturers would prefer us not to see."},{"kind":"text","text":"2 It's shameful that electronic devices are made to last such a short time, as this wastes money and has a terrible environmental impact."},{"kind":"text","text":"3 Recycling computer parts in low-income countries enables new devices to be manufactured sustainably."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I am not convinced by this point. It\nmakes sense that piles of old equipment\nnever feature in glossy adverts for\nnew equipment, but I don’t think\nmanufacturers are trying to hide the\ntruth about what happens to hardware\nthat is no longer in use.\n2 I have to say I agree with this statement,\nand as a consumer, I find it frustrating\nto have to buy new devices more often\nthan I would like to ideally. / I’m not\nsure this is completely accurate. I’d say\nto some extent this is an unfortunate\nnegative aspect of rapid technological\ndevelopment. Many devices simply\nbecome obsolete very quickly.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7506","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":30,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss how likely you are to do the things below, and why / why not.","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png"],"provided":"a get your bike or car serviced in order for it to last longer\nb sew a replacement button onto a piece of clothing\nc replace your phone as soon as a newer model is released\nd continue wearing a piece of clothing even though there is a hole in it\ne search online for detailed instructions about how to repair a device yourself\nf consider the environmental impact of replacing something instead of repairing it","items":[{"id":"b7506.i01","label":"a","prompt":"get your bike or car serviced in order for it to last longer","options":[],"type":"choice/closed"},{"id":"b7506.i02","label":"b","prompt":"sew a replacement button onto a piece of clothing","options":[],"type":"choice/closed"},{"id":"b7506.i03","label":"c","prompt":"replace your phone as soon as a newer model is released","options":[],"type":"choice/closed"},{"id":"b7506.i04","label":"d","prompt":"continue wearing a piece of clothing even though there is a hole in it","options":[],"type":"choice/closed"},{"id":"b7506.i05","label":"e","prompt":"search online for detailed instructions about how to repair a device yourself","options":[],"type":"choice/closed"},{"id":"b7506.i06","label":"f","prompt":"consider the environmental impact of replacing something instead of repairing it","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a get your bike or car serviced in order for it to last longer"},{"kind":"text","text":"b sew a replacement button onto a piece of clothing"},{"kind":"text","text":"c replace your phone as soon as a newer model is released"},{"kind":"text","text":"d continue wearing a piece of clothing even though there is a hole in it"},{"kind":"text","text":"e search online for detailed instructions about how to repair a device yourself"},{"kind":"text","text":"f consider the environmental impact of replacing something instead of repairing it"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Personally I tend to try and keep using\nthings for as long as possible, as I hate the\nidea of things I throw away ending up as\njunk in landfill. So yes, I get my bike and\ncar serviced once a year, hoping to extend\ntheir life, and I keep wearing clothes even\nwhen they’re starting to look a bit shabby,\nalthough I don’t go so far as to do any\nmending myself. I only replace things like\nmy phone when I absolutely have to, partly\nto save money and partly to cut down\non waste. That said though, the truth is\nI’m probably too lazy to look online and\nfind out how to fix something myself, I\nusually just go to a specialist, whether it’s a\nplumber or an IT expert!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7508","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":31,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"2.5 Listen to the presentation. Number the topics in the order the speakers talk about them (1–5).","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png"],"provided":"a an explanation of the concept of planned obsolescence 1____\nb consumer responses to planned obsolescence ____\nc planned obsolescence in electronics ____\nd consumer efforts to combat planned obsolescence ____\ne planned obsolescence in fast fashion ____","items":[{"id":"b7508.i01","label":"a","prompt":"an explanation of the concept of planned obsolescence ____","options":[],"type":"choice/closed"},{"id":"b7508.i02","label":"b","prompt":"consumer responses to planned obsolescence ____","options":[],"type":"choice/closed"},{"id":"b7508.i03","label":"c","prompt":"planned obsolescence in electronics ____
