mething official"}],[{"kind":"text","text":"c ____ (n) the development of new products, or ideas"},{"kind":"text","text":"d ____ (v) to find a way of avoiding something, especially a law or rule"},{"kind":"text","text":"e ____ (v) to create a plan using intelligence and creativity"},{"kind":"text","text":"f ____ (n) a strong negative reaction"},{"kind":"text","text":"g ____ (adj) limited, set and fixed"},{"kind":"text","text":"h ____ (n) something that prevents progress"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a resent b issue c innovation d circumvent\ne devise f backlash g finite h obstacle","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7501","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":25,"module":"LISTENING 2","ex":"2","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss the questions in Exercise 1.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U02-question:b7500","kind":"material-reference","title":"LISTENING 2 Ex 1","pages":[47]}],"materials":[],"coursePages":[[{"kind":"text","text":"Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?"},{"kind":"text","text":"Apart from innovation in product design, what has been the main reason for Apple’s success?"},{"kind":"text","text":"Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?"},{"kind":"text","text":"Why might manufacturers try to circumvent the environmental standards they are supposed to meet?"},{"kind":"text","text":"Have you ever had to devise a creative solution to a problem?"}],[{"kind":"text","text":"If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?"},{"kind":"text","text":"What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?"},{"kind":"text","text":"If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?"}]],"courseMaterials":[{"id":"B05-LS-U02-publisher-sheet:b7500","title":"LISTENING 2 Ex 1 原题面","pages":[47],"text":"1 Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?\n2 Apart from innovation in product design, what has been the main reason for Apple's success?\n3 Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?\n4 Why might manufacturers try to circumvent the environmental standards they are supposed to meet?\n5 Have you ever had to devise a creative solution to a problem?\n6 If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?\n7 What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?\n8 If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?\na ____ (v) to feel angry because you have been forced to accept something that you do not like\nb ____ (v) to say or send out something official\nc ____ (n) the development of new products, or ideas\nd ____ (v) to find a way of avoiding something, especially a law or rule\ne ____ (v) to create a plan using intelligence and creativity\nf ____ (n) a strong negative reaction\ng ____ (adj) limited, set and fixed\nh ____ (n) something that prevents progress","screens":["1 Can you think of an example of a company which changed a well-established product, but then faced an angry public backlash from people who preferred the old one?","2 Apart from innovation in product design, what has been the main reason for Apple's success?","3 Do you think that junior staff in a company may resent the fact that senior colleagues get better perks?","4 Why might manufacturers try to circumvent the environmental standards they are supposed to meet?","5 Have you ever had to devise a creative solution to a problem?","6 If it was your job to issue official guidelines regarding the disposal of computers and other electronics, what would you include?","7 What is the biggest obstacle preventing manufacturers from moving to more sustainable production practices?","8 If a company had a finite amount of money to spend, would it be wiser to invest in a new logo, or to update its website?","a ____ (v) to feel angry because you have been forced to accept something that you do not like","b ____ (v) to say or send out something official","c ____ (n) the development of new products, or ideas","d ____ (v) to find a way of avoiding something, especially a law or rule","e ____ (v) to create a plan using intelligence and creativity","f ____ (n) a strong negative reaction","g ____ (adj) limited, set and fixed","h ____ (n) something that prevents progress"],"sources":[{"page":47,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"}],"kind":"task_sheet","sourceBlockIds":["b7500"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 When Coca Cola changed the taste of\ntheir drink in 1985, the company faced\na huge backlash from customers who\ndidn’t like the new flavour.\n2 Another major reason is Apple’s clever\nmarketing and advertising.\n3 Some may resent this, but I suspect\nmost people would just accept it as a\nfact of life.\n4 Many manufacturers circumvent\nenvironmental requirements in order\nto save money. I think there should be\ntougher checks to ensure that standards\nare being fully met.\n5 Yes, when I worked in a cafe, I had to\ndevise a new staff shift rota, which was\nactually more difficult than it sounds. /\nMy classmate came up with a very\ngood idea to solve a problem with our\nengineering project. He wrote a piece of\ncode which saved us a lot of time!\n6 I would include guidelines about\nrecycling as much of every old device as\npossible. I would also require companies\nto contact local schools and charities to\nsee if they could use the equipment.\n7 The drive towards profitability has to\nbe the main obstacle. / Training staff to\nfollow new sustainable practices is an\nexpensive and time consuming obstacle.\n8 With a limited budget, a new logo\nwould probably be a more suitable\nchoice because this would probably\nbe cheaper to design. / Any amount of\nmoney spent on improving a website\nis worth it if it can make it easier for\ncustomers to find products.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7502","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":26,"module":"LISTENING 2","ex":"3","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a presentation about planned obsolescence. Before you listen, work with a partner to write a definition of planned obsolescence. Use a dictionary to help you.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"","items":[{"id":"b7502.i01","label":"1","prompt":"Write a definition of planned obsolescence.","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b7502.i01","label":"1","prompt":"Write a definition of planned obsolescence.","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7503","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":27,"module":"LISTENING 2","ex":"4","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"2.4 Listen to an extract and check your definition.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B05-LS-U02-question:b7502","kind":"student-work","title":"LISTENING 2 Ex 3","pages":[47]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 2.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7d5dcfaa4ddba9dcb9c6d3a78bc8ab15296a3b59c3f2dedaa4a8979acaf9b32f.mp3"}],"courseAnswer":{"kind":"grouped-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7504","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":28,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner and discuss the questions.","pages":[47],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/eba3a2afbe380e47a882f159b135140347e643303f6806373099095f7b32d742.png"],"provided":"1 In which manufacturing sectors do you think planned obsolescence has been implemented?\n2 In what ways can a product become obsolete?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 In which manufacturing sectors do you think planned obsolescence has been implemented?"},{"kind":"text","text":"2 In what ways can a product become obsolete?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Electronics such as mobile phones,\naudiovisual equipment, games consoles,\nfridges, printers, etc.\n2 It can become incompatible with new\nsoftware, or a component such as a\nbattery can degrade to the point where\nit becomes useless.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7505","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":29,"module":"LISTENING 2","ex":"6","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work in small groups. Look at the photo and discuss the extent to which you agree with the statements below.","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png"],"provided":"1 The photo shows an aspect of the computer hardware industry which manufacturers would prefer us not to see.\n2 It's shameful that electronic devices are made to last such a short time, as this wastes money and has a terrible environmental impact.\n3 Recycling computer parts in low-income countries enables new devices to be manufactured sustainably.","items":[{"id":"b7505.i01","label":"1","prompt":"The photo shows an aspect of the computer hardware industry which manufacturers would prefer us not to see.","options":[],"type":"discuss/open"},{"id":"b7505.i02","label":"2","prompt":"It's shameful that electronic devices are made to last such a short time, as this wastes money and has a terrible environmental impact.","options":[],"type":"discuss/open"},{"id":"b7505.i03","label":"3","prompt":"Recycling computer parts in low-income countries enables new devices to be manufactured sustainably.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 The photo shows an aspect of the computer hardware industry which manufacturers would prefer us not to see."},{"kind":"text","text":"2 It's shameful that electronic devices are made to last such a short time, as this wastes money and has a terrible environmental impact."},{"kind":"text","text":"3 Recycling computer parts in low-income countries enables new devices to be manufactured sustainably."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I am not convinced by this point. It\nmakes sense that piles of old equipment\nnever feature in glossy adverts for\nnew equipment, but I don’t think\nmanufacturers are trying to hide the\ntruth about what happens to hardware\nthat is no longer in use.\n2 I have to say I agree with this statement,\nand as a consumer, I find it frustrating\nto have to buy new devices more often\nthan I would like to ideally. / I’m not\nsure this is completely accurate. I’d say\nto some extent this is an unfortunate\nnegative aspect of rapid technological\ndevelopment. Many devices simply\nbecome obsolete very quickly.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":4,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"}]},"courseVisuals":[{"page":48,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png","width":772,"height":1040}],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7506","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":30,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Work with a partner. Discuss how likely you are to do the things below, and why / why not.","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png"],"provided":"a get your bike or car serviced in order for it to last longer\nb sew a replacement button onto a piece of clothing\nc replace your phone as soon as a newer model is released\nd continue wearing a piece of clothing even though there is a hole in it\ne search online for detailed instructions about how to repair a device yourself\nf consider the environmental impact of replacing something instead of repairing it","items":[{"id":"b7506.i01","label":"a","prompt":"get your bike or car serviced in order for it to last longer","options":[],"type":"choice/closed"},{"id":"b7506.i02","label":"b","prompt":"sew a replacement button onto a piece of clothing","options":[],"type":"choice/closed"},{"id":"b7506.i03","label":"c","prompt":"replace your phone as soon as a newer model is released","options":[],"type":"choice/closed"},{"id":"b7506.i04","label":"d","prompt":"continue wearing a piece of clothing even though there is a hole in it","options":[],"type":"choice/closed"},{"id":"b7506.i05","label":"e","prompt":"search online for detailed instructions about how to repair a device yourself","options":[],"type":"choice/closed"},{"id":"b7506.i06","label":"f","prompt":"consider the environmental impact of replacing something instead of repairing it","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a get your bike or car serviced in order for it to last longer"},{"kind":"text","text":"b sew a replacement button onto a piece of clothing"},{"kind":"text","text":"c replace your phone as soon as a newer model is released"},{"kind":"text","text":"d continue wearing a piece of clothing even though there is a hole in it"},{"kind":"text","text":"e search online for detailed instructions about how to repair a device yourself"},{"kind":"text","text":"f consider the environmental impact of replacing something instead of repairing it"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Personally I tend to try and keep using\nthings for as long as possible, as I hate the\nidea of things I throw away ending up as\njunk in landfill. So yes, I get my bike and\ncar serviced once a year, hoping to extend\ntheir life, and I keep wearing clothes even\nwhen they’re starting to look a bit shabby,\nalthough I don’t go so far as to do any\nmending myself. I only replace things like\nmy phone when I absolutely have to, partly\nto save money and partly to cut down\non waste. That said though, the truth is\nI’m probably too lazy to look online and\nfind out how to fix something myself, I\nusually just go to a specialist, whether it’s a\nplumber or an IT expert!","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7508","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":31,"module":"LISTENING 2","ex":"8","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"2.5 Listen to the presentation. Number the topics in the order the speakers talk about them (1–5).","pages":[48],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b67a33003bcc8ef771ca24014094edb39f9a65048191645d44dcc2cd6f98b914.png"],"provided":"a an explanation of the concept of planned obsolescence 1____\nb consumer responses to planned obsolescence ____\nc planned obsolescence in electronics ____\nd consumer efforts to combat planned obsolescence ____\ne planned obsolescence in fast fashion ____","items":[{"id":"b7508.i01","label":"a","prompt":"an explanation of the concept of planned obsolescence ____","options":[],"type":"choice/closed"},{"id":"b7508.i02","label":"b","prompt":"consumer responses to planned obsolescence ____","options":[],"type":"choice/closed"},{"id":"b7508.i03","label":"c","prompt":"planned obsolescence in electronics ____","options":[],"type":"choice/closed"},{"id":"b7508.i04","label":"d","prompt":"consumer efforts to combat planned obsolescence ____","options":[],"type":"choice/closed"},{"id":"b7508.i05","label":"e","prompt":"planned obsolescence in fast fashion ____","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a an explanation of the concept of planned obsolescence 1____"},{"kind":"text","text":"b consumer responses to planned obsolescence ____"},{"kind":"text","text":"c planned obsolescence in electronics ____"},{"kind":"text","text":"d consumer efforts to combat planned obsolescence ____"},{"kind":"text","text":"e planned obsolescence in fast fashion ____"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 2.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28598e89cb1349fb5ab629701d241dc92ba4986d6e36c0371fd72ee33fca4a47.mp3"}],"courseAnswer":{"kind":"teacher-excerpt","text":"a 1 b 4 c 2 d 5 e 3","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":30,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7509","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":32,"module":"LISTENING 2","ex":"9","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"2.5 Listen again and note the main idea which each speaker discusses, and add two details.","pages":[49],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/724154a84ea5e0fbd5bdd74d39fd4cb8d49d980803f8a7149b8010282afd6675.png"],"provided":"Speaker 1\nMain point: Planned obsolescence (PO) = a deliberate policy to create products with a finite and usually short lifespan\na Detail: PO can be seen as a way of taking advantage of consumers, or\nb Detail:\n\nSpeaker 2\nMain point:\na Detail:\nb Detail:\n\nSpeaker 3\nMain point:\na Detail:\nb Detail:\n\nSpeaker 4\nMain point:\na Detail:\nb Detail:","items":[{"id":"b7509.i01","label":"1","prompt":"b Detail: ____","options":[],"type":"gap/open"},{"id":"b7509.i02","label":"2","prompt":"Main point: ____","options":[],"type":"gap/open"},{"id":"b7509.i03","label":"3","prompt":"a Detail: ____","options":[],"type":"gap/open"},{"id":"b7509.i04","label":"4","prompt":"b Detail: ____","options":[],"type":"gap/open"},{"id":"b7509.i05","label":"5","prompt":"Main point: ____","options":[],"type":"gap/open"},{"id":"b7509.i06","label":"6","prompt":"a Detail: ____","options":[],"type":"gap/open"},{"id":"b7509.i07","label":"7","prompt":"b Detail: ____","options":[],"type":"gap/open"},{"id":"b7509.i08","label":"8","prompt":"Main point: ____","options":[],"type":"gap/open"},{"id":"b7509.i09","label":"9","prompt":"a Detail: ____","options":[],"type":"gap/open"},{"id":"b7509.i10","label":"10","prompt":"b Detail: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Speaker 1"},{"kind":"text","text":"Main point: Planned obsolescence (PO) = a deliberate policy to create products with a finite and usually short lifespan"},{"kind":"text","text":"a Detail: PO can be seen as a way of taking advantage of consumers, or"},{"kind":"text","text":"b Detail:"},{"kind":"text","text":"Speaker 2"},{"kind":"text","text":"Main point:"}],[{"kind":"text","text":"a Detail:"},{"kind":"text","text":"b Detail:"},{"kind":"text","text":"Speaker 3"},{"kind":"text","text":"Main point:"},{"kind":"text","text":"a Detail:"},{"kind":"text","text":"b Detail:"},{"kind":"text","text":"Speaker 4"}],[{"kind":"text","text":"Main point:"},{"kind":"text","text":"a Detail:"},{"kind":"text","text":"b Detail:"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 2.5","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/28598e89cb1349fb5ab629701d241dc92ba4986d6e36c0371fd72ee33fca4a47.mp3"}],"courseAnswer":{"kind":"model-excerpt","text":"1 planned obsolescence = a deliberate\npolicy to create products with a finite\nand usually short lifespan\na  can either be seen as a plot to\ntake advantage of consumers or\ncan be seen as a way of\nencouraging innovation\nb  many people resent the waste and\nexpense caused by PO\n2 electronics (e.g. phones) are designed\nwith PO\na  tasks that should be simple like\nreplacing a phone battery are often\nobstacles which prevent a device from\nlasting longer\nb  companies issue software upgrades\nwhich can impair performance of\nolder devices\n3 PO is common in the clothing industry—\n‘fast fashion’\na  clothing firms spot trends and\nproduce new clothes in just 2-3 weeks\nb  low-price low-quality clothes don’t\nlast long, and produce a lot of waste\n4 there’s a backlash from consumers\nagainst PO\na  some companies use digital locks &\nimpose penalties for opening phones\nb  people are sharing ways to\ncircumvent these restrictions and\nreduce waste","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7510","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":33,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Work with a partner. Complete the tasks.","pages":[49],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/724154a84ea5e0fbd5bdd74d39fd4cb8d49d980803f8a7149b8010282afd6675.png"],"provided":"1 Compare the notes you both wrote and add any useful information which you missed but which your partner wrote.\n2 Use your notes to prepare a spoken summary of the presentation. Decide which of you will summarize each part.\n3 Present your summary to another pair.\n4 Give feedback to each other.","items":[],"layout":"list","references":[{"id":"B05-LS-U02-question:b7509","kind":"student-work","title":"LISTENING 2 Ex 9","pages":[49]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Compare the notes you both wrote and add any useful information which you missed but which your partner wrote."},{"kind":"text","text":"2 Use your notes to prepare a spoken summary of the presentation. Decide which of you will summarize each part."},{"kind":"text","text":"3 Present your summary to another pair."},{"kind":"text","text":"4 Give feedback to each other."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Student A First of all, what is planned\nobsolescence? Well, it’s a way that\ncompanies use to ensure that products that\nconsumers buy only last a finite amount of\ntime. There are different ways to interpret\nthis of course—it can be seen as a way that\ngreedy corporations exploit consumers by\nmaking them keep on buying products. But\nthen again it could also be seen positively,\nas a way of encouraging innovation. The\ntech sector in particular plans obsolescence\ninto new products. While some customers\nare early adopters and will happily buy\nthe latest phone, others may only replace\ndevices when it becomes absolutely\nnecessary. Issuing regular software updates\nmeans that this can happen frequently,\nmaking older devices obsolete.\nStudent B Of course, planned obsolescence\nisn’t restricted to technology. Fast fashion is\nanother example, and companies are able\nto get a piece of clothing from catwalk to\nshop in just two or three weeks. But these\nclothes are made cheaply, aren’t durable\nand are soon thrown away, leading to huge\namounts of waste. There is a backlash\nagainst all this, especially in the technology\nsector, as consumers want their devices\nto keep working and are making the case\nthat manufacturers should enable this to\nhappen. There’s a consumer-led movement\nto share information about how to fix\nproducts in order to extend their lifespan,\nincluding by circumventing digital locks put\nin place by manufacturers, with a view to\nreducing the environmental damage caused\nby planned obsolescence.\nAreas of success: they explained the ideas\nclearly in their own words; they planned\nwell for points each person should cover.\nAreas for improvement: they should\nintroduce themselves; A should indicate\nthat he is inviting B to speak and B should\nthank A for this.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7512","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":34,"module":"LISTENING 2","ex":"11","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Circle the best description of the attitude of the speakers in Listening 2 to planned obsolescence (PO). Explain your answer to a partner, giving specific examples from the presentation.","pages":[49],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/724154a84ea5e0fbd5bdd74d39fd4cb8d49d980803f8a7149b8010282afd6675.png"],"provided":"a The speakers expressed strong support for PO.\nb The speakers disagreed with each other about their views on PO.\nc The speakers were completely neutral and avoided supporting or opposing PO.\nd The speakers were mostly objective, but all expressed a mildly negative attitude towards PO.","items":[{"id":"b7512.i01","label":"1","prompt":"The best description of the speakers' attitude to PO is:","options":["The speakers expressed strong support for PO.","The speakers disagreed with each other about their views on PO.","The speakers were completely neutral and avoided supporting or opposing PO.","The speakers were mostly objective, but all expressed a mildly negative attitude towards PO."],"type":"choice/closed"},{"id":"b7512.i02","label":"Explanation","prompt":"Explain your answer, giving specific examples from the presentation: ____","options":["The speakers expressed strong support for PO.","The speakers disagreed with each other about their views on PO.","The speakers were completely neutral and avoided supporting or opposing PO.","The speakers were mostly objective, but all expressed a mildly negative attitude towards PO."],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"a The speakers expressed strong support for PO."},{"kind":"text","text":"b The speakers disagreed with each other about their views on PO."},{"kind":"text","text":"c The speakers were completely neutral and avoided supporting or opposing PO."},{"kind":"text","text":"d The speakers were mostly objective, but all expressed a mildly negative attitude towards PO."}],[{"kind":"item","id":"b7512.i01","label":"1","prompt":"The best description of the speakers' attitude to PO is:","options":["The speakers expressed strong support for PO.","The speakers disagreed with each other about their views on PO.","The speakers were completely neutral and avoided supporting or opposing PO.","The speakers were mostly objective, but all expressed a mildly negative attitude towards PO."],"type":"choice/closed"},{"kind":"item","id":"b7512.i02","label":"Explanation","prompt":"Explain your answer, giving specific examples from the presentation: ____","options":["The speakers expressed strong support for PO.","The speakers disagreed with each other about their views on PO.","The speakers were completely neutral and avoided supporting or opposing PO.","The speakers were mostly objective, but all expressed a mildly negative attitude towards PO."],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"d See Model Answer Booklet p5 for an example answer.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7514","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":35,"module":"LISTENING 2","ex":"12","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work in small groups. Read the facts about the clothing industry globally. Then answer the questions below.","pages":[50],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/294ac9db2a00ca6653db1a7b80f110f66f155eec9bd625eb1c0ca7faf087e494.png"],"provided":"Global fashion industry 2008–2023\n430 million people working in the clothing and fashion industry¹\n10% global CO₂ emissions caused by fast fashion – more than by the aviation and shipping industries combined²\npredicted annual growth of the fashion industry³\ndecrease of the average number of times an item was worn⁴\nglobal increase in clothing sales over the past 15 years⁵ clothes-related waste discarded every year, equivalent to a garbage truck every second.⁶\n¹ https://www.zippia.com/advice/fashion-industry-statistics/; ²,³ https://www.oxfam.org.uk/oxfam-in-action/oxfam-blog/new-shocking-facts-aboutthe-impact-of-fast-fashion-on-our-climate/; ⁴,⁵,⁶ https://earth.org/fastfashion-statistics/","items":[{"id":"b7514.i01","label":"1","prompt":"Summarize the most important information in one short sentence.","options":[],"type":"discuss/open"},{"id":"b7514.i02","label":"2","prompt":"Do any of the facts surprise you? Explain your answer.","options":[],"type":"discuss/open"},{"id":"b7514.i03","label":"3","prompt":"How do these facts support the information in the presentation on planned obsolescence?","options":[],"type":"discuss/open"},{"id":"b7514.i04","label":"4","prompt":"Think of some implications of this phenomenon for countries which produce or consume large amounts of clothing, and for the environment.","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Global fashion industry 2008–2023"},{"kind":"text","text":"430 million people working in the clothing and fashion industry¹"},{"kind":"text","text":"10% global CO₂ emissions caused by fast fashion – more than by the aviation and shipping industries combined²"},{"kind":"text","text":"predicted annual growth of the fashion industry³"},{"kind":"text","text":"decrease of the average number of times an item was worn⁴"},{"kind":"text","text":"global increase in clothing sales over the past 15 years⁵ clothes-related waste discarded every year, equivalent to a garbage truck every second.⁶"}],[{"kind":"text","text":"¹ https://www.zippia.com/advice/fashion-industry-statistics/; ²,³ https://www.oxfam.org.uk/oxfam-in-action/oxfam-blog/new-shocking-facts-aboutthe-impact-of-fast-fashion-on-our-climate/; ⁴,⁵,⁶ https://earth.org/fastfashion-statistics/"},{"kind":"item","id":"b7514.i01","label":"1","prompt":"Summarize the most important information in one short sentence.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7514.i02","label":"2","prompt":"Do any of the facts surprise you? Explain your answer.","options":[],"type":"discuss/open"},{"kind":"item","id":"b7514.i03","label":"3","prompt":"How do these facts support the information in the presentation on planned obsolescence?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7514.i04","label":"4","prompt":"Think of some implications of this phenomenon for countries which produce or consume large amounts of clothing, and for the environment.","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 The purchase of clothing is accelerating,\nas is the environmental damage caused\nby fast fashion.\n2 I am staggered by the fact that, although\npeople’s awareness of climate change\nis greater than ever, it doesn’t not seem\nto have reduced the wish to own more\nstuff, regardless of the impact that this\nmay have.\n3 The statistics give specific examples\nthat illustrate why PO should be a major\nconcern with regard to the fashion\nindustry.\n4 Fast fashion is a lucrative business for\ncountries that produce clothes and those\nthat buy them. Abandoning the PO\nmodel of endless production may lead\nto a loss of earnings. The CO2 emissions\ncaused by the production of clothing\nis likely to lead to continued climate\nchange and rising temperatures.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7515","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":36,"module":"LISTENING 2","ex":"13","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use ideas from Listening 1 and Listening 2 to answer the following questions.","pages":[50],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/294ac9db2a00ca6653db1a7b80f110f66f155eec9bd625eb1c0ca7faf087e494.png"],"provided":"","items":[{"id":"b7515.i01","label":"1","prompt":"Think back to your discussion in Exercise 7 about replacing things. Do you think your behaviour will ever change in any way? If so, when and why? If not, why not?","options":[],"type":"discuss/open"},{"id":"b7515.i02","label":"2","prompt":"What impact do you think AM will have on planned obsolescence in general and fast fashion in particular?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B05-LS-U02-question:b7506","kind":"student-work","title":"LISTENING 2 Ex 7","pages":[48]}],"materials":[],"coursePages":[[{"kind":"item","id":"b7515.i01","label":"1","prompt":"Think back to your discussion in Exercise 7 about replacing things. Do you think your behaviour will ever change in any way? If so, when and why? If not, why not?","options":[],"type":"discuss/open"},{"kind":"item","id":"b7515.i02","label":"2","prompt":"What impact do you think AM will have on planned obsolescence in general and fast fashion in particular?","options":[],"type":"discuss/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 To be honest, I don’t expect my\nbehaviour to change, because I’m one of\nseveral billion people on the planet, and\nI don’t believe that my actions will affect\nthe welfare of the planet as a whole. /\nThe more I think about how everyday\nactions have an impact on the planet,\nthe more I want to live sustainably. One\nway to do that is to use things for longer.\n2 It’s hard to say for sure, but it may be\nthat the ability to produce new products\nmore quickly will add yet more to the\namounts of clothing that we buy and\ndispose of. However, it also offers the\npossibility of being able to print only\nexactly what we need, on demand,\nwhich has the potential to reduce waste\nif used intelligently.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7516","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":37,"module":"LISTENING 2","ex":"14","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Write an essay of about 200 words explaining the problems caused by fast fashion and suggesting possible measures to reduce its damage to the environment. Include:","pages":[50],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/294ac9db2a00ca6653db1a7b80f110f66f155eec9bd625eb1c0ca7faf087e494.png"],"provided":"- a paragraph on the problems caused by fast fashion;\n- a paragraph on the possible solutions;\n- a conclusion with your recommendations.","items":[{"id":"b7516.i01","label":"Essay","prompt":"Write an essay of about 200 words explaining the problems caused by fast fashion and suggesting possible measures to reduce its damage to the environment, including a paragraph on the problems, a paragraph on the possible solutions, and a conclusion with your recommendations.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- a paragraph on the problems caused by fast fashion;"},{"kind":"text","text":"- a paragraph on the possible solutions;"},{"kind":"text","text":"- a conclusion with your recommendations."},{"kind":"item","id":"b7516.i01","label":"Essay","prompt":"Write an essay of about 200 words explaining the problems caused by fast fashion and suggesting possible measures to reduce its damage to the environment, including a paragraph on the problems, a paragraph on the possible solutions, and a conclusion with your recommendations.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Fast fashion, characterized by its rapid\nproduction and consumption cycles, has\nemerged as a significant environmental\nconcern. The Environmental Protection\nAgency (EPA) reports a troubling 40%\nincrease in textile waste over the past two\ndecades in the United States, contributing\nto the mounting environmental burden.\nAdditionally, the fashion industry’s\ncarbon footprint, accounting for 10%\nof global carbon emissions (United\nNations Convention on Climate Change),\nhighlights the urgency of addressing the\nenvironmental impact of fast fashion.\nTo address these challenges, major\nchanges are needed. Introducing new laws\nand industry standards may be a solution.\nGovernments and regulatory bodies\nshould collaborate to establish guidelines\nfor sustainable production methods,\nwaste management, and chemical usage.\nSimultaneously, consumers can play a\ncrucial role by altering their behavior.\nEmbracing sustainable choices, supporting\neco-friendly brands, and advocating for\ndurability can reduce the environmental\nharm caused by fast fashion.\nIn summary, addressing the environmental\nimpact of fast fashion will involve everyone,\nincluding consumers, manufacturers and\ngovernments. By promoting sustainable\nchoices, extending the lifespan of clothing\nand enforcing regulations, it is possible\nfor the devastating effects of the fashion\nindustry to be reduced in the future.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":31,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7520","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in small groups. Complete the tasks.","pages":[51],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cae0c7214493ba71f6396605883f201447208fe47c9f10da65d736951c85166.png"],"provided":"1 Read this list of consumer products and add one or two more. Discuss the extent to which each product is designed for planned obsolescence. Make notes.\n\n\u003ctable>\u003ctr>\u003ctd>video games\u003c/td>\u003ctd>cars\u003c/td>\u003ctd>running shoes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>games consoles\u003c/td>\u003ctd>software\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ink cartridges\u003c/td>\u003ctd>textbooks\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\n\nVideo games are made for specific consoles – new games often aren't available on the old consoles.\n\n2 For each product, come up with at least one negative aspect and one positive or neutral aspect of its short lifespan.\n\nThe graphics and gameplay just keep getting better and better.\n\n3 For each product, discuss how (or if) it could be made to last longer.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Read this list of consumer products and add one or two more. Discuss the extent to which each product is designed for planned obsolescence. Make notes."},{"kind":"table","rows":[[{"text":"video games","header":false,"colspan":1,"rowspan":1},{"text":"cars","header":false,"colspan":1,"rowspan":1},{"text":"running shoes","header":false,"colspan":1,"rowspan":1}],[{"text":"games consoles","header":false,"colspan":1,"rowspan":1},{"text":"software","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}],[{"text":"ink cartridges","header":false,"colspan":1,"rowspan":1},{"text":"textbooks","header":false,"colspan":1,"rowspan":1},{"text":"","header":false,"colspan":1,"rowspan":1}]]}],[{"kind":"text","text":"Video games are made for specific consoles – new games often aren't available on the old consoles."},{"kind":"text","text":"2 For each product, come up with at least one negative aspect and one positive or neutral aspect of its short lifespan."},{"kind":"text","text":"The graphics and gameplay just keep getting better and better."},{"kind":"text","text":"3 For each product, discuss how (or if) it could be made to last longer."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 video games: Often designed with\nplanned obsolescence as new consoles\nor software updates make older games\nincompatible. Frequent releases and\nsequels also encourage upgrading.\ncars: Many car models are designed\nwith obsolescence in mind, with new\nmodels and features released regularly.\nHowever, cars are generally built to last,\neven if technology and style make them\nfeel outdated.\nrunning shoes: Often designed to wear\nout after a certain number of miles,\nencouraging replacement. Seasonal\nstyles and trends also add to the sense\nof obsolescence.\ngame consoles: Strongly designed for\nobsolescence, as new consoles quickly\nphase out older models. Games are\noften not compatible across generations,\npushing users to upgrade.\nsoftware: Many software programs\nhave planned obsolescence through\nregular updates, new versions, and\nend-of-support for older versions, which\npressures users to update.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":5,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7521","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Read this list of reasons that consumers purchase goods and services. Add more reasons to the list. What are some examples of products that people buy for each reason? Make notes. Then share your ideas in your group.","pages":[51],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8cae0c7214493ba71f6396605883f201447208fe47c9f10da65d736951c85166.png"],"provided":"• They have no choice. They need it.\n- It is really useful. It makes their lives easier.\n- It represents their aspirations. People they admire have it.\n- It's new and cool.\n- It's good value.\n- The company that makes it has a good reputation.\n- It has some specific attractive quality (e.g. colour for sports shoes).\n\nANALYZE","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"• They have no choice. They need it."},{"kind":"text","text":"- It is really useful. It makes their lives easier."},{"kind":"text","text":"- It represents their aspirations. People they admire have it."},{"kind":"text","text":"- It's new and cool."},{"kind":"text","text":"- It's good value."},{"kind":"text","text":"- The company that makes it has a good reputation."},{"kind":"text","text":"- It has some specific attractive quality (e.g. colour for sports shoes)."}],[{"kind":"text","text":"ANALYZE"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"no choice – printer, ink cartridges,\ntextbooks, software\nuseful – mobile phone, printer, software, cars\naspirations – running shoes, games console\nnew and cool – mobile phone, running shoes\ngood value – fast food\ngood reputation of company –\ndesigner clothes\nattractive – car with graceful curves\nother reasons – a person’s friends have\npurchased it; they were persuaded by\nthe marketing","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7522","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":40,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in your group. There are many different planned obsolescence strategies that a company may use to encourage consumers to continue buying new products from them, instead of buying other companies' products or not buying a new product at all. Read the strategies (a–d) below. Then complete the tasks (1–3).","pages":[52],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/48babae3b412ee105a7d2d10755433ddfe7d0c4f8a4057054933fd390480a58d.png"],"provided":"1 Identify a product that would fit each strategy as a way of encouraging future purchases.\n2 Discuss whether you think each is an effective strategy. Explain why.\n3 How might each strategy backfire, that is, how could it go wrong?\n\na Design a product to fail after a short period of time.\nb Stop supporting old products, in other words, stop providing updates and service.\nc Make different accessories and related products that will only function with your company's products. (They won't work with other companies' products.)\nd Every few years, introduce new, better and more exciting versions of your products.","items":[{"id":"b7522.i01","label":"a","prompt":"Strategy a: Design a product to fail after a short period of time.","options":[],"type":"choice/closed"},{"id":"b7522.i02","label":"b","prompt":"Strategy b: Stop supporting old products, in other words, stop providing updates and service.","options":[],"type":"choice/closed"},{"id":"b7522.i03","label":"c","prompt":"Strategy c: Make different accessories and related products that will only function with your company's products. (They won't work with other companies' products.)","options":[],"type":"choice/closed"},{"id":"b7522.i04","label":"d","prompt":"Strategy d: Every few years, introduce new, better and more exciting versions of your products.","options":[],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Identify a product that would fit each strategy as a way of encouraging future purchases."},{"kind":"text","text":"2 Discuss whether you think each is an effective strategy. Explain why."},{"kind":"text","text":"3 How might each strategy backfire, that is, how could it go wrong?"},{"kind":"text","text":"a Design a product to fail after a short period of time."},{"kind":"text","text":"b Stop supporting old products, in other words, stop providing updates and service."},{"kind":"text","text":"c Make different accessories and related products that will only function with your company's products. (They won't work with other companies' products.)"}],[{"kind":"text","text":"d Every few years, introduce new, better and more exciting versions of your products."},{"kind":"item","id":"b7522.i01","label":"a","prompt":"Strategy a: Design a product to fail after a short period of time.","options":[],"type":"choice/closed"},{"kind":"item","id":"b7522.i02","label":"b","prompt":"Strategy b: Stop supporting old products, in other words, stop providing updates and service.","options":[],"type":"choice/closed"},{"kind":"item","id":"b7522.i03","label":"c","prompt":"Strategy c: Make different accessories and related products that will only function with your company's products. (They won't work with other companies' products.)","options":[],"type":"choice/closed"},{"kind":"item","id":"b7522.i04","label":"d","prompt":"Strategy d: Every few years, introduce new, better and more exciting versions of your products.","options":[],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"An example of a product designed to fail\nafter a short time would be a mobile\nphone. Service providers typically provide\ncontracts for a period of 1–2 years and\nencourage customers to treat replacing\ntheir phone when renewing their contract\nas the norm. From a business perspective, I\nwould say that this has been an effective\nstrategy from the manufacturers’ point of\nview, as it has led to higher levels of sales\nthan might have otherwise been the case.\nHowever, it backfires if the phone fails\nbefore the initial warranty period is over.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7523","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":41,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in your group. Make a table like the one below. Choose two or three products that you have been considering for the speaking task. For each product, decide if obsolescence is, or could be ...\nscenario 1: entirely for the benefit of the producer – purely to increase revenue.\nscenario 2: a plan to increase revenue, but also of some benefit to the consumer.\nscenario 3: a side effect rather than an intentional act.\n\nNote: For some instances of obsolescence, multiple scenarios are possible.","pages":[52],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/48babae3b412ee105a7d2d10755433ddfe7d0c4f8a4057054933fd390480a58d.png"],"provided":"\u003ctable>\u003ctr>\u003ctd>product/feature\u003c/td>\u003ctd>scenario 1\u003c/td>\u003ctd>scenario 2\u003c/td>\u003ctd>scenario 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile phone:Consumers cannot access/replace battery. Battery has a limited lifespan.\u003c/td>\u003ctd>Consumers will have to buy a new phone when the battery stops working. They have no choice.\u003c/td>\u003ctd>Consumers will need to replace frequently. (good for company)Keeps costs down.(good for consumers)\u003c/td>\u003ctd>The design allows for a more attractive product.The inaccessible battery is smaller and lighter than a replaceable battery.\u003c/td>\u003c/tr>\u003c/table>","items":[{"id":"b7523.i01","label":"1","prompt":"product/feature: ____","options":[],"type":"choice/open"},{"id":"b7523.i02","label":"2","prompt":"scenario 1 (entirely for the benefit of the producer – purely to increase revenue): ____","options":[],"type":"choice/open"},{"id":"b7523.i03","label":"3","prompt":"scenario 2 (a plan to increase revenue, but also of some benefit to the consumer): ____","options":[],"type":"choice/open"},{"id":"b7523.i04","label":"4","prompt":"scenario 3 (a side effect rather than an intentional act): ____","options":[],"type":"choice/open"},{"id":"b7523.i05","label":"5","prompt":"product/feature: ____","options":[],"type":"choice/open"},{"id":"b7523.i06","label":"6","prompt":"scenario 1 (entirely for the benefit of the producer – purely to increase revenue): ____","options":[],"type":"choice/open"},{"id":"b7523.i07","label":"7","prompt":"scenario 2 (a plan to increase revenue, but also of some benefit to the consumer): ____","options":[],"type":"choice/open"},{"id":"b7523.i08","label":"8","prompt":"scenario 3 (a side effect rather than an intentional act): ____","options":[],"type":"choice/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"table","rows":[[{"text":"product/feature","header":false,"colspan":1,"rowspan":1},{"text":"scenario 1","header":false,"colspan":1,"rowspan":1},{"text":"scenario 2","header":false,"colspan":1,"rowspan":1},{"text":"scenario 3","header":false,"colspan":1,"rowspan":1}],[{"text":"Mobile phone:Consumers cannot access/replace battery. Battery has a limited lifespan.","header":false,"colspan":1,"rowspan":1},{"text":"Consumers will have to buy a new phone when the battery stops working. They have no choice.","header":false,"colspan":1,"rowspan":1},{"text":"Consumers will need to replace frequently. (good for company)Keeps costs down.(good for consumers)","header":false,"colspan":1,"rowspan":1},{"text":"The design allows for a more attractive product.The inaccessible battery is smaller and lighter than a replaceable battery.","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b7523.i02","label":"2","prompt":"scenario 1 (entirely for the benefit of the producer – purely to increase revenue): ____","options":[],"type":"choice/open"},{"kind":"item","id":"b7523.i03","label":"3","prompt":"scenario 2 (a plan to increase revenue, but also of some benefit to the consumer): ____","options":[],"type":"choice/open"}],[{"kind":"item","id":"b7523.i04","label":"4","prompt":"scenario 3 (a side effect rather than an intentional act): ____","options":[],"type":"choice/open"},{"kind":"item","id":"b7523.i06","label":"6","prompt":"scenario 1 (entirely for the benefit of the producer – purely to increase revenue): ____","options":[],"type":"choice/open"},{"kind":"item","id":"b7523.i07","label":"7","prompt":"scenario 2 (a plan to increase revenue, but also of some benefit to the consumer): ____","options":[],"type":"choice/open"},{"kind":"item","id":"b7523.i08","label":"8","prompt":"scenario 3 (a side effect rather than an intentional act): ____","options":[],"type":"choice/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"product scenario 1 scenario 2 scenario 3\nA professional\nstandard\ndigital camera\nPhotographers\nwill need to\nupgrade when\ntheir old camera\nis deemed to\nhave too few\npixels\nWhen a model is\nsuperseded, it may become\navailable at a lower price\nthan previously, meaning\nthat customers who do not\nneed the latest model get\ngood value for money.\nCameras have\nmoving parts which\nwill inevitably\ndeteriorate,\nand ultimately\nstop working.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7525","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":42,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Work in your group. Decide which product you will talk about in your presentation. Discuss the questions and take notes.","pages":[53],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5f19966b4c39254414def6313aaaebe0d3fb8ebacc7402bb813340328c709841.png"],"provided":"• How will you describe the product?\n• Why and how was it designed for obsolescence?\n• What are the pros and cons of its obsolescence?\n• Who benefits from its obsolescence? Who does not benefit?\n• Why do consumers continue to buy this product?","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"• How will you describe the product?"},{"kind":"text","text":"• Why and how was it designed for obsolescence?"},{"kind":"text","text":"• What are the pros and cons of its obsolescence?"},{"kind":"text","text":"• Who benefits from its obsolescence? Who does not benefit?"},{"kind":"text","text":"• Why do consumers continue to buy this product?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"We could describe one of the textbooks we\nuse on our course by quoting selectively\nfrom the description on the back. It may\nhave been designed for obsolescence\nby including information that would soon\nappear out of date, for example reference\nto statistics from a recent year. While it is\nan advantage for teachers and learners\nwhen a new edition is published because\nof the improvements it contains, it may\nbe wasteful if a college or library has\nbought copies of the old edition, which\nmay now become redundant. Consumers\nmay continue buying the product, and\nseeing that a book is in its third edition, for\nexample, provides evidence that there has\nbeen enough demand for a book to justify\nthe investment in a new edition, which may\nseem like evidence of high quality.\nPREPARATION FOR\nSPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7528","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":43,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"2.6 Work with a partner. Take turns saying these compound nouns and noun phrases. Circle the stressed words and underline the stressed syllables. Then listen and check your answers.","pages":[53],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5f19966b4c39254414def6313aaaebe0d3fb8ebacc7402bb813340328c709841.png"],"provided":"1 clothing industry\n2 complex devices\n3 backlash\n4 design policy\n5 digital locks\n6 fast fashion\n7 finite lifespan\n8 runway\n9 tech sector","items":[{"id":"b7528.i01","label":"1","prompt":"clothing industry","options":[],"type":"select/closed"},{"id":"b7528.i02","label":"2","prompt":"complex devices","options":[],"type":"select/closed"},{"id":"b7528.i03","label":"3","prompt":"backlash","options":[],"type":"select/closed"},{"id":"b7528.i04","label":"4","prompt":"design policy","options":[],"type":"select/closed"},{"id":"b7528.i05","label":"5","prompt":"digital locks","options nhouse using his mobile phone.\nCan you think of any products that don’t\nhave a finite lifespan?\n– I think there are very few things\nnowadays that don’t have a finite\nlifespan. I think furniture can last a\nlong time if it is well made and perhaps\nsome toys. But most electronics\nbreak eventually.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/646199b5fb5a1364a2ad1ae296a9b7b12df423947efa9605116da5f448109481.pdf","pdfPage":32,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":6,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d0fd5e62757f4445feba216e9ac58baeaf770ea3a3dee099beb36d173483552a.pdf","pdfPage":7,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B05-LS-U02-question:b7530","book":5,"unit":2,"track":"LS","topic":"DESIGN","lesson":2,"order":45,"module":"PREPARATION FOR SPEAKING","ex":"3","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PRONUNCIATION FOR SPEAKING"},"instruction":"2.7 Work with a partner. Practise saying these compound nouns using the correct stress patterns. Listen to check your work.","pages":[53],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/5f19966b4c39254414def6313aaaebe0d3fb8ebacc7402bb813340328c709841.png"],"provided":"1 dishwasher\n2 video game\n3 games console\n4 textbook\n5 ink cartridges\n6 gym shoes","items":[{"id":"b7530.i01","label":"1","prompt":"dishwasher","options":[],"type":"select/closed"},{"id":"b7530.i02","label":"2","prompt":"video game","options":[],
