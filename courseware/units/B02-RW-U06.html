eImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8167d104e13f2edba7a1a66ad25dbf07d1882c7bfe3266b2436276f211b06d6a.png"],"provided":"1 old water bottle to carry water in; to put pencils/pens in\n2 plastic shopping bags ____\n3 fish skin ____","items":[{"id":"b3807.i01","label":"2","prompt":"plastic shopping bags ____","options":[],"type":"gap/open"},{"id":"b3807.i02","label":"3","prompt":"fish skin ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3807.example","label":"1","prompt":"old water bottle","answer":{"mode":"example","answer":"to carry water in; to put pencils/pens in"},"options":[]},{"kind":"item","id":"b3807.i01","label":"2","prompt":"plastic shopping bags ____","options":[],"type":"gap/open","answer":{"mode":"line","answer":"To carry children’s toys in when you go on holiday; to make jewellery from, for example a bracelet"}},{"kind":"item","id":"b3807.i02","label":"3","prompt":"fish skin ____","options":[],"type":"gap/open","answer":{"mode":"line","answer":"To eat; to make a belt"}}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-source","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[],"businessReuse":true,"courseRevealLabel":"答案"},{"id":"B02-RW-U06-question:b3811","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"order":4,"module":"WATCH AND LISTEN","ex":"3","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video. Check your answers to Exercise 2.","pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5ea816f9ef2425e460fb44abcd31a8bdbd67fba6ee1fcb59fa574f9b0468795.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B02-RW-U06-question:b3807","kind":"student-work","title":"WATCH AND LISTEN Ex 2","pages":[126]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/83d89daa6a54103699ee9074-L2RW-U06.mp4","captions":[{"start":0.78,"end":4.58,"text":"Welcome to the Réjus toy shop in Paris, France."},{"start":5.5,"end":7.96,"text":"The toys here look new, but they aren't."},{"start":9.22,"end":12.42,"text":"The shop's name, Réjus, means play again."},{"start":13.6,"end":15.3,"text":"When people throw away toys,"},{"start":15.8,"end":17.44,"text":"Réjus collects them,"},{"start":17.94,"end":20.08,"text":"cleans them, and mends them."},{"start":21.72,"end":23.42,"text":"Then, it sells them."},{"start":24.22,"end":27.84,"text":"Réjus' toys are 40 % cheaper than new ones."},{"start":29.4,"end":31.82,"text":"Réjus is a circular business."},{"start":32.54,"end":34.38,"text":"But what does this mean exactly?"},{"start":37.1,"end":39.78,"text":"Businesses often take materials from the world,"},{"start":41.02,"end":41.72,"text":"make something,"},{"start":42.9,"end":44.86,"text":"and then throw away the waste."},{"start":48.74,"end":50.74,"text":"Circular businesses are different."},{"start":51.58,"end":54.2,"text":"They reuse or recycle waste."},{"start":55.2,"end":57.8,"text":"Waste costs almost nothing,"},{"start":59.12,"end":63.38,"text":"and circular businesses are making money from it."},{"start":64.32,"end":69.64,"text":"Kanenti in Tunisia is another circular business,\nrecycling shoes and also bags."},{"start":71.68,"end":76.52,"text":"People throw away three to four million pairs of shoes\na year in Tunisia."},{"start":76.52,"end":83.62,"text":"The artists at Kanenti make shoes and bags look new and\nexciting again."},{"start":84.86,"end":87.64,"text":"People can bring in their old things to the shop."},{"start":89.06,"end":94.86,"text":"For bags such as mine, which are quite expensive, I\nthink it's better to give them a new life."},{"start":98.68,"end":103.96000000000001,"text":"Old water bottles, plastic shopping bags, and food\nboxes don't look useful."},{"start":104.7,"end":112.94,"text":"But here in Cairo, a new company, Tile Green, is making\nvery strong building materials from plastic waste."},{"start":116.62,"end":117.96000000000001,"text":"This German company,"},{"start":118.25999999999999,"end":118.8,"text":"Everwave,"},{"start":119.53999999999999,"end":120.96,"text":"is doing the same thing."},{"start":122.2,"end":127.08,"text":"Turning trash into eco -friendly,"},{"start":127.78,"end":129.8,"text":"high -quality building materials."},{"start":130.56,"end":131.96,"text":"Back in France,"},{"start":132.32,"end":134.34,"text":"they're even recycling fish skin."},{"start":135.82,"end":136.6,"text":"At Iktios,"},{"start":136.92000000000002,"end":142.74,"text":"fish skins become a beautiful, strong material called\nsea leather for shoes, bags, and watches."},{"start":144.07999999999998,"end":148,"text":"They get the fish skins for free from restaurants and\nfish farms."},{"start":150.14,"end":152.28,"text":"This Kenyan business is doing the same."},{"start":152.94,"end":156.32,"text":"It sells most of its fish skin products in Europe."},{"start":157.46,"end":163.1,"text":"Why can't we be proud of our fish and use it more\neconomically and be proud of it?"},{"start":163.12,"end":167.2,"text":"So when I put on the shoes made from fish leather,"},{"start":167.8,"end":170.04,"text":"I put on the cap as well as the jacket."},{"start":170.12,"end":170.72,"text":"I feel happy."},{"start":170.88,"end":171.7,"text":"I feel very proud."},{"start":172.57999999999998,"end":175,"text":"So if you want to start a business,"},{"start":175.6,"end":176.94,"text":"why not use waste?"},{"start":178.94,"end":182.6,"text":"Going circular can make money and help the planet."}]}],"courseAnswer":{"kind":"teacher-excerpt","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":52,"title":"教师书"}],"videoText":"A company in Cairo and a German company use old water bottles, plastic shopping bags and food boxes to make very strong building materials.\nA company in France uses fish skin to make shoes, bags and watches."},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[],"courseRevealLabel":"答案"},{"id":"B02-RW-U06-question:b3812","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch the video again. Circle the correct answer.","pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5ea816f9ef2425e460fb44abcd31a8bdbd67fba6ee1fcb59fa574f9b0468795.png"],"provided":"","items":[{"id":"b3812.i01","label":"1","prompt":"Rejoué sells toys that are new / not new.","options":["new","not new"],"type":"choice/closed"},{"id":"b3812.i02","label":"2","prompt":"The prices of their toys are 30% / 40% cheaper.","options":["30%","40%"],"type":"choice/closed"},{"id":"b3812.i03","label":"3","prompt":"Businesses always / often take materials from the world.","options":["always","often"],"type":"choice/closed"},{"id":"b3812.i04","label":"4","prompt":"A company in Tunisia recycles shoes and bags / hats.","options":["shoes and bags","hats"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b3812.i01","label":"1","prompt":"Rejoué sells toys that are \u003cem>new / not new\u003c/em>.","options":[],"answer":{"mode":"indexed-mark","parts":[{"start":37,"end":44,"circle":tr iro, a new company, Tile Green, is making\nvery strong building materials from plastic waste."},{"start":116.62,"end":117.96000000000001,"text":"This German company,"},{"start":118.25999999999999,"end":118.8,"text":"Everwave,"},{"start":119.53999999999999,"end":120.96,"text":"is doing the same thing."},{"start":122.2,"end":127.08,"text":"Turning trash into eco -friendly,"},{"start":127.78,"end":129.8,"text":"high -quality building materials."},{"start":130.56,"end":131.96,"text":"Back in France,"},{"start":132.32,"end":134.34,"text":"they're even recycling fish skin."},{"start":135.82,"end":136.6,"text":"At Iktios,"},{"start":136.92000000000002,"end":142.74,"text":"fish skins become a beautiful, strong material called\nsea leather for shoes, bags, and watches."},{"start":144.07999999999998,"end":148,"text":"They get the fish skins for free from restaurants and\nfish farms."},{"start":150.14,"end":152.28,"text":"This Kenyan business is doing the same."},{"start":152.94,"end":156.32,"text":"It sells most of its fish skin products in Europe."},{"start":157.46,"end":163.1,"text":"Why can't we be proud of our fish and use it more\neconomically and be proud of it?"},{"start":163.12,"end":167.2,"text":"So when I put on the shoes made from fish leather,"},{"start":167.8,"end":170.04,"text":"I put on the cap as well as the jacket."},{"start":170.12,"end":170.72,"text":"I feel happy."},{"start":170.88,"end":171.7,"text":"I feel very proud."},{"start":172.57999999999998,"end":175,"text":"So if you want to start a business,"},{"start":175.6,"end":176.94,"text":"why not use waste?"},{"start":178.94,"end":182.6,"text":"Going circular can make money and help the planet."}]}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":52,"title":"教师书"},{"source":"https://raw.g le":"合组答案来源"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U06-question:b3824","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"order":13,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Read the quiz again. Correct the paragraph below, using words from the quiz.","pages":[130],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2302e3711c0ed2d722ac876b4feccef85ea0470ed8883b5f1c126644e9cdb0e.png"],"provided":"There are three main kinds of jobs – jobs with animals, jobs with information, jobs with machines and jobs with ideas. The quiz helps you to find out about the kind of people you might like. After doing the quiz, read the advice to find universities you might like.","items":[{"id":"b3824.i01","label":"1","prompt":"There are three main kinds of jobs – jobs with animals, jobs with information, jobs with machines and jobs with ideas.","options":[],"type":"gap/open"},{"id":"b3824.i02","label":"2","prompt":"The quiz helps you to find out about the kind of people you might like.","options":[],"type":"gap/open"},{"id":"b3824.i03","label":"3","prompt":"After doing the quiz, read the advice to find universities you might like.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"There are three main kinds of jobs – jobs with animals, jobs with information, jobs with machines and jobs with ideas. The quiz helps you to find out about the kind of people you might like. After doing the quiz, read the advice to find universities you might like."}]],"courseMaterials":[{"id":"B02-RW-U06-classroom:material:RW-M03","title":"READING 1","text":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the internet  \n☐ c play sports or practise a hobby like a musical instrument or photography  \n□ d go to the cinema\n2 Which sections of a news website do you look at first?\n□ a advice page or letters to the editor  \n□ b news  \n□ c sport  \n□ d TV, music, books and art\n3 What do you like to do at an event?\n□ a meet new people  \n□ b discuss the latest news  \n□ c help with the food and drinks  \n□ d sing songs and tell jokes\n4 What do you prefer to do on a day off?\n□ a have coffee with friends  \n□ b organize your books and cupboards  \n□ c work in the garden or clean the house  \n□ d write poetry, make music or draw pictures\n## Mostly 'a' answers:\nYou are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer.\n## Mostly 'c' answers:\nYou are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer.\n## Mostly 'b' answers:\nYou are neat, you are good at planning and you like learning new things. You would enjoy a job working with information.\nPossible jobs are: university professor, computer programmer, librarian.\n## Mostly 'd' answers:\nYou are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer.","screens": ],"issues":[]},{"id":"B02-RW-U06-question:b3846","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":2,"order":29,"module":"READING 2","ex":"3","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"instruction":"Read the text. As you read, annotate the important words, dates, numbers and ideas. Compare your answers with a partner.","pages":[132],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3b616fd789930e28e9f2441e03ad25f2ac86c251200aa1f7aeab608cdfec7faf.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B02-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.\n2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.\n[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.\n4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","screens":["1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to bui erials":[],"issues":[],"feedback":{"placement":"inline","mode":"after","kind":"answer","source":"课堂词汇练习","rows":[{"label":"1","answer":"advertise","basis":"However, in February 2023, OpenAI started to advertise a subscription.","anchor":{"kind":"line"}},{"label":"2","answer":"goal","basis":"My goal is to start a business.","anchor":{"kind":"line"}},{"label":"3","answer":"introduce","basis":"The company will introduce a smaller phone next month.","anchor":{"kind":"line"}}]}},{"id":"B02-RW-U06-classroom:resource:b3798","book":2,"unit":6,"topic":"BUSINESS","track":"RW","lesson":1,"module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[124],"sourcePages":[124],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8325031c9579c1703eb5d691b8f6d154cd0dba04e34e20758768e408b1542c58.png"],"sourceHashes":["8325031c9579c1703eb5d691b8f6d154cd0dba04e34e20758768e408b1542c58"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a narrative paragraph."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about circular businesses."},{"label":"Reading skills","text":"Work out meaning from context; annotate a text."},{"label":"Critical thinking","text":"Organize events in time order."},{"label":"Grammar","text":"Use the present simple and the past simple; use time clauses with when to describe past events."},{"label":"Academic writing skill","text":"Add details to main facts."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":124,"alt":""}}]}},{"id":"B02-RW-U06-classroom:resource:b3808","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8167d104e13f2edba7a1a66ad25dbf07d1882c7bfe3266b2436276f211b06d6a.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"throw away","pos":"(v)","definition":"to get rid of something that you do not want any more","example":"Please don't throw away those clean jars.","wordAudio":"throw away","cardWord":false},{"term":"mend","pos":"(v)","definition":"to repair something when it breaks","example":"My uncle showed me how to mend a torn shirt.","wordAudio":"mend","cardWord":false},{"term":"materials","pos":"(n)","definition":"physical things, like wood and stone, that other things can be made from","example":"Wood and glass are two of the materials used in the new building.","wordAudio":"materials","cardWord":false},{"term":"reuse","pos":"(v)","definition":"to use something again","example":"We can reuse these boxes to store books.","wordAudio":"reuse","cardWord":false},{"term":"recycle","pos":"(v)","definition":"to make new things from used objects or waste materials","example":"The school collects bottles to recycle them.","wordAudio":"recycle","cardWord":false},{"term":"waste","pos":"(n)","definition":"unwanted material of any type, especially what is left after useful parts have been removed","example":"This farm turns food waste into compost.","wordAudio":"waste","cardWord":false}]]}},{"id":"B02-RW-U06-classroom:video","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5ea816f9ef2425e460fb44abcd31a8bdbd67fba6ee1fcb59fa574f9b0468795.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/83d89daa6a54103699ee9074-L2RW-U06.mp4","captions":[{"start":0.78,"end":4.58,"text":"Welcome to the Réjus toy shop in Paris, France."},{"start":5.5,"end":7.96,"text":"The toys here look new, but they aren't."},{"start":9.22,"end":12.42,"text":"The shop's name, Réjus, means play again."},{"start":13.6,"end":15.3,"text":"When people throw away toys,"},{"start":15.8,"end":17.44,"text":"Réjus collects them,"},{"start":17.94,"end":20.08,"text":"cleans them, and mends them."},{"start":21.72,"end":23.42,"text":"Then, it sells them."},{"start":24.22,"end":27.84,"text":"Réjus' toys are 40 % cheaper than new ones."},{"start":29.4,"end":31.82,"text":"Réjus is a circular business."},{"start":32.54,"end":34.38,"text":"But what does this mean exactly?"},{"start":37.1,"end":39.78,"text":"Businesses often take materials from the world,"},{"start":41.02,"end":41.72,"text":"make something,"},{"start":42.9,"end":44.86,"text":"and then throw away the waste."},{"start":48.74,"end":50.74,"text":"Circular businesses are different."},{"start":51.58,"end":54.2,"text":"They reuse or recycle waste."},{"start":55.2,"end":57.8,"text":"Waste costs almost nothing,"},{"start":59.12,"end":63.38,"text":"and circular businesses are making money from it."},{"start":64.32,"end":69.64,"text":"Kanenti in Tunisia is another circular business,\nrecycling shoes and also bags."},{"start":71.68,"end":76.52,"text":"People throw away three to four million pairs of shoes\na year in Tunisia."},{"start":76.52,"end":83.62,"text":"The artists at Kanenti make shoes and bags look new and\nexciting again."},{"start":84.86,"end":87.64,"text":"People can bring in their old things to the shop."},{"start":89.06,"end":94.86,"text":"For bags such as mine, which are quite expensive, I\nthink it's better to give them a new life."},{"start":98.68,"end":103.96000000000001,"text":"Old water bottles, plastic shopping bags, and food\nboxes don't look useful."},{"start":104.7,"end":112.94,"text":"But here in Cairo, a new company, Tile Green, is making\nvery strong building materials from plastic waste."},{"start":116.62,"end":117.96000000000001,"text":"This German company,"},{"start":118.25999999999999,"end":118.8,"text":"Everwave,"},{"start":119.53999999999999,"end":120.96,"text":"is doing the same thing."},{"start":122.2,"end":127.08,"text":"Turning trash into eco -friendly,"},{"start":127.78,"end":129.8,"text":"high -quality building materials."},{"start":130.56,"end":131.96,"text":"Back in France,"},{"start":132.32,"end":134.34,"text":"they're even recycling fish skin."},{"start":135.82,"end":136.6,"text":"At Iktios,"},{"start":136.92000000000002,"end":142.74,"text":"fish skins become a beautiful, strong material called\nsea leather for shoes, bags, and watches."},{"start":144.07999999999998,"end":148,"text":"They get the fish skins for free from restaurants and\nfish farms."},{"start":150.14,"end":152.28,"text":"This Kenyan business is doing the same."},{"start":152.94,"end":156.32,"text":"It sells most of its fish skin products in Europe."},{"start":157.46,"end":163.1,"text":"Why can't we be proud of our fish and use it more\neconomically and be proud of it?"},{"start":163.12,"end":167.2,"text":"So when I put on the shoes made from fish leather,"},{"start":167.8,"end":170.04,"text":"I put on the cap as well as the jacket."},{"start":170.12,"end":170.72,"text":"I feel happy."},{"start":170.88,"end":171.7,"text":"I feel very proud."},{"start":172.57999999999998,"end":175,"text":"So if you want to start a business,"},{"start":175.6,"end":176.94,"text":"why not use waste?"},{"start":178.94,"end":182.6,"text":"Going circular can make money and help the planet."}],"launchInline":true}},{"id":"B02-RW-U06-classroom:material:RW-M03","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[129],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5db966d2bae30da1dca570bf995c0810740ea0d50c9cfc1894c638aa90f0461.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the internet  \n☐ c play sports or practise a hobby like a musical instrument or photography  \n□ d go to the cinema\n2 Which sections of a news website do you look at first?\n□ a advice page or letters to the editor  \n□ b news  \n□ c sport  \n□ d TV, music, books and art\n3 What do you like to do at an event?\n□ a meet new people  ","sourcePage":129},{"body":"□ b discuss the latest news  \n□ c help with the food and drinks  \n□ d sing songs and tell jokes\n4 What do you prefer to do on a day off?\n□ a have coffee with friends  \n□ b organize your books and cupboards  \n□ c work in the garden or clean the house  \n□ d write poetry, make music or draw pictures\n## Mostly 'a' answers:\nYou are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer.\n## Mostly 'c' answers:\nYou are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer.\n## Mostly 'b' answers:\nYou are neat, you are good at planning and you like learning new things. You would enjoy a job working with information.\nPossible jobs are: university professor, computer programmer, librarian.","sourcePage":129},{"body":"## Mostly 'd' answers:\nYou are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer.","sourcePage":129}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U06-classroom:material:RW-M03","key":"material:RW-M03","label":"READING 1","title":"Are you ready for the","pages":[{"page":129,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5db966d2bae30da1dca570bf995c0810740ea0d50c9cfc1894c638aa90f0461.png","width":772,"height":1040}],"source":129,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the internet  \n☐ c play sports or practise a hobby like a musical instrument or photography  \n□ d go to ou like learning new things. You would enjoy a job working with information.\n\nPossible jobs are: university professor, computer programmer, librarian.\n\n## Mostly 'd' answers:\n\nYou are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3822"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_6f42171301964649.mp3","continueOnPage":true}},{"id":"B02-RW-U06-classroom:resource:b3838","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":2,"module":"Vocabulary for Ex 1","context":{"moduleLabel":"READING 2","phaseTitle":"PREPARING TO READ"},"pages":[131],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e208868d43b728ed6fa05a51a0144f6966c69e46b3125acb47f65b8fd8e60be6.png"],"layout":"list","instruction":"Vocabulary for Ex 1","flow":{"kind":"resource","pages":["advertise (v) to tell people about a product or service, for example, on television or online, to make them want to buy it\nemploy (v) to give somebody a job\ngoal (n) something you want to do successfully in the future\nintroduce (v) to make something available for the first time","office (n) a place where somebody works, especially with computers, phones, etc.\npartner (n) somebody who runs or owns a business with another person or people\nrun (v) to manage or operate something\nset up (phr v) to create or start something for a particular reason"]},"provided":"","items":[],"references":[],"materials":[],"issues":[]},{"id":"B02-RW-U06-classroom:material:RW-M04","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[133],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0cb546abea1ffe3749cef7a5c58631624673de05cae846b938edca9925bca602.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.","sourcePage":133},{"body":"2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.","sourcePage":133},{"body":"[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.","sourcePage":133},{"body":"4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","sourcePage":133}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":133,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0cb546abea1ffe3749cef7a5c58631624673de05cae846b938edca9925bca602.png","width":772,"height":1040}],"source":133,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.","sourcePage":133},{"body":"2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.","sourcePage":133},{"body":"[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.","sourcePage":133},{"body":"4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","sourcePage":133}],"text":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.\n2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.\n[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.\n4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ec16535a4c134bb0.mp3"},"original":{"id":"B02-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U06","book":2,"track":"RW","unit":6,"title":"READING 2","kind":"material","pages":[133],"sourceImages":[{"page":133,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0cb546abea1ffe3749cef7a5c58631624673de05cae846b9  to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\n\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.\n\n4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b3849"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ec16535a4c134bb0.mp3","continueOnPage":true}},{"id":"B02-RW-U06-classroom:review-1","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[145],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6b4e86eff7301203c1153ab07463ceeb3ac25511ec1669feb70b40128b0278ce.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B02-RW-U06-B-002","form":"advice","page":145},{"id":"B02-RW-U06-B-003","form":"apply","page":145},{"id":"B02-RW-U06-B-004","form":"colleague","page":145},{"id":"B02-RW-U06-B-005","form":"customer","page":145},{"id":"B02-RW-U06-B-006","form":"department","page":145},{"id":"B02-RW function strip(s){return s.replace(/<[^>]*>/g," ").replace(/\*\*/g,"").replace(/\s+/g," ").trim();}
function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);
  }
  return parsed.body.innerHTML;
 }

}
function itemHTML(x,letterChoices=false){

function bind(c){
 if(c.coursePages)return {chunks:c.coursePages,decks:[]};
 if(c.readingView)return {chunks:classroom.readingPages(c.readingView),reading:true};
 if(c.flow)return {chunks:c.flow.pages??[null],decks:[]};
 const decks=classroom.materialDecks(c);
 const plan=c.presentation, sourceItems=plan?.items??c.items;
 if(c.taskTable||c.panelGroups||decks.length||(plan&&!["items","definitions"].includes(plan.kind))){
  const hasItems=plan?.showAll||(!plan&&decks.length&&!c.taskTable&&!c.provided);
  return {table:false,equalOptions:false,bank:[],chunks:[hasItems?sourceItems:[]],provided:c.provided,decks};
 }
 const table=!plan&&/<table/i.test(c.provided);
 const inlineOptions=inlineRows(c.feedback).some(row=>["choice","alternatives","status"].includes(row.anchor?.kind));
 const equalOptions=!inlineOptions&&plan?.kind!=="definitions"&&sourceItems.length>1&&sourceItems[0]?.options?.length&&sourceItems.every(x=>JSON.stringify(x.options)===JSON.stringify(sourceItems[0].options));

function taskTable(table,feedback){

function wireMaterials(doc,c,decks){

   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);

 });
}

 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);

 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
