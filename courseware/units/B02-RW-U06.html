ys,"},{"start":15.8,"end":17.44,"text":"Réjus collects them,"},{"start":17.94,"end":20.08,"text":"cleans them, and mends them."},{"start":21.72,"end":23.42,"text":"Then, it sells them."},{"start":24.22,"end":27.84,"text":"Réjus' toys are 40 % cheaper than new ones."},{"start":29.4,"end":31.82,"text":"Réjus is a circular business."},{"start":32.54,"end":34.38,"text":"But what does this mean exactly?"},{"start":37.1,"end":39.78,"text":"Businesses often take materials from the world,"},{"start":41.02,"end":41.72,"text":"make something,"},{"start":42.9,"end":44.86,"text":"and then throw away the waste."},{"start":48.74,"end":50.74,"text":"Circular businesses are different."},{"start":51.58,"end":54.2,"text":"They reuse or recycle waste."},{"start":55.2,"end":57.8,"text":"Waste costs almost nothing,"},{"start":59.12,"end":63.38,"text":"and circular businesses are making money from it."},{"start":64.32,"end":69.64,"text":"Kanenti in Tunisia is another circular business,\nrecycling shoes and also bags."},{"start":71.68,"end":76.52,"text":"People throw away three to four million pairs of shoes\na year in Tunisia."},{"start":76.52,"end":83.62,"text":"The artists at Kanenti make shoes and bags look new and\nexciting again."},{"start":84.86,"end":87.64,"text":"People can bring in their old things to the shop."},{"start":89.06,"end":94.86,"text":"For bags such as mine, which are quite expensive, I\nthink it's better to give them a new life."},{"start":98.68,"end":103.96000000000001,"text":"Old water bottles, plastic shopping bags, and food\nboxes don't look useful."},{"start":104.7,"end":112.94,"text":"But here in Cairo, a new company, Tile Green, is making\nvery strong building materials from plastic waste."},{"start":116.62,"end":117.96000000000001,"text":"This German company,"},{"start":118.25999999999999,"end":118.8,"text":"Everwave,"},{"start":119.53999999999999,"end":120.96,"text":"is doing the same thing."},{"start":122.2,"end":127.08,"text":"Turning trash into eco -friendly,"},{"start":127.78,"end":129.8,"text":"high -quality building materials."},{"start":130.56,"end":131.96,"text":"Back in France,"},{"start":132.32,"end":134.34,"text":"they're even recycling fish skin."},{"start":135.82,"end":136.6,"text":"At Iktios,"},{"start":136.92000000000002,"end":142.74,"text":"fish skins become a beautiful, strong material called\nsea leather for shoes, bags, and watches."},{"start":144.07999999999998,"end":148,"text":"They get the fish skins for free from restaurants and\nfish farms."},{"start":150.14,"end":152.28,"text":"This Kenyan business is doing the same."},{"start":152.94,"end":156.32,"text":"It sells most of its fish skin products in Europe."},{"start":157.46,"end":163.1,"text":"Why can't we be proud of our fish and use it more\neconomically and be proud of it?"},{"start":163.12,"end":167.2,"text":"So when I put on the shoes made from fish leather,"},{"start":167.8,"end":170.04,"text":"I put on the cap as well as the jacket."},{"start":170.12,"end":170.72,"text":"I feel happy."},{"start":170.88,"end":171.7,"text":"I feel very proud."},{"start":172.57999999999998,"end":175,"text":"So if you want to start a business,"},{"start":175.6,"end":176.94,"text":"why not use waste?"},{"start":178.94,"end":182.6,"text":"Going circular can make money and help the planet."}]}],"courseAnswer":{"kind":"teacher-excerpt","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":52,"title":"教师书"}],"videoText":"A company in Cairo and a German company use old water bottles, plastic shopping bags and food boxes to make very strong building materials.\nA company in France uses fish skin to make shoes, bags and watches."},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[],"courseRevealLabel":"答案"},{"id":"B02-RW-U06-question:b3812","book ,{"start":178.94,"end":182.6,"text":"Going circular can make money and help the planet."}]}],"courseAnswer":{"kind":"teacher-excerpt","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":52,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U06-question:b3815","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"order":8,"module":"WATCH AND LISTEN","ex":"7","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Work with a partner. Do you think the main speaker in the video supports the idea of 'circular' businesses? How do you know?","pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5ea816f9ef2425e460fb44abcd31a8bdbd67fba6ee1fcb59fa574f9b0468795.png"],"provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/83d89daa6a54103699ee9074-L2RW-U06.mp4","captions":[{"start":0.78,"end":4.58,"text":"Welcome to the Réjus toy shop in Paris, France."},{"start":5.5,"end":7.96,"text":"The toys here look new, but they aren't."},{"start":9.22,"end":12.42,"text":"The shop's name, Réjus, means play again."},{"start":13.6,"end":15.3,"text":"When people throw away toys,"},{"start":15.8,"end":17.44,"text":"Réjus collects them,"},{"start":17.94,"end":20.08,"text":"cleans them, and mends them."},{"start":21.72,"end":23.42,"text":"Then, it sells them."},{"start":24.22,"end":27.84,"text":"Réjus' toys are 40 % cheaper than new ones."},{"start":29.4,"end":31.82, three main kinds of jobs – jobs with animals, jobs with information, jobs with machines and jobs with ideas. The quiz helps you to find out about the kind of people you might like. After doing the quiz, read the advice to find universities you might like.","items":[{"id":"b3824.i01","label":"1","prompt":"There are three main kinds of jobs – jobs with animals, jobs with information, jobs with machines and jobs with ideas.","options":[],"type":"gap/open"},{"id":"b3824.i02","label":"2","prompt":"The quiz helps you to find out about the kind of people you might like.","options":[],"type":"gap/open"},{"id":"b3824.i03","label":"3","prompt":"After doing the quiz, read the advice to find universities you might like.","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"There are three main kinds of jobs – jobs with animals, jobs with information, jobs with machines and jobs with ideas. The quiz helps you to find out about the kind of people you might like. After doing the quiz, read the advice to find universities you might like."}]],"courseMaterials":[{"id":"B02-RW-U06-classroom:material:RW-M03","title":"READING 1","text":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the internet  \n☐ c play sports or practise a hobby like a musical instrument or photography  \n□ d go to the cinema\n2 Which sections of a news website do you look at first?\n□ a advice page or letters to the editor  \n□ b news  \n□ c sport  \n□ d TV, music, books and art\n3 What do you like to do at an event?\n□ a meet new people  \n□ b discuss the latest news  \n□ c help with the food and drinks  \n□ d sing songs and tell jokes\n4 What do you prefer to do on a day off?\n□ a have coffee with friends  \n□ b organize your books and cupboards  \n□ c work in the garden or clean the house  \n□ d write poetry, make music or draw pictures\n## Mostly 'a' answers:\nYou are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer.\n## Mostly 'c' answers:\nYou are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer.\n## Mostly 'b' answers:\nYou are neat, you are good at planning and you like learning new things. You would enjoy a job working with information.\nPossible jobs are: university professor, computer programmer, librarian.\n## Mostly 'd' answers:\nYou are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer.","screens":["Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the interne provided":"","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B02-RW-U06-classroom:material:RW-M04","title":"READING 2","text":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.\n2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.\n[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.\n4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","screens":["1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.","2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could m .github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0cb546abea1ffe3749cef7a5c58631624673de05cae846b938edca9925bca602.png","width":772,"height":1040}],"kind":"reading"}],"courseMedia":[{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ec16535a4c134bb0.mp3"}],"courseAnswer":{"kind":"model-source","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/7a4789f3e4f8b08bebfb062cac606deb12df771ea85c6b801138d797694466e5.pdf","pdfPage":54,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1080e41b19a0131087231c9488370b1919723395ba8ae7efd6d5e3db37eb6b73.pdf","pdfPage":6,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B02-RW-U06-question:b3869","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Look back at Reading 2 on page 133. Which years in the text were particularly important for OpenAI? Choose 2–3 important events.","pages":[137],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/d848398d5a7e94d20c4a05e342dd9c70aff96e4ade91675683c2f20970521056.png"],"provided":"1\n2\n3","items":[{"id":"b3869.i01","label":"1","prompt":"","options":[],"type":"gap/open"},{"id":"b3869.i02","label":"2","prompt":"","options":[],"type":"gap/open"},{"id":"b3869.i03","label":"3","prompt":"","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B02-RW-U06-publisher-page:p133","title":"原题或核对备注所引第133页","pages":[133],"text":"","screens":[],"sources":[{"page":133,"src":" "module":"学习目标","context":{"moduleLabel":"UNLOCK YOUR KNOWLEDGE","phaseTitle":"LEARNING OBJECTIVES"},"pages":[124],"sourcePages":[124],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8325031c9579c1703eb5d691b8f6d154cd0dba04e34e20758768e408b1542c58.png"],"sourceHashes":["8325031c9579c1703eb5d691b8f6d154cd0dba04e34e20758768e408b1542c58"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"LEARNING OBJECTIVES","flow":{"kind":"unit-opening","pages":[{"outcome":{"label":"Writing task","text":"Write a narrative paragraph."},"goals":[{"label":"Watch and listen","text":"Watch and understand a video about circular businesses."},{"label":"Reading skills","text":"Work out meaning from context; annotate a text."},{"label":"Critical thinking","text":"Organize events in time order."},{"label":"Grammar","text":"Use the present simple and the past simple; use time clauses with when to describe past events."},{"label":"Academic writing skill","text":"Add details to main facts."}],"photo":{"box":[245,127,526,902],"nativeWidth":772,"sourcePage":124,"alt":""}}]}},{"id":"B02-RW-U06-classroom:resource:b3808","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"GLOSSARY","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"PREPARING TO WATCH"},"pages":[126],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/8167d104e13f2edba7a1a66ad25dbf07d1882c7bfe3266b2436276f211b06d6a.png"],"layout":"list","items":[],"provided":"","references":[],"materials":[],"issues":[],"instruction":"GLOSSARY","flow":{"kind":"glossary","targetExercise":"1","pages":[[{"term":"throw away","pos":"(v)","definition":"to get rid of something that you do not want any more","example":"Please don't throw away those clean jars.","wordAudio":"throw away","cardWord":false},{"term":"mend","pos":"(v)","definition":"to repair something when it breaks","example":"My uncle showed me how to mend a torn shirt.","wordAudio":"mend","cardWord":false},{"term":"materials","pos":"(n)","definition":"physical things, like wood and stone, that other things can be made from","example":"Wood and glass are two of the materials used in the new building.","wordAudio":"materials","cardWord":false},{"term":"reuse","pos":"(v)","definition":"to use something again","example":"We can reuse these boxes to store books.","wordAudio":"reuse","cardWord":false},{"term":"recycle","pos":"(v)","definition":"to make new things from used objects or waste materials","example":"The school collects bottles to recycle them.","wordAudio":"recycle","cardWord":false},{"term":"waste","pos":"(n)","definition":"unwanted material of any type, especially what is left after useful parts have been removed","example":"This farm turns food waste into compost.","wordAudio":"waste","cardWord":false}]]}},{"id":"B02-RW-U06-classroom:video","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[127],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5ea816f9ef2425e460fb44abcd31a8bdbd67fba6ee1fcb59fa574f9b0468795.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/83d89daa6a54103699ee9074-L2RW-U06.mp4","captions":[{"start":0.78,"end":4.58,"text":"Welcome to the Réjus toy shop in Paris, France."},{"start":5.5,"end":7.96,"text":"The toys here look new, but they aren't."},{"start":9.22,"end":12.42,"text":"The shop's name, Réjus, means play again."},{"start":13.6,"end":15.3,"text":"When people throw away toys,"},{"start":15.8,"end":17.44,"text":"Réjus collects them,"},{"start":17.94,"end":20.08,"text":"cleans them, and mends them."},{"start":21.72,"end":23.42,"text":"Then, it sells them."},{"start":24.22,"end":27.84,"text":"Réjus' toys are 40 % cheaper than new ones."},{"start":29.4,"end":31.82,"text":"Réjus is a circular business."},{"start":32.54,"end":34.38,"text":"But what does this mean exactly?"},{"start":37.1,"end":39.78,"text":"Businesses often take materials from the world,"},{"start":41.02,"end":41.72,"text":"make something,"},{"start":42.9,"end":44.86,"text":"and then throw away the waste."},{"start":48.74,"end":50.74,"text":"Circular businesses are different."},{"start":51.58,"end":54.2,"text":"They reuse or recycle waste."},{"start":55.2,"end":57.8,"text":"Waste costs almost nothing,"},{"start":59.12,"end":63.38,"text":"and circular businesses are making money from it."},{"start":64.32,"end":69.64,"text":"Kanenti in Tunisia is another circular business,\nrecycling shoes and also bags."},{"start":71.68,"end":76.52,"text":"People throw away three to four million pairs of shoes\na year in Tunisia."},{"start":76.52,"end":83.62,"text":"The artists at Kanenti make shoes and bags look new and\nexciting again."},{"start":84.86,"end":87.64,"text":"People can bring in their old things to the shop."},{"start":89.06,"end":94.86,"text":"For bags such as mine, which are quite expensive, I\nthink it's better to give them a new life."},{"start":98.68,"end":103.96000000000001,"text":"Old water bottles, plastic shopping bags, and food\nboxes don't look useful."},{"start":104.7,"end":112.94,"text":"But here in Cairo, a new company, Tile Green, is making\nvery strong building materials from plastic waste."},{"start":116.62,"end":117.96000000000001,"text":"This German company,"},{"start":118.25999999999999,"end":118.8,"text":"Everwave,"},{"start":119.53999999999999,"end":120.96,"text":"is doing the same thing."},{"start":122.2,"end":127.08,"text":"Turning trash into eco -friendly,"},{"start":127.78,"end":129.8,"text":"high -quality building materials."},{"start":130.56,"end":131.96,"text":"Back in France,"},{"start":132.32,"end":134.34,"text":"they're even recycling fish skin."},{"start":135.82,"end":136.6,"text":"At Iktios,"},{"start":136.92000000000002,"end":142.74,"text":"fish skins become a beautiful, strong material called\nsea leather for shoes, bags, and watches."},{"start":144.07999999999998,"end":148,"text":"They get the fish skins for free from restaurants and\nfish farms."},{"start":150.14,"end":152.28,"text":"This Kenyan business is doing the same."},{"start":152.94,"end":156.32,"text":"It sells most of its fish skin products in Europe."},{"start":157.46,"end":163.1,"text":"Why can't we be proud of our fish and use it more\neconomically and be proud of it?"},{"start":163.12,"end":167.2,"text":"So when I put on the shoes made from fish leather,"},{"start":167.8,"end":170.04,"text":"I put on the cap as well as the jacket."},{"start":170.12,"end":170.72,"text":"I feel happy."},{"start":170.88,"end":171.7,"text":"I feel very proud."},{"start":172.57999999999998,"end":175,"text":"So if you want to start a business,"},{"start":175.6,"end":176.94,"text":"why not use waste?"},{"start":178.94,"end":182.6,"text":"Going circular can make money and help the planet."}],"launchInline":true}},{"id":"B02-RW-U06-classroom:material:RW-M03","book":2,"unit":6,"track":"RW","topic":"BUSINESS","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[129],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f5db966d2bae30da1dca570bf995c0810740ea0d50c9cfc1894c638aa90f0461.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the internet  \n☐ c play sports or practise a hobby like a musical instrument or photography  \n□ d go to the cinema\n2 Which sections of a news website do you look at first?\n□ a advice page or letters to the editor  \n□ b news  \n□ c sport  \n□ d TV, music, books and art\n3 What do you like to do at an event?\n□ a meet new people  ","sourcePage":129},{"body":"□ b discuss the latest news  \n□ c help with the food and drinks  \n□ d sing songs and tell jokes\n4 What do you prefer to do on a day off?\n□ a have coffee with friends  \n□ b organize your books and cupboards  \n□ c work in the garden or clean the house  \n□ d write poetry, make music or draw pictures\n## Mostly 'a' answers:\nYou are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer.\n## Mostly 'c' answers:\nYou are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer.\n## Mostly 'b' answers:\nYou are neat, you are good at planning and you like learning new things. You would enjoy a job working with information.\nPossible jobs are: university professor, computer programmer, librarian.","sourcePage":129},{"body":"## Mostly 'd' answers:\nYou are creative, you are good at mu rs:\nYou are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer.\n## Mostly 'c' answers:\nYou are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer.\n## Mostly 'b' answers:\nYou are neat, you are good at planning and you like learning new things. You would enjoy a job working with information.\nPossible jobs are: university professor, computer programmer, librarian.","sourcePage":129},{"body":"## Mostly 'd' answers:\nYou are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer.","sourcePage":129}],"text":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:\n1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas\nWhat kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party  \n□ b stay at home and surf the internet  \n☐ c play sports or practise a hobby like a musical instrument or photography  \n□ d go to the cinema\n2 Which sections of a news website do you look at first?\n□ a advice page or letters to the editor  \n□ b news  \n□ c sport  \n□ d TV, music, books and art\n3 What do you like to do at an event?\n□ a meet new people  \n□ b discuss the latest news  \n□ c help with the food and drinks  \n□ d sing songs and tell jokes\n4 What do you prefer to do on a day off?\n□ penAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.","sourcePage":133},{"body":"2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.","sourcePage":133},{"body":"[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.","sourcePage":133},{"body":"4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","sourcePage":133}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B02-RW-U06-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"READING 2","pages":[{"page":133,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0cb546abea1ffe3749cef7a5c58631624673de05cae846b938edca9925bca602.png","width":772,"height":1040}],"source":133,"embeddedIn":null,"photo":null,"clearPages":[{"body":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.","sourcePage":133},{"body":"2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.","sourcePage":133},{"body":"[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.","sourcePage":133},{"body":"4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","sourcePage":133}],"text":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.\n2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.\n[IMAGE_1]\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.\n4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctors find cures for diseases, find answers to difficult problems like climate change or help people to run their businesses better. Although some people worry that in the future AI will hurt people, OpenAI wants to make sure that AI will be safe for everyone to use and will make our lives easier and more enjoyable.","media":{"type":"audio","title":"Reading 2","src":"/unlockanswers.github.io/assets/classroom/audio/PPT_ec16535a4c134bb0.mp3"},"original":{"id":"B02-RW-U06-material:RW-M04","entry":"material:RW-M04","unitId":"B02-RW-U06","book":2,"track":"RW","unit":6,"title":"READING 2","kind":"material","pages":[133],"sourceImages":[{"page":133,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0cb546abea1ffe3749cef7a5c58631624673de05cae846b938edca9925bca602.png","viewEvidenceReported":true}],"text":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\n\nThey believe that more use of AI in the world is a good thing.\n\n2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person. This was the same year that Elon Musk left OpenAI and the company announced it was going to partner with Microsoft Corporation. The partnership meant OpenAI could do more research and share the results with the world. In 2020 OpenAI opened its office in San Francisco. It shares the building with another business started by Elon Musk. ChatGPT was introduced in November 2022, and it grew faster than any other application. In only 2 months, 100 million people used it. About 13 million people used ChatGPT every day in January 2023, which is double the number who used it in December. Compare this to TikTok, which took about 9 months to get about 100 million users, and Instagram, which took about 2.5 years.\n\n[IMAGE_1]\n\n3 ChatGPT is free to use; however, in February 2023 OpenAI started to advertise a subscription $^{5}$ . People who choose to pay $20 every month get faster answers to their questions. Some schools and teachers worry about students using ChatGPT to do their coursework.\n\nA number of schools in America stopped teachers and students from using the application while they were at school. This shows that not everyone is happy about AI technology and how fast it is growing. Some people think businesses like OpenAI are not thinking about the possible bad results of things they are doing.\n\n4 OpenAI is still working hard to make amazing AI that can help all people. In the future, they want to make AI programs that can do things like help doctor ":[]}},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{"B01-LS-U05-question:b1192":{"rows":{"b1192.i01":{"mode":"choice","option":2},"b1192.i02":{"mode":"choice","option":3},"b1192.i03":{"mode":"choice","option":1},"b1192.i04":{"mode":"choice","option":0}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B02-RW-U05-question:b3751":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"It is easy to get to my house. First, walk (1) __ the High Street. Go (2) __ the bank and (3) __ the bridge. Then walk (4) __ the park and (5) __ the next bridge. Go (6) __ the tunnel – watch out for cars – and walk (7) __ the road. Walk (8) __ the lake. My house is at the end of the road. It's the pink one!","values":["along","past","over / across","through / across","under","through","across","around / along"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B02-RW-U06-question:b3888":{"rows":{},"textItems":[],"textFills":[{"part":0,"block":0,"text":"In 2005, three friends, Chad Hurley, Steve Chen and Jawed Karim, had an idea for an internet business. (1) __ They created YouTube™. Today, YouTube is the largest video sharing site on the internet, and it has over 1.5 billion users. YouTube's first office was located in a simple room. (2) __ Their first video was posted in April 2005. It was called 'Me at the Zoo'. (3) __ Within five months, over a million people saw the video. Businesses began to notice YouTube and wanted to advertise on the website. In July 2006, 65,000 new videos were posted every day. In November 2006, Google bought YouTube. (4) __","values":["a","d","b","c"]}],"tableEdits":[],"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1224":{"rows":{"b1224.i02":{"mode":"gap","answer":"have","hideOptions":true},"b1224.i03":{"mode":"gap","answer":"don't have to","hideOptions":true},"b1224.i04":{"mode":"gap","answer":"doesn't have to","hideOptions":true},"b1224.i05":{"mode":"gap","answer":"has to","hideOptions":true},"b1224.i06":{"mode":"gap","answer":"has","hideOptions":true}},"textItems":[],"itemPatches":{"b1224.i02":{"options":[]},"b1224.i03":{"options":[]},"b1224.i04":{"options":[]},"b1224.i05":{"options":[]},"b1224.i06":{"options":[]}},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"},"B01-LS-U05-question:b1253":{"rows":{"b1253.i01":{"mode":"choice","option":1}},"textItems":[],"itemPatches":{},"overrideRows":true,"basis":"已核对教材题面与教师书的对应答案。"}},{"B02-RW-U06-question:b3866":{"basis":"已核对教材标号和教师资料，按原答题位置显示。","rows":{},"textFills":[{"part":0,"block":3,"values":["employees"],"text":"Important information for (1) __ of Jenson Co."},{"part":0,"block":4,"values":["office","software","employ"],"text":"I am pleased to tell you that we are moving into a bright new (2) __ in three months. We are also getting new (3) __ for our computers. We will have more space, so we can (4) __ more people."},{"part":1,"block":0,"values":["products","department","colleagues"],"text":"I am very confident that these changes will help us sell more of our excellent (5) __. It is exciting that our (6) __ continues to grow. You and your (7) __ are responsible for that."},{"part":1,"block":3,"values":["manager"],"text":"Sales (8) __"}],"tableEdits":[]},"B01-LS-U05-question:b1235":{"basis":"按教材第 113 页的十二个形容词及教师书对应音节数核对。","rows":{"b1235.i01":{"mode":"gap","answer":"2"},"b1235.i02":{"mode":"gap","answer":"3"},"b1235.i03":{"mode":"gap","answer":"1"},"b1235.i04":{"mode":"gap","answer":"2"},"b1235.i05":{"mode":"gap","answer":"3"},"b1235.i06":{"mode":"gap","answer":"1"},"b1235.i07":{"mode":"gap","answer":"1"},"b1235.i08":{"mode":"gap","answer":"1"},"b1235.i09":{"mode":"gap","answer":"1"},"b1235.i10":{"mode":"gap","answer":"3"},"b1235.i11":{"mode":"gap","answer":"1"},"b1235.i12":{"mode":"gap","answer":"1"}},"textItems":[],"overrideRows":true},"B01-LS-U05-question:b1236":{"basis":"保留教材第 113 页左右各六项的原排序，按教师书核对比较级。","rows":{},"appendBlocks":[{"part":0,"blocks":[{"kind":"table","rows":[[{"text":"1","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more boring","showMarker":true}},{"text":"7","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"bigger","showMarker":true}}],[{"text":"2","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more interesting","showMarker":true}},{"text":"8","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"smaller","showMarker":true}}],[{"text":"3","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"safer","showMarker":true}},{"text":"9","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"better","showMarker":true}}],[{"text":"4","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"easier","showMarker":true}},{"text":"10","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more important","showMarker":true}}],[{"text":"5","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"more difficult","showMarker":true}},{"text":"11","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"harder","showMarker":true}}],[{"text":"6","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"nicer","showMarker":true}},{"text":"12","rowspan":1,"colspan":1,"header":false,"answer":{"answer":"worse","showMarker":true}}]]}]}]}},{},{"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small","sourcePage":112,"blocks":[{"kind":"text","text":"The diagram shows an example of the Tough Guy course. First, participants run for one kilometre along a muddy road. Next, they crawl under low nets on the ground. After the nets, the runners jump off a high platform into a lake and swim for another kilometre. Then they reach the field of fire. Here the runners run across a field and jump over small"}]},{"body":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line.","sourcePage":112,"blocks":[{"kind":"text","text":"bonfires. Next, participants must crawl through a long tunnel. The tunnel is partly underwater. Finally, the runners run two kilometres through nettles before they reach the finish line."}]}],"B02-RW-U06-classroom:material:RW-M03":[{"body":"Are you ready for the\nWORLD OF WORK?\n[IMAGE_1]\nDo you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:","sourcePage":129,"blocks":[{"kind":"text","text":"Are you ready for the"},{"kind":"text","text":"WORLD OF WORK?"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"Do you know what kind of job you want? Before you apply for a job, think about the different types of jobs that people do. There are four main types of jobs:"}]},{"body":"1 jobs with people\n3 jobs with things\n2 jobs with information\n4 jobs with ideas","sourcePage":129,"blocks":[{"kind":"text","text":"1 jobs with people"},{"kind":"text","text":"3 jobs with things"},{"kind":"text","text":"2 jobs with information"},{"kind":"text","text":"4 jobs with ideas"}]},{"body":"What kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d.\nCheck your results and read the advice to find occupations you would like.\n1 What do you like to do in the evenings?\n□ a meet friends or go to a party","sourcePage":129,"blocks":[{"kind":"text","text":"What kind of work would be best for you? Take our quiz and find out about the kind of work you would enjoy. For each question, choose the best answer for you: a, b, c or d."},{"kind":"text","text":"Check your results and read the advice to find occupations you would like."},{"kind":"text","text":"1 What do you like to do in the evenings?"},{"kind":"text","text":"□ a meet friends or go to a party"}]},{"body":"□ b stay at home and surf the internet\n☐ c play sports or practise a hobby like a musical instrument or photography\n□ d go to the cinema\n2 Which sections of a news website do you look at first?\n□ a advice page or letters to the editor","sourcePage":129,"blocks":[{"kind":"text","text":"□ b stay at home and surf the internet"},{"kind":"text","text":"☐ c play sports or practise a hobby like a musical instrument or photography"},{"kind":"text","text":"□ d go to the cinema"},{"kind":"text","text":"2 Which sections of a news website do you look at first?"},{"kind":"text","text":"□ a advice page or letters to the editor"}]},{"body":"□ b news\n□ c sport\n□ d TV, music, books and art\n3 What do you like to do at an event?\n□ a meet new people","sourcePage":129,"blocks":[{"kind":"text","text":"□ b news"},{"kind":"text","text":"□ c sport"},{"kind":"text","text":"□ d TV, music, books and art"},{"kind":"text","text":"3 What do you like to do at an event?"},{"kind":"text","text":"□ a meet new people"}]},{"body":"□ b discuss the latest news\n□ c help with the food and drinks\n□ d sing songs and tell jokes\n4 What do you prefer to do on a day off?\n□ a have coffee with friends\n□ b organize your books and cupboards","sourcePage":129,"blocks":[{"kind":"text","text":"□ b discuss the latest news"},{"kind":"text","text":"□ c help with the food and drinks"},{"kind":"text","text":"□ d sing songs and tell jokes"},{"kind":"text","text":"4 What do you prefer to do on a day off?"},{"kind":"text","text":"□ a have coffee with friends"},{"kind":"text","text":"□ b organize your books and cupboards"}]},{"body":"□ c work in the garden or clean the house\n□ d write poetry, make music or draw pictures\n## Mostly 'a' answers:","sourcePage":129,"blocks":[{"kind":"text","text":"□ c work in the garden or clean the house"},{"kind":"text","text":"□ d write poetry, make music or draw pictures"},{"kind":"text","text":"## Mostly 'a' answers:"}]},{"body":"You are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer.\n## Mostly 'c' answers:","sourcePage":129,"blocks":[{"kind":"text","text":"You are friendly, kind and interested in other people. You would enjoy a job working with children, with customers in a shop or on a team with colleagues. Possible jobs are: teacher, waiter, police officer."},{"kind":"text","text":"## Mostly 'c' answers:"}]},{"body":"You are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer.\n## Mostly 'b' answers:","sourcePage":129,"blocks":[{"kind":"text","text":"You are practical, you are good at sports and you like working with your hands. You would enjoy a job working with things. Possible jobs are: construction worker, engineer, farmer."},{"kind":"text","text":"## Mostly 'b' answers:"}]},{"body":"You are neat, you are good at planning and you like learning new things. You would enjoy a job working with information.\nPossible jobs are: university professor, computer programmer, librarian.","sourcePage":129,"blocks":[{"kind":"text","text":"You are neat, you are good at planning and you like learning new things. You would enjoy a job working with information."},{"kind":"text","text":"Possible jobs are: university professor, computer programmer, librarian."}]},{"body":"## Mostly 'd' answers:\nYou are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer.","sourcePage":129,"blocks":[{"kind":"text","text":"## Mostly 'd' answers:"},{"kind":"text","text":"You are creative, you are good at music and art and you like books. You would enjoy a job working with ideas. Possible jobs are: artist, writer, singer."}]}],"B02-RW-U06-classroom:material:RW-M04":[{"body":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam","sourcePage":133,"blocks":[{"kind":"text","text":"1 ChatGPT is an artificial intelligence $^{1}$ (AI) technology. It can have an online conversation with the person using it. It can understand questions and answer them in a way that sounds 'human', and it can even say sorry when it makes a mistake. ChatGPT is owned by a technology company called OpenAI. The company was set up by Elon Musk, Sam"}]},{"body":"Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology.\nThey believe that more use of AI in the world is a good thing.","sourcePage":133,"blocks":[{"kind":"text","text":"Altman and others in 2015. Their goal was to build safe AI technology that could be used by everyone. Today, OpenAI employs 375 people. The partners started a company that created the fastest-growing application $^{2}$ of all time. Now OpenAI wants to make more powerful AI technology."},{"kind":"text","text":"They believe that more use of AI in the world is a good thing."}]},{"body":"2 OpenAI grew very quickly. The company started with investments $^{3}$ of 1 billion and in 2016, less than a year later, it developed its first AI program, OpenAI Gym. In 2018 the company introduced the first version $^{4}$ of GPT, which was the first time that a machine could make sentences that sounded like they were written by a real person.","sour 6,10.66,"For the homes they live in,","对于他们居住的家庭，"],[10.96,13.2,"like these apartments in Japan.","就像日本的公寓一样"],[15.26,16.8,"For the trains they take,","对于他们搭乘的火车，"],[17.16,19.06,"like this one in Dubai.","像这个在迪拜。"],[20.66,23.38,"And for the electric cars they drive,","对于他们驾驶的电动汽车，"],[23.88,25.96,"like this one in the UK.","像这个在英国。"],[27.02,31.34,"A lot of this electricity comes from power plants,","这些电源大多来自发电厂，"],[33.02,35.08,"which are bad for the environment.","对环境有害。"],[36.8,39.26,"But there is something we can do.","但是，我们可以做些什么。"],[41.04,43.16,"These are solar panels,","这些是太阳能电池板"],[43.66,48.02,"and we use them to make clean electricity from the sun.","我们用它们来制造来自太阳的清洁电力。"],[50,50.58,"Today,","今天，我们。.."],[50.92,54.62,"people in many jobs work with clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1},"B02-RW-U06":{"aspect":1.9085487,"cues":[[0.78,4.58,"Welcome to the Réjus toy shop in Paris, France.","欢迎来到法国巴黎的雷尤斯玩具店。"],[5.5,7.96,"The toys here look new, but they aren't.","这里的玩具看起来很新，但是它们不是。"],[9.22,12.42,"The shop's name, Réjus, means play again.","店名Réjus，意为再次玩耍。"],[13.6,15.3,"When people throw away toys,","当人们扔掉玩具，"],[15.8,17.44,"Réjus collects them,","雷尤斯收集他们，"],[17.94,20.08,"cleans them, and mends them.","清净其身，修补其身。"],[21.72,23.42,"Then, it sells them.","然后，它卖掉它们。"],[24.22,27.84,"Réjus' toys are 40 % cheaper than new ones.","雷尤斯的玩具比新玩具便宜40%."],[29.4,31.82,"Réjus is a circular business.","瑞尤斯是一个循环业务。"],[32.54,34.38,"But what does this mean exactly?","这到底是什么意思？"],[37.1,39.78,"Businesses often take materials from the world,","企业经常从世界获取材料，"],[41.02,41.72,"make something,","做点什么，"],[42.9,44.86,"and then throw away the waste.","然后把废墟丢掉。"],[48.74,50.74,"Circular businesses are different.","通知业务不同。"],[51.58,54.2,"They reuse or recycle waste.","它们重复使用或回收废物。"],[55.2,57.8,"Waste costs almost nothing,","废物几乎一文不值"],[59.12,63.38,"and circular businesses are making money from it.","和循环企业正在从它赚钱。"],[64.32,69.64,"Kanenti in Tunisia is another circular business, recycling shoes and also bags.","突尼斯的Kanenti是另一家循环企业，回收鞋和包。"],[71.68,76.52,"People throw away three to four million pairs of shoes a year in Tunisia.","突尼斯每年有三至四百万双鞋被人们扔掉。"],[76.52,83.62,"The artists at Kanenti make shoes and bags look new and exciting again.","卡南蒂的艺术家们让鞋子和包看起来又新又令人兴奋。"],[84.86,87.64,"People can bring in their old things to the shop.","人们可以把旧东西带进店里。"],[89.06,94.86,"For bags such as mine, which are quite expensive, I think it's better to give them a new life.","对于像我这样的相当昂贵的袋子，我认为最好给他们新的生活。"],[98.68,103.96000000000001,"Old water bottles, plastic shopping bags, and food boxes don't look useful.","旧水瓶，塑料购物袋，以及食品盒看起来并不有用。"],[104.7,112.94,"But here in Cairo, a new company, Tile Green, is making very strong building materials from plastic waste.","但在开罗，一家新的公司，蒂尔·格林，正在用塑料废料制作非常坚固的建筑材料。"],[116.62,117.96000000000001,"This German company,","这德国公司，"],[118.25999999999999,118.8,"Everwave,","永远的波"],[119.53999999999999,120.96,"is doing the same thing.","正在做同样的事情。"],[122.2,127.08,"Turning trash into eco -friendly,","将垃圾变成生态友好的，"],[127.78,129.8,"high -quality building materials.","高质量建筑材料。"],[130.56,131.96,"Back in France,","回到法国"],[132.32,134.34,"they're even recycling fish skin.","他们甚至回收鱼皮。"],[135.82,136.6,"At Iktios,","在伊基托斯，"],[136.92000000000002,142.74,"fish skins become a beautiful, strong material called sea leather for shoes, bags, and watches.","鱼皮成为了一种美丽，坚固的材料，称为\"海皮\"，用于鞋子，袋子，和手表。"],[144.07999999999998,148,"They get the fish skins for free from restaurants and fish farms.","他们从餐馆和养鱼场免费获得鱼皮。"],[150.14,152.28,"This Kenyan business is doing the same.","这家肯尼亚公司也在做同样的事情。"],[152.94,156.32,"It sells most of its fish skin products in Europe.","它在欧洲销售大部分的鱼皮产品。"],[157.46,163.1,"Why can't we be proud of our fish and use it more economically and be proud of it?","为甚么不能以鱼为荣，更以经济为用，以鱼为荣？"],[163.12,167.2,"So when I put on the shoes made from fish leather,","所以当我穿上用鱼皮做的鞋时"],[167.8,170.04,"I put on the cap as well as the jacket.","我把帽子和夹克都穿上了"],[170.12,170.72,"I feel happy.","我感觉很快乐。"],[170.88,171.7,"I feel very proud.","我感到非常骄傲。"],[172.57999999999998,175,"So if you want to start a business,","所以，如果你想创业，"],[175.6,176.94,"why not use waste?","为什么不用浪费？"],[178.94,182.6,"Going circular can make money and help the planet.","循环可以赚钱帮助地球"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS/15":{"pdf":13},"B01-LS/16":{"pdf":14},"B01-LS/17":{"pdf":15},"B01-LS/18":{"pdf":16},"B01-LS/19":{"pdf":17},"B01-LS/20":{"pdf":18},"B01-LS/21":{"pdf":19},"B01-LS/22":{"pdf":20},"B01-LS/23":{"pdf":21},"B01-LS/24":{"pdf":22},"B01-LS/25":{"pdf":23},"B01-LS/26":{"pdf":24},"B01-LS/27":{"pdf":25},"B01-LS/28":{"pdf":26},"B01-LS/29":{"pdf":27},"B01-LS/30":{"pdf":28},"B01-LS/31":{"pdf":29},"B01-LS/32":{"pdf":30},"B01-LS/33":{"pdf":31},"B01-LS/34":{"pdf":32},"B01-LS/35":{"pdf":33},"B01-LS/36":{"pdf":34},"B01-LS/37":{"pdf":35},"B01-LS/38":{"pdf":36},"B01-LS/39":{"pdf":37},"B01-LS/40":{"pdf":38},"B01-LS/41":{"pdf":39},"B01-LS/42":{"pdf":40},"B01-LS/43":{"pdf":41},"B01-LS/44":{"pdf":42},"B01-LS/45":{"pdf":43},"B01-LS/46":{"pdf":44},"B01-LS/47":{"pdf":45},"B01-LS/48":{"pdf":46},"B01-LS/49":{"pdf":47},"B01-LS/50":{"pdf":48},"B01-LS/51":{"pdf":49},"B01-LS/52":{"pdf":50},"B01-LS/53":{"pdf":51},"B01-LS/54":{"pdf":52},"B01-LS/55":{"pdf":53},"B01-LS/56":{"pdf":54},"B01-LS/57":{"pdf":55},"B01-LS/58":{"pdf":56},"B01-LS/59":{"pdf":57},"B01-LS/60":{"pdf":58},"B01-LS/61":{"pdf":59},"B01-LS/62":{"pdf":60},"B01-LS/63":{"pdf":61},
