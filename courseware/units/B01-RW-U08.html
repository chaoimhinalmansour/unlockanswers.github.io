arrow streets."},{"start":62.72,"end":69.82,"text":"People can use their tuk -tuks and mikiko -teni for\nwork, so they're a way to make money."},{"start":71.4,"end":73,"text":"But they bring problems,"},{"start":73.5,"end":73.6,"text":"too."},{"start":74.16,"end":76.22,"text":"Mikiko -teni are very heavy."},{"start":76.84,"end":79.76,"text":"People pushing them often get health problems."},{"start":79.76,"end":83.18,"text":"They also make the cities'"},{"start":83.72,"end":84.56,"text":"traffic slower."},{"start":86.48,"end":88.22,"text":"Tuk -tuks have different problems."},{"start":88.6,"end":90.08,"text":"They are very noisy."},{"start":90.4,"end":92.06,"text":"They make the air dirty."},{"start":93.28,"end":96.82,"text":"Air pollution is a big problem in Kenya's cities."},{"start":101.78,"end":105.18,"text":"Kenneth Gwantai is trying to solve these problems."},{"start":106.16,"end":109.24000000000001,"text":"First, he made an electric hand cart."},{"start":114.56,"end":119.78,"text":"It can go seven kilometers per hour, and it's easy to\npush."},{"start":121.54,"end":124.28,"text":"It is safe for the person pushing it."},{"start":126.22,"end":129.02,"text":"Next, Kenneth made an electric tuk -tuk."},{"start":130.14,"end":131.94,"text":"It is quiet and clean."},{"start":131.94,"end":134.46,"text":"It can carry six people."},{"start":135.76,"end":138.74,"text":"Both the hand cart and the tuk -tuk have batteries."},{"start":139.16,"end":140.78,"text":"They don't need any fuel."},{"start":141.9,"end":144.72,"text":"The batteries recharge when the vehicles move."},{"start":145.46,"end":149.22,"text":"This means the energy they use is free and clean."},{"start":149.84,"end":152.48,"text":"The vehicles don't make any air pollution."},{"start":153.8,"end":157.18,"text":"Kenneth hopes Kenya's city streets will soon be\ncleaner,"},{"start":157.76,"end":158.04,"text":"quieter,"},{"start":158.5,"end":160.04,"text":"and safer for everyone."},{"start":187.24,"end":188.64,"tex 61efad012b68d2b7a58390f4502a2ce72ddbf8cdbc31964d6e87b435.png"}],"kind":"task_sheet","sourceBlockIds":["b2348"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  Traffic is different. The other pictures are of types of\ntransport, but traffic includes all the vehicles that use\nthe roads. Another possible answer: on foot. This is the\nonly way of travelling that doesn’t use a vehicle.\n2  The greenest type of transport is on foot. Trains and\nthe metro can also be good for the environment. Cars\nand motorbikes are not as good. Cars can be all right if\nthey are electric.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U08-question:b2354","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Skim read the first paragraph and sections A, B and C. Then answer the questions.","pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0e5f8312dabd4eb9f5a8735f12d1b32afa36d4364db58340af65f94fc14afac5.png"],"provided":"","items":[{"id":"b2354.i01","label":"1","prompt":"What is the topic of the survey?","options":[],"type":"qa/open"},{"id":"b2354.i02","label":"2","prompt":"Which section wants to know what people think?","options":[],"type":"qa/open"},{"id":"b2354.i03","label":"3","prompt":"Which section wants people's personal information?","options":[],"type":"qa/open"},{"id":"b2354.i04","label":"4","prompt":"Which section wants to know what transport people use?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b2354.i01","label":"1","prompt":"What is the topic of the survey?","options":[],"type":"qa/open"},{"kind":"item","id":"b2354.i02","label":"2","prompt":"Which section wants to know what people think?","options":[],"type":"qa/open"},{"kind":"item","id":"b2354.i03","label":"3","prompt":"Which section wants people's personal information?","options":[],"type":"qa/open"},{"kind":"item","id":"b2354.i04","label":"4","prompt":"Which section wants to know what transport people use?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B01-RW-U08-classroom:material:RW-M03","title":"READING 1","text":"We are a group of Engineering students from Australia. This summer, we are studying at Bangkok University of Science and Technology. We would like to find out:\n1 how people in Bangkok travel.\n2 how people feel about transport in Bangkok.\nPlease answer the questions below. The survey¹ takes about five minutes.\nick (✓) the correct boxes to answer the questions.\n. About you\nA1 Age: How old are you?\n□14-17 □18-21 □22-31\n✓ 32–53 □ older than 53\nA2 Gender: I am: □ male ☑ female\nA3 Occupation: What do you do?\n□ study ✓ work\n. Travel\nB1 How long is your journey to work or school?\n□ 5-15 minutes ☑ 15-45 minutes\n□ 45–60 minutes □ more than 1 hour\nB2 How do you get to work or school?\n□ on foot² □ bicycle □ car □ tuk-tuk\n□ motorbike □ water taxi □ taxi\n□ SkyTrain ✓ metro □ bus\nB3 How often do you use these kinds of transport?\nTable 1\n\u003ctable>\u003ctr>\u003ctd>kinds of transport\u003c/td>\u003ctd>always\u003c/td>\u003ctd>often\u003c/td>\u003ctd>sometimes\u003c/td>\u003ctd>not often\u003c/td>\u003ctd>never\u003c/td>\u003c/tr>\u003ctr>\u003ctd>on foot\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bicycle\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>car\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>motorbike\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>water taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bus\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SkyTrain\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>metro\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tuk-tuk\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\nB4 Which type or types of transport do you own?\nI own a: ☐ bicycle ☑ car ☐ motorbike\n□ other (Please write.): ____\n. Opinion\nC1 Read the statements in the table. Do you agree or disagree with them?\nTable 2\n\u003ctable>\u003ctr>\u003ctd>statements\u003c/td>\u003ctd>strongly agree\u003c/td>\u003ctd>agree\u003c/td>\u003ctd>neither agree nor disagree\u003c/td>\u003ctd>disagree\u003c/td>\u003ctd>strongly disagree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There is a lot of traffic in Bangkok.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The traffic makes me late.\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>We need more public transport.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td nutes\n□ 45–60 minutes □ more than 1 hour\nB2 How do you get to work or school?\n□ on foot² □ bicycle □ car □ tuk-tuk\n□ motorbike □ water taxi □ taxi\n□ SkyTrain ✓ metro □ bus\nB3 How often do you use these kinds of transport?\nTable 1\n\u003ctable>\u003ctr>\u003ctd>kinds of transport\u003c/td>\u003ctd>always\u003c/td>\u003ctd>often\u003c/td>\u003ctd>sometimes\u003c/td>\u003ctd>not often\u003c/td>\u003ctd>never\u003c/td>\u003c/tr>\u003ctr>\u003ctd>on foot\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bicycle\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>car\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>motorbike\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>water taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bus\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SkyTrain\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>metro\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tuk-tuk\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\nB4 Which type or types of transport do you own?\nI own a: ☐ bicycle ☑ car ☐ motorbike\n□ other (Please write.): ____\n. Opinion\nC1 Read the statements in the table. Do you agree or disagree with them?\nTable 2\n\u003ctable>\u003ctr>\u003ctd>statements\u003c/td>\u003ctd>strongly agree\u003c/td>\u003ctd>agree\u003c/td>\u003ctd>neither agree nor disagree\u003c/td>\u003ctd>disagree\u003c/td>\u003ctd>strongly disagree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There is a lot of traffic in Bangkok.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The traffic makes me late.\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>We need more public transport.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\nC2 Write any comments or suggestions that you have about transport in Bangkok.\nWe should create more metro lines.\nThen more people could use the metro,\nand there would not be so much traffic\non the roads.\n¹ survey (n) a set of questions people are asked to get information\n² on foot (prep phr) if you go somewhere on foot, you walk there.","screens":["We are a group of Engineering students from Australia. This summer, we are studying at Bangkok University of Science and Technology. We would like to find out:\n1 how people in Bangkok travel.\n2 how people feel about transport in Bangkok.\nPlease answer the questions below. The survey¹ takes about five minutes.\nick (✓) the correct boxes to answer the questions.\n. About you\nA1 Age: How old are you?\n□14-17 □18-21 □22-31\n✓ 32–53 □ older than 53\nA2 Gender: I am: □ male ☑ female\nA3 Occupation: What do you do?\n□ study ✓ work\n. Travel\nB1 How long is your journey to work or school?\n□ 5-15 minutes ☑ 15-45 minutes\n□ 45–60 minutes □ more than 1 hour\nB2 How do you get to work or school?\n□ on foot² □ bicycle □ car □ tuk-tuk\n□ motorbike □ water taxi □ taxi\n□ SkyTrain ✓ metro □ bus\nB3 How often do you use these kinds of transpo ad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity\n¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","screens":["Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.","2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.","3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the ri inventor built a machine to water the plants.","wordAudio":"inventor","cardWord":false},{"term":"vehicle","pos":"(n)","definition":"a machine, usually with wheels and an engine, used for transporting people or goods","example":"This vehicle can carry eight people.","wordAudio":"vehicle","cardWord":false},{"term":"narrow","pos":"(adj)","definition":"narrow things measure a small distance from one side to the other","example":"We walked down a narrow street.","wordAudio":"narrow","cardWord":false},{"term":"pollution","pos":"(n)","definition":"damage caused to water, air, etc. by harmful substances or waste","example":"The town is taking steps to reduce air pollution.","wordAudio":"pollution","cardWord":true},{"term":"battery","pos":"(n)","definition":"an object that provides electricity for things such as radios, toys, or cars","example":"The toy stopped working when the battery ran out.","wordAudio":"battery","cardWord":false},{"term":"recharge","pos":"(v)","definition":"to fill a battery with electricity so that it can work again","example":"I need to recharge the battery before we leave.","wordAudio":"recharge","cardWord":false}]]}},{"id":"B01-RW-U08-classroom:video","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46debf607b1d91075d35179b88c0af4b356ebf19e3db22e80bdda526e357aacc.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/79ffadfa79a4e069999b6085-L1RW-U08.mp4","captions":[{"start":1,"end":5.04,"text":"Around the world, people are trying to solve their\ncities'"},{"start":5.4,"end":6.98,"text":"transportation problems."},{"start":8.32,"end":11.14,"text":"Kenneth Gwantai is an inventor from Kenya."},{"start":12.02,"end":16.74,"text":"He's trying to solve two big transportation problems\nfor Kenya's cities."},{"start":17.86,"end":20.54,"text":"Some parts of Kenya's cities are modern."},{"start":21.44,"end":24.42,"text":"For example, here in Nairobi, the capital,"},{"start":24.78,"end":26.16,"text":"some roads are wide."},{"start":27,"end":29.16,"text":"Buses can go on them."},{"start":30.48,"end":32.04,"text":"But other roads are different."},{"start":32.86,"end":37.58,"text":"Large vehicles like buses and trucks can't travel on\nthem easily."},{"start":38.9,"end":40.98,"text":"Some streets are old and narrow."},{"start":41.66,"end":44.06,"text":"People need to use small vehicles."},{"start":46.54,"end":47.96,"text":"Tuk -tuks are popular."},{"start":49.18,"end":53.48,"text":"Many people also push hand carts called mikiko -teni."},{"start":54.48,"end":57.06,"text":"These two vehicles are cheap."},{"start":58.9,"end":62,"text":"The vehicles can move easily on the narrow streets."},{"start":62.72,"end":69.82,"text":"People can use their tuk -tuks and mikiko -teni for\nwork, so they're a way to make money."},{"start":71.4,"end":73,"text":"But they bring problems,"},{"start":73.5,"end":73.6,"text":"too."},{"start":74.16,"end":76.22,"text":"Mikiko -teni are very heavy."},{"start":76.84,"end":79.76,"text":"People pushing them often get health problems."},{"start":79.76,"end":83.18,"text":"They also make the cities'"},{"start":83.72,"end":84.56,"text":"traffic slower."},{"start":86.48,"end":88.22,"text":"Tuk -tuks have different problems."},{"start":88.6,"end":90.08,"text":"They are very noisy."},{"start":90.4,"end":92.06,"text":"They make the air dirty."},{"start":93.28,"end":96.82,"text":"Air pollution is a big problem in Kenya's cities."},{"start":101.78,"end":105.18,"text":"Kenneth Gwantai is trying to solve these problems."},{"start":106.16,"end":109.24000000000001,"text":"First, he made an electric hand cart."},{"start":114.56,"end":119.78,"text":"It can go seven kilometers per hour, and it's easy to\npush."},{"start":121.54,"end":124.28,"text":"It is safe for the person pushing it."},{"start":126.22,"end":129.02,"text":"Next, Kenneth made an electric tuk -tuk."},{"start":130.14,"end":131.94,"text":"It is quiet and clean."},{"start":131.94,"end":134.46,"text":"It can carry six people."},{"start":135.76,"end":138.74,"text":"Both the hand cart and the tuk -tuk have batteries."},{"start":139.16,"end":140.78,"text":"They don't need any fuel."},{"start":141.9,"end":144.72,"text":"The batteries recharge when the vehicles move."},{"start":145.46,"end":149.22,"text":"This means the energy they use is free and clean."},{"start":149.84,"end":152.48,"text":"The vehicles don't make any air pollution."},{"start":153.8,"end":157.18,"text":"Kenneth hopes Kenya's city streets will soon be\ncleaner,"},{"start":157.76,"end":158.04,"text":"quieter,"},{"start":158.5,"end":160.04,"text":"and safer for everyone."},{"start":187.24,"end":188.64,"text":"Thank you for watching."}],"launchInline":true}},{"id":"B01-RW-U08-classroom:material:RW-M03","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e1b60bd33b11375ee74e7d2ee410800b13d6f146a33b55b30088eeabb4c54e3e.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"We are a group of Engineering students from Australia. This summer, we are studying at Bangkok University of Science and Technology. We would like to find out:\n1 how people in Bangkok travel.\n2 how people feel about transport in Bangkok.\nPlease answer the questions below. should create more metro lines.\nThen more people could use the metro,\nand there would not be so much traffic\non the roads.\n¹ survey (n) a set of questions people are asked to get information\n² on foot (prep phr) if you go somewhere on foot, you walk there.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2350","b2351"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a2803c6aa2ea33b78541020fc5d8630c653cd3c807e9c9474d2d558b0b1be78.mp3","continueOnPage":true}},{"id":"B01-RW-U08-classroom:material:RW-M04","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c25c6c5e0a209b4f1ec0debc38ad52efa9eafb0828b811f56041624dd8625af1.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.","sourcePage":178},{"body":"2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.","sourcePage":178},{"body":"3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity","sourcePage":178},{"body":"¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","sourcePage":178}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U08-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Transport in Bangkok: Report","pages":[{"page":178,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c25c6c5e0a209b4f1ec0debc38ad52efa9eafb0828b811f56041624dd8625af1.png","width":772,"height":1040}],"source":178,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.","sourcePage":178},{"body":"2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.","sourcePage":178},{"body":"3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity","sourcePage":178},{"body":"¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","sourcePage":178}],"text":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.\n2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.\n3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity\n¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc089d6bf38279efa4165e94bd6d78ada560954ef578df1ae1437f03e0288fe6.mp3"},"original":{"id":"B01-RW-U08-material:RW-M04","entry":"material:RW-M04","unitId":"B01-RW-U08","book":1,"track":"RW","unit":8,"title":"Transport in Bangkok: Report","kind":"material","pages":[178],"sourceImages":[{"page":178,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c25c6c5e0a209b4f1ec0debc38ad52efa9eafb0828b811f56041624dd8625af1.png","viewEvidenceReported":true}],"text":"Student Name: Lamal Tongduan\n\nStudent ID: 100035478 / Bangkok University of Science and Technology\n\nCourse: Transport and the City\n\n# Transport in Bangkok: Report\n\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.\n\n2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.\n\n3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\n\nFigure 1: eed more public transport. ✓    ","sourcePage":173,"blocks":[{"kind":"table","rows":[[{"text":"statements","header":false},{"text":"strongly agree","header":false},{"text":"agree","header":false},{"text":"neither agree nor disagree","header":false},{"text":"disagree","header":false},{"text":"strongly disagree","header":false}],[{"text":"We need more public transport.","header":false},{"text":"✓","header":false},{"text":"","header":false},{"text":"","header":false},{"text":"","header":false},{"text":"","header":false}]]}]},{"body":"C2 Write any comments or suggestions that you have about transport in Bangkok.\nWe should create more metro lines.\nThen more people could use the metro,\nand there would not be so much traffic\non the roads.","sourcePage":173,"blocks":[{"kind":"text","text":"C2 Write any comments or suggestions that you have about transport in Bangkok."},{"kind":"text","text":"We should create more metro lines."},{"kind":"text","text":"Then more people could use the metro,"},{"kind":"text","text":"and there would not be so much traffic"},{"kind":"text","text":"on the roads."}]},{"body":"¹ survey (n) a set of questions people are asked to get information\n² on foot (prep phr) if you go somewhere on foot, you walk there.","sourcePage":173,"blocks":[{"kind":"text","text":"¹ survey (n) a set of questions people are asked to get information"},{"kind":"text","text":"² on foot (prep phr) if you go somewhere on foot, you walk there."}]}],"B01-RW-U08-classroom:material:RW-M04":[{"body":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report","sourcePage":178,"blocks":[{"kind":"text","text":"Student Name: Lamal Tongduan"},{"kind":"text","text":"Student ID: 100035478 / Bangkok University of Science and Technology"},{"kind":"text","text":"Course: Transport and the City"},{"kind":"text","text":"# Transport in Bangkok: Report"}]},{"body":"This report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.","sourcePage":178,"blocks":[{"kind":"text","text":"This report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school."}]},{"body":"2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok","sourcePage":178,"blocks":[{"kind":"text","text":"2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok"}]},{"body":"take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are","sourcePage":178,"blocks":[{"kind":"text","text":"take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are"}]},{"body":"too far away to walk or cycle to so these are the least popular ways to get to work.","sourcePage":178,"blocks":[{"kind":"text","text":"too far away to walk or cycle to so these are the least popular ways to get to work."}]},{"body":"3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic","sourcePage":178,"blocks":[{"kind":"text","text":"3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic"}]},{"body":"jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity","sourcePage":178,"blocks":[{"kind":"text","text":"jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport."},{"kind":"text","text":"Figure 1: Means of transport in Bangkok by popularity"}]},{"body":"¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","sourcePage":178,"blocks":[{"kind":"text","text":"¹percentage (n) how many out of 100"},{"kind":"text","text":"²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads"}]}],"B02-RW-U05-classroom:material:RW-M03":[{"body":"[IMAGE_1]\n1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world.","sourcePage":108,"blocks":[{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"1 Every country has a national sport and most popular sports are now played across the world. Most people have heard of sports like football, basketball, baseball and cricket. However, in most countries, people also play unusual sports with strange and interesting rules. Here are our top five unusual sports from around the world."}]},{"body":"2\nPeople go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health.","sourcePage":108,"blocks":[{"kind":"text","text":"2"},{"kind":"text","text":"People go swimming in the Atlantic Ocean in the winter. They go swimming at the beach on Coney Island in New York City every Sunday from October to April and also on New Year's Day. The water temperature can drop to as low as 0 °C. Sometimes there is snow and cold wind, too. People believe that swimming in the cold water is good for their health."}]},{"body":"The club started in 1903.\n3","sourcePage":108,"blocks":[{"kind":"text","text":"The club started in 1903."},{"kind":"text","text":"3"}]},{"body":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia.\n4","sourcePage":108,"blocks":[{"kind":"text","text":"Every year in Singapore, thousands of people come to watch the dragon boat race. A dragon boat is a traditional Chinese boat with a painted dragon's head on one end. There are 22 people in each boat, and they race in the water. Dragon boat racing is also popular in China, Malaysia and Indonesia."},{"kind":"text","text":"4"}]},{"body":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree.\n5","sourcePage":108,"blocks":[{"kind":"text","text":"In this sport, people compete by throwing a large piece of wood called a 'caber' as far as they can. The caber toss is an ancient Scottish sport. The caber has no official size or shape, but it is usually the size of a small tree."},{"kind":"text","text":"5"}]},{"body":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet.\n6","sourcePage":108,"blocks":[{"kind":"text","text":"Students in Indonesia play this game to welcome the month of Ramadan. It is similar to football. The ball is made from coconut shells. Before starting the game, players pour salt on themselves and then set the ball on fire. The ball is on fire throughout the game and the players play with their bare $^{1}$ feet."},{"kind":"text","text":"6"}]},{"body":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight.\n[IMAGE_2]","sourcePage":108,"blocks":[{"kind":"text","text":"In England, toe wrestling $^{2}$ started in the 1970s. The world toe wrestling competition takes place every year in Wetton, Derbyshire. In the sport, two people fight with their bare feet, each player trying to push the other player's foot flat on the floor. Players must keep both hands on the floor during the fight."},{"kind":"text","text":"[IMAGE_2]"}]},{"body":"$^{1}$bare (adj) without shoes\n$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground","sourcePage":108,"blocks":[{"kind":"text","text":"$^{1}$bare (adj) without shoes"},{"kind":"text","text":"$^{2}$wrestling (n) a sport in which two people fight and try to push each other to the ground"}]}],"B02-RW-U05-classroom:material:RW-M04":[{"body":"To: Steve\nFrom: 12th October 2023\nSubject: Tough Guy competition course\nHi,\nI've just got this message from the Tough Guy competition. See the diagram of the course.","sourcePage":111,"blocks":[{"kind":"text","text":"To: Steve"},{"kind":"text","text":"From: 12th October 2023"},{"kind":"text","text":"Subject: Tough Guy competition course"},{"kind":"text","text":"Hi,"},{"kind":"text","text":"I've just got this message from the Tough Guy competition. See the diagram of the course."}]},{"body":"It looks challenging!\nI'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week.\nBest,\nPeter\n---- Forwarded message ----","sourcePage":111,"blocks":[{"kind":"text","text":"It looks challenging!"},{"kind":"text","text":"I'm not sure I'm fit enough and I'm a bit worried about accidents. Do you think we have to climb anything? Let's talk next week."},{"kind":"text","text":"Best,"},{"kind":"text","text":"Peter"},{"kind":"text","text":"---- Forwarded message ----"}]},{"body":"From: Tough Guy Competition\nDate: 8th October\nSubject: the course of the next Tough Guy competition\n## Dear Participant,","sourcePage":111,"blocks":[{"kind":"text","text":"From: Tough Guy Competition"},{"kind":"text","text":"Date: 8th October"},{"kind":"text","text":"Subject: the course of the next Tough Guy competition"},{"kind":"text","text":"## Dear Participant,"}]},{"body":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description.\nWe look forward to seeing you there in January.\nKind regards,\nThe Organizers","sourcePage":111,"blocks":[{"kind":"text","text":"We're happy to tell you that the course of the next Tough Guy competition is ready. Below is a diagram of the course and a short description."},{"kind":"text","text":"We look forward to seeing you there in January."},{"kind":"text","text":"Kind regards,"},{"kind":"text","text":"The Organizers"}]},{"body":"[IMAGE_1]","sourcePage":111,"blocks":[{"kind":"text","text":"[IMAGE_1]"}]},{"body":"# TOUGH GUY:\nrace to the limit\n[IMAGE_1]\n## 1 What is Tough Guy?","sourcePage":112,"blocks":[{"kind":"text","text":"# TOUGH GUY:"},{"kind":"text","text":"race to the limit"},{"kind":"text","text":"[IMAGE_1]"},{"kind":"text","text":"## 1 What is Tough Guy?"}]},{"body":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition","sourcePage":112,"blocks":[{"kind":"text","text":"Every January, more than 3,000 people take part in one of the most difficult races on Earth: the Tough Guy competition in the UK. Participants run, swim and climb across the 15-kilometre course. But this is no normal race. These runners have to crawl through tunnels, run across a field of nettles and jump over fire. What's more, the competition"}]},{"body":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China.\n## 2 Why do people take part?","sourcePage":112,"blocks":[{"kind":"text","text":"takes place in January, so temperatures are freezing – sometimes as low as -6 °C. People travel from all over the world to take part, with participants from the US, Australia and China."},{"kind":"text","text":"## 2 Why do people take part?"}]},{"body":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the","sourcePage":112,"blocks":[{"kind":"text","text":"The competition is very dangerous and every year there are accidents. Injuries like broken bones and cuts are common. The race is very hard: one-third of participants do not finish it. Runners have to be fit and healthy. Most people train all year to prepare for the event. It is also the first race like it in the world. Many people take part in the"}]},{"body":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year.\n[IMAGE_2]\n[IMAGE_3]","sourcePage":112,"blocks":[{"kind":"text","text":"competition because it is so famous. Every year, the organizers change the event and add new things. This means that the competition stays exciting and challenging, so people go back year after year."},{"kind":"text","text":"[IMAGE_2]"},{"kind":"text","text":"[IMAGE_3]"}]},{"body":"To run across a field of nettles can hurt a lot.\n## 3 The course","sourcePage":112,"blocks":[{"kind":"text","text":"To run across a field of nettles can hurt a lot."},{"kind":"text","text":"## 3 The course"}]},{"body":"The diagram shows an example of the Tough Guy course.  clean electricity.","许多工作的人用清洁的电。"],[56.16,58,"Architects, for example,","建筑师，例如，"],[58.48,61.68,"design houses with solar panels on the roof.","设计房屋，屋顶有太阳能板。"],[63.86,66.4,"Engineers design those solar panels,","工程师设计这些太阳能电池板，"],[66.84,70.88,"and then factory workers make them.","然后工厂的工人制造它们。"],[71.52,74.62,"These workers are in a big factory in China.","这些工人在中国的一家大工厂里。"],[75.44,79.28,"They make thousands of solar panels every week.","他们每周制造上千个太阳能电池板。"],[81.4,83.1,"When the panels are ready,","当小组准备好时，"],[83.53999999999999,85.02,"truck drivers take them.","卡车司机带走他们。"],[86.26,89.37,"And they go to countries around the world.","他们去世界各国。"],[91.53999999999999,95.18,"Then electricians put the solar panels on the roof.","之后电工将太阳能板放在屋顶上。"],[97.3,100.64,"These days, clean power is really important.","这些天，干净的动力真的很重要。"],[102.74000000000001,104.53999999999999,"Everyone needs electricity,","每个人都需要电力，"],[104.9,107.62,"but we must look after our planet.","但我们必须照顾我们的星球。"],[109.75999999999999,112.9,"Farms, such as this one in South Africa,","农场，比如南非的农场，"],[113.36,115.18,"need a lot of electricity.","需要大量的电源。"],[116.62,119.97999999999999,"The farmer wants to help the environment.","农民希望帮助环境。"],[121.98,126.9,"And so, he gets the electricity for his farm from solar panels.","所以，他从太阳能电池板上得到他农场的电源。"],[129.02,131.6,"Today, in schools around the world,","今天，在世界各地的学校里，"],[131.98,134.32,"children learn about solar panels.","儿童了解太阳能电池板。"],[136.4,141.5,"If young people understand why the world really needs solar power,","如果年轻人明白为什么世界真的需要太阳能"],[142.92000000000002,147.18,"they can help build a cleaner future for their children.","他们可以帮助为孩子建立一个更清洁的未来。"]],"englishRows":2,"chineseRows":1},"B01-RW-U08":{"aspect":1.9085487,"cues":[[1,5.04,"Around the world, people are trying to solve their cities'","世界各地，人们都在努力解决他们的城市"],[5.4,6.98,"transportation problems.","交通问题。"],[8.32,11.14,"Kenneth Gwantai is an inventor from Kenya.","肯尼斯·关泰(Kenneth Gwantai)是一位来自肯尼亚的发明家。"],[12.02,16.74,"He's trying to solve two big transportation problems for Kenya's cities.","他试图为肯尼亚的城市解决两个大的交通问题。"],[17.86,20.54,"Some parts of Kenya's cities are modern.","肯尼亚的一些城市是现代化的。"],[21.44,24.42,"For example, here in Nairobi, the capital,","例如，在首都内罗毕，"],[24.78,26.16,"some roads are wide.","有些路很宽"],[27,29.16,"Buses can go on them.","公共汽车可以去他们身上。"],[30.48,32.04,"But other roads are different.","但其他道路则不同。"],[32.86,37.58,"Large vehicles like buses and trucks can't travel on them easily.","巴士和卡车等大型车辆不能轻易搭乘。"],[38.9,40.98,"Some streets are old and narrow.","一些街道既老又狭窄。"],[41.66,44.06,"People need to use small vehicles.","人们需要使用小型车辆。"],[46.54,47.96,"Tuk -tuks are popular.","图克 - 图克很受欢迎。"],[49.18,53.48,"Many people also push hand carts called mikiko -teni.","许多人还推手推车，称为Mikiko -teni。"],[54.48,57.06,"These two vehicles are cheap.","这两辆车很便宜。"],[58.9,62,"The vehicles can move easily on the narrow streets.","车辆可以轻而易举地在狭窄的街道上行驶。"],[62.72,69.82,"People can use their tuk -tuks and mikiko -teni for work, so they're a way to make money.","人们可以用他们的tuk -tuks和mikiko -teni工作，所以他们是一种赚钱的方法。"],[71.4,73,"But they bring problems,","但他们带来了问题，"],[73.5,73.6,"too.","我也一样。"],[74.16,76.22,"Mikiko -teni are very heavy.","美纪子 - teni非常重。"],[76.84,79.76,"People pushing them often get health problems.","推他们的人常常会遇到健康问题。"],[79.76,83.18,"They also make the cities'","城市也是他们创造的"],[83.72,84.56,"traffic slower.","交通减慢。"],[86.48,88.22,"Tuk -tuks have different problems.","Tuk -tuks有不同的问题。"],[88.6,90.08,"They are very noisy.","他们非常吵。"],[90.4,92.06,"They make the air dirty.","他们把空气弄脏了"],[93.28,96.82,"Air pollution is a big problem in Kenya's cities.","空气污染是肯尼亚城市的一个大问题。"],[101.78,105.18,"Kenneth Gwantai is trying to solve these problems.","肯尼斯·关泰正试图解决这些问题。"],[106.16,109.24000000000001,"First, he made an electric hand cart.","首先，他制造了一台电动手推车。"],[114.56,119.78,"It can go seven kilometers per hour, and it's easy to push.","时速可达7公里，推力方便。"],[121.54,124.28,"It is safe for the person pushing it.","它对推动它的人来说是安全的。"],[126.22,129.02,"Next, Kenneth made an electric tuk -tuk.","接下来 Kenneth做了个电动图克图克"],[130.14,131.94,"It is quiet and clean.","这是安静和干净。"],[131.94,134.46,"It can carry six people.","能载六人。"],[135.76,138.74,"Both the hand cart and the tuk -tuk have batteries.","手推车和Tuk -tuk都有电池。"],[139.16,140.78,"They don't need any fuel.","他们不需要任何燃料。"],[141.9,144.72,"The batteries recharge when the vehicles move.","车辆动时充电。"],[145.46,149.22,"This means the energy they use is free and clean.","这意味着他们使用的能量是自由而干净的。"],[149.84,152.48,"The vehicles don't make any air pollution.","车辆不会造成任何空气污染。"],[153.8,157.18,"Kenneth hopes Kenya's city streets will soon be cleaner,","Kenneth希望肯尼亚的城市街道很快会更干净，"],[157.76,158.04,"quieter,","安静点"],[158.5,160.04,"and safer for everyone.","而且对每个人都更安全。"],[187.24,188.64,"Thank you for watching.","谢谢你的观看。"]],"englishRows":2,"chineseRows":1},"B02-LS-U01":{"aspect":1.9085487,"cues":[[4.16,6.54,"This is Venice, Italy.","这里是意大利威尼斯。"],[7.08,10.4,"It is full of fantastic palaces and of course,","这里有许多壮观的宫殿，当然，"],[10.9,11.96,"a lot of canals.","还有许多运河。"],[14.08,19.42,"There are 117 little islands between the canals and 400 bridges.","运河之间分布着117座小岛和400座桥梁。"],[21.1,21.84,"Historically,","从历史上看，"],[22.26,25.0,"Venice is an important city for art and business.","威尼斯一直是重要的艺术和商业城市。"],[25.0,29.4,"But these days, most people know it as a popular tourist center.","不过如今，大多数人知道它是热门的旅游中心。"],[33.24,36.06,"The Grand Canal is the largest canal in Venice.","大运河是威尼斯最大的运河。"],[36.74,38.6,"It's more than two miles long.","它长两英里多。"],[39.52,43.3,"It's Venice's busiest road, but you won't see cars here.","它是威尼斯最繁忙的道路，但这里看不到汽车。"],[43.72,44.22,"Instead,","相反，"],[44.56,46.86,"you'll see a kind of boat called the gondola.","你会看到一种名为贡多拉的小船。"],[49.74,55.46,"At one time, there was probably a river here, but the Grand Canal is man -made.","这里曾经可能有一条河流，但大运河是人工开凿的。"],[56.68,59.4,"The palaces and other buildings are on stilts,","宫殿和其他建筑建在桩柱上，"],[59.8,60.68,"long legs,","也就是长长的支柱，"],[61.18,63.58,"that go deep into the ground under the canal.","它们深深插入运河下方的土地中。"],[66.4,69.02,"A gondola ride takes about half an hour.","乘坐贡多拉大约需要半小时。"],[69.66,73.22,"It's one of the best 30 minutes you can spend in your life.","这是你一生中最值得花费的30分钟之一。"],[79.4,81.44,"Here is the Cadorro,","这里是卡多罗宫，"],[81.84,84.4,"one of Venice's most beautiful palaces.","它是威尼斯最美丽的宫殿之一。"],[86.5,90.5,"It was built in the 15th century and was then decorated with gold.","它建于15世纪，后来又用黄金装饰。"],[97.76,99.44,"And this is the Rialto Bridge,","这就是里亚托桥，"],[100.02,102.26,"the oldest bridge across the Grand Canal.","它是横跨大运河最古老的桥。"],[102.26,109.28,"It's made of stone, and for nearly 300 years, it was the only way to cross the Grand Canal on foot.","它由石头建成，近300年来一直是步行穿越大运河的唯一途径。"],[110.68,117.98,"No wonder two of Venice's nicknames are the City of Bridges and the Bride of the Sea.","难怪威尼斯有“桥梁之城”和“亚得里亚海的新娘”这两个别名。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-LS-U01-classroom-clean-20261122.mp4"},"B02-RW-U01":{"aspect":1.9085487,"cues":[[0.0,2.26,"Welcome to Jakarta,","欢迎来到雅加达。"],[2.82,8.1,"the capital of Indonesia and Southeast Asia's largest megacity.","雅加达是印度尼西亚的首都，也是东南亚最大的巨型城市。"],[9.34,15.9,"Jakarta is becoming more popular as a destination for tourists and business people every year.","雅加达每年都越来越受游客和商务人士欢迎。"],[16.6,19.84,"Jakarta is home to over nine million people.","雅加达有900多万居民。"],[20.48,23.58,"That number grows to 11 million by day,","白天，这个数字会增长到1100万，"],[24.06,29.5,"as two million people travel from nearby towns and villages to work here.","因为有200万人从附近的城镇和村庄来到这里工作。"],[31.08,34.64,"With its tall buildings and busy motorways,","这里有高楼大厦和繁忙的高速公路，"],[35.18,42.16,"it's hard to believe that the great city of Jakarta grew from one small harbor and a few villages.","很难相信，大都市雅加达是由一个小港口和几个村庄发展而来的。"],[43.36,43.7,"However,","然而，"],[44.38,50.32,"a visit to the old town of Batavia reveals the secrets of Jakarta's history.","游览巴达维亚老城，能揭开雅加达历史的秘密。"],[52.5,55.66,"Batavia was the center of old Jakarta.","巴达维亚曾是旧雅加达的中心。"],[55.66,59.92,"Its European -style buildings were built by the Dutch,","这里的欧式建筑由荷兰人建造，"],[60.32,64.84,"who came here to buy and sell goods in the 16th century.","他们在16世纪来到这里买卖商品。"],[65.92,72.08,"Sunda Kalapahaba is where ships from Europe, China and India were filled with tea,","巽他格拉巴港是来自欧洲、中国和印度的船只装载茶叶的地方，"],[72.58,72.88,"coffee,","咖啡，"],[73.4,73.9,"spices,","香料，"],[74.32,77.3,"silk and so on to sell to the world.","丝绸等货物，再把它们销往世界各地。"],[78.16,81.72,"Here you can see Indonesian wooden sailing ships,","在这里，你可以看到印度尼西亚的木制帆船，"],[82.12,83.6,"still used today.","它们至今仍在使用。"],[84.46,87.64,"This is the harbor master's tower.","这是港务长塔。"],[88.42,93.18,"Here the Dutch watched their ships entering and leaving the harbor.","荷兰人在这里观察船只进出港口。"],[99.52,102.1,"If you're looking for a more modern attraction,","如果你在寻找更现代的景点，"],[102.74,104.74,"Monas is the national monument.","国家纪念碑就是莫纳斯塔。"],[105.58,111.68,"It stands 132 meters tall and at the top there is a golden flame.","它高132米，塔顶有一团金色火焰。"],[112.68,116.18,"Below the tower you'll find the National Museum,","在塔下，你会看到国家博物馆，"],[116.68,118.9,"where you can learn about one .five","在那里，你可以了解150万年的"],[118.9,122.1,"million years of Indonesian history.","印度尼西亚历史。"],[123.58,126.52,"Jakarta is also famous for its street food.","雅加达也以街头美食闻名。"],[127.34,129.8,"You can find delicious fresh food,","你可以找到美味的新鲜食物，"],[130.12,131.3,"such as soto,","例如索托汤，"],[131.76,133.48,"a soup of meat and vegetables,","一种用肉和蔬菜煮成的汤，"],[134.12,135.34,"and nasi goreng,","还有印尼炒饭，"],[135.96,137.54,"a fried rice dish.","一种炒饭。"],[138.52,140.54,"If you plan a trip in December,","如果你计划在12月旅行，"],[141.06,144.3,"don't miss the fireworks display at Lagoon Beach,","不要错过拉贡海滩的烟花表演，"],[145.04,149.52,"the perfect way to celebrate the new year at a new destination.","这是在新的目的地庆祝新年的绝佳方式。"]],"englishRows":2,"chineseRows":1,"src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/B02-RW-U01-classroom-clean-20261122.mp4"},"B02-RW-U05":{"aspect":1.9085487,"cues":[[1.18,5.58,"This is the Blaukrins Bridge in South Africa.","这是南非的布拉克林斯大桥。"],[10.96,16,"At 216 metres high, it is one of the highest bungee jumps in the world.","在216米高的地方，它是世界上最高的蹦极跳跃之一。"],[16.38,23.48,"More Keat made history here by becoming the world's oldest bungee jumper at the age of 96.","更多的济慈通过在96岁时成为世界上最古老的蹦极跳跃者，在这里创造了历史。"],[24.32,27.64,"Bungee jumping looks dangerous, and it can be.","Bungee的跳跃看起来很危险，而且有可能。"],[28.24,30.74,"Although ropes don't often break,","虽然绳子不经常断"],[31.12,32.86,"jumpers are sometimes injured.","跳伞者有时会受伤。"],[34,35.38,"After the jumper falls,","跳伞后，"],[35.96,39.6,"the bungee rope suddenly pulls their body back and up.","包龙星: 绳子突然拉他们的身体背和上。"],[40.4,42.1,"This can damage the eyes,","这会伤到眼睛的"],[42.54,43.48,"the back of the neck,","颈后，"],[43.84,45.5,"and can even kill you.","甚至可以杀了你。"],[46.1,47.6,"For a man of Moore's age,","对于摩尔这个年纪的人来说，"],[48.04,51.42,"the chances of being injured must certainly increase.","当然，受伤的可能性必须增加。"],[52.1,55.16,"But this wasn't Moore's first bungee jump.","但这不是摩尔的首次蹦床跳伞。"],[56.02,58.12,"In fact, he had done it twice before.","事实上，他以前做过两次。"],[58.42,61.1,"His first jump was when he was 88.","他的第一个跳跃是在他88岁的时候。"],[61.6,64.46,"Then he did it again at 93.","然后他又在93岁时做了一次。"],[72.98,75.2,"So didn't Moore get scared?","所以摩尔没有害怕吗？"],[78.36,80.3,"Yes, of course I'm scared.","是的，我当然害怕。"],[81.82,82.8,"But you don't mind?","但你不介意吗？"],[83.96000000000001,84.62,"About the fear?","关于恐惧？"],[85.06,86.3,"No, I like it.","不，我喜欢。"],[91.9,94.1,"five, four, three, two,","五，四，三，两，"],[94.5,95.24000000000001,"one, bungee!","一号，BUGE!"],[98.46000000000001,102.2,"Moore did not know he was going to break a world record when he jumped.","摩尔跳楼时并不知道自己会打破世界纪录。"],[102.74000000000001,106.84,"He said he did it for the challenge and the experience.","他说他这样做是为了挑战和经验。"],[108.68,111.68,"It's very frightening, very exciting, very thrilling.","它非常可怕，非常刺激，非常刺激。"],[112.7,114.03999999999999,"And when you jump, of course,","当你跳的时候，当然，"],[114.75999999999999,116.7,"it's the roar,","这是咆哮，"],[117.1,118.46000000000001,"the wind in your ears,","风在你的耳朵，"],[118.84,120.46,"it's deafening.","耳聋了"],[121.16,124.48,"The wind was blowing pretty hard, gusting,","风吹得相当猛烈，令人喘不过气来"],[125.26,126.58,"and you jerk,","你个混蛋"],[127.42,133.22,"and the rope, the cable would shake like that, and it really shook you up.","绳子，缆绳会摇动这样，它真的震撼你。"],[133.22,136.9,"Hanging there and shaking you, and he's shaking you.","吊在那里，摇动你，他摇动你。"],[137.26,139.22,"That was a different experience.","这是不同的经历。"],[140.46,141.56,"After his jump,","他跳楼后，"],[142.12,147.04,"doctors checked the 96 -year -old and found him in perfect health.","医生检查了这名96岁的老人，发现他身体健康。"],[148.7,150.84,"What about when you're so scared and you're on the edge?","当你害怕，你陷入边缘时呢？"],[150.92000000000002,151.82,"What do you think about?","你觉得怎么样？"],[152.54,153.52,"No, you don't think.","不，你不认为。"],[156.06,159.98,"You just do it.","你只要做到这一点。"]],"englishRows":2,"chineseRows":1}},{"volumes":{"B01-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/10500fadaa1e42ff16d4c54ec41745502581ecbd20a8f0e2afc77e0b193143f4.pdf","size":32090402},"B01-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/43bc79d96c1ab4c1c65fd30680983178026a8a97dcc42e2a052e66e91158d0e8.pdf","size":28669491},"B02-LS":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/f0ab39653b4d7ed02a73d7f08b47e7008ee8457695c3d03d5b4f20dbdc071a82.pdf","size":25558428},"B02-RW":{"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/072188ffaff02b766c83c29202829697e0ef67da51d3a47809b0eacd1defb68c.pdf","size":25783243}},"pages":{"B01-LS/14":{"pdf":12},"B01-LS function outside(el,bounds){

function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}

 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){
  const all={};
  for(let i=0;i<primary.length;i++)all[cases[i].id]=await inspectCase(i);
  results=all;summaries();await display(0);return all;
 },
 async runReuse(){
  const checked={};
  for(const c of V.reuseFixtures??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  comparisonResults=checked;updateReview();return checked;
 },
 async runLessonFlow(){
  const checked={};
  for(const c of V.lessonFlow?.entries??[])checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults=checked;updateReview();return checked;
 },
 async runOpenings(){
  const checked={};
  for(const c of classroom.openings)checked[c.id]=await inspectCase(classroom.indexById.get(c.id));
  lessonResults={...lessonResults,...checked};updateReview();return checked;
 },
 async check(id){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");return inspectCase(i);},
 async show(id,page=0){const i=cases.findIndex(c=>c.id===id);if(i<0)throw new Error("Unknown task");await display(i,page);},
 getResults(){return results;}
};

for(const book of new Set([...classroom.openings,...classroom.glossaries].map(c=>c.book)))openingBook.add(new Option("Book "+book,String(book)));
sequenceView.querySelector('[value="openings"]').hidden=!classroom.openings.length;
sequenceView.querySelector('[value="glossaries"]').hidden=!classroom.glossaries.length;
const startView=new URLSearchParams(location.search).get("view");
if(classroom.openings.length&&startView==="openings")sequenceView.value="openings";
if(classroom.glossaries.length&&startView==="glossaries")sequenceView.value="glossaries";
const selectedLesson=new URLSearchParams(location.search).get("lesson");
if(/^[12]$/.test(selectedLesson??""))document.getElementById("lesson-filter").value=primary[0].track+selectedLesson;
updateSequenceHeading();
summaries();display(navigationOrder()[0]??0);
