arrow streets."},{"start":62.72,"end":69.82,"text":"People can use their tuk -tuks and mikiko -teni for\nwork, so they're a way to make money."},{"start":71.4,"end":73,"text":"But they bring problems,"},{"start":73.5,"end":73.6,"text":"too."},{"start":74.16,"end":76.22,"text":"Mikiko -teni are very heavy."},{"start":76.84,"end":79.76,"text":"People pushing them often get health problems."},{"start":79.76,"end":83.18,"text":"They also make the cities'"},{"start":83.72,"end":84.56,"text":"traffic slower."},{"start":86.48,"end":88.22,"text":"Tuk -tuks have different problems."},{"start":88.6,"end":90.08,"text":"They are very noisy."},{"start":90.4,"end":92.06,"text":"They make the air dirty."},{"start":93.28,"end":96.82,"text":"Air pollution is a big problem in Kenya's cities."},{"start":101.78,"end":105.18,"text":"Kenneth Gwantai is trying to solve these problems."},{"start":106.16,"end":109.24000000000001,"text":"First, he made an electric hand cart."},{"start":114.56,"end":119.78,"text":"It can go seven kilometers per hour, and it's easy to\npush."},{"start":121.54,"end":124.28,"text":"It is safe for the person pushing it."},{"start":126.22,"end":129.02,"text":"Next, Kenneth made an electric tuk -tuk."},{"start":130.14,"end":131.94,"text":"It is quiet and clean."},{"start":131.94,"end":134.46,"text":"It can carry six people."},{"start":135.76,"end":138.74,"text":"Both the hand cart and the tuk -tuk have batteries."},{"start":139.16,"end":140.78,"text":"They don't need any fuel."},{"start":141.9,"end":144.72,"text":"The batteries recharge when the vehicles move."},{"start":145.46,"end":149.22,"text":"This means the energy they use is free and clean."},{"start":149.84,"end":152.48,"text":"The vehicles don't make any air pollution."},{"start":153.8,"end":157.18,"text":"Kenneth hopes Kenya's city streets will soon be\ncleaner,"},{"start":157.76,"end":158.04,"text":"quieter,"},{"start":158.5,"end":160.04,"text":"and safer for everyone."},{"start":187.24,"end":188.64,"tex 61efad012b68d2b7a58390f4502a2ce72ddbf8cdbc31964d6e87b435.png"}],"kind":"task_sheet","sourceBlockIds":["b2348"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1  Traffic is different. The other pictures are of types of\ntransport, but traffic includes all the vehicles that use\nthe roads. Another possible answer: on foot. This is the\nonly way of travelling that doesn’t use a vehicle.\n2  The greenest type of transport is on foot. Trains and\nthe metro can also be good for the environment. Cars\nand motorbikes are not as good. Cars can be all right if\nthey are electric.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac9b7365399a799987c3684122d11a9e75a0697bbb1aa748c59f94240e14454e.pdf","pdfPage":62,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B01-RW-U08-question:b2354","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"order":11,"module":"READING 1","ex":"4","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"instruction":"Skim read the first paragraph and sections A, B and C. Then answer the questions.","pages":[174],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/0e5f8312dabd4eb9f5a8735f12d1b32afa36d4364db58340af65f94fc14afac5.png"],"provided":"","items":[{"id":"b2354.i01","label":"1","prompt":"What is the topic of the survey?","options":[],"type":"qa/open"},{"id":"b2354.i02","label":"2","prompt":"Which section wants to know what people think?","options":[],"type":"qa/open"},{"id":"b2354.i03","label":"3","prompt":"Which section wants people's personal information?","options":[],"type":"qa/open"},{"id":"b2354.i04","label":"4","prompt":"Which section wants to know what transport people use?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b2354.i01","label":"1","prompt":"What is the topic of the survey?","options":[],"type":"qa/open"},{"kind":"item","id":"b2354.i02","label":"2","prompt":"Which section wants to know what people think?","options":[],"type":"qa/open"},{"kind":"item","id":"b2354.i03","label":"3","prompt":"Which section wants people's personal information?","options":[],"type":"qa/open"},{"kind":"item","id":"b2354.i04","label":"4","prompt":"Which section wants to know what transport people use?","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B01-RW-U08-classroom:material:RW-M03","title":"READING 1","text":"We are a group of Engineering students from Australia. This summer, we are studying at Bangkok University of Science and Technology. We would like to find out:\n1 how people in Bangkok travel.\n2 how people feel about transport in Bangkok.\nPlease answer the questions below. The survey¹ takes about five minutes.\nick (✓) the correct boxes to answer the questions.\n. About you\nA1 Age: How old are you?\n□14-17 □18-21 □22-31\n✓ 32–53 □ older than 53\nA2 Gender: I am: □ male ☑ female\nA3 Occupation: What do you do?\n□ study ✓ work\n. Travel\nB1 How long is your journey to work or school?\n□ 5-15 minutes ☑ 15-45 minutes\n□ 45–60 minutes □ more than 1 hour\nB2 How do you get to work or school?\n□ on foot² □ bicycle □ car □ tuk-tuk\n□ motorbike □ water taxi □ taxi\n□ SkyTrain ✓ metro □ bus\nB3 How often do you use these kinds of transport?\nTable 1\n\u003ctable>\u003ctr>\u003ctd>kinds of transport\u003c/td>\u003ctd>always\u003c/td>\u003ctd>often\u003c/td>\u003ctd>sometimes\u003c/td>\u003ctd>not often\u003c/td>\u003ctd>never\u003c/td>\u003c/tr>\u003ctr>\u003ctd>on foot\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bicycle\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>car\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>motorbike\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>water taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bus\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SkyTrain\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>metro\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tuk-tuk\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\nB4 Which type or types of transport do you own?\nI own a: ☐ bicycle ☑ car ☐ motorbike\n□ other (Please write.): ____\n. Opinion\nC1 Read the statements in the table. Do you agree or disagree with them?\nTable 2\n\u003ctable>\u003ctr>\u003ctd>statements\u003c/td>\u003ctd>strongly agree\u003c/td>\u003ctd>agree\u003c/td>\u003ctd>neither agree nor disagree\u003c/td>\u003ctd>disagree\u003c/td>\u003ctd>strongly disagree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There is a lot of traffic in Bangkok.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The traffic makes me late.\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>We need more public transport.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td nutes\n□ 45–60 minutes □ more than 1 hour\nB2 How do you get to work or school?\n□ on foot² □ bicycle □ car □ tuk-tuk\n□ motorbike □ water taxi □ taxi\n□ SkyTrain ✓ metro □ bus\nB3 How often do you use these kinds of transport?\nTable 1\n\u003ctable>\u003ctr>\u003ctd>kinds of transport\u003c/td>\u003ctd>always\u003c/td>\u003ctd>often\u003c/td>\u003ctd>sometimes\u003c/td>\u003ctd>not often\u003c/td>\u003ctd>never\u003c/td>\u003c/tr>\u003ctr>\u003ctd>on foot\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bicycle\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>car\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>motorbike\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\u003ctr>\u003ctd>water taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>taxi\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bus\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SkyTrain\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>metro\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tuk-tuk\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\nB4 Which type or types of transport do you own?\nI own a: ☐ bicycle ☑ car ☐ motorbike\n□ other (Please write.): ____\n. Opinion\nC1 Read the statements in the table. Do you agree or disagree with them?\nTable 2\n\u003ctable>\u003ctr>\u003ctd>statements\u003c/td>\u003ctd>strongly agree\u003c/td>\u003ctd>agree\u003c/td>\u003ctd>neither agree nor disagree\u003c/td>\u003ctd>disagree\u003c/td>\u003ctd>strongly disagree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There is a lot of traffic in Bangkok.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The traffic makes me late.\u003c/td>\u003ctd>\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>We need more public transport.\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\nC2 Write any comments or suggestions that you have about transport in Bangkok.\nWe should create more metro lines.\nThen more people could use the metro,\nand there would not be so much traffic\non the roads.\n¹ survey (n) a set of questions people are asked to get information\n² on foot (prep phr) if you go somewhere on foot, you walk there.","screens":["We are a group of Engineering students from Australia. This summer, we are studying at Bangkok University of Science and Technology. We would like to find out:\n1 how people in Bangkok travel.\n2 how people feel about transport in Bangkok.\nPlease answer the questions below. The survey¹ takes about five minutes.\nick (✓) the correct boxes to answer the questions.\n. About you\nA1 Age: How old are you?\n□14-17 □18-21 □22-31\n✓ 32–53 □ older than 53\nA2 Gender: I am: □ male ☑ female\nA3 Occupation: What do you do?\n□ study ✓ work\n. Travel\nB1 How long is your journey to work or school?\n□ 5-15 minutes ☑ 15-45 minutes\n□ 45–60 minutes □ more than 1 hour\nB2 How do you get to work or school?\n□ on foot² □ bicycle □ car □ tuk-tuk\n□ motorbike □ water taxi □ taxi\n□ SkyTrain ✓ metro □ bus\nB3 How often do you use these kinds of transpo n":"somebody who designs or creates something that did not exist before","example":"The inventor built a machine to water the plants.","wordAudio":"inventor","cardWord":false},{"term":"vehicle","pos":"(n)","definition":"a machine, usually with wheels and an engine, used for transporting people or goods","example":"This vehicle can carry eight people.","wordAudio":"vehicle","cardWord":false},{"term":"narrow","pos":"(adj)","definition":"narrow things measure a small distance from one side to the other","example":"We walked down a narrow street.","wordAudio":"narrow","cardWord":false},{"term":"pollution","pos":"(n)","definition":"damage caused to water, air, etc. by harmful substances or waste","example":"The town is taking steps to reduce air pollution.","wordAudio":"pollution","cardWord":true},{"term":"battery","pos":"(n)","definition":"an object that provides electricity for things such as radios, toys, or cars","example":"The toy stopped working when the battery ran out.","wordAudio":"battery","cardWord":false},{"term":"recharge","pos":"(v)","definition":"to fill a battery with electricity so that it can work again","example":"I need to recharge the battery before we leave.","wordAudio":"recharge","cardWord":false}]]}},{"id":"B01-RW-U08-classroom:video","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"Watch and listen","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"pages":[171],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/46debf607b1d91075d35179b88c0af4b356ebf19e3db22e80bdda526e357aacc.png"],"layout":"list","instruction":"Watch the video.","flow":{"kind":"video","pages":[null]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"playback":{"type":"video","title":"Watch and listen","src":"https://github.com/chaoimhinalmansour/unlockanswers.github.io/releases/download/unlock-courseware-media-20261122/79ffadfa79a4e069999b6085-L1RW-U08.mp4","captions":[{"start":1,"end":5.04,"text":"Around the world, people are trying to solve their\ncities'"},{"start":5.4,"end":6.98,"text":"transportation problems."},{"start":8.32,"end":11.14,"text":"Kenneth Gwantai is an inventor from Kenya."},{"start":12.02,"end":16.74,"text":"He's trying to solve two big transportation problems\nfor Kenya's cities."},{"start":17.86,"end":20.54,"text":"Some parts of Kenya's cities are modern."},{"start":21.44,"end":24.42,"text":"For example, here in Nairobi, the capital,"},{"start":24.78,"end":26.16,"text":"some roads are wide."},{"start":27,"end":29.16,"text":"Buses can go on them."},{"start":30.48,"end":32.04,"text":"But other roads are different."},{"start":32.86,"end":37.58,"text":"Large vehicles like buses and trucks can't travel on\nthem easily."},{"start":38.9,"end":40.98,"text":"Some streets are old and narrow."},{"start":41.66,"end":44.06,"text":"People need to use small vehicles."},{"start":46.54,"end":47.96,"text":"Tuk -tuks are popular."},{"start":49.18,"end":53.48,"text":"Many people also push hand carts called mikiko -teni."},{"start":54.48,"end":57.06,"text":"These two vehicles are cheap."},{"start":58.9,"end":62,"text":"The vehicles can move easily on the narrow streets."},{"start":62.72,"end":69.82,"text":"People can use their tuk -tuks and mikiko -teni for\nwork, so they're a way to make money."},{"start":71.4,"end":73,"text":"But they bring problems,"},{"start":73.5,"end":73.6,"text":"too."},{"start":74.16,"end":76.22,"text":"Mikiko -teni are very heavy."},{"start":76.84,"end":79.76,"text":"People pushing them often get health problems."},{"start":79.76,"end":83.18,"text":"They also make the cities'"},{"start":83.72,"end":84.56,"text":"traffic slower."},{"start":86.48,"end":88.22,"text":"Tuk -tuks have different problems."},{"start":88.6,"end":90.08,"text":"They are very noisy."},{"start":90.4,"end":92.06,"text":"They make the air dirty."},{"start":93.28,"end":96.82,"text":"Air pollution is a big problem in Kenya's cities."},{"start":101.78,"end":105.18,"text":"Kenneth Gwantai is trying to solve these problems."},{"start":106.16,"end":109.24000000000001,"text":"First, he made an electric hand cart."},{"start":114.56,"end":119.78,"text":"It can go seven kilometers per hour, and it's easy to\npush."},{"start":121.54,"end":124.28,"text":"It is safe for the person pushing it."},{"start":126.22,"end":129.02,"text":"Next, Kenneth made an electric tuk -tuk."},{"start":130.14,"end":131.94,"text":"It is quiet and clean."},{"start":131.94,"end":134.46,"text":"It can carry six people."},{"start":135.76,"end":138.74,"text":"Both the hand cart and the tuk -tuk have batteries."},{"start":139.16,"end":140.78,"text":"They don't need any fuel."},{"start":141.9,"end":144.72,"text":"The batteries recharge when the vehicles move."},{"start":145.46,"end":149.22,"text":"This means the energy they use is free and clean."},{"start":149.84,"end":152.48,"text":"The vehicles don't make any air pollution."},{"start":153.8,"end":157.18,"text":"Kenneth hopes Kenya's city streets will soon be\ncleaner,"},{"start":157.76,"end":158.04,"text":"quieter,"},{"start":158.5,"end":160.04,"text":"and safer for everyone."},{"start":187.24,"end":188.64,"text":"Thank you for watching."}],"launchInline":true}},{"id":"B01-RW-U08-classroom:material:RW-M03","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"READING 1","context":{"moduleLabel":"READING 1","phaseTitle":"WHILE READING"},"pages":[173],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e1b60bd33b11375ee74e7d2ee410800b13d6f146a33b55b30088eeabb4c54e3e.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"We are a group of Engineering students from Australia. This summer, we are studying at Bangkok University of Science and Technology. We would like to find out:\n1 how people in Bangkok tr n\nC2 Write any comments or suggestions that you have about transport in Bangkok.\n\nWe should create more metro lines.\nThen more people could use the metro,\nand there would not be so much traffic\non the roads.\n¹ survey (n) a set of questions people are asked to get information\n² on foot (prep phr) if you go somewhere on foot, you walk there.","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2350","b2351"],"module":"RW-M03","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 1","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2a2803c6aa2ea33b78541020fc5d8630c653cd3c807e9c9474d2d558b0b1be78.mp3","continueOnPage":true}},{"id":"B01-RW-U08-classroom:material:RW-M04","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":2,"module":"READING 2","context":{"moduleLabel":"READING 2","phaseTitle":"WHILE READING"},"pages":[178],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c25c6c5e0a209b4f1ec0debc38ad52efa9eafb0828b811f56041624dd8625af1.png"],"layout":"list","instruction":"","flow":{"kind":"reading","pages":[{"body":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.","sourcePage":178},{"body":"2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.","sourcePage":178},{"body":"3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity","sourcePage":178},{"body":"¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","sourcePage":178}]},"provided":"","items":[],"references":[],"materials":[],"issues":[],"courseReading":{"id":"B01-RW-U08-classroom:material:RW-M04","key":"material:RW-M04","label":"READING 2","title":"Transport in Bangkok: Report","pages":[{"page":178,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c25c6c5e0a209b4f1ec0debc38ad52efa9eafb0828b811f56041624dd8625af1.png","width":772,"height":1040}],"source":178,"embeddedIn":null,"photo":null,"clearPages":[{"body":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.","sourcePage":178},{"body":"2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.","sourcePage":178},{"body":"3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity","sourcePage":178},{"body":"¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","sourcePage":178}],"text":"Student Name: Lamal Tongduan\nStudent ID: 100035478 / Bangkok University of Science and Technology\nCourse: Transport and the City\n# Transport in Bangkok: Report\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.\n2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.\n3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\nFigure 1: Means of transport in Bangkok by popularity\n¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","media":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc089d6bf38279efa4165e94bd6d78ada560954ef578df1ae1437f03e0288fe6.mp3"},"original":{"id":"B01-RW-U08-material:RW-M04","entry":"material:RW-M04","unitId":"B01-RW-U08","book":1,"track":"RW","unit":8,"title":"Transport in Bangkok: Report","kind":"material","pages":[178],"sourceImages":[{"page":178,"path":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c25c6c5e0a209b4f1ec0debc38ad52efa9eafb0828b811f56041624dd8625af1.png","viewEvidenceReported":true}],"text":"Student Name: Lamal Tongduan\n\nStudent ID: 100035478 / Bangkok University of Science and Technology\n\nCourse: Transport and the City\n\n# Transport in Bangkok: Report\n\nThis report shows the results of a survey about transport in Bangkok. Over 10 million people live in the city. The pie chart (Figure 1) shows the most popular types of transport in Bangkok. It shows the percentage of people who use each type of transport to get to work or school.\n\n2 Every day, thousands of people use public and private transport. A popular form of public transport is the SkyTrain. People take public transport so they don't have to drive themselves. 21% of the population of Bangkok takes the SkyTrain to work or school. Another form of public transport in the city is the bus. 18% of people who live in Bangkok take buses. People prefer buses to tuk-tuks because buses cost less money. Only 8% of people use tuk-tuks to get to work or school. Most people in Bangkok use private transport. They drive their own cars. 14% of people ride motorbikes to get to work or take children to school. Only 3% walk to work and only 2% cycle to work. Most places of work are too far away to walk or cycle to so these are the least popular ways to get to work.\n\n3 There is a lot of traffic in Bangkok. The roads are full of different types of vehicles ² (cars, motorbikes, tuk-tuks, etc.). 23% of people drive a car to work or school. Most people spend more than one hour every day travelling because the traffic is so bad. Almost 35% of people are late because of traffic jams. However, there are no traffic jams on the river. 11% of people take the water taxi. It is one of the fastest means of transport.\n\nFigure 1: Means of transport in Bangkok by popularity\n¹percentage (n) how many out of 100\n²vehicles (n) things such as cars or buses which take people from one place to another, especially using roads","publisherProvided":true,"studentWork":false,"sourceBlockIds":["b2369","b2370"],"module":"RW-M04","section":null,"usageStatus":"教材说明/材料目录；实际必需输入以逐题显式关系为准。"}},"playback":{"type":"audio","title":"Reading 2","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/fc089d6bf38279efa4165e94bd6d78ada560954ef578df1ae1437f03e0288fe6.mp3","continueOnPage":true}},{"id":"B01-RW-U08-classroom:review-1","book":1,"unit":8,"track":"RW","topic":"TRANSPORT","lesson":1,"module":"Vocabulary Review","context":{"moduleLabel":"VOCABULARY","phaseTitle":"LESSON REVIEW"},"pages":[189],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/597b3c16aac66baee84db5cef4b26292470f3e2d6ca2766171fb0f32fc811bcb.png"],"layout":"list","instruction":"Review the words.","flow":{"kind":"word-review","pages":[[{"id":"B01-RW-U08-B-001","form":"agree","page":189},{"id":"B01-RW-U08-B-002","form":"bicycle","page":189},{"id":"B01-RW-U08-B-003","form":"bus","page":189},{"id":"B01-RW-U08-B-005","form":"create","page":189},{"id":"B01-RW-U08-B-006","form":"drive","page":189},{"id":"B01-RW-U08-B-007","form":"metro","page":189},{"id":"B01-RW-U08-B-008","form":"motorbike","page":189},{"id":"B01-RW-U08-B-009","form":"on foot","page":189},{"id":"B01-RW-U08-B-010","form":"opinion","page":189},{"id":"B01-RW-U08-B-011","form":"percentage","page":189},{"id":"B01-RW-U08-B-014","form":"result","page":189},{"id":"B01-RW-U08-B-015","form":"ride","page":189},{"id":"B01-RW-U08-B-017","form":"table","page":189},{"id":"B01-RW-U08-B-018","form":"take","page":189},{"id":"B01-RW-U08-B-019","form" function markup(s){
 if(/<table/i.test(s)){
  const parsed=new DOMParser().parseFromString(s,"text/html");
  for(const el of [...parsed.body.querySelectorAll("*")]){
   if(!["TABLE","TBODY","THEAD","TR","TH","TD","B","STRONG","I","EM","U","BR"].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}
   for(const attr of [...el.attributes])el.removeAttribute(attr.name);

 }

function wireMaterials(doc,c,decks){
 const tabs=[...doc.querySelectorAll("[data-deck]")];
 const cards=[...doc.querySelectorAll("[data-deck-card]")];
 const pager=doc.querySelector(".material-pager"), source=doc.querySelector(".material-source");
 const previous=doc.querySelector("[data-material-prev]"), next=doc.querySelector("[data-material-next]");
 const count=doc.querySelector("[data-material-count]");
 let selected=0, subpage=0;
 function refresh(){
  const pages=decks[selected].pages, material=pages[subpage];
  tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",String(i===selected)));
  cards.forEach(card=>card.hidden=Number(card.dataset.deckCard)!==selected||Number(card.dataset.card)!==subpage);
  pager.hidden=pages.length===1;
  previous.disabled=subpage===0;next.disabled=subpage===pages.length-1;
  count.textContent=(subpage+1)+" / "+pages.length;
  source.textContent="材料原页";
  source.setAttribute("aria-label","材料原页，教材第 "+material.sourcePage+" 页");
  source.onclick=()=>original(c,material.sourcePage,source,[...new Set(pages.map(card=>card.sourcePage))]);
  doc.dispatchEvent(new doc.defaultView.Event("classroom-material-change"));
 }
 tabs.forEach((tab,i)=>tab.onclick=()=>{selected=i;subpage=0;refresh()});
 previous.onclick=()=>{subpage--;refresh()};next.onclick=()=>{subpage++;refresh()};
 refresh();
}
function referenceIsInline(c){
 if(c.coursePages)return classroom.related(c).length>0&&!c.coursePages.flat().length&&!c.courseVisuals.length;
 if(c.readingView||!classroom.related(c).length)return false;
 if(c.relationPlacement==="alongside")return true;
 return !c.presentation&&!c.taskTable&&!c.materialDecks&&!c.panelGroups&&
  !c.provided&&!c.items.length&&!c.supportText&&!c.activeMaterials?.length;
}

function content(c,p,b){
 if(c.stageSkill)return classroomStage.renderSkill(c,p);
 if(c.coursePages)return courseTaskHTML(c,p);
 if(c.flow)return courseFlowHTML(c,p);
 const items=b.chunks[p]??[], bank=wordBank(b.bank,c.layout==="table");
 const presentationItems=c.presentation?.showItems?(c.presentation.items??c.items):items;
 const itemList=presentationItems.map(item=>{
  const row=inlineRows(c.feedback).find(entry=>entry.label===item.label);
  if(item.prompt.trim()===c.instruction.trim()&&!item.options?.length){
   if(!row)return "";
   if(row.anchor?.kind==="line")return itemWithFeedback({...item,prompt:""},c.feedback);
  }
  if(!row&&c.provided.split(/\n/).some(line=>line.replace(/^\s*\d+\s*[.)]?\s+/,"").trim()===item.prompt.trim()))return "";
  const projected=b.equalOptions||c.presentation?.kind==="definitions"?{...item,options:[]}:item;
  return itemWithFeedback(projected,c.feedback,c.feedback?.letterChoices);
 }).join("");
 const provided=b.provided?'<div class="v-provided">'+markup(b.provided)+'</div>':"";
 if(b.decks.length){
  const task=c.presentation?.kind==="shared-board"?sharedBoardHTML(c.presentation,c.feedback):c.taskTable?taskTable(c.taskTable,c.feedback):provided||itemList;
  return materialSplit(b.decks,task,c.feedback);
 }
 const special=c.feedback?.placement==="inline"&&c.presentation&&inlinePresentationHTML(c);
 if(special)return special;
 if(c.presentation)return presentationHTML(c.presentation,itemList,b.bank,c.feedback);
 if(c.panelGroups)return splitPanels(c.panelGroups);
 if(c.taskTable){
  const topics=c.provided.split(/\n/).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^-\s+/,""))+'</li>').join("");
  return '<div class="v-block">'+(topics?'<ul class="table-topics">'+topics+'</ul>':"")+taskTable(c.taskTable,c.feedback)+'</div>';
 }
 if(referenceIsInline(c)){
  const paired=c.relationPlacement==="alongside";
  const reference=referencePanelHTML(c,paired);
  return paired?'<div class="split">'+reference+'<section class="panel v-block">'+provided+bank+itemList+'</section></div>':reference;
 }
 const support=c.supportText?'<div class="v-support"><h3>'+esc(c.supportTitle)+'</h3>'+markup(c.supportText)+'</div>':"";
 const materials=(c.activeMaterials??[]).map(m=>'<section class="v-context"><h3>'+esc(m.title)+'</h3>'+markup(m.text??"")+'</section>').join("");
 switch(c.layout){
  case "visual":return '<figure class="focus-image">'+(c.visual?'<img src="'+esc(c.visual)+'" alt="教材原生信息图">':'<div class="v-missing">缺少本题的教材图片。</div>')+'</figure>'+itemList;
  case "dual":{
   const left=support+materials, right=provided+bank+itemList;
   return left&&right?'<div class="split"><section class="panel v-block">'+left+'</section><section class="panel v-block">'+right+'</section></div>':
    (left||right?'<div class="v-block">'+left+right+'</div>':"");
  }
  case "table":return '<div class="v-block">'+bank+provided+(!b.table?itemList:"")+'</div>';
  case "grid":return '<div class="cards">'+items.map(x=>'<div class="fact"><span class="num">'+esc(x.label)+'</span><p>'+esc(x.prompt)+'</p></div>').join("")+'</div>'+(c.items.length?"":'<div class="v-missing">本题所需的已选卡片尚未接入。</div>');
  case "reading":return '<div class="paper v-block">'+provided+(provided?"":itemList)+'</div>';
  case "steps":return '<div class="panel v-block">'+provided+itemList+'</div>';
  default:return '<div class="v-block">'+bank+provided+itemList+'</div>';
 }
}

function originalButton(c,page,label){
 return '<button type="button" data-original-case="'+esc(c.id)+'" data-original-page="'+page+'">'+label+'</button>';
}

 return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="'+esc(base)+'"><link rel="stylesheet" href="assets/classroom-typography.css"><link rel="stylesheet" href="prototype-style.css"><link rel="stylesheet" href="../shared/course-view.css"><link rel="stylesheet" href="'+classroomStage.sheet+'"></head><body data-revision="'+revision+'">'+

  (readingPage?'材料第 '+readingPage.sourcePage+' 页':c.pages.length?'教材第 '+esc(c.pages.join("、"))+' 页':"")+classroomStage.count(p,binding.chunks.length)+'</div>'+audio+'</header>'+
  '<nav class="rail" aria-label="课堂工具"><button type="button" data-move="-1">上一页</button><button type="button" data-move="1">下一页</button><div class="rail-gap"></div>'+

function resultFor(c){return (c.comparison?comparisonResults:c.flow?lessonResults:results)[c.id];}
function status(c){return resultFor(c)?.verdict??"待实页检查";}
function resize(){
 const host=document.getElementById("preview-size"),scale=Math.min(host.parentElement.clientWidth/1280,maxProjectionScale);
 host.style.width=1280*scale+"px";host.style.height=720*scale+"px";frame.style.transform="scale("+scale+")";
}
function inClassroomOrder(){
 return Boolean(V.lessonFlow&&sequenceView.value==="school");
}
function inOpenings(){
 return sequenceView.value==="openings";
}
function inGlossaries(){
 return sequenceView.value==="glossaries";
}
function selectedUnitPages(){
 const pages=inGlossaries()?classroom.glossaries:classroom.openings;
 return pages.filter(c=>(openingBook.value==="all"||String(c.book)===openingBook.value)&&
  (openingTrack.value==="all"||c.track===openingTrack.value));
}
function selectedLessons(){
 const course=document.getElementById("lesson-filter").value;
 return (V.lessonFlow?.lessons??[]).filter(lesson=>course==="all"||course===lesson.key);
}
function exerciseVisible(c){
 const course=document.getElementById("lesson-filter").value, verdict=document.getElementById("status-filter").value;
 const feedback=document.getElementById("feedback-filter").value;
 return (course==="all"||course===c.track+c.lesson)&&(verdict==="all"||verdict===status(c))&&
  (feedback==="all"||feedback===c.feedback?.mode);
}
function flowSteps(lesson){
 return lesson.steps.filter(step=>step.kind!=="exercise"||exerciseVisible(classroom.byId.get(step.id)));
}
function navigationOrder(){
 if(inOpenings()||inGlossaries())return selectedUnitPages().map(c=>classroom.indexById.get(c.id));
 if(inClassroomOrder())return selectedLessons().flatMap(lesson=>flowSteps(lesson).filter(step=>step.id).map(step=>classroom.indexById.get(step.id)));
 return primary.filter(exerciseVisible).map(c=>classroom.indexById.get(c.id));
}
function neighbor(amount){
 const route=navigationOrder(), index=route.indexOf(current);
 return index<0?undefined:route[index+amount];
}
function renderFlowStep(step){
 const c=step.id?classroom.byId.get(step.id):null, i=classroom.indexById.get(step.id);
 const missing=step.missing??[], anchor=step.before?classroom.byId.get(step.before):null;
 const context=anchor?classroomStepLabel(anchor)+" 前":"";
 if(step.kind==="exercise"){
  return '<button class="nav-step '+(i===current?'active':'')+'" data-case="'+i+'"><i class="dot '+status(c)+'"></i><div>'+
   esc(step.label)+'<span>'+esc(V.layouts[c.layout])+'，'+status(c)+'</span></div></button>';
 }
 const note=missing.length?'待补 '+missing.length+' 个词的素材':'';
 const detail=[context,note].filter(Boolean).join("，");
 const entry=c?'<button class="nav-step flow-step '+(i===current?'active':'')+'" data-case="'+i+'"><div>'+esc(step.label)+
  (detail?'<span>'+esc(detail)+'</span>':"")+'</div></button>':'<div class="flow-step flow-unavailable">'+esc(step.label)+
   (detail?'<small>'+esc(detail)+'</small>':"")+'</div>';
 const gaps=missing.length?'<details class="flow-gaps"><summary>查看待补词项</summary><p>'+esc(missing.join("、"))+'</p></details>':"";
 return entry+gaps;
}
function nav(){
 const list=document.getElementById("case-list");
 if(inOpenings()||inGlossaries()){
  const books=new Map();
  for(const c of selectedUnitPages()){
   const heading=classroom.header(c);
   const detail=inGlossaries()?[trackLabel(c.track),heading.module,heading.activity].filter(Boolean).join("，"):trackLabel(c.track);
   const items=books.get(c.book)??[];
   const index=classroom.indexById.get(c.id);
   items.push('<button type="button" class="nav-step flow-step '+(index===current?'active':'')+'" data-case="'+index+'"'+
    (index===current?' aria-current="page"':'')+'><div>Unit '+c.unit+' '+esc(c.topic)+'<span>'+esc(detail)+'</span></div></button>');
   books.set(c.book,items);
  }
  list.innerHTML=[...books.entries()].map(([book,items])=>'<section class="flow-lesson"><h3>Book '+book+'</h3>'+items.join("")+'</section>').join("");
 }else if(inClassroomOrder()){
  const lessons=selectedLessons();
  list.innerHTML=lessons.map(lesson=>'<section class="flow-lesson"><h3>'+esc(lesson.title)+'</h3>'+
   flowSteps(lesson).map(renderFlowStep).join("")+'</section>').join("");
  document.getElementById("flow-coverage").textContent=lessons.map(lesson=>
   lesson.title+"课首 "+lesson.wordCount+" 个词").join("，")+"。任务 GLOSSARY 按对应环节出示。";
 }else{
  list.innerHTML=primary.filter(exerciseVisible).map(c=>renderFlowStep({id:c.id,label:classroomStepLabel(c),kind:"exercise"})).join("")||
   '<p class="empty">这一筛选下没有题目。</p>';
  document.getElementById("flow-coverage").textContent="当前显示教材 Ex 的实页验证。";
 }
}
function updateSequenceHeading(){
 const opening=inOpenings(),glossary=inGlossaries(),first=primary[0];
 const title=glossary?"UNLOCK 任务前 Glossary":opening?"UNLOCK 单元开篇":"Book "+classroom.bookNumber(first)+" Unit "+(first.unit??Number(/-U(\d+)/.exec(first.id)?.[1]))+" "+trackLabel(first.track);
 document.body.dataset.sequence=sequenceView.value;
 document.querySelector(".review-head h1").textContent=document.title=title;
 document.getElementById("review-description").textContent=opening||glossary?"本单元课堂材料。":first.topic??"课堂课件";
}
function changeSequence(){
 updateSequenceHeading();
 const order=navigationOrder();
 if(order.length&&!order.includes(current))display(order[0]);
 else{nav();updateReview();}
}
function vocabularyPlacement(c,page){
 const placement=c.flow?.kind==="cards"?c.flow.pages[page][0].placement:null;
 if(!placement)return "";
 const location=(label,point,fallback="")=>{
  if(!point)return fallback?'<p><strong>'+esc(label)+'</strong> '+esc(fallback)+'</p>':"";
  const parts=[...new Set([point.module,point.phase,point.title].filter(Boolean))];
  const details=parts.join("，")+(point.page?"，教材第 "+point.page+" 页":"")+
   (point.materialPage?"，"+point.materialTitle+"，教材第 "+point.materialPage+" 页":"");
  const unit=c.id.split("-classroom:")[0];
  const target=point.entry?.startsWith("resource:")?unit+"-classroom:"+point.entry:unit+"-"+point.entry;
  return '<p><strong>'+esc(label)+'</strong> '+esc(details)+'</p>'+
   (classroom.byId.has(target)?'<button type="button" data-ref="'+esc(target)+'">查看课堂位置</button>':"")+
   (point.materialPage?'<button type="button" data-reference-page="'+point.materialPage+'">阅读材料原页</button>':"");
 };
 return location("课堂首次使用",placement.need,"本节课首补学")+
  location("后续使用",placement.revisit)+
  location("练习位置",placement.practice,"本节课首 Vocabulary Practice");
}
function updateReview(){
 const c=cases[current],r=resultFor(c),b=bind(c);
 document.getElementById("case-heading").textContent=(c.comparison?"Book "+c.book+" Unit "+c.unit+" "+c.topic+"，跨单元试套，":"")+(c.track==="RW"?"读写":"听说")+" 第 "+c.lesson+" 节，"+classroomStepLabel(c);
 document.getElementById("screen-indicator").textContent="题面 "+(part+1)+" / "+b.chunks.length;
 document.getElementById("layout-indicator").textContent=c.readingView?"连续阅读":c.materialDecks?"固定任务区，切换材料":c.flow?c.module:V.layouts[c.layout];
 const [previous,next]=frame.contentDocument.querySelectorAll(".rail button");
 previous.disabled=document.getElementById("previous").disabled=c.comparison||part===0&&neighbor(-1)===undefined;
 next.disabled=document.getElementById("next").disabled=c.comparison||part===b.chunks.length-1&&neighbor(1)===undefined;
 document.getElementById("open-source").hidden=!c.pages.length;
 document.getElementById("instruction").textContent=c.instruction;
 document.getElementById("verdict").textContent=r?r.verdict:"待实页检查";
 const reasons=r?.reasons??c.issues;
 document.getElementById("reasons").innerHTML=reasons.length?'<ul>'+reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p class="good">原指令与本题内容可在固定画面内呈现。</p>';
 document.getElementById("metrics").textContent=r?"题面检查 "+r.pages+" 页。"+(r.clippedPages.length?"存在显示超界。":"题面边界检查通过。"):"正在准备实页检查。";
 if(r?.materialStates?.length)document.getElementById("metrics").append(" 材料切换检查 "+r.materialStates.length+" 个画面。");
 if(r?.inlineCheckTest)document.getElementById("metrics").append(" 原位核对检查 "+r.inlineCheckTest.points+" 处。");
 if(r?.screenChecks?.length)document.getElementById("metrics").append(" 已核对原页、前题和题面位置。");
 if(r?.playbackTest)document.getElementById("metrics").append(" 原音视频回放已实测。");
 document.getElementById("references").innerHTML=c.references.length?c.references.map(x=>'<button class="ref-button" '+(x.sourceOnly?'data-reference-page="'+x.pages[0]+'"':'data-ref="'+esc(x.id)+'"')+'>'+esc(x.title)+'，教材第 '+x.pages.join("、")+' 页</button>').join(""):'<p>本题记录中没有显式学生作答引用。</p>';
 document.getElementById("materials").innerHTML=c.materials.map(m=>'<details><summary>'+esc(m.title)+'，教材第 '+esc((m.pages||[]).join("、"))+' 页</summary><div class="resource-text">'+esc(m.text||"此条目通过教材原页核对。")+'</div></details>').join("")+(c.supportText&&!c.materialDecks?'<details><summary>'+esc(c.supportTitle)+'</summary><div class="resource-text">'+esc(c.supportText)+'</div></details>':"");
 if(c.materialDecks)document.getElementById("materials").innerHTML=classroom.materialDecks(c).map(deck=>'<details><summary>'+esc(deck.label)+'</summary><div class="resource-text">'+deck.pages.map(card=>esc([card.title,card.subtitle,card.lead,card.body.replace(/\*\*/g,""),...(card.notes??[])].filter(Boolean).join("\n"))).join("\n\n")+'</div></details>').join("");
 document.getElementById("materials").insertAdjacentHTML("afterbegin",vocabularyPlacement(c,part));
 document.getElementById("provided-record").innerHTML='<details><summary>完整给定内容和小题记录</summary><div class="resource-text">'+esc(c.provided)+'\n'+esc(c.items.map(x=>x.label+" "+x.prompt+(x.options?.length?"\n"+x.options.join("\n"):"")).join("\n\n"))+'</div></details>';
 const feedback=c.feedback;
 document.getElementById("feedback-record").innerHTML=feedback?
  '<p><strong>'+esc(V.answerCheck.modeLabels[feedback.mode])+'</strong>，'+feedback.rows.length+' 项。</p><p>'+esc(feedback.source)+'。</p>'+
  (feedback.note?'<p>'+esc(feedback.note)+'</p>':"")+
  (feedback.modelAsset?'<p><a href="'+esc(feedback.modelAsset)+'" target="_blank" rel="noopener">查阅答案手册原页</a></p>':""):"";
 document.getElementById("record-id").textContent=c.id;
}
async function display(i,p=0){
 const c=cases[i];
 if(!c||p<0||p>=bind(c).chunks.length)return;
 frame.contentDocument?.querySelectorAll("audio,video").forEach(audio=>{if(!audio.closest(".top"))audio.pause();});
 const oldAudio=i===current&&p!==part&&c.playback?.continueOnPage?
  frame.contentDocument?.querySelector(".top [data-playback]:not([hidden]) audio"):null;
 const resume=oldAudio?{offset:oldAudio.currentTime,playing:!oldAudio.paused&&!oldAudio.ended}:null;
 current=i;part=p;
 const revision=++renderRevision;
 resolveLoad?.();
 const loaded=new Promise(resolve=>{
  resolveLoad=resolve;
  frame.onload=()=>{if(frame.contentDocument?.body?.dataset.revision===String(revision))resolve();};
 });
 frame.srcdoc=screen(c,p,revision);
 await loaded;
 if(revision!==renderRevision)return;
 resolveLoad=null;
 const doc=frame.contentDocument;
 const decks=classroom.materialDecks(c);
 if(decks.length)wireMaterials(doc,c,decks);
 wireLessonControls(doc,c,resume);
 wireWordPronunciation(doc);
 wireCourseTools(doc,c);
 wireReader(doc,c);
 wireWorkRecord(doc,c);
 wireReferences(doc);
 for(const button of doc.querySelectorAll("[data-original-page]")){
  button.onclick=()=>original(classroom.byId.get(button.dataset.originalCase),Number(button.dataset.originalPage),button);
 }
 for(const button of doc.querySelectorAll("[data-move]"))button.onclick=()=>move(Number(button.dataset.move));
 for(const button of doc.querySelectorAll("[data-vocabulary-link]"))button.onclick=()=>jumpTo(button.dataset.vocabularyLink,true);
 const vocabularyReturn=doc.querySelector("[data-vocabulary-return]");
 if(vocabularyReturn)vocabularyReturn.onclick=returnToTask;
 classroomStage.connect(doc);
 updateReview();nav();resize();
}
function jumpTo(id,vocabulary=false){
 const i=classroom.indexById.get(id);
 if(i===undefined)return;
 history.push({i:current,p:part,...(vocabulary?{vocabulary:id}:{})});
 return display(i);
}
function returnToTask(){
 const previous=history.pop();
 if(previous)return display(previous.i,previous.p);
}
function move(amount){
 const chunks=bind(cases[current]).chunks.length;
 if(amount>0&&part+1<chunks)return display(current,part+1);
 if(amount<0&&part>0)return display(current,part-1);
 if(cases[current].comparison)return;
 const i=neighbor(amount);
 if(i!==undefined)return display(i,amount<0?bind(cases[i]).chunks.length-1:0);
}
function original(c,page=c.pages[0],trigger=null,group=c.pages){
 const entry=classroom.source(c,page);
 if(!entry)return false;
 const pages=group.includes(page)?group:[page];
 sourceEntries=pages.map(value=>classroom.source(c,value)).filter(Boolean);
 sourcePart=sourceEntries.findIndex(item=>item.page===entry.page);
 sourceTrigger=trigger;
 document.getElementById("source-modal").hidden=false;
 showSource();
 document.getElementById("source-close").focus({preventScroll:true});
 return true;
}
function closeSource(){
 const modal=document.getElementById("source-modal");
 if(modal.hidden)return;
 modal.hidden=true;
 if(sourceTrigger?.isConnected)sourceTrigger.focus({preventScroll:true});
 sourceTrigger=null;
}
function showSource(){
 const source=sourceEntries[sourcePart];
 if(!source)return;

 if(source.pdf)pdf.href=source.pdf;
 document.getElementById("source-prev").disabled=sourcePart===0;
 document.getElementById("source-next").disabled=sourcePart===sourceEntries.length-1;
}

function outside(el,bounds){
 const rect=el.getBoundingClientRect();
 return rect.bottom>bounds.bottom+1||rect.right>bounds.right+1||rect.left<bounds.left-1;
}
function measure(doc){
 const box=doc.querySelector(".slide-area").getBoundingClientRect();
 const baseItems=doc.querySelectorAll(".page .content > *, .page .paragraphs .line, .page .v-item, .page .v-context, .page .v-provided, .page .ref, .page .fact, .page .task-table, .practice-gallery .practice-photo, .practice-definitions p, .practice-lines li, .native-view, .shared-board-cell, .selection-item, .inline-notes li, .inline-judgments li, .inline-anchor, .timeline-count, .timeline-axis-value, .timeline-tick, .timeline-year, .timeline-share, .flow-wordcards article, .flow-glossary-entry, .flow-glossary-head, .flow-glossary-entry dd, .flow-visual-panel p, .flow-match-row, .flow-choices, .fact-file-copy li, .classification-title, .route-key, .route-caption, .route-slot, .unit-opening-copy > *");
 const clipped=[...baseItems].some(el=>el.getClientRects().length&&outside(el,box));
 const split=doc.querySelector(".material-split");
 if(!split)return clipped;
 return clipped||[...split.children].some(panel=>{
  if(outside(panel,box))return true;
  const bounds=panel.getBoundingClientRect(), css=doc.defaultView.getComputedStyle(panel);
  const inner={bottom:bounds.bottom-parseFloat(css.paddingBottom),left:bounds.left+parseFloat(css.paddingLeft),right:bounds.right-parseFloat(css.paddingRight)};
  const visible=[...panel.querySelectorAll(":scope > *, .material-card, .material-body > *, .task-table :is(th, td)")].filter(el=>el.getClientRects().length);
  return visible.some(el=>outside(el,inner));
 });
}
function fixedTaskState(doc){
 const task=doc.querySelector("[data-fixed-task]");
 const bounds=task.getBoundingClientRect();
 return JSON.stringify([task.innerHTML,bounds.x,bounds.y,bounds.width,bounds.height]);
}
function inspectMaterials(doc,c){
 const before=fixedTaskState(doc), next=doc.querySelector("[data-material-next]");
 const tabs=[...doc.querySelectorAll("[data-deck]")];

 for(const [i,deck] of classroom.materialDecks(c).entries()){
  tabs[i].click();
  for(const [j,material] of deck.pages.entries()){
   if(j)next.click();
   const visible=[...doc.querySelectorAll("[data-deck-card]:not([hidden])")], shown=visible[0];
   checked.push({
    material:deck.label, page:j+1, sourcePage:material.sourcePage,
    clipped:measure(doc), taskStable:before===fixedTaskState(doc),
    selected:visible.length===1&&Number(shown?.dataset.deckCard)===i&&Number(shown?.dataset.card)===j&&tabs[i].getAttribute("aria-pressed")==="true",
    imagesReady:[...(shown?.querySelectorAll("img")??[])].every(img=>img.complete&&img.naturalWidth>0)
   });
  }
 }
 tabs[0].click();
 return checked;
}

function inspectScreenRules(doc,c){
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const shell=doc.querySelector(".shell").getBoundingClientRect();
 const topBar=doc.querySelector(".top"), top=topBar.getBoundingClientRect();
 const rail=doc.querySelector(".rail").getBoundingClientRect();
 const css=doc.defaultView.getComputedStyle(doc.documentElement);
 const inset=property=>Number.parseFloat(css.getPropertyValue(property));
 const instructions=[...doc.querySelectorAll("[data-original-instruction]")];
 const isOpening=c.flow?.kind==="unit-opening";
 const isGlossary=c.flow?.kind==="glossary";
 const main=isOpening?doc.querySelector(".unit-opening-title"):isGlossary?doc.querySelector(".flow-glossary"):instructions[0];
 const box=main?.getBoundingClientRect();
 const anchor=box ? [box.x,box.y] : [];
 const emphasis=isGlossary?main?.querySelector("strong"):main;
 const instructionStyle=emphasis&&doc.defaultView.getComputedStyle(emphasis);
 const blackBold=instructionStyle?.color==="rgb(0, 0, 0)"&&instructionStyle.fontWeight==="700";
 const close=(a,b)=>Math.abs(a-b)<1;
 const stageStable=close(stage.x,rail.right)&&close(stage.y,top.bottom)&&close(stage.bottom,shell.bottom)&&
  close(stage.right,shell.right)&&close(box?.x,stage.x+inset("--slide-inset-x"))&&close(box?.y,stage.y+inset("--slide-inset-top"));
 const visible=el=>el.getClientRects().length>0;
 const duplicate=[...doc.querySelectorAll(".slide-area p,.slide-area li")].some(el=>el!==main&&visible(el)&&el.textContent.trim()===c.instruction);
 const buttons=[...doc.querySelectorAll(".rail [data-original-page]")];
 const sourcesMatched=(c.pages.length?buttons.some(button=>button.dataset.originalPage===String(c.pages[0])):buttons.length===0)&&buttons.every(inspectOriginalButton);
 const references=classroom.related(c);
 const referenceTargets=[...doc.querySelectorAll(".reference-sheet [data-original-case]")].map(button=>button.dataset.originalCase);
 const referencesReady=references.every(entry=>referenceTargets.includes(entry.target.id))&&
  (!references.length||Boolean(doc.querySelector("[data-reference-toggle], .content [data-reference-panel]")));
 const headerMatched=Object.entries(classroom.header(c)).every(([role,label])=>{
  const element=topBar.querySelector(".top-"+role);
  if(!label)return !element;
  if(element?.textContent!==label)return false;
  const text=doc.createRange();
  text.selectNodeContents(element);
  const rect=text.getBoundingClientRect(), column=element.parentElement.getBoundingClientRect();
  return rect.left>=column.left-1&&rect.right<=column.right+1&&rect.top>=top.top&&rect.bottom<=top.bottom;
 });
 const taskHeader=topBar.querySelector(".top-task");
 const headerPosition=taskHeader.getBoundingClientRect();
 const media=doc.querySelector(".top [data-playback]");
 let audioStable=true;
 if(media){
  const toggle=doc.querySelector("[data-playback-toggle]");
  toggle?.click();
  const current=main.getBoundingClientRect();
  const playedStage=doc.querySelector(".slide-area").getBoundingClientRect();
  const playedHeader=taskHeader.getBoundingClientRect();
  audioStable=!media.hidden&&close(current.x,box.x)&&close(current.y,box.y)&&close(playedStage.height,stage.height)&&
   close(playedHeader.x,headerPosition.x)&&close(playedHeader.y,headerPosition.y)&&close(playedHeader.width,headerPosition.width);
  toggle?.click();
 }
 const photos=[...doc.querySelectorAll(".practice-gallery .practice-photo img")].filter(visible);
 const flowPhotos=[...doc.querySelectorAll(".flow-visual img, .unit-opening-photo img")].filter(visible);
 const images=[...photos,...flowPhotos].map(img=>{
  const rect=img.getBoundingClientRect();
  const fit=doc.defaultView.getComputedStyle(img).objectFit==="cover"?Math.max:Math.min;
  const scale=fit(rect.width/img.naturalWidth,rect.height/img.naturalHeight)*maxProjectionScale;
  return {width:img.naturalWidth,height:img.naturalHeight,upscale:Math.round(scale*100)/100};
 });
 const photoRows=new Map();
 for(const img of photos){
  const row=img.getBoundingClientRect().y, caption=img.nextElementSibling;
  const answer=caption.querySelector("[data-field=caption]");
  if(!photoRows.has(row))photoRows.set(row,[]);
  photoRows.get(row).push({top:caption.getBoundingClientRect().y,baseline:answer?.getBoundingClientRect().bottom});
 }
 const matchGrid=doc.querySelector(".flow-match-pictures");
 const matchTiles=[...(matchGrid?.querySelectorAll(".flow-visual")??[])];
 const matchSize=Number(matchGrid?.dataset.matchColumns);
 const tileBoxes=matchTiles.map(tile=>tile.getBoundingClientRect());
 const matchingFilled=!matchGrid||([3,4].includes(matchSize)&&matchSize===matchTiles.length&&matchTiles.every((tile,i)=>{
  const box=tileBoxes[i], body=tile.firstElementChild, rect=body.getBoundingClientRect();
  return close(box.y,tileBoxes[0].y)&&close(box.width,tileBoxes[0].width)&&close(box.height,tileBoxes[0].height)&&
   close(rect.x,box.x+tile.clientLeft)&&close(rect.y,box.y+tile.clientTop)&&
   close(rect.width,tile.clientWidth)&&close(rect.height,tile.clientHeight)&&
   (body.tagName!=="IMG"||doc.defaultView.getComputedStyle(body).objectFit==="cover");
 }));
 const flowCaptions=[...doc.querySelectorAll(".flow-match-pictures figcaption")].map(el=>el.getBoundingClientRect().top);
 const photosAligned=flowCaptions.every(top=>close(top,flowCaptions[0]))&&[...photoRows.values()].every(row=>row.every(photo=>close(photo.top,row[0].top)&&
  (photo.baseline===undefined||close(photo.baseline,row[0].baseline))));
 const instructionExact=isGlossary?!instructions.length&&!duplicate&&main?.querySelectorAll(".flow-glossary-entry").length===c.flow.pages[0].length:isOpening?
  !instructions.length&&!duplicate&&main?.textContent===c.topic&&topBar.querySelector(".top-phase")?.textContent===c.instruction:
  instructions.length===1&&main.textContent===c.instruction&&!duplicate;
 return {instructionExact,
  stageStable,anchor,headerMatched,blackBold,sourcesMatched,referencesReady,audioStable,photosAligned,matchingFilled,images};
}

function inspectReader(doc,c){
 const toggle=doc.querySelector("[data-reader-toggle]");
 if(!toggle)return [];
 const panel=doc.querySelector("[data-reader-panel]");
 const next=panel.querySelector("[data-reader-next]"), previous=panel.querySelector("[data-reader-prev]");
 const close=panel.querySelector("[data-reader-close]");
 const expected=classroom.readingPages({reading:classroom.reader(c)});
 toggle.click();
 for(let i=0;i<expected.length&&!previous.disabled;i++)previous.click();
 const stage=doc.querySelector(".slide-area").getBoundingClientRect();
 const states=expected.map((material,i)=>{
  if(i)next.click();
  const sheet=panel.querySelector(".reader-sheet:not([hidden])");
  const contents=[...sheet.querySelectorAll(".reading-heading,.reading-main,.reading-copy,.reading-picture")];
  return {section:material.id,sourcePage:material.sourcePage,
   selected:sheet.dataset.readerPage===String(i),clipped:contents.some(el=>outside(el,stage))};
 });
 close.click();
 return states;
}

async function inspectCase(i){
 const c=cases[i],binding=bind(c),clippedPages=[],materialStates=[];
 let assetsReady=true, contentReady=true;
 const inlineScreens=[],screenChecks=[],readerStates=[];
 for(let p=0;p<binding.chunks.length;p++){
  await display(i,p);
  const doc=frame.contentDocument;
  const states=c.materialDecks?inspectMaterials(doc,c):[];
  screenChecks.push(inspectScreenRules(doc,c));
  if(p===0)readerStates.push(...inspectReader(doc,c));
  materialStates.push(...states);
  if(measure(doc)||states.some(state=>state.clipped))clippedPages.push(p+1);
  assetsReady=assetsReady&&lessonAssetsReady(doc);
  contentReady=contentReady&&!doc.querySelector(".v-missing")&&
   ![...doc.querySelectorAll(".page .minor")].some(el=>el.textContent.includes("尚未接入"));
  if(c.feedback?.placement==="inline")inlineScreens.push(inspectInlineCheck(doc,c));
 }
 const reasons=[...c.issues,...classroom.checks(c)];
 if(clippedPages.length)reasons.push("题面第 "+clippedPages.join("、")+" 页存在显示超界。");
 const preserved=screenChecks.every(page=>page.instructionExact);
 if(!preserved)reasons.push("课堂指令重复或与教材不一致。");
 if(screenChecks.some(page=>!page.blackBold))reasons.push("课堂指令或材料标题须使用黑色粗体。");
 if(screenChecks.some(page=>!page.stageStable||!page.audioStable))reasons.push("翻页或打开录音时题面位置有变化。");
 if(screenChecks.some(page=>!page.headerMatched))reasons.push("顶部的模块、环节或活动标识不完整。");
 if(screenChecks.some(page=>!page.sourcesMatched))reasons.push("题目或材料原页指向不准确。");
 if(screenChecks.some(page=>!page.referencesReady))reasons.push("前题内容无法直接调出。");
 if(screenChecks.some(page=>!page.photosAligned))reasons.push("同一组照片的图注位置没有对齐。");
 if(screenChecks.some(page=>!page.matchingFilled))reasons.push("匹配页须使用三格或四格，且照片铺满各自的图框。");
 if(screenChecks.some(page=>page.images.some(image=>image.upscale>maxPhotoUpscale)))reasons.push("照片在 1920 像素宽投屏时放大过多，需要更清晰的教材图。");
 if(readerStates.some(state=>!state.selected||state.clipped))reasons.push("连续阅读的段落切换或内容边界有误。");
 if(!assetsReady)reasons.push("教材材料未完整加载。");
 if(!contentReady)reasons.push("课堂材料或前题记录尚未接入。");
 const inlineLabels=[...new Set(inlineScreens.flatMap(page=>page.labels))];
 const inlineCheckTest=inlineScreens.length?{labels:inlineLabels,points:inlineScreens.reduce((sum,page)=>sum+page.points,0),pages:inlineScreens}:null;
 if(inlineCheckTest){
  const expected=c.feedback.rows.map(row=>row.label);
  const mapped=inlineLabels.length===expected.length&&expected.every(label=>inlineLabels.includes(label));
  if(!mapped||inlineScreens.some(page=>Object.values(page).includes(false)))reasons.push("原位核对、依据或画面定位仍需调整。");
 }
 if(materialStates.some(state=>!state.taskStable||!state.selected||!state.imagesReady))reasons.push("材料切换、原图加载或任务区定位有误。");
 const variant=c.variant||binding.chunks.length>1||binding.equalOptions||referenceIsInline(c);
 return {id:c.id,verdict:reasons.length?"不适用":variant?"预设变体适用":"直接适用",reasons,pages:binding.chunks.length,clippedPages,instructionExact:preserved,screenChecks,...(readerStates.length?{readerStates}:{}),...(materialStates.length?{materialStates}:{}),...(inlineCheckTest?{inlineCheckTest}:{})};
}
window.validationAPI={
 async run(){

};
