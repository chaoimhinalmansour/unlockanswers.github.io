d to rely on galleries to showcase their work\nin its physical form."},{"start":29.18,"end":32.3,"text":"Technology is transforming the art world,"},{"start":32.76,"end":37.32,"text":"providing artists with new ways to combine tradition\nwith innovation,"},{"start":37.98,"end":41.62,"text":"and for audiences to experience and engage with art."},{"start":42.96,"end":45.94,"text":"Digital artists use a wide range of tools,"},{"start":46.24,"end":48.2,"text":"such as graphic design software,"},{"start":48.74,"end":51.56,"text":"to make art that can be displayed on screens,"},{"start":51.98,"end":53.18,"text":"walls and floors,"},{"start":53.54,"end":55.28,"text":"and in other digital forms."},{"start":56.26,"end":59.14,"text":"Technology has also benefited sculptors,"},{"start":59.52,"end":62.32,"text":"who can now explore the use of 3D printing."},{"start":63.48,"end":67.52,"text":"This medium gives artists new ways to produce physical\nobjects,"},{"start":68.1,"end":71.68,"text":"allowing them to create complex shapes more quickly and\neasily."},{"start":72.62,"end":75.72,"text":"It also brings the possibility of mass production,"},{"start":76.2,"end":79.42,"text":"so artists can create numerous copies of their work,"},{"start":79.9,"end":84.1,"text":"and therefore have a greater number of individual\npieces of art to sell."},{"start":85.28,"end":86.36,"text":"Of course,"},{"start":86.78,"end":89.08,"text":"galleries still remain important for artists,"},{"start":89.48,"end":93.92,"text":"as there are some works of art that are best\nappreciated in person."},{"start":95.06,"end":99.8,"text":"Social media allows artists to depend less on gallery\nexhibitions,"},{"start":100.36,"end":103.94,"text":"and instead helps them to grow their income\nindependently."},{"start":105.16,"end":111.4,"text":"Many artists use online platforms to promote their art\nor designs to a global audience."},{"start":112.2,"end":115.86,"text":"They can also advertise their services to potential\nclients,"},{"start":116.32,"end":119.64,"text":"who might want to commission them to produce an\noriginal work."},{"start":121,"end":127.18,"text":"And many artists offer online tutorials to amateur\nartists who are keen to learn new skills."},{"start":128.24,"end":140.2,"text":"We can expect artists to continue to explore what\ntechnology can do for them, but for now, we can only\nbegin to imagine what the future of art will look like."}]}],"courseAnswer":{"kind":"teacher-excerpt","text":"1 F (They have been experimenting with new methods\nsince the dawn of time.)\n2 T\n3 F (Technology has improved the way sculptors can\nwork, too. It has also helped artists who want to learn\nnew skills.)\n4 F (Artists are expected to continue to explore what\ntechnology can do for them.)","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":57,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6371","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":5,"module":"WATCH AND LISTEN","ex":"4","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"WHILE WATCHING"},"instruction":"Watch again and complete each gap in the summary with two words you hear.","pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f1e1155211103c5293240a740ba06789d7dc7e5c19cd812f4b95a51ceedf9b1.png"],"provided":"Artists today don't need galleries to show their work in a (1)____. Instead, they can show it digitally on screens, walls and floors. Sculptors can more easily make (2)____ thanks to 3D printing, creating (3)____ of them to sell.\n\nMany artists now use (4) ____ or other online platforms to promote their w pieces of art to sell."},{"start":85.28,"end":86.36,"text":"Of course,"},{"start":86.78,"end":89.08,"text":"galleries still remain important for artists,"},{"start":89.48,"end":93.92,"text":"as there are some works of art that are best\nappreciated in person."},{"start":95.06,"end":99.8,"text":"Social media allows artists to depend less on gallery\nexhibitions,"},{"start":100.36,"end":103.94,"text":"and instead helps them to grow their income\nindependently."},{"start":105.16,"end":111.4,"text":"Many artists use online platforms to promote their art\nor designs to a global audience."},{"start":112.2,"end":115.86,"text":"They can also advertise their services to potential\nclients,"},{"start":116.32,"end":119.64,"text":"who might want to commission them to produce an\noriginal work."},{"start":121,"end":127.18,"text":"And many artists offer online tutorials to amateur\nartists who are keen to learn new skills."},{"start":128.24,"end":140.2,"text":"We can expect artists to continue to explore what\ntechnology can do for them, but for now, we can only\nbegin to imagine what the future of art will look like."}]}],"courseAnswer":{"kind":"model-excerpt","text":"1 The video suggests that this is probably\nnot true because it says that artists can\nnow ‘combine tradition with innovation’.\nIn other words, artists can choose to\nmake use of technology without giving\nup the traditional skills they have learned.\n2 The video states that artists can now\ndepend less on gallery exhibitions due\nto social media, and can grow their\nincome independently. This suggests\nthat in order to make money before,\ntheir work had to be accepted by a\ngallery, who would take some of the\nmoney for each piece sold.\n3 We can say this is true, because\ntechnology allows people to create\nand sell more items, as well as promote\ntheir work and connect with people who\nmight buy it.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6374","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":7,"module":"WATCH AND LISTEN","ex":"6","context":{"moduleLabel":"WATCH AND LISTEN","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner and discuss the questions.","pages":[149],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2f1e1155211103c5293240a740ba06789d7dc7e5c19cd812f4b95a51ceedf9b1.png"],"provided":"1 Do you prefer traditional forms of art to ones made or displayed with modern techniques?\n2 What art have you seen (or do you know about) that has been created or displayed using new technology?","items":[{"id":"b6374.i01","label":"1","prompt":"Do you prefer traditional forms of art to ones made or displayed with modern techniques?","options":[],"type":"discuss/open"},{"id":"b6374.i02","label":"2","prompt":"What art have you seen (or do you know about) that has been created or displayed using new technology?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Do you prefer traditional forms of art to ones made or displayed with modern techniques?"},{"kind":"text","text":"2 What art have you seen (or do you know about) that has been created or displayed using new technology?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I prefer traditional forms of art. I think\nthese traditions are important to keep\nalive. If artists don’t continue to learn\nthem, then future generations will be\nless able to create good art. / I prefer\nart made and displayed with modern\ntechniques. Artists can really make their\nwork come alive if they use innovative\nnew methods, creating an interactive\nexperience where the audience can join\nin with the art.\n2 I went to an interactive display of the\nwork of the artist Frida Kahlo. It showed\nmoving images of her work on the\nfloor, walls and ceiling of a large room.\nIt had music to go with it, as well as a\nvoice explaining what her work meant.\nIt probably wasn’t as good as seeing\nKahlo’s original paintings, but it was a\ngood way to get an overview of her style\nand the message she wanted to convey.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":57,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6377","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":8,"module":"LISTENING 1","ex":"1","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"You are going to listen to a radio report about the work of a graffiti artist. Before you listen, read the sentences (1–8) and write the words in bold next to the definitions (a–h).","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ba678c8943b9511846be4b870373e52f264eee3b5a8e5929818e2a46c2c377e6.png"],"provided":"1 A lot of people think that graffiti is vandalism because it destroys how buildings look. But good graffiti can be an art form.\n2 Good art should be a form of self-expression. Artists should show their own personality in everything they create.\n3 A good painting or photo always has good composition. Everything in it is arranged carefully so that you can clearly see what is happening.\n4 If you want to be an artist, you should never listen to other people's criticism of your work. You should create whatever you feel you need to create and ignore negative opinions.\n5 It's important for people to know the identity of who created a work of art. That's why artists should always sign their work.\n6 When you see a work of art, you shouldn't comment on it, or try to analyze it. You should just enjoy it.\n7 Artists have the right to paint wherever they want, without being punished.\n8 It's very important for children to learn to develop their artistic creativity from a young age.","items":[{"id":"b6377.i01","label":"a","prompt":"____ (n) who somebody is; the qualities that make a person different from others","options":["vandalism","self-expression","composition","criticism","identity","comment","right","creativity"],"type":"choice/closed"},{"id":"b6377.i02","label":"b","prompt":"____ (n) a person's opportunity to act and be treated in particular ways that the law will protect for the benefit of society","options":["vandalism","self-expression","composition","criticism","identity","commen ,"label":"e","prompt":"____ (v) to express an opinion","options":["vandalism","self-expression","composition","criticism","identity","comment","right","creativity"],"type":"choice/closed"},{"kind":"item","id":"b6377.i06","label":"f","prompt":"____ (n) the way that people or things are arranged in a painting or photograph","options":["vandalism","self-expression","composition","criticism","identity","comment","right","creativity"],"type":"choice/closed"}],[{"kind":"item","id":"b6377.i07","label":"g","prompt":"____ (n) the ability to produce original and unusual ideas, or to make something new or imaginative","options":["vandalism","self-expression","composition","criticism","identity","comment","right","creativity"],"type":"choice/closed"},{"kind":"item","id":"b6377.i08","label":"h","prompt":"____ (n) the act of saying that something or somebody is bad","options":["vandalism","self-expression","composition","criticism","identity","comment","right","creativity"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"a identity b right c vandalism d self-expression\ne comment f composition g creativity h criticism","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":58,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6378","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":9,"module":"LISTENING 1","ex":"2","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Discuss the sentences in Exercise 1 with a partner. Say if you agree.","pages":[150],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ba678c8943b9511846be4b870373e52f264eee3b5a8e5929818e2a46c2c377e6.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U07-question:b6377","kind":"material-reference","title":"LISTENING 1 Ex 1","pages":[150]}],"materials":[],"coursePages":[[]],"courseMaterials":[{"id":"B04-LS-U07-publisher-sheet:b6377","title":"LISTENING 1 Ex 1 原题面","pages":[150],"text":"1 A lot of people think that graffiti is vandalism because it destroys how buildings look. But good graffiti can be an art form.\n2 Good art should be a form of self-expression. Artists should show their own personality in everything they create.\n3 A good painting or photo always has good composition. Everything in it is arranged carefully so that you can clearly see what is happening.\n4 If you want to be an artist, you should never listen to other people's criticism of your work. You should create whatever you feel you need to create and ignore negative opinions.\n5 It's important for people to know the identity of who created a work of art. That's why artists should always sign their work.\n6 When you see a work of art, you shouldn't comment on it, or try to analyze it. You should just enjoy it.\n7 Artists have the right to paint wherever they want, without being punished.\n8 It's very important for children to learn to develop their artistic creativity from a young age.","screens":["1 A lot of people think that graffiti is vandalism because it destroys how buildings look. But good graffiti can be an art form.","2 Good art should be a form of self-expression. Artists should show their own personality in everything they create.","3 A good painting or photo always has good composition. Everything in it is arranged carefully so that you can clearly see what is happening.","4 If you want to be an artist, you should never listen to other people's criticism of your work. You should create whatever you feel you need to create and ignore negative opinions.","5 It's important for people to know the identity of who created a work of art. That's why artists should always sign their work.","6 When you see a work of art, you shouldn't comment on it, or try to analyze it. You should just enjoy it.","7 Artists have the right to paint wherever they want, without being punished.","8 It's very important for children to learn to develop their artistic creativity from a young age."],"sources":[{"page":150,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ba678c8943b9511846be4b870373e52f264eee3b5a8e5929818e2a46c2c377e6.png"}],"kind":"task_sheet","sourceBlockIds":["b6377"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I agree that it’s vandalism and that it\nshould be punished. / I think that a lot\nof graffiti looks bad. However, in the\nright place (for example, on the side of a\nlarge and otherwise ugly building), street\nart can look very good if it’s done by a\ntalented artist.\n2 I agree, because one of the main\npurposes of art is for artists to reveal\nsomething of themselves. / This isn’t\nalways true, because some artists have\nto work for other people. For example,\nthey have to create illustrations for\nbooks or images for websites that have\nnothing to do with their own personality.\n3 This is true, especially for photos.\nArt needs to communicate an idea\nor a message clearly. / I don’t think\nthat’s always the case. Picasso’s art,\nfor example, is often confusing and\ndifficult to interpret because of its\nunusual compositions. I think that’s great\nbecause it makes you think about what\nyou’re seeing.\n4 I agree with this. Artists need to be true\nto themselves and not listen to what\nother people think. / I’m not sure this is\ntrue of a lot of artists who create work\nfor other people to use. If I’m creating a\nposter for a client, for example, I need\nto know how to take feedback, which\nmay include criticism.\n5 This is true. A signature on a piece of\nart is a sign of confidence that the artist\nis proud of what they have done, in the\nsame way that books have the name\nof the author on the front. / This is not\nalways true. Many artists want to remain\nanonymous because it gives them extra\nfreedom to create what they want,\nand even have a sense of mystery, like\nBanksy.\n6 I think good art should encourage\npeople to start conversations, so I don’t\nagree that we should just passively\nobserve it. / I agree. Instead of talking to\nother people about art, you should just\nlisten to your own feelings and explore\nyour own thoughts.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":18,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6380","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":10,"module":"LISTENING 1","ex":"3","context":{"moduleLabel":"LISTENING 1","phaseTitle":"PREPARING TO LISTEN"},"instruction":"Look at the photo. Discuss the questions with a partner.","pages":[151],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac409777d65bf444a891370936342744c4b1209db8d24133e9188abebde774da.png"],"provided":"1 Describe the image. Where do you think it might be found?\n2 Why do you think some people want to make art like this?","items":[{"id":"b6380.i01","label":"1","prompt":"Describe the image. Where do you think it might be found?","options":[],"type":"discuss/open"},{"id":"b6380.i02","label":"2","prompt":"Why do you think some people want to make art like this?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Describe the image. Where do you think it might be found?"},{"kind":"text","text":"2 Why do you think some people want to make art like this?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 This is an example of street art and we\ncan see the person who is making it. It\nlooks like it is something from nature\nwith leaves and flowers, or maybe\na butterfly. It’s quite colourful and\nattractive. It seems to be on the side of\na building. If it is near a busy road lots of\npeople can pass by and see it. It might\nbe in the centre of a town, and the\nbuilding might be one that looked quite\nboring or ordinary before the painting\nwas done.\n2 Because they want to do something\ncreative; because the wall originally\nlooked boring or ugly and they wanted\nto make it look brighter and more\ninteresting; because they want to share\na message with other people; because\nthey want to do something as way of\nfighting authority.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4 so, what do you think of it?","options":[],"type":"discuss/open"},{"id":"b6400.i02","label":"2","prompt":"Would you like to have street art outside your home? Why / Why not?","options":[],"type":"discuss/open"},{"id":"b6400.i03","label":"3","prompt":"Do you think street art should be illegal? Why / Why not?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Is there street art where you live? If so, what do you think of it?"},{"kind":"text","text":"2 Would you like to have street art outside your home? Why / Why not?"},{"kind":"text","text":"3 Do you think street art should be illegal? Why / Why not?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 Yes, there is. It’s colourful and modern.\nI love it. / No, there isn’t. I don’t like it.\nThe city looks dirtier.\n2 No, I wouldn’t. Because street art\ndamages public buildings and people’s\nproperties. / Yes, I would. Because\nstreet art makes the city look modern\nand beautiful.\n3 Yes, it should be illegal. Because it’s\nvandalism, damages properties and\nmakes the city look less clean. / No, it\nshouldn’t. It’s an art form and a way for\npeople to express themselves.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6401","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":21,"module":"LISTENING 1","ex":"14","context":{"moduleLabel":"LISTENING 1","phaseTitle":"DISCUSSION"},"instruction":"Imagine that the street art in the photo on page 151 appeared near your home. You have taken a photo of it. Write a message to your local authority. Write around 150 words.","pages":[153],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/2ad0e6dc35c53ecaaba575403859a076f16e119b7a2c2b4b4ac5b45a4aeca539.png"],"provided":"- Give your opinion of the street art and explain that you have included a photo of it.\n- Say whether or not you like it being there.\n- Give your opinion on what should happen to it.","items":[{"id":"b6401.i01","label":"1","prompt":"Write a message to your local authority about the street art near your home (around 150 words).","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"- Give your opinion of the street art and explain that you have included a photo of it."},{"kind":"text","text":"- Say whether or not you like it being there."},{"kind":"text","text":"- Give your opinion on what should happen to it."},{"kind":"item","id":"b6401.i01","label":"1","prompt":"Write a message to your local authority about the street art near your home (around 150 words).","options":[],"type":"qa/open"}]],"courseMaterials":[{"id":"B04-LS-U07-publisher-page:p151","title":"原题或核对备注所引第151页","pages":[151],"text":"","screens":[],"sources":[{"page":151,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/ac409777d65bf444a891370936342744c4b1209db8d24133e9188abebde774da.png"}],"kind":"referenced_page","sourceBlockIds":[]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Dear Sir/Madam\nI am writing about the street art which has\nappeared recently on the side of a building\nnear my home. I have no information about\nwho painted it, but I am very impressed\nwith its quality. It is quite clearly the work of\na talented artist. It is colourful and certainly\nbetter than what was there before – an\nempty, ugly wall.\nI expect that quite a few people will be\nkeen for the painting to be removed. I have\nto say that this would be a shame. The main\nreason I would like it to stay is because it\nmakes the street look more cheerful and\nlively. It might even encourage people\nto take more of an interest in art and in\nthe area.\nHowever, if it has to go, I hope people are\nreminded that our streets should not look\ndull and lifeless. Perhaps some trees could\ngo in front of the building instead?\nYours faithfully,\nLANGUAGE\nDEVELOPMENT","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":58,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6404","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":1,"order":22,"module":"LANGUAGE DEVELOPMENT","ex":"1","context":{"moduleLabel":"LANGUAGE DEVELOPMENT","phaseTitle":"LANGUAGE DEVELOPMENT"},"instruction":"Work ur/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c93c0719171d3449c6d5752ae7811973a346680a319345cebb58820f9416cfcb.png"],"provided":"1 What does a painting need to include for you to consider it beautiful?\nFor me, a painting that is ...\n2 Do you like contemporary art, or do you prefer classical or more traditional art?\nI prefer art which is ...\n3 What do you think about private collectors who buy famous paintings so people cannot see them in museums?\n4 How much money should an artist receive for a piece of work? Do you think artists can earn enough money to make a living from their work?","items":[{"id":"b6409.i01","label":"","prompt":"For me, a painting that is ...","options":[],"type":"discuss/open"},{"id":"b6409.i02","label":"","prompt":"I prefer art which is ...","options":[],"type":"discuss/open"},{"id":"b6409.i03","label":"3","prompt":"What do you think about private collectors who buy famous paintings so people cannot see them in museums?","options":[],"type":"discuss/open"},{"id":"b6409.i04","label":"4","prompt":"How much money should an artist receive for a piece of work? Do you think artists can earn enough money to make a living from their work?","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 What does a painting need to include for you to consider it beautiful?"},{"kind":"text","text":"For me, a painting that is ..."},{"kind":"text","text":"2 Do you like contemporary art, or do you prefer classical or more traditional art?"},{"kind":"text","text":"I prefer art which is ..."},{"kind":"text","text":"3 What do you think about private collectors who buy famous paintings so people cannot see them in museums?"},{"kind":"text","text":"4 How much money should an artist receive for a piece of work? Do you think artists can earn enough money to make a living from their work?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 For me, a painting that is beautiful is\none that makes me stop and look at\nit. It has something that makes me\nfeel something. It doesn’t need to be\nsomething that shows a beautiful scene\nor a beautiful face.\n2 I prefer art which is modern or\ncontemporary. I like it when the artist is\nsaying something about the world that\nI’m living in. I’m not really interested in\nlooking at pictures of people who lived\nhundreds of years ago.\n3 I think that people who do this are a\nbit selfish. Art is something that should\nbe enjoyed by everyone. Perhaps\npeople with lots of money should do\nsomething else with it, and not keep art\nto themselves.\n4 Good artists are talented people, who\nhave spent a lot of time practising and\ndeveloping their skills. If their work is\ngood, then they should be paid a lot\nin the same way that pop stars and top\nsportspeople are. Unfortunately, most\nartists will never get paid enough to\nmake a living from their work. This is\nbecause there aren’t enough people\nwho can afford to buy art.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":19,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6413","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":27,"module":"LISTENIN  public money;\nthe art doesn’t really benefit the city’s\npopulation; more people would use and\nbenefit from a leisure centre; public art is a\nwaste of money.\nAhmad: Art is an important part of any\nculture; art can help make us proud of our\ncity; people enjoy looking at it; the location\nof the artwork rather than the artwork itself\nis the problem; moving it might solve the\nvandalism problem; children need to see\nart in public places; balance investment in\nleisure activities and public art.\nAzra: Art can have a very positive effect\non people; would need to put something\nin the place of art if new pieces aren’t\ncommissioned.\nSandra: Not sure a leisure centre would\nbe popular enough; consider moving the\nsculpture; could be a tourist attraction.\nClaudia: Public safety issue; artwork really is\ncausing more problems than it’s worth.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6418","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":31,"module":"LISTENING 2","ex":"5","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Read the topics below. Decide what the people said about each one. Use your notes from lic spaces. We need to balance art and leisure in the lives of our children.\nDecision 4: ____","items":[{"id":"b6420.i01","label":"Decision 1","prompt":"Decision 1: ____","options":[],"type":"gap/open"},{"id":"b6420.i02","label":"Decision 2","prompt":"Decision 2:","options":[],"type":"gap/open"},{"id":"b6420.i03","label":"Decision 3","prompt":"Decision 3: ____","options":[],"type":"gap/open"},{"id":"b6420.i04","label":"Decision 4","prompt":"Decision 4: ____","options":[],"type":"gap/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"Statement 1: Public art is a waste of money."},{"kind":"text","text":"Response 1.1: Art is an important part of any culture."},{"kind":"text","text":"Response 1.2: Art can have a very positive effect on people."},{"kind":"text","text":"Response 1.3: We don't know if we can sell the sculpture."},{"kind":"text","text":"Decision 1: ____"},{"kind":"text","text":"Statement 2: If we decide against commissioning public art, we'll need to put something in its place."}],[{"kind":"text","text":"Response 2.1: Build the leisure centre instead."},{"kind":"text","text":"Response 2.2: We'd need to gather data and opinions."},{"kind":"text","text":"Decision 2:"},{"kind":"text","text":"Statement 3: The public art causes a public safety issue."},{"kind":"text","text":"Response 3.1: I wonder if it's the location of the artwork rather than the artwork itself."},{"kind":"text","text":"Response 3.2: Moving it might solve the vandalism problem. It is just costing us money for repairs."}],[{"kind":"text","text":"Decision 3: ____"},{"kind":"text","text":"Statement 4: What if the city does not commission more art or build the leisure centre?"},{"kind":"text","text":"Response 4.1: The money would be put back into the budget, and we'd have to choose a new project."},{"kind":"text","text":"Response 4.2: Our children need to see art in public spaces. We need to balance art and leisure in the lives of our children."},{"kind":"text","text":"Decision 4: ____"}]],"courseMaterials":[],"courseMedia":[{"type":"audio","title":"Track 7.4","src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/c3b3aa2510e2073184b6bdeb0f1280c90300f5155d2cd3930c2387a4f3bd2e2f.mp3"}],"courseAnswer":{"kind":"no-exact-heading","references":[]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6421","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":33,"module":"LISTENING 2","ex":"7","context":{"moduleLabel":"LISTENING 2","phaseTitle":"WHILE LISTENING"},"instruction":"Look again at the decisions made in Exercise 6. Would you have made similar decisions? Why / Why not? Share your ideas with a partner.","pages":[158],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2f2747874e05886daa4704f08db238b30b379016af1178726bba8afd5dd1785.png"],"provided":"","items":[],"layout":"list","references":[{"id":"B04-LS-U07-question:b6420","kind":"student-work","title":"LISTENING 2 Ex 6","pages":[158]}],"materials":[],"coursePages":[[]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Yes, I would have made similar decisions in\neach case. / No, for Statement 1, I would\nhave suggested removing the current\nsculpture completely, as it costs too much\nto look after it.\nFor Statement 2, I would have invited\nbusinesses to suggest ideas about how\nthey might like to use the space.\nFor Statement 3, I would have set up\ncameras and fences to stop young people\ndamaging the sculpture.\nFor Statement 4, I would have suggested\nusing the money to help a local museum,\nor to help local organizations that\nsupport artists.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d85 ion)"],"type":"choice/closed"},{"id":"b6424.i05","label":"5","prompt":"____ Kids have been damaging the sculpture almost every night.","options":["F (fact)","O (opinion)"],"type":"choice/closed"},{"id":"b6424.i06","label":"6","prompt":"____ The shopping centre will be a great place to display art.","options":["F (fact)","O (opinion)"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"item","id":"b6424.i01","label":"","prompt":"Cleaning and restoring a piece of art costs a lot of public money.","options":["F (fact)","O (opinion)"],"type":"choice/closed"},{"kind":"item","id":"b6424.i02","label":"2","prompt":"____ We don't know exactly how much the art is worth.","options":["F (fact)","O (opinion)"],"type":"choice/closed"},{"kind":"item","id":"b6424.i03","label":"3","prompt":"____ We can replace the art with something that will be popular.","options":["F (fact)","O (opinion)"],"type":"choice/closed"}],[{"kind":"item","id":"b6424.i04","label":"4","prompt":"____ I don't think we'll be able to replace this painting with something that everybody likes.","options":["F (fact)","O (opinion)"],"type":"choice/closed"},{"kind":"item","id":"b6424.i05","label":"5","prompt":"____ Kids have been damaging the sculpture almost every night.","options":["F (fact)","O (opinion)"],"type":"choice/closed"},{"kind":"item","id":"b6424.i06","label":"6","prompt":"____ The shopping centre will be a great place to display art.","options":["F (fact)","O (opinion)"],"type":"choice/closed"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"2 F\n3 O – We can replace the art with something else.\n4 O – People will have different opinions about this\npainting if it’s replaced.\n5 F\n6 O – Public art can be displayed in the shopping centre.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c132 i03","label":"facts 2","prompt":"facts (2)","options":[],"type":"gap/open"}],[{"kind":"item","id":"b6425.i04","label":"opinions 1","prompt":"opinions (1)","options":[],"type":"gap/open"},{"kind":"item","id":"b6425.i05","label":"opinions 2","prompt":"opinions (2)","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Topic: The Kelpies\nFacts: This is a statue of two horses, built\nin 2013 and now displayed near the city of\nEdinburgh in Scotland. They represent the\nimportance of horses in building local canals.\nOpinions: These are an amazing sight\nwhen they are lit up at night. They are a\nproud symbol of my country’s skills and\nachievements.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6427","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":36,"module":"LISTENING 2","ex":"10","context":{"moduleLabel":"LISTENING 2","phaseTitle":"DISCUSSION"},"instruction":"Work with a partner. Use your notes from Listening 1 and Listening 2 to discuss the following questions.","pages":[159],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/3c08bf1bc3042df5110472f9e5ce346ffef159381e43f4d651ca67987c2cba25.png"],"provided":"1 If you had the chance to choose a piece of public art for your local area, what would you choose and why?\n2 Some cities pay artists to paint street art on their buildings. What makes this different from the street art mentioned in Listening 1?","items":[{"id":"b6427.i01","label":"1","prompt":"If you had the chance to choose a piece of public art for your local area, what would you choose and why?","options":[],"type":"discuss/open"},{"id":"b6427.i02","label":"2","prompt":"Some cities pay artists to paint street art on their buildings. What makes this different from the street art mentioned in Listening 1?","options":[],"type":"discuss/open"}],"layout":"list","references":[{"id":"B04-LS-U07-question:b6386","kind":"student-work","title":"LISTENING 1 Ex 5","pages":[151]},{"id":"B04-LS-U07-question:b6417","kind":"student-work","title":"LISTENING 2 Ex 4","pages":[157]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 If you had the chance to choose a piece of public art for your local area, what would you choose and why?"},{"kind":"text","text":"2 Some cities pay artists to paint street art on their buildings. What makes this different from the street art mentioned in Listening 1?"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1 I would choose a colourful mural that\ncelebrates the community’s culture\nand history. Murals are great because\nthey brighten up the area and can be\nenjoyed by everyone who passes by.\nI would like the mural to show local\nlandmarks, important events, and maybe\neven include some words or phrases\nin different languages spoken in the\ncommunity. This would make people\nfeel proud of where they live and also\nhelp visitors learn something new about\nthe area.\n2 If artists are paid to do something, then\nusually they have to do what their client\nasks them to do. This means that they\nare not really free to do what they want\nor express themselves fully. An artist\npaid by a city to paint street art might\nmake something that’s interesting to\nlook at and wouldn’t upset anyone\nmuch, but it probably wouldn’t be what I\nwould call real art.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":59,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6432","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":37,"module":"CRITICAL THINKING","ex":"1","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"CRITICAL THINKING"},"instruction":"Look back at Exercise 6 from Listening 2 on page 158. Notice how the debate is structured. Then match the parts of a debate (1–4) to the sentences from the debate (a–d).","pages":[160],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/e4e596eae30ab8041be7fed2843f5eb88c843bb3783edd9e17c15d77a503171d.png"],"provided":"1 Statement\n2 Response 1\n3 Response 2\n4 Decision\n\na Let's put together a proposal.\nb I don't think public money should buy art because not everybody likes it.\nc Public money should be used to buy public art.\nd You could say that, but I think we could probably find some piece of art that would be popular.","items":[{"id":"b6432.i01","label":"1","prompt":"Statement","options":["Let's put together a proposal.","I don't think public money should buy art because not everybody likes it.","Public money should be used to buy public art.","You could say that, but I think we could probably find some piece of art that would be popular."],"type":"choice/closed"},{"id":"b6432.i02","label":"2","prompt":"Response 1","options":["Let's put together a proposal.","I don't think public money should buy art because not everybody likes it.","Public money should be used to buy public art.","You could say that, but I think we could probably find some piece of art that would be popular."],"type":"choice/closed"},{"id":"b6432.i03","label":"3","prompt":"Response 2","options":["Let's put together a proposal.","I don't think public money should buy art because not everybody likes it.","Public money should be used to buy public art.","You could say that, but I think we could probably find some piece of art that would be popular."],"type":"choice/closed"},{"id":"b6432.i04","label":"4","prompt":"Decision","options":["Let's put together a proposal.","I don't think public money should buy art because not everybody likes it.","Public money should be used to buy public art.","You could say that, but I think we could probably find some piece of art that would be popular."],"type":"choice/closed"}],"layout":"list","references":[{"id":"B04-LS-U07-question:b6420","kind":"material-reference","title":"LISTENING 2 Ex 6","pages":[158]}],"materials":[],"coursePages":[[{"kind":"text","text":"1 Statement"},{"kind":"text","text":"2 Response 1"},{"kind":"text","text":"3 Response 2"},{"kind":"text","text":"4 Decision"},{"kind":"text","text":"a Let's put together a proposal."},{"kind":"text","text":"b I don't think public money should buy art because not everybody likes it."},{"kind":"text","text":"c Public money should be used to buy public art."}],[{"kind":"text","text":"d You could say that, but I think we could probably find some piece of art that would be popular."}]],"courseMaterials":[{"id":"B04-LS-U07-publisher-page:p158","title":"原题或核对备注所引第158页","pages":[158],"text":"","screens":[],"sources":[{"page":158,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2f2747874e05886daa4704f08db238b30b379016af1178726bba8afd5dd1785.png"}],"kind":"referenced_page","sourceBlockIds":[]},{"id":"B04-LS-U07-publisher-sheet:b6420","title":"LISTENING 2 Ex 6 原题面","pages":[158],"text":"Statement 1: Public art is a waste of money.\nResponse 1.1: Art is an important part of any culture.\nResponse 1.2: Art can have a very positive effect on people.\nResponse 1.3: We don't know if we can sell the sculpture.\nDecision 1: ____\n\nStatement 2: If we decide against commissioning public art, we'll need to put something in its place.\nResponse 2.1: Build the leisure centre instead.\nResponse 2.2: We'd need to gather data and opinions.\nDecision 2:\n\nStatement 3: The public art causes a public safety issue.\nResponse 3.1: I wonder if it's the location of the artwork rather than the artwork itself.\nResponse 3.2: Moving it might solve the vandalism problem. It is just costing us money for repairs.\nDecision 3: ____\n\nStatement 4: What if the city does not commission more art or build the leisure centre?\nResponse 4.1: The money would be put back into the budget, and we'd have to choose a new project.\nResponse 4.2: Our children need to see art in public spaces. We need to balance art and leisure in the lives of our children.\nDecision 4: ____","screens":["Statement 1: Public art is a waste of money.","Response 1.1: Art is an important part of any culture.","Response 1.2: Art can have a very positive effect on people.","Response 1.3: We don't know if we can sell the sculpture.","Decision 1: ____","Statement 2: If we decide against commissioning public art, we'll need to put something in its place.","Response 2.1: Build the leisure centre instead.","Response 2.2: We'd need to gather data and opinions.","Decision 2:","Statement 3: The public art causes a public safety issue.","Response 3.1: I wonder if it's the location of the artwork rather than the artwork itself.","Response 3.2: Moving it might solve the vandalism problem. It is just costing us money for repairs.","Decision 3: ____","Statement 4: What if the city does not commission more art or build the leisure centre?","Response 4.1: The money would be put back into the budget, and we'd have to choose a new project.","Response 4.2: Our children need to see art in public spaces. We need to balance art and leisure in the lives of our children.","Decision 4: ____"],"sources":[{"page":158,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/b2f2747874e05886daa4704f08db238b30b379016af1178726bba8afd5dd1785.png"}],"kind":"task_sheet","sourceBlockIds":["b6420"]}],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 c 2 b 3 d 4 a","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":60,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6435","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":38,"module":"CRITICAL THINKING","ex":"2","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"PREPARING FOR A DEBATE"},"instruction":"Work with a partner. Think of four more reasons to support each statement in the table. Write the reasons next to the numbers.","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094d  should be spent on public art.","header":false,"colspan":1,"rowspan":1},{"text":"statement 2: Public money should not be spent on public art.","header":false,"colspan":1,"rowspan":1}],[{"text":"1 Public art can attract tourists and boost the local economy.","header":false,"colspan":1,"rowspan":1},{"text":"1 There are more important things to spend public money on, like the police and other emergency services.","header":false,"colspan":1,"rowspan":1}],[{"text":"2","header":false,"colspan":1,"rowspan":1},{"text":"2","header":false,"colspan":1,"rowspan":1}],[{"text":"3","header":false,"colspan":1,"rowspan":1},{"text":"3","header":false,"colspan":1,"rowspan":1}],[{"text":"4","header":false,"colspan":1,"rowspan":1},{"text":"4","header":false,"colspan":1,"rowspan":1}],[{"text":"5","header":false,"colspan":1,"rowspan":1},{"text":"5","header":false,"colspan":1,"rowspan":1}]]},{"kind":"item","id":"b6435.i01","label":"statement 1, 2","prompt":"Public money should be spent on public art. 2 ____","options":[],"type":"gap/open"}],[{"kind":"item","id":"b6435.i02","label":"statement 1, 3","prompt":"Public money should be spent on public art. 3 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6435.i03","label":"statement 1, 4","prompt":"Public money should be spent on public art. 4 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6435.i04","label":"statement 1, 5","prompt":"Public money should be spent on public art. 5 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6435.i05","label":"statement 2, 2","prompt":"Public money should not be spent on public art. 2 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6435.i06","label":"statement 2, 3","prompt":"Public money should not be spent on public art. 3 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6435.i07","label":"statement 2, 4","prompt":"Public money should not be spent on public art. 4 ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6435.i08","label":"statement 2, 5","prompt":"Public money should not be spent on public art. 5 ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Statement 1\n2 Public art enhances community spaces,\nmaking them more enjoyable for\nresidents.\n3 It encourages cultural expression and\nshowcases local talent.\n4 Public art can promote social cohesion\nby bringing people together around\nshared experiences.\n5 It inspires creativity and sparks\nconversations, enriching everyday life.\nStatement 2\n2 The value of art is subjective, and not\nall taxpayers may appreciate or benefit\nfrom it.\n3 Public money should be used for\npractical infrastructure improvements,\nsuch as roads and public transportation.\n4 Private funding or donations could\nsupport art initiatives instead of using\ntaxpayer money.\n5 Public art can sometimes lead to\ncontroversy or division if the artwork\nis seen as inappropriate or not\nrepresentative of the community.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6436","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":39,"module":"CRITICAL THINKING","ex":"3","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"PREPARING FOR A DEBATE"},"instruction":"Evaluate your reasons from Exercise 2. Decide which statement and reasons you agree with the most. Write the statement as an opinion:","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/24ada0d7a9e06ae7e15fda4e66a97096aef41138b7e955fdcb3212877ab9f148.png"],"provided":"Public money should / should not be spent on public art because\n\nThis will be the opinion you defend in the speaking task at the end of this unit.","items":[{"id":"b6436.i01","label":"1","prompt":"Public money should / should not be spent on public art because ____","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-LS-U07-question:b6435","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[161]}],"materials":[],"coursePages":[[{"kind":"text","text":"Public money should / should not be spent on public art because"},{"kind":"text","text":"This will be the opinion you defend in the speaking task at the end of this unit."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Public money should not be spent\non public art because there are more\nimportant things to spend public money\non, like essential services. For example,\nhealthcare, education and emergency\nservices.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6437","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":40,"module":"CRITICAL THINKING","ex":"4","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"PREPARING FOR A DEBATE"},"instruction":"With your partner, think of facts and examples to use as evidence to support the reasons you wrote for your statement. Write them in the table.","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/24ada0d7a9e06ae7e15fda4e66a97096aef41138b7e955fdcb3212877ab9f148.png"],"provided":"","items":[{"id":"b6437.i01","label":"evidence table","prompt":"Write facts and examples to support the reasons for your chosen statement in the table.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-LS-U07-question:b6435","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[161]},{"id":"B04-LS-U07-question:b6436","kind":"student-work","title":"CRITICAL THINKING Ex 3","pages":[161]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6437.i01","label":"evidence table","prompt":"Write facts and examples to support the reasons for your chosen statement in the table.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"• rising healthcare costs: In many countries\nhealthcare spending is a significant part\nof public budgets. For example, in this\ncountry healthcare spending accounts\nfor nearly 20% of GDP\n• education funding gaps: school often\nface budget cuts affecting teacher\nsalaries, resources, and buildings. For\nexample, in the last ten years school\nbudgets have been cut by nearly 10%\n• emergency services are under strain: fire\nand rescue services are underfunded\nand overstretched. There has been a\n20% cut in funding since 2010","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6438","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":41,"module":"CRITICAL THINKING","ex":"5","context":{"moduleLabel":"CRITICAL THINKING","phaseTitle":"PREPARING FOR A DEBATE"},"instruction":"Look back at the reasons you wrote for the opposing statement in Exercise 2. With your partner, think of some facts or examples you could use to weaken or disprove these reasons. Write them in the table.","pages":[161],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/24ada0d7a9e06ae7e15fda4e66a97096aef41138b7e955fdcb3212877ab9f148.png"],"provided":"","items":[{"id":"b6438.i01","label":"1","prompt":"Write facts or examples to weaken or disprove the reasons for the opposing statement in the table.","options":[],"type":"gap/open"}],"layout":"list","references":[{"id":"B04-LS-U07-question:b6435","kind":"student-work","title":"CRITICAL THINKING Ex 2","pages":[161]}],"materials":[],"coursePages":[[{"kind":"item","id":"b6438.i01","label":"1","prompt":"Write facts or examples to weaken or disprove the reasons for the opposing statement in the table.","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"• funding public art can also play a\nrole in improving public well-being.\nStudies show that exposure to art can\nreduce stress and promote mental\nhealth, potentially reducing long-term\nhealthcare costs by creating healthier\ncommunities.\n• public art can complement education\nby serving as a tool for learning and\ncultural enrichment.\n• investing in public art doesn’t necessarily\ndetract from emergency services.\nWell-planned public art projects can\nbe funded through dedicated cultural\nfunds or partnerships with private\norganizations, ensuring that essential\nservices are not impacted.\nPREPARATION FOR\nSPEAKING","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":60,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6441","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":42,"module":"PREPARATION FOR SPEAKING","ex":"1","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Read the example sentence and answer the questions with a partner.","pages":[162],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6341fb109a807d63c28bb32f3d382ed38399b07769b1c05fff1cbac71b4895a1.png"],"provided":"This looks like spray painting but, in fact, it's a very artistic piece of work.","items":[{"id":"b6441.i01","label":"1","prompt":"What does the speaker think of the work?","options":[],"type":"qa/open"},{"id":"b6441.i02","label":"2","prompt":"Which expression in bold signals that the speaker is setting up something that they will later disagree with?","options":[],"type":"qa/open"},{"id":"b6441.i03","label":"3","prompt":"Which expression in bold signals the speaker's opinion?","options":[],"type":"qa/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"This looks like spray painting but, in fact, it's a very artistic piece of work."},{"kind":"item","id":"b6441.i01","label":"1","prompt":"What does the speaker think of the work?","options":[],"type":"qa/open"},{"kind":"item","id":"b6441.i02","label":"2","prompt":"Which expression in bold signals that the speaker is setting up something that they will later disagree with?","options":[],"type":"qa/open"},{"kind":"item","id":"b6441.i03","label":"3","prompt":"Which expression in bold signals the speaker's opinion?","options":[],"type":"qa/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 The speaker thinks it’s an artistic piece of work.\n2 This looks like 3 but, in fact","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6442","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":43,"module":"PREPARATION FOR SPEAKING","ex":"2","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner. Take turns giving your opinion on teaching children art at school. Use the phrases in bold in the Skills box.","pages":[162],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/6341fb109a807d63c28bb32f3d382ed38399b07769b1c05fff1cbac71b4895a1.png"],"provided":"People tend to believe that subjects like Maths and Science are the most important in schools. However, ...\nThe truth of the matter is that encouraging children to explore their creativity can have a great effect on their development.","items":[],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"People tend to believe that subjects like Maths and Science are the most important in schools. However, ..."},{"kind":"text","text":"The truth of the matter is that encouraging children to explore their creativity can have a great effect on their development."}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"We assume that art isn’t a very important\nsubject to learn in school, and that it isn’t\nsomething that will lead to a successful\ncareer. However, it remains true that most\nchildren love art and enjoy the chance to\ndevelop their artistic skills.\nSome people say that it’s better to help\nchildren learn about science and maths.\nThe truth of the matter is that encouraging\nchildren to explore their creativity can\nhave a great effect on their development.\nBeing creative can actually help with a lot\nof different subjects, including Maths and\nScience. So there is no reason why Art\nshouldn’t be considered as important as\nany other subject.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":61,"title":"教师书"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":20,"title":"答案手册"},{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/9994b95f70f512fd1067f444a3d75611d8af031d39cd114a3596012a3768459b.pdf","pdfPage":21,"title":"答案手册"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6443","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":44,"module":"PREPARATION FOR SPEAKING","ex":"3","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner. Take turns giving contrasting opinions. Use the words in brackets to help you.","pages":[163],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1a3271febfeaa098698b32578a66e0b237d338b3423cd10c9039a4f2a1659606.png"],"provided":"1 Statement 1: A lot of money is spent on public art.\nStatement 2: Only 0.5% of public money is spent on art.\n(We assume that ... ; but, in fact,)\nWe assume that a lot of money is spent on public art, but, in fact, only 0.5% of public money is spent on art.\n\n2 Statement 1: Public art has no long-term cost.\nStatement 2: Cleaning and maintenance need to be considered.\n(Many people think that ... ; However)\n\n3 Statement 1: The new sculpture is very popular.\nStatement 2: A thousand people have signed a petition to have it removed. (It seems like ... ; but actually)\n\n4 Statement 1: The government wasted a lot of money on the sculpture.\nStatement 2: It was donated to the city. (It looks like ... ; The fact of the matter is)","items":[{"id":"b6443.i01","label":"1","prompt":"Statement 1: A lot of money is spent on public art. Statement 2: Only 0.5% of public money is spent on art. (We assume that ... ; but, in fact,)","options":[],"type":"discuss/open"},{"id":"b6443.i02","label":"2","prompt":"Statement 1: Public art has no long-term cost. Statement 2: Cleaning and maintenance need to be considered. (Many people think that ... ; However)","options":[],"type":"discuss/open"},{"id":"b6443.i03","label":"3","prompt":"Statement 1: The new sculpture is very popular. Statement 2: A thousand people have signed a petition to have it removed. (It seems like ... ; but actually)","options":[],"type":"discuss/open"},{"id":"b6443.i04","label":"4","prompt":"Statement 1: The government wasted a lot of money on the sculpture. Statement 2: It was donated to the city. (It looks like ... ; The fact of the matter is)","options":[],"type":"discuss/open"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 Statement 1: A lot of money is spent on public art."},{"kind":"text","text":"Statement 2: Only 0.5% of public money is spent on art."},{"kind":"text","text":"(We assume that ... ; but, in fact,)"},{"kind":"text","text":"We assume that a lot of money is spent on public art, but, in fact, only 0.5% of public money is spent on art."},{"kind":"text","text":"2 Statement 1: Public art has no long-term cost."},{"kind":"text","text":"Statement 2: Cleaning and maintenance need to be considered."}],[{"kind":"text","text":"(Many people think that ... ; However)"},{"kind":"text","text":"3 Statement 1: The new sculpture is very popular."},{"kind":"text","text":"Statement 2: A thousand people have signed a petition to have it removed. (It seems like ... ; but actually)"},{"kind":"text","text":"4 Statement 1: The government wasted a lot of money on the sculpture."},{"kind":"text","text":"Statement 2: It was donated to the city. (It looks like ... ; The fact of the matter is)"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"teacher-excerpt","text":"1 Many people think that public art has no long-term\ncost. However, cleaning and maintenance need to be\nconsidered.\n2 It seems like the new sculpture is very popular, but\nactually a thousand people have signed a petition to have\nit removed.\n3 It looks like the government wasted a lot of money on\nthe sculpture. The fact of the matter is it was donated to\nthe city.","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/276a95eb1a2f98f115d9518f6c1328594ca67e6ee3310957863ad747b432ea8d.pdf","pdfPage":61,"title":"教师书"}]},"courseVisuals":[],"courseVisualAdapted":false,"courseNotes":[],"omittedReferences":[],"issues":[]},{"id":"B04-LS-U07-question:b6445","book":4,"unit":7,"track":"LS","topic":"ART AND DESIGN","lesson":2,"order":45,"module":"PREPARATION FOR SPEAKING","ex":"4","context":{"moduleLabel":"PREPARATION FOR SPEAKING","phaseTitle":"PREPARATION FOR SPEAKING"},"instruction":"Work with a partner. Practise saying the conversations, taking turns to be A and B. In which conversations is B asking for clarification?","pages":[163],"sourceImages":["https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1a3271febfeaa098698b32578a66e0b237d338b3423cd10c9039a4f2a1659606.png"],"provided":"1 A: I think we should start over again.\nB: Start over again? Do you mean reject all three of the applications?\nA: No, I think we should consider them all, but let's take a break first.\n\n2 A: It's obvious to me that we shouldn't build a new library right now. We don't have any spare money.\nB: We don't have the money? So what you're saying is that access to books isn't important.\nA: That's not what I meant; it is important, but there just isn't any money in the budget right now.\n\n3 A: That painting is nothing but graffiti.\nB: Nothing but graffiti? In other words, you don't think it's art.\nA: Exactly. Art is in museums, not in public spaces.\n\n4 A: We have to reduce our artwork budget by 40% this year.\nB: 40%? So, if I understand you correctly, our total artwork budget is £15,000, then?\nA: Yes, that's right.","items":[{"id":"b6445.i01","label":"1","prompt":"Conversation 1","options":["B is asking for clarification","B is not asking for clarification"],"type":"choice/closed"},{"id":"b6445.i02","label":"2","prompt":"Conversation 2","options":["B is asking for clarification","B is not asking for clarification"],"type":"choice/closed"},{"id":"b6445.i03","label":"3","prompt":"Conversation 3","options":["B is asking for clarification","B is not asking for clarification"],"type":"choice/closed"},{"id":"b6445.i04","label":"4","prompt":"Conversation 4","options":["B is asking for clarification","B is not asking for clarification"],"type":"choice/closed"}],"layout":"list","references":[],"materials":[],"coursePages":[[{"kind":"text","text":"1 A: I think we should start over again."},{"kind":"text","text":"B: Start over again? Do you mean reject all three of the applications?"},{"kind":"text","text":"A: No, I think we should consider them all, but let's take a break first."},{"kind":"text","text":"2 A: It's obvious to me that we shouldn't build a new library right now. We don't have any spare money."},{"kind":"text","text":"B: We don't have the money? So what you're saying is that access to books isn't important."},{"kind":"text","text":"A: That's not what I meant; it is important, but there just isn't any money in the budget right now."}],[{"kind":"text","text":"3 A: That painting is nothing but graffiti."},{"kind":"text","text":"B: Nothing but graffiti? In other words, you don't think it's art."},{"kind":"text","text":"A: Exactly. Art is in museums, not in public spaces."},{"kind":"text","text":  money in the budget right now.\n\n3 A: That painting is nothing but graffiti.\nB: Nothing but graffiti? In other words, you don't think it's art.\nA: Exactly. Art is in museums, not in public spaces.\n\n4 A: We have to reduce our artwork budget by 40% this year.\nB: 40%? So, if I understand you correctly, our total artwork budget is £15,000, then?\nA: Yes, that's right.","screens":["1 A: I think we should start over again.","B: Start over again? Do you mean reject all three of the applications?","A: No, I think we should consider them all, but let's take a break first.","2 A: It's obvious to me that we shouldn't build a new library right now. We don't have any spare money.","B: We don't have the money? So what you're saying is that access to books isn't important.","A: That's not what I meant; it is important, but there just isn't any money in the budget right now.","3 A: That painting is nothing but graffiti.","B: Nothing but graffiti? In other words, you don't think it's art.","A: Exactly. Art is in museums, not in public spaces.","4 A: We have to reduce our artwork budget by 40% this year.","B: 40%? So, if I understand you correctly, our total artwork budget is £15,000, then?","A: Yes, that's right."],"sources":[{"page":163,"src":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c735105a953f4d8574afdae6c989e097094dd043/content/1a3271febfeaa098698b32578a66e0b237d338b3423cd10c9039a4f2a1659606.png"}],"kind":"task_sheet","sourceBlockIds":["b6445"]}],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"1  Do you mean that taking a photo\ndoesn’t require much skill? Because I’m\nnot sure that’s true.\n2  So what you’re saying is that fashion\ndesigners are as talented as any other\nkind of artist?\n3  No need for human artists? In other words,\nyou think artificial intelligence will be as\ngood as or better than any human?","references":[{"source":"https://raw.githubusercontent.com/chaoimhinalmansour/unlockanswers.github.io/c7351 point 2: ____","options":[],"type":"gap/open"},{"kind":"item","id":"b6463.i06","label":"6","prompt":"Public money should not be spent on public art – point 3: ____","options":[],"type":"gap/open"}]],"courseMaterials":[],"courseMedia":[],"courseAnswer":{"kind":"model-excerpt","text":"Public money should be spent on public art.\n1 Stimulates the economy\n2 Enhances the quality of public spaces\n3 An education tool that can inspire\ncreativity\nPublic money should not be spent on\npublic art.\n1 Need to ensure health and emergency\nservices have adequate funding\n2 Art is subjective, not all citizen\nappreciate or benefit from it.\n3 Provide partnerships or donations can\nfund public art.\nUNIT 8\nUNLOCK YOUR\nKNOWLEDGE\npage 169\n1 The people in the photo are playing\nchess. They must be in their 70s or 80s,\nor maybe even older. I think this activity\nis benefitting the people in different\nways. Firstly, it’s a game that involves a\nlot of thinking, so it’s good for keeping\ntheir minds active. Also, it’s a social\nactivity. It’s something that people can\ndo just to spend time together.\n2 I totally agree with this idea. You can\ncertainly learn new things at any age, as\nlong as you’re physically and mentally fit.\nBut I think that doing new things helps\nyou to stay physically and mentally fit. /\nAge is just a number, but unfortunately,\nI think you do get too old to do certain\nthings after a while. The body changes,\nand there’s no way you can keep on\ndoing the same things as in your 20s.\n3 Older people have a lot more\nexperience of life. They’re wiser and\nhave a deeper understanding of the\nworld. They know themselves better –\ntheir weaknesses and their strengths.\nApart from that, they often have\nfinancial advantages – they are likely to\nhave more in the way of possessions\nand property. And of course, retired\npeople may also have a lot more free\ntime and fewer responsibilities than\nyounger generations.","references":[{"source":"https://raw.githubu
