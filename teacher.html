,"answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">4 Finally, while </span><span style=\"font-weight:700;color:#C00000\">I think</span><span style=\"color:#192B3B\"> these disadvantages might mean that some people would not want to visit Vancouver, …</span><br><span style=\"font-weight:700;color:#C00000\">Opinion.</span></p><p><span style=\"color:#192B3B\">The speaker predicts how other people may feel about visiting.</span></p><p><span style=\"color:#192B3B\">5 … </span><span style=\"font-weight:700;color:#C00000\">I personally feel</span><span style=\"color:#192B3B\"> that most people would enjoy Vancouver.</span><br><span style=\"font-weight:700;color:#C00000\">Opinion.</span></p><p><span style=\"color:#192B3B\">This phrase explicitly introduces the speaker’s judgement.</span></p><p><span style=\"color:#192B3B\">6 </span><span style=\"font-weight:700;color:#C00000\">In my opinion</span><span style=\"color:#192B3B\">, being close to nature and having a healthy city are worth paying a little more money for.</span><br><span style=\"font-weight:700;color:#C00000\">Opinion.</span></p><p><span style=\"color:#192B3B\">“Worth paying” is a judgement about value.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">1 </span><span style=\"font-weight:700;color:#C00000\">Obviously</span><span style=\"color:#192B3B\">, Stanley Park is a large park.</span><br><span style=\"font-weight:700;color:#C00000\">Fact.</span></p><p><span style=\"color:#192B3B\">The sentence gives information about the park’s size.</span></p><p><span style=\"color:#192B3B\">2 </span><span style=\"font-weight:700;color:#C00000\">In fact</span><span style=\"color:#192B3B\">, because it is located in the city of Vancouver, it is the third largest urban park in North America.</span><br><span style=\"font-weight:700;color:#C00000\">Fact.</span></p><p><span style=\"color:#192B3B\">The sentence gives a rank stated in the lecture.</span></p><p><span style=\"color:#192B3B\">3 </span><span style=\"font-weight:700;color:#C00000\">As we know</span><span style=\"color:#192B3B\">, lots of trees help clean the city air.</span><br><span style=\"font-weight:700;color:#C00000\">Fact.</span></p><p><span style=\"color:#192B3B\">The sentence makes a claim about trees and air that can be checked.</span></p></div>","sourceSlides":[94,95,96,99,240,241,207],"images":[],"sourceCode":"L2.6","material":false},{"id":"B2U01LS-S202","module":"PREPARATION FOR SPEAKING","title":"ORGANIZING INFORMATION FOR A PRESENTATION","subtitle":"","slide":202,"bookPage":"32","trackIds":["PPT_69ddeaa8cf80e1e3"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">4  Here is some language that you can use to help the listener follow your ideas and</span></p><p><span style=\"font-weight:700;color:#193C78\">know when you are changing topics. Listen and circle the organizing phrase you hear.</span></p><p><span style=\"color:#192B3B\">1  I’d like to talk about / I’d like to tell you about the city of Vancouver, in British Columbia,</span></p><p><span style=\"color:#192B3B\">Canada.</span></p><p><span style=\"color:#192B3B\">2  First of all, / Firstly, let’s look at some of the positives.</span></p></div><div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">4  Here is some language that you can use to help the listener follow your ideas and</span></p><p><span style=\"font-weight:700;color:#193C78\">know when you are changing topics. Listen and circle the organizing phrase you hear.</span></p><p><span style=\"color:#192B3B\">3  I’d also like to talk about / I’d also like to give you some disadvantages of parks in</span></p><p><span style=\"color:#192B3B\">Vancouver.</span></p><p><span style=\"color:#192B3B\">4  In summary, / Finally, while I think these disadvantages mean that some people would</span></p><p><span style=\"color:#192B3B\">not want to visit Vancouver, I personally feel that most people would enjoy Vancouver.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1 </span><span style=\"font-weight:700;color:#C00000\">I’d like to talk about</span><span style=\"color:#192B3B\"> the city of Vancouver, in British Columbia, Canada.</span></p><p><span style=\"color:#192B3B\">00:05 introduces the subject. 00:15 begins the first main point.</span></p><p><span style=\"color:#192B3B\">2 </span><span style=\"font-weight:700;color:#C00000\">First of all</span><span style=\"color:#192B3B\">, let’s look at some of the positives.</span></p><p><span style=\"color:#192B3B\">00:05 introduces the subject. 00:15 begins the first main point.</span></p><p><span style=\"color:#192B3B\">3 </span><span style=\"font-weight:700;color:#C00000\">I’d also like to talk about</span><span style=\"color:#192B3B\"> some disadvantages of parks in Vancouver.</span></p><p><span style=\"color:#192B3B\">00:23 adds a topic. 00:32 introduces the final judgement.</span></p><p><span style=\"color:#192B3B\">4 </span><span style=\"font-weight:700;color:#C00000\">Finally</span><span style=\"color:#192B3B\">, while I think these disadvantages mean that some people would not want to visit Vancouver, I personally feel that most people would enjoy Vancouver.</span></p><p><span style=\"color:#192B3B\">00:23 adds a topic. 00:32 introduces the final judgement.</span></p></div>","sourceSlides":[202,203,204],"images":[],"sourceCode":"PS.4","material":false},{"id":"B2U01LS-S209","module":"PREPARATION FOR SPEAKING","title":"PRONUNCIATION FOR SPEAKING","subtitle":"","slide":209,"bookPage":"32","trackIds":["PPT_863d883603a44580"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1.6  Listen to this example. Notice that the words talk and about are connected.</span></p><p><span style=\"color:#192B3B\">I’d like to </span><span style=\"font-weight:700;color:#7E398A\">talk about</span><span style=\"color:#192B3B\"> the city of Vancouver, in British Columbia, Canada.</span></p><p><span style=\"color:#193C78\">⌣</span></p></div>","answerHtml":"","sourceSlides":[209],"images":[],"sourceCode":"PS.connect.example","material":false,"teachingNote":"本项为听音、模仿或同伴表达活动；可展开原文对照录音，按题目要求讲评。"},{"id":"B2U01LS-S210","module":"PREPARATION FOR SPEAKING","title":"PRONUNCIATION FOR SPEAKING","subtitle":"","slide":210,"bookPage":"33","trackIds":["PPT_66d3b4a03f7cbe05"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">7  Listen to the sentence below and mark the links between the consonants and</span></p><p><span style=\"font-weight:700;color:#193C78\">vowels.</span></p><p><span style=\"color:#192B3B\">First of all, let’s look at some of the positives.</span></p><p><span style=\"color:#193C78\">⌣</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#C00000\">First of all</span><span style=\"color:#192B3B\">, let’s </span><span style=\"font-weight:700;color:#C00000\">look at</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">some of</span><span style=\"color:#192B3B\"> the positives.</span></p><p><span style=\"color:#192B3B\">What makes a link?</span><br><span style=\"font-weight:700;color:#C00000\">A final consonant sound connects to an initial vowel sound.</span></p><p><span style=\"color:#192B3B\">Listen to the whole phrase and repeat it smoothly. Avoid inserting a pause between the linked words.</span></p></div>","sourceSlides":[210,211],"images":[],"sourceCode":"PS.7","material":false},{"id":"B2U01LS-S212","module":"PREPARATION FOR SPEAKING","title":"ORGANIZING INFORMATION FOR A PRESENTATION","subtitle":"","slide":212,"bookPage":"33","trackIds":["PPT_69ddeaa8cf80e1e3"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">8  Listen again and repeat the phrases in Exercise 4. Pay attention to the way you link</span></p><p><span style=\"font-weight:700;color:#193C78\">the words together.</span></p><p><span style=\"color:#192B3B\">I’d like to talk about ...</span></p><p><span style=\"color:#192B3B\">First of all, ...</span></p><p><span style=\"color:#192B3B\">I’d also like to talk about ...</span></p><p><span style=\"color:#192B3B\">Finally, ...</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">Mark the links between final consonant sounds and initial vowel sounds. Practise saying the phrases.</span></p><p><span style=\"color:#192B3B\">1 I’d like to give you </span><span style=\"font-weight:700;color:#C00000\">some information about</span><span style=\"color:#192B3B\"> ...</span></p><p><span style=\"color:#192B3B\">Link some + information, information + about, and talk + about.</span></p><p><span style=\"color:#192B3B\">2 Now let’s </span><span style=\"font-weight:700;color:#C00000\">talk about</span><span style=\"color:#192B3B\"> ...</span></p><p><span style=\"color:#192B3B\">Link some + information, information + about, and talk + about.</span></p><p><span style=\"color:#192B3B\">3 The next </span><span style=\"font-weight:700;color:#C00000\">topic is</span><span style=\"color:#192B3B\"> ...</span></p><p><span style=\"color:#192B3B\">Link topic + is and look + at. The final sound, not the final letter, matters.</span></p><p><span style=\"color:#192B3B\">4 Finally, let’s </span><span style=\"font-weight:700;color:#C00000\">look at</span><span style=\"color:#192B3B\"> ...</span></p><p><span style=\"color:#192B3B\">Link topic + is and look + at. The final sound, not the final letter, matters.</span></p></div>","sourceSlides":[212,214],"images":[],"sourceCode":"PS.8","material":false}]},{"id":"B2U01RW","book":2,"unit":1,"skill":"RW","title":"UNLOCK 2 RW · Unit 1","activities":[{"id":"B2U01RW-S046","module":"READING 1","title":"PREPARING TO READ","subtitle":"UNDERSTANDING KEY VOCABULARY","slide":46,"bookPage":"19","trackIds":["PPT_85aacc1a165933d0"],"start":0,"questionHtml":"<div class=\"source-part\"><figure><img src=\"assets/classroom/images/3752c1c593366c885f91da1478eb9a6b41dd75212970243b16968e57853494e2.png\" alt=\"READING 1 教材配图\"></figure></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">1  The number of megacities is growing very quickly. In the 1950s, there were only two</span></p><p><span style=\"color:#192B3B\">megacities in the world.</span></p><p><span style=\"color:#192B3B\">2  Today, 12% of the world’s urban¹ </span><span style=\"font-weight:700;color:#7E398A\">population</span><span style=\"color:#192B3B\"> lives in megacities. Studies show that</span></p><p><span style=\"color:#192B3B\">there will be 8.5 billion people in the world in 2030. </span><span style=\"font-weight:700;color:#7E398A\">Experts</span><span style=\"color:#192B3B\"> say that there will be 40</span></p><p><span style=\"color:#192B3B\">megacities.</span></p><p><span style=\"color:#192B3B\">3  Today, more than 35 cities in the world are megacities. The majority are in Asia, South</span></p><p><span style=\"color:#192B3B\">America and Africa. More and more people around the world are leaving their homes in</span></p><p><span style=\"color:#192B3B\">the </span><span style=\"font-weight:700;color:#7E398A\">countryside</span><span style=\"color:#192B3B\"> and moving to the city.</span></p><p><span style=\"color:#192B3B\">¹ urban (adj) relating to towns and cities</span></p></div>","answerHtml":"","sourceSlides":[46,47],"images":["assets/classroom/images/3752c1c593366c885f91da1478eb9a6b41dd75212970243b16968e57853494e2.png"],"sourceCode":"reading:PPT_85aacc1a165933d0","material":true},{"id":"B2U01RW-S084","module":"READING 2","title":"WHILE READING","subtitle":"SCANNING TO FIND INFORMATION","slide":84,"bookPage":"23","trackIds":["PPT_733412a4e1bac5e4"],"start":0,"questionHtml":"<div class=\"source-part\"><figure><img src=\"assets/classroom/images/64991a3eefc608f99f950fc0d18b0d8c6625b3a0ca48acc0ec63e29630fb13d8.png\" alt=\"READING 2 教材配图\"></figure><p><span style=\"color:#192B3B\">Homestays are becoming more and more popular, and people around the world are</span></p><p><span style=\"color:#192B3B\">offering their homes as places to stay. Homestays offer </span><span style=\"font-weight:700;color:#7E398A\">cheap</span><span style=\"color:#192B3B\"> places to stay and the</span></p><p><span style=\"color:#192B3B\">chance for guests to see the </span><span style=\"font-weight:700;color:#7E398A\">area</span><span style=\"color:#192B3B\"> like </span><span style=\"font-weight:700;color:#7E398A\">local</span><span style=\"color:#192B3B\"> people. They are very popular with students</span></p><p><span style=\"color:#192B3B\">who want to stay in another country and learn a language. We asked three families who</span></p><p><span style=\"color:#192B3B\">run homestays to tell us about where they live.</span></p></div>","answerHtml":"","sourceSlides":[84],"images":["assets/classroom/images/64991a3eefc608f99f950fc0d18b0d8c6625b3a0ca48acc0ec63e29630fb13d8.png"],"sourceCode":"reading:PPT_733412a4e1bac5e4","material":true}]},{"id":"B2U02LS","book":2,"unit":2,"skill":"LS","title":"UNLOCK 2 LS · Unit 2","activities":[{"id":"B2U02LS-S047","module":"LISTENING 1","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON DETAIL","slide":47,"bookPage":"42","trackIds":["PPT_5b8d0c8544211fb9"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">8  Listen to the interviews and complete the tourist information in the festival</span></p><p><span style=\"font-weight:700;color:#193C78\">brochure.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Place: Sydney, (1) ____</span></p><p><span style=\"color:#192B3B\">Months: (2) ____ and June</span></p><p><span style=\"color:#192B3B\">Activities: learn about (3) ____, for example, new ways to clean the sea; walk through a</span></p><p><span style=\"color:#192B3B\">3D (4) ____ show; listen to a (5) ____ about food</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Place: Tokyo, Japan</span></p><p><span style=\"color:#192B3B\">Month: (6) ____</span></p><p><span style=\"color:#192B3B\">Activities: have a picnic under the cherry trees; eat at food (7) ____; go on the (8) ____ in</span></p><p><span style=\"color:#192B3B\">a boat; visit (9) ____</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Place: Muscat, Oman</span></p><p><span style=\"color:#192B3B\">Months: (10) ____ and (11) ____</span></p><p><span style=\"color:#192B3B\">Activities: watch (12) ____ (basketball and racing); listen to traditional (13) ____; go to a</span></p><p><span style=\"color:#192B3B\">(14) ____ show; eat traditional food</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">Place: Muscat, Oman</span></p><p><span style=\"color:#192B3B\">Months: (10) </span><span style=\"font-weight:700;color:#C00000\">January</span><span style=\"color:#192B3B\"> and (11) </span><span style=\"font-weight:700;color:#C00000\">February</span></p><p><span style=\"color:#192B3B\">Activities: watch (12) </span><span style=\"font-weight:700;color:#C00000\">sports</span><span style=\"color:#192B3B\"> (basketball and racing); listen to traditional (13) </span><span style=\"font-weight:700;color:#C00000\">music</span><span style=\"color:#192B3B\">; go to a</span></p><p><span style=\"color:#192B3B\">(14) </span><span style=\"font-weight:700;color:#C00000\">fashion</span><span style=\"color:#192B3B\"> show; eat traditional food</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Place: Sydney, (1) </span><span style=\"font-weight:700;color:#C00000\">Australia</span></p><p><span style=\"color:#192B3B\">Months: (2) </span><span style=\"font-weight:700;color:#C00000\">May</span><span style=\"color:#192B3B\"> and June</span></p><p><span style=\"color:#192B3B\">Activities: learn about (3) </span><span style=\"font-weight:700;color:#C00000\">nature</span><span style=\"color:#192B3B\">, for example, new ways to clean the sea; walk through a 3D (4) </span><span style=\"font-weight:700;color:#C00000\">art</span><span style=\"color:#192B3B\"> show; listen to a (5) </span><span style=\"font-weight:700;color:#C00000\">talk</span><span style=\"color:#192B3B\"> about food</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Place: Tokyo, Japan</span></p><p><span style=\"color:#192B3B\">Month: (6) </span><span style=\"font-weight:700;color:#C00000\">April</span></p><p><span style=\"color:#192B3B\">Activities: have a picnic under the cherry trees; eat at food (7) </span><span style=\"font-weight:700;color:#C00000\">stalls</span><span style=\"color:#192B3B\">; go on the (8) </span><span style=\"font-weight:700;color:#C00000\">lake</span><span style=\"color:#192B3B\"> in a boat; visit (9) </span><span style=\"font-weight:700;color:#C00000\">museums</span></p></div>","sourceSlides":[47,48,49,50,52,60,61],"images":[],"sourceCode":"L1.8","material":false},{"id":"B2U02LS-S051","module":"LISTENING 1","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON DETAIL","slide":51,"bookPage":"42","trackIds":["PPT_5b8d0c8544211fb9"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">9  Listen again. Write T (true) or F (false) next to the statements below. Then discuss</span></p><p><span style=\"font-weight:700;color:#193C78\">with a partner why the false statements are false.</span></p><p><span style=\"color:#192B3B\">1  The Vivid Sydney festival is only for students. ____</span></p><p><span style=\"color:#192B3B\">2  There aren’t exact dates for the Cherry Blossom Festival. ____</span></p><p><span style=\"color:#192B3B\">3  At the Cherry Blossom Festival, people only look at the flowers. ____</span></p><p><span style=\"color:#192B3B\">4  People can learn about Oman’s culture at Muscat Nights. ____</span></p><p><span style=\"color:#192B3B\">5  Nasrra was able to go to a fashion show at Muscat Nights. ____</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">Exercise 9, 1 The Vivid Sydney festival is only for students. Answer: </span><span style=\"font-weight:700;color:#C00000\">False.</span></p><p><span style=\"color:#192B3B\">Anybody can go to the lectures, see the lights and eat interesting food.</span></p><p><span style=\"color:#192B3B\">Exercise 9, 2 There aren’t exact dates for the Cherry Blossom Festival. Answer: </span><span style=\"font-weight:700;color:#C00000\">True.</span></p><p><span style=\"color:#192B3B\">The actual dates change every year because the celebration happens only when the trees have cherry blossoms.</span></p><p><span style=\"color:#192B3B\">Exercise 9, 3 At the Cherry Blossom Festival, people only look at the flowers. Answer: </span><span style=\"font-weight:700;color:#C00000\">False.</span></p><p><span style=\"color:#192B3B\">People also have a picnic under the trees; there are food stalls and boats to hire on the lake.</span></p><p><span style=\"color:#192B3B\">Exercise 9, 4 People can learn about Oman’s culture at Muscat Nights. Answer: </span><span style=\"font-weight:700;color:#C00000\">True.</span></p><p><span style=\"color:#192B3B\">The festival includes Omani heritage and culture.</span></p><p><span style=\"color:#192B3B\">Exercise 9, 5 Nasrra was able to go to a fashion show at Muscat Nights. Answer: </span><span style=\"font-weight:700;color:#C00000\">False. She has decided to go, but has not gone yet.</span></p><p><span style=\"color:#192B3B\">Her plan is future, not completed.</span></p></div>","sourceSlides":[51,53],"images":[],"sourceCode":"L1.9","material":false},{"id":"B2U02LS-S054","module":"LISTENING 1","title":"PRONUNCIATION FOR LISTENING","subtitle":"","slide":54,"bookPage":"43","trackIds":["PPT_ec22923bcd1d5dba"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">12  Look at the sentence from Listening 1. Which words are important for</span></p><p><span style=\"font-weight:700;color:#193C78\">understanding the sentence? Underline them.</span></p><p><span style=\"color:#192B3B\">I went to a lecture about the sea.</span></p><p><span style=\"color:#192B3B\">13  Listen to the sentence from Exercise 12. Which words are stressed?</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">12 Look at the sentence from Listening 1. Which words are important for understanding the sentence? Underline them.</span></p><p><span style=\"color:#192B3B\">I </span><span style=\"font-weight:700;color:#C00000\">went</span><span style=\"color:#192B3B\"> to a </span><span style=\"font-weight:700;color:#C00000\">lecture</span><span style=\"color:#192B3B\"> about the </span><span style=\"font-weight:700;color:#C00000\">sea</span><span style=\"color:#192B3B\">.</span></p><p><span style=\"color:#192B3B\">These content words are stressed.</span></p></div>","sourceSlides":[54,55],"images":[],"sourceCode":"L1.12-13","material":false},{"id":"B2U02LS-S056","module":"LISTENING 1","title":"PRONUNCIATION FOR LISTENING","subtitle":"","slide":56,"bookPage":"43","trackIds":["PPT_fd35f29335a7295a"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">14  Look at the questions from Listening 1. Underline the stressed words.</span></p><p><span style=\"color:#192B3B\">1  So, what kinds of things do people learn and do here?</span></p><p><span style=\"color:#192B3B\">2  Are there any things you don’t like about it?</span></p><p><span style=\"color:#192B3B\">3  Do you have many people here from other countries?</span></p><p><span style=\"color:#192B3B\">15  Listen and check your answers from Exercise 14.</span></p><p><span style=\"color:#192B3B\">16  Work with a partner. Take turns reading the sentences from Exercise 14. Check if</span></p><p><span style=\"color:#192B3B\">your partner uses the correct stress.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">14 Look at the questions from Listening 1. Underline the stressed words.</span></p><p><span style=\"color:#192B3B\">1 So, </span><span style=\"font-weight:700;color:#C00000\">what</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">kinds</span><span style=\"color:#192B3B\"> of </span><span style=\"font-weight:700;color:#C00000\">things</span><span style=\"color:#192B3B\"> do people </span><span style=\"font-weight:700;color:#C00000\">learn</span><span style=\"color:#192B3B\"> and </span><span style=\"font-weight:700;color:#C00000\">do</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">here</span><span style=\"color:#192B3B\">?</span></p><p><span style=\"color:#192B3B\">Content words and the attention-getter So are stressed.</span></p><p><span style=\"color:#192B3B\">2 Are there any </span><span style=\"font-weight:700;color:#C00000\">things</span><span style=\"color:#192B3B\"> you </span><span style=\"font-weight:700;color:#C00000\">don’t</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">like</span><span style=\"color:#192B3B\"> about it?</span></p><p><span style=\"color:#192B3B\">The negative don’t is important.</span></p><p><span style=\"color:#192B3B\">3 Do you have </span><span style=\"font-weight:700;color:#C00000\">many</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">people</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">here</span><span style=\"color:#192B3B\"> from </span><span style=\"font-weight:700;color:#C00000\">other</span><span style=\"color:#192B3B\"> </span><span style=\"font-weight:700;color:#C00000\">countries</span><span style=\"color:#192B3B\">?</span></p><p><span style=\"color:#192B3B\">Stress the quantity, people, place and origin.</span></p></div>","sourceSlides":[56,57],"images":[],"sourceCode":"L1.14-16","material":false},{"id":"B2U02LS-S080","module":"LISTENING 2","title":"WHILE LISTENING","subtitle":"LISTENING FOR MAIN IDEAS","slide":80,"bookPage":"49","trackIds":["PPT_f38f5acd01155448"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">4  Listen to the conversation between Ali and Paul. Underline eight mistakes in the</span></p><p><span style=\"font-weight:700;color:#193C78\">student notes.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">North American holiday: Independence Day</span></p><p><span style=\"color:#192B3B\">US and England celebrate – everyone thankful</span></p><p><span style=\"color:#192B3B\">family and friends – eat meal together</span></p><p><span style=\"color:#192B3B\">modern meal: turkey, stuffing, potatoes, corn, cranberries, pie</span></p><p><span style=\"color:#192B3B\">differences in food between US and Canada</span></p><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">US</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Canada</span></td></tr><tr><td><span style=\"color:#192B3B\">pumpkin pie: spicy</span><br><span style=\"color:#192B3B\">stuffing: rice or bread</span></td><td><span style=\"color:#192B3B\">pumpkin pie: sweet, whipped cream</span><br><span style=\"color:#192B3B\">stuffing: cornbread, oysters</span></td></tr></tbody></table></div></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">costumes: leaves, autumn vegetables, candles</span></p><p><span style=\"color:#192B3B\">special games: parades, watch sports on TV, no gifts</span></p><p><span style=\"color:#192B3B\">Date: Canadian Thanksgiving in October, American Thanksgiving in November</span></p><p><span style=\"color:#192B3B\">Parades: in Canada: small local parade; in the US: big New York City parade on TV</span></p><p><span style=\"color:#192B3B\">Different ideas for the holiday:</span></p><p><span style=\"color:#192B3B\">Canada: autumn harvest</span></p><p><span style=\"color:#192B3B\">US: autumn harvest and remembering Native Americans helping settlers hunt and grow</span></p><p><span style=\"color:#192B3B\">food</span></p></div><div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">5  Listen to the conversation again and write the correct words on the lines below.</span></p><p><span style=\"color:#192B3B\">1  __________    5  __________</span></p><p><span style=\"color:#192B3B\">2  __________    6  __________</span></p><p><span style=\"color:#192B3B\">3  __________    7  __________</span></p><p><span style=\"color:#192B3B\">4  __________    8  __________</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">North American holiday: </span><span style=\"font-weight:700;color:#C00000\">Thanksgiving</span></p><p><span style=\"color:#192B3B\">US and </span><span style=\"font-weight:700;color:#C00000\">Canada</span><span style=\"color:#192B3B\"> celebrate – everyone thankful</span></p><p><span style=\"color:#192B3B\">family and friends – eat meal together</span></p><p><span style=\"font-weight:700;color:#C00000\">traditional meal</span><span style=\"color:#192B3B\">: turkey, stuffing, potatoes, corn, cranberries, pie</span></p><p><span style=\"color:#192B3B\">differences in food between US and Canada</span></p><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#C00000\">Canada</span></td><td><span style=\"font-weight:700;color:#C00000\">US</span></td></tr><tr><td><span style=\"color:#192B3B\">pumpkin pie: spicy</span><br><span style=\"color:#192B3B\">stuffing: rice or bread</span></td><td><span style=\"color:#192B3B\">pumpkin pie: sweet, whipped cream</span><br><span style=\"color:#192B3B\">stuffing: cornbread, oysters</span></td></tr></tbody></table></div></div><div class=\"source-part\"><p><span style=\"font-weight:700;color:#C00000\">decorations:</span><span style=\"color:#192B3B\"> leaves, autumn vegetables, candles</span></p><p><span style=\"font-weight:700;color:#C00000\">special activities:</span><span style=\"color:#192B3B\"> parades, watch sports on TV, no gifts</span></p><p><span style=\"color:#192B3B\">Date: Canadian Thanksgiving in October, American Thanksgiving in November</span></p><p><span style=\"color:#192B3B\">Parades: in Canada: small local parade; in the US: big New York City parade on TV</span></p><p><span style=\"font-weight:700;color:#C00000\">Different reasons</span><span style=\"color:#192B3B\"> for the holiday:</span></p><p><span style=\"color:#192B3B\">Canada: autumn harvest</span></p><p><span style=\"color:#192B3B\">US: autumn harvest and remembering Native Americans helping settlers hunt and grow</span></p><p><span style=\"color:#192B3B\">food</span></p></div>","sourceSlides":[80,81,82,83,84,85],"images":[],"sourceCode":"L2.4-5","material":false},{"id":"B2U02LS-S086","module":"LISTENING 2","title":"WHILE LISTENING","subtitle":"LISTENING FOR DETAIL","slide":86,"bookPage":"49","trackIds":["PPT_f38f5acd01155448"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">6  Work in groups. Your teacher will give you a simple version of the conversation</span></p><p><span style=\"font-weight:700;color:#193C78\">between Ali and Paul in a jumbled order. Put the conversation in the correct order.</span></p><p><span style=\"color:#192B3B\">7  Listen to the conversation again. Check your answer to Exercise 6.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">A  Paul: Well, most people get together with family and friends and have a big meal.</span></p><p><span style=\"color:#192B3B\">B  Ali: What do they eat?</span></p><p><span style=\"color:#192B3B\">C  Paul: Hmm. Well, I like Independence Day in the US because of the fireworks and</span></p><p><span style=\"color:#192B3B\">New Year’s Eve often has fireworks, too. But I think the best holiday is Thanksgiving.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">D  Ali: That all sounds delicious. Are there any special decorations for Thanksgiving?</span></p><p><span style=\"color:#192B3B\">E  Paul: Everyone has something to be thankful for, so everyone can celebrate it.</span></p><p><span style=\"color:#192B3B\">F  Ali: Which is the best North American holiday or celebration?</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">G  Paul: Well, people don’t really give gifts, but there are some special activities. For</span></p><p><span style=\"color:#192B3B\">example, both countries celebrate with parades with marching bands and people in</span></p><p><span style=\"color:#192B3B\">costumes.</span></p><p><span style=\"color:#192B3B\">H  Ali: How do people celebrate it?</span></p><p><span style=\"color:#192B3B\">I  Paul: They usually eat a traditional meal. This is usually a delicious turkey with stuffing</span></p><p><span style=\"color:#192B3B\">for the main dish. Most traditional Thanksgiving meals have food which is from the</span></p><p><span style=\"color:#192B3B\">Americas, like potatoes, corn and cranberries. For dessert, they eat pumpkin pie, but</span></p><p><span style=\"color:#192B3B\">some people prefer different kinds of pie, like apple.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">J  Ali: Do people give gifts or do some special activities?</span></p><p><span style=\"color:#192B3B\">K  Ali: Why do you like Thanksgiving?</span></p><p><span style=\"color:#192B3B\">L  Paul: Well, people often decorate their dinner tables and homes with things such as</span></p><p><span style=\"color:#192B3B\">colourful leaves, autumn vegetables and candles.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">The complete conversation in the correct order:</span></p><p><span style=\"font-weight:700;color:#C00000\">1 (F)</span><span style=\"color:#192B3B\"> Ali: Which is the best North American holiday or celebration?</span></p><p><span style=\"font-weight:700;color:#C00000\">2 (C)</span><span style=\"color:#192B3B\"> Paul: Hmm. Well, I like Independence Day in the US because of the fireworks and New Year’s Eve often has fireworks, too. But I think the best holiday is Thanksgiving.</span></p><p><span style=\"font-weight:700;color:#C00000\">3 (K)</span><span style=\"color:#192B3B\"> Ali: Why do you like Thanksgiving?</span></p><p><span style=\"font-weight:700;color:#C00000\">4 (E)</span><span style=\"color:#192B3B\"> Paul: Everyone has something to be thankful for, so everyone can celebrate it.</span></p><p><span style=\"font-weight:700;color:#C00000\">5 (H)</span><span style=\"color:#192B3B\"> Ali: How do people celebrate it?</span></p></div><div class=\"source-part\"><p><span style=\"color:#193C78\">The complete conversation in the correct order:</span></p><p><span style=\"font-weight:700;color:#C00000\">6 (A)</span><span style=\"color:#192B3B\"> Paul: Well, most people get together with family and friends and have a big meal.</span></p><p><span style=\"font-weight:700;color:#C00000\">7 (B)</span><span style=\"color:#192B3B\"> Ali: What do they eat?</span></p><p><span style=\"font-weight:700;color:#C00000\">8 (I)</span><span style=\"color:#192B3B\"> Paul: They usually eat a traditional meal. This is usually a delicious turkey with stuffing for the main dish. Most traditional Thanksgiving meals have food which is from the Americas, like potatoes, corn and cranberries. For dessert, they eat pumpkin pie, but some people prefer different kinds of pie, like apple.</span></p><p><span style=\"font-weight:700;color:#C00000\">9 (D)</span><span style=\"color:#192B3B\"> Ali: That all sounds delicious. Are there any special decorations for Thanksgiving?</span></p></div><div class=\"source-part\"><p><span style=\"color:#193C78\">The complete conversation in the correct order:</span></p><p><span style=\"font-weight:700;color:#C00000\">10 (L)</span><span style=\"color:#192B3B\"> Paul: Well, people often decorate their dinner tables and homes with things such as colourful leaves, autumn vegetables and candles.</span></p><p><span style=\"font-weight:700;color:#C00000\">11 (J)</span><span style=\"color:#192B3B\"> Ali: Do people give gifts or do some special activities?</span></p><p><span style=\"font-weight:700;color:#C00000\">12 (G)</span><span style=\"color:#192B3B\"> Paul: Well, people don’t really give gifts, but there are some special activities. For example, both countries celebrate with parades with marching bands and people in costumes.</span></p></div>","sourceSlides":[86,87,88,89,90,91,92,93],"images":[],"sourceCode":"L2.6-7","material":false}]},{"id":"B2U02RW","book":2,"unit":2,"skill":"RW","title":"UNLOCK 2 RW · Unit 2","activities":[{"id":"B2U02RW-S050","module":"READING 1","title":"PREPARING TO READ","subtitle":"PREVIEWING A TEXT","slide":50,"bookPage":"41","trackIds":["PPT_7fe3e7ea6da39fe9"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1  In Mexico, people often have piñatas at their parties. Parents put chocolates and other</span></p><p><span style=\"color:#192B3B\">sweets inside the piñata and hang it on a tree. Children hit the piñata with a stick. It</span></p><p><span style=\"color:#192B3B\">breaks and the sweets fall out onto the ground.</span></p></div>","answerHtml":"","sourceSlides":[50,108],"images":[],"sourceCode":"reading:PPT_7fe3e7ea6da39fe9","material":true},{"id":"B2U02RW-S079","module":"READING 2","title":"WHILE READING","subtitle":"READING FOR MAIN IDEAS","slide":79,"bookPage":"44","trackIds":["PPT_88e42fe186792f3a"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1  One of the most important festivals in Oman is Muscat Nights. The festival lasts for</span></p><p><span style=\"color:#192B3B\">about one month and takes place in pan></td></tr></tbody></table></div></div>","answerHtml":"<div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Main ideas</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Additional details</span></td></tr><tr><td><span style=\"color:#192B3B\">Scientists looked, in particular, at how computers affect our (1) </span><span style=\"font-weight:700;color:#C00000\">memory</span><span style=\"color:#192B3B\">.</span></td><td><span style=\"color:#192B3B\">They wanted to find out if computers have changed the way we remember (6) </span><span style=\"font-weight:700;color:#C00000\">information</span><span style=\"color:#192B3B\"> and knowledge.</span></td></tr></tbody></table></div></div><div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Main ideas</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Additional details</span></td></tr><tr><td><span style=\"color:#192B3B\">What we think when we are asked (2) </span><span style=\"font-weight:700;color:#C00000\">difficult</span><span style=\"color:#192B3B\"> questions has changed due to (3) </span><span style=\"font-weight:700;color:#C00000\">websites</span><span style=\"color:#192B3B\"> like Google™.</span></td><td><span style=\"color:#192B3B\">In the past, people tried to think of the (7) </span><span style=\"font-weight:700;color:#C00000\">answer</span><span style=\"color:#192B3B\"> to the question.</span><br><span style=\"color:#192B3B\">Now people think about (8) </span><span style=\"font-weight:700;color:#C00000\">how</span><span style=\"color:#192B3B\"> to find the answer. e.g. They think about what they might (9) </span><span style=\"font-weight:700;color:#C00000\">put</span><span style=\"color:#192B3B\"> into Google™.</span></td></tr></tbody></table></div></div><div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Main ideas</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Additional details</span></td></tr><tr><td><span style=\"color:#192B3B\">The type of (4) </span><span style=\"font-weight:700;color:#C00000\">information</span><span style=\"color:#192B3B\"> we remember has changed.</span></td><td><span style=\"color:#192B3B\">People now forget (10) </span><span style=\"font-weight:700;color:#C00000\">facts</span><span style=\"color:#192B3B\">, especially if they know the information will be saved in a computer.</span><br><span style=\"color:#192B3B\">They remember the (11) </span><span style=\"font-weight:700;color:#C00000\">location</span><span style=\"color:#192B3B\"> of the fact.</span></td></tr></tbody></table></div></div><div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Main ideas</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Additional details</span></td></tr><tr><td><span style=\"color:#192B3B\">Computers are not making us stupid, but they are making us (5) </span><span style=\"font-weight:700;color:#C00000\">lazy</span><span style=\"color:#192B3B\">.</span></td><td><span style=\"color:#192B3B\">We are spending time remembering where to (12) </span><span style=\"font-weight:700;color:#C00000\">find</span><span style=\"color:#192B3B\"> information but not on remembering the information itself.</span></td></tr></tbody></table></div></div>","sourceSlides":[108,109,110,111,112,113,114,115,116],"images":[],"sourceCode":"L2.7","material":false},{"id":"B2U03LS-S197","module":"PREPARATION FOR SPEAKING","title":"GIVING ADDITIONAL AND CONTRASTING INFORMATION","subtitle":"","slide":197,"bookPage":"75","trackIds":["PPT_209560db93648036"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">2  Listen and check your answers to Exercise 1. Remember, some sentences have</span></p><p><span style=\"font-weight:700;color:#193C78\">more than one possible answer. Make a note of what you hear.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">1 Work with a partner. Complete the sentences with the words from the box. In some items, more than one answer is possible.</span></p><p><span style=\"color:#192B3B\">3 … it seems that people now forget facts, especially if they know the information will be saved in a file. </span><span style=\"font-weight:700;color:#C00000\">On the other hand / However</span><span style=\"color:#192B3B\">, an advantage is they remember the location of the fact: in other words, where to find it.</span></p><p><span style=\"color:#192B3B\">Teacher Book p.37 accepts these alternatives in the exercise. The recording says On the other hand in 3 and but in 4. In your own writing, check the punctuation required by however.</span></p><p><span style=\"color:#192B3B\">4 In conclusion, it seems that computers are not making us stupid, </span><span style=\"font-weight:700;color:#C00000\">but / however</span><span style=\"color:#192B3B\"> they are making us lazy!</span></p><p><span style=\"color:#192B3B\">Teacher Book p.37 accepts these alternatives in the exercise. The recording says On the other hand in 3 and but in 4. In your own writing, check the punctuation required by however.</span></p></div>","sourceSlides":[197,199],"images":[],"sourceCode":"PFS.2","material":false}]},{"id":"B2U03RW","book":2,"unit":3,"skill":"RW","title":"UNLOCK 2 RW · Unit 3","activities":[{"id":"B2U03RW-S057","module":"READING 1","title":"PREPARING TO READ","subtitle":"UNDERSTANDING KEY VOCABULARY","slide":57,"bookPage":"63","trackIds":["PPT_11b123e08f50257b"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">Do you know how websites remember your sign-in information or just give you a</span></p><p><span style=\"color:#192B3B\">personal feel? The answer is internet cookies. A cookie is a small piece of information</span></p><p><span style=\"color:#192B3B\">that a website puts on your computer. Some cookies are needed for websites to work</span></p><p><span style=\"color:#192B3B\">properly. For example, they </span><span style=\"font-weight:700;color:#7E398A\">collect</span><span style=\"color:#192B3B\"> and remember things about you, like what language</span></p><p><span style=\"color:#192B3B\">you prefer. Other cookies are used by companies to try to sell you things.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">The simple job of a cookie is to </span><span style=\"font-weight:700;color:#7E398A\">record</span><span style=\"color:#192B3B\"> your online activities. A website owner uses a</span></p><p><span style=\"color:#192B3B\">cookie, called a first-party cookie. This is a necessary cookie. It keeps you signed in and</span></p><p><span style=\"color:#192B3B\">follows you as you use the website. For example, if you shop online, a cookie remembers</span></p><p><span style=\"color:#192B3B\">what you put into your shopping basket. When you visit the website again, it knows that</span></p><p><span style=\"color:#192B3B\">you are the same person. The website feels more personal and is quicker to use</span></p><p><span style=\"color:#192B3B\">because the cookie knows the changes you made to the website when you visited it</span></p><p><span style=\"color:#192B3B\">before.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Some cookies belong to someone other than the website owner, usually an advertising</span></p><p><span style=\"color:#192B3B\">company. These are called third-party cookies. People want to use </span><span style=\"font-weight:700;color:#7E398A\">free</span><span style=\"color:#192B3B\"> websites, so</span></p><p><span style=\"color:#192B3B\">website owners make money by ‘renting’ website space to companies. Third-party</span></p><p><span style=\"color:#192B3B\">cookies can follow you between websites and </span><span style=\"font-weight:700;color:#7E398A\">record</span><span style=\"color:#192B3B\"> your browsing history. For example,</span></p><p><span style=\"color:#192B3B\">you browsed the internet one day for a new smartphone. You looked at some different</span></p><p><span style=\"color:#192B3B\">websites but decided not to buy a phone. A few days later, you see </span><span style=\"font-weight:700;color:#7E398A\">adverts</span><span style=\"color:#192B3B\"> for</span></p><p><span style=\"color:#192B3B\">smartphones on many websites you visit. You see targeted </span><span style=\"font-weight:700;color:#7E398A\">adverts</span><span style=\"color:#192B3B\"> because a third-party</span></p><p><span style=\"color:#192B3B\">cookie is on your computer.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">If you use websites that share information with a social media account then you might</span></p><p><span style=\"color:#192B3B\">receive a social media cookie. The main job of social media cookies, like third-party</span></p><p><span style=\"color:#192B3B\">cookies, is to decide what </span><span style=\"font-weight:700;color:#7E398A\">adverts</span><span style=\"color:#192B3B\"> are best for you. Social media cookies can build a</span></p><p><span style=\"color:#192B3B\">profile of you by collecting information about your habits and </span><span style=\"font-weight:700;color:#7E398A\">interests</span><span style=\"color:#192B3B\">, even if you do not</span></p><p><span style=\"color:#192B3B\">have a social media account – for example, if you go to a news website and click on a</span></p><p><span style=\"color:#192B3B\">video link from a social media company. If you do not agree to receive social media</span></p><p><span style=\"color:#192B3B\">cookies, then some parts of the website, like video sharing, may not work.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Cookies cannot steal passwords but there are </span><span style=\"font-weight:700;color:#7E398A\">security</span><span style=\"color:#192B3B\"> problems. For example, cookie</span></p><p><span style=\"color:#192B3B\">scraping is when a hacker steals information from a cookie. This information gives the</span></p><p><span style=\"color:#192B3B\">hacker your </span><span style=\"font-weight:700;color:#7E398A\">secret</span><span style=\"color:#192B3B\"> log-in information and the hacker can sign in to a website as you. You</span></p><p><span style=\"color:#192B3B\">can, however, reduce the number of cookies on your computer and keep your personal</span></p><p><span style=\"color:#192B3B\">information more private. Website owners must ask you to accept cookies when you use</span></p><p><span style=\"color:#192B3B\">their website, so you can choose not to accept advertising or other third-party cookies.</span></p><p><span style=\"color:#192B3B\">You can also delete cookies saved in your browser history.</span></p></div>","answerHtml":"","sourceSlides":[57,58,59,60,61,65,66,67,70,71,72,73,74,81,82,83,84,85,89,90,91,92,93],"images":[],"sourceCode":"reading:PPT_11b123e08f50257b","material":true},{"id":"B2U03RW-S124","module":"READING 2","title":"WHILE READING","subtitle":"READING FOR MAIN IDEAS","slide":124,"bookPage":"67","trackIds":["PPT_1e6f9af13fc0d19b"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">4  Work with your partner from Exercise 3. Tell each other the advantages and</span></p><p><span style=\"font-weight:700;color:#193C78\">disadvantages mentioned in the essay. Then answer the questions together.</span></p><p><span style=\"color:#192B3B\">1  Can you guess the missing words in the text?</span></p><p><span style=\"color:#192B3B\">2  Can you think of a suitable title for the essay?</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Do ______ affect our children negatively? Today, our children spend more and more time</span></p><p><span style=\"color:#192B3B\">online. Many children spend a lot of their free time playing ______ on the internet, on</span></p><p><span style=\"color:#192B3B\">______ systems or on their mobile devices. In the UK, 99% of kids aged 8 to 15 play</span></p><p><span style=\"color:#192B3B\">______ every week, and children as young as five play ______ regularly. This</span></p><p><span style=\"color:#192B3B\">information tells us that the benefits and dangers of ______ must be carefully</span></p><p><span style=\"color:#192B3B\">considered.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">For many people, ______ are fun and educational. They have bright lights, funny</span></p><p><span style=\"color:#192B3B\">cartoons and exciting stories. Everywhere you look, you can see children playing these</span></p><p><span style=\"color:#192B3B\">______. They play on buses and trains, in restaurants and even at school. ______ also</span></p><p><span style=\"color:#192B3B\">make you think in a creative way and you have to move your hands and eyes quickly.</span></p><p><span style=\"color:#192B3B\">This can improve the way that a child’s brain works. ______ also make children use their</span></p><p><span style=\"color:#192B3B\">imagination. The player has to do many creative things, like draw, tell stories and build</span></p><p><span style=\"color:#192B3B\">things. ______ are also a good way to teach children about technology because they can</span></p><p><span style=\"color:#192B3B\">learn how computers and other devices work while they play.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">However, a recent study suggests that ______ can also be bad for children. First,</span></p><p><span style=\"color:#192B3B\">children can download many ______ for free. They don’t need money, so they don’t need</span></p><p><span style=\"color:#192B3B\">to ask their parents if they can download the ______. This means that parents often don’t</span></p><p><span style=\"color:#192B3B\">know if their children are playing violent or scary ______. Second, many children spend</span></p><p><span style=\"color:#192B3B\">too much time playing ______ on computers, smartphones and tablets and this can lead</span></p><p><span style=\"color:#192B3B\">to health problems – children who spend too much time on the computer and don’t</span></p><p><span style=\"color:#192B3B\">exercise can become overweight. Third, if children spend too much time playing ______</span></p><p><span style=\"color:#192B3B\">instead of doing homework, they can have problems at school and get bad grades.</span></p><p><span style=\"color:#192B3B\">Finally, ______ can affect children’s social skills. Playing and working with friends is very</span></p><p><span style=\"color:#192B3B\">important for children and it teaches them how to talk to other people. If children spend</span></p><p><span style=\"color:#192B3B\">too much time playing ______ by themselves, they might not learn how to play with their</span></p><p><span style=\"color:#192B3B\">friends.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">In conclusion, it seems clear that ______ have some advantages and some</span></p><p><span style=\"color:#192B3B\">disadvantages. On the one hand, they are fun and have many educational benefits for</span></p><p><span style=\"color:#192B3B\">children. On the other hand, they can cause problems with children’s health and social</span></p><p><span style=\"color:#192B3B\">skills. It is up to parents to know what ______ their children are playing and how much</span></p><p><span style=\"color:#192B3B\">time they spend on them. Parents should also make sure their children get enough</span></p><p><span style=\"color:#192B3B\">exercise and spend time with other children.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">Work with your partner from Exercise 3. Tell each other the advantages and disadvantages mentioned in the essay. Then answer the questions together. 1 Can you guess the missing words in the text? 2 Can you think of a suitable title for the essay?</span></p><p><span style=\"color:#192B3B\">1. Can you guess the missing words in the text?</span><br><span style=\"color:#192B3B\">Answer: </span><span style=\"font-weight:700;color:#C00000\">video games / games / video game</span><span style=\"color:#192B3B\">.</span></p><p><span style=\"color:#192B3B\">The clues include playing online, game systems, creative tasks, violence and time spent playing.</span></p><p><span style=\"color:#192B3B\">2. Can you think of a suitable title for the essay?</span><br><span style=\"color:#192B3B\">Possible answer: </span><span style=\"font-weight:700;color:#C00000\">Video games for kids: good or bad?</span></p><p><span style=\"color:#192B3B\">The essay discusses both benefits and risks for children.</span></p></div>","sourceSlides":[124,125,126,127,128,129],"images":[],"sourceCode":"reading:PPT_1e6f9af13fc0d19b","material":true}]},{"id":"B2U04LS","book":2,"unit":4,"skill":"LS","title":"UNLOCK 2 LS · Unit 4","activities":[{"id":"B2U04LS-S030","module":"LISTENING 1","title":"PRONUNCIATION FOR LISTENING","subtitle":"","slide":30,"bookPage":"84","trackIds":["PPT_6ea4033e912e01a5"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">1  Listen to the dialogues. Write I (interested) or N (not interested) for Speaker B.</span></p><p><span style=\"color:#192B3B\">1 A: Did you know the number of trees in the world is increasing?</span></p><p><span style=\"color:#192B3B\">B: Is it? _____</span></p><p><span style=\"color:#192B3B\">2 A: I got a better job last week.</span></p><p><span style=\"color:#192B3B\">B: Really? Congratulations! _____</span></p><p><span style=\"color:#192B3B\">3 A: The weather got really cold, didn’t it?</span></p><p><span style=\"color:#192B3B\">B: I suppose so. _____</span></p><p><span style=\"color:#192B3B\">4 A: Thanks for inviting me to your party!</span></p><p><span style=\"color:#192B3B\">B: You’re welcome. It’ll be nice to see you! _____</span></p><p><span style=\"color:#192B3B\">5 A: Dinner was great.</span></p><p><span style=\"color:#192B3B\">B: Good. Glad you liked it. _____</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">Listening for interest</span></p><p><span style=\"color:#192B3B\">1 A: Did you know the number of trees in the world is increasing?</span><br><span style=\"color:#192B3B\">B: Is it? </span><span style=\"font-weight:700;color:#C00000\">N</span><span style=\"color:#192B3B\"> (not interested).</span></p><p><span style=\"color:#192B3B\">2 A: I got a better job last week.</span><br><span style=\"color:#192B3B\">B: Really? Congratulations! </span><span style=\"font-weight:700;color:#C00000\">I</span><span style=\"color:#192B3B\"> (interested).</span></p><p><span style=\"color:#192B3B\">3 A: The weather got really cold, didn’t it?</span><br><span style=\"color:#192B3B\">B: I suppose so. </span><span style=\"font-weight:700;color:#C00000\">N</span><span style=\"color:#192B3B\"> (not interested).</span></p></div><div class=\"source-part\"><p><span style=\"color:#193C78\">Listening for interest</span></p><p><span style=\"color:#192B3B\">4 A: Thanks for inviting me to your party!</span><br><span style=\"color:#192B3B\">B: You’re welcome. It’ll be nice to see you! </span><span style=\"font-weight:700;color:#C00000\">I</span><span style=\"color:#192B3B\"> (interested).</span></p><p><span style=\"color:#192B3B\">5 A: Dinner was great.</span><br><span style=\"color:#192B3B\">B: Good. Glad you liked it. </span><span style=\"font-weight:700;color:#C00000\">N</span><span style=\"color:#192B3B\"> (not interested).</span></p></div>","sourceSlides":[30,31,32],"images":[],"sourceCode":"L1.1","material":false},{"id":"B2U04LS-S053","module":"LISTENING 1","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON MAIN IDEAS" e=\"color:#192B3B\">Frequent fires destroy Brazilian rainforest —</span></p><p><span style=\"color:#192B3B\">animals and local villages in danger.</span></p><p><span style=\"color:#192B3B\">#forestfires #globalwarming #rainforest</span></p><p><span style=\"color:#192B3B\">#climatechange</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">The purple frog from the Western Ghats</span></p><p><span style=\"color:#192B3B\">rainforests is in danger. Protect the Indian</span></p><p><span style=\"color:#192B3B\">rainforest.</span></p><p><span style=\"color:#192B3B\">#purplefrog #India #rainforest #WesternGhats</span></p><p><span style=\"color:#192B3B\">#climatechange #globalwarming</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Thousands of people in Pakistan lose their homes</span></p><p><span style=\"color:#192B3B\">because of heavy floods. Rising water levels</span></p><p><span style=\"color:#192B3B\">destroy local businesses and factories.</span></p><p><span style=\"color:#192B3B\">#floods #Pakistan #globalwarming</span></p><p><span style=\"color:#192B3B\">#climatechange</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#193C78\">Listen to the news report and check the main ideas you chose in Exerci</span></p><p><span style=\"color:#192B3B\">Which main ideas and social media post does the news report support?</span><br><span style=\"color:#192B3B\">Main ideas 2, 4 and 5: </span><span style=\"font-weight:700;color:#C00000\">effects on animals</span><span style=\"color:#192B3B\">, </span><span style=\"font-weight:700;color:#C00000\">changes to rainforests</span><span style=\"color:#192B3B\">, and </span><span style=\"font-weight:700;color:#C00000\">the need to protect rainforest animals</span><span style=\"color:#192B3B\">.</span><br><span style=\"font-weight:700;color:#C00000\">Post c: the purple frog in India.</span></p></div>","sourceSlides":[102,103,104,105,106,107],"images":[],"sourceCode":"L2.7","material":false},{"id":"B2U04LS-S113","module":"LISTENING 2","title":"POST-LISTENING","subtitle":"LISTENING FOR DETAIL","slide":113,"bookPage":"94","trackIds":["PPT_0387157f77ff515c"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">9  Exchange your questions with another pair of students. Listen again and answer</span></p><p><span style=\"font-weight:700;color:#193C78\">the questions. Check each other’s answers.</span></p></div>","answerHtml":"","sourceSlides":[113],"images":[],"sourceCode":"L2.9","material":false,"teachingNote":"本项为听音、模仿或同伴表达活动；可展开原文对照录音，按题目要求讲评。"},{"id":"B2U04LS-S208","module":"PREPARATION FOR SPEAKING","title":"LINKING WORDS TO EXPLAIN CAUSE AND EFFECT","subtitle":"","slide":208,"bookPage":"98","trackIds":["PPT_0d4a099bcc07297d"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">1  Listen and complete the sentences with the words and phrases you hear.</span></p><p><span style=\"color:#192B3B\">1 It is more difficult to work in high humidity, _____ our concentration drops.</span></p><p><span style=\"color:#192B3B\">2 People have more energy in sunny weather. _____, they can get a lot done if the sun is</span></p><p><span style=\"color:#192B3B\">shining.</span></p><p><span style=\"color:#192B3B\">3 Some countries are really hot and don’t get much rain. _____ there isn’t enough water</span></p><p><span style=\"color:#192B3B\">for people to drink.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">1  Listen and complete the sentences with the words and phrases you hear.</span></p><p><span style=\"color:#192B3B\">1 It is more difficult to work in high humidity, </span><span style=\"font-weight:700;color:#C00000\">so</span><span style=\"color:#192B3B\"> our concentration drops.</span></p><p><span style=\"color:#192B3B\">2 People have more energy in sunny weather. </span><span style=\"font-weight:700;color:#C00000\">Therefore</span><span style=\"color:#192B3B\">, they can get a lot done if the sun is</span></p><p><span style=\"color:#192B3B\">shining.</span></p><p><span style=\"color:#192B3B\">3 Some countries are really hot and don’t get much rain. </span><span style=\"font-weight:700;color:#C00000\">As a result,</span><span style=\"color:#192B3B\"> there isn’t enough water</span></p><p><span style=\"color:#192B3B\">for people to drink.</span></p></div><div class=\"source-part\"><p><span style=\"color:#193C78\">Work with a partner. Look at the sentences in Exercise 1. Find the cau</span></p><p><span style=\"color:#192B3B\">1 It is more difficult to work in high humidity, so our concentration drops.</span><br><span style=\"color:#192B3B\">Cause: </span><span style=\"font-weight:700;color:#C00000\">difficulty working in high humidity</span><span style=\"color:#192B3B\">.</span><br><span style=\"color:#192B3B\">Effect: </span><span style=\"font-weight:700;color:#C00000\">a drop in concentration</span><span style=\"color:#192B3B\">.</span></p><p><span style=\"color:#192B3B\">2 People have more energy in sunny weather. </span><br><span style=\"color:#192B3B\">Therefore, they can get a lot done if the sun is shining.</span><br><span style=\"color:#192B3B\">Cause: </span><span style=\"font-weight:700;color:#C00000\">more energy.</span><br><span style=\"color:#192B3B\">Effect: </span><span style=\"font-weight:700;color:#C00000\">getting a lot done.</span></p></div><div class=\"source-part\"><p><span style=\"color:#193C78\">Work with a partner. Look at the sentences in Exercise 1. Find the cau</span></p><p><span style=\"color:#192B3B\">3 Some countries are really hot and don’t get much rain. </span><br><span style=\"color:#192B3B\">As a result, there isn’t enough water for people to drink.</span><br><span style=\"color:#192B3B\">Cause: </span><span style=\"font-weight:700;color:#C00000\">heat and little rain.</span><br><span style=\"color:#192B3B\">Effect: </span><span style=\"font-weight:700;color:#C00000\">not enough drinking water.</span></p></div><div class=\"source-part\"><p><span style=\"color:#193C78\">Work with a partner. Try to think of a different effect for each cause</span></p><p><span style=\"color:#192B3B\">1 Think of another effect of difficulty working in high humidity.</span><br><span style=\"color:#192B3B\">Possible answer: </span><span style=\"font-weight:700;color:#C00000\">People may take more breaks.</span></p><p><span style=\"color:#192B3B\">2 Think of another effect of having more energy in sunny weather.</span><br><span style=\"color:#192B3B\">Possible answer: </span><span style=\"font-weight:700;color:#C00000\">People may spend more time doing outdoor activities.</span></p><p><span style=\"color:#192B3B\">3 Think of another effect of heat and little rain.</span><br><span style=\"color:#192B3B\">Possible answer: </span><span style=\"font-weight:700;color:#C00000\">Farmers may need more irrigation water.</span></p></div>","sourceSlides":[208,209,211,212,214,215],"images":[],"sourceCode":"PFS.1","material":false}]},{"id":"B2U04RW","book":2,"unit":4,"skill":"RW","title":"UNLOCK 2 RW · Unit 4","activities":[{"id":"B2U04RW-S068","module":"READING 1","title":"PREPARING TO READ","subtitle":"USING YOUR KNOWLEDGE","slide":68,"bookPage":"85","trackIds":["PPT_e0392ecab36b7ddc"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">Listen to the complete article after checking the missing topic sentences.</span></p><p><span style=\"color:#192B3B\">The recording includes the topic sentences for paragraphs 2–6.</span></p><figure><img src=\"assets/classroom/images/9ed669a71cf67a7e26e8b4aa1b8ae3bc966b1b019dd1acaca440d76388223b5d.png\" alt=\"READING 1 教材配图\"></figure></div>","answerHtml":"","sourceSlides":[68],"images":["assets/classroom/images/9ed669a71cf67a7e26e8b4aa1b8ae3bc966b1b019dd1acaca440d76388223b5d.png"],"sourceCode":"reading:PPT_e0392ecab36b7ddc","material":true},{"id":"B2U04RW-S106","module":"READING 2","title":"DISCUSSION","subtitle":"SYNTHESIZING","slide":106,"bookPage":"89","trackIds":["PPT_fe74950e306c8aee"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">How to stay alive in the Sahara Desert</span></p><p><span style=\"color:#192B3B\">Euan Barr</span></p><p><span style=\"color:#192B3B\">Paragraph 1</span></p><p><span style=\"color:#192B3B\">Can you imagine a sea of sand three times bigger than India? This is the Sahara Desert,</span></p><p><span style=\"color:#192B3B\">the largest hot desert in the world. It covers 11 countries in North Africa and is over 9</span></p><p><span style=\"color:#192B3B\">million square kilometres. That’s more than 25% of Africa.</span></p></div>","answerHtml":"","sourceSlides":[106,118,133],"images":[],"sourceCode":"reading:PPT_fe74950e306c8aee","material":true}]},{"id":"B2U05LS","book":2,"unit":5,"skill":"LS","title":"UNLOCK 2 LS · Unit 5","activities":[{"id":"B2U05LS-S030","module":"LISTENING 1","title":"PRONUNCIATION FOR LISTENING","subtitle":"","slide":30,"bookPage":"106","trackIds":["PPT_6fd93a8c4baaf5d1"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">2  Listen to the sentences in Exercise 1. Then answer the questions.</span></p><p><span style=\"color:#192B3B\">1  Which words does the speaker stress most strongly in each sentence?</span></p><p><span style=\"color:#192B3B\">2  Does the intonation go up or down at the end of the sentence?</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1 Which words does the speaker stress most strongly in each sentence?</span><br><span style=\"color:#192B3B\">Both the incorrect and correct information: </span><span style=\"font-weight:700;color:#C00000\">Rosso / Rosson</span><span style=\"color:#192B3B\">; </span><span style=\"font-weight:700;color:#C00000\">golf / tennis</span><span style=\"color:#192B3B\">; </span><span style=\"font-weight:700;color:#C00000\">6:00 / 6:30</span><span style=\"color:#192B3B\">; </span><span style=\"font-weight:700;color:#C00000\">Drama / Gymnastics</span><span style=\"color:#192B3B\">; </span><span style=\"font-weight:700;color:#C00000\">Colombia / Brazil</span><span style=\"color:#192B3B\">.</span></p><p><span style=\"color:#192B3B\">The contrasting words carry strong stress in Track 5.1.</span></p><p><span style=\"color:#192B3B\">2 Does the intonation go up or down at the end of the sentence?</span><br><span style=\"color:#192B3B\">It goes </span><span style=\"font-weight:700;color:#C00000\">down</span><span style=\"color:#192B3B\">.</span></p><p><span style=\"color:#192B3B\">Listen to the falling intonation at the end of each sentence.</span></p></div>","sourceSlides":[30,32],"images":[],"sourceCode":"L1.2","material":false},{"id":"B2U05LS-S050","module":"LISTENING 1","title":"WHILE LISTENING","subtitle":"LISTENING FOR MAIN IDEAS","slide":50,"bookPage":"107","trackIds":["PPT_d7d40bf5985e4eed"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">7  Listen to a Sports Science student give a presentation about a project. Circle the</span></p><p><span style=\"font-weight:700;color:#193C78\">correct answer. Then compare your answers with a partner.</span></p><p><span style=\"color:#192B3B\">1  This report is mainly about unusual sports and …</span></p><p><span style=\"color:#192B3B\">a  where people do them.</span></p><p><span style=\"color:#192B3B\">b  how people do them.</span></p><p><span style=\"color:#192B3B\">2  Some of these sports combine …</span></p><p><span style=\"color:#192B3B\">a  team and individual sports.</span></p><p><span style=\"color:#192B3B\">b  different sports activities and equipment.</span></p><p><span style=\"color:#192B3B\">3  The speaker talks about …</span></p><p><span style=\"color:#192B3B\">a  how to become a champion in each sport.</span></p><p><span style=\"color:#192B3B\">b  what intelligent players do in some sports.</span></p></div><div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">7  Listen to a Sports Science student give a presentation about a project. Circle the</span></p><p><span style=\"font-weight:700;color:#193C78\">correct answer. Then compare your answers with a partner.</span></p><p><span style=\"color:#192B3B\">4  The speaker doesn’t discuss …</span></p><p><span style=\"color:#192B3B\">a  the difficulties of the Sahara Marathon.</span></p><p><span style=\"color:#192B3B\">b  how long the Sahara Marathon is.</span></p><p><span style=\"color:#192B3B\">5  Sepak takraw is often played by …</span></p><p><span style=\"color:#192B3B\">a  volleyball teams.</span></p><p><span style=\"color:#192B3B\">b  schoolchildren.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1 This report is mainly about unusual sports and … a where people do them. b how people do them.</span><br><span style=\"color:#192B3B\">Answer: </span><span style=\"font-weight:700;color:#C00000\">b — how people do them.</span></p><p><span style=\"color:#192B3B\">Amina explains the activities, equipment and rules.</span></p><p><span style=\"color:#192B3B\">2 Some of these sports combine … a team and individual sports. b different sports activities and equipment.</span><br><span style=\"color:#192B3B\">Answer: </span><span style=\"font-weight:700;color:#C00000\">b — different sports activities and equipment.</span></p><p><span style=\"color:#192B3B\">Chess boxing combines chess and boxing; urban golf uses tennis balls.</span></p><p><span style=\"color:#192B3B\">3 The speaker talks about … a how to become a champion in each sport. b what intelligent players do in some sports.</span><br><span style=\"color:#192B3B\">Answer: </span><span style=\"font-weight:700;color:#C00000\">b — what intelligent players do in some sports.</span></p><p><span style=\"color:#192B3B\">Chess players think carefully; urban golfers avoid hitting too hard.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">4 The speaker doesn’t discuss … a the difficulties of the Sahara Marathon. b how long the Sahara Marathon is.</span><br><span style=\"color:#192B3B\">Answer: </span><span style=\"font-weight:700;color:#C00000\">a — the difficulties of the Sahara Marathon.</span></p><p><span style=\"color:#192B3B\">The presentation gives its duration and longest daily distance but does not describe specific difficulties.</span></p><p><span style=\"color:#192B3B\">5 Sepak takraw is often played by … a volleyball teams. b schoolchildren.</span><br><span style=\"color:#192B3B\">Answer: </span><span style=\"font-weight:700;color:#C00000\">b — schoolchildren.</span></p><p><span style=\"color:#192B3B\">The final paragraph says it is played in schools in many countries.</span></p></div>","sourceSlides":[50,51,52,53],"images":[],"sourceCode":"L1.7","material":false},{"id":"B2U05LS-S054","module":"LISTENING 1","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON DETAIL","slide":54,"bookPage":"108","trackIds":["PPT_d7d40bf5985e4eed"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">8  Listen again. Complete the student’s notes.</span></p></div><div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Unusual sports</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Notes</span></td></tr><tr><td><span style=\"color:#192B3B\">Chess</span></td><td><span style=\"color:#192B3B\">(1) __________ players need to think carefully.</span></td></tr><tr><td><span style=\"color:#192B3B\">Boxing</span></td><td><span style=\"color:#192B3B\">Strong boxers have to (2) __________ each other.</span></td></tr><tr><td><span style=\"color:#192B3B\">Two activities</span></td><td><span style=\"color:#192B3B\">First (3) __________, then (4) __________.</span></td></tr><tr><t div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Unusual sports</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Notes</span></td></tr><tr><td><span style=\"color:#192B3B\">Equipment</span></td><td><span style=\"color:#192B3B\">Use golf clubs and (5) </span><span style=\"font-weight:700;color:#C00000\">(soft) tennis</span><span style=\"color:#192B3B\"> balls.</span></td></tr><tr><td><span style=\"color:#192B3B\">Location</span></td><td><span style=\"color:#192B3B\">Play in the (6) </span><span style=\"font-weight:700;color:#C00000\">street</span><span style=\"color:#192B3B\">, not on a golf course.</span></td></tr><tr><td><span style=\"color:#192B3B\">Advantages</span></td><td><span style=\"color:#192B3B\">Don’t need to go anywhere special or need much (7) </span><span style=\"font-weight:700;color:#C00000\">money</span><span style=\"color:#192B3B\"> to play.</span></td></tr><tr><td><span style=\"color:#192B3B\">Disadvantage</span></td><td><span style=\"color:#192B3B\">Might (8) </span><span style=\"font-weight:700;color:#C00000\">break</span><span style=\"color:#192B3B\"> something if you hit the ball too hard.</span></td></tr></tbody></table></div></div><div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Unusual sports</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Notes</span></td></tr><tr><td><span style=\"color:#192B3B\">Duration</span></td><td><span style=\"color:#192B3B\">It happens over (9) </span><span style=\"font-weight:700;color:#C00000\">six</span><span style=\"color:#192B3B\"> days.</span></td></tr><tr><td><span style=\"color:#192B3B\">Longest day</span></td><td><span style=\"color:#192B3B\">92 kilometres.</span></td></tr><tr><td><span style=\"color:#192B3B\">Benefit</span></td><td><span style=\"color:#192B3B\">You can say you have won the (10) </span><span style=\"font-weight:700;color:#C00000\">hardest</span><span style=\"color:#192B3B\"> race in the world.</span></td></tr></tbody></table></div></div><div class=\"source-part\"><div class=\"table-scroll\"><table><tbody><tr><td><span style=\"font-weight:700;color:#FFFFFF\">Unusual sports</span></td><td><span style=\"font-weight:700;color:#FFFFFF\">Notes</span></td></tr><tr><td><span style=\"color:#192B3B\">Type of sport</span></td><td><span style=\"color:#192B3B\">A type of volleyball.</span></td></tr><tr><td><span style=\"color:#192B3B\">Equipment and body parts</span></td><td><span style=\"color:#192B3B\">Players use different balls and use (11) </span><span style=\"font-weight:700;color:#C00000\">feet</span><span style=\"color:#192B3B\">, knees, chest or (12) </span><span style=\"font-weight:700;color:#C00000\">head</span><span style=\"color:#192B3B\">.</span></td></tr><tr><td><span style=\"color:#192B3B\">Origin and popularity</span></td><td><span style=\"color:#192B3B\">Started in (13) </span><span style=\"font-weight:700;color:#C00000\">Malaysia</span><span style=\"color:#192B3B\">; popular in Southeast Asia, Thailand and Indonesia.</span></td></tr><tr><td><span style=\"color:#192B3B\">Benefit</span></td><td><span style=\"color:#192B3B\">Gets children to play sports because it is played in (14) </span><span style=\"font-weight:700;color:#C00000\">schools</span><span style=\"color:#192B3B\"> in many countries.</span></td></tr></tbody></table></div></div>","sourceSlides":[54,55,56,57,58,59,60,61,62],"images":[],"sourceCode":"L1.8","material":false},{"id":"B2U05LS-S067","module":"LISTENING 1","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON DETAIL","slide":67,"bookPage":"108","trackIds":["PPT_a5448c7ab9134941"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">9  Listen to some of the information from Listening 1. Cross out the mistake that the</span></p><p><span style=\"font-weight:700;color:#193C78\">speaker makes in each sentence below. Then write the correct word or words above</span></p><p><span style=\"font-weight:700;color:#193C78\">it.</span></p><p><span style=\"color:#192B3B\">1  In chess boxing, they begin with boxing and then switch.</span></p><p><span style=\"color:#192B3B\">2  The Sahara Marathon happens over a week in Morocco.</span></p><p><span style=\"color:#192B3B\">3  Sepak takraw began in Indonesia and is very popular.</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">1 In chess boxing, they begin with </span><span style=\"font-weight:700;color:#C00000\">chess</span><span style=\"color:#192B3B\"> and then switch.</span></p><p><span style=\"color:#192B3B\">Track 5.3 excerpt 1: “sorry, I mean chess”.</span></p><p><span style=\"color:#192B3B\">2 The Sahara Marathon happens over </span><span style=\"font-weight:700;color:#C00000\">six days</span><span style=\"color:#192B3B\"> in Morocco.</span></p><p><span style=\"color:#192B3B\">Track 5.3 excerpt 3: “or rather over six days”.</span></p><p><span style=\"color:#192B3B\">3 Sepak takraw began in </span><span style=\"font-weight:700;color:#C00000\">Malaysia</span><span style=\"color:#192B3B\"> and is very popular.</span></p><p><span style=\"color:#192B3B\">Track 5.3 excerpt 4: “no, not Indonesia”.</span></p></div>","sourceSlides":[67,68],"images":[],"sourceCode":"L1.9","material":false},{"id":"B2U05LS-S091","module":"LISTENING 2","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON OPINION","slide":91,"bookPage":"114","trackIds":["PPT_d03378d2ce6264fc"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">3  Listen to the discussion. Check your predictions in Exercise 2.</span></p><p><span style=\"color:#192B3B\">1  What bias does Ian, the fan, have?</span></p><p><span style=\"color:#192B3B\">2  What bias does Andre, the former sportsperson, have?</span></p></div>","answerHtml":"<div class=\"source-part\"><p><span style=\"color:#192B3B\">Exercise 2.1 Obviously, athletes should be able to take money from companies for support.</span><br><span style=\"font-weight:700;color:#C00000\">Andre.</span></p><p><span style=\"color:#192B3B\">As a former athlete, he sees financial support as a way to pay for training.</span></p><p><span style=\"color:#192B3B\">Exercise 2.2 Actually, seeing adverts everywhere at the Olympics is quite annoying.</span><br><span style=\"font-weight:700;color:#C00000\">Ian.</span></p><p><span style=\"color:#192B3B\">As a fan, he dislikes the amount of advertising around sports.</span></p><p><span style=\"color:#192B3B\">Exercise 3.1 What bias does Ian, the fan, have?</span><br><span style=\"color:#192B3B\">He is </span><span style=\"font-weight:700;color:#C00000\">biased against companies paying athletes</span><span style=\"color:#192B3B\"> because he is a sports fan.</span></p><p><span style=\"color:#192B3B\">He feels that money and advertising take something away from competitions.</span></p></div><div class=\"source-part\"><p><span style=\"color:#192B3B\">Exercise 3.2 What bias does Andre, the former sportsperson, have?</span><br><span style=\"color:#192B3B\">He is </span><span style=\"font-weight:700;color:#C00000\">biased in favour of companies paying athletes</span><span style=\"color:#192B3B\"> because he has been a sportsperson.</span></p><p><span style=\"color:#192B3B\">He stresses athletes’ training costs and opportunities to compete.</span></p></div>","sourceSlides":[91,92,93],"images":[],"sourceCode":"L2.3","material":false},{"id":"B2U05LS-S094","module":"LISTENING 2","title":"WHILE LISTENING","subtitle":"TAKING NOTES ON OPINION","slide":94,"bookPage":"114","trackIds":["PPT_d03378d2ce6264fc"],"start":0,"questionHtml":"<div class=\"source-part\"><p><span style=\"font-weight:700;color:#193C78\">4  Listen again. Complete the student’s notes.</span></p><p><span style=\"color:#192B3B\">Athletes should be able to take money from companies to help with their training.</span></p></div><div class=\"source-part\"><di
