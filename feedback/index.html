<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课堂反馈 | UNLOCK</title>
  <link rel="stylesheet" href="../assets/theme.css?v=20261120-black-white">
  <link rel="stylesheet" href="classroom-feedback-6d5900a42337c720.css">
  <script defer src="../practice/students.js?v=20261120-portraits"></script>
  <script defer src="../assets/session.js?v=e211f3deae4b33a7"></script>
  <script defer src="classroom-feedback-41cbfc4279f5a8af.js"></script>
</head>
<body>
  <div id="feedback-page" hidden>
    <header class="feedback-header">
      <div class="feedback-header-inner">
        <div class="feedback-brand"><strong>UNLOCK</strong><span>教师工作区</span></div>
        <nav class="feedback-nav" aria-label="教师端导航">
          <a href="../index.html">返回工作区</a>
          <button type="button" id="feedback-sign-out">退出登录</button>
        </nav>
      </div>
    </header>
    <main class="feedback-main">
      <h1>课堂反馈</h1>
      <form id="feedback-form" novalidate>
        <div class="feedback-setup">
          <fieldset class="feedback-session">
            <legend>默认课次信息</legend>
            <div class="feedback-lesson-meta">
              <label class="feedback-field">日期
                <input id="feedback-date" type="date">
              </label>
              <label class="feedback-field">教学周
                <input id="feedback-week" type="number" inputmode="numeric" min="1" step="1">
              </label>
            </div>
            <p class="feedback-field-hint">各科可沿用默认日期和教学周，也可单独设置。</p>
          </fieldset>
          <fieldset class="feedback-session">
            <legend>学生名单</legend>
            <div class="feedback-roster">
              <select id="feedback-roster" aria-label="从名单选择学生">
                <option value="">请选择学生</option>
              </select>
              <button type="button" id="feedback-add" class="feedback-button feedback-primary" disabled>添加学生</button>
            </div>
            <p id="feedback-roster-count" class="feedback-field-hint" role="status">已添加 0 名学生</p>
          </fieldset>
        </div>
        <section class="feedback-class" aria-label="学生反馈">
          <div id="feedback-removal" class="feedback-removal" hidden>
            <p id="feedback-removal-message" role="status"></p>
            <button type="button" id="feedback-undo" class="feedback-button">撤销移除</button>
          </div>
          <div id="feedback-students" class="feedback-students"></div>
        </section>
        <div class="feedback-actions">
          <button type="submit" id="feedback-export" class="feedback-button feedback-primary"
            aria-haspopup="dialog" aria-controls="feedback-review" disabled>导出 PDF</button>
          <p id="feedback-export-status" role="status" hidden></p>
        </div>
      </form>
      <dialog id="feedback-review" class="feedback-review" aria-labelledby="feedback-review-title">
        <form id="feedback-review-form" class="feedback-review-form">
          <header class="feedback-review-header">
            <h2 id="feedback-review-title">导出 PDF</h2>
            <label class="feedback-field" for="feedback-export-scope">导出范围
              <select id="feedback-export-scope" required autofocus>
                <option value="" selected disabled>请选择导出范围</option>
              </select>
            </label>
          </header>
          <div id="feedback-review-body" class="feedback-review-body" hidden>
            <section id="feedback-absence-review" class="feedback-review-section" aria-labelledby="feedback-absence-title" hidden>
              <h3 id="feedback-absence-title">未到课或请假</h3>
              <p id="feedback-absence-help" hidden>请核对以下评语，勾选确认后继续导出。</p>
              <ul id="feedback-absence-list" class="feedback-absence-list"></ul>
            </section>
            <section id="feedback-review-pending" class="feedback-review-section" aria-labelledby="feedback-pending-title" hidden>
              <h3 id="feedback-pending-title">待评或未填写</h3>
              <p>核对后，可以按当前内容导出。</p>
              <ul id="feedback-review-list" class="feedback-review-list"></ul>
            </section>
          </div>
          <footer class="feedback-review-footer">
            <p>在打印窗口选择「另存为 PDF」。</p>
            <div class="feedback-review-actions">
              <button type="button" id="feedback-review-back" class="feedback-button">返回填写</button>
              <button type="submit" id="feedback-review-export" class="feedback-button feedback-primary" disabled>继续导出 PDF</button>
            </div>
          </footer>
        </form>
      </dialog>
    </main>
  </div>
  <article id="feedback-paper"></article>
</body>
</html>
