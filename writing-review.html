<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生平台写作复盘</title>
  <link rel="stylesheet" href="writing-review.css?v=assessment-3">
  <script src="writing-review-gate.js?v=20261116-4" defer></script>
  <style>
    #writing-review-content[hidden],#writing-entry[hidden]{display:none!important}
    .writing-entry {padding-top:32px}
    .writing-entry h1 {font-size:clamp(28px,4vw,38px);margin:0 0 14px}
    .writing-password-form {max-width:600px;background:#f5f5f7;border-radius:22px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
    .writing-password-form label {grid-column:1/-1;font-weight:600}
    .writing-password-form input {width:100%;min-height:44px;padding:9px 12px;font:inherit;border:1px solid #d2d2d7;background:#fff;color:#1d1d1f;border-radius:9px}
    .writing-password-form button {border:0;background:#0071e3;color:#fff;min-height:44px;padding:9px 18px;border-radius:22px;font:inherit;cursor:pointer}
    .writing-password-form :is(input,button):focus-visible {outline:3px solid #0071e3;outline-offset:3px}
    .writing-password-form button:disabled {opacity:.55}
    #writing-entry-message {grid-column:1/-1;font-size:14px;margin:0;color:#983344}
    #writing-entry-message:empty {display:none}
    @media(max-width:480px){.writing-password-form{grid-template-columns:1fr;padding:18px}.writing-password-form button{justify-self:start}}
  </style>
</head>
<body>
  <header class="site-header">
    <div><a href="index.html">学生平台</a><span>Student Platform</span></div>
  </header>
  <main class="page writing-entry" id="writing-entry">
    <h1>写作复盘</h1>
    <form class="writing-password-form" id="writing-password-form">
      <label for="writing-password">请输入访问密码</label>
      <input id="writing-password" type="password" required autocomplete="current-password">
      <button type="submit">进入复盘</button>
      <p id="writing-entry-message" role="status"></p>
    </form>
    <noscript>请启用 JavaScript 后验证密码。</noscript>
  </main>
  <main class="page" id="writing-review-content" hidden>
    <section class="hero">
      <p class="kicker">IELTS Academic Writing</p>
      <h1 id="writing-review-title" tabindex="-1">写作复盘</h1>
      <p>从原文批注回看思路和表达，找出下一稿要练的地方。</p>
    </section>
    <nav class="sample-list" aria-label="写作复盘样例">
      <button type="button" data-sample="task1" aria-pressed="true"><span>Task 1 图表写作</span><strong>通勤方式与通勤时间</strong></button>
      <button type="button" data-sample="task2" aria-pressed="false"><span>Task 2 议论文</span><strong>公共交通与道路投入</strong></button>
    </nav>
    <article class="review" aria-labelledby="task-title">
      <header class="task-header">
        <div><p class="kicker" id="task-label"></p><h2 id="task-title"></h2></div>
        <span class="sample-tag">自制样例</span>
      </header>
      <details id="task-material" class="material" open>
        <summary id="material-title">题目与图表</summary>
        <div id="task-prompt" lang="en"></div>
        <div id="task-figures" class="figures"></div>
      </details>
      <div class="view-tabs" role="tablist" aria-label="复盘内容">
        <button type="button" id="tab-source" role="tab" data-view="source" aria-selected="true" aria-controls="panel-source">原文批改</button>
        <button type="button" id="tab-thought" role="tab" data-view="thought" aria-selected="false" aria-controls="panel-thought" tabindex="-1">思维复盘</button>
        <button type="button" id="tab-language" role="tab" data-view="language" aria-selected="false" aria-controls="panel-language" tabindex="-1">表达讲评</button>
        <button type="button" id="tab-summary" role="tab" data-view="summary" aria-selected="false" aria-controls="panel-summary" tabindex="-1">本次小结</button>
      </div>
      <section id="panel-source" role="tabpanel" aria-labelledby="tab-source"></section>
      <section id="panel-thought" role="tabpanel" aria-labelledby="tab-thought" hidden></section>
      <section id="panel-language" role="tabpanel" aria-labelledby="tab-language" hidden></section>
      <section id="panel-summary" role="tabpanel" aria-labelledby="tab-summary" hidden></section>
      <p id="review-status" class="sr-only" aria-live="polite"></p>
      <noscript>请启用 JavaScript 以查看样稿和批注。</noscript>
    </article>
  </main>
</body>
</html>
