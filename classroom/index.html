<head>

  <script defer src="../practice/recordings.js?v=20261120-work-package"></script>
  <script defer src="../practice/report.js?v=20261123-meaning-choice"></script>
  <script defer src="../assets/vendor/fflate-0.8.2.min.js"></script>

  <script defer src="../practice/dictation-playback.js?v=20261123-en-gb"></script>
  <script defer src="lesson-meanings.js?v=20261123-1"></script>
  <script defer src="meaning-choice.js?v=20261123-cumulative-dictation"></script>

  <script defer src="../assets/unlock-vocabulary/bank-patch-20261126.js"></script>
  <script defer src="../assets/vocabulary-patch-20261126.js"></script>
  <script defer src="../assets/vocabulary-syllable-drag-20261127.js"></script>

</head>
<body id="practice-surface" class="student-ui student-classroom">
  <header class="top">
    <div class="top-inner">
      <span class="brand ui-brand">UNLOCK</span>
      <span class="classroom-module ui-label"><span class="ui-en" lang="en">Classroom</span><small class="ui-zh" lang="zh-CN">单元课堂</small></span>
      <nav id="account" class="account ui-site-nav" aria-label="Platform navigation 平台导航" hidden>
        <span id="student-name"></span>
        <a class="ui-nav" href="../index.html"><span class="ui-label"><span class="ui-en" lang="en">Workspace</span><small class="ui-zh" lang="zh-CN">返回工作区</small></span></a>
        <button id="classroom-sign-out" class="ui-nav" type="button"><span class="ui-label"><span class="ui-en" lang="en">Sign Out</span><small class="ui-zh" lang="zh-CN">退出登录</small></span></button>
      </nav>
    </div>
  </header>
  <main>
    <section class="intro">
      <h1 class="ui-page-title"><span class="ui-label"><span class="ui-en" lang="en">Classroom</span><small class="ui-zh" lang="zh-CN">单元课堂</small></span></h1>
    </section>
    <div id="classwork" hidden>
      <section id="picker" class="card picker" aria-label="选择单元">
        <form id="unit-form">
          <div class="dictation-filters">
            <label class="dictation-select" for="book-select">
              <span class="ui-label"><span class="ui-en" lang="en">Book</span><small class="ui-zh" lang="zh-CN">册次</small></span>
              <select id="book-select">
                <option value="1">Book 1</option><option value="2">Book 2</option>
                <option value="3">Book 3</option><option value="4">Book 4</option><option value="5">Book 5</option>
              </select>
            </label>
              <label class="dictation-select" for="vocabulary-mode">
                <span class="ui-label"><span class="ui-en" lang="en">Practice</span><small class="ui-zh" lang="zh-CN">练习场景</small></span>
                <select id="vocabulary-mode">
                  <option value="preclass">课前词汇学练</option>
                  <option value="classroom">课堂词汇练习</option>
                </select>
              </label>
              <label class="dictation-select" for="track-select">
                <span class="ui-label"><span class="ui-en" lang="en">Track</span><small class="ui-zh" lang="zh-CN">分册</small></span>
                <select id="track-select">
                  <option value="LS">LS 听说</option>
                  <option value="RW">RW 读写</option>
                </select>
              </label>
              <label class="dictation-select" id="week-filter" for="week-select" hidden>
                <span class="ui-label"><span class="ui-en" lang="en">Week</span><small class="ui-zh" lang="zh-CN">单元周次</small></span>
                <select id="week-select">
                  <option value="1">Week 1 第 1 周</option>
                  <option value="2">Week 2 第 2 周</option>
                </select>
              </label>
              <label class="dictation-select" for="lesson-select">
                <span class="ui-label"><span class="ui-en" lang="en">Lesson</span><small class="ui-zh" lang="zh-CN">课次</small></span>
                <select id="lesson-select">
                  <option value="1">Lesson 1 第 1 节</option>
                  <option value="2">Lesson 2 第 2 节</option>
                </select>
              </label>
          </div>
          <fieldset class="unit-select-field">
            <legend><span class="ui-label"><span class="ui-en" lang="en">Units</span><small class="ui-zh" lang="zh-CN">单元</small></span></legend>
            <div id="unit-options" class="unit-options"></div>
          </fieldset>
          <div class="unit-preview">
            <h2 id="unit-preview-title"></h2>
            <h3 id="picker-practice-title"><span class="ui-label"><span class="ui-en" lang="en">Pre-Class Dictation</span><small class="ui-zh" lang="zh-CN">课前听写</small></span></h3>
            <p id="unit-word-count" class="muted" role="status"></p>
            <div class="unit-launch-actions">
              <button class="primary ui-action ui-primary" type="submit"><span class="ui-label"><span class="ui-en" lang="en">Start Dictation</span><small class="ui-zh" lang="zh-CN">开始听写</small></span></button>
              <label id="preclass-autoplay-setting" class="preclass-autoplay" hidden>
                <input id="preclass-autoplay" type="checkbox">
                <span class="ui-label"><span class="ui-en" lang="en">Play audio automatically</span><small class="ui-zh" lang="zh-CN">自动播放音频</small></span>
              </label>
            </div>
          </div>
        </form>
        <p id="availability" class="notice" role="status"></p>
      </section>
      <section id="practice" class="card worksheet" hidden aria-labelledby="phase-title">
        <header class="classroom-worksheet-head">
          <div class="classroom-worksheet-location">
            <button id="back-units" type="button" class="ui-nav ui-back back-units" aria-label="Back to the Classroom unit list 返回单元课堂目录"><span class="ui-label"><span class="ui-en" lang="en">Back</span><small class="ui-zh" lang="zh-CN">返回上一级</small></span></button>
            <p id="set-title" class="eyebrow"></p>
            <p id="set-lesson" class="eyebrow"></p>
          </div>
          <div class="classroom-worksheet-title">
            <h2 id="phase-title" tabindex="-1"></h2>
            <p id="classroom-word-position" role="status" hidden></p>
          </div>
        </header>
        <p id="directions" class="muted directions"></p>
        <div id="classroom-report" hidden></div>
        <div id="preclass-panel" hidden></div>
        <div id="classroom-word-panel" class="word-dictation" hidden></div>
        <div id="legacy-unit-attempt" hidden>
          <div class="attempt-toolbar">
            <section id="dictation-dock" aria-label="整组听写录音" hidden>
              <audio preload="metadata" hidden></audio>
              <button type="button" class="primary ui-action" data-dictation-start><span class="ui-label"><span class="ui-en" lang="en">Play Dictation</span><small class="ui-zh" lang="zh-CN">播放听写</small></span></button>
              <p data-dictation-status class="muted" role="status"></p>
              <progress max="1" value="0" aria-label="听写播放进度" hidden></progress>
            </section>
            <div class="attempt-actions">
              <p id="progress" class="muted"></p>
              <button id="toggle-correct" type="button" class="text-button" hidden><span class="ui-label"><span class="ui-en" lang="en">Show All</span><small class="ui-zh" lang="zh-CN">查看全部题目</small></span></button>
              <button id="submit" type="button" class="primary ui-action ui-primary"><span class="ui-label"><span class="ui-en" lang="en">Submit</span><small class="ui-zh" lang="zh-CN">首次提交</small></span></button>
            </div>
          </div>
          <ol id="answer-list" class="answer-list" aria-label="听写题目"></ol>
        </div>
        <p id="save-status" class="notice" role="status"></p>
      </section>
    </div>
    <noscript><p class="card"><span class="ui-label"><span class="ui-en" lang="en">Enable JavaScript to start dictation.</span><small class="ui-zh" lang="zh-CN">请启用浏览器脚本后再使用课前听写。</small></span></p></noscript>
  </main>
  <dialog id="dictation-countdown" class="unit-dialog countdown" aria-label="听写倒计时"
      aria-describedby="dictation-countdown-message">
    <p class="countdown-number" role="timer" aria-label="剩余秒数" data-countdown-number>5</p>
    <p id="dictation-countdown-message"><span class="ui-label"><span class="ui-en" lang="en">The recording will start after the countdown.</span><small class="ui-zh" lang="zh-CN">倒计时结束后开始播放整组听写。</small></span></p>
  </dialog>
  <dialog id="submit-confirm" class="unit-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title"><span class="ui-label"><span class="ui-en" lang="en">Submit First Attempt?</span><small class="ui-zh" lang="zh-CN">确认首次提交</small></span></h2>
    <p id="submit-message"></p>
    <form method="dialog" class="dialog-actions">
      <button type="submit" class="secondary ui-action" autofocus><span class="ui-label"><span class="ui-en" lang="en">Keep Working</span><small class="ui-zh" lang="zh-CN">返回作答</small></span></button>
      <button id="confirm-first" type="button" class="primary ui-action ui-primary"><span class="ui-label"><span class="ui-en" lang="en">Submit</span><small class="ui-zh" lang="zh-CN">提交当前作答</small></span></button>
    </form>
  </dialog>
</body>
</html>
