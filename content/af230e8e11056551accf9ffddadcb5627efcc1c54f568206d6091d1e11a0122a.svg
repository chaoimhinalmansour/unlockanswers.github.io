  <line class="bridge" x1="902" y1="482" x2="902" y2="538"/><line class="bridge" x1="916" y1="482" x2="916" y2="538"/>

  <!-- Student response list -->
  <text class="question" x="70" y="780">1  the train station</text><line class="blank" x1="275" y1="786" x2="340" y2="786"/>
  <text class="question" x="70" y="825">2  the gym</text><line class="blank" x1="205" y1="831" x2="270" y2="831"/>
  <text class="question" x="70" y="870">3  the bus station</text><line class="blank" x1="250" y1="876" x2="315" y2="876"/>
