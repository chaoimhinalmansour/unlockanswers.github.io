<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">University of Beta school-adapted Student A map</title>
  <desc id="desc">A school-redrawn campus map for B01-LS-U04 page 99 Exercise 6. Five target locations are marked A to E. This is not official corrected artwork.</desc>
  <style>
    .page{fill:#fffdf7}.banner{fill:#fff0c9;stroke:#b36b00;stroke-width:2}.bannerText{font:700 20px Arial,sans-serif;fill:#743f00}.title{font:700 36px Arial,sans-serif;fill:#153a63}.sub{font:18px Arial,sans-serif;fill:#34495e}.road{stroke:#d7dde3;stroke-width:42;stroke-linecap:square}.roadEdge{stroke:#7c8792;stroke-width:2;fill:none}.roadName{font:700 15px Arial,sans-serif;fill:#47515a}.building{fill:#eadfbd;stroke:#655b46;stroke-width:3}.service{fill:#d7e7ef;stroke:#526d7b;stroke-width:3}.park{fill:#a7d57d;stroke:#4d8b3e;stroke-width:3}.tree{fill:#4e9a45;stroke:#2e6b2f;stroke-width:2}.label{font:700 17px Arial,sans-serif;fill:#2d2d2d;text-anchor:middle}.small{font:15px Arial,sans-serif;fill:#2d2d2d;text-anchor:middle}.marker{fill:#f7c600;stroke:#493900;stroke-width:4}.markerText{font:700 30px Arial,sans-serif;fill:#1f2f3f;text-anchor:middle;dominant-baseline:middle}.start{fill:#c33446;stroke:#7c1420;stroke-width:3}.startText{font:700 17px Arial,sans-serif;fill:#8b1421;text-anchor:middle}.question{font:21px Arial,sans-serif;fill:#222}.blank{stroke:#222;stroke-width:2}.note{font:15px Arial,sans-serif;fill:#6b4b00}.bridge{stroke:#333;stroke-width:9}.path{stroke:#eee4ba;stroke-width:18;fill:none;stroke-linecap:round}
  </style>
