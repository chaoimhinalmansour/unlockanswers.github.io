<body class="student-ui student-practice vocabulary-homework" hidden>
  <header class="masthead"><div class="masthead-inner">
    <div class="brandline"><span class="ui-brand">UNLOCK</span><span>Homework 词汇学练</span></div>
    <nav class="site-links ui-site-nav" aria-label="学习端导航">
      <a class="ui-nav" href="index.html">返回单元练习</a>
    </nav>
  </div></header>
  <main class="site-main">
    <section class="catalog" id="vocabulary-homework-picker" aria-labelledby="vocabulary-homework-heading">
      <h1 class="ui-page-title" id="vocabulary-homework-heading">五册词汇作业</h1>
      <form id="vocabulary-homework-form">
        <label>教材<select name="book"></select></label>
        <label>单元<select name="unit"></select></label>
        <label>科目<select name="subject">
          <option value="L">Listening 听力</option><option value="S">Speaking 口语</option>

          <option value="1">H1</option><option value="2">H2</option><option value="3">H3</option>
        </select></label>
        <button type="submit" class="button ui-action ui-primary">打开词汇学练</button>

      <p id="vocabulary-homework-preview" class="muted"></p>
    </section>
    <section id="vocabulary-homework-work" hidden>
      <header class="standalone-vocabulary-header">
        <button type="button" id="vocabulary-homework-back" class="ui-nav">返回词汇作业</button>
        <h1 id="vocabulary-homework-title" tabindex="-1"></h1>
        <p id="vocabulary-homework-progress" aria-live="polite"></p>
      </header>
      <p id="vocabulary-homework-status" role="status"></p>
      <div id="vocabulary-homework-panel"></div>
      <div id="vocabulary-homework-download" hidden></div>
